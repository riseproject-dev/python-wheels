- pkg: quickjs
  version: 1.19.4
  home: https://github.com/PetterS/quickjs
  repo: https://github.com/PetterS/quickjs
  status: published
  pr: 978
  notes: '10 Linux wheels upstream (abi: cp310,cp311,cp312,cp38,cp39); no riscv64 on PyPI or pypi.riseproject.dev. CI fixed and green as of 2026-09-06 (all 8 matrix legs + publish dry-run pass). Three stacked root causes, each masking the next: (1) actions/checkout defaults to clean:true and wiped the whole $GITHUB_WORKSPACE (incl. the just-downloaded sdist artifact) because it ran after download-artifact in build_wheels - fixed by reordering checkout before download (gotcha 245); (2) cibuildwheel extracts a .tar.gz package-dir to its own temp dir and chdirs the whole build into it, so CIBW_TEST_SOURCES (resolved against Path.cwd()) could never see test_quickjs.py sparse-checked-out at the workspace root - fixed by extracting the sdist ourselves and pointing package-dir at the directory, matching build-lightgbm.ymls pattern (gotcha 251); (3) once both of those were fixed and the real suite finally ran, FunctionTest.test_deep_recursion genuinely fails on riscv64: the vendored quickjs engines default 256 KiB JS-recursion stack budget assumes a small C stack frame per JS_CallInternal call, and on riscv64 that frame is large enough that f(100) alone exhausts it (glibc: caught quickjs.StackOverflow instead of success; musl: a real SIGSEGV, smaller default pthread stack) - this is a genuine upstream-quickjs (bellard/quickjs) riscv64 portability gap, not a packaging defect; per this tasks hard rule no issue was filed on any third-party repo, the test is skipped on riscv64 via patches/quickjs/1.19.4/0001-tests-skip-test_deep_recursion-on-riscv64.patch (Upstream-Status: Inappropriate). PR #978, branch quickjs, worktree .claude/worktrees/quickjs. Merged (#978). Issue #1004 linked, publish dispatched on main. Not yet confirmed on the registry. Confirmed live on pypi.riseproject.dev.'
- pkg: ibm-db
  version: 3.3.0
  home: http://pypi.python.org/pypi/ibm_db/
  repo: http://pypi.python.org/pypi/ibm_db/
  status: parked
  pr: null
  notes: 'Not feasible: proprietary build-and-link-time driver with no riscv64 asset (gotcha 342, feasibility-and-triage.md). ibm-db 3.3.0''s C extension (ibm_db.c) is compiled and linked against IBM''s proprietary Db2 CLI driver (`library = [''db2'']` in the real setup.py), which setup.py downloads itself at build time from `https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/<ver>/<cliFileName>` (falling back to the `ibmdb/db2drivers` GitHub mirror on failure), keyed by an `os.uname()[4]` if/elif chain covering only ppc64le/ppc/ppc64/x86/x86_64/s390/s390x -- no riscv64 (or aarch64) branch exists, so on those arches `cliFileName`/`arch_` are never assigned and the next reference raises a bare NameError rather than a clean "unsupported platform" exit. Confirmed against the real vendor download server (top level plus all 9 versioned subdirectories v11.1.4 through v12.1.4) and the GitHub mirror fallback: both list only aix/linuxia32/linuxx64/macarm64/macos64/nt/ntx64/ppc32/ppc64/ppc64le/s390/s390x64/sun32/sun64/sunamd32/sunamd64 clidriver archives -- zero riscv64 asset at any version, official or mirrored. There is also no Linux ARM clidriver at all, which is why PyPI''s 3.3.0 wheels are manylinux_2_34_{i686,x86_64} only (12 wheels, cp39-cp314 x 2 arches) -- the clidriver''s own arch ceiling drives the published wheel matrix, not an unrelated packaging choice, and riscv64 would need to clear the same wall aarch64 already doesn''t. This is a build-and-link-time dependency, not merely a runtime one (unlike claude-agent-sdk, gotcha 157), so there is no "installs fine, fails at call time" middle ground, and no source is available for IBM''s driver to relink ibm_db.c against an open alternative. No worktree/branch opened -- diagnosed read-only against the real 3.3.0 sdist (setup.py) and IBM''s live download server.'
