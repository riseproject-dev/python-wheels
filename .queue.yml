- pkg: mssql-python
  version: 1.13.0
  home: https://github.com/microsoft/mssql-python
  repo: https://github.com/microsoft/mssql-python
  status: parked
  pr: null
  notes: 'Not feasible: hard runtime dependency on mssql-python-odbc==18.6.2.1 (pinned exactly, unconditional Requires-Dist for every platform), the same proprietary Microsoft ODBC driver repackage already parked above -- no riscv64 build exists and there is no source to compile one (gotcha 342 shape, feasibility-and-triage.md). Confirmed by downloading and unzipping the real manylinux_2_28_cp312 1.13.0 wheel rather than assuming from the name: it ships two native extensions. (1) mssql_python/ddbc_bindings.cp312-arm64.so is the pybind11 C++ layer that connection.py, cursor.py, helpers.py and pooling.py all call for every single operation (connect, execute, fetchone/many/all, pooling) -- `strings` on it shows the literal filename `libmsodbcsql-18.6.so.2.1` plus `LoadDriverLibrary: dlopen failed for path=%s` and `msodbcsql driver api bindings for Python`, i.e. it dlopen()s Microsoft''s proprietary driver .so at runtime rather than linking it at build time (no NEEDED entry for it), and connection.py:910 hardcodes `Driver=ODBC Driver 18 for SQL Server` with no way to point it at an alternative/open driver. (2) mssql_py_core/mssql_py_core.*.so is a separate, newer Rust extension (strings reveal `/workspace/mssql-tds/src/security/unix/gssapi_ffi.rs`, i.e. built from an mssql-tds crate that reimplements TDS itself, no msodbcsql dlopen, only libssl/libcrypto/libc) but cursor.py only wires it in for the optional bulkcopy()/bulkcopy_arrow() bulk-insert path (`_bulkcopy_core_and_validate`), not as a general Connection/Cursor backend -- it cannot stand in for ddbc_bindings without a from-scratch rewrite of the entire driver, which is out of scope for a wheel port (goal 2: mirror upstream, do not fork its architecture). ddbc_bindings.py''s own architecture map also raises ImportError for any arch other than x86_64/arm64 on Linux, with no riscv64 branch. Even setting that aside and recompiling ddbc_bindings'' MIT-licensed source for riscv64 (legally fine, since it only dlopens the driver at runtime), the wheel would be non-functional out of the box: pip cannot resolve the hard-pinned mssql-python-odbc==18.6.2.1 dependency on riscv64 (no wheel, no buildable source -- see that package''s own parked entry, which cites Microsoft''s install docs explicitly rejecting riscv64 for every msodbcsql version 11-18), and every SQL operation would fail at runtime with no driver .so to dlopen. Same root cause and same wait-on-upstream verdict as mssql-python-odbc: Microsoft does not ship, and has not open-sourced, the ODBC driver this package''s core native layer requires. No worktree/branch opened -- diagnosed read-only against the real 1.13.0 wheel contents (manylinux_2_28_cp312 aarch64), its METADATA, and its Python/native source.'
