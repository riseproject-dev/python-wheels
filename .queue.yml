- pkg: moyopy
  version: 0.18.0
  home: https://github.com/spglib/moyo
  repo: https://github.com/spglib/moyo
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/1062
  notes: Upstream repo is spglib/moyo, a Cargo workspace (moyo/moyoc/moyopy/moyo-wasm members); moyopy is the PyO3 binding member, pyo3 abi3-py310 unconditional feature (build on cp310 per gotcha 96, retest cp311-cp314; separate cp314t build, no cp313t per gotcha 204). Pure-Rust core (nalgebra, no BLAS/C deps). Upstream ships no licence text in its own wheel (maturin globs LICEN[CS]E* relative to moyopy/, licences live at repo root) - staged both into moyopy/ before build, same fix as build-primp.yml. Test-only deps pymatgen/ase are pure-Python (py3-none-any); numpy needed from pypi.riseproject.dev for riscv64. cp310-abi3 leg failed CI - pymatgen (sdist-only, no riscv64 wheel, correctly so) pulls in scipy/numpy/pandas/orjson as runtime deps, all of which our registry ships, but PIP_EXTRA_INDEX_URL alone let pip pick PyPI's newer sdist-only releases over the registry's riscv64 wheels, and scipy's meson build then failed on missing OpenBLAS. Fixed by adding PIP_ONLY_BINARY=numpy,scipy,pandas,orjson to CIBW_ENVIRONMENT_LINUX (gotcha 291). Next cp310-abi3 run failed again the same way one hop further down the tree - pymatgen-core (pymatgen's actual base package) depends directly on matplotlib and spglib, and matplotlib drags in contourpy/kiwisolver/pillow; none of those five has a riscv64 wheel on public PyPI's newest release but all do on our registry, and pillow's sdist build failed on missing libjpeg headers. Read pymatgen-core's requires_dist up front this time and added all five in one pass, extending PIP_ONLY_BINARY to numpy,scipy,pandas,orjson,pillow,matplotlib,contourpy,kiwisolver,spglib (gotcha 291 addendum). That fix regressed cp310-abi3 a third time, differently - build-spglib.yml's own matrix only publishes cp312+ riscv64 wheels, so forcing spglib wheel-only left cp310/cp311 test venvs with zero installable candidates; pip's resolver responded by backtracking through pymatgen's entire release history (~200 sdists, 2025.10.7 down to the pre-CalVer 4.x series) hunting for a version without a spglib dependency, burning the full 85-minute job before hard-crashing on pymatgen 4.4.11's ancient numpy-distutils setup.py (AttributeError on __NUMPY_SETUP__, an unrelated __builtins__-is-a-dict-under-exec() bug in that release, not a numpy-version incompatibility). Fixed by dropping spglib from PIP_ONLY_BINARY entirely rather than pinning pymatgen or narrowing the matrix - our registry's spglib (2.7.0) doesn't lag PyPI's today, so leaving it unpinned still prefers our wheel where one exists (cp312+) and falls back to building the sdist where it doesn't (cp310/cp311); confirmed safe since spglib's build-time tools (cmake/ninja) ship interpreter-agnostic py3-none wheels on the registry and build-spglib.yml needs no before-build step (gotcha 291 second addendum). Pushed fix; re-running both legs.
