  pr: null
  notes: 'Not feasible today (gotcha 40 shape, feasibility-and-triage.md: dependency-blocked, not package-blocked). Lives at addons/torch_c_dlpack_ext/ in apache/tvm-ffi; upstream builds it via .github/workflows/torch_c_dlpack.yml + build_aot_wheels.sh. torch itself is NOT the blocker: pypi.riseproject.dev already serves torch 2.13.0+cpu and 2.14.0+cpu for cp312/cp313/cp314/cp314t riscv64. The real blocker is one level down: the wheel bundles one prebuilt .so per supported torch major.minor (named libtorch_c_dlpack_addon_torch{MM}-{cpu,cuda}.so) and its custom build_backend.py, whenever an .so is not already prebuilt, requires apache-tvm-ffi>=0.1.1 and shells out to `python -m tvm_ffi.utils._build_optional_torch_c_dlpack` to compile one via torch.utils.cpp_extension+ninja. That helper cannot even be invoked without a working apache-tvm-ffi install, because tvm_ffi/__init__.py unconditionally ctypes-loads its own compiled native core (libinfo.load_lib_ctypes) on import. apache-tvm-ffi publishes wheels for cp39-cp314(t) on manylinux aarch64/x86_64 + macOS + Windows only -- no riscv64 wheel on PyPI, and none on pypi.riseproject.dev. Its native core is a ~10k-line CMake/C++ build (src/ffi, vendored 3rdparty/dlpack, optional libbacktrace) that has never targeted riscv64; porting it would be a full separate package port, out of scope here. Separately, upstream also builds CUDA variants of each .so via an installed CUDA toolkit, which would not apply to riscv64 (CPU-only) but is moot given the earlier blocker. No worktree/branch/PR created.'
