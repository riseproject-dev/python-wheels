  version: 1.1.16
  home: https://docs.livekit.io
  repo: https://github.com/livekit/python-sdks/
  status: blocked-on-dependency
  pr: null
  notes: '2 Linux wheels upstream (abi: py3); no riscv64 on PyPI or pypi.riseproject.dev. Blocked-on-dependency, same shape as gotcha 335''s deno_core/rusty_v8 case: the PyPI `livekit` package (the `livekit-rtc` dir of the `livekit/python-sdks` monorepo) is a plain-setuptools py3-none-manylinux wheel, not maturin/pyo3 - confirmed via its pyproject.toml `[tool.cibuildwheel] before-build = "pip install requests && python rust-sdks/download_ffi.py --output livekit/rtc/resources"`, which downloads a prebuilt `livekit-ffi` shared library from `livekit/rust-sdks` GitHub Releases instead of compiling anything locally; `download_ffi.py`''s own `--arch` choices are `[x86_64, arm64, armv7]`, no riscv64 option exists. That ffi library itself links `webrtc-sys`, whose `build.rs` downloads a prebuilt `libwebrtc.a` per `{target_os}-{target_arch}-release` triple from the same repo''s Releases (tag `webrtc-89d790b`, via `webrtc_sys_build::download_webrtc()`); `gh api repos/livekit/rust-sdks/releases/tags/webrtc-89d790b` lists assets for android-{arm,arm64,x64}, ios-{device,simulator}-arm64, linux-{arm64,x64}, mac-{arm64,x64}, win-{arm64,x64} only - no riscv64 asset anywhere. The `LK_CUSTOM_WEBRTC` escape hatch only relocates the problem: producing a riscv64 `libwebrtc.a` means running LiveKit''s own `.github/workflows/webrtc-builds.yml`, which drives depot_tools/gn/ninja against a Chromium-derived checkout (a `.gclient` `target_os` step) - a second, Chromium-scale build system whose own matrix (checked at the `rust-sdks` submodule pin `2d9f01ab1e`) covers only win/mac/linux/android/ios x {x64,arm64,arm}, never riscv64. Even a hand-built `libwebrtc.a` would not be enough on its own: `webrtc-sys/build.rs`''s Linux glue hardcodes exactly two architectures - `add_gio_headers()` panics "unsupported arch" for anything but arm64/x64, and `add_lazy_load_so()`''s prebuilt shim objects only exist under `src/lazy_load_deps_for/*/{x86_64-linux-gnu,aarch64-linux-gnu}/` - so riscv64 would also need new shim sources upstream has never shipped. Folded as gotcha 340 (feasibility-and-triage.md). No worktree/branch opened - fully diagnosed read-only via `gh api` against `livekit/python-sdks` and `livekit/rust-sdks` (submodule pin `2d9f01ab1e933a86a8a5c53805ee29ee58b9be1b`) plus the real GitHub Releases asset list, no checkout needed. Re-check if `webrtc-builds.yml` ever grows a riscv64 target, or LiveKit starts shipping a prebuilt riscv64 libwebrtc some other way.'
