  notes: 'CI green on PR #1728 across cp312/cp313/cp314/cp314t (385 passed, 14 skipped each). Two-stage CMake build mirroring upstream build_steps.sh (core lib via FetchContent of ccd/qhull/tinyxml2/tinyobjloader/lodepng/miniz, then pybind11 bindings against MUJOCO_PATH), driven directly in the manylinux_riscv64 image per-interpreter rather than cibuildwheel. Studio (Filament GUI, dear_imgui/implot) and OpenUSD dropped: Filament needs Vulkan/Metal tooling with no riscv64 story, USD is a separate heavy build; the classic GLFW viewer (mujoco.viewer) is kept, reusing the X11/Wayland dnf packages already validated by the glfw riscv64 port (build-glfw.yml). auditwheel excludes libmujoco.so.* (gotcha: auditwheel would otherwise graft a second, renamed copy into mujoco.libs/ for the plugin .so files only, splitting the process into two libmujoco instances and breaking the plugin registry). Root-caused and fixed 5 plugin-test failures (test_load_plugin, test_plugin, etc., all "XML Error: plugin ... not found"): mujoco/__init__.py extends its __path__ via pkgutil.extend_path, and running pytest from a cd-ed /mujoco/python let `python -m pytest` cwd-prepended sys.path resolve the checkout python/mujoco/ package ahead of the installed wheel - compiled extensions still worked via the merged path, but PLUGINS_DIR (derived from that shadowing __file__) pointed at a nonexistent python/mujoco/plugin/, so zero bundled plugins loaded. Fixed by running pytest from the repo root instead, matching upstream build_steps.sh test_python_bindings (which never cds into python/ for that step). Awaiting maintainer review/merge; not yet published.'
