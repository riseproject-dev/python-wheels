- pkg: ibmmq
  version: 2.1.0
  home: https://ibm.com/software/products/en/ibm-mq
  repo: https://ibm.com/software/products/en/ibm-mq
  status: parked
  pr: null
  notes: 'Not feasible: proprietary build-and-link-time MQ client SDK with no riscv64 asset (gotcha 342 shape, feasibility-and-triage.md). ibmmq 2.1.0''s C extension (code/ibmmq/ibmmqc.c) `#include`s <cmqc.h>/<cmqcfc.h>/<cmqxc.h> and setup.py links it against `libraries=[''mqm_r'']` found under /opt/mqm (or $MQ_FILE_PATH) -- these headers and the shared library come only from IBM''s proprietary "MQ Client and SDK" (Redistributable Client), which setup.py does not download itself but hard-requires: it raises FileNotFoundError before compiling if cmqc.h isn''t found (unless $CI is set, in which case compilation itself would fail without the header). Confirmed by disassembling the real manylinux_2_28_x86_64 wheel from PyPI: ibmmqc.abi3.so carries a DT_NEEDED entry on libmqm_r.so, i.e. the published wheel doesn''t vendor the client either -- it''s a runtime dependency on a system-installed proprietary library, on top of being a build-time one via the headers. IBM''s own docs (ibm.com/docs, Redistributable MQ Clients overview) list only Linux x86-64 and Windows x64 for the redistributable client, plus s390x/ppc64le for the MFT agent -- no RISC-V anywhere. Cross-checked against upstream''s own code/examples/Dockerfile, which enumerates every architecture it knows how to install the client on -- amd64 (curl from IBM''s redist server), arm64 (manual full server tarball dropped into MQINST/), ppc64le/s390x (manual .deb/.rpm dropped into MQINST/) -- and ends with an explicit `else: echo "Unsupported platform $T"; exit 1` for everything else, riscv64 included. No source is available for IBM''s MQI client library to relink ibmmqc.c against an open alternative (unlike an open protocol implementation), so there is no build-from-source escape hatch (gotcha 77 doesn''t apply). PyPI 2.1.0 itself ships only 3 platform wheels (macosx_11_0_arm64, manylinux_2_28_x86_64, win_amd64) plus an sdist -- no aarch64 either, confirming the client''s own arch ceiling (not an unrelated packaging choice) drives the published matrix. No worktree/branch opened -- diagnosed read-only against the real 2.1.0 sdist (setup.py, ibmmqc.c), the manylinux wheel''s ELF NEEDED entries, IBM''s live documentation, and upstream''s own Dockerfile.'
