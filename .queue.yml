- pkg: shiboken6
  version: 6.11.2
  home: https://pyside.org
  repo: https://code.qt.io/cgit/pyside/pyside-setup.git/
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/1696
  notes: '2 Linux wheels upstream (abi: cp310-abi3); no riscv64 on PyPI or pypi.riseproject.dev. No sdist on PyPI (pyside-setup has no per-component sdist); build-from-checkout of pyside/pyside-setup at git tag 6.11.2 via its own setup.py (not PEP517/cibuildwheel-compatible - custom --build-type flag), docker-run-yourself shape like build-libclang.yml. Initial concern was that ApiExtractor (shiboken6-generators C++ parser) needs libclang, expected to require the same from-scratch multi-hour LLVM/Clang compile as build-libclang.yml (PR #866, ~10h). Not the case here: Rocky 10 riscv64s AppStream repo (the manylinux_2_39_riscv64 base) already ships prebuilt clang-devel/llvm-devel 21.1.8 with ClangConfig.cmake/LLVMConfig.cmake/libclang.so/headers (confirmed via the real repodata at dl.rockylinux.org, no container needed) - setup_clang()s find_package(Clang CONFIG REQUIRED) finds it with no LLVM_INSTALL_DIR override needed. Second dependency, also unexpected: sources/shiboken6/cmake/ShibokenSetup.cmake does find_package(Qt6 REQUIRED COMPONENTS Core) even for a shiboken6-only (non-PySide) build - also covered by Rocky 10 AppStream (qt6-qtbase-devel, confirmed in the same repodata, includes qtpaths6 and Qt6Config.cmake). Third wrinkle: shiboken6s own bindings (shibokenmodule) are self-generated - shibokenmodule/CMakeLists.txt runs the already-built Shiboken6::shiboken6 tool against typesystem_shiboken.xml, so shiboken6-generator (the 49-56MB wheel that bundles libclang.so, confirmed via requires_dist/wheel sizes on PyPI) has to be built and pip-installed into the build venv first, even though it is never published (out of scope per this tasks brief; see pyside6-essentials note below for what a future generator/pyside6 port would reuse). The final shiboken6 wheel (libshiboken.so + Shiboken*.so, ~270KB on aarch64) links only libpython - no Qt/Clang/GPL code ships in it, so no gpl_sources job. Worktree at .claude/worktrees/shiboken6, branch shiboken6. PR #1696, CI green (setup/build/publish dry-run all passed). Four manylinux-container-specific fixups were needed beyond the first-pass dnf/CLI-flag guess: (1) pip building the `patchelf` PyPI package from source runs its own `make check`, which fails 8/48 tests on riscv64 - fetch NixOS/patchelf''s own riscv64 release binary instead (Rocky 10''s riscv64 repos ship no patchelf package either, gotcha 95). (2) pyside-setup defaults to the Ninja CMake generator on Linux but the image ships none - pip install ninja (PyPI has a riscv64 wheel) and put $pybin on PATH so cmake''s generator search finds it. (3) manylinux''s CPython is --disable-shared and finalize.sh strips every libpython*.a from lib/ to save space (archiving them first into /opt/_internal/static-libs-for-embedding-only.tar.xz) - extract that tarball back so build_info_collector.py''s LIBDIR search finds shiboken6-generator''s embedding library. (4) --plat-name on setup.py bdist_wheel crashes on a native (non-cross-compiling, non-macOS) Linux build, since PysideBuild.finalize_options only fakes os.name to dodge distutils'' Windows-only check when cross-compiling or on darwin - drop the flag from both bdist_wheel invocations and let auditwheel repair retag the wheel; also install shiboken6-generator with --no-deps since its wheel declares a shiboken6==6.11.2 runtime dependency that does not exist yet at that point in the build.'
