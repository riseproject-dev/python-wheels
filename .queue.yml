  version: 2.0.1
  home: https://github.com/astropy/astropy-healpix
  repo: https://github.com/astropy/astropy-healpix
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/1518
  notes: '6 Linux wheels upstream (abi: cp310,cp314); no riscv64 on PyPI or pypi.riseproject.dev. The sparse-looking upstream matrix is setup.cfg''s py_limited_api = cp310 abi3 build (one wheel covers cp310+) plus a separate cp314t free-threaded build, not a CPython-version choice. Ported the same shape, floored to our cp312: cp312-abi3 (re-tested on cp313/cp314) + cp314t. cp314t is built and shipped like upstream''s but untested -- astropy, a hard runtime+test dependency, publishes no free-threaded wheel on any index anywhere (CLAUDE.md gotcha 149). One patch (patches/astropy-healpix/2.0.1/): _core.c calls strcmp() without including <string.h>, which only hard-fails under GCC 14 (our manylinux_2_39_riscv64 image); upstream''s older manylinux2014 image lets the implicit-declaration warning slide (CLAUDE.md gotcha 226). Verified locally (macOS arm64, cp312-abi3 equivalent): patched build succeeds, 125 passed/1 skipped. PR #1518, branch/worktree astropy-healpix.'
