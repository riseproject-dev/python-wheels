- pkg: frida
  version: 17.17.0
  home: https://frida.re
  repo: https://frida.re
  status: parked
  pr: null
  notes: 'Not feasible: frida-python is a thin binding whose entire function depends on frida-core (C, Meson), and frida-core''s Gum engine has zero riscv64 backend anywhere upstream, at the architecture-codegen level, not merely "no prebuilt devkit". Verified against the frida-gum submodule vendored at frida/frida tag 17.17.0 (commit ddc10c5): its top-level meson.build derives host_arch from cpu_family() and falls through to the raw family name (i.e. "riscv64") for anything not arm/arm64/mips/mips64, but gum/meson.build only ever adds GumInterceptor/GumStalker/GumCpuContext/GumProcess backend sources when host_arch is in {x86, x86_64, arm, arm64, mips, mips64} (gum/backend-x86, backend-arm, backend-arm64, backend-mips are the only backend-* dirs that exist; likewise arch-x86/arch-arm/arch-arm64/arch-mips are the only arch-* writer/relocator dirs) -- there is no backend-riscv64 or arch-riscv64 anywhere in the tree, so a riscv64 build would fail to link GumInterceptor/GumStalker (no fallback/generic backend, no explicit meson error, just missing sources). This is corroborated directly by upstream: frida-gum issue #733 ("RISC-V support", open since 2023) was reopened by maintainer oleavr in 2024 with "this is planned, we just don''t know when somebody will find the time to do the work"; frida-gum PR #1071 ("riscv support") is an open, unmerged, third-party draft ("Initial support, draft stage, some issues with the interceptor need to be resolved", 4081 additions across 43 files, last updated days before this check) -- i.e. real but incomplete, unreviewed, unmerged work, not present in 17.17.0 or any released frida-core. The devkit release assets for 17.17.0 confirm the same gap operationally: linux devkits are published for x86/x86_64/arm/arm64/armhf/mips/mips64(+musl/be variants) but no riscv64. Stalker (code-tracer) and Interceptor (function-hook trampoline codegen) are architecture-specific JIT/codegen subsystems, not portable C -- this is a from-scratch native backend (instruction encoding, relocation, disassembly) upstream itself has not finished, so a from-source riscv64 build in this repo would need to originate that backend, which is out of scope for a wheel port. No worktree/branch/PR created.'
