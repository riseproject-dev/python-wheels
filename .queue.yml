- pkg: imageio-ffmpeg
  version: 0.6.0
  home: https://github.com/imageio/imageio-ffmpeg
  repo: https://github.com/imageio/imageio-ffmpeg
  status: parked
  pr: null
  notes: 'Not feasible (vendored-binary, gotcha 35/157/183). The package itself is pure Python (setup.py: zero ext_modules); its 6 Linux/macOS/Windows bdist wheels are all py3-none-<platform> only because tasks.py''s `build` task copies a per-platform prebuilt `ffmpeg` executable into imageio_ffmpeg/binaries/ before packing (FNAME_PER_PLATFORM in _definitions.py), then hand-retags the wheel Root-Is-Purelib/Tag -- nothing is compiled in this repo''s sense. The binaries come from the imageio/imageio-binaries GitHub repo (tasks.py get_ffmpeg_binary: `github.com/imageio/imageio-binaries/raw/master/ffmpeg/<fname>`), which for Linux are themselves johnvansickle.com static builds per a code comment in _definitions.py. Verified both have zero riscv64 offering: `gh api repos/imageio/imageio-binaries/contents/ffmpeg` lists only linux-{x86_64,aarch64} (+ legacy v4.2.2 linux32/64/aarch64) plus macOS/Windows; johnvansickle.com/ffmpeg/ ships only amd64/i686/arm64/armhf/armel, no riscv64, official or unofficial. This differs from av (PR #461, in-review): av''s own upstream fetch step (scripts/fetch-vendor.py + scripts/ffmpeg-latest.json) pulls prebuilt libraries from PyAV-Org/pyav-ffmpeg, which *does* publish a riscv64 release (ffmpeg-manylinux-riscv64.tar.gz, confirmed by download) -- but inspecting that tarball shows it contains only include/ headers and lib/ shared libraries for linking against, no bin/ffmpeg CLI executable at all, so it does not supply what imageio-ffmpeg needs either. Getting imageio-ffmpeg a real riscv64 binary would mean this repo compiling a full statically-linked ffmpeg CLI (with x264/x265/etc.) from raw source ourselves -- something upstream''s own CI never does on any platform (it only ever copies a prebuilt exe) -- which is out of proportion for a port and would not ''closely mirror upstream''s own CI, narrowed to riscv64'' (goal 2), unlike av''s case where the existing upstream vendor step already had a riscv64 target. No worktree/branch/PR created (a worktree was opened for research then removed once this was confirmed).'
- pkg: shap
  version: 0.52.0
  home: https://shap.readthedocs.io/en/latest/index.html
  repo: http://github.com/shap/shap
  status: parked
  pr: null
  notes: 'Not feasible today: blocked-on-dependency, same family as the numba/llvmlite entries above (gotcha 40/42, feasibility-and-triage.md). shap 0.52.0''s pyproject.toml hard-requires numba unconditionally on every non-(darwin+x86_64) platform (''numba; sys_platform != "darwin" or platform_machine != "x86_64"'' -- true for linux/riscv64), and it is not an optional accelerator: shap/utils/_masked_model.py and shap/explainers/_partition.py both do module-level ''from numba import njit'', and shap/__init__.py unconditionally imports PartitionExplainer at package-import time, so ''import shap'' itself hard-fails without numba installed -- confirmed against the real v0.52.0 source tree, not inferred. numba itself is un-portable today because it pins llvmlite, whose ffi/CMakeLists.txt requires LLVM major 22 exactly and whose build script sources that patched LLVM from the numba/label/llvm_wheel conda channel, which publishes 0 packages for linux-riscv64 (confirmed via https://conda.anaconda.org/numba/label/llvm_wheel/linux-riscv64/repodata.json). Numba/llvmlite must land first; shap cannot be sequenced ahead of them. New finding folded back into the skill as gotcha 187 (feasibility-and-triage.md): conda-forge''s own llvmdev channel (a different channel than the one llvmlite''s build script actually uses) does publish linux-riscv64 llvmdev at major 22 (llvmdev-22.1.8), unlike the numba/label/llvm_wheel channel gotcha 42 checked -- doesn''t unblock llvmlite by itself (the build script is hardcoded to the numba channel and its patches), but is a concrete lead for whoever picks up the llvmlite port. shap''s own build (scikit-build-core + nanobind, small _cext C++ extension) was not otherwise a blocker -- this is purely the numba/llvmlite dependency wall. No worktree/branch/PR created (one was opened for research at .claude/worktrees/shap on branch shap, then removed once this was confirmed).'
- pkg: lancedb
  version: 0.37.1
  home: https://github.com/lancedb/lancedb
  repo: https://github.com/lancedb/lancedb
  status: published
  pr: https://github.com/riseproject-dev/python-wheels/pull/859
  notes: '2 Linux wheels upstream (abi: cp310); no riscv64 on PyPI or pypi.riseproject.dev. Worktree at .claude/worktrees/lancedb, branch lancedb. Rust/maturin (python/ subdir), builds one cp310-abi3 wheel on cp312 (~750 resolved crates for riscv64gc-unknown-linux-gnu per cargo metadata). Thin LTO + CARGO_BUILD_JOBS=2 override the shipped fat-LTO release profile (same reasoning as build-deltalake.yml); protoc from Rocky 10 CRB (same as build-statsig-python-core.yml). Tests skip 6 files with unconditional import of polars/pylance (no riscv64 wheel, both large Rust projects in their own right). First CI run failed after ~2h: lance-core''s SIMD_SUPPORT static and lance-linalg''s f32x8/f32x16/i32x8/f64x4/f64x8 types compile only for x86_64/aarch64/loongarch64 upstream (no riscv64 fallback, unlike u8x16/u8x32 which already have one). Added patches/lancedb/0.37.1/000{1,2}-*.patch: 0002 gives lance-linalg a portable scalar fallback (verified with cargo check --target riscv64gc-unknown-linux-gnu against an isolated copy of the simd module, plus aarch64/x86_64 regression checks), 0001 redirects lance-core/lance-linalg to that patched sibling checkout via [patch.crates-io] with `exclude = ["lance"]` to keep its own [workspace] independent (verified end-to-end with cargo metadata --filter-platform riscv64gc-unknown-linux-gnu against the exact nested checkout layout CI produces). Pushed in a second commit; that run failed fast (workflow bug, not the port): `git -C lance apply ../python-wheels/...` -- bash expands the glob relative to its own cwd before git''s -C takes effect, so the literal unexpanded path never matched. Fixed with `cd lance &&` in a third commit. That run (33791589510) built the wheel fine (~9.5h) but failed at test time: 13 failures out of 726 passed/39 skipped/45 deselected -- 12 tests in test_db.py/test_hybrid_query.py/test_permutation.py/test_query.py import lance(pylance)/polars lazily inside the test body (not module scope, so the existing --ignore=<file> list didn''t catch them) and 1 (test_package_metadata.py::test_pyo3_abi_matches_minimum_supported_python) reads python/Cargo.toml relative to its own path, which CIBW_TEST_SOURCES never stages. Fixed in commit 4ee59c0a2 with 13 individual --deselect=<nodeid> entries copied verbatim from the FAILED lines (same CIBW_TEST_COMMAND invocation/rootdir, so no gotcha-14-style relative-path mismatch); pushed, re-running CI now. That run (33843581031) failed again ~10h later with the exact same 13 failures -- the deselects never took effect. Root cause: cibuildwheel runs CIBW_TEST_COMMAND from test_cwd/, one level above test_cwd/python/pyproject.toml; pytest''s rootdir/inifile search only walks upward from cwd, never into subdirectories, so no config was ever found and every --deselect silently failed to match (the FAILED nodeids print identically either way) -- confirmed by reproducing the exact cwd/config layout locally. Fixed in commit badb1f67e with `cd python &&` before the pytest invocation (paths in the command drop one `python/` level to match the new cwd); checked lancedb''s python/pyproject.toml `--strict-markers`/--ignore-glob addopts are safe now that config actually loads (the suite only uses slow/asyncio/s3_test, all three registered; the ignore-glob targets the source package, not tests). Pushed, re-running CI now (run 33916807494, queued). Merged (#859). Issue #963 linked, project status set. Publish dispatched on main. Not yet confirmed on the registry. Confirmed live on pypi.riseproject.dev.'
