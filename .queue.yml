- pkg: claude-agent-sdk
  version: 0.2.152
  home: https://github.com/anthropics/claude-agent-sdk-python
  repo: https://github.com/anthropics/claude-agent-sdk-python
  status: parked
  pr: null
  notes: 'Not feasible: vendored-binary whose primary function is unreachable on riscv64, not merely degraded (gotcha 35/157/183, feasibility-and-triage.md). The package itself is pure Python (pyproject.toml: hatchling, only-include src/claude_agent_sdk, no build hook); its 5 published Linux/macOS/Windows bdist wheels are tagged py3-none-<platform> only because scripts/build_wheel.py retags the wheel after scripts/download_cli.py fetches Anthropic''s closed-source ''claude'' CLI binary (via bash install.sh) into src/claude_agent_sdk/_bundled/ -- 342.56 MB of a 343 MB wheel per gotcha 157. That binary has zero riscv64 build anywhere upstream, confirmed independently on all three of gotcha 157''s sources: install.sh''s `case "$(uname -m)"` hard-errors ''Unsupported architecture'' for anything but x86_64/aarch64; downloads.claude.ai''s release manifest lists only {darwin,linux,win32}-{x64,arm64}(+musl); and npm''s @anthropic-ai/claude-code optionalDependencies fan out to the same set, no riscv64 entry. Building from the sdist without that step (what `pip install claude-agent-sdk` already falls back to on riscv64 today, since upstream ships no py3-none-any wheel) does produce a working *import* in seconds with no compiler -- confirmed locally, plain hatchling -> claude_agent_sdk-0.2.152-py3-none-any.whl -- but every call fails: subprocess_cli.py._find_cli() checks the bundled path, then shutil.which(''claude'') and a handful of install locations, then raises CLINotFoundError, which on riscv64 is always true since no ''claude'' binary can exist there at all. Per gotcha 157/183, installable-but-non-functional is `vendored-binary`, not `not-feasible`/`not needed`, and the verdict is to park it: the primary reason anyone installs this SDK (driving the claude CLI) has no riscv64 story at any layer, official or unofficial, with no patch available. No worktree/branch/PR created.'
