  notes: 'CI green on PR #1770: cp312/cp313/cp314/cp314t riscv64 wheels built, 15 tests passed each, publish job dry-ran cleanly. Root cause of the riscv64-only build failure: setup.py''s get_libraries_dir() unconditionally splits os.environ["LD_LIBRARY_PATH"] whenever the key is merely present (our manylinux_riscv64 container exports it empty), producing a bare -L with no argument that swallows the following -lfcl as its path instead of a library flag -- libfcl was never linked, causing undefined symbol: typeinfo for fcl::CollisionGeometry<double> at import. Patched (0002-*.patch) to treat an empty value as unset. Awaiting maintainer review/merge; not yet published.'
