  status: parked
  pr: null
  notes: 'Not feasible (gotcha 303, feasibility-and-triage.md): PyPI classifiers are explicit -- Programming Language :: Python :: 2 :: Only -- and the only Linux artifact is a cp27 wheel plus an sdist; nothing this repo''s cp312/cp313/cp314/cp314t matrix could build as a real port. Confirmed from the real 3.5.4 sdist: setup.py only declares the _posixsubprocess32 C extension when sys.version_info[0] == 2; for every Python 3 it installs zero extensions and instead packages python3_redirect/__init__.py (sys.modules[''subprocess32''] = subprocess), a pure-Python compatibility stub. pip install subprocess32 on riscv64 today already builds that redirect from the sdist in under a second with no compiler, so a manylinux_riscv64 cp312+ wheel would ship zero arch-specific content for an interpreter range the C extension never targets -- a packaging convenience, not a port. No worktree/branch/PR created.'
