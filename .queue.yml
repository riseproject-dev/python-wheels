  status: parked
  pr: null
  notes: 'Not feasible today: vl-convert-python 1.9.0.post1 (source is the vega/vl-convert monorepo; jonmmease/vl-convert is a stale fork, last pushed 2025-01, kept only for the crates.io homepage/repository metadata) builds vl-convert-rs, which pulls in deno_core 0.307.0 -> the v8 (rusty_v8) crate pinned by deno_core''s own Cargo.toml as `v8 = "0.105.0"` (caret-compatible, resolves to 0.105.1 in the checked-in Cargo.lock). Checked the GitHub Releases API for rusty_v8 tag v0.105.1: prebuilt static libs exist only for aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-apple-darwin, x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc -- no riscv64 asset. The V8_FROM_SOURCE fallback in that same build.rs has no riscv64 wiring either: its target_cpu GN-arg mapping only covers aarch64/arm/i686/x86_64, so even a from-source build has nothing to build against (denoland/rusty_v8#1476 tracks exactly this failure). rusty_v8 only started shipping riscv64gc-unknown-linux-gnu prebuilt binaries at v150.1.0 (published 2026-07-10) -- about 150 releases/two years past the 0.105.1 pinned here. Closing that gap would require bumping deno_core/deno_runtime/deno_emit/deno_graph across that whole span and likely adapting vl-convert-rs''s own V8-facing source, which is a fork-scale change to a third-party dependency chain, not something patches/<pkg>/<version>/ can carry -- and even vl-convert''s own unreleased v2.0.0-rc5 is only at deno_core 0.411.0, still short of the riscv64-capable v8 150+ line. No riscv64 gap to close until vl-convert itself bumps its deno_core/v8 pins that far. Worktree/branch created locally then removed, never pushed; no PR opened.'
