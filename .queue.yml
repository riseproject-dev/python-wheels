- pkg: nodejs-wheel-binaries
  version: 24.19.0
  home: https://github.com/njzjz/nodejs-wheel
  repo: https://github.com/njzjz/nodejs-wheel
  status: publishing
  pr: 860
  notes: 'Not vendored-binary: builds Node.js from source via CMake ExternalProject (configure && make), same as upstream''s own x86_64/aarch64 wheels. Node 24.19.0 configure.py/V8 BUILD.gn support riscv64 natively; unofficial-builds.nodejs.org confirms a working riscv64 build exists. Full compile (V8+ICU) on riscv64 runner, timeout-minutes: 1440. First CI run failed 30min in: gcc rejected -m64 while compiling OpenSSL, because Node''s deps/openssl/openssl_asm.gypi has no riscv64 branch and its catch-all fallback wrongly includes the linux-x86_64 asm config. Fixed with patches/nodejs-wheel-binaries/24.19.0/0001-riscv64-pass-openssl-no-asm-to-Node-s-configure.patch (adds --openssl-no-asm to configure on riscv64 only), validated locally under linux/riscv64 QEMU (configure command line + absence of -m64 in generated openssl.target.mk) before pushing. Re-running in CI. Worktree at .claude/worktrees/nodejs-wheel-binaries, branch nodejs-wheel-binaries. PR https://github.com/riseproject-dev/python-wheels/pull/860. Build itself then succeeded (V8+ICU compile completed after ~23h), but the publish dry-run job failed: "No wheels found in dist". Root cause: the upload-artifact name (nodejs-wheel-binaries-24.19.0-manylinux_riscv64) had no segment between version and manylinux_riscv64, but the publish job''s artifact-pattern requires one (nodejs-wheel-binaries-24.19.0-*-manylinux_riscv64) - the glob matched 0 artifacts. The built wheel is tagged py2.py3-none (universal, not per-interpreter), so renamed the artifact to nodejs-wheel-binaries-24.19.0-py2.py3-none-manylinux_riscv64 to match. Re-running jobs failed on the same commit SHA would have reused the old (buggy) workflow definition per GitHub''s documented behavior, so this required a fresh full push (new commit touching the workflow file re-triggers pull_request: paths, meaning another full V8+ICU recompile from scratch) rather than a job re-run. Pushed fix commit e6220aeba, new CI run in progress as of 2026-09-04. That re-run then hit a different failure: the build job''s own 24h timeout-minutes killed it mid-compile (started 2026-09-04T20:31:00Z, killed 2026-09-05T20:31:21Z while still compiling V8 objects, e.g. js-collator-tq-csa.o) - this build''s runtime is close to the 24h edge (the first successful run took ~23h16m). Bumped timeout-minutes to 2880 (48h) in commit 8e14cbd56 and re-pushed; new CI run (33990804990) in progress as of 2026-09-05.'
- pkg: aiokafka
  version: 0.14.0
  home: http://aiokafka.readthedocs.org
