- pkg: prophet
  version: 1.4.0
  home: https://facebook.github.io/prophet/
  repo: https://github.com/facebook/prophet
  status: blocked-on-dependency
  pr: null
  notes: '2 Linux wheels upstream (abi: py3); no riscv64 on PyPI or pypi.riseproject.dev. Blocked-on-dependency, same shape as gotcha 341 (feasibility-and-triage.md): prophet''s python/setup.py (STAN_BACKEND=CMDSTANPY is the only backend supported since prophet>=1.1) calls cmdstanpy.install_cmdstan(version="2.37.0") unconditionally at wheel-build time, and CmdStan''s own make/stanc rule downloads bin/stanc -- the Stan-to-C++ transpiler -- as a prebuilt OCaml binary from stan-dev/stanc3''s GitHub Releases, keyed by `uname -m` via a fixed ARCH_TAG table (aarch64/ppc64le/s390x/armv7l only). riscv64 matches none of those branches, so it would fetch the plain x86_64 linux-stanc asset, which cannot execute on riscv64. Verified no riscv64 asset exists on either the pinned v2.37.0 stanc3 release or the current nightly (checked 2026-09-10): assets are linux-stanc/linux-arm64-stanc/linux-armel-stanc/linux-armhf-stanc/linux-ppc64el-stanc/linux-s390x-stanc/mac-*/windows-stanc. Stan Math''s own vendored TBB 2020.3 is NOT the blocker -- its tbb_machine.h takes the portable machine/gcc_generic.h fallback for any GCC>=7 build (unconditional per tbb_config.h), the same path already exercised by the existing x86_64/aarch64 wheels, so the C++ side compiles fine cross-arch. The actual blocker is narrowly stanc3 itself: an OCaml/dune project with zero riscv64 release or CI history of its own -- OCaml''s compiler has supported riscv64 codegen since 4.12 and opam lists a host-arch-riscv64 package, but bootstrapping that toolchain and then building stanc3 (a separate upstream project outside this repo''s rules to patch or file against) would mean standing up a whole second, previously-untested build pipeline as a prerequisite -- out of scope for a patches/<pkg>/<version>/ fix. Possible future path: pre-generate the transpiled prophet_model.hpp via stanc on x86_64 once and vendor it as a patch so riscv64 only ever compiles portable C++, bypassing stanc entirely on-target -- not attempted here since it diverges heavily from upstream''s own build (setup.py) for a package with no explicit priority ask. No worktree/branch opened -- diagnosed read-only via gh api against facebook/prophet (v1.4.0), stan-dev/cmdstan (v2.37.0), stan-dev/stanc3 (v2.37.0 + nightly), and stan-dev/math (58ad15b... via stan-dev/stan''s pin), no checkout required.'
- pkg: catboost
  version: 1.2.10
  home: https://catboost.ai
  repo: https://github.com/catboost/catboost
  status: parked
  pr: null
  notes: '14 Linux wheels upstream (abi: cp310,cp311,cp312,cp313,cp314,cp38,cp39); no riscv64 on PyPI or pypi.riseproject.dev. Not Arcadia/ya-make-blocked in the way the task brief hypothesized: catboost''s real Linux CI (.github/workflows/build_per_platform.yaml) drives plain ./ci/build_all.py -> cmake/ninja, and python-package/setup.py calls that same CMake build for its _catboost/_hnsw extensions - no ya/Arcadia tooling invoked anywhere in the actual build path, no pure-Python fallback. The real blocker is one layer down and bigger than ortools'' scope (gotcha 214): every CMakeLists.txt with platform-specific content is a generated stub carrying a "generated by the YaTool build system (yandex/yatool) from ya.make files" header, dispatching purely on CMAKE_SYSTEM_NAME/CMAKE_SYSTEM_PROCESSOR with no else() branch - confirmed at both build/CMakeLists.txt and a leaf like catboost/libs/model/CMakeLists.txt. Only Linux x86_64/aarch64/ppc64le get a variant; riscv64 has none, so the endif() falls through silently at every one of those injection points (SIMD boosting kernels, source lists, compile flags) - not a compile error but a systematically incomplete build. `gh api search/code -f ''q=filename:CMakeLists.linux-x86_64.txt repo:catboost/catboost''` counts 350 separate such injection points across the tree. Fixing this needs either running Yandex''s YaTool generator for a riscv64 platform preset it has never targeted (unproven, needs Arcadia-side platform/toolchain definitions this repo has no access to), or hand-writing riscv64 equivalents of all 350 generated files by reverse-engineering the x86_64/aarch64 ones - larger and more mechanically blocked than ortools'' dozen FetchContent''d dependencies. Filed as gotcha 230 (feasibility-and-triage.md). No worktree/branch opened - resolved read-only via gh api against the v1.2.10 tag (workflows, ci/build_all.py, build/build_native.py, python-package/setup.py, and the search/code stub count), no checkout needed.'
