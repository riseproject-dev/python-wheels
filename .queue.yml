  version: 1.3.3
  home: https://github.com/biotite-dev/fastpdb
  repo: https://github.com/biotite-dev/fastpdb
  status: parked
  pr: null
  notes: 'Upstream repo is archived (confirmed via API, archived: true, last push 2026-06-21) with its README stating "fastpdb is integrated into biotite now and this repository has been archived" - no more releases will happen. Verified by building v1.3.3 locally (macOS arm64, cp312): the wheel builds fine (maturin, pyo3 0.24.2), but installing it alongside the only biotite compatible with our registry/PyPI (1.7.1, also the latest release upstream) breaks almost the entire test suite (1119/1144 failed) with `AttributeError: attribute lines of biotite.structure.PDBFile objects is not writable`. Root cause: biotite 1.7.1 absorbed fastpdb''s own fast Rust PDB parser natively (biotite.structure.io.pdb.PDBFile now subclasses biotite.rust.structure.io.pdb.PDBFile, biotite''s own compiled extension) and no longer exposes a writable `lines` attribute the way fastpdb 1.3.3''s Python shim (python-src/fastpdb/__init__.py) assumes when syncing state after every read()/set_structure() call. This is a real, riscv64-independent incompatibility (same break on any architecture with biotite >=1.7.1, the only version PyPI or pypi.riseproject.dev offers) with no small patch available - the fix would mean reimplementing fastpdb''s compatibility shim against biotite''s new internal architecture, and would be pointless since biotite already ships the same fast parser natively. Also noted in passing (moot given the above): pyproject.toml build-system pins `numpy >=1.26,<1.27`, which has no cp313 wheel anywhere (numpy 1.26 predates Python 3.13 support) and would need a patch to build past cp312; and Cargo.toml pins `pyo3 = "0.24"` (resolves to 0.24.2), which hard-fails to build for cp314/cp314t (CPython interpreter version newer than PyO3''s maximum supported version (3.13), gotcha 326) so those two interpreters would need dropping from the matrix regardless. No worktree/branch/PR created (a worktree was opened, used only for local build/test rehearsal against the real biotite-dev/fastpdb v1.3.3 checkout, then removed once this was confirmed).'
