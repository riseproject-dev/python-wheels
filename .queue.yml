- pkg: mitmproxy-wireguard
  version: 0.1.23
  home: https://github.com/decathorpe/mitmproxy_wireguard
  repo: https://github.com/decathorpe/mitmproxy_wireguard
  status: parked
  pr: null
  notes: 'Not feasible: ring 0.16.20 (pinned transitively via boringtun 0.5.2 in the released 0.1.23 sdist''s checked-in Cargo.lock) has no riscv64 support -- its build.rs panics (`unwrap() on a None value` at build.rs:358) resolving the target''s asm backend, confirmed with a local `cargo check --target riscv64gc-unknown-linux-gnu`. ring did not gain riscv64gc support until 0.17. This is a real dependency-graph wall, not staleness alone (verified by building, gotcha 248): a native `cargo check` against both a normal and a free-threaded CPython succeeds fine (pyo3 0.18.2 abi3-py37 is version-independent of the linked interpreter), so the only hard blocker is ring/riscv64, not the Python ABI. Upstream repo is archived (decathorpe/mitmproxy_wireguard, pushed_at 2024-02-18) with its README stating "no longer maintained, its functionality has been subsumed into mitmproxy_rs"; last PyPI release 0.1.23 was 2023-04-04 (3.5y stale), requires-python >=3.7 with classifiers capped at 3.10/3.11. Confirmed via mitmproxy''s own requires-dist history that only mitmproxy 9.0.0/9.0.1 (mid-2022) depend on mitmproxy-wireguard; mitmproxy switched to mitmproxy-rs starting at 10.0.0 and is now at 12.2.3 (requires-python >=3.12) -- so the only real-world consumer is a mitmproxy major version 3+ releases and >3 years EOL, not a plausible dependent on a brand-new riscv64 platform. mitmproxy-rs (the replacement) is already ported and merged (PR #962): its Cargo.lock uses boringtun 0.7.1 + ring 0.17.14, which is exactly why that port succeeded where this one cannot. No workflow/patch fix is reasonable here without forking the unmaintained boringtun 0.5.2/ring 0.16.20 pin ourselves, which upstream (archived) would never merge and this repo would then have to maintain solo -- out of proportion for an EOL predecessor with a maintained, already-ported replacement (goal 2). Worktree/branch created for research (mitmproxy-wireguard) then removed once this was confirmed; no PR opened.'
