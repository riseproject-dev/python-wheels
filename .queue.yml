  repo: https://github.com/tile-ai/tilelang
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/1730
  notes: '4 Linux/macOS/Windows wheels upstream (abi: cp38-abi3); no riscv64 on PyPI or pypi.riseproject.dev. Upstream (tile-ai/tilelang, built on a vendored TVM fork submodule) is a GPU tile-programming DSL but genuinely supports a documented CPU/LLVM-only build: CMakeLists.txt exposes USE_CUDA/USE_ROCM/USE_METAL/USE_LLVM toggles (USE_CUDA defaults off when no CUDA toolkit is found), and docs/get_started/Installation.md says outright "USE_CUDA: ... set to OFF to build a CPU version" and "USE_LLVM: enable LLVM backend for CPU codegen, LLVM 15+ required" -- a real upstream-supported mode, not an internal escape hatch, even though upstream''s own dist.yml only ever ships CUDA (Linux/Windows) and Metal (macOS) wheels. LLVM is linked via llvm-config (USE_LLVM=ON auto-detects it), not compiled from source, so this is closer in scale to a normal LLVM-linking port than build-libclang.yml''s from-scratch LLVM/Clang compile. Runtime deps checked against pypi.riseproject.dev: torch (2.13/2.14+cpu, cp312-cp314t), apache-tvm-ffi (0.1.12 satisfies tilelang''s >=0.1.11,<0.1.13 pin, cp312-abi3/cp314t), z3-solver (4.15.4.0 satisfies >=4.13,<4.15.5), ml-dtypes/numpy/psutil all have riscv64 wheels; cloudpickle/tqdm/typing-extensions/scikit-build-core are pure py3-none-any. Build-time cython>=3.1.0 (registry has 3.3.0) and patchelf>=0.17.2 both have riscv64 wheels. One real gap: the optional torch-c-dlpack-ext (marker python_version < "3.14") dependency has no riscv64 wheel anywhere (tracked separately as the parked torch-c-dlpack-ext entry); upstream''s own docs call it a soft/JIT-fallback dependency ("Without it, TVM FFI may require JIT compilation on first import"), so the plan is to patch the marker to also exclude riscv64 (Upstream-Status: Inappropriate) rather than block on it. Because apache-tvm-ffi''s own riscv64 wheel is cp312-abi3 + cp314-cp314t only, the realistic interpreter matrix mirrors build-apache-tvm-ffi.yml''s cp312/cp314t split. The vendored 3rdparty/tvm (TileLang/tvm fork) is a substantial C++ tensor-compiler tree -- a genuinely large compile, plausibly among this repo''s largest, but with no from-scratch LLVM build in the loop. Worktree/branch created at .claude/worktrees/tilelang. PR #1730 opened; first riscv64 CI attempt confirmed the full vendored TVM compile succeeds (~5h, USE_LLVM auto-detected the CRB llvm-devel package fine), but tilelang_cython_wrapper failed: Cython 3.3.0 (the only riscv64 wheel on the registry, and PyPI''s current latest -- no upper bound in build-system.requires) added a hard #error in Cython/Utility/ModuleSetupCode.c requiring the Limited API target to be >=3.9, while tilelang''s wheel.py-api="cp38" targets 3.8 -- a cross-platform regression, not riscv64-specific, since any resolver picking cython>=3.3 against tilelang''s existing cp38 SABI target breaks the same way. Added a second patch capping cython to <3.3 (Upstream-Status: To upstream) and re-triggered.'
