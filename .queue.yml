  notes: '12 Linux wheels upstream (abi: cp310,cp311,cp312,cp313,cp314); no riscv64 on PyPI or pypi.riseproject.dev. Own build would be trivial (setuptools + Cython>=3.1 + numpy>=2.0,<3, three small .pyx extensions, no C++ complexity, confirmed against the real v0.9.1 sdist/checkout) but the package hard-depends on ortools at runtime: k_means_constrained/__init__.py imports k_means_constrained_.py, which does an unconditional module-level `from ortools.graph.python.min_cost_flow import SimpleMinCostFlow` (line 30) -- so `import k_means_constrained` itself hard-fails without ortools installed, not an optional accelerator. ortools has zero riscv64 wheels on PyPI or pypi.riseproject.dev (registry returns 404 for the whole project), and this repo already assessed porting ortools itself and parked it as disproportionate in scope (see the ortools entry above and gotcha 214, feasibility-and-triage.md): BUILD_DEPS=ON FetchContents abseil/protobuf/Eigen3/re2/Boost/SoPlex/SCIP/the COIN-OR suite/HiGHS/PDLP/BOP on top of ortools'' own CP-SAT/routing core and SWIG bindings, read as a multi-day effort with zero of those sub-builds proven on riscv64 here except abseil/protobuf/HiGHS. Note this corrects an initial premise that scikit-learn was a hard dependency here: scikit-learn is only a requirements-dev.txt/test dependency (tests/test_kmeans_constrained_from_sklearn.py uses make_blobs/v_measure_score/load_iris) -- the package''s own sklearn_import/ subpackage is a vendored copy, not a real scikit-learn import, and requirements.txt''s actual runtime deps are ortools, scipy, numpy, six, joblib. k-means-constrained cannot be sequenced ahead of ortools; revisit once ortools (or a lighter alternative min-cost-flow solver it could switch to) lands on the registry. No PR created; a worktree/branch was opened for research, then removed once the ortools blocker was confirmed against the real upstream checkout -- no CI cycle burned.'
