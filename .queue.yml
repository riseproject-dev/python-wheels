- pkg: eigenpy
  version: 3.13.0
  home: https://github.com/cmake-wheel/eigenpy
  repo: https://github.com/cmake-wheel/eigenpy
  status: blocked-on-dependency
  pr: null
  notes: '10 Linux wheels upstream (abi: 0); no riscv64 on PyPI or pypi.riseproject.dev. home/repo correctly point at cmake-wheel/eigenpy, not stack-of-tasks/eigenpy: confirmed via `gh api repos/cmake-wheel/eigenpy` that it is a fork whose parent is stack-of-tasks/eigenpy, and upstream''s own checked-in pyproject.toml (v3.13.0 tag) carries no [build-system] at all -- a plain CMake project (Boost.Python bindings between Eigen and NumPy, BSD-2-Clause) consumed via conda/robotpkg/apt, not buildable with pip. The fork''s own pyproject.toml is what actually produces the wheels PyPI publishes as eigenpy: build-backend = "cmeel", and project.dependencies is ["cmeel-boost ~= 1.90.0"] -- confirmed against the live eigenpy PyPI JSON''s info.requires_dist, not just the fork''s source. cmeel-boost is a runtime dependency (eigenpy''s compiled .so links its Boost.Python shared libraries), not just a build input, so pip install eigenpy cannot resolve on riscv64 until cmeel-boost itself has a riscv64 wheel. cmeel (build dep) and cmeel-eigen (build dep, Eigen is header-only) are both py3-none-any -- zero riscv64 concern, already installable from public PyPI as-is. cmeel-boost is the opposite: its sdist is a 4KB CMakeLists.txt whose ExternalProject_Add downloads the entire upstream boost_1_90_0.tar.bz2 and runs ./bootstrap.sh && ./b2 link=shared python=3.X with no --with-libraries filter, i.e. it compiles Boost''s whole default library set once per interpreter -- a build on the order of this repo''s largest to date (libclang''s ~10h from-scratch LLVM/Clang compile), plausibly portable (no architectural riscv64 blocker) but a full dedicated port of its own, which is why cmeel-boost already carries its own separate .queue.yml entry (status: queued) rather than being something to inline into eigenpy''s build. Per gotcha 125 a pip-resolvable sdist isn''t automatically a reasonable one either: cmeel-boost would likely build from sdist inside a cibuildwheel container (a green CI run), but that same full-Boost compile would then re-run for every future end user''s pip install eigenpy on riscv64 (no riscv64 wheel to resolve to), and most end-user environments won''t have the toolchain for it (CMake >= 4.0, a C++ compiler, numpy headers) -- defeating the "simple index to install riscv64 wheels from" goal even on a green run. Sequenced behind cmeel-boost''s own port, same shape as the k-means-constrained/ortools and cvxpy/sparsediffpy cases; filed as gotcha 338 (feasibility-and-triage.md). No worktree/branch opened -- resolved fully read-only via PyPI JSON, gh api, and one cmeel-boost sdist download, no checkout needed. Revisit once cmeel-boost lands on the registry.'
