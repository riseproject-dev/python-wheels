- pkg: pickle5
  version: 0.0.12
  home: https://github.com/pitrou/pickle5-backport
  repo: https://github.com/pitrou/pickle5-backport
  status: parked
  pr: null
  notes: 'Parked: pickle5 backports PEP 574 (pickle protocol 5) for Python versions that predate it. setup.py hard-pins python_requires=">=3.5, <3.8" and every release (0.0.1-0.0.12) has only ever published cp36/cp37 wheels, never cp38+ - not staleness, an enforced ceiling. Protocol 5 and pickle.PickleBuffer have been in the stdlib pickle module since Python 3.8, confirmed present on this host''s Python 3.9. This repo''s default interpreter matrix is cp312/cp313/cp314/cp314t (numpy''s own floor is 3.12), which has zero overlap with cp36/cp37, and the manylinux riscv64 image/runners (ubuntu-24.04-riscv) do not carry EOL Python 3.6/3.7 toolchains to build against in the first place. Building only cp36/cp37 wheels would produce artifacts unusable by anything else in this registry and unneeded since the stdlib already provides protocol 5 for every supported interpreter. Not worth porting.'
