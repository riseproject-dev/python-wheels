  repo: https://github.com/oracle/python-cx_Oracle
  status: parked
  pr: null
  notes: 'Not feasible: the extension itself is open (cx_Oracle''s own BSD-licensed glue
    plus a vendored copy of ODPI-C, dual Apache-2.0/UPL, under odpi/ in the sdist) and
    builds cleanly on any arch -- confirmed by downloading the real 8.3.0 sdist and reading
    setup.py and odpi/src/dpiOci.c directly rather than assuming from the "wraps Oracle"
    reputation. setup.py compiles cx_Oracle''s C sources plus every odpi/src/*.c file into a
    single extension with no external include/library dirs unless ODPIC_INC_DIR/ODPIC_LIB_DIR
    are set (they are not, by default); dpiOci.c self-declares every OCI type/function
    prototype it calls (the dpiOciFnType__* typedefs) so no Oracle SDK headers are needed to
    compile, and reaches libclntsh.so only via dlopen()/dlsym() at runtime (dpiOciLibNames
    lists libclntsh.so/.so.11.1 through .so.21.1 on Linux) -- nothing proprietary is bundled,
    downloaded, or linked into the wheel at build time, unlike mssql-python-odbc/hdbcli
    (gotchas 342/372) which vendor or require the proprietary driver at build time. The
    permanent blocker is one layer out: every real operation (connect() and everything after)
    needs Oracle Instant Client''s libclntsh.so at runtime, which is closed-source with no
    source ever published anywhere. Oracle''s own Instant Client download pages list only
    Linux x86-64, Linux x86-32, Linux ARM (aarch64), Windows x64, and macOS ARM64 -- no
    riscv64 at any client version, official or unofficial, and (unlike playwright''s Node.js
    driver, which has an unofficial-builds.nodejs.org riscv64 tarball) there is no possible
    third-party rebuild path since there is no open Instant Client source to rebuild from.
    Same verdict as playwright (gotcha 183): installable and importable, but non-functional
    for its entire purpose on riscv64, with no patch or build-from-source escape hatch. Also
    of note: cx_Oracle 8.3.0 was itself Oracle''s last release of this package before folding
    into python-oracledb, which added a pure-Python "thin mode" needing no Instant Client at
    all -- a real riscv64 path exists in the ecosystem, just not in this legacy binding; that
    successor package would be a separate .queue.yml candidate. Documented as gotcha 373
    (feasibility-and-triage.md). No worktree/branch/PR created -- diagnosed read-only against
    the real 8.3.0 sdist (setup.py, odpi/src/dpiOci.c, LICENSE.txt) and Oracle''s live Instant
    Client download/documentation pages.'
