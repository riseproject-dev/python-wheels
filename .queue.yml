never `python -m pytest` - `-m` inserts cwd onto sys.path and shadows the installed wheel with the source checkout''s python/datafusion (no compiled _internal there), whereas invoking `pytest` directly plus `--import-mode=importlib` (upstream''s own flag) resolves `datafusion` from site-packages; verified end-to-end locally against the real PyPI cp310-abi3 macosx_11_0_arm64 wheel with submodules checked out: 1328 passed, 8 skipped in 3.56s, all skips pre-existing optional-dependency guards (pandas, polars, pyarrow.cffi/cffi, psutil) plus one from our own patch. One patch needed: python/tests/test_expr.py imports `arro3.core` and `nanoarrow` (each a separate maturin/C-extension project, no riscv64 wheel published by either) at module scope for a single test (test_scalar_conversion); made lazy via `pytest.importorskip` inside that test so the other ~185 tests in the file still collect (Upstream-Status: Inappropriate). Only local gap found: a `cargo check --target riscv64gc-unknown-linux-gnu` cross-compile rehearsal from an arm64 Debian trixie container needs `libc6-dev-riscv64-cross` (not just `gcc-riscv64-linux-gnu`) for the sysroot headers zstd-sys/lz4-sys etc. need - a local rehearsal-only gotcha, irrelevant to the real riscv64 runner which compiles natively. Worktree/branch created at .claude/worktrees/datafusion.'
