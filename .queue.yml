- pkg: embreex
  version: 4.4.0
  home: https://github.com/trimesh/embreex
  repo: https://github.com/trimesh/embreex
  status: parked
  pr: null
  notes: 'Not feasible (gotcha 366, feasibility-and-triage.md): embreex is a thin Cython binding around Intel''s Embree ray-tracing kernel library; embreex''s own before-build step (package/fetch-embree.py) downloads Embree''s prebuilt release archive, and RenderKit/embree''s GitHub Releases publish x86_64-linux, x86_64/arm64-macos, and x64-windows only for v4.4.0 -- no riscv64, confirmed against the real release assets. Building Embree from source does not unblock it: Embree''s own CMakeLists.txt platform detection recognizes only two families -- EMBREE_ARM (Apple silicon or CMAKE_SYSTEM_PROCESSOR aarch64/ARM64) or, for everything else, EMBREE_MAX_ISA defaulting through to SSE2, with common/simd/sse.h and friends using __m128/_mm_* intrinsics unconditionally outside the ARM branch. There is no third generic/portable/scalar ISA option -- EMBREE_MAX_ISAs own allowed STRINGS list is only NONE NEON NEON2X (ARM) or NONE SSE2 SSE4.2 AVX AVX2 AVX512 DEFAULT (everything else). riscv64 matches neither family, silently falls into the x86 SSE2 default, and fails to compile (xmmintrin.h does not exist for a riscv64-targeted GCC). Confirmed no RISC-V work exists anywhere upstream: common/simd/ has an arm/ shim (sse2neon.h/avx2neon.h) but no riscv equivalent, a GitHub code search across RenderKit/embree for "riscv" returns zero hits (both the v4.4.0 tag and current master), and Embree''s own project site documents support for x86 (Linux/macOS/Windows) and ARM (macOS) CPUs plus Intel Arc GPUs only. Closing this gap would mean writing a full SSE/AVX-to-RVV translation shim covering the hundreds of intrinsics Embree''s kernels use -- a new engineering project for upstream, not a patches/<pkg>/<version>/ fix -- and would not ''closely mirror upstream''s own CI, narrowed to riscv64'' (goal 2: upstream has no riscv64 CI or code path to narrow). No worktree/branch/PR created -- resolved read-only against the real v4.4.0 pyproject.toml/setup.py/package/fetch-embree.py/package/embree.json (embreex) and the real CMakeLists.txt/common/simd/* (Embree).'
