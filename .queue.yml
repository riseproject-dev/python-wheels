- pkg: apache-beam
  version: 2.75.0
  home: https://beam.apache.org
  repo: https://github.com/apache/beam
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/1726
  notes: '10 Linux wheels upstream (abi cp310-cp314, x86_64+aarch64), sdist present; no riscv64 anywhere. sdks/python/setup.py confirms a genuinely small native surface: 6 .pyx files plus a handful of setup.py-cythonized .py modules under coders/metrics/runners/transforms/utils, producing 17 .so files total - no Bazel/large-C++ build, a normal cibuildwheel candidate. Validated end-to-end locally (macOS arm64, ~2.5min): `pip wheel <sdist> --no-deps --no-build-isolation` with only cython>=3.2.5,<4 + numpy preinstalled succeeds and produces a real 17-.so wheel. pyproject.toml''s build-system.requires pins grpcio-tools==1.62.1 (py<=3.12) / 1.71.0 (py>=3.13), which has no riscv64 wheel, but it''s unused for the riscv64 bdist: the released sdist ships pre-generated apache_beam/portability/api/*_pb2.py with zero .proto sources alongside them (confirmed against the real PyPI sdist), so gen_protos.py''s "no proto files, reuse existing output" branch never imports grpc_tools - fixed with --no-build-isolation (gotcha 76) instead of patching the pin. Matrix cp312/cp313/cp314 (cp314t dropped: upstream''s own build_wheels.yml matrix never builds a free-threaded wheel for Beam); numpy<2.5.0 and cython riscv64 wheels both cover this range on our registry. Upstream''s own released sdist ships with no LICENSE at all (verified against the real PyPI tarball) even though sdks/python/MANIFEST.in already lists NOTICE/LICENSE/LICENSE.python - they live at the repo root, not sdks/python - so the sdist-build step copies them in first, same gap/fix shape as build-ctranslate2.yml. Testing mirrors upstream exactly (no CIBW_TEST_COMMAND): upstream''s own build_wheels.yml runs zero wheel tests itself (real Beam test suites live in separate massive PostCommit/PreCommit workflows, out of scope). Known caveat for future maintainers: Beam''s mandatory (non-extra) install_requires caps pyarrow<24.0.0 and protobuf<7.0.0.dev0, but pypi.riseproject.dev currently hosts exactly one riscv64 version of each (pyarrow 25.0.1, protobuf 7.35.1), both incompatible with those bounds - so `pip install apache-beam` will not fully resolve on riscv64 today regardless of this port; that''s a downstream ecosystem gap (would need an additional pyarrow<24/protobuf<7 riscv64 build), not a defect in this workflow. PR #1726 all checks green: sdist build, cp312/cp313/cp314 riscv64 bdist builds, check_commit_messages, check_patches, and publish dry-run all passed - dry-run log confirms the three expected wheels (apache_beam-2.75.0-cp31{2,3,4}-cp31{2,3,4}-manylinux_2_31_riscv64.manylinux_2_39_riscv64.whl). Awaiting maintainer review.'
