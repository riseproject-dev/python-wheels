- pkg: pysha3
  version: 1.0.2
  home: https://github.com/tiran/pysha3
  repo: https://github.com/tiran/pysha3
  status: parked
  pr: null
  notes: 'Not feasible (gotcha 334, feasibility-and-triage.md): pysha3 backports hashlib.sha3_*/shake_* for Python < 3.6 by vendoring the exact C sources CPython later shipped as its own _sha3 module; sha3.py only monkey-patches hashlib if not hasattr(_hashlib, "sha3_512"), a no-op on every interpreter since 3.6, so this repo''s cp312+ floor gets zero benefit even if it built. It doesn''t build: Modules/_sha3/backport.inc does #include "pystrhex.h" for Python >= 3.5, and pystrhex.h is a CPython-internal header under Modules/, never installed under Include/ alongside Python.h -- confirmed by actually building the real 1.0.2 sdist against a Python 3.12 venv (pip wheel . --no-deps --no-build-isolation): fatal error: ''pystrhex.h'' file not found. Upstream itself settled this in November 2022, deleting the whole tree down to a one-line README.md: "pysha3 has reached its end of life ... please use SHA-3 functions from hashlib". No worktree/branch/PR created.'
