  home: https://github.com/gorakhargosh/watchdog
  repo: https://github.com/gorakhargosh/watchdog/
  status: parked
  pr: null
  notes: 'Not feasible (gotcha 27, feasibility-and-triage.md): setup.py sets ext_modules=[] unless sys.platform == ''darwin'' (only _watchdog_fsevents.c on macOS); on Linux (all arches, riscv64 included) watchdog drives inotify via pure ctypes. Confirmed from the real 6.0.0 sdist (setup.py) and PyPI JSON: the 7 Linux wheels are all py3-none-manylinux2014_{x86_64,aarch64,armv7l,i686,ppc64,ppc64le,s390x} (Root-Is-Purelib, hand-set --plat-name in upstream''s release loop, zero .so). Upstream deliberately ships no py3-none-any wheel so riscv64 pip install already falls back to the sdist, which builds in seconds with no compiler. Publishing a manylinux_riscv64 wheel would carry zero arch-specific content -- a packaging convenience, not a port. No worktree/branch/PR created (one was opened for research then removed once this was confirmed).'
- pkg: playwright
  version: 1.62.0
  home: https://github.com/Microsoft/playwright-python
  repo: https://github.com/Microsoft/playwright-python
  status: parked
  pr: null
  notes: 'Not feasible (vendored-binary, gotcha 35/183). No sdist on PyPI; all 8 wheels are py3-none-<platform> (~40-48MB) because setup.py extracts a per-platform bundle of a prebuilt Node.js binary + the playwright-core npm package into playwright/driver/ -- nothing is compiled. Verified against the real v1.62.0 sources: NODE_VERSION pins 24.18.1, which nodejs.org''s official SHASUMS256.txt has zero riscv64 builds for (unofficial-builds.nodejs.org does publish one, but that only gets the driver running). The deeper blocker: playwright-core''s hostPlatform.ts degrades any non-x64/arm64 Linux arch to hostPlatform="<unknown>" (no crash, just silent failure), so `playwright install` and any local browser launch fail on riscv64 regardless of the Node binary -- Microsoft ships no riscv64 Chromium/Firefox/WebKit at all, official or unofficial. The wheel would be installable and importable but non-functional for its entire purpose on every interpreter, with no patch available (unlike av, whose vendored ffmpeg libs do build for riscv64). Worktree/branch not pushed; no PR opened.'
