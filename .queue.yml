- pkg: mssql-python-odbc
  version: 18.6.2.1
  home: https://github.com/microsoft/mssql-python
  repo: https://github.com/microsoft/mssql-python
  status: parked
  pr: null
  notes: 'Not feasible: pure proprietary binary-vendoring package, no source at all (gotcha 342 shape, feasibility-and-triage.md, but worse -- ibm-db at least compiles a real C extension). PyPI ships bdist_wheel only for every release ever published (0.0.1a1, 18.6.2, 18.6.2.1) -- zero sdists, confirmed via the full releases JSON. Downloaded and inspected the manylinux_2_28_aarch64 18.6.2.1 wheel directly: it contains no setup.py/build logic beyond packaging, just a thin __init__.py plus pre-compiled Microsoft binaries under mssql_python_odbc/libs/linux/{alpine,debian_ubuntu,rhel}/arm64/lib/ (libmsodbcsql-18.6.so.2.1, libodbcinst.so.2) -- i.e. this package *is* the proprietary driver, repackaged per-libc/per-distro-family as wheel data files, not a binding compiled against it. License classifier is literally `License :: Other/Proprietary License` (Microsoft ODBC Driver + Visual Studio runtime license texts are bundled as the licenses/). PyPI lists exactly 7 wheels for 18.6.2.1: macosx_15_0_universal2, manylinux_2_28_{aarch64,x86_64}, musllinux_1_2_{aarch64,x86_64}, win_amd64, win_arm64 -- x86_64/aarch64/universal only, no riscv64. Cross-checked against Microsoft''s own Linux driver docs (learn.microsoft.com, ODBC 18 install page): the arch-detection snippets for every supported distro family (Alpine, Debian, RHEL/Oracle, SLES, Ubuntu, Azure Linux) all reduce `uname -m` to only amd64/x86_64 or arm64/aarch64, with every other arch (including riscv64) explicitly routed to an "is not currently supported" exit -- Microsoft does not build msodbcsql for riscv64 at any driver version (11/13/13.1/17/18), official or otherwise. Since there is no source to compile, there is no build-from-source path to add riscv64 the way an open C extension could be relinked; this is strictly a wait-on-upstream case. No worktree/branch opened -- diagnosed read-only against the real 18.6.2.1 wheel contents and Microsoft''s live driver documentation/download infra.'
- pkg: pyqt5
  version: 5.15.11
  home: https://www.riverbankcomputing.com/software/pyqt/
  repo: https://www.riverbankcomputing.com/software/pyqt/
  status: parked
  pr: null
  notes: '1 Linux wheel upstream (cp38-abi3, not really cp38-only - abi3 covers cp38+); no riscv64 on PyPI or pypi.riseproject.dev. Not a licensing block: PyQt5 is dual GPLv3/commercial (Riverbank), distinct from Qt5''s own LGPL/commercial split, but GPLv3 is redistributable as a binary wheel same as any other GPL project (this is how Riverbank''s own PyPI wheel and every Linux distro''s PyQt5 package already ship it) - no parking rationale there. Not "no viable riscv64 Qt5 build path" either: Qt 5.15.19 opensource was actually released (LGPLv3, May 2026, download.qt.io/archive/qt/5.15/5.15.19, tag v5.15.19-lts-lgpl), qtbase''s own qprocessordetection.h has real Q_PROCESSOR_RISCV/_64 support, and Debian sid already ships qtbase5-dev 5.15.19+dfsg-4 and qttools5-dev 5.15.19-2 natively for riscv64 - a working native-build precedent exists. The actual blocker is scope/sequencing: Rocky Linux 10 (this repo''s manylinux_riscv64 base) ships zero Qt5 packages on any arch, not just riscv64 - confirmed via `docker run --platform linux/riscv64 rockylinux/rockylinux:10 dnf list qt5\*`/`qt\*` against appstream+baseos+crb, which returns only qt6-* (RHEL10 moved to Qt6-only); EPEL is unavailable on riscv64 at all (gotcha 51 - `dnf install epel-release` fails outright, no repo to even check). So there is no in-image Qt5 SDK and no packaged riscv64 Qt5 to pip-install as a build dependency. The only paths in are (a) compiling the full multi-module Qt5 stack (qtbase + qtsvg + qttools + qtx11extras/wayland + qtdeclarative etc., each with its own native dependency chain - X11, ICU, D-Bus, CUPS, fontconfig, harfbuzz, SQL client libs) from source against Rocky 10''s toolchain, unvetted for riscv64 in this repo and an order of magnitude bigger than any single-package port done so far (bigger than the libclang/LLVM or pygame/SDL2 builds), or (b) reusing Debian''s prebuilt riscv64 .deb binaries inside the Rocky10-glibc manylinux container, which has its own unverified glibc/ABI cross-distro risk and its own from-scratch licensing/provenance work. Either way this is Qt5-for-riscv64 bring-up, not a PyQt5 binding port, and the queue already tracks it separately: pyqt5-qt5 (Riverbank''s prebuilt-Qt5-as-a-wheel package PyQt5 hard-pins via `PyQt5-Qt5>=5.15.2,<5.16.0`) is itself still `queued` with no riscv64 build attempted. Publishing a pyqt5 wheel today would be unable to satisfy that pinned runtime dependency from either PyPI or pypi.riseproject.dev, so `pip install pyqt5` would still fail on riscv64 even with a green pyqt5 build. Parking pending pyqt5-qt5 (or an in-repo Qt5-from-source build) landing first as its own dedicated port; re-queue pyqt5 once a riscv64 Qt5 SDK exists to build against. No worktree/branch opened - diagnosed read-only via PyPI JSON, Riverbank''s own PyQt5 docs, download.qt.io/qt-project.org/code.qt.io, Debian''s package tracker, and a direct dnf query against the real Rocky Linux 10 riscv64 repos.'
