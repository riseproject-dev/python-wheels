- pkg: cuda-tile
  version: 1.5.0
  home: https://github.com/nvidia/cutile-python
  repo: https://github.com/nvidia/cutile-python
  status: parked
  pr: null
  notes: 'NVIDIA cuTile Python (CUDA Tile Compiler, github.com/nvidia/cutile-python) is a JIT GPU-kernel-launch library, not an optionally-CUDA package. Confirmed via PyPI JSON metadata, wheel contents, and NVIDIA''s own redistrib manifest, not assumed from the name alone: (1) PyPI summary is literally "CUDA Tile Compiler", classifier "Environment :: GPU :: NVIDIA CUDA :: 13". (2) 1.5.0 ships 18 wheel files, all manylinux2014_{x86_64,aarch64} or win_amd64 across cp310-cp314/cp314t -- zero riscv64 and zero any other Linux arch upstream. (3) Downloaded and unzipped the cp312-manylinux2014_x86_64 wheel: cuda/tile/__init__.py line 7 unconditionally does `from cuda.tile._cext import launch` (no try/except, no CPU-fallback path per gotcha 284''s counterexample), and _cext.cpython-312-x86_64-linux-gnu.so''s symbol table is the full CUDA Driver API (cuInit, cuDeviceGet, cuLaunchKernel, cuMemAlloc, cuGraphLaunch, etc). cuda/tile/_load_libcuda.py does an unconditional `ctypes.CDLL("libcuda.so.1")` (nvcuda.dll on Windows) at import time to resolve cuGetProcAddress_v2. (4) The README''s System Requirements section: needs NVIDIA Driver r580+, and the tileiras JIT compiler only targets Blackwell and Ampere/Ada GPUs (Hopper not yet supported) -- GPU-architecture-specific, not just any CUDA device. (5) Building from source needs CUDA Toolkit 13.1+ (nvcc, CMake); the optional tileiras extra depends on `cuda-toolkit[nvcc,nvvm,tileiras]<13.5,>=13.2`, NVIDIA''s own CUDA toolkit PyPI meta-package. (6) NVIDIA''s own redistrib manifest (developer.download.nvidia.com/compute/cuda/redist/redistrib_13.2.0.json) lists cuda_nvcc platforms as exactly linux-x86_64, linux-sbsa, windows-x86_64 -- no riscv64 in any current CUDA release, matching this repo''s existing triton finding (gotcha 41; see also the sglang entry above, parked for the same reason: hard-requires cuda-python>=13.0 and cuda-tile, neither of which exists for riscv64 anywhere). No CPU fallback exists and there is no path to a functional riscv64 build: CUDA has no riscv64 host-architecture story at all. Not a candidate to revisit unless/until NVIDIA ships CUDA for riscv64.'
