- pkg: polars-hash
  version: 0.9.2
  home: https://github.com/ion-elgreco/polars-hash
  repo: https://github.com/ion-elgreco/polars-hash
  status: blocked-on-dependency
  pr: null
  notes: '3 Linux wheels upstream (abi: cp310); no riscv64 on PyPI or pypi.riseproject.dev. The Python-level dependency chain is fine: polars-hash''s only runtime dep is `polars>=1.36.1`, and modern `polars` is a pure-Python py3-none-any metapackage whose real backend (`polars-runtime-32`, pinned by exact version) is already published for riscv64 on pypi.riseproject.dev at every version polars-hash could plausibly need (confirmed 1.39.3 through 1.44.1, cp310-abi3 + cp314-cp314t) - not a blocker. The actual blocker is at the Rust/maturin layer: polars_hash/Cargo.toml (both the 0.9.1/0.9.2 tags and the unreleased main branch) pins `gxhash = { version = "=3.5.0", default-features = false }` unconditionally (no Cargo feature gate), and polars_hash/src/expressions.rs calls `gxhash::gxhash32/64/128` directly to implement the public `nchash.gxhash32/64/128` Polars expressions. gxhash 3.5.0 (the only version ever published, and still current on crates.io) is hardware-AES-only: its src/gxhash/platform/mod.rs selects an x86.rs module under `cfg(target_arch = "x86"/"x86_64")` or an arm.rs module under `cfg(target_arch = "arm"/"aarch64")`, with no third arm for any other architecture - so `platform::*` fails to resolve at all on riscv64gc-unknown-linux-gnu. Worse, x86.rs itself carries an unconditional `compile_error!` unless `target_feature = "aes"` and `"sse2"` are both set ("Gxhash requires aes and sse2 intrinsics"), confirming there is no software/portable fallback in the crate on any platform - it calls hardware intrinsics (`_mm_aesenc_si128`/`_mm_aesenclast_si128` on x86, ARM crypto extension equivalents on aarch64) directly, gated by a `deterministic`/`hybrid`/`std` feature set that does not include a scalar path. Checked upstream gxhash''s own git main branch (ogxd/gxhash) for a fix: none: last commit touching platform/ was 2025-05-18, still only arm.rs/x86.rs, no riscv issue ever filed. Also checked polars-hash''s own issue tracker (#67, #53 - the original gxhash feature requests) and its main-branch Cargo.toml: still an unconditional `=3.5.0` pin, no feature-gating planned. A riscv64 build would therefore need either (a) a from-scratch, bit-exact reimplementation of AES-based hashing for riscv64 in a crate we do not own and upstream itself has never attempted in over two years - RISC-V''s vector-crypto AES extension (Zvkned) is itself new and not reliably present on generic riscv64 CI hardware, or (b) forking polars_hash to strip the `nchash.gxhash32/64/128` public API and its ~20 hardcoded-expected-value test cases (polars_hash/tests/test_hash.py GXHASH_VECTORS etc., which assert exact hash values matching the upstream `gxhash` PyPI reference implementation, so a from-scratch riscv64 implementation would also have to be bit-identical to pass them unmodified). Both are out of proportion to a small hashing-utility plugin port and would ship a materially different, upstream-divergent wheel rather than a working precedent upstream could adopt. No worktree/branch created (research-only; would have been removed per the blocked-on-dependency convention). Re-check if/when gxhash gains riscv64 support upstream (no such issue exists as of 2026-09-07) or if polars-hash makes gxhash an optional feature.'
