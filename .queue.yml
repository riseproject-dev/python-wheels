- pkg: libclang
  version: 18.1.1
  home: https://github.com/sighingnow/libclang
  repo: https://github.com/sighingnow/libclang
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/866
  notes: '4 Linux wheels upstream (abi: py2.py3); no riscv64 on PyPI or pypi.riseproject.dev. Compiles a full LLVM/Clang 18.1.1 from source (this package''s whole purpose is bundling a prebuilt libclang.so) - the largest build in this repo so far. Worktree at .claude/worktrees/libclang, branch libclang. Not conda-blocked like numba/llvmlite (gotcha 40/42/187): upstream''s own recipe builds vanilla LLVM/Clang via CMake against the manylinux image''s own gcc, no conda-distributed LLVM involved. Not the jaxlib/XLA case either (PR #526, parked): that''s a bazel genrule missing riscv64 in embed_bitcode, unrelated to a plain CMake libclang build. Single docker run job (manylinux image has no Node, so a native `container:` job can''t run checkout/artifact actions - same constraint noted for build-cryptography.yml/build-orjson.yml), no interpreter matrix (wheel is py2.py3-none, one build serves everyone, like build-xgboost.yml''s py3-none). New finding: LLVM''s CheckAtomic.cmake fails ''Host compiler must support std::atomic!'' when configuring with upstream''s own `-static-libgcc -static-libstdc++` CXX flags, because manylinux_2_39_riscv64 ships libstdc++.so but not libstdc++.a - fixed with `dnf -y --enablerepo=crb install libstdc++-static` before cmake configure (libstdc++-static is CRB-only, same repo build-chromadb.yml already enables for protobuf). gpl_sources job added (packages: gcc) since -static-libgcc/-static-libstdc++ embeds the image''s gcc runtime into libclang.so, same shape as build-xgboost.yml''s libgomp job. Smoke test parses a small C snippet via clang.cindex after installing the built wheel (upstream''s own CI only greps GLIBC symbol versions, no functional test). First full run (~10h) compiled LLVM/Clang cleanly but then failed at the wheel-packaging step: upstream''s setup_ext.py does `import distutils`, removed from the stdlib in Python 3.12, and the workflow only `pip install`ed wheel (not setuptools) so the compat shim was never installed - `ModuleNotFoundError: No module named ''distutils''`. Fixed by installing setuptools alongside wheel; validated the root cause directly against the real manylinux_2_39_riscv64 image (no LLVM rebuild needed) and filed as gotcha 211. Pushed fix commit d33f298be. Second full run (~9h51m, 2026-09-04 06:15-16:07Z) again compiled LLVM/Clang cleanly, then failed one line further into the same wheel-packaging step: unpinned `pip install -U wheel` now resolves wheel 0.48.0, which dropped `wheel.bdist_wheel.get_platform` in 0.44.0 in favour of setuptools'' own bundled bdist_wheel - upstream''s setup_ext.py imports that symbol by name, so it dies with `ImportError: cannot import name ''get_platform'' from ''wheel.bdist_wheel''`. Reproduced and fixed against the real setup_ext.py + a stub native/libclang.so in quay.io/pypa/manylinux_2_39_riscv64 (no LLVM rebuild needed): wheel 0.48.0 fails identically, pinning wheel==0.43.0 (last release exporting get_platform) produces a real wheel. Filed as gotcha 225 (committed directly to main, 86cb8f409, following the gotcha-211 precedent). Pushed fix commit bb2851bf1. Third full run (2026-09-04T16:20Z - 2026-09-05T02:35Z, ~10h15m) compiled LLVM/Clang cleanly, packaged the wheel cleanly under wheel==0.43.0, and the smoke test + publish dry-run both passed. All checks green: setup, check_commit_messages, check_patches, build, gpl_sources, publish dry-run. PR #866 open, not yet merged - awaiting maintainer merge. Confirmed via `gh pr view 866` immediately before this update. No further active monitoring; will run post-merge steps (pw-postmerge.py, registry confirmation) once merged. Issue #1156 created and linked to PR #866 (was previously missing). Publish (re-)dispatched on main.'
- pkg: ctranslate2
  version: 4.8.1
  home: https://opennmt.net
  repo: https://github.com/OpenNMT/CTranslate2
  status: publishing
  pr: https://github.com/riseproject-dev/python-wheels/pull/873
  notes: '14 Linux wheels upstream (abi: cp310,cp311,cp312,cp313,cp314,cp39); no riscv64 on PyPI or pypi.riseproject.dev. Worktree at .claude/worktrees/ctranslate2, branch ctranslate2. CPU backend picked via CMake: WITH_MKL=OFF, WITH_RUY=ON, OPENMP_RUNTIME=COMP, BUILD_CLI=OFF - matches upstream''s own aarch64 CIBW_BEFORE_ALL_LINUX branch (prepare_build_environment_linux.sh) minus OpenBLAS, since Ruy alone already covers both float32 and int8 GEMM per src/cpu/backend.cc (OpenBLAS only adds float32, redundant here). Ruy''s own third_party/cpuinfo submodule (pinned pre-riscv64-support commit 082deffc) degrades to a harmless ''unsupported platform'' warning on riscv64 rather than a fatal error - confirmed by reading pytorch/cpuinfo''s CMakeLists.txt at that exact pinned commit. Needed `-DCMAKE_POLICY_VERSION_MINIMUM=3.5` because cpuinfo''s own vendored deps/clog declares a `cmake_minimum_required` below CMake 4''s hard floor of 3.5 (fatal ''Compatibility with CMake < 3.5 has been removed''), and only CMake >=4.1 ships a riscv64 wheel on PyPI - confirmed both by triggering the exact error locally and by checking PyPI''s file list per version. Only third_party/spdlog + third_party/ruy (+ its own cpuinfo submodule) are initialized - third_party/{cxxopts,cpu_features,googletest,thrust,cutlass} are unused for a BUILD_CLI=OFF/BUILD_TESTS=OFF/WITH_CUDA=OFF CPU build and thrust+cutlass alone are gigabytes of NVIDIA sources not worth fetching. gpl_sources job added (packages: gcc): auditwheel repair vendors the image''s libgomp.so.1 into ctranslate2.libs/ because OPENMP_RUNTIME=COMP links GNU OpenMP - confirmed by actually running auditwheel repair locally. Also fixed a pre-existing upstream packaging gap: `cp LICENSE python/` before cibuildwheel, since python/setup.py''s find_packages() only globs inside python/ so upstream''s own PyPI wheel (verified via pip download) ships no LICENSE at all (same shape as gotcha 86/build-thrift.yml). Locally validated the FULL build+test loop (not just cmake configure) end-to-end on a native aarch64 manylinux_2_39 container via podman as a fast proxy for riscv64 (no QEMU riscv64 binfmt available on this Mac host): C++ library builds and installs in under a minute, python wheel builds and imports, `get_supported_compute_types(''cpu'')` returns {float32, int8, int8_float32} confirming Ruy is live, and the real python/tests suite (mirroring upstream''s test-python-wheels job, minus legacy fairseq/opennmt-py/opennmt-tf converter tests) passes 160/168 with 7 skipped and 1 deselected (a wav2vec2 transcription test that diverges by one character under Ruy''s int8 GEMM vs upstream''s OpenBLAS+Ruy aarch64 build - same numeric-divergence class as gotcha 170, not a functional bug). First real riscv64 CI run failed fast (~1min into the C++ compile): cpuinfo''s pinned commit (082deffc, pre-riscv64-support) never defines -D_GNU_SOURCE=1 for riscv64 because CMakeLists.txt''s CPUINFO_SUPPORTED_PLATFORM gate only sets that flag for processors its regex recognizes (riscv wasn''t added until pytorch/cpuinfo commit 4e5be9e, 2023-11-14), yet src/api.c''s cpuinfo_get_current_processor() calls syscall(__NR_getcpu,...) unconditionally on any __linux__ build - without _GNU_SOURCE glibc''s unistd.h hides the syscall() prototype and GCC 14 hard-errors on the implicit declaration. This is exactly the kind of arch-specific runtime failure gotcha 9''s aarch64-proxy configure/build check cannot catch (aarch64 IS in cpuinfo''s recognized-processor regex, so CPUINFO_SUPPORTED_PLATFORM is true there and _GNU_SOURCE gets defined normally - confirmed by trying to repro on aarch64 via -DCMAKE_SYSTEM_PROCESSOR=riscv64, which cmake silently ignores for a non-cross-compile config, so this had to be caught for real on riscv64 CI). Fixed with patches/ctranslate2/4.8.1/0001-cpuinfo-fix-missing-syscall-declaration-on-riscv64.patch (Upstream-Status: Backport, citing pytorch/cpuinfo commit 4e5be9e1c6c5895bc5105a92d587bc9df8d2522b which already fixes this for current cpuinfo releases) adding `#define _GNU_SOURCE 1` directly to third_party/ruy/third_party/cpuinfo/src/api.c, applied via a second `actions/checkout` of this repo (path: python-wheels) + `git apply` step after submodule init. Verified the fix in isolation with a direct `gcc -std=c99` compile of the pristine vs. patched file (matching cpuinfo''s own C_EXTENSIONS NO / C99 target settings) inside the manylinux_2_39_aarch64 image: pristine reproduces the identical `error: implicit declaration of function ''syscall''`, patched compiles cleanly. Pushed as a new commit on the ctranslate2 branch. Second real riscv64 CI run got past cpuinfo and failed later, in ctranslate2''s own src/cpu/primitives.cc: ''CPU_ISA_DISPATCH was not declared in this scope'' at every call site. Root cause in src/cpu/cpu_isa.h: the CPU_ISA_DISPATCH macro is defined inside `#ifdef CT2_WITH_CPU_DISPATCH` (set whenever ENABLE_CPU_DISPATCH=ON, the default) with only `#if defined(CT2_X86_BUILD) #elif defined(CT2_ARM64_BUILD) #endif` branches and no third #else - so on any architecture that is neither x86 nor arm64, the macro is simply never defined while every call site still expands it unconditionally. This is a genuine upstream gap for any third architecture, not riscv64-specific handling gone wrong. Fixed by adding `-D ENABLE_CPU_DISPATCH=OFF` to the CMake configure line, which routes through cpu_isa.h''s OUTER macro-cascade instead (gated on raw compiler macros __AVX512F__/__AVX2__/__AVX__/__ARM_NEON, all false on riscv64) and lands on its own unconditional final `#else` defining CPU_ISA_DISPATCH against CpuIsa::GENERIC - exactly what riscv64 needs since ENABLE_CPU_DISPATCH''s whole purpose (compiling multiple ISA variants and picking one at runtime) is moot when there is only ever one ISA to target. Verified via a from-scratch riscv64 cross-compile sandbox built for this (not just the aarch64 proxy, which can''t reproduce this bug since aarch64 matches CT2_ARM64_BUILD and never hits the missing-macro path): installed gcc-riscv64-linux-gnu from EPEL inside the manylinux_2_39_aarch64 image, extracted a real sysroot (libc/libstdc++/libgomp/headers) from quay.io/pypa/manylinux_2_39_riscv64 via `podman create` + `podman export` (no riscv64 QEMU binfmt needed since nothing is executed, only the image filesystem is unpacked), and confirmed CMake configure now correctly reaches the ''not supported in cpuinfo'' riscv64 branch (proving the cross-config itself is authentic) with ENABLE_CPU_DISPATCH=OFF set. Also did a full manual grep audit of every CT2_X86_BUILD/CT2_ARM64_BUILD/__AVX__/__ARM_NEON/#error site in src/+include/ (7 files total) to rule out further third-architecture gaps in the same pass (gotcha 71/139''s ''grep the vendored tree once'' principle) - all other sites either have a working generic fallback (src/cpu/kernels.cc''s own TARGET_ISA cascade, cpu_isa.cc''s get_cpu_isa()) or are self-contained within their own arch guard with no call from outside it (cpu_info.cc/.h, the one arch-specific log line in utils.cc). Pushed as a third commit. Third real riscv64 CI run got all the way through the build, wheel packaging, and nearly the whole test suite (2h53m total) - genuine progress, not another config failure. Only 3 tests failed, all parametrizations of test_transformers_whisper_align: each sums small per-token float differences into a result ~0.004 outside the test''s `pytest.approx(..., abs=1e-3)` tolerance (e.g. 20.490975484251976 vs 20.48674027621746±0.001) - same numeric-divergence class as the already-deselected wav2vec2 test (gotcha 170), now confirmed for real on riscv64 hardware rather than inferred. Deselected with `--deselect .../test_transformers.py::TestWhisper::test_transformers_whisper_align` (no bracket = all 3 parametrizations) and pushed as a fourth commit. PR #873 open, re-running CI now - not yet confirmed green. Both the cpuinfo _GNU_SOURCE patch and the ENABLE_CPU_DISPATCH=OFF fix are confirmed working on real riscv64 hardware (build+wheel succeed); only test selection remains open. Fourth real riscv64 CI run (33859295079) revealed that fourth-commit deselect was actually a no-op: pytest --deselect requires an exact nodeid match, and the unbracketed function name never matches parametrized nodeids (test_names0/1/2-cpu), so all 3 whisper_align cases ran again and failed identically (~0.004 outside tolerance) - confirmed straight from the CI log (158 passed, 3 failed, 8783s test time). The job''s overall conclusion showed as `cancelled` rather than `failure` because this coincided almost to the second with the 180-minute timeout-minutes wall (job ran 3h0m47s) - a race between the natural pytest failure and the timeout, not a concurrency-cancel or manual cancel (checked via `gh run list`/`gh run view --log`, no superseding push in that window). Fixed with a fifth commit (863644151): three separate --deselect flags with the correct bracketed nodeids (test_names0/1/2-cpu), plus timeout-minutes 180->240 for headroom since 180 left ~0 margin even before this bug (other repo workflows use up to 240-720 for large builds). Pushed; CI re-queued (run picking up now), not yet confirmed green. Fifth real riscv64 CI run (33878204120, headSha 863644151) still failed the same way: the wav2vec2 test that''s supposed to be deselected ran and PASSED, and all 3 whisper_align parametrizations ran and FAILED again (168 items collected/run total, no ''N deselected'' anywhere in the summary) - so bracketing the nodeid wasn''t the real bug. Root cause (matches this skill''s own gotcha 14 and the nested note under gotcha 111/jpype): pytest reports collected nodeids relative to its rootdir (/project/python here, from pyproject.toml), not relative to the invocation cwd or the absolute test path given on the command line - all 4 --deselect args used the {project}/python/tests/... absolute form, which never equals the rootdir-relative tests/... nodeid pytest actually matches against, so every deselect silently matched zero tests regardless of cwd. Verified the mechanism directly with a local pytest 8.4.2 repro (rootdir + pyproject.toml, invoked from an unrelated cwd): the absolute-path form left both parametrized cases failing with 0 deselected, the rootdir-relative tests/... form correctly reported ''2 deselected''. Fixed with a sixth commit (227b8e20f): switched all 4 --deselect nodeids from {project}/python/tests/... to the rootdir-relative tests/... form. Pushed; CI re-queued again, not yet confirmed green. Sixth real riscv64 CI run (33916551244, headSha 227b8e20f) confirmed the gotcha-14 deselect fix works for real ("157 passed, 7 skipped, 4 deselected"), but the job was CANCELLED at exactly the 240-minute timeout-minutes wall (started 20:30:35Z, cancelled 00:30:57Z), mid-way through testing the third of three tested interpreters. cibuildwheel runs the full CIBW_TEST_COMMAND once per tested interpreter (cp312/cp313/cp314; cp314t is build-only) - each a from-scratch HF Hub model download+conversion+inference pass. Measured from the log: cp312''s pass took 1h50m19s with a cold HF cache, cp313''s took 52m49s with a warm one; cp314''s was cancelled 19m37s in at 46% progress. Extrapolating from cp313''s warm-cache pace, total end-to-end need is ~4.5h - only ~30min over the 240m budget it just missed. Fixed with a seventh commit (d4ed03aa5): timeout-minutes 240->480 for real margin against a slow HF Hub or a cold cache, still far below this repo''s own budget for comparably large multi-target builds (torch''s build_wheels job: 1440). Pushed; CI re-queued again, not yet confirmed green. timeout-minutes raised 240->480 fixed the cutoff; gotcha-14 deselect fix confirmed working. All CI checks green (build, gpl_sources, setup, commit-message, patch checks, publish dry-run) as of 2026-09-06. Ready for review. Issue #1155 created and linked to PR #873 (was previously missing). Publish (re-)dispatched on main.'
