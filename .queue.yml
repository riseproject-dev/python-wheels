  notes: '16 Linux wheels upstream (abi: cp310,cp311,cp312,cp313,cp314,cp39); no riscv64 on PyPI or pypi.riseproject.dev. Parked as disproportionate in scope, not Bazel-blocked (unlike jaxlib/PR #526): confirmed the real PyPI release wheel is built by tools/release/build_delivery_linux.sh''s build_python(), plain `cmake -DBUILD_PYTHON=ON` against upstream''s own CMakeLists.txt, matching .github/workflows/amd64_linux_cmake_python.yml -- no Bazel involved despite the repo also carrying a bazel/ tree. But BUILD_DEPS=ON (forced whenever BUILD_PYTHON is on) FetchContent-builds abseil, protobuf, Eigen3, re2, Boost, SoPlex, SCIP, and the 4-library COIN-OR suite (CoinUtils/Osi/Clp/Cgl/Cbc), plus HiGHS and PDLP and BOP, on top of compiling ortools'' own large C++ core (CP-SAT, routing) and its SWIG Python bindings -- over a dozen independently-large C++ projects in one build. abseil/protobuf are proven on riscv64 in this repo (grpcio-tools, chromadb, ctranslate2) and HiGHS is already published standalone as highspy, but SCIP/SoPlex/Boost-as-a-solver-dep/COIN-OR have zero riscv64 precedent here. Weighed against this repo''s own largest build to date (libclang: ~10h from-scratch LLVM/Clang compile, explicitly logged as the largest so far), a build FetchContenting that much additional unproven C++ on top of a comparably-sized core -- each new dependency a plausible source of its own multi-hour fix/rebuild cycle -- reads as a multi-day effort even with zero hard architectural blocker, matching this task''s own parking criterion. Folded into the skill as gotcha 214 (feasibility-and-triage.md). No worktree/branch opened -- the scope call was fully resolvable read-only against the real upstream release script and CMakeLists.txt plus this repo''s own git history, no checkout needed.'
