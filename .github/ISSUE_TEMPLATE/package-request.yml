name: Package build request
description: Request a new Python package be built for riscv64
title: "<name> riscv64 support"
labels:
  - wheel
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a package! Before filing, please check that it isn't already covered:
        - [Supported packages](https://pypi.riseproject.dev/python-wheels/packages/) — if listed as "deprecated", upstream now ships riscv64 wheels themselves.

        The more fields you fill in, the faster a build workflow can be put together. See the [Development Guide](https://pypi.riseproject.dev/python-wheels/development.html) for how these map to a build workflow.
  - type: input
    id: package-name
    attributes:
      label: Package name (on PyPI)
      description: The distribution name as it appears on PyPI.
      placeholder: e.g. numpy
    validations:
      required: true
  - type: input
    id: source-repository
    attributes:
      label: Source repository
      description: Upstream source repository URL.
      placeholder: e.g. https://github.com/numpy/numpy
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version(s) requested
      description: Specific release tag(s) you need. "Latest" is fine if unsure.
      placeholder: "a.b.c, a.b.d, a.e.f, d.g.h, etc."
  - type: textarea
    id: why-needed
    attributes:
      label: Why is this needed?
      description: Your use case, and any downstream packages/projects this unblocks.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Known riscv64 build issues, required patches, GPL-linked libraries, or anything else useful.
