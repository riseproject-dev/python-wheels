name: Upstream RISC-V Python wheels
description: Request investigation and upstream integration of Linux RISC-V wheels.
title: "[upstreaming] "
labels: ["upstreaming-request"]
body:
  - type: input
    id: upstream-repository
    attributes:
      label: Upstream repository
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: textarea
    id: distributions
    attributes:
      label: PyPI distributions
      description: One distribution per line, with import names if known.
    validations:
      required: true
  - type: input
    id: target-branch
    attributes:
      label: Upstream target branch
      description: Optional. Leave blank for investigation.
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional notes
      description: Optional recipes, patches, dependencies, optimization needs, runner constraints, contribution rules, or contact.
    validations:
      required: false
