version: 2
updates:
  - package-ecosystem: "github-actions" 
    directory: "/"
    schedule:
      interval: "weekly"
    # Setup runtime follows the reviewed compiler release, tracked by gomod.
    # Updating only generated setup action pins would produce stale locks.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      github-actions:
        patterns:
          - "*"
  # The existing github-actions block covers every upstreaming-*.yml,
  # including the generated locks. Runtime packages need their own inventory.
  - package-ecosystem: "npm"
    directory: "/upstreaming/dependencies"
    schedule:
      interval: "weekly"
    groups:
      upstreaming-runtime:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/upstreaming/dependencies"
    schedule:
      interval: "weekly"
    groups:
      upstreaming-compiler:
        patterns:
          - "github.com/github/gh-aw"
  - package-ecosystem: "pip"
    directory: "/upstreaming"
    schedule:
      interval: "weekly"
