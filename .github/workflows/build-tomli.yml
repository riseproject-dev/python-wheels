---
# This workflow is based on the `binary-wheels` job in:
# https://github.com/hukkin/tomli/blob/2.4.1/.github/workflows/tests.yaml
#
# tomli publishes mypyc-compiled wheels for common platforms but not riscv64.
# The compiled build is upstream's own opt-in path: scripts/use_setuptools.py
# swaps the flit_core backend to setuptools + mypy[mypyc], and setup.py compiles
# when TOMLI_USE_MYPYC=1.
name: Build tomli wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tomli.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tomli.yml'
      - 'docs/packages/tomli.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tomli.yml'
      - 'docs/packages/tomli.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tomli
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tomli ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # mypyc emits per-interpreter (non-abi3) wheels, one build each.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      TOMLI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tomli ${{ env.TOMLI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: hukkin/tomli
          ref: ${{ env.TOMLI_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Upstream's own backend swap: flit_core -> setuptools + mypy[mypyc].
      - name: Switch build backend to setuptools + mypyc
        run: |
          uv pip install -r scripts/requirements.txt
          python scripts/use_setuptools.py

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py reads TOMLI_USE_MYPYC=1 to compile via mypyc.
          CIBW_ENVIRONMENT_PASS_LINUX: TOMLI_USE_MYPYC
          TOMLI_USE_MYPYC: '1'
          # Upstream's wheel test: run the bundled unittest suite.
          CIBW_TEST_COMMAND: python -m unittest discover --start-directory {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tomli-${{ env.TOMLI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tomli ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tomli-${{ matrix.version }}-*-manylinux_riscv64
