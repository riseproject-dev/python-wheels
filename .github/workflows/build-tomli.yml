---
# This workflow is based on the `binary-wheels` job in:
# https://github.com/hukkin/tomli/blob/2.4.1/.github/workflows/tests.yaml
#
# tomli publishes mypyc-compiled wheels for common platforms but not riscv64.
# The compiled build is upstream's own opt-in path: scripts/use_setuptools.py
# swaps the flit_core backend to setuptools + mypy[mypyc], and setup.py compiles
# when TOMLI_USE_MYPYC=1.
name: Build tomli wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tomli version to build (git tag, e.g. 2.4.1)'
        required: true
        default: '2.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-tomli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default there.
  TOMLI_VERSION: ${{ inputs.version || '2.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tomli ${{ inputs.version || '2.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        # mypyc emits per-interpreter (non-abi3) wheels, one build each.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout tomli ${{ env.TOMLI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: hukkin/tomli
          ref: ${{ env.TOMLI_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Upstream's own backend swap: flit_core -> setuptools + mypy[mypyc].
      - name: Switch build backend to setuptools + mypyc
        run: |
          uv pip install -r scripts/requirements.txt
          python scripts/use_setuptools.py

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py reads TOMLI_USE_MYPYC=1 to compile via mypyc.
          CIBW_ENVIRONMENT_PASS_LINUX: TOMLI_USE_MYPYC
          TOMLI_USE_MYPYC: '1'
          # Upstream's wheel test: run the bundled unittest suite.
          CIBW_TEST_COMMAND: python -m unittest discover --start-directory {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tomli-${{ env.TOMLI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tomli ${{ inputs.version || '2.4.1' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: tomli-${{ env.TOMLI_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
