---
name: Build ncls wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ncls.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ncls.yml'
      - 'docs/packages/ncls.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ncls.yml'
      - 'docs/packages/ncls.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ncls
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ncls ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ncls
      version: ${{ matrix.version }}
      # musllinux is dropped: numpy (a runtime dep) has no musllinux_riscv64 wheel
      # on either PyPI or pypi.riseproject.dev, only manylinux_riscv64 ones, so the
      # test-install step's glibc-built numpy wheel fails to import under musl libc
      # (`ModuleNotFoundError: No module named 'numpy._core._multiarray_umath'`).
      # This is an accepted outcome (gotcha 221), not a build problem to work around.
      repository: pyranges/ncls
      ref: 1eca944791fcc71940617c19e00789d3a28573ac
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream never pushed a git tag for 0.0.71 (its last tag is 0.0.63); pin the
      # release commit instead, whose tree is byte-identical to the 0.0.71 PyPI sdist.
      # Update alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy (a runtime dep) ships no riscv64 wheel on public PyPI; ours is what
      # the test env installs. PIP_ONLY_BINARY keeps pip from building it from source.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: pytest
      # tests/ shadows the installed wheel's compiled ncls.src.* submodules with the
      # checkout's pure-Cython-source package if run from the checkout root.
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import ncls.src.ncls as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests -q
      timeout-minutes: 30

  publish:
    name: Publish ncls ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ncls-${{ matrix.version }}-*riscv64
