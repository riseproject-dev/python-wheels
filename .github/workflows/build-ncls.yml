---
name: Build ncls wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ncls.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ncls.yml'
      - 'docs/packages/ncls.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ncls.yml'
      - 'docs/packages/ncls.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream never pushed a git tag for 0.0.71 (its last tag is 0.0.63); pin the
  # release commit instead, whose tree is byte-identical to the 0.0.71 PyPI sdist.
  # Update alongside NCLS_VERSION.
  NCLS_REF: 1eca944791fcc71940617c19e00789d3a28573ac
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ncls
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ncls ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      NCLS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ncls ${{ env.NCLS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyranges/ncls
          ref: ${{ env.NCLS_REF }}
          persist-credentials: false

      # musllinux is dropped: numpy (a runtime dep) has no musllinux_riscv64 wheel
      # on either PyPI or pypi.riseproject.dev, only manylinux_riscv64 ones, so the
      # test-install step's glibc-built numpy wheel fails to import under musl libc
      # (`ModuleNotFoundError: No module named 'numpy._core._multiarray_umath'`).
      # This is an accepted outcome (gotcha 221), not a build problem to work around.
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy (a runtime dep) ships no riscv64 wheel on public PyPI; ours is what
          # the test env installs. PIP_ONLY_BINARY keeps pip from building it from source.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest
          # tests/ shadows the installed wheel's compiled ncls.src.* submodules with the
          # checkout's pure-Cython-source package if run from the checkout root.
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import ncls.src.ncls as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest tests -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ncls-${{ env.NCLS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ncls ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ncls-${{ matrix.version }}-*riscv64
