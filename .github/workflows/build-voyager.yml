---
# This workflow is based on: https://github.com/spotify/voyager/blob/v2.1.0/.github/workflows/all.yml
name: Build voyager wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/voyager.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-voyager.yml'
      - 'docs/packages/voyager.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-voyager.yml'
      - 'docs/packages/voyager.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: voyager
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build voyager ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # The wheel is cp312-abi3 whichever interpreter builds it, and building it
          # on cp314 fails cibuildwheel's abi3audit (ABI violations from symbols the
          # 3.14 headers expose), so build it once on cp312 and let the newer
          # interpreters re-test that one wheel via find_compatible_wheel.
          - tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          # Free-threaded builds get a per-interpreter wheel.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # LICENSE is copied alongside README.md so setuptools' default glob ships it; upstream's
    # wheels carry no licence text.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "voyager"
      version: "${{ matrix.version }}"
      repository: "spotify/voyager"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      pre-build: |-
        cp README.md LICENSE python/
        cp -r cpp python/cpp
      cibw-package-dir: "python"
      cibw-build: "${{ matrix.build }}"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy
      # The rest of dev-requirements.txt is lint/docs/benchmark tooling the tests never import.
      cibw-test-requires: "pytest numpy"
      cibw-test-command: "pytest {package}/tests -x"

  publish:
    name: Publish voyager ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: voyager-${{ matrix.version }}-*-manylinux_riscv64
