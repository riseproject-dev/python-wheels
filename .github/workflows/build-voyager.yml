---
# This workflow is based on: https://github.com/spotify/voyager/blob/v2.1.0/.github/workflows/all.yml
name: Build voyager wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/voyager.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-voyager.yml'
      - 'docs/packages/voyager.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-voyager.yml'
      - 'docs/packages/voyager.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: voyager
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build voyager ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      VOYAGER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout voyager v${{ env.VOYAGER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: spotify/voyager
          ref: v${{ env.VOYAGER_VERSION }}
          persist-credentials: false

      # LICENSE is copied alongside README.md so setuptools' default glob ships it; upstream's
      # wheels carry no licence text.
      - name: Copy README, LICENSE and C++ sources into place
        run: |
          cp README.md LICENSE python/
          cp -r cpp python/cpp

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # The rest of dev-requirements.txt is lint/docs/benchmark tooling the tests never import.
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {package}/tests -x

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: voyager-${{ env.VOYAGER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish voyager ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: voyager-${{ matrix.version }}-*-manylinux_riscv64
