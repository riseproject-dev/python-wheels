---
# Based on upstream's own wheel build:
#   https://github.com/doronz88/sslpsk-pmd3/blob/v1.0.3/.github/workflows/python-publish-macos-and-linux.yml
name: Build sslpsk-pmd3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sslpsk-pmd3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sslpsk-pmd3.yml'
      - 'docs/packages/sslpsk-pmd3.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sslpsk-pmd3.yml'
      - 'docs/packages/sslpsk-pmd3.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sslpsk-pmd3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sslpsk-pmd3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sslpsk-pmd3"
      version: "${{ matrix.version }}"
      repository: "doronz88/sslpsk-pmd3"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        mkdir -p tests
        cat > tests/test_psk.py <<'EOF'
        import socket
        import ssl
        import threading

        import sslpsk_pmd3

        PSK = bytes.fromhex('c033f52671c61c8128f7f8a40be88038bcf2b07a6eb3095c36e3759f0cf40837')
        IDENTITY = b'client1'
        HINT = b'server-hint'


        def context(protocol):
            ctx = sslpsk_pmd3.SSLPSKContext(protocol)
            ctx.maximum_version = ssl.TLSVersion.TLSv1_2
            ctx.set_ciphers('PSK')
            return ctx


        server_ctx = context(ssl.PROTOCOL_TLS_SERVER)
        server_ctx.hint = HINT
        server_ctx.psk = lambda identity: PSK if identity == IDENTITY else b''

        seen_hints = []
        client_ctx = context(ssl.PROTOCOL_TLS_CLIENT)
        client_ctx.check_hostname = False
        client_ctx.verify_mode = ssl.CERT_NONE
        client_ctx.psk = lambda hint: seen_hints.append(hint) or (PSK, IDENTITY)

        server_raw, client_raw = socket.socketpair()
        server_errors = []


        def serve():
            try:
                with server_ctx.wrap_socket(server_raw, server_side=True) as conn:
                    conn.sendall(conn.recv(64).upper())
            except Exception as exc:
                server_errors.append(exc)


        thread = threading.Thread(target=serve)
        thread.start()
        with client_ctx.wrap_socket(client_raw) as conn:
            cipher, version, _ = conn.cipher()
            conn.sendall(b'abcdefghi')
            reply = conn.recv(64)
        thread.join()

        assert not server_errors, server_errors
        assert reply == b'ABCDEFGHI', reply
        assert version == 'TLSv1.2' and 'PSK' in cipher, (cipher, version)
        assert seen_hints == [HINT], seen_hints
        print(ssl.OPENSSL_VERSION, sslpsk_pmd3.sslpsk._sslpsk.__name__, cipher, version, 'ok')
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # openssl-dev, not upstream's libressl-dev: the extension must link the OpenSSL that Python's _ssl uses.
      cibw-before-all-linux: "yum install -y openssl-devel || apk add --upgrade openssl-dev"
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SSLPSK_PMD3=${{ matrix.version }}"
      # The extension sets callbacks on the SSL* owned by Python's _ssl, so a private libssl copy of another version silently breaks PSK.
      cibw-repair-wheel-command-linux: "auditwheel repair --exclude libssl.so.3 --exclude libcrypto.so.3 -w {dest_dir} {wheel}"
      cibw-test-command: "python {project}/tests/test_psk.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SSLPSK_PMD3_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout sslpsk-pmd3 v${{ env.SSLPSK_PMD3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: doronz88/sslpsk-pmd3
          ref: v${{ env.SSLPSK_PMD3_VERSION }}
          persist-credentials: false

      # Upstream's suite calls ssl.wrap_socket, gone since Python 3.12; this is its client/server echo test via SSLPSKContext.
      - name: Stage smoke test
        run: |
          mkdir -p tests
          cat > tests/test_psk.py <<'EOF'
          import socket
          import ssl
          import threading

          import sslpsk_pmd3

          PSK = bytes.fromhex('c033f52671c61c8128f7f8a40be88038bcf2b07a6eb3095c36e3759f0cf40837')
          IDENTITY = b'client1'
          HINT = b'server-hint'


          def context(protocol):
              ctx = sslpsk_pmd3.SSLPSKContext(protocol)
              ctx.maximum_version = ssl.TLSVersion.TLSv1_2
              ctx.set_ciphers('PSK')
              return ctx


          server_ctx = context(ssl.PROTOCOL_TLS_SERVER)
          server_ctx.hint = HINT
          server_ctx.psk = lambda identity: PSK if identity == IDENTITY else b''

          seen_hints = []
          client_ctx = context(ssl.PROTOCOL_TLS_CLIENT)
          client_ctx.check_hostname = False
          client_ctx.verify_mode = ssl.CERT_NONE
          client_ctx.psk = lambda hint: seen_hints.append(hint) or (PSK, IDENTITY)

          server_raw, client_raw = socket.socketpair()
          server_errors = []


          def serve():
              try:
                  with server_ctx.wrap_socket(server_raw, server_side=True) as conn:
                      conn.sendall(conn.recv(64).upper())
              except Exception as exc:
                  server_errors.append(exc)


          thread = threading.Thread(target=serve)
          thread.start()
          with client_ctx.wrap_socket(client_raw) as conn:
              cipher, version, _ = conn.cipher()
              conn.sendall(b'abcdefghi')
              reply = conn.recv(64)
          thread.join()

          assert not server_errors, server_errors
          assert reply == b'ABCDEFGHI', reply
          assert version == 'TLSv1.2' and 'PSK' in cipher, (cipher, version)
          assert seen_hints == [HINT], seen_hints
          print(ssl.OPENSSL_VERSION, sslpsk_pmd3.sslpsk._sslpsk.__name__, cipher, version, 'ok')
          EOF

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sslpsk-pmd3-${{ env.SSLPSK_PMD3_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Test against the runner's own Python and OpenSSL
        if: matrix.python == 'cp312' && matrix.platform == 'manylinux'
        run: |
          python3 -m zipfile -e wheelhouse/*.whl "$RUNNER_TEMP/site"
          PYTHONPATH="$RUNNER_TEMP/site" python3 tests/test_psk.py

  publish:
    name: Publish sslpsk-pmd3 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sslpsk-pmd3-${{ matrix.version }}-*riscv64
