---
# This workflow is based on the `test-builds` job of
# https://github.com/deeptools/pyBigWig/blob/0.3.25/.github/workflows/build.yml
name: Build pybigwig wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybigwig.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybigwig.yml'
      - 'docs/packages/pybigwig.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybigwig.yml'
      - 'docs/packages/pybigwig.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybigwig
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pybigwig ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pybigwig"
      version: "${{ matrix.version }}"
      repository: "deeptools/pyBigWig"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-fetch-depth: 0

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No libcurl-devel in the build image, so setup.py's curl-config probe
      # fails and remote-file support compiles out, matching upstream's own
      # published wheels (built the same way, also without libcurl-devel).
      # testNumpyValues opens the same remote URL directly (not gated behind
      # TestRemote), so it needs deselecting too.
      cibw-test-requires: "numpy pytest"
      cibw-test-command: "pytest -k \"not TestRemote and not testNumpyValues\" --pyargs pyBigWigTest.test"

  publish:
    name: Publish pybigwig ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pybigwig-${{ matrix.version }}-*-manylinux_riscv64
