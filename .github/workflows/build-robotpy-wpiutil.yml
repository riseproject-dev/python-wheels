---
# Upstream builds every mostrobotpy meson subproject in one job (dist.yml's
# build-meson, `python -m devtools ci build-meson-wheels`) on the native host per
# Python version; this narrows that to robotpy-wpiutil alone via cibuildwheel, against
# the already-published robotpy-native-wpiutil wheel (build-robotpy-native-wpiutil.yml).
name: Build robotpy-wpiutil wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/robotpy-wpiutil.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-robotpy-wpiutil.yml'
      - 'docs/packages/robotpy-wpiutil.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-robotpy-wpiutil.yml'
      - 'docs/packages/robotpy-wpiutil.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: robotpy-wpiutil
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build robotpy-wpiutil ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # subprojects/robotpy-wpiutil has no licence of its own, so upstream's wheel ships none.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "robotpy-wpiutil"
      version: "${{ matrix.version }}"
      repository: "robotpy/mostrobotpy"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: "cp LICENSE.md subprojects/robotpy-wpiutil/LICENSE.md"
      cibw-package-dir: "subprojects/robotpy-wpiutil"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # libwpiutil.so comes from the robotpy-native-wpiutil dependency, as upstream's wheel expects.
      cibw-repair-wheel-command: "auditwheel repair -w {dest_dir} {wheel} --exclude libwpiutil.so"
      cibw-test-requires: "pytest hatch-meson hatchling ninja semiwrap~=0.3.0"
      cibw-test-command: >
        pip install --no-build-isolation {package}/tests/cpp &&
        pytest {package}/tests

  publish:
    name: Publish robotpy-wpiutil ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: robotpy-wpiutil-${{ matrix.version }}-*-manylinux_riscv64
