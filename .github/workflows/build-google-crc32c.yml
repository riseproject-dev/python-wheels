---
# This workflow is based on: https://github.com/googleapis/google-cloud-python/blob/google-crc32c-v1.9.0/packages/google-crc32c/scripts/manylinux/build_on_centos.sh
name: Build google-crc32c wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/google-crc32c.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-google-crc32c.yml'
      - 'docs/packages/google-crc32c.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-google-crc32c.yml'
      - 'docs/packages/google-crc32c.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: google-crc32c
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build google-crc32c ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # googleapis/python-crc32c was archived after 1.8.0; the package now
    # lives in the google-cloud-python monorepo under per-package tags.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "google-crc32c"
      version: "${{ matrix.version }}"
      repository: "googleapis/google-cloud-python"
      ref: "google-crc32c-v${{ matrix.version }}"
      checkout-sparse-checkout: "packages/google-crc32c"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      cibw-package-dir: "packages/google-crc32c"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Build libcrc32c into the default prefix so setup.py's -lcrc32c resolves.
      # POLICY_VERSION_MINIMUM: the pinned crc32c still declares cmake_minimum 3.1.
      cibw-before-all-linux: >
        cmake -S {project}/packages/google-crc32c/google_crc32c -B /tmp/crc32c-build
        -DCMAKE_BUILD_TYPE=Release
        -DCRC32C_BUILD_TESTS=no
        -DCRC32C_BUILD_BENCHMARKS=no
        -DBUILD_SHARED_LIBS=yes
        -DCMAKE_POLICY_VERSION_MINIMUM=3.12
        &&
        cmake --build /tmp/crc32c-build --target install -j4
        &&
        ldconfig
      # Force the C extension; without this setup.py silently ships a pure-Python
      # wheel on any compile/link failure (gotcha 20).
      cibw-environment-linux: "CRC32C_PURE_PYTHON=0"
      cibw-test-requires: "pytest"
      cibw-test-command: >
        python -c "import google_crc32c; assert google_crc32c.implementation == 'c', google_crc32c.implementation" &&
        pytest -v {package}/tests

  publish:
    name: Publish google-crc32c ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: google-crc32c-${{ matrix.version }}-*-manylinux_riscv64
