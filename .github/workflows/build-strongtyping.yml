---
# This workflow is based on: https://github.com/FelixTheC/strongtyping/blob/v3.14.5/.github/workflows/python-publish.yml
name: Build strongtyping wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/strongtyping.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-strongtyping.yml'
      - 'docs/packages/strongtyping.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-strongtyping.yml'
      - 'docs/packages/strongtyping.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: strongtyping
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build strongtyping ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp314", "cp314t"]

    env:
      STRONGTYPING_VERSION: ${{ matrix.version }}

    steps:
      # The release workflow tags first and commits the version bump afterwards, so
      # the vX.Y.Z tag still reads the previous version; each commit below is the
      # one whose tree matches that version's PyPI sdist (3.14.5: "chore: bump
      # version to v3.14.5"; 3.14.6: the "updated project version to 3.14.6"
      # commit, no tag). Add a line for every new version in docs/packages/strongtyping.yaml.
      - name: Resolve source commit for ${{ env.STRONGTYPING_VERSION }}
        id: src
        run: |
          case "$STRONGTYPING_VERSION" in
            3.14.5) ref=0d92e98db40276615786220bb7f9d5534b5be2e4 ;;
            3.14.6) ref=bf4d8276a605bd99dbfe377f1a7d9b51c2f73f7a ;;
            *) echo "::error::No upstream commit recorded for strongtyping $STRONGTYPING_VERSION; add it to this case statement"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout FelixTheC/strongtyping ${{ env.STRONGTYPING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: FelixTheC/strongtyping
          ref: ${{ steps.src.outputs.ref }}
          persist-credentials: false

      - name: Check the checked-out source declares ${{ env.STRONGTYPING_VERSION }}
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)
          if [ "$declared" != "$STRONGTYPING_VERSION" ]; then
            echo "::error::pyproject.toml declares '$declared' but building $STRONGTYPING_VERSION"; exit 1
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest pytest-asyncio
          CIBW_TEST_SOURCES: tests
          # Upstream skips wheel tests and runs pytest from the source tree; test_skills.py only inspects that tree.
          CIBW_TEST_COMMAND: >-
            python -c "import strongtyping.strong_typing_utils as m; assert m.__file__.endswith('.so'), m.__file__"
            && python -m pytest tests --ignore=tests/test_skills.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: strongtyping-${{ env.STRONGTYPING_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish strongtyping ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: strongtyping-${{ matrix.version }}-*-manylinux_riscv64
