---
# This replays upstream's own `build_wheels` job
# (https://github.com/googlefonts/ots-python/blob/v9.2.0/.github/workflows/ci.yml), narrowed to
# Linux. setup.py builds a single 'ots-sanitize' executable via meson+ninja (setup.cfg's
# [download] section pins the khaledhosny/ots C++ source tarball it fetches) and bundles it as
# package data, so bdist_wheel's py2.py3-none override makes one wheel usable by every
# interpreter: building once on cp312 is enough.
name: Build opentype-sanitizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/opentype-sanitizer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-opentype-sanitizer.yml'
      - 'docs/packages/opentype-sanitizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opentype-sanitizer.yml'
      - 'docs/packages/opentype-sanitizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: opentype-sanitizer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build opentype-sanitizer ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: opentype-sanitizer
      version: ${{ matrix.version }}
      repository: googlefonts/ots-python
      ref: v${{ matrix.version }}
      artifact-tag: py3-none-manylinux_riscv64
      checkout-submodules: recursive
      checkout-fetch-depth: 0
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # ots-python ships a repo-root build.py (its meson+ninja driver). cibuildwheel's
      # default build-frontend ("build") runs `python -m build /project --wheel` with
      # cwd=/project, so `python -m` puts /project at sys.path[0] and build.py shadows
      # the real `build` package before it's ever imported (gotcha 102). Force the
      # "pip" frontend instead: `python -m pip wheel` isn't shadowed and runs the PEP 517
      # hooks from a clean sys.path, matching how upstream's own CI invokes cibuildwheel.
      cibw-build-frontend: "pip"
      # setuptools 81 dropped mkpath()'s dry_run keyword, which setup.py's download command still passes (gotcha 256).
      cibw-before-all-linux: "echo 'setuptools<81' > /setuptools-constraint.txt"
      cibw-environment: >-
        PIP_CONSTRAINT=/setuptools-constraint.txt
        PIP_BUILD_CONSTRAINT=/setuptools-constraint.txt
      # One py2.py3-none wheel is built on cp312 and reused on every other interpreter.
      cibw-build: "cp312-*"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {project}/tests"
      timeout-minutes: 120

  publish:
    name: Publish opentype-sanitizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: opentype-sanitizer-${{ matrix.version }}-*-manylinux_riscv64
