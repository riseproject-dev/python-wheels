---
# This replays upstream's own `build_wheels` job
# (https://github.com/googlefonts/ots-python/blob/v9.2.0/.github/workflows/ci.yml), narrowed to
# Linux. setup.py builds a single 'ots-sanitize' executable via meson+ninja (setup.cfg's
# [download] section pins the khaledhosny/ots C++ source tarball it fetches) and bundles it as
# package data, so bdist_wheel's py2.py3-none override makes one wheel usable by every
# interpreter: building once on cp312 is enough.
name: Build opentype-sanitizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/opentype-sanitizer.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-opentype-sanitizer.yml'
      - 'docs/packages/opentype-sanitizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opentype-sanitizer.yml'
      - 'docs/packages/opentype-sanitizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: opentype-sanitizer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build opentype-sanitizer ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      OPENTYPE_SANITIZER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ots-python v${{ env.OPENTYPE_SANITIZER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: googlefonts/ots-python
          ref: v${{ env.OPENTYPE_SANITIZER_VERSION }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # One py2.py3-none wheel is built on cp312 and reused on every other interpreter.
          CIBW_BUILD: "cp312-*"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: opentype-sanitizer-${{ env.OPENTYPE_SANITIZER_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish opentype-sanitizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: opentype-sanitizer-${{ matrix.version }}-*-manylinux_riscv64
