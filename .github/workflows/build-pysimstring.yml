---
# pysimstring carries no upstream CI wheel-building workflow (its tests.yml/
# test-build.yml/release.yml only run tests and invoke cibuildwheel on
# macOS/Windows; manylinux wheels come from the default `ubuntu-latest` build
# with no CIBW_ARCHS override), so this plain cibuildwheel build has nothing
# to narrow. The SWIG C++ wrapper (export_wrap.cpp) ships pre-generated in the
# sdist/checkout, so the build needs no SWIG at build time.
name: Build pysimstring wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pysimstring.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pysimstring.yml'
      - 'docs/packages/pysimstring.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pysimstring.yml'
      - 'docs/packages/pysimstring.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pysimstring
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pysimstring ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYSIMSTRING_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pysimstring v${{ env.PYSIMSTRING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: percevalw/simstring
          ref: v${{ env.PYSIMSTRING_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import pysimstring._simstring as m; assert m.__file__.endswith('.so'), m.__file__" &&
            cp {project}/tests/test_simstring.py . &&
            pytest test_simstring.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysimstring-${{ env.PYSIMSTRING_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pysimstring ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pysimstring-${{ matrix.version }}-*-manylinux_riscv64
