---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/mborgerson/xdia/blob/v0.1.1/.github/workflows/main.yml
#   https://github.com/mborgerson/blink/blob/dev-98f95e8/.github/workflows/build.yml
name: Build pyxdia wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyxdia.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxdia.yml'
      - 'docs/packages/pyxdia.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxdia.yml'
      - 'docs/packages/pyxdia.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyxdia
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyxdia ${{ matrix.version }} cp312-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYXDIA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout xdia ${{ env.PYXDIA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mborgerson/xdia
          ref: v${{ env.PYXDIA_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the blink release setup.py pins
        id: blink
        run: echo "ref=$(sed -n 's/^ *blink_version = "\(.*\)"$/\1/p' pyxdia/setup.py)" >> "$GITHUB_OUTPUT"

      - name: Checkout blink ${{ steps.blink.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mborgerson/blink
          ref: ${{ steps.blink.outputs.ref }}
          path: blink
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: pyxdia
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream publishes no linux-riscv64 blink release for setup.py to download, so build it the way that release is built.
          CIBW_BEFORE_ALL: >-
            cd {project}/blink &&
            ./configure --prefix=/tmp/blink-dist &&
            make -j$(nproc) &&
            make install &&
            mkdir -p {package}/pyxdia/bin &&
            cp /tmp/blink-dist/bin/blink {package}/pyxdia/bin/blink &&
            cp LICENSE {package}/pyxdia/bin/blink.LICENSE.txt
          CIBW_TEST_COMMAND: PDB_TEST_FILES={project}/tests python -m unittest discover -v -s {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyxdia-${{ env.PYXDIA_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyxdia ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyxdia-${{ matrix.version }}-*riscv64
