---
# This workflow is based on: https://github.com/awslabs/s3-connector-for-pytorch/blob/v1.5.0/.github/workflows/wheels.yml
name: Build s3torchconnectorclient wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/s3torchconnectorclient.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-s3torchconnectorclient.yml'
      - 'docs/packages/s3torchconnectorclient.yaml'
      - 'patches/s3torchconnectorclient/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-s3torchconnectorclient.yml'
      - 'docs/packages/s3torchconnectorclient.yaml'
      - 'patches/s3torchconnectorclient/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: s3torchconnectorclient
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build s3torchconnectorclient ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "s3torchconnectorclient"
      version: "${{ matrix.version }}"
      repository: "awslabs/s3-connector-for-pytorch"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/s3torchconnectorclient/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-crt-licenses.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        project="${1:?usage: collect-crt-licenses.sh <project-dir>}"
        repo_root="$(dirname "$project")"
        cp "$repo_root/LICENSE" "$project/LICENSE"
        cp "$repo_root/NOTICE" "$project/NOTICE"
        cargo fetch --manifest-path "$project/Cargo.toml"
        crt_sys_src="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -mindepth 2 -maxdepth 2 -type d -name 'mountpoint-s3-crt-sys-*' | head -1)"
        for lib in aws-lc s2n-tls aws-c-common aws-c-cal aws-c-io aws-c-compression aws-c-http aws-c-sdkutils aws-c-auth aws-checksums aws-c-s3; do
          lib_license="$(find "$crt_sys_src/crt/$lib" -maxdepth 1 -name 'LICENSE*' | head -1)"
          cp "$lib_license" "$project/LICENSE.$lib"
        done
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "s3torchconnectorclient"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The image ships no Rust toolchain for the setuptools-rust/pyo3 extension; rustup
      # provisions a native riscv64gc-unknown-linux-gnu one (gotcha 10). fuse/fuse-devel and
      # clang/clang-devel (libclang for mountpoint-s3-crt-sys's bindgen) match upstream's own
      # manylinux_2_28 before-all, minus its gcc-toolset, which this image's own gcc replaces.
      cibw-before-all-linux: "dnf -y install fuse fuse-devel clang clang-devel && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-before-build: "bash collect-crt-licenses.sh {project}/s3torchconnectorclient"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Drops the four CI_*-prefixed integration/e2e commands from upstream's own
      # test-command list: they need real AWS S3 buckets this CI has no credentials for.
      # The client's own unit tests and the connector's own exercise the "mock" S3 client
      # feature instead, so neither needs network access.
      cibw-test-requires: "./s3torchconnector[test]"
      # PyPI's newest Pillow (the client's own test extra) is sdist-only on riscv64, so take
      # the registry's wheel. The container does not inherit the runner's CI variable, so set
      # it to get Hypothesis' built-in ci profile (no per-example deadline) on slow runners.
      cibw-test-environment: "PIP_ONLY_BINARY=pillow CI=true"
      cibw-test-sources: "s3torchconnectorclient/python/tst s3torchconnector"
      cibw-test-command: "pytest -v s3torchconnectorclient/python/tst/unit && pytest -v s3torchconnector/tst/unit --ignore s3torchconnector/tst/unit/lightning --ignore s3torchconnector/tst/unit/dcp"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      S3TORCHCONNECTORCLIENT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: s3torchconnectorclient-${{ env.S3TORCHCONNECTORCLIENT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the vendored licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE", "NOTICE", "LICENSE.aws-lc",
                      "LICENSE.s2n-tls", "LICENSE.aws-c-common", "LICENSE.aws-c-cal",
                      "LICENSE.aws-c-io", "LICENSE.aws-c-compression", "LICENSE.aws-c-http",
                      "LICENSE.aws-c-sdkutils", "LICENSE.aws-c-auth", "LICENSE.aws-checksums",
                      "LICENSE.aws-c-s3"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("s3torchconnectorclient/_mountpoint_s3_client")
                         and n.endswith(".so") for n in names), whl
              licenses = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licenses == expected, f"{whl}: {sorted(licenses)}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish s3torchconnectorclient ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: s3torchconnectorclient-${{ matrix.version }}-*-manylinux_riscv64
