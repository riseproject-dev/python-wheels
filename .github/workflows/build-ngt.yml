---
# Based on upstream's own riscv64-adjacent recipe in python/pyproject.toml's
# [tool.cibuildwheel.linux] (no GitHub Actions wheel-building workflow exists
# upstream; this documented recipe is what their own baseline `ngt` wheels on
# PyPI are built from):
#   https://github.com/yahoojapan/NGT/blob/v2.8.1/python/pyproject.toml
name: Build ngt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ngt.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ngt.yml'
      - 'docs/packages/ngt.yaml'
      - 'patches/ngt/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ngt.yml'
      - 'docs/packages/ngt.yaml'
      - 'patches/ngt/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # kept in sync with the gpl_sources job below
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ngt
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ngt ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ngt"
      version: "${{ matrix.version }}"
      repository: "yahoojapan/NGT"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/ngt/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        mkdir -p python/ngt-src
        cp -r CMakeLists.txt LICENSE README.md VERSION bin lib samples utils python/ngt-src/

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf -y install cmake blas-devel lapack-devel && cd {package} && cmake -S ngt-src -B build-ci -DCMAKE_BUILD_TYPE=Release -DNGT_AVX_DISABLED=ON -DNGT_MARCH_NATIVE_DISABLED=ON && cmake --build build-ci --parallel $(nproc) && cp build-ci/lib/NGT/libngt.a . && cp build-ci/lib/NGT/defines.h build-ci/lib/NGT/version_defs.h ngt-src/lib/NGT/"
      cibw-environment-linux: "NGT_STATIC_LIBRARY_PATH=libngt.a NGT_INCLUDE_DIR=ngt-src/lib NGT_BUILD_STATIC=1 PIP_ONLY_BINARY=numpy"
      # Upstream ships no pytest suite for the Python bindings (only a
      # demo script with hardcoded relative paths to its sample
      # dataset); synthesize a round-trip create/insert/search smoke test.
      cibw-test-command: "python3 -c \"import ngtpy, random; ngtpy.create(path=b'/tmp/ngt-smoke-index', dimension=16, distance_type='L2'); idx = ngtpy.Index(b'/tmp/ngt-smoke-index'); vecs = [[random.random() for _ in range(16)] for _ in range(200)]; idx.batch_insert(vecs); idx.save(); results = idx.search(vecs[0], size=5); assert len(results) == 5, results; assert results[0][0] == 0, results; print('ngt smoke test ok')\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      NGT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ngt-${{ env.NGT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith("ngtpy") and n.endswith(".so") for n in names), (path, names)
              print(path, "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      NGT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # OpenMP (find_package(OpenMP REQUIRED)) links libgomp, which
      # auditwheel vendors into ngt.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ngt-${{ env.NGT_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish ngt ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ngt-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: ngt-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
