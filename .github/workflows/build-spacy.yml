---
# This workflow is based on: https://github.com/explosion/spaCy/blob/release-v3.8.16/.github/workflows/cibuildwheel.yml
# and the test invocation from .github/workflows/tests.yml
name: Build spacy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'spaCy version to build (e.g. 3.8.16)'
        required: true
        default: '3.8.16'
  pull_request:
    paths:
      - '.github/workflows/build-spacy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.8.16' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SPACY_VERSION: ${{ inputs.version || '3.8.16' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build spacy ${{ inputs.version || '3.8.16' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        # Upstream's [tool.cibuildwheel] skips `cp3??t-*`: no free-threaded wheels.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    steps:
      - name: Checkout spaCy ${{ env.SPACY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/spaCy
          ref: release-v${{ env.SPACY_VERSION }}
          persist-credentials: false

      # riscv64 has no wheels for the Cython deps (preshed, thinc, ...), so pip
      # compiles them; Cython 3.3.0 routes a typed __setitem__ key through
      # Py_ssize_t, so preshed's uint64 PreshMap keys >= 2**63 overflow.
      - name: Pin Cython below 3.3.0 for the from-source dependency builds
        run: echo 'cython<3.3.0' >> build-constraints.txt

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Replaces (not extends) pyproject's `environment`, so PIP_CONSTRAINT is
          # repeated here; the registry serves numpy, which PyPI lacks for riscv64.
          # pip >= 26 ignores PIP_CONSTRAINT inside isolated build environments —
          # PIP_BUILD_CONSTRAINT is the replacement, and it reaches nested builds.
          CIBW_ENVIRONMENT: >-
            PIP_CONSTRAINT=build-constraints.txt
            PIP_BUILD_CONSTRAINT=build-constraints.txt
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream leaves test-command empty and runs the suite from tests.yml
          # instead; this is that invocation. setup.cfg carries [tool:pytest], so
          # stage it as the rootdir of cibuildwheel's otherwise-empty test cwd.
          CIBW_TEST_SOURCES: setup.cfg
          CIBW_TEST_REQUIRES: pytest pytest-timeout mock hypothesis ml_datasets
          CIBW_TEST_COMMAND: python -m pytest --pyargs spacy -W error -W 'ignore:Core Pydantic V1:UserWarning:pydantic'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spacy-${{ env.SPACY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish spacy ${{ inputs.version || '3.8.16' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: spacy-${{ inputs.version || '3.8.16' }}-*-manylinux_riscv64
