---
# This workflow is based on: https://github.com/quadprog/quadprog/blob/v0.1.13/.github/workflows/release.yaml
name: Build quadprog wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'quadprog version to build (git tag without the leading v, e.g. 0.1.13)'
        required: true
        default: '0.1.13'
  pull_request:
    paths:
      - '.github/workflows/build-quadprog.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.13' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.13 there.
  QUADPROG_VERSION: ${{ inputs.version || '0.1.13' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build quadprog ${{ inputs.version || '0.1.13' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout quadprog v${{ env.QUADPROG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quadprog/quadprog
          ref: v${{ env.QUADPROG_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy (runtime) and scipy (test-only) have no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: pytest scipy
          CIBW_TEST_COMMAND: >-
            python -c "import quadprog; assert quadprog.__file__.endswith('.so'), quadprog.__file__" &&
            python -m pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: quadprog-${{ env.QUADPROG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish quadprog ${{ inputs.version || '0.1.13' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: quadprog-${{ inputs.version || '0.1.13' }}-*-manylinux_riscv64
