---
# This workflow is based on the `build-wheels` and `test` jobs of
# https://github.com/authentik-labs/kadmin-rs/blob/kadmin/version/0.7.4/.github/workflows/ci-python.yml
name: Build python-kadmin-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-kadmin-rs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-kadmin-rs.yml'
      - 'docs/packages/python-kadmin-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-kadmin-rs.yml'
      - 'docs/packages/python-kadmin-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-kadmin-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-kadmin-rs ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      KADMIN_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout kadmin-rs kadmin/version/${{ env.KADMIN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: authentik-labs/kadmin-rs
          ref: kadmin/version/${{ env.KADMIN_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # heimdal-devel is EPEL-only and manylinux ships no EPEL on riscv64, so
          # Heimdal is built from source into EPEL's /usr/lib64/heimdal prefix.
          # krb5-server/krb5-workstation are upstream's test-job packages (k5test).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
            dnf -y install krb5-devel clang-devel openssl-devel krb5-server krb5-workstation
            libxcrypt-devel ncurses-devel sqlite-devel libedit-devel bison flex perl texinfo &&
            curl -sSfL https://github.com/heimdal/heimdal/releases/download/heimdal-7.8.0/heimdal-7.8.0.tar.gz | tar xz -C /tmp &&
            cd /tmp/heimdal-7.8.0 &&
            CFLAGS="-O2 -fpermissive" LIBS=-lcrypt ./configure --prefix=/usr/lib64/heimdal
            --disable-static --without-x --without-openldap --disable-otp &&
            make -j$(nproc) && make install
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$HOME/.cargo/bin:$PATH"
            KADMIN_HEIMDAL_CLIENT_KRB5_CONFIG=/usr/lib64/heimdal/bin/krb5-config
            KADMIN_HEIMDAL_SERVER_KRB5_CONFIG=/usr/lib64/heimdal/bin/krb5-config
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: k5test@git+https://github.com/pythongssapi/k5test.git@349b79ecdff9a3ec00441c467511ff03e92450c9
          CIBW_TEST_SOURCES: python/tests
          CIBW_TEST_COMMAND: >-
            python -c "import kadmin, kadmin.kadmin as m; assert m.__file__.endswith('.so'), m.__file__;
            assert {'MitClient', 'MitServer', 'HeimdalClient', 'HeimdalServer'} <= set(dir(kadmin.KAdm5Variant))" &&
            python -m unittest --verbose python/tests/test_*.py

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-kadmin-rs-${{ env.KADMIN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-kadmin-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: python-kadmin-rs-${{ matrix.version }}-*-manylinux_riscv64
