---
# This workflow is based on the `linux` and `test` jobs of
# https://github.com/biscuit-auth/biscuit-python/blob/0.4.0/.github/workflows/test.yml
name: Build biscuit-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/biscuit-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-biscuit-python.yml'
      - 'docs/packages/biscuit-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-biscuit-python.yml'
      - 'docs/packages/biscuit-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: biscuit-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build biscuit-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: biscuit-python
      version: ${{ matrix.version }}
      repository: biscuit-auth/biscuit-python
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: pytest sphinx
      cibw-test-sources: biscuit_test.py docs
      cibw-test-command: >-
        python -c "import biscuit_auth.biscuit_auth as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v biscuit_test.py &&
        python -m sphinx -M doctest docs docs/_build
      timeout-minutes: 120

  publish:
    name: Publish biscuit-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: biscuit-python-${{ matrix.version }}-*-manylinux_riscv64
