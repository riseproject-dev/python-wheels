#
# This workflow is based on: https://github.com/run-ai/runai-model-streamer/blob/master/Makefile
# and https://github.com/run-ai/runai-model-streamer/blob/master/.devcontainer/Dockerfile
---
name: Build runai-model-streamer-azure wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/runai-model-streamer-azure.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-runai-model-streamer-azure.yml'
      - 'docs/packages/runai-model-streamer-azure.yaml'
      - 'patches/runai-model-streamer-azure/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-runai-model-streamer-azure.yml'
      - 'docs/packages/runai-model-streamer-azure.yaml'
      - 'patches/runai-model-streamer-azure/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  BAZEL_VERSION: '7.6.1'
  RULES_PYTHON_VERSION: '0.33.2'
  RULES_JAVA_VERSION: '7.6.5'
  OPENSSL_VERSION: '3.5.0'
  CURL_VERSION: '8.13.0'
  ZLIB_VERSION: '1.3.1'
  LIBXML2_VERSION: '2.13.5'
  AZURE_SDK_CPP_VERSION: 'azure-storage-blobs_12.15.0'
  AZURITE_VERSION: '3.37.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: runai-model-streamer-azure
      version: ${{ inputs.version }}

  bazel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Bootstrap bazel (riscv64)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Restore bazel binary
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bazel-bin
          key: bazel-${{ env.BAZEL_VERSION }}-manylinux_riscv64

      - name: Bootstrap bazel ${{ env.BAZEL_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bazel-bin
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e BAZEL_VERSION="${BAZEL_VERSION}" \
            -e RULES_PYTHON_VERSION="${RULES_PYTHON_VERSION}" \
            -e RULES_JAVA_VERSION="${RULES_JAVA_VERSION}" \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          dnf install -y --setopt=install_weak_deps=False java-21-openjdk-devel zip unzip
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export JAVA_HOME

          # rules_python 0.33.2 has no riscv64 PLATFORMS entry (bazelbuild/bazel#23018).
          mkdir -p /tmp/rules_python
          curl -fsSLo /tmp/rules_python.tar.gz "https://github.com/bazel-contrib/rules_python/releases/download/${RULES_PYTHON_VERSION}/rules_python-${RULES_PYTHON_VERSION}.tar.gz"
          tar -xzf /tmp/rules_python.tar.gz -C /tmp/rules_python --strip-components=1
          sed -i 's|fail("No platform declared for host OS {} on arch {}".format(os_name, arch))|return "x86_64-unknown-linux-gnu"|' \
            /tmp/rules_python/python/private/toolchains_repo.bzl

          # rules_java 7.x maps riscv64 to a stray-colon include path for jni_md.h.
          mkdir -p /tmp/rules_java
          curl -fsSLo /tmp/rules_java.tar.gz "https://github.com/bazelbuild/rules_java/releases/download/${RULES_JAVA_VERSION}/rules_java-${RULES_JAVA_VERSION}.tar.gz"
          tar -xzf /tmp/rules_java.tar.gz -C /tmp/rules_java
          sed -i 's|\[":include/linux"\]|["include/linux"]|g' /tmp/rules_java/toolchains/BUILD

          mkdir -p /tmp/bazel-src
          cd /tmp/bazel-src
          curl -fsSLo dist.zip "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-dist.zip"
          unzip -q dist.zip

          EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk \
            --override_module=rules_python=/tmp/rules_python \
            --override_module=rules_java=/tmp/rules_java" \
            bash ./compile.sh
          install -m 0755 output/bazel /work/bazel-bin/bazel
          SCRIPT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-riscv64
          path: bazel-bin/bazel
          if-no-files-found: error

  build_wheel:
    name: Build runai-model-streamer-azure ${{ matrix.version }} py3-none-manylinux_riscv64
    needs: [setup, bazel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      RUNAI_MODEL_STREAMER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout runai-model-streamer ${{ env.RUNAI_MODEL_STREAMER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: run-ai/runai-model-streamer
          ref: ${{ env.RUNAI_MODEL_STREAMER_VERSION }}
          path: runai-model-streamer
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch runai-model-streamer source
        working-directory: runai-model-streamer
        run: git apply -v ../python-wheels/patches/runai-model-streamer-azure/${{ env.RUNAI_MODEL_STREAMER_VERSION }}/*.patch

      - name: Download bazel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-riscv64
          path: bazel-bin

      - name: Restore OpenSSL, curl, zlib, libxml2 and the Azure SDK
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: runai-model-streamer-azure-deps-manylinux_2_39_riscv64-${{ hashFiles('python-wheels/.github/workflows/build-runai-model-streamer-azure.yml') }}

      - name: Build OpenSSL, curl, zlib, libxml2 and the Azure SDK
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps/riscv64-ssl deps/riscv64-curl deps/riscv64-zlib deps/riscv64-xml2 deps/riscv64-azure deps/licenses
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-ssl:/opt/riscv64-ssl" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-curl:/opt/riscv64-curl" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-zlib:/opt/riscv64-zlib" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-xml2:/opt/riscv64-xml2" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-azure:/opt/riscv64-azure" \
            -w /tmp \
            -e OPENSSL_VERSION="${OPENSSL_VERSION}" \
            -e CURL_VERSION="${CURL_VERSION}" \
            -e ZLIB_VERSION="${ZLIB_VERSION}" \
            -e LIBXML2_VERSION="${LIBXML2_VERSION}" \
            -e AZURE_SDK_CPP_VERSION="${AZURE_SDK_CPP_VERSION}" \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          # OpenSSL's Configure needs perl modules the image's minimal perl-interpreter lacks.
          dnf install -y --setopt=install_weak_deps=False perl
          LICENSES=/work/deps/licenses

          curl -fsSL -o "openssl-${OPENSSL_VERSION}.tar.gz" "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure no-ssl2 no-zlib no-shared no-comp no-dynamic-engine enable-ec_nistp_64_gcc_128 \
            --prefix=/opt/riscv64-ssl --openssldir=/opt/riscv64-ssl --libdir=lib linux64-riscv64
          make -j"$(nproc)" > /dev/null
          make install_sw > /dev/null
          cp LICENSE.txt "$LICENSES/LICENSE.openssl"
          cd /tmp

          curl -fsSL -o "curl-${CURL_VERSION}.tar.gz" "https://github.com/curl/curl/releases/download/curl-${CURL_VERSION//./_}/curl-${CURL_VERSION}.tar.gz"
          tar zxf "curl-${CURL_VERSION}.tar.gz"
          cd "curl-${CURL_VERSION}"
          # Keep libcurl.a to the libraries the @azure link line names, whatever -devel the image carries.
          CPPFLAGS=-I/opt/riscv64-ssl/include \
          LDFLAGS=-L/opt/riscv64-ssl/lib \
          CFLAGS="-fPIC" \
          ./configure --disable-shared --without-libpsl --with-openssl=/opt/riscv64-ssl --prefix=/opt/riscv64-curl \
            --without-brotli --without-zstd --without-nghttp2 --without-libidn2
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          cp COPYING "$LICENSES/LICENSE.curl"
          cd /tmp

          curl -fsSL -o "zlib-${ZLIB_VERSION}.tar.gz" "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz"
          tar zxf "zlib-${ZLIB_VERSION}.tar.gz"
          cd "zlib-${ZLIB_VERSION}"
          # Upstream's Ubuntu gcc defaults to PIE, which is what lets its non-PIC libz.a link into a .so.
          CFLAGS="-fPIC" ./configure --static --shared --prefix=/opt/riscv64-zlib
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          cp LICENSE "$LICENSES/LICENSE.zlib"
          cd /tmp

          curl -fsSL -o "libxml2-${LIBXML2_VERSION}.tar.xz" "https://download.gnome.org/sources/libxml2/${LIBXML2_VERSION%.*}/libxml2-${LIBXML2_VERSION}.tar.xz"
          tar xf "libxml2-${LIBXML2_VERSION}.tar.xz"
          cd "libxml2-${LIBXML2_VERSION}"
          CFLAGS="-fPIC" ./configure --disable-shared --enable-static \
            --without-python --without-lzma --without-zlib --prefix=/opt/riscv64-xml2
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          cp Copyright "$LICENSES/LICENSE.libxml2"
          cd /tmp

          git clone --recurse-submodules --depth 1 --branch "${AZURE_SDK_CPP_VERSION}" https://github.com/Azure/azure-sdk-for-cpp /tmp/azure-sdk-cpp
          cd /tmp/azure-sdk-cpp
          cp LICENSE.txt "$LICENSES/LICENSE.azure-sdk-for-cpp"

          build_azure_sdk_component() {
            local source="$1"
            shift
            cmake -B "build-${source##*/}" -S "$source" \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_INSTALL_PREFIX=/opt/riscv64-azure \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_TESTING=OFF \
              -DCMAKE_PREFIX_PATH="/opt/riscv64-ssl;/opt/riscv64-curl;/opt/riscv64-xml2;/opt/riscv64-azure" \
              -DCURL_LIBRARY=/opt/riscv64-curl/lib/libcurl.a \
              -DCURL_INCLUDE_DIR=/opt/riscv64-curl/include \
              -DOPENSSL_ROOT_DIR=/opt/riscv64-ssl \
              -DOPENSSL_INCLUDE_DIR=/opt/riscv64-ssl/include \
              -DOPENSSL_CRYPTO_LIBRARY=/opt/riscv64-ssl/lib/libcrypto.a \
              -DOPENSSL_SSL_LIBRARY=/opt/riscv64-ssl/lib/libssl.a \
              -DLIBXML2_LIBRARY=/opt/riscv64-xml2/lib/libxml2.a \
              -DLIBXML2_INCLUDE_DIR=/opt/riscv64-xml2/include/libxml2 \
              "$@"
            cmake --build "build-${source##*/}" -j"$(nproc)"
            cmake --install "build-${source##*/}"
          }

          build_azure_sdk_component sdk/core/azure-core -DBUILD_TRANSPORT_CURL=ON -DDISABLE_AZURE_CORE_OPENTELEMETRY=ON
          build_azure_sdk_component sdk/storage/azure-storage-common
          build_azure_sdk_component sdk/storage/azure-storage-blobs
          build_azure_sdk_component sdk/identity/azure-identity

          ls -l /opt/riscv64-azure/lib "$LICENSES"
          SCRIPT

      - name: Save OpenSSL, curl, zlib, libxml2 and the Azure SDK
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build the Azure streamer library and package the wheel
        run: |
          mkdir -p dist
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-ssl:/opt/riscv64-ssl" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-curl:/opt/riscv64-curl" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-zlib:/opt/riscv64-zlib" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-xml2:/opt/riscv64-xml2" \
            -v "${GITHUB_WORKSPACE}/deps/riscv64-azure:/opt/riscv64-azure" \
            -w /work/runai-model-streamer \
            -e PACKAGE_VERSION="${RUNAI_MODEL_STREAMER_VERSION}" \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          # cpp/toolchain links -l:libstdc++.a, which on this image is its own CRB package.
          dnf install -y --setopt=install_weak_deps=False java-21-openjdk-devel libstdc++-static
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export JAVA_HOME
          install -m 0755 /work/bazel-bin/bazel /usr/local/bin/bazel
          git config --global --add safe.directory '*'

          # cpp/toolchain/rules.bzl expects the Debian cross-toolchain names; this image's gcc is native.
          for tool in gcc g++ ar ld cpp gcov nm objdump strip; do
            native="$(command -v "$tool" || true)"
            [ -n "$native" ] && ln -sf "$native" "/usr/bin/riscv64-linux-gnu-$tool"
          done

          cd cpp
          # Production build: same config upstream's own release recipe (`make build`) uses.
          bazel build azure:libstreamerazure.so --config=riscv64
          cp bazel-bin/azure/libstreamerazure.so /work/libstreamerazure.so

          # Test-only build: upstream's own test recipe (`make -C cpp build_azure_test`)
          # additionally enables AZURITE_TESTING so AZURE_STORAGE_CONNECTION_STRING can
          # target Azurite's local http://host:port endpoint; the production build above
          # has no way to do that (account auth always resolves to https://<account>.<suffix>).
          bazel build azure:libstreamerazure.so --config=riscv64 --config=azurite
          cp bazel-bin/azure/libstreamerazure.so /work/libstreamerazure-azurite-test.so

          cd ../py/runai_model_streamer_azure
          cp /work/libstreamerazure.so libstreamerazure.so
          cp /work/deps/licenses/LICENSE.* .
          /opt/python/cp312-cp312/bin/pip install -q setuptools wheel
          /opt/python/cp312-cp312/bin/python setup.py bdist_wheel --plat-name manylinux_2_39_riscv64
          cp dist/*.whl /work/dist/
          SCRIPT

      - name: Verify the wheel ships a riscv64 shared object and its licences
        run: |
          python3 - dist/*.whl <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              so = next(n for n in names if n.endswith("libstreamer/lib/libstreamerazure.so"))
              header = zf.read(so)[:20]
              assert header[:4] == b"\x7fELF", header
              assert header[18] == 0xF3, header  # EM_RISCV
              licenses = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n}
              print(sorted(licenses))
              for dep in ("openssl", "curl", "zlib", "libxml2", "azure-sdk-for-cpp"):
                  assert f"LICENSE.{dep}" in licenses, dep
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runai-model-streamer-azure-${{ matrix.version }}-py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runai-model-streamer-azure-${{ matrix.version }}-azurite-test-lib
          path: libstreamerazure-azurite-test.so
          if-no-files-found: error

  test_wheel:
    name: Test runai-model-streamer-azure ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14']

    env:
      RUNAI_MODEL_STREAMER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout runai-model-streamer ${{ env.RUNAI_MODEL_STREAMER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: run-ai/runai-model-streamer
          ref: ${{ env.RUNAI_MODEL_STREAMER_VERSION }}
          path: runai-model-streamer
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: runai-model-streamer-azure-${{ env.RUNAI_MODEL_STREAMER_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Download the Azurite-testing library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: runai-model-streamer-azure-${{ env.RUNAI_MODEL_STREAMER_VERSION }}-azurite-test-lib
          path: azurite-test-lib

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install the wheel and upstream's test dependencies
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
        # requirements.dev's numpy==1.24.4 has no riscv64 wheel and no longer builds on Python >=3.12.
        run: |
          echo "numpy>=1.26,<3" > "$RUNNER_TEMP/numpy-override.txt"
          uv pip install --override "$RUNNER_TEMP/numpy-override.txt" \
            -r runai-model-streamer/py/runai_model_streamer/requirements.dev \
            pytest \
            "runai-model-streamer[azure]==${RUNAI_MODEL_STREAMER_VERSION}" \
            wheelhouse/*.whl

      - name: Run the Azure package's unit tests against the installed wheel
        run: |
          site="$(python -c 'import runai_model_streamer_azure, os; print(os.path.dirname(os.path.dirname(runai_model_streamer_azure.__file__)))')"
          cd "$site"
          python -m unittest discover -b runai_model_streamer_azure

      - name: Run upstream's Azure tests against Azurite
        working-directory: runai-model-streamer/tests
        env:
          # Well-known Azurite storage account key:
          # https://github.com/Azure/Azurite?tab=readme-ov-file#default-storage-account
          AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;'
          AZURE_CONTAINER: test-bucket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nodejs npm
          npm install -g "azurite@${AZURITE_VERSION}"
          mkdir -p "$RUNNER_TEMP/azurite"
          azurite --silent --skipApiVersionCheck --location "$RUNNER_TEMP/azurite" --blobPort 10000 --blobHost 127.0.0.1 &
          trap 'kill $!' EXIT

          # The published .so has no way to point at Azurite's local endpoint (see the
          # "Test-only build" note above); swap in the AZURITE_TESTING-enabled .so built
          # alongside it, matching upstream's own `make test` vs `make build` split.
          site="$(python -c 'import sys; print(sys.prefix)')"
          cp "$GITHUB_WORKSPACE/azurite-test-lib/libstreamerazure-azurite-test.so" \
            "$site/runai_model_streamer/libstreamer/lib/libstreamerazure.so"
          pytest -v azure/

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources for runai-model-streamer-azure ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      RUNAI_MODEL_STREAMER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: runai-model-streamer-azure-${{ env.RUNAI_MODEL_STREAMER_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish runai-model-streamer-azure ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: runai-model-streamer-azure-${{ matrix.version }}-py3-none-manylinux_riscv64
      gpl-sources-artifact: runai-model-streamer-azure-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
