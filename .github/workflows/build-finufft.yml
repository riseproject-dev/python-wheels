---
# Mirrors the Linux leg of upstream's own [tool.cibuildwheel] config in
# pyproject.toml: a scikit-build-core/CMake build of libfinufft.so (loaded via
# ctypes, hence the py3-none ABI tag despite being a genuine per-platform
# compiled build - confirmed by inspecting the published x86_64 wheel, which
# carries finufft/libfinufft.so plus FFTW static libs CMake fetches and builds
# from source). wheel.py-api = "py3" collapses the matrix to one interpreter.
name: Build finufft wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/finufft.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-finufft.yml'
      - 'docs/packages/finufft.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-finufft.yml'
      - 'docs/packages/finufft.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: finufft
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build finufft ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "finufft"
      version: "${{ matrix.version }}"
      repository: "flatironinstitute/finufft"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/finufft/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "python/finufft"
      cibw-build: "cp312-manylinux_riscv64"
      # Upstream's own pyproject.toml pins musllinux-x86_64-image to the
      # "musllinux_1_1" alias, which cibuildwheel 4.x rejects at config-load
      # time for any build, even this riscv64-only, musllinux-less one.
      cibw-musllinux-x86-64-image: "musllinux_1_2"
      # Upstream's build-system pins cmake<4, which has no riscv64 wheel, so pip
      # builds CMake from source; its bootstrap needs OpenSSL's dev headers.
      cibw-before-all-linux: "dnf -y install openssl-devel"
      cibw-config-settings: "\"cmake.define.FINUFFT_ARCH_FLAGS\"=\"\""
      # Licence notices for the patch above: upstream's own LICENSE lives at the repo
      # root, outside package-dir, and FFTW (statically linked, GPL-2.0-or-later) ships
      # no licence text of its own.
      cibw-before-build: "cp {project}/LICENSE {package}/LICENSE && curl -fsSL --retry 5 https://raw.githubusercontent.com/FFTW/fftw3/master/COPYING -o {package}/LICENSE.fftw"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # riscv64 builds run several times slower than x86_64; raised from 120 after jobs were killed mid-build by the timeout, not a dead runner.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      FINUFFT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: finufft-${{ env.FINUFFT_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the compiled library and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "finufft/libfinufft.so" in names, names
              licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "LICENSE.fftw"}, licences
              print(whl, "ok")
          EOF

  publish:
    name: Publish finufft ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: finufft-${{ matrix.version }}-*-manylinux_riscv64
