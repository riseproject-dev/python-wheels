---
# Mirrors the Linux leg of upstream's own [tool.cibuildwheel] config in
# pyproject.toml: a scikit-build-core/CMake build of libfinufft.so (loaded via
# ctypes, hence the py3-none ABI tag despite being a genuine per-platform
# compiled build - confirmed by inspecting the published x86_64 wheel, which
# carries finufft/libfinufft.so plus FFTW static libs CMake fetches and builds
# from source). wheel.py-api = "py3" collapses the matrix to one interpreter.
name: Build finufft wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/finufft.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-finufft.yml'
      - 'docs/packages/finufft.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-finufft.yml'
      - 'docs/packages/finufft.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: finufft
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build finufft ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      FINUFFT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout flatironinstitute/finufft v${{ env.FINUFFT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: flatironinstitute/finufft
          ref: v${{ env.FINUFFT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch finufft source
        run: git apply python-wheels/patches/finufft/${{ env.FINUFFT_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python/finufft
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_CONFIG_SETTINGS: >
            "cmake.define.FINUFFT_ARCH_FLAGS"=""
          # Licence notices for the patch above: upstream's own LICENSE lives at the repo
          # root, outside package-dir, and FFTW (statically linked, GPL-2.0-or-later) ships
          # no licence text of its own.
          CIBW_BEFORE_BUILD: >-
            cp {project}/../../LICENSE {project}/LICENSE &&
            curl -fsSL --retry 5 https://raw.githubusercontent.com/FFTW/fftw3/master/COPYING -o {project}/LICENSE.fftw
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest pytest-mock
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy
          CIBW_TEST_COMMAND: pytest {project}/test

      - name: Check the compiled library and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "finufft/libfinufft.so" in names, names
              licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "LICENSE.fftw"}, licences
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: finufft-${{ env.FINUFFT_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish finufft ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: finufft-${{ matrix.version }}-*-manylinux_riscv64
