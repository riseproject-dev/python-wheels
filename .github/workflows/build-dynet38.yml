---
# Based on: https://github.com/taishi-i/dynet/blob/3c9f35de86e98a5809e9c81394194c8f6e0aa0dc/.github/workflows/build_macos_wheels.yml
# and the test step of https://github.com/taishi-i/dynet/blob/3c9f35de86e98a5809e9c81394194c8f6e0aa0dc/.travis/test_dynet.sh
name: Build dynet38 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dynet38.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dynet38.yml'
      - 'docs/packages/dynet38.yaml'
      - 'patches/dynet38/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dynet38.yml'
      - 'docs/packages/dynet38.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # No 2.2 tag; the build_macos_wheels branch tip is the tree the latest 2.2 wheels (cp314) were built from.
  DYNET38_REF: 3c9f35de86e98a5809e9c81394194c8f6e0aa0dc
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dynet38
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dynet38 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dynet38"
      version: "${{ matrix.version }}"
      repository: "taishi-i/dynet"
      ref: "3c9f35de86e98a5809e9c81394194c8f6e0aa0dc"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/dynet38/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_USE_PEP517=1 PIP_ONLY_BINARY=numpy"
      # setup.py links _dynet against build/<py>-64bit/dynet/libdynet.so but gives it an RPATH into the deleted build venv.
      cibw-repair-wheel-command-linux: "LD_LIBRARY_PATH=\"$(echo {project}/build/py3*-64bit/dynet)\" auditwheel repair -w {dest_dir} {wheel}"
      cibw-test-command: "cd {project}/tests/python && python test.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DYNET38_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dynet38-${{ env.DYNET38_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("_dynet.") and n.endswith(".so") for n in names), names
          assert any(n.startswith("dynet38.libs/libdynet") for n in names), names
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt", "LICENSE.eigen-mpl2"}, licences
          EOF

  publish:
    name: Publish dynet38 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dynet38-${{ matrix.version }}-*-manylinux_riscv64
