---
# Based on upstream's own CI:
#   https://github.com/Jason2866/pyfatfs/blob/v0.1.15/.github/workflows/deploy.yaml
name: Build fatfs-ng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fatfs-ng.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fatfs-ng.yml'
      - 'docs/packages/fatfs-ng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fatfs-ng.yml'
      - 'docs/packages/fatfs-ng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fatfs-ng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fatfs-ng ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fatfs-ng"
      version: "${{ matrix.version }}"
      repository: "Jason2866/pyfatfs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No pyproject.toml, so setup.py's setup_requires=['cython'] is a
      # no-op under build isolation; install it the same way upstream's
      # own CIBW_BEFORE_BUILD does.
      cibw-before-build: "pip install \"cython>=3.0.0\""
      cibw-environment-linux: "CYTHONIZE=1"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # 4 of test_esp32_wl.py's tests fail identically on every platform
      # (confirmed on x86_64 too, not riscv64-specific): ESP32WearLeveling
      # never sets self.wl_state_size/wl_temp_size in __init__, a
      # pre-existing upstream bug unrelated to this port.
      cibw-test-command: "python -m pytest {project}/tests -k \"not test_wl_state_creation and not test_overhead_calculation and not test_wl_state_invalid_crc and not test_fat_data_too_large\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FATFS_NG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fatfs-ng-${{ env.FATFS_NG_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wrapper extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("fatfs/wrapper") and n.endswith(".so") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish fatfs-ng ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fatfs-ng-${{ matrix.version }}-*-manylinux_riscv64
