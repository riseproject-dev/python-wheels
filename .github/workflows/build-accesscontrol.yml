---
# This workflow is based on: https://github.com/zopefoundation/AccessControl/blob/7.5/.github/workflows/tests.yml
name: Build accesscontrol wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/accesscontrol.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-accesscontrol.yml'
      - 'docs/packages/accesscontrol.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-accesscontrol.yml'
      - 'docs/packages/accesscontrol.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: accesscontrol
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build accesscontrol ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: accesscontrol
      version: ${{ matrix.version }}
      repository: zopefoundation/AccessControl
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The compiled test-time dependencies (zope.interface, ExtensionClass,
      # BTrees, persistent, ...) have no riscv64 wheel on public PyPI.
      cibw-test-extras: test
      # RestrictedPython 9.0 (2026-11-04) removed `sorted`/`bytes`/`tuple`/`zip`
      # from safe_builtins (zopefoundation/RestrictedPython#335); AccessControl
      # 7.5's own test suite (actual_python.py) still assumes `sorted` is there,
      # so pin to the last release AccessControl 7.5 was actually tested against.
      cibw-test-requires: RestrictedPython<9.0
      cibw-test-environment: ZOPE_INTERFACE_STRICT_IRO=1
      # Upstream's two test steps: with and without the C extension.
      cibw-test-command: >-
        PURE_PYTHON=0 python -m zope.testrunner --test-path={package}/src &&
        PURE_PYTHON=1 python -m zope.testrunner --test-path={package}/src
      timeout-minutes: 60

  publish:
    name: Publish accesscontrol ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: accesscontrol-${{ matrix.version }}-*-manylinux_riscv64
