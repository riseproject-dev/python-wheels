---
# Based on the `build-wheels` job of
# https://github.com/newrelic/newrelic-python-agent/blob/v13.5.0/.github/workflows/deploy.yml
name: Build newrelic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/newrelic.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-newrelic.yml'
      - 'docs/packages/newrelic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-newrelic.yml'
      - 'docs/packages/newrelic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: newrelic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build newrelic ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: newrelic
      version: ${{ matrix.version }}
      # setuptools_scm derives the version with `git describe`, so the tag history is needed.
      repository: newrelic/newrelic-python-agent
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py catches every build_ext error and falls back to a pure-Python
      # wheel; this makes a compile failure fatal instead.
      cibw-environment-linux: NEW_RELIC_EXTENSIONS=true
      cibw-test-requires: pytest certifi WebTest
      cibw-test-command: >-
        python -c "import newrelic.core._thread_utilization as t, newrelic.packages.wrapt._wrappers as w;
        assert t.__file__.endswith('.so'), t.__file__;
        assert w.__file__.endswith('.so'), w.__file__" &&
        PYTHONPATH={project}/tests pytest {project}/tests/agent_unittests -vx
      timeout-minutes: 90

  publish:
    name: Publish newrelic ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: newrelic-${{ matrix.version }}-*-manylinux_riscv64
