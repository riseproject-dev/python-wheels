---
# Based on the `build-wheels` job of
# https://github.com/newrelic/newrelic-python-agent/blob/v13.5.0/.github/workflows/deploy.yml
name: Build newrelic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/newrelic.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-newrelic.yml'
      - 'docs/packages/newrelic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-newrelic.yml'
      - 'docs/packages/newrelic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: newrelic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build newrelic ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      NEWRELIC_VERSION: ${{ matrix.version }}

    steps:
      # setuptools_scm derives the version with `git describe`, so the tag history is needed.
      - name: Checkout newrelic v${{ env.NEWRELIC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: newrelic/newrelic-python-agent
          ref: v${{ env.NEWRELIC_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py catches every build_ext error and falls back to a pure-Python
          # wheel; this makes a compile failure fatal instead.
          CIBW_ENVIRONMENT: NEW_RELIC_EXTENSIONS=true
          CIBW_TEST_REQUIRES: pytest certifi WebTest
          CIBW_TEST_COMMAND: >-
            python -c "import newrelic.core._thread_utilization as t, newrelic.packages.wrapt._wrappers as w;
            assert t.__file__.endswith('.so'), t.__file__;
            assert w.__file__.endswith('.so'), w.__file__" &&
            PYTHONPATH={project}/tests pytest {project}/tests/agent_unittests -vx

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: newrelic-${{ env.NEWRELIC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish newrelic ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: newrelic-${{ matrix.version }}-*-manylinux_riscv64
