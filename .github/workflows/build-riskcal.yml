---
# Based on the `build_wheels` job of
# https://github.com/interpretable-dp/riskcal/blob/v1.5.1/.github/workflows/release.yml
name: Build riskcal wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/riskcal.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-riskcal.yml'
      - 'docs/packages/riskcal.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-riskcal.yml'
      - 'docs/packages/riskcal.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: riskcal
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build riskcal ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: riskcal
      version: ${{ matrix.version }}
      repository: interpretable-dp/riskcal
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy
      cibw-test-requires: pytest
      cibw-test-sources: tests
      # test_blackbox.py imports opacus (torch); the rest of the suite runs on the wheel.
      cibw-test-command: >-
        python -c "from riskcal.analysis.rdp import is_cython_available; assert is_cython_available()" &&
        python -m pytest tests --ignore=tests/test_blackbox.py
      timeout-minutes: 60

  publish:
    name: Publish riskcal ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: riskcal-${{ matrix.version }}-*-manylinux_riscv64
