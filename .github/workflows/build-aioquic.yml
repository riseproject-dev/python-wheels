---
# This workflow is based on: https://github.com/aiortc/aioquic/blob/1.3.0/.github/workflows/tests.yml
name: Build aioquic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aioquic.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aioquic.yml'
      - 'docs/packages/aioquic.yaml'
      - 'patches/aioquic/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aioquic.yml'
      - 'docs/packages/aioquic.yaml'
      - 'patches/aioquic/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aioquic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build aioquic ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "aioquic"
      version: "${{ matrix.version }}"
      repository: "aiortc/aioquic"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # cp310 first: setup.py forces the cp310-abi3 tag regardless of the
      # build interpreter (gotcha 96); the later entries build nothing,
      # they only re-test the one wheel.
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # cryptography has no riscv64 wheel on public PyPI; PIP_ONLY_BINARY
      # stops pip from picking a newer PyPI-only sdist release (which
      # fails: its Rust backend has no riscv64 rustup target) over the
      # older riscv64 wheel our registry carries. pylsqpack (also no
      # public riscv64 wheel) builds from sdist in seconds either way.
      cibw-test-environment: "AIOQUIC_SKIP_TESTS=ipv6,loss PIP_ONLY_BINARY=cryptography"
      # cryptography 50.0.0 dropped SHA1-for-RSA-signing support, which
      # breaks test_tls.py's legacy-algorithm test regardless of arch;
      # cap it at the last release the suite was written against
      # (gotcha 97's shape).
      cibw-test-requires: "cryptography<50"
      cibw-test-command: "python -m unittest discover -t {project} -s {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      AIOQUIC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: aioquic-${{ env.AIOQUIC_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and the licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("aioquic/_buffer.") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish aioquic ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aioquic-${{ matrix.version }}-*-manylinux_riscv64
