---
# Based on the `linux-wheels-standard`/`linux-wheels-arm` jobs of
# https://github.com/ofek/coincurve/blob/v21.0.0/.github/workflows/build.yml
name: Build coincurve wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/coincurve.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-coincurve.yml'
      - 'docs/packages/coincurve.yaml'
      - 'patches/coincurve/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-coincurve.yml'
      - 'docs/packages/coincurve.yaml'
      - 'patches/coincurve/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: coincurve
      # The CMake build sets Py_LIMITED_API, which free-threaded CPython rejects.
      python-exclude: 'cp39 cp3*t'
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build coincurve ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "coincurve"
      version: "${{ matrix.version }}"
      repository: "ofek/coincurve"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      # cffi >=2.0.0's LICENSE moved into a licenses/ subdirectory (PEP 639);
      # hatch_build.py's dist-info lookup doesn't account for it and fails the
      # build on any resolved cffi. Fixed upstream (ofek/coincurve#188) but not
      # yet released. See patches/coincurve/21.0.0 for details.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # cffi, a build-time-only dependency (its _cffi_backend.so gets bundled
      # into the wheel so cffi is not a runtime dependency), has a riscv64
      # wheel on our registry for manylinux only; musllinux builds it from
      # sdist against the libffi-dev already in the musllinux image.
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"from coincurve import PrivateKey; a=PrivateKey(); b=PrivateKey(); assert a.ecdh(b.public_key.format())==b.ecdh(a.public_key.format()) \" && python -m pytest {project}"

  publish:
    name: Publish coincurve ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: coincurve-${{ matrix.version }}-*riscv64
