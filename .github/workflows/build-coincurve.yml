---
# Based on the `linux-wheels-standard`/`linux-wheels-arm` jobs of
# https://github.com/ofek/coincurve/blob/v21.0.0/.github/workflows/build.yml
name: Build coincurve wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'coincurve version to build (git tag without leading v, e.g. 21.0.0)'
        required: true
        default: '21.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-coincurve.yml'
      - 'patches/coincurve/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '21.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 21.0.0 there.
  COINCURVE_VERSION: ${{ inputs.version || '21.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build coincurve ${{ inputs.version || '21.0.0' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): hatch_build.py bundles the version-specific
        # _cffi_backend extension into the wheel. cp314t is dropped: the CMake
        # build unconditionally compiles with Py_LIMITED_API, which Python itself
        # rejects under the free-threaded build ("The limited API is not
        # currently supported in the free-threaded build") on every arch, not
        # just riscv64.
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout coincurve v${{ env.COINCURVE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ofek/coincurve
          ref: v${{ env.COINCURVE_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # cffi >=2.0.0's LICENSE moved into a licenses/ subdirectory (PEP 639);
      # hatch_build.py's dist-info lookup doesn't account for it and fails the
      # build on any resolved cffi. Fixed upstream (ofek/coincurve#188) but not
      # yet released. See patches/coincurve/21.0.0 for details.
      - name: Patch coincurve source
        run: git apply python-wheels/patches/coincurve/${{ env.COINCURVE_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # cffi, a build-time-only dependency (its _cffi_backend.so gets bundled
          # into the wheel so cffi is not a runtime dependency), has a riscv64
          # wheel on our registry for manylinux only; musllinux builds it from
          # sdist against the libffi-dev already in the musllinux image.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "from coincurve import PrivateKey;
            a=PrivateKey();
            b=PrivateKey();
            assert a.ecdh(b.public_key.format())==b.ecdh(a.public_key.format())
            " &&
            python -m pytest {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coincurve-${{ env.COINCURVE_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish coincurve ${{ inputs.version || '21.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: coincurve-${{ inputs.version || '21.0.0' }}-*riscv64
