---
# This workflow is based on: https://github.com/biojppm/rapidyaml-python/blob/v0.15.2/.github/workflows/release.yml
name: Build rapidyaml wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'rapidyaml version to build (git tag without leading v, e.g. 0.15.2)'
        required: true
        default: '0.15.2'
  pull_request:
    paths:
      - '.github/workflows/build-rapidyaml.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.15.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.15.2 there.
  RAPIDYAML_VERSION: ${{ inputs.version || '0.15.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build rapidyaml ${{ inputs.version || '0.15.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout rapidyaml-python v${{ env.RAPIDYAML_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: biojppm/rapidyaml-python
          ref: v${{ env.RAPIDYAML_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Shallow checkout has no tag history for setuptools_scm to read.
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RAPIDYAML=${{ env.RAPIDYAML_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: pytest test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rapidyaml-${{ env.RAPIDYAML_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rapidyaml ${{ inputs.version || '0.15.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: rapidyaml-${{ inputs.version || '0.15.2' }}-*-manylinux_riscv64
