---
# This workflow is based on: https://github.com/biojppm/rapidyaml-python/blob/v0.15.2/.github/workflows/release.yml
name: Build rapidyaml wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rapidyaml.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rapidyaml.yml'
      - 'docs/packages/rapidyaml.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rapidyaml.yml'
      - 'docs/packages/rapidyaml.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rapidyaml
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rapidyaml ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: rapidyaml
      version: ${{ matrix.version }}
      repository: biojppm/rapidyaml-python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Shallow checkout has no tag history for setuptools_scm to read.
      cibw-environment-linux: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RAPIDYAML=${{ matrix.version }}
      cibw-test-requires: pytest
      cibw-test-sources: test
      cibw-test-command: pytest test
      timeout-minutes: 60

  publish:
    name: Publish rapidyaml ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rapidyaml-${{ matrix.version }}-*-manylinux_riscv64
