---
# Based on upstream's wheel builder:
#   https://github.com/TkTech/pysimdjson/blob/master/.github/workflows/release.yml
name: Build pysimdjson wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pysimdjson.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pysimdjson.yml'
      - 'docs/packages/pysimdjson.yaml'
      - 'patches/pysimdjson/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pysimdjson.yml'
      - 'docs/packages/pysimdjson.yaml'
      - 'patches/pysimdjson/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pysimdjson
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pysimdjson ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYSIMDJSON_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pysimdjson v${{ env.PYSIMDJSON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TkTech/pysimdjson
          ref: v${{ env.PYSIMDJSON_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The extension statically compiles the vendored, Apache-2.0-licensed
      # simdjson.cpp/simdjson.h; upstream's own setup.cfg lists only its MIT LICENSE.
      - name: Patch pysimdjson source
        run: git apply python-wheels/patches/pysimdjson/${{ env.PYSIMDJSON_VERSION }}/00*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as md; got = sorted(p.name for p in md.files('pysimdjson') if '.dist-info/licenses/' in str(p) and p.name); assert got == ['LICENSE', 'LICENSE.simdjson'], got"
            && pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysimdjson-${{ env.PYSIMDJSON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pysimdjson ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pysimdjson-${{ matrix.version }}-*-manylinux_riscv64
