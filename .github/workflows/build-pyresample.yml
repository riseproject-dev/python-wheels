---
# Based on: https://github.com/pytroll/pyresample/blob/v1.35.0/.github/workflows/deploy.yaml
name: Build pyresample wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyresample.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyresample.yml'
      - 'docs/packages/pyresample.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyresample.yml'
      - 'docs/packages/pyresample.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyresample
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyresample ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYRESAMPLE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyresample v${{ env.PYRESAMPLE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytroll/pyresample
          ref: v${{ env.PYRESAMPLE_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pyproj,pykdtree,shapely,pyyaml,scipy,pandas,matplotlib,contourpy,kiwisolver,pillow,cartopy,rasterio,numcodecs,msgspec,google-crc32c
          # The test suite's conftest imports xarray, and pandas (an xarray dependency)
          # has no cp314t riscv64 wheel yet, so that leg runs upstream's own wheel check only.
          CIBW_TEST_REQUIRES: >-
            ${{ matrix.python == 'cp314t' && '' || 'pytest pytest-lazy-fixtures dask xarray scipy pillow matplotlib cartopy rasterio zarr odc-geo' }}
          CIBW_TEST_COMMAND: >-
            python -c "import pyresample; assert 'unknown' not in pyresample.__version__, 'incorrect version found'; from pyresample.ewa import _ll2cr, _fornav; from pyresample.gradient import _gradient_search"
            ${{ matrix.python == 'cp314t' && '' || '&& python -m pytest -v --pyargs pyresample.test' }}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"pyresample/ewa/_ll2cr", "pyresample/ewa/_fornav", "pyresample/gradient/_gradient_search"}, exts
          assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyresample-${{ env.PYRESAMPLE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyresample ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyresample-${{ matrix.version }}-*-manylinux_riscv64
