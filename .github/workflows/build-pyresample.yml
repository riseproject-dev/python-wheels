---
# Based on: https://github.com/pytroll/pyresample/blob/v1.35.0/.github/workflows/deploy.yaml
name: Build pyresample wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyresample.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyresample.yml'
      - 'docs/packages/pyresample.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyresample.yml'
      - 'docs/packages/pyresample.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyresample
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyresample ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyresample"
      version: "${{ matrix.version }}"
      repository: "pytroll/pyresample"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pyproj,pykdtree,shapely,pyyaml,scipy,pandas,matplotlib,contourpy,kiwisolver,pillow,cartopy,rasterio,numcodecs,msgspec,google-crc32c"
      # The test suite's conftest imports xarray, and pandas (an xarray dependency)
      # has no cp314t riscv64 wheel yet, so that leg runs upstream's own wheel check only.
      # (`cond && '' || x` is broken in GitHub Actions expressions: the empty string
      # is falsy, so it always falls through to x. Negate the condition instead.)
      #
      # pyresample.gradient's __init__.py unconditionally does `import dask` and
      # `import xarray` (gotcha: the module is heavier than the single Cython symbol
      # we want from it), so even the bare sanity import below can't cover it on
      # cp314t without pandas. The "Check wheel contents" step already proves
      # gradient._gradient_search.so is in the wheel without importing it, so skip
      # that import here for cp314t instead of trying to satisfy its transitive deps.
      cibw-test-requires: "${{ matrix.python != 'cp314t' && 'pytest pytest-lazy-fixtures dask xarray scipy pillow matplotlib cartopy rasterio zarr odc-geo' || '' }}"
      cibw-test-command: "python -c \"import pyresample; assert 'unknown' not in pyresample.__version__, 'incorrect version found'; from pyresample.ewa import _ll2cr, _fornav\" ${{ matrix.python != 'cp314t' && '&& python -c \"from pyresample.gradient import _gradient_search\" && python -m pytest -v --pyargs pyresample.test' || '' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYRESAMPLE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyresample-${{ env.PYRESAMPLE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"pyresample/ewa/_ll2cr", "pyresample/ewa/_fornav", "pyresample/gradient/_gradient_search"}, exts
          assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
          EOF

  publish:
    name: Publish pyresample ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyresample-${{ matrix.version }}-*-manylinux_riscv64
