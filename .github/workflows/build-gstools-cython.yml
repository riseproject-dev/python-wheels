---
# This workflow is based on the `build_wheels` job of
# https://github.com/GeoStat-Framework/GSTools-Cython/blob/v1.2.0/.github/workflows/main.yml
name: Build gstools-cython wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gstools-cython.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gstools-cython.yml'
      - 'docs/packages/gstools-cython.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gstools-cython.yml'
      - 'docs/packages/gstools-cython.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gstools-cython
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gstools-cython ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gstools-cython"
      version: "${{ matrix.version }}"
      repository: "GeoStat-Framework/GSTools-Cython"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0
      # musllinux is dropped: numpy has no musllinux_riscv64 wheel on pypi.riseproject.dev.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is both a build and a runtime dependency; only our registry has riscv64
      # wheels, and PIP_ONLY_BINARY keeps a newer PyPI sdist from winning the resolution.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GSTOOLS_CYTHON_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gstools-cython-${{ env.GSTOOLS_CYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the licence and the compiled extensions
        run: |
          python3 - <<'EOF'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("wheelhouse/*.whl")[0]).namelist()
          assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
          for ext in ("field", "krige", "variogram"):
              assert any(n.startswith(f"gstools_cython/{ext}.") and n.endswith(".so") for n in names), names
          EOF

  publish:
    name: Publish gstools-cython ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gstools-cython-${{ matrix.version }}-*-manylinux_riscv64
