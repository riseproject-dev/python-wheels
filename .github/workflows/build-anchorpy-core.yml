---
# This workflow is based on the `linux` job of
# https://github.com/kevinheavey/anchorpy-core/blob/0.2.0/.github/workflows/build.yml
name: Build anchorpy-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/anchorpy-core.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-anchorpy-core.yml'
      - 'docs/packages/anchorpy-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anchorpy-core.yml'
      - 'docs/packages/anchorpy-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: anchorpy-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build anchorpy-core ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter in our matrix; there is no
          # free-threaded (cp314t) leg -- pyo3 0.17.2 predates PEP 703 entirely.
          - tag: cp37-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    env:
      ANCHORPY_CORE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout anchorpy-core ${{ env.ANCHORPY_CORE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kevinheavey/anchorpy-core
          ref: ${{ env.ANCHORPY_CORE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # anchorpy-core ships no [tool.cibuildwheel]; install the Rust
          # toolchain its maturin backend needs.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # pyproject.toml pins maturin<0.14 (2022), which has no riscv64
          # wheel on PyPI and fails to build from sdist (its own bootstrap
          # needs setuptools, which Python 3.12+ no longer seeds into a
          # fresh build-isolation venv). A current maturin builds this tree
          # unmodified, so install one and skip isolation to bypass the pin.
          CIBW_BEFORE_BUILD: pip install maturin
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import anchorpy_core.anchorpy_core as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: anchorpy-core-${{ env.ANCHORPY_CORE_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish anchorpy-core ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: anchorpy-core-${{ matrix.version }}-*-manylinux_riscv64
