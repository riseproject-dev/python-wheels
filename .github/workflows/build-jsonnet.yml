---
# This workflow is based on: https://github.com/google/jsonnet/blob/v0.22.0/.github/workflows/publish-python.yml
name: Build jsonnet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jsonnet.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonnet.yml'
      - 'docs/packages/jsonnet.yaml'
      - 'patches/jsonnet/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonnet.yml'
      - 'docs/packages/jsonnet.yaml'
      - 'patches/jsonnet/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jsonnet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jsonnet ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py tags the wheel cp310-abi3 for any GIL-enabled interpreter
          # >=3.10, so cp312 (our floor) already produces the wheel cp313/cp314
          # need; cibuildwheel reuses+tests that one wheel via find_compatible_wheel.
          - tag: cp310-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # setup.py skips the Limited API under Py_GIL_DISABLED (free-threading).
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jsonnet"
      version: "${{ matrix.version }}"
      repository: "google/jsonnet"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"

      # Ships the vendored nlohmann/json, md5, and rapidyaml licence texts
      # compiled straight into the extension (see the patch commit message).
      patches: true

      cibw-build: "${{ matrix.build }}"
      cibw-build-frontend: "build"
      cibw-test-command: "python -c \"import _jsonnet, importlib.metadata as m; assert _jsonnet.__file__.endswith('.so'), _jsonnet.__file__; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('jsonnet') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.md5', 'LICENSE.nlohmann-json', 'LICENSE.rapidyaml'], l\" && python {package}/python/_jsonnet_test.py"

  publish:
    name: Publish jsonnet ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jsonnet-${{ matrix.version }}-*-manylinux_riscv64
