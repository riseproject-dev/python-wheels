---
# This workflow is based on upstream's own cibuildwheel-driven
# https://github.com/jfolz/simplejpeg/blob/1.9.0/.github/workflows/build_wheels.yml, narrowed to
# Linux riscv64.
name: Build simplejpeg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/simplejpeg.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-simplejpeg.yml'
      - 'docs/packages/simplejpeg.yaml'
      - 'patches/simplejpeg/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-simplejpeg.yml'
      - 'docs/packages/simplejpeg.yaml'
      - 'patches/simplejpeg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: simplejpeg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build simplejpeg ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      SIMPLEJPEG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout simplejpeg v${{ env.SIMPLEJPEG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jfolz/simplejpeg
          ref: ${{ env.SIMPLEJPEG_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch simplejpeg source
        run: git apply python-wheels/patches/simplejpeg/${{ env.SIMPLEJPEG_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's before-all installs nasm to assemble libjpeg-turbo's x86 SIMD kernels;
          # the patch above disables SIMD on riscv64 (no such kernels), so it's not needed here.
          CIBW_BEFORE_ALL_LINUX: "true"
          CIBW_BEFORE_BUILD: curl -fsSL -o {project}/LICENSE.libjpeg-turbo https://raw.githubusercontent.com/libjpeg-turbo/libjpeg-turbo/3.1.2/LICENSE.md
          CIBW_ENVIRONMENT: >-
            PIP_ONLY_BINARY=:all:
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("simplejpeg/_jpeg") and n.endswith(".so") for n in names), whl
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {"LICENSE", "LICENSE.libjpeg-turbo"}, (whl, licenses)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simplejpeg-${{ env.SIMPLEJPEG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish simplejpeg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: simplejpeg-${{ matrix.version }}-*-manylinux_riscv64
