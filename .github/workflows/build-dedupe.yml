---
# Based on the `test` and `wheels` jobs of
# https://github.com/dedupeio/dedupe/blob/v3.0.3/.github/workflows/pythonpackage.yml
name: Build dedupe wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dedupe.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dedupe.yml'
      - 'docs/packages/dedupe.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dedupe.yml'
      - 'docs/packages/dedupe.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dedupe
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dedupe ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dedupe"
      version: "${{ matrix.version }}"
      repository: "dedupeio/dedupe"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # affinegap, dedupe-levenshtein-search and zope.index have no riscv64
      # wheel yet and build from their sdists during the test install.
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests benchmarks"
      # Upstream's integration tests run every benchmark twice: the first
      # pass trains and writes settings, the second reads them back.
      cibw-test-command: "python -m pytest -v tests && python -m pip install ./benchmarks && python benchmarks/benchmarks/canonical.py && python benchmarks/benchmarks/canonical.py && python benchmarks/benchmarks/canonical_matching.py && python benchmarks/benchmarks/canonical_matching.py && python benchmarks/benchmarks/canonical_gazetteer.py && python benchmarks/benchmarks/canonical_gazetteer.py"

  publish:
    name: Publish dedupe ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dedupe-${{ matrix.version }}-*-manylinux_riscv64
