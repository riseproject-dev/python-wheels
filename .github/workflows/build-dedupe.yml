---
# Based on the `test` and `wheels` jobs of
# https://github.com/dedupeio/dedupe/blob/v3.0.3/.github/workflows/pythonpackage.yml
name: Build dedupe wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dedupe.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dedupe.yml'
      - 'docs/packages/dedupe.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dedupe.yml'
      - 'docs/packages/dedupe.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dedupe
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dedupe ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]

    env:
      DEDUPE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout dedupe v${{ env.DEDUPE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dedupeio/dedupe
          ref: v${{ env.DEDUPE_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/dedupe/${{ env.DEDUPE_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # affinegap, dedupe-levenshtein-search and zope.index have no riscv64
          # wheel yet and build from their sdists during the test install.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests benchmarks
          # Upstream's integration tests run every benchmark twice: the first
          # pass trains and writes settings, the second reads them back.
          CIBW_TEST_COMMAND: >-
            python -m pytest -v tests &&
            python -m pip install ./benchmarks &&
            python benchmarks/benchmarks/canonical.py &&
            python benchmarks/benchmarks/canonical.py &&
            python benchmarks/benchmarks/canonical_matching.py &&
            python benchmarks/benchmarks/canonical_matching.py &&
            python benchmarks/benchmarks/canonical_gazetteer.py &&
            python benchmarks/benchmarks/canonical_gazetteer.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dedupe-${{ env.DEDUPE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish dedupe ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: dedupe-${{ matrix.version }}-*-manylinux_riscv64
