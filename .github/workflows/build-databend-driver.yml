---
# This workflow is based on the `build` job of
# https://github.com/databendlabs/bendsql/blob/v0.34.2/.github/workflows/bindings.python.yml
name: Build databend-driver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/databend-driver.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-databend-driver.yml'
      - 'docs/packages/databend-driver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-databend-driver.yml'
      - 'docs/packages/databend-driver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: databend-driver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build databend-driver ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      DATABEND_DRIVER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bendsql v${{ env.DATABEND_DRIVER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: databendlabs/bendsql
          ref: v${{ env.DATABEND_DRIVER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          working-directory: bindings/python
          target: riscv64gc-unknown-linux-gnu
          manylinux: '2_39'
          args: --release --strip --out dist --features py39-abi --interpreter python3.9
          rust-toolchain: stable

      - name: Verify the wheel ships the compiled extension
        run: |
          set -euo pipefail
          ls -lh bindings/python/dist/
          for whl in bindings/python/dist/*.whl; do
            python3 - "$whl" <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.startswith("databend_driver/_databend_driver") and n.endswith(".so")]
          assert sos, names
          print(sys.argv[1], "->", sos)
          EOF
          done
          [ "$(ls bindings/python/dist/*.whl | wc -l)" -eq 1 ]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: databend-driver-${{ env.DATABEND_DRIVER_VERSION }}-manylinux_riscv64
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  test_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    name: Test databend-driver ${{ matrix.version }} on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14']

    env:
      DATABEND_DRIVER_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: databend-driver-${{ env.DATABEND_DRIVER_VERSION }}-manylinux_riscv64
          path: dist

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install databend-driver --no-index --no-deps --find-links dist --force-reinstall

      # No riscv64 Databend server or embedded-engine build exists to connect to
      # (upstream's own integration suite needs docker-compose'd databend-query,
      # amd64/arm64-only images), so this exercises the extension and its async
      # networking/TLS stack against a connection that is refused rather than a
      # live server, mirroring the unit-only scope other DB-client ports use here
      # when a live server isn't reproducible on riscv64.
      - name: Test wheel
        run: |
          python -c "import databend_driver as m; assert m._databend_driver.__file__.endswith('.so'), m._databend_driver.__file__"
          python - <<'EOF'
          from databend_driver import connect, DatabaseError, Error

          assert issubclass(DatabaseError, Error)
          conn = connect("databend://root:@localhost:1/?sslmode=disable")
          try:
              conn.query_row("SELECT 1")
          except Error:
              pass
          else:
              raise AssertionError("expected a connection error against a closed port")
          EOF

  publish:
    name: Publish databend-driver ${{ matrix.version }}
    needs: [setup, build_wheels, test_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: databend-driver-${{ matrix.version }}-manylinux_riscv64
