---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/ClickHouse/clickhouse-connect/blob/v1.11.0/.github/workflows/publish_core.yml
# and the `pytest rust/ch-core-py/tests -n 4` step of binding_ci.yml.
name: Build clickhouse-connect-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clickhouse-connect-core.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-connect-core.yml'
      - 'docs/packages/clickhouse-connect-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-connect-core.yml'
      - 'docs/packages/clickhouse-connect-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clickhouse-connect-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clickhouse-connect-core ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      CLICKHOUSE_CONNECT_CORE_VERSION: ${{ matrix.version }}

    steps:
      # clickhouse-connect-core is published from ClickHouse/clickhouse-connect's
      # rust/ch-core-py/ subdirectory and versioned independently of that repo's
      # own tags (CHANGELOG.md: "Its versions are independent of both
      # clickhouse-connect and the bundled ch-core-rs crate"), so the mapping to
      # a checkout ref is a small explicit table, not a derivation.
      - name: Resolve the clickhouse-connect tag for core ${{ env.CLICKHOUSE_CONNECT_CORE_VERSION }}
        run: |
          case "${{ env.CLICKHOUSE_CONNECT_CORE_VERSION }}" in
            0.2.3) echo "CLICKHOUSE_CONNECT_TAG=v1.11.0" >> "$GITHUB_ENV" ;;
            *) echo "::error::no clickhouse-connect tag known for clickhouse-connect-core ${{ env.CLICKHOUSE_CONNECT_CORE_VERSION }}"; exit 1 ;;
          esac

      - name: Checkout clickhouse-connect ${{ env.CLICKHOUSE_CONNECT_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ClickHouse/clickhouse-connect
          ref: ${{ env.CLICKHOUSE_CONNECT_TAG }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: rust/ch-core-py
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # rust/ch-core-py ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # binding_ci.yml's own "Build binding and run unit tests" job installs
          # the clickhouse_connect driver (`pip install -e . --no-deps`) before
          # this exact pytest invocation: several tests (JSON/Variant/Geometry
          # fallback paths) import it lazily and fail with ModuleNotFoundError
          # otherwise. clickhouse-connect is deliberately NOT in PIP_ONLY_BINARY
          # below (gotcha 354's inverse): our own registry only carries a
          # riscv64 wheel for every interpreter at the old 1.7.2 release, which
          # predates the Geometry/Variant types these tests exercise, and
          # carries no musllinux riscv64 wheel at all (build-clickhouse-connect.yml
          # only builds manylinux). Leaving it unpinned lets pip fall back to
          # PyPI's sdist for the current release on every leg that needs it
          # (clickhouse-connect's C extensions are optional - setup.py marks
          # them `optional=True` - so the sdist build never fails even without
          # a working compiler). lz4/backports.zstd (clickhouse-connect's own
          # runtime deps) do have full-matrix riscv64 wheels on our registry,
          # so only-binary still applies to those.
          CIBW_TEST_REQUIRES: pytest pytest-xdist clickhouse-connect
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=lz4,backports.zstd
          CIBW_TEST_SOURCES: rust/ch-core-py/tests
          CIBW_TEST_COMMAND: python -m pytest rust/ch-core-py/tests -n 4

      - name: Check the compiled codec made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              with zipfile.ZipFile(whl) as archive:
                  names = archive.namelist()
                  so_name = next(n for n in names if n.startswith("_ch_core/") and n.endswith(".so"))
                  header = archive.read(so_name)[:20]
              assert header[:4] == b"\x7fELF", (whl, header)
              assert header[18] == 0xF3, (whl, header)  # e_machine == EM_RISCV
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clickhouse-connect-core-${{ env.CLICKHOUSE_CONNECT_CORE_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish clickhouse-connect-core ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: clickhouse-connect-core-${{ matrix.version }}-*riscv64
