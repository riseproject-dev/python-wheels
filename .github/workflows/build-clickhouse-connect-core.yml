---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/ClickHouse/clickhouse-connect/blob/v1.11.0/.github/workflows/publish_core.yml
# and the `pytest rust/ch-core-py/tests -n 4` step of binding_ci.yml.
name: Build clickhouse-connect-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clickhouse-connect-core.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-connect-core.yml'
      - 'docs/packages/clickhouse-connect-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-connect-core.yml'
      - 'docs/packages/clickhouse-connect-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clickhouse-connect-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clickhouse-connect-core ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "clickhouse-connect-core"
      version: "${{ matrix.version }}"
      repository: "ClickHouse/clickhouse-connect"
      ref: ''
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        case "${{ matrix.version }}" in
          0.2.3) echo "CLICKHOUSE_CONNECT_TAG=v1.11.0" >> "$GITHUB_ENV" ;;
          *) echo "::error::no clickhouse-connect tag known for clickhouse-connect-core ${{ matrix.version }}"; exit 1 ;;
        esac

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        git fetch -q --no-tags origin "${CLICKHOUSE_CONNECT_TAG}"
        git checkout -q --detach FETCH_HEAD
      cibw-package-dir: "rust/ch-core-py"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # rust/ch-core-py ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # binding_ci.yml's own "Build binding and run unit tests" job installs
      # the clickhouse_connect driver (`pip install -e . --no-deps`) before
      # this exact pytest invocation: several tests (JSON/Variant/Geometry
      # fallback paths) import it lazily and fail with ModuleNotFoundError
      # otherwise. clickhouse-connect is deliberately NOT in PIP_ONLY_BINARY
      # below (gotcha 354's inverse): our own registry only carries a
      # riscv64 wheel for every interpreter at the old 1.7.2 release, which
      # predates the Geometry/Variant types these tests exercise, and
      # carries no musllinux riscv64 wheel at all (build-clickhouse-connect.yml
      # only builds manylinux). Leaving it unpinned lets pip fall back to
      # PyPI's sdist for the current release on every leg that needs it
      # (clickhouse-connect's C extensions are optional - setup.py marks
      # them `optional=True` - so the sdist build never fails even without
      # a working compiler). Its own runtime deps lz4 and backports.zstd
      # (both `python_version < "3.14"` only) stay only-binary where a
      # riscv64 wheel exists: backports.zstd has one on both libcs, but
      # lz4 has manylinux riscv64 wheels only (neither our registry nor
      # PyPI carries a musllinux riscv64 one). Forcing lz4 to binary on
      # musllinux cp312/cp313 left pip no candidate and sent it
      # backtracking through every clickhouse-connect sdist until the
      # 60-minute job timeout, so musllinux lets lz4 build from its sdist
      # (it vendors liblz4, needing only the image's C compiler).
      cibw-test-requires: "pytest pytest-xdist clickhouse-connect"
      cibw-test-environment: "${{ matrix.platform == 'manylinux' && 'PIP_ONLY_BINARY=lz4,backports.zstd' || 'PIP_ONLY_BINARY=backports.zstd' }}"
      cibw-test-sources: "rust/ch-core-py/tests"
      cibw-test-command: "python -m pytest rust/ch-core-py/tests -n 4"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CLICKHOUSE_CONNECT_CORE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: clickhouse-connect-core-${{ env.CLICKHOUSE_CONNECT_CORE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled codec made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              with zipfile.ZipFile(whl) as archive:
                  names = archive.namelist()
                  so_name = next(n for n in names if n.startswith("_ch_core/") and n.endswith(".so"))
                  header = archive.read(so_name)[:20]
              assert header[:4] == b"\x7fELF", (whl, header)
              assert header[18] == 0xF3, (whl, header)  # e_machine == EM_RISCV
              print(whl, "ok")
          EOF

  publish:
    name: Publish clickhouse-connect-core ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clickhouse-connect-core-${{ matrix.version }}-*riscv64
