---
# This workflow is based on the `build-linux` job of
# https://github.com/databricks/zerobus-sdk/blob/python/v1.7.0/.github/workflows/release-python.yml
# and the `test`/`abi3-compat` jobs of
# https://github.com/databricks/zerobus-sdk/blob/python/v1.7.0/.github/workflows/ci-python.yml
name: Build databricks-zerobus-ingest-sdk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/databricks-zerobus-ingest-sdk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-databricks-zerobus-ingest-sdk.yml'
      - 'docs/packages/databricks-zerobus-ingest-sdk.yaml'
      - 'patches/databricks-zerobus-ingest-sdk/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-databricks-zerobus-ingest-sdk.yml'
      - 'docs/packages/databricks-zerobus-ingest-sdk.yaml'
      - 'patches/databricks-zerobus-ingest-sdk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: databricks-zerobus-ingest-sdk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build databricks-zerobus-ingest-sdk ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "databricks-zerobus-ingest-sdk"
      version: "${{ matrix.version }}"
      repository: "databricks/zerobus-sdk"
      ref: "python/v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360


      patches: true
      pre-build: "cp LICENSE python/LICENSE"

      cibw-package-dir: "python"
      # pyo3's abi3-py39 feature makes this one wheel, built on cp312 and
      # re-tested on cp313/cp314 like upstream's abi3-compat job.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # protoc-bin-vendored has no riscv64 binary (see the patch); CRB's
      # protoc finds google/protobuf/*.proto in protobuf-devel by itself.
      # PROTOC_INCLUDE must stay unset: it would replace protoc's default
      # -I. that build.rs relies on to find zerobus_service.proto.
      cibw-before-build: "yum install -y protobuf-compiler protobuf-devel"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Latest pyarrow with riscv64 wheels on pypi.riseproject.dev; newer ones are sdist-only and need Arrow C++.
      cibw-test-requires: "pytest pytest-asyncio>=0.21,<1.0 pyarrow==25.0.1"
      cibw-test-sources: "python/tests"
      cibw-test-command: "python -c \"import zerobus._zerobus_core as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v python/tests"

  publish:
    name: Publish databricks-zerobus-ingest-sdk ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: databricks-zerobus-ingest-sdk-${{ matrix.version }}-*-manylinux_riscv64
