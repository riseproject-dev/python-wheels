---
# This workflow is based on the Linux leg of the `build_wheels` job of
# https://github.com/dcajasn/Riskfolio-Lib/blob/master/.github/workflows/build.yml
name: Build riskfolio-lib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/riskfolio-lib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-riskfolio-lib.yml'
      - 'docs/packages/riskfolio-lib.yaml'
      - 'patches/riskfolio-lib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-riskfolio-lib.yml'
      - 'docs/packages/riskfolio-lib.yaml'
      - 'patches/riskfolio-lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: riskfolio-lib
      version: ${{ inputs.version }}
      # cvxpy has no riscv64 wheel on the registry for cp310/cp311 (Requires-Python
      # >=3.11, and cp312 is the oldest it actually publishes there), and
      # statsmodels has none for cp314, so none of the three can install or test
      # the built wheel yet.
      python-exclude: "cp39 cp310 cp311 cp314"

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build riskfolio-lib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "riskfolio-lib"
      version: "${{ matrix.version }}"
      repository: "dcajasn/Riskfolio-Lib"
      ref: "9eb32d350095b307bb4a3fef7e35d00c6488b283"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/riskfolio-lib/${{ matrix.version }}/0*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp lib/eigen-3.4.0/COPYING.MPL2 COPYING.eigen
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # matplotlib (already pinned below) transitively pulls in pillow; PyPI's pillow
      # is newer than our registry's ceiling, so an unbounded test install picks PyPI's
      # sdist-only release and fails to build it (no libjpeg headers in the manylinux
      # image). Pin pillow to our registry's wheel for the test install too.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pandas,matplotlib,pillow,clarabel,scs,scikit-learn,statsmodels,arch,astropy,cvxpy,osqp,highspy,qdldl,sparsediffpy"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # tests/test_portfolio.py's 6 Classic/HC optimization tests compare live solver
      # output against frozen CSV snapshots with assert_array_almost_equal(decimal=6);
      # upstream's own CI has this test file's step commented out on every OS/arch it
      # builds (see Riskfolio-Lib's .github/workflows/build.yml), so those snapshots are
      # untested against any live solver version, and HRP/HERC additionally run
      # hierarchical-clustering tie-breaks that flip under tiny floating-point
      # differences - not riscv64-specific, just never exercised anywhere, on an
      # ill-conditioned covariance matrix (CI log shows scipy's LinAlgWarning plus
      # CVXPY's "solution may be inaccurate" on the same inputs). Separately,
      # test_hc_nco_optimization fails unconditionally on any platform: it calls
      # HCPortfolio.optimization(covariance=...), a kwarg the method (method_cov=, not
      # covariance=) has never accepted in 7.4.0 - verified against the pinned commit's
      # own source - an upstream test/library mismatch, not a riscv64 issue.
      cibw-test-command: "python -c \"import riskfolio; print(riskfolio.__version__)\" && python -m pytest tests -v -k \"not test_classic_minrisk_optimization and not test_classic_sharpe_optimization and not test_classic_riskparity_optimization and not test_worst_case_optimization and not test_hc_hrp_optimization and not test_hc_herc_optimization and not test_hc_nco_optimization\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      RISKFOLIO_LIB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: riskfolio-lib-${{ env.RISKFOLIO_LIB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and all licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("riskfolio/external/functions") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE.txt", "COPYING.eigen"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish riskfolio-lib ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: riskfolio-lib-${{ matrix.version }}-*-manylinux_riscv64
