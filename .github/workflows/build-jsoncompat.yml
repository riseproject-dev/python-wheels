---
# Based on upstream's own wheel builder (`python-linux` job):
#   https://github.com/ostrowr/jsoncompat/blob/v0.4.2/.github/workflows/ci.yml
name: Build jsoncompat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jsoncompat.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jsoncompat.yml'
      - 'docs/packages/jsoncompat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jsoncompat.yml'
      - 'docs/packages/jsoncompat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jsoncompat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jsoncompat ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # is pybindings/ in this workspace -- the licence file lives at the
    # repo root instead (semantic-text-splitter/moyopy hit the same gap).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jsoncompat"
      version: "${{ matrix.version }}"
      repository: "ostrowr/jsoncompat"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: "cp LICENSE pybindings/"
      cibw-package-dir: "pybindings"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # jsoncompat ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-command: >
        python -c "import importlib.metadata as md, jsoncompat as jsc, jsoncompat._native as native;
        assert native.__file__.endswith('.so'), native.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('jsoncompat'));
        schema = '{\"type\": \"string\", \"minLength\": 1}';
        assert jsc.check_compat(schema, schema, jsc.Role.BOTH) is True;
        validator = jsc.validator_for(schema);
        assert validator.is_valid_json('\"hello\"') is True;
        assert validator.is_valid_json('42') is False;
        generator = jsc.generator_for(schema);
        assert validator.is_valid_json(generator.generate_value(depth=3)) is True"

  publish:
    name: Publish jsoncompat ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jsoncompat-${{ matrix.version }}-*-manylinux_riscv64
