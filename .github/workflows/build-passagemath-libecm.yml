---
# passagemath-libecm is split out of the passagemath/passagemath monorepo
# at pkgs/sagemath-libecm, tagged passagemath-<version>; the sdist is built
# the same way as build-passagemath-objects.yml. Same sage_conf-in-build-system
# + repair_wheel.py shape as build-passagemath-cddlib.yml (gotcha 716):
# passagemath-conf's own spkg-ensure machinery builds GMP-ECM from
# build/pkgs/ecm's pinned checksums.ini tarball, not a hand-rolled
# CIBW_BEFORE_ALL_LINUX configure/make.
name: Build passagemath-libecm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-libecm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-libecm.yml'
      - 'docs/packages/passagemath-libecm.yaml'
      - 'patches/passagemath-libecm/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-libecm.yml'
      - 'docs/packages/passagemath-libecm.yaml'
      - 'patches/passagemath-libecm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-libecm
      version: ${{ inputs.version }}
      # cysignals/memory-allocator (build requirements) have no cp311 riscv64 wheel
      python-exclude: "cp39 cp311"

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_LIBECM_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_LIBECM_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_LIBECM_VERSION }}
        filter: blob:none
        # pkgs/sagemath-libecm/VERSION.txt is a symlink to ../../VERSION.txt,
        # so the repo-root VERSION.txt must be in the sparse checkout too.
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          /VERSION.txt
          build
          m4
          pkgs/sagemath-libecm
          src/sage/libs/libecm.p*
          src/sage/libs/all__sagemath_libecm.py
          src/sage/interfaces/ecm.*
          src/sage/interfaces/all__sagemath_libecm.py
          src/sage/all__sagemath_libecm.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-libecm source
      run: git apply python-wheels/patches/passagemath-libecm/${{ env.PASSAGEMATH_LIBECM_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-libecm
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_LIBECM_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_LIBECM_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-libecm-${{ env.PASSAGEMATH_LIBECM_VERSION }}-sdist
        path: pkgs/sagemath-libecm/dist/*.tar.gz
        if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-libecm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_LIBECM_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-libecm-${{ env.PASSAGEMATH_LIBECM_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
        CIBW_BEFORE_ALL_LINUX: >-
          if command -v dnf; then dnf install -y gmp-devel mpfr-devel libmpc-devel;
          else apk add gmp-dev mpfr-dev mpc1-dev; fi
        CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        # Upstream's own repair-wheel-command pip installs passagemath-conf unpinned; pin it
        # to the same release the build step used so repair_wheel.py tars GMP-ECM's bundled
        # ecm binary from the sage tree ecm-ensure actually populated, not whatever upstream
        # has published by the time this leg's repair step runs (gotcha 719).
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
          python3 -m pip install "passagemath-conf~=${{ matrix.version }}.0" auditwheel &&
          python3 {project}/repair_wheel.py {wheel} &&
          auditwheel repair -w {dest_dir} {wheel}
        # sagemath-pari/-repl (the real test extras) are unported, so this
        # replays libecm.pyx's own doctest value for a tiny factorization.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.libs.libecm import ecmfactor;
          result = ecmfactor(999, 0.00);
          assert result[0] is True, result;
          assert result[1] in [3, 9, 27, 37, 111, 333, 999], result;
          print('libecm ok', result)"

    - name: Check the wheel ships the extension and the vendored licences
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/libs/libecm") and n.endswith(".so") for n in names), whl
            libs = [n for n in names if n.startswith("passagemath_libecm.libs/")]
            assert any("ecm" in n for n in libs), (whl, libs)
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE", "LICENSE.ecm"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-libecm-${{ env.PASSAGEMATH_LIBECM_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-libecm ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-libecm-${{ matrix.version }}-*_riscv64
