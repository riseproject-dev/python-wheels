---
# This workflow is based on: https://github.com/equinor/xtgeo/blob/4.25.1/.github/workflows/publish.yml
name: Build xtgeo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xtgeo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xtgeo.yml'
      - 'docs/packages/xtgeo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xtgeo.yml'
      - 'docs/packages/xtgeo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xtgeo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xtgeo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "xtgeo"
      version: "${{ matrix.version }}"
      repository: "equinor/xtgeo"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # fmt-devel is EPEL-only and riscv64 has no EPEL; CMake fetches fmt instead.
      cibw-before-all-linux: "yum install -y eigen3-devel"
      cibw-before-build: "python -m pip install -U pip"
      # numpy has no riscv64 wheel on public PyPI; PIP_ONLY_BINARY keeps pip
      # from source-building it (both for the build and for CIBW_TEST_COMMAND's
      # test-extras install). pillow is listed too (gotcha 291): it's a
      # transitive matplotlib dep, PyPI's newest pillow sdist has no riscv64
      # wheel and fails to build from source (missing libjpeg headers in the
      # manylinux image) - our own registry carries riscv64 pillow wheels.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pandas,scipy,pyarrow,h5py,hdf5plugin,matplotlib,segyio,shapely,pillow SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XTGEO=${{ matrix.version }}"
      cibw-test-extras: "dev"
      # pytest-benchmark's fixture reads Function._nodeid, which pytest 9.2 removed, so
      # every benchmark test errors at setup; stay on the pytest 9.1 series.
      cibw-test-requires: "pytest<9.2"
      cibw-before-test: "pushd {package} && git clone --depth 1 https://github.com/equinor/xtgeo-testdata ../xtgeo-testdata || true"
      cibw-test-command: "pushd {package} && pytest -n 4 tests --disable-warnings -m \"not hypothesis\" --ignore tests/test_well --ignore-glob=\"*forks.py\""

  publish:
    name: Publish xtgeo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: xtgeo-${{ matrix.version }}-*-manylinux_riscv64
