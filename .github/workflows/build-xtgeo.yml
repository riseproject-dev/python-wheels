---
# This workflow is based on: https://github.com/equinor/xtgeo/blob/v4.25.1/.github/workflows/publish.yml
name: Build xtgeo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xtgeo.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xtgeo.yml'
      - 'docs/packages/xtgeo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xtgeo.yml'
      - 'docs/packages/xtgeo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xtgeo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xtgeo ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's own matrix (cp311-cp314) minus cp311: numpy>=2.5
        # sets 3.12 as its floor and our registry only hosts that line.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      XTGEO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout xtgeo ${{ env.XTGEO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: equinor/xtgeo
          ref: v${{ env.XTGEO_VERSION }}
          fetch-depth: 0  # setuptools_scm derives the version from the tag history
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/xtgeo/${{ env.XTGEO_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: python -m pip install -U pip
          # numpy has no riscv64 wheel on public PyPI; PIP_ONLY_BINARY keeps pip
          # from source-building it (both for the build and for CIBW_TEST_COMMAND's
          # test-extras install).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pandas,scipy,pyarrow,h5py,hdf5plugin,matplotlib,segyio,shapely
          CIBW_TEST_EXTRAS: dev
          CIBW_BEFORE_TEST: >-
            pushd {package} &&
            git clone --depth 1 https://github.com/equinor/xtgeo-testdata ../xtgeo-testdata || true
          CIBW_TEST_COMMAND: >-
            pushd {package} &&
            pytest -n 4 tests --disable-warnings -m "not hypothesis" --ignore tests/test_well --ignore-glob="*forks.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xtgeo-${{ env.XTGEO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish xtgeo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: xtgeo-${{ matrix.version }}-*-manylinux_riscv64
