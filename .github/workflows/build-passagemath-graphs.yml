---
# passagemath-graphs is split out of the passagemath/passagemath monorepo (a
# SageMath fork) at pkgs/sagemath-graphs, tagged passagemath-<version>. This
# replays build/pkgs/sagemath_graphs/spkg-src (./bootstrap renders the
# package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-graphs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-graphs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-graphs.yml'
      - 'docs/packages/passagemath-graphs.yaml'
      - 'patches/passagemath-graphs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-graphs.yml'
      - 'docs/packages/passagemath-graphs.yaml'
      - 'patches/passagemath-graphs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-graphs
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_GRAPHS_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_GRAPHS_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_GRAPHS_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-graphs
          src/sage/combinat/posets
          src/sage/combinat/abstract_tree.p*
          src/sage/combinat/binary_tree.p*
          src/sage/combinat/ordered_tree.p*
          src/sage/combinat/rooted_tree.p*
          src/sage/combinat/graph_path.p*
          src/sage/combinat/shard_order.p*
          src/sage/combinat/tamari_lattices.p*
          src/sage/combinat/nu_tamari_lattice.p*
          src/sage/combinat/interval_posets.p*
          src/sage/combinat/yang_baxter_graph.p*
          src/sage/combinat/cluster_algebra_quiver
          src/sage/combinat/finite_state_machine*.p*
          src/sage/ext_data/graphs
          src/sage/ext_data/kenzo
          src/sage/graphs
          src/sage/groups/perm_gps/partn_ref/refinement_graphs.p*
          src/sage/knots
          src/sage/sandpiles
          src/sage/topology
          src/sage/databases/knotinfo_db.p*
          # sage_setup.find.find_python_sources() prunes any directory
          # that has no __init__.py/__init__.pxd/all.py of its own unless
          # it carries an all__sagemath_graphs.py marker for this
          # distribution (see build-passagemath-categories.yml's longer
          # note on the same mechanism) - the single-file combinat/groups
          # includes above are the directories at risk here, so pull the
          # marker wherever it exists rather than chasing each one by hand.
          src/sage/**/all__sagemath_graphs.py
          src/sage/all__sagemath_graphs.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-graphs source
      run: git apply python-wheels/patches/passagemath-graphs/${{ env.PASSAGEMATH_GRAPHS_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    # ./bootstrap's own per-package render (sage-package bootstrap) runs all
    # ~650 spkgs in parallel batches and aborts a batch outright if any
    # member fails (sage_conf's needs the full configure.ac, absent from
    # this sparse checkout); render this one package ourselves so it is not
    # at the mercy of that batch's luck.
    - name: Render pkgs/sagemath-graphs/pyproject.toml.m4
      working-directory: pkgs/sagemath-graphs
      run: |
        export M4PATH="$GITHUB_WORKSPACE/m4"
        for f in *.m4; do m4 "$f" > "${f%.m4}"; done

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-graphs
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_GRAPHS_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_GRAPHS_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-graphs-${{ env.PASSAGEMATH_GRAPHS_VERSION }}-sdist
        path: pkgs/sagemath-graphs/dist/*.tar.gz
        if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-graphs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_GRAPHS_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-graphs-${{ env.PASSAGEMATH_GRAPHS_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
        # spkg-configure.m4's AX_BOOST_BASE([1.83.0]) accepts a system
        # Boost, and the manylinux_riscv64 image's own Rocky 10
        # CRB/AppStream repos already carry boost-devel 1.83.0 (same
        # package build-ompl.yml/build-cgal.yml dnf-install) - so this
        # never falls back to build/pkgs/boost_cropped's from-source cmake
        # build. sage/graphs/base/boost_interface.cpp only uses the
        # header-only Boost Graph Library algorithms, so headers are
        # enough; nothing from Boost itself is linked into the wheel.
        # It also means sage_setup()'s make("boost_cropped-ensure
        # graphs-ensure") (run through passagemath-conf, a build-system
        # requirement here) finds the system Boost and skips building it,
        # same shape build-passagemath-cddlib.yml already proved green for
        # the cddlib spkg/passagemath-conf/repair_wheel.py pipeline.
        CIBW_BEFORE_ALL_LINUX: |
          if command -v apk >/dev/null; then
            apk add --no-cache boost-dev gmp-dev mpfr-dev mpc1-dev
          else
            dnf install -y --setopt=install_weak_deps=False boost-devel gmp-devel mpfr-devel libmpc-devel
          fi
        CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        # sagemath-repl (the real test extra) is unported, so this exercises
        # the Boost-backed connectivity algorithm directly through the
        # Cython bindings, same minimal-duck-typed-graph shape as the
        # bliss/mcqd/cliquer sibling ports.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.graphs.base.boost_graph import eccentricity;
          G=type('G',(object,),{'order':lambda s:5,'num_edges':lambda s:5,'vertices':lambda s,sort=False:list(range(5)),'vertex_iterator':lambda s:iter(range(5)),'edge_iterator':lambda s,labels=True:iter([(0,1,None),(1,2,None),(2,3,None),(3,4,None),(4,0,None)]),'is_directed':lambda s:False,'weighted':lambda s:False});
          r=eccentricity(G(), algorithm='Dijkstra_Boost');
          assert r==[2,2,2,2,2], r;
          print('boost_graph ok', r)"

    - name: Check the wheel ships the extension and the licences
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/graphs/base/boost_graph") and n.endswith(".so") for n in names), whl
            # repair_wheel.py's own tar step (upstream's, unmodified) bundles
            # SAGE_LOCAL/share/graphs built via make("graphs-ensure").
            assert any(n.startswith("sage_wheels/share/graphs/") for n in names), whl
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-graphs-${{ env.PASSAGEMATH_GRAPHS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-graphs ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-graphs-${{ matrix.version }}-*_riscv64
