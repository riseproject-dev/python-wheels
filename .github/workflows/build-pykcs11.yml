---
# This workflow is based on: https://github.com/LudovicRousseau/PyKCS11/blob/1.5.20/.github/workflows/linux.yml
name: Build pykcs11 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pykcs11.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pykcs11.yml'
      - 'docs/packages/pykcs11.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pykcs11.yml'
      - 'docs/packages/pykcs11.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pykcs11
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pykcs11 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pykcs11
      version: ${{ matrix.version }}
      repository: LudovicRousseau/PyKCS11
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # swig is required to generate the _LowLevel C++ extension (setup.py's
      # build_py checks `which("swig")`); it's a build-time code generator
      # only, not linked into the wheel, and resolves from Rocky 10's own
      # repos on riscv64 (no EPEL needed, gotcha 51).
      cibw-before-all-linux: dnf -y install swig
      # PyKCS11 dlopen()s a PKCS#11 module (e.g. a hardware token driver or
      # SoftHSM2) at runtime via a user-supplied path; no such module is
      # available in the manylinux container, so the smoke test is limited
      # to proving the SWIG-generated extension itself loads and runs real
      # C++ code, the same depth as upstream's own tox/coverage runs would
      # need a live PKCS#11 module to go further.
      cibw-test-command: >-
        python -c "import PyKCS11, PyKCS11.LowLevel;
        lib = PyKCS11.PyKCS11Lib();
        assert isinstance(lib, PyKCS11.PyKCS11Lib);
        a = PyKCS11.LowLevel.CK_ATTRIBUTE_SMART();
        a.SetNum(PyKCS11.CKA_CLASS, PyKCS11.CKO_SECRET_KEY);
        assert a.GetNum() == PyKCS11.CKO_SECRET_KEY"
      timeout-minutes: 60

  publish:
    name: Publish pykcs11 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pykcs11-${{ matrix.version }}-*-manylinux_riscv64
