---
# This workflow is based on: https://github.com/LudovicRousseau/PyKCS11/blob/1.5.20/.github/workflows/linux.yml
name: Build pykcs11 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pykcs11.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pykcs11.yml'
      - 'docs/packages/pykcs11.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pykcs11.yml'
      - 'docs/packages/pykcs11.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pykcs11
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pykcs11 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp39"
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYKCS11_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pykcs11 ${{ env.PYKCS11_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LudovicRousseau/PyKCS11
          ref: ${{ env.PYKCS11_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # swig is required to generate the _LowLevel C++ extension (setup.py's
          # build_py checks `which("swig")`); it's a build-time code generator
          # only, not linked into the wheel, and resolves from Rocky 10's own
          # repos on riscv64 (no EPEL needed, gotcha 51).
          CIBW_BEFORE_ALL_LINUX: dnf -y install swig
          # PyKCS11 dlopen()s a PKCS#11 module (e.g. a hardware token driver or
          # SoftHSM2) at runtime via a user-supplied path; no such module is
          # available in the manylinux container, so the smoke test is limited
          # to proving the SWIG-generated extension itself loads and runs real
          # C++ code, the same depth as upstream's own tox/coverage runs would
          # need a live PKCS#11 module to go further.
          CIBW_TEST_COMMAND: >-
            python -c "
            import PyKCS11, PyKCS11.LowLevel;
            lib = PyKCS11.PyKCS11Lib();
            assert isinstance(lib, PyKCS11.PyKCS11Lib);
            PyKCS11.LowLevel.CK_ATTRIBUTE()
            "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pykcs11-${{ env.PYKCS11_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pykcs11 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pykcs11-${{ matrix.version }}-*-manylinux_riscv64
