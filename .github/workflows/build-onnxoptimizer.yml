---
# This workflow is based on: https://github.com/onnx/optimizer/blob/v0.4.2/.github/workflows/build-and-test.yml
name: Build onnxoptimizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/onnxoptimizer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxoptimizer.yml'
      - 'docs/packages/onnxoptimizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxoptimizer.yml'
      - 'docs/packages/onnxoptimizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: onnxoptimizer
      # The onnx runtime dependency has no riscv64 wheel below cp311.
      python-exclude: 'cp39 cp310'
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build onnxoptimizer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # No riscv64 onnxruntime wheel on cp311; the rest of the suite still runs.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: onnxoptimizer
      version: ${{ matrix.version }}
      repository: onnx/optimizer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The riscv64 manylinux image's own cmake (3.31.8) already satisfies
      # CMakeLists.txt's cmake_minimum_required(3.22); upstream's
      # CIBW_BEFORE_ALL_LINUX pip-installs a newer one only for its older
      # manylinux_2_28 x86_64/aarch64 images.
      cibw-environment-linux: "CMAKE_ARGS=\" -DONNX_USE_PROTOBUF_SHARED_LIBS=OFF -DProtobuf_USE_STATIC_LIBS=ON -DONNX_USE_LITE_PROTO=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \""
      cibw-before-build-linux: pip install protobuf
      # Upstream's flake8p/mypy lint step and its onnxscript/torch/torchvision
      # installs cover optional test paths guarded by try/except in
      # onnxoptimizer/test/optimizer_test.py (onnxscript itself isn't even
      # imported by any test); torch and torchvision have no riscv64 wheels, so
      # those paths are left to skip rather than installed. onnxruntime does
      # have a riscv64 wheel on our registry, but only from cp312 (matrix.onnxruntime).
      cibw-test-requires: pytest pytest-xdist ${{ case(matrix.python == 'cp311', '', matrix.python == 'cp312', 'onnxruntime', '') }}
      cibw-test-command: pytest {project}/onnxoptimizer/test/

  publish:
    name: Publish onnxoptimizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: onnxoptimizer-${{ matrix.version }}-*-manylinux_riscv64
