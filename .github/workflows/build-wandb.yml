---
# This workflow is based on the `build-linux-wheels` job of
# https://github.com/wandb/wandb/blob/v0.28.2/.github/workflows/release-sdk.yml
name: Build wandb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wandb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wandb.yml'
      - 'docs/packages/wandb.yaml'
      - 'patches/wandb/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wandb.yml'
      - 'docs/packages/wandb.yaml'
      - 'patches/wandb/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Pinned by upstream for reproducible release artifacts; keep in sync with
  # RUST_TOOLCHAIN in release-sdk.yml.
  RUST_TOOLCHAIN: '1.88.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wandb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build wandb ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "wandb"
      version: "${{ matrix.version }}"
      repository: "wandb/wandb"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/wandb/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # The build hook emits an ABI-independent py3-none-* wheel, so one
      # CPython selector covers every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      cibw-before-all-linux: |-
        export DOWNLOAD_GOVERSION=$( grep '^go' core/go.mod | cut -d' ' -f2 ) && curl -L https://golang.org/dl/go$DOWNLOAD_GOVERSION.linux-riscv64.tar.gz > go.tar.gz && tar -C /usr/local/ -xzf go.tar.gz && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal --default-toolchain 1.88.0
      # NOTE: the Linux build environment lives in [tool.cibuildwheel.linux]
      # in pyproject.toml. Do not set CIBW_ENVIRONMENT_LINUX here: it would
      # replace that table, including the PATH entries for Go and cargo.
      cibw-test-command: "WANDB_MODE=offline python -c \"import wandb; run = wandb.init(); run.finish()\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # musllinux is dropped: rustup ships no riscv64 musl host toolchain, and the
    # musl wheels additionally need CGO, i.e. a riscv64 musl C toolchain.
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      WANDB_VERSION: ${{ matrix.version }}
      # wandb pulls protobuf and PyYAML at test time; neither publishes riscv64
      # wheels on PyPI.
      PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wandb-${{ env.WANDB_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries riscv64 Go and Rust binaries
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          EM_RISCV = 243
          PT_INTERP = 3
          INTERP = "/lib/ld-linux-riscv64-lp64d.so.1"
          expected = {
              "wandb/bin/wandb-core",
              "wandb/bin/librust_parquet_ffi.so",
          }
          # wandb-xpu was renamed wandb-symon in 0.31.0.
          sidecars = ("wandb/bin/wandb-xpu", "wandb/bin/wandb-symon")

          def interpreter(blob):
              phoff = int.from_bytes(blob[0x20:0x28], "little")
              phentsize = int.from_bytes(blob[0x36:0x38], "little")
              phnum = int.from_bytes(blob[0x38:0x3A], "little")
              for i in range(phnum):
                  ph = blob[phoff + i * phentsize:][:phentsize]
                  if int.from_bytes(ph[0:4], "little") != PT_INTERP:
                      continue
                  off = int.from_bytes(ph[8:16], "little")
                  size = int.from_bytes(ph[32:40], "little")
                  return blob[off:off + size].rstrip(b"\0").decode()
              return None

          for whl in sys.argv[1:]:
              with zipfile.ZipFile(whl) as zf:
                  names = set(zf.namelist())
                  present = {n for n in sidecars if n in names}
                  assert len(present) == 1, sorted(present)
                  required = expected | present
                  assert required <= names, sorted(required - names)
                  for name in sorted(required):
                      blob = zf.read(name)
                      assert blob[:4] == b"\x7fELF", (name, blob[:4])
                      machine = int.from_bytes(blob[18:20], "little")
                      assert machine == EM_RISCV, (name, machine)
                      interp = interpreter(blob)
                      assert interp in (None, INTERP), (name, interp)
                      print(name, "riscv64 ELF, interpreter:", interp)
              print(whl, "ok")
          EOF

  publish:
    name: Publish wandb ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: wandb-${{ matrix.version }}-*-manylinux_riscv64
