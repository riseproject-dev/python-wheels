---
# This workflow is based on: https://github.com/spotify/pedalboard/blob/v0.9.24/.github/workflows/all.yml
name: Build pedalboard wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pedalboard.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pedalboard.yml'
      - 'docs/packages/pedalboard.yaml'
      - 'patches/pedalboard/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pedalboard.yml'
      - 'docs/packages/pedalboard.yaml'
      - 'patches/pedalboard/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pedalboard
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pedalboard ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pedalboard"
      version: "${{ matrix.version }}"
      repository: "spotify/pedalboard"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 420
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pedalboard/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-licenses.sh <<'COLLECT_EOF'
        #!/bin/bash
        # SPDX-FileCopyrightText: 2026 The RISE Project
        # SPDX-License-Identifier: MIT
        #
        # Stage, at the project root, the licence of everything that ends up inside
        # the wheel: the libraries pedalboard compiles into pedalboard_native, and
        # every shared library auditwheel vendors out of the build image.
        # scikit-build-core's default LICEN[CS]E* glob copies them into the wheel.
        set -euo pipefail

        project="${1:?usage: collect-licenses.sh <project-dir>}"
        cd "$project"

        cp JUCE/LICENSE.md LICENSE.JUCE
        cp vendors/fftw3/COPYING LICENSE.fftw3
        cp vendors/lame/COPYING LICENSE.lame
        cp vendors/libgsm/COPYRIGHT LICENSE.libgsm
        cp vendors/pybind11/LICENSE LICENSE.pybind11
        cp vendors/rubberband/COPYING LICENSE.rubberband

        roots=(/usr/lib64/libasound.so /usr/lib64/libfreetype.so)

        # ldd is transitive, so the two libraries pedalboard links cover the whole
        # closure; ldd does not list the roots themselves, so resolve those too.
        mapfile -t libs < <(
            {
                ldd "${roots[@]}" | tr ' ' '\n' | grep '^/'
                readlink -f "${roots[@]}"
            } | sort -u
        )

        # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
        # glibc, the gcc runtime and zlib are on auditwheel's manylinux allowlist and
        # are never vendored into the wheel.
        mapfile -t pkgs < <(
            rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                grep -E '^[A-Za-z0-9._+-]+$' | sort -u |
                grep -vE '^(glibc|libgcc|libstdc\+\+|gcc|zlib-ng-compat)$'
        )

        for pkg in "${pkgs[@]}"; do
            mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

            # Some subpackages leave the licence to a sibling of the same source RPM.
            if [ -z "${files[0]:-}" ]; then
                srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                mapfile -t files < <(
                    rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                        awk -v s="$srpm" '$1 == s { print $2 }' |
                        xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                )
            fi

            # Others mark it %doc rather than %license, and the image installs no docs.
            if [ -z "${files[0]:-}" ]; then
                dnf -y reinstall --setopt=tsflags= "$pkg" >/dev/null
                mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
            fi

            for f in "${files[@]}"; do
                [ -f "$f" ] || continue
                cp "$f" "LICENSE.${pkg}.$(basename "$f")"
            done
            compgen -G "LICENSE.$pkg.*" >/dev/null ||
                { echo "no licence file found for $pkg" >&2; exit 1; }
        done

        ls -1 LICENSE.*
        COLLECT_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-build-linux: "bash {project}/collect-licenses.sh {project}"
      # Upstream's repair command pip-installs auditwheel-symbols, a Rust tool
      # with no riscv64 wheel, before every repair.
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"
      # Upstream skips its own manylinux tests (`test-skip` in pyproject.toml)
      # because its build image predates the suite's glibc requirement.
      cibw-test-skip: ''
      cibw-test-requires: "pytest pytest-mock numpy tqdm psutil mido mutagen"
      cibw-test-sources: "tests"
      # test_type_hints needs mypy and pyright, neither of which runs on riscv64.
      # The other two modules load tests/plugins/effect/Linux/CHOWTapeModel.vst3
      # while being imported, and that VST3 bundle ships an x86_64 binary only.
      # test_linux_wheel_cpu_compatibility (new in 0.9.26) tests upstream's x86_64
      # AVX-boundary CI harness under scripts/, which CIBW_TEST_SOURCES doesn't stage.
      # The deselected test asserts threaded reads beat serial ones, a timing
      # race that also fails on macOS against upstream's own wheel.
      cibw-test-command: "python -m pytest tests --ignore=tests/test_type_hints.py --ignore=tests/test_external_plugins.py --ignore=tests/test_memory_leaks.py --ignore=tests/test_linux_wheel_cpu_compatibility.py -k \"not test_read_from_bytes_io_memoryview_without_gil\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PEDALBOARD_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pedalboard-${{ env.PEDALBOARD_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the extension and the bundled licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          print("\n".join(sos))
          assert any(n.startswith("pedalboard_native.") for n in sos), sos
          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n)
          print("\n".join(lic))
          expected = {"LICENSE", "NOTICE", "LICENSE.JUCE", "LICENSE.fftw3", "LICENSE.lame",
                      "LICENSE.libgsm", "LICENSE.pybind11", "LICENSE.rubberband"}
          assert expected <= set(lic) - {""}, sorted(expected - set(lic))
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Collect GPL sources for pedalboard ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PEDALBOARD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Every copyleft library auditwheel vendors out of the build image,
      # alongside the gcc runtime.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc alsa-lib freetype glib2 graphite2 pcre2
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pedalboard-${{ env.PEDALBOARD_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pedalboard ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pedalboard-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pedalboard-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc and the copyleft libraries bundled in the wheel
