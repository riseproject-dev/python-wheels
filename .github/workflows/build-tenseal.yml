---
# Based on the `build_wheels` job of
# https://github.com/OpenMined/TenSEAL/blob/v0.3.18/.github/workflows/publish_wheels.yml
# and the `Build` job of
# https://github.com/OpenMined/TenSEAL/blob/v0.3.18/.github/workflows/tests.yml
name: Build tenseal wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tenseal.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tenseal.yml'
      - 'docs/packages/tenseal.yaml'
      - 'patches/tenseal/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tenseal.yml'
      - 'docs/packages/tenseal.yaml'
      - 'patches/tenseal/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tenseal
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tenseal ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tenseal"
      version: "${{ matrix.version }}"
      repository: "OpenMined/TenSEAL"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # MAKEFLAGS bounds setup.py's otherwise unbounded `make -j` to the runner's cores.
      cibw-environment-linux: "CMAKE_POLICY_VERSION_MINIMUM=3.5 MAKEFLAGS=-j$(nproc)  PIP_ONLY_BINARY=numpy,pillow"
      cibw-test-requires: "numpy pytest scikit-image"
      # Staged so `import tenseal` resolves to the installed wheel, not the checkout.
      cibw-test-sources: "tests pytest.ini"
      # Upstream runs the C++ suite on one interpreter only.
      cibw-test-command: "python -c \"import importlib.metadata as m; l = sorted(str(p).split('licenses/', 1)[1] for p in m.files('tenseal') if 'licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.gsl', 'LICENSE.nlohmann-json', 'LICENSE.protobuf', 'LICENSE.pybind11', 'LICENSE.seal', 'LICENSE.xsimd', 'LICENSE.xtensor', 'LICENSE.xtl', 'LICENSE.zlib', 'LICENSE.zstd'], l\" && pytest -m \"not slow\" -v tests/python/tenseal && pytest -v tests/python/sealapi ${{ matrix.python == 'cp314' && '&& sh -c \"cd {project} && CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake . -D BUILD_TEST=TRUE && make -j4 && CTEST_OUTPUT_ON_FAILURE=1 make test\"' || '' }}"

  publish:
    name: Publish tenseal ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tenseal-${{ matrix.version }}-*-manylinux_riscv64
