---
# This workflow is based on the `release` job of
# https://github.com/connectrpc/connect-python/blob/v0.9.0-connect-python/.github/workflows/release.yaml
name: Build protoc-gen-connect-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/protoc-gen-connect-python.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-protoc-gen-connect-python.yml'
      - 'docs/packages/protoc-gen-connect-python.yaml'
      - 'patches/protoc-gen-connect-python/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-protoc-gen-connect-python.yml'
      - 'docs/packages/protoc-gen-connect-python.yaml'
      - 'patches/protoc-gen-connect-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: protoc-gen-connect-python
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build protoc-gen-connect-python ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PROTOC_GEN_CONNECT_PYTHON_VERSION: ${{ matrix.version }}

    steps:
      # Upstream renamed the plugin to protoc-gen-connectrpc at v0.9.0; the old name's
      # release was cut from the v<version>-connect-python tag.
      - name: Checkout connect-python v${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-connect-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: connectrpc/connect-python
          ref: v${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-connect-python
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels/patches/protoc-gen-connect-python/${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}/*.patch

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: protoc-gen-connect-python/go.mod
          cache-dependency-path: "**/go.mod"

      - name: build codegen archives
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
          workdir: protoc-gen-connect-python

      - name: Build wheels
        working-directory: protoc-gen-connect-python
        run: |
          uv sync --frozen
          uv run python scripts/generate_wheels.py

      - name: Verify the wheel ships the riscv64 binary
        run: |
          python3 - protoc-gen-connect-python/dist/*riscv64*.whl <<'EOF'
          import os, sys, zipfile
          version = os.environ["PROTOC_GEN_CONNECT_PYTHON_VERSION"]
          assert len(sys.argv) == 2, sys.argv
          wheel = sys.argv[1]
          assert wheel.endswith(f"protoc_gen_connect_python-{version}-py3-none-manylinux_2_31_riscv64.musllinux_1_1_riscv64.whl"), wheel
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              binary = f"protoc_gen_connect_python-{version}.data/scripts/protoc-gen-connect-python"
              assert binary in names, names
              licenses = sorted(n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n)
              assert licenses == ["LICENSE"], licenses
              header = zf.read(binary)[:20]
              assert header[:4] == b"\x7fELF", header
              assert header[18] == 0xF3, header  # e_machine EM_RISCV
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protoc-gen-connect-python-${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-py3-none-manylinux_riscv64
          path: protoc-gen-connect-python/dist/*riscv64*.whl
          if-no-files-found: error

  test_wheel:
    name: Test protoc-gen-connect-python ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    env:
      PROTOC_GEN_CONNECT_PYTHON_VERSION: ${{ matrix.version }}
      UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_ONLY_BINARY: ':all:'
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout connect-python v${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-connect-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: connectrpc/connect-python
          ref: v${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-connect-python
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: protoc-gen-connect-python-${{ env.PROTOC_GEN_CONNECT_PYTHON_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --no-index --find-links wheelhouse protoc-gen-connect-python

      # Upstream's `just checkgenerate` (buf + `go run` of the plugin) narrowed to the
      # installed binary: regenerating the committed *_connect.py must leave no diff.
      - name: Test wheel
        run: |
          set -euo pipefail
          plugin=$(command -v protoc-gen-connect-python)
          protoc() {
            uv run --no-project --python 3.12 --with grpcio-tools python -m grpc_tools.protoc \
              --plugin=protoc-gen-connect-python="$plugin" "$@"
          }
          (cd test && protoc -I proto --connect-python_out=imports=relative:. proto/haberdasher.proto)
          (cd example && protoc -I proto --connect-python_out=. proto/example/eliza.proto)
          files="test/haberdasher_connect.py example/example/eliza_connect.py"
          uvx ruff@0.15.6 check --fix --unsafe-fixes --exit-zero $files
          uvx ruff@0.15.6 format $files
          git status --porcelain
          git diff --exit-code

  publish:
    name: Publish protoc-gen-connect-python ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: protoc-gen-connect-python-${{ matrix.version }}-py3-none-manylinux_riscv64
