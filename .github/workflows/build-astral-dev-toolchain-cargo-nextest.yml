---
# This workflow is based on the `build-cargo-nextest-binaries` job of
# https://github.com/nextest-rs/nextest/blob/cargo-nextest-0.9.149/.github/workflows/release.yml
# packaged the way Astral's astral-dev-toolchain wheels are: cargo-nextest
# compiled by maturin as `bindings = "bin"` from the upstream tag.
name: Build astral-dev-toolchain-cargo-nextest wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/astral-dev-toolchain-cargo-nextest.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-astral-dev-toolchain-cargo-nextest.yml'
      - 'docs/packages/astral-dev-toolchain-cargo-nextest.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-astral-dev-toolchain-cargo-nextest.yml'
      - 'docs/packages/astral-dev-toolchain-cargo-nextest.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: astral-dev-toolchain-cargo-nextest
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build astral-dev-toolchain-cargo-nextest ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      CARGO_NEXTEST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout nextest cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nextest-rs/nextest
          ref: cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}
          persist-credentials: false

      # Astral's packaging repository is not public; this reproduces the
      # metadata of its published wheels on top of the upstream crate.
      - name: Write pyproject.toml
        run: |
          cat > cargo-nextest/pyproject.toml <<'EOF'
          [build-system]
          requires = ["maturin>=1.14,<2.0"]
          build-backend = "maturin"

          [project]
          name = "astral-dev-toolchain-cargo-nextest"
          dynamic = ["version", "description", "readme", "keywords", "license", "urls"]

          [tool.maturin]
          bindings = "bin"
          EOF

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        env:
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        with:
          command: build
          target: riscv64gc-unknown-linux-gnu
          args: --release -m cargo-nextest/Cargo.toml -o dist
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - name: Verify the wheel ships the riscv64 cargo-nextest binary
        run: |
          python3 - dist/*.whl <<'EOF'
          import os, sys, zipfile
          version = os.environ["CARGO_NEXTEST_VERSION"]
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              assert os.path.basename(sys.argv[1]).startswith(f"astral_dev_toolchain_cargo_nextest-{version}-py3-none-manylinux_"), sys.argv[1]
              binary = f"astral_dev_toolchain_cargo_nextest-{version}.data/scripts/cargo-nextest"
              assert binary in names, names
              licenses = sorted(n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n)
              assert licenses == ["LICENSE-APACHE", "LICENSE-MIT"], licenses
              header = zf.read(binary)[:20]
              assert header[:4] == b"\x7fELF", header
              assert header[18] == 0xF3, header
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: astral-dev-toolchain-cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}-py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test astral-dev-toolchain-cargo-nextest ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    env:
      CARGO_NEXTEST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout nextest cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nextest-rs/nextest
          ref: cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: astral-dev-toolchain-cargo-nextest-${{ env.CARGO_NEXTEST_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable

      - name: Install wheel
        run: uv pip install --find-links wheelhouse "astral-dev-toolchain-cargo-nextest==${CARGO_NEXTEST_VERSION}"

      # Upstream's own integration tests drive the binary against
      # fixtures/fixture-project; this runs the same fixture through the
      # installed cargo subcommand.
      - name: Test wheel
        working-directory: fixtures/fixture-project
        run: |
          set -euxo pipefail
          cargo nextest --version | tee "$RUNNER_TEMP/version.txt"
          grep -F "cargo-nextest ${CARGO_NEXTEST_VERSION}" "$RUNNER_TEMP/version.txt"
          grep -F "host: riscv64gc-unknown-linux-gnu" "$RUNNER_TEMP/version.txt"

          cargo nextest list --workspace
          cargo nextest run --workspace -E 'test(=test_success) | test(=test_cwd) | test(=test_execute_bin) | test(=test_success_should_panic) | test(=test_stdin_closed)'

          rc=0
          cargo nextest run -E 'test(=test_failure_assert) | test(=test_segfault)' || rc=$?
          [ "$rc" -eq 100 ]

  publish:
    name: Publish astral-dev-toolchain-cargo-nextest ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: astral-dev-toolchain-cargo-nextest-${{ matrix.version }}-py3-none-manylinux_riscv64
