---
# This workflow is based on: https://github.com/pavlin-policar/openTSNE/blob/v1.0.4/azure-pipelines-release.yml
name: Build opentsne wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/opentsne.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-opentsne.yml'
      - 'docs/packages/opentsne.yaml'
      - 'patches/opentsne/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opentsne.yml'
      - 'docs/packages/opentsne.yaml'
      - 'patches/opentsne/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: opentsne
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build opentsne ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "opentsne"
      version: "${{ matrix.version }}"
      repository: "pavlin-policar/openTSNE"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py's has_c_library("fftw3") probe finds no FFTW3 headers in the
      # manylinux image (upstream's own Linux release job doesn't install them
      # either, per azure-pipelines-release.yml's CIBW_BUILD step), so this
      # falls back to the numpy FFT implementation, same as upstream's own
      # manylinux wheels.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,scikit-learn"
      # Mirrors upstream's own pytest invocation (azure-pipelines-release.yml).
      # hnswlib/pynndescent are optional extras with no riscv64 wheels on our
      # registry; their tests self-skip via unittest.skipIf when not installed.
      # test-sources (gotcha 25): the openTSNE package sits at the repo root
      # next to tests/, so running pytest from {project} shadows the installed
      # wheel with the uncompiled source tree; stage just tests/ + pyproject.toml
      # into an empty cwd instead.
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "pytest -v tests"

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      OPENTSNE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup.py adds -fopenmp to every extension when has_c_library("omp"), so
      # auditwheel vendors the image's libgomp into opentsne.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: opentsne-${{ env.OPENTSNE_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish opentsne ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: opentsne-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: opentsne-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
