---
# This workflow is based on: https://github.com/aiortc/pylsqpack/blob/0.3.24/.github/workflows/tests.yml
name: Build pylsqpack wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylsqpack.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylsqpack.yml'
      - 'docs/packages/pylsqpack.yaml'
      - 'patches/pylsqpack/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylsqpack.yml'
      - 'docs/packages/pylsqpack.yaml'
      - 'patches/pylsqpack/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylsqpack
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pylsqpack ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pylsqpack"
      version: "${{ matrix.version }}"
      repository: "aiortc/pylsqpack"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 90

      checkout-submodules: "true"

      patches: true

      # cp310 first: binding.c defines PY_SSIZE_T_CLEAN, whose PyArg_Parse*
      # aliases were dropped in 3.13, so an abi3 wheel compiled on a newer
      # interpreter raises SystemError on 3.10-3.12 despite its tag (gotcha 96).
      # The later entries build nothing; they re-test the one wheel.
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(p.name for p in m.files('pylsqpack') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.ls-qpack', 'LICENSE.xxhash'], f\" && python -m unittest discover -v -s {project}/tests"

  publish:
    name: Publish pylsqpack ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pylsqpack-${{ matrix.version }}-*-manylinux_riscv64
