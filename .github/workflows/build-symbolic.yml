---
# This workflow is based on the python-wheel-linux job of
# https://github.com/getsentry/symbolic/blob/13.9.0/.github/workflows/build.yml (py/manylinux.sh)
# and the test-python job of
# https://github.com/getsentry/symbolic/blob/13.9.0/.github/workflows/ci.yml
name: Build symbolic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/symbolic.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-symbolic.yml'
      - 'docs/packages/symbolic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-symbolic.yml'
      - 'docs/packages/symbolic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: symbolic
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build symbolic ${{ matrix.version }} py2.py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    container:
      image: quay.io/pypa/manylinux_2_39_riscv64
    defaults:
      run:
        shell: bash
    env:
      SYMBOLIC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout symbolic ${{ env.SYMBOLIC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: getsentry/symbolic
          ref: ${{ env.SYMBOLIC_VERSION }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          yum -y -q -e 0 install gcc libffi-devel
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Upstream's wheels ship no licence; stage the project's and the C/C++ sources compiled into _lowlevel__lib.so.
      - name: Stage licences
        run: |
          cargo fetch
          cp LICENSE py/LICENSE
          cp symbolic-demangle/vendor/swift/LICENSE.txt py/LICENSE.swift
          cp symbolic-demangle/vendor/swift/LICENSE_LLVM.txt py/LICENSE.llvm
          zstd_sys="$(cargo metadata --format-version 1 \
            | python -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "zstd-sys"))')"
          cp "$(dirname "$zstd_sys")/zstd/LICENSE" py/LICENSE.zstd

      - name: Build wheel
        working-directory: py
        run: |
          python -m pip install --upgrade setuptools wheel milksnake cffi pycparser auditwheel
          python setup.py bdist_wheel
          for wheel in dist/*-linux_*.whl; do
            auditwheel show "$wheel"
            auditwheel repair "$wheel" -w dist/
            rm "$wheel"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: symbolic-${{ env.SYMBOLIC_VERSION }}-py2.py3-none-manylinux_riscv64
          path: py/dist/*.whl
          if-no-files-found: error

  test_wheel:
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
    name: Test symbolic ${{ matrix.version }} ${{ matrix.python }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    container:
      image: quay.io/pypa/manylinux_2_39_riscv64
    defaults:
      run:
        shell: bash
    env:
      SYMBOLIC_VERSION: ${{ matrix.version }}
      PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
      PIP_ONLY_BINARY: cffi

    steps:
      - name: Checkout symbolic ${{ env.SYMBOLIC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: getsentry/symbolic
          ref: ${{ env.SYMBOLIC_VERSION }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: symbolic-${{ env.SYMBOLIC_VERSION }}-py2.py3-none-manylinux_riscv64
          path: dist

      - name: Use manylinux Python
        run: |
          tag="${{ matrix.python }}"
          echo "/opt/python/${tag%t}-${tag}/bin" >> "$GITHUB_PATH"

      # Upstream pins pytest<6, which predates Python 3.10.
      - name: Install wheel
        run: python -m pip install dist/*.whl pytest

      # Removing the checkout's package makes the suite import the installed wheel.
      - name: Test
        working-directory: py
        run: |
          rm -rf symbolic
          python -m pytest -v tests

  publish:
    name: Publish symbolic ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: symbolic-${{ matrix.version }}-*-manylinux_riscv64
