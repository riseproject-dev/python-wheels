---
# Based on https://github.com/MacPython/statsmodels-wheels/blob/main/.github/workflows/build-wheels.yml
name: Build statsmodels wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'statsmodels version to build (git tag without leading v, e.g. 0.14.6)'
        required: true
        default: '0.14.6'
  pull_request:
    paths:
      - '.github/workflows/build-statsmodels.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.14.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  STATSMODELS_VERSION: ${{ inputs.version || '0.14.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build statsmodels ${{ inputs.version || '0.14.6' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        # scipy is a build requirement and pypi.riseproject.dev tops out at scipy
        # 1.15.2/cp313, so cp314 and cp314t cannot resolve one yet.
        python: ["cp312", "cp313"]

    steps:
      - name: Checkout statsmodels v${{ env.STATSMODELS_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: statsmodels/statsmodels
          ref: v${{ env.STATSMODELS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # PIP_ONLY_BINARY keeps numpy/scipy/pandas on our registry's riscv64 wheels
          # instead of source-building the newer releases PyPI offers; setuptools_scm
          # is pinned because the shallow tag checkout carries no version history.
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_STATSMODELS=${{ env.STATSMODELS_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pandas
            MKL_NUM_THREADS=1
            OMP_NUM_THREADS=1
            OPENBLAS_NUM_THREADS=1
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --strip -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest pytest-xdist pytest-randomly threadpoolctl pytest-run-parallel
          CIBW_TEST_COMMAND: >-
            python -c "import numpy; numpy.show_runtime(); import statsmodels;
            statsmodels.test(['-m', '(not slow and not example)', '-n', '2',
            '--randomly-dont-reset-seed'], exit=True)"

      - name: Check the wheel ships the compiled extensions
        run: |
          python3 - <<'EOF'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("wheelhouse/*.whl")[0]).namelist()
          assert any(n.endswith(".so") for n in names), names
          assert any(n.endswith("LICENSE.txt") for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: statsmodels-${{ env.STATSMODELS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish statsmodels ${{ inputs.version || '0.14.6' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: statsmodels-${{ env.STATSMODELS_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
