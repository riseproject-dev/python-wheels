---
# Based on https://github.com/MacPython/statsmodels-wheels/blob/main/.github/workflows/build-wheels.yml
name: Build statsmodels wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/statsmodels.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-statsmodels.yml'
      - 'docs/packages/statsmodels.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-statsmodels.yml'
      - 'docs/packages/statsmodels.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: statsmodels
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build statsmodels ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "statsmodels"
      version: "${{ matrix.version }}"
      repository: "statsmodels/statsmodels"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 720
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/statsmodels/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # PIP_ONLY_BINARY keeps numpy/scipy/pandas on our registry's riscv64 wheels
      # instead of source-building the newer releases PyPI offers; setuptools_scm
      # is pinned because the patched tree is dirty at the tag. statsmodels'
      # meson.build calls setuptools_scm.get_version() directly with no dist_name,
      # so only the unscoped var (not _FOR_STATSMODELS) is honored.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }} PIP_ONLY_BINARY=numpy,scipy,pandas MKL_NUM_THREADS=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1"
      cibw-repair-wheel-command-linux: "auditwheel repair --strip -w {dest_dir} {wheel}"
      # pytest 9.1 made strict_parametrization_ids the default, which rejects the
      # duplicate parametrize ids in statsmodels' test_moment_helpers at collection.
      cibw-test-requires: "pytest<9.1 pytest-xdist pytest-randomly threadpoolctl pytest-run-parallel"
      # test_seasonal_order[estimated] asserts a maximum-likelihood fit that
      # upstream itself logs as non-convergent lands within 1e-4 of the truth;
      # riscv64's BLAS stops it at 1.9e-3 where aarch64 reaches 2.4e-8.
      cibw-test-command: "python -c \"import numpy; numpy.show_runtime(); import statsmodels; statsmodels.test(['-m', '(not slow and not example)', '-n', '2', '-k', 'not (test_seasonal_order and estimated)', '--randomly-dont-reset-seed'], exit=True)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      STATSMODELS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: statsmodels-${{ env.STATSMODELS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extensions
        run: |
          python3 - <<'EOF'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("wheelhouse/*.whl")[0]).namelist()
          assert any(n.endswith(".so") for n in names), names
          assert any(n.endswith("LICENSE.txt") for n in names), names
          EOF

  publish:
    name: Publish statsmodels ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: statsmodels-${{ matrix.version }}-*-manylinux_riscv64
