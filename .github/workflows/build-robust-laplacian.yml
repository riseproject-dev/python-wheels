---
# This workflow is based on the `build_wheels` job of
# https://github.com/nmwsharp/robust-laplacians-py/blob/v1.1.0/.github/workflows/publish.yml
name: Build robust-laplacian wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/robust-laplacian.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-robust-laplacian.yml'
      - 'docs/packages/robust-laplacian.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-robust-laplacian.yml'
      - 'docs/packages/robust-laplacian.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Pins from .gitmodules at v1.1.0 (git ls-tree v1.1.0 deps/), used to fetch
  # each vendored dependency's own licence at the exact compiled-in revision.
  PYBIND11_SHA: 45fab4087eaaff234227a10cf7845e8b07f28a98
  EIGEN_SHA: 81bdde705cc69776fd63c870581ee0c793d48873

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: robust-laplacian
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build robust-laplacian ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "robust-laplacian"
      version: "${{ matrix.version }}"
      repository: "nmwsharp/robust-laplacians-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        set -euo pipefail
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/45fab4087eaaff234227a10cf7845e8b07f28a98/LICENSE" -o LICENSE.pybind11
        {
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/81bdde705cc69776fd63c870581ee0c793d48873/COPYING.README"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/81bdde705cc69776fd63c870581ee0c793d48873/COPYING.MPL2"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/81bdde705cc69776fd63c870581ee0c793d48873/COPYING.BSD"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/81bdde705cc69776fd63c870581ee0c793d48873/COPYING.LGPL"
        } > LICENSE.eigen
        cp deps/geometry-central/LICENSE LICENSE.geometry-central
        cp deps/geometry-central/deps/happly/LICENSE LICENSE.happly
        # nanoflann (BSD) and nanort (MIT) are vendored straight into
        # geometry-central (no submodule of their own); jc_voronoi (MIT) is
        # vendored straight into this repo. All three carry their licence
        # as a header comment instead of a LICENSE file.
        sed -n '1,30p' deps/geometry-central/deps/nanoflann/include/nanoflann.hpp > LICENSE.nanoflann
        sed -n '5,28p' deps/geometry-central/deps/nanort/include/nanort/nanort.h > LICENSE.nanort
        sed -n '1479,1500p' deps/jc_voronoi/include/jc_voronoi/jc_voronoi.h > LICENSE.jc_voronoi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-config-file: ".github/workflows/cibuildwheel_config.toml"
      # scikit-build-core's own pip-installed cmake/ninja (which upstream's
      # before-all forces by removing the image's cmake) both have riscv64
      # wheels on our registry already, so upstream's config needs no
      # riscv64-specific override here.
      # The upstream build's default Release config (scikit-build-core's
      # own default) crashes the in-wheel test with a SIGSEGV and no
      # Python traceback on every interpreter leg; RelWithDebInfo (-O2
      # instead of -O3) does not. No further root cause was found after
      # a native gdb backtrace came back clean under it too (nothing to
      # see because nothing crashed) - see gotcha 662.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,cmake,ninja SKBUILD_CMAKE_BUILD_TYPE=RelWithDebInfo"
      cibw-test-requires: "scipy"
      cibw-test-command: "python {project}/test/robust_laplacian_test.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ROBUST_LAPLACIAN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: robust-laplacian-${{ env.ROBUST_LAPLACIAN_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert exts and any("robust_laplacian_bindings" in n for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          expected = {"LICENSE", "LICENSE.pybind11", "LICENSE.eigen",
                      "LICENSE.geometry-central", "LICENSE.happly",
                      "LICENSE.nanoflann", "LICENSE.nanort", "LICENSE.jc_voronoi"}
          assert licences == expected, licences
          EOF

  publish:
    name: Publish robust-laplacian ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: robust-laplacian-${{ matrix.version }}-*-manylinux_riscv64
