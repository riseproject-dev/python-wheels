---
# This workflow is based on: https://github.com/nomonosound/numpy-rms/blob/0.7.0/.github/workflows/build.yml
name: Build numpy-rms wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'numpy-rms version to build (git tag, e.g. 0.7.0)'
        required: true
        default: '0.7.0'
  pull_request:
    paths:
      - '.github/workflows/build-numpy-rms.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.7.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.7.0 there.
  NUMPY_RMS_VERSION: ${{ inputs.version || '0.7.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build numpy-rms ${{ inputs.version || '0.7.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the cffi API-mode extension links the
        # version-specific ABI. Matches upstream's own published matrix exactly
        # (cp310-cp314 plus cp314t; no cp313t is built there either).
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout numpy-rms ${{ env.NUMPY_RMS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nomonosound/numpy-rms
          ref: ${{ env.NUMPY_RMS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a hard build/test requirement; only our registry has it for
          # riscv64, and only-binary keeps a newer PyPI sdist-only release from
          # winning the resolution and trying (and hanging) to build from source.
          # setuptools_scm can't see the tag from this shallow checkout, so the
          # version has to be pinned explicitly (gotcha 3).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NUMPY_RMS=${{ env.NUMPY_RMS_VERSION }}
          CIBW_TEST_REQUIRES: cffi pytest pytest-benchmark
          CIBW_TEST_COMMAND: pytest {project}/tests --durations=0

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_numpy_rms"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numpy-rms-${{ env.NUMPY_RMS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numpy-rms ${{ inputs.version || '0.7.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: numpy-rms-${{ inputs.version || '0.7.0' }}-*-manylinux_riscv64
