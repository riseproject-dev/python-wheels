---
# This workflow is based on: https://github.com/nomonosound/numpy-rms/blob/0.7.0/.github/workflows/build.yml
name: Build numpy-rms wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/numpy-rms.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-numpy-rms.yml'
      - 'docs/packages/numpy-rms.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-numpy-rms.yml'
      - 'docs/packages/numpy-rms.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: numpy-rms
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build numpy-rms ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the cffi API-mode extension links the
        # version-specific ABI. Matches upstream's own published matrix exactly
        # (cp310-cp314 plus cp314t; no cp313t is built there either).
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      NUMPY_RMS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout numpy-rms ${{ env.NUMPY_RMS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nomonosound/numpy-rms
          ref: ${{ env.NUMPY_RMS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a hard build/test requirement; only our registry has it for
          # riscv64, and only-binary keeps a newer PyPI sdist-only release from
          # winning the resolution and trying (and hanging) to build from source.
          # setuptools_scm can't see the tag from this shallow checkout, so the
          # version has to be pinned explicitly (gotcha 3).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NUMPY_RMS=${{ env.NUMPY_RMS_VERSION }}
          CIBW_TEST_REQUIRES: cffi pytest pytest-benchmark
          CIBW_TEST_COMMAND: pytest {project}/tests --durations=0

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_numpy_rms"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numpy-rms-${{ env.NUMPY_RMS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numpy-rms ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: numpy-rms-${{ matrix.version }}-*-manylinux_riscv64
