---
# Based on the `build` job of
# https://github.com/FledgeXu/python-neo-lzf/blob/v0.3.5/.github/workflows/release.yml
name: Build python-neo-lzf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-neo-lzf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-neo-lzf.yml'
      - 'docs/packages/python-neo-lzf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-neo-lzf.yml'
      - 'docs/packages/python-neo-lzf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-neo-lzf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-neo-lzf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: python-neo-lzf
      version: ${{ matrix.version }}
      repository: FledgeXu/python-neo-lzf
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "import lzf; assert lzf.__file__.endswith('.so'), lzf.__file__" &&
        pytest {project}/tests.py
      timeout-minutes: 60

  publish:
    name: Publish python-neo-lzf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-neo-lzf-${{ matrix.version }}-*-manylinux_riscv64
