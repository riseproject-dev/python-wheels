---
# This workflow is based on the `build_wheels` job of
# https://github.com/libigl/libigl-python-bindings/blob/2.6.3/.github/workflows/wheels.yml
name: Build libigl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libigl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libigl.yml'
      - 'docs/packages/libigl.yaml'
      - 'patches/libigl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libigl.yml'
      - 'docs/packages/libigl.yaml'
      - 'patches/libigl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libigl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libigl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "libigl"
      version: "${{ matrix.version }}"
      repository: "libigl/libigl-python-bindings"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        set -euo pipefail
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/wjakob/nanobind/v2.7.0/LICENSE" -o LICENSE.nanobind
        {
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.README"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.BSD"
          curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.LGPL"
        } > LICENSE.eigen
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/CGAL/cgal/v6.0.1/LICENSE.md" -o LICENSE.cgal
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/boostorg/boost/boost-1.86.0/LICENSE_1_0.txt" -o LICENSE.boost
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/libigl/tetgen/e05aca7df74e3f531bc35733ed87d36d437266c5/LICENSE" -o LICENSE.tetgen
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/alecjacobson/spectra/bbdc521b70a733c52ebfc0ac1484c82e13c3d140/LICENSE" -o LICENSE.spectra
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/cemyuksel/cyCodeBase/e36f3cffca65eb12a8a071f0443128b7de6ed75d/LICENSE" -o LICENSE.cycodebase
        # Triangle carries no LICENSE file; its copyright + redistribution
        # notice lives in its README instead.
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/libigl/triangle/62f02db9ab4ff4b62d5ff82a77c8ea458c84c23a/README" | sed -n '9,47p' > LICENSE.triangle
        # libigl-predicates carries no LICENSE file either; predicates.c's
        # own header states it was placed in the public domain.
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/libigl/libigl-predicates/decb7bc1260e689cbe008109e3cc5d3a5a433aea/predicates.c" | sed -n '1,16p' > LICENSE.predicates

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/libigl/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Embree's CMake ISA detection only knows x86 (SSE2..AVX512) and ARM
      # (NEON/NEON2X); it has no riscv64 support at all, so it's the one
      # optional module disabled here (every other one -- CGAL, TetGen,
      # Triangle, Spectra, predicates, cyCodeBase -- is portable C/C++).
      # Clang matches upstream's own CHANGELOG.md-documented CI choice.
      cibw-before-all-linux: "dnf install -y clang"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,cmake,ninja CMAKE_ARGS=-DLIBIGL_EMBREE=OFF CC=clang CXX=clang++"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      LIBIGL_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: libigl-${{ env.LIBIGL_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          libs = [n for n in names if n.endswith(".so")]
          assert libs, names
          assert not any("embree" in n for n in names), names
          licences = {n.rsplit("/", 1)[-1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          expected = {"LICENSE.MPL2", "LICENSE.GPL", "LICENSE.nanobind", "LICENSE.eigen",
                      "LICENSE.cgal", "LICENSE.boost", "LICENSE.tetgen", "LICENSE.triangle",
                      "LICENSE.spectra", "LICENSE.cycodebase", "LICENSE.predicates"}
          assert licences == expected, licences
          print(path, "ok")
          EOF

  publish:
    name: Publish libigl ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libigl-${{ matrix.version }}-*-manylinux_riscv64
