---
# This workflow is based on: https://github.com/openbabel/openbabel/blob/master/.github/workflows/wheels.yml
name: Build openbabel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openbabel.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openbabel.yml'
      - 'docs/packages/openbabel.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openbabel.yml'
      - 'docs/packages/openbabel.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openbabel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build openbabel ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      OPENBABEL_VERSION: ${{ matrix.version }}

    steps:
      - name: Resolve the upstream tag
        id: upstream
        # Upstream tags as openbabel-X-Y-Z, not a dotted version.
        run: echo "tag=openbabel-${OPENBABEL_VERSION//./-}" >> "$GITHUB_OUTPUT"

      - name: Checkout openbabel ${{ steps.upstream.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: openbabel/openbabel
          ref: ${{ steps.upstream.outputs.tag }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's epel-release install is a no-op on riscv64 (manylinux's
          # install-runtime-packages.sh leaves EPEL= empty there); eigen3-devel,
          # libxml2-devel and zlib-devel all resolve from the base/CRB repos
          # instead, as they already do for poselib/pycolmap/igraph.
          CIBW_BEFORE_ALL_LINUX: yum install -y eigen3-devel libxml2-devel zlib-devel
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openbabel-${{ env.OPENBABEL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish openbabel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: openbabel-${{ matrix.version }}-*-manylinux_riscv64
