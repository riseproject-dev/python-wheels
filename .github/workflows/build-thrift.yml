---
# This workflow is based on the `build-wheels` job of
# https://github.com/apache/thrift/blob/v0.24.0/.github/workflows/pypi.yml
name: Build thrift wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'thrift version to build (git tag without leading v, e.g. 0.24.0)'
        required: true
        default: '0.24.0'
  # pull_request:
  #   paths:
  #    - '.github/workflows/build-thrift.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.24.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  THRIFT_VERSION: ${{ inputs.version || '0.24.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build thrift ${{ inputs.version || '0.24.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout thrift v${{ env.THRIFT_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: apache/thrift
          ref: v${{ env.THRIFT_VERSION }}
          persist-credentials: false

      - name: Stage LICENSE and NOTICE beside setup.py
        # Apache-2.0 sections 4(a) and 4(d) require both to travel with the binary,
        # but upstream's wheel ships neither; setuptools' default license_files glob
        # picks them up once they sit in the project directory.
        run: cp LICENSE NOTICE lib/py/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: lib/py
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # test-sources paths are relative to cibuildwheel's cwd (the checkout root),
          # not to package-dir, and are staged at that same relative path.
          CIBW_TEST_SOURCES: lib/py/test
          # Upstream's own wheel test is the fastbinary import; the rest is its
          # `make check` list minus the cases needing code generated by the thrift
          # compiler (thrift_TNonblockingServer, thrift_TSerializer,
          # test_recursion_depth, test_compiler), which the wheel build does not build.
          CIBW_TEST_COMMAND: >-
            python -c "import thrift, thrift.protocol.fastbinary" || exit 1;
            rc=0;
            for t in thrift_json thrift_transport test_sslsocket test_socket
            thrift_TBinaryProtocol thrift_TZlibTransport thrift_TCompactProtocol
            test_immutable_exception; do python lib/py/test/$t.py || rc=1; done;
            exit $rc

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("fastbinary" in n and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "NOTICE"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: thrift-${{ env.THRIFT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish thrift ${{ inputs.version || '0.24.0' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: thrift-${{ env.THRIFT_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
