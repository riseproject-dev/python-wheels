---
# This workflow is based on the `build-wheels` job of
# https://github.com/apache/thrift/blob/v0.24.0/.github/workflows/pypi.yml
name: Build thrift wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/thrift.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-thrift.yml'
      - 'docs/packages/thrift.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thrift.yml'
      - 'docs/packages/thrift.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: thrift
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build thrift ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "thrift"
      version: "${{ matrix.version }}"
      repository: "apache/thrift"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        cp LICENSE NOTICE lib/py/
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "lib/py"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # test-sources paths are relative to cibuildwheel's cwd (the checkout root),
      # not to package-dir, and are staged at that same relative path.
      # test_sslsocket.py loads its certificates from <checkout root>/test/keys
      # (three levels above lib/py/test), so stage that directory too.
      cibw-test-sources: "lib/py/test test/keys"
      # Upstream's own wheel test is the fastbinary import; the rest is its
      # `make check` list minus the cases needing code generated by the thrift
      # compiler (thrift_TNonblockingServer, thrift_TSerializer,
      # test_recursion_depth, test_compiler), which the wheel build does not build.
      cibw-test-command: "python -c \"import thrift, thrift.protocol.fastbinary\" || exit 1; rc=0; for t in thrift_json thrift_transport test_sslsocket test_socket thrift_TBinaryProtocol thrift_TZlibTransport thrift_TCompactProtocol test_immutable_exception; do python lib/py/test/$t.py || rc=1; done; exit $rc"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      THRIFT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: thrift-${{ env.THRIFT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("fastbinary" in n and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "NOTICE"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish thrift ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: thrift-${{ matrix.version }}-*-manylinux_riscv64
