---
# Based on the `build_wheels` job of
# https://github.com/fonttools/unicodedata2/blob/17.0.1/.github/workflows/ci.yml
name: Build unicodedata2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'unicodedata2 version to build (git tag, e.g. 17.0.1)'
        required: true
        default: '17.0.1'
  pull_request:
    paths:
      - '.github/workflows/build-unicodedata2.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '17.0.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  UNICODEDATA2_VERSION: ${{ inputs.version || '17.0.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build unicodedata2 ${{ inputs.version || '17.0.1' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout unicodedata2 ${{ env.UNICODEDATA2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fonttools/unicodedata2
          ref: ${{ env.UNICODEDATA2_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: testing
          CIBW_TEST_COMMAND: pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unicodedata2-${{ env.UNICODEDATA2_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish unicodedata2 ${{ inputs.version || '17.0.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: unicodedata2-${{ inputs.version || '17.0.1' }}-*riscv64
