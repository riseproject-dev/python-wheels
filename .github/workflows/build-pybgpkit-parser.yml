---
# This workflow is based on the `build-wheels` job of
# https://github.com/bgpkit/bgpkit-parser-py/blob/v0.18.0/.github/workflows/release.yml
# and the `python-api` job of
# https://github.com/bgpkit/bgpkit-parser-py/blob/v0.18.0/.github/workflows/rust.yaml
name: Build pybgpkit-parser wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybgpkit-parser.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybgpkit-parser.yml'
      - 'docs/packages/pybgpkit-parser.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybgpkit-parser.yml'
      - 'docs/packages/pybgpkit-parser.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybgpkit-parser
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pybgpkit-parser ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      PYBGPKIT_PARSER_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout pybgpkit-parser v${{ env.PYBGPKIT_PARSER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bgpkit/bgpkit-parser-py
          ref: v${{ env.PYBGPKIT_PARSER_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: '2_39'
          # pyo3 carries abi3-py39 unconditionally in Cargo.toml, so upstream
          # ships one cp39-abi3 wheel and no free-threaded variant.
          args: -i python3.9 --release --strip --out dist
          before-script-linux: git config --global --add safe.directory "*"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.9'
          enable-cache: false

      - name: Test wheel
        env:
          # Upstream skips these by default; they are the only tests that parse MRT data.
          PYBGPKIT_RUN_NETWORK_TESTS: '1'
        run: |
          set -euo pipefail
          for py in 3.9 3.14; do
            uv venv --python "$py" ".venv-$py"
            VIRTUAL_ENV="$PWD/.venv-$py" uv pip install pytest dist/*.whl
            ".venv-$py/bin/python" -c "import pybgpkit_parser.pybgpkit_parser as m; assert m.__file__.endswith('.so'), m.__file__"
            ".venv-$py/bin/python" -m pytest tests/test_api.py -v
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pybgpkit-parser-${{ env.PYBGPKIT_PARSER_VERSION }}-cp39-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish pybgpkit-parser ${{ matrix.version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pybgpkit-parser-${{ matrix.version }}-*-manylinux_riscv64
