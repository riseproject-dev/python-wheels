---
# Based on the `build_wheels` job of
# https://github.com/theacodes/cmarkgfm/blob/2025.10.22/.github/workflows/pypi-publish.yml
name: Build cmarkgfm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cmarkgfm version to build (git tag, e.g. 2025.10.22)'
        required: true
        default: '2025.10.22'
  pull_request:
    paths:
      - '.github/workflows/build-cmarkgfm.yml'
      - 'patches/cmarkgfm/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2025.10.22' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2025.10.22 there.
  CMARKGFM_VERSION: ${{ inputs.version || '2025.10.22' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cmarkgfm ${{ inputs.version || '2025.10.22' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): build_cmark.py compiles cffi in
        # out-of-line API mode with no py_limited_api, matching upstream's
        # cp3x-cp3x wheels (including cp314t).
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout cmarkgfm ${{ env.CMARKGFM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: theacodes/cmarkgfm
          ref: ${{ env.CMARKGFM_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The extension statically links the vendored cmark-gfm C sources
      # (third_party/cmark, a git submodule); their licence isn't otherwise
      # shipped in the wheel. See patches/cmarkgfm/2025.10.22 for details.
      - name: Patch cmarkgfm source
        run: git apply python-wheels/patches/cmarkgfm/${{ env.CMARKGFM_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Matches upstream's per-platform `[tool.cibuildwheel]` before-all
          # (yum for manylinux) and its musllinux override (apk).
          CIBW_BEFORE_ALL_LINUX: ${{ matrix.libc == 'manylinux' && 'yum install -y libffi-devel' || 'apk add libffi-dev' }}
          # cffi, both a build-time and a runtime dependency, has a riscv64
          # wheel on our registry for manylinux only; musllinux builds it from
          # sdist against the libffi-dev installed above.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream tests its wheels via nox's `pytest tests`; pytest-cov
          # measures nothing on an installed wheel, so it's dropped.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmarkgfm-${{ env.CMARKGFM_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cmarkgfm ${{ inputs.version || '2025.10.22' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cmarkgfm-${{ inputs.version || '2025.10.22' }}-*riscv64
