---
# Based on the `build_wheels` job of
# https://github.com/theacodes/cmarkgfm/blob/2025.10.22/.github/workflows/pypi-publish.yml
name: Build cmarkgfm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmarkgfm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmarkgfm.yml'
      - 'docs/packages/cmarkgfm.yaml'
      - 'patches/cmarkgfm/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmarkgfm.yml'
      - 'docs/packages/cmarkgfm.yaml'
      - 'patches/cmarkgfm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmarkgfm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmarkgfm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmarkgfm"
      version: "${{ matrix.version }}"
      repository: "theacodes/cmarkgfm"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"

      # The extension statically links the vendored cmark-gfm C sources
      # (third_party/cmark, a git submodule); their licence isn't otherwise
      # shipped in the wheel. See patches/cmarkgfm/2025.10.22 for details.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # Matches upstream's per-platform `[tool.cibuildwheel]` before-all
      # (yum for manylinux) and its musllinux override (apk).
      cibw-before-all-linux: "${{ matrix.platform == 'manylinux' && 'yum install -y libffi-devel' || 'apk add libffi-dev' }}"
      # cffi, both a build-time and a runtime dependency, has a riscv64
      # wheel on our registry for manylinux only; musllinux builds it from
      # sdist against the libffi-dev installed above.
      # Upstream tests its wheels via nox's `pytest tests`; pytest-cov
      # measures nothing on an installed wheel, so it's dropped.
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest {project}/tests"

  publish:
    name: Publish cmarkgfm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmarkgfm-${{ matrix.version }}-*riscv64
