---
name: Build miniaudio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/miniaudio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-miniaudio.yml'
      - 'docs/packages/miniaudio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-miniaudio.yml'
      - 'docs/packages/miniaudio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: miniaudio
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build miniaudio ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: miniaudio
      version: ${{ matrix.version }}
      repository: irmen/pyminiaudio
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # musllinux is dropped: cffi (both a build and runtime dependency
      # here) has no musllinux riscv64 wheel on our registry either.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # cffi has no riscv64 wheel on PyPI; needed both to build (build-system.requires)
      # and to import the extension (runtime dependency).
      cibw-test-requires: pytest
      cibw-test-sources: tests
      cibw-test-command: pytest -v tests
      timeout-minutes: 60

  publish:
    name: Publish miniaudio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: miniaudio-${{ matrix.version }}-*-manylinux_riscv64
