---
# Based on the `build_wheels` job of
# https://github.com/joerick/pyinstrument_cext/blob/v0.2.4/.github/workflows/build_and_test.yml
name: Build pyinstrument-cext wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyinstrument-cext.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument-cext.yml'
      - 'docs/packages/pyinstrument-cext.yaml'
      - 'patches/pyinstrument-cext/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument-cext.yml'
      - 'docs/packages/pyinstrument-cext.yaml'
      - 'patches/pyinstrument-cext/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyinstrument-cext
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyinstrument-cext ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyinstrument-cext"
      version: "${{ matrix.version }}"
      repository: "joerick/pyinstrument_cext"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # nose does not run on Python 3.12+; pytest collects the same unittest cases.
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {project}/tests"

  publish:
    name: Publish pyinstrument-cext ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyinstrument-cext-${{ matrix.version }}-*-manylinux_riscv64
