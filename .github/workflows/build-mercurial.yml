#
# Upstream (contrib/heptapod-ci.yml, contrib/build-one-linux-wheel.sh) builds Linux
# wheels with plain `python -m build` + `auditwheel repair` from an hg checkout.
# mercurial-scm.org is not on git (CLAUDE.md gotcha 43), so this fetches the same
# official release tarball from mercurial-scm.org/release/ instead of
# `actions/checkout` (byte-identical to the PyPI sdist, confirmed by sha256).
---
name: Build mercurial wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mercurial.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mercurial.yml'
      - 'docs/packages/mercurial.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mercurial.yml'
      - 'docs/packages/mercurial.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mercurial
      version: ${{ inputs.version }}

  fetch_source:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Fetch mercurial ${{ matrix.version }} source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      MERCURIAL_VERSION: ${{ matrix.version }}

    steps:
      - name: Download official release tarball
        run: |
          mkdir -p dist
          curl -fsSL -o dist/mercurial-${MERCURIAL_VERSION}.tar.gz \
            "https://mercurial-scm.org/release/mercurial-${MERCURIAL_VERSION}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mercurial-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, fetch_source]
    if: needs.setup.outputs.versions != '[]'
    name: Build mercurial ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mercurial
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: mercurial-${{ matrix.version }}-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Mirrors upstream's own [tool.cibuildwheel] environment (pyproject.toml);
      # the riscv64 image ships no msgfmt (CLAUDE.md gotcha 532).
      cibw-before-all-linux: dnf install -y gettext
      cibw-environment-linux: MERCURIAL_SETUP_FORCE_TRANSLATIONS=1
      cibw-test-command: >
        hg version -v &&
        python -c "from mercurial import policy; assert policy.policy == b'c', policy.policy"

  publish:
    name: Publish mercurial ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mercurial-${{ matrix.version }}-*-manylinux_riscv64
