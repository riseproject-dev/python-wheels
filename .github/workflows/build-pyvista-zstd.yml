---
# Based on upstream's own wheel-building job:
#   https://github.com/pyvista/pyvista-zstd/blob/v0.4.1/.github/workflows/ci_cd.yml
name: Build pyvista-zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvista-zstd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-zstd.yml'
      - 'docs/packages/pyvista-zstd.yaml'
      - 'patches/pyvista-zstd/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-zstd.yml'
      - 'docs/packages/pyvista-zstd.yaml'
      - 'patches/pyvista-zstd/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvista-zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyvista-zstd ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyvista-zstd"
      version: "${{ matrix.version }}"
      repository: "pyvista/pyvista-zstd"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 90


      patches: true

      # Wheels are py3-none-<platform>, so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      cibw-environment-linux: "PVZSTD_BUILD_CORE=1 SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYVISTA_ZSTD=${{ matrix.version }}"
      cibw-test-environment: "PIP_PREFER_BINARY=1"
      cibw-test-command: |
        python -c "from pyvista_zstd import _capi; print('C++ core loaded from', _capi.library_path())"

  publish:
    name: Publish pyvista-zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyvista-zstd-${{ matrix.version }}-*-manylinux_riscv64
