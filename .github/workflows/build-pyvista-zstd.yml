---
# Based on upstream's own wheel-building job:
#   https://github.com/pyvista/pyvista-zstd/blob/v0.4.1/.github/workflows/ci_cd.yml
name: Build pyvista-zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvista-zstd.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-zstd.yml'
      - 'docs/packages/pyvista-zstd.yaml'
      - 'patches/pyvista-zstd/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-zstd.yml'
      - 'docs/packages/pyvista-zstd.yaml'
      - 'patches/pyvista-zstd/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvista-zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyvista-zstd ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90

    env:
      PYVISTA_ZSTD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyvista-zstd v${{ env.PYVISTA_ZSTD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyvista/pyvista-zstd
          ref: v${{ env.PYVISTA_ZSTD_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pyvista-zstd source
        run: git apply python-wheels/patches/pyvista-zstd/${{ env.PYVISTA_ZSTD_VERSION }}/*.patch

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # Wheels are py3-none-<platform>, so one build serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PVZSTD_BUILD_CORE=1
          CIBW_TEST_COMMAND: >
            python -c
            "from pyvista_zstd import _capi;
            print('C++ core loaded from', _capi.library_path())"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyvista-zstd-${{ env.PYVISTA_ZSTD_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyvista-zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyvista-zstd-${{ matrix.version }}-*-manylinux_riscv64
