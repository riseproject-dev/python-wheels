---
# This workflow is based on the `linux` job of
# https://github.com/tamasfe/taplo/blob/release-taplo-cli-0.9.3/.github/workflows/releases.yaml
name: Build taplo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/taplo.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-taplo.yml'
      - 'docs/packages/taplo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-taplo.yml'
      - 'docs/packages/taplo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: taplo
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build taplo ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      TAPLO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout taplo v${{ env.TAPLO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tamasfe/taplo
          ref: release-taplo-cli-${{ env.TAPLO_VERSION }}
          persist-credentials: false

      # The git tag ships no pyproject.toml anywhere (only the released sdist
      # has one, hoisted to its root by `maturin sdist`), so an unpatched
      # build falls back to the Cargo package name and ships taplo_cli-*.whl
      # instead of PyPI's taplo-*.whl. Recreate the sdist's own pyproject.toml
      # verbatim; maturin's manifest-path ancestor walk picks it up from the
      # checkout root.
      - name: Write pyproject.toml
        run: |
          cat > pyproject.toml <<'TOML'
          [build-system]
          requires      = ["maturin>=1.4"]
          build-backend = "maturin"

          [project]
          name = "taplo"
          requires-python = ">=3.8"
          classifiers = [
            "Development Status :: 4 - Beta",
            "Intended Audience :: Developers",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
            "Programming Language :: Python :: 3 :: Only",
            "Programming Language :: Python :: 3.10",
            "Programming Language :: Python :: 3.11",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.8",
            "Programming Language :: Python :: 3.9",
            "Programming Language :: Python :: Implementation :: CPython",
            "Programming Language :: Python :: Implementation :: PyPy",
            "Programming Language :: Python",
            "Programming Language :: Rust",
            "Topic :: Software Development :: Quality Assurance",
          ]
          dynamic = ["version"]

          [tool.maturin]
          bindings      = "bin"
          manifest-path = "crates/taplo-cli/Cargo.toml"
          TOML

      # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
      # with no ABI tag, so a single native build covers every interpreter.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --out dist --manifest-path crates/taplo-cli/Cargo.toml
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: taplo-${{ env.TAPLO_VERSION }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test taplo ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      TAPLO_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # This repo's default interpreter matrix (gotcha in workflow-anatomy.md);
        # the wheel is interpreter-agnostic (bindings = "bin"), so every
        # interpreter -- including free-threaded -- exercises the same binary.
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: taplo-${{ env.TAPLO_VERSION }}-manylinux_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . taplo

      # No wheel-level test suite ships in the sdist (gotcha 187): taplo's own
      # `toml_test` CI job runs BurntSushi/toml-test against a debug build, and
      # crates/taplo/src/tests is a Rust unit test, neither packaged. Drive the
      # real lint/format engine against known-bad TOML fixtures instead of
      # settling for a bare --version check.
      #
      # No `python -m taplo`: unlike prek/pyrefly, taplo's own source tree ships
      # no taplo/__init__.py shim, so the wheel carries only the
      # .data/scripts/taplo binary and no importable module.
      - name: Test wheel
        run: |
          set -euo pipefail
          taplo --version
          taplo --help >/dev/null

          work=$(mktemp -d)
          cat > "$work/bad.toml" <<'TOML'
          [package
          name = "oops"
          TOML

          set +e
          out=$(taplo lint "$work/bad.toml" 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ]

          cat > "$work/messy.toml" <<'TOML'
          [package]
          name    =   "demo"
          version="0.1.0"
          TOML

          set +e
          taplo format --check "$work/messy.toml"
          rc=$?
          set -e
          [ "$rc" -ne 0 ]

          taplo format "$work/messy.toml"
          taplo format --check "$work/messy.toml"
          grep -q 'name = "demo"' "$work/messy.toml"

  publish:
    name: Publish taplo ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: taplo-${{ matrix.version }}-manylinux_riscv64
