---
# Based on upstream's own wheel build:
#   https://github.com/jrast/littlefs-python/blob/v0.19.0/.github/workflows/deploy.yml
name: Build littlefs-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/littlefs-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-littlefs-python.yml'
      - 'docs/packages/littlefs-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-littlefs-python.yml'
      - 'docs/packages/littlefs-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: littlefs-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build littlefs-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # setup.py has no explicit license_files, so setuptools' default LICEN[CS]E*
    # root glob is still active; the extension compiles the vendored littlefs C
    # sources in, so stage its licence next to ours (gotcha 44).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "littlefs-python"
      version: "${{ matrix.version }}"
      repository: "jrast/littlefs-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0
      pre-build: "cp littlefs/LICENSE.md LICENSE.littlefs"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-requires: "pytest"
      cibw-test-command: >
        python -c "import importlib.metadata as md; got = sorted(p.name for p in md.files('littlefs-python') if '.dist-info/licenses/' in str(p) and p.name); assert got == ['LICENSE', 'LICENSE.littlefs'], got"
        && pytest {project}/test

  publish:
    name: Publish littlefs-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: littlefs-python-${{ matrix.version }}-*riscv64
