---
# This workflow is based on: https://github.com/BobTheBuidler/faster-eth-utils/blob/v5.3.29/.github/workflows/release.yaml
name: Build faster-eth-utils wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/faster-eth-utils.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-faster-eth-utils.yml'
      - 'docs/packages/faster-eth-utils.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-faster-eth-utils.yml'
      - 'docs/packages/faster-eth-utils.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: faster-eth-utils
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build faster-eth-utils ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "faster-eth-utils"
      version: "${{ matrix.version }}"
      repository: "BobTheBuidler/faster-eth-utils"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # test's hypothesis>=4.43.0 otherwise resolves to the newest PyPI release, not
      # the newest one with a wheel; that release builds from sdist via maturin and
      # fails (gotcha 210 -- riscv64 isn't a target rustup's own triple-probe knows).
      cibw-test-environment: "PIP_ONLY_BINARY=hypothesis"
      cibw-test-extras: "test"
      cibw-test-requires: "eth-hash[pycryptodome]"
      cibw-test-sources: "tests fixtures build pyproject.toml"
      # Upstream tests via tox (tox.ini core env), not in cibuildwheel; the import assert catches a pure-Python wheel.
      cibw-test-command: >
        python -c "import faster_eth_utils.abi as m; assert m.__file__.endswith('.so'), m.__file__"
        && python -m pytest tests/core

  publish:
    name: Publish faster-eth-utils ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: faster-eth-utils-${{ matrix.version }}-*-manylinux_riscv64
