---
# This workflow is based on the `build` job of
# https://github.com/formatjs/formatjs/blob/icu_messageformat@0.1.1/.github/workflows/python-release.yml,
# narrowed to the one `icu_messageformat` wheel target and built directly with
# maturin instead of Bazel (see the "Write pyproject.toml" step below).
name: Build icu-messageformat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/icu-messageformat.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-icu-messageformat.yml'
      - 'docs/packages/icu-messageformat.yaml'
      - 'patches/icu-messageformat/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-icu-messageformat.yml'
      - 'docs/packages/icu-messageformat.yaml'
      - 'patches/icu-messageformat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: icu-messageformat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build icu-messageformat ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      ICU_MESSAGEFORMAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout formatjs/formatjs icu_messageformat@${{ env.ICU_MESSAGEFORMAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: formatjs/formatjs
          ref: icu_messageformat@${{ env.ICU_MESSAGEFORMAT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels/patches/icu-messageformat/${{ env.ICU_MESSAGEFORMAT_VERSION }}/*.patch

      # formatjs/formatjs builds this crate's wheel with Bazel's own
      # `formatjs_python_wheel` macro (no pyproject.toml anywhere in the repo,
      # for this package or any other) and a Bazel-only Rust toolchain
      # (rules_rs) with no riscv64 target. The crate itself is a plain Cargo
      # workspace member with no Bazel-specific code, so build it directly
      # with maturin against the real `python/icu_messageformat` package
      # (__init__.py/__init__.pyi/py.typed, unchanged) instead of extending
      # rules_rs for riscv64. Field values below are copied from this tag's
      # own python/icu_messageformat/BUILD.bazel `formatjs_python_wheel` call.
      - name: Write pyproject.toml
        run: |
          cat > pyproject.toml <<TOML
          [build-system]
          requires = ["maturin>=1.7,<2.0"]
          build-backend = "maturin"

          [project]
          name = "icu_messageformat"
          version = "${ICU_MESSAGEFORMAT_VERSION}"
          description = "ICU MessageFormat runtime backed by Rust and ICU4X"
          readme = "python/icu_messageformat/README.md"
          license = "BSD-3-Clause"
          license-files = ["python/icu_messageformat/LICENSE"]
          requires-python = ">=3.12"
          authors = [{ name = "FormatJS Team" }]
          classifiers = [
            "Development Status :: 3 - Alpha",
            "Programming Language :: Python :: 3",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: Implementation :: CPython",
            "Programming Language :: Rust",
            "Topic :: Software Development :: Internationalization",
          ]

          [project.urls]
          Repository = "https://github.com/formatjs/formatjs"

          [tool.maturin]
          manifest-path = "crates/icu_messageformat_python/Cargo.toml"
          python-source = "python/icu_messageformat"
          module-name = "icu_messageformat._native"
          TOML

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --out dist -i python3.12
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - name: Verify the wheel ships the compiled extension and licence
        run: |
          set -euo pipefail
          python3 - dist/*.whl <<'EOF'
          import sys, zipfile

          (whl,) = sys.argv[1:]
          assert whl.endswith("-cp312-abi3-manylinux_2_39_riscv64.whl"), whl
          names = zipfile.ZipFile(whl).namelist()
          for member in (
              "icu_messageformat/__init__.py",
              "icu_messageformat/_native.abi3.so",
          ):
              assert member in names, (member, names)
          licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n}
          assert "LICENSE" in licences, sorted(licences)
          print(whl, sorted(licences))
          EOF

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Runs formatjs's own python_test (python/icu_messageformat/tests/test_binding.py)
      # against the built wheel instead of the Bazel-assembled extension it targets upstream.
      - name: Test wheel
        run: |
          uv pip install --reinstall dist/*.whl pytest
          python3 -m pytest -v python/icu_messageformat/tests/test_binding.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: icu-messageformat-${{ env.ICU_MESSAGEFORMAT_VERSION }}-cp312-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish icu-messageformat ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: icu-messageformat-${{ matrix.version }}-cp312-abi3-manylinux_riscv64
