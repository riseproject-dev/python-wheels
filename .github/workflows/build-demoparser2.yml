---
# This workflow is based on the `linux` job of
# https://github.com/LaihoE/demoparser/blob/v0.42.0/.github/workflows/deploy.yml
name: Build demoparser2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/demoparser2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-demoparser2.yml'
      - 'docs/packages/demoparser2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-demoparser2.yml'
      - 'docs/packages/demoparser2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: demoparser2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build demoparser2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # demoparser2's own Requires-Dist hard-pins pandas, which ships no cp314t
        # wheel at all (any version, our registry or PyPI) -- cibuildwheel's own
        # test-install step fails resolving it before CIBW_TEST_COMMAND even runs,
        # so the wheel builds fine but the test phase must be skipped here.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "demoparser2"
      version: "${{ matrix.version }}"
      repository: "LaihoE/demoparser"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 300
      cibw-package-dir: "src/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # demoparser2 ships no [tool.cibuildwheel], so the Rust toolchain its maturin
      # backend needs is installed in-container here. Upstream's own before-script-linux
      # downloads a pinned protoc release, but its arch case statement covers only
      # x86_64/aarch64; Rocky 10's CRB repo (enabled in the image) has protoc instead
      # (gotcha 100). csgoproto's build.rs shells out to `git clone` at build time, so
      # git also needs to be present, and the copied-in checkout's ownership triggers
      # git's "dubious ownership" guard for that clone.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        yum install -y protobuf-compiler protobuf-devel git &&
        git config --global --add safe.directory '*'
      # PROTOC_INCLUDE is needed because CRB's protoc 3.19 resolves
      # google/protobuf/*.proto from disk rather than from the binary (gotcha 100).
      # CARGO_BUILD_JOBS halves concurrent rustc processes: the cp314t leg died
      # compiling demoparser2's own crate with `free(): corrupted unsorted chunks`
      # (SIGABRT) linking against polars on the 4-core riscv64 runners (gotcha 228).
      # demoparser2's own Requires-Dist pulls in polars (and pandas via
      # CIBW_TEST_REQUIRES below); PyPI's newest releases of both ship no
      # riscv64 wheel yet, so without PIP_ONLY_BINARY pip resolves them
      # over our registry's slightly older (but wheel-having) versions
      # and falls back to a from-source build that never finishes in
      # CI's time budget (polars-runtime-32 in particular is a Rust
      # binary crate).
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PROTOC_INCLUDE=/usr/include PIP_ONLY_BINARY=pandas,polars,polars-runtime-32 CARGO_BUILD_JOBS=2"
      # Upstream's committed Cargo.lock pins ethnum 1.5.2 (pulled in transitively via
      # polars-arrow/polars-parquet), whose `tfie()` helper transmutes `()` into
      # `TryFromIntError`; a std layout change (any arch, any stable toolchain built
      # from nightly-2026-04-18 onward) grew that type from 0 to 1 byte, so the
      # transmute is now a compile error everywhere, not just riscv64. 1.5.3 replaces
      # it with a safe construction (nlordell/ethnum-rs#58) and satisfies polars'
      # `^1.3.2` requirement.
      cibw-before-build-linux: "cd src/python && cargo update -p ethnum --precise 1.5.3"
      cibw-test-requires: "pandas"
      # Staged at their checkout-relative paths (gotcha 104) so signature_tests.py's own
      # `../parser/test_demo.dem` (relative to a src/python cwd, matching upstream's own
      # `working-directory: ./src/python` test job) resolves inside test_cwd too.
      cibw-test-sources: "src/python/tests src/parser/test_demo.dem"
      cibw-test-command: >
        python -c "import demoparser2.demoparser2 as m; assert m.__file__.endswith('.so'), m.__file__" &&
        cd src/python && python tests/signature_tests.py
      cibw-test-skip: "${{ case(endsWith(matrix.python, 't'), '*', '') }}"

  publish:
    name: Publish demoparser2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: demoparser2-${{ matrix.version }}-*-manylinux_riscv64
