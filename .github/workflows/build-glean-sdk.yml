---
# This workflow is based on upstream's own `make build-python-wheel` (a plain
# `maturin build`, see Makefile) as driven by the `pypi-linux-release`/
# `pypi-linux-additional-releases` jobs of:
#   https://github.com/mozilla/glean/blob/v70.0.0/.circleci/config.yml
name: Build glean-sdk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/glean-sdk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-glean-sdk.yml'
      - 'docs/packages/glean-sdk.yaml'
      - 'patches/glean-sdk/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-glean-sdk.yml'
      - 'docs/packages/glean-sdk.yaml'
      - 'patches/glean-sdk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: glean-sdk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build glean-sdk ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "glean-sdk"
      version: "${{ matrix.version }}"
      repository: "mozilla/glean"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 90


      patches: true

      # bindings = "uniffi" generates ctypes bindings around a plain
      # cdylib, so the wheel is py3-none (no CPython ABI); one build
      # serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # glean-sdk ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest pytest-localserver semver jsonschema MarkupSafe"
      cibw-test-sources: "glean-core/python/tests glean.1.schema.json"
      cibw-test-command: "python -c \"import glean._uniffi as m, os; so = os.path.join(os.path.dirname(m.__file__), 'libglean_ffi.so'); assert os.path.isfile(so), so\" && python -m pytest -v glean-core/python/tests"

  publish:
    name: Publish glean-sdk ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: glean-sdk-${{ matrix.version }}-*-manylinux_riscv64
