---
# This workflow is based on: https://github.com/ssciwr/clang-format-wheel/blob/v23.1.0/.github/workflows/release.yml
name: Build clang-format wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clang-format.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clang-format.yml'
      - 'docs/packages/clang-format.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clang-format.yml'
      - 'docs/packages/clang-format.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clang-format
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build clang-format ${{ matrix.version }} py2.py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440  # clang-format is compiled from the full LLVM release source

    env:
      CLANG_FORMAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout clang-format-wheel v${{ env.CLANG_FORMAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ssciwr/clang-format-wheel
          ref: v${{ env.CLANG_FORMAT_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # wheel.py-api = "py2.py3", so one build serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Repeats pyproject.toml's own `environment` table: CIBW_ENVIRONMENT replaces
          # rather than merges with it (gotcha 107).
          CIBW_ENVIRONMENT: >-
            CMAKE_GENERATOR=Ninja
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clang-format-${{ env.CLANG_FORMAT_VERSION }}-py2.py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish clang-format ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: clang-format-${{ matrix.version }}-*-manylinux_riscv64
