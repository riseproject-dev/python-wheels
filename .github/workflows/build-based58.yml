---
# This workflow is based on the `linux`/`sdist` jobs of
# https://github.com/kevinheavey/based58/blob/v0.1.1/.github/workflows/build.yml
name: Build based58 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'based58 version to build (git tag without the v prefix, e.g. 0.1.1)'
        required: true
        default: '0.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-based58.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.1 there.
  BASED58_VERSION: ${{ inputs.version || '0.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build based58 ${{ inputs.version || '0.1.1' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter in our matrix; there is no
          # free-threaded (cp314t) leg -- pyo3 0.16.4 predates PEP 703 entirely
          # (gotcha 306), and locally installing a wheel built from it onto a
          # cp314t interpreter is refused outright ("built for the stable ABI
          # (abi3), which requires a GIL-enabled interpreter").
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    steps:
      - name: Checkout based58 v${{ env.BASED58_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kevinheavey/based58
          ref: v${{ env.BASED58_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # based58 ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # No python-source in pyproject.toml, so maturin ships an
          # auto-generated based58/__init__.py shim around the compiled
          # based58/based58.abi3.so submodule -- probe that submodule before
          # running upstream's own tests.
          CIBW_TEST_COMMAND: >-
            python -c "import based58.based58 as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: based58-${{ env.BASED58_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish based58 ${{ inputs.version || '0.1.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: based58-${{ inputs.version || '0.1.1' }}-*-manylinux_riscv64
