---
# This workflow is based on the `linux`/`sdist` jobs of
# https://github.com/kevinheavey/based58/blob/0.1.1/.github/workflows/build.yml
name: Build based58 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/based58.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-based58.yml'
      - 'docs/packages/based58.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-based58.yml'
      - 'docs/packages/based58.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: based58
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build based58 ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter in our matrix; there is no
          # free-threaded (cp314t) leg -- pyo3 0.16.4 predates PEP 703 entirely
          # (gotcha 306), and locally installing a wheel built from it onto a
          # cp314t interpreter is refused outright ("built for the stable ABI
          # (abi3), which requires a GIL-enabled interpreter").
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "based58"
      version: "${{ matrix.version }}"
      repository: "kevinheavey/based58"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # based58 ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # pyproject.toml pins maturin<0.13 (2022), which has no riscv64
      # wheel on PyPI and fails to build from sdist (its own bootstrap
      # needs setuptools, which Python 3.12+ no longer seeds into a
      # fresh build-isolation venv). A current maturin builds this tree
      # unmodified, so install one and skip isolation to bypass the pin.
      cibw-before-build: "pip install maturin"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # No python-source in pyproject.toml, so maturin ships an
      # auto-generated based58/__init__.py shim around the compiled
      # based58/based58.abi3.so submodule -- probe that submodule before
      # running upstream's own tests.
      cibw-test-command: >
        python -c "import based58.based58 as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish based58 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: based58-${{ matrix.version }}-*-manylinux_riscv64
