---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-qhull/blob/v8.0.2.1.c1/.github/workflows/release.yml
name: Build cmeel-qhull wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-qhull.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-qhull.yml'
      - 'docs/packages/cmeel-qhull.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-qhull.yml'
      - 'docs/packages/cmeel-qhull.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-qhull
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-qhull ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      CMEEL_QHULL_VERSION: ${{ matrix.version }}

    steps:
      # cmeel-qhull's release tags carry a packaging-revision suffix that is the wheel's
      # build tag, not part of its version; .c1 is the revision 8.0.2.1 released last.
      - name: Checkout cmeel-qhull v${{ env.CMEEL_QHULL_VERSION }}.c1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/cmeel-qhull
          ref: v${{ env.CMEEL_QHULL_VERSION }}.c1
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # has-sitelib = false: the wheel holds no Python extension, so one
          # py3-none wheel covers every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # qhull declares cmake_minimum_required(VERSION 3.0) and cmeel[build] resolves
          # CMake >= 4, which refuses anything below 3.5; the cmeel backend owns the
          # configure line, so the policy floor has to come from the environment.
          CIBW_ENVIRONMENT: CMEEL_LOG_LEVEL=DEBUG CMAKE_POLICY_VERSION_MINIMUM=3.5
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib/libqhull_r.so.8.0.2" in names, names
          assert "cmeel.prefix/include/libqhull_r/libqhull_r.h" in names, names
          assert "cmeel.prefix/bin/qconvex" in names, names
          EOF

      - name: Smoke-test the built library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q wheelhouse/*.whl
          prefix=$(python3 -c "import pathlib, sysconfig; print(pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix')")
          python3 - "$prefix" <<'EOF'
          import ctypes, sys
          lib = ctypes.CDLL(f"{sys.argv[1]}/lib/libqhull_r.so")
          print(ctypes.string_at(ctypes.addressof(ctypes.c_char.in_dll(lib, "qh_version"))))
          lib.qh_pointdist.restype = ctypes.c_double
          lib.qh_pointdist.argtypes = [ctypes.POINTER(ctypes.c_double)] * 2 + [ctypes.c_int]
          a = (ctypes.c_double * 3)(0, 0, 0)
          b = (ctypes.c_double * 3)(3, 4, 12)
          assert lib.qh_pointdist(a, b, 3) == 13.0
          EOF
          "$prefix/bin/rbox" c | "$prefix/bin/qconvex" FS | tail -1 |
            awk '{ print; exit ($2 == 6 && $3 == 1) ? 0 : 1 }'
          "$prefix/bin/rbox" 500 D4 | "$prefix/bin/qdelaunay" s
          "$prefix/bin/rbox" 100 D2 | "$prefix/bin/qvoronoi" s

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmeel-qhull-${{ env.CMEEL_QHULL_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cmeel-qhull ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cmeel-qhull-${{ matrix.version }}-py3-none-manylinux_riscv64
