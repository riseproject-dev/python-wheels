---
# This workflow is based on the `linux` job of
# https://github.com/crate-ci/typos/blob/v1.49.1/.github/workflows/maturin.yml
name: Build typos wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typos.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typos.yml'
      - 'docs/packages/typos.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typos.yml'
      - 'docs/packages/typos.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typos
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: typos
      version: ${{ matrix.version }}
      repository: crate-ci/typos
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 360
      maturin-args: --release --locked --manifest-path crates/typos-cli/Cargo.toml

  test_wheel:
    name: Test typos ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      TYPOS_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: typos-${{ env.TYPOS_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . typos

      # No wheel-level test suite ships in the sdist (gotcha 187): typos' own
      # crates/typos-cli/tests/cli_tests.rs is a Rust integration test run by
      # upstream's own `cargo test` (trycmd against tests/cmd/*.toml), never
      # packaged. Drive the real spell checker against a known-bad fixture and
      # confirm --write-changes actually fixes it, instead of settling for a
      # bare --version check.
      #
      # No `python -m typos`: unlike prek/pyrefly, typos' own source tree ships
      # no typos/__init__.py shim, so the wheel carries only the
      # .data/scripts/typos binary and no importable module.
      - name: Test wheel
        run: |
          set -euo pipefail
          typos --version
          typos --help >/dev/null

          work=$(mktemp -d)
          cat > "$work/a.txt" <<'TXT'
          This is a test of the recieve function.
          TXT

          set +e
          out=$(typos "$work/a.txt" 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 2 ]
          echo "$out" | grep -q 'recieve.*should be.*receive'

          typos --write-changes "$work/a.txt"
          grep -q 'receive' "$work/a.txt"
          typos "$work/a.txt"

  publish:
    name: Publish typos ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: typos-${{ matrix.version }}-manylinux_riscv64
