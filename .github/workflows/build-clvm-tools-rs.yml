---
# This workflow is based on the `build_wheels`/Linux job of
# https://github.com/Chia-Network/clvm_tools_rs/blob/0.4.0/.github/workflows/build-test.yml
name: Build clvm-tools-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clvm-tools-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clvm-tools-rs.yml'
      - 'docs/packages/clvm-tools-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clvm-tools-rs.yml'
      - 'docs/packages/clvm-tools-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clvm-tools-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build clvm-tools-rs ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "clvm-tools-rs"
      version: "${{ matrix.version }}"
      repository: "Chia-Network/clvm_tools_rs"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      # pyo3 is built with the `abi3-py39` feature (Cargo.toml), so maturin
      # emits a single cp39-abi3 wheel matching the one Linux wheel upstream
      # publishes per arch. cibuildwheel compiles once for cp312 and reuses
      # that wheel for cp313/cp314 while still running the test phase on
      # each. musllinux is excluded because rustup.rs ships no riscv64 musl
      # toolchain, and cp314t is excluded because upstream ships no
      # free-threaded wheel (abi3 has no free-threaded ABI).
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # clvm_tools_rs ships no [tool.cibuildwheel], so install the Rust
      # toolchain its maturin backend needs in-container and put it on PATH.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Two of upstream's own self-contained resources/tests scripts (no
      # external clvm/clvm_rs/clvm_tools checkouts needed): plain compiler
      # and step-execution smoke tests exercised against the built wheel.
      cibw-test-sources: "resources/tests"
      cibw-test-command: "python resources/tests/test_clvm_step.py && python resources/tests/test_compile_from_string.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CLVM_TOOLS_RS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: clvm-tools-rs-${{ env.CLVM_TOOLS_RS_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "clvm_tools_rs/clvm_tools_rs.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish clvm-tools-rs ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clvm-tools-rs-${{ matrix.version }}-*-manylinux_riscv64
