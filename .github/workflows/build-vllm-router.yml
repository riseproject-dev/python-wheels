---
# Upstream (vllm-project/router) ships no build/release CI of its own (only clippy,
# codeql, codespell and format checks); wheels are published to PyPI out of band.
# setup.py sets `py_limited_api = "cp38"` on bdist_wheel but Cargo.toml's pyo3 dependency
# carries no `abi3-pyNN` feature, so this mirrors upstream's own single untagged build
# (gotcha 34): one wheel, built once and labelled cp38-abi3 like upstream's.
name: Build vllm-router wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vllm-router.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vllm-router.yml'
      - 'docs/packages/vllm-router.yaml'
      - 'patches/vllm-router/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vllm-router.yml'
      - 'docs/packages/vllm-router.yaml'
      - 'patches/vllm-router/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vllm-router
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vllm-router ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "vllm-router"
      version: "${{ matrix.version }}"
      repository: "vllm-project/router"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp38-abi3-manylinux_riscv64"
      timeout-minutes: 720
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply "$GITHUB_WORKSPACE"/python-wheels/patches/vllm-router/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # cp312 first so cibuildwheel compiles the abi3 wheel there and only retests
      # it on cp313/cp314 (gotcha 96/633); the image ships no cp38 to build on.
      cibw-build: "cp312-manylinux_riscv64"
      # No Rust in the manylinux image; install it and put cargo on PATH. reqwest's
      # default-tls feature needs OpenSSL headers; the zmq crate's vendored libzmq
      # build needs cmake.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && dnf -y install openssl-devel cmake"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest pytest-asyncio"
      cibw-test-sources: "py_test"
      cibw-test-command: "python -c \"import vllm_router; from vllm_router_rs import PolicyType, Router; print('Rust extension: OK')\" && python -m vllm_router.launch_router --help > /dev/null && echo \"Entry point: OK\" && python -m pytest -v py_test/unit"

  verify_wheels:
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      VLLM_ROUTER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vllm-router-${{ env.VLLM_ROUTER_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries the Apache-2.0 licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
          print(sys.argv[1], "->", [n for n in names if ".dist-info/licenses/" in n])
          EOF

  publish:
    name: Publish vllm-router ${{ matrix.version }}
    needs: [setup, build_wheel, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: vllm-router-${{ matrix.version }}-*-manylinux_riscv64
