---
# Upstream (vllm-project/router) ships no build/release CI of its own (only clippy,
# codeql, codespell and format checks); wheels are published to PyPI out of band.
# setup.py sets `py_limited_api = "cp38"` on bdist_wheel but Cargo.toml's pyo3 dependency
# carries no `abi3-pyNN` feature, so this mirrors upstream's own single untagged build
# (gotcha 34): one wheel, built once and labelled cp38-abi3 like upstream's.
name: Build vllm-router wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vllm-router.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vllm-router.yml'
      - 'docs/packages/vllm-router.yaml'
      - 'patches/vllm-router/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vllm-router.yml'
      - 'docs/packages/vllm-router.yaml'
      - 'patches/vllm-router/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vllm-router
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vllm-router ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720

    env:
      VLLM_ROUTER_VERSION: ${{ matrix.version }}

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout vllm-router v${{ env.VLLM_ROUTER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: vllm-project/router
          ref: v${{ env.VLLM_ROUTER_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply "$GITHUB_WORKSPACE"/python-wheels/patches/vllm-router/${{ env.VLLM_ROUTER_VERSION }}/*.patch

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # cp312 first so cibuildwheel compiles the abi3 wheel there and only retests
          # it on cp313/cp314 (gotcha 96/633); the image ships no cp38 to build on.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No Rust in the manylinux image; install it and put cargo on PATH. reqwest's
          # default-tls feature needs OpenSSL headers; the zmq crate's vendored libzmq
          # build needs cmake.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            dnf -y install openssl-devel cmake
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest pytest-asyncio
          CIBW_TEST_SOURCES: py_test
          CIBW_TEST_COMMAND: >-
            python -c "import vllm_router; from vllm_router_rs import PolicyType, Router;
            print('Rust extension: OK')" &&
            python -m vllm_router.launch_router --help > /dev/null && echo "Entry point: OK" &&
            python -m pytest -v py_test/unit

      - name: Check the wheel carries the Apache-2.0 licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
          print(sys.argv[1], "->", [n for n in names if ".dist-info/licenses/" in n])
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vllm-router-${{ env.VLLM_ROUTER_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish vllm-router ${{ matrix.version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: vllm-router-${{ matrix.version }}-*-manylinux_riscv64
