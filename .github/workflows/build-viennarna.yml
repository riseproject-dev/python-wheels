---
# This workflow is based on the `build_sdist` and `build_wheels_linux` jobs of
# https://github.com/ViennaRNA/ViennaRNA/blob/v2.7.2/.github/workflows/build_python_package.yaml
name: Build viennarna wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/viennarna.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-viennarna.yml'
      - 'docs/packages/viennarna.yaml'
      - 'patches/viennarna/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-viennarna.yml'
      - 'docs/packages/viennarna.yaml'
      - 'patches/viennarna/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: viennarna
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build viennarna ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      VIENNARNA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ViennaRNA v${{ env.VIENNARNA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ViennaRNA/ViennaRNA
          ref: v${{ env.VIENNARNA_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/viennarna/${{ env.VIENNARNA_VERSION }}/00*.patch

      - name: install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential autoconf automake gengetopt help2man libtool check graphviz python3-sphinx

      - name: Checkout swig repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: swig/swig
          ref: 'v4.4.0'
          path: swig
          persist-credentials: false

      - name: Install swig
        run: |
          cd swig
          ./autogen.sh && ./configure --prefix=/usr
          make -j $(nproc)
          sudo make install

      - name: Checkout doxygen repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: doxygen/doxygen
          ref: 'Release_1_15_0'
          path: doxygen
          persist-credentials: false

      - name: Install doxygen
        run: |
          cd doxygen
          mkdir build
          cd build
          cmake -G "Unix Makefiles" -DCMAKE_INSTALL_PREFIX:PATH=/usr -Dbuild_doc:BOOL=OFF ..
          make -j $(nproc)
          sudo make install

      - name: autotools setup
        run: |
          autoreconf -i
          tar -xjf src/dlib-20.0.tar.bz2 -C src
          tar -xzf src/libsvm-3.35.tar.gz -C src

      - name: configure
        run: ./configure --without-kinfold --without-forester --without-rnalocmin --without-rnaxplorer --without-perl --without-gsl --disable-mpfr

      - name: prepare source files
        run: |
          cd src/ViennaRNA/static
          make

      - name: prepare doxygen XML
        run: |
          cd doc/doxygen
          make doxygen-xml

      - name: prepare Python wrapper
        run: |
          cd interfaces/Python
          make RNA/RNA.py

      # The extension statically compiles libsvm (BSD-3-Clause), dlib (BSL-1.0)
      # and ccan/json (MIT); stage their notices where the licence glob finds them.
      - name: Stage vendored licences
        run: |
          cp src/libsvm-3.35/COPYRIGHT LICENSE.libsvm
          cp src/dlib-20.0/dlib/LICENSE.txt LICENSE.dlib
          cp src/json/LICENSE LICENSE.json

      - name: build Python source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: viennarna-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build viennarna ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: viennarna
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: viennarna-${{ matrix.version }}-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 360
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      cibw-test-command: >
        python -c "import importlib.metadata as md;
        got = {p.name for p in md.files('viennarna') if '.dist-info/licenses/' in str(p)};
        assert {'COPYING', 'LICENSE.libsvm', 'LICENSE.dlib', 'LICENSE.json'} <= got, got" &&
        pytest --datadir {package}/tests/data {package}/tests/python

  gpl_sources:
    name: Collect GPL sources for viennarna ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: viennarna
      version: ${{ matrix.version }}
      # setup.cfg enables OpenMP, so auditwheel vendors the image's libgomp.
      packages: gcc

  publish:
    name: Publish viennarna ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: viennarna-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: viennarna-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
