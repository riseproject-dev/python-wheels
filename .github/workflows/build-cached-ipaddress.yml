---
# This workflow is based on the `build_wheels` job of
# https://github.com/Bluetooth-Devices/cached-ipaddress/blob/v1.1.2/.github/workflows/ci.yml
name: Build cached-ipaddress wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cached-ipaddress.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cached-ipaddress.yml'
      - 'docs/packages/cached-ipaddress.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cached-ipaddress.yml'
      - 'docs/packages/cached-ipaddress.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cached-ipaddress
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cached-ipaddress ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cached-ipaddress
      version: ${{ matrix.version }}
      repository: Bluetooth-Devices/cached-ipaddress
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Only manylinux: propcache, a hard runtime dependency, has no musl
      # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
      # reaches the Linux build container; build_ext.py otherwise falls
      # back to a pure-Python wheel under a riscv64 tag.
      cibw-environment: >-
        REQUIRE_CYTHON=1
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-sources: tests
      cibw-test-requires: 'pytest>=7,<9'
      cibw-test-command: >-
        python -c "from cached_ipaddress import ipaddress;
        assert ipaddress.__file__.endswith('.so'), ipaddress.__file__" &&
        python -m pytest tests --ignore=tests/benchmarks
      timeout-minutes: 120

  publish:
    name: Publish cached-ipaddress ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cached-ipaddress-${{ matrix.version }}-*-manylinux_riscv64
