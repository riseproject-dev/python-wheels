---
# This workflow is based on the `build_wheels` job of
# https://github.com/Bluetooth-Devices/cached-ipaddress/blob/v1.1.2/.github/workflows/ci.yml
name: Build cached-ipaddress wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cached-ipaddress.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cached-ipaddress.yml'
      - 'docs/packages/cached-ipaddress.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cached-ipaddress.yml'
      - 'docs/packages/cached-ipaddress.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cached-ipaddress
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cached-ipaddress ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]

    env:
      CACHED_IPADDRESS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cached-ipaddress v${{ env.CACHED_IPADDRESS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Bluetooth-Devices/cached-ipaddress
          ref: v${{ env.CACHED_IPADDRESS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: propcache, a hard runtime dependency, has no musl
          # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
          # reaches the Linux build container; build_ext.py otherwise falls
          # back to a pure-Python wheel under a riscv64 tag.
          CIBW_ENVIRONMENT: >-
            REQUIRE_CYTHON=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: 'pytest>=7,<9'
          CIBW_TEST_COMMAND: >-
            python -c "from cached_ipaddress import ipaddress;
            assert ipaddress.__file__.endswith('.so'), ipaddress.__file__" &&
            python -m pytest tests --ignore=tests/benchmarks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cached-ipaddress-${{ env.CACHED_IPADDRESS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cached-ipaddress ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cached-ipaddress-${{ matrix.version }}-*-manylinux_riscv64
