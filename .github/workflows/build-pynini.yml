# Based on the wheel-building stage of
# https://github.com/kylebgorman/pynini/blob/v2.1.7/third_party/Dockerfile
name: Build pynini wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pynini.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pynini.yml'
      - 'docs/packages/pynini.yaml'
      - 'patches/pynini/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pynini.yml'
      - 'docs/packages/pynini.yaml'
      - 'patches/pynini/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  OPENFST_VERSION: 1.8.4

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pynini
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pynini ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pynini"
      version: "${{ matrix.version }}"
      repository: "kylebgorman/pynini"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pynini links a system OpenFst rather than bundling it; build it the same
      # way upstream's own manylinux Dockerfile does (third_party/Dockerfile).
      cibw-before-all-linux: |
        set -eux
        curl -fsSL -o /tmp/openfst.tar.gz "https://www.openfst.org/twiki/pub/FST/FstDownload/openfst-1.8.4.tar.gz"
        tar -xzf /tmp/openfst.tar.gz -C /tmp
        cd /tmp/openfst-1.8.4
        ./configure --enable-grm
        make -j"$(nproc)"
        make install
        ldconfig
      cibw-test-requires: "absl-py"
      cibw-test-command: "python -c \"import pynini; print(pynini.__file__, pynini.__version__)\" && python -c \"import importlib.metadata as m; l = sorted(p.name for p in m.files('pynini') if '.dist-info/licenses/' in str(p)); assert l == ['AUTHORS', 'LICENSE', 'LICENSE.openfst'], l\" && cd {project} && rc=0 && for t in tests/*_test.py; do [ \"$t\" = tests/chatspeak_model_test.py ] || python \"$t\" || rc=1; done; exit $rc"

  publish:
    name: Publish pynini ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pynini-${{ matrix.version }}-*-manylinux_riscv64
