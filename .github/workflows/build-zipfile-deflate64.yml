---
# This workflow is based on: https://github.com/brianhelba/zipfile-deflate64/blob/v0.2.0/.github/workflows/ci.yml
name: Build zipfile-deflate64 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zipfile-deflate64.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zipfile-deflate64.yml'
      - 'docs/packages/zipfile-deflate64.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zipfile-deflate64.yml'
      - 'docs/packages/zipfile-deflate64.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zipfile-deflate64
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zipfile-deflate64 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the extension links the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      ZIPFILE_DEFLATE64_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout zipfile-deflate64 v${{ env.ZIPFILE_DEFLATE64_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: brianhelba/zipfile-deflate64
          ref: v${{ env.ZIPFILE_DEFLATE64_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Fetch git-lfs test data
        # tests/data/* are LFS pointers; fetch the real blobs without relying on a git-lfs client on the runner.
        run: |
          set -eu
          for f in tests/data/*; do
            curl -sSfL "https://media.githubusercontent.com/media/brianhelba/zipfile-deflate64/v${ZIPFILE_DEFLATE64_VERSION}/$f" -o "$f"
          done

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setuptools_scm can't see the tag from the shallow checkout.
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ZIPFILE_DEFLATE64=${{ env.ZIPFILE_DEFLATE64_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zipfile-deflate64-${{ env.ZIPFILE_DEFLATE64_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zipfile-deflate64 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zipfile-deflate64-${{ matrix.version }}-*-manylinux_riscv64
