---
# Based on upstream's own wheel builder:
#   https://github.com/rhasspy/pymicro-vad/blob/v2.1.0/.github/workflows/publish.yml
name: Build pymicro-vad wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymicro-vad.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymicro-vad.yml'
      - 'docs/packages/pymicro-vad.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymicro-vad.yml'
      - 'docs/packages/pymicro-vad.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # setup.py only sets Extension(py_limited_api=True); the bdist_wheel floor
  # tag comes from us via --py-limited-api, so we pick our own (RISE's min).
  ABI3_FLOOR: cp312

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymicro-vad
      version: ${{ inputs.version }}

  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pymicro-vad ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    env:
      PYMICRO_VAD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pymicro-vad v${{ env.PYMICRO_VAD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rhasspy/pymicro-vad
          ref: v${{ env.PYMICRO_VAD_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_CONFIG_SETTINGS: --build-option=--py-limited-api=${{ env.ABI3_FLOOR }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymicro-vad-${{ env.PYMICRO_VAD_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pymicro-vad ${{ matrix.version }}
    needs: [setup, build_abi3]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pymicro-vad-${{ matrix.version }}-*-manylinux_riscv64
