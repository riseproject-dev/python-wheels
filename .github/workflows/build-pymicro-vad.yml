---
# Based on upstream's own wheel builder:
#   https://github.com/rhasspy/pymicro-vad/blob/v2.1.0/.github/workflows/publish.yml
name: Build pymicro-vad wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymicro-vad.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymicro-vad.yml'
      - 'docs/packages/pymicro-vad.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymicro-vad.yml'
      - 'docs/packages/pymicro-vad.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # setup.py only sets Extension(py_limited_api=True); the bdist_wheel floor
  # tag comes from us via --py-limited-api, so we pick our own (RISE's min).
  ABI3_FLOOR: cp312

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymicro-vad
      version: ${{ inputs.version }}

  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pymicro-vad ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymicro-vad"
      version: "${{ matrix.version }}"
      repository: "rhasspy/pymicro-vad"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      cibw-build: >
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      cibw-config-settings: "--build-option=--py-limited-api=cp312"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest -q {package}/tests"

  publish:
    name: Publish pymicro-vad ${{ matrix.version }}
    needs: [setup, build_abi3]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymicro-vad-${{ matrix.version }}-*-manylinux_riscv64
