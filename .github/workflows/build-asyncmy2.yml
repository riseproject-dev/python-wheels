---
# This workflow is based on: https://github.com/vpmedia/asyncmy2/blob/v0.2.21/.github/workflows/publish.yml
name: Build asyncmy2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asyncmy2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncmy2.yml'
      - 'docs/packages/asyncmy2.yaml'
      - 'patches/asyncmy2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncmy2.yml'
      - 'docs/packages/asyncmy2.yaml'
      - 'patches/asyncmy2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asyncmy2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build asyncmy2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "asyncmy2"
      version: "${{ matrix.version }}"
      repository: "vpmedia/asyncmy2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/asyncmy2/${{ matrix.version }}"
        if [ -d "$patches" ]; then
          git apply -v "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Every other test needs a live MySQL/MariaDB server, which publishes no
      # riscv64 image (upstream's own CI gets one via a `services:` container,
      # unavailable here); these files exercise the compiled protocol/converters
      # extensions without one.
      cibw-test-sources: "tests/test_auth.py tests/test_converters.py tests/test_optionfile.py"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest -v tests/test_auth.py tests/test_converters.py tests/test_optionfile.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ASYNCMY2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: asyncmy2-${{ env.ASYNCMY2_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import glob, sys, zipfile
          expected = {p[len('asyncmy/'):-len('.pyx')] for p in glob.glob('asyncmy/*.pyx')}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n[len('asyncmy/'):].split('.')[0]
                  for n in names
                  if n.startswith('asyncmy/') and n.endswith('.so')
              }
              assert found == expected, (whl, sorted(expected - found), sorted(found - expected))
              print(whl, 'ok')
          EOF

  publish:
    name: Publish asyncmy2 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: asyncmy2-${{ matrix.version }}-*-manylinux_riscv64
