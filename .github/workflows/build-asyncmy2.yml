---
# This workflow is based on: https://github.com/vpmedia/asyncmy2/blob/v0.2.21/.github/workflows/publish.yml
name: Build asyncmy2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asyncmy2.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncmy2.yml'
      - 'docs/packages/asyncmy2.yaml'
      - 'patches/asyncmy2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncmy2.yml'
      - 'docs/packages/asyncmy2.yaml'
      - 'patches/asyncmy2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asyncmy2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build asyncmy2 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      ASYNCMY2_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout asyncmy2 v${{ env.ASYNCMY2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: vpmedia/asyncmy2
          ref: v${{ env.ASYNCMY2_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: |
          git apply -v python-wheels/patches/asyncmy2/${{ env.ASYNCMY2_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Every other test needs a live MySQL/MariaDB server, which publishes no
          # riscv64 image (upstream's own CI gets one via a `services:` container,
          # unavailable here); these files exercise the compiled protocol/converters
          # extensions without one.
          CIBW_TEST_SOURCES: tests/test_auth.py tests/test_converters.py tests/test_optionfile.py
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -m pytest -v tests/test_auth.py tests/test_converters.py
            tests/test_optionfile.py

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import glob, sys, zipfile
          expected = {p[len('asyncmy/'):-len('.pyx')] for p in glob.glob('asyncmy/*.pyx')}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n[len('asyncmy/'):].split('.')[0]
                  for n in names
                  if n.startswith('asyncmy/') and n.endswith('.so')
              }
              assert found == expected, (whl, sorted(expected - found), sorted(found - expected))
              print(whl, 'ok')
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asyncmy2-${{ env.ASYNCMY2_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish asyncmy2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: asyncmy2-${{ matrix.version }}-*-manylinux_riscv64
