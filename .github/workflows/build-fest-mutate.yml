---
# This workflow is based on the `pypi` job of
# https://github.com/sakost/fest/blob/v0.1.3/.github/workflows/release-please.yml
name: Build fest-mutate wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fest-mutate.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fest-mutate.yml'
      - 'docs/packages/fest-mutate.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fest-mutate.yml'
      - 'docs/packages/fest-mutate.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fest-mutate
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: fest-mutate
      version: ${{ matrix.version }}
      repository: sakost/fest
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 120
      maturin-args: --release --locked

  test_wheel:
    name: Test fest-mutate ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      FEST_MUTATE_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fest-mutate-${{ env.FEST_MUTATE_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . fest-mutate

      # fest has no `python -m fest` shim (bindings = "bin"); drive the real
      # console-script entry point against a toy project, mirroring the
      # upstream README's own "Quick start" usage.
      - name: Test wheel
        run: |
          set -euo pipefail
          fest --version
          fest --help >/dev/null
          file "$(command -v fest)" | grep -q ELF

          uv pip install pytest pytest-cov

          work=$(mktemp -d)
          cd "$work"
          mkdir -p src tests
          cat > src/calc.py <<'PY'
          def add(a, b):
              return a + b
          PY
          cat > tests/test_calc.py <<'PY'
          from src.calc import add


          def test_add():
              assert add(1, 2) == 3
          PY
          fest init --force
          fest run

  publish:
    name: Publish fest-mutate ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fest-mutate-${{ matrix.version }}-manylinux_riscv64
