---
# This workflow is based on:
#   https://github.com/Esoiya/go-enry/blob/python-v0.3.0/.github/workflows/python-wheels.yml
name: Build enry-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/enry-python.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-enry-python.yml'
      - 'docs/packages/enry-python.yaml'
      - 'patches/enry-python/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-enry-python.yml'
      - 'docs/packages/enry-python.yaml'
      - 'patches/enry-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  GO_VERSION: '1.26.x'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: enry-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build enry-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      ENRY_PYTHON_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout go-enry python-v${{ env.ENRY_PYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Esoiya/go-enry
          ref: python-v${{ env.ENRY_PYTHON_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/enry-python/${{ env.ENRY_PYTHON_VERSION }}/*.patch

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Stage Go toolchain for the manylinux container
        run: |
          mkdir -p .ci
          cp -a "$(go env GOROOT)" .ci/go

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: 'cp -a /project/.ci/go /opt/enry-go'
          # The patch dirties the checkout, which setuptools_scm would turn into a dev version.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH=/opt/enry-go/bin:$PATH
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ENRY_PYTHON=${{ env.ENRY_PYTHON_VERSION }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: enry-python-${{ env.ENRY_PYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish enry-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: enry-python-${{ matrix.version }}-*-manylinux_riscv64
