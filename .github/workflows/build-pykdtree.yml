---
# Based on: https://github.com/storpipfugl/pykdtree/blob/v1.4.3/.github/workflows/deploy-wheels.yml
name: Build pykdtree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pykdtree.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pykdtree.yml'
      - 'docs/packages/pykdtree.yaml'
      - 'patches/pykdtree/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pykdtree.yml'
      - 'docs/packages/pykdtree.yaml'
      - 'patches/pykdtree/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pykdtree
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pykdtree ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pykdtree"
      version: "${{ matrix.version }}"
      repository: "storpipfugl/pykdtree"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pykdtree/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build-time requirement (headers) and, despite not being
      # declared as a runtime dependency by name>=2, an implicit one too (the
      # compiled extension calls numpy's C API at import time). Only our
      # registry has it for riscv64; only-binary keeps a newer PyPI release
      # from winning the resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest mypy numpy typing-extensions>=4.15"
      cibw-test-command: "python -m pytest -v --pyargs pykdtree"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYKDTREE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pykdtree-${{ env.PYKDTREE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"kdtree"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt"}, licences
          EOF

  gpl_sources:
    name: Collect GPL sources for pykdtree ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: pykdtree
      version: ${{ matrix.version }}
      # pykdtree links -lgomp on Linux by default (setup.py's OMP probe), so
      # auditwheel vendors the image's libgomp into pykdtree.libs/.
      packages: gcc

  publish:
    name: Publish pykdtree ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pykdtree-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pykdtree-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
