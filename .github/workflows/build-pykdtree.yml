---
# Based on: https://github.com/storpipfugl/pykdtree/blob/v1.4.3/.github/workflows/deploy-wheels.yml
name: Build pykdtree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pykdtree version to build (git tag without the leading v, e.g. 1.4.3)'
        required: true
        default: '1.4.3'
  pull_request:
    paths:
      - '.github/workflows/build-pykdtree.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYKDTREE_VERSION: ${{ inputs.version || '1.4.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pykdtree ${{ inputs.version || '1.4.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pykdtree v${{ env.PYKDTREE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: storpipfugl/pykdtree
          ref: v${{ env.PYKDTREE_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build-time requirement (headers) and, despite not being
          # declared as a runtime dependency by name>=2, an implicit one too (the
          # compiled extension calls numpy's C API at import time). Only our
          # registry has it for riscv64; only-binary keeps a newer PyPI release
          # from winning the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest mypy numpy
          CIBW_TEST_COMMAND: python -m pytest -v --pyargs pykdtree

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"kdtree"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pykdtree-${{ env.PYKDTREE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # pykdtree links -lgomp on Linux by default (setup.py's OMP probe), so
      # auditwheel vendors the image's libgomp into pykdtree.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pykdtree-${{ env.PYKDTREE_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pykdtree ${{ inputs.version || '1.4.3' }}
    needs: [setup, build_wheels, gpl_sources]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pykdtree-${{ inputs.version || '1.4.3' }}-*-manylinux_riscv64
      gpl-sources-artifact: pykdtree-${{ inputs.version || '1.4.3' }}-gpl-sources
      gpl-sources-description: gcc
