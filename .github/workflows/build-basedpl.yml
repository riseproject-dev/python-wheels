---
# Based on the `build` job of
# https://github.com/AnswerDotAI/basedpl/blob/v0.1.82/.github/workflows/ci.yml
name: Build basedpl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/basedpl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-basedpl.yml'
      - 'docs/packages/basedpl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-basedpl.yml'
      - 'docs/packages/basedpl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: basedpl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build basedpl ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: basedpl
      version: ${{ matrix.version }}
      repository: AnswerDotAI/basedpl
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-manylinux_riscv64
      cibw-build: ${{ matrix.python }}-manylinux_riscv64
      # Upstream gitignores Cargo.lock, so a fresh build re-resolves crates to
      # today's latest semver-compatible versions (CLAUDE.md gotcha 10's
      # "Floating deps in a locally-built sdist"). rustymath 0.1.54 changed the
      # table shape its `facts!` macro expands to (added a trailing `identities`
      # section), which breaks basedpl's own locally-defined consumer macros in
      # src/pervasive.rs (`comparison_arms!`/`primitive_facts!`) that still match
      # the pre-0.1.54 shape: "no rules expected `identities`". Pin rustymath and
      # rustymath-buffer (whose newer releases require rustymath >=0.1.55) to 0.1.53,
      # the versions in upstream's v0.1.82 sdist Cargo.lock.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        . "$HOME/.cargo/env" &&
        cargo update --manifest-path {project}/Cargo.toml -p rustymath-buffer --precise 0.1.53 &&
        cargo update --manifest-path {project}/Cargo.toml -p rustymath --precise 0.1.53
      # numpy (a test requirement) has a riscv64 wheel only on our registry.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=numpy"
      # tests/conftest.py imports fastws.cargo.timing_lock, which fastws-cli 0.0.33
      # removed; 0.0.32 was the latest release when v0.1.82 was tagged.
      cibw-test-requires: pytest numpy fastws-cli==0.0.32
      cibw-test-sources: tests
      cibw-test-command: python -m pytest tests/test_basic.py -q
      timeout-minutes: 240

  publish:
    name: Publish basedpl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: basedpl-${{ matrix.version }}-*-manylinux_riscv64
