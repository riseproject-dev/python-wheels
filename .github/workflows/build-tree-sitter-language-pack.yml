---
# This workflow is based on: https://github.com/xberg-io/tree-sitter-language-pack/blob/v1.15.8/.github/workflows/ci-e2e.yaml
name: Build tree-sitter-language-pack wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tree-sitter-language-pack.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-language-pack.yml'
      - 'docs/packages/tree-sitter-language-pack.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-language-pack.yml'
      - 'docs/packages/tree-sitter-language-pack.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tree-sitter-language-pack
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tree-sitter-language-pack ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tree-sitter-language-pack"
      version: "${{ matrix.version }}"
      repository: "xberg-io/tree-sitter-language-pack"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 1440


      patches: true
      pre-build: |-
        # The parser-sources release bundle keeps only src/ and queries/, so each
        # grammar's licence has to come from its own pinned revision.
        python3 - <<'PY'
        import concurrent.futures as cf
        import json
        import os
        import pathlib
        import re
        import time
        import urllib.error
        import urllib.request

        NAMES = ["LICENSE", "LICENSE.md", "LICENSE.txt", "LICENCE", "LICENCE.md",
                 "LICENCE.txt", "COPYING", "COPYING.md", "COPYING.txt", "LICENSE-MIT",
                 "LICENSE-APACHE", "UNLICENSE", "license", "license.md"]
        # Grammars whose repository publishes no licence file at the revision
        # sources/language_definitions.json pins (the same 14 in every release
        # from 1.15.8 to 1.22.1). Spelling them out means a grammar that loses
        # its licence, or a fetch that silently fails, trips the assertion below
        # instead of shrinking the wheel's licence set unnoticed.
        UNLICENSED = {"brightscript", "cooklang", "corn", "ebnf", "eds", "eex", "elsa",
                      "facility", "groovy", "move", "pgn", "slint", "t32", "vb"}
        LICENCE_RE = re.compile(r"(?i)^(licen[cs]e|copying|notice)")
        out = pathlib.Path("packages/python/grammar-licenses")


        def write(language, filename, data):
            target = out / language / filename
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(data)
            return language


        def stage(item):
            language, spec = item
            local = spec.get("local")
            if local:
                for path in sorted(pathlib.Path(local).iterdir()):
                    if LICENCE_RE.match(path.name):
                        return write(language, path.name, path.read_bytes())
                return None
            repo, rev = spec.get("repo"), spec.get("rev")
            if not repo or not rev:
                return None
            if repo.startswith("https://github.com/"):
                base = "https://raw.githubusercontent.com/%s/%s" % (repo[19:].strip("/"), rev)
            elif repo.startswith("https://gitlab.com/"):
                base = "%s/-/raw/%s" % (repo.rstrip("/"), rev)
            else:
                return None
            for candidate in NAMES:
                for attempt in range(6):
                    try:
                        with urllib.request.urlopen("%s/%s" % (base, candidate), timeout=60) as response:
                            return write(language, candidate, response.read())
                    except urllib.error.HTTPError as error:
                        # Only a 404 means "no such file"; rate limiting (429) and
                        # server errors are retried, never read as a missing licence.
                        if error.code == 404:
                            break
                        if error.code not in (429, 500, 502, 503, 504) or attempt == 5:
                            raise
                    except (urllib.error.URLError, TimeoutError):
                        if attempt == 5:
                            raise
                    time.sleep(5 * (attempt + 1))
            return None


        definitions = json.load(open("sources/language_definitions.json"))
        with cf.ThreadPoolExecutor(max_workers=16) as pool:
            staged = [name for name in pool.map(stage, sorted(definitions.items())) if name]
        missing = sorted(set(definitions) - set(staged))
        print("staged %d; no licence file at the pinned revision: %s" % (len(staged), ", ".join(missing)))
        assert set(missing) == UNLICENSED, sorted(set(missing) ^ UNLICENSED)
        # the built wheel must carry exactly this many grammar licences
        with open(os.environ["GITHUB_ENV"], "a") as env_file:
            env_file.write("TSLP_LICENCES=%d\n" % len(staged))
        PY

      cibw-package-dir: "packages/python"
      # pyo3/abi3-py310 tags a single wheel cp310-abi3; build it on cp310 and let
      # cibuildwheel reuse and re-test it on the newer interpreters.
      cibw-build: "cp310-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # Upstream's own CI fills parsers/ from a CI artifact of the grammar
      # checkouts; the released bundle is that same tree and spares 371 clones.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && dnf -y install zstd && curl -fsSL -o /tmp/sources.tar.zst \"${PARSER_SOURCES_URL}\" && curl -fsSL -o /tmp/sources.sha256 \"${PARSER_SOURCES_URL}.sha256\" && echo \"$(awk '{print $1}' /tmp/sources.sha256)  /tmp/sources.tar.zst\" | sha256sum -c - && mkdir -p /tmp/sources && tar --zstd -xf /tmp/sources.tar.zst -C /tmp/sources && rm -rf {project}/parsers && mv /tmp/sources/parsers {project}/parsers"
      # Upstream publishes no riscv64 parser bundle, so the runtime download path
      # has nothing to fetch; every grammar is compiled into the wheel instead.
      # TSLP_GRAMMAR_CFLAGS matches the -O2 upstream builds its parsers with.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PARSER_SOURCES_URL=https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v${{ matrix.version }}/parser-sources-${{ matrix.version }}.tar.zst PROJECT_ROOT=/project TSLP_LANGUAGES=all TSLP_LINK_MODE=static TSLP_GRAMMAR_CFLAGS=-O2"
      cibw-test-requires: "pytest pytest-asyncio pytest-timeout"
      cibw-test-sources: "e2e/python"
      # test_download.py needs upstream's prebuilt parser bundle for this
      # platform, which is exactly what riscv64 has none of.
      cibw-test-command: "python -c \"import importlib.metadata as md, os; n = len([p for p in md.files('tree-sitter-language-pack') if '.dist-info/licenses/grammar-licenses/' in str(p)]); assert n == int(os.environ['TSLP_LICENCES']), n\" && cd e2e/python && python -m pytest tests --ignore=tests/test_download.py"
      cibw-environment-pass-linux: "TSLP_LICENCES"

  publish:
    name: Publish tree-sitter-language-pack ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tree-sitter-language-pack-${{ matrix.version }}-*-manylinux_riscv64
