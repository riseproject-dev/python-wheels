---
# This workflow is based on: https://github.com/christoph2/pyA2L/blob/bb56134/.github/workflows/pythonapp.yml
name: Build pya2ldb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pya2ldb.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pya2ldb.yml'
      - 'docs/packages/pya2ldb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pya2ldb.yml'
      - 'docs/packages/pya2ldb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream's bumpver config creates tags locally but never pushes them (pyproject.toml
  # tool.bumpver push = false), so no v1.0.355 tag exists on GitHub. bb56134 is the commit
  # whose pyproject.toml/CMakeLists.txt are byte-identical to the released 1.0.355 sdist.
  # Update it alongside PYA2LDB_VERSION.
  PYA2LDB_REF: bb5613485244b2c30408b57db6a9a7792f1f3745
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pya2ldb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pya2ldb ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYA2LDB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pya2ldb ${{ env.PYA2LDB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: christoph2/pyA2L
          ref: ${{ env.PYA2LDB_REF }}
          submodules: recursive
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=SQLAlchemy
          CIBW_TEST_REQUIRES: pytest
          # gotcha 25: {project} in CIBW_TEST_COMMAND bypasses the staged test_cwd and
          # shadows the wheel with the unbuilt checkout. gotcha 36: test-sources keeps
          # each path's position relative to the project root, and the two roundtrip
          # tests resolve their fixtures as repo_root/examples/*, so the top-level
          # examples/ (a sibling of pya2l/, not pya2l/examples/) is staged as-is.
          CIBW_TEST_SOURCES: pya2l/tests examples pyproject.toml
          CIBW_TEST_COMMAND: pytest pya2l/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pya2ldb-${{ env.PYA2LDB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pya2ldb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pya2ldb-${{ matrix.version }}-*-manylinux_riscv64
