---
# This workflow is based on: https://github.com/christoph2/pyA2L/blob/bb56134/.github/workflows/pythonapp.yml
name: Build pya2ldb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pya2ldb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pya2ldb.yml'
      - 'docs/packages/pya2ldb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pya2ldb.yml'
      - 'docs/packages/pya2ldb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pya2ldb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pya2ldb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pya2ldb
      version: ${{ matrix.version }}
      repository: christoph2/pyA2L
      ref: bb5613485244b2c30408b57db6a9a7792f1f3745
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      # Upstream's bumpver config creates tags locally but never pushes them (pyproject.toml
      # tool.bumpver push = false), so no v1.0.355 tag exists on GitHub. bb56134 is the commit
      # whose pyproject.toml/CMakeLists.txt are byte-identical to the released 1.0.355 sdist.
      # Update it alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: "PIP_ONLY_BINARY=SQLAlchemy"
      cibw-test-requires: pytest
      # gotcha 25: {project} in CIBW_TEST_COMMAND bypasses the staged test_cwd and
      # shadows the wheel with the unbuilt checkout. gotcha 36: test-sources keeps
      # each path's position relative to the project root, and the two roundtrip
      # tests resolve their fixtures as repo_root/examples/*, so the top-level
      # examples/ (a sibling of pya2l/, not pya2l/examples/) is staged as-is.
      cibw-test-sources: pya2l/tests examples pyproject.toml
      cibw-test-command: pytest pya2l/tests
      timeout-minutes: 60

  publish:
    name: Publish pya2ldb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pya2ldb-${{ matrix.version }}-*-manylinux_riscv64
