---
# This workflow is based on the `build-wheels` job of
# https://github.com/libnano/primer3-py/blob/v2.3.0/.github/workflows/release.yml
name: Build primer3-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/primer3-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-primer3-py.yml'
      - 'docs/packages/primer3-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-primer3-py.yml'
      - 'docs/packages/primer3-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: primer3-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build primer3-py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: primer3-py
      version: ${{ matrix.version }}
      repository: libnano/primer3-py
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      # tests/ is a package sitting beside primer3/ at the checkout root, so
      # the default in-place test-command would import the uncompiled source
      # tree instead of the wheel (gotcha 25); TEST_SOURCES stops that. The
      # suite also shells out to the compiled ntthal/primer3_core CLI tools
      # at a path relative to tests/, so stage the *installed* package back
      # in too (gotcha 329) rather than just proving the extension imports.
      cibw-test-sources: tests
      cibw-test-command: >-
        cp -a "$(python -c 'import primer3, os; print(os.path.dirname(primer3.__file__))')" primer3 &&
        python -c "import primer3.thermoanalysis as t; assert t.__file__.endswith('.so'), t.__file__" &&
        python -m pytest tests/test_thermoanalysis.py -v
      timeout-minutes: 60

  publish:
    name: Publish primer3-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: primer3-py-${{ matrix.version }}-*-manylinux_riscv64
