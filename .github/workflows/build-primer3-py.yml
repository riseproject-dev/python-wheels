---
# This workflow is based on the `build-wheels` job of
# https://github.com/libnano/primer3-py/blob/v2.3.0/.github/workflows/release.yml
name: Build primer3-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'primer3-py version to build (git tag, e.g. v2.3.0)'
        required: true
        default: 'v2.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-primer3-py.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || 'v2.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to v2.3.0 there.
  PRIMER3_PY_VERSION: ${{ inputs.version || 'v2.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build primer3-py ${{ inputs.version || 'v2.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): setup.py's Cython extensions link the
        # version-specific ABI, matching upstream's per-Python-version wheels.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout primer3-py ${{ env.PRIMER3_PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: libnano/primer3-py
          ref: ${{ env.PRIMER3_PY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          # tests/ is a package sitting beside primer3/ at the checkout root, so
          # the default in-place test-command would import the uncompiled source
          # tree instead of the wheel (gotcha 25); TEST_SOURCES stops that. The
          # suite also shells out to the compiled ntthal/primer3_core CLI tools
          # at a path relative to tests/, so stage the *installed* package back
          # in too (gotcha 329) rather than just proving the extension imports.
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            cp -a "$(python -c 'import primer3, os; print(os.path.dirname(primer3.__file__))')" primer3 &&
            python -c "import primer3.thermoanalysis as t; assert t.__file__.endswith('.so'), t.__file__" &&
            python -m pytest tests/test_thermoanalysis.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: primer3-py-${{ env.PRIMER3_PY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish primer3-py ${{ inputs.version || 'v2.3.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: primer3-py-${{ inputs.version || 'v2.3.0' }}-*-manylinux_riscv64
