---
# Based on the `build_wheels` job of
# https://github.com/sumerc/yappi/blob/v1.7.6/.github/workflows/github-deploy.yml
# and the test invocation of
# https://github.com/sumerc/yappi/blob/v1.7.6/.github/workflows/main.yml
name: Build yappi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/yappi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-yappi.yml'
      - 'docs/packages/yappi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-yappi.yml'
      - 'docs/packages/yappi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: yappi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build yappi ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cp314t is excluded by upstream's `[tool.cibuildwheel] skip`.
        python: ["cp312", "cp313", "cp314"]

    env:
      YAPPI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout yappi v${{ env.YAPPI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sumerc/yappi
          ref: v${{ env.YAPPI_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          # musllinux is dropped: gevent, the test dependency, has no musl riscv64 wheel.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream builds its wheels untested and runs this suite separately.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests run_tests.py
          CIBW_TEST_COMMAND: python run_tests.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: yappi-${{ env.YAPPI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish yappi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: yappi-${{ matrix.version }}-*-manylinux_riscv64
