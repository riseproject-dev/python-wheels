---
# This workflow is based on the `build-linux` job of
# https://github.com/backbone-hq/pqcrypto/blob/v1.0.0/.github/workflows/ci.yml
name: Build pqcrypto wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pqcrypto version to build (git tag without leading v, e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-pqcrypto.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.0.0 there.
  PQCRYPTO_VERSION: ${{ inputs.version || '1.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pqcrypto ${{ inputs.version || '1.0.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py39 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter it claims. Upstream itself builds
          # its manylinux wheel against Python 3.12 (ci.yml build-linux image),
          # and ships no free-threaded (cp314t) wheel, so there is no second job
          # here -- pyo3 disables abi3 under Py_GIL_DISABLED and this crate has
          # no non-abi3 build path.
          - tag: cp39-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    steps:
      - name: Checkout pqcrypto v${{ env.PQCRYPTO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: backbone-hq/pqcrypto
          ref: v${{ env.PQCRYPTO_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No [tool.cibuildwheel] upstream, so the Rust toolchain its maturin
          # backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -q tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pqcrypto-${{ env.PQCRYPTO_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pqcrypto ${{ inputs.version || '1.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pqcrypto-${{ inputs.version || '1.0.0' }}-*-manylinux_riscv64
