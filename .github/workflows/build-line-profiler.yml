---
# Based on the `build_binpy_wheels` job of
# https://github.com/pyutils/line_profiler/blob/v5.0.2/.github/workflows/tests.yml
name: Build line-profiler wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/line-profiler.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-line-profiler.yml'
      - 'docs/packages/line-profiler.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-line-profiler.yml'
      - 'docs/packages/line-profiler.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: line-profiler
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build line-profiler ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: line-profiler
      version: ${{ matrix.version }}
      repository: pyutils/line_profiler
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream 5.1.0 added `*-musllinux_*` to its pyproject skip list; we build musllinux.
      cibw-skip: cp310-win_arm64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Cython has no public riscv64 wheel; ours is in the registry.
      cibw-test-command: >-
        python -c "import line_profiler._line_profiler as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        python {project}/run_tests.py
      timeout-minutes: 90

  publish:
    name: Publish line-profiler ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: line-profiler-${{ matrix.version }}-*riscv64
