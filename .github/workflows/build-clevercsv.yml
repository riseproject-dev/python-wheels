---
# This workflow is based on: https://github.com/alan-turing-institute/CleverCSV/blob/v0.8.5/.github/workflows/deploy.yml
name: Build clevercsv wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clevercsv.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clevercsv.yml'
      - 'docs/packages/clevercsv.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clevercsv.yml'
      - 'docs/packages/clevercsv.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clevercsv
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clevercsv ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: clevercsv
      version: ${{ matrix.version }}
      repository: alan-turing-institute/CleverCSV
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # pandas/wilderness cover the hard imports in tests/test_unit
      # (test_wrappers.py, test_console.py); faust-cchardet is skipped -
      # it has no riscv64 wheel, and test_encoding.py already skips
      # itself when it can't be imported. chardet's heuristic changed in
      # 6.0, so test_console.py's hardcoded expectations need chardet<6.
      cibw-test-requires: 'chardet<6 pandas wilderness'
      # Our registry has no cp314t pandas wheel, so PIP_PREFER_BINARY
      # (not PIP_ONLY_BINARY, which would break that one leg) skips an
      # ~45-minute from-source build on the other three interpreters.
      cibw-test-environment: PIP_PREFER_BINARY=1
      cibw-test-command: "python -VV && python -m unittest discover -f -s {project}/tests/test_unit/"
      timeout-minutes: 60

  publish:
    name: Publish clevercsv ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clevercsv-${{ matrix.version }}-*-manylinux_riscv64
