---
# Based on the `build-linux-x86` job of https://github.com/alkaline-ml/pmdarima/blob/v2.1.1/.circleci/config.yml
name: Build pmdarima wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pmdarima.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pmdarima.yml'
      - 'docs/packages/pmdarima.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pmdarima.yml'
      - 'docs/packages/pmdarima.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pmdarima
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pmdarima ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pmdarima
      version: ${{ matrix.version }}
      repository: alkaline-ml/pmdarima
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # build_tools/get_tag.py only reads the version off GITHUB_REF when it looks
      # like a tag ref; the container starts with no env, so it's set explicitly.
      cibw-environment: >-
        GITHUB_REF=refs/tags/v${{ matrix.version }}
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,scipy,pandas,scikit-learn,statsmodels
      cibw-before-test: pip install .[test]
      # test_max_dur/test_subsequent_contexts time a 0.5s early-termination window
      # and flake under CI load; pipeline6's True-True-X0 case hits a genuine 2.1.1
      # bug against numpy>=2.5 (conf_ints comes back read-only, so pipeline.py's
      # in-place inverse-transform assignment raises) - reproduces on every arch.
      cibw-test-command: >-
        pytest --showlocals --durations=20 --pyargs pmdarima
        -k "not test_max_dur and not test_subsequent_contexts and
        not (test_pipeline_predict_inverse_transform and True-True-X0-pipeline6)"
      timeout-minutes: 720

  publish:
    name: Publish pmdarima ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pmdarima-${{ matrix.version }}-*-manylinux_riscv64
