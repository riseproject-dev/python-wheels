---
# This workflow is based on: https://github.com/KaveIO/PhiK/blob/v0.12.5/.github/workflows/wheels.yml
name: Build phik wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'phik version to build (git tag without the leading v, e.g. 0.12.5)'
        required: true
        default: '0.12.5'
  pull_request:
    paths:
      - '.github/workflows/build-phik.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.12.5' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.12.5 there.
  PHIK_VERSION: ${{ inputs.version || '0.12.5' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build phik ${{ inputs.version || '0.12.5' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter, matching upstream's own cp39-cp314 matrix, minus cp39:
        # matplotlib (a hard runtime dependency) has no riscv64 wheel on
        # pypi.riseproject.dev for cp39, which would fall back to a from-source build
        # during the test-install step.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"

    steps:
      - name: Checkout PhiK v${{ env.PHIK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: KaveIO/PhiK
          ref: v${{ env.PHIK_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
          # and pybind11's headers need pip to resolve.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          # numpy/scipy/pandas/matplotlib have riscv64 wheels only on our registry;
          # don't let pip fall back to a from-source build of any of them.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy,pandas,matplotlib
          CIBW_TEST_COMMAND: pytest {project}/tests/test_phik.py -W ignore::DeprecationWarning

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phik-${{ env.PHIK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish phik ${{ inputs.version || '0.12.5' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: phik-${{ inputs.version || '0.12.5' }}-*-manylinux_riscv64
