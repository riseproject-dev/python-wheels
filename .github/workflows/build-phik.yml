---
# This workflow is based on: https://github.com/KaveIO/PhiK/blob/v0.12.5/.github/workflows/wheels.yml
name: Build phik wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/phik.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-phik.yml'
      - 'docs/packages/phik.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-phik.yml'
      - 'docs/packages/phik.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: phik
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build phik ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter, matching upstream's own cp39-cp314 matrix, minus cp39:
        # matplotlib (a hard runtime dependency) has no riscv64 wheel on
        # pypi.riseproject.dev for cp39, which would fall back to a from-source build
        # during the test-install step.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      PHIK_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout PhiK v${{ env.PHIK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: KaveIO/PhiK
          ref: v${{ env.PHIK_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
          # and pybind11's headers need pip to resolve.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          # numpy/scipy/pandas/matplotlib/pillow have riscv64 wheels only on our registry,
          # which lags Pillow's public-PyPI releases; unpinned, pip resolves the newest
          # Pillow sdist and fails building it (no libjpeg headers in the image).
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy,pandas,matplotlib,pillow
          CIBW_TEST_COMMAND: pytest {project}/tests/test_phik.py -W ignore::DeprecationWarning

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phik-${{ env.PHIK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish phik ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: phik-${{ matrix.version }}-*-manylinux_riscv64
