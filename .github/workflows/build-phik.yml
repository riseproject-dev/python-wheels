---
# This workflow is based on: https://github.com/KaveIO/PhiK/blob/v0.12.5/.github/workflows/wheels.yml
name: Build phik wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/phik.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-phik.yml'
      - 'docs/packages/phik.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-phik.yml'
      - 'docs/packages/phik.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: phik
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build phik ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: phik
      version: ${{ matrix.version }}
      repository: KaveIO/PhiK
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
      # and pybind11's headers need pip to resolve.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-extras: test
      # numpy/scipy/pandas/matplotlib/pillow have riscv64 wheels only on our registry,
      # which lags Pillow's public-PyPI releases; unpinned, pip resolves the newest
      # Pillow sdist and fails building it (no libjpeg headers in the image).
      cibw-test-environment: PIP_ONLY_BINARY=numpy,scipy,pandas,matplotlib,pillow
      cibw-test-command: pytest {project}/tests/test_phik.py -W ignore::DeprecationWarning
      timeout-minutes: 90

  publish:
    name: Publish phik ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: phik-${{ matrix.version }}-*-manylinux_riscv64
