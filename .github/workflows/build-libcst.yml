---
# This workflow is based on: https://github.com/Instagram/LibCST/blob/v1.9.0/.github/workflows/build.yml
name: Build libcst wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libcst.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libcst.yml'
      - 'docs/packages/libcst.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libcst.yml'
      - 'docs/packages/libcst.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libcst
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libcst ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: libcst
      version: ${{ matrix.version }}
      # setuptools-scm reads the version from the tag.
      repository: Instagram/LibCST
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The image ships no Rust toolchain and the native parser is a PyO3 crate.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # Repeats upstream's pyproject environment because CIBW_ENVIRONMENT
      # replaces it: cargo on PATH, and the local version scheme off so the
      # wheel carries the declared version rather than a setuptools_scm dev one.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" LIBCST_NO_LOCAL_SCHEME=1"
      timeout-minutes: 90

  publish:
    name: Publish libcst ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libcst-${{ matrix.version }}-*-manylinux_riscv64
