---
# Based on upstream's wheel builder:
#   https://github.com/SystemRDL/systemrdl-compiler/blob/v1.32.2/.github/workflows/build.yml
name: Build systemrdl-compiler wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/systemrdl-compiler.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-systemrdl-compiler.yml'
      - 'docs/packages/systemrdl-compiler.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-systemrdl-compiler.yml'
      - 'docs/packages/systemrdl-compiler.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: systemrdl-compiler
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build systemrdl-compiler ${{ matrix.version }} cp37-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: systemrdl-compiler
      version: ${{ matrix.version }}
      repository: SystemRDL/systemrdl-compiler
      ref: v${{ matrix.version }}
      artifact-tag: cp37-abi3-manylinux_riscv64
      cibw-build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
      # Upstream passes this as a step env, which never reaches a Linux build container.
      cibw-environment: SYSTEMRDL_REQUIRE_BINARY_BUILD=1
      # The RDL Perl preprocessor needs Safe.pm, absent from the image's minimal perl.
      cibw-before-test: dnf -y install perl-Safe
      cibw-test-requires: pytest parameterized
      cibw-test-sources: test
      cibw-test-command: >-
        python -c "import systemrdl.parser.sa_systemrdl_cpp_parser as m; assert m.__file__.endswith('.so'), m.__file__"
        && cd test && python -m pytest
      timeout-minutes: 180

  publish:
    name: Publish systemrdl-compiler ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: systemrdl-compiler-${{ matrix.version }}-*-manylinux_riscv64
