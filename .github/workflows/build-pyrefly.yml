---
# This workflow is based on the `sdist`/`linux` jobs of
# https://github.com/facebook/pyrefly/blob/1.2.0/.github/workflows/build_binaries.yml
name: Build pyrefly wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyrefly version to build (git tag, e.g. 1.2.0)'
        required: true
        default: '1.2.0'
  pull_request:
    paths:
      - '.github/workflows/build-pyrefly.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.2.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.2.0 there.
  PYREFLY_VERSION: ${{ inputs.version || '1.2.0' }}

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheel:
    needs: [setup]
    name: Build pyrefly ${{ inputs.version || '1.2.0' }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    steps:
      - name: Checkout pyrefly ${{ env.PYREFLY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: facebook/pyrefly
          ref: ${{ env.PYREFLY_VERSION }}
          persist-credentials: false

      # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
      # with no ABI tag, so a single native build covers every interpreter.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --out dist
          working-directory: pyrefly
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyrefly-${{ env.PYREFLY_VERSION }}-manylinux_riscv64
          path: pyrefly/dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test pyrefly ${{ inputs.version || '1.2.0' }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        # This repo's default interpreter matrix (gotcha in workflow-anatomy.md);
        # the wheel is interpreter-agnostic (bindings = "bin"), so every
        # interpreter -- including free-threaded -- exercises the same binary.
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    steps:
      - name: Checkout pyrefly ${{ env.PYREFLY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: facebook/pyrefly
          ref: ${{ env.PYREFLY_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyrefly-${{ env.PYREFLY_VERSION }}-manylinux_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . pyrefly

      # Mirrors the `sdist`/`linux` jobs' own smoke test in upstream's
      # build_binaries.yml: --version/--help, a real check against upstream's
      # own test.py fixture, and the `python -m` entry point.
      - name: Test wheel
        run: |
          set -euo pipefail
          pyrefly --version
          pyrefly --help
          pyrefly check test.py
          python -m pyrefly --version

  publish:
    name: Publish pyrefly ${{ inputs.version || '1.2.0' }}
    needs: [setup, build_wheel, test_wheel]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyrefly-${{ inputs.version || '1.2.0' }}-manylinux_riscv64
