---
# This workflow is based on the `sdist`/`linux` jobs of
# https://github.com/facebook/pyrefly/blob/1.2.0/.github/workflows/build_binaries.yml
name: Build pyrefly wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrefly.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrefly.yml'
      - 'docs/packages/pyrefly.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrefly.yml'
      - 'docs/packages/pyrefly.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrefly
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: pyrefly
      version: ${{ matrix.version }}
      repository: facebook/pyrefly
      ref: ${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 360
      maturin-args: --release --locked
      maturin-working-directory: pyrefly

  test_wheel:
    name: Test pyrefly ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      PYREFLY_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout pyrefly ${{ env.PYREFLY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: facebook/pyrefly
          ref: ${{ env.PYREFLY_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyrefly-${{ env.PYREFLY_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . pyrefly

      # Mirrors the `sdist`/`linux` jobs' own smoke test in upstream's
      # build_binaries.yml: --version/--help, a real check against upstream's
      # own test.py fixture, and the `python -m` entry point.
      - name: Test wheel
        run: |
          set -euo pipefail
          pyrefly --version
          pyrefly --help
          pyrefly check test.py
          python -m pyrefly --version

  publish:
    name: Publish pyrefly ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyrefly-${{ matrix.version }}-manylinux_riscv64
