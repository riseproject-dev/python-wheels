---
# This workflow is based on: https://github.com/deepmind/tree/blob/0.1.10/.github/workflows/build.yml
name: Build dm-tree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dm-tree.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dm-tree.yml'
      - 'docs/packages/dm-tree.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dm-tree.yml'
      - 'docs/packages/dm-tree.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Versions tree/CMakeLists.txt's FetchContent pins at this tag; bump both in
  # lockstep with DM_TREE_VERSION.
  ABSEIL_VERSION: '20260107.1'
  PYBIND11_VERSION: '3.0.1'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dm-tree
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dm-tree ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dm-tree"
      version: "${{ matrix.version }}"
      repository: "deepmind/tree"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-environment-linux: "MAKEFLAGS=-j$(nproc) ABSEIL_VERSION=20260107.1 PYBIND11_VERSION=3.0.1"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # CMakeLists.txt statically links abseil-cpp into _tree.so via FetchContent;
      # upstream's own wheels ship no licence for it, so pull it from the same
      # tarball CMake fetches. pybind11 is header-only but its templates end up
      # compiled into the same .so, so carry its licence too.
      cibw-before-all-linux: "mkdir -p /tmp/abseil-cpp /tmp/pybind11 && curl -sSLf \"https://github.com/abseil/abseil-cpp/archive/refs/tags/${ABSEIL_VERSION}.tar.gz\" | tar -xz -C /tmp/abseil-cpp --strip-components=1 && curl -sSLf \"https://github.com/pybind/pybind11/archive/refs/tags/v${PYBIND11_VERSION}.tar.gz\" | tar -xz -C /tmp/pybind11 --strip-components=1 && cp /tmp/abseil-cpp/LICENSE {project}/LICENSE.abseil-cpp && cp /tmp/pybind11/LICENSE {project}/LICENSE.pybind11"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest --pyargs tree"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DM_TREE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dm-tree-${{ env.DM_TREE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("tree/_tree.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith("licenses/LICENSE") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.abseil-cpp") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.pybind11") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish dm-tree ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dm-tree-${{ matrix.version }}-*-manylinux_riscv64
