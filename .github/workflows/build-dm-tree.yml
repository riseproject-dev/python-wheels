---
# This workflow is based on: https://github.com/deepmind/tree/blob/0.1.10/.github/workflows/build.yml
name: Build dm-tree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'dm-tree version to build (git tag, e.g. 0.1.10)'
        required: true
        default: '0.1.10'
  pull_request:
    paths:
      - '.github/workflows/build-dm-tree.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.10' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.10 there.
  DM_TREE_VERSION: ${{ inputs.version || '0.1.10' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Versions tree/CMakeLists.txt's FetchContent pins at this tag; bump both in
  # lockstep with DM_TREE_VERSION.
  ABSEIL_VERSION: '20260107.1'
  PYBIND11_VERSION: '3.0.1'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build dm-tree ${{ inputs.version || '0.1.10' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout tree ${{ env.DM_TREE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: deepmind/tree
          ref: ${{ env.DM_TREE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # CMakeLists.txt statically links abseil-cpp into _tree.so via FetchContent;
          # upstream's own wheels ship no licence for it, so pull it from the same
          # tarball CMake fetches. pybind11 is header-only but its templates end up
          # compiled into the same .so, so carry its licence too.
          CIBW_BEFORE_ALL_LINUX: >-
            mkdir -p /tmp/abseil-cpp /tmp/pybind11 &&
            curl -sSLf "https://github.com/abseil/abseil-cpp/archive/refs/tags/${ABSEIL_VERSION}.tar.gz"
            | tar -xz -C /tmp/abseil-cpp --strip-components=1 &&
            curl -sSLf "https://github.com/pybind/pybind11/archive/refs/tags/v${PYBIND11_VERSION}.tar.gz"
            | tar -xz -C /tmp/pybind11 --strip-components=1 &&
            cp /tmp/abseil-cpp/LICENSE {project}/LICENSE.abseil-cpp &&
            cp /tmp/pybind11/LICENSE {project}/LICENSE.pybind11
          CIBW_ENVIRONMENT_PASS_LINUX: ABSEIL_VERSION PYBIND11_VERSION
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            MAKEFLAGS=-j$(nproc)
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs tree

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("tree/_tree.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith("licenses/LICENSE") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.abseil-cpp") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.pybind11") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dm-tree-${{ env.DM_TREE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish dm-tree ${{ inputs.version || '0.1.10' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: dm-tree-${{ inputs.version || '0.1.10' }}-*-manylinux_riscv64
