---
# Based on upstream's wheel builder:
#   https://github.com/mwilliamson/jq.py/blob/1.12.0/.github/workflows/build.yml
# jq.py vendors jq's own release tarball (deps/jq-<ver>.tar.gz, which itself bundles
# oniguruma under vendor/) and builds+statically links both via setup.py's own
# ./configure && make invocation - no CIBW_BEFORE_BUILD is needed, matching upstream.
name: Build jq wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jq.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jq.yml'
      - 'docs/packages/jq.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jq.yml'
      - 'docs/packages/jq.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jq
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build jq ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      JQ_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout jq.py ${{ env.JQ_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mwilliamson/jq.py
          ref: ${{ env.JQ_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          set -euo pipefail
          rm -rf dist
          uv pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jq-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build jq ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: jq
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: jq-${{ matrix.version }}-sdist
      pre-build: |-
        set -euo pipefail

        # setuptools' default license-files glob (LICEN[CS]E*) picks these up from
        # the project root; jq statically links both libjq and oniguruma into the
        # extension, so their (both BSD) licence texts need to ship alongside
        # jq.py's own LICENSE.
        jq_tarball="$(ls deps/*.tar.gz)"
        jq_dir="$(basename "${jq_tarball}" .tar.gz)"
        tar xzf "${jq_tarball}" -O "${jq_dir}/COPYING" > LICENSE.jq
        tar xzf "${jq_tarball}" -O "${jq_dir}/vendor/oniguruma/COPYING" > LICENSE.oniguruma
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      cibw-test-command: pytest {package}/tests

  publish:
    name: Publish jq ${{ matrix.version }}
    needs: [setup, build_sdist, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jq-${{ matrix.version }}-*-manylinux_riscv64
