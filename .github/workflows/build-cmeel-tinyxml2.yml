---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-tinyxml2/blob/v11.0.0.c0/.github/workflows/release.yml
name: Build cmeel-tinyxml2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-tinyxml2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-tinyxml2.yml'
      - 'docs/packages/cmeel-tinyxml2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-tinyxml2.yml'
      - 'docs/packages/cmeel-tinyxml2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-tinyxml2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-tinyxml2 ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cmeel-tinyxml2
      version: ${{ matrix.version }}
      # cmeel-tinyxml2's own release tags carry a trailing packaging-revision
      # suffix (.c0) that isn't part of the wheel's own version.
      repository: cmake-wheel/cmeel-tinyxml2
      ref: v${{ matrix.version }}.c0
      artifact-tag: py3-none-manylinux_riscv64
      checkout-submodules: true
      # has-sitelib = false: the wheel holds no Python extension, so one
      # py3-none wheel covers every interpreter.
      cibw-build: cp312-manylinux_riscv64
      cibw-environment: CMEEL_LOG_LEVEL=DEBUG PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # cmeel links libtinyxml2.so with an $ORIGIN RUNPATH into the shared
      # cmeel prefix; repair would only re-tag it, as upstream's own
      # release.yml assumes.
      cibw-repair-wheel-command: ""
      cibw-test-command: >-
        python -c "import ctypes, pathlib, sysconfig;
        lib = pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix/lib/libtinyxml2.so';
        ctypes.CDLL(str(lib))"
      timeout-minutes: 120

  publish:
    name: Publish cmeel-tinyxml2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-tinyxml2-${{ matrix.version }}-py3-none-manylinux_riscv64
