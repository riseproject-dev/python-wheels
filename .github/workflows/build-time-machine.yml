---
# This workflow is based on the `build` job of
# https://github.com/adamchainz/time-machine/blob/3.5.0/.github/workflows/main.yml
name: Build time-machine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'time-machine version to build (git tag, e.g. 3.5.0)'
        required: true
        default: '3.5.0'
  pull_request:
    paths:
      - '.github/workflows/build-time-machine.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.5.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  TIME_MACHINE_VERSION: ${{ inputs.version || '3.5.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build time-machine ${{ inputs.version || '3.5.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout time-machine ${{ env.TIME_MACHINE_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: adamchainz/time-machine
          ref: ${{ env.TIME_MACHINE_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/time-machine/${{ env.TIME_MACHINE_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The free-threaded hypothesis wheel for riscv64 only exists on our registry.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_GROUPS: test
          CIBW_TEST_EXTRAS: cli
          # pyproject.toml carries `[tool.pytest] addopts = ["-p", "pytester"]`; without
          # it the five `testdir`-based marker tests error out on a missing fixture.
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_ENVIRONMENT: PYTHONDEVMODE=1
          # Upstream never tests its wheels in cibuildwheel; run what its tox envs run,
          # minus the coverage wrapper, which only feeds its 100%-coverage gate.
          CIBW_TEST_COMMAND: >-
            python -W error
            -W ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning
            -W ignore:datetime.datetime.utcnow:DeprecationWarning
            -W 'ignore:Module globals; __loader__ != __spec__.loader'
            -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: time-machine-${{ env.TIME_MACHINE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish time-machine ${{ inputs.version || '3.5.0' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: time-machine-${{ env.TIME_MACHINE_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
