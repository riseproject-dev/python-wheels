---
# This workflow is based on the `build` job of
# https://github.com/adamchainz/time-machine/blob/3.5.0/.github/workflows/main.yml
name: Build time-machine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/time-machine.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-time-machine.yml'
      - 'docs/packages/time-machine.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-time-machine.yml'
      - 'docs/packages/time-machine.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: time-machine
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build time-machine ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "time-machine"
      version: "${{ matrix.version }}"
      repository: "adamchainz/time-machine"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The free-threaded hypothesis wheel for riscv64 only exists on our registry.
      cibw-test-groups: "test"
      cibw-test-extras: "cli"
      # pyproject.toml carries `[tool.pytest] addopts = ["-p", "pytester"]`; without
      # it the five `testdir`-based marker tests error out on a missing fixture.
      cibw-test-sources: "tests pyproject.toml"
      # PyPI's hypothesis has no cp314t riscv64 wheel (gotcha 210); only-binary
      # keeps a newer sdist-only PyPI release from outresolving our registry's.
      cibw-test-environment: "PYTHONDEVMODE=1 PIP_ONLY_BINARY=hypothesis"
      # Upstream never tests its wheels in cibuildwheel; run what its tox envs run,
      # minus the coverage wrapper, which only feeds its 100%-coverage gate.
      cibw-test-command: "python -W error -W ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning -W ignore:datetime.datetime.utcnow:DeprecationWarning -W 'ignore:Module globals; __loader__ != __spec__.loader' -m pytest tests"

  publish:
    name: Publish time-machine ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: time-machine-${{ matrix.version }}-*-manylinux_riscv64
