---
# This workflow mirrors the build_wheels job of upstream's own
# .github/workflows/publish-to-test-and-live-pypi.yml, narrowed to riscv64.
name: Build spiceypy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spiceypy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spiceypy.yml'
      - 'docs/packages/spiceypy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spiceypy.yml'
      - 'docs/packages/spiceypy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MIRROR_BASE: https://raw.githubusercontent.com/AndrewAnnex/cspice-release-mirror/refs/heads/main/artifacts
  CSPICE_ARCHIVE: N67_lin_x64_cspice.tar.gz

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spiceypy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spiceypy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "spiceypy"
      version: "${{ matrix.version }}"
      repository: "AndrewAnnex/SpiceyPy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        export MIRROR_BASE=https://raw.githubusercontent.com/AndrewAnnex/cspice-release-mirror/refs/heads/main/artifacts
        export CSPICE_ARCHIVE=N67_lin_x64_cspice.tar.gz
        set -euo pipefail
        curl -fsSL "${MIRROR_BASE}/${CSPICE_ARCHIVE}" -o "${CSPICE_ARCHIVE}"
        curl -fsSL "${MIRROR_BASE}/${CSPICE_ARCHIVE}.sha256" -o "${CSPICE_ARCHIVE}.sha256"
        expected="$(tr -d '[:space:]' < "${CSPICE_ARCHIVE}.sha256")"
        actual="$(sha256sum "${CSPICE_ARCHIVE}" | awk '{print $1}')"
        test "$expected" = "$actual"
        mkdir -p cspice-src-cache
        tar xzf "${CSPICE_ARCHIVE}" -C cspice-src-cache
        test -d cspice-src-cache/cspice/src/cspice

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-extras: "uv"
      cibw-environment-linux: "CSPICE_SRC=/project/cspice-src-cache/cspice SPICEYPY_CSPICE_PREFIX=/project/cspice-prefix CMAKE_BUILD_PARALLEL_LEVEL=\"$(nproc)\""
      # dependency-groups=dev also pulls in black/twine/build/scikit-build-core,
      # packaging/lint tools the test command never calls; black has no riscv64
      # wheel for cp310/cp311 on PyPI or our registry and would otherwise have to
      # mypyc-compile from source on every job.
      cibw-test-groups: ''
      cibw-test-requires: "numpy>=1.23.5 pandas>=2.2.2 pytest>=7.0.0 pytest-benchmark coverage>=7.0.0"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPICEYPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spiceypy-${{ env.SPICEYPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extension and CSPICE
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("spiceypy/cyice/cyice") and n.endswith(".so") for n in names), (whl, names)
              assert any(n.endswith("spiceypy/utils/libcspice.so") for n in names), (whl, names)
              print(whl, "ok")
          EOF

  publish:
    name: Publish spiceypy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spiceypy-${{ matrix.version }}-*-manylinux_riscv64
