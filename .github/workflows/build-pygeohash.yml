---
# Based on the `build_wheels` job of
# https://github.com/wdm0006/pygeohash/blob/v3.3.2/.github/workflows/publish-pypi.yml
name: Build pygeohash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pygeohash version to build (git tag without leading v, e.g. 3.3.2)'
        required: true
        default: '3.3.2'
  pull_request:
    paths:
      - '.github/workflows/build-pygeohash.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.3.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYGEOHASH_VERSION: ${{ inputs.version || '3.3.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pygeohash ${{ inputs.version || '3.3.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pygeohash v${{ env.PYGEOHASH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: wdm0006/pygeohash
          ref: v${{ env.PYGEOHASH_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          # matplotlib/pandas have no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: viz
          # `benchmark` extra's comparison libraries have no riscv64 wheel, but
          # test_benchmark_comparison.py drops each one that fails to import.
          CIBW_TEST_REQUIRES: pytest pytest-cov pytest-benchmark pandas
          # The repo-root pygeohash/ would otherwise shadow the installed wheel's
          # compiled extension; examples/ is needed too, since test_examples.py
          # imports it directly.
          CIBW_TEST_SOURCES: tests examples pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "import pygeohash.cgeohash.geohash_module as m; assert m.__file__.endswith('.so'), m.__file__" &&
            pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pygeohash-${{ env.PYGEOHASH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pygeohash ${{ inputs.version || '3.3.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pygeohash-${{ inputs.version || '3.3.2' }}-*-manylinux_riscv64
