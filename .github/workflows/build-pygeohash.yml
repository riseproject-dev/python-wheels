---
# Based on the `build_wheels` job of
# https://github.com/wdm0006/pygeohash/blob/v3.3.2/.github/workflows/publish-pypi.yml
name: Build pygeohash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pygeohash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pygeohash.yml'
      - 'docs/packages/pygeohash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pygeohash.yml'
      - 'docs/packages/pygeohash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pygeohash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pygeohash ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pygeohash
      version: ${{ matrix.version }}
      repository: wdm0006/pygeohash
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      # matplotlib/pandas have no riscv64 wheel on public PyPI.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-extras: viz
      # `benchmark` extra's comparison libraries have no riscv64 wheel, but
      # test_benchmark_comparison.py drops each one that fails to import.
      cibw-test-requires: pytest pytest-cov pytest-benchmark pandas
      # gotcha 354: unpinned pandas resolves to a newer PyPI release with no
      # riscv64 wheel, source-building for ~1h and hitting the job timeout.
      cibw-test-environment: PIP_PREFER_BINARY=1
      # The repo-root pygeohash/ would otherwise shadow the installed wheel's
      # compiled extension; examples/ is needed too, since test_examples.py
      # imports it directly.
      cibw-test-sources: tests examples pyproject.toml
      cibw-test-command: >-
        python -c "import pygeohash.cgeohash.geohash_module as m; assert m.__file__.endswith('.so'), m.__file__" &&
        pytest tests
      timeout-minutes: 60

  publish:
    name: Publish pygeohash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pygeohash-${{ matrix.version }}-*-manylinux_riscv64
