---
# Based on upstream's wheel builder:
#   https://github.com/python-rapidjson/python-rapidjson/blob/master/.github/workflows/main.yml
name: Build python-rapidjson wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-rapidjson.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-rapidjson.yml'
      - 'docs/packages/python-rapidjson.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-rapidjson.yml'
      - 'docs/packages/python-rapidjson.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-rapidjson
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-rapidjson ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The extension compiles the bundled RapidJSON headers in, but the wheel ships
    # only python-rapidjson's own licence; setuptools globs LICEN[CS]E* at the root.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "python_rapidjson"
      version: "${{ matrix.version }}"
      repository: "python-rapidjson/python-rapidjson"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      pre-build: "cp rapidjson/license.txt LICENSE.rapidjson"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pytest pytest-benchmark pytz"
      cibw-test-command: >
        python -c "import importlib.metadata as md; got = sorted(p.name for p in md.files('python-rapidjson') if '.dist-info/licenses/' in str(p) and p.name); assert got == ['LICENSE', 'LICENSE.rapidjson'], got"
        && pytest {project}/tests

  publish:
    name: Publish python-rapidjson ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python_rapidjson-${{ matrix.version }}-*-manylinux_riscv64
