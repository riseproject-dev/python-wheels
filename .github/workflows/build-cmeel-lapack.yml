---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-lapack/blob/v3.12.1.c2/.github/workflows/release.yml
name: Build cmeel-lapack wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-lapack.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-lapack.yml'
      - 'docs/packages/cmeel-lapack.yaml'
      - 'patches/cmeel-lapack/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-lapack.yml'
      - 'docs/packages/cmeel-lapack.yaml'
      - 'patches/cmeel-lapack/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-lapack
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-lapack ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmeel-lapack"
      version: "${{ matrix.version }}"
      repository: "cmake-wheel/cmeel-lapack"
      ref: "v${{ matrix.version }}.c2"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 180
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply --directory=lapack python-wheels/patches/cmeel-lapack/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp312-manylinux_riscv64"
      cibw-environment-linux: "CMEEL_LOG_LEVEL=DEBUG"
      # Reference LAPACK/BLAS (netlib.org) is plain standards-conforming
      # Fortran/C with no architecture-specific code path anywhere in its
      # own CMakeLists.txt (confirmed against the real v3.12.1 source):
      # unlike OpenBLAS's per-arch optimized kernels, this needs no patch
      # for CMAKE_POLICY_VERSION_MINIMUM (its own floor is 3.13, already
      # above cmeel[build]'s CMake >= 4 floor of 3.5). It does need our
      # own patches/cmeel-lapack patch above, though: contrary to this
      # comment's own earlier claim, cmeel the build-backend has no RPATH
      # mechanism of its own (confirmed against its real source - its
      # only runtime-path handling is an LD_LIBRARY_PATH shim for
      # cmeel_run()-wrapped executables, not for raw .so files); without
      # our patch, liblapack.so can't find its own sibling libblas.so at
      # runtime once CMake's install step strips its build RPATH.
      cibw-repair-wheel-command: ''

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CMEEL_LAPACK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmeel-lapack-${{ env.CMEEL_LAPACK_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib/liblapack.so.3.12.0" in names, names
          assert "cmeel.prefix/lib/libblas.so.3.12.0" in names, names
          assert "cmeel.prefix/include/lapack.h" in names, names
          EOF

      - name: Smoke-test the built library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q wheelhouse/*.whl
          python3 -c "
          import ctypes, pathlib, sysconfig
          lib = pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix/lib/liblapack.so'
          handle = ctypes.CDLL(str(lib))
          handle.dgesv_
          print(lib)
          "

  publish:
    name: Publish cmeel-lapack ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-lapack-${{ matrix.version }}-py3-none-manylinux_riscv64
