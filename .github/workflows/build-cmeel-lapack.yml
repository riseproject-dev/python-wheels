---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-lapack/blob/v3.12.1.c2/.github/workflows/release.yml
name: Build cmeel-lapack wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-lapack.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-lapack.yml'
      - 'docs/packages/cmeel-lapack.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-lapack.yml'
      - 'docs/packages/cmeel-lapack.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-lapack
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-lapack ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      CMEEL_LAPACK_VERSION: ${{ matrix.version }}

    steps:
      # has-sitelib = false: the wheel holds no Python extension, so one
      # py3-none wheel covers every interpreter.
      - name: Checkout cmeel-lapack v${{ env.CMEEL_LAPACK_VERSION }}.c2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/cmeel-lapack
          ref: v${{ env.CMEEL_LAPACK_VERSION }}.c2
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: CMEEL_LOG_LEVEL=DEBUG
          # Reference LAPACK/BLAS (netlib.org) is plain standards-conforming
          # Fortran/C with no architecture-specific code path anywhere in its
          # own CMakeLists.txt (confirmed against the real v3.12.1 source):
          # unlike OpenBLAS's per-arch optimized kernels, this needs no patch
          # or CMAKE_POLICY_VERSION_MINIMUM override (its own floor is 3.13,
          # already above cmeel[build]'s CMake >= 4 floor of 3.5).
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets
          # itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib/liblapack.so.3.12.0" in names, names
          assert "cmeel.prefix/lib/libblas.so.3.12.0" in names, names
          assert "cmeel.prefix/include/lapack.h" in names, names
          EOF

      - name: Smoke-test the built library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q wheelhouse/*.whl
          python3 -c "
          import ctypes, pathlib, sysconfig
          lib = pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix/lib/liblapack.so'
          handle = ctypes.CDLL(str(lib))
          handle.dgesv_
          print(lib)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmeel-lapack-${{ env.CMEEL_LAPACK_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cmeel-lapack ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-lapack-${{ matrix.version }}-py3-none-manylinux_riscv64
