---
# This workflow is based on: https://github.com/kratsg/pylibmagic/blob/v0.5.0/.cirrus.yml
name: Build pylibmagic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylibmagic.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibmagic.yml'
      - 'docs/packages/pylibmagic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibmagic.yml'
      - 'docs/packages/pylibmagic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylibmagic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pylibmagic ${{ matrix.version }} cp312-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]

    # CMakeLists.txt fetches and bundles libmagic (file) at build time but the wheel ships
    # only pylibmagic's LICENSE; scikit-build-core's default glob picks this up (gotcha 53).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pylibmagic"
      version: "${{ matrix.version }}"
      repository: "kratsg/pylibmagic"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp312-${{ matrix.libc }}_riscv64"
      checkout-fetch-depth: 0
      pre-build: |-
        tag=$(sed -n 's/^ *GIT_TAG *//p' CMakeLists.txt)
        curl -fsSL --retry 5 -o LICENSE.libmagic "https://raw.githubusercontent.com/file/file/${tag}/COPYING"
      cibw-build: "cp312-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: >
        pytest tests &&
        python -c "import importlib.metadata as md;
        licenses = {str(f) for f in md.files('pylibmagic') if '.dist-info/licenses/' in str(f)};
        assert any(l.endswith('/LICENSE') for l in licenses), licenses;
        assert any(l.endswith('/LICENSE.libmagic') for l in licenses), licenses"

  publish:
    name: Publish pylibmagic ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pylibmagic-${{ matrix.version }}-*riscv64
