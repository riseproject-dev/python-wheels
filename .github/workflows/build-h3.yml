---
# This workflow is based on: https://github.com/uber/h3-py/blob/v4.5.0/.github/workflows/wheels.yml
name: Build h3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/h3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-h3.yml'
      - 'docs/packages/h3.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-h3.yml'
      - 'docs/packages/h3.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: h3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build h3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The H3 C library is a submodule and is compiled into the extensions.
    # Apache-2.0 4(d): the vendored H3 C library ships a NOTICE that h3-py carries
    # nowhere, so no published wheel has it. At the project root it is picked up by
    # scikit-build-core's default licence glob with no packaging change.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "h3"
      version: "${{ matrix.version }}"
      repository: "uber/h3-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: "cp src/h3lib/NOTICE NOTICE"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream uses `build[uv]`, which crashes cibuildwheel's audit step on the
      # self-hosted riscv64 runner (no host `uv`).
      cibw-build-frontend: "build"
      cibw-test-requires: "pytest pytest-cov numpy"
      cibw-test-command: >
        python -c "import importlib.metadata as m; f = {p.name for p in m.files('h3') if '.dist-info/licenses/' in str(p)}; assert f == {'LICENSE', 'NOTICE'}, f"
        && pytest {project}/tests
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  publish:
    name: Publish h3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: h3-${{ matrix.version }}-*-manylinux_riscv64
