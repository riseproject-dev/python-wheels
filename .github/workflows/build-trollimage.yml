---
# Based on: https://github.com/pytroll/trollimage/blob/v1.29.0/.github/workflows/deploy.yaml
name: Build trollimage wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/trollimage.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-trollimage.yml'
      - 'docs/packages/trollimage.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-trollimage.yml'
      - 'docs/packages/trollimage.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: trollimage
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build trollimage ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "trollimage"
      version: "${{ matrix.version }}"
      repository: "pytroll/trollimage"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pillow,pandas,pyproj,rasterio,pyresample,pykdtree,shapely"
      # xarray hard-depends on pandas, which has no cp314t riscv64 wheel yet, so
      # that leg runs upstream's own version/extension-import check only.
      cibw-test-requires: "${{ matrix.python != 'cp314t' && 'pytest pyresample pyproj rasterio xarray dask[array]' || '' }}"
      # test_save/test_save_jpeg (TestRegularImage) assert that writing into a
      # chmod(0o444) tempdir raises IOError; the manylinux container runs the
      # test phase as root, which ignores that permission bit on every arch.
      cibw-test-command: "python -c \"import trollimage; assert 'unknown' not in trollimage.__version__, 'incorrect version found'; from trollimage import _colorspaces\" ${{ matrix.python != 'cp314t' && '&& python -m pytest -v --pyargs trollimage.tests -k \"not (TestRegularImage and test_save)\"' || '' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      TROLLIMAGE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: trollimage-${{ env.TROLLIMAGE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"trollimage/_colorspaces"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt", "LICENSE_RIO_COLOR.txt"}, licences
          EOF

  publish:
    name: Publish trollimage ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: trollimage-${{ matrix.version }}-*-manylinux_riscv64
