---
# Based on: https://github.com/pytroll/trollimage/blob/v1.29.0/.github/workflows/deploy.yaml
name: Build trollimage wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/trollimage.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-trollimage.yml'
      - 'docs/packages/trollimage.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-trollimage.yml'
      - 'docs/packages/trollimage.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: trollimage
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build trollimage ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      TROLLIMAGE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout trollimage v${{ env.TROLLIMAGE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytroll/trollimage
          ref: v${{ env.TROLLIMAGE_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pillow,pandas,pyproj,rasterio,pyresample,pykdtree,shapely
          # xarray hard-depends on pandas, which has no cp314t riscv64 wheel yet, so
          # that leg runs upstream's own version/extension-import check only.
          CIBW_TEST_REQUIRES: >-
            ${{ matrix.python != 'cp314t' && 'pytest pyresample pyproj rasterio xarray dask[array]' || '' }}
          # test_save/test_save_jpeg (TestRegularImage) assert that writing into a
          # chmod(0o444) tempdir raises IOError; the manylinux container runs the
          # test phase as root, which ignores that permission bit on every arch.
          CIBW_TEST_COMMAND: >-
            python -c "import trollimage; assert 'unknown' not in trollimage.__version__, 'incorrect version found'; from trollimage import _colorspaces"
            ${{ matrix.python != 'cp314t' && '&& python -m pytest -v --pyargs trollimage.tests -k "not (TestRegularImage and test_save)"' || '' }}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"trollimage/_colorspaces"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt", "LICENSE_RIO_COLOR.txt"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trollimage-${{ env.TROLLIMAGE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish trollimage ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: trollimage-${{ matrix.version }}-*-manylinux_riscv64
