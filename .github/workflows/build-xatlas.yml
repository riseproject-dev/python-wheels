---
# This workflow is based on the `build_wheels` job of
# https://github.com/mworchel/xatlas-python/blob/v0.0.11/.github/workflows/wheels.yml
name: Build xatlas wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'xatlas version to build (git tag without the leading v, e.g. 0.0.11)'
        required: true
        default: '0.0.11'
  pull_request:
    paths:
      - '.github/workflows/build-xatlas.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.0.11' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.0.11 there.
  XATLAS_VERSION: ${{ inputs.version || '0.0.11' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build xatlas ${{ inputs.version || '0.0.11' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # numpy and scipy (test-only deps) have no musllinux riscv64 wheel on
        # our registry; manylinux only.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout xatlas-python v${{ env.XATLAS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mworchel/xatlas-python
          ref: v${{ env.XATLAS_VERSION }}
          submodules: true
          persist-credentials: false

      # extern/xatlas (jpcy/xatlas) and extern/pybind11 are compiled into the
      # wheel, but upstream's own wheel ships only its own LICENSE. Stage
      # theirs at the root for scikit-build-core's default
      # wheel.license-files glob to pick up.
      - name: Stage the vendored dependencies' licences
        run: |
          cp extern/xatlas/LICENSE LICENSE.xatlas
          cp extern/pybind11/LICENSE LICENSE.pybind11

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy and scipy have no riscv64 wheels on public PyPI; keep pip
          # on our registry's copies for the test extras.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.xatlas", "LICENSE.pybind11"}, (path, licences)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xatlas-${{ env.XATLAS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish xatlas ${{ inputs.version || '0.0.11' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: xatlas-${{ inputs.version || '0.0.11' }}-*-manylinux_riscv64
