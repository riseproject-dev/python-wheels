---
# This workflow is based on the `build_wheels` job of
# https://github.com/mworchel/xatlas-python/blob/v0.0.11/.github/workflows/wheels.yml
name: Build xatlas wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xatlas.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xatlas.yml'
      - 'docs/packages/xatlas.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xatlas.yml'
      - 'docs/packages/xatlas.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xatlas
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xatlas ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # numpy and scipy (test-only deps) have no musllinux riscv64 wheel on
        # our registry; manylinux only.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      XATLAS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout xatlas-python v${{ env.XATLAS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mworchel/xatlas-python
          ref: v${{ env.XATLAS_VERSION }}
          submodules: true
          persist-credentials: false

      # extern/xatlas (jpcy/xatlas) and extern/pybind11 are compiled into the
      # wheel, but upstream's own wheel ships only its own LICENSE. Stage
      # theirs at the root for scikit-build-core's default
      # wheel.license-files glob to pick up.
      - name: Stage the vendored dependencies' licences
        run: |
          cp extern/xatlas/LICENSE LICENSE.xatlas
          cp extern/pybind11/LICENSE LICENSE.pybind11

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy and scipy have no riscv64 wheels on public PyPI; keep pip
          # on our registry's copies for the test extras.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.xatlas", "LICENSE.pybind11"}, (path, licences)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xatlas-${{ env.XATLAS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish xatlas ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: xatlas-${{ matrix.version }}-*-manylinux_riscv64
