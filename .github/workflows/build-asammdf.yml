---
# This workflow is based on: https://github.com/danielhrisca/asammdf/blob/8.8.25/.github/workflows/wheels.yml
name: Build asammdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asammdf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asammdf.yml'
      - 'docs/packages/asammdf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asammdf.yml'
      - 'docs/packages/asammdf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asammdf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build asammdf ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: asammdf
      version: ${{ matrix.version }}
      # libdeflate/lz4/zstd are vendored as git submodules and compiled in statically.
      repository: danielhrisca/asammdf
      ref: ${{ matrix.version }}
      artifact-tag: cp310-abi3-manylinux_riscv64
      checkout-submodules: recursive
      # pyproject sets wheel.py-api = "cp310": one build is loadable on every
      # 3.10+ interpreter. Building at our floor cp312 and listing cp313/cp314
      # lets cibuildwheel compile once and reuse+test that wheel on each
      # (find_compatible_wheel); cp314t/cp315 are skipped upstream too.
      cibw-build: "cp312-* cp313-* cp314-*"
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      # Mirrors upstream's own wheels.yml, which excludes the Qt-based GUI
      # suite (PySide6 has no riscv64 wheel anywhere).
      cibw-test-command: pytest {project}/test --ignore={project}/test/asammdf/gui
      timeout-minutes: 60

  publish:
    name: Publish asammdf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: asammdf-${{ matrix.version }}-*-manylinux_riscv64
