---
# This workflow is based on the `build-wheels` + `test-wheels` jobs of
# https://github.com/firecrawl/anydoc/blob/v0.2.4/.github/workflows/release.yml
name: Build firecrawl-anydoc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'firecrawl-anydoc version/tag to build (e.g. 0.2.4)'
        required: true
        default: '0.2.4'
  pull_request:
    paths:
      - '.github/workflows/build-firecrawl-anydoc.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.2.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.2.4 there.
  FIRECRAWL_ANYDOC_VERSION: ${{ inputs.version || '0.2.4' }}

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheel:
    needs: [setup]
    name: Build firecrawl-anydoc ${{ inputs.version || '0.2.4' }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Checkout anydoc v${{ env.FIRECRAWL_ANYDOC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: firecrawl/anydoc
          ref: v${{ env.FIRECRAWL_ANYDOC_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --manifest-path python/Cargo.toml --out dist
          manylinux: '2_39'

      - name: Verify the wheel ships the compiled extension
        run: |
          set -euo pipefail
          python3 - dist/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert any(n.startswith("anydoc/_anydoc") for n in sos), sos
          print(sys.argv[1], "->", sos)
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install dist/*.whl

      # Must run from the repo root: with python/ as cwd, the source anydoc/
      # package dir would shadow the installed compiled module (upstream's
      # own ci.yml python job carries the same note).
      - name: Run python/tests
        run: python -m unittest discover -s python/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firecrawl_anydoc-${{ env.FIRECRAWL_ANYDOC_VERSION }}-cp310-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish firecrawl-anydoc ${{ inputs.version || '0.2.4' }}
    needs: [setup, build_wheel]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: firecrawl_anydoc-${{ inputs.version || '0.2.4' }}-*-manylinux_riscv64
