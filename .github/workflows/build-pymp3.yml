---
# Based on upstream's wheel builder:
#   https://github.com/miarec/pymp3/blob/master/.github/workflows/test_and_build.yml
name: Build pymp3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymp3.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymp3.yml'
      - 'docs/packages/pymp3.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymp3.yml'
      - 'docs/packages/pymp3.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymp3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymp3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYMP3_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pymp3 v${{ env.PYMP3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: miarec/pymp3
          ref: v${{ env.PYMP3_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # CMakeLists.txt FetchContents libmad and libmp3lame from miarec's own
          # forks at their unpinned "master" branch (same as upstream's own build);
          # neither licence ships at the project root, so pull it from the same ref
          # CMake fetches and stage it where setuptools' default LICEN[CS]E* glob
          # (gotcha 44) picks it up. pymp3 derives its version with
          # setuptools-git-versioning, whose dirty check is `git status --short` —
          # unlike setuptools_scm's `git describe --dirty`, that also flags untracked
          # files, so staging the two LICENSE files straight into {project} poisons the
          # version into `0.2.0.post0+git.<sha>.dirty` with nothing ever `git add`ed or
          # committed. Exclude them via `.git/info/exclude` before copying so they stay
          # invisible to `git status` while still landing on disk for the wheel
          # (gotcha 683).
          CIBW_BEFORE_ALL_LINUX: >-
            pip install cmake &&
            mkdir -p /tmp/libmad /tmp/lame &&
            curl -sSLf https://github.com/miarec/libmad/archive/refs/heads/master.tar.gz
            | tar -xz -C /tmp/libmad --strip-components=1 &&
            curl -sSLf https://github.com/miarec/lame/archive/refs/heads/master.tar.gz
            | tar -xz -C /tmp/lame --strip-components=1 &&
            printf '%s\n' LICENSE.libmad LICENSE.lame >> {project}/.git/info/exclude &&
            cp /tmp/libmad/COPYING {project}/LICENSE.libmad &&
            cp /tmp/lame/COPYING {project}/LICENSE.lame
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            MAKEFLAGS=-j$(nproc)
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python3 -c "import mp3; assert mp3.__file__.endswith('.so'), mp3.__file__" &&
            PYTHONPATH={project}/tests pytest {project}/tests

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("mp3.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith("licenses/LICENSE") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.libmad") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.lame") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymp3-${{ env.PYMP3_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pymp3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pymp3-${{ matrix.version }}-*-manylinux_riscv64
