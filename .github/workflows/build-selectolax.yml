---
# This workflow is based on the `build_wheels` job of
# https://github.com/rushter/selectolax/blob/v0.4.11/.github/workflows/make_release.yml
name: Build selectolax wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/selectolax.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-selectolax.yml'
      - 'docs/packages/selectolax.yaml'
      - 'patches/selectolax/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-selectolax.yml'
      - 'docs/packages/selectolax.yaml'
      - 'patches/selectolax/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: selectolax
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build selectolax ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "selectolax"
      version: "${{ matrix.version }}"
      repository: "rushter/selectolax"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "true"

      # Vendored modest (LGPL-2.1) and lexbor (Apache-2.0) compile straight into
      # the extensions; upstream's wheel ships only its own LICENSE (gotcha 44).
      patches: true

      # musllinux is dropped: all 4 interpreters segfault (SIGSEGV, exit 139) in
      # tests/test_encoding.py::test_http_equiv_content_type_is_honored, a plain charset-
      # detection test with no recursion, while the identical manylinux legs pass. 0.4.11-
      # 0.4.13 published musllinux wheels fine, so this is a 1.0.0 regression, most likely
      # in the lexbor bump this release carries; upstream's own release workflow never runs
      # the test suite against its musllinux wheels, so a musl-only memory bug like this
      # would ship there unnoticed. Revisit on a future selectolax release.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests -v"

  publish:
    name: Publish selectolax ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: selectolax-${{ matrix.version }}-*-manylinux_riscv64
