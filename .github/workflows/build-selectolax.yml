---
# This workflow is based on the `build_wheels` job of
# https://github.com/rushter/selectolax/blob/v0.4.11/.github/workflows/make_release.yml
name: Build selectolax wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'selectolax version to build (git tag without leading v, e.g. 0.4.11)'
        required: true
        default: '0.4.11'
  pull_request:
    paths:
      - '.github/workflows/build-selectolax.yml'
      - 'patches/selectolax/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.11' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.4.11 there.
  SELECTOLAX_VERSION: ${{ inputs.version || '0.4.11' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build selectolax ${{ inputs.version || '0.4.11' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout selectolax v${{ env.SELECTOLAX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rushter/selectolax
          ref: v${{ env.SELECTOLAX_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Vendored modest (LGPL-2.1) and lexbor (Apache-2.0) compile straight into
      # the extensions; upstream's wheel ships only its own LICENSE (gotcha 44).
      - name: Patch selectolax source
        run: git apply python-wheels/patches/selectolax/${{ env.SELECTOLAX_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: selectolax-${{ env.SELECTOLAX_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish selectolax ${{ inputs.version || '0.4.11' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: selectolax-${{ inputs.version || '0.4.11' }}-*riscv64
