---
# Based on upstream's own wheel builder:
#   https://github.com/rapidfuzz/CyDifflib/blob/v1.2.0/.github/workflows/build.yml
name: Build cydifflib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cydifflib version to build (git tag without leading v, e.g. 1.2.0)'
        required: true
        default: '1.2.0'
  pull_request:
    paths:
      - '.github/workflows/build-cydifflib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.2.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CYDIFFLIB_VERSION: ${{ inputs.version || '1.2.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_sdist:
    needs: [setup]
    name: Build cydifflib ${{ inputs.version || '1.2.0' }} sdist
    runs-on: ubuntu-latest
    outputs:
      sdist_name: ${{ steps.sdist.outputs.sdist_name }}
      package_version: ${{ steps.sdist.outputs.package_version }}
    steps:
      - name: Checkout CyDifflib v${{ env.CYDIFFLIB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rapidfuzz/CyDifflib
          ref: v${{ env.CYDIFFLIB_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          uv pip install "Cython>=3.1.6,<3.3.0" build twine
          chmod +x ./src/cydifflib/generate.sh
          ./src/cydifflib/generate.sh
          git apply ./tools/sdist.patch
          python -m build --sdist
          twine check dist/*
          sdists=(dist/*.tar.gz)
          sdist_name="$(basename "${sdists[0]}")"
          echo "sdist_name=${sdist_name}" >> "$GITHUB_OUTPUT"
          echo "package_version=$(echo "${sdist_name}" | sed -En 's/cydifflib-(.+)\.tar\.gz/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cydifflib-${{ env.CYDIFFLIB_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    name: Build cydifflib ${{ inputs.version || '1.2.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cydifflib-${{ env.CYDIFFLIB_VERSION }}-sdist
          path: dist/

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          # Upstream feeds cibuildwheel the sdist tarball too: it bundles the
          # cythonised .cxx, so the wheel build needs no Cython.
          package-dir: dist/${{ needs.build_sdist.outputs.sdist_name }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Matches upstream's own build.yml CIBW_TEST_REQUIRES/CIBW_TEST_COMMAND;
          # cydifflib carries no [tool.cibuildwheel] table of its own.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cydifflib-${{ needs.build_sdist.outputs.package_version }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cydifflib ${{ inputs.version || '1.2.0' }}
    needs: [setup, build_sdist, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cydifflib-${{ needs.build_sdist.outputs.package_version }}-*-manylinux_riscv64
