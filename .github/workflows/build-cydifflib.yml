---
# Based on upstream's own wheel builder:
#   https://github.com/rapidfuzz/CyDifflib/blob/v1.2.0/.github/workflows/build.yml
name: Build cydifflib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cydifflib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cydifflib.yml'
      - 'docs/packages/cydifflib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cydifflib.yml'
      - 'docs/packages/cydifflib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cydifflib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cydifflib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream feeds cibuildwheel the sdist tarball too: it bundles the
    # cythonised .cxx, so the wheel build needs no Cython.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cydifflib
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Matches upstream's own build.yml CIBW_TEST_REQUIRES/CIBW_TEST_COMMAND;
      # cydifflib carries no [tool.cibuildwheel] table of its own.
      cibw-test-requires: pytest
      cibw-test-command: pytest {package}/tests

  publish:
    name: Publish cydifflib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cydifflib-${{ matrix.version }}-*-manylinux_riscv64
