---
# Based on upstream's own wheel builder:
#   https://github.com/reflex-dev/fast-walk/blob/v0.2.2/.github/workflows/CI.yml
name: Build fast-walk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fast-walk version to build (git tag without leading v, e.g. 0.2.2)'
        required: true
        default: '0.2.2'
  pull_request:
    paths:
      - '.github/workflows/build-fast-walk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.2.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.2.2 there.
  FAST_WALK_VERSION: ${{ inputs.version || '0.2.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fast-walk ${{ inputs.version || '0.2.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags). requires-python
        # is >=3.13, so no cp312 or older; pyo3 0.29.2 already has published
        # working cp314/cp314t/cp315/cp315t wheels upstream, so none of them
        # are dropped for gotcha 322/326-style pyo3 ceiling/segfault reasons.
        python: ["cp313", "cp314", "cp314t", "cp315", "cp315t"]

    steps:
      - name: Checkout fast-walk v${{ env.FAST_WALK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: reflex-dev/fast-walk
          ref: v${{ env.FAST_WALK_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # fast-walk ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import fast_walk.fast_walk as ext; assert ext.__file__.endswith('.so'), ext.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fast-walk-${{ env.FAST_WALK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fast-walk ${{ inputs.version || '0.2.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fast-walk-${{ inputs.version || '0.2.2' }}-*-manylinux_riscv64
