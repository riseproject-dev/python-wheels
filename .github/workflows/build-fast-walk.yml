---
# Based on upstream's own wheel builder:
#   https://github.com/reflex-dev/fast-walk/blob/v0.2.2/.github/workflows/CI.yml
name: Build fast-walk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fast-walk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-walk.yml'
      - 'docs/packages/fast-walk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-walk.yml'
      - 'docs/packages/fast-walk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fast-walk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fast-walk ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fast-walk"
      version: "${{ matrix.version }}"
      repository: "reflex-dev/fast-walk"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # fast-walk ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # CPython 3.13 caps AST construction at a fixed C recursion limit of
      # 10000 (on every arch), so ast.parse() of these 20000-deep chains
      # raises RecursionError before fast-walk runs; 3.14+ checks real stack.
      cibw-test-command: >
        python -c "import fast_walk.fast_walk as ext; assert ext.__file__.endswith('.so'), ext.__file__" &&
        python -m pytest -v tests
        ${{ matrix.python == 'cp313' && '--deselect tests/test_fields.py::test_fix_missing_locations_on_a_deep_chain --deselect tests/test_frontier.py::test_a_deep_chain_does_not_recurse' || '' }}

  publish:
    name: Publish fast-walk ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fast-walk-${{ matrix.version }}-*-manylinux_riscv64
