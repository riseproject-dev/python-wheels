---
# This workflow is based on the `linux` job of
# https://github.com/ontology-tools/py-horned-owl/blob/v2.0.0/.github/workflows/CI.yaml
name: Build py-horned-owl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/py-horned-owl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-py-horned-owl.yml'
      - 'docs/packages/py-horned-owl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-py-horned-owl.yml'
      - 'docs/packages/py-horned-owl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: py-horned-owl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build py-horned-owl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "py-horned-owl"
      version: "${{ matrix.version }}"
      repository: "ontology-tools/py-horned-owl"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # py-horned-owl ships no [tool.cibuildwheel]; the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      # The suite sits in a sibling test/ (not inside the pyhornedowl/ package), but
      # running it straight from the checkout still shadows the wheel: `python -m`
      # prepends the checkout root (which holds the uncompiled pyhornedowl/ source)
      # to sys.path regardless (gotcha 218). test-sources stages only test/ into an
      # empty cwd so the import can only resolve to the installed wheel.
      cibw-test-sources: "test"
      cibw-test-command: >
        python -c "import pyhornedowl.pyhornedowl as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest test/

  publish:
    name: Publish py-horned-owl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: py-horned-owl-${{ matrix.version }}-*-manylinux_riscv64
