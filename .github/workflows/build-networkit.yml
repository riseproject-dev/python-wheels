---
# This workflow is based on the Linux job of
# https://github.com/networkit/networkit/blob/11.2.1/.github/workflows/build_wheels.yml
name: Build networkit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/networkit.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-networkit.yml'
      - 'docs/packages/networkit.yaml'
      - 'patches/networkit/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-networkit.yml'
      - 'docs/packages/networkit.yaml'
      - 'patches/networkit/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: networkit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build networkit ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches the ABIs upstream actually released for 11.2.1 on PyPI (no cp314 yet).
        python: ["cp310", "cp311", "cp312", "cp313"]

    env:
      NETWORKIT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout networkit v${{ env.NETWORKIT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: networkit/networkit
          ref: ${{ env.NETWORKIT_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # build-system.requires leaves Cython unbounded, and Cython 3.3.0 (released
          # after 11.2.1) emits the vector->list converters for structures.node,
          # double and vector[node] twice into distance.cpp ("redefinition of
          # __pyx_convert_vector_to_py_..."). 3.2.x emits each once. The image's
          # pip >= 26 only honours PIP_BUILD_CONSTRAINT in the isolated build env.
          CIBW_BEFORE_ALL: echo 'Cython<3.3.0' > /cython-constraint.txt
          CIBW_ENVIRONMENT: >-
            PIP_CONSTRAINT=/cython-constraint.txt
            PIP_BUILD_CONSTRAINT=/cython-constraint.txt
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_COMMAND: python3 -c 'import networkit'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: networkit-${{ env.NETWORKIT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (gcc) for networkit ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      NETWORKIT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # networkit links OpenMP, so auditwheel vendors the image's libgomp.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: networkit-${{ env.NETWORKIT_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish networkit ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: networkit-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: networkit-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
