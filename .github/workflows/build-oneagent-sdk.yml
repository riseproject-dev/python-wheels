---
name: Build oneagent-sdk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/oneagent-sdk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-oneagent-sdk.yml'
      - 'docs/packages/oneagent-sdk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oneagent-sdk.yml'
      - 'docs/packages/oneagent-sdk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: oneagent-sdk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build oneagent-sdk ${{ matrix.version }} py2.py3-none-linux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "oneagent-sdk"
      version: "${{ matrix.version }}"
      repository: "Dynatrace/OneAgent-SDK-for-Python"
      ref: ''
      artifact-tag: "py2.py3-none-linux_riscv64"
      pre-build: |-
        base="${ONEAGENT_SDK_VERSION%.*.*}"
        timestamp="${ONEAGENT_SDK_VERSION#"$base".}"
        ref="v$base"
        BUILD_TIMESTAMP="${timestamp/./-}"
        export BUILD_TIMESTAMP
        printf '%s\n' "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD
      # setup.py forces a universal (py2.py3) tag, so one build serves
      # every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # DT_PYSDK_CSDK_PATH is intentionally left unset: it would point at
      # Dynatrace's closed-source OneAgent SDK for C/C++, which has no
      # riscv64 build. setup.py degrades gracefully without it, shipping
      # a wheel with no native library; oneagent.initialize() then
      # returns STATUS_STUB_LOAD_ERROR instead of crashing (its own
      # documented no-op mode).
      cibw-environment-linux: "BUILD_TIMESTAMP=$(python -c \"v='${{ matrix.version }}'; b='.'.join(v.split('.')[:-2]); print(v[len(b)+1:].replace('.', '-'))\")"
      # There is no compiled extension to repair (no .so is bundled);
      # auditwheel refuses a wheel with no ELF content at all.
      cibw-repair-wheel-command: ''
      cibw-test-requires: "pytest mock"
      cibw-test-command: "python -c \"import oneagent; r = oneagent.initialize(); assert r.status == r.STATUS_STUB_LOAD_ERROR, r.status; oneagent.shutdown()\" && PYTHONPATH={project}/test-util-src:{project}/samples/basic-sdk-sample python -m pytest {project}/test -p testconfig -m \"not dependsnative\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      ONEAGENT_SDK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oneagent-sdk-${{ env.ONEAGENT_SDK_VERSION }}-py2.py3-none-linux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          assert not any(n.endswith(".so") for n in names), names
          assert "oneagent/_impl/native/sdknulliface.py" in names, names
          EOF

  publish:
    name: Publish oneagent-sdk ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: oneagent-sdk-${{ matrix.version }}-*-linux_riscv64
