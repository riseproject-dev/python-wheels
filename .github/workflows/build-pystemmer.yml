---
# This workflow is based on the `build` job of
# https://github.com/snowballstem/pystemmer/blob/v3.1.0/.github/workflows/ci.yml
name: Build pystemmer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pystemmer.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pystemmer.yml'
      - 'docs/packages/pystemmer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pystemmer.yml'
      - 'docs/packages/pystemmer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pystemmer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pystemmer ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYSTEMMER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pystemmer v${{ env.PYSTEMMER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: snowballstem/pystemmer
          ref: v${{ env.PYSTEMMER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No pyproject.toml, so the build env has neither Cython (needed to
          # compile src/Stemmer.pyx) nor setuptools (cp312+ images don't bundle it).
          CIBW_BEFORE_BUILD: pip install Cython setuptools
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_TEST_REQUIRES: pytest
          # runtests.py's docs/quickstart.txt doctest is stale for libstemmer_c 3.1.0's
          # added algorithms (arabic added czech/persian/polish/sesotho); fixed upstream
          # on main post-v3.1.0 but not yet released, and never caught by upstream's own
          # CI (its `\`-continued run: block never actually invokes runtests.py/nosetests).
          CIBW_TEST_COMMAND: >-
            python -c "import Stemmer; assert Stemmer.__file__.endswith('.so'), Stemmer.__file__"
            && python -m pytest {project}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pystemmer-${{ env.PYSTEMMER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pystemmer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pystemmer-${{ matrix.version }}-*-manylinux_riscv64
