---
# This workflow is based on the `build` job of
# https://github.com/snowballstem/pystemmer/blob/v3.1.0/.github/workflows/ci.yml
name: Build pystemmer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pystemmer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pystemmer.yml'
      - 'docs/packages/pystemmer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pystemmer.yml'
      - 'docs/packages/pystemmer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pystemmer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pystemmer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pystemmer
      version: ${{ matrix.version }}
      repository: snowballstem/pystemmer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # No pyproject.toml, so the build env has neither Cython (needed to
      # compile src/Stemmer.pyx) nor setuptools (cp312+ images don't bundle it).
      cibw-before-build: pip install Cython setuptools
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: pytest
      # runtests.py's docs/quickstart.txt doctest is stale for libstemmer_c 3.1.0's
      # added algorithms (arabic added czech/persian/polish/sesotho); fixed upstream
      # on main post-v3.1.0 but not yet released, and never caught by upstream's own
      # CI (its `\`-continued run: block never actually invokes runtests.py/nosetests).
      cibw-test-command: >-
        python -c "import Stemmer; assert Stemmer.__file__.endswith('.so'), Stemmer.__file__"
        && python -m pytest {project}/tests -v

  publish:
    name: Publish pystemmer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pystemmer-${{ matrix.version }}-*-manylinux_riscv64
