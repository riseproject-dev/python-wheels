---
# This workflow is based on: https://github.com/onnxsim/onnxsim/blob/v0.7.3/.github/workflows/build-and-test.yml
name: Build onnxsim wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/onnxsim.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxsim.yml'
      - 'docs/packages/onnxsim.yaml'
      - 'patches/onnxsim/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxsim.yml'
      - 'docs/packages/onnxsim.yaml'
      - 'patches/onnxsim/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: onnxsim
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build onnxsim ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships cp310/cp311/cp312-abi3 (no free-threaded wheel here).
        # cp310 is dropped: onnx (the runtime dependency) has no riscv64 wheel
        # for it on our registry, at any version, and no py3-none-any fallback
        # either (it's a compiled extension). cp311 stays: onnx ships a
        # riscv64 cp311 wheel, and nanobind/protobuf (the other build-time
        # dependencies) resolve too, via their py3-none-any fallback wheels.
        # `python` is a real matrix dimension (not folded into `include`
        # alone) so both entries actually produce a job: an `include` list
        # whose entries share no key with the base matrix collapses onto a
        # single combination instead of adding one job per entry.
        python: [cp311, cp312]
        # pytest_k also drops four tests that cannot pass here, all outside what
        # upstream's own wheel legs run:
        # - test_symbolic_batch_dim_is_analysed_at_batch_one imports torch without
        #   the needs_torch guard its neighbours have (ModuleNotFoundError);
        # - test_workaround_fixes_default_optimization_for_plain_matmul asserts that
        #   onnxruntime still has the MatMulNBits bug the workaround targets, and
        #   the onnxruntime on our registry is newer than that;
        # - the two test_qat tests compare against a golden loss value and a golden
        #   model hash recorded on x86_64 (6.47 expected, 5.83 here).
        include:
          - python: cp311
            # No riscv64 onnxruntime wheel on cp311; the rest of the suite still
            # runs (onnxsim falls back to onnx's reference evaluator).
            onnxruntime: ''
            # onnx's reference BatchNormalization_9 (opset 9-13) always takes its
            # momentum branch (the attribute defaults to 0.9, never None) and mixes
            # batch statistics into the inference output, so the equivalence check
            # rejects the correctly fused Conv; same failure on x86_64 without
            # onnxruntime. Upstream CI always installs onnxruntime.
            pytest_k: >-
              not test_fuse_conv_bn_into_conv and not test_fuse_convtranspose_bn
              and not test_symbolic_batch_dim_is_analysed_at_batch_one
              and not test_workaround_fixes_default_optimization_for_plain_matmul
              and not test_the_full_batch_default_is_the_graph_it_always_was
              and not test_activation_quantization_off_leaves_the_weight_only_pass_untouched
          - python: cp312
            onnxruntime: onnxruntime
            pytest_k: >-
              not test_symbolic_batch_dim_is_analysed_at_batch_one
              and not test_workaround_fixes_default_optimization_for_plain_matmul
              and not test_the_full_batch_default_is_the_graph_it_always_was
              and not test_activation_quantization_off_leaves_the_weight_only_pass_untouched

    env:
      ONNXSIM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout onnxsim v${{ env.ONNXSIM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: onnxsim/onnxsim
          ref: v${{ env.ONNXSIM_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Only some versions need patching, so a missing directory is not an error.
      - name: Apply patches
        run: |
          patches="$PWD/python-wheels/patches/onnxsim/${ONNXSIM_VERSION}"
          if [ -d "$patches" ]; then git apply -v "$patches"/*.patch; fi

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          # The riscv64 manylinux image's own cmake (3.31.8) already satisfies
          # CMakeLists.txt's cmake_minimum_required(3.22); upstream's own
          # CIBW_BEFORE_BUILD only pip-installs cmake/ninja for its manylinux_2_28
          # x86_64/aarch64 images.
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py builds RelWithDebInfo so the sanitizer job gets symbols, and
          # upstream strips the DWARF again when repairing the wheel. Compiling and
          # linking that debug info is what keeps the extension build at about 5
          # hours here, so build Release (same -O level family and -DNDEBUG, no -g);
          # the last -DCMAKE_BUILD_TYPE on the command line wins.
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="
            -DONNX_USE_PROTOBUF_SHARED_LIBS=OFF
            -DProtobuf_USE_STATIC_LIBS=ON
            -DONNX_USE_LITE_PROTO=ON
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            -DCMAKE_BUILD_TYPE=Release
            "
            ONNXSIM_RELEASE=${{ env.ONNXSIM_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # nanobind builds the onnxsim_cpp2py_export extension (CMakeLists.txt's
          # ONNXSIM_PYTHON path); CMake locates it via `python -m nanobind
          # --cmake_dir`, so it must already be importable before configure runs
          # or CMake falls back to fetching it from GitHub. protobuf is needed
          # for the same reason as onnxoptimizer's build. Both ship a
          # py3-none-any wheel, so they install on any interpreter/arch.
          CIBW_BEFORE_BUILD_LINUX: pip install nanobind protobuf
          # Upstream's own suite additionally exercises onnxscript/torch/timm/
          # sympy/onnxslim/ultralytics/rfdetr paths; most guard the import with
          # pytest.importorskip, so they collect fine and just skip without
          # riscv64 wheels for those. onnxruntime does have a riscv64 wheel on
          # our registry, but only from cp312 (matrix.onnxruntime). These files
          # import torch/timm/onnxruntime unconditionally at module level
          # (no importorskip), which aborts collection outright rather than
          # skipping when the import fails - not just deselecting their tests,
          # so ignore the files themselves. 0.8.1 added six more torch-importing
          # files (test_gan, test_graph_grad_torch_autograd, test_pytorch_export_simple,
          # test_rknn3_compat, test_tflite_export_torchvision, test_torch_export_integration).
          # pytest<9.2: from 9.2 pytest.approx() rejects a numpy float32 tolerance
          # (test_calibration_streaming's abs=2 * step).
          CIBW_TEST_REQUIRES: pytest<9.2 pytest-xdist ${{ matrix.onnxruntime }}
          # Since 0.8.0 tests/ holds ~900 files, mostly the Axera/quantization/pruning
          # suites, and at the pace of a riscv64 runner they cannot finish inside the
          # 6 hour job limit (13% after 6 hours, every attempt). Upstream's own wheel
          # legs deselect those three markers (tests/conftest.py applies them from the
          # file names) and run them once in a dedicated job, as its build-and-test.yml
          # CIBW_TEST_COMMAND does; do the same. Older versions define no such markers,
          # so the expression selects everything for them.
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/
            -m "not axera and not quantization and not pruning"
            -k "${{ matrix.pytest_k }}"
            --ignore={project}/tests/test_python_api.py
            --ignore={project}/tests/test_simple.py
            --ignore={project}/tests/test_timm.py
            --ignore={project}/tests/test_rfdetr.py
            --ignore={project}/tests/test_yolo.py
            --ignore={project}/tests/test_gan.py
            --ignore={project}/tests/test_graph_grad_torch_autograd.py
            --ignore={project}/tests/test_pytorch_export_simple.py
            --ignore={project}/tests/test_rknn3_compat.py
            --ignore={project}/tests/test_tflite_export_torchvision.py
            --ignore={project}/tests/test_torch_export_integration.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: onnxsim-${{ env.ONNXSIM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish onnxsim ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: onnxsim-${{ matrix.version }}-*-manylinux_riscv64
