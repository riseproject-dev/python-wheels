---
# This workflow is based on the `publish-binaries`/`publish-sync-to-pypi` jobs of
# https://github.com/valkey-io/valkey-glide/blob/v2.5.2/.github/workflows/pypi-cd.yml
name: Build valkey-glide-sync wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/valkey-glide-sync.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-valkey-glide-sync.yml'
      - 'docs/packages/valkey-glide-sync.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-valkey-glide-sync.yml'
      - 'docs/packages/valkey-glide-sync.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: valkey-glide-sync
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build valkey-glide-sync ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # glide-shared's pyo3 dependency has a plain `features = ["extension-module"]`
        # (no abi3-pyNN), so every interpreter needs its own build; same floor as
        # the sibling build-valkey-glide.yml (async client, same monorepo/pyo3).
        python: ['cp312', 'cp313', 'cp314', 'cp314t']

    env:
      VALKEY_GLIDE_SYNC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout valkey-glide v${{ env.VALKEY_GLIDE_SYNC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: valkey-io/valkey-glide
          ref: v${{ env.VALKEY_GLIDE_SYNC_VERSION }}
          persist-credentials: false

      - name: Set the package version
        run: |
          sed -i "s/^dynamic = \[\"version\"\]/version = \"${VALKEY_GLIDE_SYNC_VERSION}\"/" python/glide-sync/pyproject.toml
          grep -qx "version = \"${VALKEY_GLIDE_SYNC_VERSION}\"" python/glide-sync/pyproject.toml

      # setup.py vendors glide-shared/glide_shared into glide-sync as a plain
      # file copy at build time; the protobuf/*.py it needs are gitignored and
      # only exist once generated (gotcha 201), so this runs on the host, once,
      # before cibuildwheel copies the checkout into any per-interpreter container.
      - name: Generate protobuf files
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            --workdir /workspace \
            "${{ env.MANYLINUX_RISCV64_IMAGE }}" \
            bash -c '
              set -euo pipefail
              yum install -y protobuf-compiler protobuf-devel
              PY=/opt/python/cp312-cp312/bin/python3
              "$PY" -m pip install --quiet mypy-protobuf
              MYPY_PLUGIN="$("$PY" -c "import sysconfig; print(sysconfig.get_path(\"scripts\"))")/protoc-gen-mypy"
              protoc \
                --plugin=protoc-gen-mypy="$MYPY_PLUGIN" \
                -Iprotobuf=glide-core/src/protobuf \
                --python_out=python/glide-shared/glide_shared \
                --mypy_out=python/glide-shared/glide_shared \
                glide-core/src/protobuf/*.proto
            '

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python/glide-sync
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # Upstream's own before-build (glide-sync/pyproject.toml) only knows how
          # to install protoc for x86_64/aarch64 and exits 1 on any other
          # architecture; protobuf codegen already happened on the host above, and
          # rustup is installed once for the whole container instead.
          CIBW_BEFORE_BUILD: ''
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            RELEASE_MODE="1"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Mirrors upstream's own "Smoke test wheels" step (pypi-cd.yml): a plain
          # import, not the full python.yml suite that needs a live Valkey server.
          CIBW_TEST_COMMAND: >-
            python -c "from glide_sync import GlideClient; print('Sync smoke test passed')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: valkey-glide-sync-${{ env.VALKEY_GLIDE_SYNC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish valkey-glide-sync ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: valkey-glide-sync-${{ matrix.version }}-*-manylinux_riscv64
