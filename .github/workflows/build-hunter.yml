---
# This workflow is based on the `test` job of
# https://github.com/ionelmc/python-hunter/blob/v3.9.0/.github/workflows/github-actions.yml
name: Build hunter wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hunter.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hunter.yml'
      - 'docs/packages/hunter.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hunter.yml'
      - 'docs/packages/hunter.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hunter
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hunter ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      HUNTER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout hunter v${{ env.HUNTER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ionelmc/python-hunter
          ref: v${{ env.HUNTER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_CONTAINER_ENGINE: "docker; create_args: --cap-add=SYS_PTRACE"
          # setuptools_scm cannot see the tag history in a shallow checkout.
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HUNTER=${{ env.HUNTER_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: >-
            pytest pytest-benchmark cython manhole process-tests
            setuptools>=80 setuptools_scm>=8 aspectlib six py tzdata ipdb
          # Upstream runs `tox --skip-pkg-install --direct-yolo -e py3XX-cython-nocov`; tox-direct
          # caps tox below 4, so run that env's own setenv and commands instead.
          CIBW_TEST_COMMAND: >-
            cd {project} &&
            python tests/setup.py clean --all &&
            python tests/setup.py build_ext --force --inplace &&
            PYTHONPATH={project}/tests PYTHONUNBUFFERED=yes PYTHONHUNTERCONFIG=
            pytest -vv --ignore=src

      - name: Check the C extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for mod in ("_event", "_predicates", "_tracer"):
                  assert any(n.startswith(f"hunter/{mod}.") and n.endswith(".so") for n in names), (whl, mod)
              assert "hunter.pth" in names, whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hunter-${{ env.HUNTER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish hunter ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hunter-${{ matrix.version }}-*_riscv64
