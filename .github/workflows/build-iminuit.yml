---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/scikit-hep/iminuit/blob/v2.32.0/.github/workflows/release.yml
name: Build iminuit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iminuit.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iminuit.yml'
      - 'docs/packages/iminuit.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iminuit.yml'
      - 'docs/packages/iminuit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iminuit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iminuit ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: iminuit
      version: ${{ matrix.version }}
      # The PyPI sdist contains the vendored MINUIT2 sources; the patches add their missing LGPL text.
      source: pypi-sdist
      patches: true
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # CIBW_ENVIRONMENT replaces, rather than merges into, upstream's own
      # [tool.cibuildwheel.environment] table (CLAUDE.md gotcha 107), so its
      # two keys are repeated here alongside our registry for numpy (a
      # runtime dependency numpy ships no riscv64 wheel for on PyPI itself).
      cibw-environment-linux: >
        PIP_ONLY_BINARY=:all:
        UV_ONLY_BINARY=:all:
        UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        UV_INDEX_STRATEGY=unsafe-best-match
      # Upstream's own test-requires/test-command (pytest only) come from
      # the sdist's pyproject.toml; only the licence assertion is ours.
      cibw-test-command: >
        python -c "import importlib.metadata as m; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('iminuit') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.minuit2'], l"
        && python -m pytest {package}/tests

  publish:
    name: Publish iminuit ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: iminuit-${{ matrix.version }}-*-manylinux_riscv64
