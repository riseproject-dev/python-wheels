---
# Based on: https://github.com/Chia-Network/chiavdf/blob/1.1.14/.github/workflows/build.yml
name: Build chiavdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/chiavdf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-chiavdf.yml'
      - 'docs/packages/chiavdf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chiavdf.yml'
      - 'docs/packages/chiavdf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: chiavdf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build chiavdf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "chiavdf"
      version: "${{ matrix.version }}"
      repository: "Chia-Network/chiavdf"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export CHIAVDF_VERSION='${{ matrix.version }}'
        case "${CHIAVDF_VERSION}" in
          1.0.*|1.1.*)
            echo "GMP_VERSION=6.2.1" >> "$GITHUB_ENV"
            echo "GMP_SHA256=fd4829912cddd12f84181c3451cc752be224643e87fac497b69edddadc49b4f2" >> "$GITHUB_ENV" ;;
          *)
            echo "GMP_VERSION=6.3.0" >> "$GITHUB_ENV"
            echo "GMP_SHA256=a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" >> "$GITHUB_ENV" ;;
        esac

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        set -euo pipefail
        curl -fsSL --retry 5 "https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz" -o "gmp-${GMP_VERSION}.tar.xz"
        echo "${GMP_SHA256}  gmp-${GMP_VERSION}.tar.xz" | sha256sum -c -
        tar xJf "gmp-${GMP_VERSION}.tar.xz" --to-stdout "gmp-${GMP_VERSION}/COPYING.LESSERv3" "gmp-${GMP_VERSION}/COPYINGv3" > LICENSE.gmp
        pybind11=$(sed -n '/GIT_REPOSITORY .*\/pybind11\.git/{n;s/.*GIT_TAG *//p}' src/CMakeLists.txt)
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/${pybind11}/LICENSE" -o LICENSE.pybind11

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-environment-linux: "GMP_VERSION=${{ (startsWith(matrix.version, '1.0.') || startsWith(matrix.version, '1.1.')) && '6.2.1' || '6.3.0' }}"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # manylinux has no EPEL on riscv64 and Rocky 10 has no lzip, so GMP comes from the .tar.xz fetched above.
      cibw-before-all: "yum -y install boost-devel && tar xJf gmp-$GMP_VERSION.tar.xz && cd gmp-$GMP_VERSION && if [ -d ../src/lib/gmp-patch-$GMP_VERSION ]; then cp ../src/lib/gmp-patch-$GMP_VERSION/longlong.h ../src/lib/gmp-patch-$GMP_VERSION/compat.c . && cp ../src/lib/gmp-patch-$GMP_VERSION/mpz/inp_raw.c mpz/; else patch -p1 < ../src/lib/gmp-$GMP_VERSION.diff; fi && ./configure --enable-fat --enable-cxx && make && make install && cd .. && rm -rf gmp-$GMP_VERSION && cmake --version && uname -a"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CHIAVDF_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: chiavdf-${{ env.CHIAVDF_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          # Up to 1.1.14 the extension is chiavdf.cpython-*.so at the wheel root;
          # 1.2.0 moved it into the package as chiavdf/_chiavdf.cpython-*.so.
          assert len(exts) == 1 and exts[0].startswith(("chiavdf.cpython-", "chiavdf/_chiavdf.cpython-")), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          libs = {n.split("/")[-1].split("-")[0] for n in names if n.startswith("chiavdf.libs/") and not n.endswith("/")}
          assert libs == {"libgmp", "libgmpxx"}, libs
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.gmp", "LICENSE.pybind11"}, licences
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      CHIAVDF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: rpm-gpl-sources.tar

      - name: Checkout chiavdf ${{ env.CHIAVDF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Chia-Network/chiavdf
          ref: ${{ env.CHIAVDF_VERSION }}
          path: chiavdf
          persist-credentials: false

      # Up to 1.1.14 upstream bundled GMP 6.2.1 with replacement files (gmp-patch-6.2.1/);
      # from 1.2.0 it bundles GMP 6.3.0 with a diff (gmp-6.3.0.diff).
      - name: Select the GMP version
        run: |
          case "${CHIAVDF_VERSION}" in
            1.0.*|1.1.*)
              echo "GMP_VERSION=6.2.1" >> "$GITHUB_ENV"
              echo "GMP_SHA256=fd4829912cddd12f84181c3451cc752be224643e87fac497b69edddadc49b4f2" >> "$GITHUB_ENV" ;;
            *)
              echo "GMP_VERSION=6.3.0" >> "$GITHUB_ENV"
              echo "GMP_SHA256=a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" >> "$GITHUB_ENV" ;;
          esac

      # The bundled GMP is the pristine release plus chiavdf's replacement files.
      - name: Combine GPL sources into one archive
        run: |
          set -euo pipefail
          mkdir gpl-sources
          tar xf rpm-gpl-sources.tar -C gpl-sources
          curl -fsSL --retry 5 "https://ftp.gnu.org/gnu/gmp/gmp-${GMP_VERSION}.tar.xz" -o "gpl-sources/gmp-${GMP_VERSION}.tar.xz"
          echo "${GMP_SHA256}  gpl-sources/gmp-${GMP_VERSION}.tar.xz" | sha256sum -c -
          cp -r chiavdf/src/lib/gmp-* gpl-sources/
          tar cf gpl-sources.tar -C gpl-sources .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chiavdf-${{ env.CHIAVDF_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish chiavdf ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: chiavdf-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: chiavdf-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc, gmp
