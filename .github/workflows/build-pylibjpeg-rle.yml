---
# This workflow is based on upstream's own cibuildwheel-driven
# https://github.com/pydicom/pylibjpeg-rle/blob/v2.2.0/.github/workflows/release-wheels.yml,
# narrowed to Linux riscv64.
name: Build pylibjpeg-rle wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylibjpeg-rle.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibjpeg-rle.yml'
      - 'docs/packages/pylibjpeg-rle.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibjpeg-rle.yml'
      - 'docs/packages/pylibjpeg-rle.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylibjpeg-rle
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pylibjpeg-rle ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYLIBJPEG_RLE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pylibjpeg-rle v${{ env.PYLIBJPEG_RLE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pydicom/pylibjpeg-rle
          ref: v${{ env.PYLIBJPEG_RLE_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: numpy, a runtime dependency, has no
          # musllinux riscv64 wheel on either index.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL: >-
            curl -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable -y
          CIBW_ENVIRONMENT: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: >-
            pytest
            pydicom
            pylibjpeg
            git+https://github.com/pydicom/pylibjpeg-data
          CIBW_TEST_COMMAND: pytest --pyargs rle.tests

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("rle/rle.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pylibjpeg-rle-${{ env.PYLIBJPEG_RLE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pylibjpeg-rle ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pylibjpeg-rle-${{ matrix.version }}-*-manylinux_riscv64
