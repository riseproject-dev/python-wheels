---
# This workflow is based on upstream's own cibuildwheel-driven
# https://github.com/pydicom/pylibjpeg-rle/blob/v2.2.0/.github/workflows/release-wheels.yml,
# narrowed to Linux riscv64.
name: Build pylibjpeg-rle wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylibjpeg-rle.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibjpeg-rle.yml'
      - 'docs/packages/pylibjpeg-rle.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibjpeg-rle.yml'
      - 'docs/packages/pylibjpeg-rle.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylibjpeg-rle
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pylibjpeg-rle ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pylibjpeg-rle"
      version: "${{ matrix.version }}"
      repository: "pydicom/pylibjpeg-rle"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"
      # musllinux is dropped: numpy, a runtime dependency, has no
      # musllinux riscv64 wheel on either index.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all: "curl -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest pydicom pylibjpeg git+https://github.com/pydicom/pylibjpeg-data"
      cibw-test-command: "pytest --pyargs rle.tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYLIBJPEG_RLE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pylibjpeg-rle-${{ env.PYLIBJPEG_RLE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("rle/rle.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pylibjpeg-rle ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pylibjpeg-rle-${{ matrix.version }}-*-manylinux_riscv64
