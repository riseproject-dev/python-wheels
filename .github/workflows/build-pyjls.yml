---
# This workflow is based on the `build_python_wheels` job of
# https://github.com/jetperch/jls/blob/v0.18.0/.github/workflows/packaging.yml
name: Build pyjls wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyjls version to build (git tag, e.g. v0.18.0)'
        required: true
        default: 'v0.18.0'
  pull_request:
    paths:
      - '.github/workflows/build-pyjls.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || 'v0.18.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to v0.18.0 there.
  PYJLS_VERSION: ${{ inputs.version || 'v0.18.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyjls ${{ inputs.version || 'v0.18.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Matches upstream's own cp312/cp313/cp314 matrix (no cp314t upstream).
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout pyjls ${{ env.PYJLS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jetperch/jls
          ref: ${{ env.PYJLS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs pyjls

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyjls-${{ env.PYJLS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyjls ${{ inputs.version || 'v0.18.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyjls-${{ inputs.version || 'v0.18.0' }}-*-manylinux_riscv64
