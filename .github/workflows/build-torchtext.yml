---
# This workflow is based on: https://github.com/pytorch/text/blob/v0.18.0/.github/workflows/build-wheels-linux.yml
name: Build torchtext wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/torchtext.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-torchtext.yml'
      - 'docs/packages/torchtext.yaml'
      - 'patches/torchtext/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-torchtext.yml'
      - 'docs/packages/torchtext.yaml'
      - 'patches/torchtext/**'

run-name: build-torchtext ${{ inputs.version && format('- {0}', inputs.version) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # torchtext links libtorch's unstable C++ ABI, so the wheel is tied to the torch minor it
  # was built against; upstream paired 0.18.0 with torch 2.3, which has no riscv64 build.
  TORCH_VERSION: 2.14.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: torchtext
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build torchtext ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      TORCHTEXT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout torchtext v${{ env.TORCHTEXT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/text
          ref: v${{ env.TORCHTEXT_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch torchtext source
        run: git apply python-wheels/patches/torchtext/${{ env.TORCHTEXT_VERSION }}/00*.patch

      # The wheel statically links these vendored libraries; setuptools' default
      # license_files glob picks up LICENSE.* at the project root.
      - name: Stage the vendored libraries' licences
        run: |
          cp third_party/re2/LICENSE LICENSE.re2
          cp third_party/double-conversion/LICENSE LICENSE.double-conversion
          cp third_party/utf8proc/LICENSE.md LICENSE.utf8proc.md
          cp third_party/sentencepiece/LICENSE LICENSE.sentencepiece
          for dep in absl darts_clone esaxx protobuf-lite; do
            cp "third_party/sentencepiece/third_party/$dep/LICENSE" "LICENSE.sentencepiece-$dep"
          done

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          # setup.py imports torch at module scope and declares no [build-system], so torch is
          # preinstalled from our registry and isolation is off; setup.py also runs
          # `git submodule update` on the root-owned copy of the checkout.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BEFORE_BUILD: >-
            git config --global --add safe.directory '*' &&
            pip install --only-binary=:all: torch==${{ env.TORCH_VERSION }} setuptools wheel ninja
          # PYTORCH_VERSION is appended to setup.py's `torch>=`, so the upper bound keeps
          # pip off a torch whose C++ ABI the extension was not built against.
          # The vendored re2/sentencepiece/utf8proc/double-conversion predate CMake 3.5.
          CIBW_ENVIRONMENT: >-
            BUILD_VERSION=${{ env.TORCHTEXT_VERSION }}
            PYTORCH_VERSION="${{ env.TORCH_VERSION }},<2.15"
            CMAKE_POLICY_VERSION_MINIMUM=3.5
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # libtorch/libc10 come from the torch wheel, and libtorchtext.so is loaded by
          # torchtext itself before _torchtext is imported.
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair -w {dest_dir} {wheel}
            --exclude libtorchtext.so
            --exclude 'libtorch*'
            --exclude 'libc10*'
            --exclude libgomp.so.1
          CIBW_TEST_REQUIRES: torch==${{ env.TORCH_VERSION }} numpy pytest parameterized expecttest regex
          CIBW_TEST_SOURCES: test
          # Upstream's wheel job runs only the smoke test; the unit tests that exercise the
          # C++ vocab/tokenizer ops run too. datasets/models/data need network downloads or
          # spacy/nltk, which upstream's conda-based unit-test job installs.
          CIBW_TEST_COMMAND: >-
            python test/smoke_tests/smoke_tests.py &&
            pytest test/torchtext_unittest/test_vocab.py
            test/torchtext_unittest/test_functional.py
            test/torchtext_unittest/test_transforms.py
            test/torchtext_unittest/csrc

      - name: Check the wheel carries the vendored licences and no libtorch
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("torchtext/lib/libtorchtext.so", "LICENSE.re2", "LICENSE.sentencepiece",
                       "LICENSE.sentencepiece-protobuf-lite", "LICENSE.utf8proc.md"):
              if not any(n.endswith(want) for n in names):
                  raise SystemExit(f"error: {want} missing from {sys.argv[1]}")
          for unwanted in ("libtorch.so", "libtorch_cpu.so", "libc10.so"):
              if any(unwanted in n for n in names):
                  raise SystemExit(f"error: {unwanted} must not be bundled in {sys.argv[1]}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: torchtext-${{ env.TORCHTEXT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish torchtext ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: torchtext-${{ matrix.version }}-*-manylinux_riscv64
