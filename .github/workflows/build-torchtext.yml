---
# This workflow is based on: https://github.com/pytorch/text/blob/v0.18.0/.github/workflows/build-wheels-linux.yml
name: Build torchtext wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/torchtext.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-torchtext.yml'
      - 'docs/packages/torchtext.yaml'
      - 'patches/torchtext/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-torchtext.yml'
      - 'docs/packages/torchtext.yaml'
      - 'patches/torchtext/**'

run-name: build-torchtext ${{ inputs.version && format('- {0}', inputs.version) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # torchtext links libtorch's unstable C++ ABI, so the wheel is tied to the torch minor it
  # was built against; upstream paired 0.18.0 with torch 2.3, which has no riscv64 build.
  TORCH_VERSION: 2.14.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: torchtext
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build torchtext ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "torchtext"
      version: "${{ matrix.version }}"
      repository: "pytorch/text"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/torchtext/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp third_party/re2/LICENSE LICENSE.re2
        cp third_party/double-conversion/LICENSE LICENSE.double-conversion
        cp third_party/utf8proc/LICENSE.md LICENSE.utf8proc.md
        cp third_party/sentencepiece/LICENSE LICENSE.sentencepiece
        for dep in absl darts_clone esaxx protobuf-lite; do
          cp "third_party/sentencepiece/third_party/$dep/LICENSE" "LICENSE.sentencepiece-$dep"
        done

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py imports torch at module scope and declares no [build-system], so torch is
      # preinstalled from our registry and isolation is off; setup.py also runs
      # `git submodule update` on the root-owned copy of the checkout.
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: "git config --global --add safe.directory '*' && pip install --only-binary=:all: torch==2.14.0 setuptools wheel ninja"
      # PYTORCH_VERSION is appended to setup.py's `torch>=`, so the upper bound keeps
      # pip off a torch whose C++ ABI the extension was not built against.
      # The vendored re2/sentencepiece/utf8proc/double-conversion predate CMake 3.5.
      cibw-environment-linux: "BUILD_VERSION=${{ matrix.version }} PYTORCH_VERSION=\"2.14.0,<2.15\" CMAKE_POLICY_VERSION_MINIMUM=3.5"
      # libtorch/libc10 come from the torch wheel, and libtorchtext.so is loaded by
      # torchtext itself before _torchtext is imported.
      cibw-repair-wheel-command: "auditwheel repair -w {dest_dir} {wheel} --exclude libtorchtext.so --exclude 'libtorch*' --exclude 'libc10*' --exclude libgomp.so.1"
      cibw-test-requires: "torch==2.14.0 numpy pytest parameterized expecttest regex"
      cibw-test-sources: "test"
      # The save/load tests call a bare torch.load() on pickled torchtext objects, written
      # for torch 2.3; torch>=2.6 defaults it to weights_only=True, which rejects them.
      cibw-test-environment: "TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1"
      # Upstream's wheel job runs only the smoke test; the unit tests that exercise the
      # C++ vocab/tokenizer ops run too. datasets/models/data need network downloads or
      # spacy/nltk, which upstream's conda-based unit-test job installs.
      cibw-test-command: "python test/smoke_tests/smoke_tests.py && pytest test/torchtext_unittest/test_vocab.py test/torchtext_unittest/test_functional.py test/torchtext_unittest/test_transforms.py test/torchtext_unittest/csrc"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      TORCHTEXT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: torchtext-${{ env.TORCHTEXT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries the vendored licences and no libtorch
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("torchtext/lib/libtorchtext.so", "LICENSE.re2", "LICENSE.sentencepiece",
                       "LICENSE.sentencepiece-protobuf-lite", "LICENSE.utf8proc.md"):
              if not any(n.endswith(want) for n in names):
                  raise SystemExit(f"error: {want} missing from {sys.argv[1]}")
          for unwanted in ("libtorch.so", "libtorch_cpu.so", "libc10.so"):
              if any(unwanted in n for n in names):
                  raise SystemExit(f"error: {unwanted} must not be bundled in {sys.argv[1]}")
          EOF

  publish:
    name: Publish torchtext ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: torchtext-${{ matrix.version }}-*-manylinux_riscv64
