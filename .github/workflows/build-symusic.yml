---
# This workflow is based on the `build_wheels` job of
# https://github.com/Yikai-Liao/symusic/blob/v0.6.0/.github/workflows/wheel.yml
name: Build symusic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/symusic.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-symusic.yml'
      - 'docs/packages/symusic.yaml'
      - 'patches/symusic/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-symusic.yml'
      - 'docs/packages/symusic.yaml'
      - 'patches/symusic/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: symusic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build symusic ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "symusic"
      version: "${{ matrix.version }}"
      repository: "Yikai-Liao/symusic"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/symusic/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp 3rdparty/fmt/LICENSE LICENSE.fmt
        cp 3rdparty/minimidi/LICENSE LICENSE.minimidi
        cp 3rdparty/pdqsort/license.txt LICENSE.pdqsort
        cp 3rdparty/zpp_bits/LICENSE LICENSE.zpp_bits
        cp 3rdparty/nanobind/LICENSE LICENSE.nanobind
        cp 3rdparty/prestosynth/3rdparty/mio/LICENSE LICENSE.mio
        cp 3rdparty/prestosynth/3rdparty/libsamplerate/COPYING LICENSE.libsamplerate
        cp 3rdparty/prestosynth/3rdparty/eigen/COPYING.MPL2 LICENSE.eigen
        cp 3rdparty/prestosynth/3rdparty/gcem/LICENSE LICENSE.gcem
        cp 3rdparty/prestosynth/3rdparty/gcem/NOTICE.txt NOTICE.gcem

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cmake ships in the image but ninja does not, so scikit-build-core
      # pulls ninja from pip; our registry lags PyPI's latest for both, so
      # pin pip to our riscv64 wheels rather than PyPI's newest sdist-only
      # versions (gotcha 84).
      cibw-environment-linux: "PIP_ONLY_BINARY=cmake,ninja"
      cibw-test-requires: "pytest mypy pretty_midi"
      cibw-test-sources: "tests"
      cibw-test-command: "cd {project} && python -m pytest -v tests"
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SYMUSIC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: symusic-${{ env.SYMUSIC_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              assert any(n.endswith("/bin/abc2midi") for n in names), (path, names)
              assert any(n.endswith("/bin/midi2abc") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              expected = {
                  "LICENSE", "LICENSE_pyvec", "LICENSE_abcmidi",
                  "LICENSE.fmt", "LICENSE.minimidi", "LICENSE.pdqsort",
                  "LICENSE.zpp_bits", "LICENSE.nanobind", "LICENSE.mio",
                  "LICENSE.libsamplerate", "LICENSE.eigen", "LICENSE.gcem",
                  "NOTICE.gcem",
              }
              assert licences == expected, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish symusic ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: symusic-${{ matrix.version }}-*-manylinux_riscv64
