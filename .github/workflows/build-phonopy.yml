---
# This workflow is based on the `build_wheels` job of
# https://github.com/phonopy/phonopy/blob/v4.4.0/.github/workflows/release.yml
# and the test steps of
# https://github.com/phonopy/phonopy/blob/v4.4.0/.github/workflows/phonopy-pytest-conda.yml
name: Build phonopy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/phonopy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-phonopy.yml'
      - 'docs/packages/phonopy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-phonopy.yml'
      - 'docs/packages/phonopy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: phonopy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build phonopy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "phonopy"
      version: "${{ matrix.version }}"
      repository: "phonopy/phonopy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # phonors (a runtime dependency) has no riscv64 wheel; its sdist needs cargo,
      # as upstream's test job also builds it from source.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
      cibw-environment-linux: "PATH=$HOME/.cargo/bin:$PATH PIP_ONLY_BINARY=numpy,scipy,h5py,matplotlib,contourpy,kiwisolver,pillow,spglib,pyyaml"
      # phonopy 4.4.0 declares an unbounded `phonors>=0.3.0` but calls
      # `phonors.grid_index_from_address`, which phonors 0.5.0 replaced with
      # `grid_indices_from_addresses` (phonopy 4.7.0 moved to the new API and
      # raised its floor to `phonors>=0.5.0`). Install the last compatible phonors
      # before the wheel so its unbounded requirement is already satisfied.
      cibw-before-test: "pip install \"phonors>=0.3.0,<0.5\""
      cibw-test-requires: "pytest ase"
      cibw-test-sources: "test"
      # 4.8.3's C-vs-Rust thermal-properties test compares at rtol=1e-10, but the C
      # path's zero-point energy counts every mode with f > 0 while the Rust path
      # counts only f > cutoff (1e-5 THz). The Gamma acoustic modes are eigenvalue
      # noise (~1e-7 THz) that lands between the two, so the gap depends on that
      # noise: 5.6e-11 with upstream's x86_64 wheel, 1.2e-10 on riscv64.
      cibw-test-command: "python -m pytest test --deselect test/phonon/test_thermal_properties.py::test_thermal_properties_at_low_temperature_c_matches_python"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PHONOPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: phonopy-${{ env.PHONOPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              for ext in ("phonopy/_phonopy", "phonopy/_recgrid"):
                  assert any(n.startswith(ext) and n.endswith(".so") for n in names), (path, ext)
              print(path, "ok")
          EOF

  publish:
    name: Publish phonopy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: phonopy-${{ matrix.version }}-*-manylinux_riscv64
