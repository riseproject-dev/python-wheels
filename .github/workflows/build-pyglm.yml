---
# This workflow is based on the manylinux/musllinux jobs of
# https://github.com/Zuzu-Typ/PyGLM/blob/2.8.3/.github/workflows/deploy.yml
name: Build pyglm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyglm version to build (git tag, e.g. 2.8.3)'
        required: true
        default: '2.8.3'
  pull_request:
    paths:
      - '.github/workflows/build-pyglm.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.8.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.8.3 there.
  PYGLM_VERSION: ${{ inputs.version || '2.8.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyglm ${{ inputs.version || '2.8.3' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout PyGLM ${{ env.PYGLM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Zuzu-Typ/PyGLM
          ref: ${{ env.PYGLM_VERSION }}
          submodules: recursive
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/test/PyGLM_test.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyglm-${{ env.PYGLM_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyglm ${{ inputs.version || '2.8.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyglm-${{ inputs.version || '2.8.3' }}-*riscv64
