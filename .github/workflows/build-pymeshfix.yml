---
# This workflow is based on the `build_wheels` and `test_abi3` jobs of
# https://github.com/pyvista/pymeshfix/blob/v0.18.1/.github/workflows/build-and-deploy.yml
name: Build pymeshfix wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymeshfix.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymeshfix.yml'
      - 'docs/packages/pymeshfix.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymeshfix.yml'
      - 'docs/packages/pymeshfix.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymeshfix
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pymeshfix ${{ matrix.version }} manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymeshfix"
      version: "${{ matrix.version }}"
      repository: "pyvista/pymeshfix"
      ref: "v${{ matrix.version }}"
      artifact-tag: "manylinux_riscv64"
      timeout-minutes: 120
      # Matches upstream's own [tool.cibuildwheel] build matrix exactly:
      # cp310/cp311 each get a real per-version extension, cp312+ collapse
      # into one forward-compatible cp312-abi3 wheel (upstream ships no
      # cp313/cp314 glob entries - abi3 covers those interpreters already).
      cibw-build: "cp310-* cp311-* cp312-*"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,vtk,matplotlib,pillow,contourpy,kiwisolver,fonttools"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYMESHFIX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pymeshfix-${{ env.PYMESHFIX_VERSION }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and license made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "_meshfix" in n for n in names), (whl, names)
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), (whl, names)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pymeshfix ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymeshfix-${{ matrix.version }}-manylinux_riscv64
