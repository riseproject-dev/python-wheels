---
# This workflow is based on: https://github.com/cmake-wheel/proxsuite/blob/v0.7.3.c2/.github/workflows/release.yml
name: Build proxsuite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/proxsuite.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-proxsuite.yml'
      - 'docs/packages/proxsuite.yaml'
      - 'patches/proxsuite/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-proxsuite.yml'
      - 'docs/packages/proxsuite.yaml'
      - 'patches/proxsuite/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: proxsuite
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build proxsuite ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # scipy, a runtime dependency, has no cp39 riscv64 wheel on the registry.
        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]

    env:
      PROXSUITE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout proxsuite v${{ env.PROXSUITE_VERSION }}.c2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/proxsuite
          ref: v${{ env.PROXSUITE_VERSION }}.c2
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/proxsuite/${{ env.PROXSUITE_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy's newest release has no riscv64 wheel; the registry's must win over its sdist.
          CIBW_ENVIRONMENT: >-
            CMEEL_LOG_LEVEL="DEBUG" CMEEL_JOBS="1" CMEEL_RUN_TESTS="false"
            CMEEL_CMAKE_ARGS="-DBUILD_WITH_OPENMP_SUPPORT=ON"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""
          CIBW_TEST_COMMAND: >-
            cd {project}/test/src &&
            for t in dense_qp_solve dense_qp_wrapper sparse_qp_solve sparse_qp_wrapper
            parallel_qp_solve serialization cvxpy;
            do echo "$t.py" && python "$t.py" || exit 1; done

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          # proxsuite's own CMakeLists.txt declares `proxsuite` as an INTERFACE
          # (header-only) library, so the nanobind extension module is the only
          # compiled artifact the wheel carries.
          assert any("/site-packages/proxsuite/proxsuite_pywrap" in n and n.endswith(".so") for n in names), names
          # instructionset (and the AVX2/AVX512 submodules it gates) are built only
          # under CMAKE_SYSTEM_PROCESSOR MATCHES x86/amd64 - confirm they are absent here.
          assert not any("instructionset" in n for n in names), names
          assert not any("pywrap_avx2" in n or "pywrap_avx512" in n for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proxsuite-${{ env.PROXSUITE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish proxsuite ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: proxsuite-${{ matrix.version }}-*-manylinux_riscv64
