---
# This workflow is based on: https://github.com/cmake-wheel/proxsuite/blob/v0.7.3.c2/.github/workflows/release.yml
name: Build proxsuite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/proxsuite.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-proxsuite.yml'
      - 'docs/packages/proxsuite.yaml'
      - 'patches/proxsuite/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-proxsuite.yml'
      - 'docs/packages/proxsuite.yaml'
      - 'patches/proxsuite/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: proxsuite
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build proxsuite ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "proxsuite"
      version: "${{ matrix.version }}"
      repository: "cmake-wheel/proxsuite"
      ref: "v${{ matrix.version }}.c2"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/proxsuite/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy's newest release has no riscv64 wheel; the registry's must win over its sdist.
      cibw-environment-linux: "CMEEL_LOG_LEVEL=\"DEBUG\" CMEEL_JOBS=\"1\" CMEEL_RUN_TESTS=\"false\" CMEEL_CMAKE_ARGS=\"-DBUILD_WITH_OPENMP_SUPPORT=ON\" PIP_ONLY_BINARY=numpy,scipy"
      # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
      cibw-repair-wheel-command: ''
      cibw-test-command: "cd {project}/test/src && for t in dense_qp_solve dense_qp_wrapper sparse_qp_solve sparse_qp_wrapper parallel_qp_solve serialization cvxpy; do echo \"$t.py\" && python \"$t.py\" || exit 1; done"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROXSUITE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: proxsuite-${{ env.PROXSUITE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          # proxsuite's own CMakeLists.txt declares `proxsuite` as an INTERFACE
          # (header-only) library, so the nanobind extension module is the only
          # compiled artifact the wheel carries.
          assert any("/site-packages/proxsuite/proxsuite_pywrap" in n and n.endswith(".so") for n in names), names
          # instructionset (and the AVX2/AVX512 submodules it gates) are built only
          # under CMAKE_SYSTEM_PROCESSOR MATCHES x86/amd64 - confirm they are absent here.
          assert not any("instructionset" in n for n in names), names
          assert not any("pywrap_avx2" in n or "pywrap_avx512" in n for n in names), names
          EOF

  publish:
    name: Publish proxsuite ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: proxsuite-${{ matrix.version }}-*-manylinux_riscv64
