---
# This workflow is based on the `wheels-linux` / `wheels-linux-non-x86` jobs of
# https://github.com/mymarilyn/clickhouse-driver/blob/0.2.11/.github/workflows/actions.yml
name: Build clickhouse-driver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clickhouse-driver.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-driver.yml'
      - 'docs/packages/clickhouse-driver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-driver.yml'
      - 'docs/packages/clickhouse-driver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clickhouse-driver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clickhouse-driver ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "clickhouse-driver"
      version: "${{ matrix.version }}"
      repository: "mymarilyn/clickhouse-driver"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-build: "pip install cython"
      cibw-test-sources: "tests"
      cibw-test-requires: "pytest"
      # Upstream's wheel jobs run no tests; the suite needs a live ClickHouse
      # server, which publishes no riscv64 image. These modules are the ones that
      # run without one, and they cover all four compiled extensions.
      cibw-test-command: "python -m pytest -v tests/test_errors.py tests/test_buffered_reader.py tests/test_varint.py tests/test_util.py tests/columns/test_dynamic_shared_value.py tests/columns/test_unknown.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CLICKHOUSE_DRIVER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: clickhouse-driver-${{ env.CLICKHOUSE_DRIVER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {
              'bufferedreader', 'bufferedwriter', 'varint', 'columns/largeint',
          }
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n[len('clickhouse_driver/'):].split('.')[0]
                  for n in names
                  if n.startswith('clickhouse_driver/') and n.endswith('.so')
              }
              assert found == expected, (whl, found)
              print(whl, 'ok')
          EOF

  publish:
    name: Publish clickhouse-driver ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clickhouse-driver-${{ matrix.version }}-*-manylinux_riscv64
