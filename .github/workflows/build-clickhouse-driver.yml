---
# This workflow is based on the `wheels-linux` / `wheels-linux-non-x86` jobs of
# https://github.com/mymarilyn/clickhouse-driver/blob/0.2.11/.github/workflows/actions.yml
name: Build clickhouse-driver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clickhouse-driver.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-driver.yml'
      - 'docs/packages/clickhouse-driver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-driver.yml'
      - 'docs/packages/clickhouse-driver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clickhouse-driver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clickhouse-driver ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CLICKHOUSE_DRIVER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout clickhouse-driver ${{ env.CLICKHOUSE_DRIVER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mymarilyn/clickhouse-driver
          ref: ${{ env.CLICKHOUSE_DRIVER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: pip install cython
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest
          # Upstream's wheel jobs run no tests; the suite needs a live ClickHouse
          # server, which publishes no riscv64 image. These modules are the ones that
          # run without one, and they cover all four compiled extensions.
          CIBW_TEST_COMMAND: >-
            python -m pytest -v
            tests/test_errors.py
            tests/test_buffered_reader.py
            tests/test_varint.py
            tests/test_util.py
            tests/columns/test_dynamic_shared_value.py
            tests/columns/test_unknown.py

      - name: Check the compiled extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {
              'bufferedreader', 'bufferedwriter', 'varint', 'columns/largeint',
          }
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n[len('clickhouse_driver/'):].split('.')[0]
                  for n in names
                  if n.startswith('clickhouse_driver/') and n.endswith('.so')
              }
              assert found == expected, (whl, found)
              print(whl, 'ok')
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clickhouse-driver-${{ env.CLICKHOUSE_DRIVER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish clickhouse-driver ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: clickhouse-driver-${{ matrix.version }}-*-manylinux_riscv64
