---
# This workflow is based on upstream's own wheel builder:
#   https://github.com/BlankSpruce/gersemi/blob/0.28.1/.github/workflows/deploy.yml
# gersemi is a setuptools-rust extension (gersemi_rust_backend); its Cargo.toml
# enables pyo3's abi3 feature but the build never passes --py-limited-api, so
# upstream's own published wheels are per-interpreter, not abi3.
name: Build gersemi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gersemi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gersemi.yml'
      - 'docs/packages/gersemi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gersemi.yml'
      - 'docs/packages/gersemi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gersemi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gersemi ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: gersemi
      version: ${{ matrix.version }}
      repository: BlankSpruce/gersemi
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: >-
        PATH="$PATH:$HOME/.cargo/bin"
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-requires: pytest pytest-clarity six pytest-xdist pytest-timeout pydantic
      cibw-test-sources: tests .gersemirc.example extension-example gersemi/configuration.schema.json
      # The test phase runs as root, which can still write the read-only cache
      # test_when_cache_cant_be_modified_it_is_ignored sets up (gotcha 39); deselect it.
      cibw-test-command: >-
        python -c "import gersemi_rust_backend as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests -p no:terminalprogress --timeout=15 -n auto
        --deselect tests/test_executable.py::test_when_cache_cant_be_modified_it_is_ignored
      timeout-minutes: 60

  publish:
    name: Publish gersemi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gersemi-${{ matrix.version }}-*-manylinux_riscv64
