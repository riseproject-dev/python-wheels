---
# This workflow is based on the `linux` job of
# https://github.com/ojii/imgsize/blob/4.1.0/.github/workflows/release.yml
name: Build imgsize wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/imgsize.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-imgsize.yml'
      - 'docs/packages/imgsize.yaml'
      - 'patches/imgsize/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-imgsize.yml'
      - 'docs/packages/imgsize.yaml'
      - 'patches/imgsize/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: imgsize
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build imgsize ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "imgsize"
      version: "${{ matrix.version }}"
      repository: "ojii/imgsize"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # imgsize ships no [tool.cibuildwheel]; the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      # imgsize's pyproject.toml has no python-source; maturin auto-generates
      # an imgsize/__init__.py shim ("from .imgsize import *") around the
      # compiled imgsize.imgsize submodule, so that's the .so to check.
      # No CIBW_TEST_SOURCES needed: the checkout has no imgsize/ directory
      # at its root to shadow the installed wheel.
      cibw-test-command: "python -c \"import imgsize.imgsize as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest {project}/python-tests"

  publish:
    name: Publish imgsize ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: imgsize-${{ matrix.version }}-*-manylinux_riscv64
