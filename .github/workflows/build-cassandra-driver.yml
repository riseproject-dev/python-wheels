---
# This workflow is based on: https://github.com/datastax/python-driver-wheels/blob/master/.github/workflows/build_wheels_linux.yml
name: Build cassandra-driver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cassandra-driver.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cassandra-driver.yml'
      - 'docs/packages/cassandra-driver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cassandra-driver.yml'
      - 'docs/packages/cassandra-driver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cassandra-driver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cassandra-driver ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cassandra-driver"
      version: "${{ matrix.version }}"
      repository: "apache/cassandra-python-driver"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240

      # auditwheel bundles the image's libev, whose notice the explicit
      # pyproject license-files list would otherwise drop (gotcha 105).
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all: "yum install -y libev libev-devel"
      cibw-environment-linux: "CFLAGS='-s -fno-strict-overflow -Wsign-compare -DNDEBUG -g -O3 -Wall'"
      # tox.ini's [base] deps, minus kerberos (needs krb5 headers and only gates
      # integration tests) and minus gevent on cp314t, which it has no build for.
      # setuptools is what gives pyximport a distutils on 3.12+ (gotcha 211).
      cibw-test-requires: "pytest packaging setuptools cython>=3.0 eventlet twisted[tls] pure-sasl lz4 cryptography>=42.0 numpy ${{ matrix.python == 'cp314t' && '' || 'gevent' }}"
      # cassandra/ would shadow the installed wheel, so only the two .pyx files
      # tests/unit/cython/types_testhelper.pyx includes by relative path are staged.
      cibw-test-sources: "tests cassandra/ioutils.pyx cassandra/cython_marshal.pyx"
      # VERIFY_CYTHON is how the Jenkinsfile makes the Cython and numpy tests fail
      # instead of skip when the extensions are missing. PIP_PREFER_BINARY keeps pip
      # on our registry's gevent instead of compiling PyPI's newer release.
      cibw-test-environment: "VERIFY_CYTHON=True PIP_PREFER_BINARY=1"
      # The extension check is config.sh's run_tests verification from upstream's
      # wheels repo: setup.py swallows every Cython failure, so without it a degraded
      # pure-Python wheel passes the suite under a manylinux_riscv64 tag.
      cibw-test-command: "python -c \"import importlib.metadata as m; f=[str(p) for p in m.files('cassandra-driver')]; assert any(s.endswith('licenses/LICENSE.libev') for s in f), f\" && python -c \"import importlib; mods=[importlib.import_module('cassandra.'+m) for m in ('cluster','concurrent','connection','cqltypes','metadata','pool','protocol','query','util','bytesio','cython_marshal','cython_utils','deserializers','ioutils','numpy_parser','obj_parser','parsing','row_parser')]; bad=[m.__name__ for m in mods if not m.__file__.endswith('.so')]; assert not bad, bad; from cassandra.cmurmur3 import murmur3; assert murmur3('key') == -6847573755651342660; import cassandra.io.libevwrapper as libev; libev.Loop(); from cassandra.protocol import cython_protocol_handler; from cassandra.obj_parser import ListParser, LazyParser; from cassandra.numpy_parser import NumpyParser; [cython_protocol_handler(p()) for p in (ListParser, LazyParser, NumpyParser)]\" && python -m pytest tests/unit --deselect tests/unit/advanced/cloud/test_cloud.py::CloudTests::test_use_default_tempdir"

  publish:
    name: Publish cassandra-driver ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cassandra-driver-${{ matrix.version }}-*-manylinux_riscv64
