---
# This workflow is based on: https://github.com/omerbenamram/pyevtx-rs/blob/0.13.1/.github/workflows/ci.yml
name: Build evtx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/evtx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-evtx.yml'
      - 'docs/packages/evtx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-evtx.yml'
      - 'docs/packages/evtx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: evtx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build evtx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: ["manylinux", "musllinux"]
        # pyo3's abi3-py310 feature gives one cp310-abi3 wheel, built on cp310 and
        # re-tested on cp311-cp314; pyo3 drops abi3 under Py_GIL_DISABLED.
        python: ["abi3", "cp314t"]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "evtx"
      version: "${{ matrix.version }}"
      repository: "omerbenamram/pyevtx-rs"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        ver=$(grep -A1 '^name = "evtx"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
        curl -sSfL "https://crates.io/api/v1/crates/evtx/${ver}/download" \
          | tar xz --strip-components=1 "evtx-${ver}/LICENSE-MIT" "evtx-${ver}/LICENSE-APACHE"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python == 'abi3' && 'cp31?' || matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests samples python/evtx/__init__.py"
      cibw-test-command: "python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # musllinux's static-libc Rust link takes markedly longer than manylinux's
    # on this runner (observed ~2h, right at the old 120-minute ceiling).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: ["manylinux", "musllinux"]
        # pyo3's abi3-py310 feature gives one cp310-abi3 wheel, built on cp310 and
        # re-tested on cp311-cp314; pyo3 drops abi3 under Py_GIL_DISABLED.
        python: ["abi3", "cp314t"]
    env:
      EVTX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: evtx-${{ env.EVTX_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("evtx/_native.") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert {"LICENSE-MIT", "LICENSE-APACHE"} <= licences, (whl, licences)
              print(whl, "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      EVTX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # auditwheel's musllinux policy does not allowlist libgcc_s, so the musl wheels vendor it.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evtx-${{ env.EVTX_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish evtx ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: evtx-${{ matrix.version }}-*_riscv64
      gpl-sources-artifact: evtx-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
