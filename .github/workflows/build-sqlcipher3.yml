---
# Based on the `wheels` job of
# https://github.com/coleifer/sqlcipher3/blob/0.6.2/.github/workflows/wheels.yaml
name: Build sqlcipher3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sqlcipher3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlcipher3.yml'
      - 'docs/packages/sqlcipher3.yaml'
      - 'patches/sqlcipher3/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlcipher3.yml'
      - 'docs/packages/sqlcipher3.yaml'
      - 'patches/sqlcipher3/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sqlcipher3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sqlcipher3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sqlcipher3"
      version: "${{ matrix.version }}"
      repository: "coleifer/sqlcipher3"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120

      patches: true
      pre-build: |-
        # Upstream's suite never sets a key, so check the statically linked OpenSSL and the
        # licences of what the wheel bundles.
        cat > smoke_test.py <<'EOF'
        import importlib.metadata
        import os
        import tempfile

        from sqlcipher3 import dbapi2 as sqlite

        licenses = sorted(
            p.name for p in importlib.metadata.files("sqlcipher3") if ".dist-info/licenses/" in str(p)
        )
        assert licenses == ["LICENSE", "LICENSE.openssl", "LICENSE.sqlcipher"], licenses

        with tempfile.TemporaryDirectory() as tmp:
            path = os.path.join(tmp, "enc.db")
            conn = sqlite.connect(path)
            conn.execute("PRAGMA key = 'riscv64'")
            provider = conn.execute("PRAGMA cipher_provider_version").fetchone()[0]
            assert provider.startswith("OpenSSL 3."), provider
            conn.execute("CREATE TABLE t (v TEXT)")
            conn.execute("INSERT INTO t VALUES ('plaintext-marker')")
            conn.commit()
            conn.close()
            with open(path, "rb") as fh:
                assert b"plaintext-marker" not in fh.read()

            conn = sqlite.connect(path)
            conn.execute("PRAGMA key = 'riscv64'")
            assert conn.execute("PRAGMA cipher_integrity_check").fetchall() == []
            assert conn.execute("SELECT v FROM t").fetchall() == [("plaintext-marker",)]
            conn.close()

            conn = sqlite.connect(path)
            conn.execute("PRAGMA key = 'wrong'")
            try:
                conn.execute("SELECT v FROM t").fetchall()
            except sqlite.DatabaseError:
                pass
            else:
                raise AssertionError("wrong key decrypted the database")
            print(provider, "ok")
        EOF

      cibw-build-frontend: "build"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # Conan's openssl recipe has no riscv64 entry and falls back to linux-generic32;
      # linux64-riscv64's AES asm `jal`s a global symbol, which overflows R_RISCV_JAL here.
      cibw-environment-linux: "SQLCIPHER3_COMPILE_TARGET=riscv64 CONAN_OPENSSL_CONFIGURATION=linux-generic64"
      cibw-before-all-linux: "command -v yum >/dev/null && yum -y install perl-core || command -v apk >/dev/null && apk add perl || true"
      # -P keeps the build's {project}/sqlcipher3.egg-info from shadowing the installed metadata.
      cibw-test-command: |
        mv {project}/sqlcipher3 {project}/sqlcipher3_ && python {project}/tests/ && python -P {project}/smoke_test.py && mv {project}/sqlcipher3_ {project}/sqlcipher3

  publish:
    name: Publish sqlcipher3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sqlcipher3-${{ matrix.version }}-*riscv64
