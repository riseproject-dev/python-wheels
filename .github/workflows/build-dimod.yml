---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/dwavesystems/dimod/blob/0.12.22/pyproject.toml
#   https://github.com/dwavesystems/dimod/blob/0.12.22/.circleci/config.yml
name: Build dimod wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dimod.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dimod.yml'
      - 'docs/packages/dimod.yaml'
      - 'patches/dimod/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dimod.yml'
      - 'docs/packages/dimod.yaml'
      - 'patches/dimod/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dimod
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dimod ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # pandas, a tests/requirements.txt dependency, has no riscv64 cp314t wheel yet.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: dimod
      version: ${{ matrix.version }}
      source: pypi-sdist
      patches: true
      post-build: |-
        python3 - $GITHUB_WORKSPACE/wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        expected = {
            "dimod/binary/cybqm/cybqm_float32", "dimod/binary/cybqm/cybqm_float64",
            "dimod/constrained/cyconstrained", "dimod/constrained/cyexpression",
            "dimod/cylp", "dimod/cyqmbase/cyqmbase_float32", "dimod/cyqmbase/cyqmbase_float64",
            "dimod/cyutilities", "dimod/cyvariables", "dimod/discrete/cydiscrete_quadratic_model",
            "dimod/quadratic/cyqm/cyqm_float32", "dimod/quadratic/cyqm/cyqm_float64",
        }
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            got = {n.split(".", 1)[0] for n in names if n.endswith(".so")}
            assert got == expected, f"{whl}: got {got}, expected {expected}"
            print(whl, "ok")
        EOF
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-*
      # Upstream itself skips musllinux (`skip = "pp* *musllinux*"` in pyproject.toml);
      # CIBW_BUILD overrides that config wholesale, so repeat the musllinux skip here.
      cibw-skip: "*-musllinux_*"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy
        PIP_PREFER_BINARY=1
        UV_ONLY_BINARY=numpy
        UV_PREFER_BINARY=1
        UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        UV_INDEX_STRATEGY=unsafe-best-match
      cibw-test-skip: ${{ case(endsWith(matrix.python, 't'), '*', '') }}

  publish:
    name: Publish dimod ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dimod-${{ matrix.version }}-*-manylinux_riscv64
