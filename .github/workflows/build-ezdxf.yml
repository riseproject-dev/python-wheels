---
# Based on
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/deploy_manylinux2014_aarch64.yml
# with the test step from
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/testcext.yml
name: Build ezdxf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ezdxf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ezdxf.yml'
      - 'docs/packages/ezdxf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ezdxf.yml'
      - 'docs/packages/ezdxf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ezdxf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ezdxf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ezdxf
      version: ${{ matrix.version }}
      # Upstream also builds musllinux, dropped here because numpy, fonttools and
      # Pillow are manylinux-only on our registry.
      repository: mozman/ezdxf
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-build: pip install setuptools wheel cython
      # Only our registry has numpy and Pillow wheels for riscv64; only-binary keeps a
      # newer PyPI release from winning the resolution and compiling from sdist.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,Pillow
      cibw-test-requires: pytest Pillow
      # setup.py marks every Cython module optional, so a compile failure is
      # swallowed and the wheel silently ships the pure-Python fallback.
      cibw-test-command: >-
        python -c "import importlib;
        mods = ['vector', 'matrix44', 'bezier4p', 'bezier3p', 'bspline',
        'construct', 'mapbox_earcut', 'linetypes', 'np_support'];
        bad = [m for m in mods if not importlib.import_module('ezdxf.acc.' + m).__file__.endswith('.so')];
        assert not bad, bad" &&
        cd {project} &&
        python -m pytest tests integration_tests
      timeout-minutes: 120

  publish:
    name: Publish ezdxf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ezdxf-${{ matrix.version }}-*-manylinux_riscv64
