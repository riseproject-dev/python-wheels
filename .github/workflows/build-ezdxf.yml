---
# Based on
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/deploy_manylinux2014_aarch64.yml
# with the test step from
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/testcext.yml
name: Build ezdxf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ezdxf.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ezdxf.yml'
      - 'docs/packages/ezdxf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ezdxf.yml'
      - 'docs/packages/ezdxf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ezdxf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ezdxf ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: upstream ships no free-threaded wheel, and numpy has no
        # riscv64 one either.
        python: ["cp312", "cp313", "cp314"]

    env:
      EZDXF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ezdxf v${{ env.EZDXF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mozman/ezdxf
          ref: v${{ env.EZDXF_VERSION }}
          persist-credentials: false

      # Upstream also builds musllinux, dropped here because numpy, fonttools and
      # Pillow are manylinux-only on our registry.
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: pip install setuptools wheel cython
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest Pillow
          # setup.py marks every Cython module optional, so a compile failure is
          # swallowed and the wheel silently ships the pure-Python fallback.
          CIBW_TEST_COMMAND: >-
            python -c "import importlib;
            mods = ['vector', 'matrix44', 'bezier4p', 'bezier3p', 'bspline',
            'construct', 'mapbox_earcut', 'linetypes', 'np_support'];
            bad = [m for m in mods if not importlib.import_module('ezdxf.acc.' + m).__file__.endswith('.so')];
            assert not bad, bad" &&
            cd {project} &&
            python -m pytest tests integration_tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ezdxf-${{ env.EZDXF_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ezdxf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ezdxf-${{ matrix.version }}-*-manylinux_riscv64
