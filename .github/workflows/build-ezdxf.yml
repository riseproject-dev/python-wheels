---
# Based on
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/deploy_manylinux2014_aarch64.yml
# with the test step from
# https://github.com/mozman/ezdxf/blob/v1.4.4/.github/workflows/testcext.yml
name: Build ezdxf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ezdxf version to build (git tag without leading v, e.g. 1.4.4)'
        required: true
        default: '1.4.4'
  pull_request:
    paths:
      - '.github/workflows/build-ezdxf.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  EZDXF_VERSION: ${{ inputs.version || '1.4.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build ezdxf ${{ inputs.version || '1.4.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # No cp314t: upstream ships no free-threaded wheel, and numpy has no
        # riscv64 one either.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout ezdxf v${{ env.EZDXF_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mozman/ezdxf
          ref: v${{ env.EZDXF_VERSION }}
          persist-credentials: false

      # Upstream also builds musllinux, dropped here because numpy, fonttools and
      # Pillow are manylinux-only on our registry.
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: pip install setuptools wheel cython
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest Pillow
          # setup.py marks every Cython module optional, so a compile failure is
          # swallowed and the wheel silently ships the pure-Python fallback.
          CIBW_TEST_COMMAND: >-
            python -c "import importlib;
            mods = ['vector', 'matrix44', 'bezier4p', 'bezier3p', 'bspline',
            'construct', 'mapbox_earcut', 'linetypes', 'np_support'];
            bad = [m for m in mods if not importlib.import_module('ezdxf.acc.' + m).__file__.endswith('.so')];
            assert not bad, bad" &&
            cd {project} &&
            python -m pytest tests integration_tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ezdxf-${{ env.EZDXF_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ezdxf ${{ inputs.version || '1.4.4' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: ezdxf-${{ env.EZDXF_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
