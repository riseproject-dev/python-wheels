---
# This workflow is based on the Linux job of
# https://github.com/chalk-ai/viztracer/blob/v1.1.2/.github/workflows/wheels.yml
name: Build chalk-viztracer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/chalk-viztracer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-chalk-viztracer.yml'
      - 'docs/packages/chalk-viztracer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chalk-viztracer.yml'
      - 'docs/packages/chalk-viztracer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: chalk-viztracer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build chalk-viztracer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: chalk-viztracer
      version: ${{ matrix.version }}
      repository: chalk-ai/viztracer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest psutil loky
      cibw-test-sources: tests example
      # test_remote.py needs attach_process/'s prebuilt injector .so, which
      # upstream ships only for x86/amd64/x86_64; test_torch.py needs torch
      # per interpreter, not all of which our registry covers.
      # test_use_external_processor hangs forever on riscv64: it shells out to
      # Perfetto's trace_processor, whose prebuilt-binary manifest has no
      # riscv64 entry, and the test's own readline-until-marker wait has no
      # timeout so the exited child's closed pipe spins it forever (see
      # gotcha 297 / build-viztracer.yml's identical case upstream).
      # Paths are relative to cibuildwheel's test cwd, not {project} (gotcha
      # 25): test_tracer.py's include_files/exclude_files tests compare
      # co_filename against os.path.abspath("./"), which is the test cwd, so
      # collecting via an absolute {project}/tests path breaks that match and
      # fails test_include_files/test_exclude_files regardless of platform.
      cibw-test-command: pytest tests --ignore=tests/test_torch.py --ignore=tests/test_remote.py -k "not test_use_external_processor"
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      timeout-minutes: 90

  publish:
    name: Publish chalk-viztracer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: chalk-viztracer-${{ matrix.version }}-*-manylinux_riscv64
