---
# This workflow is based on the `linux` job of
# https://github.com/KenanHanke/rbloom/blob/v1.5.4/.github/workflows/CI.yml
name: Build rbloom wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rbloom.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rbloom.yml'
      - 'docs/packages/rbloom.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rbloom.yml'
      - 'docs/packages/rbloom.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rbloom
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rbloom ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every GIL-ful interpreter; pyo3 disables abi3
          # under Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          - tag: cp37-abi3
            # cp37/cp38 aren't in manylinux_2_39_riscv64 (cp39-cp315 only), and
            # our registry floor is cp312 anyway (build-pycryptodome.yml is the
            # same-shaped precedent), so build there instead of at the claimed
            # floor and let find_compatible_wheel retest on cp313/cp314.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rbloom"
      version: "${{ matrix.version }}"
      repository: "KenanHanke/rbloom"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # rbloom ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-sources: "tests"
      # rbloom's pyproject.toml has no python-source; maturin auto-generates
      # a rbloom/__init__.py shim ("from .rbloom import *") around the
      # compiled rbloom.rbloom submodule, so that's the .so to check.
      cibw-test-command: >
        python -c "import rbloom.rbloom as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python tests/api_test.py

  publish:
    name: Publish rbloom ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rbloom-${{ matrix.version }}-*-manylinux_riscv64
