---
# This workflow is based on: https://github.com/cmake-wheel/libcoal/blob/v3.0.3.c0/.github/workflows/release.yml
name: Build libcoal wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libcoal.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libcoal.yml'
      - 'docs/packages/libcoal.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libcoal.yml'
      - 'docs/packages/libcoal.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libcoal
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libcoal ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      LIBCOAL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout libcoal v${{ env.LIBCOAL_VERSION }}.c0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/libcoal
          ref: v${{ env.LIBCOAL_VERSION }}.c0
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # has-sitelib = false: the wheel holds no Python extension, so one
          # py3-none wheel covers every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy's newest release has no riscv64 wheel; the registry's must win over its sdist.
          CIBW_ENVIRONMENT: >-
            CMEEL_LOG_LEVEL="DEBUG" CMEEL_JOBS="1" CMEEL_TEST_JOBS="1" CMEEL_RUN_TESTS="ON"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib/libcoal.so" in names, names
          assert "cmeel.prefix/include/coal/collision.h" in names, names
          assert "cmeel.prefix/include/hpp/fcl/collision.h" in names, names
          EOF

      - name: Test wheel
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          PIP_ONLY_BINARY: ":all:"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q cmeel cmeel-boost~=1.90.0 cmeel-eigen cmeel-assimp cmeel-octomap cmeel-qhull jrl-cmakemodules
          pip install -q wheelhouse/*.whl
          prefix=$(python3 -c "import pathlib, sysconfig; print(pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix')")
          python3 -c "import ctypes; ctypes.CDLL('$prefix/lib/libcoal.so')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: libcoal-${{ env.LIBCOAL_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish libcoal ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libcoal-${{ matrix.version }}-*-manylinux_riscv64
