---
# This workflow is based on the `build` job of
# https://github.com/pytroll/aggdraw/blob/v1.4.1/.github/workflows/ci.yml
name: Build aggdraw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aggdraw.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aggdraw.yml'
      - 'docs/packages/aggdraw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aggdraw.yml'
      - 'docs/packages/aggdraw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aggdraw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aggdraw ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: aggdraw
      version: ${{ matrix.version }}
      repository: pytroll/aggdraw
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's own before-build is `yum install -y freetype-devel`; the riscv64
      # image is Rocky-based, so dnf replaces yum. freetype-devel ships in Rocky's
      # own repos (no EPEL/CRB needed).
      cibw-before-build-linux: dnf install -y freetype-devel
      cibw-test-requires: numpy pillow pytest
      cibw-test-command: python {project}/selftest.py
      # Pillow (a test/runtime dep) ships no riscv64 wheel on public PyPI; ours is
      # what the test env installs. PIP_ONLY_BINARY keeps pip from falling back to
      # building it from source.
      cibw-environment-linux: "PIP_ONLY_BINARY=Pillow"
      timeout-minutes: 90

  publish:
    name: Publish aggdraw ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aggdraw-${{ matrix.version }}-*-manylinux_riscv64
