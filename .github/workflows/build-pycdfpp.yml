---
# This workflow is based on: https://github.com/SciQLop/CDFpp/blob/v0.19.0/.github/workflows/CI.yml
name: Build pycdfpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycdfpp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycdfpp.yml'
      - 'docs/packages/pycdfpp.yaml'
      - 'patches/pycdfpp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycdfpp.yml'
      - 'docs/packages/pycdfpp.yaml'
      - 'patches/pycdfpp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycdfpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pycdfpp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycdfpp"
      version: "${{ matrix.version }}"
      repository: "SciQLop/CDFpp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180

      # uint32 2**32 - 1 as CDF_FLOAT rounds to 2**32; the back-cast check in
      # _keeps_every_value() is undefined out of range and riscv64 saturates it, so the
      # changed value was accepted instead of raising ValueError (python_value_conversions).
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      cibw-before-build: "pip install meson meson-python ninja"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pyyaml"
      cibw-test-requires: "cyclopts>=4 rich>=13"
      # full_corpus is excluded: it fetches ~33 fixtures from an upstream mirror
      # (self-signed cert, bare IP) that this runner has no reason to depend on.
      # The rest is upstream's own free-threaded-only loop (tests-windows.yml/CI.yml),
      # run here for every interpreter since it needs no network.
      cibw-test-command: "cd {project}/tests && for t in python_loading python_saving python_skeletons python_variable_set_values python_chrono python_windows_crash python_structural_introspection python_debug python_cli_irsdump python_value_conversions python_api_contract python_threads; do python $t/test.py || exit 1; done"

  publish:
    name: Publish pycdfpp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycdfpp-${{ matrix.version }}-*-manylinux_riscv64
