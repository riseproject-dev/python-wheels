---
# Based on the `build_wheels` job of
# https://github.com/Bluetooth-Devices/bluetooth-data-tools/blob/v1.29.21/.github/workflows/ci.yml
name: Build bluetooth-data-tools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bluetooth-data-tools.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bluetooth-data-tools.yml'
      - 'docs/packages/bluetooth-data-tools.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bluetooth-data-tools.yml'
      - 'docs/packages/bluetooth-data-tools.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bluetooth-data-tools
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bluetooth-data-tools ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      BLUETOOTH_DATA_TOOLS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bluetooth-data-tools v${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Bluetooth-Devices/bluetooth-data-tools
          ref: v${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: cryptography, a hard runtime dependency, has no musl
          # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Cython 3.3.0 shipped after this release and rejects gap.pxd's
          # augmenting signatures; build-system.requires only floors Cython.
          CIBW_BEFORE_ALL: echo 'Cython<3.3.0' > /cython-constraint.txt
          # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
          # reaches the Linux build container; build_ext.py otherwise falls back
          # to a pure-Python wheel under a riscv64 tag.
          # only-binary keeps pip off PyPI's newest cryptography, which has no
          # riscv64 wheel, so it resolves from the registry.
          CIBW_ENVIRONMENT: >-
            REQUIRE_CYTHON=1
            PIP_CONSTRAINT=/cython-constraint.txt
            PIP_BUILD_CONSTRAINT=/cython-constraint.txt
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cryptography
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: 'pytest>=9.0,<10 pytest-codspeed>=5.0.3,<6.0.0'
          CIBW_TEST_COMMAND: >-
            python -c "from bluetooth_data_tools import _time_impl, _utils_impl, gap, utils;
            m = [_time_impl, _utils_impl, gap, utils];
            bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
            assert not bad, bad" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bluetooth-data-tools-${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bluetooth-data-tools ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: bluetooth-data-tools-${{ matrix.version }}-*-manylinux_riscv64
