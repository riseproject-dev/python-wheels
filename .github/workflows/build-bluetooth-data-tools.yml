---
# Based on the `build_wheels` job of
# https://github.com/Bluetooth-Devices/bluetooth-data-tools/blob/v1.29.21/.github/workflows/ci.yml
name: Build bluetooth-data-tools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bluetooth-data-tools.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bluetooth-data-tools.yml'
      - 'docs/packages/bluetooth-data-tools.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bluetooth-data-tools.yml'
      - 'docs/packages/bluetooth-data-tools.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bluetooth-data-tools
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bluetooth-data-tools ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: bluetooth-data-tools
      version: ${{ matrix.version }}
      repository: Bluetooth-Devices/bluetooth-data-tools
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Only manylinux: cryptography, a hard runtime dependency, has no musl
      # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Cython 3.3.0 shipped after this release and rejects gap.pxd's
      # augmenting signatures; build-system.requires only floors Cython.
      cibw-before-all: echo 'Cython<3.3.0' > /cython-constraint.txt
      # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
      # reaches the Linux build container; build_ext.py otherwise falls back
      # to a pure-Python wheel under a riscv64 tag.
      # only-binary keeps pip off PyPI's newest cryptography, which has no
      # riscv64 wheel, so it resolves from the registry.
      cibw-environment-linux: "REQUIRE_CYTHON=1 PIP_CONSTRAINT=/cython-constraint.txt PIP_BUILD_CONSTRAINT=/cython-constraint.txt PIP_ONLY_BINARY=cryptography"
      cibw-test-sources: tests
      cibw-test-requires: 'pytest>=9.0,<10 pytest-codspeed>=5.0.3,<6.0.0'
      cibw-test-command: >-
        python -c "from bluetooth_data_tools import _time_impl, _utils_impl, gap, utils;
        m = [_time_impl, _utils_impl, gap, utils];
        bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
        assert not bad, bad" &&
        python -m pytest tests
      timeout-minutes: 120

  publish:
    name: Publish bluetooth-data-tools ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bluetooth-data-tools-${{ matrix.version }}-*-manylinux_riscv64
