---
# Based on the `build_wheels` job of
# https://github.com/Bluetooth-Devices/bluetooth-data-tools/blob/v1.29.21/.github/workflows/ci.yml
name: Build bluetooth-data-tools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bluetooth-data-tools version to build (git tag without leading v, e.g. 1.29.21)'
        required: true
        default: '1.29.21'
  pull_request:
    paths:
      - '.github/workflows/build-bluetooth-data-tools.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.29.21' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  BLUETOOTH_DATA_TOOLS_VERSION: ${{ inputs.version || '1.29.21' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build bluetooth-data-tools ${{ inputs.version || '1.29.21' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout bluetooth-data-tools v${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: Bluetooth-Devices/bluetooth-data-tools
          ref: v${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: cryptography, a hard runtime dependency, has no musl
          # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Cython 3.3.0 shipped after this release and rejects gap.pxd's
          # augmenting signatures; build-system.requires only floors Cython.
          CIBW_BEFORE_ALL: echo 'Cython<3.3.0' > /cython-constraint.txt
          # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
          # reaches the Linux build container; build_ext.py otherwise falls back
          # to a pure-Python wheel under a riscv64 tag.
          # only-binary keeps pip off PyPI's newest cryptography, which has no
          # riscv64 wheel, so it resolves from the registry.
          CIBW_ENVIRONMENT: >-
            REQUIRE_CYTHON=1
            PIP_CONSTRAINT=/cython-constraint.txt
            PIP_BUILD_CONSTRAINT=/cython-constraint.txt
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cryptography
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: 'pytest>=9.0,<10 pytest-codspeed>=5.0.3,<6.0.0'
          CIBW_TEST_COMMAND: >-
            python -c "from bluetooth_data_tools import _time_impl, _utils_impl, gap, utils;
            m = [_time_impl, _utils_impl, gap, utils];
            bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
            assert not bad, bad" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bluetooth-data-tools-${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bluetooth-data-tools ${{ inputs.version || '1.29.21' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: bluetooth-data-tools-${{ env.BLUETOOTH_DATA_TOOLS_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
