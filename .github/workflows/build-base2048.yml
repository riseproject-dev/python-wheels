---
# This workflow is based on the `build` job of
# https://github.com/ionite34/base2048/blob/v0.1.3/.github/workflows/build.yml
name: Build base2048 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/base2048.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-base2048.yml'
      - 'docs/packages/base2048.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-base2048.yml'
      - 'docs/packages/base2048.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: base2048
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build base2048 ${{ matrix.version }} cp37-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "base2048"
      version: "${{ matrix.version }}"
      repository: "ionite34/base2048"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp37-abi3-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so
      # one abi3 wheel serves every interpreter in our matrix; pyo3
      # 0.17.1 predates PEP 703 entirely, so there is no free-threaded
      # (cp314t) job.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # base2048 ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # pyproject.toml pins maturin>=0.13,<0.14 (2022), which has no
      # riscv64 wheel on PyPI and fails to build from sdist (its own
      # bootstrap needs setuptools, which Python 3.12+ no longer seeds
      # into a fresh build-isolation venv). A current maturin builds
      # this tree unmodified, so install one and skip isolation to
      # bypass the pin.
      cibw-before-build: "pip install maturin"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import base2048; assert base2048.base2048.__file__.endswith('.abi3.so'), base2048.base2048.__file__\" && python -m pytest -v tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      BASE2048_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: base2048-${{ env.BASE2048_VERSION }}-cp37-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish base2048 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: base2048-${{ matrix.version }}-*-manylinux_riscv64
