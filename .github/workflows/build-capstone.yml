---
# Based on upstream's own wheel build at this tag:
#   https://github.com/capstone-engine/capstone/blob/5.0.9/.github/workflows/python-publish-release.yml
name: Build capstone wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/capstone.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-capstone.yml'
      - 'docs/packages/capstone.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-capstone.yml'
      - 'docs/packages/capstone.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: capstone
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build capstone ${{ matrix.version }} py3-none-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "capstone"
      version: "${{ matrix.version }}"
      repository: "capstone-engine/capstone"
      ref: "${{ matrix.version }}"
      artifact-tag: "py3-none-${{ matrix.libc }}_riscv64"
      cibw-package-dir: "bindings/python"
      # setup.py ships no ext_modules (the C library is loaded via ctypes), so
      # setuptools tags the wheel py3-none and one build serves every interpreter.
      cibw-build: "cp312-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-sources: "bindings/python/tests"
      cibw-test-command: "python bindings/python/tests/test_all.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
    env:
      CAPSTONE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: capstone-${{ env.CAPSTONE_VERSION }}-py3-none-${{ matrix.libc }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries libcapstone
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("capstone/lib/libcapstone.so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish capstone ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: capstone-${{ matrix.version }}-*riscv64
