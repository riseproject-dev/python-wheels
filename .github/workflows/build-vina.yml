---
# This workflow is based on: https://github.com/ccsb-scripps/AutoDock-Vina/blob/v1.2.7/.github/workflows/pypi-build.yml
name: Build vina wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vina.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vina.yml'
      - 'docs/packages/vina.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vina.yml'
      - 'docs/packages/vina.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vina
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vina ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Mirrors upstream's own `cp -R ./build/python/* .` wheel-build step: the
    # setup.py in build/python addresses its native sources (src/lib/*.cpp) and
    # SWIG interface relative to the repository root, so it is copied there
    # rather than used as cibuildwheel's package-dir.
    # That copy overwrites the tracked root README.md, so setup.py's fallback
    # `git describe --dirty=@mod` would version the wheel `1.2.7+mod`; like
    # upstream's "Add tag to version.py file" step, pin vina/version.py (which
    # setup.py reads first) to the release version.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "vina"
      version: "${{ matrix.version }}"
      repository: "ccsb-scripps/AutoDock-Vina"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export VINA_VERSION='${{ matrix.version }}'
        echo "${VINA_VERSION}" > ./build/python/vina/version.py
        cp -R ./build/python/* .

        cat > test_vina.py <<'EOF'
        from vina import Vina

        v = Vina(sf_name="vina", verbosity=0)
        assert v.__class__.__name__ == "Vina"
        EOF
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Rocky 10's own boost-devel (behind crb) and swig packages replace
      # upstream's from-source SWIG 4.0.2 + Boost 1.82.0 builds (both built purely
      # for a build-time compiler/linker, so the substitution has no effect on
      # what ships in the wheel).
      cibw-before-all: "dnf -y install --enablerepo=crb boost-devel swig"
      cibw-test-sources: "test_vina.py"
      cibw-test-command: "python test_vina.py"

  publish:
    name: Publish vina ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: vina-${{ matrix.version }}-*-manylinux_riscv64
