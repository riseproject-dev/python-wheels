---
# This workflow is based on: https://github.com/h5py/h5py/blob/3.16.0/.github/workflows/build_wheels.yml
name: Build h5py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/h5py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-h5py.yml'
      - 'docs/packages/h5py.yaml'
      - 'patches/h5py/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-h5py.yml'
      - 'docs/packages/h5py.yaml'
      - 'patches/h5py/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's Linux wheels are built in ghcr.io/h5py/manylinux_2_28_<arch>-hdf5,
  # which has no riscv64 variant, so the same libraries are built into the
  # container instead. Versions are the ones h5py/hdf5-manylinux@f6bfd96 baked in
  # when 3.16.0 was released.
  HDF5_VERSION: '2.0.0'
  LIBAEC_VERSION: '1.1.4'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: h5py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build h5py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "h5py"
      version: "${{ matrix.version }}"
      repository: "h5py/h5py"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 420
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/h5py/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # libaec (szip) then HDF5, mirroring h5py/hdf5-manylinux's
      # install_libaec.sh and install_hdf5.sh. CMAKE_INSTALL_LIBDIR is pinned
      # because HDF5_DIR resolves libraries as $HDF5_DIR/lib only, and cmake
      # defaults to lib64 on Rocky (upstream pinned it the same way in
      # h5py/hdf5-manylinux@5b15b5d).
      cibw-before-all-linux: |-
        set -ex
        dnf -y install zlib-devel
        mkdir -p /tmp/libaec /tmp/hdf5
        curl -fsSL "https://github.com/Deutsches-Klimarechenzentrum/libaec/releases/download/v$LIBAEC_VERSION/libaec-$LIBAEC_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/libaec
        cmake -S /tmp/libaec -B /tmp/libaec/build \
        -D CMAKE_BUILD_TYPE=Release \
        -D CMAKE_INSTALL_PREFIX="$HDF5_DIR" \
        -D CMAKE_INSTALL_LIBDIR=lib \
        -D BUILD_STATIC_LIBS=OFF \
        -D BUILD_TESTING=OFF
        cmake --build /tmp/libaec/build -j "$(nproc)"
        cmake --install /tmp/libaec/build
        ldconfig
        curl -fsSL "https://github.com/HDFGroup/hdf5/archive/refs/tags/$HDF5_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/hdf5
        cmake -S /tmp/hdf5 -B /tmp/hdf5/build \
        -D CMAKE_BUILD_TYPE=Release \
        -D CMAKE_INSTALL_PREFIX="$HDF5_DIR" \
        -D CMAKE_INSTALL_LIBDIR=lib \
        -D BUILD_TESTING=OFF \
        -D BUILD_STATIC_LIBS=OFF \
        -D HDF5_BUILD_EXAMPLES=OFF \
        -D HDF5_BUILD_TOOLS=OFF \
        -D HDF5_BUILD_UTILS=OFF \
        -D HDF5_ENABLE_ZLIB_SUPPORT=ON \
        -D HDF5_ENABLE_SZIP_SUPPORT=ON
        cmake --build /tmp/hdf5/build -j "$(nproc)"
        cmake --install /tmp/hdf5/build
        ldconfig
      # HDF5_DIR/HDF5_VERSION are `ENV` in upstream's wheel image; CFLAGS=-g1
      # comes from h5py's own [tool.cibuildwheel.linux.environment], which
      # this variable replaces wholesale.
      cibw-environment-linux: "HDF5_DIR=/usr/local HDF5_VERSION=2.0.0 LIBAEC_VERSION=1.1.4 CFLAGS=-g1"
      # Upstream tests wheels through tox envs that resolve NumPy from the
      # scientific-python nightly index and need tox-uv; neither works on
      # riscv64, so run the suite the tox `test` env runs, directly.
      cibw-test-groups: ''
      cibw-test-requires: "pytest pytest-mpi"
      cibw-test-sources: "pytest.ini"
      cibw-test-environment: "H5PY_TEST_CHECK_FILTERS=1"
      cibw-test-command: "python -c \"from h5py.version import info; print(info)\" && python -c \"from h5py import filters; print('Included filters:', filters.encode, filters.decode)\" && python -m pytest --pyargs h5py -rxXs"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      H5PY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: h5py-${{ env.H5PY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extensions and the bundled licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith(".so") for n in names), names
          for licence in ("licenses/hdf5.txt", "licenses/libaec.txt"):
              assert any(
                  n.endswith(f".dist-info/licenses/{licence}") for n in names
              ), (licence, names)
          EOF

  publish:
    name: Publish h5py ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: h5py-${{ matrix.version }}-*-manylinux_riscv64
