---
name: Build mysql-connector-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mysql-connector-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mysql-connector-python.yml'
      - 'docs/packages/mysql-connector-python.yaml'
      - 'patches/mysql-connector-python/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mysql-connector-python.yml'
      - 'docs/packages/mysql-connector-python.yaml'
      - 'patches/mysql-connector-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mysql-connector-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mysql-connector-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mysql-connector-python"
      version: "${{ matrix.version }}"
      repository: "mysql/mysql-connector-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/mysql-connector-python/${{ matrix.version }}/*.patch

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "mysql-connector-python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Oracle publishes no riscv64 MySQL C API build, so the extension links
      # Rocky 10's libmysqlclient (auditwheel then vendors it into the wheel)
      # instead of the static one Oracle's own wheels bundle.
      cibw-before-all-linux: "dnf -y install mysql8.4-devel"
      # Without MYSQL_CAPI setup.py silently drops the C extension; SKIP_VENDOR
      # turns off bundling the auth plugins, which mysql8.4-devel does not ship.
      # EXTRA_LINK_ARGS is needed because upstream only puts the MySQL library
      # path on the link line when it finds a static libmysqlclient.a to copy.
      cibw-environment-linux: "MYSQL_CAPI=/usr SKIP_VENDOR=1 EXTRA_LINK_ARGS=-L/usr/lib64/mysql"
      # Clear them again for the test phase, or unittests.py's in-tree rebuild
      # would shadow the wheel's extension with one it just compiled.
      cibw-test-environment: "MYSQL_CAPI= SKIP_VENDOR= EXTRA_LINK_ARGS="
      # unittests.py bootstraps its own server; the container's capability
      # bounding set makes mysqld's cap_sys_nice file capability unexecutable.
      cibw-before-test-linux: "dnf -y install mysql8.4-server mysql8.4 libcap && setcap -r /usr/libexec/mysqld"
      cibw-test-requires: "setuptools wheel"
      cibw-test-command: "cd {package} && python -c \"import _mysql_connector as m; assert 'site-packages' in m.__file__, m.__file__; print(m.__file__, m.MySQL().get_client_info())\" && python -c \"import importlib.metadata as md; n={p.name for p in md.files('mysql-connector-python') if '.dist-info/licenses/' in str(p)}; assert n == {'LICENSE.txt', 'LICENSE.zstd'}, n\" && python unittests.py --with-mysql=/usr --with-mysql-share=/usr/share/mysql --verbosity=1 --test-regex '^cext_'"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MYSQL_CONNECTOR_PYTHON_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mysql-connector-python-${{ env.MYSQL_CONNECTOR_PYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_mysql_connector") and n.endswith(".so")
                         for n in names), f"no C extension in {whl}"
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for mysql-connector-python ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: mysql-connector-python
      version: ${{ matrix.version }}
      # The wheels vendor libmysqlclient (GPLv2) out of the build container
      # alongside the gcc runtime, so both need their sources published.
      packages: gcc mysql8.4-libs

  publish:
    name: Publish mysql-connector-python ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mysql-connector-python-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: mysql-connector-python-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc, libmysqlclient
