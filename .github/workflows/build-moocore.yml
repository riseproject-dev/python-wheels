---
# This workflow is based on the `wheels` job of
# https://github.com/multi-objective/moocore/blob/v0.3.2/.github/workflows/python.yml
name: Build moocore wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'moocore version to build (git tag without leading v, e.g. 0.3.2)'
        required: true
        default: '0.3.2'
  pull_request:
    paths:
      - '.github/workflows/build-moocore.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.3.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.3.2 there.
  MOOCORE_VERSION: ${{ inputs.version || '0.3.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build moocore ${{ inputs.version || '0.3.2' }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    steps:
      - name: Checkout moocore v${{ env.MOOCORE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: multi-objective/moocore
          ref: v${{ env.MOOCORE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse/
        env:
          # py_limited_api = "cp310" is a fixed constant (python/pyproject.toml),
          # so the wheel must be built on cp310, the oldest interpreter the tag
          # claims (gotcha 96); the rest just re-test that same wheel.
          CIBW_BUILD: >-
            cp310-manylinux_riscv64 cp311-manylinux_riscv64
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi, numpy and pandas have no riscv64 wheel on PyPI; PIP_ONLY_BINARY
          # keeps pip on our registry's builds instead of a newer sourceless
          # PyPI release, which would otherwise be built from sdist (gotcha 30).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cffi,numpy,pandas

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moocore-${{ env.MOOCORE_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish moocore ${{ inputs.version || '0.3.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: moocore-${{ inputs.version || '0.3.2' }}-*-manylinux_riscv64
