---
# This workflow is based on the `wheels` job of
# https://github.com/multi-objective/moocore/blob/v0.3.2/.github/workflows/python.yml
name: Build moocore wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/moocore.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-moocore.yml'
      - 'docs/packages/moocore.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-moocore.yml'
      - 'docs/packages/moocore.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: moocore
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build moocore ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: moocore
      version: ${{ matrix.version }}
      repository: multi-objective/moocore
      ref: v${{ matrix.version }}
      artifact-tag: cp310-abi3-manylinux_riscv64
      cibw-package-dir: python
      # py_limited_api = "cp310" is a fixed constant (python/pyproject.toml),
      # so the wheel must be built on cp310, the oldest interpreter the tag
      # claims (gotcha 96); the rest just re-test that same wheel.
      cibw-build: >-
        cp310-manylinux_riscv64 cp311-manylinux_riscv64
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      # cffi, numpy and pandas have no riscv64 wheel on PyPI; PIP_ONLY_BINARY
      # keeps pip on our registry's builds instead of a newer sourceless
      # PyPI release, which would otherwise be built from sdist (gotcha 30).
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=cffi,numpy,pandas
      timeout-minutes: 60

  publish:
    name: Publish moocore ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: moocore-${{ matrix.version }}-*-manylinux_riscv64
