---
# This workflow is based on the `wheels` job of
# https://github.com/multi-objective/moocore/blob/v0.3.2/.github/workflows/python.yml
name: Build moocore wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/moocore.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-moocore.yml'
      - 'docs/packages/moocore.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-moocore.yml'
      - 'docs/packages/moocore.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: moocore
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build moocore ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    env:
      MOOCORE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout moocore v${{ env.MOOCORE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: multi-objective/moocore
          ref: v${{ env.MOOCORE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse/
        env:
          # py_limited_api = "cp310" is a fixed constant (python/pyproject.toml),
          # so the wheel must be built on cp310, the oldest interpreter the tag
          # claims (gotcha 96); the rest just re-test that same wheel.
          CIBW_BUILD: >-
            cp310-manylinux_riscv64 cp311-manylinux_riscv64
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi, numpy and pandas have no riscv64 wheel on PyPI; PIP_ONLY_BINARY
          # keeps pip on our registry's builds instead of a newer sourceless
          # PyPI release, which would otherwise be built from sdist (gotcha 30).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cffi,numpy,pandas

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moocore-${{ env.MOOCORE_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish moocore ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: moocore-${{ matrix.version }}-*-manylinux_riscv64
