---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-boost/blob/v1.90.0.c0/.github/workflows/release.yml
name: Build cmeel-boost wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-boost.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-boost.yml'
      - 'docs/packages/cmeel-boost.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-boost.yml'
      - 'docs/packages/cmeel-boost.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-boost
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-boost ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmeel-boost"
      version: "${{ matrix.version }}"
      repository: "cmake-wheel/cmeel-boost"
      ref: "v${{ matrix.version }}.c0"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 480
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy has no riscv64 wheel on public PyPI; needed both at build time
      # (build-system.requires) and at install time.
      cibw-environment-linux: "CMEEL_LOG_LEVEL=DEBUG"
      # Boost's shared libs already carry a hardcoded $ORIGIN RPATH
      # (CMakeLists.txt's hardcode-dll-paths=true); repair would only
      # re-tag them, so skip it as upstream's own release.yml does.
      cibw-repair-wheel-command: ''

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CMEEL_BOOST_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmeel-boost-${{ env.CMEEL_BOOST_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          libs = [n for n in names if n.startswith("cmeel.prefix/lib/") and n.endswith(".so")]
          assert any("libboost_python" in n for n in libs), libs
          assert any("libboost_numpy" in n for n in libs), libs
          EOF

  publish:
    name: Publish cmeel-boost ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-boost-${{ matrix.version }}-*-manylinux_riscv64
