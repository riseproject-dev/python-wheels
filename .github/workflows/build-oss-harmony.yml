---
# This workflow is based on the `linux` job of
# https://github.com/oss-harmony/harmony/blob/v0.0.12/.github/workflows/CI.yml
name: Build oss-harmony wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/oss-harmony.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-oss-harmony.yml'
      - 'docs/packages/oss-harmony.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oss-harmony.yml'
      - 'docs/packages/oss-harmony.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: oss-harmony
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build oss-harmony ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pyo3's abi3-py38 feature is declared unconditionally on the
        # python-binding feature's own pyo3 dependency line (Cargo.toml), so
        # one abi3 wheel serves every GIL-ful interpreter (gotcha 181); pyo3
        # disables abi3 under Py_GIL_DISABLED, giving the free-threaded build
        # its own wheel. musllinux is dropped: pydantic-core, a runtime dep,
        # has no musllinux riscv64 wheel on PyPI or our registry (gotcha 221).
        include:
          - tag: cp38-abi3
            # The riscv64 manylinux image ships no cp38 (cp39 is its floor),
            # so build on cp39 instead and re-test on the rest via
            # find_compatible_wheel.
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      OSS_HARMONY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout oss-harmony v${{ env.OSS_HARMONY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: oss-harmony/harmony
          ref: v${{ env.OSS_HARMONY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # oss-harmony ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # pydantic (a runtime dep) pulls in pydantic-core, which we also
          # publish for riscv64; the extra index lets pip find it when PyPI's
          # own riscv64 pydantic-core wheel is missing for an interpreter.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests test-data pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "import openai_harmony.openai_harmony as m, importlib.metadata as md;
            assert m.__file__.endswith('.so'), m.__file__;
            assert any(str(p).endswith('licenses/LICENSE') for p in md.files('oss-harmony'))" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oss-harmony-${{ env.OSS_HARMONY_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish oss-harmony ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: oss-harmony-${{ matrix.version }}-*-manylinux_riscv64
