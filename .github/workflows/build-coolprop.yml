---
# Mirrors the Linux leg of upstream's .github/workflows/python_cibuildwheel.yml (called
# from python_buildwheels.yml's set-matrix job): v8 is a nanobind/scikit-build-core/CMake
# build, with CPM.cmake fetching Eigen/fmt/nlohmann_json/msgpack-c/valijson/IF97/
# REFPROP-headers/boost-headers at configure time and statically compiling them in.
# Upstream's full-wheels matrix is py_versions=[39, 310, 311, 312] - the cp312 build is
# abi3-tagged (COOLPROP_NANOBIND=ON turns on both the nanobind core and, on Python >= 3.12,
# the cp312-abi3 wheel tag) and covers 3.13/3.14 too, so those are dropped to avoid
# duplicate abi3 wheels; 3.9-3.11 stay per-version. musllinux is skipped upstream too
# (`skip = "*-musllinux_*"` in pyproject.toml).
name: Build coolprop wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/coolprop.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-coolprop.yml'
      - 'docs/packages/coolprop.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-coolprop.yml'
      - 'docs/packages/coolprop.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: coolprop
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build coolprop ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "coolprop"
      version: "${{ matrix.version }}"
      repository: "CoolProp/CoolProp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        set -euxo pipefail
        curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/5.0.1/COPYING.MPL2" -o LICENSE.eigen
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/msgpack/msgpack-c/919908742b4fdbc575e77fe1a8657e70c9573c44/LICENSE_1_0.txt" -o LICENSE.msgpack-c
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/nlohmann/json/v3.12.0/LICENSE.MIT" -o LICENSE.nlohmann-json
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/tristanpenman/valijson/v1.0.6/LICENSE" -o LICENSE.valijson
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/CoolProp/IF97/7aaced024a702f0985474bf293cdaae9c8d06521/LICENSE" -o LICENSE.if97
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/CoolProp/REFPROP-headers/b4faab1b73911c32c4b69c526c7e92f74edb67de/LICENSE" -o LICENSE.refprop-headers
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/CoolProp/boost-headers/c68104660ca4bd80d0d5cb34c4eba0cf5bab3f73/LICENSE" -o LICENSE.boost-headers
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/fmtlib/fmt/12.0.0/LICENSE" -o LICENSE.fmt
        cp externals/miniz-3.1.1/LICENSE LICENSE.miniz
        cp externals/incbin/UNLICENSE LICENSE.incbin

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-build-linux: "pip install ninja && git config --global --add safe.directory \"*\""
      cibw-environment-linux: "COOLPROP_NANOBIND=ON"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: "python -c \"import CoolProp; from CoolProp.CoolProp import PropsSI; from CoolProp.State import State; assert '?' not in CoolProp.__gitrevision__; assert isinstance(PropsSI('T','P',101325,'Q',0,'Water'), float)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      COOLPROP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coolprop-${{ env.COOLPROP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert exts and all(n.split("/")[-1].split(".")[0] in ("CoolProp", "State", "_constants") for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          expected = {"LICENSE", "LICENSE.eigen", "LICENSE.msgpack-c", "LICENSE.nlohmann-json",
                      "LICENSE.valijson", "LICENSE.if97", "LICENSE.refprop-headers",
                      "LICENSE.boost-headers", "LICENSE.fmt", "LICENSE.miniz", "LICENSE.incbin"}
          assert licences == expected, licences
          EOF

  publish:
    name: Publish coolprop ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: coolprop-${{ matrix.version }}-*-manylinux_riscv64
