---
# This workflow is based on: https://github.com/SoyabulIslamLincoln/py_ortho/blob/v0.9.3/.github/workflows/wheels.yml
# and the [tool.cibuildwheel] table in https://github.com/SoyabulIslamLincoln/py_ortho/blob/v0.9.3/pyproject.toml
name: Build pyorthomosaic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyorthomosaic.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyorthomosaic.yml'
      - 'docs/packages/pyorthomosaic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyorthomosaic.yml'
      - 'docs/packages/pyorthomosaic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyorthomosaic
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyorthomosaic ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's build selector stops at cp313 and it ships no cp314/cp314t wheels.
        python: ["cp312", "cp313"]

    env:
      PYORTHOMOSAIC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyorthomosaic v${{ env.PYORTHOMOSAIC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SoyabulIslamLincoln/py_ortho
          ref: v${{ env.PYORTHOMOSAIC_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: numpy (build and runtime dependency) has no musllinux riscv64 wheel.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT_LINUX: >-
            PIP_PREFER_BINARY=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pillow

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[1].split(".")[0] for n in names if n.startswith("orthomosaic/") and n.endswith(".so")}
          assert exts == {"_core", "_ba", "_mvs", "_dense", "_fast"}, names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyorthomosaic-${{ env.PYORTHOMOSAIC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyorthomosaic ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyorthomosaic-${{ matrix.version }}-*-manylinux_riscv64
