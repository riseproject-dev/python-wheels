---
# This workflow is based on the `release` target of
# https://github.com/wbolster/plyvel/blob/1.5.1/Makefile and
# https://github.com/wbolster/plyvel/blob/1.5.1/scripts/cibuildwheel-before-build.sh
name: Build plyvel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/plyvel.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-plyvel.yml'
      - 'docs/packages/plyvel.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-plyvel.yml'
      - 'docs/packages/plyvel.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Versions upstream's own install-leveldb.sh/install-snappy.sh pin.
  LEVELDB_VERSION: '1.22'
  SNAPPY_VERSION: '1.1.9'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: plyvel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build plyvel ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "plyvel"
      version: "${{ matrix.version }}"
      repository: "wbolster/plyvel"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "LIBRARY_PATH=/usr/local/lib LD_LIBRARY_PATH=/usr/local/lib LEVELDB_VERSION=1.22 SNAPPY_VERSION=1.1.9"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py links a system `leveldb`, which upstream's own manylinux Docker
      # image builds from source via cmake (install-snappy.sh/install-leveldb.sh);
      # reproduce that here since neither lib ships in the riscv64 image. The sed
      # matches upstream's 1.1.9-0001-fix-inlining-failure.patch (newer GCC
      # rejects always_inline across TUs); -DSNAPPY_BUILD_TESTS=OFF skips the
      # googletest/benchmark submodules that patch's checkout also needs.
      # CMAKE_POLICY_VERSION_MINIMUM works around snappy 1.1.9's
      # cmake_minimum_required(3.1), which CMake 4 refuses outright (gotcha 207).
      cibw-before-all-linux: "curl -sSLf \"https://github.com/google/snappy/archive/refs/tags/${SNAPPY_VERSION}.tar.gz\" | tar -xz -C /tmp && sed -i '/#define SNAPPY_ATTRIBUTE_ALWAYS_INLINE __attribute__((always_inline))/s/.*/#define SNAPPY_ATTRIBUTE_ALWAYS_INLINE/' /tmp/snappy-${SNAPPY_VERSION}/snappy-stubs-internal.h && cmake -S /tmp/snappy-${SNAPPY_VERSION} -B /tmp/snappy-${SNAPPY_VERSION}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DSNAPPY_BUILD_TESTS=OFF -DSNAPPY_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build /tmp/snappy-${SNAPPY_VERSION}/build --parallel --target install && curl -sSLf \"https://github.com/google/leveldb/archive/refs/tags/${LEVELDB_VERSION}.tar.gz\" | tar -xz -C /tmp && cmake -S /tmp/leveldb-${LEVELDB_VERSION} -B /tmp/leveldb-${LEVELDB_VERSION}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DLEVELDB_BUILD_TESTS=OFF -DLEVELDB_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_LIBDIR=lib && cmake --build /tmp/leveldb-${LEVELDB_VERSION}/build --parallel --target install && ldconfig && cp /tmp/snappy-${SNAPPY_VERSION}/COPYING {project}/LICENSE.snappy && cp /tmp/leveldb-${LEVELDB_VERSION}/LICENSE {project}/LICENSE.leveldb"
      # setup.py's sources are the .cpp Cython already generated upstream; make
      # cython (upstream's own cibuildwheel-before-build.sh step) regenerates them.
      cibw-before-build: "pip install cython && make cython"
      cibw-repair-wheel-command: "auditwheel repair --strip -w {dest_dir} {wheel}"
      # test/ is a package (test/__init__.py) sitting next to plyvel/ at the repo
      # root, so running pytest from {project} would import the source tree
      # instead of the wheel (gotcha 25); stage just the test suite instead.
      cibw-test-requires: "pytest"
      cibw-test-sources: "test setup.cfg"
      # The test phase runs as root, which never sees the permission error
      # test_open_read_only_dir asserts (gotcha 39); deselect it.
      cibw-test-command: "pytest test --deselect test/test_plyvel.py::test_open_read_only_dir"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PLYVEL_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: plyvel-${{ env.PLYVEL_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("plyvel/_plyvel.") and n.endswith(".so") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE.rst") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.leveldb") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.snappy") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish plyvel ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: plyvel-${{ matrix.version }}-*-manylinux_riscv64
