---
# This workflow is based on the `build_wheels_aarch64` job of
# https://github.com/Qiskit/qiskit/blob/0.46.3/.github/workflows/wheels.yml
name: Build qiskit-terra wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qiskit-terra.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit-terra.yml'
      - 'docs/packages/qiskit-terra.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit-terra.yml'
      - 'docs/packages/qiskit-terra.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qiskit-terra
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qiskit-terra ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      QISKIT_TERRA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout qiskit ${{ env.QISKIT_TERRA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Qiskit/qiskit
          ref: ${{ env.QISKIT_TERRA_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # One cp38-abi3 wheel; built and tested on cp312, the oldest interpreter our registry carries numpy/scipy for.
          CIBW_BUILD: cp312-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Replaces upstream's [tool.cibuildwheel.linux] environment, so its three variables are repeated.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_NET_GIT_FETCH_WITH_CLI="true"
            RUSTUP_TOOLCHAIN="stable"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # The riscv64 image has no pipx; cibuildwheel's default audit already runs abi3audit.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qiskit-terra-${{ env.QISKIT_TERRA_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish qiskit-terra ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: qiskit-terra-${{ matrix.version }}-*-manylinux_riscv64
