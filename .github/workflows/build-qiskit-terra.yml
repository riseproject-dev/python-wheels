---
# This workflow is based on the `build_wheels_aarch64` job of
# https://github.com/Qiskit/qiskit/blob/0.46.3/.github/workflows/wheels.yml
name: Build qiskit-terra wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qiskit-terra.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit-terra.yml'
      - 'docs/packages/qiskit-terra.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit-terra.yml'
      - 'docs/packages/qiskit-terra.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qiskit-terra
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qiskit-terra ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: qiskit-terra
      version: ${{ matrix.version }}
      repository: Qiskit/qiskit
      ref: ${{ matrix.version }}
      artifact-tag: cp38-abi3-manylinux_riscv64
      # One cp38-abi3 wheel; built and tested on cp312, the oldest interpreter our registry carries numpy/scipy for.
      cibw-build: cp312-manylinux_riscv64
      # Replaces upstream's [tool.cibuildwheel.linux] environment, so its three variables are repeated.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" CARGO_NET_GIT_FETCH_WITH_CLI=\"true\" RUSTUP_TOOLCHAIN=\"stable\""
      # The riscv64 image has no pipx; cibuildwheel's default audit already runs abi3audit.
      cibw-repair-wheel-command-linux: auditwheel repair -w {dest_dir} {wheel}
      timeout-minutes: 360

  publish:
    name: Publish qiskit-terra ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: qiskit-terra-${{ matrix.version }}-*-manylinux_riscv64
