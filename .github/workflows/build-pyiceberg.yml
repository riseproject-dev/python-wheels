---
# This workflow is based on the `pypi-build-artifacts` job of
# https://github.com/apache/iceberg-python/blob/pyiceberg-0.11.1/.github/workflows/pypi-build-artifacts.yml
name: Build pyiceberg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyiceberg.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyiceberg.yml'
      - 'docs/packages/pyiceberg.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyiceberg.yml'
      - 'docs/packages/pyiceberg.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyiceberg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyiceberg ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyiceberg"
      version: "${{ matrix.version }}"
      repository: "apache/iceberg-python"
      ref: "pyiceberg-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py already makes the Cython extension mandatory when CIBUILDWHEEL=1.
      # Upstream's wheel job runs only this module; it imports CythonBinaryDecoder,
      # so a pure-Python wheel fails here. tests/conftest.py is left unstaged: it
      # pulls in boto3/moto that this module needs no fixture from.
      cibw-test-sources: "tests/avro/test_decoder.py pyproject.toml"
      cibw-test-requires: "pytest==7.4.4"
      cibw-test-command: "pytest tests/avro/test_decoder.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYICEBERG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyiceberg-${{ env.PYICEBERG_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the Cython decoder made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("decoder_fast" in n and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyiceberg ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyiceberg-${{ matrix.version }}-*-manylinux_riscv64
