---
# This workflow is based on the `pypi-build-artifacts` job of
# https://github.com/apache/iceberg-python/blob/pyiceberg-0.11.1/.github/workflows/pypi-build-artifacts.yml
name: Build pyiceberg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyiceberg.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyiceberg.yml'
      - 'docs/packages/pyiceberg.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyiceberg.yml'
      - 'docs/packages/pyiceberg.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyiceberg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyiceberg ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream caps its wheels at CIBW_PROJECT_REQUIRES_PYTHON ">=3.10,<3.14" and
        # skips free-threaded builds (CIBW_SKIP "cp3*t-*"), so cp314/cp314t are omitted.
        python:
          - "cp312"
          - "cp313"

    env:
      PYICEBERG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyiceberg ${{ env.PYICEBERG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: apache/iceberg-python
          ref: pyiceberg-${{ env.PYICEBERG_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # setup.py already makes the Cython extension mandatory when CIBUILDWHEEL=1.
          # Upstream's wheel job runs only this module; it imports CythonBinaryDecoder,
          # so a pure-Python wheel fails here. tests/conftest.py is left unstaged: it
          # pulls in boto3/moto that this module needs no fixture from.
          CIBW_TEST_SOURCES: tests/avro/test_decoder.py pyproject.toml
          CIBW_TEST_REQUIRES: pytest==7.4.4
          CIBW_TEST_COMMAND: pytest tests/avro/test_decoder.py

      - name: Check the Cython decoder made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("decoder_fast" in n and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyiceberg-${{ env.PYICEBERG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyiceberg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyiceberg-${{ matrix.version }}-*-manylinux_riscv64
