---
# This workflow is based on the `test`/linux-wheel steps of
# https://github.com/indent-com/python-ripgrep/blob/93220e8b608121b41722941f719e5cb86397e092/.github/workflows/ci.yml
# and .github/workflows/release.yml (the 0.0.9 release commit -- gotcha 103,
# sdist-source-and-versioning.md: upstream's own release workflow is
# `release: types: [published]`/`workflow_dispatch`, no git tag is ever
# pushed, and the standalone indent-com/python-ripgrep repo (created
# 2025-11-14 by extracting this package out of a monorepo) has already moved
# on to an unreleased 0.1.0. This commit was found from the PyPI sdist's
# 2025-07-30 upload time and proven byte-identical to it file for file.
name: Build python-ripgrep wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-ripgrep.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-ripgrep.yml'
      - 'docs/packages/python-ripgrep.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-ripgrep.yml'
      - 'docs/packages/python-ripgrep.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # The 0.0.9 release commit, since upstream pushes no git tag (see above).
  PYTHON_RIPGREP_REF: 93220e8b608121b41722941f719e5cb86397e092

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-ripgrep
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-ripgrep ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PYTHON_RIPGREP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-ripgrep ${{ env.PYTHON_RIPGREP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: indent-com/python-ripgrep
          ref: ${{ env.PYTHON_RIPGREP_REF }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          #
          # pyo3's abi3-py38 feature means this is one wheel (always tagged
          # cp38-abi3, whichever interpreter builds it), but 0.0.9's own
          # pyproject.toml sets requires-python ">=3.10,<3.13" -- narrower
          # than the abi3 floor -- so building (and, worse, testing) on
          # cp38/cp39 would have pip refuse to install the just-built wheel
          # on its own test venv. cp310 is both the real installable floor
          # and upstream's own ci.yml matrix floor, so it is built there and
          # re-tested on cp311/cp312 via find_compatible_wheel; cp313/cp314
          # are dropped, matching the "<3.13" upper bound upstream declares
          # (and pyo3 0.22.3 predates 3.14 besides).
          CIBW_BUILD: >-
            cp310-manylinux_riscv64 cp311-manylinux_riscv64
            cp312-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # python-ripgrep ships no [tool.cibuildwheel], so the Rust
          # toolchain its maturin backend needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_SOURCES: src test.py
          # test.py is upstream's own `python test.py` smoke test (ci.yml);
          # python_ripgrep/__init__.py is a maturin-generated shim re-exporting
          # the compiled submodule, so that submodule is probed by its own name.
          CIBW_TEST_COMMAND: >-
            python -c "from python_ripgrep import python_ripgrep as ext;
            assert ext.__file__.endswith('.so'), ext.__file__" &&
            python test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-ripgrep-${{ env.PYTHON_RIPGREP_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-ripgrep ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: python-ripgrep-${{ matrix.version }}-*-manylinux_riscv64
