---
# This workflow is based on the `wheels` job of
# https://github.com/static-frame/arraykit/blob/v1.12.0/.github/workflows/ci.yml
name: Build arraykit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/arraykit.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-arraykit.yml'
      - 'docs/packages/arraykit.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arraykit.yml'
      - 'docs/packages/arraykit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: arraykit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build arraykit ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "arraykit"
      version: "${{ matrix.version }}"
      repository: "static-frame/arraykit"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build and runtime requirement, and only our registry has
      # it for riscv64; only-binary keeps a newer PyPI sdist-only release
      # from winning the resolution and trying to build from source.
      # setup.py locates numpy's headers via site.getsitepackages(), which
      # a PEP 517 build-isolation overlay is invisible to, so numpy has to
      # be preinstalled with isolation disabled.
      # PIP_ONLY_BINARY also covers hypothesis: our registry has 6.165.10 with a
      # cp314t riscv64 wheel, but PyPI's newer 6.168.0 (no riscv64 wheel for
      # cp314t) otherwise wins version resolution and falls back to its sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,hypothesis"
      cibw-before-build: "pip install setuptools wheel \"numpy>=2.2\""
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest hypothesis"
      # The property tests trip Hypothesis' too_slow health check and the
      # per-example deadline on the shared riscv64 runners, a different test
      # each run; the failures are timing, not wrong results.
      cibw-before-test: "printf 'from hypothesis import HealthCheck, settings\\nsettings.register_profile(\"ci\", suppress_health_check=list(HealthCheck), deadline=None)\\nsettings.load_profile(\"ci\")\\n' > {project}/test/conftest.py"
      cibw-test-command: "pytest {project}/test --durations=0"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ARRAYKIT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: arraykit-${{ env.ARRAYKIT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_arraykit"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt"}, licences
          EOF

  publish:
    name: Publish arraykit ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: arraykit-${{ matrix.version }}-*-manylinux_riscv64
