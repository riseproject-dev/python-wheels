---
# This workflow is based on the `build-wheels` job of
# https://github.com/chatnoir-eu/chatnoir-resiliparse/blob/v1.0.9/.github/workflows/build-packages.yml
name: Build fastwarc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastwarc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastwarc.yml'
      - 'docs/packages/fastwarc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastwarc.yml'
      - 'docs/packages/fastwarc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastwarc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastwarc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastwarc"
      version: "${{ matrix.version }}"
      repository: "chatnoir-eu/chatnoir-resiliparse"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        cp LICENSE fastwarc-py/
        cat > collect-lz4-license.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        project="${1:?usage: collect-lz4-license.sh <project-dir>}"
        mapfile -t files < <(rpm -q --licensefiles lz4-libs 2>/dev/null || true)
        if [ -z "${files[0]:-}" ]; then
          dnf -y --disablerepo=extras reinstall --setopt=tsflags= lz4-libs
          mapfile -t files < <(rpm -qd lz4-libs | grep -iE '/(LICEN[CS]E|COPYING)')
        fi
        cp "${files[0]}" "$project/LICENSE.lz4"
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "fastwarc-py"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # zlib-devel resolves without EPEL; lz4-devel needs the extras
      # mirror disabled (gotcha 51). The image ships no Rust toolchain for
      # the setuptools-rust/pyo3 extension; rustup provisions a native
      # riscv64gc-unknown-linux-gnu one (gotcha 10).
      cibw-before-all-linux: "dnf -y --disablerepo=extras install zlib-devel lz4-devel && bash {project}/collect-lz4-license.sh {project}/fastwarc-py && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # test-sources paths are relative to cibuildwheel's cwd (the checkout
      # root), not to package-dir, and are staged at that same relative
      # path (gotcha 104); fastwarc-pytest's own fixture lookup climbs two
      # parents to fastwarc-rs/tests/fixtures, so that sibling has to be
      # staged too.
      cibw-test-sources: "fastwarc-py/fastwarc-pytest fastwarc-rs/tests/fixtures"
      cibw-test-command: "python -m pytest -v fastwarc-py/fastwarc-pytest"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FASTWARC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fastwarc-${{ env.FASTWARC_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extensions and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("fastwarc/_fastwarc") and n.endswith(".so") for n in names), whl
              assert any(n.startswith("fastwarc/legacy/warc") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert {"LICENSE", "LICENSE.lz4"} <= licences, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish fastwarc ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastwarc-${{ matrix.version }}-*-manylinux_riscv64
