---
# This workflow is based on: https://github.com/urschrei/convertbng/blob/v2.0.0/.github/workflows/wheels.yml
name: Build convertbng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/convertbng.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-convertbng.yml'
      - 'docs/packages/convertbng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-convertbng.yml'
      - 'docs/packages/convertbng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: convertbng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build convertbng ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp312-abi3, cp314t]
        include:
          # pyo3's abi3-py311 feature (Cargo.toml) collapses cp312/cp313/cp314
          # into one abi3 build; the newer interpreters re-test that wheel via
          # find_compatible_wheel.
          - tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          # Free-threaded builds fall outside the Limited API, so pyo3 builds a
          # version-specific cp314t wheel.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      CONVERTBNG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout convertbng v${{ env.CONVERTBNG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: urschrei/convertbng
          ref: v${{ env.CONVERTBNG_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
          # crashes the audit step: it asserts a host `uv`, which the self-hosted
          # riscv64 runner doesn't have (gotcha 13).
          CIBW_BUILD_FRONTEND: build
          # Replaces pyproject.toml's [tool.cibuildwheel.linux] environment, so
          # its PATH entry for the rustup toolchain from before-all is repeated;
          # numpy has riscv64 wheels only on our registry.
          CIBW_ENVIRONMENT: >-
            PATH="$HOME/.cargo/bin:$PATH"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: convertbng-${{ env.CONVERTBNG_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish convertbng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: convertbng-${{ matrix.version }}-*-manylinux_riscv64
