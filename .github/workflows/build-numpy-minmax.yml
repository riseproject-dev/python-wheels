---
# This workflow is based on: https://github.com/nomonosound/numpy-minmax/blob/0.6.0/.github/workflows/build.yml
name: Build numpy-minmax wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'numpy-minmax version to build (git tag, e.g. 0.6.0)'
        required: true
        default: '0.6.0'
  pull_request:
    paths:
      - '.github/workflows/build-numpy-minmax.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.6.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  NUMPY_MINMAX_VERSION: ${{ inputs.version || '0.6.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build numpy-minmax ${{ inputs.version || '0.6.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the cffi extension links the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout numpy-minmax ${{ env.NUMPY_MINMAX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nomonosound/numpy-minmax
          ref: ${{ env.NUMPY_MINMAX_VERSION }}
          fetch-depth: 0  # setuptools_scm derives the version from git tags
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is both a build (test) and runtime requirement, and only our registry
          # has it for riscv64; only-binary keeps a newer PyPI release from winning the
          # resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numpy-minmax-${{ env.NUMPY_MINMAX_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numpy-minmax ${{ inputs.version || '0.6.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: numpy-minmax-${{ inputs.version || '0.6.0' }}-*-manylinux_riscv64
