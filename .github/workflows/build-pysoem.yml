---
# This workflow is based on the `build_wheels` job of
# https://github.com/bnjmnp/pysoem/blob/1.1.13/.github/workflows/build.yml
name: Build pysoem wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pysoem.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pysoem.yml'
      - 'docs/packages/pysoem.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pysoem.yml'
      - 'docs/packages/pysoem.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pysoem
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pysoem ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream also ships cp38, but the riscv64 manylinux image has no cp38.
        python:
          - "cp39"
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYSOEM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pysoem ${{ env.PYSOEM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bnjmnp/pysoem
          ref: ${{ env.PYSOEM_VERSION }}
          # The SOEM C library is a git submodule and is compiled into the extension.
          submodules: recursive
          persist-credentials: false

      # setup.py sets license='MIT' with no license_files option, so setuptools'
      # default LICEN[CS]E* glob is root-only. The extension statically links the
      # vendored SOEM submodule (GPL-2.0-only with a linking exception), whose own
      # LICENSE lives at soem/LICENSE and never ships in any published wheel.
      - name: Stage the SOEM library's LICENSE
        run: cp soem/LICENSE LICENSE.soem

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's own CI builds wheels/sdist only and runs no test step against
          # them (the test suite needs a real EtherCAT network interface/slave).
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; f = {p.name for p in m.files('pysoem') if '.dist-info/licenses/' in str(p)}; assert f == {'LICENSE', 'LICENSE.soem'}, f"
            && python -c "import pysoem; print(pysoem.__version__)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysoem-${{ env.PYSOEM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pysoem ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pysoem-${{ matrix.version }}-*-manylinux_riscv64
