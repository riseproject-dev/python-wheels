---
# This workflow is based on upstream's own build-wheels.yml (cibuildwheel over a
# setuptools-rust build), narrowed to riscv64.
name: Build aardwolf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aardwolf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aardwolf.yml'
      - 'docs/packages/aardwolf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aardwolf.yml'
      - 'docs/packages/aardwolf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aardwolf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build aardwolf ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: aardwolf
      version: ${{ matrix.version }}
      repository: skelsec/aardwolf
      ref: ${{ matrix.version }}
      artifact-tag: cp311-abi3-manylinux_riscv64
      # Both ext-modules (_rle, _bulk) carry pyo3's abi3-py311 feature
      # unconditionally, matching upstream's own cp311-only CIBW_BUILD;
      # musllinux is dropped as rustup.rs ships no riscv64 musl toolchain.
      cibw-build: cp311-manylinux_riscv64
      cibw-config-settings: --build-option=--py-limited-api=cp311
      # pyproject.toml declares no [tool.cibuildwheel] rust toolchain; the
      # Rust toolchain setuptools-rust needs is installed in-container.
      # aardwolf itself needs neither jpeg nor openssl, but installing the
      # repaired wheel into the test venv pulls in Pillow and cryptography
      # as runtime deps, and both lack a riscv64 wheel on public PyPI, so
      # pip builds them from source here: Pillow's setup.py fails outright
      # with `RequiredDependencyException: jpeg` (gotcha 422) and
      # cryptography's openssl-sys build script can't find openssl via
      # pkg-config. libjpeg-turbo-devel/openssl-devel are this image's
      # names for those headers (mirrors build-pytango.yml/build-uamqp.yml).
      cibw-before-all-linux: >-
        dnf -y install libjpeg-turbo-devel openssl-devel &&
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: pytest pytest-asyncio pytest-randomly pytest-timeout hypothesis PyYAML
      # tests/unit/compression imports the pure-Python reference codecs from
      # the repo-root `reference` package, and a packaging test reads
      # pyproject.toml from the repo root; both are staged alongside `tests`.
      cibw-test-sources: tests reference pyproject.toml
      cibw-test-command: >-
        python -c "import aardwolf._rle, aardwolf._bulk; assert aardwolf._rle.__file__.endswith('.abi3.so'), aardwolf._rle.__file__; assert aardwolf._bulk.__file__.endswith('.abi3.so'), aardwolf._bulk.__file__" &&
        python -m pytest -q tests/unit tests/fake_peer tests/component
      timeout-minutes: 60

  publish:
    name: Publish aardwolf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aardwolf-${{ matrix.version }}-*-manylinux_riscv64
