---
name: Build numpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/numpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-numpy.yml'
      - 'docs/packages/numpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-numpy.yml'
      - 'docs/packages/numpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_ONLY_BINARY: ':all:'
  # cibw_before_build.sh installs requirements/ci_requirements.txt with plain
  # `pip install`, not `uv pip install` - UV_EXTRA_INDEX_URL above has no
  # effect on it. Forwarded into the cibuildwheel container below via
  # CIBW_ENVIRONMENT_PASS_LINUX so plain pip can see this registry too.
  PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
  # Pinned explicitly (rather than left to cibuildwheel's default resolution)
  # so the gpl_sources job below can pull the exact same image the wheels
  # were built in.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: numpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build numpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      NUMPY_VERSION: ${{ matrix.version }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: "/project"
      CCACHE_COMPILERCHECK: "content"

    steps:
      # Layout note: numpy is checked out at the workspace root (not under a
      # subdir) so cibuildwheel's `{project}` template substitution resolves
      # to the numpy source tree. numpy's pyproject.toml uses
      # `{project}/tools/wheels/cibw_before_build.sh`, which only works when
      # CWD == numpy root at cibuildwheel invocation time. python-wheels is
      # placed under `python-wheels-repo/` to free the workspace root for numpy.
      - name: Checkout numpy v${{ env.NUMPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: numpy/numpy
          ref: v${{ env.NUMPY_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wheels-numpy-v${{ env.NUMPY_VERSION }}-${{ matrix.platform }}_riscv64-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: |
            ccache-wheels-numpy-v${{ env.NUMPY_VERSION }}-${{ matrix.platform }}_riscv64-${{ matrix.python }}-
            ccache-wheels-numpy-manylinux_riscv64-${{ matrix.python }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            CCACHE_VERSION=4.13.6
            curl -fsSL https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-linux-$(uname -m)-musl-static.tar.gz | \
              tar -xvzf - --strip-components 1 -C /usr/local/bin ccache-${CCACHE_VERSION}-linux-$(uname -m)-musl-static/ccache
            ccache --version
            ccache --zero-stats
          CIBW_ENVIRONMENT_PASS_LINUX: >-
            CCACHE_BASEDIR
            CCACHE_COMPILERCHECK
            PIP_EXTRA_INDEX_URL
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ env.CCACHE_DIR }}:/root/.ccache"
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # CIBW_BUILD still makes cibuildwheel validate every Linux arch's configured image,
          # not just riscv64's; several pending numpy versions' pyproject.toml sets
          # musllinux-x86_64-image = "musllinux_1_1", a bare alias cibuildwheel 4.x rejects
          # outright, so it must be overridden even though these arches are never built here
          # (same fix as build-cyksuid.yml).
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_I686_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-wheels-numpy-v${{ env.NUMPY_VERSION }}-${{ matrix.platform }}_riscv64-${{ matrix.python }}-${{ github.run_id }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numpy-${{ env.NUMPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numpy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: numpy-${{ matrix.version }}-*riscv64
