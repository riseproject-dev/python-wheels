---
# This workflow is based on the `build_wheels` job of
# https://github.com/brentp/cyvcf2/blob/v0.34.0/.github/workflows/wheels.yml
name: Build cyvcf2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyvcf2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyvcf2.yml'
      - 'docs/packages/cyvcf2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyvcf2.yml'
      - 'docs/packages/cyvcf2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyvcf2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyvcf2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cyvcf2"
      version: "${{ matrix.version }}"
      repository: "brentp/cyvcf2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/cyvcf2/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf install -y autoconf automake libtool cmake ninja-build zlib-devel bzip2-devel xz-devel"
      # No libcurl-devel and no EPEL on riscv64 (as build-pysam.yml/build-pybigwig.yml),
      # so drop --enable-libcurl/--enable-s3/--with-libdeflate from upstream's own
      # options; each defaults to "check" and htslib's configure silently disables it
      # when the headers are absent instead of failing. bz2/lzma default to required,
      # matching the devel packages installed above.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy CYVCF2_HTSLIB_CONFIGURE_OPTIONS=\"--enable-lzma --enable-bz2\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "cyvcf2/tests pyproject.toml"
      # test_reader.py/test_writer.py reach the compiled extension via a
      # package-relative `from ..cyvcf2 import ...`, so cyvcf2/tests alone (no
      # cyvcf2/__init__.py) isn't a deep enough package for that import to resolve.
      # Merge the installed package (the compiled wheel) into the staged tree so the
      # relative import lands on it directly, still exercising the compiled .so; its
      # auditwheel-repaired RPATH is $ORIGIN-relative to a sibling cyvcf2.libs/
      # (bz2/lzma), so stage that alongside it too.
      cibw-test-command: "site_pkg=\"$(python -c 'import cyvcf2, os; print(os.path.dirname(cyvcf2.__file__))')\" && cp -a \"$site_pkg/.\" cyvcf2/ && cp -a \"$site_pkg/../cyvcf2.libs\" . && python -m pytest -v cyvcf2/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CYVCF2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cyvcf2-${{ env.CYVCF2_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extension and vendored licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          print("\n".join(sos))
          assert any("cyvcf2/cyvcf2" in n for n in sos), sos

          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          assert {"LICENSE", "LICENSE.htslib", "LICENSE.htscodecs"} <= set(lic), lic
          EOF

  publish:
    name: Publish cyvcf2 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cyvcf2-${{ matrix.version }}-*-manylinux_riscv64
