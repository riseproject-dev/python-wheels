---
# Based on upstream's wheel builder (the project has since been renamed docling-nlp, but the
# PyPI distribution this tracks is still published as deepsearch-glm):
#   https://github.com/docling-project/docling-nlp/blob/v1.0.0/.github/workflows/wheels.yml
name: Build deepsearch-glm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/deepsearch-glm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-deepsearch-glm.yml'
      - 'docs/packages/deepsearch-glm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-deepsearch-glm.yml'
      - 'docs/packages/deepsearch-glm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: deepsearch-glm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build deepsearch-glm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "deepsearch-glm"
      version: "${{ matrix.version }}"
      repository: "docling-project/docling-nlp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 720
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/deepsearch-glm/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The repo-root build.py (poetry's build script) shadows the `build` module under
      # `python -m build`; upstream's cibuildwheel 2.x defaulted to pip.
      cibw-build-frontend: "pip"
      # The C++ dependencies (fmt, json, loguru, cxxopts, pcre2, fasttext, utfcpp,
      # sentencepiece) are fetched by CMake's ExternalProject_Add and statically
      # linked by the build; upstream ships none of their licences.
      cibw-before-build: |-
        curl -fsSL -o {project}/LICENSE.fmt https://raw.githubusercontent.com/fmtlib/fmt/10.2.1/LICENSE
        curl -fsSL -o {project}/LICENSE.json https://raw.githubusercontent.com/nlohmann/json/v3.11.3/LICENSE.MIT
        curl -fsSL -o {project}/LICENSE.loguru https://raw.githubusercontent.com/emilk/loguru/4adaa185883e3c04da25913579c451d3c32cfac1/LICENSE
        curl -fsSL -o {project}/LICENSE.cxxopts https://raw.githubusercontent.com/jarro2783/cxxopts/v3.2.0/LICENSE
        curl -fsSL -o {project}/LICENSE.pcre2 https://raw.githubusercontent.com/PCRE2Project/pcre2/pcre2-10.44/LICENCE
        curl -fsSL -o {project}/LICENSE.fasttext https://raw.githubusercontent.com/PeterStaar-IBM/fastText/9d5b2a2b364f49ed2707ff3be48a0f1ba6d86022/LICENSE
        curl -fsSL -o {project}/LICENSE.utfcpp https://raw.githubusercontent.com/nemtrif/utfcpp/v4.0.5/LICENSE
        curl -fsSL -o {project}/LICENSE.sentencepiece https://raw.githubusercontent.com/google/sentencepiece/v0.2.0/LICENSE
      # fastText and sentencepiece, fetched by ExternalProject_Add, declare
      # cmake_minimum_required below CMake 4's 3.5 floor.
      cibw-environment-linux: "BUILD_THREADS=4 CMAKE_POLICY_VERSION_MINIMUM=3.5"
      # Upstream's own CI never runs its data-driven test suite (tests/test_*.py) on
      # Linux wheels at all - those tests download pretrained NLP models and reference
      # data over the network. Mirror upstream's one Linux-safe check instead (the
      # "Quick test wheel" step it does run on Windows/macOS): the three pybind11
      # extensions import cleanly.
      cibw-test-command: "python -c \"from deepsearch_glm import andromeda_structs, andromeda_nlp, andromeda_glm\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DEEPSEARCH_GLM_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: deepsearch-glm-${{ env.DEEPSEARCH_GLM_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - ./wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for mod in ("andromeda_structs", "andromeda_nlp", "andromeda_glm"):
              assert any(
                  n.startswith(f"deepsearch_glm/{mod}") and n.endswith(".so") for n in names
              ), (mod, names)

          licences = {
              n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n
          } - {""}
          expected = {
              "LICENSE",
              "LICENSE.cxxopts",
              "LICENSE.fasttext",
              "LICENSE.fmt",
              "LICENSE.json",
              "LICENSE.loguru",
              "LICENSE.pcre2",
              "LICENSE.sentencepiece",
              "LICENSE.utfcpp",
          }
          assert licences == expected, sorted(licences)
          EOF

  publish:
    name: Publish deepsearch-glm ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: deepsearch-glm-${{ matrix.version }}-*-manylinux_riscv64
