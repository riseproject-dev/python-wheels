---
# This workflow is based on the `build_binary_wheels` job of
# https://github.com/lark-parser/lark_cython/blob/0.0.17/.github/workflows/tests.yml
name: Build lark-cython wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lark-cython.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lark-cython.yml'
      - 'docs/packages/lark-cython.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lark-cython.yml'
      - 'docs/packages/lark-cython.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lark-cython
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lark-cython ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): a plain cythonize() build links the
        # version-specific ABI. Capped at cp313 to match upstream's own
        # cibuildwheel `build` glob (p38..p313) -- Cython>=3.0,<3.1 (upstream's
        # own pin) has no free-threaded (cp314t) support and wasn't exercised
        # against cp314 upstream either.
        python:
          - "cp312"
          - "cp313"

    env:
      LARK_CYTHON_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lark-cython ${{ env.LARK_CYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lark-parser/lark_cython
          ref: ${{ env.LARK_CYTHON_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import lark_cython; assert lark_cython.__file__" &&
            python -m pytest {project}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith(".so") for n in names), names
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lark-cython-${{ env.LARK_CYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lark-cython ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: lark-cython-${{ matrix.version }}-*-manylinux_riscv64
