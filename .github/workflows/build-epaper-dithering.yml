---
# This workflow is based on: https://github.com/OpenDisplay-org/epaper-dithering/blob/epaper-dithering-v6.1.1/.github/workflows/release.yml
# and https://github.com/OpenDisplay-org/epaper-dithering/blob/epaper-dithering-v6.1.1/.github/workflows/python-test.yml
name: Build epaper-dithering wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/epaper-dithering.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-epaper-dithering.yml'
      - 'docs/packages/epaper-dithering.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-epaper-dithering.yml'
      - 'docs/packages/epaper-dithering.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: epaper-dithering
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build epaper-dithering ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      EPAPER_DITHERING_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout epaper-dithering v${{ env.EPAPER_DITHERING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenDisplay-org/epaper-dithering
          ref: epaper-dithering-v${{ env.EPAPER_DITHERING_VERSION }}
          persist-credentials: false

      # maturin only globs licence files next to pyproject.toml; both live at the repo root.
      - name: Stage licence files
        run: |
          cp LICENSE packages/python/LICENSE
          cp THIRD_PARTY_NOTICES.md packages/python/NOTICE.THIRD_PARTY_NOTICES.md

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: packages/python
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=pillow,numpy
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: packages/python/tests
          CIBW_TEST_COMMAND: python -m pytest packages/python/tests -v --tb=short

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("epaper_dithering/_rs.") and n.endswith(".so") for n in names), names
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE", "NOTICE.THIRD_PARTY_NOTICES.md"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: epaper-dithering-${{ env.EPAPER_DITHERING_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish epaper-dithering ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: epaper-dithering-${{ matrix.version }}-*-manylinux_riscv64
