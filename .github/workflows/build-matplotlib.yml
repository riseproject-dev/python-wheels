---
name: Build matplotlib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/matplotlib.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-matplotlib.yml'
      - 'docs/packages/matplotlib.yaml'
      - '.github/workflows/test-matplotlib.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matplotlib.yml'
      - 'docs/packages/matplotlib.yaml'
      - '.github/workflows/test-matplotlib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Query PyPI + gitlab riscv64 mirror; pick best compatible wheel
  # (`unsafe-best-match` = pip-like). Refuse sdist for dependencies so uv
  # selects the gitlab riscv64 wheel when PyPI lacks one instead of falling
  # back to a source build.
  UV_EXTRA_INDEX_URL: https://gitlab.com/api/v4/projects/riseproject%2Fpython%2Fwheel_builder/packages/pypi/simple
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_ONLY_BINARY: ':all:'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: matplotlib
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build matplotlib ${{ matrix.version }} sdist
    runs-on: ubuntu-24.04-riscv
    permissions:
      contents: read
    env:
      MPL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout matplotlib v${{ env.MPL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: matplotlib/matplotlib
          ref: v${{ env.MPL_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # We need to patch the matplotlib source to increase a threading test
      # timeout for the native runners
      - name: patch matplotlib source
        run: |
          git apply python-wheels/patches/matplotlib/${{ env.MPL_VERSION }}/00*.patch

      # Something changed somewhere that prevents the downloaded-at-build-time
      # licenses from being included in built wheels, so pre-download them so
      # that they exist before the build and are included.
      - name: Pre-download bundled licenses
        run: >
          curl -Lo LICENSE/LICENSE_QHULL
          https://github.com/qhull/qhull/raw/2020.2/COPYING.txt

      - name: Install dependencies
        run: uv pip install build twine

      - name: Build sdist
        id: sdist
        run: |
          python -m build --sdist
          python ci/export_sdist_name.py

      - name: Check README rendering for PyPI
        run: twine check dist/*

      - name: Upload sdist result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: matplotlib-${{ env.MPL_VERSION }}-cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build matplotlib ${{ matrix.version }} wheels for riscv64
    permissions:
      contents: read
    runs-on: ubuntu-24.04-riscv

    env:
      MPL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: matplotlib-${{ env.MPL_VERSION }}-cibw-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build wheels for CPython 3.14
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_BUILD: "cp314-* cp314t-*"
          CIBW_ARCHS: "riscv64"
          # Skip musllinux: upstream matplotlib isn't building it either
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ENVIRONMENT: >-
            UV_EXTRA_INDEX_URL=https://gitlab.com/api/v4/projects/riseproject%2Fpython%2Fwheel_builder/packages/pypi/simple
            UV_INDEX_STRATEGY=unsafe-best-match
            UV_ONLY_BINARY=:all:

      - name: Build wheels for CPython 3.13
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: "riscv64"
          # Skip musllinux: upstream matplotlib isn't building it either
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ENVIRONMENT: >-
            UV_EXTRA_INDEX_URL=https://gitlab.com/api/v4/projects/riseproject%2Fpython%2Fwheel_builder/packages/pypi/simple
            UV_INDEX_STRATEGY=unsafe-best-match
            UV_ONLY_BINARY=:all:

      - name: Build wheels for CPython 3.12
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: "riscv64"
          # Skip musllinux: upstream matplotlib isn't building it either
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ENVIRONMENT: >-
            UV_EXTRA_INDEX_URL=https://gitlab.com/api/v4/projects/riseproject%2Fpython%2Fwheel_builder/packages/pypi/simple
            UV_INDEX_STRATEGY=unsafe-best-match
            UV_ONLY_BINARY=:all:

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: matplotlib-${{ env.MPL_VERSION }}-cibw-wheels-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish matplotlib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: matplotlib-${{ matrix.version }}-*-manylinux_riscv64
