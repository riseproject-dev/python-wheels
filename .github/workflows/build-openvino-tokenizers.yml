---
# Based on upstream's wheel build and its regression tests:
#   https://github.com/openvinotoolkit/openvino_tokenizers/blob/2026.3.1.0/.github/workflows/manylinux_2_28.yml
#   https://github.com/openvinotoolkit/openvino_tokenizers/blob/2026.3.1.0/.github/workflows/linux.yml
name: Build openvino-tokenizers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openvino-tokenizers.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openvino-tokenizers.yml'
      - 'docs/packages/openvino-tokenizers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openvino-tokenizers.yml'
      - 'docs/packages/openvino-tokenizers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openvino-tokenizers
      version: ${{ inputs.version }}

  build_wheels:
    name: Build openvino-tokenizers ${{ matrix.version }} py3-none-manylinux_riscv64
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720

    env:
      OPENVINO_TOKENIZERS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout openvino_tokenizers ${{ env.OPENVINO_TOKENIZERS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: openvinotoolkit/openvino_tokenizers
          ref: ${{ env.OPENVINO_TOKENIZERS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # `python_tag = py3`, `python_abi = none` makes one wheel that serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The build requires openvino, whose riscv64 wheels are ours; cmake~=3.14 otherwise resolves to a 3.31 sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cmake
          # libopenvino and libtbb come from the openvino wheel at run time, as in upstream's wheel.
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair --exclude 'libopenvino.so.*' --exclude 'libtbb.so.*'
            -w {dest_dir} {wheel}
          CIBW_TEST_EXTRAS: transformers
          # Upstream's dev group minus its linters (ruff<=0.12.8 has no riscv64 wheel).
          CIBW_TEST_REQUIRES: >-
            pytest==9.0.3 pytest-xdist>=3.4.0,<=3.8.0 pytest-harvest>=1.10.3,<=1.10.5
            pandas>=2.0.0,<=2.3.3 jinja2>=3.0.0,<=3.1.6
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest tests -n auto

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openvino-tokenizers-${{ matrix.version }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish openvino-tokenizers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: openvino-tokenizers-${{ matrix.version }}-*-manylinux_riscv64
