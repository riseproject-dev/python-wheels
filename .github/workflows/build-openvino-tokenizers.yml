---
# Based on upstream's wheel build and its regression tests:
#   https://github.com/openvinotoolkit/openvino_tokenizers/blob/2026.3.1.0/.github/workflows/manylinux_2_28.yml
#   https://github.com/openvinotoolkit/openvino_tokenizers/blob/2026.3.1.0/.github/workflows/linux.yml
name: Build openvino-tokenizers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openvino-tokenizers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openvino-tokenizers.yml'
      - 'docs/packages/openvino-tokenizers.yaml'
      - 'patches/openvino-tokenizers/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openvino-tokenizers.yml'
      - 'docs/packages/openvino-tokenizers.yaml'
      - 'patches/openvino-tokenizers/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openvino-tokenizers
      version: ${{ inputs.version }}

  build_wheels:
    name: Build openvino-tokenizers ${{ matrix.version }} py3-none-manylinux_riscv64
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "openvino-tokenizers"
      version: "${{ matrix.version }}"
      repository: "openvinotoolkit/openvino_tokenizers"
      ref: "${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 720


      patches: true

      # `python_tag = py3`, `python_abi = none` makes one wheel that serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # The build requires openvino, whose riscv64 wheels are ours; cmake~=3.14 otherwise resolves to a 3.31 sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=cmake"
      # libopenvino and libtbb come from the openvino wheel at run time, as in upstream's wheel.
      cibw-repair-wheel-command: "auditwheel repair --exclude 'libopenvino.so.*' --exclude 'libtbb.so.*' -w {dest_dir} {wheel}"
      cibw-test-extras: "transformers"
      # Upstream's dev group minus its linters (ruff<=0.12.8 has no riscv64 wheel).
      cibw-test-requires: "pytest==9.0.3 pytest-xdist>=3.4.0,<=3.8.0 pytest-harvest>=1.10.3,<=1.10.5 pandas>=2.0.0,<=2.3.3 jinja2>=3.0.0,<=3.1.6"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests -n auto"

  publish:
    name: Publish openvino-tokenizers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: openvino-tokenizers-${{ matrix.version }}-*-manylinux_riscv64
