---
# This workflow is based on the `build-wheels` job of
# https://github.com/slowkow/harmonypy/blob/v2.1.0/.github/workflows/release.yml
name: Build harmonypy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/harmonypy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-harmonypy.yml'
      - 'docs/packages/harmonypy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-harmonypy.yml'
      - 'docs/packages/harmonypy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: harmonypy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build harmonypy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "harmonypy"
      version: "${{ matrix.version }}"
      repository: "slowkow/harmonypy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        set -euo pipefail
        armadillo_url="$(grep -o 'https://sourceforge.net/projects/arma/files/armadillo-[0-9.]*\.tar\.xz' CMakeLists.txt)"
        mkdir "${RUNNER_TEMP}/armadillo"
        curl -fsSL --retry 5 "${armadillo_url}" | tar xJ -C "${RUNNER_TEMP}/armadillo" --strip-components=1
        cp "${RUNNER_TEMP}/armadillo/LICENSE.txt" LICENSE.armadillo
        cp "${RUNNER_TEMP}/armadillo/NOTICE.txt" NOTICE.armadillo
        nanobind_version="$(curl -fsSL --retry 5 https://pypi.org/pypi/nanobind/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
        git clone --depth 1 --branch "v${nanobind_version}" --recurse-submodules --shallow-submodules \
          https://github.com/wjakob/nanobind.git "${RUNNER_TEMP}/nanobind"
        cp "${RUNNER_TEMP}/nanobind/LICENSE" LICENSE.nanobind
        cp "${RUNNER_TEMP}/nanobind/ext/robin_map/LICENSE" LICENSE.robin-map

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      HARMONYPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: harmonypy-${{ env.HARMONYPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert [n for n in names if n.endswith(".so")], names
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.armadillo", "NOTICE.armadillo",
                              "LICENSE.nanobind", "LICENSE.robin-map"}, licences
          EOF

  publish:
    name: Publish harmonypy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: harmonypy-${{ matrix.version }}-*-manylinux_riscv64
