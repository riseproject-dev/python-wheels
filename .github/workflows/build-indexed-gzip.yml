---
# Based on upstream's wheel builder:
#   https://github.com/pauldmccarthy/indexed_gzip/blob/v1.10.3/.github/workflows/release.yaml
#   https://github.com/pauldmccarthy/indexed_gzip/blob/v1.10.3/.ci/build_wheels.sh
name: Build indexed-gzip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/indexed-gzip.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-gzip.yml'
      - 'docs/packages/indexed-gzip.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-gzip.yml'
      - 'docs/packages/indexed-gzip.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: indexed-gzip
      version: ${{ inputs.version }}

  # setup.py computes stable_abi from (interpreter >= 3.11) and Cython >= 3.1,
  # both true here, and hardcodes the wheel tag to cp311-abi3 regardless of
  # which interpreter builds it (options={'bdist_wheel': {'py_limited_api':
  # 'cp311'}}) - the floor is upstream's, not ours (gotcha 34). Building on
  # cp311 and letting cibuildwheel reuse+retest that one wheel on cp312-cp314
  # matches upstream's own single-build recipe (gotcha 96).
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build indexed-gzip ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    # Free-threaded: setup.py forces stable_abi off under Py_GIL_DISABLED, so this
    # is a plain per-interpreter build. cp313t is dropped - cibuildwheel 4.2.0
    # offers no cp313t build identifier on any platform (gotcha 204).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "indexed-gzip"
      version: "${{ matrix.version }}"
      repository: "pauldmccarthy/indexed_gzip"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 90
      cibw-build: >
        cp311-manylinux_riscv64 cp312-manylinux_riscv64
        cp313-manylinux_riscv64 cp314-manylinux_riscv64
      cibw-before-all-linux: "dnf -y install zlib-devel"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "cython pytest numpy nibabel coverage pytest-cov"
      cibw-test-command: >
        python -m indexed_gzip.tests -c {project}/pyproject.toml --no-cov
        -m "not slow_test" -k "not test_zran"

  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build indexed-gzip ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "indexed-gzip"
      version: "${{ matrix.version }}"
      repository: "pauldmccarthy/indexed_gzip"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 90
      cibw-build: "cp314t-manylinux_riscv64"
      cibw-before-all-linux: "dnf -y install zlib-devel"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "cython pytest numpy nibabel coverage pytest-cov"
      cibw-test-command: >
        python -m indexed_gzip.tests -c {project}/pyproject.toml --no-cov
        -m "not slow_test" -k "not test_zran"

  publish:
    name: Publish indexed-gzip ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: indexed-gzip-${{ matrix.version }}-*-manylinux_riscv64
