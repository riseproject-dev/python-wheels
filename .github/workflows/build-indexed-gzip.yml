---
# Based on upstream's wheel builder:
#   https://github.com/pauldmccarthy/indexed_gzip/blob/v1.10.3/.github/workflows/release.yaml
#   https://github.com/pauldmccarthy/indexed_gzip/blob/v1.10.3/.ci/build_wheels.sh
name: Build indexed-gzip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'indexed-gzip version to build (git tag without leading v, e.g. 1.10.3)'
        required: true
        default: '1.10.3'
  pull_request:
    paths:
      - '.github/workflows/build-indexed-gzip.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.10.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.10.3 there.
  INDEXED_GZIP_VERSION: ${{ inputs.version || '1.10.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  # setup.py computes stable_abi from (interpreter >= 3.11) and Cython >= 3.1,
  # both true here, and hardcodes the wheel tag to cp311-abi3 regardless of
  # which interpreter builds it (options={'bdist_wheel': {'py_limited_api':
  # 'cp311'}}) - the floor is upstream's, not ours (gotcha 34). Building on
  # cp311 and letting cibuildwheel reuse+retest that one wheel on cp312-cp314
  # matches upstream's own single-build recipe (gotcha 96).
  build_abi3:
    needs: [setup]
    name: Build indexed-gzip ${{ inputs.version || '1.10.3' }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Checkout indexed_gzip v${{ env.INDEXED_GZIP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pauldmccarthy/indexed_gzip
          ref: v${{ env.INDEXED_GZIP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: >-
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: dnf -y install zlib-devel
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: cython pytest numpy nibabel coverage pytest-cov
          CIBW_TEST_COMMAND: >-
            python -m indexed_gzip.tests -c {project}/pyproject.toml --no-cov
            -m "not slow_test" -k "not test_zran"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: indexed-gzip-${{ env.INDEXED_GZIP_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded: setup.py forces stable_abi off under Py_GIL_DISABLED, so this
  # is a plain per-interpreter build. cp313t is dropped - cibuildwheel 4.2.0
  # offers no cp313t build identifier on any platform (gotcha 204).
  build_freethreaded:
    needs: [setup]
    name: Build indexed-gzip ${{ inputs.version || '1.10.3' }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Checkout indexed_gzip v${{ env.INDEXED_GZIP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pauldmccarthy/indexed_gzip
          ref: v${{ env.INDEXED_GZIP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp314t-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: dnf -y install zlib-devel
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: cython pytest numpy nibabel coverage pytest-cov
          CIBW_TEST_COMMAND: >-
            python -m indexed_gzip.tests -c {project}/pyproject.toml --no-cov
            -m "not slow_test" -k "not test_zran"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: indexed-gzip-${{ env.INDEXED_GZIP_VERSION }}-cp314t-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish indexed-gzip ${{ inputs.version || '1.10.3' }}
    needs: [setup, build_abi3, build_freethreaded]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: indexed-gzip-${{ inputs.version || '1.10.3' }}-*-manylinux_riscv64
