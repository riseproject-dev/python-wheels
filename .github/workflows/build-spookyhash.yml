---
# Based on the `build_wheels` job of
# https://github.com/buhanec/spookyhash/blob/2.1.1/.github/workflows/wheels.yml
name: Build spookyhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spookyhash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spookyhash.yml'
      - 'docs/packages/spookyhash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spookyhash.yml'
      - 'docs/packages/spookyhash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spookyhash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spookyhash ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: spookyhash
      version: ${{ matrix.version }}
      repository: buhanec/spookyhash
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      cibw-test-extras: test
      cibw-test-sources: tests
      # gotcha 97: hypothesis went Rust-abi3 upstream; riscv64 cp314t needs our registry's build,
      # and PIP_ONLY_BINARY keeps pip from preferring a newer PyPI sdist (gotcha 30).
      cibw-test-environment: "PIP_ONLY_BINARY=hypothesis"
      cibw-test-command: >-
        python -c "import _spookyhash; assert _spookyhash.__file__.endswith('.so'), _spookyhash.__file__" &&
        pytest {project}
      timeout-minutes: 60

  publish:
    name: Publish spookyhash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spookyhash-${{ matrix.version }}-*-manylinux_riscv64
