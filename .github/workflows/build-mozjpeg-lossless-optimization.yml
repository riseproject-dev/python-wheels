---
# This workflow is based on upstream's own cibuildwheel-driven
# https://github.com/wanadev/mozjpeg-lossless-optimization/blob/v1.3.2/.github/workflows/python-packages.yml,
# narrowed to Linux riscv64.
name: Build mozjpeg-lossless-optimization wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mozjpeg-lossless-optimization.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mozjpeg-lossless-optimization.yml'
      - 'docs/packages/mozjpeg-lossless-optimization.yaml'
      - 'patches/mozjpeg-lossless-optimization/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mozjpeg-lossless-optimization.yml'
      - 'docs/packages/mozjpeg-lossless-optimization.yaml'
      - 'patches/mozjpeg-lossless-optimization/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mozjpeg-lossless-optimization
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mozjpeg-lossless-optimization ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      MOZJPEG_LOSSLESS_OPTIMIZATION_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mozjpeg-lossless-optimization v${{ env.MOZJPEG_LOSSLESS_OPTIMIZATION_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: wanadev/mozjpeg-lossless-optimization
          ref: v${{ env.MOZJPEG_LOSSLESS_OPTIMIZATION_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # mozjpeg's vendored simd/CMakeLists.txt has no riscv64 kernels and no
          # REQUIRE_SIMD here, so CPU_TYPE falling through to its "none of the above"
          # branch only downgrades to WITH_SIMD=0 with a warning, not a fatal error.
          CIBW_BEFORE_ALL_LINUX: "true"
          CIBW_BEFORE_BUILD: cp {project}/mozjpeg/LICENSE.md {project}/LICENSE.mozjpeg
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; names={p.name for p in m.files('mozjpeg-lossless-optimization') if '.dist-info/licenses/' in str(p)}; assert names == {'LICENSE','LICENSE.mozjpeg'}, names" &&
            python -m pytest tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mozjpeg-lossless-optimization-${{ env.MOZJPEG_LOSSLESS_OPTIMIZATION_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mozjpeg-lossless-optimization ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mozjpeg-lossless-optimization-${{ matrix.version }}-*-manylinux_riscv64
