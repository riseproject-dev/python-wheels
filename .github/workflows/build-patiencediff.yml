---
# Based on upstream's own wheel builder (pyproject.toml's [tool.cibuildwheel] table plus
# https://github.com/breezy-team/patiencediff/blob/master/.github/workflows/wheels.yaml).
# setuptools-rust RustExtension, not maturin; no abi3 (no --py-limited-api), so
# wheels are per-interpreter, same shape as build-cryptg.yml/build-dulwich.yml.
name: Build patiencediff wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/patiencediff.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-patiencediff.yml'
      - 'docs/packages/patiencediff.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-patiencediff.yml'
      - 'docs/packages/patiencediff.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: patiencediff
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build patiencediff ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "patiencediff"
      version: "${{ matrix.version }}"
      repository: "breezy-team/patiencediff"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No Rust in the manylinux image; install it and put cargo on PATH, same
      # as upstream's own CIBW_BEFORE_BUILD (gotcha: manylinux_2_39_riscv64 has
      # no yum libatomic package needed here, unlike cryptg's grammers-crypto).
      cibw-before-build-linux: >
        pip install -U setuptools-rust &&
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --profile=minimal -y &&
        . "$HOME/.cargo/env" && rustup show
      cibw-environment-linux: "CIBUILDWHEEL=1 PATH=\"$PATH:$HOME/.cargo/bin\""
      # Mirrors upstream's own test suite (patiencediff.test_patiencediff), run
      # against the installed wheel rather than the checkout (gotcha 25).
      cibw-test-command: >
        python -m unittest patiencediff.test_patiencediff

  publish:
    name: Publish patiencediff ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: patiencediff-${{ matrix.version }}-*-manylinux_riscv64
