---
# This workflow is based on the `build` job of
# https://github.com/qir-alliance/pyqir/blob/v0.12.6/.github/workflows/ci.yml,
# replaying its `install-llvm-from-source` and `pyqir` psake tasks
# (https://github.com/qir-alliance/pyqir/blob/v0.12.6/eng/psakefile.ps1) as plain
# cargo/maturin invocations, since that workflow drives them through pwsh/psake.
name: Build pyqir wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyqir.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyqir.yml'
      - 'docs/packages/pyqir.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyqir.yml'
      - 'docs/packages/pyqir.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyqir
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyqir ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440  # full LLVM 20 build from source (qirlib's build-llvm feature)
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PYQIR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyqir v${{ env.PYQIR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: qir-alliance/pyqir
          ref: v${{ env.PYQIR_VERSION }}
          persist-credentials: false

      - name: Stage the third-party notices beside pyqir's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory (pyqir/); the
        # repo's own NOTICE-WHEEL.txt (eng's cargo-about task, excluded from the sdist
        # by MANIFEST.in) already carries the LLVM 20.1 notice, so reuse it as-is.
        run: cp pyqir/NOTICE-WHEEL.txt pyqir/LICENSE-THIRD-PARTY-NOTICES.txt

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: pyqir
          output-dir: wheelhouse/
          # pyo3's abi3-py39 feature is on unconditionally (workspace Cargo.toml): built
          # once on cp39 and re-tested on the newer interpreters. Upstream publishes no
          # free-threaded wheel. musllinux is dropped: rustup.rs ships no riscv64 musl
          # toolchain.
          only: cp39-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # qirlib's own CMakeLists.txt (qirlib/CMakeLists.txt) already caps the LLVM
          # build to LLVM_TARGETS_TO_BUILD=Native (just the RISCV backend here, not
          # upstream's own all-targets default) -- there is no equally-scoped riscv64
          # from-source LLVM port in this repo to compare against. Its ExternalProject_Add
          # hardcodes `BUILD_COMMAND ninja` with no job cap, so the usual
          # CMAKE_BUILD_PARALLEL_LEVEL env var (build-circt.yml/build-clangd.yml) has
          # nothing to act on; a PATH-shadowing ninja shim is the only lever, paired with
          # lld the same way those two bound the runner's RAM.
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            dnf -y install ninja-build lld
            mkdir -p /tmp/ninja-shim
            printf '#!/bin/sh\nexec /usr/bin/ninja -j3 "$@"\n' > /tmp/ninja-shim/ninja
            chmod +x /tmp/ninja-shim/ninja
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            cd qirlib
            PATH="/tmp/ninja-shim:$PATH:$HOME/.cargo/bin" LDFLAGS=-fuse-ld=lld \
              QIRLIB_CACHE_DIR=/tmp/qirlib-llvm \
              cargo build --release --no-default-features --features "build-llvm,llvm20-1-no-llvm-linking"
          # qirlib's build.rs locates llvm-config for its own llvm-wrapper C++ glue via
          # QIRLIB_CACHE_DIR, while the llvm-sys-201 crate links LLVM itself via
          # LLVM_SYS_201_PREFIX (gotcha 59: a maturin cargo feature reaches the build
          # through MATURIN_PEP517_ARGS, not a cibuildwheel knob).
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            QIRLIB_CACHE_DIR=/tmp/qirlib-llvm
            LLVM_SYS_201_PREFIX=/tmp/qirlib-llvm
            MATURIN_PEP517_ARGS="--features llvm20-1"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: pyqir/tests
          CIBW_TEST_COMMAND: >-
            python -c "import pyqir._native as m, importlib.metadata as md;
            assert m.__file__.endswith('.so'), m.__file__;
            assert any(str(p).endswith('licenses/LICENSE') for p in md.files('pyqir'))" &&
            cd pyqir/tests &&
            pytest -v

      - name: Check wheel licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE-THIRD-PARTY-NOTICES.txt"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyqir-${{ env.PYQIR_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyqir ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyqir-${{ matrix.version }}-*-manylinux_riscv64
