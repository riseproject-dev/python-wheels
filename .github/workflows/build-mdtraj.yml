---
# This workflow is based on: https://github.com/mdtraj/mdtraj/blob/1.11.1.post2/.github/workflows/build.yaml
# and the test job of: https://github.com/mdtraj/mdtraj/blob/1.11.1.post2/.github/workflows/main.yaml
name: Build mdtraj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mdtraj.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mdtraj.yml'
      - 'docs/packages/mdtraj.yaml'
      - 'patches/mdtraj/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mdtraj.yml'
      - 'docs/packages/mdtraj.yaml'
      - 'patches/mdtraj/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mdtraj
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mdtraj ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mdtraj"
      version: "${{ matrix.version }}"
      repository: "mdtraj/mdtraj"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-fetch-depth: 0
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/mdtraj/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pandas,pyarrow,tables,blosc2,numexpr,ndindex,msgpack,pydantic-core,netcdf4,cftime"
      # Upstream's wheel job only smoke-tests; also run its CI suite against the wheel,
      # with its conda test env minus openmm (no riscv64 build; those tests skip).
      cibw-test-extras: "all"
      # pyparsing 3.3.3 rewrote infix_notation as a shunting-yard parser that takes the
      # first operator in op_list order without backtracking. mdtraj sorts its operators
      # alphabetically, so '>' wins over '>=' and test_binary_selection_operator fails on
      # 'name >= 1' on every arch (x86_64 too, with upstream's PyPI wheel); 3.3.2 passes
      # (gotchas 355, 583). Upstream leaves pyparsing unpinned.
      cibw-test-requires: "gsd>=2.8 pyparsing<3.3.3"
      cibw-test-sources: "tests pyproject.toml"
      # Deselected for riscv64 rounding at a histogram bin edge (gotcha 304), not a wrong
      # result: test_compare_rdf_t_master compares to a reference file that matches the
      # x86 SSE distance kernel bit for bit. riscv64 builds the scalar vectorize_generic.h
      # kernel, and GCC contracts its float32 multiply-adds to fmadd.s, so a few pair
      # distances land across a 0.005 nm bin edge: 18/20000 elements off, as 9 adjacent-bin
      # pairs (e.g. [20,32]/[20,33]). On x86_64,
      # building with -D__NO_INTRINSICS -mfma -ffp-contract=fast gives the same 18
      # elements with the same values; without -mfma it passes; and mdtraj's own numpy
      # path (opt=False) misses this reference file at 10 elements.
      cibw-test-command: "python -c \"import mdtraj; print(mdtraj.__version__)\" && mdconvert -h && mdinspect -h && pytest -n logical --durations=10 tests/ -r fE --color=yes --deselect tests/test_rdf.py::test_compare_rdf_t_master"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MDTRAJ_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mdtraj-${{ env.MDTRAJ_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the licences and the compiled extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so") and ".libs/" not in n}
          assert exts == {"xtc", "trr", "dcd", "dtr", "_rmsd", "_lprmsd", "_geometry", "drid", "neighbors", "neighborlist"}, exts
          assert "mdtraj/core/lib/libtheobald.a" in names, names
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          expected = {"LICENSE", "LICENSE.dtrplugin", "LICENSE.munkres", "LICENSE.openmm", "LICENSE.vmd-plugins", "LICENSE.xdrfile"}
          assert licences == expected, licences
          # -fopenmp makes auditwheel vendor the image's libgomp, hence the gpl_sources job.
          assert any(n.startswith("mdtraj.libs/libgomp") for n in names), [n for n in names if ".libs/" in n]
          EOF

  gpl_sources:
    name: Collect GPL sources for mdtraj ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: mdtraj
      version: ${{ matrix.version }}
      packages: gcc

  publish:
    name: Publish mdtraj ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mdtraj-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: mdtraj-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
