---
# Based on the `wheels` job of
# https://github.com/ntamas/crcmod-plus/blob/2.3.1/.github/workflows/build.yml
# and the tox `testenv` the `build` job runs.
name: Build crcmod-plus wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/crcmod-plus.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-crcmod-plus.yml'
      - 'docs/packages/crcmod-plus.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-crcmod-plus.yml'
      - 'docs/packages/crcmod-plus.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: crcmod-plus
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build crcmod-plus ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py tags every non-free-threaded CPython wheel cp311-abi3, so
          # one build serves them all; the free-threaded build cannot use the
          # limited API. cp313t is dropped: the riscv64 manylinux image ships
          # none.
          - tag: cp311-abi3
            # Built on cp311 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones. The extension parses arguments
            # with "s#", so a wheel compiled against 3.13+ headers raises
            # SystemError on 3.11 and 3.12.
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # Upstream's only [tool.cibuildwheel] setting is
    # `enable = ["cpython-freethreading", "pypy"]`; cibuildwheel 4 removed
    # the free-threading group (it is always on) and refuses to parse it.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "crcmod-plus"
      version: "${{ matrix.version }}"
      repository: "ntamas/crcmod-plus"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      pre-build: "printf '[tool.cibuildwheel]\\n' > cibuildwheel.toml"
      cibw-config-file: "cibuildwheel.toml"
      cibw-build: "${{ matrix.build }}"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import crcmod._crcfunext as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests

  publish:
    name: Publish crcmod-plus ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: crcmod-plus-${{ matrix.version }}-*-manylinux_riscv64
