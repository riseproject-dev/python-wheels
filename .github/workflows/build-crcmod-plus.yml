---
# Based on the `wheels` job of
# https://github.com/ntamas/crcmod-plus/blob/2.3.1/.github/workflows/build.yml
# and the tox `testenv` the `build` job runs.
name: Build crcmod-plus wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'crcmod-plus version/tag to build (e.g. 2.3.1)'
        required: true
        default: '2.3.1'
  pull_request:
    paths:
      - '.github/workflows/build-crcmod-plus.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.3.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CRCMOD_PLUS_VERSION: ${{ inputs.version || '2.3.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build crcmod-plus ${{ inputs.version || '2.3.1' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup.py tags every non-free-threaded CPython wheel cp311-abi3, so
          # one build serves them all; the free-threaded build cannot use the
          # limited API. cp313t is dropped: the riscv64 manylinux image ships
          # none.
          - tag: cp311-abi3
            # Built on cp311 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones. The extension parses arguments
            # with "s#", so a wheel compiled against 3.13+ headers raises
            # SystemError on 3.11 and 3.12.
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout crcmod-plus ${{ env.CRCMOD_PLUS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ntamas/crcmod-plus
          ref: ${{ env.CRCMOD_PLUS_VERSION }}
          persist-credentials: false

      - name: Write a cibuildwheel config without upstream's `enable` groups
        # Upstream's only [tool.cibuildwheel] setting is
        # `enable = ["cpython-freethreading", "pypy"]`; cibuildwheel 4 removed
        # the free-threading group (it is always on) and refuses to parse it.
        run: printf '[tool.cibuildwheel]\n' > "$RUNNER_TEMP/cibuildwheel.toml"

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          config-file: ${{ runner.temp }}/cibuildwheel.toml
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import crcmod._crcfunext as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crcmod-plus-${{ env.CRCMOD_PLUS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish crcmod-plus ${{ inputs.version || '2.3.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: crcmod-plus-${{ inputs.version || '2.3.1' }}-*-manylinux_riscv64
