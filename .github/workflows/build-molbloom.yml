---
# This workflow is based on upstream's own .github/workflows/build.yml,
# narrowed to riscv64.
name: Build molbloom wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/molbloom.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-molbloom.yml'
      - 'docs/packages/molbloom.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-molbloom.yml'
      - 'docs/packages/molbloom.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: molbloom
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build molbloom ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      MOLBLOOM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout molbloom v${{ env.MOLBLOOM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: whitead/molbloom
          ref: v${{ env.MOLBLOOM_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # molbloom imports rdkit at module import time; rdkit's own riscv64
          # wheels on our registry only go back to cp312 (same floor as numpy
          # and Pillow, rdkit's own runtime deps), so cp311 builds but isn't tested.
          CIBW_TEST_SKIP: "cp311-*"
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,pillow,rdkit
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # test_example/test_common/test_alot/test_fpr/test_all_catalogs each
          # also exercise the "zinc20"/"zinc-instock"/"surechembl" catalogs,
          # which _load_big_filter() downloads from Dropbox on first use
          # (hundreds of MB, outside GitHub); kept to the bundled
          # zinc-instock-mini catalog so CI doesn't fetch gigabytes from a
          # third-party host on every run.
          CIBW_TEST_COMMAND: >-
            python -m pytest {project}/tests
            --deselect tests/test_molbloom.py::test_example
            --deselect tests/test_molbloom.py::test_common
            --deselect tests/test_molbloom.py::test_alot
            --deselect tests/test_molbloom.py::test_fpr
            --deselect tests/test_molbloom.py::test_all_catalogs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: molbloom-${{ env.MOLBLOOM_VERSION }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish molbloom ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: molbloom-${{ matrix.version }}-manylinux_riscv64
