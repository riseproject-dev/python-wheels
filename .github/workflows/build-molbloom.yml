---
# This workflow is based on upstream's own .github/workflows/build.yml,
# narrowed to riscv64.
name: Build molbloom wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/molbloom.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-molbloom.yml'
      - 'docs/packages/molbloom.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-molbloom.yml'
      - 'docs/packages/molbloom.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: molbloom
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build molbloom ${{ matrix.version }} manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: molbloom
      version: ${{ matrix.version }}
      repository: whitead/molbloom
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      cibw-build: "cp311-* cp312-* cp313-*"
      cibw-skip: "*-musllinux_*"
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # molbloom imports rdkit at module import time; rdkit's own riscv64
      # wheels on our registry only go back to cp312 (same floor as numpy
      # and Pillow, rdkit's own runtime deps), so cp311 builds but isn't tested.
      cibw-test-skip: "cp311-*"
      cibw-test-environment: PIP_ONLY_BINARY=numpy,pillow,rdkit
      cibw-test-requires: pytest
      cibw-test-sources: tests
      # test_example/test_common/test_alot/test_fpr/test_all_catalogs each
      # also exercise the "zinc20"/"zinc-instock"/"surechembl" catalogs,
      # which _load_big_filter() downloads from Dropbox on first use
      # (hundreds of MB, outside GitHub); kept to the bundled
      # zinc-instock-mini catalog so CI doesn't fetch gigabytes from a
      # third-party host on every run.
      cibw-test-command: >-
        python -m pytest {project}/tests
        --deselect tests/test_molbloom.py::test_example
        --deselect tests/test_molbloom.py::test_common
        --deselect tests/test_molbloom.py::test_alot
        --deselect tests/test_molbloom.py::test_fpr
        --deselect tests/test_molbloom.py::test_all_catalogs

  publish:
    name: Publish molbloom ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: molbloom-${{ matrix.version }}-manylinux_riscv64
