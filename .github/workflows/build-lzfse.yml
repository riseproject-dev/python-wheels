---
# This workflow is based on: https://github.com/m1stadev/lzfse/blob/v0.4.2/.github/workflows/pypi-build-publish.yml
name: Build lzfse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lzfse.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lzfse.yml'
      - 'docs/packages/lzfse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lzfse.yml'
      - 'docs/packages/lzfse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lzfse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lzfse ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      LZFSE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lzfse ${{ env.LZFSE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: m1stadev/lzfse
          ref: v${{ env.LZFSE_VERSION }}
          # The Apple LZFSE reference implementation is a submodule, compiled into the extension.
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; f = {p.name for p in m.files('lzfse') if '.dist-info/licenses/' in str(p)}; assert f == {'AUTHORS', 'COPYING', 'LICENSE.lzfse'}, f;
            import lzfse; assert lzfse.__file__.endswith('.so'), lzfse.__file__;
            data = b'hello world' * 1000;
            assert lzfse.decompress(lzfse.compress(data)) == data"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lzfse-${{ env.LZFSE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lzfse ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: lzfse-${{ matrix.version }}-*-manylinux_riscv64
