---
# This workflow is based on: https://github.com/m1stadev/lzfse/blob/v0.4.2/.github/workflows/pypi-build-publish.yml
name: Build lzfse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lzfse.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lzfse.yml'
      - 'docs/packages/lzfse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lzfse.yml'
      - 'docs/packages/lzfse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lzfse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lzfse ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: lzfse
      version: ${{ matrix.version }}
      # The Apple LZFSE reference implementation is a submodule, compiled into the extension.
      repository: m1stadev/lzfse
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-command: >-
        python -c "import importlib.metadata as m; f = {p.name for p in m.files('lzfse') if '.dist-info/licenses/' in str(p)}; assert f == {'AUTHORS', 'COPYING', 'LICENSE.lzfse'}, f;
        import lzfse; assert lzfse.__file__.endswith('.so'), lzfse.__file__;
        data = b'hello world' * 1000;
        assert lzfse.decompress(lzfse.compress(data)) == data"
      timeout-minutes: 60

  publish:
    name: Publish lzfse ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lzfse-${{ matrix.version }}-*-manylinux_riscv64
