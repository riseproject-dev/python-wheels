---
# Based on upstream's own wheel build:
#   https://github.com/osvenskan/posix_ipc/blob/rel1.3.2/.github/workflows/build-wheels.yaml
name: Build posix-ipc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'posix-ipc version/tag to build (git tag without leading rel, e.g. 1.3.2)'
        required: true
        default: '1.3.2'
  pull_request:
    paths:
      - '.github/workflows/build-posix-ipc.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.3.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  POSIX_IPC_VERSION: ${{ inputs.version || '1.3.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build posix-ipc ${{ inputs.version || '1.3.2' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout posix_ipc rel${{ env.POSIX_IPC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: osvenskan/posix_ipc
          ref: rel${{ env.POSIX_IPC_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python -m unittest discover --start-directory {package}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: posix-ipc-${{ env.POSIX_IPC_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish posix-ipc ${{ inputs.version || '1.3.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: posix-ipc-${{ inputs.version || '1.3.2' }}-*riscv64
