---
# This workflow is based on the `test`/`release-linux` jobs of
# https://github.com/woodruffw/pyrage/blob/v1.4.0/.github/workflows/ci.yml and
# https://github.com/woodruffw/pyrage/blob/v1.4.0/.github/workflows/release.yml
name: Build pyrage wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyrage version to build (git tag without the leading v, e.g. 1.4.0)'
        required: true
        default: '1.4.0'
  pull_request:
    paths:
      - '.github/workflows/build-pyrage.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.4.0 there.
  PYRAGE_VERSION: ${{ inputs.version || '1.4.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyrage ${{ inputs.version || '1.4.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          - tag: cp310-abi3
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout pyrage v${{ env.PYRAGE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: woodruffw/pyrage
          ref: v${{ env.PYRAGE_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyrage ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest parameterized
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: >-
            python -c "import pyrage as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyrage-${{ env.PYRAGE_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyrage ${{ inputs.version || '1.4.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyrage-${{ inputs.version || '1.4.0' }}-*-manylinux_riscv64
