---
# This workflow is based on the `test`/`release-linux` jobs of
# https://github.com/woodruffw/pyrage/blob/v1.4.0/.github/workflows/ci.yml and
# https://github.com/woodruffw/pyrage/blob/v1.4.0/.github/workflows/release.yml
name: Build pyrage wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrage.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrage.yml'
      - 'docs/packages/pyrage.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrage.yml'
      - 'docs/packages/pyrage.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrage
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyrage ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter up to cp314 (abi3 wheels are
          # forward-compatible; only the cp310 build actually compiles).
          # cp314t is dropped (gotcha 322): v1.4.0's Cargo.lock pins pyo3
          # 0.24.2, whose build script hard-errors "configured Python
          # interpreter version (3.14) is newer than PyO3's maximum
          # supported version (3.13)" for any non-abi3 (free-threaded)
          # build. Bumping pyo3 needs a pyo3-file bump too and then breaks
          # on pyo3 0.29's Python::with_gil -> try_attach rename across
          # every src/*.rs file - too invasive for this port; upstream
          # fixed this on main post-v1.4.0 by bumping to pyo3 0.29.2.
          - tag: cp310-abi3
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyrage"
      version: "${{ matrix.version }}"
      repository: "woodruffw/pyrage"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # pyrage ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest parameterized"
      cibw-test-sources: "test"
      # No python-source in pyproject.toml, so maturin ships an auto-generated
      # pyrage/__init__.py shim around the compiled pyrage/pyrage.*.so submodule
      # (gotcha 314) - probe that submodule, not the top-level import.
      cibw-test-command: >
        python -c "import pyrage.pyrage as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v test

  publish:
    name: Publish pyrage ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyrage-${{ matrix.version }}-*-manylinux_riscv64
