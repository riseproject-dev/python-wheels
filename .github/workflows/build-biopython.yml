---
# This workflow is based on the `build_wheels` and `test_macos` jobs of
# https://github.com/biopython/biopython/blob/biopython-188/.github/workflows/ci.yml
name: Build biopython wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/biopython.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-biopython.yml'
      - 'docs/packages/biopython.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-biopython.yml'
      - 'docs/packages/biopython.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: biopython
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build biopython ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "biopython"
      version: "${{ matrix.version }}"
      repository: "biopython/biopython"
      ref: ''
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: |-
        echo "BIOPYTHON_TAG=biopython-${BIOPYTHON_VERSION//./}" >> "$GITHUB_ENV"
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        git fetch -q --no-tags origin "${BIOPYTHON_TAG}"
        git checkout -q --detach FETCH_HEAD
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # run_tests.py enumerates doctest modules by walking `Tests/..` and some
      # tests open data through `../Bio` and `../Doc`, so reproduce upstream's
      # checkout layout around Tests/. Nothing here shadows the wheel: every
      # command runs from Tests/, which is what lands on sys.path[0].
      cibw-test-sources: "Tests Bio BioSQL Doc"
      # Upstream's macOS/Windows test jobs install only numpy; setuptools is
      # imported by run_tests.py itself.
      cibw-test-requires: "numpy setuptools"
      cibw-test-command: "cd Tests && python -c \"import importlib; [importlib.import_module(m) for m in ('Bio.Align._aligncore', 'Bio.Align._alignmentcounts', 'Bio.Align._codonaligner', 'Bio.Align._pairwisealigner', 'Bio.Align.substitution_matrices._arraycore', 'Bio.cpairwise2', 'Bio.Nexus.cnexus', 'Bio.motifs._pwm', 'Bio.Cluster._cluster', 'Bio.PDB.ccealign', 'Bio.PDB.kdtrees', 'Bio.PDB._bcif_helper', 'Bio.SeqIO._twoBitIO')]\" && python run_tests.py --offline"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BIOPYTHON_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: biopython-${{ env.BIOPYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the C extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".so")]
              assert len(names) == 13, (whl, names)
              print(whl, "ok")
          EOF

  publish:
    name: Publish biopython ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: biopython-${{ matrix.version }}-*-manylinux_riscv64
