---
# This workflow is based on: https://github.com/pyomeca/ezc3d/blob/Release_1.7.2/.github/workflows/publish_to_pypi.yml
# and https://github.com/pyomeca/ezc3d/blob/Release_1.7.2/.github/workflows/run_tests.yml
name: Build ezc3d wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ezc3d.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ezc3d.yml'
      - 'docs/packages/ezc3d.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ezc3d.yml'
      - 'docs/packages/ezc3d.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ezc3d
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ezc3d ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      EZC3D_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ezc3d ${{ env.EZC3D_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyomeca/ezc3d
          ref: Release_${{ env.EZC3D_VERSION }}
          submodules: true
          persist-credentials: false

      # upstream's test/CMakeLists.txt fetches these only for its CMake test build
      - name: Fetch c3d test files
        run: |
          mkdir -p test/c3dTestFiles
          curl -fsSL https://github.com/pyomeca/ezc3d-testFiles/archive/e40a8f8e84769dfe397404d3d8522aa69ba8fb02.tar.gz \
            | tar -xz --strip-components=1 -C test/c3dTestFiles

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          config-file: "pyproject.toml"
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: >-
            rm -rf _skbuild
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_SOURCES: test
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -v --color=yes test/python3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ezc3d-${{ env.EZC3D_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ezc3d ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ezc3d-${{ matrix.version }}-*-manylinux_riscv64
