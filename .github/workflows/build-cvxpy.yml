---
# This workflow is based on: https://github.com/cvxpy/cvxpy/blob/v1.9.3/.github/workflows/build.yml
name: Build cvxpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cvxpy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cvxpy.yml'
      - 'docs/packages/cvxpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cvxpy.yml'
      - 'docs/packages/cvxpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cvxpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cvxpy ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cp314t is dropped: sparsediffpy, scs and highspy, all hard runtime
        # dependencies, have no free-threaded riscv64 wheel.
        python: ["cp312", "cp313", "cp314"]

    env:
      CVXPY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cvxpy v${{ env.CVXPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cvxpy/cvxpy
          ref: v${{ env.CVXPY_VERSION }}
          persist-credentials: false

      # cvxpy/cvxcore/include/Eigen (Eigen 3.4.0) is compiled into _cvxcore but
      # vendored without its licence; stage it for the default COPYING* glob.
      - name: Stage the vendored dependency's licence
        run: curl -fsSL --retry 5 https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2 -o COPYING.eigen

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,osqp,clarabel,scs,highspy,qdldl,sparsediffpy
          CIBW_TEST_REQUIRES: pytest hypothesis scs clarabel osqp highspy
          # test_max: SCS's DQCP bisection lands on 0.858 (expected 0.1715) on riscv64 only; the
          # same scs 3.3.1 passes on x86_64. test_nd_broadcast_generated: hypothesis 200ms deadline.
          CIBW_TEST_COMMAND: >-
            python -c "import cvxpy; print(cvxpy.installed_solvers())" &&
            python -m pytest --pyargs cvxpy.tests
            -k "not (TestDqcp and test_max) and not test_nd_broadcast_generated"

      - name: Check the wheel ships the extension and all licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_cvxcore.") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "COPYING.eigen"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cvxpy-${{ env.CVXPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cvxpy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cvxpy-${{ matrix.version }}-*-manylinux_riscv64
