---
# This workflow is based on the `manylinux` job of
# https://github.com/gevent/gevent/blob/26.8.0/.github/workflows/ci.yml and the
# scripts/releases/make-manylinux script it runs.
name: Build gevent wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gevent.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gevent.yml'
      - 'docs/packages/gevent.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gevent.yml'
      - 'docs/packages/gevent.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gevent
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gevent ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gevent"
      version: "${{ matrix.version }}"
      repository: "gevent/gevent"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/gevent/${{ matrix.version }}/00*.patch

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "yum -y install libffi-devel"
      # As in make-manylinux: NO_CYTHON_COMPILE keeps Cython, which has no riscv64
      # binary wheel, from compiling its own accelerators here; TRAVIS is how it tells
      # setup.py it is on CI, which makes the c-ares extension required, not optional.
      cibw-environment-linux: "NO_CYTHON_COMPILE=true CI=1 TRAVIS=true"
      cibw-test-extras: "test"
      # The monkey-patched stdlib tests live in src/greentest and are found by climbing
      # to setup.py, so both have to be staged or the runner just warns and skips them
      # (17 of 86 test commands). src/gevent stays out so the wheel is what is imported.
      cibw-test-sources: "setup.py src/greentest examples"
      # GEVENT_MANYLINUX is test-only: during the build it makes setup.py assume
      # c-ares was already configured by a separate step, which we don't have.
      cibw-test-environment: "GEVENT_MANYLINUX=1 GEVENT_MANYLINUX_NAME=manylinux_2_39_riscv64 GEVENT_LOOP=libev-cext GEVENTTEST_USE_RESOURCES=-network PYTHONHASHSEED=8675309"
      cibw-test-command: "python -c \"import gevent; print(gevent, gevent.__version__)\" && python -c \"import gevent.core; print('default loop', gevent.core.loop)\" && GEVENT_LOOP=libuv python -c \"import gevent.core; print('libuv loop', gevent.core.loop)\" && GEVENT_LOOP=libev-cffi python -c \"import gevent.core; print('libev-cffi loop', gevent.core.loop)\" && python -c \"import gevent.ares; print('ares', gevent.ares)\" && python -c \"import importlib.metadata as m; f=[str(p) for p in m.files('gevent')]; missing=[n for n in ('licenses/LICENSE','licenses/NOTICE','licenses/deps/c-ares/LICENSE.md','licenses/deps/libev/LICENSE','licenses/deps/libuv/LICENSE','licenses/deps/libuv/LICENSE-extra') if not any(s.endswith(n) for s in f)]; assert not missing, missing\" && python -m gevent.tests --second-chance"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GEVENT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gevent-${{ env.GEVENT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          # gevent.resolver.cares is declared optional unless setup.py detects it is
          # running on CI from a checkout, so a failed build silently drops it.
          expected = (
              'gevent/libev/corecext', 'gevent/libev/_corecffi',
              'gevent/libuv/_corecffi', 'gevent/resolver/cares',
              'gevent/_gevent_cgreenlet', 'gevent/_gevent_cqueue',
          )
          for whl in sys.argv[1:]:
              sos = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith('.so')]
              missing = [e for e in expected if not any(n.startswith(e) for n in sos)]
              assert not missing, (whl, missing, sos)
              print(whl, len(sos), 'extension modules ok')
          EOF

  publish:
    name: Publish gevent ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gevent-${{ matrix.version }}-*-manylinux_riscv64
