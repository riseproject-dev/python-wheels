---
# Based on the Linux build/test jobs of
# https://github.com/letmaik/pyvirtualcam/blob/v0.15.0/.github/workflows/ci.yml
name: Build pyvirtualcam wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvirtualcam.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvirtualcam.yml'
      - 'docs/packages/pyvirtualcam.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvirtualcam.yml'
      - 'docs/packages/pyvirtualcam.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvirtualcam
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyvirtualcam ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no cp314t wheel either (pybind11, not abi3 - every
        # interpreter needs its own build).
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    env:
      PYVIRTUALCAM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyvirtualcam v${{ env.PYVIRTUALCAM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: letmaik/pyvirtualcam
          ref: v${{ env.PYVIRTUALCAM_VERSION }}
          submodules: true
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # virtual_output.h pulls in linux/videodev2.h (the standard kernel
          # UAPI header, not a v4l2loopback one - no kernel module needed to
          # build); manylinux already has it via glibc-devel, musllinux's
          # Alpine base needs linux-headers.
          CIBW_BEFORE_ALL_LINUX: (command -v apk && apk add linux-headers) || true
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_SOURCES: test
          CIBW_TEST_REQUIRES: pytest
          # Upstream's own test-linux.sh disables the whole suite on Linux:
          # every test but test_util.py opens a real Camera(), which needs the
          # v4l2loopback kernel module loaded and a device node present,
          # neither available on the build runner. Run the one test that
          # doesn't, and exercise the compiled extension's real device-open
          # error path instead (gpiod/spidev pattern).
          CIBW_TEST_COMMAND: |
            set -e
            python -m pytest {project}/test/test_util.py -v
            python3 - <<'PYEOF'
            import pyvirtualcam
            try:
                pyvirtualcam.Camera(width=640, height=480, fps=20)
            except RuntimeError as e:
                assert 'v4l2loopback' in str(e), e
            else:
                raise SystemExit('expected RuntimeError: no v4l2loopback device')
            PYEOF

      - name: Verify the wheel ships the compiled extension and licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("_native_linux_v4l2loopback" in n and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyvirtualcam-${{ env.PYVIRTUALCAM_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyvirtualcam ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyvirtualcam-${{ matrix.version }}-*riscv64
