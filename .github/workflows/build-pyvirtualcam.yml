---
# Based on the Linux build/test jobs of
# https://github.com/letmaik/pyvirtualcam/blob/v0.15.0/.github/workflows/ci.yml
name: Build pyvirtualcam wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvirtualcam.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvirtualcam.yml'
      - 'docs/packages/pyvirtualcam.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvirtualcam.yml'
      - 'docs/packages/pyvirtualcam.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvirtualcam
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyvirtualcam ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyvirtualcam"
      version: "${{ matrix.version }}"
      repository: "letmaik/pyvirtualcam"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # virtual_output.h pulls in linux/videodev2.h (the standard kernel
      # UAPI header, not a v4l2loopback one - no kernel module needed to
      # build); manylinux already has it via glibc-devel, musllinux's
      # Alpine base needs linux-headers.
      cibw-before-all-linux: "(command -v apk && apk add linux-headers) || true"
      cibw-test-sources: "test"
      cibw-test-requires: "pytest"
      # Upstream's own test-linux.sh disables the whole suite on Linux:
      # every test but test_util.py opens a real Camera(), which needs the
      # v4l2loopback kernel module loaded and a device node present,
      # neither available on the build runner. Run the one test that
      # doesn't, and exercise the compiled extension's real device-open
      # error path instead (gpiod/spidev pattern).
      cibw-test-command: |-
        set -e
        python -m pytest {project}/test/test_util.py -v
        python3 - <<'PYEOF'
        import pyvirtualcam
        try:
        pyvirtualcam.Camera(width=640, height=480, fps=20)
        except RuntimeError as e:
        assert 'v4l2loopback' in str(e), e
        else:
        raise SystemExit('expected RuntimeError: no v4l2loopback device')
        PYEOF
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYVIRTUALCAM_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyvirtualcam-${{ env.PYVIRTUALCAM_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extension and licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("_native_linux_v4l2loopback" in n and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyvirtualcam ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyvirtualcam-${{ matrix.version }}-*riscv64
