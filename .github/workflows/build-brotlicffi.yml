---
# Based on the `package-wheel` job of
# https://github.com/python-hyper/brotlicffi/blob/v1.2.0.2/.github/workflows/ci.yml
name: Build brotlicffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'brotlicffi version to build (git tag without leading v, e.g. 1.2.0.2)'
        required: true
        default: '1.2.0.2'
  pull_request:
    paths:
      - '.github/workflows/build-brotlicffi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.2.0.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.2.0.2 there.
  BROTLICFFI_VERSION: ${{ inputs.version || '1.2.0.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build brotlicffi ${{ inputs.version || '1.2.0.2' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Upstream's `CIBW_BUILD: cp39-* pp*-* cp314t-*`, without PyPy. musllinux
        # is dropped because upstream skips it too.
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version,
          # so cp39 is what reproduces upstream's cp39-abi3 filename; the newer
          # interpreters re-test that one wheel via find_compatible_wheel.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # Free-threaded builds get a per-interpreter wheel: setup.py skips the
          # limited API under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout brotlicffi v${{ env.BROTLICFFI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: python-hyper/brotlicffi
          ref: v${{ env.BROTLICFFI_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The extension statically links the bundled libbrotli C sources, whose MIT
      # terms want the notice to travel with the binary; upstream's wheel carries
      # only brotlicffi's own LICENSE.
      - name: Patch brotlicffi source
        run: |
          git apply python-wheels/patches/brotlicffi/${{ env.BROTLICFFI_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD_LINUX: yum install -y libffi-devel
          # cffi, needed to build and to import the extension, has no riscv64
          # wheel on PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream tests its wheels in a separate tox job; test_requirements.txt
          # minus pytest-cov, which measures nothing on an installed wheel.
          CIBW_TEST_REQUIRES: pytest hypothesis
          # conftest.py reads the Brotli fixtures from the submodule and
          # test_compatibility.py reads its version header, both relative to the
          # project root; setup.cfg carries the pytest config.
          CIBW_TEST_SOURCES: >-
            test setup.cfg libbrotli/tests/testdata
            libbrotli/c/common/version.h
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; l = sorted(str(p).split('licenses/', 1)[1] for p in m.files('brotlicffi') if str(p).endswith('LICENSE')); assert l == ['LICENSE', 'libbrotli/LICENSE'], l"
            && python -bb -m pytest test/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: brotlicffi-${{ env.BROTLICFFI_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish brotlicffi ${{ inputs.version || '1.2.0.2' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: brotlicffi-${{ env.BROTLICFFI_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
