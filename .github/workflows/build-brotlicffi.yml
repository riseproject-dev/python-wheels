---
# Based on the `package-wheel` job of
# https://github.com/python-hyper/brotlicffi/blob/v1.2.0.2/.github/workflows/ci.yml
name: Build brotlicffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/brotlicffi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-brotlicffi.yml'
      - 'docs/packages/brotlicffi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brotlicffi.yml'
      - 'docs/packages/brotlicffi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: brotlicffi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build brotlicffi ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's `CIBW_BUILD: cp39-* pp*-* cp314t-*`, without PyPy. musllinux
        # is dropped because upstream skips it too.
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version,
          # so cp39 is what reproduces upstream's cp39-abi3 filename; the newer
          # interpreters re-test that one wheel via find_compatible_wheel.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # Free-threaded builds get a per-interpreter wheel: setup.py skips the
          # limited API under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "brotlicffi"
      version: "${{ matrix.version }}"
      repository: "python-hyper/brotlicffi"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"

      # The extension statically links the bundled libbrotli C sources, whose MIT
      # terms want the notice to travel with the binary; upstream's wheel carries
      # only brotlicffi's own LICENSE.
      patches: true

      cibw-build: "${{ matrix.build }}"
      cibw-before-build-linux: "yum install -y libffi-devel"
      # cffi, needed to build and to import the extension, has no riscv64
      # wheel on PyPI.
      # Recent hypothesis releases are compiled (Rust) and ship no
      # py3-none-any wheel; their riscv64 wheel is cp311-abi3 only, so on
      # cp314t pip falls back to the sdist, which needs a Rust toolchain
      # rustup cannot install on riscv64. Wheel-only makes pip back off to
      # the newest release that still has a usable (pure-Python) wheel.
      cibw-test-environment: "PIP_ONLY_BINARY=hypothesis"
      # Upstream tests its wheels in a separate tox job; test_requirements.txt
      # minus pytest-cov, which measures nothing on an installed wheel.
      cibw-test-requires: "pytest hypothesis"
      # conftest.py reads the Brotli fixtures from the submodule and
      # test_compatibility.py reads its version header, both relative to the
      # project root; setup.cfg carries the pytest config.
      cibw-test-sources: "test setup.cfg libbrotli/tests/testdata libbrotli/c/common/version.h"
      cibw-test-command: "python -c \"import importlib.metadata as m; l = sorted(str(p).split('licenses/', 1)[1] for p in m.files('brotlicffi') if str(p).endswith('LICENSE')); assert l == ['LICENSE', 'libbrotli/LICENSE'], l\" && python -bb -m pytest test/"

  publish:
    name: Publish brotlicffi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: brotlicffi-${{ matrix.version }}-*-manylinux_riscv64
