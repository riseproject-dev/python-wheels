---
# This workflow is based on: https://github.com/pycompression/python-isal/blob/v1.8.0/.github/workflows/ci.yml
name: Build isal wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/isal.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-isal.yml'
      - 'docs/packages/isal.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-isal.yml'
      - 'docs/packages/isal.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: isal
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build isal ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: isal
      version: ${{ matrix.version }}
      repository: pycompression/python-isal
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment: CFLAGS="-O3 -DNDEBUG"
      cibw-test-requires: pytest
      # Mirrors upstream's own deploy-job CIBW_TEST_COMMAND_LINUX.
      cibw-test-command: >-
        pytest -v {project}/tests/test_igzip.py
        {project}/tests/test_gzip_compliance.py
        {project}/tests/test_zlib_compliance.py
        {project}/tests/test_igzip_lib.py
        -k 'not test_compress_decompress'

  publish:
    name: Publish isal ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: isal-${{ matrix.version }}-*-manylinux_riscv64
