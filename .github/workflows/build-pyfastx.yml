---
# Based on upstream's wheel builder:
#   https://github.com/lmdu/pyfastx/blob/2.3.1/.github/workflows/wheel.yml
name: Build pyfastx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyfastx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfastx.yml'
      - 'docs/packages/pyfastx.yaml'
      - 'patches/pyfastx/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfastx.yml'
      - 'docs/packages/pyfastx.yaml'
      - 'patches/pyfastx/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyfastx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyfastx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyfastx"
      version: "${{ matrix.version }}"
      repository: "lmdu/pyfastx"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyfastx/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pyfaidx==0.5.8 pytest"
      # Not upstream's `setup.py build_ext -i && pytest {project}/tests`:
      # tests/ is a package, so pytest would put {project} on sys.path
      # ahead of site-packages and import that in-place rebuild instead
      # of the wheel just installed (gotcha 25). test_fasta.py also reads
      # src/version.h directly, so src/ is staged alongside tests/.
      cibw-test-sources: "tests src"
      cibw-test-command: "python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYFASTX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyfastx-${{ env.PYFASTX_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and every vendored licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyfastx.") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.zlib", "LICENSE.sqlite3", "LICENSE.indexed_gzip"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyfastx ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyfastx-${{ matrix.version }}-*-manylinux_riscv64
