---
# minimap2 has no wheel workflow (https://github.com/lh3/minimap2/blob/v2.31/.github/workflows/ci.yaml
# only compiles the CLI), so this builds mappy from the tagged setup.py with cibuildwheel.
name: Build mappy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mappy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mappy.yml'
      - 'docs/packages/mappy.yaml'
      - 'patches/mappy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mappy.yml'
      - 'docs/packages/mappy.yaml'
      - 'patches/mappy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mappy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mappy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mappy"
      version: "${{ matrix.version }}"
      repository: "lh3/minimap2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "lib/simde"
        git init -q "lib/simde"
        git -C "lib/simde" remote add origin "${GITHUB_SERVER_URL}/simd-everywhere/simde.git"
        git -C "lib/simde" fetch -q --no-tags --depth=1 origin "v0.8.2"
        git -C "lib/simde" checkout -q --detach FETCH_HEAD

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/mappy/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp lib/simde/COPYING COPYING.simde
        cat > test/check_mappy.py <<'EOF'
        import hashlib, sys
        import mappy as mp

        t = sys.argv[1]
        cases = [
            (None, "MT-human.fa", "MT-orang.fa"),
            ("asm5", "MT-human.fa", "MT-orang.fa"),
            ("asm20", "MT-human.fa", "MT-orang.fa"),
            ("map-ont", "MT-human.fa", "MT-orang.fa"),
            ("splice", "x3s-ref.fa", "x3s-qry.fa"),
            (None, "t-inv.fa", "q-inv.fa"),
            (None, "t2.fa", "q2.fa"),
            ("sr", "MT-human.fa", "MT-orang.fa"),
        ]
        out = []
        for preset, ref, qry in cases:
            aligner = mp.Aligner(f"{t}/{ref}", preset=preset, extra_flags=0x4000000 if preset == "splice" else 0)
            assert aligner, (preset, ref)
            for name, seq, qual in mp.fastx_read(f"{t}/{qry}"):
                for h in aligner.map(seq, cs=True, MD=True):
                    out.append(f"{preset}\t{name}\t{h}\t{h.mapq}\t{h.NM}\t{h.cs}\t{h.MD}\t{h.trans_strand}")
        print("\n".join(out))
        first = next(line for line in out if line.startswith("None\tMT_orang\t")).split("\t")
        assert first[2:12] == ["0", "16025", "+", "MT_human", "16569", "576", "16569", "13773", "16095", "60"], first[:12]
        digest = hashlib.sha256("\n".join(out).encode()).hexdigest()
        # Hits of the stock x86_64 (-msse4.1) build: the SIMDe kernels must match them bit for bit.
        assert (len(out), digest) == (26, "1ff204f96b69812c7538a8960a85f63a965d70fbcddbd932a12bc7d047c8a848"), (len(out), digest)
        print(len(out), "hits match x86_64")
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-sources: "test"
      cibw-test-command: "minimap2.py -c test/MT-human.fa test/MT-orang.fa && python test/check_mappy.py test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MAPPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mappy-${{ env.MAPPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith("mappy.") and n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE.txt", "COPYING.simde"}, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish mappy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mappy-${{ matrix.version }}-*-manylinux_riscv64
