---
# This workflow is based on the `linux` job of
# https://github.com/JAMdotTech/py-smoldot-light/blob/v0.1.0/.github/workflows/CI.yml
name: Build smoldot-light wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/smoldot-light.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-smoldot-light.yml'
      - 'docs/packages/smoldot-light.yaml'
      - 'patches/smoldot-light/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-smoldot-light.yml'
      - 'docs/packages/smoldot-light.yaml'
      - 'patches/smoldot-light/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: smoldot-light
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build smoldot-light ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "smoldot-light"
      version: "${{ matrix.version }}"
      repository: "JAMdotTech/py-smoldot-light"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/smoldot-light/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # py-smoldot-light ships no [tool.cibuildwheel]; the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # smoldot's own executor/vm.rs only enables its wasmtime/Cranelift JIT
      # backend for x86_64/aarch64/s390x; riscv64 already falls back to its
      # portable wasmi interpreter, the same path upstream's own armv7l/i686/
      # ppc64le wheels use, so no feature flags are needed here.
      cibw-test-command: "python -c \"import smoldot_light.smoldot_light as m; assert m.__file__.endswith('.so'), m.__file__\" && python -c \"import time; from smoldot_light import SmoldotClient; c=SmoldotClient(); spec=open('{project}/chains/polkadot.json').read(); cid=c.add_chain(spec); c.json_rpc_request(cid, '{\\\"id\\\":1,\\\"jsonrpc\\\":\\\"2.0\\\",\\\"method\\\":\\\"system_name\\\",\\\"params\\\":[]}'); time.sleep(2); resp=c.drain_responses(cid, max=10); assert resp and 'py-smoldot-light' in resp[0], resp; print('OK:', resp)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SMOLDOT_LIGHT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: smoldot-light-${{ env.SMOLDOT_LIGHT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel ships both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE", "LICENSE.smoldot"}, licences
          EOF

  publish:
    name: Publish smoldot-light ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: smoldot-light-${{ matrix.version }}-*-manylinux_riscv64
