---
# This workflow is based on the `linux` job of
# https://github.com/JAMdotTech/py-smoldot-light/blob/v0.1.0/.github/workflows/CI.yml
name: Build smoldot-light wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/smoldot-light.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-smoldot-light.yml'
      - 'docs/packages/smoldot-light.yaml'
      - 'patches/smoldot-light/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-smoldot-light.yml'
      - 'docs/packages/smoldot-light.yaml'
      - 'patches/smoldot-light/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: smoldot-light
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build smoldot-light ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): pyo3 has no abi3 feature enabled here,
        # matching upstream's own per-interpreter wheel tags. This repo's
        # standard interpreter floor (upstream also builds cp38-cp314/cp313t,
        # narrower here).
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      SMOLDOT_LIGHT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout py-smoldot-light v${{ env.SMOLDOT_LIGHT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: JAMdotTech/py-smoldot-light
          ref: v${{ env.SMOLDOT_LIGHT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch source
        run: git apply python-wheels/patches/smoldot-light/${{ env.SMOLDOT_LIGHT_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # py-smoldot-light ships no [tool.cibuildwheel]; the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # smoldot's own executor/vm.rs only enables its wasmtime/Cranelift JIT
          # backend for x86_64/aarch64/s390x; riscv64 already falls back to its
          # portable wasmi interpreter, the same path upstream's own armv7l/i686/
          # ppc64le wheels use, so no feature flags are needed here.
          CIBW_TEST_COMMAND: >-
            python -c "import smoldot_light.smoldot_light as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -c "import time; from smoldot_light import SmoldotClient; c=SmoldotClient(); spec=open('{project}/chains/polkadot.json').read(); cid=c.add_chain(spec); c.json_rpc_request(cid, '{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_name\",\"params\":[]}'); time.sleep(2); resp=c.drain_responses(cid, max=10); assert resp and 'py-smoldot-light' in resp[0], resp; print('OK:', resp)"

      - name: Check wheel ships both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE", "LICENSE.smoldot"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: smoldot-light-${{ env.SMOLDOT_LIGHT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish smoldot-light ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: smoldot-light-${{ matrix.version }}-*-manylinux_riscv64
