---
# This workflow is based on the `linux` job of
# https://github.com/posit-dev/py-yaml12/blob/v0.2.0/.github/workflows/CI.yml
name: Build py-yaml12 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/py-yaml12.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-py-yaml12.yml'
      - 'docs/packages/py-yaml12.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-py-yaml12.yml'
      - 'docs/packages/py-yaml12.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: py-yaml12
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build py-yaml12 ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PY_YAML12_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout py-yaml12 v${{ env.PY_YAML12_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: posit-dev/py-yaml12
          ref: v${{ env.PY_YAML12_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --locked --release --out dist -i python3.10
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.10'
          activate-environment: true
          enable-cache: false

      # test_typechecks.py shells out to mypy/pyright (irrelevant to riscv64);
      # test_gil_release.py asserts wall-clock progress during a large parse,
      # too timing-sensitive on this runner.
      - name: Test wheel
        run: |
          uv pip install dist/*.whl pytest
          pytest tests_py --deselect tests_py/test_typechecks.py --deselect tests_py/test_gil_release.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: py-yaml12-${{ env.PY_YAML12_VERSION }}-cp310-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish py-yaml12 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: py-yaml12-${{ matrix.version }}-*-manylinux_riscv64
