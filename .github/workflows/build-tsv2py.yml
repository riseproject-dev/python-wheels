---
# This workflow is based on: https://github.com/hunyadi/tsv2py/blob/0.8.0/.github/workflows/publish.yml
name: Build tsv2py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tsv2py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tsv2py.yml'
      - 'docs/packages/tsv2py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tsv2py.yml'
      - 'docs/packages/tsv2py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tsv2py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tsv2py ${{ matrix.version }} cp310-abi3-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py's bdist_wheel_abi3 tags every CPython wheel cp310-abi3
          # (Py_LIMITED_API=0x030A0000); upstream ships no free-threaded wheel
          # at all, so one build per libc, reused+retested on cp312/cp313/cp314.
          - libc: manylinux
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - libc: musllinux
            build: >-
              cp312-musllinux_riscv64 cp313-musllinux_riscv64
              cp314-musllinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tsv2py
      version: ${{ matrix.version }}
      repository: hunyadi/tsv2py
      ref: ${{ matrix.version }}
      artifact-tag: cp310-abi3-${{ matrix.libc }}_riscv64
      cibw-build: ${{ matrix.build }}
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "from tsv import cpu_features, parser_plain;
        assert cpu_features.__file__.endswith('.so'), cpu_features.__file__;
        assert parser_plain.__file__.endswith('.so'), parser_plain.__file__" &&
        python -m unittest discover tests
      timeout-minutes: 60

  publish:
    name: Publish tsv2py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tsv2py-${{ matrix.version }}-*riscv64
