---
# passagemath-bliss is split out of the passagemath/passagemath monorepo (a
# SageMath fork) at pkgs/sagemath-bliss, tagged passagemath-<version>. This
# replays build/pkgs/sagemath_bliss/spkg-src (./bootstrap renders the
# package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-bliss wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-bliss.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-bliss.yml'
      - 'docs/packages/passagemath-bliss.yaml'
      - 'patches/passagemath-bliss/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-bliss.yml'
      - 'docs/packages/passagemath-bliss.yaml'
      - 'patches/passagemath-bliss/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # build/pkgs/bliss's own pin (checksums.ini): no riscv64 bliss-devel exists
  # to build against instead (EPEL ships no riscv64 repo at all).
  BLISS_COMMIT: eddc188c79ea1e1f4f865ec0e87b6a1eb955b54c
  BLISS_SHA256: ce288d386692d6693fef92127180db8cccd3945704037b7bdeaf41d43350c7cf

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-bliss
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_BLISS_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_BLISS_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_BLISS_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-bliss
          src/sage/graphs/bliss.p*
          src/sage/graphs/bliss_cpp
          src/sage/graphs/all__sagemath_bliss.py
          src/sage/all__sagemath_bliss.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-bliss source
      run: git apply python-wheels/patches/passagemath-bliss/${{ env.PASSAGEMATH_BLISS_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    # ./bootstrap's own per-package render (sage-package bootstrap) runs all
    # ~650 spkgs in parallel batches and aborts a batch outright if any
    # member fails (sage_conf's needs the full configure.ac, absent from
    # this sparse checkout); render this one package ourselves so it is
    # not at the mercy of that batch's luck.
    - name: Render pkgs/sagemath-bliss/pyproject.toml.m4
      working-directory: pkgs/sagemath-bliss
      run: |
        export M4PATH="$GITHUB_WORKSPACE/m4"
        for f in *.m4; do m4 "$f" > "${f%.m4}"; done

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-bliss
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_BLISS_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_BLISS_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-bliss-${{ env.PASSAGEMATH_BLISS_VERSION }}-sdist
        path: pkgs/sagemath-bliss/dist/*.tar.gz
        if-no-files-found: error

  # bliss (LGPL-3.0-or-later) is compiled straight into the wheel from the
  # pinned commit, which is not in the image's repos, so its source and
  # licence text are collected here rather than from an RPM.
  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-latest
    env:
      PASSAGEMATH_BLISS_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch pinned bliss source
        run: |
          set -euo pipefail
          curl -fsSLo bliss.zip "https://github.com/scipopt/bliss/archive/${BLISS_COMMIT}.zip"
          echo "${BLISS_SHA256}  bliss.zip" | sha256sum -c -

      - run: tar cf gpl-sources.tar bliss.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: passagemath-bliss-${{ env.PASSAGEMATH_BLISS_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-bliss ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_BLISS_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-bliss-${{ env.PASSAGEMATH_BLISS_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        # Replays build/pkgs/bliss/spkg-install.in. No riscv64 bliss-devel
        # exists (EPEL ships no riscv64 repo at all), so this always builds
        # from source, same as upstream's own spkg-configure.m4 fallback.
        CIBW_BEFORE_ALL_LINUX: |
          set -euo pipefail
          if command -v apk >/dev/null; then
            apk add --no-cache cmake ninja unzip curl
          else
            dnf install -y --setopt=install_weak_deps=False cmake ninja-build unzip
          fi
          curl -fsSLo /tmp/bliss.zip https://github.com/scipopt/bliss/archive/${{ env.BLISS_COMMIT }}.zip
          echo "${{ env.BLISS_SHA256 }}  /tmp/bliss.zip" | sha256sum -c -
          unzip -q /tmp/bliss.zip -d /tmp
          cd /tmp/bliss-${{ env.BLISS_COMMIT }}
          cmake -GNinja -DUSE_GMP=OFF -DCMAKE_INSTALL_PREFIX=/usr/local .
          cmake --build .
          cmake --install .
          ldconfig || true
        CIBW_ENVIRONMENT_LINUX: >-
          PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH
          LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CPATH=/usr/local/include:$CPATH
        # sagemath-repl/-graphs (the real test extras) are unported, so this
        # stands in a minimal duck-typed graph rather than sage's own.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.graphs.bliss import canonical_form;
          G=type('G',(object,),{'order':lambda s:4,'is_directed':lambda s:False,'edge_iterator':lambda s,labels=False:iter([(0,1),(1,2),(2,0),(2,3)]),'__iter__':lambda s:iter(range(4))});
          r=canonical_form(G(), use_edge_labels=False);
          assert len(r)==4, r;
          print('bliss ok', r)"

    - name: Check the wheel ships the extension and the vendored licence
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/graphs/bliss") and n.endswith(".so") for n in names), whl
            libs = [n for n in names if n.startswith("passagemath_bliss.libs/")]
            assert any("bliss" in n for n in libs), (whl, libs)
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE", "LICENSE.bliss"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-bliss-${{ env.PASSAGEMATH_BLISS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-bliss ${{ matrix.version }}
    needs: [setup, linux, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-bliss-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: passagemath-bliss-${{ matrix.version }}-gpl-sources
      gpl-sources-description: bliss
