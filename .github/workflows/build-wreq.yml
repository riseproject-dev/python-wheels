---
# This workflow is based on the `manylinux` and `tests` jobs of
# https://github.com/0x676e67/wreq-python/blob/v0.12.1/.github/workflows/ci.yml
name: Build wreq wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wreq.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wreq.yml'
      - 'docs/packages/wreq.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wreq.yml'
      - 'docs/packages/wreq.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # wreq-python gitignores Cargo.lock and requires `wreq = "6.0.0-rc"`, so a fresh
  # resolve floats to the newest rc; pin the one the 0.12.1 release sdist locks.
  WREQ_CRATE_VERSION: '6.0.0-rc.29'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wreq
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build wreq ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # `tag` has to be a real axis: two `include` entries that only add new
        # keys would both extend the one `version` combination, and the second
        # would overwrite the first instead of creating a second leg.
        tag: [cp311-abi3, cp314t]
        include:
          - tag: cp311-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "wreq"
      version: "${{ matrix.version }}"
      repository: "0x676e67/wreq-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # btls-sys runs bindgen (libclang) and `git apply`s its BoringSSL patches.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        dnf install -y clang-devel git
      # From 0.12.2 on, wreq-python's own Cargo.toml [patch.crates-io] pins
      # wreq/wreq-util/btls to exact git revs, so a plain lockfile already
      # resolves to those; the 0.12.1-only --precise pin below is no longer
      # just unneeded but breaks the build, since cargo reads a --precise
      # value against a git-patched dependency as a git ref, and
      # "6.0.0-rc.29" isn't one in 0x676e67/wreq.
      # From 0.13.0 on, wreq-python's [patch.crates-io] also floats netty to
      # branch=main; netty's own Cargo.toml separately patches http2 to a git
      # rev for a Connection::extended_connect_protocol method no http2 release
      # has yet ("Remove once an http2 release includes" it, per netty's own
      # comment), but a dependency's [patch] table is only honoured for the
      # top-level workspace, so wreq-python's build never picks it up and
      # resolves crates.io's http2 instead, which is missing that method. Add
      # the same patch to wreq-python's own Cargo.toml before locking.
      cibw-before-build-linux: >
        ${{ matrix.version == '0.12.1' && format('cargo generate-lockfile && cargo update -p wreq --precise {0}', env.WREQ_CRATE_VERSION) ||
        matrix.version == '0.13.0' && 'sed -i ''/^\[patch.crates-io\]/a http2 = { git = "https://github.com/0x676e67/http2", rev = "c932fc91f3139f5613a579b7b11df2860d66745c" }'' Cargo.toml && cargo generate-lockfile' ||
        'cargo generate-lockfile' }}
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" MATURIN_PEP517_ARGS=\"--features jemalloc\" CARGO_BUILD_JOBS=2"
      # Upstream's tests job serves httpbin on localhost:8080 from the kennethreitz/httpbin
      # container, i.e. under gunicorn: httpbin answers every chunked (streamed-body)
      # request with a 501 unless SERVER_SOFTWARE is gunicorn, so the Werkzeug dev
      # server behind `python -m httpbin.core` fails the body-stream tests.
      cibw-test-requires: "pytest pytest-asyncio pytest-rerunfailures httpbin gunicorn"
      # The body-stream and multipart tests open these by a repo-root-relative path.
      cibw-test-sources: "tests README.md Cargo.toml LICENSE"
      cibw-test-command: >
        python -m gunicorn -b 127.0.0.1:8080 -k gthread --threads 8 httpbin:app > httpbin.log 2>&1 & HTTPBIN_PID=$!;
        python -c "import wreq.wreq as m; assert m.__file__.endswith('.so'), m.__file__" &&
        for i in $(seq 60); do
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/get', timeout=2)" 2>/dev/null && break;
        sleep 1; done &&
        python -m pytest -v tests; rc=$?;
        kill $HTTPBIN_PID; [ $rc = 0 ] || tail -n 50 httpbin.log; exit $rc

  publish:
    name: Publish wreq ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: wreq-${{ matrix.version }}-*-manylinux_riscv64
