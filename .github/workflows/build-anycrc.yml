---
# Based on the `build_wheels` job of
# https://github.com/marzooqy/anycrc/blob/2.0.0/.github/workflows/github-deploy.yml
name: Build anycrc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/anycrc.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-anycrc.yml'
      - 'docs/packages/anycrc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anycrc.yml'
      - 'docs/packages/anycrc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: anycrc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build anycrc ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py tags every non-free-threaded CPython wheel cp311-abi3, so
          # one build serves them all; the free-threaded build cannot use the
          # limited API.
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      ANYCRC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout anycrc ${{ env.ANYCRC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marzooqy/anycrc
          ref: ${{ env.ANYCRC_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Write a cibuildwheel config without upstream's `skip`
        # Upstream's only [tool.cibuildwheel] setting is `skip = ["cp31[!01]-*"]`,
        # which would drop cp312/cp313/cp314 from the abi3 build/test matrix below.
        run: printf '[tool.cibuildwheel]\n' > "$RUNNER_TEMP/cibuildwheel.toml"

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          config-file: ${{ runner.temp }}/cibuildwheel.toml
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: >-
            python -c "import anycrc.crc as m; assert m.__file__.endswith('.so'), m.__file__"
            && python {project}/test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: anycrc-${{ env.ANYCRC_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish anycrc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: anycrc-${{ matrix.version }}-*-manylinux_riscv64
