---
# Based on the `build_wheels` job of
# https://github.com/marzooqy/anycrc/blob/2.0.0/.github/workflows/github-deploy.yml
name: Build anycrc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/anycrc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-anycrc.yml'
      - 'docs/packages/anycrc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anycrc.yml'
      - 'docs/packages/anycrc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: anycrc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build anycrc ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py tags every non-free-threaded CPython wheel cp311-abi3, so
          # one build serves them all; the free-threaded build cannot use the
          # limited API.
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # Upstream's only [tool.cibuildwheel] setting is `skip = ["cp31[!01]-*"]`,
    # which would drop cp312/cp313/cp314 from the abi3 build/test matrix below.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "anycrc"
      version: "${{ matrix.version }}"
      repository: "marzooqy/anycrc"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      checkout-submodules: "recursive"
      pre-build: "printf '[tool.cibuildwheel]\\n' > cibuildwheel.toml"
      cibw-config-file: "cibuildwheel.toml"
      cibw-build: "${{ matrix.build }}"
      cibw-test-command: >
        python -c "import anycrc.crc as m; assert m.__file__.endswith('.so'), m.__file__"
        && python {project}/test.py

  publish:
    name: Publish anycrc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: anycrc-${{ matrix.version }}-*-manylinux_riscv64
