---
# This workflow is based on: https://github.com/embotech/ecos-python/blob/v2.0.14/.github/workflows/build.yml
name: Build ecos wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ecos.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ecos.yml'
      - 'docs/packages/ecos.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ecos.yml'
      - 'docs/packages/ecos.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ecos
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ecos ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ecos
      version: ${{ matrix.version }}
      repository: embotech/ecos-python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy (build and test) and scipy (test) have no riscv64 wheel on public PyPI.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,scipy
      # test_interface.py sits next to the ecos/ package source (src/ecos/);
      # staging only the test files (not src/ecos/) keeps pytest's rootdir
      # insertion from shadowing the installed wheel (gotcha 25).
      cibw-test-sources: src/test_interface.py src/test_interface_bb.py
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "import _ecos; assert _ecos.__file__.endswith('.so'), _ecos.__file__" &&
        python -m pytest src/test_interface.py src/test_interface_bb.py
      timeout-minutes: 60

  publish:
    name: Publish ecos ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ecos-${{ matrix.version }}-*-manylinux_riscv64
