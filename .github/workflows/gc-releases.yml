name: Collect unlinked GitHub releases

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the releases to delete without deleting them
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  gc-releases:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-wheel # no publication may be in flight while releases are listed
      cancel-in-progress: false
      queue: max
    steps:
      # Run as the App, like the publication and merge workflows; without its
      # credentials the job falls back to GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        if: ${{ vars.RISEPROJECT_APP_CLIENT_ID != '' }}
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}

      # Always read the package YAMLs of main, whatever ref the run was started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Run gc-releases.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: uv run ci_scripts/gc-releases.py $DRY_RUN
