---
# This workflow is based on the `linux` job of
# https://github.com/124C41p/betterproto-rust-codec/blob/v0.1.1/.github/workflows/CI.yml
name: Build betterproto-rust-codec wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/betterproto-rust-codec.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-betterproto-rust-codec.yml'
      - 'docs/packages/betterproto-rust-codec.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-betterproto-rust-codec.yml'
      - 'docs/packages/betterproto-rust-codec.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: betterproto-rust-codec
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build betterproto-rust-codec ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so
          # one abi3 wheel serves every interpreter in our matrix; there is
          # no free-threaded (cp314t) leg -- pyo3 0.21.0 predates PEP 703.
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    env:
      BETTERPROTO_RUST_CODEC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout betterproto-rust-codec v${{ env.BETTERPROTO_RUST_CODEC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 124C41p/betterproto-rust-codec
          ref: v${{ env.BETTERPROTO_RUST_CODEC_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: upstream itself never builds a musllinux
          # wheel for any architecture (plain `manylinux: auto`).
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Ships no [tool.cibuildwheel], so the Rust toolchain its maturin
          # backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # No test suite upstream; exercise the compiled codec the way
          # betterproto itself does (betterproto.Message.parse/__bytes__ is
          # monkey-patched onto these two functions when this package is
          # importable), round-tripping a hand-written message.
          CIBW_TEST_REQUIRES: betterproto==2.0.0b7
          CIBW_TEST_COMMAND: |
            python3 - <<'PYEOF'
            from dataclasses import dataclass
            import betterproto
            import betterproto_rust_codec

            @dataclass
            class Greeting(betterproto.Message):
                name: str = betterproto.string_field(1)
                message: str = betterproto.string_field(2)

            g = Greeting(name="riscv64", message="hello")
            data = betterproto_rust_codec.serialize(g)
            g2 = Greeting()
            betterproto_rust_codec.deserialize(g2, data)
            assert g2 == g, (g2, g)
            assert bytes(g) == data, "betterproto's own monkey-patch disagrees with the codec"
            assert betterproto_rust_codec.betterproto_rust_codec.__file__.endswith(".so"), \
                betterproto_rust_codec.betterproto_rust_codec.__file__
            print("betterproto-rust-codec OK")
            PYEOF

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".abi3.so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: betterproto-rust-codec-${{ env.BETTERPROTO_RUST_CODEC_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish betterproto-rust-codec ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: betterproto-rust-codec-${{ matrix.version }}-*-manylinux_riscv64
