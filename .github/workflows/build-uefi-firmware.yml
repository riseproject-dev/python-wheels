---
# This workflow is based on: https://github.com/theopolis/uefi-firmware-parser/blob/v1.16/.github/workflows/release.yml
# and https://github.com/theopolis/uefi-firmware-parser/blob/v1.16/.github/workflows/ci.yml
name: Build uefi-firmware wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/uefi-firmware.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-uefi-firmware.yml'
      - 'docs/packages/uefi-firmware.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uefi-firmware.yml'
      - 'docs/packages/uefi-firmware.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: uefi-firmware
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build uefi-firmware ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp310-abi3, cp314t]
        include:
          # setup.py tags every non-free-threaded wheel cp310-abi3, so cp310
          # builds it and the later entries only re-test it.
          - tag: cp310-abi3
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      UEFI_FIRMWARE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout uefi-firmware-parser ${{ env.UEFI_FIRMWARE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: theopolis/uefi-firmware-parser
          ref: v${{ env.UEFI_FIRMWARE_VERSION }}
          persist-credentials: false

      - name: Clone public samples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: theopolis/uefi-firmware-samples
          # The samples repo has no tags; pinned to its HEAD when v1.16 was tagged.
          ref: a9b207401cea35dba3ae8e7721c86f48e4ea341f
          path: samples
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: tests
          CIBW_TEST_COMMAND: >-
            python -bb {project}/tests/test_compression.py
            && cd {project}/samples && python -bb ./test_samples.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: uefi-firmware-${{ env.UEFI_FIRMWARE_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish uefi-firmware ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: uefi-firmware-${{ matrix.version }}-*-manylinux_riscv64
