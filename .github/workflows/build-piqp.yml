---
# This workflow mirrors the build_wheels job of upstream's own
# .github/workflows/wheels.yml, narrowed to riscv64.
name: Build piqp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/piqp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-piqp.yml'
      - 'docs/packages/piqp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-piqp.yml'
      - 'docs/packages/piqp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: piqp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build piqp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # scipy (a runtime dependency) has no riscv64 wheel below cp310 on
        # our registry; upstream ships no cp31?t wheel at all.
        python: ['cp310', 'cp311', 'cp312', 'cp313', 'cp314']

    env:
      PIQP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout piqp v${{ env.PIQP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: predict-epfl/piqp
          ref: v${{ env.PIQP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Only ci/install_eigen.sh, not the full ci/install_all_deps_linux.sh:
          # BUILD_WITH_BLASFEO stays OFF here (CIBW_ENVIRONMENT_LINUX below sets
          # no CMAKE_ARGS, same as upstream's own non-x86_64/aarch64 case), so
          # building blasfeo's GENERIC target would be wasted work.
          CIBW_BEFORE_ALL_LINUX: bash ci/install_eigen.sh
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the wheel ships the compiled extension
        run: |
          set -euo pipefail
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("piqp/piqp_python") and n.endswith(".so") for n in names), (whl, names)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: piqp-${{ env.PIQP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish piqp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: piqp-${{ matrix.version }}-*-manylinux_riscv64
