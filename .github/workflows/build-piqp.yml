---
# This workflow mirrors the build_wheels job of upstream's own
# .github/workflows/wheels.yml, narrowed to riscv64.
name: Build piqp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/piqp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-piqp.yml'
      - 'docs/packages/piqp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-piqp.yml'
      - 'docs/packages/piqp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: piqp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build piqp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "piqp"
      version: "${{ matrix.version }}"
      repository: "predict-epfl/piqp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Only ci/install_eigen.sh, not the full ci/install_all_deps_linux.sh:
      # BUILD_WITH_BLASFEO stays OFF here (CIBW_ENVIRONMENT_LINUX below sets
      # no CMAKE_ARGS, same as upstream's own non-x86_64/aarch64 case), so
      # building blasfeo's GENERIC target would be wasted work.
      cibw-before-all-linux: "bash ci/install_eigen.sh"
      # PyPI's newer numpy/scipy sdists would otherwise outrank our riscv64 wheels.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PIQP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: piqp-${{ env.PIQP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extension
        run: |
          set -euo pipefail
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("piqp/piqp_python") and n.endswith(".so") for n in names), (whl, names)
              print(whl, "ok")
          EOF

  publish:
    name: Publish piqp ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: piqp-${{ matrix.version }}-*-manylinux_riscv64
