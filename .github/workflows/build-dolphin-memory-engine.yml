---
# Based on the `build-wheels` job of
# https://github.com/henriquegemignani/py-dolphin-memory-engine/blob/v1.3.1/.github/workflows/python.yml
name: Build dolphin-memory-engine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dolphin-memory-engine.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dolphin-memory-engine.yml'
      - 'docs/packages/dolphin-memory-engine.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dolphin-memory-engine.yml'
      - 'docs/packages/dolphin-memory-engine.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dolphin-memory-engine
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dolphin-memory-engine ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: dolphin-memory-engine
      version: ${{ matrix.version }}
      repository: henriquegemignani/py-dolphin-memory-engine
      ref: v${{ matrix.version }}
      artifact-tag: cp39-abi3-manylinux_riscv64
      checkout-submodules: recursive
      checkout-fetch-depth: 0
      # Upstream's `CIBW_BUILD: cp39-*` (one cp39-abi3 wheel, no free-threaded or
      # musllinux build); the newer interpreters re-test that wheel.
      cibw-build: >-
        cp39-manylinux_riscv64 cp312-manylinux_riscv64
        cp313-manylinux_riscv64 cp314-manylinux_riscv64
      cibw-test-extras: test
      cibw-test-command: pytest {project}/tests
      timeout-minutes: 120

  publish:
    name: Publish dolphin-memory-engine ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dolphin-memory-engine-${{ matrix.version }}-*-manylinux_riscv64
