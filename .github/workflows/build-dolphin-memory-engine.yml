---
# Based on the `build-wheels` job of
# https://github.com/henriquegemignani/py-dolphin-memory-engine/blob/v1.3.1/.github/workflows/python.yml
name: Build dolphin-memory-engine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dolphin-memory-engine.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dolphin-memory-engine.yml'
      - 'docs/packages/dolphin-memory-engine.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dolphin-memory-engine.yml'
      - 'docs/packages/dolphin-memory-engine.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dolphin-memory-engine
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dolphin-memory-engine ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      DOLPHIN_MEMORY_ENGINE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout dolphin-memory-engine v${{ env.DOLPHIN_MEMORY_ENGINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: henriquegemignani/py-dolphin-memory-engine
          ref: v${{ env.DOLPHIN_MEMORY_ENGINE_VERSION }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # Upstream's `CIBW_BUILD: cp39-*` (one cp39-abi3 wheel, no free-threaded or
          # musllinux build); the newer interpreters re-test that wheel.
          CIBW_BUILD: >-
            cp39-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dolphin-memory-engine-${{ env.DOLPHIN_MEMORY_ENGINE_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish dolphin-memory-engine ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: dolphin-memory-engine-${{ matrix.version }}-*-manylinux_riscv64
