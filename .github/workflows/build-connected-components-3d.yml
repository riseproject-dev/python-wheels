---
# Based on: https://github.com/seung-lab/connected-components-3d/blob/4.1.0/.github/workflows/build_wheel.yml
name: Build connected-components-3d wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/connected-components-3d.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-connected-components-3d.yml'
      - 'docs/packages/connected-components-3d.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-connected-components-3d.yml'
      - 'docs/packages/connected-components-3d.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: connected-components-3d
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build connected-components-3d ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          - python: cp312
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp313
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp314
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp314t
            scipy: ''
            k: not test_connected_components_stack and not test_compare_scipy

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "connected-components-3d"
      version: "${{ matrix.version }}"
      repository: "seung-lab/connected-components-3d"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # numpy is a build-time requirement (headers, via pyproject.toml's
      # build-system.requires) and, despite not being declared as a
      # runtime dependency by name in pyproject.toml, an implicit one too
      # (the compiled extension calls numpy's C API at import time; it is
      # declared in install_requires in setup.py). Only our registry has
      # it for riscv64; only-binary keeps a newer PyPI release from
      # winning the resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      # fastremap has no riscv64 wheel on either index, so pip builds it
      # from sdist; scipy has no cp314t wheel on any index/platform yet,
      # so it and its tests are dropped on that leg only (gotcha 149).
      cibw-test-requires: "pytest numpy fastremap ${{ matrix.scipy }}"
      # automated_test.py sits next to the unbuilt cc3d/ source package;
      # staging only the test file keeps that directory out of test_cwd
      # so `import cc3d` resolves to the installed wheel (gotcha 25).
      cibw-test-sources: "automated_test.py"
      # crackle-codec (the optional "stack" extra's codec) has no riscv64
      # wheel anywhere, so test_connected_components_stack is deselected
      # on every leg rather than building its pybind11/google_crc32c
      # dependency chain from source for one optional extra.
      cibw-test-command: "python -m pytest -v automated_test.py -k \"${{ matrix.k }}\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          - python: cp312
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp313
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp314
            scipy: scipy
            k: not test_connected_components_stack
          - python: cp314t
            scipy: ''
            k: not test_connected_components_stack and not test_compare_scipy
    env:
      CC3D_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: connected-components-3d-${{ env.CC3D_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"fastcc3d"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"AUTHORS", "COPYING", "COPYING.LESSER"}, licences
          EOF

  publish:
    name: Publish connected-components-3d ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: connected-components-3d-${{ matrix.version }}-*-manylinux_riscv64
