---
# Based on: https://github.com/microsoft/debugpy/blob/v1.8.21/azure-pipelines/pipelines.yaml
# (wheels come from a separate internal pipeline; the public one runs the tox
# suite this workflow drives through cibuildwheel).
name: Build debugpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/debugpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-debugpy.yml'
      - 'docs/packages/debugpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-debugpy.yml'
      - 'docs/packages/debugpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: debugpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build debugpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # attach-by-PID injects pydevd's shim, which upstream compiles for
        # x86/arm64 only; 3.14 attaches through sys.remote_exec instead.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: debugpy
      version: ${{ matrix.version }}
      repository: microsoft/debugpy
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py swallows the pydevd Cython build failure and ships a wheel
      # with no .so unless this is set (CLAUDE.md gotcha 20).
      cibw-environment-linux: "REQUIRE_CYTHON_BUILD=1"
      # tests/ is a package whose conftest registers tests.* plugins, so it has
      # to sit in the (empty) test cwd; pytest.ini carries testpaths and -n8.
      cibw-test-sources: tests pytest.ini
      # tests/requirements.txt minus gevent (no riscv64 wheel; its one test is
      # deselected below) and the Windows/build-only vswhere and Cython.
      cibw-test-requires: >-
        pytest pytest-xdist pytest-timeout pytest-retry
        importlib_metadata psutil untangle
        django flask numpy requests typing_extensions
      # PYDEVD_USE_CYTHON=yes makes pydevd raise instead of silently falling
      # back to the pure-Python tracer, so the whole suite exercises the .so.
      cibw-test-environment: >-
        DEBUGPY_TEST=1
        PYDEVD_USE_CYTHON=yes
        DEBUGPY_PROCESS_SPAWN_TIMEOUT=180
      cibw-test-command: >-
        python -c "import debugpy._vendored.force_pydevd;
        import _pydevd_bundle.pydevd_cython_wrapper as w;
        import _pydevd_sys_monitoring._pydevd_sys_monitoring_cython as m;
        assert w.mod.__file__.endswith('.so'), w.mod.__file__;
        assert m.__file__.endswith('.so'), m.__file__" &&
        python -Xfrozen_modules=off -m pytest --timeout=600
        -k "${{ case(matrix.python == 'cp312', 'not attach_pid', matrix.python == 'cp313', 'not attach_pid', matrix.python == 'cp314', '', '') }}"
        --ignore=tests/debugpy/test_gevent.py
      timeout-minutes: 300

  publish:
    name: Publish debugpy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: debugpy-${{ matrix.version }}-*-manylinux_riscv64
