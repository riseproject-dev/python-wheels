---
# This workflow is based on the `test-python` job of
# https://github.com/SynthGL/wolfxl-oss/blob/v2.0.36/.github/workflows/ci.yml
name: Build wolfxl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wolfxl.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wolfxl.yml'
      - 'docs/packages/wolfxl.yaml'
      - 'patches/wolfxl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wolfxl.yml'
      - 'docs/packages/wolfxl.yaml'
      - 'patches/wolfxl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wolfxl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build wolfxl ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3 (pyo3 has no abi3-pyNN feature here), so one wheel per interpreter.
        python: ['cp312', 'cp313', 'cp314', 'cp314t']
        include:
          # gotcha 711: the RLIMIT_AS-headroom OOM test is defeated by cp314t's own
          # allocator (confirmed off riscv64, off wolfxl's code, with a pure-stdlib
          # repro) -- not a build or porting bug. Deselect it for cp314t only; the
          # other three legs keep the full suite.
          - python: 'cp314t'
            test_deselect: >-
              --deselect=tests/test_streaming_oom_error.py::test_allocation_failure_raises_memory_error_not_panic

    env:
      WOLFXL_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout wolfxl-oss v${{ env.WOLFXL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SynthGL/wolfxl-oss
          ref: v${{ env.WOLFXL_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels/patches/wolfxl/${{ env.WOLFXL_VERSION }}/*.patch

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --out dist -i ${{ steps.interp.outputs.value }}
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      - name: Install wolfxl and test dependencies
        run: |
          # No --no-index: wolfxl declares a runtime dependency on defusedxml, which
          # has no wheel in dist/ (only wolfxl's own riscv64 wheel lives there) and
          # must come from PyPI. --only-binary pins wolfxl itself to a wheel so it
          # can't fall back to building the sdist, and --find-links dist plus the
          # exact version makes the local riscv64 wheel the only match for wolfxl.
          uv pip install --only-binary wolfxl --find-links dist "wolfxl==${WOLFXL_VERSION}" --force-reinstall
          # gotcha 30: pypi.riseproject.dev only hosts riscv64 Pillow wheels up to
          # 12.3.0, while PyPI's latest is 13.0.0 (no riscv64 wheel there at all).
          # --extra-index-url alone would still resolve to 13.0.0 from PyPI and hit
          # the same "no jpeg headers" sdist-build failure, so Pillow is pinned to
          # the version our registry actually ships.
          uv pip install --extra-index-url https://pypi.riseproject.dev/simple/ \
            pytest pytest-xdist openpyxl "Pillow==12.3.0"

      - name: Test import
        run: |
          python -c "import wolfxl._rust as m; assert m.__file__.endswith('.so'), m.__file__; print('Import successful')"

      - name: Run offline workbook editing study tests
        run: python -m unittest discover -s study/agent-edit -p 'test_*.py' -v

      - name: Pre-build wolfxl-cli (avoid xdist cold-compile contention)
        env:
          # test_classifier_parity.py's _cli_schema() shells out to a bare
          # `cargo run --release -p wolfxl-cli`, a cold compile of wolfxl-cli
          # and its deps (clap, tiktoken-rs) that the test job is otherwise
          # the first to touch (the "Build wheel" step above only compiles
          # the cdylib via maturin-action, a different target dir). The
          # workspace root Cargo.toml's [profile.release] sets lto = "fat" +
          # codegen-units = 1 for the *shipped* cdylib; that profile applies
          # workspace-wide, so the ad hoc wolfxl-cli compile would otherwise
          # pay the same fat-LTO cost even though nothing it produces ships.
          # Override it the same way gotcha 141/188 do for a shipped
          # workflow / local rehearsal (env vars, not editing Cargo.toml, so
          # an unrelated `release` profile name stays valid everywhere): this
          # never touches the wheel already built above.
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        run: |
          # Doing the compile here, serially and before pytest's `-n auto`
          # starts, is the fix 300s-of-timeout (and then dropping fat LTO)
          # didn't get to: `pytest -n auto --dist worksteal` spreads tests
          # across ~4 xdist workers on this fleet's 4-core runners, and
          # test_schema_parity_structural / test_schema_parity_samples both
          # call _cli_schema() from whichever worker picks them up. Two
          # workers landing on these tests close together both try a cold
          # `cargo run --release -p wolfxl-cli` against the *same* target
          # dir at once; cargo serializes them with its own target-dir lock,
          # so the second worker's subprocess.run(timeout=300) clock runs
          # down largely while blocked waiting for the first compile to
          # finish, not while actually compiling -- and if the first compile
          # alone takes close to 300s (a real cost on this fleet, LTO or
          # not), the second one is left with too little of its own budget
          # and times out too, which is exactly the "every leg, both tests,
          # right at 300s" shape both the pre- and post-LTO-drop runs showed.
          # Building the binary once here, before any xdist worker exists,
          # removes the compile from every test's timeout budget entirely:
          # `cargo run` during the actual test suite just checks nothing
          # changed and launches the already-built binary.
          cargo build --release --locked -p wolfxl-cli

      - name: Run Python tests
        env:
          # Must match the "Pre-build wolfxl-cli" step's profile overrides
          # exactly: _cli_schema()'s `cargo run --release -p wolfxl-cli`
          # inherits this step's env (test patch passes
          # env={**os.environ, ...}), and cargo's fingerprint includes the
          # effective profile. A mismatch here would invalidate the
          # pre-build's cache and trigger a full recompile under this
          # step's own (and xdist's) time pressure -- exactly what the
          # pre-build step exists to avoid.
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
        run: |
          pytest tests -q -n auto --dist worksteal \
            --ignore=tests/vendored_openpyxl \
            --ignore-glob='tests/test_ooxml_*.py' \
            --ignore-glob='tests/test_*audit*.py' \
            --ignore-glob='tests/test_*benchmark*.py' \
            --ignore-glob='tests/test_release_*.py' \
            --ignore-glob='tests/test_*sota*.py' \
            --ignore=tests/test_compatibility_matrix_render.py \
            --ignore=tests/test_external_oracle_preservation.py \
            --ignore=tests/test_import_release_artifact_proof_reports.py \
            --ignore=tests/test_openpyxl_compat_oracle.py \
            --ignore=tests/test_openpyxl_corpus_runner_summary.py \
            --deselect=tests/test_calc_functions.py::TestWhitelist::test_public_formula_counts_match_whitelist \
            ${{ matrix.test_deselect }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wolfxl-${{ env.WOLFXL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wolfxl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: wolfxl-${{ matrix.version }}-*-manylinux_riscv64
