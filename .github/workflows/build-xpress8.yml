---
# This workflow is based on the `build_wheels` and `test_wheels` jobs of
# https://github.com/Hugoberry/xpress8-python/blob/v0.1.1/.github/workflows/build.yml
name: Build xpress8 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xpress8.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xpress8.yml'
      - 'docs/packages/xpress8.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xpress8.yml'
      - 'docs/packages/xpress8.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xpress8
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xpress8 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "xpress8"
      version: "${{ matrix.version }}"
      repository: "Hugoberry/xpress8-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true
      patches-required: false

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-sources: "e2e_test.py"
      cibw-test-command: "python -c \"import xpress8; assert xpress8.__file__.endswith('.so'), xpress8.__file__\" && python e2e_test.py"

  publish:
    name: Publish xpress8 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: xpress8-${{ matrix.version }}-*-manylinux_riscv64
