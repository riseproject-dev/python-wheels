---
# This workflow is based on the `build_wheels_qemu` job of
# https://github.com/K0lb3/etcpak/blob/e2a7464bb4f98cb1765d9756ae6cb8e5f9a24d70/.github/workflows/release.yml
# and the test steps of .github/workflows/test.yml at the same commit.
name: Build etcpak wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/etcpak.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-etcpak.yml'
      - 'docs/packages/etcpak.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-etcpak.yml'
      - 'docs/packages/etcpak.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags, so pin the release commit: this is
  # "chore: bump version to 0.9.15", whose tree is byte-identical to the 0.9.15
  # PyPI sdist. Update it alongside ETCPAK_VERSION.
  ETCPAK_REF: e2a7464bb4f98cb1765d9756ae6cb8e5f9a24d70
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: etcpak
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build etcpak ${{ matrix.version }} cp37-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "etcpak"
      version: "${{ matrix.version }}"
      repository: "K0lb3/etcpak"
      ref: "e2a7464bb4f98cb1765d9756ae6cb8e5f9a24d70"
      artifact-tag: "cp37-abi3-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/etcpak/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # setup.py tags every CPython build cp37-abi3 with no Py_GIL_DISABLED
      # guard, so cp314t would hit CPython's limited-API #error; upstream ships
      # no free-threaded wheel either. Built once on cp312, retested on the rest.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # abi3audit flags the module's own PyBC7CompressBlockParamsObject global by
      # its Py prefix; upstream's released aarch64 abi3 wheel exports it too.
      cibw-audit-command: ''
      cibw-test-extras: "tests"
      cibw-test-command: "pytest {package}/tests -v"
      cibw-environment-linux: "PIP_ONLY_BINARY=Pillow,numpy,scipy,PyWavelets,texture2ddecoder"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      ETCPAK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: etcpak-${{ env.ETCPAK_VERSION }}-cp37-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "etcpak/_etcpak_none.abi3.so" in names, names
              assert any(n.endswith(".dist-info/LICENSE") for n in names), names
              assert any(n.endswith(".dist-info/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish etcpak ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: etcpak-${{ matrix.version }}-*-manylinux_riscv64
