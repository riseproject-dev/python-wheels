---
# This workflow is based on: https://github.com/rocksdict/RocksDict/blob/speedict-v0.3.12/.github/workflows/CI.yml
name: Build speedict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/speedict.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-speedict.yml'
      - 'docs/packages/speedict.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-speedict.yml'
      - 'docs/packages/speedict.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: speedict
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build speedict ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pyo3 0.19, no abi3 feature: one wheel per interpreter. cp314 is
        # dropped for pyo3 0.19's pre-3.14 Unicode layout (gotcha 322) and
        # cp314t because it predates Py_GIL_DISABLED (gotcha 306).
        python: ["cp312", "cp313"]

    env:
      SPEEDICT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout speedict v${{ env.SPEEDICT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rocksdict/RocksDict
          ref: speedict-v${{ env.SPEEDICT_VERSION }}
          persist-credentials: false

      # Same OOM guard build-rocksdict.yml needs for the Speedb (RocksDB) C++ build.
      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # libspeedb-sys's build.rs runs bindgen against Speedb's C header;
          # clang-devel supplies the libclang.so it dlopens.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y clang-devel &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_BUILD_JOBS=2
          CIBW_TEST_COMMAND: >-
            python -m unittest discover -v {package}/test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: speedict-${{ env.SPEEDICT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish speedict ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: speedict-${{ matrix.version }}-*-manylinux_riscv64
