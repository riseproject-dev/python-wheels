---
# This workflow is based on the `build_py_manylinux` job of
# https://github.com/mcneel/rhino3dm/blob/8.32.2/.github/workflows/workflow_release.yml
name: Build rhino3dm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rhino3dm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rhino3dm.yml'
      - 'docs/packages/rhino3dm.yaml'
      - 'patches/rhino3dm/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rhino3dm.yml'
      - 'docs/packages/rhino3dm.yaml'
      - 'patches/rhino3dm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # rhino3dm.py 8.32.1 was never tagged in git (8.32.0 and 8.32.2 were); this is
  # the commit whose setup.py/src tree is byte-identical to the released sdist.
  RHINO3DM_REF: 56daf09ab774cc02b69a1de2e17a1c8746550778
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rhino3dm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rhino3dm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rhino3dm"
      version: "${{ matrix.version }}"
      repository: "mcneel/rhino3dm"
      ref: "56daf09ab774cc02b69a1de2e17a1c8746550778"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/rhino3dm/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp src/lib/opennurbs/LICENSE LICENSE.opennurbs
        cp src/lib/draco/LICENSE LICENSE.draco
        cp src/lib/pybind11/LICENSE LICENSE.pybind11

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py shells out to `cmake` directly; it is not a declared
      # build requirement anywhere upstream, so it has to be on PATH
      # before setup.py runs.
      cibw-before-build: "pip install \"cmake>=3.16\""
      # cmake's riscv64 wheel on our registry lags PyPI's latest, which
      # has none; PIP_ONLY_BINARY keeps pip from trying to build the
      # newer sdist from source.
      cibw-environment-linux: "PIP_ONLY_BINARY=cmake"
      cibw-test-command: "cd {project}/tests/python && python -m unittest discover ."

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      RHINO3DM_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rhino3dm-${{ env.RHINO3DM_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              expected = {"LICENSE", "LICENSE.opennurbs", "LICENSE.draco", "LICENSE.pybind11"}
              assert licences == expected, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish rhino3dm ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rhino3dm-${{ matrix.version }}-*-manylinux_riscv64
