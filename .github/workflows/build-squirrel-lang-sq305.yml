---
# This workflow is based on the `build_wheels` job of
# https://github.com/shabbywu/squirrel-py/blob/v0.3.1/.github/workflows/wheels.yml
name: Build squirrel-lang-sq305 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/squirrel-lang-sq305.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-squirrel-lang-sq305.yml'
      - 'docs/packages/squirrel-lang-sq305.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-squirrel-lang-sq305.yml'
      - 'docs/packages/squirrel-lang-sq305.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: squirrel-lang-sq305
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build squirrel-lang-sq305 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      SQUIRREL_LANG_SQ305_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout squirrel-py v${{ env.SQUIRREL_LANG_SQ305_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: shabbywu/squirrel-py
          ref: v${{ env.SQUIRREL_LANG_SQ305_VERSION }}
          submodules: true
          persist-credentials: false

      # The project builds the sq32 and sq305 variants of the same tree from these
      # two env vars (setup.py); pypi.riseproject.dev only tracks the sq305 one.
      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: SQUIRREL_PY_VARIANT=sq305 SQUIRREL_PY_PACKAGE_NAME=squirrel-lang-sq305
          CIBW_BEFORE_BUILD: cp libs/SQUIRREL305/COPYRIGHT {project}/LICENSE.squirrel-core.txt

      - name: Check the bundled licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE", "LICENSE.squirrel-core.txt"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n}
              assert expected <= found, f"{whl}: missing {expected - found}"
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: squirrel-lang-sq305-${{ env.SQUIRREL_LANG_SQ305_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish squirrel-lang-sq305 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: squirrel-lang-sq305-${{ matrix.version }}-*-manylinux_riscv64
