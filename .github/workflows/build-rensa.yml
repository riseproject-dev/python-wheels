---
# This workflow is based on the `linux` job of
# https://github.com/beowolx/rensa/blob/v0.4.1/.github/workflows/CI.yml
name: Build rensa wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rensa.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rensa.yml'
      - 'docs/packages/rensa.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rensa.yml'
      - 'docs/packages/rensa.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rensa
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rensa ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rensa"
      version: "${{ matrix.version }}"
      repository: "beowolx/rensa"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # rensa ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      # tests/test_benchmarks.py imports from ../benchmarks via
      # Path(__file__).resolve().parents[1] / "benchmarks" (gotcha 104).
      cibw-test-sources: "tests benchmarks"
      # rensa's pyproject.toml has no python-source; maturin auto-generates
      # a rensa/__init__.py shim ("from .rensa import *") around the
      # compiled rensa.rensa submodule, so that's the .so to check.
      cibw-test-command: >
        python -c "import rensa.rensa as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish rensa ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rensa-${{ matrix.version }}-*-manylinux_riscv64
