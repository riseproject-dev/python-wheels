---
# This workflow is based on: https://github.com/itsmeadarsh2008/flpc/blob/542fd3a313a5875e862b3210b88fa5bea59f1b66/.github/workflows/CI.yml
name: Build flpc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/flpc.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-flpc.yml'
      - 'docs/packages/flpc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-flpc.yml'
      - 'docs/packages/flpc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags, so pin the release commit: this is
  # "Update pyproject.toml" bumping to 0.2.5, whose tree is byte-identical to
  # the 0.2.5 PyPI sdist. Update it alongside FLPC_VERSION.
  FLPC_REF: 542fd3a313a5875e862b3210b88fa5bea59f1b66
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: flpc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build flpc ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per-interpreter (upstream ships cp3x-cp3x
        # wheels, no abi3). cp314t is dropped: pyo3 0.22 predates PEP 703 and
        # has no Py_GIL_DISABLED support.
        python: ["cp312", "cp313", "cp314"]

    env:
      FLPC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout flpc ${{ env.FLPC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: itsmeadarsh2008/flpc
          ref: ${{ env.FLPC_REF }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # flpc ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          # PYO3_USE_ABI3_FORWARD_COMPATIBILITY unblocks cp314, which is newer
          # than pyo3 0.22's known-version ceiling (3.13); verified locally
          # that the resulting extension still builds per-interpreter (no
          # abi3 feature is enabled) and runs correctly.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin" PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          CIBW_TEST_COMMAND: |
            python3 - <<'PYEOF'
            import flpc
            p = flpc.compile(r"(\w+) (\w+)")
            m = flpc.search(p, "Hello World")
            assert m.group(0) == "Hello World", m.group(0)
            assert m.groups() == ["Hello", "World"], m.groups()
            assert m.span(0) == (0, 11), m.span(0)
            assert flpc.findall(p, "Hello World Hello Python") == ["Hello World", "Hello Python"]
            digits = flpc.compile(r"\d+")
            assert flpc.sub(digits, "#", "room 42 and 7") == "room # and #"
            email = flpc.compile(r"(\w+)@(\w+)\.com")
            fm = flpc.fmatch(email, "user@example.com")
            assert fm.group(0) == "user@example.com", fm.group(0)
            up = flpc.compile(".*")
            um = flpc.fmatch(up, "hello \N{EARTH GLOBE AMERICAS}")
            assert um.span(0) == (0, 7), um.span(0)
            print("flpc OK")
            PYEOF

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("flpc/flpc.") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flpc-${{ env.FLPC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish flpc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: flpc-${{ matrix.version }}-*-manylinux_riscv64
