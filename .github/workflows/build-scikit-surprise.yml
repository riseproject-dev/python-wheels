---
# Based on: https://github.com/NicolasHug/Surprise/blob/v1.1.5/.github/workflows/build_wheels.yml
name: Build scikit-surprise wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scikit-surprise.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-surprise.yml'
      - 'docs/packages/scikit-surprise.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-surprise.yml'
      - 'docs/packages/scikit-surprise.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scikit-surprise
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scikit-surprise ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      SCIKIT_SURPRISE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout scikit-surprise v${{ env.SCIKIT_SURPRISE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NicolasHug/Surprise
          ref: v${{ env.SCIKIT_SURPRISE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pandas
          # pypi.riseproject.dev has no cp314t pandas wheel, and three test modules import pandas unconditionally.
          CIBW_TEST_REQUIRES: pytest ${{ matrix.python != 'cp314t' && 'pandas' || '' }}
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests -v
            ${{ matrix.python == 'cp314t' && '--ignore={project}/tests/test_NMF.py --ignore={project}/tests/test_dataset.py --ignore={project}/tests/test_zero_ratings.py' || '' }}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"similarities", "matrix_factorization", "optimize_baselines", "slope_one", "co_clustering"}, exts
          assert any(".dist-info/licenses/" in n for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scikit-surprise-${{ env.SCIKIT_SURPRISE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish scikit-surprise ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: scikit-surprise-${{ matrix.version }}-*-manylinux_riscv64
