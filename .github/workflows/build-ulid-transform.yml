---
# Based on the `build_wheels` job of
# https://github.com/bluetooth-devices/ulid-transform/blob/v2.2.9/.github/workflows/ci.yml
name: Build ulid-transform wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ulid-transform version to build (git tag without leading v, e.g. 2.2.9)'
        required: true
        default: '2.2.9'
  pull_request:
    paths:
      - '.github/workflows/build-ulid-transform.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.2.9' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.2.9 there.
  ULID_TRANSFORM_VERSION: ${{ inputs.version || '2.2.9' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build ulid-transform ${{ inputs.version || '2.2.9' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout ulid-transform v${{ env.ULID_TRANSFORM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bluetooth-devices/ulid-transform
          ref: v${{ env.ULID_TRANSFORM_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: REQUIRE_EXTENSION=1
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import ulid_transform._ulid_impl as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest tests --ignore=tests/benchmarks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ulid-transform-${{ env.ULID_TRANSFORM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ulid-transform ${{ inputs.version || '2.2.9' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: ulid-transform-${{ inputs.version || '2.2.9' }}-*-manylinux_riscv64
