---
# This workflow is based on: https://github.com/python-lz4/python-lz4/blob/v4.4.5/.github/workflows/build_dist.yml
name: Build lz4 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lz4.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lz4.yml'
      - 'docs/packages/lz4.yaml'
      - 'patches/lz4/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lz4.yml'
      - 'docs/packages/lz4.yaml'
      - 'patches/lz4/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lz4
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lz4 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # Upstream runs the free-threaded suite under pytest-run-parallel, with
          # one thread on its slower (arm) runners.
          - python: "cp314t"
            pytest_addopts: PYTEST_ADDOPTS=--parallel-threads=1
            tox_free_threading: -x testenv.deps+=pytest-run-parallel

    env:
      LZ4_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lz4 v${{ env.LZ4_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: python-lz4/python-lz4
          ref: v${{ env.LZ4_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch lz4 source
        run: git apply python-wheels/patches/lz4/${{ env.LZ4_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The patch dirties the checkout, so setuptools_scm would derive 4.4.6.dev0
          # from `git describe` instead of the tag.
          CIBW_ENVIRONMENT: PYLZ4_USE_SYSTEM_LZ4=False SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LZ4=${{ env.LZ4_VERSION }} PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ ${{ matrix.pytest_addopts }}
          CIBW_TEST_REQUIRES: tox
          # Upstream's `tox -c {project}` also runs flake8 and the sphinx docs env
          # against an editable install; `-e py --installpkg` runs the same suite
          # against the wheel that was just built.
          CIBW_TEST_COMMAND: tox -c {package} -e py --installpkg {wheel} ${{ matrix.tox_free_threading }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lz4-${{ env.LZ4_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lz4 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: lz4-${{ matrix.version }}-*-manylinux_riscv64
