---
# This workflow is based on: https://github.com/python-lz4/python-lz4/blob/v4.4.5/.github/workflows/build_dist.yml
name: Build lz4 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lz4.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lz4.yml'
      - 'docs/packages/lz4.yaml'
      - 'patches/lz4/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lz4.yml'
      - 'docs/packages/lz4.yaml'
      - 'patches/lz4/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lz4
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lz4 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # Upstream runs the free-threaded suite under pytest-run-parallel, with
        # one thread on its slower (arm) runners.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "lz4"
      version: "${{ matrix.version }}"
      repository: "python-lz4/python-lz4"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The patch dirties the checkout, so setuptools_scm would derive 4.4.6.dev0
      # from `git describe` instead of the tag.
      cibw-environment-linux: "PYLZ4_USE_SYSTEM_LZ4=False SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LZ4=${{ matrix.version }}  ${{ case(endsWith(matrix.python, 't'), 'PYTEST_ADDOPTS=--parallel-threads=1', '') }}"
      cibw-test-requires: "tox"
      # Upstream's `tox -c {project}` also runs flake8 and the sphinx docs env
      # against an editable install; `-e py --installpkg` runs the same suite
      # against the wheel that was just built.
      cibw-test-command: "tox -c {package} -e py --installpkg {wheel} ${{ case(endsWith(matrix.python, 't'), '-x testenv.deps+=pytest-run-parallel', '') }}"

  publish:
    name: Publish lz4 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lz4-${{ matrix.version }}-*-manylinux_riscv64
