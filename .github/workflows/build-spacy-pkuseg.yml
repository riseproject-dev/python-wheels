---
# This workflow is based on the `build_wheels` job of
# https://github.com/explosion/spacy-pkuseg/blob/release-v1.0.1/.github/workflows/cibuildwheel.yml
# and on the `tests` job of
# https://github.com/explosion/spacy-pkuseg/blob/release-v1.0.1/.github/workflows/tests.yml
name: Build spacy-pkuseg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spacy-pkuseg.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-pkuseg.yml'
      - 'docs/packages/spacy-pkuseg.yaml'
      - 'patches/spacy-pkuseg/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-pkuseg.yml'
      - 'docs/packages/spacy-pkuseg.yaml'
      - 'patches/spacy-pkuseg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spacy-pkuseg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spacy-pkuseg ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "spacy-pkuseg"
      version: "${{ matrix.version }}"
      repository: "explosion/spacy-pkuseg"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/spacy-pkuseg/${{ matrix.version }}"
        if [ -d "$patches" ]; then
          git apply "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cython and numpy (build) and numpy and srsly (runtime) have no riscv64
      # wheels on public PyPI; both environments resolve them from our registry.
      # The extensions do not declare free-threading support, so importing them under
      # cp314t re-enables the GIL with a RuntimeWarning that -Werror turns fatal;
      # asking for the GIL up front is the same outcome without the warning. Ignored
      # on the GIL builds.
      cibw-test-environment: "PYTHON_GIL=1"
      # Upstream leaves cibuildwheel's test-command empty and runs the suite from
      # tests.yml instead; that is the pytest line below. The bundled suite only
      # imports the package, so the checks before it exercise the extensions.
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import math, numpy as np; from spacy_pkuseg.inference import run_viterbi; from spacy_pkuseg.feature_extractor import get_slice_str; score, states = run_viterbi(np.array([[0., 3.], [2., 0.], [0., 5.]]), np.array([[0., 1.], [.5, 0.]])); assert list(states) == [1, 0, 1], states; assert abs(score - math.exp(11.5)) < 1e-6 * score, score; assert get_slice_str('abcdef', 1, 3, 6) == 'bcd'\" && python -m pytest --pyargs spacy_pkuseg -Werror"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPACY_PKUSEG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spacy-pkuseg-${{ env.SPACY_PKUSEG_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"spacy_pkuseg/feature_extractor", "spacy_pkuseg/inference",
                      "spacy_pkuseg/postag/feature_extractor"}
          for whl in sys.argv[1:]:
              found = {n.split(".", 1)[0] for n in zipfile.ZipFile(whl).namelist()
                       if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish spacy-pkuseg ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spacy-pkuseg-${{ matrix.version }}-*-manylinux_riscv64
