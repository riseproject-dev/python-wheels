---
# This workflow is based on the `wheels` job of
# https://github.com/pypackaging-native/pkgconf-pypi/blob/3.0.7-0/.github/workflows/build.yml
# and the `pytest` job of
# https://github.com/pypackaging-native/pkgconf-pypi/blob/3.0.7-0/.github/workflows/test.yml
name: Build pkgconf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pkgconf.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pkgconf.yml'
      - 'docs/packages/pkgconf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pkgconf.yml'
      - 'docs/packages/pkgconf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pkgconf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pkgconf ${{ matrix.version }} py3-none-riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90

    env:
      PKGCONF_VERSION: ${{ matrix.version }}

    steps:
      # Upstream tags 3.0.7-0 for the wheel version 3.0.7.post0.
      - id: tag
        run: echo "ref=${PKGCONF_VERSION/.post/-}" >> "$GITHUB_OUTPUT"

      - name: Checkout pkgconf-pypi ${{ steps.tag.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pypackaging-native/pkgconf-pypi
          ref: ${{ steps.tag.outputs.ref }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          sparse-checkout: patches/pkgconf
          persist-credentials: false

      - name: Patch pkgconf-pypi source
        run: git apply python-wheels/patches/pkgconf/${{ env.PKGCONF_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Upstream runs test.yml's suite from the checkout against `pip install .[test]`.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: cd {project} && python -m pytest --showlocals -vv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkgconf-${{ env.PKGCONF_VERSION }}-py3-none-riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pkgconf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pkgconf-${{ matrix.version }}-py3-none-riscv64
