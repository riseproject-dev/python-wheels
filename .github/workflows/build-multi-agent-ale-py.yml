---
# This workflow is based on the `build_linux` job of
# https://github.com/Farama-Foundation/Multi-Agent-ALE/blob/v0.1.12/.github/workflows/build-wheels-and-publish.yml
name: Build multi-agent-ale-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/multi-agent-ale-py.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-multi-agent-ale-py.yml'
      - 'docs/packages/multi-agent-ale-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-multi-agent-ale-py.yml'
      - 'docs/packages/multi-agent-ale-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: multi-agent-ale-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build multi-agent-ale-py ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      MULTI_AGENT_ALE_PY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout multi-agent-ale-py v${{ env.MULTI_AGENT_ALE_PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Farama-Foundation/Multi-Agent-ALE
          ref: v${{ env.MULTI_AGENT_ALE_PY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # USE_SDL is off (setup.py's own CMake args), so the only native dependency
          # is zlib; cmake/ninja come from PyPI (both ship riscv64 wheels now).
          CIBW_BEFORE_ALL: dnf install -y -q zlib-devel
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: multi_agent_ale_py/tests
          CIBW_TEST_COMMAND: python -m pytest multi_agent_ale_py/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: multi-agent-ale-py-${{ env.MULTI_AGENT_ALE_PY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish multi-agent-ale-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: multi-agent-ale-py-${{ matrix.version }}-*-manylinux_riscv64
