---
# This workflow is based on the `build_linux` job of
# https://github.com/Farama-Foundation/Multi-Agent-ALE/blob/v0.1.12/.github/workflows/build-wheels-and-publish.yml
name: Build multi-agent-ale-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/multi-agent-ale-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-multi-agent-ale-py.yml'
      - 'docs/packages/multi-agent-ale-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-multi-agent-ale-py.yml'
      - 'docs/packages/multi-agent-ale-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: multi-agent-ale-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build multi-agent-ale-py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: multi-agent-ale-py
      version: ${{ matrix.version }}
      repository: Farama-Foundation/Multi-Agent-ALE
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # USE_SDL is off (setup.py's own CMake args), so the only native dependency
      # is zlib; cmake/ninja come from PyPI (both ship riscv64 wheels now).
      cibw-before-all: dnf install -y -q zlib-devel
      cibw-test-requires: pytest
      cibw-test-sources: multi_agent_ale_py/tests
      cibw-test-command: python -m pytest multi_agent_ale_py/tests
      timeout-minutes: 90

  publish:
    name: Publish multi-agent-ale-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: multi-agent-ale-py-${{ matrix.version }}-*-manylinux_riscv64
