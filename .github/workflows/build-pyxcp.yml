---
# This workflow is based on the `build_wheels` job of
# https://github.com/christoph2/pyxcp/blob/01d202d91dfe3d672db9543100dc97760bf84e1f/.github/workflows/pythonapp.yml
name: Build pyxcp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyxcp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxcp.yml'
      - 'docs/packages/pyxcp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxcp.yml'
      - 'docs/packages/pyxcp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyxcp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyxcp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyxcp
      version: ${{ matrix.version }}
      repository: christoph2/pyxcp
      ref: 01d202d91dfe3d672db9543100dc97760bf84e1f
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream publishes from master without tagging, so pin the release commit: its
      # tree is identical to the 0.29.19 PyPI sdist. Update alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      # test_scripts.py reads ../../pyproject.toml relative to the tests directory.
      cibw-test-sources: pyxcp/tests pyproject.toml
      cibw-test-command: >-
        python -c "import pyxcp.recorder.rekorder as m; assert m.__file__.endswith('.so'), m.__file__" &&
        pytest pyxcp/tests
      timeout-minutes: 90

  publish:
    name: Publish pyxcp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyxcp-${{ matrix.version }}-*-manylinux_riscv64
