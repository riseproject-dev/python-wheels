---
# Based on upstream's own wheel build, which drives 'pip wheel' + 'auditwheel
# repair' from python/rapids-logger with no cibuildwheel wrapper:
#   https://github.com/rapidsai/rapids-logger/blob/v0.3.0/ci/build_wheel.sh
name: Build rapids-logger wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rapids-logger.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rapids-logger.yml'
      - 'docs/packages/rapids-logger.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rapids-logger.yml'
      - 'docs/packages/rapids-logger.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rapids-logger
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build rapids-logger ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rapids-logger"
      version: "${{ matrix.version }}"
      repository: "rapidsai/rapids-logger"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 180
      cibw-package-dir: "python/rapids-logger"
      # wheel.py-api = "py3", so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      cibw-test-command: "python -c \"import rapids_logger; rapids_logger.load_library()\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      RAPIDS_LOGGER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rapids-logger-${{ env.RAPIDS_LOGGER_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries librapids_logger and hides fmt/spdlog symbols
        run: |
          extract_dir="$(mktemp -d)"
          unzip -q wheelhouse/*.whl -d "${extract_dir}"
          library="$(find "${extract_dir}" -type f -name 'librapids_logger.so')"
          test -n "${library}"
          readelf --dyn-syms --wide "${library}" | c++filt > symbols.txt
          for lib in fmt spdlog; do
            if grep -qE "${lib}::" symbols.txt; then
              echo "error: found exported '${lib}::' symbols in ${library}"
              exit 1
            fi
          done
          find "${extract_dir}" -name '*.so'

  publish:
    name: Publish rapids-logger ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rapids-logger-${{ matrix.version }}-*-manylinux_riscv64
