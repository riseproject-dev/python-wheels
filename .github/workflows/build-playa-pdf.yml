#
# Restates upstream's HATCH_BUILD_HOOK_ENABLE_MYPYC=1 alongside our registry,
# needed because the hook's own "cryptography" build dependency has no riscv64
# wheel on public PyPI. mypy>=1.20 makes the compiled ContentStream.__init__
# reject a bytearray where the released x86_64/aarch64 wheels accept one, so
# CIBW_BEFORE_BUILD pins the newest mypy release predating playa-pdf 1.1.0.
name: Build playa-pdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/playa-pdf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-playa-pdf.yml'
      - 'docs/packages/playa-pdf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-playa-pdf.yml'
      - 'docs/packages/playa-pdf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: playa-pdf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build playa-pdf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: playa-pdf
      version: ${{ matrix.version }}
      repository: dhdaines/playa
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: "build; args: --no-isolation"
      cibw-before-build: pip install "hatchling>=1.27.0" hatch-vcs hatch-mypyc "mypy==1.19.1" cryptography
      cibw-environment-linux: "HATCH_BUILD_HOOK_ENABLE_MYPYC=1"
      cibw-test-sources: tests samples pyproject.toml
      cibw-test-requires: pytest cryptography pdfminer.six
      cibw-test-command: >-
        python -c "import playa.parser as m; assert m.__file__.endswith('.so'), 'wheel is not compiled'"
        && python -m pytest tests -v

  publish:
    name: Publish playa-pdf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: playa-pdf-${{ matrix.version }}-*-manylinux_riscv64
