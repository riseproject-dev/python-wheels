---
# Based on the `linux` job of
# https://github.com/bgunebakan/puhu/blob/v0.4.1/.github/workflows/build-wheels.yml
# and the test step of
# https://github.com/bgunebakan/puhu/blob/v0.4.1/.github/workflows/ci.yml
name: Build puhu wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/puhu.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-puhu.yml'
      - 'docs/packages/puhu.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-puhu.yml'
      - 'docs/packages/puhu.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: puhu
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build puhu ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: puhu
      version: ${{ matrix.version }}
      repository: bgunebakan/puhu
      ref: v${{ matrix.version }}
      artifact-tag: cp38-abi3-manylinux_riscv64
      # pyo3's abi3-py38 feature is on unconditionally, so one wheel serves every
      # interpreter; pyo3 0.24 refuses to build for 3.14t, so there is no cp314t job.
      cibw-build: >-
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: pytest
      # The tests ship inside the wheel; --pyargs runs that copy instead of the checkout's.
      cibw-test-command: >-
        python -c "import puhu._core as m; assert m.__file__.endswith('.abi3.so'), m.__file__" &&
        python -m pytest -v --pyargs puhu.tests
      timeout-minutes: 120

  publish:
    name: Publish puhu ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: puhu-${{ matrix.version }}-*-manylinux_riscv64
