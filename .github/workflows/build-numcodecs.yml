---
# Based on upstream's wheel builder:
#   https://github.com/zarr-developers/numcodecs/blob/main/.github/workflows/wheel.yaml
name: Build numcodecs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/numcodecs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-numcodecs.yml'
      - 'docs/packages/numcodecs.yaml'
      - 'patches/numcodecs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-numcodecs.yml'
      - 'docs/packages/numcodecs.yaml'
      - 'patches/numcodecs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: numcodecs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build numcodecs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "numcodecs"
      version: "${{ matrix.version }}"
      repository: "zarr-developers/numcodecs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 300
      checkout-submodules: "true"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Repeats upstream's [tool.cibuildwheel] environment, which this replaces.
      # numpy resolves from our registry; the patch dirties the tree, so pin the
      # version setuptools_scm would otherwise derive from git. numcodecs' own
      # meson.build calls setuptools_scm.get_version() without dist_name (see
      # src/numcodecs/_build_utils/gitversion.py), so only the unsuffixed
      # SETUPTOOLS_SCM_PRETEND_VERSION is honored, not the _FOR_NUMCODECS form.
      cibw-environment-linux: "DISABLE_NUMCODECS_AVX2=1 SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}  PIP_ONLY_BINARY=numpy"
      # test_zstd shells out to the zstd CLI, which the manylinux image lacks;
      # its availability check raises instead of skipping when it is missing.
      cibw-before-test-linux: "dnf -y install zstd"
      cibw-test-extras: "test,test_extras,msgpack"
      # Upstream's wheel job only imports numcodecs; run the bundled suite instead.
      # Since 0.17.0 the suite lives in a top-level tests/ dir, not inside the
      # package, so it must be staged and run directly rather than via --pyargs.
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -c \"import importlib.metadata as md, numcodecs.blosc, numcodecs.zstd, numcodecs.lz4, numcodecs.vlen, numcodecs.compat_ext, numcodecs._shuffle, numcodecs.fletcher32, numcodecs.jenkins as j; assert j.__file__.endswith('.so'), j.__file__; assert any(str(p).endswith('.dist-info/licenses/LICENSE.zstd') for p in md.files('numcodecs'))\" && python -m pytest tests -q"

  publish:
    name: Publish numcodecs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: numcodecs-${{ matrix.version }}-*-manylinux_riscv64
