---
# This workflow is based on the ManyLinux jobs of
# https://github.com/jpype-project/jpype/blob/v1.7.1/.azure/release.yml
# (.azure/scripts/{ivy,wheels-linux,build-wheels,test}.yml).
name: Build JPype1 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jpype1.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jpype1.yml'
      - 'docs/packages/jpype1.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jpype1.yml'
      - 'docs/packages/jpype1.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jpype1
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build JPype1 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jpype1"
      version: "${{ matrix.version }}"
      repository: "jpype-project/jpype"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream builds against JDK 11; Rocky 10 only packages JDK 21.
      cibw-environment-linux: "JAVA_HOME=/usr/lib/jvm/java-21-openjdk"
      # The ivy resolve is upstream's own `.azure/scripts/ivy.yml` stage; it stages the
      # JDBC drivers the DBAPI tests load from `lib/`. sqlite-jdbc is bumped off
      # upstream's 3.27.2.1 pin because that release bundles no riscv64 native library.
      cibw-before-all-linux: "dnf -y install java-21-openjdk-devel ant && cd {project} && sed -i 's/\"sqlite-jdbc\" rev=\"[^\"]*\"/\"sqlite-jdbc\" rev=\"3.46.1.3\"/' ivy.xml && curl -sSL --create-dirs -o lib/ivy-2.5.3.jar https://repo1.maven.org/maven2/org/apache/ivy/ivy/2.5.3/ivy-2.5.3.jar && java -jar lib/ivy-2.5.3.jar -ivy ivy.xml -retrieve 'lib/[artifact]-[revision](-[classifier]).[ext]'"
      # test-requirements.txt minus pyinstaller: it publishes no riscv64 wheel and
      # nothing under test/ imports it (upstream exercises it in a separate step).
      cibw-test-requires: "pytest numpy typing_extensions jedi==0.18.0"
      # Upstream's own invocation; `cd` first so jpype resolves to the installed wheel
      # rather than the checkout. The deselected four assert `lastrowid`, which the
      # newer sqlite-jdbc no longer reports through `getGeneratedKeys`; paths are
      # relative to the pytest rootdir (the checkout), not to the cwd.
      cibw-test-command: "cd {project}/test && python -m pytest -v jpypetest --checkjni --deselect test/jpypetest/test_sql_sqlite.py::CursorTestCase::test_fetchall --deselect test/jpypetest/test_sql_sqlite.py::CursorTestCase::test_fetchone --deselect test/jpypetest/test_sql_sqlite.py::CursorTestCase::test_lastrowid --deselect test/jpypetest/test_sql_sqlite.py::CursorTestCase::test_lastrowidMany"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      JPYPE1_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: jpype1-${{ env.JPYPE1_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the JAR made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_jpype.") and n.endswith(".so") for n in names), whl
              assert "org.jpype.jar" in names, whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish JPype1 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jpype1-${{ matrix.version }}-*-manylinux_riscv64
