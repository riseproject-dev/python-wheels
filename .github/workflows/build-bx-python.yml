---
# This workflow is based on the `build_wheels` job of
# https://github.com/bxlab/bx-python/blob/v0.15.1/.github/workflows/deploy.yaml
name: Build bx-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bx-python version to build (e.g. 0.15.1)'
        required: true
        default: '0.15.1'
  pull_request:
    paths:
      - '.github/workflows/build-bx-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.15.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  BX_PYTHON_VERSION: ${{ inputs.version || '0.15.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build bx-python ${{ inputs.version || '0.15.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout bx-python v${{ env.BX_PYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bxlab/bx-python
          ref: v${{ env.BX_PYTHON_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has riscv64 wheels only on our registry; cython (a build
          # requirement) has none anywhere and must compile from sdist, so
          # only-binary is scoped to numpy alone (gotcha 12).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy

      - name: Check the C extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".so")]
              assert len(names) == 22, (whl, names)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bx-python-${{ env.BX_PYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bx-python ${{ inputs.version || '0.15.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: bx-python-${{ inputs.version || '0.15.1' }}-*-manylinux_riscv64
