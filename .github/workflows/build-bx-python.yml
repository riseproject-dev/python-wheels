---
# This workflow is based on the `build_wheels` job of
# https://github.com/bxlab/bx-python/blob/v0.15.1/.github/workflows/deploy.yaml
name: Build bx-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bx-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bx-python.yml'
      - 'docs/packages/bx-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bx-python.yml'
      - 'docs/packages/bx-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bx-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bx-python ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"
        exclude:
          # 0.16.0 raised requires-python to >=3.11 (0.15.x is still >=3.10), so
          # cibuildwheel selects no cp310 build. Add each newer version here as it is
          # declared.
          - version: "0.16.0"
            python: cp310

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "bx-python"
      version: "${{ matrix.version }}"
      repository: "bxlab/bx-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # numpy has riscv64 wheels only on our registry; cython (a build
      # requirement) has none anywhere and must compile from sdist, so
      # only-binary is scoped to numpy alone (gotcha 12).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"
        exclude:
          # 0.16.0 raised requires-python to >=3.11 (0.15.x is still >=3.10), so
          # cibuildwheel selects no cp310 build. Add each newer version here as it is
          # declared.
          - version: "0.16.0"
            python: cp310
    env:
      BX_PYTHON_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bx-python-${{ env.BX_PYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the C extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".so")]
              assert len(names) == 22, (whl, names)
              print(whl, "ok")
          EOF

  publish:
    name: Publish bx-python ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bx-python-${{ matrix.version }}-*-manylinux_riscv64
