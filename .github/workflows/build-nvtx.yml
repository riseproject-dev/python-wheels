---
# Based on upstream's own wheel build:
#   https://github.com/NVIDIA/NVTX/blob/b7e56f42f85989f6df2839ec08f1666460f972ec/.github/workflows/cibw.yml
name: Build nvtx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nvtx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nvtx.yml'
      - 'docs/packages/nvtx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nvtx.yml'
      - 'docs/packages/nvtx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nvtx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nvtx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: nvtx
      version: ${{ matrix.version }}
      repository: NVIDIA/NVTX
      ref: b7e56f42f85989f6df2839ec08f1666460f972ec
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The Python package is released from the NVIDIA/NVTX monorepo by a
      # workflow_dispatch-only job that never pushes a Python tag (gotcha 103); the
      # repo's v3.* tags are the C/C++ library. This commit's python/ and c/include
      # trees are byte-identical to the 0.2.16 PyPI sdist. Move with the package version.
      cibw-package-dir: python
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy, which upstream's test-command installs and uninstalls to
      # cover both paths, has riscv64 wheels only on our own registry.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      timeout-minutes: 120

  publish:
    name: Publish nvtx ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nvtx-${{ matrix.version }}-*-manylinux_riscv64
