---
# affinegap carries no upstream CI wheel-building workflow (its old Travis
# config was removed; pyproject.toml only declares the setuptools/cython
# build-system), so this plain cibuildwheel build has nothing to narrow.
name: Build affinegap wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/affinegap.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-affinegap.yml'
      - 'docs/packages/affinegap.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-affinegap.yml'
      - 'docs/packages/affinegap.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: affinegap
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build affinegap ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: affinegap
      version: ${{ matrix.version }}
      repository: datamade/affinegap
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # affinegap's tests/ ships with no tests/__init__.py (upstream never added
      # one), so `unittest discover` with a separate top-level dir (-t "{project}")
      # fails importing the start dir: "ImportError: Start directory is not
      # importable: '.../tests'" (reproduces on any host, no riscv64/QEMU needed).
      # Letting -t default to the start dir itself avoids that import check.
      cibw-test-command: >-
        python -c "import affinegap.affinegap as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m unittest discover -s "{project}/tests"
      timeout-minutes: 30

  publish:
    name: Publish affinegap ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      # Both manylinux and musllinux build jobs run (see matrix); a
      # manylinux-only pattern here drops the musllinux artifact before
      # publish ever sees it, so update_doc.py --validate-only reports the
      # release as incomplete even though every target actually built (run
      # 43681827497: all 6 build_wheels jobs succeeded, "no wheel was built
      # for: 3.10:musllinux").
      artifact-pattern: affinegap-${{ matrix.version }}-*riscv64
