---
# Based on the `test` job of
# https://github.com/ofajardo/pyreadr/blob/v0.5.6/.github/workflows/ci.yml
name: Build pyreadr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyreadr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadr.yml'
      - 'docs/packages/pyreadr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadr.yml'
      - 'docs/packages/pyreadr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyreadr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyreadr ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyreadr"
      version: "${{ matrix.version }}"
      repository: "ofajardo/pyreadr"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        cat > collect-licenses.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        project="${1:?usage: collect-licenses.sh <project-dir>}"
        for pkg in bzip2-libs xz-libs; do
          mapfile -t files < <(rpm -q --licensefiles "$pkg" | grep '^/' | while read -r f; do [ -f "$f" ] && echo "$f"; done || true)
          if [ -z "${files[0]:-}" ]; then
            dnf -y reinstall --setopt=tsflags= "$pkg"
            mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING)[^/]*$')
          fi
          for f in "${files[@]}"; do
            cp "$f" "$project/LICENSE.${pkg%-libs}.$(basename "$f")"
          done
        done
        ls "$project"/LICENSE*
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf -y install bzip2-devel xz-devel zlib-devel && bash {project}/collect-licenses.sh {project}"
      # Our registry carries numpy/pandas for cp310/cp311 only at older releases (gotcha 354).
      cibw-test-environment: "PIP_PREFER_BINARY=1"
      cibw-test-sources: "tests test_data"
      cibw-test-requires: "pandas xarray"
      cibw-test-command: "python tests/test_basic.py && python tests/test_http_integration.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYREADR_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyreadr-${{ env.PYREADR_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          grafted_licence = {"libbz2": "LICENSE.bzip2.", "liblzma": "LICENSE.xz."}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyreadr/librdata.") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert {"LICENSE", "LICENSE_librdata", "LICENSE_jamovi_readstat"} <= licences, (whl, licences)
              grafted = {n.rsplit("/", 1)[1].split("-")[0] for n in names if n.startswith("pyreadr.libs/")} - {""}
              assert grafted <= grafted_licence.keys(), (whl, grafted)
              for lib in grafted:
                  assert any(lic.startswith(grafted_licence[lib]) for lic in licences), (whl, lib, licences)
              print(whl, sorted(grafted), sorted(licences))
          EOF

  publish:
    name: Publish pyreadr ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyreadr-${{ matrix.version }}-*-manylinux_riscv64
