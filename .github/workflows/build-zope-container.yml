---
# This workflow is based on: https://github.com/zopefoundation/zope.container/blob/7.3/.github/workflows/tests.yml
name: Build zope-container wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zope-container.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-container.yml'
      - 'docs/packages/zope-container.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-container.yml'
      - 'docs/packages/zope-container.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zope-container
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zope-container ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: zope-container
      version: ${{ matrix.version }}
      repository: zopefoundation/zope.container
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # zope.interface and the rest of the zope.* / ZODB dependency chain
      # have no riscv64 wheel on public PyPI.
      cibw-test-extras: test
      cibw-test-environment: ZOPE_INTERFACE_STRICT_IRO=1
      # Upstream's two test steps. setup.py swallows extension build failures
      # (optional_build_ext), so PURE_PYTHON=0 - which makes the C import
      # mandatory at runtime - is what proves the wheel is not pure Python.
      cibw-test-command: >-
        PURE_PYTHON=0 python -m zope.testrunner --test-path={package}/src &&
        PURE_PYTHON=1 python -m zope.testrunner --test-path={package}/src
      timeout-minutes: 60

  publish:
    name: Publish zope-container ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zope-container-${{ matrix.version }}-*-manylinux_riscv64
