---
# This workflow is based on the `build_wheels` job of
# https://github.com/ARM-DOE/pyart/blob/v2.2.5/.github/workflows/wheels.yml
name: Build arm-pyart wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/arm-pyart.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-arm-pyart.yml'
      - 'docs/packages/arm-pyart.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arm-pyart.yml'
      - 'docs/packages/arm-pyart.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: arm-pyart
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build arm-pyart ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "arm-pyart"
      version: "${{ matrix.version }}"
      repository: "ARM-DOE/pyart"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Repeats upstream's own PIP_ONLY_BINARY=:all: (pyproject.toml's
      # [tool.cibuildwheel] table, which CIBW_ENVIRONMENT would otherwise drop)
      # and adds our registry for numpy/cython (build) and cartopy/netcdf4/scipy/
      # matplotlib/pandas/cftime (runtime/test) - PyPI ships none of these for
      # riscv64. Everything else the test install needs (xarray, fsspec,
      # mda-xdrlib, open-radar-data, pint, pooch, s3fs, xradar) is a pure-Python
      # py3-none-any wheel on PyPI already.
      cibw-environment-linux: "PIP_ONLY_BINARY=:all:"
      # test_grid_xradar asserts a float32 gridded minimum at the default rtol=1e-7;
      # riscv64 gives -1.320179 vs -1.3201784 (rel. diff 6.2e-7, a few float32 ULP),
      # an arch float-rounding difference (gotcha 304). -k, not --deselect (gotcha 14).
      cibw-test-command: "pytest --mpl {project}/tests -k \"not test_grid_xradar\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ARM_PYART_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: arm-pyart-${{ env.ARM_PYART_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.rsplit("/", 1)[-1].split(".")[0] for n in names if n.endswith(".so")}
          expected = {
              "_check_build", "_fast_edge_finder", "_unwrap_1d", "_unwrap_2d",
              "_unwrap_3d", "_sigmetfile", "nexrad_interpolate", "ckdtree",
              "_load_nn_field_data", "_gate_to_grid_map", "_kdp_proc",
          }
          assert exts == expected, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt"}, licences
          EOF

  publish:
    name: Publish arm-pyart ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: arm-pyart-${{ matrix.version }}-*-manylinux_riscv64
