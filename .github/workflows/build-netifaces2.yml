---
# This workflow is based on the `linux`/`linux-musl` jobs of
# https://github.com/SamuelYvon/netifaces-2/blob/V0.0.22/.github/workflows/CI.yml
name: Build netifaces2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'netifaces2 version to build (git tag without the leading V, e.g. 0.0.22)'
        required: true
        default: '0.0.22'
  pull_request:
    paths:
      - '.github/workflows/build-netifaces2.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.0.22' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.0.22 there.
  NETIFACES2_VERSION: ${{ inputs.version || '0.0.22' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build netifaces2 ${{ inputs.version || '0.0.22' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every GIL-ful interpreter in our matrix; cp314t is
          # dropped (gotcha 306): pyo3 0.17.1 predates PEP 703 entirely, so it
          # has no Py_GIL_DISABLED handling at all for a free-threaded build.
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    steps:
      - name: Checkout netifaces-2 V${{ env.NETIFACES2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SamuelYvon/netifaces-2
          ref: V${{ env.NETIFACES2_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # netifaces-2 ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # netifaces/__init__.py imports its compiled extension from the
          # `netifaces.netifaces` submodule (module-name = "netifaces" in
          # [tool.maturin]), so the compiled-extension proof has to probe that
          # submodule rather than the top-level package.
          CIBW_TEST_COMMAND: >-
            python -c "import netifaces.netifaces as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: netifaces2-${{ env.NETIFACES2_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish netifaces2 ${{ inputs.version || '0.0.22' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: netifaces2-${{ inputs.version || '0.0.22' }}-*-manylinux_riscv64
