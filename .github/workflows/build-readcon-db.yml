---
# Based on the `wheels` job of
# https://github.com/lode-org/readcon-db/blob/v0.2.0/.github/workflows/python-wheels.yml
name: Build readcon-db wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/readcon-db.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-readcon-db.yml'
      - 'docs/packages/readcon-db.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-readcon-db.yml'
      - 'docs/packages/readcon-db.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: readcon-db
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build readcon-db ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # maturin globs LICEN[CS]E* relative to the pyproject directory
    # (python/), not the crate root where LICENSE actually lives -
    # unstaged, the upstream PyPI wheel itself ships no licence file.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "readcon-db"
      version: "${{ matrix.version }}"
      repository: "lode-org/readcon-db"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: "cp LICENSE python/LICENSE"
      cibw-package-dir: "python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,h5py,MDAnalysis,matplotlib,contourpy,kiwisolver,pillow"
      cibw-test-requires: "pytest numpy h5py MDAnalysis"
      cibw-test-sources: "python/tests resources"
      # test_append_trajectory_frames needs the `readcon` package, which
      # has no riscv64 wheel on PyPI or pypi.riseproject.dev.
      cibw-test-command: >
        python -c "from readcon_db import readcon_db as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest python/tests
        --deselect python/tests/test_ingest_memory.py::test_append_trajectory_frames

  publish:
    name: Publish readcon-db ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: readcon-db-${{ matrix.version }}-*-manylinux_riscv64
