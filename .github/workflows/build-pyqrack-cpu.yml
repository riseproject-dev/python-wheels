---
# pyqrack-cpu is upstream's own OpenCL-free sibling of pyqrack (published from
# vm6502q/pyqrack's "cpu-only" branch): same Qrack core, same version, only
# Makefile's cmake flags and setup.py's distribution name differ from "main"
# (patches/pyqrack-cpu carries that exact diff forward onto the released tag).
# Plain "pyqrack" needs a system OpenCL install and is out of scope for this
# CPU-only fleet; this is the package upstream itself intends for that case.
name: Build pyqrack-cpu wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyqrack-cpu.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyqrack-cpu.yml'
      - 'docs/packages/pyqrack-cpu.yaml'
      - 'patches/pyqrack-cpu/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyqrack-cpu.yml'
      - 'docs/packages/pyqrack-cpu.yaml'
      - 'patches/pyqrack-cpu/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyqrack-cpu
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyqrack-cpu ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyqrack-cpu"
      version: "${{ matrix.version }}"
      repository: "vm6502q/pyqrack"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        export PYQRACK_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply "python-wheels/patches/pyqrack-cpu/${PYQRACK_VERSION}"/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp312-manylinux_riscv64"
      cibw-before-all-linux: "dnf install -y cmake boost-devel git"
      # setup.py's build_py has no ext_modules to key a platform tag off
      # of, so bdist_wheel defaults to "py3-none-any"; this placeholder
      # forces a real platform and auditwheel repair (default, unmodified)
      # turns it into the real manylinux_riscv64 tag.
      cibw-build-frontend: "build; args: -C--build-option=--plat-name=linux_riscv64"
      cibw-test-requires: "pytest numpy"
      cibw-test-sources: "pyqrack/tests"
      cibw-test-command: "python -m pytest {project}/pyqrack/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYQRACK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyqrack-cpu-${{ env.PYQRACK_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries libqrack_pinvoke and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("qrack_lib/libqrack_pinvoke.so") for n in names), whl
              assert any(n.endswith("qrack_lib/QRACK-LICENSE.md") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyqrack-cpu ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyqrack-cpu-${{ matrix.version }}-*-manylinux_riscv64
