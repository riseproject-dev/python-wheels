---
# This workflow is based on the `build_wheels` job in:
# https://github.com/cython/cython/blob/3.3.0/.github/workflows/wheels.yml
name: Build cython wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cython.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cython.yml'
      - 'docs/packages/cython.yaml'
      - 'patches/cython/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cython.yml'
      - 'docs/packages/cython.yaml'
      - 'patches/cython/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cython
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cython ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cython"
      version: "${{ matrix.version }}"
      repository: "cython/cython"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 600

      # Without a riscv64 override the build inherits upstream's x86 `-march=core2` CFLAGS.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The srctrees reach into docs/ and run the root cython.py; Cython/ stays unstaged so
      # those still import the installed wheel. The two embedding tests are excluded: they
      # link -lpython3.X, and manylinux CPython is static-only with no shared libpython.
      # depfile asserts the depfile names Cython/Includes/libc/math.pxd, which only holds
      # when Cython sits one directory above the build dir rather than in a venv.
      cibw-test-requires: "setuptools"
      cibw-test-command: "cp -r {package}/runtests.py {package}/tests {package}/Demos {package}/docs {package}/cython.py {package}/cythonize.py . && python runtests.py -vv --no-code-style --no-cleanup -x Debugger -x embedded -x embed_modules -x depfile --backends=c,cpp -j$(nproc) --work-dir=TEST_TMP"

  publish:
    name: Publish cython ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cython-${{ matrix.version }}-*-manylinux_riscv64
