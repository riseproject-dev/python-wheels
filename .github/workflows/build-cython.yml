---
# This workflow is based on the `build_wheels` job in:
# https://github.com/cython/cython/blob/3.3.0/.github/workflows/wheels.yml
name: Build cython wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cython version to build (git tag, e.g. 3.3.0)'
        required: true
        default: '3.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-cython.yml'
      - 'patches/cython/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default there.
  CYTHON_VERSION: ${{ inputs.version || '3.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cython ${{ inputs.version || '3.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        # No cp314t: setup.py disables self-compilation under Py_GIL_DISABLED.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout cython ${{ env.CYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cython/cython
          ref: ${{ env.CYTHON_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Without a riscv64 override the build inherits upstream's x86 `-march=core2` CFLAGS.
      - name: Patch cython source
        run: git apply python-wheels/patches/cython/${{ env.CYTHON_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The srctrees reach into docs/ and run the root cython.py; Cython/ stays unstaged so
          # those still import the installed wheel. The two embedding tests are excluded: they
          # link -lpython3.X, and manylinux CPython is static-only with no shared libpython.
          # depfile asserts the depfile names Cython/Includes/libc/math.pxd, which only holds
          # when Cython sits one directory above the build dir rather than in a venv.
          CIBW_TEST_REQUIRES: setuptools
          CIBW_TEST_COMMAND: >-
            cp -r {package}/runtests.py {package}/tests {package}/Demos {package}/docs
            {package}/cython.py {package}/cythonize.py . &&
            python runtests.py -vv --no-code-style --no-cleanup
            -x Debugger -x embedded -x embed_modules -x depfile
            --backends=c,cpp -j$(nproc) --work-dir=TEST_TMP

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cython-${{ env.CYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cython ${{ inputs.version || '3.3.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: cython-${{ inputs.version || '3.3.0' }}-*-manylinux_riscv64
