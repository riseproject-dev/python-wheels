---
# This workflow is based on the `linux` job of
# https://github.com/messense/typst-py/blob/v0.15.0/.github/workflows/CI.yml
name: Build typst wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typst.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typst.yml'
      - 'docs/packages/typst.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typst.yml'
      - 'docs/packages/typst.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typst
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build typst ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py38 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every GIL-ful interpreter; pyo3 disables abi3
          # under Py_GIL_DISABLED, giving the free-threaded build its own
          # wheel. The riscv64 manylinux image has no cp38-cp311, so the abi3
          # wheel is built on our own cp312 floor instead of upstream's cp38.
          - tag: cp38-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "typst"
      version: "${{ matrix.version }}"
      repository: "messense/typst-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # typst-py ships no [tool.cibuildwheel]: install the Rust toolchain
      # maturin needs, plus `perl` for the vendored OpenSSL build that
      # typst-kit's `vendor-openssl` feature pulls in (gotcha 46 -- Rocky
      # 10 ships no FindBin.pm/Time::Piece, so `perl-core` alone isn't
      # enough).
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        dnf -y install perl
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import typst._typst as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('typst'))" &&
        python -m pytest tests -v

  publish:
    name: Publish typst ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: typst-${{ matrix.version }}-*-manylinux_riscv64
