---
# This workflow is based on the `linux` job of
# https://github.com/ail-project/faup-rs/blob/pyfaup-rs-v0.4.19/.github/workflows/maturin.yml
name: Build pyfaup-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyfaup-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfaup-rs.yml'
      - 'docs/packages/pyfaup-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfaup-rs.yml'
      - 'docs/packages/pyfaup-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyfaup-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyfaup-rs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # maturin auto-discovers LICENSE* files relative to the pyproject.toml
    # directory (python/), not the workspace root where LICENSE actually
    # lives -- upstream's own published wheel ships no licence file at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyfaup-rs"
      version: "${{ matrix.version }}"
      repository: "ail-project/faup-rs"
      ref: "pyfaup-rs-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: "cp LICENSE python/"
      cibw-package-dir: "python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pyfaup-rs ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "pytest"
      cibw-test-sources: "python/tests"
      cibw-test-command: >
        python -c "import pyfaup.pyfaup as ext, importlib.metadata as md;
        assert ext.__file__.endswith('.so'), ext.__file__;
        assert {p.name for p in md.files('pyfaup-rs') if 'licenses' in str(p)} == {'LICENSE'}" &&
        python -m pytest -v python/tests/test_pyfaup.py

  publish:
    name: Publish pyfaup-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyfaup-rs-${{ matrix.version }}-*-manylinux_riscv64
