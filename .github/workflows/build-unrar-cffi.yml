---
name: Build unrar-cffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/unrar-cffi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-unrar-cffi.yml'
      - 'docs/packages/unrar-cffi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unrar-cffi.yml'
      - 'docs/packages/unrar-cffi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Mirrors upstream's own build.sh init(), which fetches this exact tarball to
  # populate unrarsrc/ before packaging; the git tree ships none of it.
  UNRAR_SOURCE_VERSION: '5.8.2'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: unrar-cffi
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      UNRAR_CFFI_VERSION: ${{ matrix.version }}

    steps:
      - name: checkout unrar-cffi v${{ env.UNRAR_CFFI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: davide-romanini/unrar-cffi
          ref: v${{ env.UNRAR_CFFI_VERSION }}
          persist-credentials: false

      - name: checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: patch unrar-cffi source
        run: |
          git apply python-wheels/patches/unrar-cffi/${{ env.UNRAR_CFFI_VERSION }}/00*.patch

      - name: fetch UnRAR source
        run: |
          set -euo pipefail
          mkdir -p unrarsrc
          curl -fsSL "https://www.rarlab.com/rar/unrarsrc-${UNRAR_SOURCE_VERSION}.tar.gz" \
            | tar -xz -C unrarsrc --strip-components=1

      - name: setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.UNRAR_CFFI_VERSION }}
        run: |
          set -euo pipefail
          rm -rf dist/
          uv pip install build
          python -m build --sdist

      - name: upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unrar-cffi-${{ env.UNRAR_CFFI_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build unrar-cffi ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      UNRAR_CFFI_VERSION: ${{ matrix.version }}

    steps:
      - name: fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: unrar-cffi-${{ env.UNRAR_CFFI_VERSION }}-sdist

      - name: setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: build/test wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cffi
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests
        run: |
          set -euo pipefail
          mkdir unrar-cffi
          tar zxf "${{ steps.fetch_sdist.outputs.download-path }}"/*.tar.gz --strip-components=1 -C unrar-cffi
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir dist ./unrar-cffi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unrar-cffi-${{ env.UNRAR_CFFI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish unrar-cffi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: unrar-cffi-${{ matrix.version }}-*-manylinux_riscv64
