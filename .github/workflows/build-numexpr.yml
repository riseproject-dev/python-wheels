---
# This workflow is based on the `build_wheels` job of
# https://github.com/pydata/numexpr/blob/v2.14.2/.github/workflows/build.yml
name: Build numexpr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'numexpr version to build (git tag without leading v, e.g. 2.14.2)'
        required: true
        default: '2.14.2'
  pull_request:
    paths:
      - '.github/workflows/build-numexpr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.14.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  NUMEXPR_VERSION: ${{ inputs.version || '2.14.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build numexpr ${{ inputs.version || '2.14.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout numexpr v${{ env.NUMEXPR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pydata/numexpr
          ref: v${{ env.NUMEXPR_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI; both the build backend and
          # the test venv resolve it from our registry.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numexpr-${{ env.NUMEXPR_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numexpr ${{ inputs.version || '2.14.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: numexpr-${{ inputs.version || '2.14.2' }}-*-manylinux_riscv64
