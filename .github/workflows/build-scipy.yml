---
name: Build scipy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scipy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scipy.yml'
      - 'docs/packages/scipy.yaml'
      - 'patches/scipy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scipy.yml'
      - 'docs/packages/scipy.yaml'
      - 'patches/scipy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scipy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scipy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "scipy"
      version: "${{ matrix.version }}"
      # scipy is checked out at the workspace root so cibuildwheel's `{project}`
      # resolves to it, matching upstream's own wheel job.
      repository: "scipy/scipy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 720
      checkout-submodules: "true"

      patches: true
      pre-build: |-
        # Upstream moved this from /project/ to /project/.openblas during 1.18; read whichever
        # the checked-out tag declares so any version builds.
        pkgconf="$(sed -n '/\[tool.cibuildwheel.linux.environment\]/,/^\[/p' pyproject.toml \
                   | grep -oE 'PKG_CONFIG_PATH = "[^"]*"' | head -1 | cut -d'"' -f2)"
        test -n "$pkgconf"
        echo "SCIPY_PKG_CONFIG_PATH=$pkgconf" >> "$GITHUB_ENV"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        printf '%s\n' "PKG_CONFIG_PATH=${SCIPY_PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      # CIBW_ENVIRONMENT replaces scipy's [tool.cibuildwheel.linux.environment] table
      # wholesale, so RUNNER_OS and PKG_CONFIG_PATH have to be restated here.
      cibw-environment-linux: "RUNNER_OS=Linux PIP_ONLY_BINARY=numpy,scipy-openblas32,hypothesis"
      cibw-environment-pass-linux: "PKG_CONFIG_PATH"

  publish:
    name: Publish scipy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scipy-${{ matrix.version }}-*-manylinux_riscv64
