---
name: Build scipy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'scipy version to build (git tag without leading v, e.g. 1.18.1)'
        required: true
        default: '1.18.1'
  pull_request:
    paths:
      - '.github/workflows/build-scipy.yml'
      - 'patches/scipy/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.18.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SCIPY_VERSION: ${{ inputs.version || '1.18.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build scipy ${{ inputs.version || '1.18.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      # scipy is checked out at the workspace root so cibuildwheel's `{project}`
      # resolves to it, matching upstream's own wheel job.
      - name: Checkout scipy v${{ env.SCIPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scipy/scipy
          ref: v${{ env.SCIPY_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch scipy source
        run: |
          git apply python-wheels/patches/scipy/${{ env.SCIPY_VERSION }}/00*.patch

      # Upstream moved this from /project/ to /project/.openblas during 1.18; read whichever
      # the checked-out tag declares so any version builds.
      - name: Read upstream's PKG_CONFIG_PATH
        run: |
          pkgconf="$(sed -n '/\[tool.cibuildwheel.linux.environment\]/,/^\[/p' pyproject.toml \
                     | grep -oE 'PKG_CONFIG_PATH = "[^"]*"' | head -1 | cut -d'"' -f2)"
          test -n "$pkgconf"
          echo "SCIPY_PKG_CONFIG_PATH=$pkgconf" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          # CIBW_ENVIRONMENT replaces scipy's [tool.cibuildwheel.linux.environment] table
          # wholesale, so RUNNER_OS and PKG_CONFIG_PATH have to be restated here.
          CIBW_ENVIRONMENT: >-
            RUNNER_OS=Linux
            PKG_CONFIG_PATH=${{ env.SCIPY_PKG_CONFIG_PATH }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy-openblas32,hypothesis

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scipy-${{ env.SCIPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish scipy ${{ inputs.version || '1.18.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: scipy-${{ inputs.version || '1.18.1' }}-*-manylinux_riscv64
