---
# Based on https://github.com/nmslib/hnswlib/blob/v0.8.0/.github/workflows/build.yml's
# python job.
name: Build hnswlib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hnswlib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hnswlib.yml'
      - 'docs/packages/hnswlib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hnswlib.yml'
      - 'docs/packages/hnswlib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hnswlib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hnswlib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: hnswlib
      version: ${{ matrix.version }}
      repository: nmslib/hnswlib
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: "HNSWLIB_NO_NATIVE=true PIP_ONLY_BINARY=numpy"
      # The checkout's own hnswlib/ (the C++ headers) would shadow the
      # compiled top-level `hnswlib` module if staged (gotcha 25); only
      # the example and test sources upstream's own CI runs are needed.
      cibw-test-sources: examples/python tests/python
      cibw-test-command: >-
        for example in examples/python/example*.py; do python "$example" || exit 1; done &&
        python -m unittest discover -v --start-directory tests/python --pattern "bindings_test*.py"
      timeout-minutes: 90

  publish:
    name: Publish hnswlib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hnswlib-${{ matrix.version }}-*-manylinux_riscv64
