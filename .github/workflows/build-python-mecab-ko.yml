---
# This workflow is based on: https://github.com/jonghwanhyeon/python-mecab-ko/blob/v1.3.7/.github/workflows/wheels.yml
name: Build python-mecab-ko wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-mecab-ko.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-mecab-ko.yml'
      - 'docs/packages/python-mecab-ko.yaml'
      - 'patches/python-mecab-ko/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-mecab-ko.yml'
      - 'docs/packages/python-mecab-ko.yaml'
      - 'patches/python-mecab-ko/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-mecab-ko
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-mecab-ko ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream builds no cp314t Linux wheel yet; the extension declares no
        # free-threading support either way, so cp314t just re-enables the GIL
        # on import (CLAUDE.md gotcha 127) rather than failing.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYTHON_MECAB_KO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-mecab-ko ${{ env.PYTHON_MECAB_KO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jonghwanhyeon/python-mecab-ko
          ref: v${{ env.PYTHON_MECAB_KO_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch python-mecab-ko source
        run: git apply python-wheels/patches/python-mecab-ko/${{ env.PYTHON_MECAB_KO_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyproject.toml's own [tool.cibuildwheel] before-all already builds
          # mecab-ko from upstream's scripts/cibw_before_all.sh (which fetches a
          # fresh config.guess/config.sub from the config.git mirror, so it
          # already resolves riscv64 -- unlike the stale ones the mecab-ko
          # tarball ships), so no CIBW_BEFORE_ALL_LINUX override is needed here.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-mecab-ko-${{ env.PYTHON_MECAB_KO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-mecab-ko ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: python-mecab-ko-${{ matrix.version }}-*-manylinux_riscv64
