---
# This workflow is based on: https://github.com/facebookresearch/diffq/blob/v0.2.4/.github/workflows/build.yml
name: Build diffq wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/diffq.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-diffq.yml'
      - 'docs/packages/diffq.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-diffq.yml'
      - 'docs/packages/diffq.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: diffq
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build diffq ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: diffq
      version: ${{ matrix.version }}
      repository: facebookresearch/diffq
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # diffq.bitpack is a plain Cython extension (no torch/CUDA headers at
      # build time); torch is only a runtime import, needed for the tests.
      cibw-environment-linux: "PIP_ONLY_BINARY=Cython,numpy,torch"
      cibw-test-sources: diffq/tests
      cibw-test-requires: pytest torch
      # diffq/tests lives inside the diffq package itself, so staging it
      # alone leaves a diffq/ dir with no __init__.py in the test cwd, which
      # pytest's rootdir insertion turns into a namespace package shadowing
      # the installed wheel. Rebuild diffq/ from the installed wheel's own
      # tree, then lay the tests back on top of it, before testing.
      # test_torchscript_export needs torchvision, which we don't carry.
      cibw-test-command: >-
        mv diffq diffq-tests-only &&
        python -c "import diffq, os, shutil; shutil.copytree(os.path.dirname(diffq.__file__), 'diffq')" &&
        cp -a diffq-tests-only/tests diffq/tests &&
        python -m pytest -v diffq/tests --deselect diffq/tests/test_diffq.py::TestDiffQ::test_torchscript_export
      timeout-minutes: 30

  publish:
    name: Publish diffq ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: diffq-${{ matrix.version }}-*-manylinux_riscv64
