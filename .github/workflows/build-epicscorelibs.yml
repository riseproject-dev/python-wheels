---
# This workflow is based on upstream's own build/release workflow:
#   https://github.com/epics-base/epicscorelibs/blob/master/.github/workflows/build.yml
name: Build epicscorelibs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/epicscorelibs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-epicscorelibs.yml'
      - 'docs/packages/epicscorelibs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-epicscorelibs.yml'
      - 'docs/packages/epicscorelibs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # PyPI's project_urls / home_page name mdavidsaver/epicscorelibs, but that
  # fork has had no commit since Jan 2025 while PyPI kept releasing (up to
  # 7.0.10.99.0.2 as of this writing); epics-base/epicscorelibs is the org
  # repo the maintainer actually releases from (no tags either way - see
  # EPICSCORELIBS_REF below).
  EPICSCORELIBS_REPO: epics-base/epicscorelibs

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: epicscorelibs
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # The sdist just packages the vendored EPICS source tree; nothing in it is
    # arch-specific, so build it once on x86 rather than on a scarce riscv
    # runner.
    name: Build epicscorelibs ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      EPICSCORELIBS_VERSION: ${{ matrix.version }}
      # epicscorelibs has never pushed a git tag; pin the exact commit whose
      # setup.py reads package_version = '7.0.10.99.0.1' (found via the
      # repo's own commit history, proved by diffing this checkout against
      # the released sdist - identical except PKG-INFO/egg-info and the
      # sdist-only [egg_info] stanza setup.cfg gets at build time). Move this
      # in lockstep with the version entry in docs/packages/epicscorelibs.yaml.
      EPICSCORELIBS_REF: a7c044242c4b8239c97270e97f03f001e8777c12

    steps:
      - name: Checkout epicscorelibs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.EPICSCORELIBS_REPO }}
          ref: ${{ env.EPICSCORELIBS_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch epicscorelibs source
        run: |
          git apply python-wheels/patches/epicscorelibs/${{ env.EPICSCORELIBS_VERSION }}/00*.patch

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Matches upstream's own "PY Source" step (build.yml): plain
      # setup.py sdist, not python -m build, since setup.py's toolchain probe
      # needs setuptools-dso importable before it can even emit a sdist.
      - name: Build sdist
        run: |
          set -euo pipefail
          uv pip install setuptools wheel 'setuptools-dso>=2.11a2'
          python setup.py sdist --formats=gztar

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: epicscorelibs-${{ env.EPICSCORELIBS_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build epicscorelibs ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      EPICSCORELIBS_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: epicscorelibs-${{ env.EPICSCORELIBS_VERSION }}-sdist

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Upstream builds/tests each interpreter the same way ("Docker PY
      # build" in build.yml): a plain PEP 517 wheel build (pyproject.toml's
      # build-system.requires already pins setuptools-dso, so no
      # CIBW_BEFORE_BUILD is needed), then import + their own nose2 suite
      # against the installed wheel (epicscorelibs.test ships inside it).
      - name: Build and test wheel
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=${{ env.PIP_EXTRA_INDEX_URL }}
          CIBW_TEST_REQUIRES: nose2
          CIBW_TEST_COMMAND: >-
            python -c "import epicscorelibs; print('IMPORT', epicscorelibs.__file__)"
            && python -m nose2 -v epicscorelibs
        run: |
          set -euo pipefail
          mkdir epicscorelibs
          tar zxf "${{ steps.fetch_sdist.outputs.download-path }}"/*.tar.gz \
            --strip-components=1 -C epicscorelibs
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse ./epicscorelibs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: epicscorelibs-${{ env.EPICSCORELIBS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish epicscorelibs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: epicscorelibs-${{ matrix.version }}-*-manylinux_riscv64
