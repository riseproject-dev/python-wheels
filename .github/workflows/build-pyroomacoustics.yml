---
# This workflow is based on: https://github.com/LCAV/pyroomacoustics/blob/v0.10.1/.github/workflows/pythonpackage.yml
name: Build pyroomacoustics wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyroomacoustics.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroomacoustics.yml'
      - 'docs/packages/pyroomacoustics.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroomacoustics.yml'
      - 'docs/packages/pyroomacoustics.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyroomacoustics
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyroomacoustics ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYROOMACOUSTICS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyroomacoustics v${{ env.PYROOMACOUSTICS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LCAV/pyroomacoustics
          ref: v${{ env.PYROOMACOUSTICS_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/pyroomacoustics/${{ env.PYROOMACOUSTICS_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PYROOMACOUSTICS_DATA_PATH={project}/pyroomacoustics/data/sofa
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYROOMACOUSTICS=${{ env.PYROOMACOUSTICS_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,matplotlib,pillow,netcdf4,cftime,soxr,cmake
          CIBW_TEST_REQUIRES: "pytest numpy scipy matplotlib python-sofa soxr"
          # test_room_plot.py's no-walls plot tests call the removed np.row_stack under
          # NumPy 2 (room.py's get_bbox); upstream bug, reproduces on x86, unrelated to riscv64.
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests
            --deselect tests/test_room_plot.py::TestRoomPlot::test_anechoic_room_no_walls_2d
            --deselect tests/test_room_plot.py::TestRoomPlot::test_anechoic_room_no_walls_3d

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"build_rir", "libroom"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE", "LICENSE.eigen-mpl2", "LICENSE.eigen-bsd", "LICENSE.nanoflann", "LICENSE.pybind11"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyroomacoustics-${{ env.PYROOMACOUSTICS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyroomacoustics ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyroomacoustics-${{ matrix.version }}-*-manylinux_riscv64
