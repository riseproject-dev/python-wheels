---
# Based on the `wheels` job of
# https://github.com/veelion/python-farmhash/blob/master/build_wheels.sh
name: Build pyfarmhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyfarmhash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfarmhash.yml'
      - 'docs/packages/pyfarmhash.yaml'
      - 'patches/pyfarmhash/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfarmhash.yml'
      - 'docs/packages/pyfarmhash.yaml'
      - 'patches/pyfarmhash/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags and never commits its version
  # bumps: master's setup.py has been stuck at VERSION = (0, 4, 0) since
  # 954c61f3 (2024-05-02) while PyPI has since shipped 0.5.0 and 0.5.1 sdists
  # whose sources are otherwise byte-identical to this commit's tree. Update
  # alongside PYFARMHASH_VERSION and the patch under patches/pyfarmhash/.
  PYFARMHASH_REF: c83451a9df025ef6ab438e7ffe1b37684f7cfec2
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyfarmhash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyfarmhash ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyfarmhash"
      version: "${{ matrix.version }}"
      repository: "veelion/python-farmhash"
      ref: "c83451a9df025ef6ab438e7ffe1b37684f7cfec2"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # Upstream ships no test suite at all; exercise every bound
      # function against known-good outputs instead of an import-only
      # smoke test.
      cibw-test-command: "python -c \"import farmhash; assert farmhash.__file__.endswith('.so'), farmhash.__file__; assert farmhash.hash32('abc') == 795041479; assert farmhash.hash32withseed('abc', 12345) == 2710790815; assert farmhash.hash64('abc') == 2640714258260161385; assert farmhash.hash64(b'abc') == 2640714258260161385; assert farmhash.hash64withseed('abc', 12345) == 13914286602242141520; assert farmhash.hash128('abc') == (4143508125394299908, 11566915719555882565); assert farmhash.hash128withseed('abc', 1234, 0) == (13364216625615136468, 11320522948082609695); assert farmhash.fingerprint32('abc') == 795041479; assert farmhash.fingerprint64('abc') == 2640714258260161385; assert farmhash.fingerprint128('abc') == (4143508125394299908, 11566915719555882565); print('pyfarmhash OK')\""

  publish:
    name: Publish pyfarmhash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyfarmhash-${{ matrix.version }}-*riscv64
