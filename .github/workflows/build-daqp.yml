---
# Based on upstream's own wheel build at this tag:
#   https://github.com/darnstrom/daqp/blob/v0.9.1/.github/workflows/wheels.yml
name: Build daqp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/daqp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-daqp.yml'
      - 'docs/packages/daqp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-daqp.yml'
      - 'docs/packages/daqp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: daqp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build daqp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      DAQP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout daqp v${{ env.DAQP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: darnstrom/daqp
          ref: v${{ env.DAQP_VERSION }}
          persist-credentials: false

      - name: Prepare source files
        run: |
          mkdir -p interfaces/daqp-python/csrc
          cp -r src interfaces/daqp-python/csrc/src
          cp -r include interfaces/daqp-python/csrc/include
          cp -r codegen interfaces/daqp-python/csrc/codegen
          cp CMakeLists.txt interfaces/daqp-python/csrc/CMakeLists.txt
          cp LICENSE interfaces/daqp-python/LICENSE

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: interfaces/daqp-python
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI; ours is what the test env
          # installs, and PIP_ONLY_BINARY keeps pip from falling back to its sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: "pytest -s {package}/test"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: daqp-${{ env.DAQP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish daqp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: daqp-${{ matrix.version }}-*-manylinux_riscv64
