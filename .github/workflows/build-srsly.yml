---
# This workflow is based on the `build_wheels` job of
# https://github.com/explosion/gha-cibuildwheel/blob/main/.github/workflows/cibuildwheel.yml,
# which https://github.com/explosion/srsly/blob/release-v2.5.3/.github/workflows/cibuildwheel.yml
# calls, and on the `tests` job of
# https://github.com/explosion/srsly/blob/release-v2.5.3/.github/workflows/tests.yml.
name: Build srsly wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/srsly.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-srsly.yml'
      - 'docs/packages/srsly.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-srsly.yml'
      - 'docs/packages/srsly.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: srsly
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build srsly ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "srsly"
      version: "${{ matrix.version }}"
      repository: "explosion/srsly"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/srsly/${{ matrix.version }}/00*.patch

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The extensions do not declare free-threading support, so importing them under
      # cp314t re-enables the GIL with a RuntimeWarning that -Werror turns fatal;
      # asking for the GIL up front is the same outcome without the warning. Ignored
      # on the GIL builds.
      cibw-test-environment: "PYTHON_GIL=1"
      # The suite ships in the wheel, so upstream runs it with --pyargs. From
      # requirements.txt, psutil is only used by the skipped cloudpickle tests and
      # nothing left has a pytest-timeout marker.
      cibw-test-requires: "pytest>=4.6.5 mock>=2.0.0,<3.0.0 numpy>=1.15.0"
      # srsly/tests/cloudpickle was left behind by the cloudpickle 3.1.2 bump in the
      # release commit and no longer imports (srsly.cloudpickle.compat and
      # cloudpickle.cell_set are both gone); it fails the same way on every
      # architecture. The licence check guards the patch above.
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(p.name for p in m.files('srsly') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.ruamel_yaml'], f\" && python -m pytest --pyargs srsly -Werror --ignore=\"$(python -c 'import srsly, os; print(os.path.join(os.path.dirname(srsly.__file__), \"tests\", \"cloudpickle\"))')\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SRSLY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: srsly-${{ env.SRSLY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"srsly/msgpack/_epoch", "srsly/msgpack/_packer",
                      "srsly/msgpack/_unpacker", "srsly/ujson/ujson"}
          for whl in sys.argv[1:]:
              found = {n.split(".", 1)[0] for n in zipfile.ZipFile(whl).namelist()
                       if n.endswith(".so")}
              assert expected <= found, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish srsly ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: srsly-${{ matrix.version }}-*-manylinux_riscv64
