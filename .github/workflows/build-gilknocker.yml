---
# This workflow is based on the `linux` job of
# https://github.com/milesgranger/gilknocker/blob/v0.4.2/.github/workflows/CI.yml
name: Build gilknocker wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gilknocker.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gilknocker.yml'
      - 'docs/packages/gilknocker.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gilknocker.yml'
      - 'docs/packages/gilknocker.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gilknocker
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gilknocker ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gilknocker"
      version: "${{ matrix.version }}"
      repository: "milesgranger/gilknocker"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # gilknocker ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # numpy is a test-only dependency; only our registry has it for
      # riscv64, and only-binary keeps a newer PyPI release from winning
      # the resolution and then compiling from sdist.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\"  PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest<8 pytest-rerunfailures==11.1.2 numpy"
      # gilknocker's pyproject.toml has no python-source; maturin
      # auto-generates a gilknocker/__init__.py shim ("from .gilknocker
      # import *") around the compiled gilknocker.gilknocker submodule
      # (gotcha 314), so that's the .so to check.
      cibw-test-command: "python -c \"import gilknocker.gilknocker as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest {project}/tests"

  publish:
    name: Publish gilknocker ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gilknocker-${{ matrix.version }}-*-manylinux_riscv64
