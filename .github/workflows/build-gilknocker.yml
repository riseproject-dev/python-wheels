---
# This workflow is based on the `linux` job of
# https://github.com/milesgranger/gilknocker/blob/v0.4.2/.github/workflows/CI.yml
name: Build gilknocker wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'gilknocker version to build (git tag without leading v, e.g. 0.4.2)'
        required: true
        default: '0.4.2'
  pull_request:
    paths:
      - '.github/workflows/build-gilknocker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.4.2 there.
  GILKNOCKER_VERSION: ${{ inputs.version || '0.4.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build gilknocker ${{ inputs.version || '0.4.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # gilknocker pins pyo3 to a pre-PEP-703 git rev (0.19.2, no abi3
        # feature) with no Py_GIL_DISABLED handling at all, and upstream itself
        # ships no cp313t/cp314t wheels for 0.4.2 - cp314t is dropped outright,
        # same reasoning as the murmurhash2 case (gotcha 306), not just untested.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout gilknocker v${{ env.GILKNOCKER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: milesgranger/gilknocker
          ref: v${{ env.GILKNOCKER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # gilknocker ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # numpy is a test-only dependency; only our registry has it for
          # riscv64, and only-binary keeps a newer PyPI release from winning
          # the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest<8 pytest-rerunfailures==11.1.2 numpy
          # gilknocker's pyproject.toml has no python-source; maturin
          # auto-generates a gilknocker/__init__.py shim ("from .gilknocker
          # import *") around the compiled gilknocker.gilknocker submodule
          # (gotcha 314), so that's the .so to check.
          CIBW_TEST_COMMAND: >-
            python -c "import gilknocker.gilknocker as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gilknocker-${{ env.GILKNOCKER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish gilknocker ${{ inputs.version || '0.4.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: gilknocker-${{ inputs.version || '0.4.2' }}-*-manylinux_riscv64
