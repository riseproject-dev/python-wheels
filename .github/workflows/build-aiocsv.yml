---
# Based on upstream's own wheel builder:
#   https://github.com/MKuranowski/aiocsv/blob/v1.4.1/.github/workflows/deploy.yml
name: Build aiocsv wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'aiocsv version to build (git tag without leading v, e.g. 1.4.1)'
        required: true
        default: '1.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-aiocsv.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  AIOCSV_VERSION: ${{ inputs.version || '1.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build aiocsv ${{ inputs.version || '1.4.1' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout aiocsv v${{ env.AIOCSV_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MKuranowski/aiocsv
          ref: v${{ env.AIOCSV_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: aiofiles pytest pytest-asyncio
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: aiocsv-${{ env.AIOCSV_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish aiocsv ${{ inputs.version || '1.4.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: aiocsv-${{ inputs.version || '1.4.1' }}-*riscv64
