---
# This workflow is based on the `build` job of
# https://github.com/PyVRP/PyVRP/blob/v0.14.0/.github/workflows/CD.yml
name: Build pyvrp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvrp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvrp.yml'
      - 'docs/packages/pyvrp.yaml'
      - 'patches/pyvrp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvrp.yml'
      - 'docs/packages/pyvrp.yaml'
      - 'patches/pyvrp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvrp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyvrp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's own cibuildwheel build glob (pyproject.toml), which
        # excludes cp314t too.
        python: ["cp311", "cp312", "cp313", "cp314"]

    env:
      PYVRP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout PyVRP v${{ env.PYVRP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: PyVRP/PyVRP
          ref: v${{ env.PYVRP_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pyvrp source
        run: |
          patches="python-wheels/patches/pyvrp/${{ env.PYVRP_VERSION }}"
          if [ -d "$patches" ]; then
            git apply "$patches"/*.patch
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,matplotlib,contourpy,kiwisolver,pillow
          CIBW_TEST_REQUIRES: pytest pytest-cov pytest-xdist
          CIBW_TEST_COMMAND: cd {project}/tests && pytest -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyvrp-${{ env.PYVRP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyvrp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyvrp-${{ matrix.version }}-*-manylinux_riscv64
