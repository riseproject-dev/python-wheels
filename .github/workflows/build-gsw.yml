---
# Based on the `build_bdist` job of
# https://github.com/TEOS-10/GSW-python/blob/v3.6.23/.github/workflows/cibuildwheel.yml
name: Build gsw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gsw.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gsw.yml'
      - 'docs/packages/gsw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gsw.yml'
      - 'docs/packages/gsw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gsw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gsw ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      GSW_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout gsw v${{ env.GSW_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TEOS-10/GSW-python
          ref: v${{ env.GSW_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: >-
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py hardcodes Py_LIMITED_API at the cp311 floor unconditionally
          # (no free-threaded branch, unlike upstream's own CI which never attempts
          # cp314t either), and setuptools-scm can't see the tag from
          # cibuildwheel's shallow checkout.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pandas
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GSW=${{ env.GSW_VERSION }}
          CIBW_TEST_REQUIRES: pandas>=2
          CIBW_TEST_COMMAND: >-
            python -c "import gsw; print(f'gsw v{gsw.__version__}')" &&
            python -m pytest --pyargs gsw

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp311-abi3-" in whl, whl
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
              assert exts == {"_gsw_ufuncs"}, exts
              assert any(n.endswith("dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gsw-${{ env.GSW_VERSION }}-cp311-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish gsw ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: gsw-${{ matrix.version }}-*-manylinux_riscv64
