---
# Based on the `build_bdist` job of
# https://github.com/TEOS-10/GSW-python/blob/v3.6.23/.github/workflows/cibuildwheel.yml
name: Build gsw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gsw.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gsw.yml'
      - 'docs/packages/gsw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gsw.yml'
      - 'docs/packages/gsw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gsw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gsw ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gsw"
      version: "${{ matrix.version }}"
      repository: "TEOS-10/GSW-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      cibw-build: "cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # setup.py hardcodes Py_LIMITED_API at the cp311 floor unconditionally
      # (no free-threaded branch, unlike upstream's own CI which never attempts
      # cp314t either), and setuptools-scm can't see the tag from
      # cibuildwheel's shallow checkout.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pandas SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GSW=${{ matrix.version }}"
      cibw-test-requires: "pytest pandas>=2"
      cibw-test-command: "python -c \"import gsw; print(f'gsw v{gsw.__version__}')\" && python -m pytest --pyargs gsw"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      GSW_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gsw-${{ env.GSW_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp311-abi3-" in whl, whl
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
              assert exts == {"_gsw_ufuncs"}, exts
              assert any(n.endswith("dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish gsw ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gsw-${{ matrix.version }}-*-manylinux_riscv64
