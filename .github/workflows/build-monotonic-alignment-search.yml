---
# This workflow is based on the `build-wheels` job of
# https://github.com/eginhard/monotonic_alignment_search/blob/v0.2.1/.github/workflows/pypi-release.yml
name: Build monotonic-alignment-search wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/monotonic-alignment-search.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-monotonic-alignment-search.yml'
      - 'docs/packages/monotonic-alignment-search.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-monotonic-alignment-search.yml'
      - 'docs/packages/monotonic-alignment-search.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: monotonic-alignment-search
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build monotonic-alignment-search ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: monotonic-alignment-search
      version: ${{ matrix.version }}
      repository: eginhard/monotonic_alignment_search
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      # torch (the test-only `cpu` extra) has no riscv64 musllinux wheel on
      # our registry, so musllinux is dropped too.
      cibw-test-requires: pytest numpy torch
      cibw-test-environment: PIP_ONLY_BINARY=numpy,torch
      cibw-test-command: python -m pytest {project}/tests -v
      timeout-minutes: 60

  publish:
    name: Publish monotonic-alignment-search ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: monotonic-alignment-search-${{ matrix.version }}-*-manylinux_riscv64
