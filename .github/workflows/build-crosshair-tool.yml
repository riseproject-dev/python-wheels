---
# Based on upstream's own wheel builder:
#   https://github.com/pschanely/CrossHair/blob/v0.0.110/.github/workflows/build_wheels.yml
name: Build crosshair-tool wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/crosshair-tool.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-crosshair-tool.yml'
      - 'docs/packages/crosshair-tool.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-crosshair-tool.yml'
      - 'docs/packages/crosshair-tool.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: crosshair-tool
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build crosshair-tool ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: crosshair-tool
      version: ${{ matrix.version }}
      repository: pschanely/CrossHair
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-build-frontend: "build"
      # The newest Pillow on PyPI has no riscv64 wheel in our registry yet, so pip took its
      # sdist (no libjpeg headers in the image) over the newest wheel we do have; the dev
      # extras are only needed for the tests, so require a wheel for it.
      cibw-test-environment: "PIP_ONLY_BINARY=pillow"
      cibw-test-extras: "dev"
      cibw-test-requires: "pytest"
      cibw-test-command: pytest {project}/crosshair -m smoke
      cibw-test-skip: "*-musllinux*"
      timeout-minutes: 90

  publish:
    name: Publish crosshair-tool ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: crosshair-tool-${{ matrix.version }}-*riscv64
