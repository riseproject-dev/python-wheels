---
# This workflow is based on: https://github.com/studio-ousia/mojimoji/blob/v0.0.13/.github/workflows/deploy.yml
name: Build mojimoji wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'mojimoji version to build (git tag without leading v, e.g. 0.0.13)'
        required: true
        default: '0.0.13'
  pull_request:
    paths:
      - '.github/workflows/build-mojimoji.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.0.13' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MOJIMOJI_VERSION: ${{ inputs.version || '0.0.13' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build mojimoji ${{ inputs.version || '0.0.13' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout mojimoji v${{ env.MOJIMOJI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: studio-ousia/mojimoji
          ref: v${{ env.MOJIMOJI_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import mojimoji; assert mojimoji.__file__.endswith('.so'), mojimoji.__file__"
            && python -m pytest {project}/test_mojimoji.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mojimoji-${{ env.MOJIMOJI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mojimoji ${{ inputs.version || '0.0.13' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: mojimoji-${{ inputs.version || '0.0.13' }}-*-manylinux_riscv64
