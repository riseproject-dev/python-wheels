---
# This workflow is based on: https://github.com/duckdb/duckdb-python/blob/v1.5.5/.github/workflows/packaging_wheels.yml
name: Build duckdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/duckdb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-duckdb.yml'
      - 'docs/packages/duckdb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-duckdb.yml'
      - 'docs/packages/duckdb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: duckdb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build duckdb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "duckdb"
      version: "${{ matrix.version }}"
      repository: "duckdb/duckdb-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 1440
      checkout-submodules: "true"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's build[uv] frontend crashes cibuildwheel's audit step here (no host uv).
      cibw-build-frontend: "build"
      # Upstream's `yum install -y ccache clang lld` minus ccache (EPEL-only, and the riscv64 manylinux image has no
      # EPEL): since 2.0.0 the Linux wheels link with ThinLTO (DUCKDB_PY_LTO=thin), which needs clang and lld.
      cibw-before-build: "yum install -y clang lld"
      # Upstream's release job pins the version the same way (packaging.yml set-version).
      cibw-environment-linux: "CC=clang CXX=clang++ OVERRIDE_GIT_DESCRIBE=v${{ matrix.version }}"
      # Test phase only, so it can't starve the build backend (gotcha 12).
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      cibw-test-sources: "tests"
      # Upstream's test group minus deps with no riscv64 wheel; their tests are importorskip-guarded.
      cibw-test-requires: "pytest pytest-reraise pytest-timeout pytest-timestamper packaging psutil pytz requests typing-extensions urllib3 fsspec numpy pandas==3.0.3"
      # Upstream's `testsuite: fast` invocation (tests/slow needs network fixtures).
      cibw-test-command: "python -c \"import _duckdb; assert _duckdb.__file__.endswith('.so'), _duckdb.__file__\" && python -m pytest --confcutdir=. --rootdir . -c {project}/pyproject.toml ./tests/fast"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DUCKDB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: duckdb-${{ env.DUCKDB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") for n in names), f"no compiled extension in {whl}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish duckdb ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: duckdb-${{ matrix.version }}-*-manylinux_riscv64
