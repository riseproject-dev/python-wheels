---
# Based on upstream's own wheel builder:
#   https://github.com/Hugoberry/xmhuffman-cython/blob/0.3.0/.github/workflows/build.yml
name: Build xmhuffman wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xmhuffman.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xmhuffman.yml'
      - 'docs/packages/xmhuffman.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xmhuffman.yml'
      - 'docs/packages/xmhuffman.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xmhuffman
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xmhuffman ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      XMHUFFMAN_VERSION: ${{ matrix.version }}

    steps:
      # Upstream's own tags are inconsistently cased: 0.1.0/0.2.0/0.3.0 are
      # bare, but 0.3.1 is `V0.3.1`. Probe for the bare tag first and fall
      # back to the "V"-prefixed one.
      - name: Determine upstream tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags https://github.com/Hugoberry/xmhuffman-cython "refs/tags/${XMHUFFMAN_VERSION}" > /dev/null; then
            echo "tag=${XMHUFFMAN_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=V${XMHUFFMAN_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout xmhuffman-cython ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Hugoberry/xmhuffman-cython
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python {package}/e2e_test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xmhuffman-${{ env.XMHUFFMAN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish xmhuffman ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: xmhuffman-${{ matrix.version }}-*-manylinux_riscv64
