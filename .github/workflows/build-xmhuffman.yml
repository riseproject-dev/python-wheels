---
# Based on upstream's own wheel builder:
#   https://github.com/Hugoberry/xmhuffman-cython/blob/0.3.0/.github/workflows/build.yml
name: Build xmhuffman wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'xmhuffman version to build (git tag, e.g. 0.3.0)'
        required: true
        default: '0.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-xmhuffman.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  XMHUFFMAN_VERSION: ${{ inputs.version || '0.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build xmhuffman ${{ inputs.version || '0.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout xmhuffman-cython ${{ env.XMHUFFMAN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Hugoberry/xmhuffman-cython
          ref: ${{ env.XMHUFFMAN_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python {package}/e2e_test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xmhuffman-${{ env.XMHUFFMAN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish xmhuffman ${{ inputs.version || '0.3.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: xmhuffman-${{ inputs.version || '0.3.0' }}-*-manylinux_riscv64
