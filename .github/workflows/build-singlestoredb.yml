---
# This workflow is based on the build-and-test job of
# https://github.com/singlestore-labs/singlestoredb-python/blob/v1.18.2/.github/workflows/publish.yml
name: Build singlestoredb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/singlestoredb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-singlestoredb.yml'
      - 'docs/packages/singlestoredb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-singlestoredb.yml'
      - 'docs/packages/singlestoredb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: singlestoredb
      version: ${{ inputs.version }}
      # The test needs pyarrow and polars, which our registry only carries from cp311/cp312 up.
      python-exclude: "cp39 cp310 cp311"

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build singlestoredb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: singlestoredb
      version: ${{ matrix.version }}
      repository: singlestore-labs/singlestoredb-python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's cibuildwheel 2.16 never ran abi3audit; accel.c calls _PyUnicode_AsUTF8 on every arch.
      cibw-audit-command: ''
      # Upstream's test_basics needs a live SingleStore cluster; the dummy URL only stops conftest starting one.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pandas,pyarrow,polars-runtime-32 SINGLESTOREDB_URL=mysql://root:root@127.0.0.1:3306/db"
      cibw-test-requires: pytest pytest-xdist parameterized numpy pandas polars pyarrow
      cibw-test-command: >-
        python -c "import _singlestoredb_accel" &&
        pytest -v --pyargs singlestoredb.tests.test_ext_func_data
      timeout-minutes: 60

  publish:
    name: Publish singlestoredb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: singlestoredb-${{ matrix.version }}-*_riscv64
