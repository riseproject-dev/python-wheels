---
# This workflow is based on the build-and-test job of
# https://github.com/singlestore-labs/singlestoredb-python/blob/v1.18.2/.github/workflows/publish.yml
name: Build singlestoredb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/singlestoredb.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-singlestoredb.yml'
      - 'docs/packages/singlestoredb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-singlestoredb.yml'
      - 'docs/packages/singlestoredb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: singlestoredb
      version: ${{ inputs.version }}
      # The test needs pyarrow and polars, which our registry only carries from cp311/cp312 up.
      python-exclude: "cp39 cp310 cp311"

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build singlestoredb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      SINGLESTOREDB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout singlestoredb v${{ env.SINGLESTOREDB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: singlestore-labs/singlestoredb-python
          ref: v${{ env.SINGLESTOREDB_VERSION }}
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's cibuildwheel 2.16 never ran abi3audit; accel.c calls _PyUnicode_AsUTF8 on every arch.
          CIBW_AUDIT_COMMAND: ''
          # Upstream's test_basics needs a live SingleStore cluster; the dummy URL only stops conftest starting one.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pandas,pyarrow,polars-runtime-32
            SINGLESTOREDB_URL=mysql://root:root@127.0.0.1:3306/db
          CIBW_TEST_REQUIRES: pytest parameterized numpy pandas polars pyarrow
          CIBW_TEST_COMMAND: >-
            python -c "import _singlestoredb_accel" &&
            pytest -v --pyargs singlestoredb.tests.test_ext_func_data

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: singlestoredb-${{ env.SINGLESTOREDB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish singlestoredb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: singlestoredb-${{ matrix.version }}-*_riscv64
