---
# This workflow is based on the `build` job of
# https://github.com/adamchainz/djade/blob/1.9.0/.github/workflows/main.yml
name: Build djade wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/djade.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-djade.yml'
      - 'docs/packages/djade.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-djade.yml'
      - 'docs/packages/djade.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: djade
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: djade
      version: ${{ matrix.version }}
      repository: adamchainz/djade
      ref: ${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 360
      maturin-args: --release --locked

  test_wheel:
    name: Test djade ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      DJADE_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: djade-${{ env.DJADE_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . djade

      # No wheel-level test suite ships in the sdist (gotcha 187): djade's own
      # tests/integration.rs suite is run by upstream's own `cargo test`, never
      # packaged. Drive the real formatter against the README's own documented
      # rules instead of settling for a bare --help check: stdin/stdout
      # reformatting, already-formatted detection, --check mode, and the
      # endblock-labelling rule applied to a file in place.
      - name: Test wheel
        run: |
          set -euo pipefail
          djade --help >/dev/null

          out=$(printf '{{  engine  |  paint  }}' | djade -)
          [ "$out" = '{{ engine|paint }}' ]

          printf '{{ engine|paint }}\n' | djade - >/dev/null

          set +e
          printf '{{  engine  |  paint  }}' | djade --check - >/dev/null
          rc=$?
          set -e
          [ "$rc" -eq 1 ]

          work=$(mktemp -d)
          printf '{%% block funnel %%}\nhi\n{%% endblock %%}\n' > "$work/t.html"
          set +e
          djade "$work/t.html"
          rc=$?
          set -e
          [ "$rc" -eq 1 ]
          grep -qx '{% endblock funnel %}' "$work/t.html"

  publish:
    name: Publish djade ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: djade-${{ matrix.version }}-manylinux_riscv64
