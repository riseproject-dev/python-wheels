---
# This workflow is based on: https://github.com/BrorH/pycauset/blob/v0.6.1/.github/workflows/publish.yml
# and its test step on: https://github.com/BrorH/pycauset/blob/v0.6.1/.github/workflows/ci.yml
name: Build pycauset wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycauset.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycauset.yml'
      - 'docs/packages/pycauset.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycauset.yml'
      - 'docs/packages/pycauset.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycauset
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pycauset ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycauset"
      version: "${{ matrix.version }}"
      repository: "BrorH/pycauset"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      checkout-fetch-depth: 0
      pre-build: |-
        cat > collect-licenses.sh <<'EOF'
        #!/bin/bash
        set -euo pipefail
        project="${1:?usage: collect-licenses.sh <project-dir>}"
        cp /usr/share/licenses/openblas/LICENSE "${project}/LICENSE.openblas"
        cp /usr/share/doc/lapack/LICENSE "${project}/LICENSE.lapack"
        curl -fsSL --retry 3 https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2 -o "${project}/LICENSE.eigen"
        curl -fsSL --retry 3 https://raw.githubusercontent.com/pybind/pybind11/v2.12.0/LICENSE -o "${project}/LICENSE.pybind11"
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's before-all minus gcc-toolset-12 and ccache: the image's default GCC already has full C++20.
      # lapack marks its LICENSE %doc (/usr/share/doc/lapack/LICENSE), which the image's
      # tsflags=nodocs drops, so install with docs enabled (gotcha 137).
      cibw-before-all-linux: "dnf -y --setopt=tsflags= install libatomic openblas-devel lapack-devel && bash {project}/collect-licenses.sh {project}"
      cibw-environment-linux: "CMAKE_ARGS='-DPython_FIND_STRATEGY=LOCATION' PIP_ONLY_BINARY=numpy"
      cibw-test-extras: "test"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests/python -q"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYCAUSET_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pycauset-${{ env.PYCAUSET_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and all licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pycauset/_pycauset.") and n.endswith(".so") for n in names), whl
              print("\n".join(n for n in names if n.startswith("pycauset.libs/")))
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.openblas", "LICENSE.lapack", "LICENSE.eigen", "LICENSE.pybind11"}, (whl, licences)
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for pycauset ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: pycauset
      version: ${{ matrix.version }}
      # auditwheel vendors the image's libgomp (OpenMP) and OpenBLAS' libgfortran.
      packages: gcc

  publish:
    name: Publish pycauset ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycauset-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pycauset-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
