---
# This workflow is based on: https://github.com/equinor/resdata/blob/6.3.3/.github/workflows/testing.yml
name: Build resdata wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/resdata.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-resdata.yml'
      - 'docs/packages/resdata.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-resdata.yml'
      - 'docs/packages/resdata.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: resdata
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build resdata ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]

    env:
      RESDATA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout resdata ${{ env.RESDATA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: equinor/resdata
          ref: ${{ env.RESDATA_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # upstream's build[uv] needs a host uv the runner has none of (gotcha 13)
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Conan links these into libresdata statically and upstream ships no licence
          # text for them, so stage each package's own licences at the project root.
          CIBW_BEFORE_BUILD: |
            set -eu
            rm -rf {package}/_skbuild
            pip install conan "cmake<4"
            conan profile detect --force
            conan install {package} --output-folder=/tmp/conan --build=missing --deployer=full_deploy --deployer-folder=/tmp/conan
            for dep in /tmp/conan/full_deploy/host/*; do
              find "$dep" -path '*/licenses/*' -type f | sort | xargs -r cat > "{package}/LICENSE.${dep##*/}"
              test -s "{package}/LICENSE.${dep##*/}"
            done
          # The registry trails PyPI for these, and pydantic pins pydantic-core exactly.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy,pandas,pydantic-core
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m;
            got = sorted(p.name for p in m.files('resdata') if '.dist-info/licenses/' in str(p));
            assert got == ['COPYING', 'LICENSE', 'LICENSE.backward-cpp', 'LICENSE.bzip2', 'LICENSE.elfutils', 'LICENSE.fmt', 'LICENSE.pybind11', 'LICENSE.xz_utils', 'LICENSE.zlib', 'LICENSE.zstd'], got" &&
            pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resdata-${{ env.RESDATA_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (elfutils) for resdata ${{ matrix.version }}
    runs-on: ubuntu-latest
    env:
      RESDATA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout resdata ${{ env.RESDATA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: equinor/resdata
          ref: ${{ env.RESDATA_VERSION }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # libresdata statically links libdw/libelf (GPL-2.0+ or LGPL-3.0+) from the
      # elfutils that Conan builds from conan.lock's recipe revision and its patches.
      - name: Archive the elfutils source and Conan recipe
        run: |
          set -euo pipefail
          uv pip install conan
          conan profile detect
          ref=$(python -c 'import json; print(next(r.split("%")[0] for r in json.load(open("conan.lock"))["requires"] if r.startswith("elfutils/")))')
          conan download "$ref" -r conancenter --only-recipe
          recipe=$(conan cache path "$ref")
          read -r url sha256 < <(python - "$recipe/conandata.yml" "${ref#*/}" <<'PY'
          import sys, yaml
          source = yaml.safe_load(open(sys.argv[1]))["sources"][sys.argv[2].split("#")[0]]
          print(source["url"], source["sha256"])
          PY
          )
          mkdir -p gpl-sources/recipe
          curl -fsSL --retry 5 -o "gpl-sources/${url##*/}" "$url"
          echo "$sha256  gpl-sources/${url##*/}" | sha256sum -c -
          cp -r "$recipe"/. "$(conan cache path --folder export_source "$ref")"/. gpl-sources/recipe/
          tar -cf gpl-sources.tar gpl-sources

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resdata-${{ env.RESDATA_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish resdata ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: resdata-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: resdata-${{ matrix.version }}-gpl-sources
      gpl-sources-description: elfutils
