---
# This workflow is based on the `wheels-linux` job of
# https://github.com/heitzmann/gdstk/blob/v1.0.1/.github/workflows/publish-packages.yml
name: Build gdstk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gdstk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gdstk.yml'
      - 'docs/packages/gdstk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gdstk.yml'
      - 'docs/packages/gdstk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  QHULL_TAG: v8.0.2

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gdstk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gdstk ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gdstk"
      version: "${{ matrix.version }}"
      repository: "heitzmann/gdstk"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        sed -n '/Author    :  Angus Johnson/,/http:\/\/www.boost.org\/LICENSE_1_0.txt/p' \
          external/clipper/clipper.hpp > LICENSE.clipper
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/qhull/qhull/v8.0.2/COPYING.txt" -o LICENSE.qhull
        test -s LICENSE.clipper
        test -s LICENSE.qhull

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # zlib is linked from the system; Qhull is not on the manylinux image
      # and is built from source, mirroring upstream's own before-all step.
      cibw-before-all-linux: "dnf -y install zlib-devel && mkdir -p /tmp/qhull && curl -fsSL \"https://github.com/qhull/qhull/archive/refs/tags/v8.0.2.tar.gz\" | tar -xz -C /tmp/qhull --strip-components=1 && cmake -S /tmp/qhull -B /tmp/qhull/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/qhull/build --parallel --target install && ldconfig"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy LIBRARY_PATH=/usr/local/lib LD_LIBRARY_PATH=/usr/local/lib"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GDSTK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gdstk-${{ env.GDSTK_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith("gdstk/_gdstk") and n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.clipper", "LICENSE.qhull"}, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish gdstk ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gdstk-${{ matrix.version }}-*-manylinux_riscv64
