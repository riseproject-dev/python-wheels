---
# This workflow is based on the `mypyc` job in:
# https://github.com/psf/black/blob/26.5.1/.github/workflows/pypi_upload.yml
#
# black publishes mypyc-compiled wheels for common platforms but not riscv64. Its
# committed [tool.cibuildwheel] config drives the whole build (hatch-mypyc hook
# gated on HATCH_BUILD_HOOKS_ENABLE=1, CC=clang, the pytest suite), so we check out
# the tag and inherit it, overriding only the riscv64 image. Setting CIBW_ENVIRONMENT
# here would *replace* that table and silently drop the mypyc trigger — so we don't.
name: Build black wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/black.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-black.yml'
      - 'docs/packages/black.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-black.yml'
      - 'docs/packages/black.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: black
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build black ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # mypyc emits per-interpreter (non-abi3) wheels; upstream skips free-threaded
        # ("mypyc doesn't have great support for free threaded builds"), so no cp314t.
        python: ["cp312", "cp313", "cp314"]

    env:
      BLACK_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout black ${{ env.BLACK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: psf/black
          ref: ${{ env.BLACK_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: black-${{ env.BLACK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish black ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: black-${{ matrix.version }}-*-manylinux_riscv64
