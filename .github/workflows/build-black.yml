---
# This workflow is based on the `mypyc` job in:
# https://github.com/psf/black/blob/26.5.1/.github/workflows/pypi_upload.yml
#
# black publishes mypyc-compiled wheels for common platforms but not riscv64. Its
# committed [tool.cibuildwheel] config drives the whole build (hatch-mypyc hook
# gated on HATCH_BUILD_HOOKS_ENABLE=1, CC=clang, the pytest suite), so we check out
# the tag and inherit it, overriding only the riscv64 image. Setting CIBW_ENVIRONMENT
# here would *replace* that table and silently drop the mypyc trigger — so we don't.
name: Build black wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/black.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-black.yml'
      - 'docs/packages/black.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-black.yml'
      - 'docs/packages/black.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: black
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build black ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: black
      version: ${{ matrix.version }}
      repository: psf/black
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 120

  publish:
    name: Publish black ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: black-${{ matrix.version }}-*-manylinux_riscv64
