---
# This workflow is based on: https://github.com/atcollab/at/blob/pyat-0.8.0/.github/workflows/build-python-wheels.yml
name: Build accelerator-toolbox wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/accelerator-toolbox.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-accelerator-toolbox.yml'
      - 'docs/packages/accelerator-toolbox.yaml'
      - 'patches/accelerator-toolbox/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-accelerator-toolbox.yml'
      - 'docs/packages/accelerator-toolbox.yaml'
      - 'patches/accelerator-toolbox/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: accelerator-toolbox
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build accelerator-toolbox ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "accelerator-toolbox"
      version: "${{ matrix.version }}"
      repository: "atcollab/at"
      ref: "pyat-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build-time requirement (pyproject.toml build-system.requires);
      # scipy/h5py are runtime deps pulled in when cibuildwheel installs the
      # wheel for the test step. Only our registry has any of these for
      # riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist (h5py would need libhdf5-dev).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,h5py"
      cibw-test-sources: "pyat/test"
      cibw-test-requires: "pytest"
      # test_long_arrays_in_m_file reads machine_data/kickmap_w150_20mm.txt, which
      # pyproject.toml's package-data glob (*.m, *.mat only) never ships in any
      # installed wheel -- reproduced against a local x86_64 build, unrelated to riscv64.
      cibw-test-command: "python -m pytest pyat/test -k \"not test_long_arrays_in_m_file\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ACCELERATOR_TOOLBOX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: accelerator-toolbox-${{ env.ACCELERATOR_TOOLBOX_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert "atpass" in exts, exts
          assert "cconfig" in exts, exts
          assert any(n.startswith("DriftPass") for n in exts), exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish accelerator-toolbox ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: accelerator-toolbox-${{ matrix.version }}-*riscv64
