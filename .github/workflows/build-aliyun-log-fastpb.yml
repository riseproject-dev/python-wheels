---
# This workflow is based on the `linux` job of
# https://github.com/aliyun/aliyun-log-python-fastpb/blob/v0.3.0/.github/workflows/release.yml
name: Build aliyun-log-fastpb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aliyun-log-fastpb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aliyun-log-fastpb.yml'
      - 'docs/packages/aliyun-log-fastpb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aliyun-log-fastpb.yml'
      - 'docs/packages/aliyun-log-fastpb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aliyun-log-fastpb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aliyun-log-fastpb ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # `tag` must be a real matrix dimension: gotcha 402 -- an `include`
        # entry with no key in common with an existing dimension is merged
        # onto *every* combination instead of creating its own, so without
        # this the cp314t entry below silently overwrote cp312-abi3 and no
        # cp312-abi3 job ever ran.
        tag: [cp312-abi3, cp314t]
        include:
          # pyo3's abi3-py37 feature is on unconditionally (Cargo.toml), so
          # one abi3 wheel serves every GIL-ful interpreter; pyo3 disables
          # abi3 under Py_GIL_DISABLED, giving the free-threaded build its
          # own wheel (gotcha 181).
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "aliyun-log-fastpb"
      version: "${{ matrix.version }}"
      repository: "aliyun/aliyun-log-python-fastpb"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # aliyun-log-fastpb ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest protobuf"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import aliyun_log_fastpb.aliyun_log_fastpb as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish aliyun-log-fastpb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aliyun-log-fastpb-${{ matrix.version }}-*-manylinux_riscv64
