---
# This workflow is based on the `linux` job of
# https://github.com/jg-rp/rust-iregexp/blob/v0.1.4/.github/workflows/pypi_release.yml
name: Build iregexp-check wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iregexp-check.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iregexp-check.yml'
      - 'docs/packages/iregexp-check.yaml'
      - 'patches/iregexp-check/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iregexp-check.yml'
      - 'docs/packages/iregexp-check.yaml'
      - 'patches/iregexp-check/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iregexp-check
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iregexp-check ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # crates/python/Cargo.toml hardcodes pyo3's abi3-py38 feature
          # unconditionally; the riscv64 manylinux image's oldest interpreter
          # is cp39 (no cp38), so patches/ bumps it to abi3-py39 -- gotcha 96.
          # Built on cp39 and re-tested on the newer ones via
          # find_compatible_wheel. Upstream ships no free-threaded wheel for
          # this release (pyo3 0.22 predates Py_GIL_DISABLED), so there is no
          # second matrix leg.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "iregexp-check"
      version: "${{ matrix.version }}"
      repository: "jg-rp/rust-iregexp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360

      patches: true
      pre-build: |-
        # maturin globs LICEN[CS]E* relative to the pyproject directory,
        # which is crates/python -- so upstream's published wheel carries
        # no licence text at all.
        cp LICENSE.txt crates/python/LICENSE.txt

      cibw-package-dir: "crates/python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Upstream ships no Python test suite; exercise the RFC 9485
      # valid/invalid patterns from crates/iregexp's own Rust test suite.
      cibw-test-command: "python -c \"import iregexp_check as m; assert m.iregexp_check.__file__.endswith('.so'), m.iregexp_check.__file__; assert m.check(r'a.b') is True; assert m.check(r'[0-9]') is True; assert m.check(r'foo|bar') is True; assert m.check(r'[ab]{3}') is True; assert m.check(r'[ab]{3,5}') is True; assert m.check(r'[ab]{3,}') is True; assert m.check(r'[^ab]') is True; assert m.check(r'\\p{L}') is True; assert m.check(r'\\P{L}') is True; assert m.check(r'(?<group>[a-z]*)') is False; assert m.check(r'\\d') is False; assert m.check(r'[\\S ]') is False; assert m.check(r'[0-9]*?') is False; assert m.check(r'(\\w)\\1') is False; assert m.check(r'(?=.*[a-z])(?=.*[A-Z])(?=.*)[a-zA-Z]{8,}') is False; assert m.check(r'(?<=[a-z]{4})\\[a-z]{2}') is False; print('iregexp_check smoke test OK')\""

  publish:
    name: Publish iregexp-check ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: iregexp-check-${{ matrix.version }}-*-manylinux_riscv64
