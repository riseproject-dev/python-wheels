---
# Based on the `python_edlib`/`wheels` targets of
# https://github.com/Martinsos/edlib/blob/1.3.9.post1/.github/workflows/ci.yaml
# and https://github.com/Martinsos/edlib/blob/1.3.9.post1/bindings/python/Makefile
name: Build edlib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/edlib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-edlib.yml'
      - 'docs/packages/edlib.yaml'
      - 'patches/edlib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-edlib.yml'
      - 'docs/packages/edlib.yaml'
      - 'patches/edlib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: edlib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build edlib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "edlib"
      version: "${{ matrix.version }}"
      repository: "Martinsos/edlib"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true
      pre-build: |-
        # setup.py's Extension() sources/include_dirs are relative to itself and
        # expect a local edlib/ subdir (edlib/src/edlib.cpp, edlib/include/edlib.h)
        # -- exactly what bindings/python/Makefile's own `edlib` target populates by
        # copying the top-level C++ core in before invoking cibuildwheel.
        cp -r edlib bindings/python/edlib
        cp LICENSE bindings/python/LICENSE

      cibw-package-dir: "bindings/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # setup.py builds from the pre-generated edlib.bycython.cpp, which
      # isn't checked in (upstream's own Makefile regenerates it before
      # every build too); no pyproject.toml means no long_description
      # source either (README.rst is cog-generated, requires a built wheel).
      # {package}, not a bare filename: before-build's cwd is {project}
      # (the whole checkout), not {package} (gotcha 5).
      cibw-before-build: "pip install cython && cython --cplus {package}/edlib.pyx -o {package}/edlib.bycython.cpp"
      cibw-environment-linux: "EDLIB_OMIT_README_RST=1"
      cibw-test-command: "python3 {package}/test.py"

  publish:
    name: Publish edlib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: edlib-${{ matrix.version }}-*riscv64
