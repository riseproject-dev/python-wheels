---
# Upstream builds Linux wheels with cibuildwheel + setuptools-golang (which runs
# `go build -buildmode=c-shared` on gotfparse/cmd/tfparse/main.go, wrapping Aqua
# Security's defsec/trivy HCL engine):
# https://github.com/cloud-custodian/tfparse/blob/v0.6.21/.github/workflows/release.yml
name: Build tfparse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tfparse.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tfparse.yml'
      - 'docs/packages/tfparse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tfparse.yml'
      - 'docs/packages/tfparse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tfparse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tfparse ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tfparse
      version: ${{ matrix.version }}
      repository: cloud-custodian/tfparse
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Matches upstream's .tool-versions.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        curl -sSfL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.3.linux-riscv64.tar.gz &&
        echo "3b8fd5112340b72587e42c619f43270f1bc21f63cfdb587e6b72e0336580727c  /tmp/go.tar.gz" | sha256sum -c &&
        tar -zxf /tmp/go.tar.gz -C /usr/local/ &&
        rm /tmp/go.tar.gz
      cibw-environment-linux: "PATH=\"/usr/local/go/bin:$PATH\""
      # Upstream's own tests shell out to the terraform CLI (pytest-terraform's
      # TerraformRunner.init()) to fetch provider plugins -- Hashicorp ships no
      # riscv64 terraform build, so that suite can't run here. Exercise the
      # compiled defsec/HCL engine directly instead, the same thing the test
      # suite ultimately checks, on a fixture that takes no provider init.
      cibw-test-command: >-
        python -c "import os, tempfile; from tfparse import load_from_path;
        d = tempfile.mkdtemp();
        open(os.path.join(d, 'main.tf'), 'w').write('resource \"aws_s3_bucket\" \"test\" { bucket = \"my-test-bucket\" }');
        parsed = load_from_path(d);
        assert parsed['aws_s3_bucket'][0]['bucket'] == 'my-test-bucket', parsed;
        print('tfparse smoke test OK')"
      timeout-minutes: 180

  publish:
    name: Publish tfparse ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tfparse-${{ matrix.version }}-*-manylinux_riscv64
