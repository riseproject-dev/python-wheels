# This workflow is based on the `build_wheels` job of:
# https://github.com/siddhantgoel/streaming-form-data/blob/v2.1.0/.github/workflows/build.yml
name: Build streaming-form-data wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'streaming-form-data version to build (git tag without leading v, e.g. 2.1.0)'
        required: true
        default: '2.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-streaming-form-data.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.1.0 there.
  STREAMING_FORM_DATA_VERSION: ${{ inputs.version || '2.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build streaming-form-data ${{ inputs.version || '2.1.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the Cython extension links the version-specific
        # ABI. Upstream's own build.yml doesn't build cp314/cp314t yet and has no
        # free-threading signal (no cp3XXt wheel, no free-threaded CI env, no
        # classifier), so cp314t is skipped here too.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    steps:
      - name: Checkout streaming-form-data v${{ env.STREAMING_FORM_DATA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siddhantgoel/streaming-form-data
          ref: v${{ env.STREAMING_FORM_DATA_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Only manylinux: moto pulls in cryptography, which has no musllinux
          # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=cryptography
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest>=8.3.4 pytest-asyncio>=0.23.0 requests-toolbelt>=1.0.0 moto>=5.0.22
          CIBW_TEST_COMMAND: python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: streaming-form-data-${{ env.STREAMING_FORM_DATA_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish streaming-form-data ${{ inputs.version || '2.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: streaming-form-data-${{ inputs.version || '2.1.0' }}-*-manylinux_riscv64
