# This workflow is based on the `build_wheels` job of:
# https://github.com/siddhantgoel/streaming-form-data/blob/v2.1.0/.github/workflows/build.yml
name: Build streaming-form-data wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/streaming-form-data.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-streaming-form-data.yml'
      - 'docs/packages/streaming-form-data.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-streaming-form-data.yml'
      - 'docs/packages/streaming-form-data.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: streaming-form-data
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build streaming-form-data ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: streaming-form-data
      version: ${{ matrix.version }}
      repository: siddhantgoel/streaming-form-data
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Only manylinux: moto pulls in cryptography, which has no musllinux
      # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=cryptography
      cibw-test-sources: tests
      cibw-test-requires: pytest>=8.3.4 pytest-asyncio>=0.23.0 requests-toolbelt>=1.0.0 moto>=5.0.22
      cibw-test-command: python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish streaming-form-data ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: streaming-form-data-${{ matrix.version }}-*-manylinux_riscv64
