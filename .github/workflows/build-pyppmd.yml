---
# Based on upstream's wheel builder:
#   https://github.com/miurahr/pyppmd/blob/v1.3.1/.github/workflows/publish-to-pypi.yml
name: Build pyppmd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyppmd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyppmd.yml'
      - 'docs/packages/pyppmd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyppmd.yml'
      - 'docs/packages/pyppmd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyppmd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyppmd ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyppmd
      version: ${{ matrix.version }}
      repository: miurahr/pyppmd
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-extras: test
      cibw-test-sources: tests pyproject.toml
      # tests/test_fuzzer.py is a randomised hypothesis fuzzer; its Ppmd8 CUT_OFF
      # examples spend minutes in RestoreModel on any host, riscv64 included.
      cibw-test-command: python -m pytest -vv -s --ignore=tests/test_fuzzer.py
      timeout-minutes: 120

  publish:
    name: Publish pyppmd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyppmd-${{ matrix.version }}-*-manylinux_riscv64
