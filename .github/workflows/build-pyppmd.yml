---
# Based on upstream's wheel builder:
#   https://github.com/miurahr/pyppmd/blob/v1.3.1/.github/workflows/publish-to-pypi.yml
name: Build pyppmd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyppmd version to build (git tag without leading v, e.g. 1.3.1)'
        required: true
        default: '1.3.1'
  pull_request:
    paths:
      - '.github/workflows/build-pyppmd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.3.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYPPMD_VERSION: ${{ inputs.version || '1.3.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyppmd ${{ inputs.version || '1.3.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pyppmd v${{ env.PYPPMD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: miurahr/pyppmd
          ref: v${{ env.PYPPMD_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests pyproject.toml
          # tests/test_fuzzer.py is a randomised hypothesis fuzzer; its Ppmd8 CUT_OFF
          # examples spend minutes in RestoreModel on any host, riscv64 included.
          CIBW_TEST_COMMAND: python -m pytest -vv -s --ignore=tests/test_fuzzer.py

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyppmd-${{ env.PYPPMD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyppmd ${{ inputs.version || '1.3.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: pyppmd-${{ inputs.version || '1.3.1' }}-*-manylinux_riscv64
