---
# This workflow is based on:
# https://github.com/msclock/cppcheck-wheel/blob/v1.5.3/.github/workflows/release.yml
name: Build cppcheck wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cppcheck.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cppcheck.yml'
      - 'docs/packages/cppcheck.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cppcheck.yml'
      - 'docs/packages/cppcheck.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cppcheck
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build cppcheck ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cppcheck"
      version: "${{ matrix.version }}"
      repository: "msclock/cppcheck-wheel"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 120
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/cppcheck/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # wheel.py-api = "py3", so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # Replaces pyproject.toml's own [tool.cibuildwheel.linux] before-build: its
      # `pip install cmake==4.4.4`/`ninja==1.13.2` pins have no riscv64 wheel on
      # PyPI or this registry, and vcpkg (bootstrapped in-tree, builtin-baseline
      # 2026-10-04) has no prebuilt cmake/ninja/git for riscv64 either, so it
      # needs VCPKG_FORCE_SYSTEM_BINARIES plus real binaries on PATH - the
      # manylinux_riscv64 image's own dnf packages, same as build-ale-py.yml.
      cibw-before-build-linux: "dnf install -y --setopt=install_weak_deps=False zip perl-IPC-Cmd pkgconf-pkg-config cmake ninja-build && cmake --version && ninja --version"
      # Repeats pyproject.toml's own `environment` table: CIBW_ENVIRONMENT replaces
      # rather than merges with it (gotcha 107). vcpkg's upstream overrides table
      # only sets VCPKG_FORCE_SYSTEM_BINARIES for the Linux arches it already knows
      # about (x86_64/aarch64/armv7l/ppc64le/s390x/i686), not riscv64.
      # cppcheck is non-PIE on this image; keep its base above vm.mmap_min_addr once
      # auditwheel's patchelf prepends a segment (gotcha 595).
      # The version comes from setuptools_scm, which reads this shallow,
      # patched checkout as 1.5.4.dev0+g<sha>.d<date>; pin it (gotchas 3, 31).
      cibw-environment-linux: "VCPKG_FORCE_SYSTEM_BINARIES=1 LDFLAGS=\"-Wl,-Ttext-segment=0x200000\" SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CPPCHECK=${{ matrix.version }}"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CPPCHECK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cppcheck-${{ env.CPPCHECK_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the cppcheck binary
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          print("\n".join(n for n in names if "/Cppcheck/" in n))
          assert any(n.endswith("/Cppcheck/cppcheck") for n in names), names
          EOF

  publish:
    name: Publish cppcheck ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cppcheck-${{ matrix.version }}-*-manylinux_riscv64
