---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-urdfdom/blob/v6.0.0.c0/.github/workflows/release.yml
name: Build cmeel-urdfdom wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-urdfdom.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-urdfdom.yml'
      - 'docs/packages/cmeel-urdfdom.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-urdfdom.yml'
      - 'docs/packages/cmeel-urdfdom.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-urdfdom
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-urdfdom ${{ matrix.version }} manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmeel-urdfdom"
      version: "${{ matrix.version }}"
      repository: "cmake-wheel/cmeel-urdfdom"
      ref: "v${{ matrix.version }}.c0"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 120
      checkout-submodules: "true"
      # has-sitelib = false: the wheel holds no Python extension, so one
      # py3-none wheel covers every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      cibw-environment-linux: "CMEEL_LOG_LEVEL=DEBUG"
      # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
      cibw-repair-wheel-command: ''

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CMEEL_URDFDOM_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmeel-urdfdom-${{ env.CMEEL_URDFDOM_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for lib in ("model", "world", "sensor"):
              assert f"cmeel.prefix/lib/liburdfdom_{lib}.so.6.0.0" in names, names
          assert "cmeel.prefix/bin/check_urdf" in names, names
          EOF

      - name: Test wheel
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q --only-binary :all: cmeel cmeel-console-bridge cmeel-tinyxml2 cmeel-urdfdom-headers
          pip install -q --only-binary :all: wheelhouse/*.whl
          prefix=$(python3 -c "import pathlib, sysconfig; print(pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix')")
          python3 -c "import ctypes; ctypes.CDLL('$prefix/lib/liburdfdom_model.so')"
          cat > robot.urdf <<'EOF'
          <?xml version="1.0"?>
          <robot name="arm">
            <link name="base"/>
            <link name="upper"/>
            <link name="lower"/>
            <joint name="shoulder" type="revolute">
              <parent link="base"/>
              <child link="upper"/>
              <axis xyz="0 0 1"/>
              <limit lower="-1.57" upper="1.57" effort="10" velocity="1"/>
            </joint>
            <joint name="elbow" type="continuous">
              <parent link="upper"/>
              <child link="lower"/>
              <origin xyz="0 0 0.5"/>
            </joint>
          </robot>
          EOF
          # cmeel's patch gives the libraries an $ORIGIN RPATH but not the tools, as upstream ships them.
          export LD_LIBRARY_PATH="$prefix/lib"
          "$prefix/bin/check_urdf" robot.urdf | tee check.log
          grep -q "Successfully Parsed XML" check.log

  publish:
    name: Publish cmeel-urdfdom ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-urdfdom-${{ matrix.version }}-*-manylinux_riscv64
