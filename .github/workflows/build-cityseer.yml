---
# This workflow is based on the `linux` job of
# https://github.com/benchmark-urbanism/cityseer-api/blob/v5.8.0/.github/workflows/publish_package.yml
name: Build cityseer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cityseer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cityseer.yml'
      - 'docs/packages/cityseer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cityseer.yml'
      - 'docs/packages/cityseer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cityseer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cityseer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cityseer"
      version: "${{ matrix.version }}"
      repository: "benchmark-urbanism/cityseer-api"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cityseer ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=:all:"
      # Upstream's own `check` job: run the pytest suite (minus the
      # performance benchmarks pyproject.toml's addopts already ignores --
      # `cd` into {package} first so cwd matches rootdir and that addopts
      # is actually read. The Overpass-API network test upstream's own
      # suite carries self-skips under GITHUB_ACTIONS.
      # pyarrow is an optional geopandas dependency upstream's own dev
      # group pulls in transitively (via overturemaps); CityNetwork.save()
      # needs it directly and we already ship a riscv64 wheel for it.
      cibw-test-requires: "pytest pyarrow"
      cibw-test-command: "cd {package} && pytest tests -v"

  publish:
    name: Publish cityseer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cityseer-${{ matrix.version }}-*-manylinux_riscv64
