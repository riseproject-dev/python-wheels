---
# This workflow is based on the `linux` job of
# https://github.com/developmentseed/obstore/blob/py-v0.11.1/.github/workflows/wheels.yml
# (pre-0.9.0 versions build like
# https://github.com/developmentseed/obstore/blob/py-v0.8.2/.github/workflows/wheels.yml instead)
name: Build obstore wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/obstore.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-obstore.yml'
      - 'docs/packages/obstore.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-obstore.yml'
      - 'docs/packages/obstore.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: obstore
      version: ${{ inputs.version }}

  # obstore only gained the abi3-py311 feature (and a cp314t build) at 0.9.0;
  # every pending version below that builds one non-abi3 wheel per interpreter
  # instead, so the matrix rows are computed here rather than hardcoded.
  plan:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Expand pending versions into their build rows
        id: plan
        env:
          VERSIONS: ${{ needs.setup.outputs.versions }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os

          rows = []
          for v in json.loads(os.environ["VERSIONS"]):
              if tuple(int(p) for p in v.split(".")[:3]) < (0, 9, 0):
                  # No abi3 feature exists yet; cp314 is dropped too since
                  # this era's pyo3 predates CPython 3.14.
                  for py in ("cp312", "cp313"):
                      rows.append({
                          "version": v, "tag": py,
                          "build": f"{py}-manylinux_riscv64", "features": "",
                          "test_ignore": "--ignore=tests/test_list.py",
                      })
              else:
                  rows += [
                      {
                          "version": v, "tag": "cp311-abi3",
                          "build": (
                              "cp311-manylinux_riscv64 cp312-manylinux_riscv64 "
                              "cp313-manylinux_riscv64 cp314-manylinux_riscv64"
                          ),
                          "features": "--features abi3-py311 --features pyo3/extension-module",
                          "test_ignore": "",
                      },
                      {
                          "version": v, "tag": "cp314t",
                          "build": "cp314t-manylinux_riscv64",
                          "features": "--features pyo3/extension-module",
                          "test_ignore": "",
                      },
                  ]
          print("matrix=" + json.dumps(rows))
          EOF

  build_wheels:
    needs: [setup, plan]
    if: needs.setup.outputs.versions != '[]'
    name: Build obstore ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # 360 wasn't enough: cp311-abi3 stalled compiling the full arrow +
    # object_store + reqwest/rustls stack under runner contention and hit
    # the job timeout mid-build (still running, not crashed).
    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this monorepo is obstore/ -- so upstream's published wheels carry
    # no licence text at all, only the classifier.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "obstore"
      version: "${{ matrix.version }}"
      repository: "developmentseed/obstore"
      ref: "py-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 480
      pre-build: "cp LICENSE obstore/LICENSE"
      cibw-package-dir: "obstore"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # obstore ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
        MATURIN_PEP517_ARGS="${{ matrix.features }}"
      # arro3-core (used by tests/test_list.py) has no riscv64 wheel on
      # public PyPI, only on our own registry.
      cibw-test-environment: "PIP_ONLY_BINARY=arro3-core"
      cibw-test-requires: "pytest pytest-asyncio docker minio requests arro3-core"
      cibw-test-sources: "tests"
      # tests/test_fsspec.py and tests/auth/ need a live Planetary
      # Computer/minio endpoint (fsspec, pystac); the handful of other
      # tests needing a running minio container are deselected below --
      # everything else runs against MemoryStore/LocalStore or constructs
      # requests without ever reaching a server. matrix.test_ignore (from
      # the plan job) additionally drops tests/test_list.py below 0.9.0:
      # it imports polars/pyarrow at module scope and polars has no
      # riscv64 wheel on either index.
      cibw-test-command: >
        python -c "import obstore._obstore as m; assert m.__file__.endswith('.so'), m.__file__"
        && python -m pytest -v tests
        --ignore=tests/test_fsspec.py
        --ignore=tests/auth
        ${{ matrix.test_ignore }}
        --deselect tests/test_delete.py::test_delete_prefix
        --deselect tests/test_buffered.py::test_open_reader_with_prefix
        --deselect tests/test_head.py::test_head_with_prefix
        --deselect tests/store/test_s3.py::test_list_async
        --deselect tests/store/test_s3.py::test_get_async
        --deselect tests/store/test_sign.py::test_sign_roundtrip_with_prefix
        --deselect tests/store/test_sign.py::test_sign_batch_roundtrip_with_prefix

  publish:
    name: Publish obstore ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: obstore-${{ matrix.version }}-*-manylinux_riscv64
