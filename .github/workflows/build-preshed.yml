---
# This workflow is based on: https://github.com/explosion/preshed/blob/release-v3.0.13/.github/workflows/cibuildwheel.yml
name: Build preshed wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/preshed.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-preshed.yml'
      - 'docs/packages/preshed.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-preshed.yml'
      - 'docs/packages/preshed.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: preshed
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build preshed ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "preshed"
      version: "${{ matrix.version }}"
      repository: "explosion/preshed"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cymem/murmurhash ship no riscv64 wheels; both build and test install them.
      # Cython 3.3.0 routes a C-integer __setitem__ through sq_ass_item, whose
      # Py_ssize_t index cannot hold PreshMap's uint64 keys; build-system.requires
      # only floors Cython, so the pin has to be preinstalled.
      cibw-before-build: "pip install \"cython<3.3.0\" setuptools \"cymem>=2.0.2,<2.1.0\" \"murmurhash>=0.28.0,<1.1.0\""
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # Upstream's tests.yml runs the suite bundled in the wheel; it never uses a key
      # above 2**63, so the assertion below is what catches the Cython regression.
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"from preshed.maps import PreshMap; m = PreshMap(); k = (1 << 63) + 12345; m[k] = 7; assert list(m) == [k], list(m); del m[k]\" && python -m pytest --pyargs preshed -Werror"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PRESHED_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: preshed-${{ env.PRESHED_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          expected = {"maps", "counter", "bloom"}
          found = {n.split("/")[-1].split(".")[0] for n in sos}
          assert found == expected, (sos, found)
          print("\n".join(sos))
          EOF

  publish:
    name: Publish preshed ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: preshed-${{ matrix.version }}-*-manylinux_riscv64
