---
# This workflow is based on: https://github.com/explosion/preshed/blob/release-v3.0.13/.github/workflows/cibuildwheel.yml
name: Build preshed wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'preshed version to build (e.g. 3.0.13)'
        required: true
        default: '3.0.13'
  pull_request:
    paths:
      - '.github/workflows/build-preshed.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.0.13' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 3.0.13 there.
  PRESHED_VERSION: ${{ inputs.version || '3.0.13' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build preshed ${{ inputs.version || '3.0.13' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout preshed ${{ env.PRESHED_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/preshed
          ref: release-v${{ env.PRESHED_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cymem/murmurhash ship no riscv64 wheels; both build and test install them.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Cython 3.3.0 routes a C-integer __setitem__ through sq_ass_item, whose
          # Py_ssize_t index cannot hold PreshMap's uint64 keys; build-system.requires
          # only floors Cython, so the pin has to be preinstalled.
          CIBW_BEFORE_BUILD: pip install "cython<3.3.0" setuptools "cymem>=2.0.2,<2.1.0" "murmurhash>=0.28.0,<1.1.0"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          # Upstream's tests.yml runs the suite bundled in the wheel; it never uses a key
          # above 2**63, so the assertion below is what catches the Cython regression.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "from preshed.maps import PreshMap; m = PreshMap();
            k = (1 << 63) + 12345; m[k] = 7; assert list(m) == [k], list(m); del m[k]"
            && python -m pytest --pyargs preshed -Werror

      - name: Verify the wheel ships the compiled extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          expected = {"maps", "counter", "bloom"}
          found = {n.split("/")[-1].split(".")[0] for n in sos}
          assert found == expected, (sos, found)
          print("\n".join(sos))
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: preshed-${{ env.PRESHED_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish preshed ${{ inputs.version || '3.0.13' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: preshed-${{ env.PRESHED_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
