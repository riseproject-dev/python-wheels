---
# This workflow is based on: https://github.com/SheffieldML/GPy/blob/v1.14.2/.github/workflows/test-and-deploy.yml
name: Build GPy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gpy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gpy.yml'
      - 'docs/packages/gpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gpy.yml'
      - 'docs/packages/gpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build GPy ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's own build-linux matrix; no cp310/cp39 (pyproject floor is
        # 3.9 but upstream itself only ever publishes cp311-cp314), no *t (upstream
        # ships none).
        python: ["cp311", "cp312", "cp313", "cp314"]

    env:
      GPY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout GPy v${{ env.GPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SheffieldML/GPy
          ref: v${{ env.GPY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          # numpy, scipy and Cython are build requirements; only our registry has them
          # for riscv64, so PIP_ONLY_BINARY keeps a newer PyPI sdist from winning the
          # resolution and compiling from source instead.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,Cython
          CIBW_TEST_REQUIRES: pytest matplotlib
          CIBW_TEST_COMMAND: >-
            python -c "from GPy.kern.src import stationary_cython, choleskies_cython, linalg_cython, coregionalize_cython, state_space_cython"
            && pytest {project}/GPy/testing

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"stationary_cython", "choleskies_cython", "linalg_cython", "coregionalize_cython", "state_space_cython"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gpy-${{ env.GPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish GPy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: gpy-${{ matrix.version }}-*-manylinux_riscv64
