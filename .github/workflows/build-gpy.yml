---
# This workflow is based on: https://github.com/SheffieldML/GPy/blob/v1.14.2/.github/workflows/test-and-deploy.yml
name: Build GPy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gpy.yml'
      - 'docs/packages/gpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gpy.yml'
      - 'docs/packages/gpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build GPy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gpy"
      version: "${{ matrix.version }}"
      repository: "SheffieldML/GPy"
      ref: "refs/tags/v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      # numpy, scipy and Cython (build) and matplotlib's compiled deps (test) need a
      # riscv64 wheel; PIP_ONLY_BINARY keeps a newer PyPI sdist from winning the
      # resolution and compiling from source instead.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,Cython,matplotlib,pillow,contourpy,kiwisolver"
      cibw-test-requires: "pytest matplotlib"
      # The suite lives inside the package: --pyargs runs the wheel's copy, while
      # {project}/GPy/testing would import GPy from the uncompiled checkout.
      cibw-test-command: "python -c \"from GPy.kern.src import stationary_cython, coregionalize_cython; from GPy.util import choleskies_cython, linalg_cython; from GPy.models import state_space_cython\" && pytest --pyargs GPy.testing"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gpy-${{ env.GPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"stationary_cython", "choleskies_cython", "linalg_cython", "coregionalize_cython", "state_space_cython"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"AUTHORS.txt", "LICENSE.txt"}, licences
          EOF

  publish:
    name: Publish GPy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gpy-${{ matrix.version }}-*-manylinux_riscv64
