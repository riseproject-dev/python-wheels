---
# This workflow is based on: https://github.com/Nixtla/coreforecast/blob/v0.0.18/.github/workflows/python-publish.yml
name: Build coreforecast wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/coreforecast.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-coreforecast.yml'
      - 'docs/packages/coreforecast.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-coreforecast.yml'
      - 'docs/packages/coreforecast.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: coreforecast
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build coreforecast ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # pandas is a hard, unguarded test dependency in most test modules;
        # pypi.riseproject.dev has no riscv64 cp314t pandas wheel yet (PyPI
        # itself does), so the tests can't collect there. Build still runs.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "coreforecast"
      version: "${{ matrix.version }}"
      repository: "Nixtla/coreforecast"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      pre-build: |-
        cp external_libs/skiplist/LICENSE LICENSE.skiplist
        cp external_libs/stl-cpp/LICENSE-MIT LICENSE.stl-cpp

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pandas"
      # The newest numpy/pandas on PyPI have no riscv64 wheel in our registry yet. The
      # default build[uv] frontend also installs the test requirements with uv, which
      # ignored UV_NO_BUILD here and source-built numpy and then that pandas sdist (an
      # xsimd error). pip honours PIP_ONLY_BINARY, so it takes the newest wheels we have.
      cibw-build-frontend: "build"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas"
      cibw-test-skip: "${{ case(endsWith(matrix.python, 't'), '*', '') }}"
      cibw-test-requires: "pandas pytest"
      cibw-test-command: "python -m pytest {project}/tests -k \"not efficiency\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # 60m was too tight: the pybind11/Eigen build runs anywhere from ~50m to
    # over 60m depending on runner load, so this job was intermittently
    # cancelled mid-build rather than genuinely failing (misread as infra
    # flakiness before checking startedAt/completedAt on the cancelled runs).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # pandas is a hard, unguarded test dependency in most test modules;
        # pypi.riseproject.dev has no riscv64 cp314t pandas wheel yet (PyPI
        # itself does), so the tests can't collect there. Build still runs.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      COREFORECAST_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coreforecast-${{ env.COREFORECAST_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.skiplist", "LICENSE.stl-cpp"}, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish coreforecast ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: coreforecast-${{ matrix.version }}-*-manylinux_riscv64
