---
# Upstream ships no CI workflow of its own; this mirrors the single cp38-abi3
# Linux wheel it publishes to PyPI, narrowed to riscv64.
name: Build python-geohash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-geohash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-geohash.yml'
      - 'docs/packages/python-geohash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-geohash.yml'
      - 'docs/packages/python-geohash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags. This is the "fix packaging" commit
  # that bumped pyproject.toml to 0.9.2, byte-identical to the released sdist
  # (whose Cargo.toml only gains one `readme =` line). Update alongside
  # GEOHASH_VERSION.
  GEOHASH_REF: 1159f4f751d3c97406d8af016d7b4119aa03b8a3
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-geohash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build python-geohash ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "python-geohash"
      version: "${{ matrix.version }}"
      repository: "hkwi/python-geohash"
      ref: "1159f4f751d3c97406d8af016d7b4119aa03b8a3"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # setup.py hardcodes cp38-abi3, so cibuildwheel compiles once for
      # cp312 and reuses+tests that wheel for cp313/cp314. No cp314t: pyo3's
      # abi3 feature cannot build for Py_GIL_DISABLED (verified locally),
      # and upstream ships no free-threaded wheel either.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import geohash; assert geohash._geohash.__file__.endswith('.so'), geohash._geohash.__file__\" && pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      GEOHASH_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-geohash-${{ env.GEOHASH_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and license made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "_geohash.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish python-geohash ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-geohash-${{ matrix.version }}-*-manylinux_riscv64
