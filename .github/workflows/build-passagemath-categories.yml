---
# passagemath-categories is split out of the passagemath/passagemath monorepo
# (a SageMath fork) at pkgs/sagemath-categories, tagged passagemath-<version>.
# This replays build/pkgs/sagemath_categories/spkg-src (./bootstrap renders
# the package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-categories wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-categories.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-categories.yml'
      - 'docs/packages/passagemath-categories.yaml'
      - 'patches/passagemath-categories/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-categories.yml'
      - 'docs/packages/passagemath-categories.yaml'
      - 'patches/passagemath-categories/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-categories
      version: ${{ inputs.version }}

  linux:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-categories ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # gmp/mpfr/mpc satisfy Sage's own spkg-configure.m4 minimum-version
    # checks, same as build-passagemath-objects.yml; gmpy2 (a build-time
    # requirement here, cimported by the rings layer) has no riscv64
    # musllinux wheel on the registry at all, so this package is
    # manylinux-only, same reason symengine/chiavdf drop musllinux.
    # sagemath-repl (the real test extra) is unported, so this exercises
    # the module this split actually provides: basic rings (ZZ/QQ),
    # univariate polynomials and the categories framework underneath.
    #
    # `from sage.rings.integer import Integer` must run before
    # `sage.rings.integer_ring` is ever touched: sage/rings/integer.pyx
    # (module scope, line ~317) reads `integer_ring.ZZ` eagerly at its
    # own init time, while sage/rings/integer_ring.pyx cimports Integer
    # from sage.rings.integer -- so importing integer_ring cold, before
    # anything else has loaded sage.rings.integer, always re-enters
    # integer_ring's own not-yet-finished init and dies with
    # "AttributeError: partially initialized module 'sage.rings.
    # integer_ring' ... has no attribute 'ZZ'". This is upstream's own
    # pre-existing ordering, not a riscv64 or packaging issue: the
    # official PyPI passagemath-categories==10.8.13 manylinux_x86_64
    # wheel reproduces the identical traceback for the identical cold
    # `from sage.rings.integer_ring import ZZ` (confirmed by installing
    # it locally and running this exact test), and is fixed there the
    # same way, by importing Integer first.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: passagemath-categories
      version: ${{ matrix.version }}
      source: pypi-sdist
      patches: true
      post-build: |-
        python3 - $GITHUB_WORKSPACE/wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            so_files = [n for n in names if n.endswith(".so")]
            assert len(so_files) > 50, (whl, len(so_files))
            assert any(n.startswith("sage/rings/integer.") for n in so_files), whl
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE"}, (whl, licences)
            print(whl, "ok", len(so_files), "extensions")
        EOF
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: dnf install -y gmp-devel mpfr-devel libmpc-devel
      cibw-test-command: >
        python -c "from sage.rings.integer import Integer;
        from sage.rings.integer_ring import ZZ;
        from sage.rings.rational_field import QQ;
        from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing;
        assert ZZ(2) + ZZ(3) == ZZ(5);
        assert QQ(1)/QQ(3) + QQ(1)/QQ(3) == QQ(2)/QQ(3);
        R = PolynomialRing(ZZ, 'x');
        x = R.gen();
        assert (x + 1)**2 == x**2 + 2*x + 1;
        print('categories ok')"

  publish:
    name: Publish passagemath-categories ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-categories-${{ matrix.version }}-*-manylinux_riscv64
