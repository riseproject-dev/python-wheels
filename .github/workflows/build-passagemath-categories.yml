---
# passagemath-categories is split out of the passagemath/passagemath monorepo
# (a SageMath fork) at pkgs/sagemath-categories, tagged passagemath-<version>.
# This replays build/pkgs/sagemath_categories/spkg-src (./bootstrap renders
# the package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-categories wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-categories.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-categories.yml'
      - 'docs/packages/passagemath-categories.yaml'
      - 'patches/passagemath-categories/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-categories.yml'
      - 'docs/packages/passagemath-categories.yaml'
      - 'patches/passagemath-categories/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-categories
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_CATEGORIES_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_CATEGORIES_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_CATEGORIES_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-categories
          src/sage/all__sagemath_categories.py
          src/sage/categories
