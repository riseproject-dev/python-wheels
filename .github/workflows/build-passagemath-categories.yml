          src/sage/combinat/matrices/dancing_links.p*
          src/sage/combinat/matrices/dancing_links_c.h
          src/sage/combinat/matrices/dlxcpp.p*
          src/sage/schemes/generic
          src/sage/schemes/affine
          src/sage/schemes/projective
          src/sage/schemes/product_projective
          src/sage/schemes/weighted_projective
          src/sage/sets
          src/sage/numerical/backends/generic*backend.p*
          src/sage/tests/*.pyx
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-categories source
      run: git apply python-wheels/patches/passagemath-categories/${{ env.PASSAGEMATH_CATEGORIES_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-categories
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_CATEGORIES_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_CATEGORIES_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-categories-${{ env.PASSAGEMATH_CATEGORIES_VERSION }}-sdist
        path: pkgs/sagemath-categories/dist/*.tar.gz
        if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-categories ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_CATEGORIES_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-categories-${{ env.PASSAGEMATH_CATEGORIES_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        # gmp/mpfr/mpc satisfy Sage's own spkg-configure.m4 minimum-version
        # checks, same as build-passagemath-objects.yml; gmpy2 (a build-time
        # requirement here, cimported by the rings layer) has no riscv64
        # musllinux wheel on the registry at all, so this package is
        # manylinux-only, same reason symengine/chiavdf drop musllinux.
        CIBW_BEFORE_ALL_LINUX: dnf install -y gmp-devel mpfr-devel libmpc-devel
        CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        # sagemath-repl (the real test extra) is unported, so this exercises
        # the module this split actually provides: basic rings (ZZ/QQ),
        # univariate polynomials and the categories framework underneath.
        CIBW_TEST_COMMAND: >-
          python -c "
          from sage.rings.integer_ring import ZZ;
          from sage.rings.rational_field import QQ;
          from sage.rings.polynomial.polynomial_ring_constructor import PolynomialRing;
          assert ZZ(2) + ZZ(3) == ZZ(5);
          assert QQ(1)/QQ(3) + QQ(1)/QQ(3) == QQ(2)/QQ(3);
          R = PolynomialRing(ZZ, 'x');
          x = R.gen();
          assert (x + 1)**2 == x**2 + 2*x + 1;
          print('categories ok')"

    - name: Check the wheel ships the extensions and the licence
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            so_files = [n for n in names if n.endswith(".so")]
            assert len(so_files) > 50, (whl, len(so_files))
            assert any(n.startswith("sage/rings/integer.") for n in so_files), whl
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE"}, (whl, licences)
            print(whl, "ok", len(so_files), "extensions")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-categories-${{ env.PASSAGEMATH_CATEGORIES_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-categories ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-categories-${{ matrix.version }}-*-manylinux_riscv64
