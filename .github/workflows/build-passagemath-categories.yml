          src/sage/calculus/functions.p*
          src/sage/misc/derivative.p*
          src/sage/misc/functional.p*
          src/sage/symbolic/symbols.p*
          src/sage/symbolic/function.p*
          src/sage/functions
          src/sage/rings/finite_rings/element_base.*
          src/sage/rings/finite_rings/stdint.*
          src/sage/rings/finite_rings/finite_field_base.p*
          src/sage/rings/finite_rings/finite_field_constructor.p*
          src/sage/rings/finite_rings/finite_field_prime_modn.p*
          src/sage/rings/finite_rings/residue_field.p*
          src/sage/rings/finite_rings/hom_finite_field.p*
          src/sage/rings/finite_rings/hom_prime_finite_field.p*
          src/sage/rings/finite_rings/homset.p*
          src/sage/rings/fast_arith.*
          src/sage/rings/finite_rings/integer_mod_limits.h
