---
# Based on the `build_wheels` job of
# https://github.com/closeio/ciso8601/blob/v2.3.3/.github/workflows/build-wheels.yml
# and the test invocation of
# https://github.com/closeio/ciso8601/blob/v2.3.3/tox.ini
name: Build ciso8601 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ciso8601.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ciso8601.yml'
      - 'docs/packages/ciso8601.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ciso8601.yml'
      - 'docs/packages/ciso8601.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ciso8601
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ciso8601 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ciso8601
      version: ${{ matrix.version }}
      repository: closeio/ciso8601
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # generate_test_timestamps.py sits at the repo root and is imported by tests.
      cibw-test-sources: tests generate_test_timestamps.py
      cibw-test-requires: pytz
      cibw-test-command: >-
        python -c "import ciso8601; assert ciso8601.__file__.endswith('.so'), ciso8601.__file__" &&
        python -m unittest
      timeout-minutes: 60

  publish:
    name: Publish ciso8601 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ciso8601-${{ matrix.version }}-*-manylinux_riscv64
