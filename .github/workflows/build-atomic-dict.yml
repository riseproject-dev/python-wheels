---
name: Build atomic-dict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/atomic-dict.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-atomic-dict.yml'
      - 'docs/packages/atomic-dict.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-atomic-dict.yml'
      - 'docs/packages/atomic-dict.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: atomic-dict
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build atomic-dict ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: atomic-dict
      version: ${{ matrix.version }}
      repository: terpstra/atomic-dict
      ref: 2480deb60eec9e85d49c65ce05812d659bf6e441
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream never pushed a git tag, so pin the release commit: its tree is
      # byte-identical to the 0.5.0 PyPI sdist. Update alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # tests/test_atomic_dict.py is a __main__ script, not pytest tests; run
      # it directly. CIBW_TEST_SOURCES keeps the checkout's atomic_dict/ dir
      # out of the test cwd so the import resolves to the installed wheel.
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import atomic_dict.capi as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python tests/test_atomic_dict.py
      timeout-minutes: 60

  publish:
    name: Publish atomic-dict ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: atomic-dict-${{ matrix.version }}-*riscv64
