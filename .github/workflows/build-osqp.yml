---
# This workflow is based on the `build_wheels` job of
# https://github.com/osqp/osqp-python/blob/v1.1.3/.github/workflows/build_default.yml
name: Build osqp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/osqp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-osqp.yml'
      - 'docs/packages/osqp.yaml'
      - 'patches/osqp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-osqp.yml'
      - 'docs/packages/osqp.yaml'
      - 'patches/osqp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # CMakeLists.txt FetchContent-pulls osqp/osqp at this tag to build osqpstatic;
  # bump alongside it if upstream ever moves the pin.
  OSQP_C_LIB_TAG: v1.0.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: osqp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build osqp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "osqp"
      version: "${{ matrix.version }}"
      repository: "osqp/osqp-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true
      pre-build: |-
        base="https://raw.githubusercontent.com/osqp/osqp/v1.0.0"
        curl -fsSL --retry 5 "${base}/NOTICE" -o NOTICE.osqp-c
        curl -fsSL --retry 5 "${base}/algebra/_common/lin_sys/qdldl/amd/LICENSE" -o LICENSE.amd

      cibw-config-file: "cibuildwheel.toml"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
      # and pybind11's headers need pip to resolve; both need our registry.
      # The patch dirties the tag checkout, which would otherwise poison
      # setuptools_scm's version with a `.dev0+g<sha>` suffix (gotcha 31).
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OSQP=${{ matrix.version }}"
      # numpy/scipy have riscv64 wheels only on our registry; don't let a
      # newer public-PyPI release pull pip into a source build.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"
      # torch has no riscv64 wheel anywhere; mirror upstream's own
      # aarch64/free-threaded override that skips the osqp.nn tests.
      cibw-before-test: "pip install scipy --prefer-binary"
      cibw-test-groups: "test-no-nn"
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(str(p).split('licenses/', 1)[1] for p in m.files('osqp') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.amd', 'NOTICE.osqp-c'], f\" && python -m pytest -s {project}/src/osqp/tests --continue-on-collection-errors --ignore={project}/src/osqp/tests/nn_test.py"

  publish:
    name: Publish osqp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: osqp-${{ matrix.version }}-*-manylinux_riscv64
