---
# This workflow is based on:
# https://github.com/GeoDaCenter/spatial_access/blob/v1.0.2/.github/workflows/build-publish.yml
name: Build spatial-access wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spatial-access.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spatial-access.yml'
      - 'docs/packages/spatial-access.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spatial-access.yml'
      - 'docs/packages/spatial-access.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spatial-access
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spatial-access ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "spatial-access"
      version: "${{ matrix.version }}"
      repository: "GeoDaCenter/spatial_access"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The released sdist ships a stale _p2pExtension.cpp pre-generated by an old
      # Cython against old CPython internals (PyTypeObject/PyFrameObject layout) and
      # fails to compile on current CPython. Rebuilding it here with a current Cython
      # from the full checkout (which, unlike the PyPI sdist, carries the pyx_src/
      # templates MANIFEST.in leaves out of the release tarball) fixes that cleanly.
      cibw-before-build: |-
        set -e
        pip install "cython>=3" jinja2
        bash cythonize_extension.sh
      # The wheel's Requires-Dist pulls the full GIS chain (fiona needs a system GDAL);
      # install it bare since the suite below only imports the extension (gotcha 122).
      cibw-test-environment: "PIP_NO_DEPS=1"
      cibw-before-test-linux: "PIP_NO_DEPS=0 pip install pytest"
      # tests/test_networkUtility.py is the only suite that imports nothing but the
      # compiled extension itself; the rest of tests/ pulls in spatial_access's full GIS
      # dependency chain (geopandas, fiona, osmnet, ...), out of scope here. A sibling
      # suite, tests/test_pyTransitMatrix.py, is also extension-only but 6 of its 7
      # cases fail identically against the real, officially-released PyPI wheel
      # (spatial_access-1.0.2-cp310-cp310-manylinux_2_17_x86_64...whl installed with
      # --no-deps on x86_64) -- a pre-existing upstream bug in compute()/
      # getDestsInRange(), not a riscv64 or rebuild regression, so it is left out
      # rather than carrying a wheel-vs-test mismatch or a non-upstream behavior patch.
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests/test_networkUtility.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPATIAL_ACCESS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spatial-access-${{ env.SPATIAL_ACCESS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_p2pExtension.") and n.endswith(".so") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish spatial-access ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spatial-access-${{ matrix.version }}-*-manylinux_riscv64
