---
# Based on upstream's own wheel build at this tag:
#   https://github.com/nightlark/tippecanoe-pypi/blob/2.72.0/.github/workflows/build.yml
name: Build tippecanoe wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tippecanoe.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tippecanoe.yml'
      - 'docs/packages/tippecanoe.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tippecanoe.yml'
      - 'docs/packages/tippecanoe.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tippecanoe
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tippecanoe ${{ matrix.version }} py2.py3-none-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
        include:
          # The manylinux GCC links non-PIE at riscv64's 0x10000 (= mmap_min_addr); the segment
          # auditwheel's patchelf prepends for the RPATH lands below it and the CLIs die at exec
          # (gotcha 595). Alpine's GCC links PIE by default, so musllinux is unaffected.
          - libc: manylinux
            ldflags: -Wl,-Ttext-segment=0x200000

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tippecanoe"
      version: "${{ matrix.version }}"
      repository: "nightlark/tippecanoe-pypi"
      ref: "${{ matrix.version }}"
      artifact-tag: "py2.py3-none-${{ matrix.libc }}_riscv64"
      checkout-fetch-depth: 0
      # wheel.py-api = "py2.py3", so one build serves every interpreter.
      cibw-build: "cp312-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # felt/tippecanoe's Makefile links sqlite3 and zlib; the image carries zlib
      # already, so only sqlite needs installing. felt/tippecanoe's own LICENSE.md
      # covers the CLI this wheel bundles; upstream's own wheels ship only this
      # repo's LICENSE/NOTICE and never add it, so pull it in ourselves (gotcha 44:
      # a LICEN[CS]E*-named file at the root needs no packaging change to be
      # picked up).
      cibw-before-all-linux: |-
        if command -v dnf > /dev/null; then
        dnf install -y sqlite sqlite-devel
        elif command -v apk > /dev/null; then
        apk add sqlite-dev
        fi
        curl -sL https://raw.githubusercontent.com/felt/tippecanoe/${{ matrix.version }}/LICENSE.md -o {project}/LICENSE.felt-tippecanoe
      cibw-environment-linux: "LDFLAGS=\"${{ matrix.ldflags }}\""
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(p.name for p in m.files('tippecanoe') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.felt-tippecanoe', 'NOTICE'], f\" && tippecanoe --version"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
        include:
          # The manylinux GCC links non-PIE at riscv64's 0x10000 (= mmap_min_addr); the segment
          # auditwheel's patchelf prepends for the RPATH lands below it and the CLIs die at exec
          # (gotcha 595). Alpine's GCC links PIE by default, so musllinux is unaffected.
          - libc: manylinux
            ldflags: -Wl,-Ttext-segment=0x200000
    env:
      TIPPECANOE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tippecanoe-${{ env.TIPPECANOE_VERSION }}-py2.py3-none-${{ matrix.libc }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries the binaries and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for bin in ("tippecanoe", "tile-join", "tippecanoe-decode", "tippecanoe-enumerate", "tippecanoe-json-tool", "tippecanoe-overzoom"):
                  assert f"tippecanoe/bin/{bin}" in names, (whl, bin)
              print(whl, "ok")
          EOF

  publish:
    name: Publish tippecanoe ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tippecanoe-${{ matrix.version }}-*riscv64
