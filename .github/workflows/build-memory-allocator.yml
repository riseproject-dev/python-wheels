---
# Based on the `build_wheels` job of
# https://github.com/sagemath/memory_allocator/blob/879b51b922d0ef31ef7bbc6c9d287f600a20bfbd/.github/workflows/dist.yml
name: Build memory-allocator wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/memory-allocator.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-memory-allocator.yml'
      - 'docs/packages/memory-allocator.yaml'
      - 'patches/memory-allocator/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-memory-allocator.yml'
      - 'docs/packages/memory-allocator.yaml'
      - 'patches/memory-allocator/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # The v0.2.0 tag was left behind by a history rewrite around the meson
  # migration and predates the version bump (pyproject.toml there still
  # reads 0.1.4); this commit's tree is byte-identical to the released
  # 0.2.0 PyPI sdist. Update alongside MEMORY_ALLOCATOR_VERSION.
  MEMORY_ALLOCATOR_REF: 879b51b922d0ef31ef7bbc6c9d287f600a20bfbd
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: memory-allocator
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build memory-allocator ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      MEMORY_ALLOCATOR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout memory_allocator ${{ env.MEMORY_ALLOCATOR_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sagemath/memory_allocator
          ref: ${{ env.MEMORY_ALLOCATOR_REF }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # pyproject.toml declares `license` but no `license-files`, and
      # meson-python's build backend has no default LICENSE glob, so every
      # wheel upstream publishes ships with none. See
      # patches/memory-allocator/0.2.0 for details.
      - name: Patch memory_allocator source
        run: git apply python-wheels/patches/memory-allocator/${{ env.MEMORY_ALLOCATOR_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}

      - name: Check the extensions and LICENSE made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("memory_allocator/memory_allocator") and n.endswith(".so") for n in names), names
              assert any(n.startswith("memory_allocator/test") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: memory-allocator-${{ env.MEMORY_ALLOCATOR_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish memory-allocator ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: memory-allocator-${{ matrix.version }}-*riscv64
