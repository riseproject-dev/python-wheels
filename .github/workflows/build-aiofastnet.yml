---
# Based on upstream's own wheel builder and test workflow:
#   https://github.com/tarasko/aiofastnet/blob/v1.1.0/.github/workflows/release.yml
#   https://github.com/tarasko/aiofastnet/blob/v1.1.0/.github/workflows/run-tests.yml
name: Build aiofastnet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aiofastnet.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aiofastnet.yml'
      - 'docs/packages/aiofastnet.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aiofastnet.yml'
      - 'docs/packages/aiofastnet.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aiofastnet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aiofastnet ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: aiofastnet
      version: ${{ matrix.version }}
      # 1.2.0 was released to PyPI without a v1.2.0 tag (gotcha 103); pin the
      # release/1.2.0 branch tip instead, whose tree matches the sdist exactly.
      repository: tarasko/aiofastnet
      ref: ${{ matrix.version == '1.2.0' && '93b4789508eea3f86255d8ec46903bdd17b16ba9' || format('v{0}', matrix.version) }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-environment-linux: CFLAGS="$CFLAGS -O2 -g0 -DNDEBUG" PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # No musllinux riscv64 uvloop wheel exists; the suite only adds it as an extra loop when importable.
      cibw-test-requires: >-
        aiohttp async_timeout pytest pytest-aiohttp pytest-asyncio pytest-xdist
        ${{ matrix.platform == 'manylinux' && 'uvloop' || '' }}
      # 1.1.1's tests/test_changelog.py imports the top-level tools/ package,
      # which 1.2.0 dropped; stage it only for 1.1.1 (gotcha: CIBW_TEST_SOURCES
      # must list every top-level dir the test suite imports from).
      cibw-test-sources: tests${{ matrix.version == '1.1.1' && ' tools' || '' }} pyproject.toml
      # test_benchmarks.py is upstream's CodSpeed harness, run in its own benchmarks job.
      # The riscv64 runner kernel has no CONFIG_TLS, so tests asserting kTLS is active can't pass.
      # Its software AES-128-GCM (~38 MB/s) can't move multi-MB TLS payloads within the suite's 1-4s timeouts.
      cibw-test-command: >-
        pytest -n auto -v --ignore=tests/test_benchmarks.py
        -k "not ktls_enabled and not (ktls and (sendfile or membio_enabled))
        and not ((ssl_ or stls or ktls) and (6291456 or 20971520 or write_huge_close or contextvar or exc_connection_made))"
      timeout-minutes: 60

  publish:
    name: Publish aiofastnet ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aiofastnet-${{ matrix.version }}-*riscv64
