---
# This workflow is based on the `linux` job of
# https://github.com/coin-or/pulp/blob/4.0.1/.github/workflows/CI.yml
name: Build pulp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pulp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pulp.yml'
      - 'docs/packages/pulp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pulp.yml'
      - 'docs/packages/pulp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pulp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pulp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pulp"
      version: "${{ matrix.version }}"
      repository: "coin-or/pulp"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      # musllinux is out of reach: rustup publishes rust-std but no
      # rustc/cargo host toolchain for riscv64gc-unknown-linux-musl.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pulp ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # numpy is an undeclared runtime import of pulp.apis.highs, pulled in
      # unconditionally by pulp/__init__.py -> pulp.apis; plain `import pulp`
      # fails without it even though it's missing from Requires-Dist.
      cibw-test-requires: "pytest numpy"
      cibw-test-sources: "pulp/tests pyproject.toml"
      # The rest of upstream's test suite exercises third-party/commercial
      # solvers (Gurobi, CPLEX, Mosek, Xpress, COPT, cuOpt) that are neither
      # installed nor runnable here; test_rust_core.py exercises the actual
      # compiled extension end to end (toRustModel/summary) with no solver.
      cibw-test-command: >
        python -c "import pulp._rustcore as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v pulp/tests/test_rust_core.py

  publish:
    name: Publish pulp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pulp-${{ matrix.version }}-*-manylinux_riscv64
