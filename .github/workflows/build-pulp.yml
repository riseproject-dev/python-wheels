---
# This workflow is based on the `linux` job of
# https://github.com/coin-or/pulp/blob/4.0.1/.github/workflows/CI.yml
name: Build pulp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pulp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pulp.yml'
      - 'docs/packages/pulp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pulp.yml'
      - 'docs/packages/pulp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pulp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pulp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pulp's Rust core (pulp/rust) builds a plain, non-abi3 PyO3 extension
        # module, so every interpreter needs its own wheel, matching upstream's
        # own cp312-cp315/cp314t-cp315t matrix.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PULP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pulp ${{ env.PULP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: coin-or/pulp
          ref: ${{ env.PULP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is out of reach: rustup publishes rust-std but no
          # rustc/cargo host toolchain for riscv64gc-unknown-linux-musl.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pulp ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # numpy is an undeclared runtime import of pulp.apis.highs, pulled in
          # unconditionally by pulp/__init__.py -> pulp.apis; plain `import pulp`
          # fails without it even though it's missing from Requires-Dist.
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_SOURCES: pulp/tests pyproject.toml
          # The rest of upstream's test suite exercises third-party/commercial
          # solvers (Gurobi, CPLEX, Mosek, Xpress, COPT, cuOpt) that are neither
          # installed nor runnable here; test_rust_core.py exercises the actual
          # compiled extension end to end (toRustModel/summary) with no solver.
          CIBW_TEST_COMMAND: >-
            python -c "import pulp._rustcore as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v pulp/tests/test_rust_core.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulp-${{ env.PULP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pulp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pulp-${{ matrix.version }}-*-manylinux_riscv64
