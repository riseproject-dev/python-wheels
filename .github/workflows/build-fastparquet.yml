---
# This workflow is based on: https://github.com/dask/fastparquet/blob/2026.5.0/.github/workflows/wheel.yml
# and its wheel test job: https://github.com/dask/fastparquet/blob/2026.5.0/.github/workflows/test_wheel.yaml
name: Build fastparquet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastparquet.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastparquet.yml'
      - 'docs/packages/fastparquet.yaml'
      - 'patches/fastparquet/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastparquet.yml'
      - 'docs/packages/fastparquet.yaml'
      - 'patches/fastparquet/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastparquet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastparquet ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # pandas, a hard runtime requirement, publishes no free-threaded wheel on
          # any architecture, so the suite cannot run under cp314t.
          - python: "cp314t"
            test_skip: "*"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastparquet"
      version: "${{ matrix.version }}"
      repository: "dask/fastparquet"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/fastparquet/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # A patch dirties the checkout, so setuptools_scm would derive
      # 2026.5.1.dev0 from `git describe` instead of the tag.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FASTPARQUET=${{ matrix.version }}"
      # pandas and cramjam are newer on PyPI than the riscv64 wheels we ship;
      # refusing sdists makes pip resolve back to the versions we have.
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      cibw-test-skip: "${{ matrix.test_skip }}"
      cibw-test-requires: "pytest \"pandas<3\""
      cibw-test-sources: "fastparquet/test test-data pyproject.toml"
      # test/util.py resolves test-data relative to the working directory, and
      # upstream's test_wheel.yaml renames the source package out of the way so
      # `import fastparquet` picks up the installed wheel.
      cibw-test-command: "mv fastparquet fastparquet-src && python -m pytest fastparquet-src/test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # pandas, a hard runtime requirement, publishes no free-threaded wheel on
          # any architecture, so the suite cannot run under cp314t.
          - python: "cp314t"
            test_skip: "*"
    env:
      FASTPARQUET_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fastparquet-${{ env.FASTPARQUET_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"fastparquet/cencoding", "fastparquet/speedups"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              got = {n.split(".", 1)[0] for n in names if n.endswith(".so")}
              assert got == expected, f"{whl}: got {got}, expected {expected}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish fastparquet ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastparquet-${{ matrix.version }}-*-manylinux_riscv64
