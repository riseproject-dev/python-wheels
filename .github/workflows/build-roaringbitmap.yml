---
# This workflow is based on the `build-wheels` job of
# https://github.com/andreasvc/roaringbitmap/blob/v0.7.4/.github/workflows/wheels.yml
name: Build roaringbitmap wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/roaringbitmap.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-roaringbitmap.yml'
      - 'docs/packages/roaringbitmap.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-roaringbitmap.yml'
      - 'docs/packages/roaringbitmap.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: roaringbitmap
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build roaringbitmap ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's [tool.cibuildwheel] build list is cp311-cp315; it does not
        # cover cp314t.
        python: ["cp312", "cp313", "cp314"]

    env:
      ROARINGBITMAP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout roaringbitmap ${{ env.ROARINGBITMAP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: andreasvc/roaringbitmap
          ref: v${{ env.ROARINGBITMAP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_ENVIRONMENT: ROARINGBITMAP_BUILD_WHEEL=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roaringbitmap-${{ env.ROARINGBITMAP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish roaringbitmap ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: roaringbitmap-${{ matrix.version }}-*-manylinux_riscv64
