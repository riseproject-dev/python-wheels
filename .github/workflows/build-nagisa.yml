---
# Based on upstream's own wheel builder:
#   https://github.com/taishi-i/nagisa/blob/0.3.1/.github/workflows/build_wheels.yml
name: Build nagisa wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nagisa.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nagisa.yml'
      - 'docs/packages/nagisa.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nagisa.yml'
      - 'docs/packages/nagisa.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nagisa
      version: ${{ inputs.version }}

  # DyNet38, an install-time (not build-time) dependency for python < 3.15,
  # has riscv64 wheels only for cp312/cp313/cp314 - no cp310, cp311, cp314t,
  # cp315(t), and no musllinux - so those targets stay off this matrix
  # instead of the dynamic one (platform can't be excluded by python-exclude).
  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build nagisa ${{ matrix.version }} manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: nagisa
      version: ${{ matrix.version }}
      repository: taishi-i/nagisa
      ref: ${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      cibw-build: 'cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64'
      cibw-skip: '*-musllinux_*'
      cibw-environment: >-
        PIP_USE_PEP517=1
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-environment: PIP_PREFER_BINARY=1
      timeout-minutes: 180

  publish:
    name: Publish nagisa ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nagisa-${{ matrix.version }}-manylinux_riscv64
