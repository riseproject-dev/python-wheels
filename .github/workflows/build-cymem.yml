---
# Based on upstream's wheel builder, which calls the shared
# https://github.com/explosion/gha-cibuildwheel workflow from
# https://github.com/explosion/cymem/blob/release-v2.0.13/.github/workflows/cibuildwheel.yml
# The test command mirrors the `Run tests` step of upstream's tests.yml.
name: Build cymem wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cymem.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cymem.yml'
      - 'docs/packages/cymem.yaml'
      - 'patches/cymem/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cymem.yml'
      - 'docs/packages/cymem.yaml'
      - 'patches/cymem/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cymem
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cymem ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      CYMEM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cymem release-v${{ env.CYMEM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/cymem
          ref: release-v${{ env.CYMEM_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch cymem source
        run: |
          git apply python-wheels/patches/cymem/${{ env.CYMEM_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream leaves cibuildwheel's test-command empty and tests the wheel in a
          # separate workflow; the suite ships inside the wheel, so run it here.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest --pyargs cymem -Werror

      - name: Verify the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          assert [n.split("/")[-1].split(".")[0] for n in sos] == ["cymem"], sos
          print("\n".join(sos))
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cymem-${{ env.CYMEM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cymem ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cymem-${{ matrix.version }}-*-manylinux_riscv64
