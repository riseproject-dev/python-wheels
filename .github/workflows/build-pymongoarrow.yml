---
# Based on: https://github.com/mongodb-labs/mongo-arrow/blob/1.15.0/.github/workflows/dist-python.yml
# and bindings/python/{pyproject.toml,cibw_before_build.sh,CMakeLists.txt,build-libbson.sh} at
# the same tag. Build-from-checkout, inheriting upstream's [tool.cibuildwheel] (before-build
# builds libbson from mongo-c-driver source; repair-wheel-command excludes libarrow* since the
# extension resolves it at runtime via pyarrow's own preloaded shared libraries).
name: Build pymongoarrow wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymongoarrow.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymongoarrow.yml'
      - 'docs/packages/pymongoarrow.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymongoarrow.yml'
      - 'docs/packages/pymongoarrow.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymongoarrow
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymongoarrow ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymongoarrow"
      version: "${{ matrix.version }}"
      repository: "mongodb-labs/mongo-arrow"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-package-dir: "bindings/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # mongo-c-driver's root CMakeLists.txt itself declares cmake_minimum_required(3.15),
      # but nested subdirectories built along with libbson can declare older floors that
      # CMake 4 (bundled in the manylinux image) rejects outright (gotcha 257).
      # pyarrow/numpy/pymongo are build-time requirements (CMakeLists.txt cimports pyarrow's
      # headers and links its libraries; find_package(... NumPy) needs numpy's), so the
      # registry URL has to reach both the build and test phases (gotcha 12); cython is left
      # unscoped since our registry has no riscv64 cp314t build of it and it must compile
      # from sdist there.
      # before-build and the actual scikit-build-core/CMake configure run with different
      # cwds, so upstream's relative LIBBSON_INSTALL_DIR=./libbson (pyproject.toml) would
      # resolve to two different directories; pin it absolute instead.
      cibw-environment-linux: "CMAKE_POLICY_VERSION_MINIMUM=3.5 LIBBSON_INSTALL_DIR=/tmp/pymongoarrow-libbson PIP_ONLY_BINARY=pyarrow,numpy,pymongo"
      # before-build runs from the checkout root, not package-dir (same as
      # test-sources below), so upstream's own relative "./cibw_before_build.sh" 404s.
      # Upstream's script itself (Linux branch) just installs rust-just/uv and runs
      # `just build-libbson`, but that recipe's `uv sync --dev` step pulls the full dev
      # group (pre-commit, sphinx-autobuild -> watchfiles), and watchfiles needs a Rust
      # target rustup has no riscv64 entry for. build-libbson.sh needs no Python beyond an
      # existing .venv to source, so call it directly instead of through the dev sync.
      cibw-before-build: "cd bindings/python && pip install -q uv && uv venv .venv && bash build-libbson.sh"
      cibw-test-requires: "pytest>=8.0"
      # test-sources resolves against the checkout root, not package-dir.
      cibw-test-sources: "bindings/python/test bindings/python/pyproject.toml"
      # No riscv64 mongod exists (upstream's own MongoDB Server download center ships no
      # riscv64 build), so only the tests that don't need a live server run - the same
      # constraint build-pymongo.yml documents for the driver itself.
      cibw-test-command: "cd bindings/python && python -c \"from pymongoarrow.lib import libbson_version\" && python -m pytest test/test_bson.py test/test_builders.py test/test_schema.py test/test_monkey.py test/test_libbson.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYMONGOARROW_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pymongoarrow-${{ env.PYMONGOARROW_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel bundles libbson2 and its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any("pymongoarrow/libbson2.so" in n for n in names), whl
              assert any(".dist-info/licenses/LICENSE" in n for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pymongoarrow ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymongoarrow-${{ matrix.version }}-*-manylinux_riscv64
