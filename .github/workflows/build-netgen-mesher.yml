---
# Based on upstream's own [tool.cibuildwheel] recipe in pyproject.toml (there is no
# .github/workflows/ upstream; wheels are built from NGSolve/netgen's .gitlab-ci.yml pip_linux
# job, which drives the same cibuildwheel config).
name: Build netgen-mesher wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/netgen-mesher.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-netgen-mesher.yml'
      - 'docs/packages/netgen-mesher.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-netgen-mesher.yml'
      - 'docs/packages/netgen-mesher.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  OCCT_VERSION: 7.8.1

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: netgen-mesher
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build netgen-mesher ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440  # 24h: before-all compiles OCCT, as in build-cadquery-ocp-novtk.yml
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      NETGEN_MESHER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout netgen v${{ env.NETGEN_MESHER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NGSolve/netgen
          ref: v${{ env.NETGEN_MESHER_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          fetch-depth: 1
          persist-credentials: false

      - name: Patch netgen
        run: git apply python-wheels/patches/netgen-mesher/${{ env.NETGEN_MESHER_VERSION }}/00*.patch

      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No AVX2 (x86-only) on riscv64; OCCT has no riscv64 wheel, so build the same
          # release (pinned by upstream's own netgen-occt-devel requirement) from source and
          # link it statically, in place of the netgen-occt/-devel pip packages.
          CIBW_ENVIRONMENT_LINUX: >-
            NETGEN_CCACHE=1 NETGEN_MPI=ON
            CMAKE_ARGS=-DOpenCascade_ROOT=/opt/occt
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            dnf install -y --setopt=install_weak_deps=False tcl-devel tk-devel ninja-build
            mkdir -p /opt/openmpi/include /opt/mpich/include
            cp -a /usr/include/openmpi-*/* /opt/openmpi/include/
            cp -a /usr/include/mpich-*/* /opt/mpich/include/
            curl -fsSL https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V${OCCT_VERSION//./_}.tar.gz | tar xz -C /tmp
            cmake -S /tmp/OCCT-${OCCT_VERSION} -B /tmp/occt-build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/opt/occt \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DBUILD_LIBRARY_TYPE=Static \
              -DBUILD_MODULE_FoundationClasses=ON \
              -DBUILD_MODULE_ModelingData=ON \
              -DBUILD_MODULE_ModelingAlgorithms=ON \
              -DBUILD_MODULE_DataExchange=ON \
              -DBUILD_MODULE_Visualization=OFF \
              -DBUILD_MODULE_ApplicationFramework=OFF \
              -DBUILD_MODULE_Draw=OFF \
              -DBUILD_MODULE_DETools=OFF \
              -DUSE_FREETYPE=OFF \
              -DUSE_OPENGL=OFF \
              -DUSE_XLIB=OFF \
              -DBUILD_DOC_Overview=OFF
            cmake --build /tmp/occt-build --parallel "$(nproc)"
            cmake --build /tmp/occt-build --target install
          CIBW_BEFORE_BUILD: pip install -U "scikit-build-core>=0.10" "pybind11-stubgen>=2.5" ninja cmake

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: netgen-mesher-${{ env.NETGEN_MESHER_VERSION }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish netgen-mesher ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: netgen-mesher-${{ matrix.version }}-*riscv64
