---
# This workflow is based on: https://github.com/ryanrhee/shellcheck-py/blob/v0.11.0.1/.github/workflows/main.yml
name: Build shellcheck-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/shellcheck-py.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-shellcheck-py.yml'
      - 'docs/packages/shellcheck-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-shellcheck-py.yml'
      - 'docs/packages/shellcheck-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: shellcheck-py
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build shellcheck-py ${{ matrix.version }} py2.py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    env:
      SHELLCHECK_PY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout shellcheck-py v${{ env.SHELLCHECK_PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ryanrhee/shellcheck-py
          ref: v${{ env.SHELLCHECK_PY_VERSION }}
          persist-credentials: false

      - name: Pull manylinux_riscv64 image
        run: docker pull "${MANYLINUX_RISCV64_IMAGE}"

      # setup.cfg's `setuptools-download` fetches the shellcheck binary matching
      # the build host's own platform_machine (riscv64 here), independent of the
      # forced --plat-name below.
      - name: Build and test the wheel
        run: |
          docker run --rm -v "$(pwd):/work" -w /work "${MANYLINUX_RISCV64_IMAGE}" bash -c '
            set -euxo pipefail
            pybin=/opt/python/cp312-cp312/bin
            "$pybin/pip" install -q -U pip setuptools wheel
            "$pybin/python3" setup.py bdist_wheel --plat-name=manylinux_2_39_riscv64
            "$pybin/pip" install -q dist/*.whl
            "$pybin/shellcheck" --version
            "$pybin/shellcheck" --help
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shellcheck-py-${{ env.SHELLCHECK_PY_VERSION }}-py2.py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish shellcheck-py ${{ matrix.version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: shellcheck-py-${{ matrix.version }}-*-manylinux_riscv64
