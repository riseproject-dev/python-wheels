---
# This workflow is based on the `build_wheels` job of
# https://github.com/blosc/python-blosc/blob/v1.11.4/.github/workflows/cibuildwheels.yml
name: Build blosc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/blosc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-blosc.yml'
      - 'docs/packages/blosc.yaml'
      - 'patches/blosc/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-blosc.yml'
      - 'docs/packages/blosc.yaml'
      - 'patches/blosc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: blosc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build blosc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "blosc"
      version: "${{ matrix.version }}"
      repository: "blosc/python-blosc"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 45
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/blosc/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # C-Blosc's own CMakeLists.txt gates SSE2/AVX2 on a recognized x86
      # CMAKE_SYSTEM_PROCESSOR and warns-not-fails otherwise, so riscv64
      # falls straight back to its portable shuffle-generic.c path -- no
      # patch needed for the SIMD codec gating itself.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "numpy"
      cibw-test-command: "python -m blosc.test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BLOSC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: blosc-${{ env.BLOSC_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n for n in names if n.startswith("blosc/") and n.endswith(".so")}
          assert len(exts) == 1 and next(iter(exts)).startswith("blosc/blosc_extension"), exts

          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {
              "LICENSE.txt",
              "blosc/c-blosc/LICENSE.txt",
              "blosc/c-blosc/LICENSES/BITSHUFFLE.txt",
              "blosc/c-blosc/LICENSES/FASTLZ.txt",
              "blosc/c-blosc/LICENSES/LZ4.txt",
              "blosc/c-blosc/LICENSES/ZLIB.txt",
              "blosc/c-blosc/LICENSES/ZSTD.txt",
          }, licences
          EOF

  publish:
    name: Publish blosc ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: blosc-${{ matrix.version }}-*-manylinux_riscv64
