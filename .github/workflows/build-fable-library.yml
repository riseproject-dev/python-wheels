---
# This workflow is based on the `build-fable-library`/`sdist` jobs of
# https://github.com/fable-compiler/fable/blob/5.15.0/.github/workflows/publish-pypi.yml
name: Build fable-library wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fable-library.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fable-library.yml'
      - 'docs/packages/fable-library.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fable-library.yml'
      - 'docs/packages/fable-library.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fable-library
      version: ${{ inputs.version }}

  # fable-library's own Python sources (fable_library/*.py) are generated by
  # running the Fable compiler on itself against the F# standard library
  # (src/fable-library-py/fable_library/*.fs) - there is no plain `pip
  # download --no-binary` sdist to start from, upstream's own release job
  # does this exact transpile first. Only the `_core` extension (src/*.rs) is
  # hand-written Rust; everything else in this job mirrors
  # `build-fable-library`+`sdist` from upstream's publish-pypi.yml.
  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FABLE_LIBRARY_VERSION: ${{ matrix.version }}
      UV_LINK_MODE: copy

    steps:
      - name: Checkout fable-compiler/fable ${{ env.FABLE_LIBRARY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fable-compiler/fable
          ref: ${{ env.FABLE_LIBRARY_VERSION }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Install maturin
        run: uv pip install 'maturin>=1.5,<2.0'

      - name: Transpile F# to Python
        run: ./build.sh fable-library --python

      # The queue entry's version is already the exact release we want -
      # upstream derives the same string from `dunamai from git --latest-tag`,
      # which needs the full tag history a shallow checkout doesn't have, so
      # this writes it directly instead (same end state, no extra fetch).
      - name: Set version
        working-directory: ./temp/fable-library-py
        run: |
          set -euo pipefail
          uv version "${FABLE_LIBRARY_VERSION}"
          echo "__version__ = \"${FABLE_LIBRARY_VERSION}\"" > fable_library/_version.py

      - name: Build sdist
        working-directory: ./temp/fable-library-py
        run: maturin sdist --out ../../dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fable-library-${{ env.FABLE_LIBRARY_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      # [tool.maturin] exclude in pyproject.toml keeps the sdist focused on
      # the package itself, so tests/ (hand-written, no transpile needed -
      # see build.yml's test-fable-library-py job) never makes it in. Ship it
      # as a second artifact so build_wheels can stage it for cibuildwheel.
      - name: Package tests
        run: tar czf tests.tar.gz -C src/fable-library-py tests

      - name: Upload tests artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fable-library-${{ env.FABLE_LIBRARY_VERSION }}-tests
          path: tests.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build fable-library ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags). Repo-standard
        # riscv64 interpreter set; upstream's own cp310/cp311 wheels are moot
        # here anyway - the generated fable_library/list.py etc. use PEP 695
        # `class Foo[T]:` syntax, which is a SyntaxError below 3.12.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      FABLE_LIBRARY_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fable-library-${{ env.FABLE_LIBRARY_VERSION }}-sdist
          path: sdist-dl

      # Separate `path:` from the sdist fetch above - with no `path:` both
      # download-artifact calls land in the same default directory, so by
      # the time the sdist is untarred below, `*.tar.gz` also globs in
      # tests.tar.gz; tar then reads that second glob match not as another
      # archive but as a member name to extract *from* the sdist archive,
      # which fails with "tests.tar.gz: Not found in archive" (exit 2).
      - name: Fetch tests artifact
        id: fetch_tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fable-library-${{ env.FABLE_LIBRARY_VERSION }}-tests
          path: tests-dl

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build and test wheel
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: upstream's own publish-pypi.yml builds no
          # musllinux wheels for fable-library on any architecture.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # fable-library-core ships no [tool.cibuildwheel], so the Rust
          # toolchain its maturin backend needs is installed in-container
          # here (CLAUDE.md gotcha 10).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # tests/ lives beside the sdist, not inside it (see the sdist job's
          # comment); CIBW_TEST_SOURCES stages it into the test run (CLAUDE.md
          # gotcha 104/239).
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest hypothesis pydantic
          CIBW_TEST_COMMAND: pytest tests
        run: |
          set -euo pipefail
          mkdir fable-library
          tar zxf "${{ steps.fetch_sdist.outputs.download-path }}"/*.tar.gz \
            --strip-components=1 -C fable-library
          mkdir tests
          tar zxf "${{ steps.fetch_tests.outputs.download-path }}"/tests.tar.gz \
            --strip-components=1 -C tests
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse ./fable-library

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fable-library-${{ env.FABLE_LIBRARY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fable-library ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: fable-library-${{ matrix.version }}-*-manylinux_riscv64
