# This workflow is based on: https://github.com/pupil-labs/apriltags/blob/v1.0.4.post11/.github/workflows/main.yml
name: Build pupil-apriltags wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pupil-apriltags.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pupil-apriltags.yml'
      - 'docs/packages/pupil-apriltags.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pupil-apriltags.yml'
      - 'docs/packages/pupil-apriltags.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pupil-apriltags
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pupil-apriltags ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pupil-apriltags
      version: ${{ matrix.version }}
      repository: pupil-labs/apriltags
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # cmake/ninja/numpy have no riscv64 wheel on public PyPI; pull ours too.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-environment: PIP_ONLY_BINARY=numpy
      timeout-minutes: 90

  publish:
    name: Publish pupil-apriltags ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pupil-apriltags-${{ matrix.version }}-*-manylinux_riscv64
