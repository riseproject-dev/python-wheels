---
# This workflow is based on the `build_wheels` job of
# https://github.com/GeoStat-Framework/PyKrige/blob/v1.7.3/.github/workflows/main.yml
name: Build pykrige wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pykrige.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pykrige.yml'
      - 'docs/packages/pykrige.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pykrige.yml'
      - 'docs/packages/pykrige.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pykrige
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pykrige ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pykrige
      version: ${{ matrix.version }}
      repository: GeoStat-Framework/PyKrige
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Replaces upstream's [tool.cibuildwheel] environment table, so its two keys are restated.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy PIP_PREFER_BINARY=1"
      timeout-minutes: 90

  publish:
    name: Publish pykrige ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pykrige-${{ matrix.version }}-*-manylinux_riscv64
