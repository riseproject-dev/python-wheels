---
# This workflow is based on the Linux leg of upstream's own
# .github/workflows/ci-wheels.yml, narrowed to riscv64.
name: Build cf-units wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cf-units.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cf-units.yml'
      - 'docs/packages/cf-units.yaml'
      - 'patches/cf-units/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cf-units.yml'
      - 'docs/packages/cf-units.yaml'
      - 'patches/cf-units/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  UDUNITS2_VERSION: '2.2.28'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cf-units
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cf-units ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cf-units"
      version: "${{ matrix.version }}"
      repository: "SciTools/cf-units"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-fetch-depth: 0
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/cf-units/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # udunits2-devel is EPEL-only (gotcha 51: no EPEL on riscv64), so
      # UDUNITS-2 is built from source instead, the same workaround
      # build-pygame.yml uses for portmidi. The tag archive has no generated
      # scanner.c/parser.c/.info, hence flex, bison and texinfo (CRB).
      cibw-before-all-linux: |-
        set -eux
        dnf install -y expat-devel flex bison texinfo
        curl -fsSL --retry 5 https://github.com/Unidata/UDUNITS-2/archive/refs/tags/v2.2.28.tar.gz -o udunits2.tar.gz
        tar xzf udunits2.tar.gz
        cmake -S UDUNITS-2-2.2.28 -B udunits2-build -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release
        cmake --build udunits2-build -j"$(nproc)"
        cmake --install udunits2-build
        echo /usr/local/lib > /etc/ld.so.conf.d/udunits2.conf
        ldconfig
        cp UDUNITS-2-2.2.28/COPYRIGHT LICENSE.udunits2
      cibw-environment-linux: "CF_UNITS_LIMITED_API=1 UDUNITS2_INCDIR=/usr/local/include UDUNITS2_LIBDIR=/usr/local/lib UDUNITS2_XML_PATH=/usr/local/share/udunits/udunits2.xml SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CF_UNITS=${{ matrix.version }} PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest tomli"
      cibw-test-command: "python -c \"import cf_units; print(f'cf-units v{cf_units.__version__}')\" && python -m pytest --pyargs cf_units"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CF_UNITS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cf-units-${{ env.CF_UNITS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extension and its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("cf_units/_udunits2") and n.endswith(".so") for n in names), (whl, names)
              licences = {n.rsplit("/", 1)[-1] for n in names if n.startswith("cf_units-") and "/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.udunits2"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish cf-units ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cf-units-${{ matrix.version }}-*-manylinux_riscv64
