---
# This workflow is based on the `linux` job of
# https://github.com/get-convex/convex-py/blob/convex-py/0.7.0/.github/workflows/python-client-build.yml
name: Build convex wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/convex.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-convex.yml'
      - 'docs/packages/convex.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-convex.yml'
      - 'docs/packages/convex.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: convex
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build convex ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      CONVEX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout convex-py convex-py/${{ env.CONVEX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: get-convex/convex-py
          ref: convex-py/${{ env.CONVEX_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          # abi3-py39 (Cargo.toml's pyo3 feature set) covers every GIL-ful
          # interpreter with one wheel; pyo3 0.23.3 caps out at CPython 3.13
          # (no 3.14 support) and the riscv64 manylinux image ships no
          # cp313t, so upstream's separate free-threaded `-i python3.13t`
          # leg can't be built here -- same shape as gotcha 101's litellm
          # case. musllinux is dropped: rustup.rs ships no riscv64 musl
          # toolchain.
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import _convex; assert _convex.__file__.endswith('.so'), _convex.__file__"
            && python -m pytest -v tests
        with:
          output-dir: wheelhouse/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: convex-${{ env.CONVEX_VERSION }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish convex ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: convex-${{ matrix.version }}-manylinux_riscv64
