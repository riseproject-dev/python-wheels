---
# This workflow is based on the `linux` job of
# https://github.com/get-convex/convex-py/blob/convex-py/0.7.0/.github/workflows/python-client-build.yml
name: Build convex wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/convex.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-convex.yml'
      - 'docs/packages/convex.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-convex.yml'
      - 'docs/packages/convex.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: convex
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build convex ${{ matrix.version }} manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: convex
      version: ${{ matrix.version }}
      repository: get-convex/convex-py
      ref: convex-py/${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      # abi3-py39 (Cargo.toml's pyo3 feature set) covers every GIL-ful
      # interpreter with one wheel; pyo3 0.23.3 caps out at CPython 3.13
      # (no 3.14 support) and the riscv64 manylinux image ships no
      # cp313t, so upstream's separate free-threaded `-i python3.13t`
      # leg can't be built here -- same shape as gotcha 101's litellm
      # case. musllinux is dropped: rustup.rs ships no riscv64 musl
      # toolchain.
      cibw-build: >-
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      # openssl-sys vendors and builds OpenSSL from source (pulled in via
      # native-tls); the image's minimal perl-interpreter lacks FindBin,
      # which Configure needs -- gotcha 46.
      cibw-before-all-linux: >-
        dnf -y install perl &&
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: 'PATH="$PATH:$HOME/.cargo/bin"'
      # 0.8.0 stopped shipping tests/ in its tags (0.7.0 had test_simple.py,
      # test_values.py and test_version.py), and cibuildwheel errors out on a
      # missing test source, so run what those did without the network: the
      # extension is compiled, the Rust and Python clients construct, and the
      # package version matches the distribution metadata.
      cibw-test-command: >-
        python -c "import importlib.metadata as md, _convex._convex as m, convex;
        from _convex import PyConvexClient;
        assert m.__file__.endswith('.so'), m.__file__;
        assert convex.__version__ == md.version('convex'), convex.__version__;
        PyConvexClient('https://made-up-animal.convex.cloud', convex.__version__);
        convex.ConvexClient('https://made-up-animal.convex.cloud');
        print('ok', convex.__version__)"
      timeout-minutes: 120

  publish:
    name: Publish convex ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: convex-${{ matrix.version }}-manylinux_riscv64
