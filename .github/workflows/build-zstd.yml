---
# Based on upstream's own wheel builders (e.g.
# https://github.com/sergey-dryabzhinsky/python-zstd/blob/v1.5.7.2/.github/workflows/Build_wheels_for_cpython313_x86_64_u24.yml),
# which cross-build under debootstrap chroots per interpreter; narrowed here to
# cibuildwheel's default (bundled libzstd, no --external/--legacy/--libzstd-use-asm).
name: Build zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zstd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zstd.yml'
      - 'docs/packages/zstd.yaml'
      - 'patches/zstd/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zstd.yml'
      - 'docs/packages/zstd.yaml'
      - 'patches/zstd/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zstd ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "zstd"
      version: "${{ matrix.version }}"
      repository: "sergey-dryabzhinsky/python-zstd"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pytest"
      # Upstream's own suite (setup.py test); test_speed.py is a set of
      # 30-second throughput benchmarks with no assertions.
      cibw-test-command: "python -c \"import importlib.metadata as m; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('zstd') if 'LICENSE' in str(p)); assert l == ['LICENSE', 'LICENSE.zstd'], l\" && python -m pytest -q {package}/tests --ignore={package}/tests/test_speed.py"

  publish:
    name: Publish zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zstd-${{ matrix.version }}-*-manylinux_riscv64
