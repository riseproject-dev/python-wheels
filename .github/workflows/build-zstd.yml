---
# Based on upstream's own wheel builders (e.g.
# https://github.com/sergey-dryabzhinsky/python-zstd/blob/v1.5.7.2/.github/workflows/Build_wheels_for_cpython313_x86_64_u24.yml),
# which cross-build under debootstrap chroots per interpreter; narrowed here to
# cibuildwheel's default (bundled libzstd, no --external/--legacy/--libzstd-use-asm).
name: Build zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zstd.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zstd.yml'
      - 'docs/packages/zstd.yaml'
      - 'patches/zstd/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zstd.yml'
      - 'docs/packages/zstd.yaml'
      - 'patches/zstd/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zstd ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      ZSTD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout zstd v${{ env.ZSTD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sergey-dryabzhinsky/python-zstd
          ref: v${{ env.ZSTD_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch zstd source
        run: git apply python-wheels/patches/zstd/${{ env.ZSTD_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          # Upstream's own suite (setup.py test); test_speed.py is a set of
          # 30-second throughput benchmarks with no assertions.
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('zstd') if 'LICENSE' in str(p)); assert l == ['LICENSE', 'LICENSE.zstd'], l"
            && python -m pytest -q {package}/tests --ignore={package}/tests/test_speed.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zstd-${{ env.ZSTD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zstd-${{ matrix.version }}-*-manylinux_riscv64
