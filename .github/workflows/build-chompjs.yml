---
# Based on the `build_wheels` job of
# https://github.com/Nykakin/chompjs/blob/5e6ecf05644efce78524d1dd05b077da5cab25aa/.github/workflows/compile.yml
name: Build chompjs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/chompjs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-chompjs.yml'
      - 'docs/packages/chompjs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chompjs.yml'
      - 'docs/packages/chompjs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags; this commit's tree is
  # byte-identical to the released 1.4.1 sdist (setup.py already reads
  # version='1.4.1'). Update alongside CHOMPJS_VERSION for a newer release.
  CHOMPJS_REF: 5e6ecf05644efce78524d1dd05b077da5cab25aa
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: chompjs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build chompjs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "chompjs"
      version: "${{ matrix.version }}"
      repository: "Nykakin/chompjs"
      ref: "5e6ecf05644efce78524d1dd05b077da5cab25aa"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-requires: "${{ case(matrix.python == 'cp312' && matrix.platform == 'manylinux', 'orjson', matrix.python == 'cp313' && matrix.platform == 'manylinux', 'orjson', matrix.python == 'cp314' && matrix.platform == 'manylinux', 'orjson', '') }}"
      # pypi.riseproject.dev only carries orjson for cp312/cp313/cp314
      # manylinux today; the doctest below imports orjson as a custom
      # `loader`, so it only runs where a riscv64 wheel exists rather
      # than forcing a from-source PyO3 build on the rest of the matrix.
      cibw-test-command: "python -m unittest discover {package} && ${{ case(matrix.python == 'cp312' && matrix.platform == 'manylinux', 'orjson', matrix.python == 'cp313' && matrix.platform == 'manylinux', 'orjson', matrix.python == 'cp314' && matrix.platform == 'manylinux', 'orjson', '') == 'orjson' && 'python -m doctest {package}/chompjs/chompjs.py --verbose' || 'true' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CHOMPJS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: chompjs-${{ env.CHOMPJS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish chompjs ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: chompjs-${{ matrix.version }}-*riscv64
