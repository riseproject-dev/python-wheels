---
# This workflow is based on: https://github.com/OpenNMT/Tokenizer/blob/v1.38.1/.github/workflows/ci.yml
name: Build pyonmttok wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyonmttok.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyonmttok.yml'
      - 'docs/packages/pyonmttok.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyonmttok.yml'
      - 'docs/packages/pyonmttok.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyonmttok
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyonmttok ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyonmttok
      version: ${{ matrix.version }}
      repository: OpenNMT/Tokenizer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-package-dir: bindings/python
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Mirrors bindings/python/tools/prepare_build_environment_linux.sh: build ICU
      # statically from source, then build the Tokenizer C++ library (LIB_ONLY, bundling
      # the vendored SentencePiece submodule) against it. dnf (not pip) installs cmake,
      # same as build-ctranslate2.yml, since CIBW_BEFORE_ALL runs outside the per-interpreter
      # venv where our registry's PIP_EXTRA_INDEX_URL applies.
      cibw-before-all-linux: |
        set -ex
        dnf install -y cmake
        curl -L -O https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz
        tar xf icu4c-73_2-src.tgz
        cp icu/LICENSE /project/LICENSE.ICU
        cd icu/source
        CFLAGS="-O3 -fPIC" CXXFLAGS="-O3 -fPIC" ./configure --disable-shared --enable-static --prefix=/usr/local/icu
        make -j"$(nproc)" install
        cd /project
        cp third_party/sentencepiece/LICENSE /project/LICENSE.sentencepiece
        cmake -S . -B build -D LIB_ONLY=ON -D ICU_ROOT=/usr/local/icu
        cmake --build build -j"$(nproc)" --target install
        ldconfig
      # setup.py's `license="MIT"` with no `license_files=[...]` falls back to setuptools'
      # default LICEN[CS]E* glob, resolved against the build cwd (bindings/python, gotcha
      # 578) - which has none of its own. Copy the project's own licence plus the two
      # vendored, statically-linked libraries' licences (ICU License, SentencePiece's
      # Apache-2.0) in so the default glob picks all three up.
      cibw-before-build: >-
        cp {project}/LICENSE.md {project}/bindings/python/LICENSE.md &&
        cp {project}/LICENSE.ICU {project}/bindings/python/LICENSE.ICU &&
        cp {project}/LICENSE.sentencepiece {project}/bindings/python/LICENSE.sentencepiece &&
        pip install pybind11==2.10.1
      cibw-environment-linux: >-
        TOKENIZER_ROOT=/project/build/install
        ICU_ROOT=/usr/local/icu
      cibw-test-command: pytest {project}/bindings/python/test/test.py
      cibw-test-requires: pytest
      timeout-minutes: 360

  publish:
    name: Publish pyonmttok ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyonmttok-${{ matrix.version }}-*-manylinux_riscv64
