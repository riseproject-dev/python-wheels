---
# Based on the `build-wheels` job of
# https://github.com/enthought/traits/blob/7.1.0/.github/workflows/release-to-pypi.yml
name: Build traits wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'traits version to build (git tag, e.g. 7.1.0)'
        required: true
        default: '7.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-traits.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '7.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TRAITS_VERSION: ${{ inputs.version || '7.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build traits ${{ inputs.version || '7.1.0' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout traits ${{ env.TRAITS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: enthought/traits
          ref: ${{ env.TRAITS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # traits/tests is a real subpackage shipped in the wheel (setup.py's
          # find_packages(include=["traits", "traits.*"]) picks it up), so the
          # installed wheel already carries its own test suite - no staging needed.
          # Mirrors upstream's own "Core tests" job (no test extras installed),
          # which exists precisely to catch accidental optional-dependency use;
          # traits/testing/optional_dependencies.py skipIf's the rest.
          CIBW_TEST_COMMAND: >-
            python -c "import traits.ctraits as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m unittest discover -v traits

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: traits-${{ env.TRAITS_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish traits ${{ inputs.version || '7.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: traits-${{ inputs.version || '7.1.0' }}-*riscv64
