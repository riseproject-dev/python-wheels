---
# Based on upstream's wheel builder, which calls the shared
# https://github.com/explosion/gha-cibuildwheel workflow from
# https://github.com/explosion/curated-tokenizers/blob/release-v2.0.1/.github/workflows/cibuildwheel.yml
# The test command mirrors the `Run pytest` step of upstream's test.yml.
name: Build curated-tokenizers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/curated-tokenizers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-curated-tokenizers.yml'
      - 'docs/packages/curated-tokenizers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-curated-tokenizers.yml'
      - 'docs/packages/curated-tokenizers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: curated-tokenizers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build curated-tokenizers ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "curated-tokenizers"
      version: "${{ matrix.version }}"
      repository: "explosion/curated-tokenizers"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream leaves cibuildwheel's test-command empty and tests the wheel in a
      # separate workflow; the suite ships inside the wheel, so run it here.
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest --pyargs curated_tokenizers"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CURATED_TOKENIZERS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: curated-tokenizers-${{ env.CURATED_TOKENIZERS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so"))
          assert sos == ["_bbpe", "_spp", "_wordpiece"], sos
          print("\n".join(sos))
          EOF

  publish:
    name: Publish curated-tokenizers ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: curated-tokenizers-${{ matrix.version }}-*-manylinux_riscv64
