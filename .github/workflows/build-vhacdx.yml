---
# Based on upstream's own wheel build:
#   https://github.com/trimesh/vhacdx/blob/main/.github/workflows/release.yml
name: Build vhacdx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vhacdx version to build (e.g. 0.0.10)'
        required: true
        default: '0.0.10'
  pull_request:
    paths:
      - '.github/workflows/build-vhacdx.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.0.10' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.0.10 there.
  VHACDX_VERSION: ${{ inputs.version || '0.0.10' }}
  # Upstream cuts releases without git tags, so pin the release commit: `main`
  # HEAD is byte-identical (source-wise) to the 0.0.10 PyPI sdist. Update it
  # alongside VHACDX_VERSION.
  VHACDX_REF: 1dbf2874b7c00d79c2f4ea56379b9a3c20a4693b
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build vhacdx ${{ inputs.version || '0.0.10' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): upstream ships cp3x-cp3x wheels.
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout vhacdx ${{ env.VHACDX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: trimesh/vhacdx
          ref: ${{ env.VHACDX_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # numpy is a runtime dependency with no riscv64 wheel on public PyPI;
          # pyproject.toml's own test-skip already excludes musllinux, so this
          # only takes effect for the manylinux test phase.
          CIBW_TEST_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vhacdx-${{ env.VHACDX_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish vhacdx ${{ inputs.version || '0.0.10' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: vhacdx-${{ inputs.version || '0.0.10' }}-*riscv64
