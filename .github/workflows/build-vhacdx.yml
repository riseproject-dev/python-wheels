---
# Based on upstream's own wheel build:
#   https://github.com/trimesh/vhacdx/blob/main/.github/workflows/release.yml
name: Build vhacdx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vhacdx.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vhacdx.yml'
      - 'docs/packages/vhacdx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vhacdx.yml'
      - 'docs/packages/vhacdx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vhacdx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vhacdx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): upstream ships cp3x-cp3x wheels.
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      VHACDX_VERSION: ${{ matrix.version }}

    steps:
      # Upstream cuts releases without git tags, so map each version to the
      # commit whose source is byte-identical (ignoring .github/.gitignore) to
      # that version's PyPI sdist. Add a line for every new version in
      # docs/packages/vhacdx.yaml.
      - name: Resolve source commit for ${{ env.VHACDX_VERSION }}
        id: src
        run: |
          case "$VHACDX_VERSION" in
            0.0.10) ref=1dbf2874b7c00d79c2f4ea56379b9a3c20a4693b ;;
            0.1.0) ref=13d47bc82b92da808fb4bf177b59f6b8a89fd100 ;;
            0.1.1) ref=02d00ea2857cc6cb54965152a70b55e9e41a2caf ;;
            *) echo "::error::No upstream commit recorded for vhacdx $VHACDX_VERSION; add it to this case statement"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout vhacdx ${{ env.VHACDX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: trimesh/vhacdx
          ref: ${{ steps.src.outputs.ref }}
          persist-credentials: false

      - name: Check the checked-out source declares ${{ env.VHACDX_VERSION }}
        run: |
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)
          if [ "$declared" != "$VHACDX_VERSION" ]; then
            echo "::error::pyproject.toml declares '$declared' but building $VHACDX_VERSION"; exit 1
          fi

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # numpy is a runtime dependency with no riscv64 wheel on public PyPI;
          # pyproject.toml's own test-skip already excludes musllinux, so this
          # only takes effect for the manylinux test phase.
          CIBW_TEST_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vhacdx-${{ env.VHACDX_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish vhacdx ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: vhacdx-${{ matrix.version }}-*riscv64
