---
# Based on upstream's wheel builder:
#   https://github.com/fonttools/pyclipper/blob/1.4.0/.github/workflows/ci.yml
name: Build pyclipper wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyclipper version to build (git tag, e.g. 1.4.0)'
        required: true
        default: '1.4.0'
  pull_request:
    paths:
      - '.github/workflows/build-pyclipper.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYCLIPPER_VERSION: ${{ inputs.version || '1.4.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build pyclipper ${{ inputs.version || '1.4.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Upstream builds no free-threaded Linux wheel, and the extension does not
        # declare free-threading support, so cp314t is excluded.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout pyclipper ${{ env.PYCLIPPER_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: fonttools/pyclipper
          ref: ${{ env.PYCLIPPER_VERSION }}
          fetch-depth: 0  # setuptools_scm derives the version from the tag
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: sympy pytest
          CIBW_TEST_COMMAND: pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyclipper-${{ env.PYCLIPPER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyclipper ${{ inputs.version || '1.4.0' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: pyclipper-${{ env.PYCLIPPER_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
