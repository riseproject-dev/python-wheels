---
# This workflow is based on: https://github.com/ets-labs/python-dependency-injector/blob/4.49.1/.github/workflows/publishing.yml
name: Build dependency-injector wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dependency-injector.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dependency-injector.yml'
      - 'docs/packages/dependency-injector.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dependency-injector.yml'
      - 'docs/packages/dependency-injector.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Mirrors upstream's tox testenv deps (tox.ini [testenv]).
  TEST_REQUIRES: >-
    pytest pytest-asyncio httpx fastapi flask aiohttp numpy scipy boto3
    mypy_boto3_s3 pydantic-settings werkzeug fast-depends "cython>=3,<4" setuptools
  TEST_COMMAND: python -m pytest tests/unit

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dependency-injector
      version: ${{ inputs.version }}

  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build dependency-injector ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dependency-injector"
      version: "${{ matrix.version }}"
      repository: "ets-labs/python-dependency-injector"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # cp310 first, matching setup.py's py_limited_api="cp310" floor (gotcha 96):
      # building the abi3 wheel on a newer interpreter can silently break older
      # ones despite the tag. The later entries build nothing; they re-test it.
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-environment-linux: "DEPENDENCY_INJECTOR_LIMITED_API=1"
      # cp310/cp311 lag our registry's newest numpy/scipy (gotcha 67/84): the
      # newest PyPI release still supporting 3.10 has no riscv64 wheel here, so
      # unconstrained pip tries to build it from source and fails on missing OpenBLAS.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-requires: "pytest pytest-asyncio httpx fastapi flask aiohttp numpy scipy boto3 mypy_boto3_s3 pydantic-settings werkzeug fast-depends \"cython>=3,<4\" setuptools"
      cibw-test-extras: "yaml"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest tests/unit"

  verify_wheels:
    needs: [setup, build_abi3]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      DEPENDENCY_INJECTOR_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dependency-injector-${{ env.DEPENDENCY_INJECTOR_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile, posixpath
          expected = {
              "dependency_injector.containers",
              "dependency_injector.providers",
              "dependency_injector._cwiring",
          }
          for whl in sys.argv[1:]:
              found = set()
              for n in zipfile.ZipFile(whl).namelist():
                  if not n.endswith(".so"):
                      continue
                  pkg, base = posixpath.split(n)
                  # Extension filenames carry an ABI tag (e.g. containers.abi3.so).
                  found.add(f"{pkg.replace('/', '.')}.{base.split('.', 1)[0]}")
              assert expected <= found, (whl, found)
              print(whl, "ok")
          EOF

  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build dependency-injector ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dependency-injector"
      version: "${{ matrix.version }}"
      repository: "ets-labs/python-dependency-injector"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 90
      cibw-build: "cp314t-manylinux_riscv64"
      cibw-environment-linux: "DEPENDENCY_INJECTOR_LIMITED_API=1"
      cibw-test-requires: "pytest pytest-asyncio httpx fastapi flask aiohttp numpy scipy boto3 mypy_boto3_s3 pydantic-settings werkzeug fast-depends \"cython>=3,<4\" setuptools"
      cibw-test-extras: "yaml"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest tests/unit"

  publish:
    name: Publish dependency-injector ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dependency-injector-${{ matrix.version }}-*-manylinux_riscv64
