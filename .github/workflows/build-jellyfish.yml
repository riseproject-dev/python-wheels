---
# This workflow is based on the `linux` job of
# https://github.com/jamesturk/jellyfish/blob/v1.2.1/.github/workflows/CI.yml
name: Build jellyfish wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jellyfish.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jellyfish.yml'
      - 'docs/packages/jellyfish.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jellyfish.yml'
      - 'docs/packages/jellyfish.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jellyfish
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jellyfish ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per interpreter (upstream ships cp3x-cp3x wheels,
        # no abi3). cp314t is excluded: upstream publishes no free-threaded wheel
        # and the module does not declare `gil_used(false)`, so it would re-enable
        # the GIL on import.
        python: ["cp312", "cp313", "cp314"]

    env:
      JELLYFISH_VERSION: ${{ matrix.version }}

    steps:
      # PyPI records the Codeberg repository, but upstream's releases and CI live
      # on this GitHub mirror; the v1.2.1 tree matches the released sdist.
      - name: Checkout jellyfish ${{ env.JELLYFISH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jamesturk/jellyfish
          ref: v${{ env.JELLYFISH_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is out of reach: rustup publishes rust-std but no rustc/cargo
          # host toolchain for riscv64gc-unknown-linux-musl.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # jellyfish ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          # The suite opens testdata/*.csv relative to the working directory, so
          # stage it beside tests/ at its original path.
          CIBW_TEST_SOURCES: tests testdata
          CIBW_TEST_COMMAND: python -m pytest tests

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("jellyfish/_rustyfish.") and n.endswith(".so")
                         for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jellyfish-${{ env.JELLYFISH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish jellyfish ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: jellyfish-${{ matrix.version }}-*-manylinux_riscv64
