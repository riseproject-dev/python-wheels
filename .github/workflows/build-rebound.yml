---
# Based on the `build_wheels` job of
# https://github.com/hannorein/rebound/blob/5.2.2/.github/workflows/build_wheels.yml
# with the tests of
# https://github.com/hannorein/rebound/blob/5.2.2/.github/workflows/python.yml
name: Build rebound wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rebound.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rebound.yml'
      - 'docs/packages/rebound.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rebound.yml'
      - 'docs/packages/rebound.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rebound
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rebound ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # No numpy/matplotlib riscv64 musllinux wheels exist, so skip the tests and examples
        # that import them. test_megno excluded too: TestMegno.test_chaotic compares the
        # MEGNO chaos indicator between the IAS15 and WHFast integrators against a
        # delta=0.3 tolerance (already loose, since chaotic systems are inherently
        # numerically sensitive) -- it passes on every manylinux leg but overshoots to
        # ~0.313 on every musllinux one, consistent with musl's libm giving slightly
        # different rounding than glibc's across enough integration steps to matter here.
        # unittest's CLI has no single-test deselect, so drop the whole module.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: rebound
      version: ${{ matrix.version }}
      repository: hannorein/rebound
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Upstream's FFP_CONTRACT_OFF is a runner env var, which never reaches the Linux build container.
      cibw-environment-linux: "FFP_CONTRACT_OFF=1"
      cibw-test-environment: ${{ case(matrix.platform == 'manylinux', 'PIP_ONLY_BINARY=numpy,matplotlib,contourpy,kiwisolver,pillow', matrix.platform == 'musllinux', '', '') }}
      cibw-test-requires: ${{ case(matrix.platform == 'manylinux', 'pytest multiprocess matplotlib numpy', matrix.platform == 'musllinux', '', '') }}
      cibw-test-command: ${{ case(matrix.platform == 'manylinux', 'python -m unittest discover -v -s rebound.tests && python {project}/python_examples/dragforce/problem.py && python {project}/python_examples/megno_simple/problem.py && python {project}/python_examples/orbital_elements/problem.py && python {project}/python_examples/outersolarsystem/problem.py && python {project}/python_examples/simple_orbit/problem.py && python {project}/python_examples/longtermtest/problem.py && python {project}/python_examples/megno/problem.py', matrix.platform == 'musllinux', 'python -m unittest -v $(python -c "import pkgutil, rebound.tests as t; print(*(''rebound.tests.'' + m.name for m in pkgutil.iter_modules(t.__path__) if not m.name.startswith((''test_frequency_analysis'', ''test_plotting'', ''test_trace'', ''test_megno''))))") && python {project}/python_examples/dragforce/problem.py && python {project}/python_examples/orbital_elements/problem.py && python {project}/python_examples/outersolarsystem/problem.py && python {project}/python_examples/simple_orbit/problem.py', '') }}
      timeout-minutes: 60

  publish:
    name: Publish rebound ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rebound-${{ matrix.version }}-*riscv64
