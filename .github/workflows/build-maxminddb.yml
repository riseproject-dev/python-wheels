---
# Based on the `build_wheels` job of
# https://github.com/maxmind/MaxMind-DB-Reader-python/blob/v3.1.1/.github/workflows/release.yml
name: Build maxminddb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/maxminddb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-maxminddb.yml'
      - 'docs/packages/maxminddb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-maxminddb.yml'
      - 'docs/packages/maxminddb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: maxminddb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build maxminddb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "maxminddb"
      version: "${{ matrix.version }}"
      # Submodules carry the bundled libmaxminddb sources and the test databases.
      repository: "maxmind/MaxMind-DB-Reader-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"

      # The extension compiles in libmaxminddb, whose Apache-2.0 NOTICE has to
      # travel with the binary; upstream's wheel carries only its own LICENSE.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream passes MAXMINDDB_REQUIRE_EXTENSION as a plain job env var, which
      # never reaches the Linux build container; setup.py otherwise swallows a
      # compile failure and ships the pure-Python fallback under a riscv64 tag.
      cibw-environment-linux: "MAXMINDDB_REQUIRE_EXTENSION=1"
      # README.rst is opened by test_nondatabase; pyproject.toml carries the
      # --import-mode=importlib addopts.
      cibw-test-sources: "tests pyproject.toml README.rst"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import maxminddb.extension as e, importlib.metadata as m; assert e.__file__.endswith('.so'), e.__file__; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('maxminddb') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'NOTICE'], l\" && python -m pytest tests"

  publish:
    name: Publish maxminddb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: maxminddb-${{ matrix.version }}-*-manylinux_riscv64
