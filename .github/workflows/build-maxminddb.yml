---
# Based on the `build_wheels` job of
# https://github.com/maxmind/MaxMind-DB-Reader-python/blob/v3.1.1/.github/workflows/release.yml
name: Build maxminddb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'maxminddb version to build (git tag without leading v, e.g. 3.1.1)'
        required: true
        default: '3.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-maxminddb.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MAXMINDDB_VERSION: ${{ inputs.version || '3.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build maxminddb ${{ inputs.version || '3.1.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      # Submodules carry the bundled libmaxminddb sources and the test databases.
      - name: Checkout maxminddb v${{ env.MAXMINDDB_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: maxmind/MaxMind-DB-Reader-python
          ref: v${{ env.MAXMINDDB_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      # The extension compiles in libmaxminddb, whose Apache-2.0 NOTICE has to
      # travel with the binary; upstream's wheel carries only its own LICENSE.
      - name: Patch maxminddb source
        run: |
          git apply python-wheels/patches/maxminddb/${{ env.MAXMINDDB_VERSION }}/00*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream passes MAXMINDDB_REQUIRE_EXTENSION as a plain job env var, which
          # never reaches the Linux build container; setup.py otherwise swallows a
          # compile failure and ships the pure-Python fallback under a riscv64 tag.
          CIBW_ENVIRONMENT: MAXMINDDB_REQUIRE_EXTENSION=1
          # README.rst is opened by test_nondatabase; pyproject.toml carries the
          # --import-mode=importlib addopts.
          CIBW_TEST_SOURCES: tests pyproject.toml README.rst
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import maxminddb.extension as e, importlib.metadata as m;
            assert e.__file__.endswith('.so'), e.__file__;
            l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('maxminddb') if '.dist-info/licenses/' in str(p));
            assert l == ['LICENSE', 'NOTICE'], l" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maxminddb-${{ env.MAXMINDDB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish maxminddb ${{ inputs.version || '3.1.1' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: maxminddb-${{ env.MAXMINDDB_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
