---
# This workflow is based on: https://github.com/earwig/mwparserfromhell/blob/v0.7.2/.github/workflows/build.yml
name: Build mwparserfromhell wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mwparserfromhell.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mwparserfromhell.yml'
      - 'docs/packages/mwparserfromhell.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mwparserfromhell.yml'
      - 'docs/packages/mwparserfromhell.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mwparserfromhell
      # The tokenizer segfaults under Py_GIL_DISABLED (upstream issue #343).
      python-exclude: 'cp39 cp3*t'
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mwparserfromhell ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mwparserfromhell
      version: ${{ matrix.version }}
      repository: earwig/mwparserfromhell
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Overriding CIBW_ENVIRONMENT replaces (not merges with) pyproject's
      # [tool.cibuildwheel] environment table, so WITH_EXTENSION=1 (which
      # selects the C tokenizer) has to be repeated here; PIP_EXTRA_INDEX_URL
      # is added so the `dev` test-group's psutil resolves for riscv64.
      cibw-environment: >-
        WITH_EXTENSION=1
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      timeout-minutes: 60

  publish:
    name: Publish mwparserfromhell ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mwparserfromhell-${{ matrix.version }}-*riscv64
