---
# Based on the `build_wheels` job of
# https://github.com/Hizuru3/python-habachen/blob/v0.6.0/.github/workflows/upload.yml
# and the test invocation of
# https://github.com/Hizuru3/python-habachen/blob/v0.6.0/.github/workflows/doctest.yml
name: Build habachen wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/habachen.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-habachen.yml'
      - 'docs/packages/habachen.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-habachen.yml'
      - 'docs/packages/habachen.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: habachen
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build habachen ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      HABACHEN_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout habachen v${{ env.HABACHEN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Hizuru3/python-habachen
          ref: v${{ env.HABACHEN_VERSION }}
          persist-credentials: false

      # Upstream stamps the release version into the tagged tree in its release job.
      - name: Update Version
        run: |
          sed -i "s/version = '.*'/version = '${HABACHEN_VERSION}'/" setup.py
          sed -i "s/__version__ = '.*'/__version__ = '${HABACHEN_VERSION}'/" ./habachen/_version.py
          grep -q "version = '${HABACHEN_VERSION}'" setup.py
          grep -q "__version__ = '${HABACHEN_VERSION}'" habachen/_version.py

      - name: Turnout
        run: |
          git rm -f pyproject.toml

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: habachen_doctest.py README.md docs/_sources
          CIBW_TEST_COMMAND: python habachen_doctest.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: habachen-${{ env.HABACHEN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish habachen ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: habachen-${{ matrix.version }}-*-manylinux_riscv64
