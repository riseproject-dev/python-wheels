---
# Based on upstream's own wheel and test workflows:
#   https://github.com/zqfang/GSEApy/blob/v1.3.1/.github/workflows/wheels.yml
#   https://github.com/zqfang/GSEApy/blob/v1.3.1/.github/workflows/test.yml
name: Build gseapy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gseapy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gseapy.yml'
      - 'docs/packages/gseapy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gseapy.yml'
      - 'docs/packages/gseapy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gseapy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gseapy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # pandas, a hard runtime dependency, has no cp314t riscv64 wheel on pypi.riseproject.dev.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gseapy"
      version: "${{ matrix.version }}"
      repository: "zqfang/GSEApy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "yum install libatomic -y && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=numpy,scipy,pandas,matplotlib,contourpy,kiwisolver,pillow,fonttools,lxml,pyyaml"
      cibw-before-build: "python -m pip install -U pip setuptools wheel build setuptools-rust"
      cibw-test-extras: "test"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "pytest tests"
      cibw-test-skip: "${{ case(endsWith(matrix.python, 't'), '*', '') }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # pandas, a hard runtime dependency, has no cp314t riscv64 wheel on pypi.riseproject.dev.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GSEAPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gseapy-${{ env.GSEAPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the Rust extension is in the wheel
        run: python3 -m zipfile -l wheelhouse/*.whl | grep -E 'gseapy/gse\..*\.so'

  publish:
    name: Publish gseapy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gseapy-${{ matrix.version }}-*-manylinux_riscv64
