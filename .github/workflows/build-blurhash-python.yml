---
# Based on upstream's own wheel builder (build.sh/container-build.sh):
#   https://github.com/woltapp/blurhash-python/blob/v1.2.2/container-build.sh
name: Build blurhash-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/blurhash-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-blurhash-python.yml'
      - 'docs/packages/blurhash-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-blurhash-python.yml'
      - 'docs/packages/blurhash-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: blurhash-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build blurhash-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: blurhash-python
      version: ${{ matrix.version }}
      repository: woltapp/blurhash-python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py's setup_requires fetches cffi/setuptools-scm via
      # easy_install, which doesn't see our registry; preinstall and
      # build against them directly instead.
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: pip install cffi setuptools setuptools-scm wheel
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_BLURHASH_PYTHON=${{ matrix.version }}"
      cibw-test-extras: testing
      # test_invalid_image opens README.md as a non-image file; tests/
      # loads its fixture PNGs by relative path, matching upstream's own
      # `pytest` invocation from the repo root.
      cibw-test-sources: tests README.md
      cibw-test-command: pytest tests
      timeout-minutes: 60

  publish:
    name: Publish blurhash-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: blurhash-python-${{ matrix.version }}-*-manylinux_riscv64
