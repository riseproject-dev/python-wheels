---
# This workflow is based on: https://github.com/equinor/segyio/blob/v1.9.14/.github/workflows/wheels.yaml
name: Build segyio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'segyio version to build (git tag without leading v, e.g. 1.9.14)'
        required: true
        default: '1.9.14'
  pull_request:
    paths:
      - '.github/workflows/build-segyio.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.9.14' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SEGYIO_VERSION: ${{ inputs.version || '1.9.14' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build segyio ${{ inputs.version || '1.9.14' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout segyio v${{ env.SEGYIO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: equinor/segyio
          ref: v${{ env.SEGYIO_VERSION }}
          persist-credentials: false

      - name: Stage LICENSE beside pyproject.toml
        # License.md lives at the repo root; scikit-build-core's default
        # license-files glob only looks inside package-dir (python/).
        run: cp License.md python/LICENSE

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.rsplit("/", 1)[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert exts == {"_segyio"}, (whl, exts)
              licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: segyio-${{ env.SEGYIO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish segyio ${{ inputs.version || '1.9.14' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: segyio-${{ inputs.version || '1.9.14' }}-*-manylinux_riscv64
