---
# This workflow is based on the `install`/`script` steps of
# https://github.com/al45tair/netifaces/blob/release_0_11_0/.travis.yml and the
# manylinux build script https://github.com/al45tair/netifaces/blob/release_0_11_0/makewheels.sh
name: Build netifaces wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'netifaces version to build (e.g. 0.11.0)'
        required: true
        default: '0.11.0'
  pull_request:
    paths:
      - '.github/workflows/build-netifaces.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.11.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  NETIFACES_VERSION: ${{ inputs.version || '0.11.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build netifaces ${{ inputs.version || '0.11.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      # netifaces tags releases as release_X_Y_Z, not the PyPI version.
      - name: Determine upstream git tag
        run: echo "NETIFACES_TAG=release_${NETIFACES_VERSION//./_}" >> "$GITHUB_ENV"

      - name: Checkout netifaces ${{ env.NETIFACES_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: al45tair/netifaces
          ref: ${{ env.NETIFACES_TAG }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: test.py
          CIBW_TEST_COMMAND: python test.py

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("netifaces") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: netifaces-${{ env.NETIFACES_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish netifaces ${{ inputs.version || '0.11.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: netifaces-${{ inputs.version || '0.11.0' }}-*-manylinux_riscv64
