---
# Based on upstream's CI:
#   https://github.com/gaogaotiantian/viztracer/blob/1.1.1/.github/workflows/wheels.yml
name: Build viztracer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/viztracer.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-viztracer.yml'
      - 'docs/packages/viztracer.yaml'
      - 'patches/viztracer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-viztracer.yml'
      - 'docs/packages/viztracer.yaml'
      - 'patches/viztracer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: viztracer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build viztracer ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      VIZTRACER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout viztracer ${{ env.VIZTRACER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gaogaotiantian/viztracer
          ref: ${{ env.VIZTRACER_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Two tests hang forever on riscv64 and four fail (see the patches): self-tracing
      # overhead, Perfetto's trace_processor_shell having no riscv64 prebuilt, and no
      # riscv64 build of the cross-process attach .so.
      - name: Patch viztracer source
        run: |
          git apply python-wheels/patches/viztracer/${{ env.VIZTRACER_VERSION }}/00*.patch

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # TestLoky (tests/test_multiprocess.py) imports loky unconditionally; every
          # other optional dep upstream's suite touches (torch, jaxlib, ipywidgets)
          # is self-skipping on ImportError or platform.
          CIBW_TEST_REQUIRES: loky>=3.0.0,<3.5.0
          # cibuildwheel runs the tests in an empty directory, so stage upstream's suite
          # there; test_combine also reaches outside tests/ for its example data files.
          CIBW_TEST_SOURCES: tests example/json
          CIBW_TEST_COMMAND: python -m unittest -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: viztracer-${{ env.VIZTRACER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish viztracer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: viztracer-${{ matrix.version }}-*-manylinux_riscv64
