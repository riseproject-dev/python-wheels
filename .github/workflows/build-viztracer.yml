---
# Based on upstream's CI:
#   https://github.com/gaogaotiantian/viztracer/blob/1.1.1/.github/workflows/wheels.yml
name: Build viztracer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/viztracer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-viztracer.yml'
      - 'docs/packages/viztracer.yaml'
      - 'patches/viztracer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-viztracer.yml'
      - 'docs/packages/viztracer.yaml'
      - 'patches/viztracer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: viztracer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build viztracer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "viztracer"
      version: "${{ matrix.version }}"
      repository: "gaogaotiantian/viztracer"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      # Two tests hang forever on riscv64 and four fail (see the patches): self-tracing
      # overhead, Perfetto's trace_processor_shell having no riscv64 prebuilt, and no
      # riscv64 build of the cross-process attach .so.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # TestLoky (tests/test_multiprocess.py) imports loky unconditionally; every
      # other optional dep upstream's suite touches (torch, jaxlib, ipywidgets)
      # is self-skipping on ImportError or platform.
      cibw-test-requires: "loky>=3.0.0,<3.5.0"
      # cibuildwheel runs the tests in an empty directory, so stage upstream's suite
      # there; test_combine also reaches outside tests/ for its example data files.
      cibw-test-sources: "tests example/json"
      cibw-test-command: "python -m unittest -v"

  publish:
    name: Publish viztracer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: viztracer-${{ matrix.version }}-*-manylinux_riscv64
