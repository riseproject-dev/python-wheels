---
# Based on upstream's CI:
#   https://github.com/gaogaotiantian/viztracer/blob/1.1.1/.github/workflows/wheels.yml
name: Build viztracer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'viztracer version to build (git tag, e.g. 1.1.1)'
        required: true
        default: '1.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-viztracer.yml'
      - 'patches/viztracer/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  VIZTRACER_VERSION: ${{ inputs.version || '1.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build viztracer ${{ inputs.version || '1.1.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout viztracer ${{ env.VIZTRACER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gaogaotiantian/viztracer
          ref: ${{ env.VIZTRACER_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # test_trace_self's wait for the child's stdout has no timeout, and self-tracing
      # multiplies clock_gettime() syscalls (riscv64 has no __rdtsc()-equivalent fast
      # path) across the whole interpreter startup, so it never completes in practice.
      - name: Patch viztracer source
        run: |
          git apply python-wheels/patches/viztracer/${{ env.VIZTRACER_VERSION }}/00*.patch

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # TestLoky (tests/test_multiprocess.py) imports loky unconditionally; every
          # other optional dep upstream's suite touches (torch, jaxlib, ipywidgets)
          # is self-skipping on ImportError or platform.
          CIBW_TEST_REQUIRES: loky>=3.0.0,<3.5.0
          # cibuildwheel runs the tests in an empty directory, so stage upstream's suite there.
          CIBW_TEST_SOURCES: tests
          # One-off timing diagnostic for the patched-out test_trace_self hang (see the
          # patch): bounded by `timeout` so a slow-but-not-hung result still reports.
          CIBW_TEST_COMMAND: >-
            (echo diag_start=$(date +%s) &&
            timeout 120 python -m viztracer --trace_self -o /tmp/self_diag.json -c "print(1)";
            echo diag_exit=$? diag_end=$(date +%s)) &&
            python -m unittest -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: viztracer-${{ env.VIZTRACER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish viztracer ${{ inputs.version || '1.1.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: viztracer-${{ inputs.version || '1.1.1' }}-*-manylinux_riscv64
