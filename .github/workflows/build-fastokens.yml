---
# This workflow is based on the `linux` job of
# https://github.com/Atero-ai/fastokens/blob/v0.3.1/.github/workflows/build-maturin.yml
name: Build fastokens wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastokens.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastokens.yml'
      - 'docs/packages/fastokens.yaml'
      - 'patches/fastokens/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastokens.yml'
      - 'docs/packages/fastokens.yaml'
      - 'patches/fastokens/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastokens
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastokens ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastokens"
      version: "${{ matrix.version }}"
      repository: "Atero-ai/fastokens"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export FASTOKENS_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/fastokens/${FASTOKENS_VERSION}"
        if [ -d "$patches" ]; then
          git apply -v "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # pyo3's abi3-py39 feature is on unconditionally (python/Cargo.toml), so one
      # cp39-abi3 wheel serves every GIL-ful interpreter; upstream ships no
      # free-threaded wheel because abi3 and Py_GIL_DISABLED only meet on 3.14+.
      # cibuildwheel compiles once on cp39 -- the oldest interpreter the tag claims
      # -- and re-tests that wheel on the newer ones. musllinux is dropped:
      # rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp39-manylinux_riscv64 cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # cibuildwheel's default abi3audit run reports one ABI version mismatch:
      # python/src/lib.rs declares PyUnicode_AsUTF8AndSize (stable ABI only from 3.10)
      # itself and calls it only after checking at runtime that the interpreter is 3.10+.
      # Upstream's own released x86_64 cp39-abi3 wheel fails the identical audit.
      cibw-audit-command: ''
      # fastokens ships no [tool.cibuildwheel], so the Rust toolchain its maturin
      # backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "python/tests"
      # test_thread_safety.py downloads Qwen/Qwen3-0.6B from the Hugging Face Hub.
      cibw-test-command: "python -m pytest -v python/tests --ignore=python/tests/test_thread_safety.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      FASTOKENS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fastokens-${{ env.FASTOKENS_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "fastokens/_native.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              assert any(n.endswith(".dist-info/licenses/NOTICES.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish fastokens ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastokens-${{ matrix.version }}-*-manylinux_riscv64
