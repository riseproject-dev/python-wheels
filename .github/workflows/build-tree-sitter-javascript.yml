---
# Based on upstream's wheel builder:
#   https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
name: Build tree-sitter-javascript wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tree-sitter-javascript version to build (git tag without leading v, e.g. 0.25.0)'
        required: true
        default: '0.25.0'
  pull_request:
    paths:
      - '.github/workflows/build-tree-sitter-javascript.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.25.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TREE_SITTER_JAVASCRIPT_VERSION: ${{ inputs.version || '0.25.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tree-sitter-javascript ${{ inputs.version || '0.25.0' }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Checkout tree-sitter-javascript v${{ env.TREE_SITTER_JAVASCRIPT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tree-sitter/tree-sitter-javascript
          ref: v${{ env.TREE_SITTER_JAVASCRIPT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: core
          CIBW_TEST_SOURCES: bindings/python/tests
          CIBW_TEST_COMMAND: python -m unittest discover -v -s bindings/python/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-javascript-${{ env.TREE_SITTER_JAVASCRIPT_VERSION }}-cp310-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tree-sitter-javascript ${{ inputs.version || '0.25.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tree-sitter-javascript-${{ inputs.version || '0.25.0' }}-*-manylinux_riscv64
