---
# This workflow is based on: https://github.com/medspacy/PyRuSH/blob/1.0.13/.github/workflows/wheelbuilder3.9.yml
name: Build pyrush wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrush.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrush.yml'
      - 'docs/packages/pyrush.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrush.yml'
      - 'docs/packages/pyrush.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrush
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyrush ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # spacy, a runtime dependency, has no free-threaded build.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      PYRUSH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout PyRuSH ${{ env.PYRUSH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: medspacy/PyRuSH
          ref: ${{ env.PYRUSH_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The tests compile spacy's thinc 8.3.x from source (no riscv64 wheel anywhere);
          # same Cython cap as build-spacy.yml for those nested builds. PyPI's newest
          # numpy has no riscv64 wheel, so only-binary keeps it on the registry's.
          # -mtune=generic is an x86-only tuning target; gcc on riscv64 rejects it.
          CIBW_BEFORE_ALL: echo 'cython<3.3.0' > /cython-constraint.txt
          CIBW_ENVIRONMENT: >-
            CFLAGS='-O3 -g0 -pipe -fPIC'
            LDFLAGS='-fPIC'
            PIP_BUILD_CONSTRAINT=/cython-constraint.txt
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # Upstream installs dev-requirements.txt before the wheel; medspacy in it pulls
          # PyRuSH from PyPI, and pip then keeps that same-version install over this wheel.
          CIBW_TEST_REQUIRES: pytest medspacy
          CIBW_TEST_COMMAND: pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyrush-${{ env.PYRUSH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyrush ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyrush-${{ matrix.version }}-*-manylinux_riscv64
