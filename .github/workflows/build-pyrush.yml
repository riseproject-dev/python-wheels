---
# This workflow is based on: https://github.com/medspacy/PyRuSH/blob/1.0.13/.github/workflows/wheelbuilder3.9.yml
name: Build pyrush wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrush.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrush.yml'
      - 'docs/packages/pyrush.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrush.yml'
      - 'docs/packages/pyrush.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrush
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyrush ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyrush
      version: ${{ matrix.version }}
      repository: medspacy/PyRuSH
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The tests compile spacy's thinc 8.3.x from source (no riscv64 wheel anywhere);
      # same Cython cap as build-spacy.yml for those nested builds. PyPI's newest
      # numpy has no riscv64 wheel, so only-binary keeps it on the registry's.
      # -mtune=generic is an x86-only tuning target; gcc on riscv64 rejects it.
      cibw-before-all: echo 'cython<3.3.0' > /cython-constraint.txt
      cibw-environment-linux: "CFLAGS='-O3 -g0 -pipe -fPIC' LDFLAGS='-fPIC' PIP_BUILD_CONSTRAINT=/cython-constraint.txt PIP_ONLY_BINARY=numpy"
      # Upstream installs dev-requirements.txt before the wheel; medspacy in it pulls
      # PyRuSH from PyPI, and pip then keeps that same-version install over this wheel.
      cibw-test-requires: pytest medspacy
      cibw-test-command: pytest {package}/tests
      timeout-minutes: 720

  publish:
    name: Publish pyrush ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyrush-${{ matrix.version }}-*-manylinux_riscv64
