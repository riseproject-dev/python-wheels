---
# Mirrors the build-wheels job of upstream's cibuildwheel.yml: a scikit-build-core/CMake
# build of the SLICOT Fortran library (vendored source, GPL-licensed) wrapped by f2py,
# linked against scipy_openblas32 (CMAKE_ARGS=-DSLYCOT_BUNDLE_OPENBLAS=ON triggers
# build-tools/cibw_before_build.py, which pip-installs it, copies its libs into
# build-libs/ for CMake to find, and copies both its and SLICOT's licence text into the
# project root for license-files to pick up). Our registry carries scipy_openblas32 up to
# 0.3.31.22.0; upstream's own pin (0.3.31.22.1) is one patch release newer.
name: Build slycot wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/slycot.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-slycot.yml'
      - 'docs/packages/slycot.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slycot.yml'
      - 'docs/packages/slycot.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: slycot
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build slycot ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "slycot"
      version: "${{ matrix.version }}"
      repository: "python-control/Slycot"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "CMAKE_ARGS='-DSLYCOT_BUNDLE_OPENBLAS=ON'"
      cibw-before-build: "python {project}/build-tools/cibw_before_build.py 0.3.31.22.0 {project}"
      cibw-repair-wheel-command-linux: "LD_LIBRARY_PATH=./build-libs auditwheel repair -w {dest_dir} {wheel}"
      cibw-test-extras: "test"
      cibw-test-command: "pytest --pyargs slycot"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SLYCOT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: slycot-${{ env.SLYCOT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("slycot/") and n.endswith(".so") for n in names), names
              licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert "LICENSE-SLICOT.txt" in licences, licences
              print(whl, "ok", licences)
          EOF

  publish:
    name: Publish slycot ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: slycot-${{ matrix.version }}-*-manylinux_riscv64
