---
# This workflow is based on: https://git.ligo.org/computing/software/igwn-ligolw/-/blob/v2.1.1/.gitlab/ci/wheels.yml
name: Build igwn-ligolw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/igwn-ligolw.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-ligolw.yml'
      - 'docs/packages/igwn-ligolw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-ligolw.yml'
      - 'docs/packages/igwn-ligolw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: igwn-ligolw
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      IGWN_LIGOLW_VERSION: ${{ matrix.version }}

    steps:
      # The repo lives on git.ligo.org, not GitHub, so actions/checkout can't
      # reach it.
      - name: Checkout igwn-ligolw v${{ env.IGWN_LIGOLW_VERSION }}
        run: |
          git clone --depth 1 --branch "v${{ env.IGWN_LIGOLW_VERSION }}" \
            https://git.ligo.org/computing/software/igwn-ligolw.git igwn-ligolw-src

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        working-directory: igwn-ligolw-src
        run: |
          uv pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: igwn-ligolw-${{ env.IGWN_LIGOLW_VERSION }}-sdist
          path: igwn-ligolw-src/dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build igwn-ligolw ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      IGWN_LIGOLW_VERSION: ${{ matrix.version }}

    steps:
      - name: fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: igwn-ligolw-${{ env.IGWN_LIGOLW_VERSION }}-sdist

      - id: sdist_path
        run: echo "path=$(echo "${{ steps.fetch_sdist.outputs.download-path }}"/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          # cibuildwheel accepts an sdist tarball directly and extracts it.
          package-dir: ${{ steps.sdist_path.outputs.path }}
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest pytest-benchmark pytest-doctestplus
          CIBW_TEST_SOURCES: test
          # test_dtt needs lalsuite's LIGOTimeGPS type, which has no riscv64
          # build anywhere; the rest of the suite (and the tokenizer C
          # extension it covers) needs no optional dependency.
          CIBW_TEST_COMMAND: pytest test --deselect test/test_array.py::test_dtt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: igwn-ligolw-${{ env.IGWN_LIGOLW_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish igwn-ligolw ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: igwn-ligolw-${{ matrix.version }}-*riscv64
