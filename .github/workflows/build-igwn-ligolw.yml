---
# This workflow is based on: https://git.ligo.org/computing/software/igwn-ligolw/-/blob/v2.1.1/.gitlab/ci/wheels.yml
name: Build igwn-ligolw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/igwn-ligolw.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-ligolw.yml'
      - 'docs/packages/igwn-ligolw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-ligolw.yml'
      - 'docs/packages/igwn-ligolw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: igwn-ligolw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build igwn-ligolw ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The reusable workflow downloads and extracts the self-contained PyPI sdist.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: igwn-ligolw
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy has no riscv64 wheel on public PyPI.
      cibw-environment-linux: PIP_ONLY_BINARY=numpy
      cibw-test-requires: pytest pytest-benchmark pytest-doctestplus
      cibw-test-sources: test
      # test_dtt needs lalsuite's LIGOTimeGPS type, which has no riscv64
      # build anywhere; the rest of the suite (and the tokenizer C
      # extension it covers) needs no optional dependency.
      cibw-test-command: pytest test --deselect test/test_array.py::test_dtt

  publish:
    name: Publish igwn-ligolw ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: igwn-ligolw-${{ matrix.version }}-*riscv64
