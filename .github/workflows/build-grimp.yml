---
# This workflow is based on: https://github.com/python-grimp/grimp/blob/v3.15/.github/workflows/release.yml
name: Build grimp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/grimp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-grimp.yml'
      - 'docs/packages/grimp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-grimp.yml'
      - 'docs/packages/grimp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: grimp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build grimp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream tags a release some time after publishing it to PyPI: 3.18 is on PyPI
    # (its sdist is identical to the head of upstream's release-v3.18 branch, this
    # commit) but there is no v3.18 tag yet. Pin that commit for it; drop the entry
    # once the tag exists.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "grimp"
      version: "${{ matrix.version }}"
      repository: "python-grimp/grimp"
      ref: "${{ matrix.version == '3.18' && 'c019ec78ecad8990989464cf7eab8ec23d4775ab' || format('v{0}', matrix.version) }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # grimp ships no [tool.cibuildwheel], so the Rust toolchain its maturin
      # backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # PIP_EXTRA_INDEX_URL resolves the riscv64 PyYAML wheel from our registry
      # (PyYAML ships no py3-none-any wheel).
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Upstream's `just test-python` is `pytest --benchmark-skip` against the
      # dev dependency group; the pinned third-party packages are the ones its
      # snapshot tests build graphs from, so their versions are load-bearing.
      cibw-test-requires: >
        pytest pytest-benchmark syrupy pyyaml
        Django==4.2.17 flask==3.0.3 requests==2.32.3 sqlalchemy==2.0.35
        google-cloud-audit-log==0.3.0
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest --benchmark-skip"

  publish:
    name: Publish grimp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: grimp-${{ matrix.version }}-*-manylinux_riscv64
