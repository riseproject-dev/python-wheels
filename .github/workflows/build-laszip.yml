---
# This workflow is based on the `wheels` job of
# https://github.com/tmontaigu/laszip-python/blob/0.3.0/.github/workflows/build.yml
name: Build laszip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/laszip.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-laszip.yml'
      - 'docs/packages/laszip.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-laszip.yml'
      - 'docs/packages/laszip.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: laszip
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build laszip ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The vendored LASzip (Apache-2.0) sources live under src/vendor/ rather than
    # at the project root, so scikit-build-core's default LICEN[CS]E* glob misses
    # it; stage a copy at the root for the glob to pick up (gotcha 32/44).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "laszip"
      version: "${{ matrix.version }}"
      repository: "tmontaigu/laszip-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: "cp src/vendor/LASzip-*/COPYING.txt LICENSE.laszip-core"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
      # and pybind11's headers need pip to resolve.
      # laszip/__init__.py is a pure-Python `from .laszip_core import *` shim;
      # probe the compiled extension module directly (gotcha 56).
      cibw-test-command: >
        python -c "import laszip.laszip_core as m; assert m.__file__.endswith('.so'), m.__file__; import laszip; laszip.LasZipHeader(); laszip.LasZipDll()"

  publish:
    name: Publish laszip ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: laszip-${{ matrix.version }}-*-manylinux_riscv64
