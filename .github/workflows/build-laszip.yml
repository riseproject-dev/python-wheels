---
# This workflow is based on the `wheels` job of
# https://github.com/tmontaigu/laszip-python/blob/0.3.0/.github/workflows/build.yml
name: Build laszip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/laszip.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-laszip.yml'
      - 'docs/packages/laszip.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-laszip.yml'
      - 'docs/packages/laszip.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: laszip
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build laszip ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      LASZIP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout laszip-python ${{ env.LASZIP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tmontaigu/laszip-python
          ref: ${{ env.LASZIP_VERSION }}
          persist-credentials: false

      # The vendored LASzip (Apache-2.0) sources live under src/vendor/ rather than
      # at the project root, so scikit-build-core's default LICEN[CS]E* glob misses
      # it; stage a copy at the root for the glob to pick up (gotcha 32/44).
      - name: Stage the vendored LASzip licence
        run: cp src/vendor/LASzip-*/COPYING.txt LICENSE.laszip-core

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH,
          # and pybind11's headers need pip to resolve.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # laszip/__init__.py is a pure-Python `from .laszip_core import *` shim;
          # probe the compiled extension module directly (gotcha 56).
          CIBW_TEST_COMMAND: >-
            python -c "import laszip.laszip_core as m; assert m.__file__.endswith('.so'), m.__file__; import laszip; laszip.LasZipHeader(); laszip.LasZipDll()"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: laszip-${{ env.LASZIP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish laszip ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: laszip-${{ matrix.version }}-*-manylinux_riscv64
