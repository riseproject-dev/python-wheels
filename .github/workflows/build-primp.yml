---
# This workflow is based on the `linux` job of
# https://github.com/deedy5/primp/blob/v1.3.1/.github/workflows/ci.yml
name: Build primp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/primp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-primp.yml'
      - 'docs/packages/primp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-primp.yml'
      - 'docs/packages/primp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: primp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build primp ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          # cp313t is dropped: the riscv64 manylinux image ships no cp313t.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this workspace is crates/primp-python/ -- so upstream's published
    # wheels carry no licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "primp"
      version: "${{ matrix.version }}"
      repository: "deedy5/primp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: "cp LICENSE crates/primp-python/"
      cibw-package-dir: "crates/primp-python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # primp ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "pytest pytest-asyncio certifi"
      cibw-test-sources: >
        crates/primp-python/tests
        crates/primp-python/pyproject.toml
      # `internet` marks two tests that assert TLS fingerprints returned by
      # an external service.
      cibw-test-command: >
        cd crates/primp-python &&
        python -c "import primp.primp as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('primp'))" &&
        python -m pytest -v -m "not internet"

  publish:
    name: Publish primp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: primp-${{ matrix.version }}-*-manylinux_riscv64
