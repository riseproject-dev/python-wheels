---
# Based on the `U22_SH_Py_CI` job of
# https://github.com/realsenseai/librealsense/blob/v2.58.4/.github/workflows/buildsCI.yaml
# and wrappers/python/build_wheel.py
name: Build pyrealsense2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrealsense2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrealsense2.yml'
      - 'docs/packages/pyrealsense2.yaml'
      - 'patches/pyrealsense2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrealsense2.yml'
      - 'docs/packages/pyrealsense2.yaml'
      - 'patches/pyrealsense2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrealsense2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyrealsense2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyrealsense2"
      version: "${{ matrix.version }}"
      repository: "realsenseai/librealsense"
      ref: ''
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        export PYREALSENSE2_VERSION='${{ matrix.version }}'
        ref="v${PYREALSENSE2_VERSION%.*}"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyrealsense2/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        sed -i -E "s/^(#define RS2_API_BUILD_VERSION[[:space:]]+)0$/\1${PYREALSENSE2_VERSION##*.}/" include/librealsense2/rs.h
        grep -q "RS2_API_BUILD_VERSION *${PYREALSENSE2_VERSION##*.}$" include/librealsense2/rs.h
        echo "__version__ = \"${PYREALSENSE2_VERSION}\"" > wrappers/python/pyrealsense2/_version.py
        cp LICENSE NOTICE.md wrappers/python/

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-licenses.sh <<'COLLECT_EOF'
        #!/bin/bash
        # SPDX-FileCopyrightText: 2026 The RISE Project
        # SPDX-License-Identifier: MIT
        #
        # Stage, in the wheel's project dir, the licence of every shared library
        # auditwheel vendors out of the build image alongside libusb/libudev.
        # hatchling's default LICEN[CS]E* glob copies them into the wheel.
        set -euo pipefail

        project="${1:?usage: collect-licenses.sh <project-dir>}"

        # ldd is transitive, so the two linked libs alone cover their whole
        # closure; ldd does not list the root itself, so resolve those too.
        mapfile -t libs < <(
            {
                ldd /usr/lib64/libusb-1.0.so | tr ' ' '\n' | grep '^/'
                readlink -f /usr/lib64/libusb-1.0.so
                ldd /usr/lib64/libudev.so | tr ' ' '\n' | grep '^/'
                readlink -f /usr/lib64/libudev.so
            } | sort -u
        )

        # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
        # glibc and the gcc runtime are on auditwheel's manylinux allowlist and
        # are never vendored into the wheel.
        mapfile -t pkgs < <(
            rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                grep -E '^[A-Za-z0-9._+-]+$' | sort -u |
                grep -vE '^(glibc|libgcc|libstdc\+\+|gcc)$'
        )

        for pkg in "${pkgs[@]}"; do
            mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

            # Some subpackages leave the licence to a sibling of the same source RPM.
            if [ -z "${files[0]:-}" ]; then
                srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                mapfile -t files < <(
                    rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                        awk -v s="$srpm" '$1 == s { print $2 }' |
                        xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                )
            fi

            # Others mark it %doc rather than %license, and the image installs no docs.
            if [ -z "${files[0]:-}" ]; then
                dnf -y --disablerepo=extras reinstall --setopt=tsflags= "$pkg" >/dev/null
                mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
            fi

            for f in "${files[@]}"; do
                [ -f "$f" ] || continue
                cp "$f" "$project/LICENSE.${pkg}.$(basename "$f")"
            done
            compgen -G "$project/LICENSE.$pkg.*" >/dev/null ||
                { echo "no licence file found for $pkg" >&2; exit 1; }
        done

        ls -1 "$project"/LICENSE.* | sed "s|$project/||"
        COLLECT_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "wrappers/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,opencv-python-headless,zstandard"
      # libudev-devel doesn't exist on Rocky 10; systemd-devel provides libudev.so/libudev.h instead (gotcha 252)
      cibw-before-all-linux: "dnf install -y libusb1-devel systemd-devel && bash {project}/collect-licenses.sh {project}/wrappers/python"
      # ENABLE_STATS (new in 2.59, default ON) builds a static libcurl that needs OpenSSL headers the image lacks
      cibw-before-build-linux: "cmake -S {project} -B {project}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=false -DBUILD_EXAMPLES=false -DBUILD_GRAPHICAL_EXAMPLES=false -DBUILD_TOOLS=false -DBUILD_UNIT_TESTS=false -DCHECK_FOR_UPDATES=false -DENABLE_STATS=false -DBUILD_WITH_DDS=false -DBUILD_PYTHON_BINDINGS=true -DPYTHON_EXECUTABLE=$(which python) -DPython_EXECUTABLE=$(which python) && cmake --build {project}/build -- -j$(nproc) && cp -L {project}/build/Release/pyrealsense2.cpython-*.so {project}/build/Release/pyrsutils.cpython-*.so {project}/wrappers/python/pyrealsense2/"
      cibw-test-requires: "pytest pytest-timeout pytest-rerunfailures pytest-repeat pytest-check numpy opencv-python-headless zstandard"
      cibw-test-sources: "unit-tests"
      # upstream's --not-live pytest run, minus the files that read recordings or binaries from a CMake build tree
      cibw-test-command: "python -m pytest unit-tests/log unit-tests/sw-dev unit-tests/syncer unit-tests/post-processing --color=no --not-live --context linux -p no:cacheprovider --ignore=unit-tests/log/pytest-env-log-level-off.py --ignore=unit-tests/log/pytest-env-log-level-on.py --ignore=unit-tests/post-processing/pytest-filters.py --ignore=unit-tests/post-processing/pytest-post-processing-from-bag.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYREALSENSE2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyrealsense2-${{ env.PYREALSENSE2_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships both compiled extensions and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if ".so" in n)
          print("\n".join(sos))
          assert any(n.startswith("pyrealsense2/pyrealsense2.cpython-") for n in sos), sos
          assert any(n.startswith("pyrealsense2/pyrsutils.cpython-") for n in sos), sos

          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          assert {"LICENSE", "NOTICE.md"} <= set(lic), lic
          expected_pkgs = {"libcap", "libusb1", "systemd-libs"}
          have_pkgs = {f.split(".", 2)[1] for f in lic if f.startswith("LICENSE.")}
          assert expected_pkgs <= have_pkgs, expected_pkgs - have_pkgs
          EOF

  gpl_sources:
    name: Collect GPL sources for pyrealsense2 ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: pyrealsense2
      version: ${{ matrix.version }}
      # libcap/libusb1/systemd-libs are the copyleft (LGPL) libraries auditwheel vendors
      # out of the build image alongside libusb/libudev.
      packages: gcc libcap libusb1 systemd-libs

  publish:
    name: Publish pyrealsense2 ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyrealsense2-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pyrealsense2-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc and the copyleft libraries bundled in the wheel
