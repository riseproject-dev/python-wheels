---
# Based on upstream's wheel builder:
#   https://github.com/DataDog/dd-trace-py/blob/v4.13.1/.github/workflows/build_python_3.yml
name: Build ddtrace wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ddtrace.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ddtrace.yml'
      - 'docs/packages/ddtrace.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ddtrace.yml'
      - 'docs/packages/ddtrace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # setup.py's LIBDDWAF_VERSION. Upstream downloads a prebuilt libddwaf, which
  # is published for aarch64/x86_64 only, so riscv64 compiles it from source.
  LIBDDWAF_VERSION: '2.0.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ddtrace
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ddtrace ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ddtrace"
      version: "${{ matrix.version }}"
      repository: "DataDog/dd-trace-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 720
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/ddtrace/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PATH=$PATH:$HOME/.cargo/bin"
      # setup.py drops libddwaf into the wheel from
      # ddtrace/appsec/_ddwaf/libddwaf/<arch>/lib/ and skips the download
      # when that tree already exists, so building it here is enough.
      cibw-before-all-linux: |-
        set -euxo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        dnf -y install libstdc++-static # libddwaf links -static-libstdc++
        git clone --depth 1 --branch "2.0.0" \
        https://github.com/DataDog/libddwaf.git /tmp/libddwaf
        cmake -S /tmp/libddwaf -B /tmp/libddwaf/build \
        -DCMAKE_BUILD_TYPE=RelWithDebInfo \
        -DLIBDDWAF_BUILD_STATIC=OFF -DLIBDDWAF_TESTING=OFF
        cmake --build /tmp/libddwaf/build --parallel "$(nproc)"
        cmake --install /tmp/libddwaf/build --prefix /tmp/libddwaf/install
        install -D /tmp/libddwaf/install/lib*/libddwaf.so \
        {project}/ddtrace/appsec/_ddwaf/libddwaf/riscv64/lib/libddwaf.so
      # setup.py drives CMake through the `cmake` PyPI package, whose oldest
      # riscv64 wheel is 4.1.0 - outside pyproject.toml's `cmake<3.28` pin,
      # hence the preinstall and pip's unvalidated --no-build-isolation.
      cibw-before-build: "pip install cython \"cmake>=4.1\" \"setuptools-rust<2\" \"patchelf>=0.17.0.0\" setuptools wheel"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-command: "python {project}/tests/smoke_test.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DDTRACE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ddtrace-${{ env.DDTRACE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the native extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".so")]
              assert "ddtrace/appsec/_ddwaf/libddwaf/riscv64/lib/libddwaf.so" in names, whl
              assert len(names) > 15, (whl, names)
              print(whl, len(names), "shared objects")
          EOF

  publish:
    name: Publish ddtrace ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ddtrace-${{ matrix.version }}-*-manylinux_riscv64
