---
# Based on the `build_wheels` job of
# https://github.com/esphome/aioesphomeapi/blob/v46.2.1/.github/workflows/release.yml
name: Build aioesphomeapi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aioesphomeapi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aioesphomeapi.yml'
      - 'docs/packages/aioesphomeapi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aioesphomeapi.yml'
      - 'docs/packages/aioesphomeapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aioesphomeapi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aioesphomeapi ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: aioesphomeapi
      version: ${{ matrix.version }}
      # Upstream pushed no v46.12.1 tag; its "Bump version to 46.12.1" commit is
      # what PyPI's 46.12.1 was released from.
      repository: esphome/aioesphomeapi
      ref: ${{ matrix.version == '46.12.1' && '8d86534f49089f9bd80d50884be012c119700273' || format('v{0}', matrix.version) }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Only manylinux: cryptography, a hard runtime dependency, has no musl
      # riscv64 wheel, so a musllinux wheel could be neither installed nor tested.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream passes REQUIRE_CYTHON as a plain step env var, which never
      # reaches the Linux build container. only-binary keeps pip off the
      # sdists of the compiled dependencies, whose riscv64 wheels are ours.
      cibw-environment-linux: "REQUIRE_CYTHON=1 PIP_ONLY_BINARY=cffi,cryptography,protobuf,zeroconf"
      cibw-test-sources: tests pyproject.toml
      cibw-test-requires: 'pytest>=9.1.1,<10 pytest-asyncio==1.4.0'
      # setup.py's build_ext swallows every compile error, so the extensions
      # are only proven by the modules the installed wheel actually loads.
      cibw-test-command: >-
        python -c "from aioesphomeapi import _sanitize, client_base, connection;
        from aioesphomeapi._frame_helper import base, noise, noise_encryption, pack, packets, plain_text;
        m = [_sanitize, client_base, connection, base, noise, noise_encryption, pack, packets, plain_text];
        bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
        assert not bad, bad" &&
        python -m pytest --ignore=tests/benchmarks tests
      timeout-minutes: 120

  publish:
    name: Publish aioesphomeapi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aioesphomeapi-${{ matrix.version }}-*-manylinux_riscv64
