---
# Based on upstream's own wheel build:
#   https://github.com/VirusTotal/yara-python/blob/v4.5.4/.github/workflows/publish-to-pypi.yml
name: Build yara-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'yara-python version/tag to build (git tag without leading v, e.g. 4.5.4)'
        required: true
        default: '4.5.4'
  pull_request:
    paths:
      - '.github/workflows/build-yara-python.yml'
      - 'patches/yara-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '4.5.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  YARA_PYTHON_VERSION: ${{ inputs.version || '4.5.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build yara-python ${{ inputs.version || '4.5.4' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout yara-python v${{ env.YARA_PYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: VirusTotal/yara-python
          ref: v${{ env.YARA_PYTHON_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The extension compiles the vendored yara/ submodule straight into the .so and
      # dynamically links libcrypto for the hash module, but ships only its own LICENSE.
      - name: Patch yara-python source
        run: |
          git apply python-wheels/patches/yara-python/${{ env.YARA_PYTHON_VERSION }}/00*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Rocky 10 and Alpine both carry a current openssl-dev(el); skip upstream's
          # from-source OpenSSL 1.1.1w build, which the images don't need.
          CIBW_BEFORE_ALL_LINUX: |
            if command -v dnf > /dev/null; then
              dnf install -y openssl-devel
            elif command -v apk > /dev/null; then
              apk add openssl-dev
            fi
          CIBW_BUILD_FRONTEND: "build; args: --config-setting=--enable-openssl"
          CIBW_TEST_COMMAND: python {package}/tests.py

      - name: Check the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("yara.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: yara-python-${{ env.YARA_PYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish yara-python ${{ inputs.version || '4.5.4' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: yara-python-${{ inputs.version || '4.5.4' }}-*riscv64
