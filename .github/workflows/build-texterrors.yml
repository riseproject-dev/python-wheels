---
# Based on the build_wheels and test-wheels jobs of
# https://github.com/RuABraun/texterrors/blob/v1.1.8/.github/workflows/publish-to-pypi.yaml
name: Build texterrors wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/texterrors.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-texterrors.yml'
      - 'docs/packages/texterrors.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-texterrors.yml'
      - 'docs/packages/texterrors.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: texterrors
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build texterrors ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No musllinux: numpy and Levenshtein have no musllinux riscv64 wheel.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      TEXTERRORS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout texterrors v${{ env.TEXTERRORS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RuABraun/texterrors
          ref: v${{ env.TEXTERRORS_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream's test-wheels job runs `pytest -v .` from the checkout after installing the wheel.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests pytest.ini
          CIBW_TEST_COMMAND: pytest -v .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: texterrors-${{ env.TEXTERRORS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish texterrors ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: texterrors-${{ matrix.version }}-*-manylinux_riscv64
