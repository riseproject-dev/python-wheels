---
# This workflow is based on: https://github.com/zopefoundation/persistent/blob/6.8/.github/workflows/tests.yml
name: Build persistent wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/persistent.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-persistent.yml'
      - 'docs/packages/persistent.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-persistent.yml'
      - 'docs/packages/persistent.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: persistent
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build persistent ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PERSISTENT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout persistent ${{ env.PERSISTENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zopefoundation/persistent
          ref: ${{ env.PERSISTENT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi and zope.interface, needed to build and to import the extension,
          # have no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_ENVIRONMENT: ZOPE_INTERFACE_STRICT_IRO=1
          # Upstream's two test steps (with and without the C extensions).
          # setup.py swallows extension build failures (optional_build_ext), so
          # PURE_PYTHON=0 — which makes the C import mandatory at runtime — is
          # what proves the wheel is not pure Python. test_docs walks up from
          # the installed (not checked-out) module to find docs/api/*.rst,
          # which the wheel doesn't ship, so it is excluded.
          CIBW_TEST_COMMAND: >-
            PURE_PYTHON=0 python -m zope.testrunner --test-path={package}/src -m '!test_docs' &&
            PURE_PYTHON=1 python -m zope.testrunner --test-path={package}/src -m '!test_docs'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: persistent-${{ env.PERSISTENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish persistent ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: persistent-${{ matrix.version }}-*-manylinux_riscv64
