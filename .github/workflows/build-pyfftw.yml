---
# This workflow is based on the build_linux_wheels job of
# https://github.com/pyFFTW/pyFFTW/blob/v0.15.1/.github/workflows/wheel_tests_and_release.yml
name: Build pyfftw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyfftw.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfftw.yml'
      - 'docs/packages/pyfftw.yaml'
      - 'patches/pyfftw/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfftw.yml'
      - 'docs/packages/pyfftw.yaml'
      - 'patches/pyfftw/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyfftw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyfftw ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyfftw"
      version: "${{ matrix.version }}"
      repository: "pyFFTW/pyFFTW"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyfftw/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's before-all, plus the notice for the libfftw3* that
      # auditwheel vendors (upstream's wheels ship none).
      cibw-before-all-linux: "yum install -y fftw-devel && cp /usr/share/licenses/fftw-libs-double/COPYING {project}/LICENSE.fftw"
      cibw-environment-linux: "PIP_PREFER_BINARY=true PIP_ONLY_BINARY=numpy,scipy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYFFTW=${{ matrix.version }}"
      # These 21 tests hardcode x86 SSE/AVX alignment (16/32 bytes, /proc/cpuinfo
      # "flags"); upstream skips all aarch64 tests for the same 21 (pyFFTW/pyFFTW#326).
      cibw-test-command: "pytest --import-mode=append {project} -k \"not (BuildersTest and test_auto_align_input) and not test_aligned_flag and not test_flags and not test_get_alignment and not (test_alignment and not LongDouble)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYFFTW_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyfftw-${{ env.PYFFTW_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel vendors FFTW and ships its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              libs = {n.split("/")[1].split("-")[0] for n in names if n.startswith("pyfftw.libs/")}
              assert {"libfftw3", "libfftw3f", "libfftw3l", "libfftw3_omp"} <= libs, (whl, libs)
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE.txt", "LICENSE.fftw"}, (whl, licences)
              print(whl, "ok", sorted(libs))
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      PYFFTW_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # auditwheel vendors libfftw3* (GPL-2.0-or-later) and the -fopenmp libgomp.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc fftw
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyfftw-${{ env.PYFFTW_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pyfftw ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyfftw-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pyfftw-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc, fftw
