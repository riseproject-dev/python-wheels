---
# This workflow is based on the `linux` job of
# https://github.com/pykeio/earshot/blob/1.2.2/.github/workflows/publish-python.yml
# and the test of
# https://github.com/pykeio/earshot/blob/1.2.2/.github/workflows/test-python.yml
name: Build earshot wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/earshot.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-earshot.yml'
      - 'docs/packages/earshot.yaml'
      - 'patches/earshot/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-earshot.yml'
      - 'docs/packages/earshot.yaml'
      - 'patches/earshot/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: earshot
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build earshot ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # bindings/py/Cargo.toml hardcodes pyo3's abi3-py38 feature; the riscv64
          # image has no cp38, so patches/ bumps it to abi3-py39.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      EARSHOT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout earshot ${{ env.EARSHOT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pykeio/earshot
          ref: ${{ env.EARSHOT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch earshot source
        run: git apply python-wheels/patches/earshot/${{ env.EARSHOT_VERSION }}/00*.patch

      - name: Stage licences beside bindings/py's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory, so
        # upstream's published wheel carries no licence text at all.
        run: cp LICENSE-MIT LICENSE-APACHE bindings/py/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: bindings/py
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: numpy, imported by the extension, has no
          # musllinux riscv64 wheel to test against.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy
          CIBW_TEST_COMMAND: >-
            python -c "
            import earshot, numpy as np;
            from earshot import Detector;
            assert earshot._earshot.__file__.endswith('.so'), earshot._earshot.__file__;
            d = Detector();
            score = d.predict_i16([0] * 256);
            assert 0.0 <= score <= 1.0;
            t = np.arange(256) / 16000.0;
            score = d.predict_f32((0.5 * np.sin(2 * np.pi * 220 * t)).astype(np.float32));
            assert 0.0 <= score <= 1.0;
            print('earshot smoke test OK')
            "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: earshot-${{ env.EARSHOT_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish earshot ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: earshot-${{ matrix.version }}-*-manylinux_riscv64
