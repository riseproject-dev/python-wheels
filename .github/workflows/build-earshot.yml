---
# This workflow is based on the `linux` job of
# https://github.com/pykeio/earshot/blob/1.2.2/.github/workflows/publish-python.yml
# and the test of
# https://github.com/pykeio/earshot/blob/1.2.2/.github/workflows/test-python.yml
name: Build earshot wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/earshot.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-earshot.yml'
      - 'docs/packages/earshot.yaml'
      - 'patches/earshot/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-earshot.yml'
      - 'docs/packages/earshot.yaml'
      - 'patches/earshot/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: earshot
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build earshot ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # bindings/py/Cargo.toml hardcodes pyo3's abi3-py38 feature; the riscv64
          # image has no cp38, so patches/ bumps it to abi3-py39.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "earshot"
      version: "${{ matrix.version }}"
      repository: "pykeio/earshot"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"

      patches: true
      pre-build: |-
        # maturin globs LICEN[CS]E* relative to the pyproject directory, so
        # upstream's published wheel carries no licence text at all.
        cp LICENSE-MIT LICENSE-APACHE bindings/py/

      cibw-package-dir: "bindings/py"
      # musllinux is dropped: numpy, imported by the extension, has no
      # musllinux riscv64 wheel to test against.
      cibw-build: "${{ matrix.build }}"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: "python -c \" import earshot, numpy as np; from earshot import Detector; assert earshot._earshot.__file__.endswith('.so'), earshot._earshot.__file__; d = Detector(); score = d.predict_i16([0] * 256); assert 0.0 <= score <= 1.0; t = np.arange(256) / 16000.0; score = d.predict_f32((0.5 * np.sin(2 * np.pi * 220 * t)).astype(np.float32)); assert 0.0 <= score <= 1.0; print('earshot smoke test OK') \""

  publish:
    name: Publish earshot ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: earshot-${{ matrix.version }}-*-manylinux_riscv64
