---
# This workflow is based on: https://github.com/sass/libsass-python/blob/0.23.0/.github/workflows/main.yml
name: Build libsass wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'libsass version to build (git tag, e.g. 0.23.0)'
        required: true
        default: '0.23.0'
  pull_request:
    paths:
      - '.github/workflows/build-libsass.yml'
      - 'patches/libsass/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.23.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LIBSASS_VERSION: ${{ inputs.version || '0.23.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build libsass ${{ inputs.version || '0.23.0' }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60

    steps:
      - name: Checkout libsass-python v${{ env.LIBSASS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sass/libsass-python
          ref: ${{ env.LIBSASS_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # setup.cfg's `license_files = LICENSE` is an explicit list, which turns off
      # setuptools' default glob (gotcha 57); the vendored libsass submodule (compiled
      # straight into the extension) carries its own separate MIT licence (gotcha 32).
      - name: Stage the libsass licence
        run: |
          cp libsass/LICENSE LICENSE.libsass
          sed -i '/^license_files = LICENSE$/a\    LICENSE.libsass' setup.cfg

      - name: Patch libsass-python source
        run: git apply python-wheels/patches/libsass/${{ env.LIBSASS_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # setup.py's bdist_wheel override sets py_limited_api to the building
          # interpreter's own version, so cp312 (our floor) becomes the abi3 tag;
          # the later entries build nothing, they just re-test the one wheel.
          # cp314t is skipped: setup.py forces py_limited_api unconditionally for
          # CPython with no Py_GIL_DISABLED guard, same shape upstream's own zopfli
          # sibling hits (build-zopfli.yml) - free-threaded builds don't support abi3.
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # sassutils/wsgi.py imports pkg_resources, which setuptools 82 deleted
          # outright (gotcha 29); pin below that floor for the test env only.
          CIBW_TEST_REQUIRES: pytest werkzeug>=0.9 setuptools<82
          # sasstests.py opens fixtures ("test/a.scss") relative to the process cwd,
          # not __file__; cibuildwheel runs test-command from an empty temp dir, so
          # stage the file plus its fixture dirs there and run against them, leaving
          # sass.py/sassutils unstaged so the import resolves to the installed wheel
          # (gotcha 36).
          CIBW_TEST_SOURCES: sasstests.py test testpkg
          CIBW_TEST_COMMAND: pytest sasstests.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: libsass-${{ env.LIBSASS_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish libsass ${{ inputs.version || '0.23.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: libsass-${{ inputs.version || '0.23.0' }}-*-manylinux_riscv64
