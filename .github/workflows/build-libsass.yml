---
# This workflow is based on: https://github.com/sass/libsass-python/blob/0.23.0/.github/workflows/main.yml
name: Build libsass wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libsass.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libsass.yml'
      - 'docs/packages/libsass.yaml'
      - 'patches/libsass/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libsass.yml'
      - 'docs/packages/libsass.yaml'
      - 'patches/libsass/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libsass
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build libsass ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "libsass"
      version: "${{ matrix.version }}"
      repository: "sass/libsass-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      checkout-submodules: "true"

      patches: true
      pre-build: |-
        # setup.cfg's `license_files = LICENSE` is an explicit list, which turns off
        # setuptools' default glob (gotcha 57); the vendored libsass submodule (compiled
        # straight into the extension) carries its own separate MIT licence (gotcha 32).
        cp libsass/LICENSE LICENSE.libsass
        sed -i '/^license_files = LICENSE$/a\    LICENSE.libsass' setup.cfg

      # setup.py's bdist_wheel override sets py_limited_api to the building
      # interpreter's own version, so cp312 (our floor) becomes the abi3 tag;
      # the later entries build nothing, they just re-test the one wheel.
      # cp314t is skipped: setup.py forces py_limited_api unconditionally for
      # CPython with no Py_GIL_DISABLED guard, same shape upstream's own zopfli
      # sibling hits (build-zopfli.yml) - free-threaded builds don't support abi3.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # sassutils/wsgi.py imports pkg_resources, which setuptools 82 deleted
      # outright (gotcha 29); pin below that floor for the test env only.
      cibw-test-requires: "pytest werkzeug>=0.9 setuptools<82"
      # sasstests.py opens fixtures ("test/a.scss") relative to the process cwd,
      # not __file__; cibuildwheel runs test-command from an empty temp dir, so
      # stage the file plus its fixture dirs there and run against them, leaving
      # sass.py/sassutils unstaged so the import resolves to the installed wheel
      # (gotcha 36).
      cibw-test-sources: "sasstests.py test testpkg"
      cibw-test-command: "pytest sasstests.py -v"

  publish:
    name: Publish libsass ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libsass-${{ matrix.version }}-*-manylinux_riscv64
