---
# Based on upstream's own wheel workflow:
#   https://github.com/cgohlke/transformations/blob/v2026.8.8/.github/workflows/wheel.yml
name: Build transformations wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/transformations.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-transformations.yml'
      - 'docs/packages/transformations.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-transformations.yml'
      - 'docs/packages/transformations.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: transformations
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build transformations ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp314t"]
        # Upstream's CIBW_BUILD ("cp312-* cp314t-*"): one cp312-abi3 wheel, built on
        # its floor and retested on cp313/cp314 like upstream's 3.14 abi3 test step,
        # plus a non-abi3 free-threaded wheel.
        include:
          - python: cp312
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - python: cp314t
            build: cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: transformations
      version: ${{ matrix.version }}
      repository: cgohlke/transformations
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-manylinux_riscv64
      cibw-build: ${{ matrix.build }}
      # numpy is a build and a runtime requirement, and only our registry has
      # it for riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist.
      cibw-environment-linux: "CG_LIMITED_API=1 PIP_ONLY_BINARY=numpy"
      cibw-test-requires: numpy pytest
      cibw-test-command: python -m pytest --doctest-modules --pyargs transformations
      timeout-minutes: 60

  publish:
    name: Publish transformations ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: transformations-${{ matrix.version }}-*-manylinux_riscv64
