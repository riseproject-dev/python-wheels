---
# Based on upstream's own wheel workflow:
#   https://github.com/cgohlke/transformations/blob/v2026.8.8/.github/workflows/wheel.yml
name: Build transformations wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/transformations.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-transformations.yml'
      - 'docs/packages/transformations.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-transformations.yml'
      - 'docs/packages/transformations.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: transformations
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build transformations ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      TRANSFORMATIONS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout transformations v${{ env.TRANSFORMATIONS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cgohlke/transformations
          ref: v${{ env.TRANSFORMATIONS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # Upstream's CIBW_BUILD ("cp312-* cp314t-*"): one cp312-abi3 wheel, built on
          # its floor and retested on cp313/cp314 like upstream's 3.14 abi3 test step,
          # plus a non-abi3 free-threaded wheel per other build interpreter the
          # generated matrix picks up (e.g. cp314t, cp315t).
          CIBW_BUILD: >-
            ${{ matrix.python == 'cp312' && 'cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64'
            || format('{0}-{1}_riscv64', matrix.python, matrix.platform) }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build and a runtime requirement, and only our registry has
          # it for riscv64; only-binary keeps a newer PyPI release from winning the
          # resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            CG_LIMITED_API=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: numpy pytest
          CIBW_TEST_COMMAND: python -m pytest --doctest-modules --pyargs transformations

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: transformations-${{ env.TRANSFORMATIONS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish transformations ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: transformations-${{ matrix.version }}-*-manylinux_riscv64
