---
# This workflow is based on the `build_wheels` job of
# https://github.com/RaRe-Technologies/gensim/blob/4.4.0/.github/workflows/build-wheels.yml
name: Build gensim wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'gensim version to build (git tag, e.g. 4.4.0)'
        required: true
        default: '4.4.0'
  pull_request:
    paths:
      - '.github/workflows/build-gensim.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '4.4.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  GENSIM_VERSION: ${{ inputs.version || '4.4.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build gensim ${{ inputs.version || '4.4.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the Cython extensions link the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout gensim ${{ env.GENSIM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RaRe-Technologies/gensim
          ref: ${{ env.GENSIM_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: pytest testfixtures mock
          # Mirrors upstream's own CIBW_TEST_COMMAND (build-wheels.yml).
          CIBW_TEST_COMMAND: >-
            python -c "import gensim; print(f'gensim v{gensim.__version__}')" &&
            python -m pytest -rfxEXs --durations=20 --disable-warnings --showlocals --pyargs gensim

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gensim-${{ env.GENSIM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish gensim ${{ inputs.version || '4.4.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: gensim-${{ inputs.version || '4.4.0' }}-*-manylinux_riscv64
