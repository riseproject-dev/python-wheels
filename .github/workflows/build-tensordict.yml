---
# This workflow is based on: https://github.com/pytorch/tensordict/blob/main/.github/workflows/build-wheels-linux.yml
name: Build tensordict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tensordict.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tensordict.yml'
      - 'docs/packages/tensordict.yaml'
      - 'patches/tensordict/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tensordict.yml'
      - 'docs/packages/tensordict.yaml'
      - 'patches/tensordict/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tensordict
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tensordict ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tensordict"
      version: "${{ matrix.version }}"
      repository: "pytorch/tensordict"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cmake is a subprocess dependency of setup.py's CMakeBuild, not a
      # pyproject.toml build-system requirement, and the manylinux_riscv64
      # image ships no cmake by itself; the PyPI cmake wheel has riscv64
      # builds, so the isolated build env can provision it.
      cibw-before-build: "pip install cmake"
      # Pins a clean version instead of setuptools_scm's git-derived
      # default, which appends `+g<sha>` (setup.py's set_version()).
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      # torch/numpy/orjson have no riscv64 wheel on public PyPI; resolve
      # them from our registry instead, and never fall back to building
      # any of the three from source.
      cibw-test-environment: "PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy,torch,orjson"
      cibw-test-command: "python {project}/test/smoke_test.py"

  publish:
    name: Publish tensordict ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tensordict-${{ matrix.version }}-*-manylinux_riscv64
