---
# This workflow is based on: https://github.com/pytorch/tensordict/blob/main/.github/workflows/build-wheels-linux.yml
name: Build tensordict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tensordict version to build (git tag without leading v, e.g. 0.14.0)'
        required: true
        default: '0.14.0'
  pull_request:
    paths:
      - '.github/workflows/build-tensordict.yml'
      - 'patches/tensordict/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.14.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.14.0 there.
  TENSORDICT_VERSION: ${{ inputs.version || '0.14.0' }}

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tensordict ${{ inputs.version || '0.14.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # tensordict's own `torch` dependency has no riscv64 wheel on public PyPI
        # (only on pypi.riseproject.dev, for cp312/cp313/cp314/cp314t).
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout tensordict v${{ env.TENSORDICT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytorch/tensordict
          ref: v${{ env.TENSORDICT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch tensordict source
        run: git apply python-wheels/patches/tensordict/${{ env.TENSORDICT_VERSION }}/00*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          # cmake is a subprocess dependency of setup.py's CMakeBuild, not a
          # pyproject.toml build-system requirement, and the manylinux_riscv64
          # image ships no cmake by itself; the PyPI cmake wheel has riscv64
          # builds, so the isolated build env can provision it.
          CIBW_BEFORE_BUILD: pip install cmake
          # Pins a clean version instead of setuptools_scm's git-derived
          # default, which appends `+g<sha>` (setup.py's set_version()).
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.TENSORDICT_VERSION }}
          # torch/numpy/orjson have no riscv64 wheel on public PyPI; resolve
          # them from our registry instead, and never fall back to building
          # any of the three from source.
          CIBW_TEST_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,torch,orjson
          CIBW_TEST_COMMAND: python {project}/test/smoke_test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tensordict-${{ env.TENSORDICT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tensordict ${{ inputs.version || '0.14.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tensordict-${{ inputs.version || '0.14.0' }}-*-manylinux_riscv64
