---
# This workflow is based on the wheel job of
# https://github.com/astropy/astropy-healpix/blob/v2.0.1/.github/workflows/publish.yml,
# which calls OpenAstronomy/github-actions-workflows' publish.yml.
name: Build astropy-healpix wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/astropy-healpix.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-astropy-healpix.yml'
      - 'docs/packages/astropy-healpix.yaml'
      - 'patches/astropy-healpix/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-astropy-healpix.yml'
      - 'docs/packages/astropy-healpix.yaml'
      - 'patches/astropy-healpix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: astropy-healpix
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build astropy-healpix ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.cfg pins `[bdist_wheel] py_limited_api = cp310`, overridden here to
          # our cp312 floor via EXTENSION_HELPERS_PY_LIMITED_API; built on cp312, the
          # oldest interpreter the tag then claims, and re-tested on the newer ones.
          - tag: cp312-abi3
            wheel_tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
            limited_api: cp312
            test_skip: ''
            timeout: 90
          # pyproject.toml itself blanks EXTENSION_HELPERS_PY_LIMITED_API for cp3??t
          # builds, since free-threaded interpreters don't support the limited API.
          # Its test extras hard-require astropy, which publishes no cp314t wheel on
          # any index anywhere (checked pypi.org and pypi.riseproject.dev) -- so the
          # wheel is built and shipped like upstream's, but untested (gotcha 149).
          - tag: cp314t
            wheel_tag: cp314-cp314t
            build: cp314t-manylinux_riscv64
            limited_api: ''
            test_skip: '*'
            timeout: 45

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "astropy-healpix"
      version: "${{ matrix.version }}"
      repository: "astropy/astropy-healpix"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: "${{ matrix.timeout }}"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/astropy-healpix/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.build }}"
      cibw-test-skip: "${{ matrix.test_skip }}"
      # numpy is a build and a runtime requirement, and only our registry has
      # it for riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy EXTENSION_HELPERS_PY_LIMITED_API=${{ matrix.limited_api }} SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ASTROPY_HEALPIX=${{ matrix.version }}"
      cibw-test-extras: "test"
      cibw-test-command: "pytest --pyargs astropy_healpix"
      # astropy (a hard runtime+test dependency) and hypothesis (a test
      # dependency) both only have riscv64 wheels on our registry, at specific
      # versions; only-binary stops pip resolving a newer PyPI release with no
      # riscv64 wheel anywhere and building it from sdist (gotcha 210 -- for
      # hypothesis that sdist build needs a Rust toolchain rustup won't target).
      cibw-test-environment: "PIP_ONLY_BINARY=astropy,hypothesis"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.cfg pins `[bdist_wheel] py_limited_api = cp310`, overridden here to
          # our cp312 floor via EXTENSION_HELPERS_PY_LIMITED_API; built on cp312, the
          # oldest interpreter the tag then claims, and re-tested on the newer ones.
          - tag: cp312-abi3
            wheel_tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
            limited_api: cp312
            test_skip: ''
            timeout: 90
          # pyproject.toml itself blanks EXTENSION_HELPERS_PY_LIMITED_API for cp3??t
          # builds, since free-threaded interpreters don't support the limited API.
          # Its test extras hard-require astropy, which publishes no cp314t wheel on
          # any index anywhere (checked pypi.org and pypi.riseproject.dev) -- so the
          # wheel is built and shipped like upstream's, but untested (gotcha 149).
          - tag: cp314t
            wheel_tag: cp314-cp314t
            build: cp314t-manylinux_riscv64
            limited_api: ''
            test_skip: '*'
            timeout: 45
    env:
      ASTROPY_HEALPIX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: astropy-healpix-${{ env.ASTROPY_HEALPIX_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-${{ matrix.wheel_tag }}-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {"_core", "compiler_version"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.md"}, licences
          EOF

  publish:
    name: Publish astropy-healpix ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: astropy-healpix-${{ matrix.version }}-*-manylinux_riscv64
