---
# This workflow is based on the wheel job of
# https://github.com/astropy/astropy-healpix/blob/v2.0.1/.github/workflows/publish.yml,
# which calls OpenAstronomy/github-actions-workflows' publish.yml.
name: Build astropy-healpix wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'astropy-healpix version to build (git tag without leading v, e.g. 2.0.1)'
        required: true
        default: '2.0.1'
  pull_request:
    paths:
      - '.github/workflows/build-astropy-healpix.yml'
      - 'patches/astropy-healpix/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.0.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.0.1 there.
  ASTROPY_HEALPIX_VERSION: ${{ inputs.version || '2.0.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build astropy-healpix ${{ inputs.version || '2.0.1' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup.cfg pins `[bdist_wheel] py_limited_api = cp310`, overridden here to
          # our cp312 floor via EXTENSION_HELPERS_PY_LIMITED_API; built on cp312, the
          # oldest interpreter the tag then claims, and re-tested on the newer ones.
          - tag: cp312-abi3
            wheel_tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
            limited_api: cp312
            test_skip: ''
            timeout: 90
          # pyproject.toml itself blanks EXTENSION_HELPERS_PY_LIMITED_API for cp3??t
          # builds, since free-threaded interpreters don't support the limited API.
          # Its test extras hard-require astropy, which publishes no cp314t wheel on
          # any index anywhere (checked pypi.org and pypi.riseproject.dev) -- so the
          # wheel is built and shipped like upstream's, but untested (gotcha 149).
          - tag: cp314t
            wheel_tag: cp314-cp314t
            build: cp314t-manylinux_riscv64
            limited_api: ''
            test_skip: '*'
            timeout: 45

    steps:
      - name: Checkout astropy-healpix v${{ env.ASTROPY_HEALPIX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: astropy/astropy-healpix
          ref: v${{ env.ASTROPY_HEALPIX_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch astropy-healpix source
        run: git apply python-wheels/patches/astropy-healpix/${{ env.ASTROPY_HEALPIX_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          # numpy is a build and a runtime requirement, and only our registry has
          # it for riscv64; only-binary keeps a newer PyPI release from winning the
          # resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            EXTENSION_HELPERS_PY_LIMITED_API=${{ matrix.limited_api }}
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ASTROPY_HEALPIX=${{ env.ASTROPY_HEALPIX_VERSION }}
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: pytest --pyargs astropy_healpix
          # astropy (a hard runtime+test dependency) and hypothesis (a test
          # dependency) both only have riscv64 wheels on our registry, at specific
          # versions; only-binary stops pip resolving a newer PyPI release with no
          # riscv64 wheel anywhere and building it from sdist (gotcha 210 -- for
          # hypothesis that sdist build needs a Rust toolchain rustup won't target).
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=astropy,hypothesis

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-${{ matrix.wheel_tag }}-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {"_core", "compiler_version"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.md"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: astropy-healpix-${{ env.ASTROPY_HEALPIX_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish astropy-healpix ${{ inputs.version || '2.0.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: astropy-healpix-${{ inputs.version || '2.0.1' }}-*-manylinux_riscv64
