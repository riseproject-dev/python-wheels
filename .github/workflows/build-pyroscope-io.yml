---
# This workflow is based on: https://github.com/grafana/pyroscope-python/blob/python-1.2.1/.github/workflows/ci.yml
name: Build pyroscope-io wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyroscope-io.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroscope-io.yml'
      - 'docs/packages/pyroscope-io.yaml'
      - 'patches/pyroscope-io/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroscope-io.yml'
      - 'docs/packages/pyroscope-io.yaml'
      - 'patches/pyroscope-io/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyroscope-io
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyroscope-io ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per-interpreter (upstream ships cp3x-cp3x wheels,
        # no abi3). cp314t is excluded: upstream publishes no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]

    env:
      PYROSCOPE_IO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyroscope-python ${{ env.PYROSCOPE_IO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: grafana/pyroscope-python
          ref: python-${{ env.PYROSCOPE_IO_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Check out py-spy and add riscv64 support
        run: |
          py_spy_url=$(sed -En 's|^py-spy = \{ git = "([^"]+)".*|\1|p' rust/Cargo.toml)
          py_spy_rev=$(sed -En 's|^py-spy = \{ git = "[^"]+", rev = "([^"]+)".*|\1|p' rust/Cargo.toml)
          git clone --filter=blob:none --no-checkout "$py_spy_url" py-spy
          git -C py-spy checkout --detach "$py_spy_rev"
          git -C py-spy apply "${GITHUB_WORKSPACE}/python-wheels/patches/pyroscope-io/${PYROSCOPE_IO_VERSION}/0002-python_bindings-return-no-tstate_current-offset-on-riscv64.patch"
          git apply "python-wheels/patches/pyroscope-io/${PYROSCOPE_IO_VERSION}/0001-cargo-build-py-spy-from-a-locally-patched-checkout.patch"

      - name: Stage the before-all script and the smoke test
        run: |
          mkdir -p smoke
          cat > before-all.sh <<'BEFORE_ALL_EOF'
          #!/bin/bash
          # SPDX-FileCopyrightText: 2026 The RISE Project
          # SPDX-License-Identifier: MIT
          #
          # Mirrors the build environment of upstream's docker/wheel.Dockerfile: a
          # statically linked OpenSSL for reqwest's native-tls backend, plus the pinned
          # Rust toolchain.
          set -euxo pipefail

          OPENSSL_VERSION=3.5.7
          RUST_VERSION=1.98.0

          # libstdc++-static is added to upstream's list: build.rs links the C++ memalloc
          # profiler statically and Rocky 10 keeps libstdc++.a out of the default install.
          yum -y install gcc perl-core glibc-devel make libstdc++-static

          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o /tmp/openssl.tar.gz
          tar xzf /tmp/openssl.tar.gz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VERSION}"
          ./config no-shared no-tests --prefix=/usr/local/openssl --openssldir=/etc/ssl
          make -j"$(nproc)"
          make install_sw
          ln -sf /usr/local/openssl/lib64 /usr/local/openssl/lib || true
          cd /
          rm -rf /tmp/openssl*

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
          BEFORE_ALL_EOF
          cat > smoke/riscv64_smoke.py <<'SMOKE_EOF'
          # SPDX-FileCopyrightText: 2026 The RISE Project
          # SPDX-License-Identifier: MIT
          """End-to-end smoke test for the riscv64 pyroscope-io wheel.

          Upstream tests its wheels with a Go suite that runs a Pyroscope server and
          the workload in separate Docker containers, which the build container cannot
          do. This drives the same path in-process: point the agent at a local HTTP
          server, do work, and assert the uploaded pprof carries the frames of the
          function that did it.
          """

          import gzip
          import hashlib
          import http.server
          import subprocess
          import sys
          import threading
          import time

          MARKERS = {"cpu": b"smoke_cpu_burn", "mem": b"smoke_mem_churn"}
          PUSH_PATH = "/push.v1.PusherService/Push"


          def smoke_cpu_burn(deadline):
              value = "riscv64"
              while time.time() < deadline:
                  value = hashlib.sha256(value.encode()).hexdigest()
              return value


          def smoke_mem_churn(deadline):
              retained = []
              while time.time() < deadline:
                  retained.append(bytearray(64 * 1024))
                  if len(retained) >= 256:
                      del retained[:128]
                  time.sleep(0.005)
              return len(retained)


          def worker(mode, url):
              import pyroscope

              options = dict(
                  application_name="riscv64.smoke",
                  server_address=url,
                  enable_logging=True,
                  upload_interval=1,
                  tags={"mode": mode},
              )
              if mode == "cpu":
                  options.update(cpu_enabled=True)
              else:
                  options.update(cpu_enabled=False, mem_enabled=True)

              pyroscope.configure(**options)
              deadline = time.time() + 15
              try:
                  if mode == "cpu":
                      smoke_cpu_burn(deadline)
                  else:
                      smoke_mem_churn(deadline)
              finally:
                  pyroscope.shutdown()


          class Collector(http.server.BaseHTTPRequestHandler):
              bodies = []

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length)
                  if self.path.endswith(PUSH_PATH):
                      Collector.bodies.append(body)
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, *_args):
                  pass


          def run(mode):
              Collector.bodies = []
              server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Collector)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              url = "http://127.0.0.1:%d" % server.server_address[1]
              try:
                  result = subprocess.run(
                      [sys.executable, "-u", __file__, "worker", mode, url],
                      capture_output=True,
                      text=True,
                      timeout=180,
                  )
              finally:
                  server.shutdown()

              print(result.stdout, end="")
              print(result.stderr, end="", file=sys.stderr)
              if result.returncode != 0:
                  raise SystemExit("%s worker exited with %d" % (mode, result.returncode))

              bodies = Collector.bodies
              if not bodies:
                  raise SystemExit("%s: agent uploaded no profile" % mode)

              marker = MARKERS[mode]
              profiles = b"".join(gzip.decompress(body) for body in bodies)
              if marker not in profiles:
                  raise SystemExit(
                      "%s: %d uploads (%d bytes) carry no %s frame"
                      % (mode, len(bodies), len(profiles), marker.decode())
                  )
              print("%s: %d uploads, %s sampled" % (mode, len(bodies), marker.decode()))


          def main():
              import pyroscope

              print("pyroscope from", pyroscope.__file__)
              print("native from", pyroscope.lib.__file__)
              if "site-packages" not in pyroscope.__file__:
                  raise SystemExit("imported the source tree, not the wheel")
              for mode in ("cpu", "mem"):
                  run(mode)


          if __name__ == "__main__":
              if len(sys.argv) > 1 and sys.argv[1] == "worker":
                  worker(sys.argv[2], sys.argv[3])
              else:
                  main()
          SMOKE_EOF

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: bash {project}/before-all.sh
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            OPENSSL_DIR=/usr/local/openssl
            OPENSSL_STATIC=1
          CIBW_TEST_SOURCES: smoke
          CIBW_TEST_COMMAND: python smoke/riscv64_smoke.py

      - name: Check the wheel carries the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert sos, f"no .so in {sys.argv[1]}: {names}"
          print("\n".join(sos))
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyroscope_io-${{ env.PYROSCOPE_IO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyroscope-io ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyroscope_io-${{ matrix.version }}-*-manylinux_riscv64
