---
# Upstream has no CI; its wheels are a setuptools build of PY_LGPIO with PYPI=1,
# which compiles the lg C library statically into the SWIG extension.
name: Build lgpio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lgpio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lgpio.yml'
      - 'docs/packages/lgpio.yaml'
      - 'patches/lgpio/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lgpio.yml'
      - 'docs/packages/lgpio.yaml'
      - 'patches/lgpio/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # lgpio 0.2.2.0 has no tag: it is the merge of joan2937/lg#25, whose PY_LGPIO
  # tree and C sources are byte-identical to the PyPI sdist. Update alongside
  # the version in docs/packages/lgpio.yaml.
  LGPIO_REF: 746f0df43774175090b93abcc860b6733eefc09b
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lgpio
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build lgpio ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      LGPIO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lg ${{ env.LGPIO_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: joan2937/lg
          ref: ${{ env.LGPIO_REF }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch lg source
        run: git apply python-wheels/patches/lgpio/${{ env.LGPIO_VERSION }}/*.patch

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        working-directory: PY_LGPIO
        env:
          PYPI: '1'
        run: |
          set -euo pipefail
          uv pip install build twine
          python -m build --sdist --outdir ../dist
          twine check ../dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lgpio-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build lgpio ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: lgpio
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: lgpio-${{ matrix.version }}-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: PYPI=1
      # Upstream has no test suite and every other call needs a real gpiochip.
      cibw-test-command: >
        python -c "import lgpio, _lgpio;
        assert _lgpio.__file__.endswith('.so'), _lgpio.__file__;
        assert lgpio.error_text(lgpio.BAD_GPIOCHIP) == 'bad gpiochip'"

  publish:
    name: Publish lgpio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lgpio-${{ matrix.version }}-*-manylinux_riscv64
