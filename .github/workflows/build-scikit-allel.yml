---
# This workflow is based on: https://github.com/cggh/scikit-allel/blob/master/.github/workflows/deploy.yml
name: Build scikit-allel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scikit-allel.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-allel.yml'
      - 'docs/packages/scikit-allel.yaml'
      - 'patches/scikit-allel/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-allel.yml'
      - 'docs/packages/scikit-allel.yaml'
      - 'patches/scikit-allel/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scikit-allel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scikit-allel ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the three Cython extensions link the
        # version-specific ABI, same shape as build-crick.yml.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"

    env:
      SCIKIT_ALLEL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout scikit-allel ${{ env.SCIKIT_ALLEL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cggh/scikit-allel
          ref: v${{ env.SCIKIT_ALLEL_VERSION }}
          fetch-depth: 0  # setuptools_scm derives the version from `git describe`
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a declared build-system requirement (pyproject.toml) and, despite
          # not being listed there as a runtime dependency either, an implicit one too
          # (the compiled extensions call numpy's C API at import time). Only our
          # registry has it for riscv64; only-binary keeps a newer PyPI release from
          # winning the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # The full upstream suite (allel/test) needs the `tabix` binary and sample
          # VCF/GFF fixtures that aren't part of the wheel; smoke-import the three
          # compiled extensions instead, proving the riscv64 .so's actually load.
          CIBW_TEST_COMMAND: python -c "import allel.opt.model, allel.opt.stats, allel.opt.io_vcf_read"

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"model", "stats", "io_vcf_read"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scikit-allel-${{ env.SCIKIT_ALLEL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish scikit-allel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: scikit-allel-${{ matrix.version }}-*-manylinux_riscv64
