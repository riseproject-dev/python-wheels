---
# This workflow is based on: https://github.com/dofuuz/python-soxr/blob/v1.1.0/.github/workflows/build-dist.yml
name: Build soxr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'soxr version to build (git tag without the leading v, e.g. 1.1.0)'
        required: true
        default: '1.1.0'
  # pull_request:
  #   paths:
  #    - '.github/workflows/build-soxr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  # `inputs.version` is empty on pull_request events; default to 1.1.0 there.
  SOXR_VERSION: ${{ inputs.version || '1.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build soxr ${{ inputs.version || '1.1.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyproject sets wheel.py-api = "cp312", so one abi3 wheel serves every
          # non-free-threaded interpreter from 3.12 on. It is built on cp312 --
          # the oldest interpreter its tag claims -- and re-tested on the newer
          # ones. cp313t is absent from the riscv64 manylinux image.
          - tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout python-soxr v${{ env.SOXR_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: dofuuz/python-soxr
          ref: v${{ env.SOXR_VERSION }}
          # libsoxr is a submodule and is compiled into the extension; the full
          # history lets setuptools-scm derive the version from the tag.
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: soxr-${{ env.SOXR_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish soxr ${{ inputs.version || '1.1.0' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: soxr-${{ env.SOXR_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
