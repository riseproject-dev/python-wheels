---
# This workflow is based on: https://github.com/dofuuz/python-soxr/blob/v1.1.0/.github/workflows/build-dist.yml
name: Build soxr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/soxr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-soxr.yml'
      - 'docs/packages/soxr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-soxr.yml'
      - 'docs/packages/soxr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: soxr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build soxr ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyproject sets wheel.py-api = "cp312", so one abi3 wheel serves every
          # non-free-threaded interpreter from 3.12 on. It is built on cp312 --
          # the oldest interpreter its tag claims -- and re-tested on the newer
          # ones. cp313t is absent from the riscv64 manylinux image.
          - tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: soxr
      version: ${{ matrix.version }}
      # libsoxr is a submodule and is compiled into the extension; the full
      # history lets setuptools-scm derive the version from the tag.
      repository: dofuuz/python-soxr
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.tag }}-manylinux_riscv64
      checkout-submodules: recursive
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.build }}
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      cibw-test-environment: PIP_ONLY_BINARY=numpy
      timeout-minutes: 120

  publish:
    name: Publish soxr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: soxr-${{ matrix.version }}-*-manylinux_riscv64
