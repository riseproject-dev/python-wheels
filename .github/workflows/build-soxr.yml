---
# This workflow is based on: https://github.com/dofuuz/python-soxr/blob/v1.1.0/.github/workflows/build-dist.yml
name: Build soxr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'soxr version to build (git tag without the leading v, e.g. 1.1.0)'
        required: true
        default: '1.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-soxr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.1.0 there.
  SOXR_VERSION: ${{ inputs.version || '1.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build soxr ${{ inputs.version || '1.1.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyproject sets wheel.py-api = "cp312", so one abi3 wheel serves every
          # non-free-threaded interpreter from 3.12 on. It is built on cp312 --
          # the oldest interpreter its tag claims -- and re-tested on the newer
          # ones. cp313t is absent from the riscv64 manylinux image.
          - tag: cp312-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout python-soxr v${{ env.SOXR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dofuuz/python-soxr
          ref: v${{ env.SOXR_VERSION }}
          # libsoxr is a submodule and is compiled into the extension; the full
          # history lets setuptools-scm derive the version from the tag.
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: soxr-${{ env.SOXR_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish soxr ${{ inputs.version || '1.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: soxr-${{ inputs.version || '1.1.0' }}-*-manylinux_riscv64
