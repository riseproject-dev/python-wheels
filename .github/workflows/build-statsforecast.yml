---
# This workflow is based on: https://github.com/Nixtla/statsforecast/blob/v2.1.1/.github/workflows/python-publish.yml
name: Build statsforecast wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/statsforecast.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-statsforecast.yml'
      - 'docs/packages/statsforecast.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-statsforecast.yml'
      - 'docs/packages/statsforecast.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: statsforecast
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build statsforecast ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # statsmodels (a hard, unguarded runtime dep) has no riscv64 wheel
        # for cp314 or cp314t on pypi.riseproject.dev yet
        # (build-statsmodels.yml's own matrix is cp312/cp313 only); pandas
        # is also missing for cp314t. Build still runs for both.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "statsforecast"
      version: "${{ matrix.version }}"
      repository: "Nixtla/statsforecast"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: |-
        cp external_libs/eigen/COPYING.MPL2 COPYING.eigen
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # coreforecast (a hard runtime dep) has no riscv64 wheel published
      # yet, so it is deliberately left off PIP_ONLY_BINARY: pip falls
      # back to building its sdist, which bundles its own vendored deps.
      # polars is pinned to the newest version pypi.riseproject.dev has
      # built for riscv64 (the "polars" package on PyPI is a thin
      # py3-none-any shim requiring polars-runtime-32==<same version>).
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas,statsmodels,matplotlib,scikit-learn MPLBACKEND=Agg"
      cibw-test-skip: "${{ case(matrix.python == 'cp314', '*', endsWith(matrix.python, 't'), '*', '') }}"
      # scikit-learn is an unguarded import inside MFLES's optimizer path
      # (statsforecast/mfles.py), not just SklearnModel's own tests.
      cibw-test-requires: "pytest matplotlib scikit-learn polars==1.44.1"
      cibw-test-sources: "tests"
      # test_tbats_selection_and_forecast asserts fitted values against an
      # x86_64-computed golden array at rtol=1e-6; riscv64's BLAS/LAPACK
      # kernels converge the BATS optimizer to a different (max 3.7%
      # relative difference) but still-valid fit -- a cross-platform
      # optimizer-convergence divergence, not a code defect (same root
      # cause class as gotcha 170's BLAS-divergence case, different
      # mechanism: convergence point vs. dtype).
      cibw-test-command: "python -m pytest tests --ignore=tests/test_adapters_prophet.py --ignore=tests/test_distributed_fugue.py --deselect \"tests/test_tbats.py::test_tbats_selection_and_forecast\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # statsmodels (a hard, unguarded runtime dep) has no riscv64 wheel
        # for cp314 or cp314t on pypi.riseproject.dev yet
        # (build-statsmodels.yml's own matrix is cp312/cp313 only); pandas
        # is also missing for cp314t. Build still runs for both.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      STATSFORECAST_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: statsforecast-${{ env.STATSFORECAST_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "COPYING.eigen"}, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish statsforecast ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: statsforecast-${{ matrix.version }}-*-manylinux_riscv64
