---
# Based on the `build_wheels` and `test_wheels` jobs of
# https://github.com/USEPA/WNTR/blob/1.5.0/.github/workflows/build_test_wheels.yml
name: Build wntr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wntr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wntr.yml'
      - 'docs/packages/wntr.yaml'
      - 'patches/wntr/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wntr.yml'
      - 'docs/packages/wntr.yaml'
      - 'patches/wntr/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wntr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build wntr ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "wntr"
      version: "${{ matrix.version }}"
      repository: "USEPA/WNTR"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 240
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/wntr/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # Our registry's cp310 numpy riscv64 wheels stop at 2.2.2, below the
      # pyproject.toml build requirement numpy>=2.2.6; let pip build numpy from
      # sdist for cp310 only, keeping the faster prebuilt wheel everywhere else.
      cibw-environment-linux: "BUILD_WNTR_EXTENSIONS='true' PIP_ONLY_BINARY=${{ matrix.python == 'cp310' && 'scipy,pandas,matplotlib,contourpy,kiwisolver,pillow,shapely,pyproj,pyogrio,rasterio,rtree,pyzmq,rpds-py' || 'numpy,scipy,pandas,matplotlib,contourpy,kiwisolver,pillow,shapely,pyproj,pyogrio,rasterio,rtree,pyzmq,rpds-py' }}"
      # Upstream commits x86_64-only EPANET binaries under libepanet/linux-x64; this
      # compiles the same sources they were built from into libepanet/linux-riscv64.
      cibw-before-all: |-
        set -e
        dest={project}/wntr/epanet/libepanet/linux-riscv64
        mkdir -p $dest /tmp/epanet && cd /tmp/epanet

        curl -fsSL --retry 5 https://github.com/OpenWaterAnalytics/EPANET/archive/refs/tags/v2.1.tar.gz | tar xz
        # gotcha 226/525: GCC14 treats missing-prototype as an error under
        # strict -std=c99, and mkstemp() needs _DEFAULT_SOURCE to be visible;
        # reproduce the Makefile's own CFLAGS and add the macro (command-line
        # CFLAGS= replaces the Makefile's, it doesn't append to it; CPPFLAGS,
        # which supplies -I../../include, is untouched here).
        make -C EPANET-2.1/build/Linux libepanet2.so LDFLAGS="-L . -lm" CFLAGS="-g -O3 -fPIC -std=c99 -D_DEFAULT_SOURCE"
        cp EPANET-2.1/build/Linux/libepanet2.so $dest/libepanet20.so

        curl -fsSL --retry 5 https://github.com/OpenWaterAnalytics/EPANET/archive/refs/tags/v2.2.tar.gz | tar xz
        # gotcha 207: v2.2 declares cmake_minimum_required(2.8.8), which CMake 4 rejects.
        cmake -S EPANET-2.2 -B epanet22-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build epanet22-build --target epanet2
        cp epanet22-build/lib/libepanet2.so $dest/libepanet22.so
        cp EPANET-2.2/LICENSE {project}/LICENSE.EPANET

        curl -fsSL --retry 5 https://github.com/USEPA/EPANETMSX/archive/85a303dca05859389eced63fabd5ea145c096333.tar.gz | tar xz
        curl -fsSL --retry 5 https://github.com/USEPA/EPANET2.2/archive/1e2fc3d909c0df654ead95e6e98c3307ce1375b1.tar.gz | tar xz --wildcards '*/SRC_engines/*'
        rm -rf EPANETMSX-85a303dca05859389eced63fabd5ea145c096333/EPANET2.2
        mv EPANET2.2-1e2fc3d909c0df654ead95e6e98c3307ce1375b1 EPANETMSX-85a303dca05859389eced63fabd5ea145c096333/EPANET2.2
        # gotcha 226/525: src/solver/msxout.c includes <stdlib.h> only under
        # `#if ... __APPLE__`, so on Linux calloc()/free() have no prototype, which
        # GCC14 rejects (implicit-function-declaration) even at its default gnu17;
        # force-include the header (CMAKE_C_FLAGS is otherwise empty here).
        cmake -S EPANETMSX-85a303dca05859389eced63fabd5ea145c096333 -B msx-build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_INSTALL_RPATH=$ORIGIN' '-DCMAKE_C_FLAGS=-include stdlib.h'
        cmake --build msx-build
        cmake --install msx-build --prefix /tmp/epanet/msx-install
        cp msx-install/lib/libepanet2.so msx-install/lib/libepanetmsx.so $dest/
        cp EPANETMSX-85a303dca05859389eced63fabd5ea145c096333/license.txt {project}/LICENSE.EPANETMSX
      # rasterio/shapely/pyproj have no riscv64 wheel on our registry below cp312,
      # and the 'optional' tests guard their imports; test only 'test' on cp310/cp311.
      cibw-test-extras: "${{ (matrix.python == 'cp310' || matrix.python == 'cp311') && 'test' || 'optional,test' }}"
      # plotly, utm and folium are all pure-Python, so pull them in directly on
      # cp310/cp311 rather than losing the tests that need them along with the
      # rest of 'optional'. folium was missed in the prior round: real cp310/cp311
      # job logs (run 43082661452) show test_plot_interactive_network1,
      # test_plot_leaflet_network1 and test_plot_leaflet_network_popup still
      # failing with "ImportError: folium is required" even after plotly/utm
      # were added - those three only need folium itself, not geopandas/shapely.
      cibw-test-requires: "${{ (matrix.python == 'cp310' || matrix.python == 'cp311') && 'plotly utm folium' || '' }}"
      cibw-test-sources: "pyproject.toml wntr/tests examples"
      # wntr/tests/conftest.py os.chdir()s to a temp dir at import time, which
      # invalidates these --ignore paths once pyproject.toml's `--doctest-modules`
      # addopt forces pytest to also re-resolve them against the new cwd; make
      # them absolute so they still match after the chdir. test_plot_valve_layer_gpd
      # and test_plot_valve_layer_with_attribute need geopandas/shapely themselves,
      # which stay unavailable on cp310/cp311; deselect those two. The real
      # cp310/cp311 job log (run 43632351590) also shows test_plot_interactive_network1
      # failing independent of any missing dependency: "ValueError: Invalid property
      # specified for object of type plotly.graph_objs.scatter.marker.ColorBar:
      # 'titleside'" - the installed plotly release dropped/renamed that colorbar
      # property, an upstream test/plotly-version incompatibility unrelated to
      # riscv64; deselect it alongside the other two known-incompatible tests.
      cibw-test-command: "pytest wntr/tests/ --ignore=\"$PWD/wntr/tests/test_demos.py\" --ignore=\"$PWD/wntr/tests/test_examples.py\" ${{ (matrix.python == 'cp310' || matrix.python == 'cp311') && '--deselect wntr/tests/test_graphics.py::TestGraphics::test_plot_valve_layer_gpd --deselect wntr/tests/test_graphics.py::TestGraphics::test_plot_valve_layer_with_attribute --deselect wntr/tests/test_graphics.py::TestGraphics::test_plot_interactive_network1' || '' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      WNTR_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wntr-${{ env.WNTR_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the extensions, riscv64 EPANET libraries and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for ext in ("wntr/sim/aml/_evaluator.", "wntr/sim/network_isolation/_network_isolation."):
              assert any(n.startswith(ext) and n.endswith(".so") for n in names), ext
          for lib in ("libepanet20.so", "libepanet22.so", "libepanet2.so", "libepanetmsx.so"):
              assert f"wntr/epanet/libepanet/linux-riscv64/{lib}" in names, lib
          for lic in ("LICENSE.md", "LICENSE.EPANET", "LICENSE.EPANETMSX"):
              assert any(n.endswith(f".dist-info/licenses/{lic}") for n in names), lic
          print(sys.argv[1], "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      WNTR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # libepanetmsx links OpenMP, so auditwheel vendors the image's libgomp into wntr.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wntr-${{ env.WNTR_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish wntr ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: wntr-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: wntr-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
