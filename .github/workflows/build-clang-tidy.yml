---
# This workflow is based on: https://github.com/ssciwr/clang-tidy-wheel/blob/main/.github/workflows/release.yml
name: Build clang-tidy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clang-tidy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clang-tidy.yml'
      - 'docs/packages/clang-tidy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clang-tidy.yml'
      - 'docs/packages/clang-tidy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # ssciwr/clang-tidy-wheel has no v22.1.8 tag yet; pin the commit whose
  # CMakeLists.txt/pyproject.toml this workflow was written against and
  # override clang-tidy_version.txt the same way upstream's own
  # workflow_dispatch(llvm_version) input does.
  CLANG_TIDY_WHEEL_REF: 0dc6a6edd1f404d5f0b84b59872f9b6d22211134

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clang-tidy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build clang-tidy ${{ matrix.version }} py2.py3-none-manylinux_riscv64
    # upstream CMakeLists.txt does not restrict LLVM_TARGETS_TO_BUILD
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "clang-tidy"
      version: "${{ matrix.version }}"
      repository: "ssciwr/clang-tidy-wheel"
      ref: "0dc6a6edd1f404d5f0b84b59872f9b6d22211134"
      artifact-tag: "py2.py3-none-manylinux_riscv64"
      timeout-minutes: 1440
      pre-build: |-
        export CLANG_TIDY_VERSION='${{ matrix.version }}'
        echo "${CLANG_TIDY_VERSION}" > clang-tidy_version.txt
      # wheel.py-api = "py2.py3", so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      cibw-before-test: "rm -rf {package}/clang_tidy"
      # Upstream tests its Linux wheels with CI=1 so test_include_iostream skips
      # (ssciwr/clang-tidy-wheel#30); here clang also cannot find the image's
      # /usr/lib/gcc/riscv64-redhat-linux, which is not in its riscv64 triple list.
      cibw-test-environment: "CI=1"
      # Repeats pyproject.toml's own `environment` table: CIBW_ENVIRONMENT replaces
      # rather than merges with it (gotcha 107).
      cibw-environment-linux: >
        CMAKE_GENERATOR=Ninja
  publish:
    name: Publish clang-tidy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clang-tidy-${{ matrix.version }}-*-manylinux_riscv64
