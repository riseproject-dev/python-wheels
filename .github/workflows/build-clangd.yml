---
# This workflow is based on: https://github.com/jmpfar/clangd-wheel/blob/main/.github/workflows/build.yml
name: Build clangd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clangd.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clangd.yml'
      - 'docs/packages/clangd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clangd.yml'
      - 'docs/packages/clangd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clangd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build clangd ${{ matrix.version }} py2.py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440  # full LLVM+clang+clang-tools-extra compile from source

    env:
      CLANGD_VERSION: ${{ matrix.version }}

    steps:
      # jmpfar/clangd-wheel tags as v<major>.<minor>.<patch>.<wheel-revision>;
      # scikit-build-core's own version regex (pyproject.toml) drops a trailing
      # ".0" revision, so a pending 3-component version maps back to "<ver>.0".
      - name: Resolve clangd-wheel tag for ${{ env.CLANGD_VERSION }}
        id: tag
        run: |
          version="${CLANGD_VERSION}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=v${version}.0" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout clangd-wheel ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jmpfar/clangd-wheel
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # wheel.py-api = "py2.py3", so one build serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Rocky 10 AppStream ships lld matching the image's clang; the ExternalProject_Add
          # LLVM sub-build inherits the environment, so LDFLAGS steers its final static
          # clangd link onto lld instead of ld.bfd. build-circt.yml hit this runner's 15GB
          # RAM ceiling on an unrestricted-target LLVM/MLIR link; clangd's CMakeLists.txt
          # likewise leaves LLVM_TARGETS_TO_BUILD at upstream's default (all targets).
          CIBW_BEFORE_ALL: dnf -y install lld
          # Repeats pyproject.toml's own `environment` table: CIBW_ENVIRONMENT replaces
          # rather than merges with it (gotcha 107).
          CIBW_ENVIRONMENT: >-
            CMAKE_GENERATOR=Ninja
            CMAKE_BUILD_PARALLEL_LEVEL=3
            LDFLAGS=-fuse-ld=lld
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clangd-${{ env.CLANGD_VERSION }}-py2.py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish clangd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: clangd-${{ matrix.version }}-*-manylinux_riscv64
