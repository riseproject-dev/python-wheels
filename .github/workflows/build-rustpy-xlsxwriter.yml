---
# This workflow is based on the `linux` job of
# https://github.com/rahmadafandi/rustpy-xlsxwriter/blob/0.6.1/.github/workflows/CI.yml
name: Build rustpy-xlsxwriter wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rustpy-xlsxwriter.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rustpy-xlsxwriter.yml'
      - 'docs/packages/rustpy-xlsxwriter.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rustpy-xlsxwriter.yml'
      - 'docs/packages/rustpy-xlsxwriter.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rustpy-xlsxwriter
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rustpy-xlsxwriter ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # rustpy-xlsxwriter's [tool.maturin] features only lists
        # "pyo3/extension-module" (no abi3), so every interpreter needs its own
        # build.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      RUSTPY_XLSXWRITER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout rustpy-xlsxwriter ${{ env.RUSTPY_XLSXWRITER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rahmadafandi/rustpy-xlsxwriter
          ref: ${{ env.RUSTPY_XLSXWRITER_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # rustpy-xlsxwriter ships no [tool.cibuildwheel], so the Rust
          # toolchain its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: >-
            PIP_ONLY_BINARY=numpy,pandas,pyarrow,polars-runtime-32,polars-runtime-64
          # pandas has no cp314t wheel on our registry yet, and it's needed
          # transitively by several test modules; skip testing that leg
          # (the wheel itself still builds).
          CIBW_TEST_SKIP: cp314t-*
          CIBW_TEST_SOURCES: tests
          # pyarrow is not in upstream's [project.optional-dependencies] tests
          # extra but is in their frozen dev requirements.txt: pandas 3's
          # __arrow_c_stream__ needs it, and without it pandas falls back to a
          # slower path that mishandles NaT (test_csv.py::TestCSVArrowPath).
          CIBW_TEST_REQUIRES: pytest faker openpyxl pandas pyarrow polars
          CIBW_TEST_COMMAND: >-
            python -m pytest tests/ -v -ra --durations=0 -m "not benchmark"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rustpy-xlsxwriter-${{ env.RUSTPY_XLSXWRITER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rustpy-xlsxwriter ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: rustpy-xlsxwriter-${{ matrix.version }}-*-manylinux_riscv64
