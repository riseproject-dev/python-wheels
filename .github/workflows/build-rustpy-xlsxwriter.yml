---
# This workflow is based on the `linux` job of
# https://github.com/rahmadafandi/rustpy-xlsxwriter/blob/0.6.1/.github/workflows/CI.yml
name: Build rustpy-xlsxwriter wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rustpy-xlsxwriter.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rustpy-xlsxwriter.yml'
      - 'docs/packages/rustpy-xlsxwriter.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rustpy-xlsxwriter.yml'
      - 'docs/packages/rustpy-xlsxwriter.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rustpy-xlsxwriter
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rustpy-xlsxwriter ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rustpy-xlsxwriter"
      version: "${{ matrix.version }}"
      repository: "rahmadafandi/rustpy-xlsxwriter"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # rustpy-xlsxwriter ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas,pyarrow,polars-runtime-32,polars-runtime-64"
      # pandas has no cp314t wheel on our registry yet, and it's needed
      # transitively by several test modules; skip testing that leg
      # (the wheel itself still builds).
      cibw-test-skip: "cp314t-*"
      cibw-test-sources: "tests"
      # pyarrow is not in upstream's [project.optional-dependencies] tests
      # extra but is in their frozen dev requirements.txt: pandas 3's
      # __arrow_c_stream__ needs it, and without it pandas falls back to a
      # slower path that mishandles NaT (test_csv.py::TestCSVArrowPath).
      cibw-test-requires: "pytest faker openpyxl pandas pyarrow polars"
      cibw-test-command: >
        python -m pytest tests/ -v -ra --durations=0 -m "not benchmark"

  publish:
    name: Publish rustpy-xlsxwriter ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rustpy-xlsxwriter-${{ matrix.version }}-*-manylinux_riscv64
