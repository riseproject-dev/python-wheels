---
# This workflow is based on the `test` job of
# https://github.com/ionelmc/python-lazy-object-proxy/blob/v1.12.0/.github/workflows/github-actions.yml
name: Build lazy-object-proxy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lazy-object-proxy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lazy-object-proxy.yml'
      - 'docs/packages/lazy-object-proxy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lazy-object-proxy.yml'
      - 'docs/packages/lazy-object-proxy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lazy-object-proxy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lazy-object-proxy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "lazy-object-proxy"
      version: "${{ matrix.version }}"
      repository: "ionelmc/python-lazy-object-proxy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setuptools_scm cannot see the tag history in a shallow checkout.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LAZY_OBJECT_PROXY=${{ matrix.version }}"
      cibw-test-requires: "pytest pytest-benchmark"
      # Upstream runs `tox --skip-pkg-install --direct-yolo -e py3XX-nocov`; tox-direct
      # caps tox below 4, so run that env's own command instead.
      cibw-test-command: "cd {project} && pytest -vv --ignore=src"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      LAZY_OBJECT_PROXY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lazy-object-proxy-${{ env.LAZY_OBJECT_PROXY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("lazy_object_proxy/cext.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish lazy-object-proxy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lazy-object-proxy-${{ matrix.version }}-*-manylinux_riscv64
