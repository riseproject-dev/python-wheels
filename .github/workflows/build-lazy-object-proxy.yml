---
# This workflow is based on the `test` job of
# https://github.com/ionelmc/python-lazy-object-proxy/blob/v1.12.0/.github/workflows/github-actions.yml
name: Build lazy-object-proxy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lazy-object-proxy version to build (git tag without leading v, e.g. 1.12.0)'
        required: true
        default: '1.12.0'
  pull_request:
    paths:
      - '.github/workflows/build-lazy-object-proxy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.12.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LAZY_OBJECT_PROXY_VERSION: ${{ inputs.version || '1.12.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build lazy-object-proxy ${{ inputs.version || '1.12.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout lazy-object-proxy v${{ env.LAZY_OBJECT_PROXY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ionelmc/python-lazy-object-proxy
          ref: v${{ env.LAZY_OBJECT_PROXY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setuptools_scm cannot see the tag history in a shallow checkout.
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LAZY_OBJECT_PROXY=${{ env.LAZY_OBJECT_PROXY_VERSION }}
          CIBW_TEST_REQUIRES: pytest pytest-benchmark
          # Upstream runs `tox --skip-pkg-install --direct-yolo -e py3XX-nocov`; tox-direct
          # caps tox below 4, so run that env's own command instead.
          CIBW_TEST_COMMAND: >-
            cd {project} &&
            pytest -vv --ignore=src

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("lazy_object_proxy/cext.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lazy-object-proxy-${{ env.LAZY_OBJECT_PROXY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lazy-object-proxy ${{ inputs.version || '1.12.0' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: lazy-object-proxy-${{ env.LAZY_OBJECT_PROXY_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
