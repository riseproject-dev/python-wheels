---
# Based on upstream's own deploy job:
# https://github.com/pycompression/python-zlib-ng/blob/v1.0.0/.github/workflows/ci.yml
name: Build zlib-ng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zlib-ng.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-ng.yml'
      - 'docs/packages/zlib-ng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-ng.yml'
      - 'docs/packages/zlib-ng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zlib-ng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zlib-ng ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      ZLIB_NG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout zlib-ng v${{ env.ZLIB_NG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pycompression/python-zlib-ng
          ref: v${{ env.ZLIB_NG_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch zlib-ng source
        run: git apply python-wheels/patches/zlib-ng/${{ env.ZLIB_NG_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # The riscv64-compat patch leaves the checkout dirty relative to the
          # tag, so setuptools_scm would otherwise compute a dev version.
          CIBW_ENVIRONMENT: >-
            CFLAGS="-O3 -DNDEBUG"
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.ZLIB_NG_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/test_zlib_compliance.py
            {project}/tests/test_gzip_compliance.py
            {project}/tests/test_gzip_ng.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zlib-ng-${{ env.ZLIB_NG_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zlib-ng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: zlib-ng-${{ matrix.version }}-*riscv64
