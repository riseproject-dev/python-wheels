---
# Based on upstream's own deploy job:
# https://github.com/pycompression/python-zlib-ng/blob/v1.0.0/.github/workflows/ci.yml
name: Build zlib-ng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zlib-ng.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-ng.yml'
      - 'docs/packages/zlib-ng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-ng.yml'
      - 'docs/packages/zlib-ng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zlib-ng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zlib-ng ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "zlib-ng"
      version: "${{ matrix.version }}"
      repository: "pycompression/python-zlib-ng"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # The riscv64-compat patch leaves the checkout dirty relative to the
      # tag, so setuptools_scm would otherwise compute a dev version.
      cibw-environment-linux: "CFLAGS=\"-O3 -DNDEBUG\" SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {project}/tests/test_zlib_compliance.py {project}/tests/test_gzip_compliance.py {project}/tests/test_gzip_ng.py"

  publish:
    name: Publish zlib-ng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zlib-ng-${{ matrix.version }}-*riscv64
