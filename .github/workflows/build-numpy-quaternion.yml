---
# This workflow is based on: https://github.com/moble/quaternion/blob/v2024.0.13/.github/workflows/build.yml
name: Build numpy-quaternion wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'numpy-quaternion version to build (git tag without leading v, e.g. 2024.0.13)'
        required: true
        default: '2024.0.13'
  pull_request:
    paths:
      - '.github/workflows/build-numpy-quaternion.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2024.0.13' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2024.0.13 there.
  NUMPY_QUATERNION_VERSION: ${{ inputs.version || '2024.0.13' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build numpy-quaternion ${{ inputs.version || '2024.0.13' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the extension links the version-specific ABI.
        # cp313t is skipped: our registry has no riscv64 scipy wheel for cp313t (only cp314t).
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout numpy-quaternion v${{ env.NUMPY_QUATERNION_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: moble/quaternion
          ref: v${{ env.NUMPY_QUATERNION_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy and scipy are both build/runtime requirements, and only our registry
          # has them for riscv64; only-binary keeps a newer PyPI release from winning
          # the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: pytest pytest-cov
          CIBW_TEST_COMMAND: pytest {project}/tests --durations=0

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"numpy_quaternion"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: numpy-quaternion-${{ env.NUMPY_QUATERNION_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish numpy-quaternion ${{ inputs.version || '2024.0.13' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: numpy-quaternion-${{ inputs.version || '2024.0.13' }}-*-manylinux_riscv64
