---
# Based on: https://github.com/iree-org/iree/blob/main/build_tools/pkgci/build_linux_packages.sh
name: Build iree-base-compiler wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iree-base-compiler.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iree-base-compiler.yml'
      - 'docs/packages/iree-base-compiler.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iree-base-compiler.yml'
      - 'docs/packages/iree-base-compiler.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iree-base-compiler
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iree-base-compiler ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      IREE_BASE_COMPILER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout iree-org/iree v${{ env.IREE_BASE_COMPILER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: iree-org/iree
          ref: v${{ env.IREE_BASE_COMPILER_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Write compiler version
        run: |
          cat > compiler/version_local.json <<EOF
          {
            "package-version": "${IREE_BASE_COMPILER_VERSION}"
          }
          EOF

      # The wheel links LLVM/MLIR/clang/lld, StableHLO and Torch-MLIR; upstream's wheel ships no licence text for them.
      - name: Stage licences
        run: |
          cp LICENSE compiler/LICENSE
          cp third_party/llvm-project/LICENSE.TXT compiler/LICENSE.llvm
          cp third_party/stablehlo/LICENSE compiler/LICENSE.stablehlo
          cp third_party/torch-mlir/LICENSE compiler/LICENSE.torch-mlir

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: compiler
          output-dir: wheelhouse
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          # Default ninja -j and ld.bfd exhaust the runner's memory on a build this size
          # (same failure mode as build-circt.yml); IREE_ENABLE_LLD switches its own build to lld.
          CIBW_BEFORE_ALL: dnf -y install lld
          CIBW_ENVIRONMENT: >-
            IREE_ENABLE_LLD=ON
            IREE_TARGET_BACKEND_ROCM=OFF
            IREE_TARGET_BACKEND_CUDA=OFF
            CMAKE_BUILD_PARALLEL_LEVEL=3
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_COMMAND: python -m iree.compiler._package_test

      - name: Check wheel licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.llvm", "LICENSE.stablehlo", "LICENSE.torch-mlir"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iree-base-compiler-${{ env.IREE_BASE_COMPILER_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish iree-base-compiler ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: iree-base-compiler-${{ matrix.version }}-*-manylinux_riscv64
