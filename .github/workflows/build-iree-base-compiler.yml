---
# Based on: https://github.com/iree-org/iree/blob/main/build_tools/pkgci/build_linux_packages.sh
name: Build iree-base-compiler wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iree-base-compiler.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iree-base-compiler.yml'
      - 'docs/packages/iree-base-compiler.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iree-base-compiler.yml'
      - 'docs/packages/iree-base-compiler.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iree-base-compiler
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iree-base-compiler ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "iree-base-compiler"
      version: "${{ matrix.version }}"
      repository: "iree-org/iree"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 2880
      checkout-submodules: "recursive"
      pre-build: |-
        export IREE_BASE_COMPILER_VERSION='${{ matrix.version }}'
        cat > compiler/version_local.json <<EOF
        {
          "package-version": "${IREE_BASE_COMPILER_VERSION}"
        }
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp LICENSE compiler/LICENSE
        cp third_party/llvm-project/LICENSE.TXT compiler/LICENSE.llvm
        cp third_party/stablehlo/LICENSE compiler/LICENSE.stablehlo
        cp third_party/torch-mlir/LICENSE compiler/LICENSE.torch-mlir

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "compiler"
      cibw-build: "cp312-manylinux_riscv64"
      cibw-build-frontend: "build"
      # Default ninja -j and ld.bfd exhaust the runner's memory on a build this size
      # (same failure mode as build-circt.yml); IREE_ENABLE_LLD switches its own build to lld.
      cibw-before-all: "dnf -y install lld"
      # -mno-relax: lld's --gc-sections (on by default for LLVM's own Release
      # builds) mis-handles GCC's .eh_frame relocation ordering together with
      # riscv64 linker relaxation, erroring "relocation refers to a symbol in
      # a discarded section" on exception-table-heavy C++ objects. This is a
      # known riscv64 gc-sections/relaxation interaction (binutils PR 28709;
      # same -mno-relax workaround suggested on the matching lld-side thread),
      # not specific to IREE - disabling relaxation avoids it without having
      # to switch off lld or disable gc-sections wholesale.
      cibw-environment-linux: "IREE_ENABLE_LLD=ON IREE_TARGET_BACKEND_ROCM=OFF IREE_TARGET_BACKEND_CUDA=OFF CMAKE_BUILD_PARALLEL_LEVEL=3 CFLAGS=-mno-relax CXXFLAGS=-mno-relax"
      cibw-test-command: "python -m iree.compiler._package_test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 2880  # 48h: 1440 (24h) was cancelled twice in a row at [4075/8692] and
                            # [5960/8692] (runs 38678387321, 39714560434); ~188 steps/h over the
                            # last 10h of the second run extrapolates to ~38-40h total
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      IREE_BASE_COMPILER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: iree-base-compiler-${{ env.IREE_BASE_COMPILER_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.llvm", "LICENSE.stablehlo", "LICENSE.torch-mlir"}, licences
          EOF

  publish:
    name: Publish iree-base-compiler ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: iree-base-compiler-${{ matrix.version }}-*-manylinux_riscv64
