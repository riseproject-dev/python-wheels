---
# This workflow is based on the `check-wheel-build`/`test` jobs of
# https://github.com/AdityaVishwakarmaIN/kyrax/blob/v1.0.7/.github/workflows/CI.yml
name: Build kyrax wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kyrax.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kyrax.yml'
      - 'docs/packages/kyrax.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kyrax.yml'
      - 'docs/packages/kyrax.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kyrax
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build kyrax ${{ matrix.version }} ${{ matrix.tag }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Cargo.toml's pyo3 dependency carries abi3-py310 unconditionally
        # (gotcha 181), so one abi3 wheel serves every GIL-ful interpreter;
        # pyo3 disables abi3 under Py_GIL_DISABLED, giving the free-threaded
        # build its own wheel, same shape as build-pgpq.yml.
        tag: [cp310-abi3, cp314t]
        platform: [manylinux, musllinux]
        include:
          # Every test module imports pandas or polars, directly or through
          # the shared python/tests/utils.py, and our registry has neither
          # for cp314t riscv64 yet (polars-runtime-32 is abi3-only), so the
          # free-threaded wheel only gets the import smoke test, same as
          # build-fastexcel.yml's CIBW_TEST_SKIP. The abi3 wheel runs the
          # suite on cp312, our pyarrow/pandas floor. Neither exists for
          # musllinux riscv64 at all, so musl wheels get the smoke test only.
          - tag: cp310-abi3
            interp: python3.10
            test-interp: python3.12
            run-tests: true
          - tag: cp314t
            interp: python3.14t
            test-interp: python3.14t
            run-tests: false

    env:
      KYRAX_VERSION: ${{ matrix.version }}
      IMAGE: ${{ matrix.platform == 'manylinux' && 'quay.io/pypa/manylinux_2_39_riscv64' || 'quay.io/pypa/musllinux_1_2_riscv64' }}
      UV_PYTHON_PREFERENCE: only-managed
      UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_ONLY_BINARY: pandas,pyarrow,pillow,numpy

    steps:
      - name: Checkout kyrax v${{ env.KYRAX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AdityaVishwakarmaIN/kyrax
          ref: v${{ env.KYRAX_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-${{ matrix.platform == 'manylinux' && 'gnu' || 'musl' }}
          args: --release --strip -i ${{ matrix.interp }} --out dist
          manylinux: ${{ matrix.platform == 'manylinux' && '2_39' || 'musllinux_1_2' }}
          # The action maps no musllinux image for a riscv64 host.
          container: ${{ env.IMAGE }}

      - name: Check the wheel ships the extension
        run: |
          set -euo pipefail
          python3 - dist/*.whl <<'EOF'
          import os, sys, zipfile
          whl = sys.argv[1]
          assert os.path.basename(whl).startswith(f"kyrax-{os.environ['KYRAX_VERSION']}-"), whl
          sos = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".so")]
          assert any(n.startswith("kyrax/_kyrax") for n in sos), sos
          print(whl, "->", sos)
          EOF

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        if: matrix.platform == 'manylinux'
        with:
          python-version: ${{ matrix.test-interp }}
          activate-environment: true
          enable-cache: false

      - name: Test wheel
        if: matrix.platform == 'manylinux'
        run: |
          uv pip install dist/*.whl
          python3 -c "import kyrax._kyrax as m; assert m.__file__.endswith('.so'), m.__file__"

      - name: Test wheel
        if: matrix.platform == 'musllinux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -w / "$IMAGE" sh -ec "
            ${{ matrix.test-interp }} -m venv /venv
            /venv/bin/python -m pip install --no-index --find-links /dist kyrax
            /venv/bin/python -c \"import kyrax._kyrax as m; assert m.__file__.endswith('.so'), m.__file__\""

      - name: Run tests
        if: matrix.run-tests && matrix.platform == 'manylinux'
        run: |
          # `uv pip install` doesn't read UV_ONLY_BINARY (unlike UV_EXTRA_INDEX_URL/
          # UV_INDEX_STRATEGY, it has no [env:] binding), so the env-only setting
          # above is a no-op here: pillow's unbounded ">=9.0" resolved to PyPI's
          # newest sdist-only release and tried to build from source. Pass
          # --only-binary on the CLI, which does work, so it backtracks to our
          # registry's latest wheel-backed release instead.
          uv pip install --only-binary pandas,pyarrow,pillow,numpy 'pytest>=7.1.3' 'pytest-mock>=3.1' 'pandas>=1.4.4' 'pyarrow>=8.0.0' 'polars>=1' 'openpyxl>=3.1.2,<4' 'xlrd>=2.0.1,<3' 'pillow>=9.0'
          # python/tests/__init__.py (but no python/__init__.py) makes pytest's default
          # prepend import mode put `python/` on sys.path[0] (gotcha 25): `import kyrax`
          # then resolves to the checkout's uncompiled python/kyrax source tree instead
          # of the wheel just installed into site-packages, so `kyrax._kyrax` 404s even
          # though the wheel (checked above) ships it. --import-mode=importlib imports
          # test modules without that sys.path insertion.
          pytest --import-mode=importlib python/tests --ignore=python/tests/benchmarks -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kyrax-${{ env.KYRAX_VERSION }}-${{ matrix.tag }}-${{ matrix.platform }}_riscv64
          path: dist/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      KYRAX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The musllinux wheels vendor libgcc_s, which rustc links for unwinding
      # and auditwheel's musllinux policy does not allowlist (gotcha 409).
      - uses: ./actions/collect-gpl-sources
        with:
          image: quay.io/pypa/manylinux_2_39_riscv64
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kyrax-${{ env.KYRAX_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish kyrax ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: kyrax-${{ matrix.version }}-*_riscv64
      gpl-sources-artifact: kyrax-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
