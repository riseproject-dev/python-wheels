---
# This workflow is based on the Linux jobs of
# https://github.com/microsoft/mssql-rs/blob/5fb832bbc397c53e83b00f1f7095db366acbfd43/.pipeline/OneBranch/stages.yml
name: Build mssql-python-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mssql-python-rs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mssql-python-rs.yml'
      - 'docs/packages/mssql-python-rs.yaml'
      - 'patches/mssql-python-rs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mssql-python-rs.yml'
      - 'docs/packages/mssql-python-rs.yaml'
      - 'patches/mssql-python-rs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags: this is the main commit the 0.4.0
  # wheels were built from (its SBOM is stamped 40 minutes later). Update it
  # alongside the version in docs/packages/mssql-python-rs.yaml.
  MSSQL_PYTHON_RS_REF: 5fb832bbc397c53e83b00f1f7095db366acbfd43

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mssql-python-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build mssql-python-rs ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    container:
      image: quay.io/pypa/manylinux_2_39_riscv64
    defaults:
      run:
        shell: bash
    env:
      MSSQL_PYTHON_RS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mssql-rs ${{ env.MSSQL_PYTHON_RS_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: microsoft/mssql-rs
          ref: ${{ env.MSSQL_PYTHON_RS_REF }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch mssql-rs source
        run: |
          git config --global --add safe.directory '*'
          git apply python-wheels/patches/mssql-python-rs/${{ env.MSSQL_PYTHON_RS_VERSION }}/00*.patch

      - name: Setup build environment
        run: |
          dnf -y install openssl openssl-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          /opt/python/cp312-cp312/bin/python -m pip install maturin==1.15.0

      # mssql-py-core/ has no LICENSE of its own, so upstream's wheels ship none.
      - name: Stage licence
        run: cp LICENSE mssql-py-core/

      - name: Build abi3 wheel
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE" OUTPUT_DIR="$GITHUB_WORKSPACE/target/wheels" \
            bash scripts/build-python-wheels-in-container.sh

      - name: Build ODBC driver
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE" ODBC_DROP_DIR="$GITHUB_WORKSPACE/odbc-drop" MAX_GLIBC_VERSION=2.39 \
            sh scripts/build-odbc-driver-only.sh glibc

      - name: Inject ODBC driver into wheel
        run: |
          mkdir -p drivers/linux/glibc/riscv64/lib
          cp odbc-drop/build/mssqlodbc.so drivers/linux/glibc/riscv64/lib/mssqlodbc.so
          /opt/python/cp312-cp312/bin/python scripts/inject-odbc-into-wheels.py \
            --wheels-dir target/wheels \
            --drivers-dir drivers

      - name: Repair glibc wheel
        run: REPAIR_PLAT=manylinux_2_39 bash scripts/repair-glibc-wheels-in-container.sh target/wheels

      - name: Check the wheel carries both native libraries and the licence
        run: |
          /opt/python/cp312-cp312/bin/python - target/wheels/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "mssql_py_core/mssql_py_core.abi3.so" in names, names
              assert "mssql_py_core/libs/linux/glibc/riscv64/lib/mssqlodbc.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - name: Test wheel installs
        run: |
          ln -s "$GITHUB_WORKSPACE/scripts" /scripts
          bash scripts/test-python-wheel-installs-linux.sh --container "$GITHUB_WORKSPACE/target/wheels" manylinux_2_39 riscv64

      # Upstream's dev/test-python.sh --skip-integration, run against the built
      # wheel instead of `maturin develop`; the integration tests need a SQL
      # Server, which has no riscv64 image.
      - name: Run unit tests
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          PIP_ONLY_BINARY: pyarrow
        run: |
          bash scripts/generate_mock_tds_server_certs.sh
          (cd mssql-mock-tds-py && PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            /opt/python/cp312-cp312/bin/python -m maturin build --release --out "$GITHUB_WORKSPACE/mock-wheels")
          /opt/python/cp312-cp312/bin/python -m venv /venv
          /venv/bin/pip install target/wheels/*.whl mock-wheels/*.whl pytest pytest-asyncio python-dotenv pyarrow
          cd mssql-py-core
          /venv/bin/python -m pytest tests/ -v -m "not integration and not longhaul and not smoke" --ignore=tests/mssql_python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mssql-python-rs-${{ env.MSSQL_PYTHON_RS_VERSION }}-cp310-abi3-manylinux_riscv64
          path: target/wheels/*.whl
          if-no-files-found: error

  publish:
    name: Publish mssql-python-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mssql-python-rs-${{ matrix.version }}-*-manylinux_riscv64
