---
# lmnr-claude-code-proxy has no public source repository and no public CI: LMNR AI
# publishes only the PyPI sdist (and an npm package built from the same crate), so
# the sdist is the upstream tree and is fed to cibuildwheel directly. Everything
# else mirrors upstream's packaging: maturin/PyO3 over bin/Cargo.toml with the
# `python` feature, per-interpreter wheels, release profile from Cargo.toml.
name: Build lmnr-claude-code-proxy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lmnr-claude-code-proxy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lmnr-claude-code-proxy.yml'
      - 'docs/packages/lmnr-claude-code-proxy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lmnr-claude-code-proxy.yml'
      - 'docs/packages/lmnr-claude-code-proxy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lmnr-claude-code-proxy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lmnr-claude-code-proxy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "lmnr-claude-code-proxy"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 300
      pre-build: |-
        export PROXY_VERSION='${{ matrix.version }}'
        url="$(curl -sSfL "https://pypi.org/pypi/lmnr-claude-code-proxy/${PROXY_VERSION}/json" \
          | python3 -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"))')"
        curl -sSfL -o sdist.tar.gz "$url"
        # Extracted rather than passed to cibuildwheel as a tarball: for a
        # tarball package-dir cibuildwheel chdirs into its own extraction temp
        # dir, and CIBW_TEST_SOURCES resolves against that cwd, so the staged
        # tests below would be invisible.
        tar xzf sdist.tar.gz
        test -f "lmnr_claude_code_proxy-${PROXY_VERSION}/pyproject.toml"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        mkdir -p tests
        cat > tests/test_proxy.py <<'PYTEST'
        """Smoke tests for the riscv64 lmnr-claude-code-proxy wheel.

        Upstream ships no test suite, so these exercise the compiled PyO3
        extension end to end: start the Rust proxy, drive its internal
        endpoints and forward a request through it to a local upstream.
        """

        import http.server
        import importlib
        import socket
        import threading
        import time

        import httpx
        import pytest

        from lmnr_claude_code_proxy import ProxyServer


        def test_extension_module_is_compiled():
            ext = importlib.import_module("lmnr_claude_code_proxy.lmnr_claude_code_proxy")
            assert ext.__file__.endswith(".so"), ext.__file__
            # 0.2.0 dropped the bare `stop` binding; `stop_with_timeout` is
            # the only stop entry point left (present in older versions too).
            for name in ("run", "stop_with_timeout"):
                assert callable(getattr(ext, name)), name


        def _free_port():
            with socket.socket() as sock:
                sock.bind(("127.0.0.1", 0))
                return sock.getsockname()[1]


        class _UpstreamHandler(http.server.BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def do_GET(self):  # noqa: N802 - http.server API
                body = b'{"upstream":"ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):
                pass


        @pytest.fixture
        def upstream():
            server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), _UpstreamHandler)
            threading.Thread(target=server.serve_forever, daemon=True).start()
            try:
                yield f"http://127.0.0.1:{server.server_address[1]}"
            finally:
                server.shutdown()
                server.server_close()


        @pytest.fixture
        def proxy(upstream):
            port = _free_port()
            server = ProxyServer(port=port)
            server.run_server(upstream)
            assert server.is_running
            deadline = time.monotonic() + 60
            while time.monotonic() < deadline:
                try:
                    httpx.get(f"http://127.0.0.1:{port}/lmnr-internal/health", timeout=5.0)
                    break
                except httpx.HTTPError:
                    time.sleep(0.1)
            else:
                pytest.fail("proxy server never became reachable")
            try:
                yield server, port
            finally:
                server.stop_server()
            assert not server.is_running


        def test_health_endpoint(proxy):
            _, port = proxy
            response = httpx.get(f"http://127.0.0.1:{port}/lmnr-internal/health", timeout=10.0)
            assert response.status_code == 200
            assert response.json() == {"status": "ok"}


        def test_set_current_trace(proxy):
            server, _ = proxy
            server.set_current_trace(
                trace_id="01234567-89ab-cdef-0123-456789abcdef",
                span_id="fedcba98-7654-3210-fedc-ba9876543210",
                project_api_key="not-a-real-key",
                span_path=["riscv64", "smoke"],
            )


        def test_span_context_rejects_invalid_json(proxy):
            _, port = proxy
            response = httpx.post(
                f"http://127.0.0.1:{port}/lmnr-internal/span-context",
                content=b"not json",
                timeout=10.0,
            )
            assert response.status_code == 400


        def test_request_is_forwarded_upstream(proxy):
            _, port = proxy
            response = httpx.get(f"http://127.0.0.1:{port}/anything", timeout=30.0)
            assert response.status_code == 200
            assert response.json() == {"upstream": "ok"}
        PYTEST

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "lmnr_claude_code_proxy-${{ matrix.version }}"
      # musllinux is dropped: rustup.rs ships no riscv64 musl host toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No [tool.cibuildwheel] table upstream, so the Rust toolchain the
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest -v tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PROXY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lmnr-claude-code-proxy-${{ env.PROXY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert len(sos) == 1, names
          print("extension:", sos[0])
          EOF

  publish:
    name: Publish lmnr-claude-code-proxy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lmnr-claude-code-proxy-${{ matrix.version }}-*-manylinux_riscv64
