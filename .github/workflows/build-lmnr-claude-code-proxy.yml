---
# lmnr-claude-code-proxy has no public source repository and no public CI: LMNR AI
# publishes only the PyPI sdist (and an npm package built from the same crate), so
# the sdist is the upstream tree and is fed to cibuildwheel directly. Everything
# else mirrors upstream's packaging: maturin/PyO3 over bin/Cargo.toml with the
# `python` feature, per-interpreter wheels, release profile from Cargo.toml.
name: Build lmnr-claude-code-proxy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lmnr-claude-code-proxy version to build (e.g. 0.1.24)'
        required: true
        default: '0.1.24'
  pull_request:
    paths:
      - '.github/workflows/build-lmnr-claude-code-proxy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.24' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.24 there.
  PROXY_VERSION: ${{ inputs.version || '0.1.24' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build lmnr-claude-code-proxy ${{ inputs.version || '0.1.24' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # PyO3 without abi3, so one wheel per interpreter (upstream ships
        # cp310..cp314 plus cp314t, all cp3x-cp3x).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Fetch lmnr-claude-code-proxy ${{ env.PROXY_VERSION }} sdist
        run: |
          url="$(curl -sSfL "https://pypi.org/pypi/lmnr-claude-code-proxy/${PROXY_VERSION}/json" \
            | python3 -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"))')"
          curl -sSfL -o sdist.tar.gz "$url"
          # Extracted rather than passed to cibuildwheel as a tarball: for a
          # tarball package-dir cibuildwheel chdirs into its own extraction temp
          # dir, and CIBW_TEST_SOURCES resolves against that cwd, so the staged
          # tests below would be invisible.
          tar xzf sdist.tar.gz
          test -f "lmnr_claude_code_proxy-${PROXY_VERSION}/pyproject.toml"

      - name: Stage smoke tests
        run: |
          mkdir -p tests
          cat > tests/test_proxy.py <<'PYTEST'
          """Smoke tests for the riscv64 lmnr-claude-code-proxy wheel.

          Upstream ships no test suite, so these exercise the compiled PyO3
          extension end to end: start the Rust proxy, drive its internal
          endpoints and forward a request through it to a local upstream.
          """

          import http.server
          import importlib
          import socket
          import threading
          import time

          import httpx
          import pytest

          from lmnr_claude_code_proxy import ProxyServer


          def test_extension_module_is_compiled():
              ext = importlib.import_module("lmnr_claude_code_proxy.lmnr_claude_code_proxy")
              assert ext.__file__.endswith(".so"), ext.__file__
              for name in ("run", "stop", "stop_with_timeout"):
                  assert callable(getattr(ext, name)), name


          def _free_port():
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  return sock.getsockname()[1]


          class _UpstreamHandler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def do_GET(self):  # noqa: N802 - http.server API
                  body = b'{"upstream":"ok"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          @pytest.fixture
          def upstream():
              server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), _UpstreamHandler)
              threading.Thread(target=server.serve_forever, daemon=True).start()
              try:
                  yield f"http://127.0.0.1:{server.server_address[1]}"
              finally:
                  server.shutdown()
                  server.server_close()


          @pytest.fixture
          def proxy(upstream):
              port = _free_port()
              server = ProxyServer(port=port)
              server.run_server(upstream)
              assert server.is_running
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      httpx.get(f"http://127.0.0.1:{port}/lmnr-internal/health", timeout=5.0)
                      break
                  except httpx.HTTPError:
                      time.sleep(0.1)
              else:
                  pytest.fail("proxy server never became reachable")
              try:
                  yield server, port
              finally:
                  server.stop_server()
              assert not server.is_running


          def test_health_endpoint(proxy):
              _, port = proxy
              response = httpx.get(f"http://127.0.0.1:{port}/lmnr-internal/health", timeout=10.0)
              assert response.status_code == 200
              assert response.json() == {"status": "ok"}


          def test_set_current_trace(proxy):
              server, _ = proxy
              server.set_current_trace(
                  trace_id="01234567-89ab-cdef-0123-456789abcdef",
                  span_id="fedcba98-7654-3210-fedc-ba9876543210",
                  project_api_key="not-a-real-key",
                  span_path=["riscv64", "smoke"],
              )


          def test_span_context_rejects_invalid_json(proxy):
              _, port = proxy
              response = httpx.post(
                  f"http://127.0.0.1:{port}/lmnr-internal/span-context",
                  content=b"not json",
                  timeout=10.0,
              )
              assert response.status_code == 400


          def test_request_is_forwarded_upstream(proxy):
              _, port = proxy
              response = httpx.get(f"http://127.0.0.1:{port}/anything", timeout=30.0)
              assert response.status_code == 200
              assert response.json() == {"upstream": "ok"}
          PYTEST

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          package-dir: lmnr_claude_code_proxy-${{ env.PROXY_VERSION }}
          # musllinux is dropped: rustup.rs ships no riscv64 musl host toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No [tool.cibuildwheel] table upstream, so the Rust toolchain the
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v tests

      - name: Check the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert len(sos) == 1, names
          print("extension:", sos[0])
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lmnr-claude-code-proxy-${{ env.PROXY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lmnr-claude-code-proxy ${{ inputs.version || '0.1.24' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: lmnr-claude-code-proxy-${{ env.PROXY_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
