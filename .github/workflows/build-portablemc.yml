---
# This workflow is based on the `build-py`/`build-py-sdist` jobs of
# https://github.com/theorzr/portablemc/blob/v5.0.6/.github/workflows/deploy.yml
name: Build portablemc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/portablemc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-portablemc.yml'
      - 'docs/packages/portablemc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-portablemc.yml'
      - 'docs/packages/portablemc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: portablemc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build portablemc ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "portablemc"
      version: "${{ matrix.version }}"
      repository: "theorzr/portablemc"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export PORTABLEMC_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/portablemc/${PORTABLEMC_VERSION}"
        if [ -d "$patches" ]; then
          git apply -v "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp LICENSE portablemc-py/
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "portablemc-py"
      # pyo3's abi3-py39 feature is on unconditionally (portablemc-py/Cargo.toml),
      # so one cp39-abi3 wheel serves every GIL-ful interpreter; upstream ships
      # no free-threaded wheel because abi3 and Py_GIL_DISABLED only meet on
      # 3.14+. cibuildwheel compiles once on cp39 -- the oldest interpreter the
      # tag claims -- and re-tests that wheel on the newer ones. musllinux is
      # dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp39-manylinux_riscv64 cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # portablemc ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # test-sources is resolved against cibuildwheel's cwd (the portablemc
      # checkout root), not against package-dir (gotcha 104) -- the suite
      # actually lives at portablemc-py/tests, not at a repo-root tests/.
      # Its pyproject.toml isn't staged into test_cwd, so the "network"
      # marker's own addopts deselection doesn't apply; -m "not network"
      # reproduces it explicitly.
      cibw-test-requires: "pytest"
      cibw-test-sources: "portablemc-py/tests"
      cibw-test-command: "python -m pytest -v -m \"not network\" portablemc-py/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PORTABLEMC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: portablemc-${{ env.PORTABLEMC_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "portablemc/_portablemc.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish portablemc ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: portablemc-${{ matrix.version }}-*-manylinux_riscv64
