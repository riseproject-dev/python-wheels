---
# This workflow is based on the `build-py`/`build-py-sdist` jobs of
# https://github.com/theorzr/portablemc/blob/v5.0.6/.github/workflows/deploy.yml
name: Build portablemc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/portablemc.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-portablemc.yml'
      - 'docs/packages/portablemc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-portablemc.yml'
      - 'docs/packages/portablemc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: portablemc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build portablemc ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PORTABLEMC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout portablemc v${{ env.PORTABLEMC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: theorzr/portablemc
          ref: v${{ env.PORTABLEMC_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Only some versions need patching, so a missing directory is not an error.
      - name: Patch portablemc source
        run: |
          patches="$PWD/python-wheels/patches/portablemc/${PORTABLEMC_VERSION}"
          if [ -d "$patches" ]; then
            git apply -v "$patches"/*.patch
          fi

      - name: Stage the licence beside portablemc-py's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory, which
        # in this workspace is portablemc-py/ -- so upstream's own released
        # wheels carry no licence text at all, only the License-Expression
        # metadata.
        run: cp LICENSE portablemc-py/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: portablemc-py
          output-dir: wheelhouse/
        env:
          # pyo3's abi3-py39 feature is on unconditionally (portablemc-py/Cargo.toml),
          # so one cp39-abi3 wheel serves every GIL-ful interpreter; upstream ships
          # no free-threaded wheel because abi3 and Py_GIL_DISABLED only meet on
          # 3.14+. cibuildwheel compiles once on cp39 -- the oldest interpreter the
          # tag claims -- and re-tests that wheel on the newer ones. musllinux is
          # dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: >-
            cp39-manylinux_riscv64 cp310-manylinux_riscv64
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # portablemc ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v tests

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "portablemc/_portablemc.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: portablemc-${{ env.PORTABLEMC_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish portablemc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: portablemc-${{ matrix.version }}-*-manylinux_riscv64
