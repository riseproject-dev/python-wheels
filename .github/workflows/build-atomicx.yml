---
# This workflow is based on upstream's own wheel builder:
#   https://github.com/RuneBlaze/atomicx/blob/a3c350545a1507952585d7355fcbf51df3b88bdc/.github/workflows/CI.yml
name: Build atomicx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/atomicx.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-atomicx.yml'
      - 'docs/packages/atomicx.yaml'
      - 'patches/atomicx/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-atomicx.yml'
      - 'docs/packages/atomicx.yaml'
      - 'patches/atomicx/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Upstream never pushes a git tag (gh api repos/RuneBlaze/atomicx/git/refs/tags
  # 404s); this is the version-bump commit itself, 5 minutes before the sdist's
  # PyPI upload_time_iso_8601 -- gotcha 103. Keep this and the version input two
  # separate things and move both together for a future bump.
  ATOMICX_REF: a3c350545a1507952585d7355fcbf51df3b88bdc

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: atomicx
      version: ${{ inputs.version }}

  # pyo3's abi3-py38 feature is on by default (Cargo.toml `gil-abi3`), so one
  # build serves every GIL-ful interpreter; the riscv64 image's oldest is cp39
  # (no cp38), so it is built there and reused+tested on the rest (gotcha 96's
  # PY_SSIZE_T_CLEAN trap doesn't apply: exposure.rs is pure #[pymethods], no
  # raw C API calls -- gotcha 633).
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build atomicx ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      ATOMICX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout atomicx v${{ env.ATOMICX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RuneBlaze/atomicx
          ref: ${{ env.ATOMICX_REF }}
          persist-credentials: false

      - name: Check the checkout is the requested version
        run: grep -qx "version = \"${ATOMICX_VERSION}\"" Cargo.toml

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: atomicx-${{ env.ATOMICX_VERSION }}-cp39-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded wheel: per-interpreter, no abi3 (pyo3 disables abi3 under
  # Py_GIL_DISABLED, same as `gil-abi3`'s own CI.yml --no-default-features leg).
  # Only cp314t -- the riscv64 image has no cp313t interpreter (gotcha 11). Targeting
  # cp314t (upstream's own free-threaded CI only ever builds cp313t) needs
  # patches/atomicx: upstream's pinned pyo3 0.23 hard-errors "newer than PyO3's maximum
  # supported version (3.13)" on any arch for cp314t, so the patch bumps it to 0.30.
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build atomicx ${{ matrix.version }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      ATOMICX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout atomicx v${{ env.ATOMICX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RuneBlaze/atomicx
          ref: ${{ env.ATOMICX_REF }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels/patches/atomicx/${{ env.ATOMICX_VERSION }}/*.patch

      - name: Check the checkout is the requested version
        run: grep -qx "version = \"${ATOMICX_VERSION}\"" Cargo.toml

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_BUILD: 'cp314t-*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT: >-
            PATH="$PATH:$HOME/.cargo/bin"
            MATURIN_PEP517_ARGS="--no-default-features"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: atomicx-${{ env.ATOMICX_VERSION }}-cp314t-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish atomicx ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: atomicx-${{ matrix.version }}-*-manylinux_riscv64
