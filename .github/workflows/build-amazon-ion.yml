---
# This workflow is based on the `build-wheels` job of
# https://github.com/amazon-ion/ion-python/blob/v0.14.6/.github/workflows/release.yml
name: Build amazon-ion wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/amazon-ion.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-amazon-ion.yml'
      - 'docs/packages/amazon-ion.yaml'
      - 'patches/amazon-ion/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-amazon-ion.yml'
      - 'docs/packages/amazon-ion.yaml'
      - 'patches/amazon-ion/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: amazon-ion
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build amazon-ion ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "amazon-ion"
      version: "${{ matrix.version }}"
      repository: "amazon-ion/ion-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "true"
      pre-build: |-
        git -C src/ion-c fetch --tags --unshallow
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/amazon-ion/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # jsonconversion pulls in numpy, which has no riscv64 wheel on PyPI.
      cibw-test-extras: "test"
      # test_vectors.py resolves its data as <rootdir>/vectors/iontestdata.
      cibw-test-sources: "tests vectors pyproject.toml"
      # The suite silently falls back to the pure-Python reader when the
      # extension is missing, and the licence files come from our patch, so
      # assert both before running upstream's own command.
      cibw-test-command: "python -c \"from amazon.ion.simpleion import c_ext; assert c_ext, 'C extension not loaded'\" && python -c \"import importlib.metadata as m; f = sorted(str(p).split('licenses/', 1)[1] for p in m.files('amazon-ion') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'NOTICE', 'src/ion-c/LICENSE', 'src/ion-c/NOTICE', 'src/ion-c/decNumber/ICU-license.html'], f\" && py.test --ignore tests/test_benchmark_cli.py --ignore tests/test_benchmark_spec.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      AMAZON_ION_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: amazon-ion-${{ env.AMAZON_ION_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish amazon-ion ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: amazon-ion-${{ matrix.version }}-*-manylinux_riscv64
