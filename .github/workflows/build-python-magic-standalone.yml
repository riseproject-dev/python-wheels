---
# This workflow is based on: https://github.com/fpgmaas/python-magic/blob/0.4.29/.github/workflows/wheels.yml
name: Build python-magic-standalone wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-magic-standalone.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-magic-standalone.yml'
      - 'docs/packages/python-magic-standalone.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-magic-standalone.yml'
      - 'docs/packages/python-magic-standalone.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-magic-standalone
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-magic-standalone ${{ matrix.version }} cp312-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]

    # add_libmagic.sh compiles and bundles libmagic (file) but the wheel ships only python-magic's LICENSE.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "python-magic-standalone"
      version: "${{ matrix.version }}"
      repository: "fpgmaas/python-magic"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp312-${{ matrix.libc }}_riscv64"
      checkout-fetch-depth: 0
      pre-build: |-
        version=$(sed -n 's/.*version="file-\([0-9.]*\)".*/\1/p' add_libmagic.sh)
        curl -fsSL --retry 5 -o LICENSE.libmagic "https://raw.githubusercontent.com/file/file/FILE${version//./_}/COPYING"
      cibw-build: "cp312-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-before-build-linux: "bash add_libmagic.sh"
      cibw-environment-linux: "LC_ALL=en_US.UTF-8"
      cibw-test-requires: "pytest"
      cibw-test-command: >
        pytest --import-mode=importlib {project}/test &&
        python -c "import importlib.metadata as md;
        licenses = {str(f) for f in md.files('python-magic-standalone') if '.dist-info/licenses/' in str(f)};
        assert any(l.endswith('/LICENSE') for l in licenses), licenses;
        assert any(l.endswith('/LICENSE.libmagic') for l in licenses), licenses"

  publish:
    name: Publish python-magic-standalone ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-magic-standalone-${{ matrix.version }}-*riscv64
