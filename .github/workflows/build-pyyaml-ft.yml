---
# Based on upstream's wheel builder:
#   https://github.com/Quansight-Labs/pyyaml-ft/blob/v8.0.0/.github/workflows/ci.yaml
# Upstream builds a static libyaml itself (packaging/build/libyaml.sh) and links the
# Cython extension against it; we do the same here. Only cp313/cp313t are in upstream's
# own matrix; the riscv64 image has no cp313t interpreter (gotcha 11), so cp314t stands
# in as the free-threaded target, same pattern as build-bcrypt.yml.
name: Build pyyaml-ft wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyyaml-ft.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyyaml-ft.yml'
      - 'docs/packages/pyyaml-ft.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyyaml-ft.yml'
      - 'docs/packages/pyyaml-ft.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # libyaml ref matches upstream ci.yaml's own LIBYAML_REF default.
  BEFORE_ALL_LIBYAML: >-
    set -eux &&
    curl -L -o libyaml.tar.gz https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz &&
    tar xzf libyaml.tar.gz && rm libyaml.tar.gz && cd libyaml-0.2.5 &&
    ./bootstrap &&
    ./configure --disable-dependency-tracking --with-pic --enable-shared=no &&
    make install &&
    cd .. && rm -rf libyaml-0.2.5

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyyaml-ft
      version: ${{ inputs.version }}

  # Mirrors upstream's cp313 (GIL) build.
  build_gil:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyyaml-ft ${{ matrix.version }} cp313-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyyaml-ft
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp313-manylinux_riscv64
      timeout-minutes: 90
      cibw-build: cp313-*
      cibw-before-all-linux: set -eux && curl -L -o libyaml.tar.gz https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz && tar xzf libyaml.tar.gz && rm libyaml.tar.gz && cd libyaml-0.2.5 && ./bootstrap && ./configure --disable-dependency-tracking --with-pic --enable-shared=no && make install && cd .. && rm -rf libyaml-0.2.5
      cibw-environment-linux: PYYAML_FORCE_CYTHON=1 PYYAML_FORCE_LIBYAML=1
      cibw-test-requires: pytest pytest-run-parallel
      cibw-test-command: >
        pytest {package} &&
        pytest --parallel-threads=auto --iterations=20 {package}/tests/free_threading

  # Free-threaded wheel: only cp314t - the riscv64 image has no cp313t interpreter
  # (gotcha 11), even though upstream's own matrix targets cp313t.
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyyaml-ft ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyyaml-ft
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp314t-manylinux_riscv64
      timeout-minutes: 90
      cibw-build: cp314t-*
      cibw-before-all-linux: set -eux && curl -L -o libyaml.tar.gz https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz && tar xzf libyaml.tar.gz && rm libyaml.tar.gz && cd libyaml-0.2.5 && ./bootstrap && ./configure --disable-dependency-tracking --with-pic --enable-shared=no && make install && cd .. && rm -rf libyaml-0.2.5
      cibw-environment-linux: PYYAML_FORCE_CYTHON=1 PYYAML_FORCE_LIBYAML=1
      cibw-test-requires: pytest pytest-run-parallel
      cibw-test-command: >
        pytest {package} &&
        pytest --parallel-threads=auto --iterations=20 {package}/tests/free_threading

  publish:
    name: Publish pyyaml-ft ${{ matrix.version }}
    needs: [setup, build_gil, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyyaml-ft-${{ matrix.version }}-*-manylinux_riscv64
