---
# This workflow is based on the `linux` job of
# https://github.com/qdrant/py-rust-stemmers/blob/v0.1.8/.github/workflows/release.yml
name: Build py-rust-stemmers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/py-rust-stemmers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-py-rust-stemmers.yml'
      - 'docs/packages/py-rust-stemmers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-py-rust-stemmers.yml'
      - 'docs/packages/py-rust-stemmers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: py-rust-stemmers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build py-rust-stemmers ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "py_rust_stemmers"
      version: "${{ matrix.version }}"
      repository: "qdrant/py-rust-stemmers"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      # musllinux is out of reach: rustup publishes rust-std but no
      # rustc/cargo host toolchain for riscv64gc-unknown-linux-musl.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # py-rust-stemmers ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: >
        python -c "import py_rust_stemmers.py_rust_stemmers as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish py-rust-stemmers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: py_rust_stemmers-${{ matrix.version }}-*-manylinux_riscv64
