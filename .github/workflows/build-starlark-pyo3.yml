---
# This workflow is based on the `linux` job of
# https://github.com/inducer/starlark-pyo3/blob/v2026.1.1/.github/workflows/CI.yml
name: Build starlark-pyo3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'starlark-pyo3 version to build (git tag, e.g. 2026.1.1)'
        required: true
        default: '2026.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-starlark-pyo3.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2026.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2026.1.1 there.
  STARLARK_PYO3_VERSION: ${{ inputs.version || '2026.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build starlark-pyo3 ${{ inputs.version || '2026.1.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout starlark-pyo3 v${{ env.STARLARK_PYO3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: inducer/starlark-pyo3
          ref: v${{ env.STARLARK_PYO3_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # starlark-pyo3 ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test
          # maturin auto-generates a starlark/__init__.py shim ("from .starlark
          # import *") around the compiled starlark.starlark submodule, so
          # that's the .so to check (gotcha 314).
          CIBW_TEST_COMMAND: >-
            python -c "import starlark.starlark as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: starlark-pyo3-${{ env.STARLARK_PYO3_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish starlark-pyo3 ${{ inputs.version || '2026.1.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: starlark-pyo3-${{ inputs.version || '2026.1.1' }}-*-manylinux_riscv64
