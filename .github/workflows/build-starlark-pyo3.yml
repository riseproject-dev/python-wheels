---
# This workflow is based on the `linux` job of
# https://github.com/inducer/starlark-pyo3/blob/v2026.1.1/.github/workflows/CI.yml
name: Build starlark-pyo3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/starlark-pyo3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-starlark-pyo3.yml'
      - 'docs/packages/starlark-pyo3.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-starlark-pyo3.yml'
      - 'docs/packages/starlark-pyo3.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: starlark-pyo3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build starlark-pyo3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "starlark-pyo3"
      version: "${{ matrix.version }}"
      repository: "inducer/starlark-pyo3"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # starlark-pyo3 ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "test"
      # maturin auto-generates a starlark/__init__.py shim ("from .starlark
      # import *") around the compiled starlark.starlark submodule, so
      # that's the .so to check (gotcha 314).
      cibw-test-command: >
        python -c "import starlark.starlark as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v test

  publish:
    name: Publish starlark-pyo3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: starlark-pyo3-${{ matrix.version }}-*-manylinux_riscv64
