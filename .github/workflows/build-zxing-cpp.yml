---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/zxing-cpp/zxing-cpp/blob/v3.1.1/.github/workflows/publish-python.yml
#   https://github.com/zxing-cpp/zxing-cpp/blob/v3.1.1/wrappers/python/pyproject.toml
name: Build zxing-cpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zxing-cpp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zxing-cpp.yml'
      - 'docs/packages/zxing-cpp.yaml'
      - 'patches/zxing-cpp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zxing-cpp.yml'
      - 'docs/packages/zxing-cpp.yaml'
      - 'patches/zxing-cpp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zxing-cpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zxing-cpp ${{ matrix.version }} ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # wrappers/python/pyproject.toml builds a STABLE_ABI nanobind module tagged
        # cp312-abi3, so one cp312 build covers cp312/cp313/cp314; only the
        # FREE_THREADED cp314t build needs its own wheel (upstream's own build list is
        # cp310-cp312 + cp313t/cp314t, collapsed the same way per gotcha 11).
        build:
          - "cp312-manylinux_riscv64"
          - "cp314t-manylinux_riscv64"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "zxing-cpp"
      version: "${{ matrix.version }}"
      repository: "zxing-cpp/zxing-cpp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.build }}"
      checkout-submodules: "true"

      patches: true

      cibw-package-dir: "wrappers/python"
      cibw-build: "${{ matrix.build }}"

  publish:
    name: Publish zxing-cpp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zxing-cpp-${{ matrix.version }}-*-manylinux_riscv64
