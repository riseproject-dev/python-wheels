---
# This workflow is based on: https://github.com/sase-org/sase-core/blob/v0.39.0/.github/workflows/release-plz.yml
name: Build sase-core-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sase-core-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sase-core-rs.yml'
      - 'docs/packages/sase-core-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sase-core-rs.yml'
      - 'docs/packages/sase-core-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sase-core-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sase-core-rs ${{ matrix.version }} cp312-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sase-core-rs"
      version: "${{ matrix.version }}"
      repository: "sase-org/sase-core"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp312-manylinux_riscv64"
      # sase_gateway pulls axum/reqwest/tokio/rustls into the cdylib's
      # dependency tree: sase_core alone took ~20 min to compile on riscv64
      # and the job hit a 60-min limit mid-sase_gateway (gotcha 365).
      timeout-minutes: 360

      patches: true

      cibw-package-dir: "crates/sase_core_py"
      # pyo3 abi3-py312 (crates/sase_core_py/Cargo.toml), matching
      # upstream's own single wheel per platform for 3.12+.
      cibw-build: "cp312-manylinux_riscv64"
      # sase-core-rs ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-command: "python -c \"import sase_core_rs; assert sase_core_rs.sase_core_rs.__file__.endswith('.so'), sase_core_rs.sase_core_rs.__file__; print('import ok')\" && python -c \"import sase_core_rs; print('parse_query ok:', sase_core_rs.parse_query('status:Ready'))\""

  publish:
    name: Publish sase-core-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sase-core-rs-${{ matrix.version }}-*-manylinux_riscv64
