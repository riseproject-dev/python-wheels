---
# Based on upstream's own wheel build:
#   https://github.com/ai-dynamo/nixl/blob/v1.4.0/contrib/build-wheel.sh
#   https://github.com/ai-dynamo/nixl/blob/v1.4.0/contrib/Dockerfile.manylinux
name: Build nixl-cu12 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nixl-cu12.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nixl-cu12.yml'
      - 'docs/packages/nixl-cu12.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nixl-cu12.yml'
      - 'docs/packages/nixl-cu12.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  UCX_REF: v1.22.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nixl-cu12
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nixl-cu12 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nixl-cu12"
      version: "${{ matrix.version }}"
      repository: "ai-dynamo/nixl"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's UCX build minus --with-cuda: there is no riscv64 CUDA toolkit, so meson builds the CPU-only backends.
      # Like upstream's Dockerfile, NIXL is also installed system-wide so auditwheel can resolve its subproject sonames (liburing.so.2).
      cibw-before-all-linux: "dnf install -y --enablerepo=crb autoconf automake libtool make ninja-build libaio-devel numactl-devel rdma-core-devel && git clone --depth 1 --branch v1.22.0 https://github.com/openucx/ucx.git /tmp/ucx && cd /tmp/ucx && ./autogen.sh && ./contrib/configure-release-mt --prefix=/usr --libdir=/usr/lib64 --enable-shared --disable-static --disable-doxygen-doc --enable-experimental-api --enable-optimizations --enable-cma --enable-devel-headers --with-verbs --with-dm --without-gdrcopy --with-efa --without-dc --without-rdmacm --without-gga && make -j\"$(nproc)\" && make -j\"$(nproc)\" install-strip && ldconfig && /opt/python/cp312-cp312/bin/python -m venv /tmp/nixl-venv && /tmp/nixl-venv/bin/pip install meson pybind11 patchelf pyyaml types-PyYAML 'setuptools>=80.9.0' && PATH=/tmp/nixl-venv/bin:$PATH meson setup /tmp/nixl-build {project} --prefix=/usr/local/nixl --buildtype=release && PATH=/tmp/nixl-venv/bin:$PATH ninja -C /tmp/nixl-build install && printf '%s\\n' /usr/local/nixl/lib64 /usr/local/nixl/lib64/plugins > /etc/ld.so.conf.d/nixl.conf && ldconfig"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: "pip install meson meson-python pybind11 patchelf pyyaml types-PyYAML 'setuptools>=80.9.0'"
      cibw-repair-wheel-command-linux: "auditwheel repair --exclude 'libcuda*' --exclude 'libcufile*' --exclude 'libssl*' --exclude 'libcrypto*' --exclude 'libefa*' --exclude 'libhwloc*' --exclude 'libfabric*' --exclude 'libtorch*' --exclude 'libc10*' --exclude 'libdoca*' --exclude 'libred_client*' --exclude 'libred_async*' --exclude 'liblz4*' -w {dest_dir} {wheel} && python {project}/contrib/wheel_add_ucx_plugins.py --ucx-plugins-dir /usr/lib64/ucx --skip-nixl-plugins {dest_dir}/*.whl"
      cibw-before-test: "pip install --no-deps nixl==${{ matrix.version }}"
      cibw-test-requires: "pytest pytest-timeout"
      cibw-test-sources: "test"
      cibw-test-environment: "UCX_TLS=^shm PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=:all:"
      cibw-test-command: "pytest -s test/python"

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Collect GPL sources for nixl-cu12 ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      NIXL_CU12_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: libaio
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nixl-cu12-${{ env.NIXL_CU12_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish nixl-cu12 ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nixl-cu12-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: nixl-cu12-${{ matrix.version }}-gpl-sources
      gpl-sources-description: the copyleft libraries bundled in the wheel
