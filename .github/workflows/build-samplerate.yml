---
# This workflow is based on: https://github.com/tuxu/python-samplerate/blob/v0.2.4/.github/workflows/pythonpackage.yml
name: Build samplerate wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/samplerate.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-samplerate.yml'
      - 'docs/packages/samplerate.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-samplerate.yml'
      - 'docs/packages/samplerate.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # external/CMakeLists.txt FetchContent-pulls these two at build time and
  # statically links them in; bump alongside SAMPLERATE_VERSION if upstream
  # ever moves the pins.
  PYBIND11_SHA: f5fbe867d2d26e4a0a9177a51f6e568868ad3dc8
  LIBSAMPLERATE_SHA: c96f5e3de9c4488f4e6c97f59f5245f22fda22f7

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: samplerate
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build samplerate ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "samplerate"
      version: "${{ matrix.version }}"
      repository: "tuxu/python-samplerate"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0
      pre-build: |-
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/f5fbe867d2d26e4a0a9177a51f6e568868ad3dc8/LICENSE" -o LICENSE.pybind11
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/libsndfile/libsamplerate/c96f5e3de9c4488f4e6c97f59f5245f22fda22f7/COPYING" -o LICENSE.libsamplerate

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest numpy"
      cibw-test-command: "pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SAMPLERATE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: samplerate-${{ env.SAMPLERATE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("samplerate.") and n.endswith(".so") for n in names), whl
              licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE.rst", "LICENSE.pybind11", "LICENSE.libsamplerate"}, licences
              print(whl, "ok")
          EOF

  publish:
    name: Publish samplerate ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: samplerate-${{ matrix.version }}-*-manylinux_riscv64
