---
# This workflow is based on the `build-test-native` job of
# https://github.com/DeebotUniverse/client.py/blob/18.6.0/.github/workflows/ci.yml
name: Build deebot-client wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/deebot-client.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-deebot-client.yml'
      - 'docs/packages/deebot-client.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-deebot-client.yml'
      - 'docs/packages/deebot-client.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: deebot-client
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build deebot-client ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ['cp314']

    env:
      DEEBOT_CLIENT_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout deebot-client ${{ env.DEEBOT_CLIENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: DeebotUniverse/client.py
          ref: ${{ env.DEEBOT_CLIENT_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          sed -i "s/^version = \".*\"/version = \"${DEEBOT_CLIENT_VERSION}\"/" pyproject.toml

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --strip --out dist -i ${{ steps.interp.outputs.value }}
          sccache: 'false'
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      - name: Prepare env and install wheel
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_ONLY_BINARY: ':all:'
        run: |
          uv export --frozen --no-hashes --no-dev --group test --no-emit-project > requirements-test.txt
          rm -rf deebot_client
          uv pip install -r requirements-test.txt
          uv pip install --force-reinstall --no-deps dist/deebot_client-*.whl
          python -c "import deebot_client.rs as m; assert m.__file__.endswith('.so'), m.__file__"

      # The docker-marked MQTT tests need an eclipse-mosquitto container; upstream deselects them on macOS/Windows too.
      - name: Run pytest
        run: pytest tests -n auto -v -m "not docker"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: deebot-client-${{ env.DEEBOT_CLIENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish deebot-client ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: deebot-client-${{ matrix.version }}-*-manylinux_riscv64
