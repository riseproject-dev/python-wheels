---
# Based on the `build_wheels` job of
# https://github.com/bluetooth-devices/fnv-hash-fast/blob/v2.0.3/.github/workflows/ci.yml
name: Build fnv-hash-fast wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fnv-hash-fast.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fnv-hash-fast.yml'
      - 'docs/packages/fnv-hash-fast.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fnv-hash-fast.yml'
      - 'docs/packages/fnv-hash-fast.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fnv-hash-fast
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fnv-hash-fast ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fnv-hash-fast
      version: ${{ matrix.version }}
      repository: bluetooth-devices/fnv-hash-fast
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: REQUIRE_EXTENSION=1
      cibw-test-requires: pytest
      # build_ext.py's build_extensions() swallows every compile error
      # unconditionally, so REQUIRE_EXTENSION never actually fails the
      # build; assert the .so directly instead of trusting the wheel.
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import fnv_hash_fast._fnv_impl as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests --ignore=tests/benchmarks
      timeout-minutes: 30

  publish:
    name: Publish fnv-hash-fast ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fnv-hash-fast-${{ matrix.version }}-*-manylinux_riscv64
