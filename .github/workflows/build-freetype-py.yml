---
# Based on: https://github.com/rougier/freetype-py/blob/v2.5.1/.github/workflows/ci.yml (build)
name: Build freetype-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/freetype-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-freetype-py.yml'
      - 'docs/packages/freetype-py.yaml'
      - 'patches/freetype-py/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-freetype-py.yml'
      - 'docs/packages/freetype-py.yaml'
      - 'patches/freetype-py/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: freetype-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build freetype-py ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "freetype-py"
      version: "${{ matrix.version }}"
      repository: "rougier/freetype-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/freetype-py/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        ft_ver="$(sed -n 's/^FREETYPE_TARBALL = "freetype-\(.*\)\.tar\.xz"/\1/p' setup-build-freetype.py)"
        hb_ver="$(sed -n 's/^HARFBUZZ_TARBALL = "harfbuzz-\(.*\)\.tar\.xz"/\1/p' setup-build-freetype.py)"
        ft_tag="VER-$(echo "$ft_ver" | tr '.' '-')"
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/freetype/freetype/${ft_tag}/docs/FTL.TXT" -o LICENSE.FreeType.txt
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/harfbuzz/harfbuzz/${hb_ver}/COPYING" -o COPYING.HarfBuzz

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # setup.py's BdistWheel.get_tag() forces py3-none, so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # backend.py adds a `cmake` build dependency, but the `cmake` PyPI package has
      # no riscv64 wheel; use the image's own cmake and skip isolated dependency resolution.
      # setup.py's SharedLibBuildExt calls distutils.dir_util.mkpath()/file_util.copy_file()
      # with dry_run=, a kwarg setuptools >=81 dropped from its vendored distutils (gotcha 256).
      cibw-before-build: "dnf install -y cmake && pip install -q -U \"setuptools<81\" wheel \"setuptools_scm[toml]\" certifi"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # CMAKE_POLICY_VERSION_MINIMUM (gotcha 257) as an env var, not a `-D` flag:
      # setup-build-freetype.py's cmake invocations aren't ours to add flags to.
      cibw-environment-linux: "FREETYPEPY_BUNDLE_FT=yes PYTHON_ARCH=64 SETUPTOOLS_SCM_PRETEND_VERSION_FOR_FREETYPE_PY=${{ matrix.version }} CMAKE_POLICY_VERSION_MINIMUM=3.5"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      FREETYPE_PY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: freetype-py-${{ env.FREETYPE_PY_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the bundled library and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE.txt", "LICENSE.FreeType.txt", "COPYING.HarfBuzz"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("freetype/libfreetype.so") for n in names), whl
              licenses = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licenses == expected, f"{whl}: {sorted(licenses)}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish freetype-py ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: freetype-py-${{ matrix.version }}-*-manylinux_riscv64
