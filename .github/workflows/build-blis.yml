---
# This workflow is based on: https://github.com/explosion/cython-blis/blob/release-v1.3.3/.github/workflows/cibuildwheel.yml
name: Build blis wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/blis.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-blis.yml'
      - 'docs/packages/blis.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-blis.yml'
      - 'docs/packages/blis.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: blis
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build blis ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "blis"
      version: "${{ matrix.version }}"
      repository: "explosion/cython-blis"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py's get_arch_name() already picks the portable `generic` BLIS
      # config for any Linux machine that is not x86_64/aarch64/ppc64le.
      # Upstream tests in a separate workflow (tests.yml), which installs the
      # wheel, deletes the source tree and runs the suite. Up to 1.3.3 the suite
      # shipped inside the wheel (`pytest --pyargs blis`); from 1.3.4 it lives in
      # a top-level tests/ that [tool.cibuildwheel] test-sources copies next to
      # the installed wheel, so run pytest on it (pyproject's testpaths and
      # filterwarnings = error apply) and keep the old form for older versions.
      cibw-test-requires: "pytest hypothesis>=4.0.0,<7.0.0"
      cibw-test-command: "if [ -n \"$(ls -A tests 2>/dev/null)\" ]; then python -m pytest; else python -m pytest --pyargs blis -Werror; fi"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BLIS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: blis-${{ env.BLIS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              got = {n for n in names if n.endswith(".so")}
              assert len(got) == 2, f"expected blis.cy and blis.py extensions in {whl}, got {got}"
              print(whl, sorted(got))
          EOF

  publish:
    name: Publish blis ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: blis-${{ matrix.version }}-*-manylinux_riscv64
