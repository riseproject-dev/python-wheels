---
# This workflow is based on: https://github.com/explosion/cython-blis/blob/release-v1.3.3/.github/workflows/cibuildwheel.yml
name: Build blis wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/blis.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-blis.yml'
      - 'docs/packages/blis.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-blis.yml'
      - 'docs/packages/blis.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: blis
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build blis ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's [tool.cibuildwheel] skips `cp3??t-*`, so no free-threaded build.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      BLIS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cython-blis ${{ env.BLIS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/cython-blis
          ref: release-v${{ env.BLIS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py's get_arch_name() already picks the portable `generic` BLIS
          # config for any Linux machine that is not x86_64/aarch64/ppc64le.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream tests in a separate workflow (tests.yml), which installs the
          # wheel, deletes the source tree and runs the suite shipped inside it.
          CIBW_TEST_REQUIRES: pytest hypothesis>=4.0.0,<7.0.0
          CIBW_TEST_COMMAND: python -m pytest --pyargs blis -Werror

      - name: Check the compiled extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              got = {n for n in names if n.endswith(".so")}
              assert len(got) == 2, f"expected blis.cy and blis.py extensions in {whl}, got {got}"
              print(whl, sorted(got))
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: blis-${{ env.BLIS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish blis ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: blis-${{ matrix.version }}-*-manylinux_riscv64
