---
# This workflow is based on: https://github.com/biocore/biom-format/blob/2.1.17/.github/workflows/wheels.yml
name: Build biom-format wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/biom-format.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-biom-format.yml'
      - 'docs/packages/biom-format.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-biom-format.yml'
      - 'docs/packages/biom-format.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: biom-format
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build biom-format ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # pandas (a hard runtime requirement) publishes no cp314t wheel on
        # any platform or index, so the wheel itself builds fine but can't
        # be installed for testing under cp314t; skip only the test phase.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "biom-format"
      version: "${{ matrix.version }}"
      repository: "biocore/biom-format"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true
      patches-required: false

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy/scipy/pandas/h5py are build/runtime deps we ship on the
      # registry; pin resolution to our wheels so pip doesn't instead pick
      # PyPI's newer sdist-only releases (gotcha 84). cython has no
      # riscv64 wheel on the registry but compiles from sdist in seconds,
      # so it's left free to build.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pandas,h5py"
      cibw-test-skip: "${{ case(endsWith(matrix.python, 't'), '*', '') }}"

  publish:
    name: Publish biom-format ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: biom-format-${{ matrix.version }}-*-manylinux_riscv64
