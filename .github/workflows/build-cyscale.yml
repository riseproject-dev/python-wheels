---
# Based on the `build-wheels` job of
#   https://github.com/thewhaleking/cy-scale-codec/blob/v0.8.0/.github/workflows/deploypypi.yml
# and the test job of
#   https://github.com/thewhaleking/cy-scale-codec/blob/v0.8.0/.github/workflows/unittests.yml
name: Build cyscale wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyscale.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyscale.yml'
      - 'docs/packages/cyscale.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyscale.yml'
      - 'docs/packages/cyscale.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyscale
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyscale ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: upstream ships no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    env:
      CYSCALE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cyscale v${{ env.CYSCALE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: thewhaleking/cy-scale-codec
          ref: v${{ env.CYSCALE_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest base58>=2.0.1
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: >-
            python -c "import scalecodec.base as b, scalecodec.types as t;
            assert b.__file__.endswith('.so') and t.__file__.endswith('.so'), (b.__file__, t.__file__)" &&
            python -m pytest test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cyscale-${{ env.CYSCALE_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cyscale ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cyscale-${{ matrix.version }}-*riscv64
