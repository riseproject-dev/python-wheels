---
# Based on the `build-wheels` job of
#   https://github.com/thewhaleking/cy-scale-codec/blob/v0.8.0/.github/workflows/deploypypi.yml
# and the test job of
#   https://github.com/thewhaleking/cy-scale-codec/blob/v0.8.0/.github/workflows/unittests.yml
name: Build cyscale wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyscale.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyscale.yml'
      - 'docs/packages/cyscale.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyscale.yml'
      - 'docs/packages/cyscale.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyscale
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyscale ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cyscale
      version: ${{ matrix.version }}
      repository: thewhaleking/cy-scale-codec
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-requires: pytest base58>=2.0.1
      # test_valid_type_registry_presets lists the presets via test/../scalecodec/type_registry.
      cibw-test-sources: test scalecodec/type_registry
      cibw-test-command: >-
        python -c "import scalecodec.base as b, scalecodec.types as t;
        assert b.__file__.endswith('.so') and t.__file__.endswith('.so'), (b.__file__, t.__file__)" &&
        python -m pytest test
      timeout-minutes: 60

  publish:
    name: Publish cyscale ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cyscale-${{ matrix.version }}-*riscv64
