---
# Based on the `build_wheels` job of
# https://github.com/taleinat/fuzzysearch/blob/v0.8.1/.github/workflows/build.yml
name: Build fuzzysearch wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fuzzysearch.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzysearch.yml'
      - 'docs/packages/fuzzysearch.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzysearch.yml'
      - 'docs/packages/fuzzysearch.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fuzzysearch
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fuzzysearch ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cp314t re-enables the GIL on import (PyModule_Create, no Py_mod_gil
        # slot) and upstream ships no free-threaded wheel either.
        python: ["cp312", "cp313", "cp314"]

    env:
      FUZZYSEARCH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fuzzysearch v${{ env.FUZZYSEARCH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: taleinat/fuzzysearch
          ref: v${{ env.FUZZYSEARCH_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py's build_ext swallows any compile failure and falls back
          # to a pure-Python install with no REQUIRE_* knob to force; assert
          # the .so directly instead of trusting a green build.
          CIBW_TEST_COMMAND: >-
            python -c "import fuzzysearch._common as c, fuzzysearch._substitutions_only as s; assert c.__file__.endswith('.so') and s.__file__.endswith('.so'), (c.__file__, s.__file__)" &&
            python -m unittest discover -t "{project}" "{project}/tests"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzzysearch-${{ env.FUZZYSEARCH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fuzzysearch ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: fuzzysearch-${{ matrix.version }}-*-manylinux_riscv64
