---
# Based on the `build`/`deploy` jobs of
# https://github.com/harfbuzz/uharfbuzz/blob/v0.56.0/.github/workflows/ci.yml
name: Build uharfbuzz wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/uharfbuzz.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-uharfbuzz.yml'
      - 'docs/packages/uharfbuzz.yaml'
      - 'patches/uharfbuzz/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-uharfbuzz.yml'
      - 'docs/packages/uharfbuzz.yaml'
      - 'patches/uharfbuzz/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: uharfbuzz
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build uharfbuzz ${{ matrix.version }} ${{ startsWith(matrix.version, '0.56.') && 'cp310' || 'cp311' }}-abi3-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # abi3 (setup.py: bdist_wheel py_limited_api), so the single build on
        # the abi3 floor (gotcha 96: cp310 up to 0.56.x, cp311 from 0.57.0,
        # per python_requires) is loadable on every newer CPython; upstream
        # ships no free-threaded wheel (pyproject.toml skips cp3??t) so there
        # is no second build.
        libc: [manylinux, musllinux]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "uharfbuzz"
      version: "${{ matrix.version }}"
      repository: "harfbuzz/uharfbuzz"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ startsWith(matrix.version, '0.56.') && 'cp310' || 'cp311' }}-abi3-${{ matrix.libc }}_riscv64"
      checkout-submodules: "recursive"

      # The extension statically links the vendored HarfBuzz C++ sources
      # (harfbuzz/, a git submodule); their licence isn't otherwise shipped
      # in the wheel. See patches/uharfbuzz/0.56.0 for details.
      patches: true

      cibw-build: "${{ startsWith(matrix.version, '0.56.') && 'cp310' || 'cp311' }}-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # The riscv64-compat patch leaves the checkout dirty relative to the
      # tag, so setuptools_scm would otherwise compute a dev version.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      # Upstream's own repair-wheel-command pipes into a pipx-installed
      # abi3audit, which the riscv64 image doesn't carry (gotcha 217);
      # cibuildwheel's own default audit-command already abi3audits every
      # abi3-tagged wheel natively once this repair step finishes.
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"

  publish:
    name: Publish uharfbuzz ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: uharfbuzz-${{ matrix.version }}-*riscv64
