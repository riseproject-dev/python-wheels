---
# This workflow is based on the `cibw_wheels` job of
# https://github.com/andreasvc/pyre2/blob/v0.3.14/.github/workflows/release.yml
name: Build pyre2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyre2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyre2.yml'
      - 'docs/packages/pyre2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyre2.yml'
      - 'docs/packages/pyre2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # abseil-cpp version and re2 tag the already-published google-re2 build
  # proved on this image; reused here for the same reason (gotcha 51 below).
  ABSEIL_VERSION: '20250512.1'
  RE2_TAG: '2025-11-05'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyre2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyre2 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyre2"
      version: "${{ matrix.version }}"
      repository: "andreasvc/pyre2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 300
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyre2/${{ matrix.version }}/0001-pyproject-widen-license-files-to-cover-re2-and-abseil.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-environment-linux: "LIBRARY_PATH=/usr/local/lib LD_LIBRARY_PATH=/usr/local/lib SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYRE2=${{ matrix.version }} ABSEIL_VERSION=20250512.1 RE2_TAG=2025-11-05"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # Upstream's before-all installs EPEL's re2-devel, unavailable on
      # riscv64 (gotcha 51 - no EPEL there); build abseil-cpp + re2 from
      # source instead, installed so CMakeLists.txt's own
      # find_package(re2 CONFIG) picks them up unmodified.
      #
      # No riscv64 cmake wheel exists, so CIBW_BEFORE_BUILD's pip install
      # builds it from source as a build dependency; its own CMake
      # bootstrap needs OpenSSL's dev headers to find libcrypto for
      # Utilities/cmcurl (gotcha 608).
      cibw-before-all: "dnf -y install openssl-devel && mkdir -p /tmp/abseil-cpp && curl -sSLf \"https://github.com/abseil/abseil-cpp/archive/refs/tags/${ABSEIL_VERSION}.tar.gz\" | tar -xz -C /tmp/abseil-cpp --strip-components=1 && cmake -S /tmp/abseil-cpp -B /tmp/abseil-cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_STANDARD=17 -DABSL_PROPAGATE_CXX_STD=ON -DABSL_ENABLE_INSTALL=ON -DCMAKE_INSTALL_LIBDIR=lib && cmake --build /tmp/abseil-cpp/build --parallel --target install && mkdir -p /tmp/re2 && curl -sSLf \"https://github.com/google/re2/archive/refs/tags/${RE2_TAG}.tar.gz\" | tar -xz -C /tmp/re2 --strip-components=1 && cmake -S /tmp/re2 -B /tmp/re2/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_LIBDIR=lib && cmake --build /tmp/re2/build --parallel --target install && ldconfig && cp /tmp/re2/LICENSE {project}/LICENSE.re2 && cp /tmp/abseil-cpp/LICENSE {project}/LICENSE.abseil-cpp"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: "pip install setuptools \"setuptools_scm>=8\" \"Cython>=0.20\" \"pybind11>=2.12\" ninja \"cmake>=3.18,<4.0.0\""
      cibw-repair-wheel-command: "auditwheel repair --strip -w {dest_dir} {wheel}"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "pytest -v ."

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # riscv64 builds run several times slower than x86_64; raised from 90 after jobs were killed mid-build by the timeout, not a dead runner.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYRE2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyre2-${{ env.PYRE2_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("re2") and n.endswith(".so") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.re2") for n in names), whl
              assert any(n.endswith("licenses/LICENSE.abseil-cpp") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyre2 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyre2-${{ matrix.version }}-*-manylinux_riscv64
