---
# This workflow is based on:
#   https://github.com/gdsfactory/kfnetlist/blob/v0.2.2/.github/workflows/release.yml
#   https://github.com/gdsfactory/kfnetlist/blob/v0.2.2/.github/workflows/test.yml
name: Build kfnetlist wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kfnetlist.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kfnetlist.yml'
      - 'docs/packages/kfnetlist.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kfnetlist.yml'
      - 'docs/packages/kfnetlist.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kfnetlist
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build kfnetlist ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60

    env:
      KFNETLIST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout kfnetlist v${{ env.KFNETLIST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gdsfactory/kfnetlist
          ref: v${{ env.KFNETLIST_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          target: riscv64gc-unknown-linux-gnu
          manylinux: '2_39'
          # pyo3 carries abi3-py312 in Cargo.toml; upstream gets 3.12 from setup-python.
          args: -i python3.12 --release --out dist
          before-script-linux: git config --global --add safe.directory "*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kfnetlist-${{ env.KFNETLIST_VERSION }}-cp312-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test kfnetlist ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14']

    env:
      KFNETLIST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout kfnetlist v${{ env.KFNETLIST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gdsfactory/kfnetlist
          ref: v${{ env.KFNETLIST_VERSION }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: kfnetlist-${{ env.KFNETLIST_VERSION }}-cp312-abi3-manylinux_riscv64
          path: dist

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      # klayout (the `dev` extra) has no riscv64 wheel yet: its tests skip or are excluded.
      - name: Test wheel
        run: |
          uv pip install 'pytest>=9.0.3,<10' dist/*.whl
          python -c "import kfnetlist._native as n; assert n.__file__.endswith('.so'), n.__file__"
          python -m pytest -s tests \
            --ignore=tests/test_parser.py \
            --deselect=tests/test_placement.py::test_placement_for_reads_transform_and_bbox

  publish:
    name: Publish kfnetlist ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: kfnetlist-${{ matrix.version }}-*-manylinux_riscv64
