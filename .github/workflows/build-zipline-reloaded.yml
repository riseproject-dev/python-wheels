---
# This workflow is based on: https://github.com/stefan-jansen/zipline-reloaded/blob/3.1.1/.github/workflows/build_wheels.yml
name: Build zipline-reloaded wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zipline-reloaded.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zipline-reloaded.yml'
      - 'docs/packages/zipline-reloaded.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zipline-reloaded.yml'
      - 'docs/packages/zipline-reloaded.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zipline-reloaded
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zipline-reloaded ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's own build_wheels.yml matrix is cp310-cp313; narrowed here to
        # cp312-cp313. The [test] extras this wheel is installed with (below) pull in
        # tables, pillow and h5py: this registry's tables is abi3-py311 (no cp310
        # wheel at all), its h5py has no cp310 or cp311 wheel, and even its pillow
        # only starts at cp311 -- so cp310 can never satisfy [test] and cp311 is
        # missing h5py specifically. cp312/cp313 are the only legs every one of
        # those three dependencies actually covers.
        python:
          - "cp312"
          - "cp313"

    env:
      ZIPLINE_RELOADED_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout zipline-reloaded v${{ env.ZIPLINE_RELOADED_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: stefan-jansen/zipline-reloaded
          ref: ${{ env.ZIPLINE_RELOADED_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Shallow checkout has no tag history for setuptools_scm to read.
          # numpy/scipy/pandas are zipline-reloaded's own runtime deps, and
          # without PIP_ONLY_BINARY pip picks the highest version across both
          # indexes regardless of whether it has a riscv64 wheel, reaching
          # past our registry's build to PyPI's newer sdist-only release and
          # compiling it from source -- scipy's meson build needs OpenBLAS,
          # which the manylinux image lacks (dependencies-and-registry.md
          # gotcha 291). Pinning to wheel-only is safe here: numpy is also a
          # build-time dependency (build-system.requires), but our registry
          # (and now public PyPI) carries a riscv64 numpy wheel for every
          # interpreter in this matrix, so it isn't starved the way cython
          # would be (gotcha 12).
          # cibuildwheel's default test step (no CIBW_TEST_COMMAND override here) runs
          # `pip install <wheel>[test]`, whose [test] extras pull in tables/pillow/h5py
          # too; the same reasoning as numpy/scipy/pandas above applies to all three --
          # add them to PIP_ONLY_BINARY so pip uses this registry's riscv64 wheels
          # instead of reaching for a newer sdist-only PyPI release (tables needs
          # HDF5 headers, pillow needs libjpeg headers, neither on this image).
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ZIPLINE_RELOADED=${{ env.ZIPLINE_RELOADED_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pandas,tables,pillow,h5py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zipline-reloaded-${{ env.ZIPLINE_RELOADED_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zipline-reloaded ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: zipline-reloaded-${{ matrix.version }}-*-manylinux_riscv64
