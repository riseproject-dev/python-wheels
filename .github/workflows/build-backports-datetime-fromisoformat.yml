---
# Based on upstream's own wheel builder:
#   https://github.com/movermeyer/backports.datetime_fromisoformat/blob/v2.0.3/.github/workflows/publish.yml
name: Build backports-datetime-fromisoformat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'backports-datetime-fromisoformat version to build (git tag without leading v, e.g. 2.0.3)'
        required: true
        default: '2.0.3'
  pull_request:
    paths:
      - '.github/workflows/build-backports-datetime-fromisoformat.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.0.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.0.3 there.
  BACKPORTS_DATETIME_FROMISOFORMAT_VERSION: ${{ inputs.version || '2.0.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build backports-datetime-fromisoformat ${{ inputs.version || '2.0.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout backports.datetime_fromisoformat v${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: movermeyer/backports.datetime_fromisoformat
          ref: v${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest pytz
          CIBW_TEST_COMMAND: pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backports-datetime-fromisoformat-${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish backports-datetime-fromisoformat ${{ inputs.version || '2.0.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: backports-datetime-fromisoformat-${{ inputs.version || '2.0.3' }}-*-manylinux_riscv64
