---
# Based on upstream's own wheel builder:
#   https://github.com/movermeyer/backports.datetime_fromisoformat/blob/v2.0.3/.github/workflows/publish.yml
name: Build backports-datetime-fromisoformat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/backports-datetime-fromisoformat.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-backports-datetime-fromisoformat.yml'
      - 'docs/packages/backports-datetime-fromisoformat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-backports-datetime-fromisoformat.yml'
      - 'docs/packages/backports-datetime-fromisoformat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: backports-datetime-fromisoformat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build backports-datetime-fromisoformat ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      BACKPORTS_DATETIME_FROMISOFORMAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout backports.datetime_fromisoformat v${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: movermeyer/backports.datetime_fromisoformat
          ref: v${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest pytz
          CIBW_TEST_COMMAND: pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backports-datetime-fromisoformat-${{ env.BACKPORTS_DATETIME_FROMISOFORMAT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish backports-datetime-fromisoformat ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: backports-datetime-fromisoformat-${{ matrix.version }}-*-manylinux_riscv64
