---
# This workflow is based on: https://github.com/apache/arrow-nanoarrow/blob/apache-arrow-nanoarrow-0.9.0/.github/workflows/python-wheels.yaml
name: Build nanoarrow wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nanoarrow.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nanoarrow.yml'
      - 'docs/packages/nanoarrow.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nanoarrow.yml'
      - 'docs/packages/nanoarrow.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nanoarrow
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nanoarrow ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nanoarrow"
      version: "${{ matrix.version }}"
      repository: "apache/arrow-nanoarrow"
      ref: "apache-arrow-nanoarrow-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      # Upstream's wheels ship no licence files, nor those of the statically linked zstd/lz4.
      patches: true

      cibw-package-dir: "python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pyarrow"
      # The test extra (as in upstream's python.yaml) needs numpy/pyarrow, which have no musllinux_riscv64 wheels.
      cibw-test-extras: "${{ matrix.platform == 'manylinux' && 'test' || '' }}"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import importlib.metadata as md; lic = {p.name for p in md.files('nanoarrow') if '.dist-info/licenses/' in str(p)}; assert {'LICENSE.txt', 'NOTICE.txt', 'LICENSE.zstd', 'LICENSE.lz4'} <= lic, lic\" && pytest {package}/tests -vv"

  publish:
    name: Publish nanoarrow ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nanoarrow-${{ matrix.version }}-*riscv64
