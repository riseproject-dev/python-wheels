---
# This workflow is based on: https://github.com/apache/arrow-nanoarrow/blob/apache-arrow-nanoarrow-0.9.0/.github/workflows/python-wheels.yaml
name: Build nanoarrow wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nanoarrow.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nanoarrow.yml'
      - 'docs/packages/nanoarrow.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nanoarrow.yml'
      - 'docs/packages/nanoarrow.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nanoarrow
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nanoarrow ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      NANOARROW_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout arrow-nanoarrow ${{ env.NANOARROW_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: apache/arrow-nanoarrow
          ref: apache-arrow-nanoarrow-${{ env.NANOARROW_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Upstream's wheels ship no licence files, nor those of the statically linked zstd/lz4.
      - name: Patch arrow-nanoarrow source
        run: git apply python-wheels/patches/nanoarrow/${{ env.NANOARROW_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pyarrow
          # The test extra (as in upstream's python.yaml) needs numpy/pyarrow, which have no musllinux_riscv64 wheels.
          CIBW_TEST_EXTRAS: ${{ matrix.libc == 'manylinux' && 'test' || '' }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as md; lic = {p.name for p in md.files('nanoarrow') if '.dist-info/licenses/' in str(p)}; assert {'LICENSE.txt', 'NOTICE.txt', 'LICENSE.zstd', 'LICENSE.lz4'} <= lic, lic"
            && pytest {package}/tests -vv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nanoarrow-${{ env.NANOARROW_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish nanoarrow ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: nanoarrow-${{ matrix.version }}-*riscv64
