---
# This workflow is based on the `linux` job of
# https://github.com/mpm-tu-berlin/eflips-schedule-rust/blob/v3.0.2/.github/workflows/CI.yml
name: Build eflips-schedule-rust wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/eflips-schedule-rust.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-eflips-schedule-rust.yml'
      - 'docs/packages/eflips-schedule-rust.yaml'
      - 'patches/eflips-schedule-rust/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-eflips-schedule-rust.yml'
      - 'docs/packages/eflips-schedule-rust.yaml'
      - 'patches/eflips-schedule-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: eflips-schedule-rust
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build eflips-schedule-rust ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per interpreter (no abi3 feature, no
        # gil_used(false) declaration), matching upstream's own non-abi3
        # release matrix; cp314t is excluded like build-py-rust-stemmers.yml.
        python: ["cp312", "cp313", "cp314"]

    env:
      EFLIPS_SCHEDULE_RUST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout eflips-schedule-rust v${{ env.EFLIPS_SCHEDULE_RUST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mpm-tu-berlin/eflips-schedule-rust
          ref: v${{ env.EFLIPS_SCHEDULE_RUST_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/eflips-schedule-rust/${{ env.EFLIPS_SCHEDULE_RUST_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # eflips-schedule-rust ships no [tool.cibuildwheel], so the Rust
          # toolchain its maturin backend needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: networkx
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: >-
            python -c "import eflips_schedule_rust as m;
            assert m.__file__.endswith('.so'), m.__file__" &&
            python -m unittest discover -s test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eflips_schedule_rust-${{ env.EFLIPS_SCHEDULE_RUST_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish eflips-schedule-rust ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: eflips_schedule_rust-${{ matrix.version }}-*-manylinux_riscv64
