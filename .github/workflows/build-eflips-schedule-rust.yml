---
# This workflow is based on the `linux` job of
# https://github.com/mpm-tu-berlin/eflips-schedule-rust/blob/v3.0.2/.github/workflows/CI.yml
name: Build eflips-schedule-rust wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/eflips-schedule-rust.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-eflips-schedule-rust.yml'
      - 'docs/packages/eflips-schedule-rust.yaml'
      - 'patches/eflips-schedule-rust/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-eflips-schedule-rust.yml'
      - 'docs/packages/eflips-schedule-rust.yaml'
      - 'patches/eflips-schedule-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: eflips-schedule-rust
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build eflips-schedule-rust ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "eflips-schedule-rust"
      version: "${{ matrix.version }}"
      repository: "mpm-tu-berlin/eflips-schedule-rust"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # eflips-schedule-rust ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "networkx"
      cibw-test-sources: "test"
      # maturin ships this as a package wrapping a same-name compiled
      # submodule (no [tool.maturin] python-source and no <name>/ dir
      # in the checkout; gotcha 314), so the .so probe must
      # target eflips_schedule_rust.eflips_schedule_rust, not the
      # top-level __init__.py shim - same pattern as
      # build-py-rust-stemmers.yml.
      cibw-test-command: "python -c \"import eflips_schedule_rust.eflips_schedule_rust as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m unittest discover -s test"

  publish:
    name: Publish eflips-schedule-rust ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: eflips-schedule-rust-${{ matrix.version }}-*-manylinux_riscv64
