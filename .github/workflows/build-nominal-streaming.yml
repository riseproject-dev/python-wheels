---
# This workflow is based on the Linux legs of
# https://github.com/nominal-io/nominal-streaming/blob/v0.10.2/.github/workflows/wheels.yml
# and the `python-wheel-test` job of
# https://github.com/nominal-io/nominal-streaming/blob/v0.10.2/.github/workflows/validate.yml
name: Build nominal-streaming wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nominal-streaming.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nominal-streaming.yml'
      - 'docs/packages/nominal-streaming.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nominal-streaming.yml'
      - 'docs/packages/nominal-streaming.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nominal-streaming
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nominal-streaming ${{ matrix.version }} abi3 ${{ matrix.abi.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        abi:
          - { python: "3.10", feature: python310 }
          - { python: "3.11", feature: python311 }

    env:
      NOMINAL_STREAMING_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout nominal-streaming v${{ env.NOMINAL_STREAMING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nominal-io/nominal-streaming
          ref: v${{ env.NOMINAL_STREAMING_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -m py-nominal-streaming/Cargo.toml --no-default-features --features ${{ matrix.abi.feature }} -i python${{ matrix.abi.python }}
          manylinux: '2_39'
          before-script-linux: yum install -y perl-core openssl openssl-devel pkgconfig libatomic

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.abi.python }}
          enable-cache: false

      # fastavro and cramjam have no cp310/cp311 riscv64 wheels, so the floor interpreter runs only check_wheel.py.
      - name: Test wheel on minimum and current Python
        env:
          ABI_FEATURE: ${{ matrix.abi.feature }}
          PYTHON_FLOOR: ${{ matrix.abi.python }}
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_ONLY_BINARY: ':all:'
        run: |
          set -euo pipefail
          uv export --locked --only-group test --format requirements-txt --output-file "$RUNNER_TEMP/test-requirements.txt"
          for runtime in "$PYTHON_FLOOR" 3.14; do
            echo "::group::Test $ABI_FEATURE on Python $runtime"
            venv="$RUNNER_TEMP/wheel-$runtime"
            uv venv "$venv" --python "$runtime"
            uv pip install --python "$venv/bin/python" dist/*.whl
            "$venv/bin/python" -I py-nominal-streaming/tests/check_wheel.py "$ABI_FEATURE"
            if [ "$runtime" = 3.14 ]; then
              uv pip install --python "$venv/bin/python" --requirements "$RUNNER_TEMP/test-requirements.txt"
              "$venv/bin/python" -I -m unittest discover -s py-nominal-streaming/tests -v
            fi
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nominal-streaming-${{ env.NOMINAL_STREAMING_VERSION }}-${{ matrix.abi.feature }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish nominal-streaming ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: nominal-streaming-${{ matrix.version }}-*-manylinux_riscv64
