---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/dwavesystems/minorminer/blob/0.2.22/pyproject.toml
#   https://github.com/dwavesystems/minorminer/blob/0.2.22/.circleci/config.yml
name: Build minorminer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/minorminer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-minorminer.yml'
      - 'docs/packages/minorminer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-minorminer.yml'
      - 'docs/packages/minorminer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: minorminer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build minorminer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: minorminer
      version: ${{ matrix.version }}
      # The PyPI sdist contains the vendored glasgow-subgraph-solver and portable-snippets sources.
      source: pypi-sdist
      patches: true
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream itself skips musllinux (`skip = "pp* *musllinux*"` in pyproject.toml);
      # CIBW_BUILD overrides that config wholesale, so repeat the musllinux skip here.
      cibw-skip: "*-musllinux_*"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy,scipy
        PIP_PREFER_BINARY=1
        UV_ONLY_BINARY=numpy,scipy
        UV_PREFER_BINARY=1
        UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        UV_INDEX_STRATEGY=unsafe-best-match
        CIRCLECI=true
  publish:
    name: Publish minorminer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: minorminer-${{ matrix.version }}-*-manylinux_riscv64
