---
# Based on the `build-wheels-linux`/`build-wheels-musllinux` jobs of
# https://github.com/ebellocchia/python-ed25519-blake2b/blob/v1.4.2/.github/workflows/build-wheels.yml
name: Build ed25519-blake2b-fork wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ed25519-blake2b-fork.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ed25519-blake2b-fork.yml'
      - 'docs/packages/ed25519-blake2b-fork.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ed25519-blake2b-fork.yml'
      - 'docs/packages/ed25519-blake2b-fork.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ed25519-blake2b-fork
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ed25519-blake2b-fork ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no cp314t: the extension uses single-phase init, which re-enables the GIL.
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    env:
      ED25519_BLAKE2B_FORK_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-ed25519-blake2b ${{ env.ED25519_BLAKE2B_FORK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ebellocchia/python-ed25519-blake2b
          ref: v${{ env.ED25519_BLAKE2B_FORK_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: test_ed25519_kat.py kat-ed25519-blake2b.txt
          # The upstream tests use the failUnless*/failIf* aliases that Python 3.12 removed.
          CIBW_TEST_COMMAND: >-
            python -c "import unittest as u; T = u.TestCase;
            T.failUnless = T.assertTrue; T.failIfEqual = T.assertNotEqual;
            T.failUnlessEqual = T.assertEqual; T.failUnlessRaises = T.assertRaises;
            import ed25519_blake2b._ed25519 as e;
            assert e.__file__.endswith('.so'), e.__file__;
            u.main(module=None, argv=['unittest', '-v', 'ed25519_blake2b.test_ed25519', 'test_ed25519_kat'])"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ed25519-blake2b-fork-${{ env.ED25519_BLAKE2B_FORK_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ed25519-blake2b-fork ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ed25519-blake2b-fork-${{ matrix.version }}-*riscv64
