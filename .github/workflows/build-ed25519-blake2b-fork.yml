---
# Based on the `build-wheels-linux`/`build-wheels-musllinux` jobs of
# https://github.com/ebellocchia/python-ed25519-blake2b/blob/v1.4.2/.github/workflows/build-wheels.yml
name: Build ed25519-blake2b-fork wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ed25519-blake2b-fork.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ed25519-blake2b-fork.yml'
      - 'docs/packages/ed25519-blake2b-fork.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ed25519-blake2b-fork.yml'
      - 'docs/packages/ed25519-blake2b-fork.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ed25519-blake2b-fork
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ed25519-blake2b-fork ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ed25519-blake2b-fork
      version: ${{ matrix.version }}
      repository: ebellocchia/python-ed25519-blake2b
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-sources: test_ed25519_kat.py kat-ed25519-blake2b.txt
      # The upstream tests use the failUnless*/failIf* aliases that Python 3.12 removed.
      cibw-test-command: >-
        python -c "import unittest as u; T = u.TestCase;
        T.failUnless = T.assertTrue; T.failIfEqual = T.assertNotEqual;
        T.failUnlessEqual = T.assertEqual; T.failUnlessRaises = T.assertRaises;
        import ed25519_blake2b._ed25519 as e;
        assert e.__file__.endswith('.so'), e.__file__;
        u.main(module=None, argv=['unittest', '-v', 'ed25519_blake2b.test_ed25519', 'test_ed25519_kat'])"
      timeout-minutes: 60

  publish:
    name: Publish ed25519-blake2b-fork ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ed25519-blake2b-fork-${{ matrix.version }}-*riscv64
