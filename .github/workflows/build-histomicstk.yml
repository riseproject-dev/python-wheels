---
# This workflow is based on the `build_wheels` job of
# https://github.com/DigitalSlideArchive/HistomicsTK/blob/v1.4.0/.github/workflows/ci.yml
name: Build histomicstk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/histomicstk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-histomicstk.yml'
      - 'docs/packages/histomicstk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-histomicstk.yml'
      - 'docs/packages/histomicstk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: histomicstk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build histomicstk ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "histomicstk"
      version: "${{ matrix.version }}"
      repository: "DigitalSlideArchive/HistomicsTK"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      HISTOMICSTK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: histomicstk-${{ env.HISTOMICSTK_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[-1].split(".")[0] for n in names if n.endswith(".so")}
          expected = {
              "_trace_object_boundaries_cython",
              "_max_clustering_cython",
              "_compute_marginal_glcm_probs_cython",
          }
          assert expected <= exts, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          # No license_files in setup.py, so setuptools' default
          # LICEN[CS]E*/NOTICE*/AUTHORS* glob ships all three root files;
          # NOTICE is required by Apache-2.0 section 4(d).
          assert licences == {"LICENSE", "NOTICE", "AUTHORS.rst"}, licences
          EOF

  publish:
    name: Publish histomicstk ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: histomicstk-${{ matrix.version }}-*-manylinux_riscv64
