---
# This workflow is based on the `build-wheel` job of
# https://github.com/SleipnirGroup/Sleipnir/blob/v0.6.6/.github/workflows/python.yml
name: Build sleipnirgroup-jormungandr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sleipnirgroup-jormungandr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sleipnirgroup-jormungandr.yml'
      - 'docs/packages/sleipnirgroup-jormungandr.yaml'
      - 'patches/sleipnirgroup-jormungandr/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sleipnirgroup-jormungandr.yml'
      - 'docs/packages/sleipnirgroup-jormungandr.yaml'
      - 'patches/sleipnirgroup-jormungandr/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sleipnirgroup-jormungandr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sleipnirgroup-jormungandr ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sleipnirgroup-jormungandr"
      version: "${{ matrix.version }}"
      repository: "SleipnirGroup/Sleipnir"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-fetch-depth: 0
      pre-build: |-
        git fetch --tags --force origin
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/sleipnirgroup-jormungandr/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        python3 ./tools/update_version.py --release
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pybind11_mkdoc generates the bindings' docstrings at build time and
      # needs a system clang++/libclang (AppStream ships both on Rocky 10).
      cibw-before-all-linux: "dnf -y --enablerepo=crb install clang clang-devel && curl -fsSL --retry 5 \"https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.README\" > /project/LICENSE.eigen && curl -fsSL --retry 5 \"https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.MPL2\" >> /project/LICENSE.eigen && curl -fsSL --retry 5 \"https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.BSD\" >> /project/LICENSE.eigen && curl -fsSL --retry 5 \"https://raw.githubusercontent.com/gharveymn/small_vector/efcab60e5360b699f45d2a44dcb9a79bba40c356/LICENSE\" -o /project/LICENSE.small_vector && curl -fsSL --retry 5 \"https://raw.githubusercontent.com/wjakob/nanobind/v3.0.1/LICENSE\" -o /project/LICENSE.nanobind"
      # numpy, matplotlib and pillow (python/pyproject.toml's runtime deps,
      # pulled in when the test step installs the built wheel) have riscv64
      # wheels on our registry that trail the latest PyPI release; without
      # PIP_ONLY_BINARY pip resolves the newest sdist-only release instead,
      # and pillow's then fails to build from source for lack of libjpeg
      # headers in the manylinux image (gotcha 422).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,matplotlib,pillow"
      cibw-test-requires: "pytest"
      cibw-test-sources: "python/test examples pyproject.toml"
      # test_max_iterations_exceeded/test_timeout/test_problem_spy each
      # need a genuinely non-default Problem.solve() keyword argument
      # (max_iterations=0 / timeout=0.0 / spy=True) that can't be
      # dropped like 0003's patch drops diagnostics=True/False
      # elsewhere, so they still hit the std::bad_cast in gotcha 710.
      cibw-test-command: "pytest -k \"not (test_max_iterations_exceeded or test_timeout or test_problem_spy)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      JORMUNGANDR_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sleipnirgroup-jormungandr-${{ env.JORMUNGANDR_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "sleipnir/_sleipnir.abi3.so" in names, names
          licences = {n.rsplit("/", 1)[-1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt", "LICENSE.eigen", "LICENSE.small_vector", "LICENSE.nanobind"}, licences
          EOF

  gpl_sources:
    name: Collect GPL sources for sleipnirgroup-jormungandr ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: sleipnirgroup-jormungandr
      version: ${{ matrix.version }}
      packages: gcc

  publish:
    name: Publish sleipnirgroup-jormungandr ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sleipnirgroup-jormungandr-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: sleipnirgroup-jormungandr-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
