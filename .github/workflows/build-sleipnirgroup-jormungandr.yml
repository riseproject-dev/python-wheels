---
# This workflow is based on the `build-wheel` job of
# https://github.com/SleipnirGroup/Sleipnir/blob/v0.6.6/.github/workflows/python.yml
name: Build sleipnirgroup-jormungandr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sleipnirgroup-jormungandr.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sleipnirgroup-jormungandr.yml'
      - 'docs/packages/sleipnirgroup-jormungandr.yaml'
      - 'patches/sleipnirgroup-jormungandr/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sleipnirgroup-jormungandr.yml'
      - 'docs/packages/sleipnirgroup-jormungandr.yaml'
      - 'patches/sleipnirgroup-jormungandr/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sleipnirgroup-jormungandr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sleipnirgroup-jormungandr ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # wheel.python_abi = "abi3" (abi3_minimum_cpython_version 312) makes the
        # cp312 build an abi3 wheel for 3.12+; upstream builds no free-threaded wheel.
        python: [cp312]

    env:
      JORMUNGANDR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout Sleipnir v${{ env.JORMUNGANDR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SleipnirGroup/Sleipnir
          ref: v${{ env.JORMUNGANDR_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      # https://github.com/actions/checkout/issues/882
      - run: git fetch --tags --force origin

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        # 0003 disables Problem.solve()'s diagnostics=True argument in
        # python/test's own tests: the print path it takes throws
        # std::bad_cast on manylinux_2_39_riscv64's GCC 14.3.1 (gotcha 693),
        # unrelated to the actual solve()/ExitStatus/value() assertions.
        run: git apply python-wheels/patches/sleipnirgroup-jormungandr/${{ env.JORMUNGANDR_VERSION }}/*.patch

      - run: python3 ./tools/update_version.py --release

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pybind11_mkdoc generates the bindings' docstrings at build time and
          # needs a system clang++/libclang (AppStream ships both on Rocky 10).
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y --enablerepo=crb install clang clang-devel &&
            curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.README" > /project/LICENSE.eigen &&
            curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.MPL2" >> /project/LICENSE.eigen &&
            curl -fsSL --retry 5 "https://gitlab.com/libeigen/eigen/-/raw/406f412fa43706c60c678b04ed30338e6c93503d/COPYING.BSD" >> /project/LICENSE.eigen &&
            curl -fsSL --retry 5 "https://raw.githubusercontent.com/gharveymn/small_vector/efcab60e5360b699f45d2a44dcb9a79bba40c356/LICENSE" -o /project/LICENSE.small_vector &&
            curl -fsSL --retry 5 "https://raw.githubusercontent.com/wjakob/nanobind/v3.0.1/LICENSE" -o /project/LICENSE.nanobind
          # numpy, matplotlib and pillow (python/pyproject.toml's runtime deps,
          # pulled in when the test step installs the built wheel) have riscv64
          # wheels on our registry that trail the latest PyPI release; without
          # PIP_ONLY_BINARY pip resolves the newest sdist-only release instead,
          # and pillow's then fails to build from source for lack of libjpeg
          # headers in the manylinux image (gotcha 422).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,matplotlib,pillow
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: python/test examples pyproject.toml
          CIBW_TEST_COMMAND: pytest

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "sleipnir/_sleipnir.abi3.so" in names, names
          licences = {n.rsplit("/", 1)[-1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt", "LICENSE.eigen", "LICENSE.small_vector", "LICENSE.nanobind"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sleipnirgroup-jormungandr-${{ env.JORMUNGANDR_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (gcc) for sleipnirgroup-jormungandr ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      JORMUNGANDR_VERSION: ${{ matrix.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sleipnirgroup-jormungandr-${{ env.JORMUNGANDR_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish sleipnirgroup-jormungandr ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: sleipnirgroup-jormungandr-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: sleipnirgroup-jormungandr-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
