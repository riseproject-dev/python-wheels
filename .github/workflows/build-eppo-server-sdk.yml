---
# This workflow is based on the `linux` job of
# https://github.com/Eppo-exp/rust-sdk/blob/python-sdk%404.4.1/.github/workflows/python.yml
name: Build eppo-server-sdk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/eppo-server-sdk.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-eppo-server-sdk.yml'
      - 'docs/packages/eppo-server-sdk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-eppo-server-sdk.yml'
      - 'docs/packages/eppo-server-sdk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: eppo-server-sdk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build eppo-server-sdk ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no free-threaded wheel and its pyo3 module does not declare gil_used.
        python: ['cp312', 'cp313', 'cp314']

    env:
      EPPO_SERVER_SDK_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout rust-sdk python-sdk@${{ env.EPPO_SERVER_SDK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Eppo-exp/rust-sdk
          ref: python-sdk@${{ env.EPPO_SERVER_SDK_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i ${{ steps.interp.outputs.value }} --manifest-path ./python-sdk/Cargo.toml
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      # nodejs.org publishes no riscv64 build; the mock server only needs a stock Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          mirror: https://unofficial-builds.nodejs.org/download/release

      - name: pytest
        run: |
          set -ex
          uv pip install eppo-server-sdk --no-index --find-links dist --force-reinstall
          uv pip install pytest cachetools
          python -c "import importlib.metadata as md;
          files = [str(p) for p in md.files('eppo-server-sdk')];
          assert any(p.endswith('.so') for p in files), files;
          assert any(p.endswith('licenses/LICENSE') for p in files), files"
          npm ci
          npm run with-server test:python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eppo-server-sdk-${{ env.EPPO_SERVER_SDK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish eppo-server-sdk ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: eppo-server-sdk-${{ matrix.version }}-*-manylinux_riscv64
