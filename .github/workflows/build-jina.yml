---
# This workflow is based on the `build-wheels` job of
# https://github.com/jina-ai/jina/blob/v3.34.0/.github/workflows/cd.yml
name: Build jina wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jina.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jina.yml'
      - 'docs/packages/jina.yaml'
      - 'patches/jina/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jina.yml'
      - 'docs/packages/jina.yaml'
      - 'patches/jina/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  GO_VERSION: '1.26.8'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jina
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jina ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jina"
      version: "${{ matrix.version }}"
      repository: "jina-ai/jina"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/jina/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      cibw-before-all-linux: "curl -sSfL https://go.dev/dl/go1.26.8.linux-riscv64.tar.gz | tar -zx -C /usr/local/"
      # jraft.go's `#cgo pkg-config: python3` needs the target interpreter's python3.pc.
      # docarray pulls in orjson>=3.8.2 with no upper bound; pip's default resolves
      # the newest orjson (3.13.0), which this registry only ships for cp312+, and
      # falls back to building orjson's sdist from source -- which fails outright
      # (no rustup riscv64 target). PIP_ONLY_BINARY keeps pip off that sdist path so
      # it backtracks to 3.11.9, the newest version this registry publishes for
      # cp310/cp311.
      cibw-environment-linux: "PATH=\"/usr/local/go/bin:$PATH\" PKG_CONFIG_PATH=\"$(python -c 'import sysconfig; print(sysconfig.get_config_var(\"LIBPC\"))')\" PIP_ONLY_BINARY=orjson"
      # jina-hubble-sdk imports pkg_resources at module level; the test venv has no
      # setuptools and setuptools 82 removed pkg_resources (gotchas 29/361).
      cibw-test-requires: "setuptools<82"
      cibw-test-command: "python -c \"import jina; import jraft\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      JINA_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: jina-${{ env.JINA_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert sos == ["jraft.abi3.so"], names
          EOF

  publish:
    name: Publish jina ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jina-${{ matrix.version }}-*-manylinux_riscv64
