---
# This workflow is based on upstream's own wheel build:
#   https://github.com/pikepdf/pikepdf/blob/v10.12.0/.github/workflows/build.yml (wheels_linux)
name: Build pikepdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pikepdf version/tag to build'
        required: true
        default: '10.12.0'
  pull_request:
    paths:
      - '.github/workflows/build-pikepdf.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '10.12.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PIKEPDF_VERSION: ${{ inputs.version || '10.12.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pikepdf ${{ inputs.version || '10.12.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    # before-all downloads and compiles qpdf (CMake) before the pikepdf extension itself.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pikepdf ${{ env.PIKEPDF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pikepdf/pikepdf
          ref: v${{ env.PIKEPDF_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # CIBW_ENVIRONMENT replaces, not merges, upstream's [tool.cibuildwheel.environment]
          # table, so QPDF_* (consumed by before-all's build-scripts/*.bash) must be repeated
          # alongside our registry (CLAUDE.md gotcha 107).
          CIBW_ENVIRONMENT: >-
            QPDF_MIN_VERSION=12.3.2
            QPDF_VERSION=12.3.2
            QPDF_PATTERN=https://github.com/qpdf/qpdf/releases/download/vVERSION/qpdf-VERSION.tar.gz
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # hypothesis switched its build backend to maturin; newer releases have no
          # riscv64 wheel anywhere, and maturin's rustup auto-install does not support
          # riscv64 as a host triple. Our registry ships a wheel, so stay on it (gotcha 12:
          # only-binary belongs in CIBW_TEST_ENVIRONMENT, not CIBW_ENVIRONMENT).
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=hypothesis

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pikepdf-${{ env.PIKEPDF_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pikepdf ${{ inputs.version || '10.12.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pikepdf-${{ inputs.version || '10.12.0' }}-*-manylinux_riscv64
