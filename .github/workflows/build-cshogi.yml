---
# This workflow is based on: https://github.com/TadaoYamaoka/cshogi/blob/v1.0.9/.github/workflows/publish.yml
name: Build cshogi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cshogi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cshogi.yml'
      - 'docs/packages/cshogi.yaml'
      - 'patches/cshogi/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cshogi.yml'
      - 'docs/packages/cshogi.yaml'
      - 'patches/cshogi/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cshogi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cshogi ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cshogi"
      version: "${{ matrix.version }}"
      repository: "TadaoYamaoka/cshogi"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      # setup.py defines HAVE_SSE4/HAVE_SSE42/HAVE_AVX2 on every arch and
      # src/common.hpp only #undefs them for arm64, so on riscv64 it includes
      # <immintrin.h> and uses SSE intrinsics. The patch adds __riscv to the
      # arm64 guards (portable Bitboard + endianness.h bswap64).
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py's build_ext only adds -msse4.2/-mavx2 on x86_64 (riscv64
      # falls through to plain -std=c++17). --no-build-isolation means
      # before_build must install the whole [build-system] requires,
      # setuptools included (the manylinux CPythons ship without it).
      cibw-before-build: "pip install setuptools \"Cython>=3.1.4\" numpy"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: "python -c \"import cshogi; b = cshogi.Board(); print(b.sfen())\""

  publish:
    name: Publish cshogi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cshogi-${{ matrix.version }}-*-manylinux_riscv64
