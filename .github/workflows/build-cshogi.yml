---
# This workflow is based on: https://github.com/TadaoYamaoka/cshogi/blob/v1.0.9/.github/workflows/publish.yml
name: Build cshogi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cshogi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cshogi.yml'
      - 'docs/packages/cshogi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cshogi.yml'
      - 'docs/packages/cshogi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cshogi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cshogi ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Cython extension built per-interpreter (not abi3); upstream's own
        # publish.yml builds cp310-cp314 the same way.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CSHOGI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cshogi v${{ env.CSHOGI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TadaoYamaoka/cshogi
          ref: v${{ env.CSHOGI_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py's build_ext only adds x86/arm SIMD flags for those arches
          # (riscv64 falls through to plain -std=c++17); none of the HAVE_SSE4/
          # HAVE_AVX2 defines are actually referenced anywhere in src/*.cpp, so
          # they're harmless on riscv64.
          CIBW_BEFORE_BUILD: pip install "Cython>=3.1.4" numpy
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_COMMAND: >-
            python -c "import cshogi; b = cshogi.Board(); print(b.sfen())"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cshogi-${{ env.CSHOGI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cshogi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cshogi-${{ matrix.version }}-*-manylinux_riscv64
