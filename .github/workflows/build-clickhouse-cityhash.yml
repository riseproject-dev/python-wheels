---
# Based on the `wheels-linux`/`wheels-linux-non-x86` jobs of
# https://github.com/xzkostyan/clickhouse-cityhash/blob/1.0.2.6/.github/workflows/actions.yml
name: Build clickhouse-cityhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clickhouse-cityhash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-cityhash.yml'
      - 'docs/packages/clickhouse-cityhash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clickhouse-cityhash.yml'
      - 'docs/packages/clickhouse-cityhash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clickhouse-cityhash
      # The pinned Cython<3.1 does not compile against free-threaded headers.
      python-exclude: 'cp39 cp3*t'
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clickhouse-cityhash ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: clickhouse-cityhash
      version: ${{ matrix.version }}
      repository: xzkostyan/clickhouse-cityhash
      ref: 1.0.2.6post1
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's "1.0.2.6" tag predates the setup.py version bump (still reads
      # VERSION = '1.0.2.5'); the bump landed one commit later, tagged "1.0.2.6post1".
      # Update alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-requires: pytest
      # The checkout root ships clickhouse_cityhash/__init__.py alongside tests/,
      # which would shadow the installed wheel (gotcha 25); stage only tests/.
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import clickhouse_cityhash.cityhash as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish clickhouse-cityhash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clickhouse-cityhash-${{ matrix.version }}-*riscv64
