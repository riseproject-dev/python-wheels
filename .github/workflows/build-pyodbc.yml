---
# This workflow is based on the `build_ubuntu_manylinux_wheels` job of
# https://github.com/mkleehammer/pyodbc/blob/5.3.0/.github/workflows/artifacts_build.yml
name: Build pyodbc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyodbc.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyodbc.yml'
      - 'docs/packages/pyodbc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyodbc.yml'
      - 'docs/packages/pyodbc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyodbc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyodbc ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYODBC_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyodbc ${{ env.PYODBC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mkleehammer/pyodbc
          ref: ${{ env.PYODBC_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: dnf -y install unixODBC-devel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude "libodbc.so.*"
            --wheel-dir {dest_dir}
            {wheel}
          # Upstream's wheel jobs run no tests at all; its test workflow needs database
          # servers supplied as GitHub services. PostgreSQL and its ODBC driver are both
          # packaged for riscv64, so run upstream's PostgreSQL suite against a server
          # started inside the build container.
          CIBW_BEFORE_TEST_LINUX: >-
            dnf -y install postgresql-server postgresql-odbc &&
            install -d -o postgres -g postgres /run/postgresql /var/lib/pgsql/data &&
            su postgres -c "/usr/bin/initdb -A trust -D /var/lib/pgsql/data" &&
            su postgres -c "/usr/bin/pg_ctl -D /var/lib/pgsql/data -l /tmp/pg.log -o '-c listen_addresses=127.0.0.1' -w start" &&
            su postgres -c "/usr/bin/createdb test"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_ENVIRONMENT: PYODBC_POSTGRESQL="DRIVER=PostgreSQL;SERVER=127.0.0.1;PORT=5432;UID=postgres;DATABASE=test"
          CIBW_TEST_COMMAND: python -m pytest --no-header -v ./tests/postgresql_test.py

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyodbc.") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyodbc-${{ env.PYODBC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyodbc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyodbc-${{ matrix.version }}-*-manylinux_riscv64
