---
# This workflow is based on the `build_ubuntu_manylinux_wheels` job of
# https://github.com/mkleehammer/pyodbc/blob/5.3.0/.github/workflows/artifacts_build.yml
name: Build pyodbc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyodbc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyodbc.yml'
      - 'docs/packages/pyodbc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyodbc.yml'
      - 'docs/packages/pyodbc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyodbc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyodbc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyodbc"
      version: "${{ matrix.version }}"
      repository: "mkleehammer/pyodbc"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf -y install unixODBC-devel"
      cibw-repair-wheel-command-linux: "auditwheel repair --exclude \"libodbc.so.*\" --wheel-dir {dest_dir} {wheel}"
      # Upstream's wheel jobs run no tests at all; its test workflow needs database
      # servers supplied as GitHub services. PostgreSQL and its ODBC driver are both
      # packaged for riscv64, so run upstream's PostgreSQL suite against a server
      # started inside the build container.
      cibw-before-test-linux: "dnf -y install postgresql-server postgresql-odbc && install -d -o postgres -g postgres /run/postgresql /var/lib/pgsql/data && su postgres -c \"/usr/bin/initdb -A trust -D /var/lib/pgsql/data\" && su postgres -c \"/usr/bin/pg_ctl -D /var/lib/pgsql/data -l /tmp/pg.log -o '-c listen_addresses=127.0.0.1' -w start\" && su postgres -c \"/usr/bin/createdb test\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-environment: "PYODBC_POSTGRESQL=\"DRIVER=PostgreSQL;SERVER=127.0.0.1;PORT=5432;UID=postgres;DATABASE=test\""
      cibw-test-command: "python -m pytest --no-header -v ./tests/postgresql_test.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYODBC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyodbc-${{ env.PYODBC_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyodbc.") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyodbc ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyodbc-${{ matrix.version }}-*-manylinux_riscv64
