---
# Based on upstream's wheel builder:
#   https://github.com/efrenbl/tree-sitter-dart/blob/main/.github/workflows/release.yml
name: Build tree-sitter-dart wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tree-sitter-dart version to build (git tag without leading v, e.g. 0.1.0)'
        required: true
        default: '0.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-tree-sitter-dart.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TREE_SITTER_DART_VERSION: ${{ inputs.version || '0.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tree-sitter-dart ${{ inputs.version || '0.1.0' }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Checkout tree-sitter-dart v${{ env.TREE_SITTER_DART_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: efrenbl/tree-sitter-dart
          ref: v${{ env.TREE_SITTER_DART_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: tree-sitter>=0.23
          CIBW_TEST_COMMAND: >-
            python -c "import tree_sitter_dart;
            from tree_sitter import Language, Parser;
            t = Parser(Language(tree_sitter_dart.language())).parse(b'class A { (int,String) m() => (1, q); }');
            assert t.root_node.type == 'program' and not t.root_node.has_error"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-dart-${{ env.TREE_SITTER_DART_VERSION }}-cp38-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tree-sitter-dart ${{ inputs.version || '0.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tree-sitter-dart-${{ inputs.version || '0.1.0' }}-*-manylinux_riscv64
