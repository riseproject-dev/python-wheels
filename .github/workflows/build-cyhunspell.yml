---
# This workflow is based on upstream's own setup.py/build_hunspell.py; the repo
# ships no CI workflow of its own to mirror (no .github/workflows at all).
name: Build cyhunspell wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyhunspell.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyhunspell.yml'
      - 'docs/packages/cyhunspell.yaml'
      - 'patches/cyhunspell/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyhunspell.yml'
      - 'docs/packages/cyhunspell.yaml'
      - 'patches/cyhunspell/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyhunspell
      version: ${{ inputs.version }}
      python-exclude: ''

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyhunspell ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cyhunspell"
      version: "${{ matrix.version }}"
      repository: "MSeal/cython_hunspell"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py's build_hunspell.py downloads hunspell 1.7.0 and builds it
      # with autoreconf/configure/make on every build; its configure.ac pulls
      # in AM_GNU_GETTEXT, whose m4 macros/autopoint are absent from the image.
      cibw-before-all-linux: "dnf install -y gettext"
      # setup.py compiles the tag's checked-in hunspell.cpp, generated by
      # Cython 0.29.21 (#includes longintrepr.h, gone since CPython 3.11);
      # regenerate it from the .pyx with Cython 3 before every build.
      cibw-before-build: "pip install \"cython>=3.1\" && cython -3 --cplus hunspell/hunspell.pyx"
      # tests/hunspell_test.py locates its dictionaries via a path relative to
      # the test file (../hunspell/dictionaries); stage only the data (no
      # __init__.py) so it doesn't shadow the installed wheel's hunspell
      # package (CLAUDE.md gotcha 389).
      cibw-test-sources: "tests hunspell/dictionaries"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest tests"

  publish:
    name: Publish cyhunspell ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cyhunspell-${{ matrix.version }}-*-manylinux_riscv64
