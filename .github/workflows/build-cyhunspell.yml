---
# This workflow is based on upstream's own setup.py/build_hunspell.py; the repo
# ships no CI workflow of its own to mirror (no .github/workflows at all).
name: Build cyhunspell wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyhunspell.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyhunspell.yml'
      - 'docs/packages/cyhunspell.yaml'
      - 'patches/cyhunspell/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyhunspell.yml'
      - 'docs/packages/cyhunspell.yaml'
      - 'patches/cyhunspell/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyhunspell
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyhunspell ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CYHUNSPELL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cython_hunspell ${{ env.CYHUNSPELL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MSeal/cython_hunspell
          ref: ${{ env.CYHUNSPELL_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py's build_hunspell.py downloads hunspell 1.7.0 and builds it
          # with autoreconf/configure/make on every build; its configure.ac pulls
          # in AM_GNU_GETTEXT, whose m4 macros/autopoint are absent from the image.
          CIBW_BEFORE_ALL_LINUX: dnf install -y gettext
          # tests/hunspell_test.py locates its dictionaries via a path relative to
          # the test file (../hunspell/dictionaries); stage only the data (no
          # __init__.py) so it doesn't shadow the installed wheel's hunspell
          # package (CLAUDE.md gotcha 389).
          CIBW_TEST_SOURCES: tests hunspell/dictionaries
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cyhunspell-${{ env.CYHUNSPELL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cyhunspell ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cyhunspell-${{ matrix.version }}-*-manylinux_riscv64
