---
# pytest-mergify has no public source repository: upstream's README (since
# Mergifyio/pytest-mergify#517) says development moved to
# Mergifyio/mergify-ci-integrations, a private monorepo this build cannot
# check out. The released sdist is self-contained -- it carries the whole
# Cargo workspace maturin needs (root Cargo.toml/Cargo.lock, crates/*, the
# clients/pytest-mergify crate and its tests) -- so it is fetched from PyPI
# and fed to cibuildwheel directly, as the closest available thing to
# upstream (gotcha 156).
name: Build pytest-mergify wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pytest-mergify.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pytest-mergify.yml'
      - 'docs/packages/pytest-mergify.yaml'
      - 'patches/pytest-mergify/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pytest-mergify.yml'
      - 'docs/packages/pytest-mergify.yaml'
      - 'patches/pytest-mergify/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pytest-mergify
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pytest-mergify ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pytest-mergify"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export PYTEST_MERGIFY_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        url="$(curl -sSfL "https://pypi.org/pypi/pytest-mergify/${PYTEST_MERGIFY_VERSION}/json" \
          | python3 -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"))')"
        curl -sSfL -o sdist.tar.gz "$url"
        tar xzf sdist.tar.gz
        test -f "pytest_mergify-${PYTEST_MERGIFY_VERSION}/pyproject.toml"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        git apply -p1 --directory "pytest_mergify-${PYTEST_MERGIFY_VERSION}" python-wheels/patches/pytest-mergify/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "pytest_mergify-${{ matrix.version }}"
      # pyo3's abi3-py39 feature (patched from upstream's abi3-py38 --
      # gotcha 96) is on unconditionally, so one cp39-abi3 wheel serves
      # every GIL-ful interpreter; upstream ships no free-threaded wheel
      # because abi3 and Py_GIL_DISABLED only meet on 3.14+. cibuildwheel
      # compiles once on cp39 -- the riscv64 image's oldest interpreter --
      # and re-tests that wheel on the newer ones. musllinux is dropped:
      # rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp39-manylinux_riscv64 cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # pyproject.toml ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest-timeout pytest-xdist freezegun anys opentelemetry-proto>=1.29"
      # Relative to cwd (the workspace root, where the sdist was
      # extracted beside python-wheels/), not to package-dir --
      # copy_test_sources() resolves CIBW_TEST_SOURCES against the
      # former (gotcha 156).
      cibw-test-sources: "pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests"
      # PYTHONNODEBUGRANGES=1 turns off PEP 657 fine-grained error
      # locations (the caret-underline line under a failing statement):
      # without it, tests/test_spans.py::test_test_failure's expected
      # span attributes (recorded without that line) mismatch the
      # traceback pytest renders on 3.11+, on every interpreter here.
      #
      # test_ci_insights.py's flaky-detection tests repeat a trivial
      # assertion for as long as a fixed 4-second CPU-time budget lasts,
      # then assert the exact iteration count that produced ("tested 717
      # times" vs. an expected 1001+) - a function of host CPU speed, not
      # of this port. Deselected rather than patched: nothing here is
      # riscv64-specific, and a hardcoded count would just as likely fail
      # on any other sufficiently slower host.
      cibw-test-command: "env PYTHONNODEBUGRANGES=1 python -m pytest -v pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_for_new_tests --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_for_unhealthy_tests --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_with_fixtures --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_with_only_one_new_test_at_the_end --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_slow_test_not_reran --deselect pytest_mergify-${{ matrix.version }}/clients/pytest-mergify/tests/test_ci_insights.py::test_flaky_detection_excludes_opted_out_tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYTEST_MERGIFY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pytest-mergify-${{ env.PYTEST_MERGIFY_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "pytest_mergify/_mergify_ci.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish pytest-mergify ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pytest-mergify-${{ matrix.version }}-*-manylinux_riscv64
