---
# Based on: https://github.com/vmprof/vmprof-python/blob/release-0.6.0/.github/workflows/cibuildwheel.yml
name: Build vmprof wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vmprof.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vmprof.yml'
      - 'docs/packages/vmprof.yaml'
      - 'patches/vmprof/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vmprof.yml'
      - 'docs/packages/vmprof.yaml'
      - 'patches/vmprof/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  LIBUNWIND_VERSION: '1.8.3'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vmprof
      # Upstream excludes free-threaded CPython, which vmprof does not support.
      python-exclude: 'cp39 cp3*t'
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vmprof ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "vmprof"
      version: "${{ matrix.version }}"
      repository: "vmprof/vmprof-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/vmprof/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's before-build is a plain `dnf install -y libunwind-devel`, which
      # works on their manylinux_2_28 (AlmaLinux 8) images. RHEL 10 (what
      # manylinux_2_39 riscv64 is built on) dropped libunwind to EPEL, and manylinux
      # enables no EPEL on riscv64, so the package simply doesn't exist here
      # (CLAUDE.md gotcha 140). Build it from source instead: 1.8.3 has riscv64
      # support since 1.7.0 and `--libdir=/usr/lib64` is load-bearing since
      # autotools otherwise installs to /usr/lib, off the riscv64 linker/pkg-config
      # path.
      cibw-before-build-linux: "cd /tmp && curl -fsSLO https://github.com/libunwind/libunwind/releases/download/v1.8.3/libunwind-1.8.3.tar.gz && tar xf libunwind-1.8.3.tar.gz && cd libunwind-1.8.3 && ./configure --prefix=/usr --libdir=/usr/lib64 --disable-documentation --disable-tests --disable-minidebuginfo --disable-zlibdebuginfo && make -j\"$(nproc)\" install"
      cibw-test-groups: "test"
      # Native (C-stack) profiling is compiled in only for x86/x86_64/ppc64
      # (VMP_SUPPORTS_NATIVE_PROFILING in src/vmprof.h); on riscv64, as on
      # aarch64, `native=True` is a silent no-op, so test_gzip_call never sees
      # its native frame. Upstream already skips the other native-only tests
      # with `skipif("not hasattr(_vmprof, 'resolve_addr')")` (they SKIP here
      # too); this one lacks that guard, and upstream never runs the suite on
      # aarch64 (CIBW_TEST_SKIP).
      cibw-test-command: "cd {package} && pytest vmprof jitlog -vv --deselect vmprof/test/test_run.py::TestNative::test_gzip_call"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      VMPROF_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: vmprof-${{ env.VMPROF_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              # meson.build's py.extension_module('_vmprof', ...) has no subdir:,
              # so it installs at the wheel root (e.g. _vmprof.cpython-313-riscv64-
              # linux-gnu.so), not inside vmprof/ - true on every platform, not
              # just riscv64; the previous "vmprof/*.so" check never matched.
              assert any(n.startswith("_vmprof") and n.endswith(".so") for n in names), whl
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish vmprof ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: vmprof-${{ matrix.version }}-*-manylinux_riscv64
