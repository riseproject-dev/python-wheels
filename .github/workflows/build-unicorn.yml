---
# Based on upstream's own wheel build at this tag:
#   https://github.com/unicorn-engine/unicorn/blob/2.1.4/.github/workflows/build-wheels-publish.yml
name: Build unicorn wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/unicorn.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-unicorn.yml'
      - 'docs/packages/unicorn.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unicorn.yml'
      - 'docs/packages/unicorn.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: unicorn
      version: ${{ inputs.version }}

  # setup.py forces has_ext_modules + py_limited_api=cp37 (a bdist_wheel-option
  # abi3 floor, gotcha 34), so one build serves cp312/cp313/cp314. setuptools
  # itself raises under Py_GIL_DISABLED with py_limited_api set (no upstream
  # guard), so upstream ships no cp314t wheel for any platform; we drop it too.
  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build unicorn ${{ matrix.version }} cp37-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "unicorn"
      version: "${{ matrix.version }}"
      repository: "unicorn-engine/unicorn"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp37-abi3-manylinux_riscv64"
      timeout-minutes: 180
      checkout-fetch-depth: 0
      pre-build: |-
        cp COPYING COPYING.LGPL2 COPYING_GLIB AUTHORS.TXT bindings/python/
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "bindings/python"
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # setup.py shells out to `cmake` directly; it's not a declared build dep.
      cibw-before-build: "pip install cmake"
      cibw-build-frontend: "build"
      # capstone==6.0.0a2 (upstream's test extra) has no riscv64 wheel anywhere;
      # our registry carries 5.0.9, and the regress tests only use its stable
      # Cs()/CS_ARCH_* surface.
      cibw-test-requires: "capstone==5.0.9"
      cibw-test-command: "python -m unittest discover -v {project}/tests/regress \"*.py\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      UNICORN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: unicorn-${{ env.UNICORN_VERSION }}-cp37-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the licence files made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"COPYING", "COPYING.LGPL2", "COPYING_GLIB", "AUTHORS.TXT"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish unicorn ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: unicorn-${{ matrix.version }}-*-manylinux_riscv64
