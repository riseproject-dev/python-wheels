---
# This workflow is based on: https://github.com/fonttools/openstep-plist/blob/v0.5.2/.github/workflows/wheels.yml
name: Build openstep-plist wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openstep-plist.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openstep-plist.yml'
      - 'docs/packages/openstep-plist.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openstep-plist.yml'
      - 'docs/packages/openstep-plist.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openstep-plist
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build openstep-plist ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: openstep-plist
      version: ${{ matrix.version }}
      # setuptools_scm needs the tag reachable to derive the version.
      repository: fonttools/openstep-plist
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-requires: pytest
      # Upstream's own test-command (pyproject.toml), with a .so check prepended.
      cibw-test-command: >-
        python -c "import openstep_plist.parser as m; assert m.__file__.endswith('.so'), m.__file__" &&
        pytest {project}/tests
      timeout-minutes: 30

  publish:
    name: Publish openstep-plist ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: openstep-plist-${{ matrix.version }}-*riscv64
