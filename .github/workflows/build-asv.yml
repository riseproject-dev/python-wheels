---
# Based on upstream's own wheel builder:
#   https://github.com/airspeed-velocity/asv/blob/v0.6.6/.github/workflows/build_wheels.yml
name: Build asv wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asv.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asv.yml'
      - 'docs/packages/asv.yaml'
      - 'patches/asv/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asv.yml'
      - 'docs/packages/asv.yaml'
      - 'patches/asv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asv
      version: ${{ inputs.version }}

  # setup.py hardcodes options={'bdist_wheel': {'py_limited_api': 'cp36'}}
  # (guarded by Py_GIL_DISABLED), a fixed abi3 floor upstream picks, not us
  # (gotcha 34) - one build serves cp312/cp313/cp314 (cibuildwheel builds
  # once and reuses+retests via find_compatible_wheel).
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build asv ${{ matrix.version }} cp36-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "asv"
      version: "${{ matrix.version }}"
      repository: "airspeed-velocity/asv"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp36-abi3-manylinux_riscv64"
      timeout-minutes: 90
      checkout-fetch-depth: 0

      # cibuildwheel 4.x dropped the cpython-freethreading enable group that
      # pyproject.toml still lists (upstream pins cibuildwheel v3.3.0, where
      # it's still valid) - see patches/asv/${{ env.ASV_VERSION }}/*.patch.
      patches: true

      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-skip: "*-musllinux_*"
      # numpy/scipy/pyyaml are on our registry but can drift ahead of the
      # riscv64 wheels we've built for them (gotcha: scope PIP_ONLY_BINARY
      # so pip picks our latest binary instead of building a newer sdist).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pyyaml SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      # The repo-root `asv/` checkout shadows the installed wheel under
      # pytest's default rootdir import (gotcha 25); test-sources stages
      # only `test`/pyproject.toml into an empty cwd so `import asv`
      # resolves to the wheel. Scoped to the suite exercising the
      # compiled _rangemedian extension (upstream's full suite needs git,
      # a browser, and conda/hg, out of scope for a wheel smoke test).
      cibw-test-sources: "test pyproject.toml"
      cibw-test-requires: "pytest selenium filelock numpy scipy"
      cibw-test-command: "python -m pytest -v test/test_step_detect.py test/test_statistics.py"

  # Free-threaded: setup.py drops py_limited_api under Py_GIL_DISABLED, so
  # this is a plain per-interpreter build (no abi3).
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build asv ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "asv"
      version: "${{ matrix.version }}"
      repository: "airspeed-velocity/asv"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 90
      checkout-fetch-depth: 0

      patches: true

      cibw-build: "cp314t-manylinux_riscv64"
      cibw-skip: "*-musllinux_*"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pyyaml SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      cibw-test-sources: "test pyproject.toml"
      cibw-test-requires: "pytest selenium filelock numpy scipy"
      # test_rangemedian_concurrent_use_fails_fast races 4 threads against
      # a non-thread-safe C object, asserting at least one hits its
      # reentrancy guard's RuntimeError. That guard's timing assumes GIL
      # serialization; under cp314t's true parallelism the race window
      # differs enough that all 4 threads can complete without ever
      # tripping it -- a free-threading test-design gap, not a riscv64 or
      # correctness issue (the guard firing is a best-effort fast-fail,
      # not a safety invariant the wheel itself depends on).
      cibw-test-command: "python -m pytest -v test/test_step_detect.py test/test_statistics.py --deselect \"test/test_step_detect.py::test_rangemedian_concurrent_use_fails_fast[python]\""

  publish:
    name: Publish asv ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: asv-${{ matrix.version }}-*-manylinux_riscv64
