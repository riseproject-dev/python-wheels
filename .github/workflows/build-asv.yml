---
# Based on upstream's own wheel builder:
#   https://github.com/airspeed-velocity/asv/blob/v0.6.6/.github/workflows/build_wheels.yml
name: Build asv wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'asv version to build (git tag without leading v, e.g. 0.6.6)'
        required: true
        default: '0.6.6'
  pull_request:
    paths:
      - '.github/workflows/build-asv.yml'
      - 'patches/asv/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.6.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  ASV_VERSION: ${{ inputs.version || '0.6.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  # setup.py hardcodes options={'bdist_wheel': {'py_limited_api': 'cp36'}}
  # (guarded by Py_GIL_DISABLED), a fixed abi3 floor upstream picks, not us
  # (gotcha 34) - one build serves cp312/cp313/cp314 (cibuildwheel builds
  # once and reuses+retests via find_compatible_wheel).
  build_abi3:
    needs: [setup]
    name: Build asv ${{ inputs.version || '0.6.6' }} cp36-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Checkout asv v${{ env.ASV_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: airspeed-velocity/asv
          ref: v${{ env.ASV_VERSION }}
          fetch-depth: 0  # setuptools_scm needs full history + tags
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # cibuildwheel 4.x dropped the cpython-freethreading enable group that
      # pyproject.toml still lists (upstream pins cibuildwheel v3.3.0, where
      # it's still valid) - see patches/asv/${{ env.ASV_VERSION }}/*.patch.
      - name: Patch asv source
        run: git apply python-wheels/patches/asv/${{ env.ASV_VERSION }}/*.patch

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy/scipy/pyyaml are on our registry but can drift ahead of the
          # riscv64 wheels we've built for them (gotcha: scope PIP_ONLY_BINARY
          # so pip picks our latest binary instead of building a newer sdist).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pyyaml
          # The repo-root `asv/` checkout shadows the installed wheel under
          # pytest's default rootdir import (gotcha 25); test-sources stages
          # only `test`/pyproject.toml into an empty cwd so `import asv`
          # resolves to the wheel. Scoped to the suite exercising the
          # compiled _rangemedian extension (upstream's full suite needs git,
          # a browser, and conda/hg, out of scope for a wheel smoke test).
          CIBW_TEST_SOURCES: test pyproject.toml
          CIBW_TEST_REQUIRES: pytest selenium filelock numpy scipy
          CIBW_TEST_COMMAND: python -m pytest -v test/test_step_detect.py test/test_statistics.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asv-${{ env.ASV_VERSION }}-cp36-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded: setup.py drops py_limited_api under Py_GIL_DISABLED, so
  # this is a plain per-interpreter build (no abi3).
  build_freethreaded:
    needs: [setup]
    name: Build asv ${{ inputs.version || '0.6.6' }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Checkout asv v${{ env.ASV_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: airspeed-velocity/asv
          ref: v${{ env.ASV_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch asv source
        run: git apply python-wheels/patches/asv/${{ env.ASV_VERSION }}/*.patch

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp314t-manylinux_riscv64
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pyyaml
          CIBW_TEST_SOURCES: test pyproject.toml
          CIBW_TEST_REQUIRES: pytest selenium filelock numpy scipy
          # test_rangemedian_concurrent_use_fails_fast races 4 threads against
          # a non-thread-safe C object, asserting at least one hits its
          # reentrancy guard's RuntimeError. That guard's timing assumes GIL
          # serialization; under cp314t's true parallelism the race window
          # differs enough that all 4 threads can complete without ever
          # tripping it -- a free-threading test-design gap, not a riscv64 or
          # correctness issue (the guard firing is a best-effort fast-fail,
          # not a safety invariant the wheel itself depends on).
          CIBW_TEST_COMMAND: >-
            python -m pytest -v test/test_step_detect.py test/test_statistics.py
            --deselect "test/test_step_detect.py::test_rangemedian_concurrent_use_fails_fast[python]"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asv-${{ env.ASV_VERSION }}-cp314t-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish asv ${{ inputs.version || '0.6.6' }}
    needs: [setup, build_abi3, build_freethreaded]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: asv-${{ inputs.version || '0.6.6' }}-*-manylinux_riscv64
