---
# This workflow is based on the `linux` job of
# https://github.com/Stranger6667/css-inline/blob/python-v0.21.2/.github/workflows/python-release.yml
name: Build css-inline wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/css-inline.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-css-inline.yml'
      - 'docs/packages/css-inline.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-css-inline.yml'
      - 'docs/packages/css-inline.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: css-inline
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build css-inline ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature is on unconditionally (bindings/python/Cargo.toml),
          # so one abi3 wheel serves every interpreter it claims. Upstream publishes no
          # free-threaded (cp314t) wheel at all, so there is no second job here.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    env:
      CSS_INLINE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout css-inline python-v${{ env.CSS_INLINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Stranger6667/css-inline
          ref: python-v${{ env.CSS_INLINE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # bindings/python ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest hypothesis
          # css-inline/tests carries the background test server and the
          # fixture that bindings/python/tests-py reaches through a relative
          # "../../css-inline/tests/..." href, so both trees are staged
          # together, preserving their layout from the checkout.
          CIBW_TEST_SOURCES: >-
            bindings/python/tests-py bindings/python/pyproject.toml
            css-inline/tests
          # Upstream's own CI backgrounds this same server ahead of every
          # Python/Rust/Ruby test job (css-inline/tests/server.py) to serve
          # tests-py's remote-stylesheet cases from 127.0.0.1:1234.
          # css_inline/__init__.py is a pure-Python re-export shim; the compiled
          # extension is the css_inline.css_inline submodule (gotcha 56).
          CIBW_TEST_COMMAND: >-
            python css-inline/tests/server.py >/dev/null 2>&1 &
            for _ in $(seq 1 20); do
              python -c "import socket; socket.create_connection(('127.0.0.1', 1234), timeout=0.2).close()" 2>/dev/null && break;
              sleep 0.1;
            done &&
            python -c "import css_inline.css_inline as m; assert m.__file__.endswith('.so'), m.__file__" &&
            cd bindings/python &&
            python -m pytest -v tests-py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: css-inline-${{ env.CSS_INLINE_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish css-inline ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: css-inline-${{ matrix.version }}-*-manylinux_riscv64
