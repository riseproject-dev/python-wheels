---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/dimagi/jsonobject/blob/v2.3.1/.github/workflows/pypi.yml
name: Build jsonobject wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jsonobject.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonobject.yml'
      - 'docs/packages/jsonobject.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonobject.yml'
      - 'docs/packages/jsonobject.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jsonobject
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jsonobject ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: jsonobject
      version: ${{ matrix.version }}
      repository: dimagi/jsonobject
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # test/ resolves its couchdbkit fixtures relative to cwd (not
      # __file__), so staging just test/ and running from an empty cwd
      # exercises the installed wheel without the checkout's jsonobject/
      # shadowing it (CLAUDE.md gotcha 25).
      cibw-test-sources: test
      cibw-test-command: >-
        python -c "import jsonobject.base as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m unittest -v
      timeout-minutes: 60

  publish:
    name: Publish jsonobject ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jsonobject-${{ matrix.version }}-*riscv64
