---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/dimagi/jsonobject/blob/v2.3.1/.github/workflows/pypi.yml
name: Build jsonobject wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'jsonobject version/tag to build (e.g. 2.3.1)'
        required: true
        default: '2.3.1'
  pull_request:
    paths:
      - '.github/workflows/build-jsonobject.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.3.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  JSONOBJECT_VERSION: ${{ inputs.version || '2.3.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build jsonobject ${{ inputs.version || '2.3.1' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout jsonobject v${{ env.JSONOBJECT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dimagi/jsonobject
          ref: v${{ env.JSONOBJECT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # test/ resolves its couchdbkit fixtures relative to cwd (not
          # __file__), so staging just test/ and running from an empty cwd
          # exercises the installed wheel without the checkout's jsonobject/
          # shadowing it (CLAUDE.md gotcha 25).
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: >-
            python -c "import jsonobject.base as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m unittest -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jsonobject-${{ env.JSONOBJECT_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish jsonobject ${{ inputs.version || '2.3.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: jsonobject-${{ inputs.version || '2.3.1' }}-*riscv64
