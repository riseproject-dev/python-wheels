---
# This workflow is based on the `build-wheels` job of
# https://github.com/nvidia-cosmos/cosmos-xenna/blob/v0.5.11/.github/workflows/release-from-tag.yml
name: Build cosmos-xenna wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cosmos-xenna.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cosmos-xenna.yml'
      - 'docs/packages/cosmos-xenna.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cosmos-xenna.yml'
      - 'docs/packages/cosmos-xenna.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cosmos-xenna
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cosmos-xenna ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      COSMOS_XENNA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cosmos-xenna v${{ env.COSMOS_XENNA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nvidia-cosmos/cosmos-xenna
          ref: v${{ env.COSMOS_XENNA_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          # abi3-py312 (Cargo.toml's pyo3 feature set) covers every GIL-ful
          # interpreter with one wheel; requires-python is >=3.12, so there is
          # no cp310/cp311 leg to drop here. musllinux is dropped: rustup.rs
          # ships no riscv64 musl toolchain.
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cosmos_xenna ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          # aws-lc-sys (pulled in by rustls' default crypto provider) ships
          # prebuilt riscv64gc bindings, and cmake is already in the image.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Test-install only: ray[default] pulls py-spy directly and
          # cryptography transitively (opencensus -> google-api-core ->
          # google-auth, unbounded). Both specs are satisfied by our
          # registry's riscv64 wheels, but an unbounded pip install picks
          # PyPI's newer release instead and source-builds it, which fails
          # (py-spy 0.4.3: rustc error in its own source; cryptography
          # 50.0.2: openssl-sys can't find openssl.pc).
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=cryptography,py-spy
          # tqdm: cosmos_xenna/file_distribution/_file_distribution.py does a
          # top-level `import tqdm`, but tqdm is not in pyproject.toml's
          # `dependencies` (or any `[project.optional-dependencies]` group) -
          # upstream's own uv.lock only carries it in because tqdm is a
          # transitive dep of huggingface-hub/transformers (the `examples`
          # extra), and `uv sync`'s default groups pull `examples` in locally.
          # A plain `pip install cosmos-xenna` does not get tqdm at all, so
          # this is really an upstream packaging gap, not a cibuildwheel-only
          # issue, but we can't edit upstream's install_requires from here.
          # It only bites at test time: --pyargs imports file_distribution
          # (via pipelines.v1 / pipelines.private.pipelines) during
          # collection, so it has to be listed here explicitly. tqdm is pure
          # Python (py3-none-any), so it installs the same from either index
          # with no riscv64 build step - no py-spy/cryptography-style
          # resolver risk.
          CIBW_TEST_REQUIRES: pytest tqdm
          # The test files already ship inside the wheel itself (same as
          # upstream's own published wheels), so --pyargs runs them straight
          # against the installed, compiled package with no staging needed.
          # "not slow" matches pyproject.toml's own default addopts, which a
          # plain `pytest` invocation picks up from the checkout but --pyargs
          # does not; upstream's separate `pytest -m 'slow'` CI step is
          # dropped as disproportionate for a shared riscv64 runner.
          CIBW_TEST_COMMAND: >-
            python -c "import cosmos_xenna._cosmos_xenna as m; assert m.__file__.endswith('.so'), m.__file__"
            && python -m pytest --pyargs cosmos_xenna -q -m "not slow"
        with:
          output-dir: wheelhouse/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cosmos-xenna-${{ env.COSMOS_XENNA_VERSION }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cosmos-xenna ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cosmos-xenna-${{ matrix.version }}-manylinux_riscv64
