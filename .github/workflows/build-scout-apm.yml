---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/scoutapp/scout_apm_python/blob/v4.1.0/.github/workflows/release.yml
name: Build scout-apm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scout-apm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scout-apm.yml'
      - 'docs/packages/scout-apm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scout-apm.yml'
      - 'docs/packages/scout-apm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scout-apm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scout-apm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: scout-apm
      version: ${{ matrix.version }}
      repository: scoutapp/scout_apm_python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # _objtrace is Extension(optional=True) with a pure fallback, so assert the .so
      # loaded before running its tests (CLAUDE.md gotcha 20). On 3.14t/3.15t it re-enables
      # the GIL, as upstream's wheels do; pytest.ini's filterwarnings=error would fail on that.
      cibw-test-sources: tests pytest.ini
      cibw-test-requires: pytest pytest-asyncio pytest-cov
      cibw-test-command: >-
        python -c "from scout_apm.core import objtrace; assert objtrace.is_extension"
        && python -m pytest --confcutdir=tests/unit/core
        -W "ignore:The global interpreter lock (GIL) has been enabled:RuntimeWarning"
        tests/unit/core/test_objtrace.py -v
      timeout-minutes: 60

  publish:
    name: Publish scout-apm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scout-apm-${{ matrix.version }}-*_riscv64
