---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/scoutapp/scout_apm_python/blob/v4.1.0/.github/workflows/release.yml
name: Build scout-apm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scout-apm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scout-apm.yml'
      - 'docs/packages/scout-apm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scout-apm.yml'
      - 'docs/packages/scout-apm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scout-apm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scout-apm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      SCOUT_APM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout scout_apm_python v${{ env.SCOUT_APM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scoutapp/scout_apm_python
          ref: v${{ env.SCOUT_APM_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # _objtrace is Extension(optional=True) with a pure fallback, so assert the .so
          # loaded before running its tests (CLAUDE.md gotcha 20). On 3.14t/3.15t it re-enables
          # the GIL, as upstream's wheels do; pytest.ini's filterwarnings=error would fail on that.
          CIBW_TEST_SOURCES: tests pytest.ini
          CIBW_TEST_REQUIRES: pytest pytest-asyncio pytest-cov
          CIBW_TEST_COMMAND: >-
            python -c "from scout_apm.core import objtrace; assert objtrace.is_extension"
            && python -m pytest --confcutdir=tests/unit/core
            -W "ignore:The global interpreter lock (GIL) has been enabled:RuntimeWarning"
            tests/unit/core/test_objtrace.py -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scout-apm-${{ env.SCOUT_APM_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish scout-apm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scout-apm-${{ matrix.version }}-*_riscv64
