---
# This workflow is based on the `build-native-wheels` job of
# https://github.com/fdintino/pillow-avif-plugin/blob/v1.6.0/.github/workflows/wheels.yml
name: Build pillow-avif-plugin wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pillow-avif-plugin.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-avif-plugin.yml'
      - 'docs/packages/pillow-avif-plugin.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-avif-plugin.yml'
      - 'docs/packages/pillow-avif-plugin.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LIBAVIF_VERSION: 1.4.2
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pillow-avif-plugin
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pillow-avif-plugin ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pillow-avif-plugin"
      version: "${{ matrix.version }}"
      repository: "fdintino/pillow-avif-plugin"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's own before-all builds libavif through multi-build/multibuild,
      # whose ccache/sccache/nasm helpers all fetch architecture-specific prebuilt
      # binaries with no riscv64 release. This replicates the CMake invocation from
      # wheelbuild/config.sh's build_libavif directly instead. rav1e is dropped: it's
      # one of two interchangeable AV1 encoders (aom, kept, is the other), so pulling
      # in a whole Rust toolchain to duplicate encode support isn't worth it -- the
      # test suite already skips rav1e-specific cases via skip_unless_avif_encoder.
      # ENABLE_RVV=0: aom's av1.cmake unconditionally adds the highbd RVV convolve
      # sources to the RVV object library (unlike its x86/NEON equivalents, which
      # gate their highbd files on CONFIG_AV1_HIGHBITDEPTH); with highbitdepth off
      # those files call undeclared _c fallbacks. Upstream bug, still present on aom
      # main; see gotcha 271.
      cibw-before-all-linux: |-
        set -e
        python3 -m pip install ninja meson
        mkdir -p libavif-1.4.2
        curl -sL https://github.com/AOMediaCodec/libavif/archive/v1.4.2.tar.gz \
        | tar --strip-components=1 -C libavif-1.4.2 -xzf -
        cmake -S libavif-1.4.2 -B libavif-1.4.2/build -G Ninja \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_SHARED_LIBS=ON \
        -DCMAKE_C_VISIBILITY_PRESET=hidden \
        -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
        -DCMAKE_SHARED_LINKER_FLAGS_INIT="-Wl,--strip-all,-z,relro,-z,now" \
        -DAVIF_LIBSHARPYUV=LOCAL \
        -DAVIF_LIBYUV=LOCAL \
        -DAVIF_CODEC_AOM=LOCAL \
        -DAVIF_CODEC_AOM_DECODE=OFF \
        -DAVIF_CODEC_DAV1D=LOCAL \
        -DCONFIG_AV1_HIGHBITDEPTH=0 \
        -DENABLE_RVV=0
        cmake --build libavif-1.4.2/build
        cmake --install libavif-1.4.2/build --strip
        for f in {package}/wheelbuild/dependency_licenses/*.txt; do
        { printf '\n\n----\n\n%s\n\n' "$(basename "$f" .txt)"; cat "$f"; } >> {package}/LICENSE
        done
        printf '\n\n' >> {package}/LICENSE
        cat {package}/wheelbuild/dependency_licenses/PATENTS >> {package}/LICENSE
      # Pillow ships no riscv64 wheel on public PyPI; ours is what the test env installs.
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PILLOW_AVIF_PLUGIN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pillow-avif-plugin-${{ env.PILLOW_AVIF_PLUGIN_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pillow_avif/_avif") and n.endswith(".so") for n in names), whl
              libs = sorted({n.split("/")[1].split("-")[0] for n in names if n.startswith("pillow_avif_plugin.libs/") and n != "pillow_avif_plugin.libs/"})
              assert libs == ["libavif"], (whl, libs)
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {"LICENSE"}, (whl, licenses)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pillow-avif-plugin ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pillow-avif-plugin-${{ matrix.version }}-*-manylinux_riscv64
