---
# Based on the Linux leg of https://github.com/mapequation/infomap/blob/v2.15.1/.github/workflows/_python-package.yml
name: Build infomap wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/infomap.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-infomap.yml'
      - 'docs/packages/infomap.yaml'
      - 'patches/infomap/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-infomap.yml'
      - 'docs/packages/infomap.yaml'
      - 'patches/infomap/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: infomap
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build infomap ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "infomap"
      version: "${{ matrix.version }}"
      repository: "mapequation/infomap"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/infomap/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-command: "python -c \"from infomap import Infomap; print(Infomap(silent=True).num_top_modules)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      INFOMAP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: infomap-${{ env.INFOMAP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries the compiled extension + every LICENSE
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "_infomap" in n for n in names), names
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {"LICENSE_GPLv3.txt", "LICENSE", "LICENSE.MIT"}, (whl, licenses)
              print(whl, "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      INFOMAP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # infomap enables -fopenmp by default, so auditwheel vendors the image's
      # libgomp into infomap.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: infomap-${{ env.INFOMAP_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish infomap ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: infomap-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: infomap-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
