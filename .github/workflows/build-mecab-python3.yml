---
# This workflow is based on: https://github.com/SamuraiT/mecab-python3/blob/v1.0.12/.github/workflows/manylinux.yml
name: Build mecab-python3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mecab-python3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-python3.yml'
      - 'docs/packages/mecab-python3.yaml'
      - 'patches/mecab-python3/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-python3.yml'
      - 'docs/packages/mecab-python3.yaml'
      - 'patches/mecab-python3/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mecab-python3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mecab-python3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mecab-python3"
      version: "${{ matrix.version }}"
      repository: "SamuraiT/mecab-python3"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # mecab-python3's sdist carries no MeCab C++ sources -- setup.py always
      # links a system libmecab via mecab-config. Build it from the canonical,
      # actively-maintained taku910/mecab (their own sdist job uses this repo
      # too; the manylinux wheel job's polm/mecab fork hasn't been pushed since
      # 2021). Its config.guess/config.sub predate riscv64 (and even aarch64,
      # per upstream's own aarch64 workaround), so swap in automake's copy.
      cibw-before-all-linux: |
        set -eux
        git clone --depth=1 https://github.com/taku910/mecab.git /tmp/mecab
        cd /tmp/mecab/mecab
        cp /usr/share/automake-*/config.guess /usr/share/automake-*/config.sub .
        ./configure --enable-utf8-only
        make -j"$(nproc)"
        make install
        ldconfig
      # Mirrors upstream's test-manylinux.yml: install unidic-lite (a small
      # pure-Python dictionary package) so the suite exercises real tokenization
      # instead of skipping on "No dictionaries found".
      cibw-test-requires: "pytest unidic-lite"
      cibw-test-sources: "test"
      cibw-test-command: "pytest test"

  publish:
    name: Publish mecab-python3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mecab-python3-${{ matrix.version }}-*-manylinux_riscv64
