---
# This workflow is based on `[tool.cibuildwheel]` in
# https://github.com/urschrei/pypolyline/blob/v1.0.0/pyproject.toml
name: Build pypolyline wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pypolyline.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pypolyline.yml'
      - 'docs/packages/pypolyline.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pypolyline.yml'
      - 'docs/packages/pypolyline.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pypolyline
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pypolyline ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PYPOLYLINE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pypolyline v${{ env.PYPOLYLINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: urschrei/pypolyline
          ref: v${{ env.PYPOLYLINE_VERSION }}
          persist-credentials: false

      # 1.0.0 is a rewrite as a pure Rust/PyO3 extension built by maturin (the
      # earlier releases were Cython over a prebuilt libpolylineffi), with
      # pyo3's abi3-py311 feature on: one wheel serves every CPython >= 3.11.
      # It is built on cp312, the oldest interpreter this repo's image has.
      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # manylinux images ship no Rust toolchain (upstream's before-all, minus
          # its macOS-only parts). Without cargo on PATH maturin falls back to
          # puccinialin, which has no riscv64 toolchain to install.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
          # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
          # crashes the audit step: it asserts a host `uv`, which the self-hosted
          # riscv64 runner doesn't have (gotcha 13).
          CIBW_BUILD_FRONTEND: build
          # numpy has riscv64 wheels only on our registry; tests that need it
          # importorskip it, so it is installed to run them rather than skip them.
          CIBW_TEST_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {package}

      - name: Check the extension and the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp311-abi3-" in whl, whl
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pypolyline/cutil.") and n.endswith(".so")
                         for n in names), names
              assert any(n.endswith("dist-info/licenses/LICENSE.md") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypolyline-${{ env.PYPOLYLINE_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pypolyline ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pypolyline-${{ matrix.version }}-*-manylinux_riscv64
