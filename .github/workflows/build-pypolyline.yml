---
# This workflow is based on: https://github.com/urschrei/pypolyline/blob/v0.5.8/.github/workflows/wheels.yml
name: Build pypolyline wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pypolyline version to build (git tag without the leading v, e.g. 0.5.8)'
        required: true
        default: '0.5.8'
  pull_request:
    paths:
      - '.github/workflows/build-pypolyline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.5.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.5.8 there.
  PYPOLYLINE_VERSION: ${{ inputs.version || '0.5.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # The urschrei/polyline-ffi tag that was latest when pypolyline 0.5.8 shipped.
  # Upstream's own CI fetches whatever tag is latest at release time; it has no
  # riscv64 release asset, so this is built from source instead (gotcha 77).
  POLYLINE_FFI_TAG: v0.8.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pypolyline ${{ inputs.version || '0.5.8' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Upstream builds cp310-cp314 only (no free-threaded variant); this repo's
        # floor is cp312, so cp314t is dropped along with cp310/cp311.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout pypolyline v${{ env.PYPOLYLINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: urschrei/pypolyline
          ref: v${{ env.PYPOLYLINE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream downloads a prebuilt libpolylineffi.so from
          # urschrei/polyline-ffi's releases; there is no riscv64 asset, so build
          # it from source instead (gotcha 77) and stage it where
          # CMakeLists.txt's find_library expects it.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            git clone --depth 1 --branch ${{ env.POLYLINE_FFI_TAG }}
            https://github.com/urschrei/polyline-ffi /tmp/polyline-ffi &&
            cd /tmp/polyline-ffi &&
            $HOME/.cargo/bin/cargo build --release --features headers &&
            cp target/release/libpolylineffi.so include/header.h {project}/src/pypolyline/
          # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
          # crashes the audit step: it asserts a host `uv`, which the self-hosted
          # riscv64 runner doesn't have (gotcha 13).
          CIBW_BUILD_FRONTEND: build
          # numpy/cython have riscv64 wheels only on our registry.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - name: Check the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("dist-info/licenses/LICENSE.md") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypolyline-${{ env.PYPOLYLINE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pypolyline ${{ inputs.version || '0.5.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pypolyline-${{ inputs.version || '0.5.8' }}-*-manylinux_riscv64
