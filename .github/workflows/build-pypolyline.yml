---
# This workflow is based on `[tool.cibuildwheel]` in
# https://github.com/urschrei/pypolyline/blob/v1.0.0/pyproject.toml
name: Build pypolyline wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pypolyline.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pypolyline.yml'
      - 'docs/packages/pypolyline.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pypolyline.yml'
      - 'docs/packages/pypolyline.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pypolyline
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pypolyline ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pypolyline"
      version: "${{ matrix.version }}"
      repository: "urschrei/pypolyline"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 120
      cibw-build: "cp312-manylinux_riscv64"
      # manylinux images ship no Rust toolchain (upstream's before-all, minus
      # its macOS-only parts). Without cargo on PATH maturin falls back to
      # puccinialin, which has no riscv64 toolchain to install.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
      cibw-environment-linux: "PATH=\"$HOME/.cargo/bin:$PATH\""
      # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
      # crashes the audit step: it asserts a host `uv`, which the self-hosted
      # riscv64 runner doesn't have (gotcha 13).
      cibw-build-frontend: "build"
      # numpy has riscv64 wheels only on our registry; tests that need it
      # importorskip it, so it is installed to run them rather than skip them.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest numpy"
      cibw-test-command: "pytest {package}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYPOLYLINE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypolyline-${{ env.PYPOLYLINE_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp311-abi3-" in whl, whl
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pypolyline/cutil.") and n.endswith(".so")
                         for n in names), names
              assert any(n.endswith("dist-info/licenses/LICENSE.md") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish pypolyline ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pypolyline-${{ matrix.version }}-*-manylinux_riscv64
