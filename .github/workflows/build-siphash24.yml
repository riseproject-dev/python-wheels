---
# Based on the `wheels` job of
# https://github.com/dnicolodi/python-siphash24/blob/v1.8/.github/workflows/wheels.yml
name: Build siphash24 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'siphash24 version to build (git tag without leading v, e.g. 1.8)'
        required: true
        default: '1.8'
  pull_request:
    paths:
      - '.github/workflows/build-siphash24.yml'
      - 'patches/siphash24/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SIPHASH24_VERSION: ${{ inputs.version || '1.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build siphash24 ${{ inputs.version || '1.8' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout siphash24 v${{ env.SIPHASH24_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dnicolodi/python-siphash24
          ref: v${{ env.SIPHASH24_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch siphash24 source
        run: |
          git apply python-wheels/patches/siphash24/${{ env.SIPHASH24_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python {project}/test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: siphash24-${{ env.SIPHASH24_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish siphash24 ${{ inputs.version || '1.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: siphash24-${{ inputs.version || '1.8' }}-*-manylinux_riscv64
