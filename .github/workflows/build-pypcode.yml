---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/angr/pypcode/blob/v4.0.0/.github/workflows/build.yml
name: Build pypcode wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pypcode.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pypcode.yml'
      - 'docs/packages/pypcode.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pypcode.yml'
      - 'docs/packages/pypcode.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pypcode
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pypcode ${{ matrix.version }} ${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pypcode
      version: ${{ matrix.version }}
      repository: angr/pypcode
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.libc }}_riscv64
      cibw-build: cp312-${{ matrix.libc }}_riscv64 cp313-${{ matrix.libc }}_riscv64 cp314-${{ matrix.libc }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # setup.py's cmake configure reuses the same build dir across interpreters in this job, poisoning cp313+ (CLAUDE.md gotcha 644).
      cibw-before-build: rm -rf {package}/build
      cibw-test-command: python -m unittest discover -v -s {package}/tests
      timeout-minutes: 90

  publish:
    name: Publish pypcode ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pypcode-${{ matrix.version }}-*riscv64
