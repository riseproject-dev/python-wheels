---
# Based on the `build-manylinux`/`build-wheels` steps of
# https://github.com/ParallelSSH/ssh2-python/blob/1.2.0.post1/ci/build-manylinux.sh
name: Build ssh2-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ssh2-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ssh2-python.yml'
      - 'docs/packages/ssh2-python.yaml'
      - 'patches/ssh2-python/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ssh2-python.yml'
      - 'docs/packages/ssh2-python.yaml'
      - 'patches/ssh2-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ssh2-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ssh2-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ssh2-python"
      version: "${{ matrix.version }}"
      repository: "ParallelSSH/ssh2-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/ssh2-python/${{ matrix.version }}/*.patch
        # versioneer's `git describe --tags --dirty` has no pretend-version escape
        # hatch the way setuptools_scm does (gotcha 315); hide just the patched
        # file from dirty-detection instead of poisoning the wheel version.
        git update-index --skip-worktree setup.py

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py's build_ssh2() always cmake-builds the libssh2 tree checked
      # into libssh2/ against CRYPTO_BACKEND=OpenSSL (the SYSTEM_LIBSSH2 escape
      # is unused here); upstream's own manylinux image builds OpenSSL 3.4.0
      # from source first, which fails on riscv64 (no FindBin.pm, gotcha 46).
      # Rocky 10's own openssl-devel is already current, so use that instead
      # (mirrors build-uamqp.yml/build-pylibsrtp.yml).
      cibw-before-all-linux: "dnf -y install openssl-devel zlib-devel && cp libssh2/COPYING {project}/LICENSE.libssh2 && cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl"
      cibw-test-requires: "pytest pytest-rerunfailures"
      # tests/ is a package (has __init__.py); {project}/tests would run pytest
      # against the checkout, whose sibling ssh2/ source dir (no .so files, only
      # .py/.pxd) shadows the installed wheel (gotcha 25). test-sources copies
      # just tests/ into an otherwise-empty cwd, so a path relative to it imports
      # the wheel instead.
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SSH2_PYTHON_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ssh2-python-${{ env.SSH2_PYTHON_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extensions, libssh2 and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("ssh2/session") and n.endswith(".so") for n in names), names
              assert any(n.startswith("ssh2/libssh2.so") for n in names), names
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "COPYING", "LICENSE.libssh2", "LICENSE.openssl"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish ssh2-python ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ssh2-python-${{ matrix.version }}-*-manylinux_riscv64
