---
# This workflow is based on the `linux` job of
# https://github.com/code-inflation/pycrc32/blob/v0.3.0/.github/workflows/CI.yml
name: Build pycrc32 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pycrc32 version to build (git tag without the leading v, e.g. 0.3.0)'
        required: true
        default: '0.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-pycrc32.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.3.0 there.
  PYCRC32_VERSION: ${{ inputs.version || '0.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pycrc32 ${{ inputs.version || '0.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags). The v0.3.0 tag
        # pins pyo3 = "0.23.3" (master has since bumped to 0.25.1), whose max
        # supported Python is 3.13 - cp314/cp314t fail to build against this
        # release with "The configured Python interpreter version (3.14) is
        # newer than PyO3's maximum supported version (3.13)".
        python: ["cp312", "cp313"]

    steps:
      - name: Checkout pycrc32 v${{ env.PYCRC32_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: code-inflation/pycrc32
          ref: v${{ env.PYCRC32_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pycrc32 ships no [tool.cibuildwheel]; the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          # The test suite lives at pycrc32/tests, inside the importable package
          # directory (which also holds __init__.py). Staging only the tests
          # subtree keeps test_cwd's pycrc32/ from carrying an __init__.py, so
          # it stays a harmless namespace portion and the installed wheel's
          # concrete package wins the import (gotcha 174).
          CIBW_TEST_SOURCES: pycrc32/tests
          CIBW_TEST_COMMAND: >-
            python -c "import pycrc32.pycrc32 as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest pycrc32/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pycrc32-${{ env.PYCRC32_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pycrc32 ${{ inputs.version || '0.3.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pycrc32-${{ inputs.version || '0.3.0' }}-*-manylinux_riscv64
