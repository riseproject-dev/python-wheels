---
# This workflow is based on the `linux` job of
# https://github.com/code-inflation/pycrc32/blob/v0.3.0/.github/workflows/CI.yml
name: Build pycrc32 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycrc32.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycrc32.yml'
      - 'docs/packages/pycrc32.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycrc32.yml'
      - 'docs/packages/pycrc32.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycrc32
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pycrc32 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycrc32"
      version: "${{ matrix.version }}"
      repository: "code-inflation/pycrc32"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pycrc32 ships no [tool.cibuildwheel]; the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      # The test suite lives at pycrc32/tests, inside the importable package
      # directory (which also holds __init__.py). Staging only the tests
      # subtree keeps test_cwd's pycrc32/ from carrying an __init__.py, so
      # it stays a harmless namespace portion and the installed wheel's
      # concrete package wins the import (gotcha 174).
      cibw-test-sources: "pycrc32/tests"
      cibw-test-command: >
        python -c "import pycrc32.pycrc32 as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest pycrc32/tests

  publish:
    name: Publish pycrc32 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycrc32-${{ matrix.version }}-*-manylinux_riscv64
