---
# This workflow is based on: https://github.com/gbtami/Fairy-Stockfish/blob/master/.github/workflows/wheels.yml
name: Build pyffish wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyffish.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyffish.yml'
      - 'docs/packages/pyffish.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyffish.yml'
      - 'docs/packages/pyffish.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # pyffish has no git tag for its PyPI releases (version lives only in setup.py
  # on master); pin the commit that carries version="0.0.90" to match PyPI.
  PYFFISH_COMMIT: 9d2499c8cf57427279effecea9523d8168c88f91

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyffish
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyffish ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYFFISH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout Fairy-Stockfish ${{ env.PYFFISH_COMMIT }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gbtami/Fairy-Stockfish
          ref: ${{ env.PYFFISH_COMMIT }}
          persist-credentials: false

      - name: Stage licence file
        run: cp Copying.txt LICENSE

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: >-
            python -c "import runpy; runpy.run_path(r'{project}/test.py', run_name='__main__')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyffish-${{ env.PYFFISH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyffish ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyffish-${{ matrix.version }}-*-manylinux_riscv64
