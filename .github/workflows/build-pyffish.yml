---
# This workflow is based on: https://github.com/gbtami/Fairy-Stockfish/blob/master/.github/workflows/wheels.yml
name: Build pyffish wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyffish.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyffish.yml'
      - 'docs/packages/pyffish.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyffish.yml'
      - 'docs/packages/pyffish.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # pyffish has no git tag for its PyPI releases (version lives only in setup.py
  # on master); pin the commit that carries version="0.0.90" to match PyPI.
  PYFFISH_COMMIT: 9d2499c8cf57427279effecea9523d8168c88f91

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyffish
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyffish ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyffish"
      version: "${{ matrix.version }}"
      repository: "gbtami/Fairy-Stockfish"
      ref: "9d2499c8cf57427279effecea9523d8168c88f91"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: "cp Copying.txt LICENSE"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-command: >
        python -c "import runpy; runpy.run_path(r'{project}/test.py', run_name='__main__')"

  publish:
    name: Publish pyffish ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyffish-${{ matrix.version }}-*-manylinux_riscv64
