---
# This workflow is based on the `wheel` job of
# https://github.com/timonwong/cyksuid/blob/v2.1.0/.github/workflows/wheels.yml
name: Build cyksuid wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cyksuid.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cyksuid.yml'
      - 'docs/packages/cyksuid.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cyksuid.yml'
      - 'docs/packages/cyksuid.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cyksuid
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cyksuid ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cyksuid
      version: ${{ matrix.version }}
      repository: timonwong/cyksuid
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # `--only` makes cibuildwheel validate every Linux arch's configured image, not
      # just riscv64's; pyproject.toml's musllinux-*-image = "musllinux_1_1" is a bare
      # alias cibuildwheel 4.x rejects outright, so it must be overridden even though
      # these arches are never built here.
      cibw-musllinux-x86-64-image: musllinux_1_2
      cibw-musllinux-i686-image: musllinux_1_2
      cibw-musllinux-aarch64-image: musllinux_1_2
      # pyproject.toml's build-system.requires omits Cython, and setup.py only
      # cythonizes the .pyx sources when CYTHON=1 is set (upstream's own CI sets
      # this via `--with-cython` before running cibuildwheel); the tagged repo
      # ships no pre-generated .cpp, so both are needed here. Upstream's own
      # tools/wheel-requirements.txt pins cython==3.0.10, but that predates
      # free-threaded support and can't compile under cp314t (unbound
      # __pyx_vectorcallfunc); bumped to build across the whole matrix.
      cibw-before-build: pip install "cython==3.3.0" setuptools
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-environment-linux: CYTHON=1
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "from cyksuid import _ksuid, fast_base62;
        m = [_ksuid, fast_base62];
        bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
        assert not bad, bad"
        && python -m pytest {project}/tests -v

  publish:
    name: Publish cyksuid ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cyksuid-${{ matrix.version }}-*-manylinux_riscv64
