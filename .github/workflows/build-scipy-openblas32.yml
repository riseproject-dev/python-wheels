---
# Based on upstream's own wheel build (the `posix` job), reusing its
# pyproject.toml [tool.cibuildwheel] hooks (before-build/test-command/
# repair-wheel-command), with one patch:
#   https://github.com/MacPython/openblas-libs/blob/v0.3.34.106.0/.github/workflows/posix.yml
#
# Upstream only ever builds riscv64 for manylinux (via QEMU emulation on an
# arm64 runner, since they have no native riscv64 hardware), and never
# musllinux at all. This repo has real native riscv64 runners and builds
# both. That musllinux gap is the actual reason numpy's own musllinux
# riscv64 build fails: numpy pins an exact scipy-openblas32/64 version as a
# build-time dependency, and no musllinux riscv64 wheel for it exists on
# PyPI or this registry.
#
# patches/scipy-openblas32/<version>/0001-riscv64-build-with-gcc-instead-of-clang.patch:
# ci-before-build.sh's before_build hook tries to install a static clang
# toolchain for riscv64 (added since RISE's last GitLab-built version), but
# neither quay.io/pypa/manylinux_2_39_riscv64 nor .../musllinux_1_2_riscv64
# ships one - confirmed from real job logs, identically on both platforms.
# riscv64 here runs on real native hardware (unlike upstream's QEMU-emulated
# CI), so it builds with the gcc toolchain already in both images instead,
# the same one every other riscv64 package in this repo already builds
# OpenBLAS-dependent Fortran/C code with.
#
# scipy-openblas32 and scipy-openblas64 are the same upstream source; only
# the INTERFACE64 env var differs (build-time sed hack renaming the project,
# see tools/build_prepare_wheel.sh). They publish as separate packages here
# to match separate PyPI projects, same as upstream.
name: Build scipy-openblas32 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scipy-openblas32.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scipy-openblas32.yml'
      - 'docs/packages/scipy-openblas32.yaml'
      - 'patches/scipy-openblas32/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scipy-openblas32.yml'
      - 'docs/packages/scipy-openblas32.yaml'
      - 'patches/scipy-openblas32/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scipy-openblas32
      version: ${{ inputs.version }}

  # 0.3.27.44.{3,4,6} predate upstream's own cibuildwheel/pyproject.toml build
  # entirely (the old multibuild docker scripts below); split them out of
  # build_wheels' matrix here rather than teaching build_wheels two build
  # shapes.
  setup_legacy:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-latest
    outputs:
      legacy: ${{ steps.split.outputs.legacy }}
      modern: ${{ steps.split.outputs.modern }}
    steps:
      - id: split
        env:
          VERSIONS: ${{ needs.setup.outputs.versions }}
        run: |
          python3 -c "
          import fnmatch, json, os
          versions = json.loads(os.environ['VERSIONS'])
          legacy = [v for v in versions if fnmatch.fnmatch(v, '0.3.27.44.*')]
          modern = [v for v in versions if v not in legacy]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'legacy={json.dumps(legacy)}\n')
              f.write(f'modern={json.dumps(modern)}\n')
          "

  build_wheels:
    needs: [setup, setup_legacy]
    if: needs.setup_legacy.outputs.modern != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup_legacy.outputs.modern) }}
        libc: [manylinux, musllinux]
    name: Build scipy-openblas32 ${{ matrix.version }} py3-none-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      OPENBLAS_VERSION: ${{ matrix.version }}
      # Matches upstream's own posix.yml job env for the riscv64/manylinux
      # matrix leg; cibuildwheel passes these into the container per
      # pyproject.toml's [tool.cibuildwheel] environment-pass list.
      MB_ML_LIBC: ${{ matrix.libc }}
      MB_ML_VER: _2_39
      INTERFACE64: '0'
      PLAT: riscv64

    steps:
      # cibuildwheel's `{project}` template (and this package's own
      # pyproject.toml-relative hooks) resolve against the workspace root,
      # so openblas-libs is checked out there and python-wheels (needed only
      # for its patches/ dir) is placed under a subdir instead - same layout
      # build-numpy.yml and build-ai-edge-litert.yml already use for this.
      - name: Checkout openblas-libs v${{ env.OPENBLAS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MacPython/openblas-libs
          ref: v${{ env.OPENBLAS_VERSION }}
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Apply patches
        # Not every version needs one - 0.3.31.22.0 and 0.3.33.112.0 predate
        # the clang toolchain change 0.3.34.106.0's patch works around.
        run: |
          if compgen -G "python-wheels-repo/patches/scipy-openblas32/${{ env.OPENBLAS_VERSION }}/*.patch" > /dev/null; then
            git apply -v python-wheels-repo/patches/scipy-openblas32/${{ env.OPENBLAS_VERSION }}/*.patch
          fi

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: dist/
          # Upstream's own wheel is py3-none (no C-ABI dependency on the
          # build interpreter - it just vendors OpenBLAS's shared libs), so
          # one build per libc serves every Python version.
          only: cp312-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Upstream's own ci-test.sh runs `python3.9 -m scipy_openblas32`,
          # but the installed wheel has no __main__.py - confirmed on both
          # libcs here ("No module named scipy_openblas32.__main__"), so
          # this isn't riscv64/platform-specific, just a pre-existing gap in
          # upstream's own test script. numpy itself only ever does a plain
          # `import scipy_openblas32` (never -m) - get_pkg_config() loads
          # the compiled library via ctypes to read its embedded config
          # string, so a non-empty, OpenBLAS-shaped result is the real
          # functional check: the library actually loads and runs.
          CIBW_TEST_COMMAND: >-
            python3 -c "import scipy_openblas32 as s;
            config = s.get_pkg_config();
            assert 'openblas_config=' in config and 'OpenBLAS' in config, config"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scipy-openblas32-${{ env.OPENBLAS_VERSION }}-py3-none-${{ matrix.libc }}_riscv64
          path: dist/*.whl
          if-no-files-found: error

  build_wheels_legacy:
    needs: [setup, setup_legacy]
    if: needs.setup_legacy.outputs.legacy != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup_legacy.outputs.legacy) }}
        libc: [manylinux, musllinux]
    name: Build scipy-openblas32 ${{ matrix.version }} py3-none-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      OPENBLAS_VERSION: ${{ matrix.version }}
      MB_ML_LIBC: ${{ matrix.libc }}
      MB_ML_VER: ${{ matrix.libc == 'manylinux' && '_2_39' || '_1_2' }}
      INTERFACE64: '0'
      PLAT: riscv64

    steps:
      # These versions predate upstream's own cibuildwheel/pyproject.toml
      # build by about two years; this drives the old tools/build_steps.sh +
      # tools/build_wheel.sh multibuild scripts directly (its own posix.yml's
      # Linux job, minus the OSX/i686/aarch64/etc legs) instead.
      # v0.3.27.44.4 and v0.3.27.44.6 were never tagged - MacPython/openblas-libs
      # bumped the version on its maintenance/v0.3.27.44 branch without tagging
      # most commits. Confirmed from that branch's history: 44.4 is acfae33's
      # direct parent of 44.3 with no other change on this build path (its real
      # PyPI wheel is byte-identical to 44.3's own save for the version string);
      # 44.6 is fca3050, three commits later, after a DYNAMIC_LIST x86_64/i686-only
      # wheel-shrink refactor (irrelevant to riscv64, confirmed by diffing their
      # real PyPI x86_64 wheels) - both pinned by commit, same as any other
      # untagged-release port (gotcha 103/319).
      - name: Determine upstream ref for ${{ env.OPENBLAS_VERSION }}
        run: |
          case "$OPENBLAS_VERSION" in
            0.3.27.44.4) echo "OPENBLAS_REF=acfae339810e47dacb33f378a5ba1f9390d907a9" >> "$GITHUB_ENV" ;;
            0.3.27.44.6) echo "OPENBLAS_REF=fca3050fbd57028c1a67ca6817daa318ad54ead5" >> "$GITHUB_ENV" ;;
            *) echo "OPENBLAS_REF=v$OPENBLAS_VERSION" >> "$GITHUB_ENV" ;;
          esac

      - name: Checkout openblas-libs ${{ env.OPENBLAS_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MacPython/openblas-libs
          ref: ${{ env.OPENBLAS_REF }}
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels-repo/patches/scipy-openblas32/${{ env.OPENBLAS_VERSION }}/*.patch

      - name: Build OpenBLAS
        run: |
          set -xeo pipefail
          source tools/build_steps.sh
          before_build
          clean_code OpenBLAS v0.3.27
          build_lib "$PLAT" "$INTERFACE64" "0"

      - name: Build and test wheel
        run: |
          set -xeo pipefail
          docker_image="quay.io/pypa/${MB_ML_LIBC}${MB_ML_VER}_${PLAT}"
          docker run --rm -e INTERFACE64="$INTERFACE64" -e MB_ML_LIBC="$MB_ML_LIBC" \
            -v "$(pwd)":/openblas "$docker_image" /bin/bash -xe /openblas/tools/build_wheel.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scipy-openblas32-${{ env.OPENBLAS_VERSION }}-py3-none-${{ matrix.libc }}_riscv64
          path: dist/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (gcc) for scipy-openblas32 ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      OPENBLAS_VERSION: ${{ matrix.version }}

    steps:
      # OpenBLAS's Fortran code is built with gfortran; ci-repair-wheel.sh
      # RPATH-patches the manylinux image's libgfortran into the wheel.
      # Only the manylinux leg is collected here - the manylinux-image RPM
      # tooling this action uses has no musllinux/APK equivalent yet. If the
      # musllinux build turns out to also vendor a dynamic libgfortran, this
      # needs a follow-up with an apk-based source collector.
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc gcc-gfortran
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scipy-openblas32-${{ env.OPENBLAS_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish scipy-openblas32 ${{ matrix.version }}
    needs: [setup, build_wheels, build_wheels_legacy, gpl_sources]
    # build_wheels/build_wheels_legacy each skip when setup_legacy routes no
    # version their way; !failure() (not the default implicit needs-success
    # check) is what lets publish still run on the other one.
    if: needs.setup.outputs.versions != '[]' && !cancelled() && !failure()
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scipy-openblas32-${{ matrix.version }}-py3-none-*riscv64
      gpl-sources-artifact: scipy-openblas32-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
