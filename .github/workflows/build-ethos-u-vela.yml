---
# This workflow is based on upstream's [tool.cibuildwheel] config:
# https://gitlab.arm.com/artificial-intelligence/ethos-u/ethos-u-vela/-/blob/5.2.0/pyproject.toml
name: Build ethos-u-vela wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ethos-u-vela.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ethos-u-vela.yml'
      - 'docs/packages/ethos-u-vela.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ethos-u-vela.yml'
      - 'docs/packages/ethos-u-vela.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ethos-u-vela
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ethos-u-vela ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ethos-u-vela"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        export ETHOS_U_VELA_VERSION='${{ matrix.version }}'
        set -euo pipefail
        shopt -s dotglob
        rm -rf ./*
        git clone -q --depth 1 --branch "${ETHOS_U_VELA_VERSION}" https://gitlab.arm.com/artificial-intelligence/ethos-u/ethos-u-vela.git .

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" sparse-checkout init --cone
        git -C "python-wheels" sparse-checkout set "patches/ethos-u-vela"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/ethos-u-vela/${{ matrix.version }}/*.patch
        rm -rf python-wheels

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py only passes -j to CMake for `build_ext --parallel`, which pip never sets.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }} CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ETHOS_U_VELA_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ethos-u-vela-${{ env.ETHOS_U_VELA_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for ext in ("ethosu/mlw_codec.", "ethosu/regor."):
              assert any(n.startswith(ext) and n.endswith(".so") for n in names), ext
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt"} | {f"ethosu/regor/dependencies/thirdparty/{d}/LICENSE" for d in ("flatbuffers", "fmt", "gemmlowp", "pybind11")}, licences
          EOF

  publish:
    name: Publish ethos-u-vela ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ethos-u-vela-${{ matrix.version }}-*-manylinux_riscv64
