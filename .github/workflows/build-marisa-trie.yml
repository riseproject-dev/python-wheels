---
# This workflow is based on the `os-built-distributions` job of
# https://github.com/pytries/marisa-trie/blob/1.4.1/.github/workflows/build-and-publish.yml
# and the `tests` job of
# https://github.com/pytries/marisa-trie/blob/1.4.1/.github/workflows/tests.yml
name: Build marisa-trie wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/marisa-trie.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-marisa-trie.yml'
      - 'docs/packages/marisa-trie.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-marisa-trie.yml'
      - 'docs/packages/marisa-trie.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: marisa-trie
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build marisa-trie ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"
        include:
          # Upstream runs the suite a second time under pytest-run-parallel on
          # free-threaded interpreters.
          - python: "cp314t"
            parallel_test: " && python -m pytest tests --parallel-threads 4"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "marisa-trie"
      version: "${{ matrix.version }}"
      repository: "pytries/marisa-trie"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      checkout-submodules: "true"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # hypothesis has no riscv64 wheel on public PyPI
      # nh3 (readme_renderer) has no free-threaded riscv64 wheel; keep pip off
      # its Rust sdist so it falls back to the bleach-based readme_renderer
      cibw-test-environment: "PIP_ONLY_BINARY=nh3"
      cibw-test-extras: "test"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest tests${{ matrix.parallel_test }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"
        include:
          # Upstream runs the suite a second time under pytest-run-parallel on
          # free-threaded interpreters.
          - python: "cp314t"
            parallel_test: " && python -m pytest tests --parallel-threads 4"
    env:
      MARISA_TRIE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: marisa-trie-${{ env.MARISA_TRIE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("marisa_trie.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish marisa-trie ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: marisa-trie-${{ matrix.version }}-*-manylinux_riscv64
