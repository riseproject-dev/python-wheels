---
# This workflow is based on the `os-built-distributions` job of
# https://github.com/pytries/marisa-trie/blob/1.4.1/.github/workflows/build-and-publish.yml
# and the `tests` job of
# https://github.com/pytries/marisa-trie/blob/1.4.1/.github/workflows/tests.yml
name: Build marisa-trie wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'marisa-trie version to build (git tag, e.g. 1.4.1)'
        required: true
        default: '1.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-marisa-trie.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MARISA_TRIE_VERSION: ${{ inputs.version || '1.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build marisa-trie ${{ inputs.version || '1.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"
        include:
          # Upstream runs the suite a second time under pytest-run-parallel on
          # free-threaded interpreters.
          - python: "cp314t"
            parallel_test: " && python -m pytest tests --parallel-threads 4"

    steps:
      - name: Checkout marisa-trie ${{ env.MARISA_TRIE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pytries/marisa-trie
          ref: ${{ env.MARISA_TRIE_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # hypothesis has no riscv64 wheel on public PyPI
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # nh3 (readme_renderer) has no free-threaded riscv64 wheel; keep pip off
          # its Rust sdist so it falls back to the bleach-based readme_renderer
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=nh3
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_COMMAND: python -m pytest tests${{ matrix.parallel_test }}

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("marisa_trie.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: marisa-trie-${{ env.MARISA_TRIE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish marisa-trie ${{ inputs.version || '1.4.1' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: marisa-trie-${{ env.MARISA_TRIE_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
