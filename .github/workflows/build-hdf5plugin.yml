---
# Based on the `build_wheels` job of
# https://github.com/silx-kit/hdf5plugin/blob/7.0.0/.github/workflows/release.yml
name: Build hdf5plugin wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hdf5plugin.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hdf5plugin.yml'
      - 'docs/packages/hdf5plugin.yaml'
      - 'patches/hdf5plugin/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hdf5plugin.yml'
      - 'docs/packages/hdf5plugin.yaml'
      - 'patches/hdf5plugin/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hdf5plugin
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build hdf5plugin ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "hdf5plugin"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        set -euo pipefail
        shopt -s dotglob
        rm -rf ./*
        git init -q .
        git remote add origin https://github.com/silx-kit/hdf5plugin
        git fetch -q --depth=1 origin "v${{ matrix.version }}"
        git checkout -q FETCH_HEAD

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/hdf5plugin/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # setup.py's BDistWheel.get_tag() forces py3-none, so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # Mirrors release.yml's non-x86 matrix entries (with_sse2: false): a portable
      # build with no host-native SIMD/OpenMP baked in. HDF5PLUGIN_BMI2 is left at
      # its default (True on Linux) -- zstd's BMI2 asm self-gates on __x86_64__, a
      # no-op here, same as upstream leaves it for ppc64le/aarch64.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,h5py,blosc2 HDF5PLUGIN_OPENMP=False HDF5PLUGIN_NATIVE=False HDF5PLUGIN_SSE2=False HDF5PLUGIN_SSSE3=False HDF5PLUGIN_AVX2=False HDF5PLUGIN_AVX512=False HDF5PLUGIN_CPP11=True HDF5PLUGIN_CPP14=True HDF5PLUGIN_CPP20=True"
      cibw-before-test: "pip install packaging h5py blosc2 --only-binary \":all:\""
      cibw-test-command: "python {project}/test/test.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      HDF5PLUGIN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: hdf5plugin-${{ env.HDF5PLUGIN_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import os, sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          plugins = {n.rsplit("/", 1)[1] for n in names
                     if n.startswith("hdf5plugin/plugins/") and n.endswith(".so")}
          expected = {
              "libh5blosc.so",
              "libh5blosc2.so",
              "libh5bshuf.so",
              "libh5bzip2.so",
              "libh5fcidecomp.so",
              "libh5lz4.so",
              "libh5sperr.so",
              "libh5sz.so",
              "libh5sz3.so",
              "libh5zfp.so",
              "libh5zstd.so",
          }
          licence_count = 35

          # 7.1.0 adds the HTJ2K filter, which brings h5z-htj2k and the OpenJPH
          # it vendors, hence two more licences.
          if tuple(int(p) for p in os.environ["HDF5PLUGIN_VERSION"].split(".")) >= (7, 1):
              expected.add("libh5htj2k.so")
              licence_count += 2

          assert plugins == expected, plugins

          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert len(licences) == licence_count, licences
          EOF

  publish:
    name: Publish hdf5plugin ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hdf5plugin-${{ matrix.version }}-*-manylinux_riscv64
