---
# This workflow is based on: https://github.com/foundation-model-stack/fastsafetensors/blob/0.3.3/.github/workflows/publish.yaml
name: Build fastsafetensors wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastsafetensors.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastsafetensors.yml'
      - 'docs/packages/fastsafetensors.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastsafetensors.yml'
      - 'docs/packages/fastsafetensors.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastsafetensors
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastsafetensors ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fastsafetensors
      version: ${{ matrix.version }}
      repository: foundation-model-stack/fastsafetensors
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # CUDA/HIP/cuFile are dlopen'd at runtime (fastsafetensors/cpp/gpu_compat.h);
      # no GPU headers or libraries are needed at build time.
      cibw-test-command: python {project}/tests/smoke_import_cpp.py
      timeout-minutes: 60

  publish:
    name: Publish fastsafetensors ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastsafetensors-${{ matrix.version }}-*-manylinux_riscv64
