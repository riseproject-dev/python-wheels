---
# This workflow is based on: https://github.com/foundation-model-stack/fastsafetensors/blob/0.3.3/.github/workflows/publish.yaml
name: Build fastsafetensors wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fastsafetensors version to build (git tag, e.g. 0.3.3)'
        required: true
        default: '0.3.3'
  pull_request:
    paths:
      - '.github/workflows/build-fastsafetensors.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.3.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.3.3 there.
  FASTSAFETENSORS_VERSION: ${{ inputs.version || '0.3.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fastsafetensors ${{ inputs.version || '0.3.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout fastsafetensors ${{ env.FASTSAFETENSORS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: foundation-model-stack/fastsafetensors
          ref: ${{ env.FASTSAFETENSORS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # CUDA/HIP/cuFile are dlopen'd at runtime (fastsafetensors/cpp/gpu_compat.h);
          # no GPU headers or libraries are needed at build time.
          CIBW_TEST_COMMAND: python {project}/tests/smoke_import_cpp.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastsafetensors-${{ env.FASTSAFETENSORS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastsafetensors ${{ inputs.version || '0.3.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fastsafetensors-${{ inputs.version || '0.3.3' }}-*-manylinux_riscv64
