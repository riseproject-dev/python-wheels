---
# This workflow is based on: https://github.com/llvm/circt/blob/firtool-1.157.0/.github/workflows/uploadWheels.yml
name: Build circt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/circt.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-circt.yml'
      - 'docs/packages/circt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-circt.yml'
      - 'docs/packages/circt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: circt
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build circt ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "circt"
      version: "${{ matrix.version }}"
      repository: "llvm/circt"
      ref: "firtool-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 1440
      checkout-submodules: "true"
      checkout-fetch-depth: 2
      pre-build: |-
        git fetch --force --unshallow --tags --no-recurse-submodules

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        set -euo pipefail
        nanobind_version="$(sed -n 's/.*"nanobind==\([^"]*\)".*/\1/p' lib/Bindings/Python/pyproject.toml)"
        git clone --depth 1 --branch "v${nanobind_version}" --recurse-submodules --shallow-submodules \
          https://github.com/wjakob/nanobind.git "${RUNNER_TEMP}/nanobind"
        cp LICENSE lib/Bindings/Python/LICENSE
        cp llvm/llvm/LICENSE.TXT lib/Bindings/Python/LICENSE.llvm
        cp "${RUNNER_TEMP}/nanobind/LICENSE" lib/Bindings/Python/LICENSE.nanobind
        cp "${RUNNER_TEMP}/nanobind/ext/robin_map/LICENSE" lib/Bindings/Python/LICENSE.robin-map

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > integration_test/Bindings/Python/lit.cfg.py <<'EOF'
        import os
        import sys

        import lit.formats

        config.name = "CIRCT Python bindings"
        config.test_format = lit.formats.ShTest()
        config.suffixes = [".py"]
        config.excludes = ["lit.cfg.py"]
        config.test_source_root = os.path.dirname(__file__)
        config.test_exec_root = "/tmp/circt-lit"
        config.available_features.add("bindings_python")
        config.substitutions.append(("%PYTHON%", f'"{sys.executable}"'))
        EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "lib/Bindings/Python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      # Default ninja -j and ld.bfd exhaust the runner's 15GB (it went silent 7h in); setup.py switches to lld when present.
      cibw-before-all: "dnf -y install lld"
      cibw-environment-linux: "CMAKE_BUILD_PARALLEL_LEVEL=3"
      cibw-before-test: "dnf -y install llvm"
      cibw-test-command: "python {project}/llvm/llvm/utils/lit/lit.py -v {project}/integration_test/Bindings/Python"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CIRCT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: circt-${{ env.CIRCT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.llvm", "LICENSE.nanobind", "LICENSE.robin-map"}, licences
          EOF

  publish:
    name: Publish circt ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: circt-${{ matrix.version }}-*-manylinux_riscv64
