---
# This workflow is based on upstream's own wheel-builder.yml (itself adapted
# from pyca/cryptography): https://github.com/getlogbook/logbook/blob/1.10.1/.github/workflows/wheel-builder.yml
name: Build logbook wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'logbook version to build (git tag, e.g. 1.10.1)'
        required: true
        default: '1.10.1'
  pull_request:
    paths:
      - '.github/workflows/build-logbook.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.10.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.10.1 there.
  LOGBOOK_VERSION: ${{ inputs.version || '1.10.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build logbook ${{ inputs.version || '1.10.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): setuptools-rust is not passed --py-limited-api.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout logbook ${{ env.LOGBOOK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: getlogbook/logbook
          ref: ${{ env.LOGBOOK_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No Rust in the manylinux image; install it and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest pytest-rerunfailures
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: logbook-${{ env.LOGBOOK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish logbook ${{ inputs.version || '1.10.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: logbook-${{ inputs.version || '1.10.1' }}-*-manylinux_riscv64
