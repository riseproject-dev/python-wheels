---
# livekit-blingfire has no git tag for any release; PyPI's 1.1.0 wheels were
# built from livekit/agents commit 3bea770e (its own build_blingfire job,
# since removed after the package moved out of this monorepo):
#   https://github.com/livekit/agents/blob/3bea770e545b7aa02c2c34cf8f8d8022e5fbd1ed/.github/workflows/build.yml
name: Build livekit-blingfire wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/livekit-blingfire.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-livekit-blingfire.yml'
      - 'docs/packages/livekit-blingfire.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-livekit-blingfire.yml'
      - 'docs/packages/livekit-blingfire.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # No upstream tag exists for this version; move together with the version above.
  LIVEKIT_BLINGFIRE_REF: 3bea770e545b7aa02c2c34cf8f8d8022e5fbd1ed
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: livekit-blingfire
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build livekit-blingfire ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "livekit-blingfire"
      version: "${{ matrix.version }}"
      repository: "livekit/agents"
      ref: "3bea770e545b7aa02c2c34cf8f8d8022e5fbd1ed"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        cp LICENSE livekit-plugins/livekit-blingfire/LICENSE
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/microsoft/BlingFire/master/LICENSE" -o livekit-plugins/livekit-blingfire/LICENSE.blingfire

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "livekit-plugins/livekit-blingfire"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # {project} is the checkout root (monorepo) with package-dir set;
      # test_import.py lives under {package} instead (gotcha 5).
      cibw-test-command: "python3 {package}/test_import.py && python3 -c \"import lk_blingfire as m; assert m.__file__.endswith('.so'), m.__file__\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      LIVEKIT_BLINGFIRE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: livekit-blingfire-${{ env.LIVEKIT_BLINGFIRE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          libs = [n for n in names if n.endswith(".so")]
          assert libs and all("lk_blingfire" in n for n in libs), libs
          licences = {n.rsplit("/", 1)[-1] for n in names
                      if "dist-info/" in n and n.rsplit("/", 1)[-1].startswith("LICENSE")}
          assert licences == {"LICENSE", "LICENSE.blingfire"}, licences
          EOF

  publish:
    name: Publish livekit-blingfire ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: livekit-blingfire-${{ matrix.version }}-*-manylinux_riscv64
