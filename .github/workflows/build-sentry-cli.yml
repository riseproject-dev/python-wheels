---
# This workflow is based on: https://github.com/getsentry/sentry-cli/blob/3.7.0/.github/workflows/build.yml
# (its linux + python-base jobs). Upstream repacks its prebuilt musl binaries into
# the python-base wheel (scripts/wheels); setuptools-rust's RustBin builds that
# same binary from source, so the riscv64 wheel is built natively instead.
name: Build sentry-cli wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sentry-cli.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sentry-cli.yml'
      - 'docs/packages/sentry-cli.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sentry-cli.yml'
      - 'docs/packages/sentry-cli.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sentry-cli
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sentry-cli ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      SENTRY_CLI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout sentry-cli ${{ env.SENTRY_CLI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: getsentry/sentry-cli
          ref: ${{ env.SENTRY_CLI_VERSION }}
          persist-credentials: false

      # The wheel is one py3-none executable, so a single build serves every interpreter.
      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # perl-core: openssl-src (static-ssl) needs FindBin/IPC::Cmd, absent from Rocky 10's minimal perl.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install perl-core &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sentry-cli-${{ env.SENTRY_CLI_VERSION }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test sentry-cli ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      SENTRY_CLI_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    steps:
      - name: Checkout sentry-cli ${{ env.SENTRY_CLI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: getsentry/sentry-cli
          ref: ${{ env.SENTRY_CLI_VERSION }}
          persist-credentials: false
          sparse-checkout: tests/integration

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sentry-cli-${{ env.SENTRY_CLI_VERSION }}-manylinux_riscv64
          path: dist

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links dist sentry-cli

      # Upstream's tests are Rust trycmd cases, never packaged; replay the offline
      # ones against the installed binary with the same fixtures and expected output.
      - name: Test wheel
        run: |
          set -euo pipefail
          sentry-cli --version | grep -Fx "sentry-cli ${SENTRY_CLI_VERSION}"
          sentry-cli --help >/dev/null

          sentry-cli debug-files check tests/integration/_fixtures/elf-Linux-ARMv7-ls | tee check.out
          grep -F 'Debug ID: 307a5402-9480-8ec2-25f1-a4adc744a991' check.out
          grep -F 'Usable: yes' check.out

          work=$(mktemp -d)
          cp -R tests/integration/_fixtures/inject_split/. "$work"
          (cd "$work" && sentry-cli sourcemaps inject ./code ./maps)
          diff -r "$work" tests/integration/_expected_outputs/sourcemaps/sourcemaps-inject-split

  publish:
    name: Publish sentry-cli ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: sentry-cli-${{ matrix.version }}-manylinux_riscv64
