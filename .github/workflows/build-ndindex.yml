---
# Based on upstream's own wheel build:
#   https://github.com/Quansight-Labs/ndindex/blob/1.10.1/.github/workflows/publish-package.yml
name: Build ndindex wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ndindex.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ndindex.yml'
      - 'docs/packages/ndindex.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ndindex.yml'
      - 'docs/packages/ndindex.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ndindex
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build ndindex ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      NDINDEX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ndindex ${{ env.NDINDEX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quansight-Labs/ndindex
          ref: ${{ env.NDINDEX_VERSION }}
          # versioneer derives the version from the tag history
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          uv pip install build twine
          python -m build --sdist .
          twine check --strict dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ndindex-${{ env.NDINDEX_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build ndindex ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream also builds musllinux; dropped here because we publish no
        # musllinux_riscv64 numpy or hypothesis wheel to test against.
        python: ["cp312", "cp313", "cp314", "cp314t"]
    env:
      NDINDEX_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ndindex-${{ env.NDINDEX_VERSION }}-sdist
          path: dist/

      # Extracted at the workspace root so cibuildwheel's cwd is the sdist tree
      # and CIBW_TEST_SOURCES can stage upstream's conftest.py.
      - name: Extract sdist
        run: tar zxf dist/*.tar.gz --strip-components=1

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: numpy hypothesis pytest sympy packaging
          CIBW_TEST_SOURCES: conftest.py
          # Upstream's wheel job only imports the module; run the suite that
          # ships inside the wheel instead. --hypothesis-disable-deadline is
          # upstream's own flag: the per-example deadline is sized for their x86
          # runners.
          CIBW_TEST_COMMAND: >-
            python -c "import ndindex._slice as s, ndindex._tuple as t; assert s.__file__.endswith('.so') and t.__file__.endswith('.so'), (s.__file__, t.__file__)" &&
            python -m pytest --pyargs ndindex -v --hypothesis-disable-deadline
          CIBW_TEST_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,hypothesis
        with:
          only: ${{ matrix.python }}-manylinux_riscv64

      - name: Check the wheel ships the extension modules
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = {n.rsplit("/", 1)[-1].split(".")[0]
                   for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.endswith(".so")}
          assert names == {"_slice", "_tuple"}, names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ndindex-${{ matrix.version }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ndindex ${{ matrix.version }}
    needs: [setup, build_sdist, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: ndindex-${{ matrix.version }}-*-manylinux_riscv64
