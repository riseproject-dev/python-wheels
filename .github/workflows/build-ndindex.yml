---
# Based on upstream's own wheel build:
#   https://github.com/Quansight-Labs/ndindex/blob/1.10.1/.github/workflows/publish-package.yml
name: Build ndindex wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ndindex.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ndindex.yml'
      - 'docs/packages/ndindex.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ndindex.yml'
      - 'docs/packages/ndindex.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ndindex
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ndindex ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ndindex
      version: ${{ matrix.version }}
      # The PyPI sdist contains conftest.py and the package test suite.
      source: pypi-sdist
      post-build: |-
        python3 - $GITHUB_WORKSPACE/wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        names = {n.rsplit("/", 1)[-1].split(".")[0]
                 for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.endswith(".so")}
        assert names == {"_slice", "_tuple"}, names
        EOF
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 240
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: numpy hypothesis pytest sympy packaging
      cibw-test-sources: conftest.py
      # Upstream's wheel job only imports the module; run the suite that
      # ships inside the wheel instead. --hypothesis-disable-deadline is
      # upstream's own flag: the per-example deadline is sized for their x86
      # runners.
      cibw-test-command: >
        python -c "import ndindex._slice as s, ndindex._tuple as t; assert s.__file__.endswith('.so') and t.__file__.endswith('.so'), (s.__file__, t.__file__)" &&
        python -m pytest --pyargs ndindex -v --hypothesis-disable-deadline
      cibw-test-environment: >
        PIP_ONLY_BINARY=numpy,hypothesis
  publish:
    name: Publish ndindex ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ndindex-${{ matrix.version }}-*-manylinux_riscv64
