---
# This workflow is based on the `build_wheels` job of
# https://github.com/K0lb3/texture2ddecoder/blob/3ebc3b758bd6b1a3108b50148f7998ee34f058c6/.github/workflows/release.yml
name: Build texture2ddecoder wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/texture2ddecoder.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-texture2ddecoder.yml'
      - 'docs/packages/texture2ddecoder.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-texture2ddecoder.yml'
      - 'docs/packages/texture2ddecoder.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: texture2ddecoder
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build texture2ddecoder ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: texture2ddecoder
      version: ${{ matrix.version }}
      repository: K0lb3/texture2ddecoder
      ref: 3ebc3b758bd6b1a3108b50148f7998ee34f058c6
      artifact-tag: cp311-abi3-manylinux_riscv64
      # Upstream cuts releases without git tags, so pin the release commit: this is
      # "feat: use Py_buffer, remove 3.7 support (cibuildwheel), make 3.11 use abi3",
      # whose tree is byte-identical to the 1.0.6 PyPI sdist. Update it alongside
      # the package version.
      # setup.py's own bdist_wheel subclass tags every build cp311-abi3 when
      # CIBUILDWHEEL is set and the interpreter is >=3.11 - no CIBW config
      # needed to opt in. It has no Py_GIL_DISABLED guard, so a cp314t build
      # would define Py_LIMITED_API under a free-threaded interpreter and hit
      # CPython's own "limited API is not supported in the free-threaded
      # build" #error; upstream doesn't publish a free-threaded wheel either
      # (no Free Threading classifier), so cp314t is dropped rather than
      # patched in.
      cibw-build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
      # Upstream's test.yml: `pip install .[tests]` + `pytest -vs ./tests`.
      cibw-test-extras: tests
      cibw-test-command: pytest {package}/tests -v
      # The [tests] extra pulls in Pillow, which ships no riscv64 wheel on public
      # PyPI; ours is what the test env installs. PIP_ONLY_BINARY keeps pip from
      # falling back to a from-source build (it needs libjpeg headers we lack).
      cibw-environment-linux: "PIP_ONLY_BINARY=Pillow"
      timeout-minutes: 90

  publish:
    name: Publish texture2ddecoder ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: texture2ddecoder-${{ matrix.version }}-*-manylinux_riscv64
