---
# Based on the `wheels` job of
# https://github.com/nalgeon/sqlean.py/blob/3.50.4.5/.github/workflows/publish.yaml
name: Build sqlean-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sqlean-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlean-py.yml'
      - 'docs/packages/sqlean-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlean-py.yml'
      - 'docs/packages/sqlean-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sqlean-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sqlean-py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sqlean-py"
      version: "${{ matrix.version }}"
      repository: "nalgeon/sqlean.py"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 30

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Mirrors upstream's `download-sources` job: sqlite/sqlean sources
      # aren't checked in, they're fetched at build time (Makefile).
      cibw-before-build: "dnf install -y unzip && make prepare-src download-sqlite download-sqlean"
      cibw-test-sources: "tests setup.py README.md"
      # tests/extensions.py imports setup.py (for SQLEAN_VERSION), which
      # imports setuptools; the test venv doesn't have it otherwise.
      cibw-test-requires: "setuptools"
      cibw-test-command: "python -m tests"

  publish:
    name: Publish sqlean-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sqlean-py-${{ matrix.version }}-*-manylinux_riscv64
