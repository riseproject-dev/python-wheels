---
# This workflow is based on the `wheels-linux-s390x` job of
# https://github.com/Qiskit/qiskit/blob/2.5.2/.github/workflows/wheels-build.yml
name: Build qiskit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qiskit.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit.yml'
      - 'docs/packages/qiskit.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qiskit.yml'
      - 'docs/packages/qiskit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qiskit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qiskit ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "qiskit"
      version: "${{ matrix.version }}"
      repository: "Qiskit/qiskit"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 1440
      # setup.py's py_limited_api="cp310" makes cp310 both the wheel's tag and
      # the interpreter it must be built on; upstream's extra cp311-cp315
      # entries only re-run the whole stestr suite, hours of it on riscv64.
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp310-manylinux_riscv64"
      # Replaces (not merges into) upstream's own [tool.cibuildwheel.linux]
      # environment table, so its four variables are repeated here alongside
      # our registry.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" CARGO_NET_GIT_FETCH_WITH_CLI=\"true\" RUSTUP_TOOLCHAIN=\"stable\" QISKIT_BUILD_WITH_MIMALLOC=1"
      # Upstream's own repair-wheel-command also runs abi3audit via pipx,
      # which the riscv64 image doesn't carry; cibuildwheel's own default
      # audit-command already abi3audits every abi3-tagged wheel natively
      # after this repair step runs, so drop the pipx layer here.
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      QISKIT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: qiskit-${{ env.QISKIT_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contains the compiled extension
        run: |
          set -eu
          for whl in wheelhouse/*.whl; do
            echo "$whl"
            unzip -l "$whl" | grep '\.so$'
          done

  publish:
    name: Publish qiskit ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: qiskit-${{ matrix.version }}-*-manylinux_riscv64
