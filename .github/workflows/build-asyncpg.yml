---
# This workflow is based on: https://github.com/MagicStack/asyncpg/blob/v0.31.0/.github/workflows/release.yml
name: Build asyncpg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asyncpg.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncpg.yml'
      - 'docs/packages/asyncpg.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncpg.yml'
      - 'docs/packages/asyncpg.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asyncpg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build asyncpg ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: asyncpg
      version: ${{ matrix.version }}
      repository: MagicStack/asyncpg
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's before-all scripts only know debian/almalinux/centos/alpine and
      # bail on the Rocky 10 riscv64 image; install the same packages directly.
      cibw-before-all-linux: >-
        dnf install -y --setopt=install_weak_deps=False
        postgresql-server postgresql-contrib libpq-devel
        krb5-server krb5-workstation krb5-devel
        && useradd -m -s /bin/bash apgtest
      # setuptools 82 dropped pkg_resources, which setup.py imports to cythonise;
      # pyproject only floors setuptools, so pin it and drop build isolation.
      cibw-before-build: pip install "setuptools<82" "Cython>=3.2.1,<4.0.0" wheel
      cibw-build-frontend: "build; args: --no-isolation"
      # uvloop, in upstream's inherited `test` group, has no riscv64 wheel on PyPI.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      timeout-minutes: 180

  publish:
    name: Publish asyncpg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: asyncpg-${{ matrix.version }}-*-manylinux_riscv64
