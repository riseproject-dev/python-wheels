---
# This workflow is based on: https://github.com/aiortc/pylibsrtp/blob/1.0.0/.github/workflows/tests.yml (package-wheel)
name: Build pylibsrtp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pylibsrtp version to build (git tag, e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-pylibsrtp.yml'
      - 'patches/pylibsrtp/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYLIBSRTP_VERSION: ${{ inputs.version || '1.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pylibsrtp ${{ inputs.version || '1.0.0' }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60

    steps:
      - name: Checkout pylibsrtp ${{ env.PYLIBSRTP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aiortc/pylibsrtp
          ref: ${{ env.PYLIBSRTP_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pylibsrtp source
        run: git apply python-wheels/patches/pylibsrtp/${{ env.PYLIBSRTP_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # cp310 first: setup.py forces the cp310-abi3 tag regardless of the
          # build interpreter (gotcha 96); the later entries build nothing,
          # they only re-test the one wheel.
          CIBW_BUILD: >-
            cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # aiortc/aioquic-openssl (scripts/fetch-vendor.py) has no riscv64 build;
          # the patch falls back to the image's own openssl-devel, whose runtime
          # .so auditwheel then vendors (Apache-2.0) into the wheel without a
          # licence, so stage one. libsrtp is linked statically (BSD-3-Clause).
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install openssl-devel &&
            cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl &&
            curl -fsSL --retry 5 https://raw.githubusercontent.com/cisco/libsrtp/v2.7.0/LICENSE -o {project}/LICENSE.libsrtp
          CIBW_BEFORE_BUILD: python scripts/build-libsrtp.py /tmp/vendor
          CIBW_ENVIRONMENT: >-
            CFLAGS=-I/tmp/vendor/include
            LDFLAGS=-L/tmp/vendor/lib
            PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests

      - name: Check the wheel ships the extension and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pylibsrtp/_binding") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.libsrtp", "LICENSE.openssl"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pylibsrtp-${{ env.PYLIBSRTP_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pylibsrtp ${{ inputs.version || '1.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pylibsrtp-${{ inputs.version || '1.0.0' }}-*-manylinux_riscv64
