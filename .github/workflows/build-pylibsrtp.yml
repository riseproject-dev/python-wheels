---
# This workflow is based on: https://github.com/aiortc/pylibsrtp/blob/1.0.0/.github/workflows/tests.yml (package-wheel)
name: Build pylibsrtp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylibsrtp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibsrtp.yml'
      - 'docs/packages/pylibsrtp.yaml'
      - 'patches/pylibsrtp/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibsrtp.yml'
      - 'docs/packages/pylibsrtp.yaml'
      - 'patches/pylibsrtp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylibsrtp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pylibsrtp ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pylibsrtp"
      version: "${{ matrix.version }}"
      repository: "aiortc/pylibsrtp"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pylibsrtp/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # cp310 first: setup.py forces the cp310-abi3 tag regardless of the
      # build interpreter (gotcha 96); the later entries build nothing,
      # they only re-test the one wheel.
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # aiortc/aioquic-openssl (scripts/fetch-vendor.py) has no riscv64 build;
      # the patch falls back to the image's own openssl-devel, whose runtime
      # .so auditwheel then vendors (Apache-2.0) into the wheel without a
      # licence, so stage one. libsrtp is linked statically (BSD-3-Clause).
      cibw-before-all-linux: "dnf -y install openssl-devel && cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl && curl -fsSL --retry 5 https://raw.githubusercontent.com/cisco/libsrtp/v2.7.0/LICENSE -o {project}/LICENSE.libsrtp"
      cibw-before-build: "python scripts/build-libsrtp.py /tmp/vendor"
      cibw-environment-linux: "CFLAGS=-I/tmp/vendor/include LDFLAGS=-L/tmp/vendor/lib PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig"
      cibw-test-command: "python -m unittest discover -s {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYLIBSRTP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pylibsrtp-${{ env.PYLIBSRTP_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pylibsrtp/_binding") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.libsrtp", "LICENSE.openssl"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pylibsrtp ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pylibsrtp-${{ matrix.version }}-*-manylinux_riscv64
