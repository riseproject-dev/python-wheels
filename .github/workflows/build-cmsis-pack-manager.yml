---
# Based on upstream's own wheel build at this tag:
#   https://github.com/pyocd/cmsis-pack-manager/blob/v0.6.0/.github/workflows/ci-build-wheel.yml
name: Build cmsis-pack-manager wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmsis-pack-manager.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmsis-pack-manager.yml'
      - 'docs/packages/cmsis-pack-manager.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmsis-pack-manager.yml'
      - 'docs/packages/cmsis-pack-manager.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmsis-pack-manager
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmsis-pack-manager ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmsis-pack-manager"
      version: "${{ matrix.version }}"
      repository: "pyocd/cmsis-pack-manager"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 180
      # maturin's cffi bindings reach the Rust cdylib through cffi's ABI mode, so
      # the wheel is py3-none: one build serves every interpreter, and the further
      # identifiers only re-run the test command against it.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64 cp314t-manylinux_riscv64"
      # Upstream also installs libffi-devel, libatomic and openssl-devel here; the
      # first two the image already ships, and the crate graph uses rustls.
      cibw-before-all-linux: "curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain 1.71.1 --profile=minimal -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-extras: "test"
      # hypothesis' newest release has no free-threaded riscv64 wheel, and pip
      # resolves by version, not by what has one; ours is a release older.
      cibw-test-environment: "PIP_ONLY_BINARY=hypothesis"
      cibw-test-command: "pytest --cache-clear"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CMSIS_PACK_MANAGER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmsis-pack-manager-${{ env.CMSIS_PACK_MANAGER_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries the Rust cdylib
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(
                  n.endswith("cmsis_pack_manager/libcmsis_pack_manager.so") for n in names
              ), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish cmsis-pack-manager ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmsis-pack-manager-${{ matrix.version }}-py3-none-manylinux_riscv64
