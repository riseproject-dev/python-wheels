---
# This workflow is based on the `build_wheels` job of
# https://github.com/urschrei/simplification/blob/v1.0.0/.github/workflows/wheels.yml
name: Build simplification wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'simplification version to build (git tag is v<version>)'
        required: true
        default: '1.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-simplification.yml'
      - 'patches/simplification/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.0.0 there.
  SIMPLIFICATION_VERSION: ${{ inputs.version || '1.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's own CI resolves urschrei/rdp's latest release tag dynamically
  # (find-latest-tag) and downloads its prebuilt librdp.so; there is no riscv64
  # asset, so we build it from source instead (gotcha 77), pinned to the tag
  # that was latest when simplification 1.0.0 shipped.
  RDP_TAG: v0.15.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build simplification ${{ inputs.version || '1.0.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # scikit-build-core builds a single cp311-abi3 wheel (pyproject.toml's
          # wheel.py-api) covering CPython 3.11+; built on cp311, the oldest
          # interpreter the tag claims, and re-tested on the newer ones.
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
            timeout: 90
          - tag: cp314t
            build: cp314t-manylinux_riscv64
            timeout: 60

    steps:
      - name: Checkout simplification v${{ env.SIMPLIFICATION_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: urschrei/simplification
          ref: v${{ env.SIMPLIFICATION_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The wheel bundles librdp.so (see CIBW_BEFORE_ALL_LINUX below), which is
      # MIT-licensed; the wheel ships only simplification's own licence unless
      # rdp's is added to license-files too.
      - name: Patch simplification source
        run: |
          git apply python-wheels/patches/simplification/${{ env.SIMPLIFICATION_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
          # crashes the audit step: it asserts a host `uv`, which the self-hosted
          # riscv64 runner doesn't have (gotcha 13).
          CIBW_BUILD_FRONTEND: build
          # Upstream downloads a prebuilt librdp.so from urschrei/rdp's releases;
          # there is no riscv64 asset, so build it from source instead (gotcha 77)
          # and stage it (plus the cbindgen header CMakeLists.txt also installs)
          # where CMakeLists.txt's find_library/cutil.pyx expect them.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            git clone --depth 1 --branch ${{ env.RDP_TAG }}
            https://github.com/urschrei/rdp /tmp/rdp &&
            cd /tmp/rdp &&
            $HOME/.cargo/bin/cargo build --release --features headers &&
            cp target/release/librdp.so include/header.h {project}/src/simplification/
          # numpy/cython have riscv64 wheels only on our registry; cython-cmake
          # and scikit-build-core are pure Python and resolve from public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - name: Check wheel contents
        if: ${{ matrix.tag == 'cp311-abi3' }}
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-cp311-abi3-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1] for n in names if n.endswith(".abi3.so")}
          assert exts == {"cutil.abi3.so"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.md", "LICENSE_rdp"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simplification-${{ env.SIMPLIFICATION_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish simplification ${{ inputs.version || '1.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: simplification-${{ inputs.version || '1.0.0' }}-*-manylinux_riscv64
