---
# This workflow is based on the `build_wheels` job of
# https://github.com/urschrei/simplification/blob/v1.0.0/.github/workflows/wheels.yml
name: Build simplification wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/simplification.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-simplification.yml'
      - 'docs/packages/simplification.yaml'
      - 'patches/simplification/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-simplification.yml'
      - 'docs/packages/simplification.yaml'
      - 'patches/simplification/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's own CI resolves urschrei/rdp's latest release tag dynamically
  # (find-latest-tag) and downloads its prebuilt librdp.so; there is no riscv64
  # asset, so we build it from source instead (gotcha 77), pinned to the tag
  # that was latest when simplification 1.0.0 shipped.
  RDP_TAG: v0.15.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: simplification
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build simplification ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # scikit-build-core builds a single cp311-abi3 wheel (pyproject.toml's
          # wheel.py-api) covering CPython 3.11+; built on cp311, the oldest
          # interpreter the tag claims, and re-tested on the newer ones.
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
            timeout: 90
          - tag: cp314t
            build: cp314t-manylinux_riscv64
            timeout: 60

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "simplification"
      version: "${{ matrix.version }}"
      repository: "urschrei/simplification"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: "${{ matrix.timeout }}"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/simplification/${{ matrix.version }}/00*.patch

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.build }}"
      # cibuildwheel's build[uv] frontend (upstream's pyproject.toml default)
      # crashes the audit step: it asserts a host `uv`, which the self-hosted
      # riscv64 runner doesn't have (gotcha 13).
      cibw-build-frontend: "build"
      # Upstream downloads a prebuilt librdp.so from urschrei/rdp's releases;
      # there is no riscv64 asset, so build it from source instead (gotcha 77)
      # and stage it (plus the cbindgen header CMakeLists.txt also installs)
      # where CMakeLists.txt's find_library/cutil.pyx expect them.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && git clone --depth 1 --branch v0.15.0 https://github.com/urschrei/rdp /tmp/rdp && cd /tmp/rdp && $HOME/.cargo/bin/cargo build --release --features headers && cp target/release/librdp.so include/header.h {project}/src/simplification/"
      # numpy/cython have riscv64 wheels only on our registry; cython-cmake
      # and scikit-build-core are pure Python and resolve from public PyPI.
      # PATH: from 2.0.0 the build backend is maturin, which looks for cargo on
      # PATH and otherwise tries to rustup-install into a temp dir (and fails:
      # "Target triple not supported by rustup: riscv64-unknown-linux-gnu");
      # CIBW_BEFORE_ALL_LINUX's rustup puts it in ~/.cargo/bin.
      cibw-environment-linux: "PATH=$HOME/.cargo/bin:$PATH"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # scikit-build-core builds a single cp311-abi3 wheel (pyproject.toml's
          # wheel.py-api) covering CPython 3.11+; built on cp311, the oldest
          # interpreter the tag claims, and re-tested on the newer ones.
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
            timeout: 90
          - tag: cp314t
            build: cp314t-manylinux_riscv64
            timeout: 60
    env:
      SIMPLIFICATION_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: simplification-${{ env.SIMPLIFICATION_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        if: ${{ matrix.tag == 'cp311-abi3' }}
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-cp311-abi3-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1] for n in names if n.endswith(".abi3.so")}
          assert exts == {"cutil.abi3.so"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.md", "LICENSE_rdp"}, licences
          EOF

  publish:
    name: Publish simplification ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: simplification-${{ matrix.version }}-*-manylinux_riscv64
