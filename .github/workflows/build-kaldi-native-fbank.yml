# Based on the `build_wheels` job of
# https://github.com/csukuangfj/kaldi-native-fbank/blob/v1.22.3/.github/workflows/build-wheels.yaml
name: Build kaldi-native-fbank wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kaldi-native-fbank.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldi-native-fbank.yml'
      - 'docs/packages/kaldi-native-fbank.yaml'
      - 'patches/kaldi-native-fbank/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldi-native-fbank.yml'
      - 'docs/packages/kaldi-native-fbank.yaml'
      - 'patches/kaldi-native-fbank/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kaldi-native-fbank
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build kaldi-native-fbank ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "kaldi-native-fbank"
      version: "${{ matrix.version }}"
      repository: "csukuangfj/kaldi-native-fbank"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pybind11 3.0's find_package(Python ...) ignores setup.py's legacy
      # -DPYTHON_EXECUTABLE hint; on cp314t it resolves an unrelated system
      # python3.15 instead of the build venv, so the extension is compiled
      # (and named) for the wrong interpreter. cmake_extension.py reads this
      # var directly and skips its own default when it's set, so both the
      # release flag and the (modern-cased) executable hint are repeated here.
      cibw-environment-linux: "KALDI_NATIVE_FBANK_CMAKE_ARGS=\"-DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python)\""
      cibw-test-requires: "pytest numpy torch"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,torch"
      # test_online_fbank.py/test_online_mfcc.py need kaldifeat, which isn't
      # published anywhere, and self-skip via sys.exit(0) -- fatal to pytest
      # collection, so they're excluded. test_rfft.py/test_feature_demo.py/
      # test_online_raw_audio_samples.py are __main__-only scripts upstream
      # never wired into pytest; run them directly instead.
      cibw-test-command: "python -m pytest {project}/kaldi-native-fbank/python/tests -v --ignore={project}/kaldi-native-fbank/python/tests/test_online_fbank.py --ignore={project}/kaldi-native-fbank/python/tests/test_online_mfcc.py --ignore={project}/kaldi-native-fbank/python/tests/test_rfft.py --ignore={project}/kaldi-native-fbank/python/tests/test_feature_demo.py --ignore={project}/kaldi-native-fbank/python/tests/test_online_raw_audio_samples.py && python {project}/kaldi-native-fbank/python/tests/test_rfft.py && python {project}/kaldi-native-fbank/python/tests/test_feature_demo.py && python {project}/kaldi-native-fbank/python/tests/test_online_raw_audio_samples.py"

  publish:
    name: Publish kaldi-native-fbank ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: kaldi-native-fbank-${{ matrix.version }}-*-manylinux_riscv64
