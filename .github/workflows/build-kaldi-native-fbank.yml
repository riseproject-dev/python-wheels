# SPDX-License-Identifier: MIT
# Based on the `build_wheels` job of
# https://github.com/csukuangfj/kaldi-native-fbank/blob/v1.22.3/.github/workflows/build-wheels.yaml
name: Build kaldi-native-fbank wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'kaldi-native-fbank version to build (git tag without the leading v, e.g. 1.22.3)'
        required: true
        default: '1.22.3'
  pull_request:
    paths:
      - '.github/workflows/build-kaldi-native-fbank.yml'
      - 'patches/kaldi-native-fbank/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.22.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  KALDI_NATIVE_FBANK_VERSION: ${{ inputs.version || '1.22.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build kaldi-native-fbank ${{ inputs.version || '1.22.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout kaldi-native-fbank v${{ env.KALDI_NATIVE_FBANK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: csukuangfj/kaldi-native-fbank
          ref: v${{ env.KALDI_NATIVE_FBANK_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/kaldi-native-fbank/${{ env.KALDI_NATIVE_FBANK_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pybind11 3.0's find_package(Python ...) ignores setup.py's legacy
          # -DPYTHON_EXECUTABLE hint; on cp314t it resolves an unrelated system
          # python3.15 instead of the build venv, so the extension is compiled
          # (and named) for the wrong interpreter. cmake_extension.py reads this
          # var directly and skips its own default when it's set, so both the
          # release flag and the (modern-cased) executable hint are repeated here.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            KALDI_NATIVE_FBANK_CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python)"
          CIBW_TEST_REQUIRES: pytest numpy torch
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,torch
          # test_online_fbank.py/test_online_mfcc.py need kaldifeat, which isn't
          # published anywhere, and self-skip via sys.exit(0) -- fatal to pytest
          # collection, so they're excluded. test_rfft.py/test_feature_demo.py/
          # test_online_raw_audio_samples.py are __main__-only scripts upstream
          # never wired into pytest; run them directly instead.
          CIBW_TEST_COMMAND: >-
            python -m pytest {project}/kaldi-native-fbank/python/tests -v
            --ignore={project}/kaldi-native-fbank/python/tests/test_online_fbank.py
            --ignore={project}/kaldi-native-fbank/python/tests/test_online_mfcc.py
            --ignore={project}/kaldi-native-fbank/python/tests/test_rfft.py
            --ignore={project}/kaldi-native-fbank/python/tests/test_feature_demo.py
            --ignore={project}/kaldi-native-fbank/python/tests/test_online_raw_audio_samples.py &&
            python {project}/kaldi-native-fbank/python/tests/test_rfft.py &&
            python {project}/kaldi-native-fbank/python/tests/test_feature_demo.py &&
            python {project}/kaldi-native-fbank/python/tests/test_online_raw_audio_samples.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaldi-native-fbank-${{ env.KALDI_NATIVE_FBANK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish kaldi-native-fbank ${{ inputs.version || '1.22.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: kaldi-native-fbank-${{ inputs.version || '1.22.3' }}-*-manylinux_riscv64
