---
# This workflow is based on the `manylinux` and `tests` jobs of
# https://github.com/0x676e67/rnet/blob/v2.4.2/.github/workflows/ci.yml
name: Build rnet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rnet.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rnet.yml'
      - 'docs/packages/rnet.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rnet.yml'
      - 'docs/packages/rnet.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rnet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rnet ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3: pyo3 has no abi3 feature enabled in rnet's Cargo.toml, so wheels
        # are per-interpreter. Upstream's only free-threaded wheel is cp313t
        # (pyo3 0.25); the riscv64 manylinux image ships cp314t but not cp313t, and
        # upstream doesn't build cp314t, so there is no free-threaded wheel to build.
        python: ["cp312", "cp313", "cp314"]

    env:
      RNET_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout rnet v${{ env.RNET_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 0x676e67/rnet
          ref: v${{ env.RNET_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # wreq's btls-sys (BoringSSL bindings) runs bindgen (libclang) and
          # `git apply`s its own patches.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            dnf install -y clang-devel git
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            CARGO_BUILD_JOBS=2
          CIBW_TEST_REQUIRES: pytest pytest-asyncio pytest-rerunfailures
          CIBW_TEST_SOURCES: tests README.md Cargo.toml LICENSE
          CIBW_TEST_COMMAND: >-
            python -c "import rnet.rnet as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rnet-${{ env.RNET_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rnet ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: rnet-${{ matrix.version }}-*-manylinux_riscv64
