---
# This workflow is based on the `manylinux` and `tests` jobs of
# https://github.com/0x676e67/rnet/blob/v2.4.2/.github/workflows/ci.yml
name: Build rnet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rnet.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rnet.yml'
      - 'docs/packages/rnet.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rnet.yml'
      - 'docs/packages/rnet.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rnet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rnet ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: rnet
      version: ${{ matrix.version }}
      repository: 0x676e67/rnet
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # wreq's btls-sys (BoringSSL bindings) runs bindgen (libclang) and
      # `git apply`s its own patches.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        dnf install -y clang-devel git
      # rnet gitignores Cargo.lock and every wreq 5.x / wreq-util 2.x release is
      # yanked; cargo only resolves a yanked version that is already locked, so
      # seed the lock with the versions the 2.4.2 release sdist locks.
      cibw-before-build-linux: >-
        printf 'version = 4\n\n[[package]]\nname = "wreq"\nversion = "5.3.0"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\n\n[[package]]\nname = "wreq-util"\nversion = "2.2.6"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\n' > Cargo.lock &&
        cargo update --workspace
      cibw-environment-linux: >-
        PATH="$PATH:$HOME/.cargo/bin"
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        CARGO_BUILD_JOBS=2
      cibw-test-requires: pytest pytest-asyncio pytest-rerunfailures
      cibw-test-sources: tests README.md Cargo.toml LICENSE
      cibw-test-command: >-
        python -c "import rnet.rnet as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests
      timeout-minutes: 360

  publish:
    name: Publish rnet ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rnet-${{ matrix.version }}-*-manylinux_riscv64
