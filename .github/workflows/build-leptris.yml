---
# Based on the `test`/`build` jobs of
# https://github.com/leptris/leptris-py/blob/8056856a8a192c2dae64a7401d7285f68a3cf909/.github/workflows/release.yml
name: Build leptris wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/leptris.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-leptris.yml'
      - 'docs/packages/leptris.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-leptris.yml'
      - 'docs/packages/leptris.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # leptris-py cuts releases by pushing a version bump straight to main (no
  # git tags; release.yml's publish job triggers on that push), so pin the
  # release commit (gotcha 103). 8056856 is "ride: engine 1.9.402, publish
  # 1.9.402.0" - byte-identical to the 1.9.402.0 PyPI sdist on every file
  # except an untracked-by-sdist manual repro script. Update alongside the
  # version entry in docs/packages/leptris.yaml.
  LEPTRIS_PY_REF: 8056856a8a192c2dae64a7401d7285f68a3cf909
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: leptris
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build leptris ${{ matrix.version }} ${{ matrix.tag }}-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp39-abi3, cp314t]
        libc: [manylinux, musllinux]
        include:
          - tag: cp39-abi3
            build: cp312
          - tag: cp314t
            build: cp314t

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: leptris
      version: ${{ matrix.version }}
      # The PyPI sdist contains the vendored libleptris sources and licence.
      source: pypi-sdist
      post-build: |-
        python3 - $GITHUB_WORKSPACE/wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("leptris/_leptrisaccel") and n.endswith(".so") for n in names), names
            assert any(n == "leptris/_vendor/libleptris.so" for n in names), names
            assert "leptris/_vendor/engine/LICENSE.md" in names, names
            sources = [n for n in names if n.startswith("leptris/_vendor/engine/src/") and n.endswith(".c")]
            assert len(sources) >= 10, (whl, len(sources))
            licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licenses == {"LICENSE"}, (whl, licenses)
            print(whl, "ok")
        EOF
      artifact-tag: ${{ matrix.tag }}-${{ matrix.libc }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.build }}-${{ matrix.libc }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # setup.py's build_with_engine command cmake-builds vendor/libleptris
      # into leptris/_vendor/ itself (the sdist's zero-setup source-install
      # path - no LEPTRIS_LIB_PATH, no prebuilt archive); it only needs
      # cmake on PATH. The engine SOURCE + licence are staged under
      # leptris/_vendor/engine/ beside it so the wheel carries both, same
      # layout scripts/vendor_libleptris.sh produces for upstream's own
      # wheels (pyproject.toml's package-data globs already expect it).
      # tests/test_packaging.py's TestVendoredLayout also requires the
      # top-level engine/CMakeLists.txt (not just src/'s own nested one)
      # and a _vendor/README.md rebuild note - both are what
      # vendor_libleptris.sh stages for upstream's own wheels.
      cibw-before-build: >
        pip install cmake &&
        mkdir -p leptris/_vendor/engine &&
        cp vendor/libleptris/CMakeLists.txt leptris/_vendor/engine/CMakeLists.txt &&
        cp -r vendor/libleptris/src leptris/_vendor/engine/src &&
        cp -r vendor/libleptris/cmake leptris/_vendor/engine/cmake &&
        cp vendor/libleptris/LICENSE.md leptris/_vendor/engine/LICENSE.md &&
        echo "libleptris is vendored here; see engine/ for its source and CMakeLists.txt to rebuild." > leptris/_vendor/README.md
      cibw-test-requires: pytest
      cibw-test-command: pytest {project}/tests -q
      # cp39-abi3's _leptrisaccel.abi3.so calls PyObject_CallNoArgs, a
      # real CPython API function that was only added to the LIMITED
      # (abi3) API in 3.10 - cibuildwheel's default
      # abi3audit --strict flags that as a baseline/computed mismatch
      # against our cp39 floor (gotcha 134). Confirmed on upstream's own
      # released manylinux2014_x86_64 wheel for 1.9.402.0 too (identical
      # abi3audit report), so this is a property of leptris-py itself,
      # not of the riscv64 port - disable the redundant audit rather
      # than patch around someone else's wheel-compat metadata.
      cibw-audit-command: ''

  publish:
    name: Publish leptris ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: leptris-${{ matrix.version }}-*riscv64
