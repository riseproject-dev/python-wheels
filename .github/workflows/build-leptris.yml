---
# Based on the `test`/`build` jobs of
# https://github.com/leptris/leptris-py/blob/8056856a8a192c2dae64a7401d7285f68a3cf909/.github/workflows/release.yml
name: Build leptris wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/leptris.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-leptris.yml'
      - 'docs/packages/leptris.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-leptris.yml'
      - 'docs/packages/leptris.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # leptris-py cuts releases by pushing a version bump straight to main (no
  # git tags; release.yml's publish job triggers on that push), so pin the
  # release commit (gotcha 103). 8056856 is "ride: engine 1.9.402, publish
  # 1.9.402.0" - byte-identical to the 1.9.402.0 PyPI sdist on every file
  # except an untracked-by-sdist manual repro script. Update alongside the
  # version entry in docs/packages/leptris.yaml.
  LEPTRIS_PY_REF: 8056856a8a192c2dae64a7401d7285f68a3cf909
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: leptris
      version: ${{ inputs.version }}

  sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      LEPTRIS_VERSION: ${{ matrix.version }}

    steps:
      # libleptris tags as v<engine>, one component short of the wheel
      # version's trailing iteration digit (libleptris-version.txt / family
      # law), same mapping build-teptris.yml uses for libteptris.
      - id: tag
        run: echo "libleptris_ref=v${LEPTRIS_VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout leptris-py @ ${{ env.LEPTRIS_PY_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: leptris/leptris-py
          ref: ${{ env.LEPTRIS_PY_REF }}
          persist-credentials: false

      - name: Checkout libleptris ${{ steps.tag.outputs.libleptris_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: leptris/leptris
          ref: ${{ steps.tag.outputs.libleptris_ref }}
          path: libleptris-src
          persist-credentials: false

      # Mirrors scripts/prepare_sdist_vendor.sh: the pinned engine release,
      # grafted under vendor/ (MANIFEST.in's `graft vendor/libleptris`) so
      # setup.py's self-contained mode cmake-builds it at install time on
      # any platform with a C compiler + cmake - no CIBW_BEFORE_ALL archive,
      # no PGO (that is upstream's own release pipeline only).
      - name: Vendor libleptris into the sdist
        run: |
          set -eux
          mkdir -p vendor/libleptris
          cp -R libleptris-src/. vendor/libleptris/
          rm -rf vendor/libleptris/.git

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        run: |
          uv pip install build
          python -m build --sdist

      - name: Self-test the sdist
        run: |
          uv venv /tmp/sdt
          uv pip install --python /tmp/sdt/bin/python "$PWD"/dist/*.tar.gz
          cd /tmp
          /tmp/sdt/bin/python -c '
          import leptris
          root = leptris.fromstring("<a><b id=\"1\"/></a>")
          assert root.tag == "a"
          assert root[0].get("id") == "1"
          assert root.xpath("count(//b)") == 1.0
          print("sdist self-test OK")
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: leptris-${{ env.LEPTRIS_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build leptris ${{ matrix.version }} ${{ matrix.tag }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp39-abi3, cp314t]
        libc: [manylinux, musllinux]
        include:
          - tag: cp39-abi3
            build: cp312
            enable: ''
          - tag: cp314t
            build: cp314t
            enable: cpython-freethreading

    env:
      LEPTRIS_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: leptris-${{ env.LEPTRIS_VERSION }}-sdist

      - id: sdist_path
        run: echo "path=$(echo ${{ steps.fetch_sdist.outputs.download-path }}/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
          output-dir: wheelhouse/
          only: ${{ matrix.build }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENABLE: ${{ matrix.enable }}
          # setup.py's build_with_engine command cmake-builds vendor/libleptris
          # into leptris/_vendor/ itself (the sdist's zero-setup source-install
          # path - no LEPTRIS_LIB_PATH, no prebuilt archive); it only needs
          # cmake on PATH. The engine SOURCE + licence are staged under
          # leptris/_vendor/engine/ beside it so the wheel carries both, same
          # layout scripts/vendor_libleptris.sh produces for upstream's own
          # wheels (pyproject.toml's package-data globs already expect it).
          CIBW_BEFORE_BUILD: >-
            pip install cmake &&
            mkdir -p leptris/_vendor/engine &&
            cp -r vendor/libleptris/src leptris/_vendor/engine/src &&
            cp -r vendor/libleptris/cmake leptris/_vendor/engine/cmake &&
            cp vendor/libleptris/LICENSE.md leptris/_vendor/engine/LICENSE.md
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/tests -q

      - name: Check the wheel carries the compiled accelerator, engine and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("leptris/_leptrisaccel") and n.endswith(".so") for n in names), names
              assert any(n == "leptris/_vendor/libleptris.so" for n in names), names
              assert "leptris/_vendor/engine/LICENSE.md" in names, names
              sources = [n for n in names if n.startswith("leptris/_vendor/engine/src/") and n.endswith(".c")]
              assert len(sources) >= 10, (whl, len(sources))
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {"LICENSE"}, (whl, licenses)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: leptris-${{ env.LEPTRIS_VERSION }}-${{ matrix.tag }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish leptris ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: leptris-${{ matrix.version }}-*riscv64
