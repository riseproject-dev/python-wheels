---
# Based on upstream's Linux wheel job, which drives cibuildwheel straight from
# the python/ subdirectory (hatchling custom build hook compiles libtl2cgen.so
# via CMake and tags the wheel py3-none-<platform> itself, no manual cmake
# invocation or retagging needed):
#   https://github.com/dmlc/tl2cgen/blob/1.0.0/ops/build-linux.sh
name: Build tl2cgen wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tl2cgen.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tl2cgen.yml'
      - 'docs/packages/tl2cgen.yaml'
      - 'patches/tl2cgen/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tl2cgen.yml'
      - 'docs/packages/tl2cgen.yaml'
      - 'patches/tl2cgen/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Pinned explicitly so the gpl_sources job pulls the same image the wheel's
  # vendored libgomp came from.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tl2cgen
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tl2cgen ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tl2cgen"
      version: "${{ matrix.version }}"
      repository: "dmlc/tl2cgen"
      ref: "${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/tl2cgen/${{ matrix.version }}/0001-*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp LICENSE python/LICENSE
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "python"
      # The custom hatchling build hook tags the wheel py3-none-<platform>
      # itself (sysconfig.get_platform()), so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # CMAKE_POLICY_VERSION_MINIMUM covers the vendored fmtlib's old cmake_minimum_required.
      # `-include cstdint`: the FetchContent'd Treelite 4.1.2 (src/gtil/postprocessor.h)
      # relies on <cstdint> arriving transitively, which GCC 13+'s libstdc++ no longer does.
      cibw-environment-linux: "CMAKE_POLICY_VERSION_MINIMUM=3.5 CXXFLAGS=\"-include cstdint\""
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-sources: "tests/example_data"
      # test_basic.py itself is not run: check_predictor() builds its DMatrix
      # from a SciPy CSR matrix via np.array(..., copy=False, dtype=cast),
      # which numpy 2 (the only line with a riscv64 wheel) rejects outright
      # on any platform -- a tl2cgen/numpy2 gap, not a riscv64 one.
      # DMatrix-from-dense-ndarray with no dtype override asks for no such cast.
      cibw-test-command: |-
        python3 - <<'PYEOF'
        import numpy as np
        import treelite, tl2cgen

        model = treelite.frontend.load_xgboost_model_legacy_binary(
        'tests/example_data/mushroom/mushroom.model')
        tl2cgen.export_lib(model, toolchain='gcc', libpath='/tmp/mushroom.so', verbose=True)
        predictor = tl2cgen.Predictor(libpath='/tmp/mushroom.so', verbose=True)
        data = np.random.rand(5, predictor.num_feature).astype('float32')
        out = predictor.predict(tl2cgen.DMatrix(data))
        assert out.size == 5 and np.isfinite(out).all(), out
        print(out.flatten())
        PYEOF
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      TL2CGEN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tl2cgen-${{ env.TL2CGEN_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries libtl2cgen and a vendored libgomp
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("tl2cgen/lib/libtl2cgen.so", "libgomp"):
              if not any(want in n for n in names):
                  raise SystemExit(f"error: {want} missing from {sys.argv[1]}")
          print("\n".join(n for n in names if ".so" in n))
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (gcc) for tl2cgen ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv
    env:
      TL2CGEN_VERSION: ${{ matrix.version }}

    steps:
      # auditwheel vendors the image's libgomp.so.1 into the wheel.
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tl2cgen-${{ env.TL2CGEN_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish tl2cgen ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tl2cgen-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: tl2cgen-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
