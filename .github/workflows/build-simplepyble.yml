---
# Based on the `build-wheels` job of
# https://github.com/simpleble/simpleble/blob/v1.1.0/.github/workflows/ci_simplepyble.yml
name: Build simplepyble wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/simplepyble.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-simplepyble.yml'
      - 'docs/packages/simplepyble.yaml'
      - 'patches/simplepyble/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-simplepyble.yml'
      - 'docs/packages/simplepyble.yaml'
      - 'patches/simplepyble/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: simplepyble
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build simplepyble ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "simplepyble"
      version: "${{ matrix.version }}"
      repository: "simpleble/simpleble"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        export SIMPLEPYBLE_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" sparse-checkout init --cone
        git -C "python-wheels" sparse-checkout set "patches/simplepyble"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/simplepyble/$SIMPLEPYBLE_VERSION"
        if [ -d "$patches" ]; then
          git apply "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-licenses.sh <<'COLLECT_EOF'
        #!/bin/bash
        # SPDX-FileCopyrightText: 2026 The RISE Project
        # SPDX-License-Identifier: MIT
        #
        # Stage, at the project root, the licence of every shared library
        # auditwheel vendors out of the build image alongside libdbus-1.
        # setuptools' default LICENSE* glob copies them into the wheel.
        set -euo pipefail

        project="${1:?usage: collect-licenses.sh <project-dir>}"

        # ldd is transitive, so libdbus-1 alone covers its whole closure;
        # ldd does not list the root itself, so resolve that too.
        mapfile -t libs < <(
            {
                ldd /usr/lib64/libdbus-1.so | tr ' ' '\n' | grep '^/'
                readlink -f /usr/lib64/libdbus-1.so
            } | sort -u
        )

        # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
        # glibc and the gcc runtime are on auditwheel's manylinux allowlist and
        # are never vendored into the wheel.
        mapfile -t pkgs < <(
            rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                grep -E '^[A-Za-z0-9._+-]+$' | sort -u |
                grep -vE '^(glibc|libgcc|libstdc\+\+|gcc)$'
        )

        for pkg in "${pkgs[@]}"; do
            mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

            # Some subpackages leave the licence to a sibling of the same source RPM.
            if [ -z "${files[0]:-}" ]; then
                srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                mapfile -t files < <(
                    rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                        awk -v s="$srpm" '$1 == s { print $2 }' |
                        xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                )
            fi

            # Others mark it %doc rather than %license, and the image installs no docs.
            if [ -z "${files[0]:-}" ]; then
                dnf -y --disablerepo=extras reinstall --setopt=tsflags= "$pkg" >/dev/null
                mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
            fi

            for f in "${files[@]}"; do
                [ -f "$f" ] || continue
                cp "$f" "$project/LICENSE.${pkg}.$(basename "$f")"
            done
            compgen -G "$project/LICENSE.$pkg.*" >/dev/null ||
                { echo "no licence file found for $pkg" >&2; exit 1; }
        done

        ls -1 "$project"/LICENSE.* | sed "s|$project/||"
        COLLECT_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf install -y dbus-devel && bash {project}/collect-licenses.sh {project}"
      cibw-test-requires: "pytest"
      # upstream's suite targets the Plain (mock) backend; only these two are backend-independent.
      # Since 1.3.0 the module has an autouse fixture that fetches a Bluetooth adapter,
      # which needs the system D-Bus (absent in the build container) for this Linux
      # backend, so the two tests are called directly instead of through pytest.
      cibw-test-command: "python -c \"import sys; sys.path.insert(0, '{project}/simplepyble/test'); import test_simpleble as t; t.test_configuration_parity(); t.test_platform_enums()\" && python -c \"import simplepyble; assert simplepyble.get_operating_system() == simplepyble.OperatingSystem.LINUX\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SIMPLEPYBLE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: simplepyble-${{ env.SIMPLEPYBLE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the extension and every vendored library's licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import json, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          sos = sorted(n for n in names if n.endswith(".so") or ".so." in n)
          print("\n".join(sos))
          assert any(n.startswith("simplepyble/_simplepyble.") for n in sos), sos

          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          assert "LICENSE.md" in lic, lic
          have_pkgs = {f.split(".", 2)[1] for f in lic if f.startswith("LICENSE.") and f != "LICENSE.md"}

          sbom = next(n for n in names if n.endswith("sboms/auditwheel.cdx.json"))
          vendored = {
              c["purl"].split("/")[2].split("@")[0]
              for c in json.loads(z.read(sbom))["components"]
              if c.get("purl", "").startswith("pkg:rpm/")
          }
          print("vendored:", sorted(vendored))
          assert "dbus-libs" in vendored, vendored
          assert vendored <= have_pkgs, vendored - have_pkgs
          EOF

  gpl_sources:
    name: Collect GPL sources for simplepyble ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: simplepyble
      version: ${{ matrix.version }}
      # dbus-libs/libcap/systemd-libs are the copyleft (GPL/LGPL) libraries auditwheel
      # vendors out of the build image alongside libdbus-1.
      packages: gcc dbus-libs libcap systemd-libs

  publish:
    name: Publish simplepyble ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: simplepyble-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: simplepyble-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc and the copyleft libraries bundled in the wheel
