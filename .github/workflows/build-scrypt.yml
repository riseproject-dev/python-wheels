---
# This workflow is based on: https://github.com/holgern/py-scrypt/blob/v0.9.4/.github/workflows/wheels_linux.yml
name: Build scrypt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scrypt.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scrypt.yml'
      - 'docs/packages/scrypt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scrypt.yml'
      - 'docs/packages/scrypt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scrypt
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scrypt ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "scrypt"
      version: "${{ matrix.version }}"
      repository: "holgern/py-scrypt"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py links libcrypto (openssl/aes.h software fallback path);
      # openssl-devel isn't in the base image. auditwheel then vendors its
      # runtime .so, so its licence has to travel with the wheel too, along
      # with the vendored scrypt-1.3.3 C library's own COPYRIGHT - neither
      # is covered by the top-level LICENSE (different copyright holders).
      cibw-before-all-linux: "dnf -y install openssl-devel && cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl && cp {project}/scrypt-1.3.3/COPYRIGHT {project}/LICENSE.scrypt-1.3.3"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest --pyargs scrypt"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SCRYPT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: scrypt-${{ env.SCRYPT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and every licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_scrypt.cpython") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.openssl", "LICENSE.scrypt-1.3.3"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish scrypt ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scrypt-${{ matrix.version }}-*-manylinux_riscv64
