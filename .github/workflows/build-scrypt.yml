---
# This workflow is based on: https://github.com/holgern/py-scrypt/blob/v0.9.4/.github/workflows/wheels_linux.yml
name: Build scrypt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scrypt.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scrypt.yml'
      - 'docs/packages/scrypt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scrypt.yml'
      - 'docs/packages/scrypt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scrypt
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scrypt ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      SCRYPT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout scrypt ${{ env.SCRYPT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: holgern/py-scrypt
          ref: v${{ env.SCRYPT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py links libcrypto (openssl/aes.h software fallback path);
          # openssl-devel isn't in the base image. auditwheel then vendors its
          # runtime .so, so its licence has to travel with the wheel too, along
          # with the vendored scrypt-1.3.3 C library's own COPYRIGHT - neither
          # is covered by the top-level LICENSE (different copyright holders).
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install openssl-devel &&
            cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl &&
            cp {project}/scrypt-1.3.3/COPYRIGHT {project}/LICENSE.scrypt-1.3.3
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs scrypt

      - name: Check the wheel ships the extension and every licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_scrypt.cpython") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.openssl", "LICENSE.scrypt-1.3.3"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scrypt-${{ env.SCRYPT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish scrypt ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: scrypt-${{ matrix.version }}-*-manylinux_riscv64
