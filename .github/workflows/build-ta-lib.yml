---
# This workflow is based on: https://github.com/ta-lib/ta-lib-python/blob/v0.7.1/.github/workflows/wheels.yml
name: Build ta-lib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ta-lib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ta-lib.yml'
      - 'docs/packages/ta-lib.yaml'
      - 'patches/ta-lib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ta-lib.yml'
      - 'docs/packages/ta-lib.yaml'
      - 'patches/ta-lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ta-lib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ta-lib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ta-lib"
      version: "${{ matrix.version }}"
      repository: "ta-lib/ta-lib-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/ta-lib/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        talib_c_ver="$(sed -n 's/^  TALIB_C_VER: *//p' .github/workflows/wheels.yml)"
        test -n "$talib_c_ver"
        echo "TALIB_C_VER=${talib_c_ver}" >> "$GITHUB_ENV"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: |-
        curl -fsSL -o talib-$TALIB_C_VER.tar.gz https://github.com/TA-Lib/ta-lib/archive/refs/tags/v$TALIB_C_VER.tar.gz
        mkdir -p ta-lib-$TALIB_C_VER
        tar xzf talib-$TALIB_C_VER.tar.gz --strip-components=1 -C ta-lib-$TALIB_C_VER
        cd ta-lib-$TALIB_C_VER
        mkdir -p include/ta-lib/
        cp include/*.h include/ta-lib/
        cmake -S . -B _build -D CMAKE_BUILD_TYPE=Release -D CMAKE_INSTALL_PREFIX=/project/ta-lib-install
        cmake --build _build -j"$(nproc)"
        cmake --install _build
        cp LICENSE /project/LICENSE.ta-lib-c
      cibw-environment-linux: "CFLAGS=-D_GNU_SOURCE TA_LIBRARY_PATH=/project/ta-lib-install/lib TA_INCLUDE_PATH=/project/ta-lib-install/include PIP_NO_BUILD_ISOLATION=false PIP_ONLY_BINARY=numpy,pandas"
      cibw-environment-pass-linux: "TALIB_C_VER"
      cibw-repair-wheel-command-linux: "LD_LIBRARY_PATH=\"/project/ta-lib-install/lib:$LD_LIBRARY_PATH\" auditwheel repair -w {dest_dir} {wheel}"
      cibw-build-frontend: "build"
      # polars now has a riscv64 wheel on the registry; added so
      # test_stream.py::test_a_result_pickles' inline `import polars`
      # doesn't ModuleNotFoundError. test_polars.py itself stays
      # ignored below (untouched, out of scope for this fix).
      cibw-test-requires: "pytest pandas polars"
      # PyPI's newest polars-runtime-32 has no riscv64 wheel; without this pip builds its sdist.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas,polars,polars-runtime-32"
      cibw-test-command: "cd .. && pytest -k \"not RSI and not threading\" --ignore={project}/tests/test_polars.py {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      TA_LIB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ta-lib-${{ env.TA_LIB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("talib/") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.ta-lib-c"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish ta-lib ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ta-lib-${{ matrix.version }}-*-manylinux_riscv64
