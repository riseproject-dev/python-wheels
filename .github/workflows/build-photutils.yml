---
# This workflow is based on
# https://github.com/astropy/photutils/blob/3.0.0/.github/workflows/publish.yml,
# which calls OpenAstronomy/github-actions-workflows' publish.yml.
name: Build photutils wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/photutils.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-photutils.yml'
      - 'docs/packages/photutils.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-photutils.yml'
      - 'docs/packages/photutils.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: photutils
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # 3.1.0 raised requires-python to >=3.12 and dropped py-limited-api, so every
        # interpreter gets its own wheel; pyproject.toml skips the free-threaded builds.
        python: ["cp312", "cp313", "cp314"]
    name: Build photutils ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240

    env:
      PHOTUTILS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout photutils ${{ env.PHOTUTILS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: astropy/photutils
          ref: ${{ env.PHOTUTILS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PHOTUTILS=${{ env.PHOTUTILS_VERSION }}
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: pytest -p no:warnings --pyargs photutils
          CIBW_TEST_ENVIRONMENT: >-
            PIP_ONLY_BINARY=numpy,scipy,astropy,pyerfa,pyyaml,hypothesis

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          import pathlib
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          # Every Cython source in the checkout must have been compiled into the wheel.
          exts = {n.rsplit("/", 1)[1].split(".")[0] for n in names if n.endswith(".so")}
          pyx = {p.stem for p in pathlib.Path("photutils").rglob("*.pyx")}
          assert pyx and pyx <= exts, sorted(pyx - exts)
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.rst"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: photutils-${{ env.PHOTUTILS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish photutils ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: photutils-${{ matrix.version }}-*-manylinux_riscv64
