---
# This workflow is based on: https://github.com/anibali/pywebp/blob/v0.4.0/.github/workflows/build_and_test.yml
name: Build webp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/webp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-webp.yml'
      - 'docs/packages/webp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-webp.yml'
      - 'docs/packages/webp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: webp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build webp ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "webp"
      version: "${{ matrix.version }}"
      repository: "anibali/pywebp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # abi3 (py_limited_api=cp38 in setup.py): cp39 is the riscv64 image's
      # oldest interpreter, but the output wheel is still tagged cp38-abi3.
      cibw-build: "cp39-manylinux_riscv64"
      cibw-build-frontend: "build"
      cibw-project-requires-python: ">=3.8"
      # libwebp's Conan recipe tool_requires cmake/[>=3.17], and conancenter's
      # cmake/4.x recipe is Invalid on riscv64 (binaries for x86_64/armv8
      # only), so declare the image's own CMake as a platform tool. builder.py
      # regenerates the default profile with `conan profile detect -f`, so this
      # goes in a separate profile that includes it, selected via
      # CONAN_DEFAULT_PROFILE (Conan reads [platform_tool_requires] from the
      # host profile here; the build profile alone is not enough).
      cibw-before-all: "mkdir -p ~/.conan2/profiles && printf 'include(default)\\n\\n[platform_tool_requires]\\ncmake/%s\\n' \"$(cmake --version | head -n1 | cut -d' ' -f3)\" > ~/.conan2/profiles/riscv64"
      cibw-environment-linux: "CONAN_DEFAULT_PROFILE=riscv64 PYWEBP_COMPILE_TARGET=riscv64 PIP_ONLY_BINARY=numpy,Pillow,cffi"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest --import-mode=importlib {package}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      WEBP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: webp-${{ env.WEBP_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_webp"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish webp ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: webp-${{ matrix.version }}-*-manylinux_riscv64
