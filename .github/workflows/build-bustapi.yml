---
# This workflow is based on the `build-wheels` job of
# https://github.com/RUSTxPY/BustAPI/blob/v0.16.0/.github/workflows/ci.yml
name: Build bustapi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bustapi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bustapi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bustapi ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      BUSTAPI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bustapi v${{ env.BUSTAPI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RUSTxPY/BustAPI
          ref: v${{ env.BUSTAPI_VERSION }}
          persist-credentials: false

      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      # No musl target: rustup.rs ships no riscv64 musl toolchain.
      # --no-default-features drops the default mimalloc allocator (matches upstream's
      # own aarch64/musl legs); kept as it's harmless and matches that precedent, but
      # it is NOT what's behind the test failures below. Investigation so far, all on
      # the same "83 failed, 35 passed, 1 skipped" (ValueError: not enough values to
      # unpack (expected 3, got 0) at wsgi.py, handle_request's compiled 3-tuple return
      # coming back empty on riscv64 only - the identical wheel/test code is fine on
      # x86_64):
      #   - mimalloc on vs off (runs 42887194565 vs 42940422871/43082799628): no change.
      #   - full release (lto=true/codegen-units=1/opt-level=3) vs that profile
      #     overridden off (run 43864759733): no change.
      #   - release vs a full debug build, --release dropped entirely - no
      #     optimization, no LTO, debug assertions on (run 43868520406): no change,
      #     same 83/35/1 split to the test, down to the second (73.9x s).
      #   - a patch adding eprintln! logging around handle_request's final tuple and
      #     Signer::sign's return (run 43891271929, reverted after reading): compiled
      #     clean, the wheel imported fine, the test step still took the full 74.5s
      #     and failed the same 83 tests - but NONE of that logging's own output
      #     showed up anywhere in the log, not even in the "Captured stderr call"
      #     sections that do carry wsgi.py's own traceback.print_exc() output from the
      #     same requests. Unexplained; a future attempt should write to a file
      #     instead of stderr to rule out a capture-mechanism quirk, not assume the
      #     code path was never reached.
      # That rules out the optimizer/codegen as the cause outright - this is a genuine
      # architecture/logic difference, not a miscompile, for the dominant cluster
      # (sessions/middleware/the full _make_response-to-_response_to_rust_format
      # pipeline) - still open as a hypothesis... except it wasn't a separate bug at
      # all: copying the compiled bustapi_core*.so into the checkout (see below) made
      # ALL 83 failures disappear in one run (run 43899709434: "118 passed, 1
      # skipped"), not just the 10-test multiprocess/examples cluster. The real
      # explanation: without that copy, `python/bustapi/` in the checked-out source
      # tree had no compiled extension at all, but Python's import path still favors
      # a same-named directory on `sys.path`/cwd over the venv's installed package in
      # some of these tests' import order - so the *entire* suite was quietly running
      # against whatever partial/stub state was on disk in `python/bustapi/`, not the
      # freshly built wheel, which produced the empty-tuple/MagicMock symptoms
      # throughout. Every mimalloc/LTO/debug-build/eprintln diagnostic above varied
      # the wheel that was never actually being exercised by most tests - hence
      # "identical regardless of optimization level". Lesson for future ports using
      # `pip install dist/*.whl` instead of `maturin develop`: always copy the built
      # extension into the checkout's package dir before testing, not just for
      # subprocess-based tests.
      #
      # A second, separate and fully explained cluster (test_multiprocess_stability,
      # test_new_examples - 10 of the 83): both spawn a fresh subprocess with
      # `sys.path`/`PYTHONPATH` pointed at this checkout's `python/` directory
      # (upstream's own tests, unmodified), expecting `maturin develop` to have left
      # a compiled bustapi_core*.so there - which is what upstream's own ci.yml does
      # (`maturin develop --release`), but this port installs the wheel into the venv
      # instead (`pip install dist/*.whl`), never touching the checkout. Real log
      # confirms it: `ModuleNotFoundError: No module named 'bustapi.bustapi_core'` in
      # the spawned subprocess, before it ever binds a port - which is also why
      # test_new_examples sees "Connection refused". The fix (below) copies the
      # installed .so into the checkout so both the installed wheel and these
      # PYTHONPATH-based subprocess tests find it - and, per above, so does every
      # other test.
      #
      # Separately: docs/packages/bustapi.yaml originally declared both a manylinux
      # and a musllinux target, but this job only ever builds manylinux (no riscv64
      # musl Rust toolchain exists - see above). That made the publish job's release-
      # completeness check fail every run with "release is incomplete; no wheel was
      # built for: 3.10-abi3:musllinux" (run 43899709434's publish job), even once
      # the test step above was all-green. Fixed by dropping the musllinux entry from
      # the YAML, matching every other package that only lists platforms it actually
      # builds.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i python3.12 --no-default-features
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Mirrors upstream's own "Run basic tests" step (ci.yml), minus the
      # lint-only tools (black/ruff/mypy/maturin), against the built wheel
      # instead of a `maturin develop` checkout.
      - name: Test wheel
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
        run: |
          uv pip install --force-reinstall dist/*.whl \
            pytest pytest-asyncio anyio psutil sqlmodel requests
          python -c 'import bustapi, bustapi.bustapi_core as m; assert m.__file__.endswith(".so"), m.__file__'
          cp "$(python -c 'import bustapi.bustapi_core as m; print(m.__file__)')" python/bustapi/
          python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bustapi-${{ env.BUSTAPI_VERSION }}-cp310-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish bustapi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bustapi-${{ matrix.version }}-*-manylinux_riscv64
