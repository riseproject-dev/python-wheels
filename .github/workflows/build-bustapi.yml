---
# This workflow is based on the `build-wheels` job of
# https://github.com/RUSTxPY/BustAPI/blob/v0.16.0/.github/workflows/ci.yml
name: Build bustapi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bustapi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bustapi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bustapi ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      BUSTAPI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bustapi v${{ env.BUSTAPI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RUSTxPY/BustAPI
          ref: v${{ env.BUSTAPI_VERSION }}
          persist-credentials: false

      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      # No musl target: rustup.rs ships no riscv64 musl toolchain.
      # --no-default-features drops the default mimalloc allocator (matches upstream's
      # own aarch64/musl legs) but is NOT what fixes the test failures below: runs
      # 42887194565 (mimalloc on), 42940422871 and 43082799628 (mimalloc off) all show
      # the identical "83 failed, 35 passed" (ValueError: not enough values to unpack
      # (expected 3, got 0) at wsgi.py, handle_request's compiled 3-tuple return coming
      # back empty on riscv64 only - the same wheel/test code is fine on x86_64).
      # CARGO_PROFILE_RELEASE_LTO/CODEGEN_UNITS/OPT_LEVEL below was a second hypothesis
      # (an LLVM riscv64 backend miscompile under Cargo.toml's aggressive release
      # profile) - also DISPROVEN: run 43864759733 with this override in place shows
      # the exact same "83 failed, 35 passed, 1 skipped" again. Left in place for now
      # (harmless either way) while the real cause - invariant to both the allocator
      # and the optimizer, so more likely an architecture/logic difference than a
      # codegen bug - is still under investigation.
      # DIAGNOSTIC, not a shipped change: dropping --release (full debug profile, no
      # optimization, no LTO, debug assertions on) tests whether the corruption above
      # survives with the optimizer entirely out of the picture. If it does, that rules
      # out codegen/optimizer miscompiles altogether (gotcha 188's class of bug) and
      # points at an architecture/logic difference instead (e.g. an insufficiently
      # ordered atomic in the lock-free arc-swap route-table snapshot). To be reverted
      # once this one diagnostic run's result is read, regardless of outcome.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --out dist -i python3.12 --no-default-features
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Mirrors upstream's own "Run basic tests" step (ci.yml), minus the
      # lint-only tools (black/ruff/mypy/maturin), against the built wheel
      # instead of a `maturin develop` checkout.
      - name: Test wheel
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
        run: |
          uv pip install --force-reinstall dist/*.whl \
            pytest pytest-asyncio anyio psutil sqlmodel requests
          python -c 'import bustapi, bustapi.bustapi_core as m; assert m.__file__.endswith(".so"), m.__file__'
          python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bustapi-${{ env.BUSTAPI_VERSION }}-cp310-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish bustapi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bustapi-${{ matrix.version }}-*-manylinux_riscv64
