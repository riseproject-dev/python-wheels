---
# This workflow is based on the `build-wheels` job of
# https://github.com/RUSTxPY/BustAPI/blob/v0.16.0/.github/workflows/ci.yml
name: Build bustapi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bustapi.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bustapi.yml'
      - 'docs/packages/bustapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bustapi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bustapi ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      BUSTAPI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bustapi v${{ env.BUSTAPI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RUSTxPY/BustAPI
          ref: v${{ env.BUSTAPI_VERSION }}
          persist-credentials: false

      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      # No musl target: rustup.rs ships no riscv64 musl toolchain.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i python3.12
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      # Mirrors upstream's own "Run basic tests" step (ci.yml), minus the
      # lint-only tools (black/ruff/mypy/maturin), against the built wheel
      # instead of a `maturin develop` checkout.
      - name: Test wheel
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
        run: |
          uv pip install --force-reinstall dist/*.whl \
            pytest pytest-asyncio anyio psutil sqlmodel requests
          python -c 'import bustapi, bustapi.bustapi_core as m; assert m.__file__.endswith(".so"), m.__file__'
          python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bustapi-${{ env.BUSTAPI_VERSION }}-cp310-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish bustapi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bustapi-${{ matrix.version }}-*-manylinux_riscv64
