---
# This workflow is based on the `linux` job of
# https://github.com/scott-griffiths/tibs/blob/v2.0.1/.github/workflows/new_ci.yaml
name: Build tibs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tibs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tibs.yml'
      - 'docs/packages/tibs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tibs.yml'
      - 'docs/packages/tibs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tibs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tibs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # Upstream builds one abi3 wheel plus a free-threaded wheel per
          # target. cp313t is dropped: the riscv64 manylinux image ships no
          # cp313t.
          - tag: cp311-abi3
            # Built on cp311 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tibs"
      version: "${{ matrix.version }}"
      repository: "scott-griffiths/tibs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # tibs ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest hypothesis pytest-benchmark"
      # doc/ carries the `>>>` examples that tests/test_docs.py runs.
      cibw-test-sources: "tests doc"
      cibw-test-command: "python -m pytest"

  publish:
    name: Publish tibs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tibs-${{ matrix.version }}-*-manylinux_riscv64
