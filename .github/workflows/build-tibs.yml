---
# This workflow is based on the `linux` job of
# https://github.com/scott-griffiths/tibs/blob/v2.0.1/.github/workflows/new_ci.yaml
name: Build tibs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tibs version to build (git tag without the leading v, e.g. 2.0.1)'
        required: true
        default: '2.0.1'
  pull_request:
    paths:
      - '.github/workflows/build-tibs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.0.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.0.1 there.
  TIBS_VERSION: ${{ inputs.version || '2.0.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tibs ${{ inputs.version || '2.0.1' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream builds one abi3 wheel plus a free-threaded wheel per
          # target. cp313t is dropped: the riscv64 manylinux image ships no
          # cp313t.
          - tag: cp311-abi3
            # Built on cp311 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout tibs v${{ env.TIBS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scott-griffiths/tibs
          ref: v${{ env.TIBS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # tibs ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest hypothesis pytest-benchmark
          # doc/ carries the `>>>` examples that tests/test_docs.py runs.
          CIBW_TEST_SOURCES: tests doc
          CIBW_TEST_COMMAND: python -m pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tibs-${{ env.TIBS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tibs ${{ inputs.version || '2.0.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tibs-${{ inputs.version || '2.0.1' }}-*-manylinux_riscv64
