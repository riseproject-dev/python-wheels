---
# This workflow is based on the `linux` job of
# https://github.com/scott-griffiths/tibs/blob/v2.0.1/.github/workflows/new_ci.yaml
name: Build tibs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tibs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tibs.yml'
      - 'docs/packages/tibs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tibs.yml'
      - 'docs/packages/tibs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tibs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tibs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # Upstream builds one abi3 wheel plus a free-threaded wheel per
          # target. cp313t is dropped: the riscv64 manylinux image ships no
          # cp313t.
          - tag: cp311-abi3
            # Built on cp311 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      TIBS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tibs v${{ env.TIBS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scott-griffiths/tibs
          ref: v${{ env.TIBS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # tibs ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest hypothesis pytest-benchmark
          # doc/ carries the `>>>` examples that tests/test_docs.py runs.
          CIBW_TEST_SOURCES: tests doc
          CIBW_TEST_COMMAND: python -m pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tibs-${{ env.TIBS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tibs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tibs-${{ matrix.version }}-*-manylinux_riscv64
