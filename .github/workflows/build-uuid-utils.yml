---
# This workflow is based on: https://github.com/aminalaee/uuid-utils/blob/0.17.0/.github/workflows/ci.yml
name: Build uuid-utils wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'uuid-utils version to build (git tag, e.g. 0.17.0)'
        required: true
        default: '0.17.0'
  pull_request:
    paths:
      - '.github/workflows/build-uuid-utils.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.17.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.17.0 there.
  UUID_UTILS_VERSION: ${{ inputs.version || '0.17.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build uuid-utils ${{ inputs.version || '0.17.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PyO3 extension built per-interpreter (upstream ships cp3x-cp3x wheels,
        # no abi3).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout uuid-utils ${{ env.UUID_UTILS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aminalaee/uuid-utils
          ref: ${{ env.UUID_UTILS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # uuid-utils ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest pytest-codspeed
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: uuid-utils-${{ env.UUID_UTILS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish uuid-utils ${{ inputs.version || '0.17.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: uuid-utils-${{ inputs.version || '0.17.0' }}-*-manylinux_riscv64
