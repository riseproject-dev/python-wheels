---
# Based on upstream's own wheel builder:
#   https://github.com/silx-kit/fabio/blob/v2026.06/.github/workflows/release.yml
name: Build fabio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fabio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fabio.yml'
      - 'docs/packages/fabio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fabio.yml'
      - 'docs/packages/fabio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fabio
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fabio ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fabio
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # hdf5plugin (a hard runtime dep) has no riscv64 wheel and its sdist
      # vendors a large set of its own compression libraries - a separate
      # port in its own right. Keep the wheel install bare and pre-install
      # what the test suite actually exercises instead (gotcha 122).
      cibw-test-environment: PIP_NO_DEPS=1
      cibw-before-test-linux: >
        PIP_NO_DEPS=0 PIP_ONLY_BINARY=numpy,h5py,lxml,pillow pip install numpy h5py lxml pillow filelock
      # fabio.test.test_import unconditionally imports every module,
      # including fabio/qt/dialogs.py, which needs a real Qt binding
      # (PySide6/PyQt); none publish a riscv64 wheel anywhere. Skip that
      # one module - test_all.suite() picks up test_import by name, so
      # stubbing its suite() before building the suite drops just it.
      cibw-test-command: >
        python3 -c "import sys, unittest; from fabio.test import test_all, test_import; test_import.suite = lambda: unittest.TestSuite(); r = unittest.TextTestRunner().run(test_all.suite()); sys.exit(0 if r.wasSuccessful() else 1)"

  publish:
    name: Publish fabio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fabio-${{ matrix.version }}-*-manylinux_riscv64
