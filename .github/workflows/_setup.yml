name: Build workflow setup

on:
  workflow_call:
    inputs:
      package:
        description: Package whose docs/packages/<package>.yaml lists the versions to build.
        required: true
        type: string
      version:
        description: Version glob to (re)build; empty builds every version not released yet.
        required: false
        default: ''
        type: string
    outputs:
      versions:
        description: JSON list of versions to build; "[]" when there is nothing to build.
        value: ${{ jobs.setup.outputs.versions }}

jobs:
  setup:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            ci_scripts
            docs/packages
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Select versions of ${{ inputs.package }} to build
        id: versions
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION_GLOB: ${{ inputs.version }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # The docs branch only records what was just published, so building
          # anything from it would rebuild versions that are already released.
          if [ "$BRANCH" = "github-actions/update-doc" ]; then
            echo "versions=[]" >> "$GITHUB_OUTPUT"
            echo "Versions to build: [] (documentation branch)"
            exit 0
          fi
          # A version reaches its release hours before the shared documentation
          # PR records it in docs/packages, and until then this YAML still reads
          # as pending - so any push to main inside that window rebuilt it and
          # published a second release of the same version. The release tags are
          # the record that does not lag; hand them over so those versions are
          # skipped. An explicit glob still rebuilds whatever it names.
          #
          # ls-remote over the REST API: no rate limit to share between the 700
          # build workflows, and a draft release carries no tag, so a publish
          # still in flight does not count as released.
          released="$RUNNER_TEMP/released-tags.txt"
          git ls-remote --tags --refs origin |
            sed 's#.*refs/tags/##' > "$released"
          versions=$(uv run --quiet ci_scripts/pending_versions.py \
            --released "$released" ${VERSION_GLOB:+--glob "$VERSION_GLOB"} "$PACKAGE")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Versions to build: $versions"
