name: Build workflow setup

on:
  workflow_call:
    inputs:
      package:
        description: Package whose docs/packages/<package>.yaml lists the versions to build.
        required: true
        type: string
      version:
        description: Version glob to (re)build; empty builds every version not released yet.
        required: false
        default: ''
        type: string
      python-matrix:
        description: Also compute the matrix output from the python-versions of each version in docs/packages/<package>.yaml.
        required: false
        default: false
        type: boolean
      python-exclude:
        description: Space-separated interpreter tag globs (e.g. "cp39 cp315*") never to build.
        required: false
        default: ''
        type: string
    outputs:
      versions:
        description: JSON list of versions to build; "[]" when there is nothing to build.
        value: ${{ jobs.setup.outputs.versions }}
      matrix:
        description: >-
          JSON matrix include list of {version, python} pairs (python being a
          cibuildwheel tag like cp314t); "[]" unless python-matrix is set.
        value: ${{ jobs.setup.outputs.matrix }}

jobs:
  setup:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      matrix: ${{ steps.versions.outputs.matrix || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            ci_scripts
            docs/packages
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Select versions of ${{ inputs.package }} to build
        id: versions
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION_GLOB: ${{ inputs.version }}
          PYTHON_MATRIX: ${{ inputs.python-matrix }}
          PYTHON_EXCLUDE: ${{ inputs.python-exclude }}
        run: |
          versions=$(uv run --quiet ci_scripts/pending_versions.py ${VERSION_GLOB:+--glob "$VERSION_GLOB"} "$PACKAGE")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Versions to build: $versions"
          if [ "$PYTHON_MATRIX" = "true" ] && [ "$versions" != "[]" ]; then
            matrix=$(uv run --quiet ci_scripts/pending_versions.py --python-matrix \
              --python-exclude "$PYTHON_EXCLUDE" \
              ${VERSION_GLOB:+--glob "$VERSION_GLOB"} "$PACKAGE")
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "Matrix: $matrix"
          fi
