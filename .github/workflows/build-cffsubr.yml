---
# This workflow is based on the `build_wheels` job of
# https://github.com/adobe-type-tools/cffsubr/blob/v0.4.0/.github/workflows/build_wheels.yml
name: Build cffsubr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cffsubr.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cffsubr.yml'
      - 'docs/packages/cffsubr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cffsubr.yml'
      - 'docs/packages/cffsubr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cffsubr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cffsubr ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      CFFSUBR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cffsubr v${{ env.CFFSUBR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: adobe-type-tools/cffsubr
          ref: v${{ env.CFFSUBR_VERSION }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The tx executable statically links libxml2 (fetched from its master branch), whose licence upstream does not ship.
          # setuptools 81 dropped copy_file()'s dry_run keyword, which setup.py's build_ext still passes.
          CIBW_BEFORE_ALL_LINUX: |
            git config --global url.https://github.com/.insteadOf git://github.com/
            dnf install -y libuuid-devel
            curl -fsSL https://gitlab.gnome.org/GNOME/libxml2/-/raw/master/Copyright -o {project}/LICENSE.libxml2
            echo 'setuptools<81' > /setuptools-constraint.txt
          CIBW_BEFORE_BUILD: "git submodule foreach git clean -fdx"
          # One py3-none wheel is built on cp312 and reused (and tested) on the others.
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ENVIRONMENT: >-
            FORCE_BUILD_LIBXML2=ON
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_CONSTRAINT=/setuptools-constraint.txt
            PIP_BUILD_CONSTRAINT=/setuptools-constraint.txt
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests &&
            python -c "import importlib.metadata as m; assert any(p.name == 'LICENSE.libxml2' for p in m.files('cffsubr'))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cffsubr-${{ env.CFFSUBR_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cffsubr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cffsubr-${{ matrix.version }}-*-manylinux_riscv64
