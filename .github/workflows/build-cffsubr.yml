---
# This workflow is based on the `build_wheels` job of
# https://github.com/adobe-type-tools/cffsubr/blob/v0.4.0/.github/workflows/build_wheels.yml
name: Build cffsubr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cffsubr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cffsubr.yml'
      - 'docs/packages/cffsubr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cffsubr.yml'
      - 'docs/packages/cffsubr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cffsubr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cffsubr ${{ matrix.version }} py3-none-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cffsubr
      version: ${{ matrix.version }}
      repository: adobe-type-tools/cffsubr
      ref: v${{ matrix.version }}
      artifact-tag: py3-none-manylinux_riscv64
      checkout-submodules: recursive
      checkout-fetch-depth: 0
      # The tx executable statically links libxml2 (fetched from its master branch), whose licence upstream does not ship.
      # setuptools 81 dropped copy_file()'s dry_run keyword, which setup.py's build_ext still passes.
      cibw-before-all-linux: |
        git config --global url.https://github.com/.insteadOf git://github.com/
        dnf install -y libuuid-devel
        curl -fsSL https://gitlab.gnome.org/GNOME/libxml2/-/raw/master/Copyright -o {project}/LICENSE.libxml2
        echo 'setuptools<81' > /setuptools-constraint.txt
      cibw-before-build: "git submodule foreach git clean -fdx"
      # One py3-none wheel is built on cp312 and reused (and tested) on the others.
      cibw-build: "cp312-* cp313-* cp314-*"
      cibw-skip: "*-musllinux*"
      cibw-environment: >-
        FORCE_BUILD_LIBXML2=ON
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_CONSTRAINT=/setuptools-constraint.txt
        PIP_BUILD_CONSTRAINT=/setuptools-constraint.txt
      cibw-test-requires: "pytest"
      cibw-test-command: >-
        pytest {project}/tests &&
        python -c "import importlib.metadata as m; assert any(p.name == 'LICENSE.libxml2' for p in m.files('cffsubr'))"
      timeout-minutes: 120

  publish:
    name: Publish cffsubr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cffsubr-${{ matrix.version }}-*-manylinux_riscv64
