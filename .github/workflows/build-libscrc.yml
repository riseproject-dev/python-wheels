---
# This workflow is based on: https://github.com/hex-in/libscrc/blob/v1.8.1/.github/workflows/pythonpackage.yml
name: Build libscrc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libscrc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libscrc.yml'
      - 'docs/packages/libscrc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libscrc.yml'
      - 'docs/packages/libscrc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libscrc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libscrc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: libscrc
      version: ${{ matrix.version }}
      repository: hex-in/libscrc
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Mirror upstream's own CI (build + `python -m libscrc.test.crc16`),
      # extended to every test module upstream ships (only crc16 is wired
      # into pythonpackage.yml).
      cibw-test-command: >-
        python -c "import libscrc._crc16 as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m libscrc.test.canx &&
        python -m libscrc.test.crc8 &&
        python -m libscrc.test.crc16 &&
        python -m libscrc.test.crc24 &&
        python -m libscrc.test.crc32 &&
        python -m libscrc.test.crc64 &&
        python -m libscrc.test.crcx &&
        python -m libscrc.test.hacker &&
        python -m libscrc.test.modbus
      timeout-minutes: 60

  publish:
    name: Publish libscrc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libscrc-${{ matrix.version }}-*riscv64
