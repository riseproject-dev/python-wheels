---
# Based on the `wheels` job of
# https://github.com/coleifer/pysqlite3/blob/0.6.0/.github/workflows/wheels.yaml
name: Build pysqlite3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pysqlite3 version/tag to build, e.g. 0.6.0'
        required: true
        default: '0.6.0'
  pull_request:
    paths:
      - '.github/workflows/build-pysqlite3.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.6.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYSQLITE3_VERSION: ${{ inputs.version || '0.6.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pysqlite3 ${{ inputs.version || '0.6.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pysqlite3 ${{ env.PYSQLITE3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: coleifer/pysqlite3
          ref: ${{ env.PYSQLITE3_VERSION }}
          persist-credentials: false

      # Matches upstream's own `wheels` job: since 0.6.0 the published
      # `pysqlite3` wheels are statically linked against this amalgamation,
      # not the system libsqlite3 (that path is sdist-only, see README.md).
      - name: Download sqlite amalgamation source
        run: python3 build-scripts/fetch_source.py

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysqlite3-${{ env.PYSQLITE3_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pysqlite3 ${{ inputs.version || '0.6.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pysqlite3-${{ inputs.version || '0.6.0' }}-*-manylinux_riscv64
