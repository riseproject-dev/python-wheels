---
# This workflow is based on the `sdist` and `wheels` jobs of
# https://github.com/tblite/tblite/blob/v0.7.0/.github/workflows/wheel.yml
name: Build tblite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tblite.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tblite.yml'
      - 'docs/packages/tblite.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tblite.yml'
      - 'docs/packages/tblite.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tblite
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tblite ${{ matrix.version }} sdist
    runs-on: ubuntu-latest

    env:
      TBLITE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tblite v${{ env.TBLITE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tblite/tblite
          ref: v${{ env.TBLITE_VERSION }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Replaces upstream's micromamba python-env.yaml with the same build tools from PyPI.
      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Install LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev

      - name: Reorganize repository
        run: |
          git config user.email ""
          git config user.name "dummy"
          git am python-wheels/patches/tblite/${{ env.TBLITE_VERSION }}/*.patch
          git subtree add --prefix python/subprojects/tblite . HEAD

      - name: Build sdist
        run: |
          uv pip install build meson-python 'meson!=1.8.0' ninja cffi numpy setuptools
          python -m build python/ --sdist --outdir dist -n -Cdist-args="--include-subprojects"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tblite-${{ env.TBLITE_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build tblite ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      TBLITE_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tblite-${{ env.TBLITE_VERSION }}-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_CONFIG_SETTINGS: setup-args="-Dtblite:openmp=false"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: 'auditwheel repair -w {dest_dir} {wheel} --exclude libgomp.so.1'
          CIBW_BEFORE_ALL_LINUX: yum install -y lapack-devel
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # Upstream's wheel smoke test plus the `pytest --pyargs tblite` run of its build.yml.
          CIBW_TEST_REQUIRES: pytest ase
          CIBW_TEST_COMMAND: >-
            python -c "import tblite.interface" &&
            pytest --pyargs tblite -v &&
            python -c "import importlib.metadata as m; names = [p.name for p in m.files('tblite')]; assert 'LICENSE.lapack' in names and 'COPYING.LESSER' in names, names"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tblite-${{ env.TBLITE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # auditwheel vendors the image's libgfortran runtime.
    name: Collect GPL sources (gcc) for tblite ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tblite-${{ matrix.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish tblite ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tblite-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: tblite-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
