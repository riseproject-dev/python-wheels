---
# This workflow is based on the `sdist` and `wheels` jobs of
# https://github.com/tblite/tblite/blob/v0.7.0/.github/workflows/wheel.yml
name: Build tblite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tblite.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tblite.yml'
      - 'docs/packages/tblite.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tblite.yml'
      - 'docs/packages/tblite.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tblite
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tblite ${{ matrix.version }} sdist
    runs-on: ubuntu-latest

    env:
      TBLITE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tblite v${{ env.TBLITE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tblite/tblite
          ref: v${{ env.TBLITE_VERSION }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Replaces upstream's micromamba python-env.yaml with the same build tools from PyPI.
      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Install LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev

      - name: Reorganize repository
        run: |
          git config user.email ""
          git config user.name "dummy"
          git am python-wheels/patches/tblite/${{ env.TBLITE_VERSION }}/*.patch
          git subtree add --prefix python/subprojects/tblite . HEAD

      - name: Build sdist
        run: |
          uv pip install build meson-python 'meson!=1.8.0' ninja cffi numpy setuptools
          python -m build python/ --sdist --outdir dist -n -Cdist-args="--include-subprojects"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tblite-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build tblite ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tblite
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: tblite-${{ matrix.version }}-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 180
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The subprojects' openmp options yield to python/, not tblite, so -fopenmp still reached
      # tblite's loops and libgomp's dynamic schedule faults on the riscv64 runners (#617).
      # ddX calls omp_* regardless of its option, hence LDFLAGS=-fopenmp below.
      cibw-config-settings: >
        setup-args="-Dtblite:openmp=false"
        setup-args="-Ddftd4:openmp=false"
        setup-args="-Dmulticharge:openmp=false"
        setup-args="-Ds-dftd3:openmp=false"
        setup-args="-Dddx:openmp=false"
      cibw-repair-wheel-command-linux: auditwheel repair -w {dest_dir} {wheel} --exclude libgomp.so.1
      cibw-before-all-linux: yum install -y lapack-devel
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy,pillow,matplotlib
        LDFLAGS=-fopenmp
      # Upstream's wheel smoke test plus the `pytest --pyargs tblite` run of its build.yml.
      # ase's own `matplotlib` runtime dep (and matplotlib's `pillow` dep) are newer on
      # PyPI than on our registry, so PIP_EXTRA_INDEX_URL alone lets pip pick PyPI's
      # sdist-only releases over our riscv64 wheels; pillow's then fails to compile with
      # `RequiredDependencyException: jpeg` (no libjpeg headers in the manylinux image).
      # CLAUDE.md gotcha 291.
      cibw-test-requires: pytest ase
      cibw-test-command: >
        python -c "import tblite.interface" &&
        pytest --pyargs tblite -v &&
        python -c "import importlib.metadata as m; names = [p.name for p in m.files('tblite')]; assert 'LICENSE.lapack' in names and 'COPYING.LESSER' in names, names"

  gpl_sources:
    name: Collect GPL sources for tblite ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: tblite
      version: ${{ matrix.version }}
      # auditwheel vendors the image's libgfortran runtime.
      packages: gcc

  publish:
    name: Publish tblite ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tblite-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: tblite-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
