---
# Based on the `build_wheels` job of
# https://github.com/daanzu/py-webrtcvad-wheels/blob/v2.0.14/.github/workflows/build.yml
name: Build webrtcvad-wheels wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'webrtcvad-wheels version/tag to build (e.g. v2.0.14)'
        required: true
        default: 'v2.0.14'
  pull_request:
    paths:
      - '.github/workflows/build-webrtcvad-wheels.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || 'v2.0.14' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  WEBRTCVAD_VERSION: ${{ inputs.version || 'v2.0.14' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build webrtcvad-wheels ${{ inputs.version || 'v2.0.14' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout py-webrtcvad-wheels ${{ env.WEBRTCVAD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: daanzu/py-webrtcvad-wheels
          ref: ${{ env.WEBRTCVAD_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: dev
          CIBW_TEST_COMMAND: python {project}/test_webrtcvad.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: webrtcvad-wheels-${{ env.WEBRTCVAD_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish webrtcvad-wheels ${{ inputs.version || 'v2.0.14' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: webrtcvad-wheels-${{ inputs.version || 'v2.0.14' }}-*riscv64
