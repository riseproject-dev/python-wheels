---
# Based on the Linux legs of
# https://github.com/absadiki/pywhispercpp/blob/v1.5.1/.github/workflows/wheels.yml
name: Build pywhispercpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pywhispercpp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pywhispercpp.yml'
      - 'docs/packages/pywhispercpp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pywhispercpp.yml'
      - 'docs/packages/pywhispercpp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pywhispercpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pywhispercpp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pywhispercpp"
      version: "${{ matrix.version }}"
      repository: "absadiki/pywhispercpp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "true"
      pre-build: |-
        cp whisper.cpp/LICENSE LICENSE.whisper.cpp
        cp pybind11/LICENSE LICENSE.pybind11

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # ggml defaults RVV/Zfh/Zvfh/Zicbop/Zihintpause on for riscv64 with no runtime
      # dispatch; turning them off keeps the wheel at the rv64gc baseline.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYWHISPERCPP=${{ matrix.version }} CMAKE_ARGS=\"-DGGML_NATIVE=OFF -DGGML_RVV=OFF -DGGML_RV_ZFH=OFF -DGGML_RV_ZVFH=OFF -DGGML_RV_ZICBOP=OFF -DGGML_RV_ZIHINTPAUSE=OFF\""
      cibw-test-requires: "pytest"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy PYTHON_GIL=1"
      cibw-test-sources: "pyproject.toml tests whisper.cpp/models whisper.cpp/samples"
      cibw-test-command: "python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYWHISPERCPP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pywhispercpp-${{ env.PYWHISPERCPP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel's extension, licences and ISA baseline
        run: |
          mkdir -p whl && cd whl
          python3 -m zipfile -e ../wheelhouse/*.whl .
          python3 - <<'EOF'
          import glob
          assert glob.glob("_pywhispercpp.cpython-*-riscv64-linux-gnu.so")
          licences = {p.rsplit("/", 1)[1] for p in glob.glob("*.dist-info/licenses/*")}
          assert licences == {"LICENSE", "LICENSE.whisper.cpp", "LICENSE.pybind11"}, licences
          EOF
          for so in _pywhispercpp.*.so pywhispercpp.libs/lib{whisper,ggml}*.so*; do
            arch=$(readelf -A "$so" | sed -n 's/.*Tag_RISCV_arch: "\(.*\)"/\1/p')
            echo "$so: $arch"
            test -n "$arch"
            if echo "$arch" | grep -qE '_(v|zv[a-z0-9]*|zfh[a-z]*)[0-9]'; then exit 1; fi
          done

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      PYWHISPERCPP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ggml builds with OpenMP, so auditwheel vendors the image's libgomp.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pywhispercpp-${{ env.PYWHISPERCPP_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pywhispercpp ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pywhispercpp-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pywhispercpp-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
