---
# This workflow is based on the `test_manylinux` job of
# https://github.com/Baekalfen/PyBoy/blob/v2.9.0/.github/workflows/pr-test.yml
name: Build pyboy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyboy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyboy.yml'
      - 'docs/packages/pyboy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyboy.yml'
      - 'docs/packages/pyboy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyboy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyboy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyboy
      version: ${{ matrix.version }}
      repository: Baekalfen/PyBoy
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # musllinux is dropped: numpy has no musllinux_riscv64 wheel on pypi.riseproject.dev.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy is both a build and a runtime dependency; only our registry has riscv64
      # wheels, and PIP_ONLY_BINARY keeps a newer PyPI sdist from winning the resolution.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy
      # Upstream's own pytest suite needs commercial Game Boy ROMs downloaded/decrypted
      # via a PYTEST_SECRETS_KEY secret we don't have, so this checks the extensions
      # actually built and PyBoy imports instead of running that suite.
      cibw-test-command: >-
        python -c "import pyboy; from pyboy.core import cpu as m; assert m.__file__.endswith('.so'), m.__file__"
      timeout-minutes: 60

  publish:
    name: Publish pyboy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyboy-${{ matrix.version }}-*-manylinux_riscv64
