---
# This workflow is based on the `test_manylinux` job of
# https://github.com/Baekalfen/PyBoy/blob/v2.9.0/.github/workflows/pr-test.yml
name: Build pyboy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyboy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyboy.yml'
      - 'docs/packages/pyboy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyboy.yml'
      - 'docs/packages/pyboy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyboy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyboy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYBOY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyboy v${{ env.PYBOY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Baekalfen/PyBoy
          ref: v${{ env.PYBOY_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: numpy has no musllinux_riscv64 wheel on pypi.riseproject.dev.
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is both a build and a runtime dependency; only our registry has riscv64
          # wheels, and PIP_ONLY_BINARY keeps a newer PyPI sdist from winning the resolution.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # Upstream's own pytest suite needs commercial Game Boy ROMs downloaded/decrypted
          # via a PYTEST_SECRETS_KEY secret we don't have, so this checks the extensions
          # actually built and PyBoy imports instead of running that suite.
          CIBW_TEST_COMMAND: >-
            python -c "import pyboy; from pyboy.core import cpu as m; assert m.__file__.endswith('.so'), m.__file__"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyboy-${{ env.PYBOY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyboy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyboy-${{ matrix.version }}-*-manylinux_riscv64
