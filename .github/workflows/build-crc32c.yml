---
# This workflow is based on the `build_wheels` job of
# https://github.com/ICRAR/crc32c/blob/v2.9/.github/workflows/build_and_release.yml
name: Build crc32c wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/crc32c.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-crc32c.yml'
      - 'docs/packages/crc32c.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-crc32c.yml'
      - 'docs/packages/crc32c.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: crc32c
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build crc32c ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "crc32c"
      version: "${{ matrix.version }}"
      repository: "ICRAR/crc32c"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -u {project}/run-tests.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CRC32C_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: crc32c-${{ env.CRC32C_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("crc32c/_crc32c.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish crc32c ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: crc32c-${{ matrix.version }}-*-manylinux_riscv64
