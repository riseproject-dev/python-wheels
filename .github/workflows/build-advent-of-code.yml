---
# This workflow is based on the `build-python-wheels` job of
# https://github.com/fornwall/advent-of-code/blob/2025.6.0/.github/workflows/release.yml
name: Build advent-of-code wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/advent-of-code.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-advent-of-code.yml'
      - 'docs/packages/advent-of-code.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-advent-of-code.yml'
      - 'docs/packages/advent-of-code.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: advent-of-code
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build advent-of-code ${{ matrix.version }} cp312-abi3-riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      ADVENT_OF_CODE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout advent-of-code ${{ env.ADVENT_OF_CODE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fornwall/advent-of-code
          ref: ${{ env.ADVENT_OF_CODE_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: crates/python
          output-dir: wheelhouse/
        env:
          # setup.cfg sets py_limited_api=cp312 unconditionally (pyo3's
          # abi3-py312 feature), so one build serves cp312+; reused and
          # tested on cp313/cp314 via find_compatible_wheel. No free-threaded
          # wheel upstream either (its own CIBW_SKIP lists cp314t-*).
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp312-* cp313-* cp314-*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # Upstream's own run-tests.sh: tests/test_solve.py's module-level
          # asserts, plus a round-trip through the installed CLI entry point.
          CIBW_TEST_COMMAND: >-
            python {package}/tests/test_solve.py &&
            python -c "import subprocess; out = subprocess.run(['advent-of-code-py', '2019', '1', '1'], input='14', capture_output=True, text=True, check=True).stdout.strip(); assert out == '2', out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: advent-of-code-${{ env.ADVENT_OF_CODE_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish advent-of-code ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: advent-of-code-${{ matrix.version }}-*-manylinux_riscv64
