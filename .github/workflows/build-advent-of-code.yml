---
# This workflow is based on the `build-python-wheels` job of
# https://github.com/fornwall/advent-of-code/blob/2025.6.0/.github/workflows/release.yml
name: Build advent-of-code wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/advent-of-code.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-advent-of-code.yml'
      - 'docs/packages/advent-of-code.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-advent-of-code.yml'
      - 'docs/packages/advent-of-code.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: advent-of-code
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build advent-of-code ${{ matrix.version }} cp312-abi3-riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: advent-of-code
      version: ${{ matrix.version }}
      repository: fornwall/advent-of-code
      ref: ${{ matrix.version }}
      artifact-tag: cp312-abi3-manylinux_riscv64
      cibw-package-dir: crates/python
      # setup.cfg sets py_limited_api=cp312 unconditionally (pyo3's
      # abi3-py312 feature), so one build serves cp312+; reused and
      # tested on cp313/cp314 via find_compatible_wheel. No free-threaded
      # wheel upstream either (its own CIBW_SKIP lists cp314t-*).
      cibw-build: 'cp312-* cp313-* cp314-*'
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # The repo-root rust-toolchain pins 1.94.0, which has no riscv64 musl host toolchain.
      cibw-environment-linux: 'PATH="$PATH:$HOME/.cargo/bin" RUSTUP_TOOLCHAIN=stable'
      # Upstream's own run-tests.sh: tests/test_solve.py's module-level
      # asserts, plus a round-trip through the installed CLI entry point.
      cibw-test-command: >-
        python {package}/tests/test_solve.py &&
        python -c "import subprocess; out = subprocess.run(['advent-of-code-py', '2019', '1', '1'], input='14', capture_output=True, text=True, check=True).stdout.strip(); assert out == '2', out"
      timeout-minutes: 90

  publish:
    name: Publish advent-of-code ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: advent-of-code-${{ matrix.version }}-*-manylinux_riscv64
