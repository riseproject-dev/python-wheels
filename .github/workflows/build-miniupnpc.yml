---
# The `miniupnpc` PyPI package is built from the `miniupnpc/` subdirectory of the
# miniupnp monorepo; its setup.py vendors and builds the whole C library itself via
# `make build/libminiupnpc.a`, so no external native deps are needed.
#   https://github.com/miniupnp/miniupnp/blob/master/.github/workflows/miniupnpc_wheels.yml
name: Build miniupnpc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'miniupnpc version to build (PyPI version, e.g. 2.3.3)'
        required: true
        default: '2.3.3'
  pull_request:
    paths:
      - '.github/workflows/build-miniupnpc.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.3.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.3.3 there.
  MINIUPNPC_VERSION: ${{ inputs.version || '2.3.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build miniupnpc ${{ inputs.version || '2.3.3' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Plain PyModuleDef C extension, not abi3, matching upstream's per-interpreter wheels.
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Compute git tag
        id: tag
        # miniupnp tags the python bindings as miniupnpc_X_Y_Z, not the PyPI version.
        run: echo "ref=miniupnpc_$(echo "$MINIUPNPC_VERSION" | tr . _)" >> "$GITHUB_OUTPUT"

      - name: Checkout miniupnp ${{ steps.tag.outputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: miniupnp/miniupnp
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: miniupnpc
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Mirrors upstream's own wheel-build "Import" smoke test; a real
          # discover() call needs a live UPnP device/network, unavailable in CI.
          CIBW_TEST_COMMAND: python -c "import miniupnpc; print(miniupnpc)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: miniupnpc-${{ env.MINIUPNPC_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish miniupnpc ${{ inputs.version || '2.3.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: miniupnpc-${{ inputs.version || '2.3.3' }}-*riscv64
