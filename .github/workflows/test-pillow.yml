---
name: Test pillow (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pillow.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-pillow.yml'
      - 'docs/packages/pillow.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pillow
      version: ${{ inputs.version }}

  test:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    permissions:
      contents: read
    name: "Test pillow ${{ matrix.version }} — Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          - os: ubuntu-24.04-riscv
            python-version: '3.12'

    env:
      PILLOW_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pillow v${{ env.PILLOW_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: python-pillow/Pillow
          ref: ${{ env.PILLOW_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Works around a GCC LTO bug (https://gcc.gnu.org/bugzilla/show_bug.cgi?id=110812)
      # hit when building libavif as a Pillow wheel dependency on riscv64.
      - name: Patch pillow source
        run: |
          git apply python-wheels/patches/pillow/${{ env.PILLOW_VERSION }}/00*.patch

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install Linux dependencies
        run: |
          .ci/install.sh
        env:
          GHA_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Build
        run: |
          .ci/build.sh

      - name: Test
        run: |
          xvfb-run -s '-screen 0 1024x768x24' sway&
          export WAYLAND_DISPLAY=wayland-1
          .ci/test.sh

      - name: Prepare to upload errors
        if: failure()
        run: |
          mkdir -p Tests/errors

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: "pillow-${{ env.PILLOW_VERSION }}-py${{ matrix.python-version }}-${{ matrix.os }}-errors"
          path: Tests/errors
