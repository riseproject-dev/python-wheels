---
# This workflow is based on the `linux` job of
# https://github.com/omerbenamram/pymft-rs/blob/v0.10.0/.github/workflows/ci.yml
name: Build mft wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mft.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mft.yml'
      - 'docs/packages/mft.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mft.yml'
      - 'docs/packages/mft.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mft
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mft ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # tag is a real matrix dimension (not just an `include:` key) so that each
        # `include:` entry below *updates* its matching combination instead of both
        # competing to add the same new key to the one combination there would
        # otherwise be - see CLAUDE.md gotcha 402 (build-primp.yml/build-arro3-core.yml
        # shipped only their cp314t wheel this way, with the abi3 leg never built at all).
        tag: [cp310-abi3, cp314t]
        include:
          # pyo3's abi3-py310 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel - same
          # two-leg split as upstream's own ci.yml (python: "3.10" vs "3.14t").
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      MFT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mft v${{ env.MFT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: omerbenamram/pymft-rs
          ref: v${{ env.MFT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # mft ships no [tool.cibuildwheel], so the Rust toolchain its maturin
          # backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests samples
          # mft is a pure-Rust maturin crate (no mft/ dir, no [tool.maturin]
          # python-source in the checkout), so maturin ships it behind a generated
          # mft/__init__.py re-export shim around a compiled mft.mft submodule -
          # mft.__file__ is that shim's .py, not the extension, on every leg
          # (CLAUDE.md gotcha 559/308). Probe the submodule via sys.modules instead.
          CIBW_TEST_COMMAND: >-
            python -c "import mft, sys; assert sys.modules['mft.mft'].__file__.endswith('.so'), sys.modules['mft.mft'].__file__" &&
            python -m pytest tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mft-${{ env.MFT_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mft ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mft-${{ matrix.version }}-*-manylinux_riscv64
