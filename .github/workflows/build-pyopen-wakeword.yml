#
# Upstream vendors a prebuilt libtensorflowlite_c.so per platform from
# https://github.com/tphakala/tflite_c (no riscv64 binary there); this workflow
# builds that same Bazel target itself, following that project's own recipe.
---
name: Build pyopen-wakeword wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopen-wakeword.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopen-wakeword.yml'
      - 'docs/packages/pyopen-wakeword.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopen-wakeword.yml'
      - 'docs/packages/pyopen-wakeword.yaml'

run-name: build-pyopen-wakeword ${{ inputs.version && format('- {0}', inputs.version) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  BAZEL_VERSION: '7.5.0'
  RULES_PYTHON_VERSION: '0.33.2'
  RULES_JAVA_VERSION: '7.6.5'
  TENSORFLOW_TAG: v2.17.1

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopen-wakeword
      version: ${{ inputs.version }}

  bazel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Bootstrap bazel (riscv64)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720

    steps:
      - name: Restore bazel binary
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: bazel-bin
          key: bazel-${{ env.BAZEL_VERSION }}-manylinux_riscv64

      - name: Bootstrap bazel ${{ env.BAZEL_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bazel-bin
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e BAZEL_VERSION \
            -e RULES_PYTHON_VERSION \
            -e RULES_JAVA_VERSION \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          dnf install -y --setopt=install_weak_deps=False java-21-openjdk-devel zip unzip
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export JAVA_HOME

          mkdir -p /tmp/rules_python
          curl -fsSLo /tmp/rules_python.tar.gz "https://github.com/bazel-contrib/rules_python/releases/download/${RULES_PYTHON_VERSION}/rules_python-${RULES_PYTHON_VERSION}.tar.gz"
          tar -xzf /tmp/rules_python.tar.gz -C /tmp/rules_python --strip-components=1
          sed -i 's|fail("No platform declared for host OS {} on arch {}".format(os_name, arch))|return "x86_64-unknown-linux-gnu"|' \
            /tmp/rules_python/python/private/toolchains_repo.bzl

          mkdir -p /tmp/rules_java
          curl -fsSLo /tmp/rules_java.tar.gz "https://github.com/bazelbuild/rules_java/releases/download/${RULES_JAVA_VERSION}/rules_java-${RULES_JAVA_VERSION}.tar.gz"
          tar -xzf /tmp/rules_java.tar.gz -C /tmp/rules_java
          sed -i 's|\[":include/linux"\]|["include/linux"]|g' /tmp/rules_java/toolchains/BUILD

          mkdir -p /tmp/bazel-src
          cd /tmp/bazel-src
          curl -fsSLo dist.zip "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-dist.zip"
          unzip -q dist.zip

          EXTRA_BAZEL_ARGS="--tool_java_runtime_version=local_jdk \
            --override_module=rules_python=/tmp/rules_python \
            --override_module=rules_java=/tmp/rules_java" \
            bash ./compile.sh
          install -m 0755 output/bazel /work/bazel-bin/bazel
          SCRIPT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-riscv64
          path: bazel-bin/bazel
          if-no-files-found: error

  build_wheels:
    name: Build pyopen-wakeword ${{ matrix.version }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    needs: [setup, bazel]
    if: needs.setup.outputs.versions != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYOPEN_WAKEWORD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyopen-wakeword v${{ env.PYOPEN_WAKEWORD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rhasspy/pyopen-wakeword
          ref: v${{ env.PYOPEN_WAKEWORD_VERSION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout tensorflow/tensorflow ${{ env.TENSORFLOW_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tensorflow/tensorflow
          ref: ${{ env.TENSORFLOW_TAG }}
          path: tensorflow
          fetch-depth: 1
          persist-credentials: false

      - name: Download bazel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-riscv64
          path: bazel-bin

      - name: Build wheel
        run: |
          mkdir -p wheelhouse
          set -o pipefail
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT' 2>&1 | tee build.log
          set -eux

          dnf install -y --setopt=install_weak_deps=False java-21-openjdk-devel zip unzip
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export JAVA_HOME
          install -m 0755 /work/bazel-bin/bazel /usr/local/bin/bazel

          PYTHON_BIN=/opt/python/cp312-cp312/bin/python
          "${PYTHON_BIN}" -m pip install -q -U --only-binary=:all: pip setuptools wheel auditwheel numpy build

          cd /work/tensorflow

          # Mirrors build-tflite-runtime.yml: rules_python's hermetic interpreter has
          # no riscv64 build, so the two repos that provide Python/numpy headers are
          # stood in with the container's own CPython and numpy.
          mkdir -p /tmp/override/python /tmp/override/pypi_numpy
          cp -r "$("${PYTHON_BIN}" -c 'import sysconfig; print(sysconfig.get_paths()["include"])')" \
            /tmp/override/python/include
          cp -r "$("${PYTHON_BIN}" -c 'import numpy; print(numpy.get_include())')" \
            /tmp/override/pypi_numpy/include
          : > /tmp/override/python/WORKSPACE
          : > /tmp/override/pypi_numpy/WORKSPACE
          ln -s "${PYTHON_BIN}" /tmp/override/python/python3
          echo 'interpreter = "@python//:python3"' > /tmp/override/python/defs.bzl
          cat > /tmp/override/python/BUILD <<'BUILD_FILE'
          package(default_visibility = ["//visibility:public"])

          exports_files(["python3"])

          cc_library(
              name = "python_headers",
              hdrs = glob(["include/**/*.h"]),
              includes = ["include"],
          )
          BUILD_FILE
          cat > /tmp/override/pypi_numpy/BUILD <<'BUILD_FILE'
          package(default_visibility = ["//visibility:public"])

          filegroup(name = "pkg")

          cc_library(
              name = "numpy_headers",
              hdrs = glob(["include/**/*.h"]),
              includes = ["include"],
          )
          BUILD_FILE

          bazel build -c opt --nosubcommands --noenable_bzlmod \
            --java_runtime_version=local_jdk --tool_java_runtime_version=local_jdk \
            --override_repository=python=/tmp/override/python \
            --override_repository=pypi_numpy=/tmp/override/pypi_numpy \
            --curses=no --show_progress_rate_limit=60 \
            //tensorflow/lite/c:libtensorflowlite_c.so

          cd /work
          mkdir -p pyopen_wakeword/lib
          cp tensorflow/bazel-bin/tensorflow/lite/c/libtensorflowlite_c.so pyopen_wakeword/lib/

          "${PYTHON_BIN}" -m build --wheel --no-isolation
          auditwheel repair --plat manylinux_2_39_riscv64 -w /work/wheelhouse dist/*.whl
          SCRIPT

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyopen-wakeword-${{ env.PYOPEN_WAKEWORD_VERSION }}-build-log
          path: build.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyopen-wakeword-${{ env.PYOPEN_WAKEWORD_VERSION }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Test wheel
        run: |
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          PYTHON_BIN=/opt/python/cp312-cp312/bin/python
          "${PYTHON_BIN}" -m pip install --only-binary=:all: numpy pytest /work/wheelhouse/*.whl

          cd /tmp
          "${PYTHON_BIN}" -m pytest /work/tests
          SCRIPT

  publish:
    name: Publish pyopen-wakeword ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyopen-wakeword-${{ matrix.version }}-*-manylinux_riscv64
