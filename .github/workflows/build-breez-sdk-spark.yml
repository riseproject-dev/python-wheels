---
# This workflow is based on the Linux leg of upstream's own
# `.github/workflows/publish-python.yml` (build-language-bindings +
# build-linux-wheels jobs).
name: Build breez-sdk-spark wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/breez-sdk-spark.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-breez-sdk-spark.yml'
      - 'docs/packages/breez-sdk-spark.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-breez-sdk-spark.yml'
      - 'docs/packages/breez-sdk-spark.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: breez-sdk-spark
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build breez-sdk-spark ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: breez-sdk-spark
      version: ${{ matrix.version }}
      repository: breez/spark-sdk
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-package-dir: crates/breez-sdk/bindings/langs/python
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The sdist carries no prebuilt cdylib; build it once (shared by
      # every interpreter in this job, same as upstream's single
      # build-language-bindings + build-linux-wheels{matrix:python} split)
      # and run its own uniffi-bindgen to generate the Python glue,
      # exactly as upstream's CI does.
      # spark-token-primitives (transitive, via the bindings crate) generates code
      # with prost-build and needs `protoc` in the container; Rocky 10's CRB repo
      # (enabled in manylinux_2_39_riscv64) has it, but at 3.19, which resolves the
      # well-known types from /usr/include rather than carrying them in the binary
      # (CLAUDE.md gotcha 100) -- hence PROTOC_INCLUDE.
      # `cargo run --release` reuses the uniffi-bindgen binary the release build already
      # produced; upstream's debug `cargo run` would recompile the whole tree a second time.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        export PATH="$PATH:$HOME/.cargo/bin" &&
        yum install -y protobuf-compiler protobuf-devel &&
        export PROTOC_INCLUDE=/usr/include &&
        cd {project} &&
        cargo build --release --manifest-path crates/breez-sdk/bindings/Cargo.toml --features uniffi-cli &&
        cargo run --release --manifest-path crates/breez-sdk/bindings/Cargo.toml --features uniffi-cli --bin uniffi-bindgen -- generate --library target/release/libbreez_sdk_spark_bindings.so --no-format --language python -o crates/breez-sdk/bindings/langs/python/src/breez_sdk_spark &&
        cp target/release/libbreez_sdk_spark_bindings.so crates/breez-sdk/bindings/langs/python/src/breez_sdk_spark/ &&
        sed -i -e 's/    version=".*",/    version="${{ matrix.version }}",/' crates/breez-sdk/bindings/langs/python/setup.py
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin" PROTOC_INCLUDE=/usr/include
      cibw-test-command: >-
        python -c "import breez_sdk_spark, os;
        so = os.path.join(os.path.dirname(breez_sdk_spark.__file__), 'libbreez_sdk_spark_bindings.so');
        assert os.path.isfile(so), so"
      timeout-minutes: 720

  publish:
    name: Publish breez-sdk-spark ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: breez-sdk-spark-${{ matrix.version }}-*-manylinux_riscv64
