---
# This workflow is based on the `build-python-sdk`/`build-python-sdk-musl` jobs of
# https://github.com/longbridge/openapi/blob/v4.5.0/.github/workflows/release.yml
name: Build longbridge wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/longbridge.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-longbridge.yml'
      - 'docs/packages/longbridge.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-longbridge.yml'
      - 'docs/packages/longbridge.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: longbridge
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build longbridge ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "longbridge"
      version: "${{ matrix.version }}"
      repository: "longbridge/openapi"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      checkout-submodules: "true"
      pre-build: "cp LICENSE-APACHE LICENSE-MIT python/"
      cibw-package-dir: "python"
      # musllinux is dropped: the riscv64 musl-hosted rustc segfaulted or hung on the
      # cdylib's final compile in 6 of 9 legs; the glibc-hosted one is reliable.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # The workspace's fat `lto = true` compile of the cdylib (~1 h in one rustc) aborted
      # rustc with heap corruption on 1 of 5 manylinux legs; thin LTO went 4 of 4.
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
        CARGO_PROFILE_RELEASE_LTO=thin
      cibw-test-command: >
        python -c "import importlib.metadata as md, longbridge;
        from longbridge.openapi import Config, Market;
        files = [str(p) for p in md.files('longbridge')];
        assert any(p.endswith('.so') for p in files), files;
        assert any(p.endswith('licenses/LICENSE-MIT') for p in files), files;
        assert any(p.endswith('licenses/LICENSE-APACHE') for p in files), files;
        Config.from_apikey('app-key', 'app-secret', 'access-token');
        print(Market.US)"

  publish:
    name: Publish longbridge ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: longbridge-${{ matrix.version }}-*-manylinux_riscv64
