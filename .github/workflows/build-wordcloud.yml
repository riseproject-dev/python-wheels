---
# This workflow is based on: https://github.com/amueller/word_cloud/blob/1.9.6/.github/workflows/build_and_publish.yml
name: Build wordcloud wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wordcloud.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wordcloud.yml'
      - 'docs/packages/wordcloud.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wordcloud.yml'
      - 'docs/packages/wordcloud.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wordcloud
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build wordcloud ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # matplotlib ships no cp39 riscv64 wheel (gotchas 67/84), so the floor is
        # cp310. numpy/pillow/matplotlib/contourpy/kiwisolver all have riscv64
        # wheels through cp314/cp314t on our registry, so the matrix covers the
        # full range cibuildwheel supports for this package.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      WORDCLOUD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout wordcloud ${{ env.WORDCLOUD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: amueller/word_cloud
          ref: ${{ env.WORDCLOUD_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build and runtime requirement; pillow/matplotlib (and its
          # contourpy/kiwisolver deps) are runtime-only. Only our registry has
          # riscv64 wheels for any of them, so only-binary keeps pip from
          # resolving a newer PyPI sdist-only release and compiling it instead.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pillow,matplotlib,contourpy,kiwisolver
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_WORDCLOUD=${{ env.WORDCLOUD_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          # setup.cfg's [tool:pytest] addopts is coverage-only (--cov ...); drop it
          # rather than pull in pytest-cov (gotcha 176).
          CIBW_TEST_COMMAND: pytest {project}/test -o addopts=

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wordcloud-${{ env.WORDCLOUD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish wordcloud ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: wordcloud-${{ matrix.version }}-*-manylinux_riscv64
