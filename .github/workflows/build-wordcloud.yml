---
# This workflow is based on: https://github.com/amueller/word_cloud/blob/1.9.6/.github/workflows/build_and_publish.yml
name: Build wordcloud wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/wordcloud.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wordcloud.yml'
      - 'docs/packages/wordcloud.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wordcloud.yml'
      - 'docs/packages/wordcloud.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: wordcloud
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build wordcloud ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: wordcloud
      version: ${{ matrix.version }}
      repository: amueller/word_cloud
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy is a build and runtime requirement; pillow/matplotlib (and its
      # contourpy/kiwisolver deps) are runtime-only. Only our registry has
      # riscv64 wheels for any of them, so only-binary keeps pip from
      # resolving a newer PyPI sdist-only release and compiling it instead.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,pillow,matplotlib,contourpy,kiwisolver
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_WORDCLOUD=${{ matrix.version }}
      cibw-test-requires: pytest
      # setup.cfg's [tool:pytest] addopts is coverage-only (--cov ...); drop it
      # rather than pull in pytest-cov (gotcha 176).
      cibw-test-command: pytest {project}/test -o addopts=
      timeout-minutes: 60

  publish:
    name: Publish wordcloud ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: wordcloud-${{ matrix.version }}-*-manylinux_riscv64
