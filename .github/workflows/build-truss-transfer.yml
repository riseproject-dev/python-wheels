---
# This workflow is based on the `linux` job of
# https://github.com/basetenlabs/truss/blob/main/.github/workflows/build-maturin.yml
# (called from truss-transfer-build-maturin.yml) and on
# https://github.com/basetenlabs/truss/blob/main/.github/workflows/truss-transfer-test.yml
name: Build truss-transfer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/truss-transfer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-truss-transfer.yml'
      - 'docs/packages/truss-transfer.yaml'
      - 'patches/truss-transfer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-truss-transfer.yml'
      - 'docs/packages/truss-transfer.yaml'
      - 'patches/truss-transfer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # basetenlabs/truss is a monorepo that never tags truss-transfer releases.
  # This is the commit whose truss-transfer/Cargo.toml reads 0.0.44 ("Raise certifi
  # and Rust TLS deps for the emSign CA fix", #2717; 0.0.43 was f8b024d9, "Bump
  # truss-transfer to 0.0.43 and truss to 0.18.5rc0", #2482). Move it together with
  # TRUSS_TRANSFER_VERSION: the wheel test below asserts the built package reports
  # exactly the version being built, so a stale pin fails instead of publishing old
  # source under a new version.
  TRUSS_TRANSFER_REF: 8c0fc9c13cac7eba8dc31ca3874a6981226ffadd
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: truss-transfer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build truss-transfer ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # Upstream's cp38-abi3 floor is bumped to cp39 by patches/ (no cp38 in
          # the riscv64 image, gotcha 96). Upstream's cp313t leg is dropped: the
          # image ships no cp313t and the pinned pyo3 0.24.2 rejects cp314t
          # (gotcha 326, same wall as build-baseten-performance-client.yml).
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "truss-transfer"
      version: "${{ matrix.version }}"
      repository: "basetenlabs/truss"
      ref: "8c0fc9c13cac7eba8dc31ca3874a6981226ffadd"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360

      patches: true
      pre-build: |-
        # maturin only globs LICEN[CS]E* next to pyproject.toml, so upstream's wheel ships no licence text.
        cp LICENSE truss-transfer/LICENSE

      cibw-package-dir: "truss-transfer"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # Upstream's yum install of openssl-devel/perl-IPC-Cmd is dropped: Cargo.lock has no openssl-sys (reqwest uses rustls/ring).
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-sources: "truss-transfer/example-bptr-manifest.json"
      cibw-test-command: "python -c \"import truss_transfer, truss_transfer.truss_transfer as m; assert m.__file__.endswith('.so'), m.__file__; assert truss_transfer.__version__ == '${{ matrix.version }}', truss_transfer.__version__; print(truss_transfer.__version__)\" && mkdir -p /static-bptr /cache && cp truss-transfer/example-bptr-manifest.json /static-bptr/static-bptr-manifest.json && rm -rf tmp_no_cache tmp_fs_enabled tmp_range_enabled && BASETEN_FS_ENABLED=0 python -c \"import truss_transfer; truss_transfer.lazy_data_resolve('./tmp_no_cache/test')\" && test -d tmp_no_cache/test && BASETEN_FS_ENABLED=1 TRUSS_TRANSFER_USE_RANGE_DOWNLOAD=0 python -c \"import truss_transfer; truss_transfer.lazy_data_resolve('./tmp_fs_enabled/test')\" && BASETEN_FS_ENABLED=1 TRUSS_TRANSFER_USE_RANGE_DOWNLOAD=0 python -c \"import truss_transfer; truss_transfer.lazy_data_resolve('./tmp_fs_enabled/test')\" && BASETEN_FS_ENABLED=0 TRUSS_TRANSFER_USE_RANGE_DOWNLOAD=1 python -c \"import truss_transfer; truss_transfer.lazy_data_resolve('./tmp_range_enabled/test')\" && test -d tmp_fs_enabled/test && test -d tmp_range_enabled/test"

  publish:
    name: Publish truss-transfer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: truss-transfer-${{ matrix.version }}-*-manylinux_riscv64
