---
# This workflow is based on the `build_wheels` job of
# https://github.com/has2k1/scikit-misc/blob/v0.5.2/.github/workflows/build-wheels.yml
name: Build scikit-misc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scikit-misc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-misc.yml'
      - 'docs/packages/scikit-misc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-misc.yml'
      - 'docs/packages/scikit-misc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scikit-misc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scikit-misc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "scikit-misc"
      version: "${{ matrix.version }}"
      repository: "has2k1/scikit-misc"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy has a riscv64 wheel only on our registry; cython/meson-python
      # build from sdist there, same as upstream's own build-time resolution.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
  gpl_sources:
    name: Collect GPL sources for scikit-misc ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: scikit-misc
      version: ${{ matrix.version }}
      # scikit-misc compiles real Fortran (blas_lite.f, linpack_lite.f, loessf.f)
      # with the image's gfortran, so auditwheel vendors its libgfortran runtime.
      packages: gcc

  publish:
    name: Publish scikit-misc ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scikit-misc-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: scikit-misc-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
