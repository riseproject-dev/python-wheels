---
# Based on the `build-wheel` job of
# https://github.com/fujimotos/polyleven/blob/0.11/.github/workflows/pypi.yml
# and the test invocation of
# https://github.com/fujimotos/polyleven/blob/0.11/.github/workflows/regress.yml
name: Build polyleven wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'polyleven version to build (e.g. 0.11.0)'
        required: true
        default: '0.11.0'
  pull_request:
    paths:
      - '.github/workflows/build-polyleven.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.11.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  POLYLEVEN_VERSION: ${{ inputs.version || '0.11.0' }}
  # Upstream tags drop the trailing patch zero (0.11 -> 0.11.0); move both together.
  POLYLEVEN_REF: '0.11'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build polyleven ${{ inputs.version || '0.11.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout polyleven ${{ env.POLYLEVEN_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fujimotos/polyleven
          ref: ${{ env.POLYLEVEN_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The regression suite ships in the checkout, not in the sdist.
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: >-
            python -c "import polyleven; assert polyleven.__file__.endswith('.so'), polyleven.__file__" &&
            python -m unittest test/regression.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: polyleven-${{ env.POLYLEVEN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish polyleven ${{ inputs.version || '0.11.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: polyleven-${{ inputs.version || '0.11.0' }}-*-manylinux_riscv64
