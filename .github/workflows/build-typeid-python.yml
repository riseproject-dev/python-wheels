# This workflow is based on: https://github.com/akhundMurad/typeid-python/blob/v0.3.10/.github/workflows/publish.yml
name: Build typeid-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typeid-python.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typeid-python.yml'
      - 'docs/packages/typeid-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typeid-python.yml'
      - 'docs/packages/typeid-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typeid-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build typeid-python ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # rust-base32 (typeid-python's pyo3 extension) declares no abi3 feature,
        # so every interpreter needs its own build. Repo-standard riscv64 set.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      TYPEID_PYTHON_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout typeid-python v${{ env.TYPEID_PYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: akhundMurad/typeid-python
          ref: v${{ env.TYPEID_PYTHON_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # typeid-python ships no [tool.cibuildwheel], so install the Rust
          # toolchain its maturin backend needs in-container and put it on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # [tool.maturin] include (LICENSE/README/typeid/rust-base32) leaves
          # tests/ out of the sdist, so stage it from the checkout (gotcha 104).
          # Mirrors upstream's pytest suite; doc tests (make test-docs) and lint
          # (make lint) are dev-only, not wheel tests.
          CIBW_TEST_REQUIRES: pytest requests pyyaml click pydantic
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -q tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: typeid-python-${{ env.TYPEID_PYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish typeid-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: typeid-python-${{ matrix.version }}-*-manylinux_riscv64
