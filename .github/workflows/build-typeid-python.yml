# This workflow is based on: https://github.com/akhundMurad/typeid-python/blob/v0.3.10/.github/workflows/publish.yml
name: Build typeid-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typeid-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typeid-python.yml'
      - 'docs/packages/typeid-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typeid-python.yml'
      - 'docs/packages/typeid-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typeid-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build typeid-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "typeid-python"
      version: "${{ matrix.version }}"
      repository: "akhundMurad/typeid-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # typeid-python ships no [tool.cibuildwheel], so install the Rust
      # toolchain its maturin backend needs in-container and put it on PATH.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # [tool.maturin] include (LICENSE/README/typeid/rust-base32) leaves
      # tests/ out of the sdist, so stage it from the checkout (gotcha 104).
      # Mirrors upstream's pytest suite; doc tests (make test-docs) and lint
      # (make lint) are dev-only, not wheel tests.
      cibw-test-requires: "pytest requests pyyaml click pydantic"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest -q tests"

  publish:
    name: Publish typeid-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: typeid-python-${{ matrix.version }}-*-manylinux_riscv64
