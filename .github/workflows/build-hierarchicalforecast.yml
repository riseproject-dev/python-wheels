---
# This workflow is based on: https://github.com/Nixtla/hierarchicalforecast/blob/v1.5.1/.github/workflows/python-publish.yml
# and https://github.com/Nixtla/hierarchicalforecast/blob/v1.5.1/.github/workflows/pytest.yml
name: Build hierarchicalforecast wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hierarchicalforecast.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hierarchicalforecast.yml'
      - 'docs/packages/hierarchicalforecast.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hierarchicalforecast.yml'
      - 'docs/packages/hierarchicalforecast.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hierarchicalforecast
      version: ${{ inputs.version }}
      # Matches the python list this replaces, which only ever built
      # cp312-cp314t; preserved rather than silently widened to cp310/cp311.
      # (That list also carried a cp314t leg, but
      # docs/packages/hierarchicalforecast.yaml has no 3.14t entry at all, so
      # that leg never actually matched a pending wheel -- a stale-matrix
      # mismatch the structural fix below now resolves on its own.)
      python-exclude: 'cp39 cp310 cp311'

  build_wheels:
    needs: [setup]
    # docs/packages/hierarchicalforecast.yaml declares manylinux-only files,
    # so this filter is a no-op today; kept so a future musllinux entry does
    # not silently duplicate the (hardcoded-manylinux) build below under
    # another name.
    if: needs.setup.outputs.versions != '[]' && matrix.platform == 'manylinux'
    name: Build hierarchicalforecast ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      HIERARCHICALFORECAST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout hierarchicalforecast v${{ env.HIERARCHICALFORECAST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Nixtla/hierarchicalforecast
          ref: v${{ env.HIERARCHICALFORECAST_VERSION }}
          submodules: true
          persist-credentials: false

      # external_libs/eigen is compiled into the wheel but upstream's wheel
      # ships only its own LICENSE; stage eigen's for the default COPYING* glob.
      - name: Stage the vendored dependency's licence
        run: cp external_libs/eigen/COPYING.MPL2 COPYING.eigen

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: >-
            PIP_ONLY_BINARY=numpy,pandas,scipy,scikit-learn,matplotlib,polars-runtime-32,statsmodels,statsforecast,coreforecast,pyarrow
          # utilsforecast (a hard runtime dep) requires pandas<3, which has no
          # cp314t riscv64 wheel on pypi.riseproject.dev.
          CIBW_TEST_SKIP: ${{ matrix.python == 'cp314t' && '*' || '' }}
          # polars is pinned to a version pypi.riseproject.dev has built for
          # riscv64; upstream's polars<=1.32.0 predates the polars-runtime split.
          # pyarrow is listed explicitly (not left to come in transitively via
          # statsforecast, which cp314 skips): polars.DataFrame.to_pandas() needs
          # it directly and cp314's test_diagnostics_negative_counting[polars]
          # hit a bare ModuleNotFoundError without it.
          CIBW_TEST_REQUIRES: >-
            pytest pytest-benchmark scipy polars==1.44.2 pyarrow
            ${{ contains(fromJSON('["cp312","cp313"]'), matrix.python) && 'statsforecast' || '' }}
          CIBW_TEST_SOURCES: tests
          # statsforecast needs statsmodels, which has no cp314 riscv64 wheel on
          # pypi.riseproject.dev yet; these two modules import it at the top.
          CIBW_TEST_COMMAND: >-
            python -m pytest tests --import-mode=importlib
            ${{ matrix.python == 'cp314' && '--ignore=tests/test_evaluation.py --ignore=tests/test_utils.py' || '' }}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "COPYING.eigen"}, (path, licences)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hierarchicalforecast-${{ env.HIERARCHICALFORECAST_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      HIERARCHICALFORECAST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup.py links -fopenmp on Linux, so auditwheel vendors the image's
      # libgomp into hierarchicalforecast.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hierarchicalforecast-${{ env.HIERARCHICALFORECAST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish hierarchicalforecast ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hierarchicalforecast-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: hierarchicalforecast-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
