---
# Based on the `build-wheels` job of
# https://github.com/MSeifert04/iteration_utilities/blob/v0.13.0/.github/workflows/cpython.yml
name: Build iteration-utilities wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iteration-utilities.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iteration-utilities.yml'
      - 'docs/packages/iteration-utilities.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iteration-utilities.yml'
      - 'docs/packages/iteration-utilities.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iteration-utilities
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iteration-utilities ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cp314/cp314t dropped: upstream 0.13.0 predates their _Py_IMMORTAL_REFCNT
        # removal from the public-facing internals iteration_utilities relies on for
        # its singleton objects (PYIU_CREATE_SINGLETON_INSTANCE in helpercompat.h) --
        # upstream ships no cp314 wheel either, confirming this isn't riscv64-specific.
        python: ["cp312", "cp313"]

    env:
      ITERATION_UTILITIES_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout iteration_utilities v${{ env.ITERATION_UTILITIES_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MSeifert04/iteration_utilities
          ref: v${{ env.ITERATION_UTILITIES_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import iteration_utilities; assert iteration_utilities._iteration_utilities.__file__.endswith('.so'), iteration_utilities._iteration_utilities.__file__"
            && python -m pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: iteration-utilities-${{ env.ITERATION_UTILITIES_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish iteration-utilities ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: iteration-utilities-${{ matrix.version }}-*-manylinux_riscv64
