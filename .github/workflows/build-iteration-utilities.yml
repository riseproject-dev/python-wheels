---
# Based on the `build-wheels` job of
# https://github.com/MSeifert04/iteration_utilities/blob/v0.13.0/.github/workflows/cpython.yml
name: Build iteration-utilities wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/iteration-utilities.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-iteration-utilities.yml'
      - 'docs/packages/iteration-utilities.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iteration-utilities.yml'
      - 'docs/packages/iteration-utilities.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: iteration-utilities
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build iteration-utilities ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: iteration-utilities
      version: ${{ matrix.version }}
      repository: MSeifert04/iteration_utilities
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "import iteration_utilities; assert iteration_utilities._iteration_utilities.__file__.endswith('.so'), iteration_utilities._iteration_utilities.__file__"
        && python -m pytest {package}/tests
      timeout-minutes: 60

  publish:
    name: Publish iteration-utilities ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: iteration-utilities-${{ matrix.version }}-*-manylinux_riscv64
