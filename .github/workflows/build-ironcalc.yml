---
# This workflow is based on the `linux` job of
# https://github.com/ironcalc/ironcalc/blob/v0.9.1/.github/workflows/pypi.yml
# and the `test-python` job of
# https://github.com/ironcalc/ironcalc/blob/v0.9.1/.github/workflows/build-test.yaml
name: Build ironcalc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ironcalc.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ironcalc.yml'
      - 'docs/packages/ironcalc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ironcalc.yml'
      - 'docs/packages/ironcalc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ironcalc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ironcalc ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      IRONCALC_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout ironcalc v${{ env.IRONCALC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ironcalc/ironcalc
          ref: v${{ env.IRONCALC_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i ${{ steps.interp.outputs.value }}
          manylinux: '2_39'
          working-directory: bindings/python

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      # Upstream's run_tests.sh and run_examples.sh, against the built wheel instead of `maturin develop`.
      - name: Test wheel
        working-directory: bindings/python
        run: |
          uv pip install ironcalc --no-index --find-links dist --force-reinstall
          uv pip install pytest
          pytest tests/
          for file in docs/examples/*.py; do
            echo "Running $file..."
            python "$file"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ironcalc-${{ env.IRONCALC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish ironcalc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ironcalc-${{ matrix.version }}-*-manylinux_riscv64
