---
# Based on upstream's own wheel build:
#   https://github.com/nmwsharp/potpourri3d/blob/v1.4.0/.github/workflows/cibuildwheel_config.toml
name: Build potpourri3d wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/potpourri3d.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-potpourri3d.yml'
      - 'docs/packages/potpourri3d.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-potpourri3d.yml'
      - 'docs/packages/potpourri3d.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: potpourri3d
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build potpourri3d ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: potpourri3d
      version: ${{ matrix.version }}
      repository: nmwsharp/potpourri3d
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # scikit-build-core bootstraps its own (recent) cmake from PyPI, which
      # also ships riscv64 wheels; matches upstream's cibuildwheel_config.toml.
      cibw-before-all-linux: ${{ matrix.platform == 'manylinux' && 'yum remove -y cmake' || '' }}
      timeout-minutes: 60

  publish:
    name: Publish potpourri3d ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: potpourri3d-${{ matrix.version }}-*riscv64
