---
# Upstream has no wheel-building workflow of its own: .github/workflows/test_push.yml
# drives a private Artifex harness (ArtifexSoftware/aptest, needs an SSH deploy key),
# and the released wheels come from `pipcl` (the PyMuPDF build backend) invoked
# directly. So this mirrors upstream's *build recipe* rather than a CI file, exactly
# as build-pymupdf.yml does.
#
# pipcl derives the wheel tag from the interpreter it runs on, so a build on our
# cp312 floor yields cp312-abi3 where upstream publishes cp310-abi3. Upstream ships
# no free-threaded wheel and setup.py hardcodes py_limited_api, which pipcl asserts
# is incompatible with Py_GIL_DISABLED - hence a single build (CLAUDE.md gotcha 11).
name: Build pymupdf-layout wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymupdf-layout.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymupdf-layout.yml'
      - 'docs/packages/pymupdf-layout.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymupdf-layout.yml'
      - 'docs/packages/pymupdf-layout.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymupdf-layout
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pymupdf-layout ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv

    env:
      PYMUPDF_LAYOUT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pymupdf-layout ${{ env.PYMUPDF_LAYOUT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ArtifexSoftware/pymupdf_layout
          ref: ${{ env.PYMUPDF_LAYOUT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PYMUPDF_LAYOUT_SETUP_SWIG=swig
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # The extensions link the MuPDF shared libraries shipped inside the
          # installed pymupdf wheel and find them at runtime via $ORIGIN, so
          # auditwheel must not vendor a second 36MB copy of them (gotcha 17).
          CIBW_REPAIR_WHEEL_COMMAND: >-
            auditwheel repair -w {dest_dir} {wheel}
            --exclude 'libmupdf.so.*' --exclude 'libmupdfcpp.so.*'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import pymupdf.features, pymupdf.tgif" &&
            pytest {package}/tests

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"pymupdf/_features.so", "pymupdf/_tgif.so"}
          for whl in sys.argv[1:]:
              names = set(zipfile.ZipFile(whl).namelist())
              assert expected <= names, (whl, sorted(n for n in names if n.endswith(".so")))
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymupdf-layout-${{ env.PYMUPDF_LAYOUT_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pymupdf-layout ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pymupdf-layout-${{ matrix.version }}-*-manylinux_riscv64
