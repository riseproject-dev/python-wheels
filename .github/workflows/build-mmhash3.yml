---
# Based on the `build_wheels` job of
# https://github.com/Fokko/mmhash3/blob/master/.github/workflows/wheels.yml
# Upstream never tagged the 3.0.1 release (gotcha 103); MMHASH3_REF pins the exact
# commit, byte-identical to the PyPI sdist, that setup.py bumped to version 3.0.1.
name: Build mmhash3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'mmhash3 version to build (e.g. 3.0.1)'
        required: true
        default: '3.0.1'
  pull_request:
    paths:
      - '.github/workflows/build-mmhash3.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.0.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MMHASH3_VERSION: ${{ inputs.version || '3.0.1' }}
  MMHASH3_REF: ebbdeee88160e59ba0e6fa7aab972a3bfa289b6b
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build mmhash3 ${{ inputs.version || '3.0.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout mmhash3 ${{ env.MMHASH3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Fokko/mmhash3
          ref: ${{ env.MMHASH3_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import mmh3; assert mmh3.__file__.endswith('.so'), mmh3.__file__" &&
            pytest {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mmhash3-${{ env.MMHASH3_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mmhash3 ${{ inputs.version || '3.0.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: mmhash3-${{ inputs.version || '3.0.1' }}-*-manylinux_riscv64
