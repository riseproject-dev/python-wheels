---
# Based on the `build_wheels` job of
# https://github.com/Fokko/mmhash3/blob/master/.github/workflows/wheels.yml
# Upstream never tagged the 3.0.1 release (gotcha 103); the ref below pins the
# exact commit, byte-identical to the PyPI sdist, that setup.py bumped to 3.0.1.
name: Build mmhash3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mmhash3.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mmhash3.yml'
      - 'docs/packages/mmhash3.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mmhash3.yml'
      - 'docs/packages/mmhash3.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mmhash3
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mmhash3 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mmhash3
      version: ${{ matrix.version }}
      repository: Fokko/mmhash3
      ref: ebbdeee88160e59ba0e6fa7aab972a3bfa289b6b
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "import mmh3; assert mmh3.__file__.endswith('.so'), mmh3.__file__" &&
        pytest {project}
      timeout-minutes: 60

  publish:
    name: Publish mmhash3 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mmhash3-${{ matrix.version }}-*-manylinux_riscv64
