---
# This workflow is based on upstream's own wheel recipe,
# https://github.com/bulletphysics/bullet3/blob/6c888f4abd7b46f572587360cc214985f02e5c6b/wheel.sh
name: Build pybullet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybullet.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybullet.yml'
      - 'docs/packages/pybullet.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybullet.yml'
      - 'docs/packages/pybullet.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # 3.2.7 was released to PyPI without a git tag; pin the commit that bumped
  # setup.py's version to 3.2.7, byte-identical to the PyPI sdist (gotcha 103).
  # Update alongside PYBULLET_VERSION.
  PYBULLET_REF: 6c888f4abd7b46f572587360cc214985f02e5c6b

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybullet
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pybullet ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pybullet"
      version: "${{ matrix.version }}"
      repository: "bulletphysics/bullet3"
      ref: "6c888f4abd7b46f572587360cc214985f02e5c6b"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 1440
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py enables the numpy code paths from a plain `import numpy`,
      # which a PEP 517 build-isolation overlay is invisible to, so numpy is
      # preinstalled with isolation disabled (upstream's wheel.sh installs
      # requirements.txt into the interpreter it then builds with).
      # pybullet.c hands PyObject* to numpy's PyArrayObject* accessors, which
      # GCC 14 rejects outright where upstream's older image only warned.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy CFLAGS=-Wno-error=incompatible-pointer-types"
      cibw-before-build: "pip install setuptools wheel -r {package}/requirements.txt"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "numpy"
      # The unittests resolve `r2d2.urdf` & co through bullet's own relative
      # `../../../data/` search path, so `data/` is staged beside them.
      cibw-test-sources: "data examples/pybullet/unittests"
      cibw-test-command: "cd examples/pybullet/unittests && python unittests.py && python userDataTest.py && python saveRestoreStateTest.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYBULLET_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pybullet-${{ env.PYBULLET_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"pybullet", "eglRenderer"}, exts
          EOF

  publish:
    name: Publish pybullet ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pybullet-${{ matrix.version }}-*-manylinux_riscv64
