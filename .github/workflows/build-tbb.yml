---
# PyPI's tbb wheel is Intel's own prebuilt x86_64-only binary under a closed
# redistribution licence with no sdist; this builds the Apache-2.0 oneTBB source instead.
# Based on: https://github.com/uxlfoundation/oneTBB (no upstream CI builds this wheel)
name: Build tbb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tbb version to build (oneTBB git tag is v<version>)'
        required: true
        default: '2023.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-tbb.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2023.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TBB_VERSION: ${{ inputs.version || '2023.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tbb ${{ inputs.version || '2023.1.0' }} py2.py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Checkout oneTBB v${{ env.TBB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: uxlfoundation/oneTBB
          ref: v${{ env.TBB_VERSION }}
          persist-credentials: false

      - name: Pull manylinux_riscv64 image
        run: docker pull "${MANYLINUX_RISCV64_IMAGE}"

      # libtbbbind needs hwloc; the system hwloc dev package isn't manylinux-portable
      # (dynamic libhwloc.so dependency), and Intel's own wheel statically bundles it.
      # Skip it: TBB_TEST=OFF/TBB_EXAMPLES=OFF trim the build, TBB_STRICT=OFF avoids
      # upstream's warnings-as-errors on a newer GCC than they test against.
      - name: Build the TBB libraries and the wheel
        run: |
          docker run --rm -v "$(pwd):/work" -w /work -e TBB_VERSION "${MANYLINUX_RISCV64_IMAGE}" bash -c '
            set -euxo pipefail
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTBB_TEST=OFF -DTBB_EXAMPLES=OFF -DTBB_STRICT=OFF -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build build -j"$(nproc)"
            cmake --install build --prefix /work/install
            mkdir -p dist_libs
            cp -L install/lib/libtbb.so* install/lib/libtbbmalloc.so* install/lib/libtbbmalloc_proxy.so* dist_libs/
            strip dist_libs/*.so*
            file dist_libs/*.so*
            ldd dist_libs/libtbb.so
            cat > setup.py <<PYEOF
          import glob
          import os
          from setuptools import setup
          setup(
              name="tbb",
              version=os.environ["TBB_VERSION"],
              description="Intel(R) oneAPI Threading Building Blocks (oneTBB)",
              long_description="oneAPI Threading Building Blocks (oneTBB) riscv64 dynamic libraries for Linux, built from the Apache-2.0 licensed oneTBB source.",
              url="https://github.com/uxlfoundation/oneTBB",
              license="Apache-2.0",
              license_files=["LICENSE.txt"],
              classifiers=[
                  "Operating System :: POSIX :: Linux",
                  "Topic :: Software Development :: Libraries",
              ],
              data_files=[("lib", sorted(glob.glob("dist_libs/*.so*")))],
          )
          PYEOF
            pybin=/opt/python/cp312-cp312/bin
            "$pybin/pip" install -q -U setuptools wheel
            "$pybin/python3" setup.py bdist_wheel --python-tag py2.py3 --plat-name manylinux_2_39_riscv64
            "$pybin/pip" install -q dist/*.whl
            "$pybin/python3" - <<PYEOF
          import ctypes, os, sysconfig
          libdir = os.path.join(sysconfig.get_path("data"), "lib")
          tbb = ctypes.CDLL(os.path.join(libdir, "libtbb.so.12"))
          version = tbb.TBB_runtime_interface_version()
          assert version // 1000 == 12, version
          malloc = ctypes.CDLL(os.path.join(libdir, "libtbbmalloc.so.2"))
          malloc.scalable_malloc.restype = ctypes.c_void_p
          malloc.scalable_malloc.argtypes = [ctypes.c_size_t]
          malloc.scalable_free.argtypes = [ctypes.c_void_p]
          ptr = malloc.scalable_malloc(64)
          assert ptr
          malloc.scalable_free(ptr)
          print("smoke test OK: TBB_runtime_interface_version =", version)
          PYEOF
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tbb-${{ env.TBB_VERSION }}-py2.py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish tbb ${{ inputs.version || '2023.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tbb-${{ inputs.version || '2023.1.0' }}-*-manylinux_riscv64
