---
# This workflow is based on the `build-wheels` job of
# https://github.com/spookylukey/planegcs/blob/v0.9.6/.github/workflows/release.yml,
# which drives everything through the [tool.cibuildwheel] table in pyproject.toml.
name: Build planegcs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/planegcs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-planegcs.yml'
      - 'docs/packages/planegcs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-planegcs.yml'
      - 'docs/packages/planegcs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: planegcs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build planegcs ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's [tool.cibuildwheel] build list: no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]

    env:
      PLANEGCS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout planegcs v${{ env.PLANEGCS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: spookylukey/planegcs
          ref: v${{ env.PLANEGCS_VERSION }}
          persist-credentials: false

      # The extension compiles in Eigen (MPL-2.0) and Boost (BSL-1.0) headers; the
      # default LICEN[CS]E* glob picks these up next to upstream's own LICENSE.
      - name: Stage third-party licences
        run: |
          curl -sSfL -o LICENSE.eigen https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2
          curl -sSfL -o LICENSE.boost https://www.boost.org/LICENSE_1_0.txt

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Replaces upstream's [tool.cibuildwheel.linux.environment], so it repeats it.
          CIBW_ENVIRONMENT: >-
            CMAKE_PREFIX_PATH=/opt/eigen3-installed
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the extension module and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith('.so')]
          assert len(sos) == 1 and sos[0].startswith('planegcs/_planegcs.'), sos
          lic = sorted(n.rsplit('/', 1)[1] for n in names
                       if '.dist-info/licenses/' in n and not n.endswith('/'))
          assert lic == ['LICENSE', 'LICENSE.boost', 'LICENSE.eigen'], lic
          print('OK:', sys.argv[1], sos, lic)
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: planegcs-${{ env.PLANEGCS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish planegcs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: planegcs-${{ matrix.version }}-*-manylinux_riscv64
