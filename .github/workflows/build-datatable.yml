---
# This workflow is based on: https://github.com/h2oai/datatable/blob/v1.1.0/.github/workflows/build.yml
name: Build datatable wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/datatable.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-datatable.yml'
      - 'docs/packages/datatable.yaml'
      - 'patches/datatable/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-datatable.yml'
      - 'docs/packages/datatable.yaml'
      - 'patches/datatable/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: datatable
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build datatable ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "datatable"
      version: "${{ matrix.version }}"
      repository: "h2oai/datatable"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # ci/ext.py stamps the build's git revision; the copied checkout has another owner.
      cibw-before-all-linux: "git config --global --add safe.directory '*'"
      cibw-environment-linux: "DT_RELEASE=True"
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      # datatable 1.1.0 cannot read pandas 3's Arrow-backed string columns.
      cibw-test-requires: "pytest docutils \"pandas<3\" pyarrow"
      cibw-test-command: "python -m pytest -ra --maxfail=10 -Werror -vv --showlocals {project}/tests"

  publish:
    name: Publish datatable ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: datatable-${{ matrix.version }}-*-manylinux_riscv64
