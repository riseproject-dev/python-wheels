---
# This workflow is based on: https://github.com/h2oai/datatable/blob/v1.1.0/.github/workflows/build.yml
name: Build datatable wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/datatable.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-datatable.yml'
      - 'docs/packages/datatable.yaml'
      - 'patches/datatable/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-datatable.yml'
      - 'docs/packages/datatable.yaml'
      - 'patches/datatable/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: datatable
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build datatable ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: src/core/python/tuple.cc reads PyObject::ob_refcnt directly.
        python: ["cp312", "cp313", "cp314"]

    env:
      DATATABLE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout datatable v${{ env.DATATABLE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: h2oai/datatable
          ref: v${{ env.DATATABLE_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch datatable source
        run: git apply python-wheels/patches/datatable/${{ env.DATATABLE_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # ci/ext.py stamps the build's git revision; the copied checkout has another owner.
          CIBW_BEFORE_ALL_LINUX: git config --global --add safe.directory '*'
          CIBW_ENVIRONMENT: >-
            DT_RELEASE=True
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: 'PIP_ONLY_BINARY=:all:'
          # datatable 1.1.0 cannot read pandas 3's Arrow-backed string columns.
          CIBW_TEST_REQUIRES: pytest docutils "pandas<3" pyarrow
          CIBW_TEST_COMMAND: python -m pytest -ra --maxfail=10 -Werror -vv --showlocals {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: datatable-${{ env.DATATABLE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish datatable ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: datatable-${{ matrix.version }}-*-manylinux_riscv64
