---
# This workflow is based on the `linux` job of
# https://github.com/zizmorcore/zizmor/blob/v1.29.0/.github/workflows/release-pypi.yml
name: Build zizmor wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zizmor.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zizmor.yml'
      - 'docs/packages/zizmor.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zizmor.yml'
      - 'docs/packages/zizmor.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zizmor
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: zizmor
      version: ${{ matrix.version }}
      repository: zizmorcore/zizmor
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 360
      maturin-args: --release --locked --manifest-path crates/zizmor/Cargo.toml

  test_wheel:
    name: Test zizmor ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      ZIZMOR_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout zizmor v${{ env.ZIZMOR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zizmorcore/zizmor
          ref: v${{ env.ZIZMOR_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: zizmor-${{ env.ZIZMOR_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . zizmor

      # No wheel-level test suite ships in the sdist (gotcha 187): zizmor's own
      # crates/zizmor/tests/integration/audit/*.rs are Rust integration tests run
      # by upstream's own `cargo test`, never packaged. Drive the real audit
      # engine with upstream's own known-bad fixture (mirroring
      # tests/integration/audit/artipacked.rs) and a known-clean workflow,
      # instead of settling for a bare --version check.
      #
      # No `python -m zizmor`: unlike prek/pyrefly, zizmor's own source tree
      # ships no zizmor/__init__.py shim, so the wheel carries only the
      # .data/scripts/zizmor binary and no importable module.
      - name: Test wheel
        run: |
          set -euo pipefail
          zizmor --version
          zizmor --help >/dev/null

          set +e
          out=$(zizmor --offline crates/zizmor/tests/integration/test-data/artipacked.yml 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 13 ]
          echo "$out" | grep -q 'warning\[artipacked\]'

          work=$(mktemp -d)
          cat > "$work/clean.yml" <<'YAML'
          on:
            push:
              branches: [main]

          permissions: {}

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
                  with:
                    persist-credentials: false
          YAML
          zizmor --offline "$work/clean.yml"

  publish:
    name: Publish zizmor ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zizmor-${{ matrix.version }}-manylinux_riscv64
