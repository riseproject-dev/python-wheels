---
# This workflow is based on the `build_linux_wheels` and `build_linux_abi3_wheels` jobs of
# https://github.com/online-ml/river/blob/0.26.1/.github/workflows/pypi.yml
# and the `tests` job of
# https://github.com/online-ml/river/blob/0.26.1/.github/workflows/code-quality.yml
name: Build river wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/river.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-river.yml'
      - 'docs/packages/river.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-river.yml'
      - 'docs/packages/river.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: river
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build river ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "river"
      version: "${{ matrix.version }}"
      repository: "online-ml/river"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # build[uv] needs a host uv for the audit step, which the riscv64 runner lacks.
      cibw-build-frontend: "build"
      cibw-environment-linux: "PATH=\"$HOME/.cargo/bin:$PATH\""
      cibw-test-environment: "PIP_PREFER_BINARY=1"
      cibw-test-requires: >
        pytest scikit-learn sqlalchemy sympy gymnasium polars pyarrow
      cibw-test-sources: "tests conftest.py pyproject.toml"
      # test_docs.py needs the docs/ parser tooling, not the wheel; the memory
      # ceiling in test_memory_usage_class is calibrated to CPython 3.13 object
      # sizes and fails on 3.12 on x86_64 as well.
      cibw-test-command: >
        python -c "import river.anomaly, river.datasets, river.drift, river.stream, river.tree" &&
        python -c "import river._river_rust as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -c "from river import datasets, bandit; datasets.Elec2().download(); datasets.SMSSpam().download(); datasets.CreditCard().download(); datasets.Music().download(); datasets.CriteoAds().download(); bandit.datasets.NewsArticles().download()" &&
        python -m pytest tests
        --ignore=tests/test_docs.py
        --deselect "tests/tree/test_trees.py::test_memory_usage_class[dataset2-model2]"

  build_abi3_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build river ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "river"
      version: "${{ matrix.version }}"
      repository: "online-ml/river"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 120
      cibw-build: "cp311-manylinux_riscv64"
      cibw-build-frontend: "build"
      cibw-environment-linux: "MATURIN_PEP517_ARGS=\"--features abi3\" PATH=\"$HOME/.cargo/bin:$PATH\""
      # scipy 1.16/1.17 still accept 3.11 but have no riscv64 wheel; take the registry's 1.15.
      cibw-test-environment: "PIP_PREFER_BINARY=1"

  publish:
    name: Publish river ${{ matrix.version }}
    needs: [setup, build_wheels, build_abi3_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: river-${{ matrix.version }}-*-manylinux_riscv64
