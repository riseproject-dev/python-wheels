---
# This workflow is based on the `wheels` and `wheel-tests` jobs of
# https://github.com/vectorize-io/toktok/blob/v0.3.0/.github/workflows/ci.yml
name: Build toktok-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/toktok-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-toktok-rs.yml'
      - 'docs/packages/toktok-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-toktok-rs.yml'
      - 'docs/packages/toktok-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: toktok-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build toktok-rs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp311-abi3, cp314t]
        include:
          - tag: cp311-abi3
            build: >-
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: toktok-rs
      version: ${{ matrix.version }}
      repository: vectorize-io/toktok
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.tag }}-manylinux_riscv64
      cibw-build: ${{ matrix.build }}
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
        sh -s -- -y --profile minimal
      cibw-environment-linux: >-
        PATH="$PATH:$HOME/.cargo/bin"
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-environment: >-
        PIP_ONLY_BINARY=:all:
      cibw-test-requires: pytest numpy tiktoken
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import toktok._toktok as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests -q
      timeout-minutes: 120

  publish:
    name: Publish toktok-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: toktok-rs-${{ matrix.version }}-*-manylinux_riscv64
