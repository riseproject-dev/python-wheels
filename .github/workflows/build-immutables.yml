---
# Based on the `build-wheels` job of
# https://github.com/MagicStack/immutables/blob/v0.21/.github/workflows/release.yml
name: Build immutables wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/immutables.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-immutables.yml'
      - 'docs/packages/immutables.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-immutables.yml'
      - 'docs/packages/immutables.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: immutables
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build immutables ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: immutables
      version: ${{ matrix.version }}
      repository: MagicStack/immutables
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Upstream's own "test" extra pins mypy~=1.4, which has no riscv64 wheel
      # anywhere; the suite doesn't need it since IMMU_SKIP_MYPY_TESTS skips it.
      cibw-test-extras: ''
      cibw-environment: IMMU_SKIP_MYPY_TESTS=1
      cibw-test-command: >-
        python -c "from immutables._map import Map as m; assert m.__module__ == 'immutables._map'" &&
        python {project}/tests/__init__.py
      timeout-minutes: 60

  publish:
    name: Publish immutables ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: immutables-${{ matrix.version }}-*riscv64
