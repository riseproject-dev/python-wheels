---
# This workflow is based on: https://github.com/zopefoundation/zope.i18nmessageid/blob/8.3/.github/workflows/tests.yml
name: Build zope-i18nmessageid wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zope-i18nmessageid.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-i18nmessageid.yml'
      - 'docs/packages/zope-i18nmessageid.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-i18nmessageid.yml'
      - 'docs/packages/zope-i18nmessageid.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zope-i18nmessageid
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zope-i18nmessageid ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: zope-i18nmessageid
      version: ${{ matrix.version }}
      repository: zopefoundation/zope.i18nmessageid
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-environment: ZOPE_INTERFACE_STRICT_IRO=1
      # setup.py swallows extension build failures (optional_build_ext), but unlike
      # zope-hookable/zope-interface, message.py imports the C extension unconditionally
      # (no PURE_PYTHON gate) - OptimizationTests.test_optimizations_available already
      # fails if the import silently fell back, so one run is enough to prove the wheel
      # is not pure Python.
      cibw-test-command: python -m unittest discover -s {package}/src/zope
      timeout-minutes: 60

  publish:
    name: Publish zope-i18nmessageid ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zope-i18nmessageid-${{ matrix.version }}-*-manylinux_riscv64
