---
# This workflow is based on: https://github.com/zopefoundation/zope.i18nmessageid/blob/8.3/.github/workflows/tests.yml
name: Build zope-i18nmessageid wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zope-i18nmessageid.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-i18nmessageid.yml'
      - 'docs/packages/zope-i18nmessageid.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zope-i18nmessageid.yml'
      - 'docs/packages/zope-i18nmessageid.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zope-i18nmessageid
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zope-i18nmessageid ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      ZOPE_I18NMESSAGEID_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout zope.i18nmessageid ${{ env.ZOPE_I18NMESSAGEID_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zopefoundation/zope.i18nmessageid
          ref: ${{ env.ZOPE_I18NMESSAGEID_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_ENVIRONMENT: ZOPE_INTERFACE_STRICT_IRO=1
          # setup.py swallows extension build failures (optional_build_ext), but unlike
          # zope-hookable/zope-interface, message.py imports the C extension unconditionally
          # (no PURE_PYTHON gate) — OptimizationTests.test_optimizations_available already
          # fails if the import silently fell back, so one run is enough to prove the wheel
          # is not pure Python.
          CIBW_TEST_COMMAND: python -m unittest discover -s {package}/src/zope

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zope-i18nmessageid-${{ env.ZOPE_I18NMESSAGEID_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zope-i18nmessageid ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zope-i18nmessageid-${{ matrix.version }}-*-manylinux_riscv64
