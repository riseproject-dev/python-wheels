#
# mypy compiles itself with mypyc and ships per-interpreter compiled wheels on
# PyPI for every platform except riscv64. This builds the riscv64 ones, mirroring
# upstream's recipe in mypyc/mypy_mypyc-wheels (cibuildwheel.toml).
name: Build mypy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mypy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mypy.yml'
      - 'docs/packages/mypy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mypy.yml'
      - 'docs/packages/mypy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mypy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mypy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mypy
      version: ${{ matrix.version }}
      # mypy self-compiles ~230 modules at -O3 (~40min alone on fast hardware), then runs its full test suite; both are much slower on the riscv runner.
      # 720 was not enough for 2.4.0 (cp312/cp313/cp314 take 11-12 h; cp314t was cancelled at ~98% of its tests), hence 1080.
      # Tag is v-prefixed; the wheel version (mypy/version.py) is the plain MYPY_VERSION.
      repository: python/mypy
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      # MYPY_USE_MYPYC=1 is the mypyc opt-in; without it setup.py silently ships a pure-Python wheel. Opt/debug levels match upstream's release build.
      cibw-environment-linux: >-
        MYPY_USE_MYPYC=1
        MYPYC_OPT_LEVEL=3
        MYPYC_DEBUG_LEVEL=0
      cibw-before-test: pip install -r {project}/test-requirements.txt
      # Upstream's wheel test: run mypy.test + mypyc.test against the installed compiled wheel from a temp cwd, with mypy's pytest config copied beside the install and the test-data prefix pointed back at the checkout.
      cibw-test-command: >-
        DIR=$(python -c 'import mypy, os; dn = os.path.dirname; print(dn(dn(mypy.__path__[0])))')
        && cp '{project}/pyproject.toml' '{project}/conftest.py' "$DIR"
        && MYPY_TEST_DIR=$(python -c 'import mypy.test; print(mypy.test.__path__[0])')
        && MYPYC_TEST_DIR=$(python -c 'import mypyc.test; print(mypyc.test.__path__[0])')
        && MYPY_TEST_PREFIX='{project}' pytest "$MYPY_TEST_DIR" "$MYPYC_TEST_DIR" -k 'not test_external'
      timeout-minutes: 1080

  publish:
    name: Publish mypy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mypy-${{ matrix.version }}-*-manylinux_riscv64
