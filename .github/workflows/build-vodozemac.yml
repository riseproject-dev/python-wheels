---
# This workflow is based on the `linux` job of
# https://github.com/matrix-nio/vodozemac-python/blob/0.10.0/.github/workflows/release.yml
name: Build vodozemac wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'vodozemac version to build (git tag, e.g. 0.10.0)'
        required: true
        default: '0.10.0'
  pull_request:
    paths:
      - '.github/workflows/build-vodozemac.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.10.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.10.0 there.
  VODOZEMAC_VERSION: ${{ inputs.version || '0.10.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build vodozemac ${{ inputs.version || '0.10.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout vodozemac-python ${{ env.VODOZEMAC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: matrix-nio/vodozemac-python
          ref: ${{ env.VODOZEMAC_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # vodozemac-python ships no [tool.cibuildwheel], so the Rust
          # toolchain its maturin backend needs is installed in-container
          # here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest hypothesis
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import vodozemac.vodozemac as ext; assert ext.__file__.endswith('.so'), ext.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vodozemac-${{ env.VODOZEMAC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish vodozemac ${{ inputs.version || '0.10.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: vodozemac-${{ inputs.version || '0.10.0' }}-*-manylinux_riscv64
