---
# Based on https://github.com/spotify/annoy/blob/v1.17.3/.github/workflows/ci.yml
name: Build annoy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/annoy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-annoy.yml'
      - 'docs/packages/annoy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-annoy.yml'
      - 'docs/packages/annoy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: annoy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build annoy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: annoy
      version: ${{ matrix.version }}
      repository: spotify/annoy
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: numpy pytest
      # The checkout's own annoy/ (pure-Python wrapper, no compiled
      # .annoylib) would shadow the installed wheel if staged (gotcha 25);
      # only test/ is needed.
      cibw-test-sources: test
      # accuracy_test.py downloads multi-hundred-MB datasets from
      # ann-benchmarks.com; deselected rather than exercised in CI.
      cibw-test-command: pytest test -v --ignore=test/accuracy_test.py
      timeout-minutes: 60

  publish:
    name: Publish annoy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: annoy-${{ matrix.version }}-*-manylinux_riscv64
