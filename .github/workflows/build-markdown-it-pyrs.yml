---
# This workflow is based on the `linux` job of
# https://github.com/chrisjsewell/markdown-it-pyrs/blob/v0.4.0/.github/workflows/CI.yml
name: Build markdown-it-pyrs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/markdown-it-pyrs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-markdown-it-pyrs.yml'
      - 'docs/packages/markdown-it-pyrs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-markdown-it-pyrs.yml'
      - 'docs/packages/markdown-it-pyrs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: markdown-it-pyrs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build markdown-it-pyrs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "markdown-it-pyrs"
      version: "${{ matrix.version }}"
      repository: "chrisjsewell/markdown-it-pyrs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # markdown-it-pyrs ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest pytest-param-files"
      cibw-test-sources: "tests"
      # bench_html.py/bench_tree.py need the benchmarking extra
      # (pytest-benchmark, markdown-it-py), not relevant to a wheel test.
      cibw-test-command: >
        python -c "import markdown_it_pyrs.markdown_it_pyrs as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests/test_api.py tests/test_cli.py tests/test_fixtures.py

  publish:
    name: Publish markdown-it-pyrs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: markdown-it-pyrs-${{ matrix.version }}-*-manylinux_riscv64
