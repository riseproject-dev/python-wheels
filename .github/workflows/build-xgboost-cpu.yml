---
# xgboost-cpu has no sdist and no upstream Linux wheel workflow of its own: it is
# produced by ops/pipeline/build-python-wheels-cpu.sh, which renames the regular
# in-repo build via ops/script/pypi_variants.py and runs `pip wheel` from
# python-package/ (USE_CUDA defaults to OFF, so this is just the plain CPU build):
#   https://github.com/dmlc/xgboost/blob/v3.4.1/ops/pipeline/build-python-wheels-cpu.sh
name: Build xgboost-cpu wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xgboost-cpu.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xgboost-cpu.yml'
      - 'docs/packages/xgboost-cpu.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xgboost-cpu.yml'
      - 'docs/packages/xgboost-cpu.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Pinned explicitly so the gpl_sources job pulls the same image the wheel's
  # vendored libgomp came from.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xgboost-cpu
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build xgboost-cpu ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "xgboost-cpu"
      version: "${{ matrix.version }}"
      repository: "dmlc/xgboost"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 180
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply "python-wheels/patches/xgboost-cpu/${XGBOOST_VERSION#v}"/0001-*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "python-package"
      # wheel.py-api = "py3", so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # Renames the package to xgboost-cpu and drops the nvidia-nccl-cu13
      # dependency, same as upstream's own build-python-wheels-cpu.sh.
      cibw-before-build: "python3 -m pip install packaging && python3 {project}/ops/script/pypi_variants.py --use-suffix=cpu --require-nccl-dep=na"
      cibw-test-requires: "pytest hypothesis scikit-learn pandas"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy,pandas,scikit-learn"
      # Mirrors upstream's own reduced arm64 suite (ops/pipeline/test-python-wheel.sh
      # --suite cpu-arm64); test_model_compatibility.py is dropped since it downloads
      # a model archive from xgboost's own S3 bucket.
      cibw-test-command: "pytest -v -s -rxXs --durations=0 {project}/tests/python/test_basic.py {project}/tests/python/test_basic_models.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      XGBOOST_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: xgboost-cpu-${{ env.XGBOOST_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries libxgboost and a vendored libgomp
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("xgboost/lib/libxgboost.so", "libgomp"):
              if not any(want in n for n in names):
                  raise SystemExit(f"error: {want} missing from {sys.argv[1]}")
          print("\n".join(n for n in names if ".so" in n))
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (gcc) for xgboost-cpu ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv
    env:
      XGBOOST_VERSION: ${{ matrix.version }}

    steps:
      # auditwheel vendors the image's libgomp.so.1 into the wheel.
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xgboost-cpu-${{ env.XGBOOST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish xgboost-cpu ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: xgboost-cpu-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: xgboost-cpu-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
