---
# xgboost-cpu has no sdist and no upstream Linux wheel workflow of its own: it is
# produced by ops/pipeline/build-python-wheels-cpu.sh, which renames the regular
# in-repo build via ops/script/pypi_variants.py and runs `pip wheel` from
# python-package/ (USE_CUDA defaults to OFF, so this is just the plain CPU build):
#   https://github.com/dmlc/xgboost/blob/v3.4.1/ops/pipeline/build-python-wheels-cpu.sh
name: Build xgboost-cpu wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'xgboost version to build (git tag, e.g. v3.4.1)'
        required: true
        default: 'v3.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-xgboost-cpu.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || 'v3.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  XGBOOST_VERSION: ${{ inputs.version || 'v3.4.1' }}
  # Pinned explicitly so the gpl_sources job pulls the same image the wheel's
  # vendored libgomp came from.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build xgboost-cpu ${{ inputs.version || 'v3.4.1' }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180

    steps:
      - name: Checkout xgboost ${{ env.XGBOOST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmlc/xgboost
          ref: ${{ env.XGBOOST_VERSION }}
          submodules: 'true'
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # gotcha 166: libgomp's dynamic/guided work-share schedules fault on the
      # riscv64 runners; ParallelFor() is XGBoost's one choke point for both.
      - name: Patch xgboost source
        run: git apply "python-wheels/patches/xgboost-cpu/${XGBOOST_VERSION#v}"/0001-*.patch

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python-package
          output-dir: wheelhouse/
          # wheel.py-api = "py3", so one build serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Renames the package to xgboost-cpu and drops the nvidia-nccl-cu13
          # dependency, same as upstream's own build-python-wheels-cpu.sh.
          CIBW_BEFORE_BUILD: >-
            python3 -m pip install packaging &&
            python3 {project}/ops/script/pypi_variants.py --use-suffix=cpu --require-nccl-dep=na
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest hypothesis scikit-learn pandas
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy,pandas,scikit-learn
          # Mirrors upstream's own reduced arm64 suite (ops/pipeline/test-python-wheel.sh
          # --suite cpu-arm64); test_model_compatibility.py is dropped since it downloads
          # a model archive from xgboost's own S3 bucket.
          CIBW_TEST_COMMAND: >-
            pytest -v -s -rxXs --durations=0
            {project}/tests/python/test_basic.py
            {project}/tests/python/test_basic_models.py

      - name: Check the wheel carries libxgboost and a vendored libgomp
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("xgboost/lib/libxgboost.so", "libgomp"):
              if not any(want in n for n in names):
                  raise SystemExit(f"error: {want} missing from {sys.argv[1]}")
          print("\n".join(n for n in names if ".so" in n))
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xgboost-cpu-${{ env.XGBOOST_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    name: Collect GPL sources (gcc) for xgboost-cpu ${{ inputs.version || 'v3.4.1' }}
    runs-on: ubuntu-24.04-riscv
    steps:
      # auditwheel vendors the image's libgomp.so.1 into the wheel.
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: xgboost-cpu-${{ env.XGBOOST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish xgboost-cpu ${{ inputs.version || 'v3.4.1' }}
    needs: [setup, build_wheels, gpl_sources]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: xgboost-cpu-${{ inputs.version || 'v3.4.1' }}-*-manylinux_riscv64
      gpl-sources-artifact: xgboost-cpu-${{ inputs.version || 'v3.4.1' }}-gpl-sources
      gpl-sources-description: gcc
