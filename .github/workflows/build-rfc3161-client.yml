---
# This workflow is based on the `linux` job of
# https://github.com/trailofbits/rfc3161-client/blob/v1.0.8/.github/workflows/CI.yml
name: Build rfc3161-client wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'rfc3161-client version to build (git tag without the leading v, e.g. 1.0.8)'
        required: true
        default: '1.0.8'
  pull_request:
    paths:
      - '.github/workflows/build-rfc3161-client.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.0.8 there.
  RFC3161_CLIENT_VERSION: ${{ inputs.version || '1.0.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build rfc3161-client ${{ inputs.version || '1.0.8' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3 is built with the `abi3-py39` feature ([tool.maturin] features
          # in pyproject.toml), so one abi3 wheel serves every GIL-ful
          # interpreter; pyo3 disables abi3 under Py_GIL_DISABLED, giving the
          # free-threaded build its own wheel.
          - tag: cp39-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout rfc3161-client v${{ env.RFC3161_CLIENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: trailofbits/rfc3161-client
          ref: v${{ env.RFC3161_CLIENT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # rfc3161-client ships no [tool.cibuildwheel]; install the Rust
          # toolchain its maturin backend needs, plus full perl - the openssl
          # crate's `vendored` feature builds OpenSSL from source and the
          # image ships only perl-interpreter, whose Configure dies on a
          # missing FindBin (gotcha 46).
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install perl &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest pretend
          CIBW_TEST_COMMAND: >-
            python -c "import rfc3161_client._rust as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest {project}/test -q

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              # cp314t has no stable ABI, so pyo3 names the extension per-interpreter
              # (_rust.cpython-314t-...) instead of the abi3 tag the other wheels get.
              assert any(n.startswith("rfc3161_client/_rust") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rfc3161-client-${{ env.RFC3161_CLIENT_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rfc3161-client ${{ inputs.version || '1.0.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: rfc3161-client-${{ inputs.version || '1.0.8' }}-*-manylinux_riscv64
