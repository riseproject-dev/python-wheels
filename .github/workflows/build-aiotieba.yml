---
# This workflow is based on the `build_wheels` job of
# https://github.com/lumina37/aiotieba/blob/v4.8.1/.github/workflows/Publish.yml
name: Build aiotieba wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aiotieba.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aiotieba.yml'
      - 'docs/packages/aiotieba.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aiotieba.yml'
      - 'docs/packages/aiotieba.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aiotieba
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aiotieba ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      AIOTIEBA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout aiotieba v${{ env.AIOTIEBA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lumina37/aiotieba
          ref: v${{ env.AIOTIEBA_VERSION }}
          persist-credentials: false

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      # The extension compiles vendored mbedtls/base32/crc32 (Apache-2.0), xxHash (BSD-2-Clause) and rapidjson (MIT) sources whose notices upstream's wheel omits.
      - name: Stage vendored licences
        run: |
          curl -fsSL --retry 5 https://www.apache.org/licenses/LICENSE-2.0.txt -o LICENSE.apache-2.0
          curl -fsSL --retry 5 https://raw.githubusercontent.com/Cyan4973/xxHash/v0.8.3/LICENSE -o LICENSE.xxhash
          curl -fsSL --retry 5 https://raw.githubusercontent.com/Tencent/rapidjson/v1.1.0/license.txt -o LICENSE.rapidjson

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          config-file: cibuildwheel.toml
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # aiotieba's own cibuildwheel.toml has no before-all Rust install (gotcha 10), and the
          # test venv's cryptography install can resolve to a version/interpreter combo this
          # registry has no riscv64 wheel for, falling back to a source build via maturin. That
          # build then fails on its own: maturin's target-triple auto-detection computes
          # "riscv64-unknown-linux-gnu" (missing the "gc" suffix) from the SOABI, which rustup
          # does not recognize, so maturin's on-demand rustup auto-install also fails. Installing
          # rustup ourselves up front sidesteps that broken auto-detection entirely, since rustup's
          # own default install correctly targets the host's real riscv64gc-unknown-linux-gnu.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # The test venv needs riscv64 wheels only PyPI has (aiohttp>=3.13.1 for cp314, lxml for cp313/cp314); uv's default
          # first-index strategy stops at pypi.riseproject.dev, which only has aiohttp<=3.12.14 and lxml 5.3.0 cp39-cp312.
          # CIBW_ENVIRONMENT applies to both build and test, so the cargo PATH entry covers the
          # cryptography source-build fallback in the test step too.
          CIBW_ENVIRONMENT: >-
            UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            UV_INDEX_STRATEGY=unsafe-best-match
            PATH="$PATH:$HOME/.cargo/bin"

      # auditwheel repair adds a bare `.dist-info/licenses/` directory entry; the trailing `.` skips it.
      - name: Check wheel licences
        run: |
          unzip -Z1 wheelhouse/*.whl | grep '\.dist-info/licenses/.' | sed 's#.*/##' | sort | tee licences.txt
          printf '%s\n' LICENSE LICENSE.apache-2.0 LICENSE.rapidjson LICENSE.xxhash | diff - licences.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: aiotieba-${{ env.AIOTIEBA_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish aiotieba ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aiotieba-${{ matrix.version }}-*-manylinux_riscv64
