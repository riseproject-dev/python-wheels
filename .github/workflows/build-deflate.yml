---
# This workflow is based on: https://github.com/dcwatson/deflate/blob/main/.github/workflows/build.yml
name: Build deflate wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/deflate.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-deflate.yml'
      - 'docs/packages/deflate.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-deflate.yml'
      - 'docs/packages/deflate.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: deflate
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build deflate ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: deflate
      version: ${{ matrix.version }}
      # libdeflate is vendored as a git submodule and compiled in statically.
      repository: dcwatson/deflate
      ref: 009771737430efe37be54a25fc9b22bebbcba247
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      # Upstream cuts releases without git tags past 0.7.0, so pin the release
      # commit: this is "Appease ruff, allow/default to compresslevel=-1", whose
      # tree is byte-identical to the 0.9.0 PyPI sdist. Update it alongside
      # the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Override upstream's build-frontend = "build[uv]": cibuildwheel's
      # audit step runs on the host runner and requires a host `uv` binary
      # when the frontend is build[uv], which the self-hosted riscv64
      # runner doesn't have (gotcha 13).
      cibw-build-frontend: build
      timeout-minutes: 60

  publish:
    name: Publish deflate ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: deflate-${{ matrix.version }}-*riscv64
