---
# This workflow is based on: https://github.com/ppwwyyxx/cocoapi/blob/ac87f5077ad6b8864c2dc5e93d14cae62d1db05a/.github/workflows/build.yml
name: Build pycocotools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycocotools.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycocotools.yml'
      - 'docs/packages/pycocotools.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycocotools.yml'
      - 'docs/packages/pycocotools.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags, so pin the release commit: this is
  # "bump version" (setup.py version='2.0.11'), whose tree is byte-identical to
  # the 2.0.11 PyPI sdist. Update it alongside PYCOCOTOOLS_VERSION.
  PYCOCOTOOLS_REF: ac87f5077ad6b8864c2dc5e93d14cae62d1db05a
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycocotools
      version: ${{ inputs.version }}

  # One cp312-abi3 wheel: setup.py enables the limited API from cp312 up, so
  # cibuildwheel builds it once and reuses+tests it on cp313/cp314.
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pycocotools ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycocotools"
      version: "${{ matrix.version }}"
      repository: "ppwwyyxx/cocoapi"
      ref: "ac87f5077ad6b8864c2dc5e93d14cae62d1db05a"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        cp license.txt PythonAPI/LICENSE
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "./PythonAPI"
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # numpy is both a build and a runtime requirement, and only our
      # registry has it for riscv64.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: "python {project}/tests/test_cases.py"

  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pycocotools ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycocotools"
      version: "${{ matrix.version }}"
      repository: "ppwwyyxx/cocoapi"
      ref: "ac87f5077ad6b8864c2dc5e93d14cae62d1db05a"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        cp license.txt PythonAPI/LICENSE
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "./PythonAPI"
      cibw-build: "cp314t-manylinux_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: "python {project}/tests/test_cases.py"

  verify_wheels:
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        wheel: [abi3, freethreaded]
    env:
      PYCOCOTOOLS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pycocotools-${{ env.PYCOCOTOOLS_VERSION }}-${{ matrix.wheel == 'abi3' && 'cp312-abi3' || 'cp314t' }}-manylinux_riscv64
          path: wheelhouse

      - name: Check ABI3 wheel contents
        if: matrix.wheel == 'abi3'
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n == "pycocotools/_mask.abi3.so" for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - name: Check free-threaded wheel contents
        if: matrix.wheel == 'freethreaded'
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pycocotools/_mask.cpython-314t-") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish pycocotools ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycocotools-${{ matrix.version }}-*-manylinux_riscv64
