---
# This workflow is based on the `linux`/`linux-arm` jobs of
# https://github.com/j178/prek/blob/v0.5.2/.github/workflows/build-release-binaries.yml
name: Build prek wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/prek.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-prek.yml'
      - 'docs/packages/prek.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-prek.yml'
      - 'docs/packages/prek.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: prek
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    # self-update matches the feature set upstream's own published PyPI
    # wheels are built with (build-release-binaries.yml's linux/linux-arm jobs).
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: prek
      version: ${{ matrix.version }}
      repository: j178/prek
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 360
      maturin-args: --release --locked --features self-update
      maturin-version: v1.14.1

  test_wheel:
    name: Test prek ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      PREK_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout prek v${{ env.PREK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: j178/prek
          ref: v${{ env.PREK_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prek-${{ env.PREK_VERSION }}-${{ matrix.platform }}_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . prek

      # No pytest suite ships for the wheel; crates/prek's tests are Rust
      # integration tests run by upstream's own cargo nextest. `--version`
      # mirrors upstream's own dev-binary smoke check; `prek run --all-files`
      # against the builtin-hooks sample config mirrors what the published
      # `prek-action` runs, with no network fetch of a hooks repo needed.
      - name: Test wheel
        run: |
          set -euo pipefail
          prek --version
          python -m prek --version

          work=$(mktemp -d)
          cd "$work"
          git init -q
          git config user.email test@example.com
          git config user.name test
          prek sample-config -f --format toml
          git add -A
          git commit -q -m init
          printf 'trailing whitespace   \nno newline at end' > bad.txt
          git add -A

          # First run applies fixes and exits non-zero (pre-commit convention).
          prek run --all-files || true
          git diff --stat bad.txt
          # Second run is clean.
          prek run --all-files

  publish:
    name: Publish prek ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: prek-${{ matrix.version }}-manylinux_riscv64
