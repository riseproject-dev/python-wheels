---
# This workflow is based on: https://github.com/iver56/loudness/blob/0.2.0/.github/workflows/CI.yml
name: Build loudness wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/loudness.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-loudness.yml'
      - 'docs/packages/loudness.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-loudness.yml'
      - 'docs/packages/loudness.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: loudness
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build loudness ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: loudness
      version: ${{ matrix.version }}
      repository: iver56/loudness
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Ship the licences of the compiled-in gcem/thread-pool headers and the libebur128 code libloudness derives from.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy SKBUILD_WHEEL_LICENSE_FILES=\"LICENSE;vendor/gcem/LICENSE;vendor/gcem/NOTICE.txt;vendor/thread-pool/LICENSE.txt;doc/license/libebur128.txt\""
      cibw-test-requires: numpy pytest soundfile
      cibw-test-command: pytest {project}/tests
      timeout-minutes: 60

  publish:
    name: Publish loudness ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: loudness-${{ matrix.version }}-*-manylinux_riscv64
