---
# This workflow is based on: https://git.ligo.org/computing/software/igwn-segments/-/blob/v2.1.1/.gitlab/ci/wheels.yml
name: Build igwn-segments wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/igwn-segments.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-segments.yml'
      - 'docs/packages/igwn-segments.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-igwn-segments.yml'
      - 'docs/packages/igwn-segments.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: igwn-segments
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build igwn-segments ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The reusable workflow downloads and extracts the self-contained PyPI sdist.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: igwn-segments
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-requires: pytest
      cibw-test-sources: test
      cibw-test-command: pytest test

  publish:
    name: Publish igwn-segments ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: igwn-segments-${{ matrix.version }}-*riscv64
