---
# This workflow is based on: https://github.com/messense/murmurhash2-py/blob/v0.2.10/.github/workflows/CI.yml
name: Build murmurhash2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'murmurhash2 version to build (git tag without the leading v, e.g. 0.2.10)'
        required: true
        default: '0.2.10'
  pull_request:
    paths:
      - '.github/workflows/build-murmurhash2.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.2.10' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.2.10 there.
  MURMURHASH2_VERSION: ${{ inputs.version || '0.2.10' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build murmurhash2 ${{ inputs.version || '0.2.10' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py36 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter in our matrix; upstream ships
          # no free-threaded (cp314t) wheel at all -- pyo3 0.15.x predates
          # PEP 703 entirely -- so there is no second job here.
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    steps:
      - name: Checkout murmurhash2-py v${{ env.MURMURHASH2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: messense/murmurhash2-py
          ref: v${{ env.MURMURHASH2_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # murmurhash2-py ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # murmurhash2/__init__.py is maturin's own pyi-stub shim
          # ('from .murmurhash2 import *', matching the official PyPI wheel), and
          # that star-import rebinds the package's own `murmurhash2` attribute to
          # the compiled murmurhash2() function, shadowing the submodule -- so the
          # compiled-extension proof has to go through sys.modules instead.
          CIBW_TEST_COMMAND: >-
            python -c "import murmurhash2, sys; assert sys.modules['murmurhash2.murmurhash2'].__file__.endswith('.so'), sys.modules['murmurhash2.murmurhash2'].__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: murmurhash2-${{ env.MURMURHASH2_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish murmurhash2 ${{ inputs.version || '0.2.10' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: murmurhash2-${{ inputs.version || '0.2.10' }}-*-manylinux_riscv64
