---
# This workflow is based on: https://github.com/messense/murmurhash2-py/blob/v0.2.10/.github/workflows/CI.yml
name: Build murmurhash2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/murmurhash2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-murmurhash2.yml'
      - 'docs/packages/murmurhash2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-murmurhash2.yml'
      - 'docs/packages/murmurhash2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: murmurhash2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build murmurhash2 ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py36 feature is on unconditionally (Cargo.toml), so one
          # abi3 wheel serves every interpreter in our matrix; upstream ships
          # no free-threaded (cp314t) wheel at all -- pyo3 0.15.x predates
          # PEP 703 entirely -- so there is no second job here.
          - tag: cp312-abi3
            # Built on cp312 -- the oldest interpreter in our matrix -- and
            # re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "murmurhash2"
      version: "${{ matrix.version }}"
      repository: "messense/murmurhash2-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # murmurhash2-py ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # murmurhash2/__init__.py is maturin's own pyi-stub shim
      # ('from .murmurhash2 import *', matching the official PyPI wheel), and
      # that star-import rebinds the package's own `murmurhash2` attribute to
      # the compiled murmurhash2() function, shadowing the submodule -- so the
      # compiled-extension proof has to go through sys.modules instead.
      cibw-test-command: >
        python -c "import murmurhash2, sys; assert sys.modules['murmurhash2.murmurhash2'].__file__.endswith('.so'), sys.modules['murmurhash2.murmurhash2'].__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish murmurhash2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: murmurhash2-${{ matrix.version }}-*-manylinux_riscv64
