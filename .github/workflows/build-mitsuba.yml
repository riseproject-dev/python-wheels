---
# Based on the `build_wheels` job of
# https://github.com/mitsuba-renderer/mitsuba3/blob/v3.9.1/.github/workflows/wheels.yml
name: Build mitsuba wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mitsuba.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mitsuba.yml'
      - 'docs/packages/mitsuba.yaml'
      - 'patches/mitsuba/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mitsuba.yml'
      - 'docs/packages/mitsuba.yaml'
      - 'patches/mitsuba/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mitsuba
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mitsuba ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mitsuba"
      version: "${{ matrix.version }}"
      repository: "mitsuba-renderer/mitsuba3"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/mitsuba/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # nasm only feeds libjpeg-turbo's x86 SIMD, and is in Rocky 10's CRB.
      cibw-before-all: "yum install -y libatomic"
      # drjit's LLVM backend needs x86 FMA or NEON and shuts down on riscv64,
      # and there is no CUDA, so only the scalar variants can run; Embree is
      # x86/NEON-only; MI_NATIVE_FLAGS otherwise defaults to -march=haswell.
      # Scalar-only variants leave MI_ENABLE_JIT/AUTODIFF off, which drops drjit-core/-extra
      # from libmitsuba's --no-undefined link although integrator.cpp still calls into them.
      cibw-config-settings: "cmake.args=-DMI_DEFAULT_VARIANTS=scalar_rgb,scalar_spectral,scalar_spectral_polarized;-DMI_ENABLE_EMBREE=OFF;-DMI_NATIVE_FLAGS=;-DMI_ENABLE_JIT=ON;-DMI_ENABLE_AUTODIFF=ON"
      cibw-repair-wheel-command: "pip install 'wheel>=0.40'; new_whl_name=$(python -m wheel tags --platform-tag manylinux_2_39_riscv64 {wheel} | tail -1 | cat); cp $(dirname {wheel})/$new_whl_name {dest_dir}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MITSUBA_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mitsuba-${{ env.MITSUBA_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          variants = {n.split("/")[1].split(".")[0] for n in names
                      if n.startswith("mitsuba/") and n.count("/") == 1 and ".cpython-" in n}
          assert {"scalar_rgb", "scalar_spectral", "scalar_spectral_polarized"} <= variants, variants
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {
              "LICENSE",
              "ext/fastfloat/LICENSE-MIT",
              "ext/libjpeg-turbo/LICENSE.md",
              "ext/libjpeg-turbo/README.ijg",
              "ext/libpng/LICENSE",
              "ext/nanobind/LICENSE",
              "ext/nanobind/ext/robin_map/LICENSE",
              "ext/openexr/LICENSE.md",
              "ext/pugixml/LICENSE.md",
              "ext/rgb2spec/LICENSE",
              "ext/struct-jit/LICENSE",
          }, licences
          EOF

  publish:
    name: Publish mitsuba ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mitsuba-${{ matrix.version }}-*-manylinux_riscv64
