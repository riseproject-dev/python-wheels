---
# pybammsolvers-v0.9.0+ is cut from pybamm-team/PyBaMM's packages/pybammsolvers/
# subtree (the standalone pybamm-team/pybammsolvers repo is archived at v0.8.2), so
# this builds from that monorepo at the matching pybammsolvers-v<ver> tag, mirroring
# the Linux leg of its own reusable .github/workflows/_build_solver_wheels.yml
# (build_manylinux_wheels job). SUNDIALS and SuiteSparse's KLU/AMD/COLAMD/BTF are
# built from their pinned git submodules by install_KLU_Sundials.py, same as every
# platform upstream ships.
name: Build pybammsolvers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybammsolvers.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybammsolvers.yml'
      - 'docs/packages/pybammsolvers.yaml'
      - 'patches/pybammsolvers/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybammsolvers.yml'
      - 'docs/packages/pybammsolvers.yaml'
      - 'patches/pybammsolvers/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybammsolvers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pybammsolvers ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter, not abi3: idaklu links the version-specific ABI. cp314t is
        # dropped, matching upstream's own CIBW_SKIP (its pinned casadi has no cp314t wheel).
        python: ["cp312", "cp313", "cp314"]

    env:
      PYBAMMSOLVERS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pybamm-team/PyBaMM pybammsolvers-v${{ env.PYBAMMSOLVERS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pybamm-team/PyBaMM
          ref: pybammsolvers-v${{ env.PYBAMMSOLVERS_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # Only some versions need patching, so a missing directory is not an error.
      - name: Patch pybammsolvers source
        run: |
          patches="$PWD/python-wheels/patches/pybammsolvers/$PYBAMMSOLVERS_VERSION"
          if [ -d "$patches" ]; then
            git apply "$patches"/*.patch
          fi

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: packages/pybammsolvers
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # before-all runs from the checkout root, not package-dir, hence the cd;
          # openblas-devel/lapack-devel satisfy SUNDIALS' ENABLE_LAPACK=ON.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y --setopt=install_weak_deps=False openblas-devel lapack-devel &&
            cd packages/pybammsolvers &&
            python install_KLU_Sundials.py
          # casadi==3.8.1 (a build-time and runtime dependency) and numpy have no riscv64
          # wheel on public PyPI; reaches both phases (gotcha 12).
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # libcasadi ships in the casadi wheel (RPATH $ORIGIN/../casadi); its soname stayed at 3.7 in 3.8.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --exclude libcasadi.so.3.7 -w {dest_dir} {wheel}
          CIBW_TEST_EXTRAS: dev
          CIBW_TEST_COMMAND: |
            set -e -x
            python -m pytest {project}/tests

      - name: Check the wheel ships the idaklu extension and all licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pybammsolvers/idaklu.") and n.endswith(".so") for n in names), whl
              licences = {n.split(".dist-info/licenses/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n}
              assert licences == {"LICENSE", "sundials/LICENSE", "SuiteSparse/LICENSE.txt"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pybammsolvers-${{ env.PYBAMMSOLVERS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pybammsolvers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pybammsolvers-${{ matrix.version }}-*-manylinux_riscv64
