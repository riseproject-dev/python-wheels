---
# pybammsolvers-v0.9.0+ is cut from pybamm-team/PyBaMM's packages/pybammsolvers/
# subtree (the standalone pybamm-team/pybammsolvers repo is archived at v0.8.2), so
# this builds from that monorepo at the matching pybammsolvers-v<ver> tag, mirroring
# the Linux leg of its own reusable .github/workflows/_build_solver_wheels.yml
# (build_manylinux_wheels job). SUNDIALS and SuiteSparse's KLU/AMD/COLAMD/BTF are
# built from their pinned git submodules by install_KLU_Sundials.py, same as every
# platform upstream ships.
name: Build pybammsolvers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybammsolvers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybammsolvers.yml'
      - 'docs/packages/pybammsolvers.yaml'
      - 'patches/pybammsolvers/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybammsolvers.yml'
      - 'docs/packages/pybammsolvers.yaml'
      - 'patches/pybammsolvers/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybammsolvers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pybammsolvers ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pybammsolvers"
      version: "${{ matrix.version }}"
      repository: "pybamm-team/PyBaMM"
      ref: "pybammsolvers-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        export PYBAMMSOLVERS_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/pybammsolvers/$PYBAMMSOLVERS_VERSION"
        if [ -d "$patches" ]; then
          git apply "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "packages/pybammsolvers"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # before-all runs from the checkout root, not package-dir, hence the cd;
      # openblas-devel/lapack-devel satisfy SUNDIALS' ENABLE_LAPACK=ON.
      cibw-before-all-linux: "dnf install -y --setopt=install_weak_deps=False openblas-devel lapack-devel && cd packages/pybammsolvers && python install_KLU_Sundials.py"
      # casadi==3.8.1 (a build-time and runtime dependency) and numpy have no riscv64
      # wheel on public PyPI; reaches both phases (gotcha 12).
      # libcasadi ships in the casadi wheel (RPATH $ORIGIN/../casadi); its soname stayed at 3.7 in 3.8.
      cibw-repair-wheel-command-linux: "auditwheel repair --exclude libcasadi.so.3.7 -w {dest_dir} {wheel}"
      cibw-test-extras: "dev"
      # {project} is the cibuildwheel invocation cwd (this job's checkout root,
      # the whole PyBaMM monorepo) - {package} is package-dir. Upstream's own
      # CIBW_TEST_COMMAND uses {project}/tests, but that only works there because
      # its job sets working-directory: packages/pybammsolvers, making {project}
      # and {package} the same directory. Here they differ, so {project}/tests
      # resolves to a tests/ that doesn't exist at the monorepo root.
      cibw-test-command: |-
        set -e -x
        python -m pytest {package}/tests
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYBAMMSOLVERS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pybammsolvers-${{ env.PYBAMMSOLVERS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the idaklu extension and all licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pybammsolvers/idaklu.") and n.endswith(".so") for n in names), whl
              licences = {n.split(".dist-info/licenses/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "sundials/LICENSE", "SuiteSparse/LICENSE.txt"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pybammsolvers ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pybammsolvers-${{ matrix.version }}-*-manylinux_riscv64
