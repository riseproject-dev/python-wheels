---
# Based on: https://github.com/Luthaf/vesin/blob/v0.6.1/.github/workflows/build-wheels.yml (build-wheels)
name: Build vesin wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vesin.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vesin.yml'
      - 'docs/packages/vesin.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vesin.yml'
      - 'docs/packages/vesin.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  GPULITE_COMMIT: 6c221167aeca7e113ea6f27e9a2e12391bdb189a  # mts-v1.3.0, pinned in lib/CMakeLists.txt

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vesin
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build vesin ${{ matrix.version }} py3-none-manylinux_riscv64
    # setup.py's `universal_wheel` forces py3-none, so one build serves every
    # interpreter. The wheel statically links gpulite (fetched by CMake); neither
    # licence reaches python/vesin's pyproject.toml glob root, so upstream ships none.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "vesin"
      version: "${{ matrix.version }}"
      repository: "Luthaf/vesin"
      ref: "v${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 45
      pre-build: |-
        cp LICENSE python/vesin/LICENSE
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/metatensor/gpu-lite/6c221167aeca7e113ea6f27e9a2e12391bdb189a/LICENSE" -o python/vesin/LICENSE.gpulite
      cibw-package-dir: "python/vesin"
      cibw-build: "cp312-manylinux_riscv64"
      cibw-build-frontend: "build"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=cmake,numpy,scipy,matplotlib
      # ase (a test-only dep) pulls in numpy/scipy/matplotlib; without pinning
      # them to our registry's riscv64 wheels too, pip can resolve a newer
      # PyPI-only release of one and fall back to a from-source build (gotcha 291).
      cibw-test-requires: "pytest pytest-timeout ase"
      # {project} is the checkout root, not package-dir, since python/vesin's CMakeLists.txt
      # needs the sibling top-level vesin/ (C++ library) directory.
      # test_fork_during_calculations deterministically times out (>10s, pytest-timeout)
      # forking while a background thread holds the native threadpool's locks -- 2/2 on
      # this runner (run 34600349160, incl. a rerun); upstream's own x86_64/arm64/Windows
      # CI never exercises riscv64. -k, not --deselect (gotcha 14): nodeids are
      # rootdir-relative, {project} here is absolute.
      cibw-test-command: >
        python -c "import importlib.metadata as md;
        assert {p.name for p in md.files('vesin') if 'licenses' in str(p)} == {'LICENSE', 'LICENSE.gpulite'}" &&
        pytest {project}/python/vesin/tests -k "not test_fork_during_calculations"

  publish:
    name: Publish vesin ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: vesin-${{ matrix.version }}-*-manylinux_riscv64
