---
# This workflow is based on: https://github.com/fhs/pyhdf/blob/v0.11.7/.github/workflows/package_and_publish.yml
name: Build pyhdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyhdf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyhdf.yml'
      - 'docs/packages/pyhdf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyhdf.yml'
      - 'docs/packages/pyhdf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's own Linux job installs HDF4 from EPEL (yum install hdf
  # hdf-devel), which has no riscv64 builds; built from source here instead,
  # the same way upstream's own macOS job already does.
  HDF4_REF: hdf4.3.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyhdf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyhdf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyhdf"
      version: "${{ matrix.version }}"
      repository: "fhs/pyhdf"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 600
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: |-
        set -ex
        dnf -y install zlib-devel libjpeg-turbo-devel
        git clone --depth 1 --branch "$HDF4_REF" https://github.com/HDFGroup/hdf4.git /tmp/hdf4
        mkdir /tmp/hdf4-build
        cd /tmp/hdf4-build
        /tmp/hdf4/configure --enable-hdf4-xdr --enable-shared --disable-static --disable-fortran --disable-netcdf --enable-production --with-zlib --prefix=/usr/local
        make -j "$(nproc)"
        make install
        ldconfig
        cp /tmp/hdf4/COPYING "{project}/LICENSE.hdf4"
      cibw-environment-linux: "INCLUDE_DIRS=/usr/local/include LIBRARY_DIRS=/usr/local/lib HDF4_REF=hdf4.3.0 SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYHDF=${{ matrix.version }} PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest --pyargs pyhdf.test_SD -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYHDF_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyhdf-${{ env.PYHDF_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and the HDF4 licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(
              n.startswith("pyhdf/_hdfext") and n.endswith(".so") for n in names
          ), names
          licences = {
              n.rsplit("/", 1)[1]
              for n in names
              if ".dist-info/licenses/" in n
          } - {""}
          assert "LICENSE.hdf4" in licences, licences
          EOF

  publish:
    name: Publish pyhdf ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyhdf-${{ matrix.version }}-*-manylinux_riscv64
