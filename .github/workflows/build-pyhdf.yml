---
# This workflow is based on: https://github.com/fhs/pyhdf/blob/v0.11.7/.github/workflows/package_and_publish.yml
name: Build pyhdf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyhdf.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyhdf.yml'
      - 'docs/packages/pyhdf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyhdf.yml'
      - 'docs/packages/pyhdf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's own Linux job installs HDF4 from EPEL (yum install hdf
  # hdf-devel), which has no riscv64 builds; built from source here instead,
  # the same way upstream's own macOS job already does.
  HDF4_REF: hdf4.3.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyhdf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyhdf ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYHDF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyhdf ${{ env.PYHDF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fhs/pyhdf
          ref: v${{ env.PYHDF_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            dnf -y install zlib-devel libjpeg-turbo-devel
            git clone --depth 1 --branch "$HDF4_REF" https://github.com/HDFGroup/hdf4.git /tmp/hdf4
            mkdir /tmp/hdf4-build
            cd /tmp/hdf4-build
            /tmp/hdf4/configure --enable-hdf4-xdr --enable-shared --disable-static --disable-fortran --disable-netcdf --enable-production --with-zlib --prefix=/usr/local
            make -j "$(nproc)"
            make install
            ldconfig
            cp /tmp/hdf4/COPYING "{project}/LICENSE.hdf4"
          CIBW_ENVIRONMENT: >-
            INCLUDE_DIRS=/usr/local/include
            LIBRARY_DIRS=/usr/local/lib
            HDF4_REF=${{ env.HDF4_REF }}
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYHDF=${{ env.PYHDF_VERSION }}
            PIP_ONLY_BINARY=numpy
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest --pyargs pyhdf.test_SD -v

      - name: Check the wheel ships the extension and the HDF4 licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(
              n.startswith("pyhdf/_hdfext") and n.endswith(".so") for n in names
          ), names
          licences = {
              n.rsplit("/", 1)[1]
              for n in names
              if ".dist-info/licenses/" in n
          } - {""}
          assert "LICENSE.hdf4" in licences, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyhdf-${{ env.PYHDF_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyhdf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyhdf-${{ matrix.version }}-*-manylinux_riscv64
