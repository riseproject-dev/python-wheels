---
# Based on the `build_wheels` job of
# https://github.com/python-zeroconf/python-zeroconf/blob/0.151.3/.github/workflows/ci.yml
name: Build zeroconf wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zeroconf.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zeroconf.yml'
      - 'docs/packages/zeroconf.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zeroconf.yml'
      - 'docs/packages/zeroconf.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zeroconf
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zeroconf ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: zeroconf
      version: ${{ matrix.version }}
      repository: python-zeroconf/python-zeroconf
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream passes REQUIRE_CYTHON as a plain job env var, which never
      # reaches the Linux build container; build_ext.py otherwise falls back
      # to a pure-Python wheel under a riscv64 tag.
      cibw-environment-linux: REQUIRE_CYTHON=1
      cibw-test-sources: tests
      cibw-test-requires: 'pytest>=9.1.1,<10 pytest-asyncio>=1.4.0,<1.5.0 pytest-codspeed>=5.0.3,<6.0.0'
      cibw-test-command: >-
        python -c "from zeroconf import _cache, _dns, _history, _record_update, _listener, _services, _updates;
        from zeroconf._protocol import incoming, outgoing;
        from zeroconf._handlers import answers, record_manager, multicast_outgoing_queue, query_handler;
        from zeroconf._services import browser, info, registry;
        from zeroconf._utils import ipaddress, time;
        m = [_cache, _dns, _history, _record_update, _listener, _services, _updates, incoming, outgoing,
        answers, record_manager, multicast_outgoing_queue, query_handler, browser, info, registry,
        ipaddress, time];
        bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
        assert not bad, bad" &&
        python -m pytest tests
        --deselect tests/services/test_types.py::test_integration_with_listener_ipv6
      timeout-minutes: 120

  publish:
    name: Publish zeroconf ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zeroconf-${{ matrix.version }}-*-manylinux_riscv64
