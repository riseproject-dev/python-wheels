---
# Based on upstream's wheel builder:
#   https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
name: Build tree-sitter-sql wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tree-sitter-sql.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-sql.yml'
      - 'docs/packages/tree-sitter-sql.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-sql.yml'
      - 'docs/packages/tree-sitter-sql.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tree-sitter-sql
      version: ${{ inputs.version }}

  generate_parser:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # derekstride/tree-sitter-sql does not commit the generated src/parser.c at its
    # release tags (only src/scanner.c). Upstream's own publish.yml regenerates it via
    # `tree-sitter generate` before building, so we do the same here, once on x86
    # (generation is architecture-independent and the CLI has no riscv64 build),
    # then hand the completed checkout to the riscv64 job as a tarball.
    name: Generate tree-sitter-sql ${{ matrix.version }} parser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TREE_SITTER_SQL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tree-sitter-sql v${{ env.TREE_SITTER_SQL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: derekstride/tree-sitter-sql
          ref: v${{ env.TREE_SITTER_SQL_VERSION }}
          persist-credentials: false

      - uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086  # v2

      - name: Regenerate parser
        run: tree-sitter generate
        env:
          TREE_SITTER_ABI_VERSION: 15

      - name: Archive checkout
        run: tar czf /tmp/tree-sitter-sql.tar.gz --exclude=.git .

      - name: Upload checkout artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-sql-${{ env.TREE_SITTER_SQL_VERSION }}-generated
          path: /tmp/tree-sitter-sql.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, generate_parser]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tree-sitter-sql ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      TREE_SITTER_SQL_VERSION: ${{ matrix.version }}

    steps:
      - name: Download checkout artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tree-sitter-sql-${{ env.TREE_SITTER_SQL_VERSION }}-generated

      - name: Extract checkout
        run: tar xzf tree-sitter-sql.tar.gz

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: core
          CIBW_TEST_SOURCES: bindings/python/tests
          CIBW_TEST_COMMAND: python -m unittest discover -v -s bindings/python/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-sql-${{ env.TREE_SITTER_SQL_VERSION }}-cp310-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tree-sitter-sql ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tree-sitter-sql-${{ matrix.version }}-*-manylinux_riscv64
