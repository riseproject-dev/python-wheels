---
# This workflow is based on: https://github.com/zopefoundation/zope.interface/blob/8.6/.github/workflows/tests.yml
name: Build zope-interface wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'zope.interface version to build (git tag, e.g. 8.6)'
        required: true
        default: '8.6'
  pull_request:
    paths:
      - '.github/workflows/build-zope-interface.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '8.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  ZOPE_INTERFACE_VERSION: ${{ inputs.version || '8.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build zope-interface ${{ inputs.version || '8.6' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout zope.interface ${{ env.ZOPE_INTERFACE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zopefoundation/zope.interface
          ref: ${{ env.ZOPE_INTERFACE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: zope.event zope.testing
          CIBW_TEST_ENVIRONMENT: ZOPE_INTERFACE_STRICT_IRO=1
          # Upstream's two test steps. setup.py swallows extension build failures
          # (optional_build_ext), so PURE_PYTHON=0 — which makes the C import
          # mandatory at runtime — is what proves the wheel is not pure Python.
          CIBW_TEST_COMMAND: >-
            PURE_PYTHON=0 python -m unittest discover -s {package}/src/zope &&
            PURE_PYTHON=1 python -m unittest discover -s {package}/src/zope

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zope-interface-${{ env.ZOPE_INTERFACE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zope-interface ${{ inputs.version || '8.6' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zope-interface-${{ inputs.version || '8.6' }}-*-manylinux_riscv64
