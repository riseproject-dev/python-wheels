---
# Based on the `build` job of
# https://github.com/klayout/klayout/blob/v0.30.12/.github/workflows/build.yml
name: Build klayout wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/klayout.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-klayout.yml'
      - 'docs/packages/klayout.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-klayout.yml'
      - 'docs/packages/klayout.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: klayout
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build klayout ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      # All 12 legs compiling at once on the riscv64 fleet's shared/limited
      # memory (gotcha 228) loses a runner mid-build or kills one before it
      # starts; a few at a time (build-dcc-mcp-server.yml) stays well inside it.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "klayout"
      version: "${{ matrix.version }}"
      repository: "klayout/klayout"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-before-all-linux: |-
        if command -v dnf >/dev/null 2>&1; then
        dnf install -y zlib-devel libcurl-devel expat-devel libpng-devel;
        elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl-dev expat-dev zlib-dev libpng-dev;
        fi
      cibw-before-build-linux: "true"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # All 12 legs compiling at once on the riscv64 fleet's shared/limited
      # memory (gotcha 228) loses a runner mid-build or kills one before it
      # starts; a few at a time (build-dcc-mcp-server.yml) stays well inside it.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      KLAYOUT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: klayout-${{ env.KLAYOUT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert exts and all(n.startswith("klayout/") for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish klayout ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: klayout-${{ matrix.version }}-*riscv64
