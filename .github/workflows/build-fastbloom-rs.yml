---
# This workflow is based on the `linux-cross` job of
# https://github.com/yankun1992/fastbloom/blob/py-v0.5.10/.github/workflows/create-py-release-manylinux.yaml
name: Build fastbloom-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastbloom-rs.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastbloom-rs.yml'
      - 'docs/packages/fastbloom-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastbloom-rs.yml'
      - 'docs/packages/fastbloom-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastbloom-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastbloom-rs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature is on unconditionally (root Cargo.toml),
          # so one abi3 wheel serves every GIL-ful interpreter; pyo3 disables
          # abi3 under Py_GIL_DISABLED, giving the free-threaded build its own
          # wheel (same shape as build-rbloom.yml).
          - tag: cp37-abi3
            # cp37/cp38 aren't in manylinux_2_39_riscv64 (cp39-cp315 only), and
            # our registry floor is cp312 anyway (build-rbloom.yml precedent),
            # so build there instead of at the claimed floor.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      FASTBLOOM_RS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fastbloom py-v${{ env.FASTBLOOM_RS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: yankun1992/fastbloom
          ref: py-v${{ env.FASTBLOOM_RS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # fastbloom-rs ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: py_tests
          # test_bench.py is excluded: it imports the optional pybloom_live
          # comparison dependency (pyproject.toml's `test` extra), not
          # installed here. The other three files cover the real API.
          CIBW_TEST_COMMAND: >-
            python -c "import fastbloom_rs.fastbloom_rs as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest {project}/py_tests/test_bloom.py {project}/py_tests/test_counting_bloom_filter.py {project}/py_tests/test_save_file.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastbloom-rs-${{ env.FASTBLOOM_RS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastbloom-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: fastbloom-rs-${{ matrix.version }}-*-manylinux_riscv64
