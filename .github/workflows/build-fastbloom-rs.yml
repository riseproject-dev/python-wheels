---
# This workflow is based on the `linux-cross` job of
# https://github.com/yankun1992/fastbloom/blob/py-v0.5.10/.github/workflows/create-py-release-manylinux.yaml
name: Build fastbloom-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastbloom-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastbloom-rs.yml'
      - 'docs/packages/fastbloom-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastbloom-rs.yml'
      - 'docs/packages/fastbloom-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastbloom-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastbloom-rs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # `tag` must be a real matrix axis (gotcha 402): two include-only
        # entries introducing the same new keys collapse into one job, and
        # the abi3 leg silently never runs.
        tag: [cp37-abi3, cp314t]
        include:
          # pyo3's abi3-py37 feature is on unconditionally (root Cargo.toml),
          # so one abi3 wheel serves every GIL-ful interpreter; pyo3 disables
          # abi3 under Py_GIL_DISABLED, giving the free-threaded build its own
          # wheel.
          - tag: cp37-abi3
            # cp37/cp38 aren't in manylinux_2_39_riscv64 (cp39-cp315 only), and
            # our registry floor is cp312 anyway (build-rbloom.yml precedent),
            # so build there instead of at the claimed floor.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastbloom-rs"
      version: "${{ matrix.version }}"
      repository: "yankun1992/fastbloom"
      ref: "py-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # fastbloom-rs ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # The repo root holds a conda-based dev helper named build.py, which
      # shadows the `build` module under cibuildwheel's default
      # `python -m build` frontend (cwd=/project; gotcha 102): it runs
      # `conda activate ...` via os.system, exits 0, and no wheel is
      # produced. pip is unaffected. pyproject.toml also pins
      # maturin==1.8.7, which has no riscv64 wheel on PyPI or our index,
      # so install a current maturin (riscv64 wheel available) and skip
      # build isolation to bypass the pin (build-base2048.yml precedent).
      cibw-before-build: "pip install maturin"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest"
      cibw-test-sources: "py_tests"
      # test_bench.py is excluded: it imports the optional pybloom_live
      # comparison dependency (pyproject.toml's `test` extra), not
      # installed here. The other three files cover the real API.
      cibw-test-command: >
        python -c "import fastbloom_rs.fastbloom_rs as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest {project}/py_tests/test_bloom.py {project}/py_tests/test_counting_bloom_filter.py {project}/py_tests/test_save_file.py

  publish:
    name: Publish fastbloom-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastbloom-rs-${{ matrix.version }}-*-manylinux_riscv64
