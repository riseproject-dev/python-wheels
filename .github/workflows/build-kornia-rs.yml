---
# This workflow is based on the `linux` job of
# https://github.com/kornia/kornia-rs/blob/v0.1.14/.github/workflows/python_release.yml
name: Build kornia-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kornia-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kornia-rs.yml'
      - 'docs/packages/kornia-rs.yaml'
      - 'patches/kornia-rs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kornia-rs.yml'
      - 'docs/packages/kornia-rs.yaml'
      - 'patches/kornia-rs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kornia-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build kornia-rs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "kornia-rs"
      version: "${{ matrix.version }}"
      # kornia-py is a member of the kornia-rs Cargo workspace and builds
      # against its sibling crates (kornia-image, kornia-io, ...), so the
      # checkout root has to be the workspace root, not kornia-py itself.
      repository: "kornia/kornia-rs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-package-dir: "kornia-py"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # kornia-py ships no [tool.cibuildwheel]; the Rust toolchain its
      # maturin backend needs is installed in-container here. cmake builds
      # the turbojpeg feature's vendored libjpeg-turbo (patched above to
      # drop its require-simd default, since libjpeg-turbo has no riscv64
      # SIMD kernels).
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && dnf install -y cmake"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # torch/pillow are import-or-skip'd by the tests that use them
      # (test_torch_zero_copy.py, test_io.py, test_against_pil_cv2.py);
      # both are on the registry for our whole matrix, unlike opencv-python
      # (cp37-abi3 only there, so left out - the cv2-guarded tests skip).
      cibw-test-requires: "pytest numpy torch pillow"
      # test_image_benchmarks.py self-skips its dev-hardware ms ceilings when
      # CI=true (its own doc: "shared GitHub Actions runners are too variable
      # to gate on absolute ms"), but cibuildwheel's Linux container doesn't
      # forward the runner's own CI=true, so it has to be passed through here.
      cibw-test-environment-linux: "PIP_ONLY_BINARY=numpy,torch,pillow CI=true"
      # test-sources resolves against the checkout root, not package-dir.
      # tests/data is the workspace-level fixture dir several tests read
      # via `Path(__file__).parents[2]`; benchmarks/ carries the `_bench`
      # helper module test_against_pil_cv2.py imports off pyproject.toml's
      # pythonpath.
      cibw-test-sources: "kornia-py/tests kornia-py/benchmarks kornia-py/pyproject.toml tests/data"
      # test_apriltag_decoder and (from 0.2.0) test_estimate_pose read
      # tag36_11_00005.png out of the tests/data/apriltag-imgs git
      # submodule (a 200+ MB clone of kornia/apriltag-imgs for one PNG),
      # which the checkout above doesn't fetch; every other apriltag test
      # runs off files already in tests/data. Deselecting a test a version
      # doesn't have is a no-op, so both apply to every version.
      cibw-test-command: "cd kornia-py && python -c \"import kornia_rs.kornia_rs as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v --deselect tests/test_apriltag.py::test_apriltag_decoder --deselect tests/test_apriltag.py::test_estimate_pose"

  publish:
    name: Publish kornia-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: kornia-rs-${{ matrix.version }}-*-manylinux_riscv64
