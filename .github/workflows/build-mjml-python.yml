---
# This workflow is based on the `linux` job of
# https://github.com/mgd020/mjml-python/blob/v1.4.1/.github/workflows/_build-wheels.yml
name: Build mjml-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mjml-python.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mjml-python.yml'
      - 'docs/packages/mjml-python.yaml'
      - 'patches/mjml-python/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mjml-python.yml'
      - 'docs/packages/mjml-python.yaml'
      - 'patches/mjml-python/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mjml-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mjml-python ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # Cargo.toml hardcodes pyo3's abi3-py38 feature unconditionally;
          # the riscv64 manylinux image's oldest interpreter is cp39 (no
          # cp38), so patches/ bumps it to abi3-py39 -- gotcha 96. Built on
          # cp39 and re-tested on the newer ones via find_compatible_wheel.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mjml-python"
      version: "${{ matrix.version }}"
      repository: "mgd020/mjml-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"

      patches: true

      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # mjml-python ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import mjml.mjml as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m unittest -v"

  publish:
    name: Publish mjml-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mjml-python-${{ matrix.version }}-*-manylinux_riscv64
