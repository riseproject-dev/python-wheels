---
# This workflow is based on the `linux` job of
# https://github.com/RustedBytes/rsloop/blob/v0.1.64/.github/workflows/wheels.yml
# and the `test-supported-pythons` job of
# https://github.com/RustedBytes/rsloop/blob/v0.1.64/.github/workflows/tests.yml
name: Build rsloop wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rsloop.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rsloop.yml'
      - 'docs/packages/rsloop.yaml'
      - 'patches/rsloop/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsloop.yml'
      - 'docs/packages/rsloop.yaml'
      - 'patches/rsloop/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rsloop
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rsloop ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rsloop"
      version: "${{ matrix.version }}"
      repository: "RustedBytes/rsloop"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240

      # The TLS reader reported its own close()'s socket shutdown as a missing
      # peer close_notify, failing test_tls.py at random on the slow runner.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream builds with the nightly its rust-toolchain.toml pins; the
      # openssl CLI generates the TLS fixtures tests/test_tls.py needs.
      cibw-before-all-linux: "dnf install -y openssl && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain \"$(sed -n 's/^channel = \"\\(.*\\)\"$/\\1/p' rust-toolchain.toml)\""
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest>=8.4 pytest-mock>=3.14 typing-extensions>=4.0 websockets>=13.0"
      cibw-test-sources: "tests scripts benches examples pyproject.toml"
      cibw-test-command: "python -c \"import rsloop._loop as m; assert m.__file__.endswith('.so'), m.__file__\" && python scripts/generate_test_tls_certs.py && python -u scripts/run_python_tests.py"

  publish:
    name: Publish rsloop ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rsloop-${{ matrix.version }}-*-manylinux_riscv64
