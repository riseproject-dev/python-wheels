---
# This workflow is based on the `linux` job of
# https://github.com/RustedBytes/rsloop/blob/v0.1.64/.github/workflows/wheels.yml
# and the `test-supported-pythons` job of
# https://github.com/RustedBytes/rsloop/blob/v0.1.64/.github/workflows/tests.yml
name: Build rsloop wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rsloop.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rsloop.yml'
      - 'docs/packages/rsloop.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rsloop.yml'
      - 'docs/packages/rsloop.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rsloop
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rsloop ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      RSLOOP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout rsloop v${{ env.RSLOOP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RustedBytes/rsloop
          ref: v${{ env.RSLOOP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream builds with the nightly its rust-toolchain.toml pins; the
          # openssl CLI generates the TLS fixtures tests/test_tls.py needs.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y openssl &&
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
            --default-toolchain "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: >-
            pytest>=8.4 pytest-mock>=3.14 typing-extensions>=4.0 websockets>=13.0
          CIBW_TEST_SOURCES: tests scripts benches examples pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "import rsloop._loop as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python scripts/generate_test_tls_certs.py &&
            python -u scripts/run_python_tests.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rsloop-${{ env.RSLOOP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rsloop ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: rsloop-${{ matrix.version }}-*-manylinux_riscv64
