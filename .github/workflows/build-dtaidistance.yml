---
# Based on the build_unix job of
# https://github.com/wannesm/dtaidistance/blob/v2.4.0/.github/workflows/deploy.yml
name: Build dtaidistance wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dtaidistance.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dtaidistance.yml'
      - 'docs/packages/dtaidistance.yaml'
      - 'patches/dtaidistance/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dtaidistance.yml'
      - 'docs/packages/dtaidistance.yaml'
      - 'patches/dtaidistance/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dtaidistance
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dtaidistance ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dtaidistance"
      version: "${{ matrix.version }}"
      repository: "wannesm/dtaidistance"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      # libgomp's guided schedule segfaults on the riscv64 runners
      # (riseproject-dev/python-wheels#617); schedule(static, 1) is unaffected.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Cython >=3.2.0's "already imported" fast path mistruncates the
      # resolved qualname for util_numpy_cc.pyx's bare `import dtw_cc`,
      # binding it to the top-level dtaidistance package (gotcha 175).
      cibw-before-all: "echo 'Cython<3.2.0' > /cython-constraint.txt"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,matplotlib PIP_CONSTRAINT=/cython-constraint.txt PIP_BUILD_CONSTRAINT=/cython-constraint.txt"
      cibw-test-extras: "dev"
      # test_lc_pat3 does Path(os.environ.get('TESTDIR', None)) unconditionally
      # (every sibling test defaults to Path(__file__).parent instead) and
      # crashes with TESTDIR unset, which upstream's own CI never sets either
      # (gotcha 14: -k over a path-based --deselect).
      cibw-test-command: "pytest --ignore=venv --benchmark-skip -k \"not test_lc_pat3\" {project}/tests"

  gpl_sources:
    name: Collect GPL sources for dtaidistance ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: dtaidistance
      version: ${{ matrix.version }}
      # dtw_cc_omp links -fopenmp, so auditwheel vendors the image's libgomp
      # into dtaidistance.libs/.
      packages: gcc

  publish:
    name: Publish dtaidistance ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dtaidistance-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: dtaidistance-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
