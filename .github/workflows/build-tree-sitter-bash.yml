---
# Based on upstream's wheel builder:
#   https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
name: Build tree-sitter-bash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tree-sitter-bash version to build (git tag without leading v, e.g. 0.25.1)'
        required: true
        default: '0.25.1'
  pull_request:
    paths:
      - '.github/workflows/build-tree-sitter-bash.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.25.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TREE_SITTER_BASH_VERSION: ${{ inputs.version || '0.25.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  # setup.py builds against the 3.10 limited API and tags the wheel cp310-abi3, so
  # one wheel covers every non-free-threaded CPython; cibuildwheel builds it on
  # cp312 and re-tests it on cp313/cp314 (find_compatible_wheel). Upstream builds
  # `cp310-*` only and publishes no free-threaded wheel, so there is no cp314t job.
  build_wheels:
    name: Build tree-sitter-bash ${{ inputs.version || '0.25.1' }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    steps:
      - name: Checkout tree-sitter-bash v${{ env.TREE_SITTER_BASH_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: tree-sitter/tree-sitter-bash
          ref: v${{ env.TREE_SITTER_BASH_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: core
          CIBW_TEST_SOURCES: bindings/python/tests
          CIBW_TEST_COMMAND: python -m unittest discover -v -s bindings/python/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-bash-${{ env.TREE_SITTER_BASH_VERSION }}-cp310-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tree-sitter-bash ${{ inputs.version || '0.25.1' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: tree-sitter-bash-${{ env.TREE_SITTER_BASH_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
