---
# This workflow is based on the `Package`/`PackageSmoke` jobs of
# https://github.com/NVIDIA/NeMo-Relay/blob/0.8.4/.github/workflows/ci_python.yml
name: Build nemo-relay wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nemo-relay.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nemo-relay.yml'
      - 'docs/packages/nemo-relay.yaml'
      - 'patches/nemo-relay/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nemo-relay.yml'
      - 'docs/packages/nemo-relay.yaml'
      - 'patches/nemo-relay/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nemo-relay
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build nemo-relay ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nemo-relay"
      version: "${{ matrix.version }}"
      repository: "NVIDIA/NeMo-Relay"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 360


      patches: true
      pre-build: |-
        export NEMO_RELAY_VERSION='${{ matrix.version }}'

        # The committed workspace version can trail the release tag (0.8.0 at
        # the 0.8.4 tag) -- nemo-relay's own package-python recipe does the
        # same substitution via set_cargo_workspace_version before invoking
        # maturin, which resolves pyproject.toml's dynamic = ["version"] from
        # this field.
        sed -i "s/^version = \".*\"/version = \"${NEMO_RELAY_VERSION}\"/" Cargo.toml

      # pyo3's abi3-py311 feature (crates/python/Cargo.toml) makes this one
      # wheel; it is built on cp311, the oldest interpreter its tag claims,
      # and re-tested on cp312/cp313/cp314 via find_compatible_wheel.
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # nemo-relay ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # crates/worker-proto generates code with prost/tonic; Rocky 10's CRB
      # repo (enabled in the image) carries protoc where protoc-bin-vendored
      # (patched to fall back here) does not ship a riscv64 binary.
      cibw-before-build: "yum install -y protobuf-compiler protobuf-devel"
      # PROTOC_INCLUDE is needed because CRB's protoc 3.19 resolves
      # google/protobuf/*.proto from disk rather than from the binary.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PROTOC_INCLUDE=/usr/include"
      # opentelemetry-proto (pure Python, pulls in protobuf) is imported at
      # module scope by python/tests/test_observability_plugin.py; without
      # it that file fails collection with ModuleNotFoundError: opentelemetry.
      cibw-test-requires: "pytest>=8 pytest-asyncio>=0.26 pydantic>=2 typing_extensions opentelemetry-proto"
      # Three tests added in 0.11.0 read repo files outside python/tests (a scope-stack
      # fixture, the diagnostics query contract and the diagnostics example); none of
      # them exists in the 0.9/0.10 tags, and cibuildwheel errors on a missing test
      # source, so they are only staged for later versions. The non-empty value sits
      # in the && branch because an empty string is falsy in `a && '' || b`.
      cibw-test-sources: "pyproject.toml python/tests ${{ !startsWith(matrix.version, '0.9.') && !startsWith(matrix.version, '0.10.') && 'crates/types/tests/fixtures/scope_stack_snapshot.json crates/core/tests/fixtures/diagnostics_query_contract.json examples/diagnostics/python.py' || '' }}"
      # python/tests/integrations needs optional framework extras nemo-relay
      # ships as PyPI extras (upstream's own test-python excludes this
      # directory too); python/tests/plugin and test_dynamic_plugin_host.py
      # exercise out-of-process gRPC worker plugins that spawn a
      # cargo-built fixture binary from the full source tree -- out of
      # scope for a wheel-level smoke of the compiled extension.
      cibw-test-command: "python -c \"import nemo_relay._native as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v python/tests --ignore python/tests/integrations --ignore python/tests/plugin --ignore python/tests/test_dynamic_plugin_host.py"

  publish:
    name: Publish nemo-relay ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nemo-relay-${{ matrix.version }}-*-manylinux_riscv64
