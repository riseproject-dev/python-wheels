---
# This workflow is based on the test-pypi/release-pypi jobs of
# https://github.com/BYVoid/OpenCC/blob/ver.1.4.2/.github/workflows/python.yml and
# https://github.com/BYVoid/OpenCC/blob/ver.1.4.2/release-pypi-linux.sh
name: Build opencc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/opencc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-opencc.yml'
      - 'docs/packages/opencc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opencc.yml'
      - 'docs/packages/opencc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: opencc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build opencc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: opencc
      version: ${{ matrix.version }}
      repository: BYVoid/OpenCC
      ref: ver.${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py falls back to `git describe` for the version when VERSION is
      # unset, which is unreliable in a shallow checkout; pin it explicitly
      # the same way upstream's own CI does (get_version_info() strips a
      # single leading "v").
      cibw-environment-linux: VERSION=v${{ matrix.version }}
      cibw-test-requires: pytest
      cibw-test-command: pytest {project}/python/tests
      timeout-minutes: 60

  publish:
    name: Publish opencc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: opencc-${{ matrix.version }}-*-manylinux_riscv64
