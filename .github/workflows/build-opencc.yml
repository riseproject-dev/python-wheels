---
# This workflow is based on the test-pypi/release-pypi jobs of
# https://github.com/BYVoid/OpenCC/blob/ver.1.4.2/.github/workflows/python.yml and
# https://github.com/BYVoid/OpenCC/blob/ver.1.4.2/release-pypi-linux.sh
name: Build opencc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'opencc version to build (git tag is ver.<version>, e.g. 1.4.2)'
        required: true
        default: '1.4.2'
  pull_request:
    paths:
      - '.github/workflows/build-opencc.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  OPENCC_VERSION: ${{ inputs.version || '1.4.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build opencc ${{ inputs.version || '1.4.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout opencc ver.${{ env.OPENCC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: BYVoid/OpenCC
          ref: ver.${{ env.OPENCC_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py falls back to `git describe` for the version when VERSION is
          # unset, which is unreliable in a shallow checkout; pin it explicitly
          # the same way upstream's own CI does (get_version_info() strips a
          # single leading "v").
          CIBW_ENVIRONMENT: VERSION=v${{ env.OPENCC_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/python/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: opencc-${{ env.OPENCC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish opencc ${{ inputs.version || '1.4.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: opencc-${{ inputs.version || '1.4.2' }}-*-manylinux_riscv64
