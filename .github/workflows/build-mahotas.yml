---
# Based on: https://github.com/luispedro/mahotas/blob/v1.4.19/.github/workflows/wheel.yml
name: Build mahotas wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mahotas.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mahotas.yml'
      - 'docs/packages/mahotas.yaml'
      - 'patches/mahotas/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mahotas.yml'
      - 'docs/packages/mahotas.yaml'
      - 'patches/mahotas/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mahotas
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mahotas ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mahotas"
      version: "${{ matrix.version }}"
      repository: "luispedro/mahotas"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/mahotas/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build-time requirement (headers, via pyproject.toml's
      # build-system.requires) and an implicit runtime one too (the
      # compiled extensions call numpy's C API at import time). Only our
      # registry has it for riscv64; only-binary keeps a newer PyPI
      # release from winning the resolution and compiling from sdist.
      # This variable replaces upstream's own [tool.cibuildwheel]
      # environment = {PIP_PREFER_BINARY = "1"}, so restate it: the
      # [tests] extras (scipy, matplotlib, pillow, kiwisolver) otherwise
      # resolve to PyPI releases newer than our riscv64 wheels and get
      # built from sdist (gotcha 354).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy PIP_PREFER_BINARY=1"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MAHOTAS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mahotas-${{ env.MAHOTAS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.rsplit("/", 1)[-1] for n in names if n.endswith(".so")}
          assert any(n.startswith("_convolve") for n in exts), exts
          assert len(exts) >= 10, exts
          # meson-python 0.17.1 (upstream pins <0.18) writes the legacy
          # license = {file = ...} file to dist-info/ directly, not to
          # dist-info/licenses/.
          assert any(n.endswith(".dist-info/COPYING") for n in names), names
          EOF

  publish:
    name: Publish mahotas ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mahotas-${{ matrix.version }}-*-manylinux_riscv64
