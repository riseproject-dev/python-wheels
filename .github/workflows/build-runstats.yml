---
# Based on the `builds` job of
# https://github.com/grantjenks/python-runstats/blob/v2.0.0/.github/workflows/release.yml
name: Build runstats wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/runstats.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-runstats.yml'
      - 'docs/packages/runstats.yaml'
      - 'patches/runstats/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-runstats.yml'
      - 'docs/packages/runstats.yaml'
      - 'patches/runstats/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: runstats
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build runstats ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "runstats"
      version: "${{ matrix.version }}"
      repository: "grantjenks/python-runstats"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py has no [build-system] table, so pypa/build's default isolated
      # venv never sees CIBW_BEFORE_BUILD's cython install and silently falls
      # back to a pure-Python wheel (CLAUDE.md gotcha 57).
      cibw-before-build: "pip install cython setuptools"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest"
      # test/__init__.py exists, so build-from-checkout's own runstats/ would
      # shadow the installed wheel under pytest's default import mode; stage
      # only tests/ into an empty cwd instead (gotcha 25). Also sidesteps
      # tox.ini's --cov-fail-under=100, which measures unrelated dev checks.
      cibw-test-sources: "tests"
      # setup.py falls back to a pure-Python wheel if cythonize/build_ext raises
      # (bare try/except around the Extension build) -- assert the compiled
      # extension actually loaded before trusting the test suite (gotcha 91).
      cibw-test-command: "python -c \"import runstats._core; assert runstats._core.__file__.endswith('.so'), runstats._core.__file__\" && python -m pytest tests && python tests/benchmark.py"

  publish:
    name: Publish runstats ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: runstats-${{ matrix.version }}-*-manylinux_riscv64
