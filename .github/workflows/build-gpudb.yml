---
# gpudb builds no wheels in CI (kineticadb/kinetica-api-python's only workflow,
# release.yml, creates GitHub releases); this builds setup.py's gpudb.protocol
# C extension from the tag with cibuildwheel.
name: Build gpudb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gpudb.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gpudb.yml'
      - 'docs/packages/gpudb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gpudb.yml'
      - 'docs/packages/gpudb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gpudb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gpudb ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      GPUDB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout gpudb v${{ env.GPUDB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kineticadb/kinetica-api-python
          ref: v${{ env.GPUDB_VERSION }}
          persist-credentials: false

      # Upstream ships no tests that run without a Kinetica server; round-trip
      # records through the compiled Avro codec instead.
      - name: Write smoke test
        run: |
          cat > smoke_test.py <<'PY'
          import gpudb
          from gpudb import GPUdbColumnProperty, GPUdbRecord, GPUdbRecordColumn, GPUdbRecordType

          assert gpudb.protocol.__file__.endswith(".so"), gpudb.protocol.__file__

          T = GPUdbRecordColumn._ColumnType
          columns = [
              GPUdbRecordColumn("i", T.INT),
              GPUdbRecordColumn("l", T.LONG),
              GPUdbRecordColumn("d", T.DOUBLE),
              GPUdbRecordColumn("s", T.STRING),
              GPUdbRecordColumn("n", T.STRING, [GPUdbColumnProperty.NULLABLE]),
          ]
          record_type = GPUdbRecordType(columns, label="smoke")
          rows = [
              [-7, 2**40, 3.5, "héllo", None],
              [2**31 - 1, -(2**63), -0.25, "", "x"],
          ]
          encoded = [GPUdbRecord(record_type, row).binary_data for row in rows]
          decoded = GPUdbRecord.decode_binary_data(record_type.record_type, encoded)
          got = [[record[name] for name in "ildsn"] for record in decoded]
          assert got == rows, got
          print("gpudb", gpudb.__file__, "round-trip OK")
          PY

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
          # pyzmq's cp314t riscv64 wheel is only on our registry.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: 'PIP_ONLY_BINARY=:all:'
          CIBW_TEST_SOURCES: smoke_test.py
          CIBW_TEST_COMMAND: python smoke_test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gpudb-${{ env.GPUDB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish gpudb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: gpudb-${{ matrix.version }}-*-manylinux_riscv64
