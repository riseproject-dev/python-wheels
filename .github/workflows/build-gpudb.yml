---
# gpudb builds no wheels in CI (kineticadb/kinetica-api-python's only workflow,
# release.yml, creates GitHub releases); this builds setup.py's gpudb.protocol
# C extension from the tag with cibuildwheel.
name: Build gpudb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gpudb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gpudb.yml'
      - 'docs/packages/gpudb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gpudb.yml'
      - 'docs/packages/gpudb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gpudb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gpudb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream ships no tests that run without a Kinetica server; round-trip
    # records through the compiled Avro codec instead.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gpudb"
      version: "${{ matrix.version }}"
      repository: "kineticadb/kinetica-api-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        cat > smoke_test.py <<'PY'
        import gpudb
        from gpudb import GPUdbColumnProperty, GPUdbRecord, GPUdbRecordColumn, GPUdbRecordType

        assert gpudb.protocol.__file__.endswith(".so"), gpudb.protocol.__file__

        T = GPUdbRecordColumn._ColumnType
        columns = [
            GPUdbRecordColumn("i", T.INT),
            GPUdbRecordColumn("l", T.LONG),
            GPUdbRecordColumn("d", T.DOUBLE),
            GPUdbRecordColumn("s", T.STRING),
            GPUdbRecordColumn("n", T.STRING, [GPUdbColumnProperty.NULLABLE]),
        ]
        record_type = GPUdbRecordType(columns, label="smoke")
        rows = [
            [-7, 2**40, 3.5, "héllo", None],
            [2**31 - 1, -(2**63), -0.25, "", "x"],
        ]
        encoded = [GPUdbRecord(record_type, row).binary_data for row in rows]
        decoded = GPUdbRecord.decode_binary_data(record_type.record_type, encoded)
        got = [[record[name] for name in "ildsn"] for record in decoded]
        assert got == rows, got
        print("gpudb", gpudb.__file__, "round-trip OK")
        PY
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pyzmq's cp314t riscv64 wheel is only on our registry.
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      cibw-test-sources: "smoke_test.py"
      cibw-test-command: "python smoke_test.py"

  publish:
    name: Publish gpudb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gpudb-${{ matrix.version }}-*-manylinux_riscv64
