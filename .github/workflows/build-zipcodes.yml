---
# This workflow is based on the `wheels` job of
# https://github.com/seanpianka/zipcodes/blob/v3.0.0/.github/workflows/release.yml
name: Build zipcodes wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'zipcodes version to build (git tag without the leading v, e.g. 3.0.0)'
        required: true
        default: '3.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-zipcodes.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 3.0.0 there.
  ZIPCODES_VERSION: ${{ inputs.version || '3.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build zipcodes ${{ inputs.version || '3.0.0' }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90

    steps:
      - name: Checkout zipcodes v${{ env.ZIPCODES_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: seanpianka/zipcodes
          ref: v${{ env.ZIPCODES_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          # pyo3's abi3-py39 feature is on unconditionally, so one abi3 wheel
          # serves every interpreter it claims; upstream publishes no
          # free-threaded (cp314t) wheel, so there is no second job here.
          # Built on cp39 -- the oldest interpreter the abi3 tag claims --
          # and re-tested on the newer ones via find_compatible_wheel.
          CIBW_BUILD: >-
            cp39-manylinux_riscv64 cp310-manylinux_riscv64
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # zipcodes ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import zipcodes._zipcodes as m; assert m.__file__.endswith('.abi3.so'), m.__file__" &&
            python -m pytest -v tests

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "zipcodes/_zipcodes.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zipcodes-${{ env.ZIPCODES_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zipcodes ${{ inputs.version || '3.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zipcodes-${{ inputs.version || '3.0.0' }}-*-manylinux_riscv64
