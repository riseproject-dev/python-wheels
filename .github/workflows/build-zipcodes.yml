---
# This workflow is based on the `wheels` job of
# https://github.com/seanpianka/zipcodes/blob/v3.0.0/.github/workflows/release.yml
name: Build zipcodes wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zipcodes.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zipcodes.yml'
      - 'docs/packages/zipcodes.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zipcodes.yml'
      - 'docs/packages/zipcodes.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zipcodes
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build zipcodes ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "zipcodes"
      version: "${{ matrix.version }}"
      repository: "seanpianka/zipcodes"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      # pyo3's abi3-py39 feature is on unconditionally, so one abi3 wheel
      # serves every interpreter it claims; upstream publishes no
      # free-threaded (cp314t) wheel, so there is no second job here.
      # Built on cp39 -- the oldest interpreter the abi3 tag claims --
      # and re-tested on the newer ones via find_compatible_wheel.
      cibw-build: "cp39-manylinux_riscv64 cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # zipcodes ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import zipcodes._zipcodes as m; assert m.__file__.endswith('.abi3.so'), m.__file__\" && python -m pytest -v tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      ZIPCODES_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: zipcodes-${{ env.ZIPCODES_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "zipcodes/_zipcodes.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish zipcodes ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zipcodes-${{ matrix.version }}-*-manylinux_riscv64
