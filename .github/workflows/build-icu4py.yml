---
# This workflow is based on: https://github.com/adamchainz/icu4py/blob/1.2.0/.github/workflows/main.yml
name: Build icu4py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/icu4py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-icu4py.yml'
      - 'docs/packages/icu4py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-icu4py.yml'
      - 'docs/packages/icu4py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: icu4py
      version: ${{ inputs.version }}

  build:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build icu4py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "icu4py"
      version: "${{ matrix.version }}"
      repository: "adamchainz/icu4py"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        tag=$(sed -n 's|^BASE_URL = "https://github.com/adamchainz/icu4c-builds/releases/download/\(.*\)"$|\1|p' download_icu.py)
        test -n "$tag"
        echo "ICU4C_BUILDS_TAG=$tag" >> "$GITHUB_ENV"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "icu4c-builds"
        git init -q "icu4c-builds"
        git -C "icu4c-builds" remote add origin "${GITHUB_SERVER_URL}/adamchainz/icu4c-builds.git"
        git -C "icu4c-builds" fetch -q --no-tags --depth=1 origin "$ICU4C_BUILDS_TAG"
        git -C "icu4c-builds" checkout -q --detach FETCH_HEAD
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # CIBW_BEFORE_ALL runs once per container before cibuildwheel puts any
      # interpreter-specific bin dir on PATH, so plain `python` resolves to this
      # image's default bootstrap interpreter -- cp39 here, regardless of which
      # interpreter the job is actually building for. build.py's own
      # `from typing import assert_never` needs 3.11+, so it ImportErrors
      # identically on every leg. Pin to a floor interpreter new enough instead.
      cibw-before-all-linux: "cd {project}/icu4c-builds && /opt/python/cp312-cp312/bin/python build.py --platform linux --in-docker && mkdir -p /tmp/icu && cp -a build/install /tmp/icu/icu && cp /tmp/icu/icu/LICENSE {project}/LICENSE-ICU"
      cibw-test-requires: "pytest pytest-randomly"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-environment: "PYTHONDEVMODE=1"
      cibw-test-command: "python -W error -m pytest tests"

  verify_wheels:
    needs: [setup, build]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ICU4PY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: icu4py-${{ env.ICU4PY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel bundles ICU and its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for ext in ("locale", "messageformat", "breakers", "_version"):
                  assert any(n.startswith(f"icu4py/{ext}.cpython-") and n.endswith(".so") for n in names), (whl, ext, names)
              assert any(n.startswith("icu4py.libs/libicudata") for n in names), (whl, names)
              assert any(n.endswith(".dist-info/licenses/LICENSE-ICU") for n in names), (whl, names)
              print(whl, "OK")
          EOF

  publish:
    name: Publish icu4py ${{ matrix.version }}
    needs: [setup, build, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: icu4py-${{ matrix.version }}-*-manylinux_riscv64
