---
# This workflow is based on: https://github.com/ZEISS/pylibczirw/blob/main/.github/workflows/build.yml
# and .github/workflows/build-reusable.yml / .github/actions/steps_package (the Linux leg).
name: Build pylibczirw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pylibczirw.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibczirw.yml'
      - 'docs/packages/pylibczirw.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pylibczirw.yml'
      - 'docs/packages/pylibczirw.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pylibczirw
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pylibczirw ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
    env:
      PYLIBCZIRW_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pylibCZIrw ${{ env.PYLIBCZIRW_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ZEISS/pylibczirw
          ref: v${{ env.PYLIBCZIRW_VERSION }}
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build and test wheel
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Reuses upstream's own before-all script (installs eigen3-devel,
          # falling back to a pinned header-only download) from the checked
          # out tree, same as their build.yml does for CIBWBEFOREALLLINUX.
          CIBW_BEFORE_ALL_LINUX: bash /project/.github/scripts/install_manylinux_deps.sh
          # numpy ships no riscv64 wheel on public PyPI yet; cmake/xmltodict/
          # defusedxml/validators/packaging all do (cmake has real riscv64
          # binaries, the rest are py3-none-any).
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest defusedxml
          CIBW_TEST_COMMAND: pytest {project}/pylibCZIrw/tests
        run: |
          set -euo pipefail
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pylibczirw-${{ env.PYLIBCZIRW_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Collect GPL sources ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYLIBCZIRW_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pylibczirw-${{ env.PYLIBCZIRW_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pylibczirw ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pylibczirw-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pylibczirw-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
