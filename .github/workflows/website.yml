name: Build and deploy website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ci_scripts/dashboard/**"
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false
  queue: ${{ github.ref == 'refs/heads/main' && 'single' || 'max' }}

jobs:
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3'

      - name: Install site generator dependencies
        run: pip install -r ci_scripts/requirements.txt

      - name: Generate package pages from YAML
        run: python ci_scripts/generate_packages_doc.py

      - name: Restore the dashboard's pypi.org response cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: requests-cache.sqlite
          key: requests-cache-${{ github.ref }}
          restore-keys: requests-cache-main

      - name: Generate the dashboard
        continue-on-error: true
        run: |
          python ci_scripts/dashboard/build.py --output-dir docs/dashboard

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: pypi.riseproject.dev

  # A package is officially available once deploy has published /simple/, so
  # we can now move the issue Status to "Available in RISE PyPI".
  # Compares packages.txt with the project rather than diffing this push,
  # so pushes the concurrency queue skipped are caught up.
  sync-project-status:
    needs: deploy
    if: ${{ vars.RISEPROJECT_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN cannot write organization projects; the App needs the
      # organization "Projects: read and write" permission.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: ci_scripts

      - name: Mark published packages in the Python Wheels project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 ci_scripts/sync_project_status.py
