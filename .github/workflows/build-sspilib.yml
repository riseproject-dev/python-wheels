---
# Based on upstream's CI:
#   https://github.com/jborean93/sspilib/blob/v0.6.0/.github/workflows/ci.yml
# On Linux, sspilib links its Cython extensions against libsspi.so, a cdylib
# built from Devolutions/sspi-rs (a portable SSPI implementation) plus a
# static ICU4C - both built by upstream's own build_helpers/cibuildwheel-before-all.sh,
# already wired into [tool.cibuildwheel] in pyproject.toml.
name: Build sspilib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sspilib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sspilib.yml'
      - 'docs/packages/sspilib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sspilib.yml'
      - 'docs/packages/sspilib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sspilib
      version: ${{ inputs.version }}

  # One cp311-abi3 wheel (setup.py hardcodes the limited-api floor to cp311):
  # cibuildwheel builds it once and reuses+tests it on cp313/cp314
  # (find_compatible_wheel), so all three tags share one wheel.
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sspilib ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: sspilib
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp311-abi3-manylinux_riscv64
      timeout-minutes: 180
      cibw-build: cp312-* cp313-* cp314-*
      cibw-skip: "*-musllinux_*"
      cibw-test-requires: pytest
      cibw-test-command: python -m pytest {package}/tests -v

  # Free-threaded wheel: setup.py disables the limited API under Py_GIL_DISABLED,
  # so this is a per-interpreter build. Only cp314t - the riscv64 image has no cp313t.
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sspilib ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: sspilib
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp314t-manylinux_riscv64
      timeout-minutes: 180
      cibw-build: cp314t-*
      cibw-skip: "*-musllinux_*"
      cibw-test-requires: pytest
      cibw-test-command: python -m pytest {package}/tests -v

  publish:
    name: Publish sspilib ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sspilib-${{ matrix.version }}-*-manylinux_riscv64
