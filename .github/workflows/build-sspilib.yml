---
# Based on upstream's CI:
#   https://github.com/jborean93/sspilib/blob/v0.6.0/.github/workflows/ci.yml
# On Linux, sspilib links its Cython extensions against libsspi.so, a cdylib
# built from Devolutions/sspi-rs (a portable SSPI implementation) plus a
# static ICU4C - both built by upstream's own build_helpers/cibuildwheel-before-all.sh,
# already wired into [tool.cibuildwheel] in pyproject.toml.
name: Build sspilib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'sspilib version to build (git tag, e.g. 0.6.0)'
        required: true
        default: '0.6.0'
  pull_request:
    paths:
      - '.github/workflows/build-sspilib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.6.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SSPILIB_VERSION: ${{ inputs.version || '0.6.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_sdist:
    needs: [setup]
    name: Build sspilib ${{ inputs.version || '0.6.0' }} sdist
    runs-on: ubuntu-latest
    outputs:
      sdist_name: ${{ steps.sdist.outputs.sdist_name }}
      package_version: ${{ steps.sdist.outputs.package_version }}
    steps:
      - name: Checkout sspilib v${{ env.SSPILIB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jborean93/sspilib
          ref: v${{ env.SSPILIB_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        env:
          SSPI_SKIP_EXTENSIONS: 'true'  # metadata-only: no SSPI implementation to link against here
        run: |
          set -euo pipefail
          rm -rf dist
          uv pip install build
          python -m build --sdist --outdir dist

          sdist_name="$(ls dist)"
          {
            echo "sdist_name=${sdist_name}"
            echo "package_version=$(echo "${sdist_name}" | sed -En 's/sspilib-(.+)\.tar\.gz/\1/p')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.sdist.outputs.sdist_name }}
          path: dist/${{ steps.sdist.outputs.sdist_name }}
          if-no-files-found: error

  # One cp311-abi3 wheel (setup.py hardcodes the limited-api floor to cp311):
  # cibuildwheel builds it once and reuses+tests it on cp313/cp314
  # (find_compatible_wheel), so all three tags share one wheel.
  build_abi3:
    needs: [setup, build_sdist]
    name: Build sspilib ${{ inputs.version || '0.6.0' }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build_sdist.outputs.sdist_name }}
          path: dist/

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: dist/${{ needs.build_sdist.outputs.sdist_name }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux_*'  # rustup.rs has no riscv64 musl toolchain
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-cp311-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded wheel: setup.py disables the limited API under Py_GIL_DISABLED,
  # so this is a per-interpreter build. Only cp314t - the riscv64 image has no cp313t.
  build_freethreaded:
    needs: [setup, build_sdist]
    name: Build sspilib ${{ inputs.version || '0.6.0' }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build_sdist.outputs.sdist_name }}
          path: dist/

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: dist/${{ needs.build_sdist.outputs.sdist_name }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp314t-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-cp314t-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish sspilib ${{ inputs.version || '0.6.0' }}
    needs: [setup, build_sdist, build_abi3, build_freethreaded]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: sspilib-${{ needs.build_sdist.outputs.package_version }}-*-manylinux_riscv64
