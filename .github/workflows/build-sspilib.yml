---
# Based on upstream's CI:
#   https://github.com/jborean93/sspilib/blob/v0.6.0/.github/workflows/ci.yml
# On Linux, sspilib links its Cython extensions against libsspi.so, a cdylib
# built from Devolutions/sspi-rs (a portable SSPI implementation) plus a
# static ICU4C - both built by upstream's own build_helpers/cibuildwheel-before-all.sh,
# already wired into [tool.cibuildwheel] in pyproject.toml.
name: Build sspilib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sspilib.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sspilib.yml'
      - 'docs/packages/sspilib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sspilib.yml'
      - 'docs/packages/sspilib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sspilib
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sspilib ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      SSPILIB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout sspilib v${{ env.SSPILIB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jborean93/sspilib
          ref: v${{ env.SSPILIB_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        env:
          SSPI_SKIP_EXTENSIONS: 'true'  # metadata-only: no SSPI implementation to link against here
        run: |
          set -euo pipefail
          rm -rf dist
          uv pip install build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # One cp311-abi3 wheel (setup.py hardcodes the limited-api floor to cp311):
  # cibuildwheel builds it once and reuses+tests it on cp313/cp314
  # (find_compatible_wheel), so all three tags share one wheel.
  build_abi3:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sspilib ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    env:
      SSPILIB_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux_*'  # rustup.rs has no riscv64 musl toolchain
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-cp311-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded wheel: setup.py disables the limited API under Py_GIL_DISABLED,
  # so this is a per-interpreter build. Only cp314t - the riscv64 image has no cp313t.
  build_freethreaded:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build sspilib ${{ matrix.version }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    env:
      SSPILIB_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp314t-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sspilib-${{ env.SSPILIB_VERSION }}-cp314t-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish sspilib ${{ matrix.version }}
    needs: [setup, build_sdist, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: sspilib-${{ matrix.version }}-*-manylinux_riscv64
