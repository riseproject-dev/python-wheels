---
# This workflow is based on the `build` and `build-free-threaded` jobs of
# https://github.com/jxxghp/MoviePilot-Rust/blob/v0.3.8/.github/workflows/release.yml
# and on the `test` job of
# https://github.com/jxxghp/MoviePilot-Rust/blob/v0.3.8/.github/workflows/ci.yml
name: Build moviepilot-rust wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/moviepilot-rust.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-moviepilot-rust.yml'
      - 'docs/packages/moviepilot-rust.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-moviepilot-rust.yml'
      - 'docs/packages/moviepilot-rust.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: moviepilot-rust
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build moviepilot-rust ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # requires-python is >=3.14; the default `abi3-py314` feature makes cp314 one abi3 wheel.
        python: ["cp314", "cp314t"]
        platform: ["manylinux", "musllinux"]
        include:
          - python: cp314
            environment: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
          - python: cp314t
            environment: MATURIN_PEP517_ARGS="--locked --no-default-features --features zhconv"

    env:
      MOVIEPILOT_RUST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout MoviePilot-Rust v${{ env.MOVIEPILOT_RUST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jxxghp/MoviePilot-Rust
          ref: v${{ env.MOVIEPILOT_RUST_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin" ${{ matrix.environment }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moviepilot-rust-${{ env.MOVIEPILOT_RUST_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      MOVIEPILOT_RUST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Rust cdylibs on musl link libgcc_s dynamically, so auditwheel vendors it into the musllinux wheels.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moviepilot-rust-${{ env.MOVIEPILOT_RUST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish moviepilot-rust ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: moviepilot-rust-${{ matrix.version }}-*_riscv64
      gpl-sources-artifact: moviepilot-rust-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
