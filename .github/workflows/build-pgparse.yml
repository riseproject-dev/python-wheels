---
# This workflow is based on the `build` job of
# https://github.com/gmr/pgparse/blob/1.0.3/.github/workflows/testing.yaml
name: Build pgparse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pgparse.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pgparse.yml'
      - 'docs/packages/pgparse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pgparse.yml'
      - 'docs/packages/pgparse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pgparse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pgparse ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pgparse"
      version: "${{ matrix.version }}"
      repository: "gmr/pgparse"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pgparse/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp libpg_query/LICENSE LICENSE.libpg_query
        cp libpg_query/src/postgres/COPYRIGHT LICENSE.postgres

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # Py_LIMITED_API is hardcoded to 0x030B0000 in pyproject.toml, so the
      # wheel must be built on cp311, its floor interpreter (gotcha 96); the
      # later entries build nothing, they re-test the one wheel.
      cibw-build: "cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-before-all: "make -C libpg_query"
      cibw-config-settings: "--build-option=--py-limited-api=cp311"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PGPARSE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pgparse-${{ env.PGPARSE_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pgparse") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.libpg_query", "LICENSE.postgres"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pgparse ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pgparse-${{ matrix.version }}-*-manylinux_riscv64
