---
# This workflow is based on the `build` job of
# https://github.com/gmr/pgparse/blob/1.0.3/.github/workflows/testing.yaml
name: Build pgparse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pgparse.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pgparse.yml'
      - 'docs/packages/pgparse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pgparse.yml'
      - 'docs/packages/pgparse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pgparse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pgparse ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90

    env:
      PGPARSE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pgparse ${{ env.PGPARSE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gmr/pgparse
          ref: ${{ env.PGPARSE_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pgparse source
        run: git apply python-wheels/patches/pgparse/${{ env.PGPARSE_VERSION }}/00*.patch

      # The extension statically links libpg_query, which bundles the PostgreSQL
      # parser; upstream ships neither licence in the wheel.
      - name: Stage the licences of the statically linked sources
        run: |
          cp libpg_query/LICENSE LICENSE.libpg_query
          cp libpg_query/src/postgres/COPYRIGHT LICENSE.postgres

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # Py_LIMITED_API is hardcoded to 0x030B0000 in pyproject.toml, so the
          # wheel must be built on cp311, its floor interpreter (gotcha 96); the
          # later entries build nothing, they re-test the one wheel.
          CIBW_BUILD: >-
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL: make -C libpg_query
          CIBW_CONFIG_SETTINGS: --build-option=--py-limited-api=cp311
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests

      - name: Check the extension and the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pgparse") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.libpg_query", "LICENSE.postgres"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pgparse-${{ env.PGPARSE_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pgparse ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pgparse-${{ matrix.version }}-*-manylinux_riscv64
