---
# passagemath-mcqd is split out of the passagemath/passagemath monorepo (a
# SageMath fork) at pkgs/sagemath-mcqd, tagged passagemath-<version>. This
# replays build/pkgs/sagemath_mcqd/spkg-src (./bootstrap renders the
# package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-mcqd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-mcqd.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-mcqd.yml'
      - 'docs/packages/passagemath-mcqd.yaml'
      - 'patches/passagemath-mcqd/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-mcqd.yml'
      - 'docs/packages/passagemath-mcqd.yaml'
      - 'patches/passagemath-mcqd/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # gitlab.com/janezkonc/mcqd has no release tarball (build/pkgs/mcqd's own
  # checksums.ini pins a dead mit.edu/sagemath.org mirror URL); this is the
  # repository's only real commit, verified below rather than trusted blind.
  MCQD_REPO: https://gitlab.com/janezkonc/mcqd
  MCQD_COMMIT: 9ab9717cf7d1be1a85b165a8eacb71b9e5831113

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-mcqd
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_MCQD_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_MCQD_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_MCQD_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-mcqd
          src/sage/graphs/mcqd.p*
          src/sage/graphs/all__sagemath_mcqd.py
          src/sage/all__sagemath_mcqd.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-mcqd source
      run: git apply python-wheels/patches/passagemath-mcqd/${{ env.PASSAGEMATH_MCQD_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    # ./bootstrap's own per-package render (sage-package bootstrap) runs all
    # ~650 spkgs in parallel batches and aborts a batch outright if any
    # member fails (sage_conf's needs the full configure.ac, absent from
    # this sparse checkout); render this one package ourselves so it is
    # not at the mercy of that batch's luck.
    - name: Render pkgs/sagemath-mcqd/pyproject.toml.m4
      working-directory: pkgs/sagemath-mcqd
      run: |
        export M4PATH="$GITHUB_WORKSPACE/m4"
        for f in *.m4; do m4 "$f" > "${f%.m4}"; done

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-mcqd
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_MCQD_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_MCQD_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-mcqd-${{ env.PASSAGEMATH_MCQD_VERSION }}-sdist
        path: pkgs/sagemath-mcqd/dist/*.tar.gz
        if-no-files-found: error

  # mcqd (GPL-3.0-or-later) is compiled straight into the wheel from the
  # pinned commit, which is not in the image's repos, so its source and
  # licence text are collected here rather than from an RPM.
  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-latest
    env:
      PASSAGEMATH_MCQD_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch pinned mcqd source
        run: |
          set -euo pipefail
          git clone "$MCQD_REPO" mcqd
          cd mcqd
          test "$(git rev-parse HEAD)" = "$MCQD_COMMIT"
          rm -rf .git

      - run: tar cf gpl-sources.tar mcqd

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: passagemath-mcqd-${{ env.PASSAGEMATH_MCQD_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-mcqd ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_MCQD_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-mcqd-${{ env.PASSAGEMATH_MCQD_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        # Replays build/pkgs/mcqd/spkg-install.in: strip the verbose debug
        # print, build libmcqd.so from mcqd.cpp alone, install it and the
        # header where the compiler already looks (gotcha 140).
        CIBW_BEFORE_ALL_LINUX: >-
          git clone ${{ env.MCQD_REPO }} /tmp/mcqd &&
          cd /tmp/mcqd &&
          test "$(git rev-parse HEAD)" = "${{ env.MCQD_COMMIT }}" &&
          grep -v "std..cout.*current max" mcqd.h > mcqd2.h && mv mcqd2.h mcqd.h &&
          g++ -fPIC -O3 -c mcqd.cpp -o mcqd.o &&
          g++ -shared mcqd.o -o "$([ -d /usr/lib64 ] && echo /usr/lib64 || echo /usr/lib)/libmcqd.so" &&
          (ldconfig || true) &&
          cp mcqd.h /usr/include/
        CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        # sagemath-repl/-graphs/-cliquer (the real test extras) are unported,
        # so this stands in a minimal duck-typed graph rather than sage's own.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.graphs.mcqd import mcqd;
          adj={0:{1,2},1:{0,2},2:{0,1,3},3:{2}};
          G=type('G',(object,),{'order':lambda s:4,'vertices':lambda s,sort=False:list(range(4)),'neighbors':lambda s,v:list(adj[v]),'__iter__':lambda s:iter(range(4))});
          r=mcqd(G());
          assert sorted(r)==[0,1,2], r;
          print('mcqd ok', r)"

    - name: Check the wheel ships the extension and the vendored licence
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/graphs/mcqd") and n.endswith(".so") for n in names), whl
            # The final link line for mcqd.abi3.so carries no "-lmcqd": mcqd.h's
            # algorithm is template/header-only, so the Cython extension
            # compiles it straight in and never links the libmcqd.so that
            # CIBW_BEFORE_ALL_LINUX builds (that step only reproduces
            # spkg-install.in; nothing in the wheel actually depends on its
            # output). There is no separate libmcqd.so for auditwheel to
            # vendor on manylinux. musllinux's passagemath_mcqd.libs/ is
            # unrelated: its auditwheel policy (unlike manylinux's) doesn't
            # allowlist libstdc++/libgcc_s, so it vendors the C++ runtime
            # there regardless (gotcha 409) - a directory name that happens
            # to contain "mcqd" too, which is why an
            # `any("mcqd" in n for n in libs)` check passed there by
            # coincidence and failed on manylinux for the real reason above.
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE", "LICENSE.mcqd"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-mcqd-${{ env.PASSAGEMATH_MCQD_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-mcqd ${{ matrix.version }}
    needs: [setup, linux, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-mcqd-${{ matrix.version }}-*_riscv64
      gpl-sources-artifact: passagemath-mcqd-${{ matrix.version }}-gpl-sources
      gpl-sources-description: mcqd
