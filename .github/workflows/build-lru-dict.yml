---
# This workflow is based on the `build_wheels` job of
# https://github.com/amitdev/lru-dict/blob/master/.github/workflows/build-and-deploy.yml
name: Build lru-dict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lru-dict version to build (e.g. 1.4.1)'
        required: true
        default: '1.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-lru-dict.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LRU_DICT_VERSION: ${{ inputs.version || '1.4.1' }}
  # 1.4.1 was released to PyPI without a git tag; pin the commit that bumped
  # pyproject.toml's version to 1.4.1, byte-identical to the PyPI sdist
  # (gotcha 103). Update alongside LRU_DICT_VERSION.
  LRU_DICT_REF: 5dcddb167a66777bc641361bfa1ae02cd94a7cb5
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build lru-dict ${{ inputs.version || '1.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout lru-dict ${{ env.LRU_DICT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: amitdev/lru-dict
          ref: ${{ env.LRU_DICT_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("lru/_lru") and n.endswith(".so") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lru-dict-${{ env.LRU_DICT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lru-dict ${{ inputs.version || '1.4.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: lru-dict-${{ inputs.version || '1.4.1' }}-*-manylinux_riscv64
