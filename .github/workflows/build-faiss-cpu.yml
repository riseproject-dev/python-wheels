---
# This workflow is based on: https://github.com/facebookresearch/faiss/blob/v1.15.0/.github/workflows/build-pip.yml
name: Build faiss-cpu wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/faiss-cpu.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-faiss-cpu.yml'
      - 'docs/packages/faiss-cpu.yaml'
      - 'patches/faiss-cpu/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-faiss-cpu.yml'
      - 'docs/packages/faiss-cpu.yaml'
      - 'patches/faiss-cpu/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: faiss-cpu
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build faiss-cpu ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "faiss-cpu"
      version: "${{ matrix.version }}"
      repository: "facebookresearch/faiss"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 600
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/faiss-cpu/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp312-manylinux_riscv64"
      # numpy (build and test), scipy and swig have no riscv64 wheels on PyPI.
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      FAISS_CPU_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: faiss-cpu-${{ env.FAISS_CPU_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel is a compiled abi3 wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp310-abi3-" in whl, whl
              names = zipfile.ZipFile(whl).namelist()
              for want in ("faiss/libfaiss.so", "faiss/_swigfaiss.abi3.so"):
                  assert want in names, (whl, want)
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for faiss-cpu ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: faiss-cpu
      version: ${{ matrix.version }}
      # faiss links OpenMP and OpenBLAS, so auditwheel vendors the image's
      # libgomp and libgfortran into faiss_cpu.libs/.
      packages: gcc

  publish:
    name: Publish faiss-cpu ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: faiss-cpu-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: faiss-cpu-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
