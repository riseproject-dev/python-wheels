---
# This workflow is based on the `build-wheels` job of
# https://github.com/oxfordcontrol/Clarabel.rs/blob/v0.11.1/.github/workflows/pypi.yaml
name: Build clarabel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clarabel.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clarabel.yml'
      - 'docs/packages/clarabel.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clarabel.yml'
      - 'docs/packages/clarabel.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clarabel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build clarabel ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "clarabel"
      version: "${{ matrix.version }}"
      repository: "oxfordcontrol/Clarabel.rs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      # pyo3's abi3-py39 feature makes this one wheel; it is built on cp39,
      # the oldest interpreter its tag claims, and re-tested on the newer
      # ones via find_compatible_wheel. musllinux is dropped: rustup.rs
      # ships no riscv64 musl toolchain.
      cibw-build: >
        cp39-manylinux_riscv64 cp312-manylinux_riscv64
        cp313-manylinux_riscv64 cp314-manylinux_riscv64
      # numpy and scipy, which clarabel imports at load time, have no
      # riscv64 wheel below cp312.
      cibw-test-skip: "cp39-manylinux_riscv64"
      # Clarabel.rs ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # maturin 1.9.2 stopped merging Cargo.toml metadata into a PEP 621
      # `[project]` table, which drops clarabel's summary, licence and
      # repository URL from the wheel. Upstream's own wheels predate it.
      cibw-before-build: "pip install \"maturin>=1.0,<1.9.2\""
      cibw-build-frontend: "build; args: --no-isolation"
      # pardiso-panua replaces upstream's x86_64 `pardiso`: the mkl half of
      # that feature fails the build on any other architecture. It is the
      # same feature set upstream builds its aarch64 wheels with.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" MATURIN_PEP517_ARGS=\"--features python,pardiso-panua\""
      # Without it pip prefers PyPI's releases, which have no riscv64
      # wheels, and source-builds them in the container.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy,cffi"
      cibw-test-requires: "pytest"
      cibw-test-sources: "python/clarabel/tests examples/python examples/data"
      cibw-test-command: >
        python -m pytest -v python/clarabel/tests &&
        python examples/python/example_qp.py &&
        python examples/python/example_sdp.py

  publish:
    name: Publish clarabel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: clarabel-${{ matrix.version }}-*-manylinux_riscv64
