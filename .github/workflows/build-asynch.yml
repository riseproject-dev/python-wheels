---
# This workflow is based on the `build_wheels` job of
# https://github.com/long2ice/asynch/blob/v0.4.0/.github/workflows/pypi.yml
name: Build asynch wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asynch.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asynch.yml'
      - 'docs/packages/asynch.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asynch.yml'
      - 'docs/packages/asynch.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asynch
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build asynch ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      ASYNCH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout asynch v${{ env.ASYNCH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: long2ice/asynch
          ref: v${{ env.ASYNCH_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Every other test in the suite needs a live ClickHouse server, which
          # publishes no riscv64 image (asynch's own CI gets one via a `services:`
          # container, unavailable here); this file just checks the Cython
          # extensions loaded, so it's the only one that runs unmodified.
          CIBW_TEST_SOURCES: tests/test_compiled.py
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest -v tests/test_compiled.py

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import glob, sys, zipfile
          expected = {p[len('asynch/'):-len('.pyx')] for p in glob.glob('asynch/**/*.pyx', recursive=True)}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n[len('asynch/'):].split('.')[0]
                  for n in names
                  if n.startswith('asynch/') and n.endswith('.so')
              }
              assert found == expected, (whl, sorted(expected - found), sorted(found - expected))
              print(whl, 'ok')
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asynch-${{ env.ASYNCH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish asynch ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: asynch-${{ matrix.version }}-*-manylinux_riscv64
