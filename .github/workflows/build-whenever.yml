---
# Based on upstream's own wheels.yml binary job (maturin-built pyo3-ffi extension),
# narrowed to riscv64 and driven through cibuildwheel's default setuptools_rust build
# (upstream's own sdist/editable path, declared via pyproject.toml's dynamic build
# dependency) since maturin-action ships no riscv64 manylinux image.
name: Build whenever wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/whenever.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-whenever.yml'
      - 'docs/packages/whenever.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-whenever.yml'
      - 'docs/packages/whenever.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: whenever
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build whenever ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "whenever"
      version: "${{ matrix.version }}"
      repository: "ariebovenberg/whenever"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pyproject.toml declares no [build-system] rust toolchain; the Rust
      # toolchain setuptools_rust needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest hypothesis typing-extensions time_machine tzdata pydantic pytest-order"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import whenever; assert whenever._EXTENSION_LOADED, whenever._EXTENSION_LOADED" &&
        python -m pytest -q tests

  publish:
    name: Publish whenever ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: whenever-${{ matrix.version }}-*-manylinux_riscv64
