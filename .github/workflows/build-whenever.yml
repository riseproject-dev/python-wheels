---
# Based on upstream's own wheels.yml binary job (maturin-built pyo3-ffi extension),
# narrowed to riscv64 and driven through cibuildwheel's default setuptools_rust build
# (upstream's own sdist/editable path, declared via pyproject.toml's dynamic build
# dependency) since maturin-action ships no riscv64 manylinux image.
name: Build whenever wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/whenever.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-whenever.yml'
      - 'docs/packages/whenever.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-whenever.yml'
      - 'docs/packages/whenever.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: whenever
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build whenever ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3 feature in Cargo.toml, so upstream ships one wheel per
        # interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      WHENEVER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout whenever ${{ env.WHENEVER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ariebovenberg/whenever
          ref: ${{ env.WHENEVER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyproject.toml declares no [build-system] rust toolchain; the Rust
          # toolchain setuptools_rust needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest hypothesis typing-extensions time_machine tzdata pydantic pytest-order
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import whenever; assert whenever._EXTENSION_LOADED, whenever._EXTENSION_LOADED" &&
            python -m pytest -q tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: whenever-${{ env.WHENEVER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish whenever ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: whenever-${{ matrix.version }}-*-manylinux_riscv64
