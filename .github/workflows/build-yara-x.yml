---
# This workflow is based on the `build-py` job of
# https://github.com/VirusTotal/yara-x/blob/v1.20.0/.github/workflows/release.yaml
name: Build yara-x wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/yara-x.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-yara-x.yml'
      - 'docs/packages/yara-x.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-yara-x.yml'
      - 'docs/packages/yara-x.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: yara-x
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build yara-x ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # py/Cargo.toml's pyo3 dependency carries "abi3", "abi3-py38"
          # unconditionally, so one abi3 wheel serves every GIL-ful
          # interpreter; pyo3 disables abi3 under Py_GIL_DISABLED, giving the
          # free-threaded build its own wheel. cp38/cp39 aren't in the
          # manylinux_2_39_riscv64 image (it ships cp39-cp315), so the build
          # floor is cp39 -- same interpreter upstream's own release job uses.
          - tag: cp38-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # maturin globs LICEN[CS]E* relative to the pyproject directory (py/),
    # not the workspace root, so upstream's published wheels carry no
    # licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "yara-x"
      version: "${{ matrix.version }}"
      repository: "VirusTotal/yara-x"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: "cp LICENSE py/"
      cibw-package-dir: "py"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # py/ ships no [tool.cibuildwheel]; the Rust toolchain maturin
      # needs is installed in-container here (gotcha 10).
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # yara-x's own dependency graph (wasmtime + cranelift) is heavy
      # enough to risk an alloc-failure SIGABRT at cargo's default
      # parallelism on these 4-core runners (gotcha 228).
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
        CARGO_BUILD_JOBS=2
      cibw-test-requires: "pytest"
      cibw-test-sources: "py/tests"
      # yara_x/__init__.py re-exports the compiled yara_x.yara_x
      # submodule (gotcha 56).
      cibw-test-command: >
        python -c "import yara_x.yara_x as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('yara-x'))" &&
        cd py && python -m pytest tests -v

  publish:
    name: Publish yara-x ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: yara-x-${{ matrix.version }}-*-manylinux_riscv64
