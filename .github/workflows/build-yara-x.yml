---
# This workflow is based on the `build-py` job of
# https://github.com/VirusTotal/yara-x/blob/v1.20.0/.github/workflows/release.yaml
name: Build yara-x wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'yara-x version to build (git tag without the leading v, e.g. 1.20.0)'
        required: true
        default: '1.20.0'
  pull_request:
    paths:
      - '.github/workflows/build-yara-x.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.20.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.20.0 there.
  YARA_X_VERSION: ${{ inputs.version || '1.20.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build yara-x ${{ inputs.version || '1.20.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # py/Cargo.toml's pyo3 dependency carries "abi3", "abi3-py38"
          # unconditionally, so one abi3 wheel serves every GIL-ful
          # interpreter; pyo3 disables abi3 under Py_GIL_DISABLED, giving the
          # free-threaded build its own wheel. cp38/cp39 aren't in the
          # manylinux_2_39_riscv64 image (it ships cp39-cp315), so the build
          # floor is cp39 -- same interpreter upstream's own release job uses.
          - tag: cp38-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout yara-x v${{ env.YARA_X_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: VirusTotal/yara-x
          ref: v${{ env.YARA_X_VERSION }}
          persist-credentials: false

      - name: Stage the licence beside yara-x's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory (py/),
        # not the workspace root, so upstream's published wheels carry no
        # licence text at all.
        run: cp LICENSE py/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: py
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # py/ ships no [tool.cibuildwheel]; the Rust toolchain maturin
          # needs is installed in-container here (gotcha 10).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          # yara-x's own dependency graph (wasmtime + cranelift) is heavy
          # enough to risk an alloc-failure SIGABRT at cargo's default
          # parallelism on these 4-core runners (gotcha 228).
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_BUILD_JOBS=2
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: py/tests
          # yara_x/__init__.py re-exports the compiled yara_x.yara_x
          # submodule (gotcha 56).
          CIBW_TEST_COMMAND: >-
            python -c "import yara_x.yara_x as m, importlib.metadata as md;
            assert m.__file__.endswith('.so'), m.__file__;
            assert any(str(p).endswith('licenses/LICENSE') for p in md.files('yara-x'))" &&
            cd py && python -m pytest tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: yara-x-${{ env.YARA_X_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish yara-x ${{ inputs.version || '1.20.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: yara-x-${{ inputs.version || '1.20.0' }}-*-manylinux_riscv64
