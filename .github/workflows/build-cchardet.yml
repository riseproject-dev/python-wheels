---
name: Build cchardet wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cchardet.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cchardet.yml'
      - 'docs/packages/cchardet.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cchardet.yml'
      - 'docs/packages/cchardet.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cchardet
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build cchardet ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      CCHARDET_VERSION: ${{ matrix.version }}

    steps:
      # Upstream tagged 2.1.7 and earlier bare (2.1.7); starting at 2.2.0 tags
      # carry a "v" prefix (v2.2.0, v2.3.0).
      - name: Checkout cChardet v${{ env.CCHARDET_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: PyYoshi/cChardet
          ref: v${{ env.CCHARDET_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        # setup.py cythonises _cchardet.pyx itself whenever Cython is
        # importable, so Cython has to be preinstalled with isolation off, or
        # the bundled .cpp is whatever a bare `setuptools`+`wheel` env leaves
        # behind (nothing, in practice).
        run: |
          uv pip install cython setuptools wheel build twine
          python -m build --sdist --no-isolation
          twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cchardet-${{ env.CCHARDET_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      # tools/wheel_smoke.py (upstream's own [tool.cibuildwheel] test-command)
      # isn't part of the sdist (not listed in MANIFEST.in - that only
      # ships what the installable package needs), so carry it separately
      # from this checkout rather than freezing a copy into the workflow,
      # which would silently drift from upstream on the next version bump.
      - name: Upload wheel_smoke.py artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cchardet-${{ env.CCHARDET_VERSION }}-smoke
          path: tools/wheel_smoke.py
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build cchardet ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CCHARDET_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cchardet-${{ env.CCHARDET_VERSION }}-sdist
          path: dist/

      - name: Download wheel_smoke.py
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cchardet-${{ env.CCHARDET_VERSION }}-smoke
          path: smoke/

      - name: Extract sdist and stage the wheel smoke test
        run: |
          mkdir pkg
          tar xzf dist/*.tar.gz --strip-components=1 -C pkg
          mkdir -p pkg/tools
          cp smoke/wheel_smoke.py pkg/tools/wheel_smoke.py

      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: pkg
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Mirrors upstream's own [tool.cibuildwheel] test-command/test-sources.
          # CIBW_TEST_SOURCES is relative to the cwd, not package-dir, hence "pkg/".
          CIBW_TEST_SOURCES: pkg/tools/wheel_smoke.py
          CIBW_TEST_COMMAND: python pkg/tools/wheel_smoke.py

      - name: Verify the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("cchardet/_cchardet") and n.endswith(".so") for n in names), names
          assert any(n.endswith(".dist-info/licenses/COPYING") for n in names), names
          print("ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cchardet-${{ matrix.version }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cchardet ${{ matrix.version }}
    needs: [setup, build_sdist, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cchardet-${{ matrix.version }}-*-manylinux_riscv64
