---
# This workflow is based on: https://github.com/inducer/pyopencl/blob/v2026.1.4/.github/workflows/wheels.yml
name: Build pyopencl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopencl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopencl.yml'
      - 'docs/packages/pyopencl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopencl.yml'
      - 'docs/packages/pyopencl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopencl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyopencl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyopencl"
      version: "${{ matrix.version }}"
      repository: "inducer/pyopencl"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "true"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy and siphash24 (via pytools) only have riscv64 wheels on our registry.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,siphash24"
      # Upstream runs no Linux tests (no OpenCL device in CI); smoke-test the import instead.
      cibw-test-command: "python -c \"import pyopencl, pyopencl._cl; assert pyopencl.VERSION_TEXT == '${{ matrix.version }}', pyopencl.VERSION_TEXT\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYOPENCL_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyopencl-${{ env.PYOPENCL_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          sos = sorted(n for n in names if ".so" in n.rsplit("/", 1)[-1])
          assert any(n.startswith("pyopencl/_cl.") for n in sos), sos
          assert any(n.startswith("pyopencl/.libs/libOpenCL-") for n in sos), sos
          licence = zipfile.ZipFile(path).read(
              next(n for n in names if n.endswith(".dist-info/licenses/LICENSE"))).decode()
          assert "ocl-icd" in licence, "ocl-icd licence missing"
          EOF

  publish:
    name: Publish pyopencl ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyopencl-${{ matrix.version }}-*-manylinux_riscv64
