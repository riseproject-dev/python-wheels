---
# This workflow is based on: https://github.com/inducer/pyopencl/blob/v2026.1.4/.github/workflows/wheels.yml
name: Build pyopencl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopencl.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopencl.yml'
      - 'docs/packages/pyopencl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopencl.yml'
      - 'docs/packages/pyopencl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopencl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyopencl ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: pyproject.toml skips cp31?t-* upstream.
        python: ["cp312", "cp313", "cp314"]

    env:
      PYOPENCL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyopencl v${{ env.PYOPENCL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: inducer/pyopencl
          ref: v${{ env.PYOPENCL_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy and siphash24 (via pytools) only have riscv64 wheels on our registry.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,siphash24
          # Upstream runs no Linux tests (no OpenCL device in CI); smoke-test the import instead.
          CIBW_TEST_COMMAND: >-
            python -c "import pyopencl, pyopencl._cl;
            assert pyopencl.VERSION_TEXT == '${{ env.PYOPENCL_VERSION }}', pyopencl.VERSION_TEXT"

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          sos = sorted(n for n in names if ".so" in n.rsplit("/", 1)[-1])
          assert any(n.startswith("pyopencl/_cl.") for n in sos), sos
          assert any(n.startswith("pyopencl/.libs/libOpenCL-") for n in sos), sos
          licence = zipfile.ZipFile(path).read(
              next(n for n in names if n.endswith(".dist-info/licenses/LICENSE"))).decode()
          assert "ocl-icd" in licence, "ocl-icd licence missing"
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyopencl-${{ env.PYOPENCL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyopencl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyopencl-${{ matrix.version }}-*-manylinux_riscv64
