---
# This workflow is based on: https://github.com/NoUnique/pymecab-ko/blob/v1.0.2/.github/workflows/manylinux/build.sh
name: Build mecab-ko wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mecab-ko.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-ko.yml'
      - 'docs/packages/mecab-ko.yaml'
      - 'patches/mecab-ko/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-ko.yml'
      - 'docs/packages/mecab-ko.yaml'
      - 'patches/mecab-ko/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mecab-ko
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mecab-ko ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mecab-ko"
      version: "${{ matrix.version }}"
      repository: "NoUnique/pymecab-ko"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py always links a system libmecab via mecab-config; build it
      # from NoUnique/mecab-ko (the fork this binding targets, per its own
      # Dockerfile/manylinux build script), same recipe as the sibling
      # mecab-python3 port's taku910/mecab build in this repo. Its
      # config.guess/config.sub predate riscv64, so swap in automake's copy.
      cibw-before-all-linux: |
        set -eux
        git clone --depth=1 https://github.com/NoUnique/mecab-ko.git /tmp/mecab-ko
        cd /tmp/mecab-ko/mecab
        cp /usr/share/automake-*/config.guess /usr/share/automake-*/config.sub .
        ./configure --enable-utf8-only
        make -j"$(nproc)"
        make install
        ldconfig
      # Mirrors upstream's test_artifacts job: install mecab-ko-dic (a
      # pure-Python dictionary package) so the suite exercises real
      # tokenization instead of skipping on "Not using mecab-ko-dic".
      cibw-test-requires: "pytest mecab-ko-dic"
      cibw-test-sources: "test"
      cibw-test-command: "pytest test"

  publish:
    name: Publish mecab-ko ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mecab-ko-${{ matrix.version }}-*-manylinux_riscv64
