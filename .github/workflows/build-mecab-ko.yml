---
# This workflow is based on: https://github.com/NoUnique/pymecab-ko/blob/v1.0.2/.github/workflows/manylinux/build.sh
name: Build mecab-ko wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mecab-ko.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-ko.yml'
      - 'docs/packages/mecab-ko.yaml'
      - 'patches/mecab-ko/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab-ko.yml'
      - 'docs/packages/mecab-ko.yaml'
      - 'patches/mecab-ko/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mecab-ko
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mecab-ko ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream builds no cp314t Linux wheel yet; the extension declares no
        # free-threading support either way, so cp314t just re-enables the GIL
        # on import (CLAUDE.md gotcha 127) rather than failing.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      MECAB_KO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mecab-ko ${{ env.MECAB_KO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NoUnique/pymecab-ko
          ref: v${{ env.MECAB_KO_VERSION }}
          fetch-depth: 0  # setuptools_scm derives the version from the tag
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch mecab-ko source
        run: git apply python-wheels/patches/mecab-ko/${{ env.MECAB_KO_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py always links a system libmecab via mecab-config; build it
          # from NoUnique/mecab-ko (the fork this binding targets, per its own
          # Dockerfile/manylinux build script), same recipe as the sibling
          # mecab-python3 port's taku910/mecab build in this repo. Its
          # config.guess/config.sub predate riscv64, so swap in automake's copy.
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            git clone --depth=1 https://github.com/NoUnique/mecab-ko.git /tmp/mecab-ko
            cd /tmp/mecab-ko/mecab
            cp /usr/share/automake-*/config.guess /usr/share/automake-*/config.sub .
            ./configure --enable-utf8-only
            make -j"$(nproc)"
            make install
            ldconfig
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Mirrors upstream's test_artifacts job: install mecab-ko-dic (a
          # pure-Python dictionary package) so the suite exercises real
          # tokenization instead of skipping on "Not using mecab-ko-dic".
          CIBW_TEST_REQUIRES: pytest mecab-ko-dic
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: pytest test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mecab-ko-${{ env.MECAB_KO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mecab-ko ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mecab-ko-${{ matrix.version }}-*-manylinux_riscv64
