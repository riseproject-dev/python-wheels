---
name: Build php2json wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/php2json.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-php2json.yml'
      - 'docs/packages/php2json.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-php2json.yml'
      - 'docs/packages/php2json.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: php2json
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build php2json ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: php2json
      version: ${{ matrix.version }}
      repository: mbachry/php2json
      ref: 8b528e49d1d20ff68e47693a48aaafa0e475a5d3
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream never pushed a git tag, so pin the release commit: its tree is
      # byte-identical to the 0.2 PyPI sdist (setup.cfg's egg_info stamps aside).
      # Update alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py's ext_modules lists php2json.pyx directly and never calls
      # cythonize() itself; setuptools only turns .pyx into .c at build_ext
      # time when Cython is importable. --no-build-isolation runs the build
      # in this same before-build environment rather than a fresh isolated
      # venv, so setuptools/wheel must be preinstalled here too (gotcha 23).
      cibw-before-build: pip install setuptools wheel cython
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: pytest
      cibw-test-command: python -m pytest {project}/tests -v
      timeout-minutes: 30

  publish:
    name: Publish php2json ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: php2json-${{ matrix.version }}-*-manylinux_riscv64
