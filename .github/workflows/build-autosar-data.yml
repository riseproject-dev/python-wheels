---
# This workflow is based on the `linux` job of
# https://github.com/DanielT/autosar-data-py/blob/v0.17.0/.github/workflows/CI.yml
# and the `linux` job of
# https://github.com/DanielT/autosar-data-py/blob/v0.17.0/.github/workflows/Test.yml
name: Build autosar-data wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/autosar-data.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-autosar-data.yml'
      - 'docs/packages/autosar-data.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autosar-data.yml'
      - 'docs/packages/autosar-data.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: autosar-data
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build autosar-data ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3, so one wheel per interpreter; pp311 is dropped (PyPy has no riscv64 port).
        python: ['cp312', 'cp313', 'cp314', 'cp314t']

    env:
      AUTOSAR_DATA_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout autosar-data-py v${{ env.AUTOSAR_DATA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: DanielT/autosar-data-py
          ref: v${{ env.AUTOSAR_DATA_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i ${{ steps.interp.outputs.value }}
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      - name: Install autosar-data
        run: |
          uv pip install autosar-data --no-index --find-links dist --force-reinstall
          uv pip install pytest

      - name: Test import
        run: |
          python -c "import autosar_data._autosar_data as m; assert m.__file__.endswith('.so'), m.__file__; print('Import successful')"

      - name: Run test suite
        run: pytest test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: autosar-data-${{ env.AUTOSAR_DATA_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish autosar-data ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: autosar-data-${{ matrix.version }}-*-manylinux_riscv64
