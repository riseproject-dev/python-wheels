---
# This workflow is based on: https://github.com/cmake-wheel/eigenpy/blob/v3.13.0.c0/.github/workflows/release.yml
name: Build eigenpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/eigenpy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-eigenpy.yml'
      - 'docs/packages/eigenpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-eigenpy.yml'
      - 'docs/packages/eigenpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: eigenpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build eigenpy ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cmeel-boost, a runtime dependency, has no cp314t wheel (upstream builds none either).
        python: ["cp312", "cp313", "cp314"]

    env:
      EIGENPY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout eigenpy v${{ env.EIGENPY_VERSION }}.c0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/eigenpy
          ref: v${{ env.EIGENPY_VERSION }}.c0
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy's newest release has no riscv64 wheel; the registry's must win over its sdist.
          CIBW_ENVIRONMENT: >-
            CMEEL_LOG_LEVEL="DEBUG" CMEEL_JOBS="1" CMEEL_TEST_JOBS="1"
            CMEEL_CMAKE_ARGS="-DBUILD_TESTING_SCIPY=OFF"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""
          CIBW_TEST_COMMAND: >-
            cd {project}/unittest/python &&
            for t in BDCSVD ComplexEigenSolver ComplexSchur EigenSolver FullPivLU
            GeneralizedEigenSolver GeneralizedSelfAdjointEigenSolver HessenbergDecomposition
            JacobiSVD LDLT LLT MINRES PartialPivLU QR RealQZ RealSchur
            SelfAdjointEigenSolver Tridiagonalization dimensions id version;
            do echo "test_$t.py" && python "test_$t.py" || exit 1; done

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("cmeel.prefix/lib/libeigenpy.so") for n in names), names
          assert any("/site-packages/eigenpy/eigenpy_pywrap" in n and n.endswith(".so") for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eigenpy-${{ env.EIGENPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish eigenpy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: eigenpy-${{ matrix.version }}-*-manylinux_riscv64
