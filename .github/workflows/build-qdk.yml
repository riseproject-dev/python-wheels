---
# microsoft/qdk pushes no git tag for a Python-package release (its `v*` tags track the
# compiler/CLI only, and the last one is v1.33.0): QDK_REF below is the commit a
# byte-for-byte diff against the released 1.33.1 wheel's pure-Python files pinpointed
# (CLAUDE.md gotcha 103/406) -- the only difference is qdk/telemetry.py's QSHARP_VERSION
# constant, which upstream's own (non-public) release pipeline substitutes the same way
# the "Set version" step below does.
name: Build qdk wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qdk.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qdk.yml'
      - 'docs/packages/qdk.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qdk.yml'
      - 'docs/packages/qdk.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qdk
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qdk ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      QDK_VERSION: ${{ matrix.version }}
      QDK_REF: 7c6a2b5116b30169d97567318bd84d50cc6ee19b

    steps:
      # Checkout root is the Cargo workspace root (qdk_package is one of its
      # members, like noisy_simulator/qsc/resource_estimator/...), not
      # source/qdk_package itself -- same shape as build-pyqir.yml/
      # build-rerun-sdk.yml for a workspace-member Python binding.
      - name: Checkout qdk ${{ env.QDK_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: microsoft/qdk
          ref: ${{ env.QDK_REF }}
          persist-credentials: false

      # Both pyproject.toml's [project] version and the workspace Cargo.toml's
      # [workspace.package] version are the literal placeholder "0.0.0" in the
      # public tree; upstream's own (non-public) release pipeline substitutes
      # the real version into both before building, same shape as
      # build-dataframely.yml. telemetry.py's QSHARP_VERSION constant gets the
      # same substitution (confirmed against the released wheel).
      - name: Set version
        run: |
          sed -i "s/^version = \"0.0.0\"\$/version = \"${QDK_VERSION}\"/" Cargo.toml
          sed -i "s/^version = \"0.0.0\"\$/version = \"${QDK_VERSION}\"/" source/qdk_package/pyproject.toml
          sed -i "s/QSHARP_VERSION = \"0.0.0.dev0\"/QSHARP_VERSION = \"${QDK_VERSION}\"/" source/qdk_package/qdk/telemetry.py

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: source/qdk_package
          output-dir: wheelhouse/
          # pyo3's abi3-py310 feature is on unconditionally for non-Windows
          # targets (source/qdk_package/Cargo.toml), matching upstream's own
          # single cp310-abi3 wheel. musllinux is dropped: rustup.rs ships no
          # riscv64 musl toolchain.
          only: cp310-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The repo root (our checkout root, the Cargo workspace root) holds
          # upstream's own dev helper named build.py, which shadows the `build`
          # module under cibuildwheel's default `python -m build` frontend
          # (cwd=/project; gotcha 102): it imports tomllib at module level,
          # which doesn't exist on cp310, so the build dies before maturin is
          # ever reached. pip is unaffected.
          CIBW_BUILD_FRONTEND: pip
          # qdk ships no [tool.cibuildwheel]; the Rust toolchain its maturin
          # backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # pyqir is qdk's only non-extra runtime dependency and has no public
          # riscv64 wheel; PIP_EXTRA_INDEX_URL above resolves it from our own
          # registry. The rest of test_requirements.txt (expecttest, ipython,
          # pandas, hypothesis, multiset) are all available from public PyPI
          # for riscv64 (pandas as a real wheel, the others py3-none-any). The
          # `ec` extra's own test deps (qodec, paulimer, binar) are not
          # installed -- tests/ec_tests already skips itself when they are
          # missing (test_requirements.txt's own comment).
          #
          # test_requirements.txt's own cirq-core==1.7.0 pin is also dropped:
          # it's transcribed correctly (confirmed against upstream's source at
          # QDK_REF) and the wheel is real on PyPI, but cirq-core has required
          # Python >=3.11 since 1.6.0, which can never resolve against this
          # job's cp310 interpreter (`only: cp310-manylinux_riscv64` above --
          # pip's error lists only pre-3.11-bump .dev snapshots as
          # "available"). Every test that imports cirq guards itself with
          # `pytest.importorskip("cirq")` (tests/qre/test_cirq_interop.py,
          # tests/applications/magnets/test_*.py), so omitting it just skips
          # those -- same self-skip shape as the already-excluded ec extra
          # deps above, not a test failure.
          CIBW_TEST_REQUIRES: >-
            pytest expecttest==0.3.0 ipython pyqir>=0.12.6,<0.13
            pandas>=2.1 hypothesis multiset
          # tests/test_check_api_surface.py does
          # `sys.path.append(str(Path(__file__).resolve().parents[1]))` then
          # `import check_api_surface` -- that script lives beside `tests/`
          # in source/qdk_package/, not inside it, so it must be staged
          # explicitly or the import 404s in the isolated test dir (gotcha
          # 25/28: CIBW_TEST_SOURCES must list every top-level file/dir the
          # suite imports from, not just the `tests` package itself). It's a
          # real check worth keeping (diffs the *installed* wheel's public
          # API against its own __all__ for private-type leakage, per its own
          # docstring/_import_root_package) and is stdlib-only, so staging it
          # adds no new CIBW_TEST_REQUIRES.
          # tests/test_qasm_stub_docs.py and tests/qre/test_dollar_cost.py read
          # non-Python fixtures straight off disk at paths resolved from their
          # own __file__ (never imported, so no shadowing risk -- gotcha 389):
          # the former diffs .pyi stub docstrings against runtime/Rust docs and
          # needs qdk/_native.pyi, qdk/openqasm/_native_syntax.pyi,
          # qdk/openqasm/_native_semantic.pyi and src/interpreter.rs; the latter
          # loads its JSON cost spec from the repo-root samples/ tree. Neither
          # path is under source/qdk_package/tests, so both 404 in the isolated
          # test_cwd unless staged explicitly (same CIBW_TEST_SOURCES gap as
          # check_api_surface.py below). samples/qre/... has no
          # source/qdk_package/ prefix because it lives above package-dir, at
          # the checkout root cibuildwheel stages test-sources relative to
          # (gotcha 104).
          CIBW_TEST_SOURCES: >-
            source/qdk_package/tests source/qdk_package/pyproject.toml
            source/qdk_package/check_api_surface.py
            source/qdk_package/qdk/_native.pyi
            source/qdk_package/qdk/openqasm/_native_syntax.pyi
            source/qdk_package/qdk/openqasm/_native_semantic.pyi
            source/qdk_package/src/interpreter.rs
            samples/qre/example_cost_spec.json
          CIBW_TEST_COMMAND: >-
            python -c "import qdk._native as m; assert m.__file__.endswith('.so'), m.__file__" &&
            cd source/qdk_package &&
            pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qdk-${{ env.QDK_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish qdk ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: qdk-${{ matrix.version }}-*-manylinux_riscv64
