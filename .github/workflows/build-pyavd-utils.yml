---
# This workflow is based on the `pyavd_utils_build_wheels` job of
# https://github.com/aristanetworks/pyavd-utils/blob/v0.0.7/.github/workflows/build-wheel.yml
name: Build pyavd-utils wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyavd-utils.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyavd-utils.yml'
      - 'docs/packages/pyavd-utils.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyavd-utils.yml'
      - 'docs/packages/pyavd-utils.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyavd-utils
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: [manylinux, musllinux]
    name: Build pyavd-utils ${{ matrix.version }} cp310-abi3-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240

    env:
      PYAVD_UTILS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyavd-utils v${{ env.PYAVD_UTILS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: aristanetworks/pyavd-utils
          ref: v${{ env.PYAVD_UTILS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: >-
            cp310-${{ matrix.platform }}_riscv64 cp311-${{ matrix.platform }}_riscv64
            cp312-${{ matrix.platform }}_riscv64 cp313-${{ matrix.platform }}_riscv64
            cp314-${{ matrix.platform }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # rust-toolchain.toml pins 1.95.0, which has no riscv64 musl host toolchain.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$HOME/.cargo/bin:$PATH"
            ${{ matrix.platform == 'musllinux' && 'RUSTUP_TOOLCHAIN=stable' || '' }}
          # Upstream's repair command also runs `pipx run abi3audit`; the image has no pipx.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest>=8.2.0
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyavd-utils-${{ env.PYAVD_UTILS_VERSION }}-cp310-abi3-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyavd-utils ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyavd-utils-${{ matrix.version }}-*_riscv64
