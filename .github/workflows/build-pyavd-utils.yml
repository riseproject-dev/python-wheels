---
# This workflow is based on the `pyavd_utils_build_wheels` job of
# https://github.com/aristanetworks/pyavd-utils/blob/v0.0.7/.github/workflows/build-wheel.yml
name: Build pyavd-utils wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyavd-utils.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyavd-utils.yml'
      - 'docs/packages/pyavd-utils.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyavd-utils.yml'
      - 'docs/packages/pyavd-utils.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyavd-utils
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: [manylinux, musllinux]
    name: Build pyavd-utils ${{ matrix.version }} cp310-abi3-${{ matrix.platform }}_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyavd-utils
      version: ${{ matrix.version }}
      repository: aristanetworks/pyavd-utils
      ref: v${{ matrix.version }}
      artifact-tag: cp310-abi3-${{ matrix.platform }}_riscv64
      cibw-build: >-
        cp310-${{ matrix.platform }}_riscv64 cp311-${{ matrix.platform }}_riscv64
        cp312-${{ matrix.platform }}_riscv64 cp313-${{ matrix.platform }}_riscv64
        cp314-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # rust-toolchain.toml pins 1.95.0, which has no riscv64 musl host toolchain.
      cibw-environment-linux: >-
        PATH="$HOME/.cargo/bin:$PATH"
        ${{ matrix.platform == 'musllinux' && 'RUSTUP_TOOLCHAIN=stable' || '' }}
      # Upstream's repair command also runs `pipx run abi3audit`; the image has no pipx.
      cibw-repair-wheel-command-linux: auditwheel repair -w {dest_dir} {wheel}
      cibw-test-requires: pytest>=8.2.0
      cibw-test-sources: tests
      cibw-test-command: python -m pytest tests
      timeout-minutes: 240

  publish:
    name: Publish pyavd-utils ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyavd-utils-${{ matrix.version }}-*_riscv64
