---
# This workflow is based on the `wheels` job of
# https://github.com/Kludex/pgtask/blob/v0.4.0/.github/workflows/ci.yml
name: Build pgtask wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pgtask.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pgtask.yml'
      - 'docs/packages/pgtask.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pgtask.yml'
      - 'docs/packages/pgtask.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pgtask
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pgtask ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # sdks/python/Cargo.toml carries pyo3/abi3-py310 unconditionally, so
          # one abi3 wheel serves every GIL-ful interpreter; pyo3 disables
          # abi3 under Py_GIL_DISABLED, giving the free-threaded build its
          # own wheel (gotcha 181).
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
            test_requires: pytest anyio 'psycopg[binary]'
          - tag: cp314t
            build: cp314t-manylinux_riscv64
            # psycopg-binary (the C driver behind the [binary] extra) has
            # never published a cp314t wheel on any platform; pgtask's own
            # runtime dependency is plain psycopg, which the test suite only
            # exercises through its pure-Python API.
            test_requires: pytest anyio psycopg

    env:
      PGTASK_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pgtask v${{ env.PGTASK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Kludex/pgtask
          ref: v${{ env.PGTASK_VERSION }}
          persist-credentials: false

      - name: Stage the licence beside pgtask's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory,
        # which in this workspace is sdks/python/ -- so upstream's published
        # wheels carry no licence text at all.
        run: cp LICENSE sdks/python/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: sdks/python
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pgtask ships no [tool.cibuildwheel]; the Rust toolchain its
          # maturin backend needs is installed in-container here, plus a
          # local PostgreSQL server for the test suite (upstream's own
          # `python` CI job gets one via a `services:` container,
          # unavailable here).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            dnf -y install postgresql-server &&
            install -d -o postgres -g postgres /run/postgresql /var/lib/pgsql/data &&
            su postgres -c "/usr/bin/initdb -A trust -D /var/lib/pgsql/data" &&
            su postgres -c "/usr/bin/pg_ctl -D /var/lib/pgsql/data -l /tmp/pg.log -o '-c listen_addresses=127.0.0.1' -w start" &&
            su postgres -c "/usr/bin/createuser -s pgtask" &&
            su postgres -c "/usr/bin/createdb -O pgtask pgtask"
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: ${{ matrix.test_requires }}
          CIBW_TEST_SOURCES: sdks/python/tests
          CIBW_TEST_ENVIRONMENT: PGTASK_DATABASE_URL=postgresql://pgtask:pgtask@127.0.0.1:5432/pgtask
          CIBW_TEST_COMMAND: >-
            python -c "import pgtask._native as m;
            assert m.__file__.endswith('.so'), m.__file__" &&
            cd sdks/python && python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pgtask-${{ env.PGTASK_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pgtask ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pgtask-${{ matrix.version }}-*-manylinux_riscv64
