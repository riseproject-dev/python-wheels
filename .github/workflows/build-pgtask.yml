---
# This workflow is based on the `wheels` job of
# https://github.com/Kludex/pgtask/blob/v0.4.0/.github/workflows/ci.yml
name: Build pgtask wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pgtask.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pgtask.yml'
      - 'docs/packages/pgtask.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pgtask.yml'
      - 'docs/packages/pgtask.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pgtask
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pgtask ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # `tag` must be a matrix vector: with only `include:` legs adding it,
        # the second leg overwrites the first and only cp314t is built
        # (gotcha 402).
        tag: [cp310-abi3, cp314t]
        include:
          # docs/packages/pgtask.yaml adds a 3.14t:manylinux slot to upstream's
          # single 3.10-abi3:manylinux target for the free-threaded wheel below.
          #
          # sdks/python/Cargo.toml carries pyo3/abi3-py310 unconditionally, so
          # one abi3 wheel serves every GIL-ful interpreter; pyo3 disables
          # abi3 under Py_GIL_DISABLED, giving the free-threaded build its
          # own wheel (gotcha 181).
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
            test_requires: pytest anyio 'psycopg[binary]'
          - tag: cp314t
            build: cp314t-manylinux_riscv64
            # psycopg-binary (the C driver behind the [binary] extra) has
            # never published a cp314t wheel on any platform; pgtask's own
            # runtime dependency is plain psycopg, which the test suite only
            # exercises through its pure-Python API.
            test_requires: pytest anyio psycopg

    # The tagged Cargo.toml still says 0.1.0; upstream's release.yml runs
    # scripts/set-release-version.sh before building. Only its workspace
    # and path-dependency version edits matter for the wheel (the rest
    # needs cargo/jq on the host and touches npm/helm files), so they are
    # repeated here. No --locked build, so Cargo.lock is refreshed in-build.
    # maturin globs LICEN[CS]E* relative to the pyproject directory,
    # which in this workspace is sdks/python/ -- so upstream's published
    # wheels carry no licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pgtask"
      version: "${{ matrix.version }}"
      repository: "Kludex/pgtask"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 180
      pre-build: |-
        export PGTASK_VERSION='${{ matrix.version }}'
        set -eux
        export PGTASK_RELEASE_VERSION="$PGTASK_VERSION"
        perl -0pi -e 's/(\[workspace\.package\].*?\nversion = ")[^"]*(")/$1$ENV{PGTASK_RELEASE_VERSION}$2/s' Cargo.toml
        for manifest in crates/*/Cargo.toml sdks/python/Cargo.toml; do
          perl -pi -e 's/^(pgtask[a-z-]* = \{ path = "[^"]*", version = ")[^"]*(")/$1$ENV{PGTASK_RELEASE_VERSION}$2/' "$manifest"
        done
        grep -q "^version = \"$PGTASK_VERSION\"" Cargo.toml

        cp LICENSE sdks/python/
      cibw-package-dir: "sdks/python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # pgtask ships no [tool.cibuildwheel]; the Rust toolchain its
      # maturin backend needs is installed in-container here, plus a
      # local PostgreSQL server for the test suite (upstream's own
      # `python` CI job gets one via a `services:` container,
      # unavailable here).
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        dnf -y install postgresql-server &&
        install -d -o postgres -g postgres /run/postgresql /var/lib/pgsql/data &&
        su postgres -c "/usr/bin/initdb -A trust -D /var/lib/pgsql/data" &&
        su postgres -c "/usr/bin/pg_ctl -D /var/lib/pgsql/data -l /tmp/pg.log -o '-c listen_addresses=127.0.0.1' -w start" &&
        su postgres -c "/usr/bin/createuser -s pgtask" &&
        su postgres -c "/usr/bin/createdb -O pgtask pgtask"
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "${{ matrix.test_requires }}"
      cibw-test-sources: "sdks/python/tests"
      cibw-test-environment: "PGTASK_DATABASE_URL=postgresql://pgtask:pgtask@127.0.0.1:5432/pgtask"
      cibw-test-command: >
        python -c "import pgtask._native as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        cd sdks/python && python -m pytest -v tests

  publish:
    name: Publish pgtask ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pgtask-${{ matrix.version }}-*-manylinux_riscv64
