---
# Validation-in-progress: this job only runs Blender's own `make deps` dependency
# stage (build_files/build_environment). The main Blender configure/compile/wheel
# stage (bpy_module.cmake onward) is not wired up yet -- see the PR description.
name: Build bpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bpy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bpy.yml'
      - 'docs/packages/bpy.yaml'
      - 'patches/bpy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bpy.yml'
      - 'docs/packages/bpy.yaml'
      - 'patches/bpy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bpy
      version: ${{ inputs.version }}

  build_environment:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bpy ${{ matrix.version }} build_environment manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 2880  # 48h: USD/OIIO/OpenVDB/OpenColorIO/Alembic/Draco/OpenSubdiv/FFmpeg from source
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      BPY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout blender v${{ env.BPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: blender/blender
          ref: v${{ env.BPY_VERSION }}
          sparse-checkout: |
            build_files/build_environment
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch build_environment for riscv64
        run: git apply python-wheels/patches/bpy/${{ env.BPY_VERSION }}/*.patch

      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      - name: Build build_environment
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
        run: |
          mkdir -p harvest
          docker run --rm -i --network=host \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e PIP_EXTRA_INDEX_URL \
            "${MANYLINUX_RISCV64_IMAGE}" \
            bash <<'SCRIPT'
          set -eux

          dnf install -y --setopt=install_weak_deps=False \
            autoconf automake libtool bison flex ninja-build meson \
            gettext texinfo help2man pkgconf-pkg-config tcl \
            python3-mako zip openssl-devel

          # check_software.cmake requires both unconditionally (no riscv64/arch gate,
          # unlike the deps the riscv64 patch skips), but neither is installable via
          # dnf here. patchelf needs EPEL, which the image disables for riscv64
          # (CLAUDE.md gotcha 51); install the riscv64 wheel we already publish
          # instead (docs/packages/patchelf.yaml). yasm has no riscv64 package in any
          # Rocky 10 repo and no real PyPI wheel either; build it from its official,
          # pre-generated-configure release tarball (it's portable C, no x86-only host
          # code, so it builds fine as a riscv64 host tool even though its output is
          # x86 machine code).
          /opt/python/cp312-cp312/bin/pip install --quiet patchelf==0.17.2.2
          ln -s /opt/python/cp312-cp312/bin/patchelf /usr/local/bin/patchelf

          curl -fsSL -o /tmp/yasm.tar.gz \
            https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0.tar.gz
          mkdir -p /tmp/yasm-src
          tar -C /tmp/yasm-src --strip-components=1 -xzf /tmp/yasm.tar.gz
          ( cd /tmp/yasm-src && ./configure --prefix=/usr/local && make -j"$(nproc)" && make install )

          export SOURCE_DATE_EPOCH=1745584760
          cmake -S build_files/build_environment -B deps_build \
            -DHARVEST_TARGET=/work/harvest
          build_files/build_environment/linux/make_deps_wrapper.sh -s \
            -C deps_build -j"$(nproc)" install
          SCRIPT

      - name: Pack build_environment's harvest tree
        run: tar -C harvest -czf build-environment.tar.gz .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bpy-${{ env.BPY_VERSION }}-build-environment
          path: build-environment.tar.gz
          if-no-files-found: error
