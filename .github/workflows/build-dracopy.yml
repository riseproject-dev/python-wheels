---
# This workflow is based on the `build_wheels` job of
# https://github.com/seung-lab/DracoPy/blob/2.0.0/.github/workflows/build_aarch64.yml
name: Build dracopy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dracopy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dracopy.yml'
      - 'docs/packages/dracopy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dracopy.yml'
      - 'docs/packages/dracopy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream never tagged the 2.1.0 release; e6b3449 is master's tip, proven
  # byte-identical to the PyPI 2.1.0 sdist. Move together.
  DRACOPY_REF: e6b344903e58cc0f080675c652b6ea9bd2d72462
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dracopy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dracopy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dracopy"
      version: "${{ matrix.version }}"
      repository: "seung-lab/DracoPy"
      ref: "e6b344903e58cc0f080675c652b6ea9bd2d72462"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Mirrors upstream's own CIBW_BEFORE_BUILD (build_aarch64.yml); the
      # submodule is already present via `submodules: recursive` above, so
      # the `git submodule` calls upstream runs here are dropped. cmake and
      # cython are setup.py setup_requires, not pyproject.toml build-system
      # requires, so they need to already be importable/on PATH before
      # setup.py runs, isolated build or not.
      cibw-before-build: "pip install \"cmake>=3.30.2\" cython numpy scikit-build setuptools wheel"
      # numpy and cmake have riscv64 wheels only on our registry.
      cibw-test-requires: "pytest numpy"
      cibw-test-sources: "tests.py pytest.ini testdata_files"
      cibw-test-command: "cd {project} && python -m pytest -v tests.py"
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DRACOPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dracopy-${{ env.DRACOPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert exts and all("DracoPy" in n for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish dracopy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dracopy-${{ matrix.version }}-*-manylinux_riscv64
