---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-zlib/blob/v1.3.2.c0/.github/workflows/release.yml
name: Build cmeel-zlib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-zlib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-zlib.yml'
      - 'docs/packages/cmeel-zlib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-zlib.yml'
      - 'docs/packages/cmeel-zlib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-zlib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-zlib ${{ matrix.version }} manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cmeel-zlib"
      version: "${{ matrix.version }}"
      repository: "cmake-wheel/cmeel-zlib"
      ref: "v${{ matrix.version }}.c0"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 120
      checkout-submodules: "true"
      cibw-build: "cp312-manylinux_riscv64"
      cibw-environment-linux: "CMEEL_LOG_LEVEL=DEBUG"
      # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets itself.
      cibw-repair-wheel-command: ''

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      CMEEL_ZLIB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cmeel-zlib-${{ env.CMEEL_ZLIB_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib64/libz.so.1.3.2" in names, names
          assert "cmeel.prefix/include/zlib.h" in names, names
          EOF

      - name: Smoke-test the built library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q wheelhouse/*.whl
          python3 -c "
          import ctypes, pathlib, sysconfig
          lib = pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix/lib64/libz.so'
          z = ctypes.CDLL(str(lib))
          z.zlibVersion.restype = ctypes.c_char_p
          assert z.zlibVersion() == b'1.3.2', z.zlibVersion()
          raw = b'riscv64 ' * 4096
          buf = ctypes.create_string_buffer(len(raw) * 2)
          size = ctypes.c_ulong(len(buf))
          assert z.compress2(buf, ctypes.byref(size), raw, len(raw), 9) == 0
          out = ctypes.create_string_buffer(len(raw))
          outsize = ctypes.c_ulong(len(out))
          assert z.uncompress(out, ctypes.byref(outsize), buf, size) == 0
          assert out.raw[:outsize.value] == raw
          print(lib, z.zlibVersion(), size.value)
          "

  publish:
    name: Publish cmeel-zlib ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-zlib-${{ matrix.version }}-py3-none-manylinux_riscv64
