---
# This workflow is based on:
#   https://github.com/nexB/scancode-plugins/blob/v21.5.31/builtins/typecode_libmagic-linux/setup.py
name: Build typecode-libmagic wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typecode-libmagic.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typecode-libmagic.yml'
      - 'docs/packages/typecode-libmagic.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typecode-libmagic.yml'
      - 'docs/packages/typecode-libmagic.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typecode-libmagic
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build typecode-libmagic ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    steps:
      # scancode-plugins is a monorepo with no per-package release tags; its
      # date-based repo tags don't derive from the PyPI version algorithmically,
      # so the mapping is a small explicit table instead.
      - name: Resolve the scancode-plugins tag for ${{ matrix.version }}
        run: |
          case "${{ matrix.version }}" in
            5.39.210531) echo "SCANCODE_PLUGINS_TAG=v21.5.31" >> "$GITHUB_ENV" ;;
            *) echo "::error::no scancode-plugins tag known for typecode-libmagic ${{ matrix.version }}"; exit 1 ;;
          esac

      - name: Checkout scancode-plugins ${{ env.SCANCODE_PLUGINS_TAG }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nexB/scancode-plugins
          ref: ${{ env.SCANCODE_PLUGINS_TAG }}
          persist-credentials: false

      # Upstream has no riscv64 build at all: its Linux variant just repackages
      # a prebuilt x86_64 Homebrew bottle of libmagic (no Homebrew riscv64 bottle
      # exists). We instead build libmagic from the exact upstream `file` release
      # tarball typecode-libmagic.ABOUT itself names, and drop the result in place
      # of the bundled x86_64 binaries before packaging the wheel the same way
      # upstream's own setup.cfg release alias does (hand-set --plat-name/--python-tag,
      # not a compiled-extension tag; see pylibmagic for the same libmagic-on-riscv64
      # shape already published from this repo).
      - name: Build libmagic and package the wheel
        run: |
          docker run --rm \
            -v "$(pwd)":/workspace \
            --workdir /workspace/builtins/typecode_libmagic-linux \
            "${{ env.MANYLINUX_RISCV64_IMAGE }}" \
            bash -c '
              set -euxo pipefail
              curl -fsSL --retry 5 -o /tmp/file-5.39.tar.gz https://astron.com/pub/file/file-5.39.tar.gz
              echo "a5a8941a8e4c436fe22933db6a71c5161c3fb10b  /tmp/file-5.39.tar.gz" | sha1sum -c -
              tar xzf /tmp/file-5.39.tar.gz -C /tmp
              cd /tmp/file-5.39
              ./configure --prefix=/tmp/file-install --libdir=/tmp/file-install/lib --datadir=/tmp/file-install/share
              make -j"$(nproc)"
              make install
              cd /workspace/builtins/typecode_libmagic-linux
              cp /tmp/file-install/lib/libmagic.so.1.0.0 src/typecode_libmagic/lib/libmagic.so
              rm -f src/typecode_libmagic/lib/libz-lm539.so.1
              cp /tmp/file-install/share/misc/magic.mgc src/typecode_libmagic/data/magic.mgc
              /opt/python/cp312-cp312/bin/python -m pip install -q wheel setuptools
              /opt/python/cp312-cp312/bin/python setup.py bdist_wheel --plat-name manylinux_2_39_riscv64
            '

      - name: Verify the wheel ships the riscv64 libmagic.so
        run: |
          python3 - builtins/typecode_libmagic-linux/dist/*.whl <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              so_name = next(n for n in names if n.endswith("typecode_libmagic/lib/libmagic.so"))
              header = zf.read(so_name)[:20]
              assert header[:4] == b"\x7fELF", header
              assert header[18] == 0xF3, header  # e_machine == EM_RISCV
              assert not any(n.endswith("lib/libz-lm539.so.1") for n in names), names
              assert any(n.endswith("typecode_libmagic/data/magic.mgc") for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: typecode-libmagic-${{ matrix.version }}-py3-none-manylinux_riscv64
          path: builtins/typecode_libmagic-linux/dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test typecode-libmagic ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: typecode-libmagic-${{ matrix.version }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install the wheel
        run: uv pip install --reinstall --no-index --find-links wheelhouse typecode-libmagic

      - name: Load libmagic and run a real file-type lookup
        run: |
          python -c "
          import ctypes, importlib.util, os

          spec = importlib.util.find_spec('typecode_libmagic')
          base = os.path.dirname(spec.origin)
          dll = os.path.join(base, 'lib', 'libmagic.so')
          db = os.path.join(base, 'data', 'magic.mgc')

          lib = ctypes.CDLL(dll)
          lib.magic_open.restype = ctypes.c_void_p
          cookie = lib.magic_open(0)
          assert lib.magic_load(ctypes.c_void_p(cookie), db.encode()) == 0, lib.magic_error(ctypes.c_void_p(cookie))
          lib.magic_file.restype = ctypes.c_char_p
          result = lib.magic_file(ctypes.c_void_p(cookie), b'/bin/ls')
          print('magic_file(/bin/ls):', result)
          assert result is not None and b'ELF' in result and b'64-bit' in result, result
          print('OK')
          "

  publish:
    name: Publish typecode-libmagic ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: typecode-libmagic-${{ matrix.version }}-py3-none-manylinux_riscv64
