name: Check top PyPI packages for riscv64 wheels

on:
  schedule:
    - cron: '0 2 2 * *'
  workflow_dispatch:
  push:
    paths:
      - 'ci_scripts/pypi_riscv64_check.py'
      - '.github/workflows/pypi-riscv64-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  pypi_riscv64_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3'

      - name: Run riscv64 wheel check and open issues for new gaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci_scripts/pypi_riscv64_check.py --create-issues
