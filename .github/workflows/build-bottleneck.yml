---
# This workflow is based on: https://github.com/pydata/bottleneck/blob/v1.6.0/.github/workflows/ci.yml
name: Build bottleneck wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bottleneck version to build (git tag without leading v, e.g. 1.6.0)'
        required: true
        default: '1.6.0'
  pull_request:
    paths:
      - '.github/workflows/build-bottleneck.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.6.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.6.0 there.
  BOTTLENECK_VERSION: ${{ inputs.version || '1.6.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build bottleneck ${{ inputs.version || '1.6.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the extensions link the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout bottleneck v${{ env.BOTTLENECK_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: pydata/bottleneck
          ref: v${{ env.BOTTLENECK_VERSION }}
          fetch-depth: 0  # versioneer derives the version from `git describe`
          persist-credentials: false

      # The wheel compiles code taken from NumPy and ships a SciPy-derived module,
      # but only bottleneck's own LICENSE reaches it; the root is where setuptools
      # looks for licence files.
      - name: Stage licences of incorporated projects
        run: |
          cp LICENSES/NUMPY_LICENSE LICENSE.numpy
          cp LICENSES/SCIPY_LICENSE LICENSE.scipy

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is both a build and a runtime requirement, and only our registry
          # has it for riscv64; only-binary keeps a newer PyPI release from winning
          # the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest
          # pyproject.toml carries the pytest config upstream runs with.
          CIBW_TEST_SOURCES: pyproject.toml
          CIBW_TEST_COMMAND: python -m pytest --pyargs bottleneck

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"move", "nonreduce", "nonreduce_axis", "reduce"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n}
          assert {"LICENSE", "LICENSE.numpy", "LICENSE.scipy"} <= licences, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bottleneck-${{ env.BOTTLENECK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bottleneck ${{ inputs.version || '1.6.0' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: bottleneck-${{ env.BOTTLENECK_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
