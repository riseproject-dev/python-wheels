---
# This workflow is based on: https://github.com/pydata/bottleneck/blob/v1.6.0/.github/workflows/ci.yml
name: Build bottleneck wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bottleneck.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bottleneck.yml'
      - 'docs/packages/bottleneck.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bottleneck.yml'
      - 'docs/packages/bottleneck.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bottleneck
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bottleneck ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the extensions link the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      BOTTLENECK_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout bottleneck v${{ env.BOTTLENECK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pydata/bottleneck
          ref: v${{ env.BOTTLENECK_VERSION }}
          fetch-depth: 0  # versioneer derives the version from `git describe`
          persist-credentials: false

      # The wheel compiles code taken from NumPy and ships a SciPy-derived module,
      # but only bottleneck's own LICENSE reaches it; the root is where setuptools
      # looks for licence files.
      - name: Stage licences of incorporated projects
        run: |
          cp LICENSES/NUMPY_LICENSE LICENSE.numpy
          cp LICENSES/SCIPY_LICENSE LICENSE.scipy

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is both a build and a runtime requirement, and only our registry
          # has it for riscv64; only-binary keeps a newer PyPI release from winning
          # the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest
          # pyproject.toml carries the pytest config upstream runs with.
          CIBW_TEST_SOURCES: pyproject.toml
          CIBW_TEST_COMMAND: python -m pytest --pyargs bottleneck

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"move", "nonreduce", "nonreduce_axis", "reduce"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n}
          assert {"LICENSE", "LICENSE.numpy", "LICENSE.scipy"} <= licences, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bottleneck-${{ env.BOTTLENECK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bottleneck ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: bottleneck-${{ matrix.version }}-*-manylinux_riscv64
