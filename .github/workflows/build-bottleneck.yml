---
# This workflow is based on: https://github.com/pydata/bottleneck/blob/v1.6.0/.github/workflows/ci.yml
name: Build bottleneck wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bottleneck.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bottleneck.yml'
      - 'docs/packages/bottleneck.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bottleneck.yml'
      - 'docs/packages/bottleneck.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bottleneck
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bottleneck ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "bottleneck"
      version: "${{ matrix.version }}"
      repository: "pydata/bottleneck"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-fetch-depth: 0
      pre-build: |-
        cp LICENSES/NUMPY_LICENSE LICENSE.numpy
        cp LICENSES/SCIPY_LICENSE LICENSE.scipy

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is both a build and a runtime requirement, and only our registry
      # has it for riscv64; only-binary keeps a newer PyPI release from winning
      # the resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest"
      # pyproject.toml carries the pytest config upstream runs with.
      cibw-test-sources: "pyproject.toml"
      cibw-test-command: "python -m pytest --pyargs bottleneck"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BOTTLENECK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bottleneck-${{ env.BOTTLENECK_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"move", "nonreduce", "nonreduce_axis", "reduce"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n}
          assert {"LICENSE", "LICENSE.numpy", "LICENSE.scipy"} <= licences, licences
          EOF

  publish:
    name: Publish bottleneck ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bottleneck-${{ matrix.version }}-*-manylinux_riscv64
