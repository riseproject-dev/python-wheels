---
# keeper-mlkem's PyPI project_urls point at Keeper-Security/commander-qrc, which answers 404
# to an unauthenticated fetch and to an authenticated GitHub App check alike (gotcha 156
# shape: no checkout to build from, no upstream CI to mirror), so the released sdist is
# fetched directly, same as build-lmnr-claude-code-proxy.yml.
name: Build keeper-mlkem wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/keeper-mlkem.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-keeper-mlkem.yml'
      - 'docs/packages/keeper-mlkem.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-keeper-mlkem.yml'
      - 'docs/packages/keeper-mlkem.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: keeper-mlkem
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build keeper-mlkem ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      MLKEM_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch keeper-mlkem ${{ env.MLKEM_VERSION }} sdist
        run: |
          url="$(curl -sSfL "https://pypi.org/pypi/keeper-mlkem/${MLKEM_VERSION}/json" \
            | python3 -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"))')"
          curl -sSfL -o sdist.tar.gz "$url"
          tar xzf sdist.tar.gz
          test -f "keeper_mlkem-${MLKEM_VERSION}/pyproject.toml"

      - name: Stage smoke tests
        run: |
          mkdir -p tests
          cat > tests/test_mlkem.py <<'PYTEST'
          """Smoke tests for the riscv64 keeper-mlkem wheel.

          Upstream ships no test suite, so these exercise the compiled C extension
          directly through a full ML-KEM key-gen/encaps/decaps round trip at each of
          the three FIPS 203 parameter sets.
          """

          import mlkem.fastmath as fastmath
          from mlkem import ML_KEM, MLKEM_512_PARAMETERS, MLKEM_768_PARAMETERS, MLKEM_1024_PARAMETERS


          def test_extension_module_is_compiled():
              assert fastmath.__file__.endswith(".so"), fastmath.__file__


          def _roundtrip(parameters):
              kem = ML_KEM(parameters)
              encapsulation_key, decapsulation_key = kem.key_gen()
              shared_secret, ciphertext = kem.encaps(encapsulation_key)
              recovered_secret = kem.decaps(decapsulation_key, ciphertext)
              assert shared_secret == recovered_secret


          def test_roundtrip_mlkem_512():
              _roundtrip(MLKEM_512_PARAMETERS)


          def test_roundtrip_mlkem_768():
              _roundtrip(MLKEM_768_PARAMETERS)


          def test_roundtrip_mlkem_1024():
              _roundtrip(MLKEM_1024_PARAMETERS)


          def test_decaps_implicit_rejection_on_tampered_ciphertext():
              kem = ML_KEM(MLKEM_768_PARAMETERS)
              encapsulation_key, decapsulation_key = kem.key_gen()
              shared_secret, ciphertext = kem.encaps(encapsulation_key)
              tampered = bytes([ciphertext[0] ^ 0x01]) + ciphertext[1:]
              rejected_secret = kem.decaps(decapsulation_key, tampered)
              assert rejected_secret != shared_secret
          PYTEST

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          package-dir: keeper_mlkem-${{ env.MLKEM_VERSION }}
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v tests

      - name: Check the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert len(sos) == 1, names
          print("extension:", sos[0])
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: keeper-mlkem-${{ env.MLKEM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish keeper-mlkem ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: keeper-mlkem-${{ matrix.version }}-*-manylinux_riscv64
