---
# pyproject.toml's own [tool.cibuildwheel] table (build-command, cmake defines, the
# cp312-cp314t matrix, the forcefield/obabel test-command) is used as-is apart from the
# patch below; only the riscv64 image and the Linux native deps (replacing the
# manylinux2014 before-all at
# https://github.com/njzjz/openbabel-wheel/blob/v3.1.1.23/pyproject.toml) are overridden
# here.
name: Build openbabel-wheel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openbabel-wheel.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openbabel-wheel.yml'
      - 'docs/packages/openbabel-wheel.yaml'
      - 'patches/openbabel-wheel/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openbabel-wheel.yml'
      - 'docs/packages/openbabel-wheel.yaml'
      - 'patches/openbabel-wheel/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  RAPIDJSON_REV: 24b5e7a8b27f42fa16b96fc70aade9106cf7102f

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openbabel-wheel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build openbabel-wheel ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "openbabel-wheel"
      version: "${{ matrix.version }}"
      repository: "njzjz/openbabel-wheel"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # manylinux2014's cairo-devel is too old for OpenBabel's depiction code,
      # which is why upstream builds cairo 1.15.14 from source instead; Rocky 10
      # (this image) ships a current one, so installing it directly is simpler
      # and the other libraries it names (freetype/libpng/pixman) come in as its
      # dependencies. Rocky 10 packages no RapidJSON, so OpenBabel would download the
      # 1.1.0 release, whose GenericStringRef::operator= assigns its const length member
      # (a hard error under GCC 14); its find_package(RapidJSON) picks up a master
      # revision's headers from /usr/include instead.
      cibw-before-all-linux: "dnf install -y libxml2-devel zlib-devel cairo-devel && curl -fsSL https://github.com/Tencent/rapidjson/archive/24b5e7a8b27f42fa16b96fc70aade9106cf7102f.tar.gz | tar xz -C /tmp && cp -r /tmp/rapidjson-24b5e7a8b27f42fa16b96fc70aade9106cf7102f/include/rapidjson /usr/include/"
      # The FetchContent'd OpenBabel's obutil.h calls clock() without <ctime>, which GCC 14's
      # libstdc++ no longer includes transitively (openbabel master now includes it directly).
      # The patched tree would otherwise get a dirty setuptools_scm version (gotcha 31).
      cibw-environment-linux: "CXXFLAGS=\"-include ctime\" SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OPENBABEL_WHEEL=${{ matrix.version }}"

  publish:
    name: Publish openbabel-wheel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: openbabel-wheel-${{ matrix.version }}-*-manylinux_riscv64
