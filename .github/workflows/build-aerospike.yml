---
# This workflow is based on the manylinux build path of upstream's own
# _build-wheel-natively.bash/build-wheel.bash (they build in a custom manylinux_2_28
# image with a hand-built OpenSSL baked in; we use the standard riscv64 image instead).
name: Build aerospike wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aerospike.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aerospike.yml'
      - 'docs/packages/aerospike.yaml'
      - 'patches/aerospike/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aerospike.yml'
      - 'docs/packages/aerospike.yaml'
      - 'patches/aerospike/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aerospike
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aerospike ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "aerospike"
      version: "${{ matrix.version }}"
      repository: "aerospike/aerospike-client-python"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # libyaml-devel is CRB-only, not EPEL (gotcha 51 doesn't apply); openssl-devel
      # is in AppStream. Both resolve on riscv64, matching upstream's own yum install.
      cibw-before-all-linux: "dnf install -y libyaml-devel openssl-devel"
      # Real Aerospike server is out of scope; instead prove the extension is
      # compiled and client() exercises the real C cluster-init code path (the one
      # the riscv64 as_arch_pause patch touches), failing fast against a closed port.
      cibw-test-command: |
        python3 - <<'PYEOF'
        import aerospike
        from aerospike import exception
        import aerospike_helpers
        from aerospike_helpers import expressions
        from aerospike_helpers.operations import operations
        assert aerospike.__file__.endswith('.so'), aerospike.__file__
        try:
            aerospike.client({'hosts': [('127.0.0.1', 13000)], 'policies': {'timeout': 1000}})
            raise SystemExit('expected a ConnectionError connecting to a closed port')
        except exception.ConnectionError:
            pass
        PYEOF

  publish:
    name: Publish aerospike ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aerospike-${{ matrix.version }}-*-manylinux_riscv64
