---
# Based on the `build_wheels_linux_*` jobs of
# https://github.com/ashvardanian/SimSIMD/blob/v6.5.16/.github/workflows/release.yml
name: Build simsimd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'simsimd version to build (git tag without the leading v, e.g. 6.5.16)'
        required: true
        default: '6.5.16'
  pull_request:
    paths:
      - '.github/workflows/build-simsimd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '6.5.16' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SIMSIMD_VERSION: ${{ inputs.version || '6.5.16' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build simsimd ${{ inputs.version || '6.5.16' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout simsimd v${{ env.SIMSIMD_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ashvardanian/SimSIMD
          ref: v${{ env.SIMSIMD_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Replaces upstream's `environment` table, which only sets SIMSIMD_IN_QEMU
          # to skip half-precision and complex tests: we build on real hardware.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("simsimd.cpython-") and n.endswith(".so") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simsimd-${{ env.SIMSIMD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # simsimd is built with -fopenmp, so auditwheel vendors the image's libgomp
      # into simsimd.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simsimd-${{ env.SIMSIMD_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish simsimd ${{ inputs.version || '6.5.16' }} to GitLab
    needs: [setup, build_wheels, gpl_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: simsimd-${{ env.SIMSIMD_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gpl-sources-artifact: simsimd-${{ env.SIMSIMD_VERSION }}-gpl-sources
          gpl-sources-release-tag: simsimd-v${{ env.SIMSIMD_VERSION }}
          gpl-sources-description: gcc
