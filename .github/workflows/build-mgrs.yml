---
# This workflow is based on: https://github.com/hobuinc/mgrs/blob/1.5.4/.github/workflows/deploy.yml
name: Build mgrs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mgrs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mgrs.yml'
      - 'docs/packages/mgrs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mgrs.yml'
      - 'docs/packages/mgrs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mgrs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mgrs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mgrs
      version: ${{ matrix.version }}
      repository: hobuinc/mgrs
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream ships this commented out; tests/test.txt is a doctest that
      # pytest's default --doctest-glob (test*.txt) already picks up.
      cibw-test-requires: pytest
      # Stage only tests/ and benchmarks/ (as upstream's own test-sources does; from
      # 1.6.0 several tests import `benchmarks`), not the checkout's own mgrs/
      # package, or `import mgrs` in the doctest resolves to the checkout instead
      # of the installed wheel. `python -m pytest` puts the staged cwd on sys.path.
      cibw-test-sources: tests benchmarks
      cibw-test-command: python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish mgrs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mgrs-${{ matrix.version }}-*-manylinux_riscv64
