---
# This workflow is based on: https://github.com/anyoptimization/pymoo/blob/0.6.2/.github/workflows/build.yml
name: Build pymoo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymoo.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymoo.yml'
      - 'docs/packages/pymoo.yaml'
      - 'patches/pymoo/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymoo.yml'
      - 'docs/packages/pymoo.yaml'
      - 'patches/pymoo/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymoo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymoo ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's own CIBW_SKIP: "*t-*" - pymoo does not build free-threaded
        # wheels itself, so cp314t is dropped here too.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      PYMOO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pymoo ${{ env.PYMOO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anyoptimization/pymoo
          ref: ${{ env.PYMOO_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build-time requirement (setup.py's numpy.get_include()); only
          # our registry has it for riscv64, and only-binary keeps a newer PyPI
          # release from winning resolution and compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # Test phase only: force wheels-only for the full runtime dependency
          # resolution (scipy, matplotlib and its own compiled deps - Pillow,
          # contourpy, kiwisolver, fonttools - and moocore), so a newer PyPI release
          # without a riscv64 wheel fails fast instead of compiling from sdist (this
          # is how Pillow's missing libjpeg headers broke the cp311 test-install).
          CIBW_TEST_ENVIRONMENT: "PIP_ONLY_BINARY=:all:"
          # Mirrors upstream's own wheel test (build.yml's CIBW_TEST_COMMAND): proves
          # the Cython extensions actually compiled rather than just importing pymoo.
          CIBW_TEST_COMMAND: >-
            python -c "import sys; import pymoo; print(pymoo); from pymoo.functions import is_compiled; sys.exit(0 if is_compiled() else 42)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymoo-${{ env.PYMOO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pymoo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pymoo-${{ matrix.version }}-*-manylinux_riscv64
