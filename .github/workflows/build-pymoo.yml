---
# This workflow is based on: https://github.com/anyoptimization/pymoo/blob/0.6.2/.github/workflows/build.yml
name: Build pymoo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymoo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymoo.yml'
      - 'docs/packages/pymoo.yaml'
      - 'patches/pymoo/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymoo.yml'
      - 'docs/packages/pymoo.yaml'
      - 'patches/pymoo/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymoo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymoo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pymoo
      version: ${{ matrix.version }}
      repository: anyoptimization/pymoo
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy is a build-time requirement (setup.py's numpy.get_include()); only
      # our registry has it for riscv64, and only-binary keeps a newer PyPI
      # release from winning resolution and compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      # Test phase only: force wheels-only for the full runtime dependency
      # resolution (scipy, matplotlib and its own compiled deps - Pillow,
      # contourpy, kiwisolver, fonttools - and moocore), so a newer PyPI release
      # without a riscv64 wheel fails fast instead of compiling from sdist (this
      # is how Pillow's missing libjpeg headers broke the cp311 test-install).
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      # Mirrors upstream's own wheel test (build.yml's CIBW_TEST_COMMAND): proves
      # the Cython extensions actually compiled rather than just importing pymoo.
      cibw-test-command: >-
        python -c "import sys; import pymoo; print(pymoo); from pymoo.functions import is_compiled; sys.exit(0 if is_compiled() else 42)"
      timeout-minutes: 120

  publish:
    name: Publish pymoo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymoo-${{ matrix.version }}-*-manylinux_riscv64
