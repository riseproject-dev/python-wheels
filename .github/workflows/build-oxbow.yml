---
# This workflow is based on the `linux` job of
# https://github.com/abdenlab/oxbow/blob/py-oxbow@v0.8.2/.github/workflows/release-python.yml
name: Build oxbow wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/oxbow.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-oxbow.yml'
      - 'docs/packages/oxbow.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oxbow.yml'
      - 'docs/packages/oxbow.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: oxbow
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build oxbow ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "oxbow"
      version: "${{ matrix.version }}"
      repository: "abdenlab/oxbow"
      ref: "py-oxbow@v${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 120
      pre-build: |-
        cp LICENSE-MIT LICENSE-APACHE py-oxbow/
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "py-oxbow"
      # abi3-py39 is fixed in py-oxbow/Cargo.toml, so one build serves
      # every interpreter; built on cp312 (the oldest in our matrix) and
      # re-tested on the newer ones via find_compatible_wheel. No
      # cp314t: pyo3's abi3 feature predates PEP 703 free-threading.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # oxbow ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,arro3-core,duckdb"
      cibw-test-requires: "pytest pytest-manifest cloudpickle debugpy dask[dataframe] duckdb"
      cibw-test-sources: "py-oxbow/tests fixtures"
      # tests/data links to ../../fixtures; PYTHONPATH=.. serves `from tests.utils` as upstream's editable install does.
      cibw-test-command: "cd py-oxbow/tests && PYTHONPATH=.. python -m pytest -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      OXBOW_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oxbow-${{ env.OXBOW_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extension and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          print("\n".join(sos))
          assert any("oxbow" in n for n in sos), sos

          lic = sorted(n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          assert {"LICENSE-MIT", "LICENSE-APACHE"} <= set(lic), lic
          EOF

  publish:
    name: Publish oxbow ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: oxbow-${{ matrix.version }}-*-manylinux_riscv64
