---
# This workflow is based on the `build_wheels` job of
# https://github.com/tobgu/pyrsistent/blob/v0.20.0/.github/workflows/build.yml
name: Build pyrsistent wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrsistent.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrsistent.yml'
      - 'docs/packages/pyrsistent.yaml'
      - 'patches/pyrsistent/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrsistent.yml'
      - 'docs/packages/pyrsistent.yaml'
      - 'patches/pyrsistent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrsistent
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyrsistent ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: upstream publishes no free-threaded wheel, and pvectorc uses
        # single-phase module init, so importing it re-enables the GIL anyway.
        python: ["cp312", "cp313", "cp314"]

    env:
      PYRSISTENT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyrsistent v${{ env.PYRSISTENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tobgu/pyrsistent
          ref: v${{ env.PYRSISTENT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pyrsistent source
        run: git apply python-wheels/patches/pyrsistent/${{ env.PYRSISTENT_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream pins `pytest==6.* hypothesis==6.*`, which predates CPython 3.12
          # and dies collecting the suite on `ast.Str`.
          CIBW_TEST_REQUIRES: pytest hypothesis
          CIBW_TEST_COMMAND: bash {project}/tools/test_wheels.sh {project}

      - name: Check the pvectorc extension made it into the wheel
        # setup.py's custom_build_ext swallows compile failures, so a wheel holding
        # only the pure-Python fallback would otherwise pass as a riscv64 build.
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pvectorc") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyrsistent-${{ env.PYRSISTENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyrsistent ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyrsistent-${{ matrix.version }}-*-manylinux_riscv64
