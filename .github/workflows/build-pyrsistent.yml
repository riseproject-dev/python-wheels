---
# This workflow is based on the `build_wheels` job of
# https://github.com/tobgu/pyrsistent/blob/v0.20.0/.github/workflows/build.yml
name: Build pyrsistent wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyrsistent version to build (git tag without the leading v, e.g. 0.20.0)'
        required: true
        default: '0.20.0'
  pull_request:
    paths:
      - '.github/workflows/build-pyrsistent.yml'
      - 'patches/pyrsistent/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.20.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  PYRSISTENT_VERSION: ${{ inputs.version || '0.20.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build pyrsistent ${{ inputs.version || '0.20.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        # No cp314t: upstream publishes no free-threaded wheel, and pvectorc uses
        # single-phase module init, so importing it re-enables the GIL anyway.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout pyrsistent v${{ env.PYRSISTENT_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: tobgu/pyrsistent
          ref: v${{ env.PYRSISTENT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pyrsistent source
        run: git apply python-wheels/patches/pyrsistent/${{ env.PYRSISTENT_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream pins `pytest==6.* hypothesis==6.*`, which predates CPython 3.12
          # and dies collecting the suite on `ast.Str`.
          CIBW_TEST_REQUIRES: pytest hypothesis
          CIBW_TEST_COMMAND: bash {project}/tools/test_wheels.sh {project}

      - name: Check the pvectorc extension made it into the wheel
        # setup.py's custom_build_ext swallows compile failures, so a wheel holding
        # only the pure-Python fallback would otherwise pass as a riscv64 build.
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pvectorc") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyrsistent-${{ env.PYRSISTENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyrsistent ${{ inputs.version || '0.20.0' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: pyrsistent-${{ env.PYRSISTENT_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
