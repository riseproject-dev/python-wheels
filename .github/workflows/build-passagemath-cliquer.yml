---
# passagemath-cliquer is split out of the passagemath/passagemath monorepo (a
# SageMath fork) at pkgs/sagemath-cliquer, tagged passagemath-<version>. This
# replays build/pkgs/sagemath_cliquer/spkg-src (./bootstrap renders the
# package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-cliquer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-cliquer.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-cliquer.yml'
      - 'docs/packages/passagemath-cliquer.yaml'
      - 'patches/passagemath-cliquer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-cliquer.yml'
      - 'docs/packages/passagemath-cliquer.yaml'
      - 'patches/passagemath-cliquer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64
  # build/pkgs/cliquer's own pin (checksums.ini): no riscv64 cliquer-devel
  # exists (EPEL ships no riscv64 repo at all), so this always builds from
  # source, same as upstream's own spkg-configure.m4 fallback.
  CLIQUER_VERSION: 1.23
  CLIQUER_SHA256: c1d7cc927b7efe76ff4f11e1f01bee473e37360fb54843b16b287e3ad161287b

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-cliquer
      version: ${{ inputs.version }}
      # cysignals (a build and runtime dependency, per its own pyproject.toml.m4
      # - cliquer.pyx needs it at import, despite [project] dependencies being
      # empty there) has no cp311 riscv64 wheel anywhere on the registry, same
      # gap build-passagemath-libbraiding.yml already excludes it for.
      python-exclude: 'cp311'

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_CLIQUER_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_CLIQUER_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_CLIQUER_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-cliquer
          src/sage/graphs/cliquer.p*
          src/sage/graphs/cliquer/cl.c
          src/sage/graphs/all__sagemath_cliquer.py
          src/sage/all__sagemath_cliquer.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-cliquer source
      run: git apply python-wheels/patches/passagemath-cliquer/${{ env.PASSAGEMATH_CLIQUER_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    # ./bootstrap's own per-package render (sage-package bootstrap) runs all
    # ~650 spkgs in parallel batches and aborts a batch outright if any
    # member fails (sage_conf's needs the full configure.ac, absent from
    # this sparse checkout); render this one package ourselves so it is not
    # at the mercy of that batch's luck.
    - name: Render pkgs/sagemath-cliquer/pyproject.toml.m4
      working-directory: pkgs/sagemath-cliquer
      run: |
        export M4PATH="$GITHUB_WORKSPACE/m4"
        for f in *.m4; do m4 "$f" > "${f%.m4}"; done

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-cliquer
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_CLIQUER_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_CLIQUER_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-cliquer-${{ env.PASSAGEMATH_CLIQUER_VERSION }}-sdist
        path: pkgs/sagemath-cliquer/dist/*.tar.gz
        if-no-files-found: error

  # cliquer (GPL-2.0-only, per its own COPYING) is compiled straight into the
  # wheel from the upstream release tarball, which is not in the image's
  # repos, so its source and licence text are collected here rather than
  # from an RPM.
  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-latest
    env:
      PASSAGEMATH_CLIQUER_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch pinned cliquer source
        run: |
          set -euo pipefail
          curl -fsSLo cliquer.tar.gz "https://github.com/dimpase/autocliquer/releases/download/v${CLIQUER_VERSION}/cliquer-${CLIQUER_VERSION}.tar.gz"
          echo "${CLIQUER_SHA256}  cliquer.tar.gz" | sha256sum -c -

      - run: tar cf gpl-sources.tar cliquer.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: passagemath-cliquer-${{ env.PASSAGEMATH_CLIQUER_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-cliquer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_CLIQUER_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-cliquer-${{ env.PASSAGEMATH_CLIQUER_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
        # Replays build/pkgs/cliquer/spkg-install.in's ./configure &&
        # make && make install chain against a fixed /usr/local prefix,
        # skipping the Sage-specific sdh_* wrappers. cliquer's own
        # nobase_include_HEADERS already installs headers nested under
        # include/cliquer/, matching cliquer.pxd's `cdef extern from
        # "cliquer/graph.h"` etc.
        CIBW_BEFORE_ALL_LINUX: |
          set -euo pipefail
          if command -v apk >/dev/null; then
            apk add --no-cache gmp-dev mpfr-dev mpc1-dev curl
          else
            dnf install -y --setopt=install_weak_deps=False gmp-devel mpfr-devel libmpc-devel
          fi
          curl -fsSLo /tmp/cliquer.tar.gz https://github.com/dimpase/autocliquer/releases/download/v${{ env.CLIQUER_VERSION }}/cliquer-${{ env.CLIQUER_VERSION }}.tar.gz
          echo "${{ env.CLIQUER_SHA256 }}  /tmp/cliquer.tar.gz" | sha256sum -c -
          tar xzf /tmp/cliquer.tar.gz -C /tmp
          cd /tmp/cliquer-${{ env.CLIQUER_VERSION }}
          ./configure --prefix=/usr/local --libdir=/usr/local/lib --disable-static --enable-shared
          make -j"$(nproc)"
          make install
          ldconfig || true
        CIBW_ENVIRONMENT_LINUX: >-
          PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH
          LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CPATH=/usr/local/include:$CPATH
        # cysignals is a real runtime need of the compiled extension (it
        # raises ModuleNotFoundError at import without it), but upstream's
        # own [project] dependencies is empty - it only lists cysignals under
        # [build-system] requires - so cibuildwheel's fresh test venv needs
        # it supplied explicitly here.
        CIBW_TEST_REQUIRES: cysignals
        # sagemath-repl/-graphs (the real test extras) are unported, so this
        # stands in a minimal duck-typed graph rather than sage's own,
        # replaying cliquer.pyx's own doctest for the Petersen graph.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.graphs.cliquer import max_clique;
          edges=[(0,1),(0,4),(0,5),(1,2),(1,6),(2,3),(2,7),(3,4),(3,8),(4,9),(5,7),(5,8),(6,8),(6,9),(7,9)];
          G=type('G',(object,),{'order':lambda s:10,'__iter__':lambda s:iter(range(10)),'edge_iterator':lambda s,labels=None:iter(edges)});
          r=max_clique(G());
          assert sorted(r)==[7,9], r;
          print('cliquer ok', r)"

    - name: Check the wheel ships the extension and the vendored licences
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/graphs/cliquer") and n.endswith(".so") for n in names), whl
            libs = [n for n in names if n.startswith("passagemath_cliquer.libs/")]
            assert any("cliquer" in n for n in libs), (whl, libs)
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE", "LICENSE.cliquer"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-cliquer-${{ env.PASSAGEMATH_CLIQUER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-cliquer ${{ matrix.version }}
    needs: [setup, linux, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-cliquer-${{ matrix.version }}-*_riscv64
      gpl-sources-artifact: passagemath-cliquer-${{ matrix.version }}-gpl-sources
      gpl-sources-description: cliquer
