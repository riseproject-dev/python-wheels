---
# This workflow is based on the `build_wheels` job of
# https://github.com/qutip/qutip/blob/v5.3.1/.github/workflows/build.yml
# and the test step of
# https://github.com/qutip/qutip/blob/v5.3.1/.github/workflows/tests.yml
name: Build qutip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qutip.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qutip.yml'
      - 'docs/packages/qutip.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qutip.yml'
      - 'docs/packages/qutip.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qutip
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qutip ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: qutip
      version: ${{ matrix.version }}
      repository: qutip/qutip
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,matplotlib"
      cibw-test-environment: MPLBACKEND=Agg PYTHONUNBUFFERED=1
      cibw-test-requires: >-
        pytest pytest-rerunfailures pytest-timeout ipython loky!=3.5.0 tqdm mpmath
        setuptools cython filelock matplotlib
      # Coverage and --fail-slow dropped: the former feeds Coveralls, the latter's 300 s cap is tuned for x86 runners.
      # cp313 hung silently at 54% twice; the thread-method timeout dumps every stack and exits (gotcha 565).
      cibw-test-command: >-
        python -c "import qutip; qutip.about()" &&
        python -m pytest -Werror --strict-config --strict-markers
        --timeout=900 --timeout-method=thread
        --durations=0 --durations-min=1.0 --verbosity=1 --color=yes
        "$(python -c 'import os, qutip; print(os.path.dirname(qutip.__file__))')/tests"
      timeout-minutes: 360

  publish:
    name: Publish qutip ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: qutip-${{ matrix.version }}-*-manylinux_riscv64
