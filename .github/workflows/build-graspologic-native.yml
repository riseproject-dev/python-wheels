---
# This workflow is based on the `build` job of
# https://github.com/graspologic-org/graspologic-native/blob/v1.3.1/.github/workflows/CI.yml
name: Build graspologic-native wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/graspologic-native.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-graspologic-native.yml'
      - 'docs/packages/graspologic-native.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-graspologic-native.yml'
      - 'docs/packages/graspologic-native.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: graspologic-native
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build graspologic-native ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pyo3's abi3-py39 feature (Cargo.toml) is on unconditionally, so one
        # abi3 wheel serves every GIL-ful interpreter; pyo3 disables abi3
        # under Py_GIL_DISABLED, giving the free-threaded build its own wheel.
        tag: [cp39-abi3, cp314t]

    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this workspace is packages/pyo3/ -- so upstream's published wheels
    # carry no licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "graspologic-native"
      version: "${{ matrix.version }}"
      repository: "graspologic-org/graspologic-native"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: "cp LICENSE packages/pyo3/"
      cibw-package-dir: "packages/pyo3"
      # Built on cp39 -- the oldest interpreter the abi3 tag claims -- and
      # re-tested on the newer ones via find_compatible_wheel.
      cibw-build: >
        ${{ matrix.tag == 'cp39-abi3' && 'cp39-manylinux_riscv64 cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64' || 'cp314t-manylinux_riscv64' }}
      # graspologic-native ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # numpy and scipy are runtime requirements only our registry has for
      # riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist. musllinux is dropped:
      # our registry has no musllinux_riscv64 wheel for either, so the
      # installed wheel's own runtime deps can't resolve there.
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
        PIP_ONLY_BINARY=numpy,scipy
      cibw-test-sources: >
        packages/pyo3/tests
        packages/network_partitions/tests
      cibw-test-command: >
        cd packages/pyo3 &&
        python -c "import graspologic_native as m, importlib.metadata as md;
        assert m.graspologic_native.__file__.endswith('.so'), m.graspologic_native.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('graspologic-native'))" &&
        python -m unittest

  publish:
    name: Publish graspologic-native ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: graspologic-native-${{ matrix.version }}-*_riscv64
