---
# This workflow is based on the `build`/`build-linux-arm` jobs of
# https://github.com/nautechsystems/nautilus_trader/blob/v1.231.0/.github/workflows/build.yml
name: Build nautilus-trader wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nautilus-trader.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nautilus-trader.yml'
      - 'docs/packages/nautilus-trader.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nautilus-trader.yml'
      - 'docs/packages/nautilus-trader.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nautilus-trader
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nautilus-trader ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      NAUTILUS_TRADER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout nautilus_trader v${{ env.NAUTILUS_TRADER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nautechsystems/nautilus_trader
          ref: v${{ env.NAUTILUS_TRADER_VERSION }}
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1

      # Same OOM guard build-deltalake.yml/build-lancedb.yml need on these
      # runners for a comparably sized Rust build (datafusion/arrow among the
      # ~900 crates in Cargo.lock, linked non-abi3 so it repeats per interpreter).
      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 16

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cibuildwheel's default build frontend runs `python -m build
          # /project --wheel` with cwd at /project, which shadows the real
          # `build` package with nautilus_trader's own top-level build.py
          # (ModuleNotFoundError: numpy, since build.py's own `import numpy`
          # runs before the isolated build env is set up) - same shadowing
          # pattern as build-qdk.yml (gotcha 102).
          CIBW_BUILD_FRONTEND: pip
          # build.py shells out to `cargo` directly (no maturin), picking up
          # rust-toolchain.toml's pinned 1.97.1 automatically once rustup is on
          # PATH; riscv64gc-unknown-linux-gnu is a rustup host target for it.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          # Upstream's own release profile (fat LTO, codegen-units=1) is too
          # expensive for this runner pool at this workspace size; overridden
          # the way build-deltalake.yml/build-lancedb.yml already do for a
          # comparably sized Rust build, keeping the "release" profile upstream
          # actually ships rather than switching to their lighter untrusted-PR
          # profile (ci-pr-wheel), which would publish a differently-optimised
          # wheel than upstream's own.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_PROFILE_RELEASE_LTO=thin
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            CARGO_BUILD_JOBS=2
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_COMMAND: python -c "import nautilus_trader; print(nautilus_trader.__version__)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nautilus-trader-${{ env.NAUTILUS_TRADER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish nautilus-trader ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nautilus-trader-${{ matrix.version }}-*-manylinux_riscv64
