---
# This workflow is based on: https://github.com/google/atheris/blob/352d5f2/deployment/Dockerfile
# and https://github.com/google/atheris/blob/352d5f2/run_tests.sh
name: Build atheris wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/atheris.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-atheris.yml'
      - 'docs/packages/atheris.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-atheris.yml'
      - 'docs/packages/atheris.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: atheris
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build atheris ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: atheris
      version: ${{ matrix.version }}
      repository: google/atheris
      ref: 352d5f29d811e0b51807ca57ed5551dd08ece528
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream cuts releases without git tags, so pin the release commit: this is
      # "Bump Atheris to 3.1.0", whose Python sources are byte-identical to the 3.1.0
      # PyPI wheels. Update it alongside the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream builds libFuzzer from an LLVM 16 snapshot that predates riscv64
      # libFuzzer (added in LLVM 17); Rocky 10's compiler-rt ships it prebuilt.
      cibw-before-all: dnf install -y compiler-rt
      cibw-environment: >-
        LIBFUZZER_LIB=/usr/lib/clang/21/lib/riscv64-redhat-linux-gnu/libclang_rt.fuzzer_no_main.a
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-before-build: pip install setuptools pybind11
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: PyInstaller
      cibw-test-sources: src
      # pyinstaller_coverage_test.py needs a shared libpython to build a
      # onefile executable ("Python was built without a shared library");
      # this image's cp312/cp313/cp314 don't ship one. Every other test
      # exercises atheris itself and stays in the loop.
      cibw-test-command: >-
        cd src && for t in *_test.py; do
        [ "$t" = "pyinstaller_coverage_test.py" ] && continue;
        echo "Running test: $t" && python "$t" || exit 1; done
      timeout-minutes: 90

  publish:
    name: Publish atheris ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: atheris-${{ matrix.version }}-*-manylinux_riscv64
