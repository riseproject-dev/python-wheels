---
# Based on upstream's own wheel builder:
#   https://github.com/seanmacavaney/zlib-state/blob/v0.1.12/.github/workflows/release.yml
name: Build zlib-state wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'zlib-state version to build (git tag without leading v, e.g. 0.1.12)'
        required: true
        default: '0.1.12'
  pull_request:
    paths:
      - '.github/workflows/build-zlib-state.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.12' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.12 there.
  ZLIB_STATE_VERSION: ${{ inputs.version || '0.1.12' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build zlib-state ${{ inputs.version || '0.1.12' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # setup.py is a plain setuptools.Extension (no py_limited_api), so
        # upstream ships one wheel per interpreter, matching PyPI's cp3xx-cp3xx
        # tags for cp39-cp314 plus a cp314t free-threaded build.
        python: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout zlib-state v${{ env.ZLIB_STATE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: seanmacavaney/zlib-state
          ref: v${{ env.ZLIB_STATE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setup.py links `-lz` against the system zlib; the extension only
          # touches the public z_stream API (inflateInit2/inflate/inflatePrime/
          # inflateSetDictionary, data_type), so it's portable to the Rocky 10
          # image's zlib-ng-compat build (gotcha 51) without any patching.
          CIBW_BEFORE_ALL_LINUX: dnf -y install zlib-devel
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test testdata
          CIBW_TEST_COMMAND: >-
            python -c "import _zlib_state; assert _zlib_state.__file__.endswith('.so'), _zlib_state.__file__"
            && python -m pytest -v test/test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zlib-state-${{ env.ZLIB_STATE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish zlib-state ${{ inputs.version || '0.1.12' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: zlib-state-${{ inputs.version || '0.1.12' }}-*-manylinux_riscv64
