---
# Based on upstream's own wheel builder:
#   https://github.com/seanmacavaney/zlib-state/blob/v0.1.12/.github/workflows/release.yml
name: Build zlib-state wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zlib-state.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-state.yml'
      - 'docs/packages/zlib-state.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zlib-state.yml'
      - 'docs/packages/zlib-state.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zlib-state
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zlib-state ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: zlib-state
      version: ${{ matrix.version }}
      repository: seanmacavaney/zlib-state
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # setup.py links `-lz` against the system zlib; the extension only
      # touches the public z_stream API (inflateInit2/inflate/inflatePrime/
      # inflateSetDictionary, data_type), so it's portable to the Rocky 10
      # image's zlib-ng-compat build (gotcha 51) without any patching.
      cibw-before-all-linux: dnf -y install zlib-devel
      cibw-test-requires: pytest
      cibw-test-sources: test testdata
      cibw-test-command: >-
        python -c "import _zlib_state; assert _zlib_state.__file__.endswith('.so'), _zlib_state.__file__"
        && python -m pytest -v test/test.py
      timeout-minutes: 60

  publish:
    name: Publish zlib-state ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zlib-state-${{ matrix.version }}-*-manylinux_riscv64
