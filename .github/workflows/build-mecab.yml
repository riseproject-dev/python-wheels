---
# This workflow is based on: https://github.com/shogo82148/mecab/blob/v0.996.13/.github/workflows/test-linux-python.yml
name: Build mecab wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mecab.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab.yml'
      - 'docs/packages/mecab.yaml'
      - 'patches/mecab/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mecab.yml'
      - 'docs/packages/mecab.yaml'
      - 'patches/mecab/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mecab
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mecab ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mecab"
      version: "${{ matrix.version }}"
      repository: "shogo82148/mecab"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-package-dir: "mecab/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py always links a system libmecab via mecab-config; this repo
      # is the MeCab C++ core and the Python binding in one monorepo, so
      # build the core (mecab/mecab) from the same checkout/tag the binding
      # comes from. configure.ac has no committed configure script (needs
      # autogen.sh/autoreconf) and its AM_ICONV macro needs gettext's m4
      # files, absent from the manylinux image.
      cibw-before-all-linux: |
        set -eux
        dnf install -y gettext-devel
        cd {project}/mecab
        ./autogen.sh
        ./configure --enable-utf8-only
        make -j"$(nproc)"
        make install
        ldconfig
      # Mirrors the sibling mecab-python3 port: install unidic-lite (a small
      # pure-Python dictionary package) so the test exercises real
      # tokenization instead of failing on "no dictionaries found".
      cibw-test-requires: "unidic-lite"
      cibw-test-command: "python -c \"import MeCab, unidic_lite; t = MeCab.Tagger('-d ' + unidic_lite.DICDIR); r = t.parse('\u592a\u90ce\u306f\u3053\u306e\u672c\u3092\u5973\u6027\u306b\u6e21\u3057\u305f\u3002'); assert 'EOS' in r and '\u592a\u90ce' in r, r; print(r)\""

  publish:
    name: Publish mecab ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mecab-${{ matrix.version }}-*-manylinux_riscv64
