---
# This workflow is based on the `wheels` job of upstream's own cibuildwheel config:
# https://github.com/YannickJadoul/Parselmouth/blob/v0.4.7/.github/workflows/wheels.yml
name: Build praat-parselmouth wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/praat-parselmouth.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-praat-parselmouth.yml'
      - 'docs/packages/praat-parselmouth.yaml'
      - 'patches/praat-parselmouth/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-praat-parselmouth.yml'
      - 'docs/packages/praat-parselmouth.yaml'
      - 'patches/praat-parselmouth/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: praat-parselmouth
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build praat-parselmouth ${{ matrix.version }} cp312/cp313/cp314-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "praat-parselmouth"
      version: "${{ matrix.version }}"
      repository: "YannickJadoul/Parselmouth"
      ref: "v${{ matrix.version }}"
      artifact-tag: "manylinux_riscv64"
      timeout-minutes: 480

      # praat/ and pybind11/ are vendored directly; only extern/fmt is a real submodule.
      checkout-submodules: "recursive"

      patches: true
      pre-build: |-
        # Mirrors upstream's own CI (which rewrites pyproject.toml the same way at
        # build time): cmake 4 dropped compatibility with cmake_minimum_required
        # versions below 3.5, which the vendored pybind11 (3.5) and fmt (3.1...3.18)
        # CMakeLists.txt rely on.
        sed -i 's/"cmake>=3.18"/"cmake>=3.18,<4"/' pyproject.toml

      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # No musllinux riscv64 numpy wheel on the registry yet (workflow-anatomy.md).
      cibw-skip: "*musllinux*"
      # Builds the heavy vendored `praat` static lib once for the whole job
      # instead of once per interpreter (gotcha 15), exactly like upstream's
      # own CIBW_BEFORE_ALL.
      cibw-before-all-linux: |
        cmake -S . -B build_dependencies
        cmake --build build_dependencies --target praat -j "$(nproc)"
      cibw-before-build: "rm -rf _skbuild"
      cibw-environment-linux: "PARSELMOUTH_EXTRA_CMAKE_ARGS=\"-DPREBUILT_DEPENDENCIES=$(pwd)/build_dependencies\" CMAKE_BUILD_PARALLEL_LEVEL=4 PIP_ONLY_BINARY=numpy,cmake"
      cibw-test-requires: "pytest<8 pytest-lazy-fixture tgt future"
      cibw-test-command: "pytest {project}/tests"

  publish:
    name: Publish praat-parselmouth ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: praat-parselmouth-${{ matrix.version }}-manylinux_riscv64
