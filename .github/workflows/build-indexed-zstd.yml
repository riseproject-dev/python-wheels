---
# Based on upstream's own publish.yml Build-Wheels job (plain cibuildwheel,
# linking the manylinux image's libzstd-devel), narrowed to riscv64.
name: Build indexed-zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/indexed-zstd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-zstd.yml'
      - 'docs/packages/indexed-zstd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-zstd.yml'
      - 'docs/packages/indexed-zstd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: indexed-zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build indexed-zstd ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: indexed-zstd
      version: ${{ matrix.version }}
      # libzstd-seek (linked at build time, and whose gen_seekable test
      # helper upstream's own test suite depends on) is a submodule.
      repository: martinellimarco/indexed_zstd
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: recursive
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        dnf install -y libzstd-devel cmake &&
        cmake -S {package}/indexed_zstd/libzstd-seek -B {package}/indexed_zstd/libzstd-seek/build -DBUILD_TESTS=ON &&
        cmake --build {package}/indexed_zstd/libzstd-seek/build --target gen_seekable
      cibw-environment-linux: "PIP_ONLY_BINARY=cython"
      cibw-test-requires: pytest
      # test-sources are staged from the host checkout (gotcha 104), so the
      # gen_seekable that before_all built inside the container's /project is
      # never copied into test_cwd; point tests/conftest.py at it explicitly.
      cibw-test-sources: tests pyproject.toml
      cibw-test-command: >-
        python3 -c "import indexed_zstd" &&
        GEN_SEEKABLE={package}/indexed_zstd/libzstd-seek/build/tests/gen_seekable
        python3 -m pytest tests -v -m "not heavy and not reference"
      timeout-minutes: 60

  publish:
    name: Publish indexed-zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: indexed-zstd-${{ matrix.version }}-*-manylinux_riscv64
