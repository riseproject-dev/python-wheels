---
# Based on upstream's own publish.yml Build-Wheels job (plain cibuildwheel,
# linking the manylinux image's libzstd-devel), narrowed to riscv64.
name: Build indexed-zstd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/indexed-zstd.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-zstd.yml'
      - 'docs/packages/indexed-zstd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-zstd.yml'
      - 'docs/packages/indexed-zstd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: indexed-zstd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build indexed-zstd ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      INDEXED_ZSTD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout indexed_zstd v${{ env.INDEXED_ZSTD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: martinellimarco/indexed_zstd
          ref: v${{ env.INDEXED_ZSTD_VERSION }}
          # libzstd-seek (linked at build time, and whose gen_seekable test
          # helper upstream's own test suite depends on) is a submodule.
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y libzstd-devel cmake &&
            cmake -S {package}/indexed_zstd/libzstd-seek -B {package}/indexed_zstd/libzstd-seek/build -DBUILD_TESTS=ON &&
            cmake --build {package}/indexed_zstd/libzstd-seek/build --target gen_seekable
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=cython
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests indexed_zstd
          CIBW_TEST_COMMAND: >-
            python3 -c "import indexed_zstd" &&
            python3 -m pytest tests -v -m "not heavy and not reference"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: indexed-zstd-${{ env.INDEXED_ZSTD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish indexed-zstd ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: indexed-zstd-${{ matrix.version }}-*-manylinux_riscv64
