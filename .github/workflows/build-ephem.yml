---
# Based on the `build_wheels` job of
# https://github.com/brandon-rhodes/pyephem/blob/4.2.1/.github/workflows/build-and-test.yml
name: Build ephem wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ephem.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ephem.yml'
      - 'docs/packages/ephem.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ephem.yml'
      - 'docs/packages/ephem.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ephem
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ephem ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ephem
      version: ${{ matrix.version }}
      repository: brandon-rhodes/pyephem
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-requires: tzdata
      # ephem/tests lives inside the importable package; staging only ephem/tests
      # (no ephem/__init__.py) leaves ephem/ a namespace portion in the test cwd,
      # so `import ephem` still resolves to the installed wheel (gotcha 174).
      cibw-test-sources: ephem/tests
      cibw-test-command: >-
        python -c "import ephem._libastro as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m unittest discover ephem
      timeout-minutes: 60

  publish:
    name: Publish ephem ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ephem-${{ matrix.version }}-*riscv64
