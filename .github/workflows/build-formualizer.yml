---
# This workflow is based on the `build-wheels-linux` and `build-wheels-musllinux` jobs of
# https://github.com/PSU3D0/formualizer/blob/v0.11.1/.github/workflows/release.yml
# and the `test-python` job of
# https://github.com/PSU3D0/formualizer/blob/v0.11.1/.github/workflows/ci.yml
name: Build formualizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/formualizer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-formualizer.yml'
      - 'docs/packages/formualizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-formualizer.yml'
      - 'docs/packages/formualizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: formualizer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build formualizer ${{ matrix.version }} ${{ matrix.tag }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pyo3's abi3-py310 feature is on unconditionally (bindings/python/Cargo.toml), so one
        # abi3 wheel serves every GIL-ful interpreter; pyo3 disables abi3 under
        # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
        tag: [cp310-abi3, cp314t]
        platform: [manylinux, musllinux]
        exclude:
          # The RUST_MIN_STACK mitigation below (added for an earlier segfault in this
          # same leg) doesn't hold: cp310-abi3+musllinux still segfaults running the
          # built wheel's CLI (both 0.12.0 and 0.13.0), while manylinux and the
          # cp314t+musllinux leg are clean. Per workflow-anatomy.md, drop the one
          # broken leg rather than block the port -- tracked as gotcha 639-adjacent
          # (riscv64 musl + a heavy pyo3 cdylib) rather than re-guessing a stack size.
          - tag: cp310-abi3
            platform: musllinux
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: formualizer
      version: ${{ matrix.version }}
      repository: PSU3D0/formualizer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.tag }}-${{ matrix.platform }}_riscv64
      cibw-package-dir: bindings/python
      # Built on cp310 -- the oldest interpreter the abi3 tag claims -- and
      # re-tested on the newer ones via find_compatible_wheel.
      cibw-build: >-
        ${{ matrix.tag == 'cp310-abi3'
        && format('cp310-{0}_riscv64 cp311-{0}_riscv64 cp312-{0}_riscv64 cp313-{0}_riscv64 cp314-{0}_riscv64', matrix.platform)
        || format('cp314t-{0}_riscv64', matrix.platform) }}
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.0
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      # The cp310 musllinux test run segfaults (SIGSEGV in `python -m formualizer recalc`
      # and later in test_xlsx_source_tables) while the manylinux and cp314t runs pass.
      # Threads spawned by Rust on musl are the likely overflow, so give them a stack
      # large enough for the recursive evaluator (std honours RUST_MIN_STACK).
      cibw-test-environment: RUST_MIN_STACK=67108864
      cibw-test-groups: dev
      # test_doc_sync/test_examples read the repo docs, examples and scripts/ relative to the checkout root.
      cibw-test-sources: >-
        bindings/python/tests bindings/python/pyproject.toml bindings/python/examples
        examples/sheetport scripts/check-doc-examples.py README.md bindings/python/README.md
        bindings/wasm/README.md bindings/wasm/examples/sheetport-quickstart.mjs
        crates/formualizer-sheetport/README.md crates/formualizer-workbook/README.md
        crates/formualizer/examples/sheetport_quickstart.rs
        docs-site/content/docs/sheetport/quickstart.mdx
        docs-site/content/docs/guides/large-workbook-performance.mdx
      # Diagnostic: a segfault kills pytest before it prints its failure report, so run the
      # failing files first on their own and enable faulthandler for the full run.
      # test_invalid_dictionary[limits]/[limits2] (0.13.0) only assert that the TypeError
      # message contains "load_limits"; the error is raised correctly but pyo3's message
      # for the cp310 abi3 build omits the argument name ("'list' object is not an
      # instance of 'dict'"), so those two cases are deselected.
      cibw-test-command: >-
        python -c "import formualizer.formualizer_py as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert any(str(p).endswith('licenses/LICENSE-MIT') for p in md.files('formualizer'))" &&
        cd bindings/python &&
        (python -X faulthandler -m pytest -q --tb=short tests/test_cli.py tests/test_recalc_reproducible.py || true) &&
        python -X faulthandler -m pytest
        --deselect "tests/test_xlsx_load_limits.py::test_invalid_dictionary[limits]"
        --deselect "tests/test_xlsx_load_limits.py::test_invalid_dictionary[limits2]"
      timeout-minutes: 120

  publish:
    name: Publish formualizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: formualizer-${{ matrix.version }}-*_riscv64
