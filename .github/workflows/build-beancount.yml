---
# Based on the manylinux job of
# https://github.com/beancount/beancount/blob/3.2.3/.github/workflows/wheels.yaml
name: Build beancount wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/beancount.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-beancount.yml'
      - 'docs/packages/beancount.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-beancount.yml'
      - 'docs/packages/beancount.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: beancount
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build beancount ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "beancount"
      version: "${{ matrix.version }}"
      repository: "beancount/beancount"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # bison/flex come from the manylinux image's own package manager, not from
      # the flex-bin/bison-bin build-system.requires (neither has a riscv64
      # wheel, and their sdists cross-compile via ziglang, which has none either).
      # pip's --no-build-isolation skips that requirement check outright (unlike
      # build's --no-isolation, gotcha 76), so preinstalling meson/meson-python/
      # ninja ourselves is enough.
      cibw-before-all-linux: "yum install -y flex bison"
      cibw-before-build: "pip install meson meson-python ninja"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest"
      # Both deselected tests call find_repository_root(), which walks up from
      # __file__ looking for a pyproject.toml; that only exists in a checkout,
      # not next to an installed wheel, so both fail identically on any arch.
      cibw-test-command: "python -m pytest --pyargs beancount --deselect projects/export_test.py::TestExport::test_export_basic --deselect scripts/check_examples_test.py::TestCheckExamples::test_example_files"

  publish:
    name: Publish beancount ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: beancount-${{ matrix.version }}-*-manylinux_riscv64
