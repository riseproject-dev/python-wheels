---
# This workflow is based on the `build`/`build-linux` jobs of
# https://github.com/ormsgpack/ormsgpack/blob/1.12.2/.github/workflows/release.yml
name: Build ormsgpack wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ormsgpack.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ormsgpack.yml'
      - 'docs/packages/ormsgpack.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ormsgpack.yml'
      - 'docs/packages/ormsgpack.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ormsgpack
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ormsgpack ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ormsgpack"
      version: "${{ matrix.version }}"
      repository: "ormsgpack/ormsgpack"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      # musllinux is out of reach: rustup publishes rust-std but no rustc/cargo
      # host toolchain for riscv64gc-unknown-linux-musl.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # ormsgpack ships no [tool.cibuildwheel], so the Rust toolchain its maturin
      # backend needs is installed in-container here, pinned to the stable
      # release of upstream's rust-toolchain.toml (the nightly `unstable-simd` feature is gone).
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0"
      # numpy has no riscv64 wheel on public PyPI, so it resolves from our registry.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      cibw-test-requires: "msgpack pendulum pydantic pytest python-dateutil pytz tzdata numpy"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ORMSGPACK_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ormsgpack-${{ env.ORMSGPACK_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("ormsgpack/ormsgpack.") and n.endswith(".so")
                         for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish ormsgpack ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ormsgpack-${{ matrix.version }}-*-manylinux_riscv64
