---
# This workflow is based on: https://github.com/marketcalls/openalgo-python-library/blob/v2.0.3/.github/workflows/CI.yml
name: Build openalgo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openalgo.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openalgo.yml'
      - 'docs/packages/openalgo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openalgo.yml'
      - 'docs/packages/openalgo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openalgo
      version: ${{ inputs.version }}

  rust_test:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Test openalgo ${{ matrix.version }} Rust core
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      OPENALGO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout openalgo v${{ env.OPENALGO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marketcalls/openalgo-python-library
          ref: v${{ env.OPENALGO_VERSION }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable

      - name: cargo test (oa_core)
        run: cargo test --release -p oa_core --manifest-path rust/Cargo.toml

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build openalgo ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      OPENALGO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout openalgo v${{ env.OPENALGO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marketcalls/openalgo-python-library
          ref: v${{ env.OPENALGO_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: '2_39'
          args: --release --out dist --interpreter python3.12 -m rust/oa_py/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openalgo-${{ env.OPENALGO_VERSION }}-cp312-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    name: Test openalgo ${{ matrix.version }} on ${{ matrix.python }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ['3.12', '3.13', '3.14']

    env:
      OPENALGO_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed
      UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_ONLY_BINARY: numpy,pandas

    steps:
      - name: Checkout openalgo v${{ env.OPENALGO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marketcalls/openalgo-python-library
          ref: v${{ env.OPENALGO_VERSION }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: openalgo-${{ env.OPENALGO_VERSION }}-cp312-abi3-manylinux_riscv64
          path: dist

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false

      - name: Install the built wheel
        run: uv pip install dist/*.whl

      - name: Smoke test
        run: |
          python -c "import openalgo._oaindicators as m; assert m.__file__.endswith('.so'), m.__file__"
          python benchmark/ci_smoke.py

  publish:
    name: Publish openalgo ${{ matrix.version }}
    needs: [setup, rust_test, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: openalgo-${{ matrix.version }}-*-manylinux_riscv64
