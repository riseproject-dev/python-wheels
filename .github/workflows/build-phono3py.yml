---
# This workflow is based on the `build_wheels` job of
# https://github.com/phonopy/phono3py/blob/v4.8.2/.github/workflows/release.yml
# and the test steps of
# https://github.com/phonopy/phono3py/blob/v4.8.2/.github/workflows/phono3py-pytest-conda.yml
name: Build phono3py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/phono3py.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-phono3py.yml'
      - 'docs/packages/phono3py.yaml'
      - 'patches/phono3py/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-phono3py.yml'
      - 'docs/packages/phono3py.yaml'
      - 'patches/phono3py/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: phono3py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build phono3py ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PHONO3PY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout phono3py v${{ env.PHONO3PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: phonopy/phono3py
          ref: v${{ env.PHONO3PY_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The riscv64 runners' libgomp faults on schedule(guided) (gotcha 166): the tests
      # segfaulted inside imag_self_energy_with_g()'s guided loop. Move every guided
      # loop under c/ to schedule(static).
      - name: Patch phono3py
        run: git apply -v python-wheels/patches/phono3py/${{ env.PHONO3PY_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # phonors (a runtime dependency of phonopy) has no riscv64 wheel for every
          # interpreter; its sdist needs cargo, as upstream's test job also builds it.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          # The patched tree is dirty, which setuptools_scm would turn into a
          # post-release version (gotcha 31); pin it instead.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH=$HOME/.cargo/bin:$PATH
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PHONO3PY=${{ env.PHONO3PY_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,h5py,matplotlib,contourpy,kiwisolver,pillow,spglib,pyyaml,phonopy
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test
          CIBW_TEST_COMMAND: python -m pytest -v test

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              for ext in ("phono3py/_phono3py", "phono3py/_phononcalc"):
                  assert any(n.startswith(ext) and n.endswith(".so") for n in names), (path, ext)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phono3py-${{ env.PHONO3PY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish phono3py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: phono3py-${{ matrix.version }}-*-manylinux_riscv64
