---
# This workflow is based on the `build_wheels` job of
# https://github.com/phonopy/phono3py/blob/v4.8.2/.github/workflows/release.yml
# and the test steps of
# https://github.com/phonopy/phono3py/blob/v4.8.2/.github/workflows/phono3py-pytest-conda.yml
name: Build phono3py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/phono3py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-phono3py.yml'
      - 'docs/packages/phono3py.yaml'
      - 'patches/phono3py/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-phono3py.yml'
      - 'docs/packages/phono3py.yaml'
      - 'patches/phono3py/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: phono3py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build phono3py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "phono3py"
      version: "${{ matrix.version }}"
      repository: "phonopy/phono3py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/phono3py/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # phonors (a runtime dependency of phonopy) has no riscv64 wheel for every
      # interpreter; its sdist needs cargo, as upstream's test job also builds it.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
      # The patched tree is dirty, which setuptools_scm would turn into a
      # post-release version (gotcha 31); pin it instead.
      cibw-environment-linux: "PATH=$HOME/.cargo/bin:$PATH SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PHONO3PY=${{ matrix.version }} PIP_ONLY_BINARY=numpy,scipy,h5py,matplotlib,contourpy,kiwisolver,pillow,spglib,pyyaml,phonopy"
      cibw-test-requires: "pytest"
      cibw-test-sources: "test"
      cibw-test-command: "python -m pytest -v test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PHONO3PY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: phono3py-${{ env.PHONO3PY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              for ext in ("phono3py/_phono3py", "phono3py/_phononcalc"):
                  assert any(n.startswith(ext) and n.endswith(".so") for n in names), (path, ext)
              print(path, "ok")
          EOF

  publish:
    name: Publish phono3py ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: phono3py-${{ matrix.version }}-*-manylinux_riscv64
