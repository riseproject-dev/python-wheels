---
# Based on upstream's own wheel build:
#   https://github.com/astrorigin/pyswisseph/blob/v2.10.03.2/.github/workflows/build.yml
name: Build pyswisseph wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyswisseph.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyswisseph.yml'
      - 'docs/packages/pyswisseph.yaml'
      - 'patches/pyswisseph/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyswisseph.yml'
      - 'docs/packages/pyswisseph.yaml'
      - 'patches/pyswisseph/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyswisseph
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyswisseph ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyswisseph"
      version: "${{ matrix.version }}"
      repository: "astrorigin/pyswisseph"
      ref: ''
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      pre-build: |-
        export PYSWISSEPH_VERSION='${{ matrix.version }}'
        IFS='.' read -r major minor patch build <<< "${PYSWISSEPH_VERSION}"
        printf -v ref 'v%s.%s.%02d.%s' "$major" "$minor" "$patch" "$build"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyswisseph/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-requires: "pytest"
      # Real coverage from the packaged suite (94/126 tests pass with no
      # ephemeris data files present). The deselected tests all assert
      # exact swe.FLG_SWIEPH-precision output (fixed-star catalog lookups,
      # eclipse/rise/heliacal timings, ...), which without the multi-file
      # Swiss Ephemeris dataset (a large download from Astrodienst, not
      # bundled in the sdist or by upstream's own CI either) silently
      # falls back to the lower-precision Moshier ephemeris and fails the
      # exact-value assertions - not a riscv64-specific failure.
      cibw-test-command: "pytest {package}/tests -v --deselect tests/test_swe_azalt_refrac.py::TestSweAzaltRefrac::test_01 --deselect tests/test_swe_calc.py::TestSweCalc::test_01 --deselect tests/test_swe_calc_pctr.py::TestSweCalcPctr::test_01 --deselect tests/test_swe_calc_ut.py::TestSweCalcUt::test_01 --deselect tests/test_swe_fixstar.py::TestSweFixstar::test_01 --deselect tests/test_swe_fixstar2.py::TestSweFixstar2::test_01 --deselect tests/test_swe_fixstar2_mag.py::TestSweFixstar2Mag::test_01 --deselect tests/test_swe_fixstar2_ut.py::TestSweFixstar2Ut::test_01 --deselect tests/test_swe_fixstar_mag.py::TestSweFixstarMag::test_01 --deselect tests/test_swe_fixstar_ut.py::TestSweFixstarUt::test_01 --deselect tests/test_swe_gauquelin_sector.py::TestSweGauquelinSector::test_01 --deselect tests/test_swe_gauquelin_sector.py::TestSweGauquelinSector::test_02 --deselect tests/test_swe_get_current_file_data.py::TestSweGetCurrentFileData::test_01 --deselect tests/test_swe_get_orbital_elements.py::TestSweGetOrbitalElements::test_01 --deselect tests/test_swe_heliacal_pheno_ut.py::TestSweHeliacalPhenoUt::test_01 --deselect tests/test_swe_helio_cross.py::TestSweHelioCross::test_01 --deselect tests/test_swe_helio_cross_ut.py::TestSweHelioCrossUt::test_01 --deselect tests/test_swe_house_pos.py::TestSweHousePos::test_01 --deselect tests/test_swe_lun_eclipse.py::TestSweLunEclipse::test_01 --deselect tests/test_swe_lun_occult.py::TestSweLunOccult::test_01 --deselect tests/test_swe_pheno.py::TestSwePheno::test_01 --deselect tests/test_swe_pheno_ut.py::TestSwePhenoUt::test_01 --deselect tests/test_swe_rise_trans.py::TestSweRiseTrans::test_01 --deselect tests/test_swe_rise_trans.py::TestSweRiseTrans::test_02 --deselect tests/test_swe_rise_trans_true_hor.py::TestSweRiseTrans::test_01 --deselect tests/test_swe_rise_trans_true_hor.py::TestSweRiseTrans::test_02 --deselect tests/test_swe_set_sid_mode.py::TestSweSetSidMode::test_01 --deselect tests/test_swe_set_topo.py::TestSweSetTopo::test_01 --deselect tests/test_swe_sol_eclipse.py::TestSweSolEclipse::test_01 --deselect tests/test_swe_solcross.py::TestSweSolcross::test_01 --deselect tests/test_swe_solcross_ut.py::TestSweSolcrossUt::test_01 --deselect tests/test_swe_vis_limit_mag.py::TestSweVisLimitMag::test_01"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYSWISSEPH_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyswisseph-${{ env.PYSWISSEPH_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith((".so", ".pyd"))]
          assert exts and all("swisseph" in n for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE.txt", "libswe/LICENSE", "swephelp/LICENSE.txt"}, licences
          EOF

  publish:
    name: Publish pyswisseph ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyswisseph-${{ matrix.version }}-*riscv64
