---
# This workflow is based on the `build_wheels` job of
# https://github.com/scikit-learn/scikit-learn/blob/1.9.0/.github/workflows/wheels.yml
name: Build scikit-learn wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'scikit-learn version to build (git tag, e.g. 1.9.0)'
        required: true
        default: '1.9.0'
  pull_request:
    paths:
      - '.github/workflows/build-scikit-learn.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.9.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SKLEARN_VERSION: ${{ inputs.version || '1.9.0' }}
  # Pinned explicitly so the gpl_sources job pulls the same image the wheels were built in.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build scikit-learn ${{ inputs.version || '1.9.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        # scipy is a *build* requirement (sklearn cimports scipy.linalg.cython_blas) and our
        # registry carries riscv64 scipy only up to cp313 — hence no cp314/cp314t.
        python: ["cp312", "cp313"]

    steps:
      - name: Checkout scikit-learn ${{ env.SKLEARN_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: scikit-learn/scikit-learn
          ref: ${{ env.SKLEARN_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          # Scoped, not :all: - cython/meson-python have no riscv64 wheel and must build from sdist.
          CIBW_ENVIRONMENT: >-
            SKLEARN_SKIP_NETWORK_TESTS=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pandas
          # check_license.py in test_wheels.sh asserts on the notice cibw_before_build.sh adds.
          CIBW_ENVIRONMENT_PASS_LINUX: RUNNER_OS
          CIBW_BEFORE_BUILD: bash {project}/build_tools/wheels/cibw_before_build.sh {project}
          CIBW_TEST_REQUIRES: pytest pytest-xdist pandas scipy
          CIBW_TEST_COMMAND: bash {project}/build_tools/wheels/test_wheels.sh {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scikit-learn-${{ env.SKLEARN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    # auditwheel vendors the image's libgomp into the wheel, as upstream's own
    # build_tools/wheels/LICENSE_linux.txt documents.
    name: Collect GPL sources (gcc) for scikit-learn ${{ inputs.version || '1.9.0' }}
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scikit-learn-${{ env.SKLEARN_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish scikit-learn ${{ inputs.version || '1.9.0' }} to GitLab
    needs: [build_wheels, gpl_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: scikit-learn-${{ env.SKLEARN_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          gpl-sources-artifact: scikit-learn-${{ env.SKLEARN_VERSION }}-gpl-sources
          gpl-sources-release-tag: scikit-learn-v${{ env.SKLEARN_VERSION }}
          gpl-sources-description: gcc
