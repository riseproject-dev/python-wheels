---
# This workflow is based on the `build_wheels` job of
# https://github.com/scikit-learn/scikit-learn/blob/1.9.0/.github/workflows/wheels.yml
name: Build scikit-learn wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scikit-learn.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-learn.yml'
      - 'docs/packages/scikit-learn.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scikit-learn.yml'
      - 'docs/packages/scikit-learn.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Pinned explicitly so the gpl_sources job pulls the same image the wheels were built in.
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # On 3.14 joblib's loky workers die unpickling their call item here with
  # "'dict' object has no attribute '__annotate__'", taking out 6 of the 10
  # process-parallel tests. cp312 and cp313 are unaffected, and it does not
  # reproduce on aarch64 cp314t with the same scikit-learn and joblib.
  LOKY_DESELECT: >-
    PYTEST_ADDOPTS='-k "not (test_kdtree_picklable_with_joblib or (test_knn_forcing_backend
    and loky) or (test_function_no_callback_support and processes))"'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scikit-learn
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scikit-learn ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "scikit-learn"
      version: "${{ matrix.version }}"
      repository: "scikit-learn/scikit-learn"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 720
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      # Scoped, not :all: - cython/meson-python have no riscv64 wheel and must build from sdist.
      cibw-environment-linux: "SKLEARN_SKIP_NETWORK_TESTS=1 PIP_ONLY_BINARY=numpy,scipy,pandas"
      # check_license.py in test_wheels.sh asserts on the notice cibw_before_build.sh adds.
      cibw-environment-pass-linux: "RUNNER_OS"
      cibw-before-build: "bash {project}/build_tools/wheels/cibw_before_build.sh {project}"
      cibw-test-requires: "pytest pytest-xdist scipy ${{ case(matrix.python == 'cp312', 'pandas', matrix.python == 'cp313', 'pandas', matrix.python == 'cp314', 'pandas', '') }}"
      cibw-test-environment: "${{ case(matrix.python == 'cp314', true, endsWith(matrix.python, 't'), true, '') && 'PYTEST_ADDOPTS=''-k \"not (test_kdtree_picklable_with_joblib or (test_knn_forcing_backend and loky) or (test_function_no_callback_support and processes))\"''' || '' }}"
      cibw-test-command: "bash {project}/build_tools/wheels/test_wheels.sh {project}"

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # auditwheel vendors the image's libgomp into the wheel, as upstream's own
    # build_tools/wheels/LICENSE_linux.txt documents.
    name: Collect GPL sources (gcc) for scikit-learn ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      SKLEARN_VERSION: ${{ matrix.version }}

    steps:
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scikit-learn-${{ env.SKLEARN_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish scikit-learn ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scikit-learn-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: scikit-learn-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
