name: Collect GPL sources

on:
  workflow_call:
    inputs:
      package:
        description: Package name used in the uploaded artifact name.
        required: true
        type: string
      version:
        description: Package version associated with the collected sources.
        required: true
        type: string
      packages:
        description: Space-separated installed RPM package names whose source RPMs are required.
        required: false
        default: gcc
        type: string

jobs:
  collect:
    name: Collect GPL sources for ${{ inputs.package }} ${{ inputs.version }}
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: quay.io/pypa/manylinux_2_39_riscv64
          packages: ${{ inputs.packages }}
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error
