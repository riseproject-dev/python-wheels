---
# This workflow is based on the `build_wheels` job of
# https://github.com/explosion/spacy-alignments/blob/release-v0.9.2/.github/workflows/cibuildwheel.yml
# and on the `tests` job of
# https://github.com/explosion/spacy-alignments/blob/release-v0.9.2/.github/workflows/tests.yml
name: Build spacy-alignments wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spacy-alignments.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-alignments.yml'
      - 'docs/packages/spacy-alignments.yaml'
      - 'patches/spacy-alignments/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-alignments.yml'
      - 'docs/packages/spacy-alignments.yaml'
      - 'patches/spacy-alignments/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spacy-alignments
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spacy-alignments ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # setup.cfg caps python_requires at <3.14 and pyo3 0.24 tops out at 3.13.
        python: ["cp312", "cp313"]
        platform: ["manylinux", "musllinux"]

    env:
      SPACY_ALIGNMENTS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout spacy-alignments ${{ env.SPACY_ALIGNMENTS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/spacy-alignments
          ref: release-v${{ env.SPACY_ALIGNMENTS_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch spacy-alignments source
        run: git apply python-wheels/patches/spacy-alignments/${{ env.SPACY_ALIGNMENTS_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: curl -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          # Upstream leaves cibuildwheel's test-command empty and runs the suite from
          # tests.yml instead; that is the pytest line below.
          CIBW_TEST_REQUIRES: pytest hypothesis>=5.3.1,<7.0.0
          CIBW_TEST_COMMAND: python -m pytest --pyargs spacy_alignments -Werror

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spacy-alignments-${{ env.SPACY_ALIGNMENTS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish spacy-alignments ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: spacy-alignments-${{ matrix.version }}-*_riscv64
