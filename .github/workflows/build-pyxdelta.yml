---
# This workflow is based on the `build_wheels` job of
# https://github.com/Illidanz/pyxdelta/blob/v0.2.3/.github/workflows/wheels.yml
name: Build pyxdelta wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyxdelta.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxdelta.yml'
      - 'docs/packages/pyxdelta.yaml'
      - 'patches/pyxdelta/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyxdelta.yml'
      - 'docs/packages/pyxdelta.yaml'
      - 'patches/pyxdelta/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyxdelta
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyxdelta ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyxdelta"
      version: "${{ matrix.version }}"
      repository: "Illidanz/pyxdelta"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-command: "python -c \"import pyxdelta as m; assert m.__file__.endswith('.so'), m.__file__\" && python -c \"import pyxdelta, tempfile, os; d = tempfile.mkdtemp(); src = os.path.join(d, 'src.bin'); tgt = os.path.join(d, 'tgt.bin'); patch = os.path.join(d, 'p.xdelta'); out = os.path.join(d, 'out.bin'); open(src, 'wb').write(b'hello world' * 100); open(tgt, 'wb').write(b'hello world' * 100 + b'extra'); assert pyxdelta.run(infile=src, outfile=tgt, patchfile=patch); assert pyxdelta.decode(infile=src, patchfile=patch, outfile=out); assert open(out, 'rb').read() == open(tgt, 'rb').read()\""

  publish:
    name: Publish pyxdelta ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyxdelta-${{ matrix.version }}-*-manylinux_riscv64
