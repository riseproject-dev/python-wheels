---
# Based on the `wheels` and `validate_linux_abi3_runtime` jobs of
# https://github.com/rism-digital/verovio/blob/version-6.3.0/.github/workflows/python-ci-wheel.yml
name: Build verovio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/verovio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-verovio.yml'
      - 'docs/packages/verovio.yaml'
      - 'patches/verovio/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-verovio.yml'
      - 'docs/packages/verovio.yaml'
      - 'patches/verovio/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: verovio
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build verovio ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "verovio"
      version: "${{ matrix.version }}"
      repository: "rism-digital/verovio"
      ref: "version-${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 240

      patches: true

      # Built once on the abi3 floor, then re-tested on every newer
      # interpreter, as upstream's validate_linux_abi3_runtime job does.
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-test-command: "python {project}/doc/python-smoke-test.py && python -c \"import importlib.metadata as m; got = sorted(p.name for p in m.files('verovio') if '.dist-info/licenses/' in str(p)); assert got == ['COPYING', 'COPYING.LESSER', 'LICENSE.fonts', 'LICENSE.humlib', 'LICENSE.jsonxx', 'LICENSE.midifile', 'LICENSE.miniz-cpp', 'LICENSE.pugixml', 'LICENSE.tuning-library'], got\""

  publish:
    name: Publish verovio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: verovio-${{ matrix.version }}-*-manylinux_riscv64
