---
# Based on the `wheel-linux-aarch64`/`wheel-linux-x86_64` jobs of
# https://github.com/althonos/pyfamsa/blob/v0.7.0/.github/workflows/package.yml
name: Build pyfamsa wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyfamsa.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfamsa.yml'
      - 'docs/packages/pyfamsa.yaml'
      - 'patches/pyfamsa/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyfamsa.yml'
      - 'docs/packages/pyfamsa.yaml'
      - 'patches/pyfamsa/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyfamsa
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyfamsa ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      PYFAMSA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyfamsa v${{ env.PYFAMSA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: althonos/pyfamsa
          ref: v${{ env.PYFAMSA_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # vendor/FAMSA's refresh active_thread_pool noop() only special-cases
      # _WIN32 and __aarch64__ and otherwise calls __builtin_ia32_pause().
      # The patch is against the FAMSA submodule, so apply it there.
      - name: Patch vendored FAMSA
        run: git -C vendor/FAMSA apply -v "$GITHUB_WORKSPACE"/python-wheels/patches/pyfamsa/${{ env.PYFAMSA_VERSION }}/*.patch

      - name: Write a cibuildwheel config without upstream's `free-threaded-support`
        # cibuildwheel 4.2.0 does not know this key and errors on it.
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/cibuildwheel.toml"
          [tool.cibuildwheel]
          before-build = "pip install scikit-build-core cython scoring-matrices"
          build-frontend = { name = "pip", args = ["--no-build-isolation"] }
          test-command = "python -m unittest pyfamsa.tests -v"
          test-extras = ["test"]
          EOF

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          config-file: ${{ runner.temp }}/cibuildwheel.toml
        env:
          CIBW_ARCHS: riscv64
          # wheel.py-api = "cp311" makes every build collapse to the same
          # cp311-abi3 tag (gotcha 11); build on the oldest interpreter it
          # claims (gotcha 96) and retest on the newer ones in the same job.
          CIBW_BUILD: >-
            cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyfamsa-${{ env.PYFAMSA_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyfamsa ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyfamsa-${{ matrix.version }}-*riscv64
