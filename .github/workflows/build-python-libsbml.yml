---
# This workflow mirrors the Linux leg of python-libsbml's own
# .github/workflows/wheels.yml (cibuildwheel + CMake/SWIG via setup.py's CMakeBuild),
# minus macOS/Windows and the sdist stage (gotcha 521: the sdist is just a repackaging
# of the same git checkout, so this port builds straight from the tagged submodules
# actions/checkout already pins, instead of round-tripping through `pipx run build
# --sdist`). Submodules are checked out at the commits the v5.21.1 tag's git tree
# actually records, not upstream's own checkout-submodules.sh `--remote` (which floats
# libsbml_source/libsbml_dependencies onto their "development"/default branch tips),
# so the build is the deterministic release content VERSION.txt names.
name: Build python-libsbml wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-libsbml.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-libsbml.yml'
      - 'docs/packages/python-libsbml.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-libsbml.yml'
      - 'docs/packages/python-libsbml.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-libsbml
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-libsbml ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYTHON_LIBSBML_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-libsbml v${{ env.PYTHON_LIBSBML_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sbmlteam/python-libsbml
          ref: v${{ env.PYTHON_LIBSBML_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # swig ships preinstalled at 4.4.1 in this image, the same version upstream's
          # own CIBW_BEFORE_BUILD_LINUX pins, so nothing to install there. libSBML-
          # dependencies' CMakeLists (cmake_minimum_required 2.8...3.19.0) and libsbml's
          # own (3.1...3.19) both sit below the floor CMake 4 (this image's pipx-installed
          # default) removed support for; CMAKE_POLICY_VERSION_MINIMUM reaches every cmake
          # invocation setup.py's CMakeBuild.spawn() makes, not just one we control
          # (gotcha 257).
          CIBW_ENVIRONMENT_LINUX: CMAKE_POLICY_VERSION_MINIMUM=3.5
          CIBW_BEFORE_ALL_LINUX: |
            cp {project}/libsbml_source/LICENSE.txt {project}/LICENSE.libsbml
            cp {project}/libsbml_dependencies/expat/COPYING {project}/LICENSE.expat
            sed -n '/^\/\* zlib.h/,/^\*\//p' {project}/libsbml_dependencies/zlib/source/zlib.h > {project}/LICENSE.zlib
            cat > {project}/LICENSE.bzip2 <<'BZIP2_LICENSE_EOF'
            This program, "bzip2", the associated library "libbzip2", and all
            documentation, are copyright (C) 1996-2010 Julian R Seward. All
            rights reserved.

            Redistribution and use in source and binary forms, with or without
            modification, are permitted provided that the following conditions
            are met:

            1. Redistributions of source code must retain the above copyright
               notice, this list of conditions and the following disclaimer.

            2. The origin of this software must not be misrepresented; you must
               not claim that you wrote the original software.  If you use this
               software in a product, an acknowledgment in the product
               documentation would be appreciated but is not required.

            3. Altered source versions must be plainly marked as such, and must
               not be misrepresented as being the original software.

            4. The name of the author may not be used to endorse or promote
               products derived from this software without specific prior written
               permission.

            THIS SOFTWARE IS PROVIDED BY THE AUTHOR ``AS IS'' AND ANY EXPRESS OR
            IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED
            WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE
            ARE DISCLAIMED. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR ANY
            DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL
            DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE
            GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS
            INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY,
            WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING
            NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS
            SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.

            Julian Seward, jseward@acm.org
            BZIP2_LICENSE_EOF
          CIBW_TEST_SOURCES: test_libsbml.py
          CIBW_TEST_COMMAND: >-
            python -c "import libsbml._libsbml as ext; assert ext.__file__.endswith('.so'), ext.__file__" &&
            python -c "
            import libsbml;
            assert libsbml.getLibSBMLDottedVersion() == '${{ env.PYTHON_LIBSBML_VERSION }}', libsbml.getLibSBMLDottedVersion();
            doc = libsbml.SBMLDocument(3, 2);
            model = doc.createModel('m');
            c = model.createCompartment(); c.setId('c'); c.setConstant(True);
            s = model.createSpecies(); s.setId('s'); s.setCompartment('c'); s.setHasOnlySubstanceUnits(False); s.setBoundaryCondition(False); s.setConstant(False);
            xml = libsbml.writeSBMLToString(doc);
            assert '<species id=\"s\"' in xml, xml;
            doc2 = libsbml.readSBMLFromString(xml);
            assert doc2.getNumErrors() == 0, doc2.getErrorLog().toString();
            assert doc2.getModel().getSpecies(0).getId() == 's';
            " &&
            python test_libsbml.py &&
            python -c "
            import importlib.metadata as md;
            names = sorted(str(f) for f in md.files('python-libsbml') if '.dist-info/licenses/' in str(f));
            assert any('LICENSE.expat' in n for n in names), names;
            assert any('LICENSE.zlib' in n for n in names), names;
            assert any('LICENSE.bzip2' in n for n in names), names;
            "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-libsbml-${{ env.PYTHON_LIBSBML_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-libsbml ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: python-libsbml-${{ matrix.version }}-*-manylinux_riscv64
