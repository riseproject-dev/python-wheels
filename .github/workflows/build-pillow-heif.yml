---
# This workflow is based on the `build-linux` job of
# https://github.com/bigcat88/pillow_heif/blob/v1.5.0/.github/workflows/wheels.yml
name: Build pillow-heif wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pillow-heif.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-heif.yml'
      - 'docs/packages/pillow-heif.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-heif.yml'
      - 'docs/packages/pillow-heif.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pillow-heif
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pillow-heif ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PILLOW_HEIF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pillow_heif v${{ env.PILLOW_HEIF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bigcat88/pillow_heif
          ref: v${{ env.PILLOW_HEIF_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream installs `cmake==3.31.6` from PyPI, which ships no riscv64 wheel; the
          # image already provides cmake 4.4.2. The `cp` lines add the licences of the three
          # libraries the wheel bundles, which upstream only references by URL.
          CIBW_BEFORE_ALL_LINUX: |
            set -e
            yum makecache && yum install -y libjpeg-turbo-devel lcms2-devel zlib-devel
            export BUILD_DIR=/tmp/ph_build_stuff
            python3 {package}/libheif/build_libs.py
            for lib in x265 libde265 libheif; do
              cp "$BUILD_DIR/$lib/COPYING" "{package}/LICENSE.$lib"
            done
          # Pillow ships no riscv64 wheel on public PyPI; ours is what the test env installs.
          CIBW_ENVIRONMENT: >-
            PH_RELEASE_TESTS=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_pillow_heif.") and n.endswith(".so") for n in names), whl
              libs = sorted(n.split("/")[1].split("-")[0] for n in names if n.startswith("pillow_heif.libs/") and n != "pillow_heif.libs/")
              assert libs == ["libde265", "libheif", "libx265"], (whl, libs)
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {
                  "LICENSE.txt", "LICENSES_bundled.txt",
                  "LICENSE.x265", "LICENSE.libde265", "LICENSE.libheif",
              }, (whl, licenses)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pillow_heif-${{ env.PILLOW_HEIF_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pillow-heif ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pillow_heif-${{ matrix.version }}-*-manylinux_riscv64
