---
# This workflow is based on the `linux` job of
# https://github.com/allo-media/text2num/blob/v3.1.0/.github/workflows/CI.yml
name: Build text2num wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'text2num version to build (git tag without leading v, e.g. 3.1.0)'
        required: true
        default: '3.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-text2num.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 3.1.0 there.
  TEXT2NUM_VERSION: ${{ inputs.version || '3.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build text2num ${{ inputs.version || '3.1.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # text2num is a PyO3 extension built per-interpreter (not abi3 - upstream
        # ships cp3x-cp3x wheels, incl. free-threaded cp313t/cp314t). Repo-standard
        # riscv64 interpreter set. Cargo.lock is tracked upstream, so building
        # straight from the checkout is safe (gotcha 325) - no separate sdist job.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout text2num v${{ env.TEXT2NUM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: allo-media/text2num
          ref: v${{ env.TEXT2NUM_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # text2num ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # Test each wheel the way upstream's CI.yml does.
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import text_to_num._text2num as ext; assert ext.__file__.endswith('.so'), ext.__file__" &&
            python -m unittest -v

      - name: Check the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: text2num-${{ env.TEXT2NUM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish text2num ${{ inputs.version || '3.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: text2num-${{ inputs.version || '3.1.0' }}-*-manylinux_riscv64
