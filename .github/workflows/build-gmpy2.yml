---
# This workflow is based on: https://github.com/gmpy2/gmpy2/blob/v2.3.1/.github/workflows/wheels.yml
name: Build gmpy2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gmpy2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gmpy2.yml'
      - 'docs/packages/gmpy2.yaml'
      - 'patches/gmpy2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gmpy2.yml'
      - 'docs/packages/gmpy2.yaml'
      - 'patches/gmpy2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gmpy2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gmpy2 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # Cython, a hard test-only requirement (test-extras builds and imports
          # a Cython extension against gmpy2's headers), publishes no
          # free-threaded wheel on any architecture, so the suite cannot run
          # under cp314t.
          - python: "cp314t"
            test_skip: "*"
        # musllinux dropped: test-extras' numpy and cython both have no
        # musllinux riscv64 wheel on PyPI or our registry, so CIBW_TEST_EXTRAS
        # cannot resolve in a musl venv (same reasoning as the tree-sitter-*
        # family dropping musllinux for its own test dependency).

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gmpy2"
      version: "${{ matrix.version }}"
      repository: "gmpy2/gmpy2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/gmpy2/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # Restates upstream's [tool.cibuildwheel.environment], which
      # CIBW_ENVIRONMENT replaces wholesale; the patch above leaves the
      # tree dirty, so pin the version. PIP_EXTRA_INDEX_URL resolves the
      # numpy/cython test-extras, which have no riscv64 wheel on PyPI.
      cibw-environment-linux: "LD_LIBRARY_PATH=$(pwd)/.local/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=$(pwd)/.local/lib/pkgconfig PYTEST_ADDOPTS=--verbose SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GMPY2=${{ matrix.version }}"
      cibw-test-skip: "${{ matrix.test_skip }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # Cython, a hard test-only requirement (test-extras builds and imports
          # a Cython extension against gmpy2's headers), publishes no
          # free-threaded wheel on any architecture, so the suite cannot run
          # under cp314t.
          - python: "cp314t"
            test_skip: "*"
        # musllinux dropped: test-extras' numpy and cython both have no
        # musllinux riscv64 wheel on PyPI or our registry, so CIBW_TEST_EXTRAS
        # cannot resolve in a musl venv (same reasoning as the tree-sitter-*
        # family dropping musllinux for its own test dependency).
    env:
      GMPY2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gmpy2-${{ env.GMPY2_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"gmpy2/gmpy2"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              got = {n.split(".", 1)[0] for n in names if n.endswith(".so")}
              assert got == expected, f"{whl}: got {got}, expected {expected}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish gmpy2 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gmpy2-${{ matrix.version }}-*-manylinux_riscv64
