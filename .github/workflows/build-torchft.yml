---
# Build-from-checkout, mirroring the `linux.2xlarge`/cpu leg of upstream's own
# https://github.com/meta-pytorch/torchft/blob/v0.2.0/.github/workflows/unittest.yaml
# (`pip install -e .[dev] -v && pytest -v --reruns 3 --reruns-delay 5`).
name: Build torchft wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/torchft.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-torchft.yml'
      - 'docs/packages/torchft.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-torchft.yml'
      - 'docs/packages/torchft.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: torchft
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build torchft ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # torchft's own `torch` dependency has no riscv64 wheel on public PyPI
        # (only on pypi.riseproject.dev, for cp312+).
        #
        # cp314t dropped: pyo3-ffi 0.24.2 (torchft's own pin) refuses to build
        # at all against it - "The configured Python interpreter version
        # (3.14) is newer than PyO3's maximum supported version (3.13)", and
        # the free-threaded build can't suppress that check even if the
        # ordinary cp314 leg can. Confirmed via the real riscv64 build log,
        # not assumed.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      TORCHFT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout torchft v${{ env.TORCHFT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: meta-pytorch/torchft
          ref: v${{ env.TORCHFT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # torchft ships no [tool.cibuildwheel]; the Rust toolchain its maturin
          # backend needs is installed in-container here. tonic-build needs
          # protoc at build time to compile proto/torchft.proto; Rocky 10's CRB
          # repo (enabled in the image) has one (CLAUDE.md gotcha 100).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            yum install -y protobuf-compiler protobuf-devel
          # PROTOC_INCLUDE is needed because proto/torchft.proto imports
          # google/protobuf/timestamp.proto and CRB's protoc (3.19) resolves
          # well-known types from disk rather than from the binary.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PROTOC_INCLUDE=/usr/include
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT_LINUX: PIP_ONLY_BINARY=numpy,torch
          CIBW_TEST_REQUIRES: pytest==8.3.4 pytest-timeout pytest-rerunfailures parameterized numpy
          # Mirrors upstream's own cpu-runner test leg (pytest -v --reruns 3
          # --reruns-delay 5). diloco_regression_test.py resolves its golden
          # fixtures relative to the installed package's parent directory
          # (site-packages/test_fixtures/...), which no wheel -- upstream's
          # published one included -- ships; -k drops it rather than chasing a
          # fixture layout the wheel was never going to carry.
          CIBW_TEST_COMMAND: >-
            python -c "import torchft._torchft as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v --pyargs torchft
            --timeout=180 --timeout-method=thread --reruns 3 --reruns-delay 5
            -k "not diloco_regression"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: torchft-${{ env.TORCHFT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish torchft ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: torchft-${{ matrix.version }}-*-manylinux_riscv64
