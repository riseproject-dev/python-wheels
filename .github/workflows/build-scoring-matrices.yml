---
# Based on the `wheel-linux-aarch64`/`wheel-linux-x86_64` jobs of
# https://github.com/althonos/scoring-matrices/blob/v0.3.5/.github/workflows/package.yml
name: Build scoring-matrices wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scoring-matrices.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scoring-matrices.yml'
      - 'docs/packages/scoring-matrices.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scoring-matrices.yml'
      - 'docs/packages/scoring-matrices.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scoring-matrices
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scoring-matrices ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: scoring-matrices
      version: ${{ matrix.version }}
      repository: althonos/scoring-matrices
      ref: v${{ matrix.version }}
      artifact-tag: cp311-abi3-manylinux_riscv64
      checkout-submodules: true
      # wheel.py-api = "cp311": build once on the abi3 floor, retest on cp312-cp314.
      cibw-build: 'cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64'
      timeout-minutes: 90

  publish:
    name: Publish scoring-matrices ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scoring-matrices-${{ matrix.version }}-*riscv64
