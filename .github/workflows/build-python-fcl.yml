---
# This workflow is based on: https://github.com/berkeleyautomation/python-fcl/blob/v0.7.0.11/.github/workflows/push.yml
name: Build python-fcl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'python-fcl version to build (git tag without leading v, e.g. 0.7.0.11)'
        required: true
        default: '0.7.0.11'
  pull_request:
    paths:
      - '.github/workflows/build-python-fcl.yml'
      - 'patches/python-fcl/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.7.0.11' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.7.0.11 there.
  PYTHON_FCL_VERSION: ${{ inputs.version || '0.7.0.11' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build python-fcl ${{ inputs.version || '0.7.0.11' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"

    steps:
      - name: Checkout python-fcl v${{ env.PYTHON_FCL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: berkeleyautomation/python-fcl
          ref: v${{ env.PYTHON_FCL_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply -v python-wheels/patches/python-fcl/${{ env.PYTHON_FCL_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # build_dependencies/install_linux.sh builds eigen/libccd/octomap/fcl from
          # source; the license copies are appended here since CIBW_BEFORE_ALL_LINUX
          # fully replaces pyproject.toml's own before-all rather than extending it.
          # DEBUG: -DBUILD_TESTING=OFF skips fcl's own ~25min test-binary build (not
          # shipped in the wheel either way) to speed up iteration while diagnosing
          # the riscv64-only "undefined symbol: typeinfo for fcl::CollisionGeometry<double>"
          # failure seen on PR #1770 (all 4 legs, same symbol every time).
          CIBW_BEFORE_ALL_LINUX: >-
            sed -i '/^cd fcl$/,/^cd \.\.$/ s/^\$CMAKE \.[[:space:]]*$/$CMAKE . -DBUILD_TESTING=OFF/' build_dependencies/install_linux.sh &&
            bash build_dependencies/install_linux.sh &&
            cp deps/fcl/LICENSE /project/LICENSE.fcl &&
            cp deps/libccd/BSD-LICENSE /project/LICENSE.libccd &&
            cp deps/octomap/octomap/LICENSE.txt /project/LICENSE.octomap
          # numpy: our registry is one patch release behind PyPI's latest (gotcha 84).
          # cmake: install_linux.sh pip-installs an exact-pinned cmake==3.31.6, which
          # our registry also carries; PIP_ONLY_BINARY keeps it off a source bootstrap.
          # DEBUG: the extension links cleanly against liboctomap (also in setup.py's
          # `libraries=`) but libfcl.so is entirely absent from the extension's own
          # NEEDED list even though fcl.pyx has genuine unresolved references into it
          # (confirmed: nm -D --undefined-only on the built .so lists exactly the
          # CollisionGeometry<double> ctor/dtor/typeinfo/vtable symbols that only
          # exist via fcl's `extern template ... FCL_EXPORT CollisionGeometry<double>`,
          # and libfcl.so itself DOES export them, weak+global, per before-build's
          # nm -D --defined-only). The image's default linker behaves as --as-needed;
          # force it off so every requested -l lands in NEEDED regardless of ld's own
          # (seemingly wrong here) per-library usage analysis.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cmake,numpy
            LDFLAGS=-Wl,--no-as-needed
          # DEBUG: dump libfcl.so's own dynamic symbol table to confirm whether the
          # explicit `template class CollisionGeometry<double>;` instantiation
          # (src/geometry/collision_geometry.cpp) is actually exported, before
          # setup.py links the Cython extension against it.
          CIBW_BEFORE_BUILD: >-
            echo ---LDD--- ;
            ldd /usr/local/lib64/libfcl.so ;
            echo ---DEFINED--- ;
            nm -D --defined-only /usr/local/lib64/libfcl.so | grep -i CollisionGeometry ;
            echo ---DONE--- ;
            true
          CIBW_TEST_REQUIRES: pytest
          # DEBUG: libfcl.so itself exports _ZTIN3fcl17CollisionGeometryIdEE (weak,
          # global, confirmed via before-build's nm -D) so the gap is between the
          # installed extension and that export. `find_spec('fcl.fcl')` still runs
          # fcl/__init__.py (imports the parent package first) and trips the same
          # crash with zero diagnostic output, so locate the .so via dist-info
          # RECORD metadata instead, which needs no import at all.
          CIBW_TEST_COMMAND: >-
            SO=$(python -c "import importlib.metadata as m;
            d=m.distribution('python-fcl'); files=list(d.files);
            lic={str(f).rsplit('/',1)[-1] for f in files if '.dist-info/licenses/' in str(f)};
            assert lic=={'LICENSE','LICENSE.fcl','LICENSE.libccd','LICENSE.octomap'}, lic;
            so=[f for f in files if str(f).endswith('.so')]; assert len(so)==1, so;
            print(d.locate_file(so[0]))") &&
            echo ---SO-PATH--- && echo $SO &&
            echo ---LDD--- && ldd $SO &&
            echo ---NEEDED--- && readelf -d $SO | grep -i NEEDED &&
            echo ---RUNPATH--- && readelf -d $SO | grep -i PATH &&
            echo ---UNDEFINED--- && nm -D --undefined-only $SO | grep -i CollisionGeometry ;
            pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-fcl-${{ env.PYTHON_FCL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-fcl ${{ inputs.version || '0.7.0.11' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: python-fcl-${{ inputs.version || '0.7.0.11' }}-*-manylinux_riscv64
