---
# This workflow is based on: https://github.com/berkeleyautomation/python-fcl/blob/v0.7.0.11/.github/workflows/push.yml
name: Build python-fcl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-fcl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-fcl.yml'
      - 'docs/packages/python-fcl.yaml'
      - 'patches/python-fcl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-fcl.yml'
      - 'docs/packages/python-fcl.yaml'
      - 'patches/python-fcl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-fcl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-fcl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "python-fcl"
      version: "${{ matrix.version }}"
      repository: "berkeleyautomation/python-fcl"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # build_dependencies/install_linux.sh builds eigen/libccd/octomap/fcl from
      # source; the license copies are appended here since CIBW_BEFORE_ALL_LINUX
      # fully replaces pyproject.toml's own before-all rather than extending it.
      # -DBUILD_TESTING=OFF skips fcl's own test-binary build (not shipped in the
      # wheel either way, and it otherwise adds ~25min per interpreter).
      cibw-before-all-linux: "sed -i '/^cd fcl$/,/^cd \\.\\.$/ s/^\\$CMAKE \\.[[:space:]]*$/$CMAKE . -DBUILD_TESTING=OFF/' build_dependencies/install_linux.sh && bash build_dependencies/install_linux.sh && cp deps/fcl/LICENSE /project/LICENSE.fcl && cp deps/libccd/BSD-LICENSE /project/LICENSE.libccd && cp deps/octomap/octomap/LICENSE.txt /project/LICENSE.octomap"
      # numpy: our registry is one patch release behind PyPI's latest (gotcha 84).
      # cmake: install_linux.sh pip-installs an exact-pinned cmake==3.31.6, which
      # our registry also carries; PIP_ONLY_BINARY keeps it off a source bootstrap.
      cibw-environment-linux: "PIP_ONLY_BINARY=cmake,numpy"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import importlib.metadata as m; n={p.name for p in m.files('python-fcl') if '.dist-info/licenses/' in str(p)}; assert n == {'LICENSE', 'LICENSE.fcl', 'LICENSE.libccd', 'LICENSE.octomap'}, n\" && pytest {project}/tests"

  publish:
    name: Publish python-fcl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-fcl-${{ matrix.version }}-*-manylinux_riscv64
