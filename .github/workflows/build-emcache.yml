---
# This workflow is based on: https://github.com/emcache/emcache/blob/v1.3.3/.github/workflows/release.yml
name: Build emcache wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/emcache.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-emcache.yml'
      - 'docs/packages/emcache.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-emcache.yml'
      - 'docs/packages/emcache.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: emcache
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build emcache ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: emcache
      version: ${{ matrix.version }}
      repository: emcache/emcache
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-build: make -C vendor/murmur3 static && make cythonize
      # Rocky 10's memcached stands in for upstream's compose.yaml service containers.
      cibw-before-test-linux: >-
        dnf -y install memcached &&
        memcached -d -u root -p 11211 &&
        memcached -d -u root -p 11212 &&
        memcached -d -u root -p 11213 --enable-ssl
        -o ssl_chain_cert={project}/tests/acceptance/data/localhost.crt,ssl_key={project}/tests/acceptance/data/localhost.key &&
        memcached -d -u root -p 11214 -S -Y {project}/tests/acceptance/data/auth_pwd.txt &&
        memcached -d -u root -s /tmp/emcache.test1.sock &&
        memcached -d -u root -s /tmp/emcache.test2.sock
      cibw-test-requires: pytest==8.2.2 pytest-mock==3.14.0 pytest-asyncio==0.23.8
      cibw-test-sources: tests pyproject.toml
      cibw-test-command: python -m pytest -sv tests
      timeout-minutes: 90

  publish:
    name: Publish emcache ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: emcache-${{ matrix.version }}-*-manylinux_riscv64
