---
# Based on upstream's own wheel build:
#   https://github.com/apache/flink/blob/release-2.3.0/.github/workflows/nightly.yml
#   (build_python_wheels job)
name: Build apache-flink wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/apache-flink.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-flink.yml'
      - 'docs/packages/apache-flink.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-flink.yml'
      - 'docs/packages/apache-flink.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: apache-flink
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build apache-flink ${{ matrix.version }} cp312-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: apache-flink
      version: ${{ matrix.version }}
      repository: apache/flink
      ref: release-${{ matrix.version }}
      artifact-tag: cp312-manylinux_riscv64
      cibw-package-dir: flink-python
      cibw-build: cp312-manylinux_riscv64
      # apache-beam/pyarrow/grpcio/pemja, each pinned to the exact
      # version inside flink's declared windows, are riscv64-only on our
      # own registry.
      # The cimport'd apache_beam.runners.worker.operations.Operation (and
      # the other Beam cdef classes beam_operations_fast/beam_coder_impl_fast/
      # beam_stream_fast cimport) is a Cython size-checked type import: it
      # fails at import time, not at build time, if the installed apache-beam
      # wheel's ABI doesn't match what this wheel was compiled against.
      # gotcha 247: a folded `>-` scalar's `python -c "` on its own line
      # puts a leading space before the first statement once YAML folds the newline
      # into a space, so the -c string's first "line" begins with whitespace and
      # Python raises IndentationError before anything imports. Keep the opening
      # quote and the first statement on the same line.
      cibw-test-command: >-
        python -c "import pyflink;
        from pyflink.fn_execution import coder_impl_fast, stream_fast;
        from pyflink.fn_execution.beam import beam_coder_impl_fast, beam_operations_fast, beam_stream_fast;
        from pyflink.fn_execution.table import aggregate_fast, window_aggregate_fast;
        print('pyflink compiled extensions OK')
        "

  publish:
    name: Publish apache-flink ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: apache-flink-${{ matrix.version }}-*-manylinux_riscv64
