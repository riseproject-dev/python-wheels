---
# Based on: https://github.com/mongodb/mongo-python-driver/blob/4.17.0/.github/workflows/dist.yml
# Build-from-checkout, inheriting upstream's [tool.cibuildwheel] (build-frontend, skip).
name: Build pymongo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymongo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymongo.yml'
      - 'docs/packages/pymongo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymongo.yml'
      - 'docs/packages/pymongo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymongo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymongo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pymongo
      version: ${{ matrix.version }}
      repository: mongodb/mongo-python-driver
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # _setup.py swallows build_ext failures and ships a pure-Python wheel
      # unless this is set (CLAUDE.md gotcha 20).
      cibw-environment-linux: PYMONGO_C_EXT_MUST_BUILD=1
      # Staged into the (empty) test cwd so pytest imports the installed wheel
      # rather than the checkout's pure-Python bson/ and pymongo/ packages.
      cibw-test-sources: test tools pyproject.toml
      # pytest-asyncio is pinned to upstream's uv.lock version; 1.4 turns
      # conftest's event_loop_policy override into an error under
      # pyproject's filterwarnings = error.
      cibw-test-requires: pytest>=8.2 pytest-asyncio==1.3.0
      # Upstream's own wheel test is fail_if_no_c.py; the pytest modules are the
      # subset of the suite that exercises the C extension without a mongod.
      cibw-test-command: >-
        python tools/fail_if_no_c.py &&
        python -m pytest
        test/test_bson.py test/test_bson_corpus.py test/test_bson_binary_vector.py
        test/test_raw_bson.py test/test_custom_types.py test/test_json_util.py
        test/test_objectid.py test/test_decimal128.py test/test_timestamp.py
        test/test_code.py test/test_binary.py test/test_son.py test/test_dbref.py
        test/test_uri_parser.py
      timeout-minutes: 90

  publish:
    name: Publish pymongo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymongo-${{ matrix.version }}-*-manylinux_riscv64
