---
# This workflow is based on upstream's own wheel builder:
#   https://github.com/bytecodealliance/componentize-py/blob/v0.25.1/.github/workflows/release.yaml
name: Build componentize-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/componentize-py.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-componentize-py.yml'
      - 'docs/packages/componentize-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-componentize-py.yml'
      - 'docs/packages/componentize-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  WASI_SDK_VERSION: '33'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: componentize-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build componentize-py ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # pyo3 is built with the "abi3-py39" feature (Cargo.toml), matching
        # upstream's own cp39-abi3 PyPI tag; no free-threaded wheel is published.
        python: ["cp39"]

    env:
      COMPONENTIZE_PY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout componentize-py v${{ env.COMPONENTIZE_PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bytecodealliance/componentize-py
          ref: v${{ env.COMPONENTIZE_PY_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # build.rs cross-compiles CPython and the runtime shims to
          # wasm32-wasip2 using WASI-SDK's clang; WASI-SDK itself has to run
          # natively on the build host. Upstream's own CI only ever downloads
          # x86_64/arm64 WASI-SDK releases, but the WASI-SDK project also
          # publishes a riscv64-linux host build from wasi-sdk-33 onward
          # (its own CI cross-compiles that artifact), so fetching it
          # ourselves closes a gap in upstream's download helper rather than
          # needing a patch to build.rs (which honors WASI_SDK_PATH as-is).
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            $HOME/.cargo/bin/rustup target add wasm32-wasip2 &&
            curl -LO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-riscv64-linux.tar.gz &&
            tar xf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-riscv64-linux.tar.gz &&
            mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-riscv64-linux /opt/wasi-sdk
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            MATURIN_PEP517_ARGS="--features pyo3"
          # No wheel-level test suite ships in the source tree: upstream
          # tests via `cargo test` against wasmtime-cli, never packaged.
          CIBW_TEST_COMMAND: >-
            python -c "from componentize_py import componentize_py as m; assert m.__file__.endswith('.so'), m.__file__" &&
            componentize-py --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: componentize-py-${{ env.COMPONENTIZE_PY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish componentize-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: componentize-py-${{ matrix.version }}-*-manylinux_riscv64
