---
# This workflow is based on upstream's own wheel builder:
#   https://github.com/bytecodealliance/componentize-py/blob/v0.25.1/.github/workflows/release.yaml
name: Build componentize-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/componentize-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-componentize-py.yml'
      - 'docs/packages/componentize-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-componentize-py.yml'
      - 'docs/packages/componentize-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: componentize-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build componentize-py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "componentize-py"
      version: "${{ matrix.version }}"
      repository: "bytecodealliance/componentize-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # build.rs cross-compiles CPython and the runtime shims to
      # wasm32-wasip2 using WASI-SDK's clang; WASI-SDK itself has to run
      # natively on the build host. Upstream's own CI only ever downloads
      # x86_64/arm64 WASI-SDK releases, but the WASI-SDK project also
      # publishes a riscv64-linux host build from wasi-sdk-33 onward
      # (its own CI cross-compiles that artifact), so fetching it
      # ourselves closes a gap in upstream's download helper rather than
      # needing a patch to build.rs (which honors WASI_SDK_PATH as-is).
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        $HOME/.cargo/bin/rustup target add wasm32-wasip2 &&
        curl -LO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-riscv64-linux.tar.gz &&
        tar xf wasi-sdk-33.0-riscv64-linux.tar.gz &&
        mv wasi-sdk-33.0-riscv64-linux /opt/wasi-sdk
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" MATURIN_PEP517_ARGS=\"--features pyo3\""
      # No wheel-level test suite ships in the source tree: upstream
      # tests via `cargo test` against wasmtime-cli, never packaged.
      cibw-test-command: >
        python -c "from componentize_py import componentize_py as m; assert m.__file__.endswith('.so'), m.__file__" &&
        componentize-py --help

  publish:
    name: Publish componentize-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: componentize-py-${{ matrix.version }}-*-manylinux_riscv64
