---
# Upstream builds its Linux wheels with a local Docker script
# (bin/build-manylinux-wheels + bin/clone-oniguruma), not CI: it clones oniguruma,
# runs autogen.sh/configure/make install in a manylinux2014_x86_64 image, then
# `pip wheel` + `auditwheel repair`. We reproduce that shape with cibuildwheel,
# pulling oniguruma from its tagged GitHub release tarball (already carries a
# generated ./configure, so no autogen.sh/libtool is needed).
name: Build onigurumacffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'onigurumacffi version to build (git tag without leading v, e.g. 1.5.0)'
        required: true
        default: '1.5.0'
  pull_request:
    paths:
      - '.github/workflows/build-onigurumacffi.yml'
      - 'patches/onigurumacffi/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.5.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.5.0 there.
  ONIGURUMACFFI_VERSION: ${{ inputs.version || '1.5.0' }}
  ONIGURUMA_VERSION: 6.9.10
  ONIGURUMA_SHA256: 2a5cfc5ae259e4e97f86b68dfffc152cdaffe94e2060b770cb827238d769fc05
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build onigurumacffi ${{ inputs.version || '1.5.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version, so
          # cp312 (our floor) is what reproduces a cp312-abi3 wheel; cibuildwheel
          # reuses+tests that one wheel on cp313/cp314 via find_compatible_wheel.
          - tag: cp312-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # setup.py skips the bdist_wheel abi3 override under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout onigurumacffi v${{ env.ONIGURUMACFFI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: asottile/onigurumacffi
          ref: v${{ env.ONIGURUMACFFI_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # oniguruma's licence has to travel with the libonig.so auditwheel vendors
      # below; upstream's wheel carries only its own LICENSE.
      - name: Patch onigurumacffi source
        run: |
          git apply python-wheels/patches/onigurumacffi/${{ env.ONIGURUMACFFI_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_BUILD_FRONTEND: build
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl -sSL -o /tmp/onig.tar.gz
            https://github.com/kkos/oniguruma/releases/download/v${{ env.ONIGURUMA_VERSION }}/onig-${{ env.ONIGURUMA_VERSION }}.tar.gz &&
            echo "${{ env.ONIGURUMA_SHA256 }}  /tmp/onig.tar.gz" | sha256sum -c &&
            tar xzf /tmp/onig.tar.gz -C /tmp &&
            cp /tmp/onig-${{ env.ONIGURUMA_VERSION }}/COPYING {project}/LICENSE.oniguruma &&
            cd /tmp/onig-${{ env.ONIGURUMA_VERSION }} &&
            ./configure && make -j4 install &&
            cd / && rm -rf /tmp/onig-${{ env.ONIGURUMA_VERSION }} /tmp/onig.tar.gz
          # cffi, needed to build and to import the extension, has no riscv64 wheel on PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # __onig_version__ proves the extension linked our from-source oniguruma
          # build, not a stub; the licences check guards the patch above.
          CIBW_TEST_COMMAND: >-
            python -c "import _onigurumacffi, onigurumacffi, importlib.metadata as m;
            assert _onigurumacffi.__file__.endswith('.so'), _onigurumacffi.__file__;
            assert onigurumacffi.__onig_version__ == '${{ env.ONIGURUMA_VERSION }}', onigurumacffi.__onig_version__;
            l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('onigurumacffi') if '.dist-info/licenses/' in str(p));
            assert l == ['LICENSE', 'LICENSE.oniguruma'], l" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: onigurumacffi-${{ env.ONIGURUMACFFI_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish onigurumacffi ${{ inputs.version || '1.5.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: onigurumacffi-${{ inputs.version || '1.5.0' }}-*-manylinux_riscv64
