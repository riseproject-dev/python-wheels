---
# Upstream builds its Linux wheels with a local Docker script
# (bin/build-manylinux-wheels + bin/clone-oniguruma), not CI: it clones oniguruma,
# runs autogen.sh/configure/make install in a manylinux2014_x86_64 image, then
# `pip wheel` + `auditwheel repair`. We reproduce that shape with cibuildwheel,
# pulling oniguruma from its tagged GitHub release tarball (already carries a
# generated ./configure, so no autogen.sh/libtool is needed).
name: Build onigurumacffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/onigurumacffi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-onigurumacffi.yml'
      - 'docs/packages/onigurumacffi.yaml'
      - 'patches/onigurumacffi/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onigurumacffi.yml'
      - 'docs/packages/onigurumacffi.yaml'
      - 'patches/onigurumacffi/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  ONIGURUMA_VERSION: 6.9.10
  ONIGURUMA_SHA256: 2a5cfc5ae259e4e97f86b68dfffc152cdaffe94e2060b770cb827238d769fc05
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: onigurumacffi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build onigurumacffi ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version, so
          # cp312 (our floor) is what reproduces a cp312-abi3 wheel; cibuildwheel
          # reuses+tests that one wheel on cp313/cp314 via find_compatible_wheel.
          - tag: cp312-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # setup.py skips the bdist_wheel abi3 override under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "onigurumacffi"
      version: "${{ matrix.version }}"
      repository: "asottile/onigurumacffi"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"

      # oniguruma's licence has to travel with the libonig.so auditwheel vendors
      # below; upstream's wheel carries only its own LICENSE.
      patches: true

      cibw-build: "${{ matrix.build }}"
      cibw-build-frontend: "build"
      cibw-before-all-linux: "curl -sSL -o /tmp/onig.tar.gz https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz && echo \"2a5cfc5ae259e4e97f86b68dfffc152cdaffe94e2060b770cb827238d769fc05  /tmp/onig.tar.gz\" | sha256sum -c && tar xzf /tmp/onig.tar.gz -C /tmp && cp /tmp/onig-6.9.10/COPYING {project}/LICENSE.oniguruma && cd /tmp/onig-6.9.10 && ./configure && make -j4 install && cd / && rm -rf /tmp/onig-6.9.10 /tmp/onig.tar.gz"
      # cffi, needed to build and to import the extension, has no riscv64 wheel on PyPI.
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # __onig_version__ proves the extension linked our from-source oniguruma
      # build, not a stub; the licences check guards the patch above.
      cibw-test-command: "python -c \"import _onigurumacffi, onigurumacffi, importlib.metadata as m; assert _onigurumacffi.__file__.endswith('.so'), _onigurumacffi.__file__; assert onigurumacffi.__onig_version__ == '6.9.10', onigurumacffi.__onig_version__; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('onigurumacffi') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.oniguruma'], l\" && python -m pytest tests"

  publish:
    name: Publish onigurumacffi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: onigurumacffi-${{ matrix.version }}-*-manylinux_riscv64
