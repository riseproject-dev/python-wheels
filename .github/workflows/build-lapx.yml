---
# Based on: https://github.com/rathaROG/lapx/blob/v0.9.4/.github/workflows/publish.yaml
name: Build lapx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lapx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lapx.yml'
      - 'docs/packages/lapx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lapx.yml'
      - 'docs/packages/lapx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lapx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lapx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "lapx"
      version: "${{ matrix.version }}"
      repository: "rathaROG/lapx"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # From 0.11.0 setup.py builds the LAPJVR/LAPJVH solvers with Rust and
      # refuses to build without cargo, so install the toolchain in-container.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # numpy is a build-time (headers) and runtime dependency, scipy a test-only
      # one; only our registry has either for riscv64. Only-binary keeps a newer
      # PyPI release from winning the resolution and then compiling from sdist.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-requires: "pytest pytest-timeout scipy"
      # tests/ has no __init__.py, so bare `pytest` never prepends the checkout
      # root to sys.path[0] (gotcha 218) -- `import lap` resolves to the
      # installed wheel, exactly like upstream's own `cd tests && pytest -v`.
      # The import probe proves it: the checkout has no in-place .so to shadow with.
      cibw-test-command: "python -c \"import lap._lapjv as m; assert m.__file__.endswith('.so'), m.__file__\" && cd {package}/tests && pytest -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      LAPX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lapx-${{ env.LAPX_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert {"_lapjv", "_lapjvc", "_lapjvs", "_lapjvx"} <= exts, exts
              licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
              # 0.11.0 vendors Rust crates and ships THIRD_PARTY_NOTICES for them.
              assert licences == {"LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"}, licences
          EOF

  publish:
    name: Publish lapx ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lapx-${{ matrix.version }}-*-manylinux_riscv64
