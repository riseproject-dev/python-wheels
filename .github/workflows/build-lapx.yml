---
# Based on: https://github.com/rathaROG/lapx/blob/v0.9.4/.github/workflows/publish.yaml
name: Build lapx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lapx version to build (git tag without the leading v, e.g. 0.9.4)'
        required: true
        default: '0.9.4'
  pull_request:
    paths:
      - '.github/workflows/build-lapx.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.9.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LAPX_VERSION: ${{ inputs.version || '0.9.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build lapx ${{ inputs.version || '0.9.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout lapx v${{ env.LAPX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rathaROG/lapx
          ref: v${{ env.LAPX_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build-time (headers) and runtime dependency, scipy a test-only
          # one; only our registry has either for riscv64. Only-binary keeps a newer
          # PyPI release from winning the resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: pytest pytest-timeout scipy
          # tests/ has no __init__.py, so bare `pytest` never prepends the checkout
          # root to sys.path[0] (gotcha 218) -- `import lap` resolves to the
          # installed wheel, exactly like upstream's own `cd tests && pytest -v`.
          # The import probe proves it: the checkout has no in-place .so to shadow with.
          CIBW_TEST_COMMAND: >-
            python -c "import lap._lapjv as m; assert m.__file__.endswith('.so'), m.__file__" &&
            cd {package}/tests && pytest -v

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert exts == {"_lapjv", "_lapjvc", "_lapjvs", "_lapjvx"}, exts
              licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "NOTICE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lapx-${{ env.LAPX_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lapx ${{ inputs.version || '0.9.4' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: lapx-${{ inputs.version || '0.9.4' }}-*-manylinux_riscv64
