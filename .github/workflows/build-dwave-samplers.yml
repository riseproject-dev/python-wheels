---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/dwavesystems/dwave-samplers/blob/1.8.0/pyproject.toml
#   https://github.com/dwavesystems/dwave-samplers/blob/1.8.0/.circleci/config.yml
name: Build dwave-samplers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dwave-samplers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dwave-samplers.yml'
      - 'docs/packages/dwave-samplers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dwave-samplers.yml'
      - 'docs/packages/dwave-samplers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dwave-samplers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dwave-samplers ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: dwave-samplers
      version: ${{ matrix.version }}
      repository: dwavesystems/dwave-samplers
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # The build-time dimod==0.12.21 pin, and dimod for cp310/cp311 tests, have no
      # riscv64 wheel; pip compiles them from their PyPI sdists.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy PIP_PREFER_BINARY=1 UV_ONLY_BINARY=numpy UV_PREFER_BINARY=1 UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ UV_INDEX_STRATEGY=unsafe-best-match"
  publish:
    name: Publish dwave-samplers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dwave-samplers-${{ matrix.version }}-*-manylinux_riscv64
