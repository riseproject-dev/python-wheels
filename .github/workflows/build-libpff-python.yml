---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/libyal/libpff/blob/20260926/.github/workflows/build_wheel.yml
name: Build libpff-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libpff-python.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libpff-python.yml'
      - 'docs/packages/libpff-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libpff-python.yml'
      - 'docs/packages/libpff-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libpff-python
      version: ${{ inputs.version }}

  build_wheels_linux:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libpff-python ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      LIBPFF_PYTHON_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout libpff ${{ env.LIBPFF_PYTHON_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: libyal/libpff
          ref: ${{ env.LIBPFF_PYTHON_VERSION }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf automake autopoint build-essential git libtool pkg-config

      - name: Prepare build
        run: |
          ./synclibs.sh
          ./autogen.sh
          ./configure
          make sources >/dev/null

      - name: Build Python wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: .
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python tests/runtests.py
          CIBW_TEST_SOURCES: tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: libpff-python-${{ env.LIBPFF_PYTHON_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish libpff-python ${{ matrix.version }}
    needs: [setup, build_wheels_linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: libpff-python-${{ matrix.version }}-*-manylinux_riscv64
