---
# This workflow is based on the `wheels` job of
# https://github.com/srstevenson/nb-clean/blob/v6.0.0/.github/workflows/wheels.yml
name: Build nb-clean wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nb-clean.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nb-clean.yml'
      - 'docs/packages/nb-clean.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nb-clean.yml'
      - 'docs/packages/nb-clean.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nb-clean
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
    # with no ABI tag, so a single native build covers every interpreter.
    uses: $/.github/workflows/_build-maturin.yml
    with:
      package: nb-clean
      version: ${{ matrix.version }}
      repository: srstevenson/nb-clean
      ref: v${{ matrix.version }}
      artifact-tag: manylinux_riscv64
      timeout-minutes: 120
      maturin-args: --release --locked

  test_wheel:
    name: Test nb-clean ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      NB_CLEAN_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout nb-clean v${{ env.NB_CLEAN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: srstevenson/nb-clean
          ref: v${{ env.NB_CLEAN_VERSION }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nb-clean-${{ env.NB_CLEAN_VERSION }}-${{ matrix.platform }}_riscv64
          path: dist

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      # Upstream's own wheel-test harness: it builds its own throwaway venv,
      # installs the wheel into it, and exercises the CLI and the Git clean
      # filter end to end.
      - name: Test wheel
        run: python tests/test_wheel.py dist

  publish:
    name: Publish nb-clean ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nb-clean-${{ matrix.version }}-manylinux_riscv64
