---
# Based on the `test` and `build_wheels` jobs of
# https://github.com/bluetooth-devices/bleak-esphome/blob/v4.1.0/.github/workflows/ci.yml
name: Build bleak-esphome wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bleak-esphome.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bleak-esphome.yml'
      - 'docs/packages/bleak-esphome.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bleak-esphome.yml'
      - 'docs/packages/bleak-esphome.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bleak-esphome
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bleak-esphome ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: bleak-esphome
      version: ${{ matrix.version }}
      repository: bluetooth-devices/bleak-esphome
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # cryptography, a hard runtime dependency, has no musllinux riscv64 wheel.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # REQUIRE_CYTHON must reach the build container; only-binary keeps pip on our compiled deps.
      cibw-environment: >-
        REQUIRE_CYTHON=1
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=aioesphomeapi,bluetooth-data-tools,cffi,cryptography,habluetooth,lru-dict,zeroconf
      # Upstream's pytest ini is coverage-only and its pythonpath would shadow the wheel with src/.
      cibw-test-sources: tests
      # The dev group's zeroconf<0.151.0 pin has no riscv64 wheel; aioesphomeapi pulls zeroconf in.
      cibw-test-requires: >-
        pytest>=9.1.1,<10 pytest-codspeed>=5.0.3,<6.0.0
        pytest-asyncio>=1.4.0,<2.0.0
      # build_ext.py swallows compile errors, so prove the installed module is compiled.
      cibw-test-command: >-
        python -c "from bleak_esphome.backend import scanner;
        assert scanner.__file__.endswith('.so'), scanner.__file__" &&
        python -m pytest -v -Wdefault tests
      timeout-minutes: 120

  publish:
    name: Publish bleak-esphome ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bleak-esphome-${{ matrix.version }}-*-manylinux_riscv64
