---
# This workflow is based on: https://github.com/chrisstaite/lameenc/blob/v1.8.4/.github/workflows/build.sh
name: Build lameenc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lameenc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lameenc.yml'
      - 'docs/packages/lameenc.yaml'
      - 'patches/lameenc/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lameenc.yml'
      - 'docs/packages/lameenc.yaml'
      - 'patches/lameenc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LAME_VERSION: '3.100'
  LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lameenc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lameenc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "lameenc"
      version: "${{ matrix.version }}"
      repository: "chrisstaite/lameenc"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/lameenc/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Replaces upstream's per-container build.sh, which loops every
      # /opt/python/*/bin itself; cibuildwheel does that looping for us.
      cibw-before-all-linux: "curl -fsSL https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download -o lame.tar.gz && echo \"ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e lame.tar.gz\" | sha256sum -c - && tar xzf lame.tar.gz && sed -i 's/0-9\\*0-9\\*/[0-9]*[0-9]*/g' lame-3.100/configure && cp {project}/fixed-libmp3lame.sym lame-3.100/include/libmp3lame.sym && cd lame-3.100 && cp /usr/share/automake-*/config.guess /usr/share/automake-*/config.sub . && ./configure \"CFLAGS=-fPIC -fno-fast-math\" LDFLAGS=-fPIC --prefix=/tmp/lame --enable-expopt --enable-nasm --disable-frontend --disable-decoder --disable-analyzer-hooks --disable-debug --disable-dependency-tracking && make && make install && cp COPYING {project}/LICENSE.lame"
      cibw-build-frontend: "build; args: -C--build-option=--libdir=/tmp/lame/lib -C--build-option=--incdir=/tmp/lame/include/lame"
      # `git apply` above dirties the tree, which renames the
      # setuptools_scm version; pin it back to the tag.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_LAMEENC=${{ matrix.version }}"
      cibw-test-command: "python3 -c \"import lameenc; enc = lameenc.Encoder(); enc.set_bit_rate(128); enc.set_in_sample_rate(16000); enc.set_channels(1); enc.set_quality(2); data = enc.encode(b'\\x00\\x00' * 16000) + enc.flush(); assert len(data) > 0, 'no mp3 data produced'\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      LAMEENC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lameenc-${{ env.LAMEENC_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("lameenc.") and n.endswith(".so") for n in names), whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.lame"}, (whl, licences)
              print(whl, "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources for lameenc ${{ matrix.version }}
    runs-on: ubuntu-latest

    env:
      LAMEENC_VERSION: ${{ matrix.version }}

    steps:
      - name: Download and verify the LAME ${{ env.LAME_VERSION }} source
        run: |
          curl -fsSL "https://sourceforge.net/projects/lame/files/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz/download" \
            -o "lame-${LAME_VERSION}.tar.gz"
          echo "${LAME_SHA256}  lame-${LAME_VERSION}.tar.gz" | sha256sum -c -
          tar cf gpl-sources.tar "lame-${LAME_VERSION}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lameenc-${{ matrix.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish lameenc ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lameenc-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: lameenc-${{ matrix.version }}-gpl-sources
      gpl-sources-description: LAME 3.100 (LGPL-2.0, statically linked)
