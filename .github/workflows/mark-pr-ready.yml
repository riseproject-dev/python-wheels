name: Mark PRs ready for review

on:
  workflow_dispatch:
    inputs:
      merge:
        description: Also squash-merge PRs whose latest workflows all passed
        type: boolean
        default: false

concurrency:
  group: mark-pr-ready
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  mark-pr-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Run mark-pr-ready.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run ci_scripts/mark-pr-ready.py ${{ inputs.merge && '--merge' || '' }}
