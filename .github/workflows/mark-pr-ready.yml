name: Mark PRs ready for review

on:
  workflow_dispatch:
    inputs:
      merge:
        description: Also squash-merge PRs whose latest workflows all passed
        type: boolean
        default: false
      author:
        description: Only modify and merge PRs from this author (empty for any author)
        type: string
        default: app/riseproject-dev

concurrency:
  group: mark-pr-ready
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  mark-pr-ready:
    runs-on: ubuntu-latest
    steps:
      # A merge made with GITHUB_TOKEN raises no push event, so the workflows
      # that run on main after a merge would never start. Merge as the App
      # instead; without its credentials the job falls back to GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        if: ${{ vars.RISEPROJECT_APP_CLIENT_ID != '' }}
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Run mark-pr-ready.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ inputs.author }}
        run: |
          args=()
          if [ -n "$AUTHOR" ]; then args+=(--author "$AUTHOR"); fi
          uv run ci_scripts/mark-pr-ready.py "${args[@]}" ${{ inputs.merge && '--merge' || '' }}
