#
# Upstream builds Linux wheels via cibuildwheel in .github/workflows/build_wheels.yml
# (manylinux2014 x86_64/i686) and build_wheels_linux_aarch64.yml (same recipe under QEMU).
# Both drive invoke's build.deps/build.nassl tasks, which build OpenSSL (twice: a legacy
# OpenSSL_1_0_2e and a modern OpenSSL_1_1_1w extension) and zlib from source via
# build_config.py before compiling the C extension against the result.
---
name: Build nassl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nassl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nassl.yml'
      - 'docs/packages/nassl.yaml'
      - 'patches/nassl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nassl.yml'
      - 'docs/packages/nassl.yaml'
      - 'patches/nassl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nassl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nassl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nassl"
      version: "${{ matrix.version }}"
      repository: "nabla-c0d3/nassl"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The riscv64 image's minimal perl-interpreter lacks FindBin/lib, which
      # OpenSSL's Configure needs (CLAUDE.md gotcha 46).
      cibw-before-all-linux: "dnf -y install perl && python -m pip install setuptools invoke && invoke build.deps"
      cibw-before-build: "python -m pip install setuptools invoke && invoke build.nassl"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -m pytest {project}/tests"

  publish:
    name: Publish nassl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nassl-${{ matrix.version }}-*-manylinux_riscv64
