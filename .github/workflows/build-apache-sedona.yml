---
# Based on upstream's own wheel build at this tag:
#   https://github.com/apache/sedona/blob/sedona-1.9.1/.github/workflows/python-wheel.yml
name: Build apache-sedona wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/apache-sedona.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-sedona.yml'
      - 'docs/packages/apache-sedona.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-sedona.yml'
      - 'docs/packages/apache-sedona.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: apache-sedona
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build apache-sedona ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "apache-sedona"
      version: "${{ matrix.version }}"
      repository: "apache/sedona"
      ref: "sedona-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-package-dir: "python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # shapely (installed as a dependency of the built wheel) only has a
      # riscv64 wheel on our own registry, not on public PyPI.
      # sedona.spark.utils (which the test below imports through) hard-requires
      # pyspark to import at all, even though the base wheel doesn't declare it -
      # only the "spark" extra does. pyspark itself ships no wheel on any arch
      # (sdist only), but is pure Python + bundled jars, so it builds trivially.
      # Importing sedona.spark also reaches sedona.spark.sql.functions, which
      # imports pandas directly (undeclared anywhere in sedona's own metadata).
      cibw-test-extras: "spark"
      cibw-test-requires: "pytest pandas"
      # pandas has no cp314t wheel on our registry yet, and it's needed
      # transitively to even import the test module; skip testing that leg
      # (the wheel itself still builds).
      cibw-test-skip: "cp314t-*"
      # geomserde_speedup's own suite: exercises (de)serialization through the
      # compiled extension without needing a JVM/Spark session, unlike the rest
      # of the test tree (see .github/workflows/python-extension.yml upstream).
      cibw-test-sources: "python/tests/utils/test_geomserde_speedup.py"
      cibw-test-command: "python -m pytest python/tests/utils/test_geomserde_speedup.py -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # pyspark (a test-only dependency, pulled in via the "spark" extra) ships no
    # wheel anywhere and is a ~400MB sdist; give the download/install room.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SEDONA_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apache-sedona-${{ env.SEDONA_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "geomserde_speedup" in n for n in names), \
                  f"no geomserde_speedup extension in {whl}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish apache-sedona ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: apache-sedona-${{ matrix.version }}-*-manylinux_riscv64
