---
# This workflow is based on: https://github.com/mthh/jenkspy/blob/0.4.1/.github/workflows/wheel.yml
name: Build jenkspy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'jenkspy version to build (git tag, e.g. 0.4.1)'
        required: true
        default: '0.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-jenkspy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  JENKSPY_VERSION: ${{ inputs.version || '0.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build jenkspy ${{ inputs.version || '0.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout jenkspy ${{ env.JENKSPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mthh/jenkspy
          ref: ${{ env.JENKSPY_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: pip install numpy cython
          # numpy has no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_COMMAND: python {package}/tests/test_jenks.py

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "jenks" in n for n in names), whl
              licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jenkspy-${{ env.JENKSPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish jenkspy ${{ inputs.version || '0.4.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: jenkspy-${{ inputs.version || '0.4.1' }}-*-manylinux_riscv64
