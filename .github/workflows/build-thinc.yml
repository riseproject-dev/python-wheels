---
# This workflow is based on the `build_wheels` job of
# https://github.com/explosion/thinc/blob/release-v9.1.1/.github/workflows/cibuildwheel.yml
name: Build thinc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'thinc version to build (git tag without the leading release-v, e.g. 9.1.1)'
        required: true
        default: '9.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-thinc.yml'
      - 'patches/thinc/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '9.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  THINC_VERSION: ${{ inputs.version || '9.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build thinc ${{ inputs.version || '9.1.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # 9.1.1 pins `cython>=0.25,<3.0`, and Cython 0.29 emits calls to the
        # pre-3.13 `_PyLong_AsByteArray` signature, so cp313+ cannot compile.
        # Upstream ships cp39-cp312 wheels for this release for the same reason.
        python: ["cp312"]

    steps:
      - name: Checkout thinc release-v${{ env.THINC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/thinc
          ref: release-v${{ env.THINC_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch thinc source
        run: git apply python-wheels/patches/thinc/${{ env.THINC_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI; the build and the test
          # environment both resolve it from our registry.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # build-system.requires verbatim, except numpy: 2.5.0 replaced the
          # legacy numpy/__init__.pxd with a hard "requires Cython 3.0.0 or
          # newer" abort, and this release pins cython<3.0.
          CIBW_BEFORE_BUILD: >-
            pip install setuptools wheel "cython>=0.25,<3.0"
            "murmurhash>=1.0.2,<1.1.0" "cymem>=2.0.2,<2.1.0"
            "preshed>=3.0.2,<3.1.0" "blis>=1.0.0,<1.1.0" "numpy>=2.0.0,<2.5.0"
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_TEST_REQUIRES: pytest>=8.2.0 hypothesis>=3.27.0,<6.72.2 mock>=2.0.0,<3.0.0
          # setup.cfg registers the `slow` marker; without it -Werror turns
          # PytestUnknownMarkWarning into a collection error.
          CIBW_TEST_SOURCES: setup.cfg
          CIBW_TEST_COMMAND: python -m pytest --pyargs thinc -Werror

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {
              "thinc/backends/cblas",
              "thinc/backends/numpy_ops",
              "thinc/layers/premap_ids",
              "thinc/layers/sparselinear",
          }
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split(".", 1)[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: thinc-${{ env.THINC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish thinc ${{ inputs.version || '9.1.1' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: thinc-${{ env.THINC_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
