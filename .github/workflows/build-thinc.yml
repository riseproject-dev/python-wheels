---
# This workflow is based on the `build_wheels` job of
# https://github.com/explosion/thinc/blob/release-v9.1.1/.github/workflows/cibuildwheel.yml
name: Build thinc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/thinc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-thinc.yml'
      - 'docs/packages/thinc.yaml'
      - 'patches/thinc/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thinc.yml'
      - 'docs/packages/thinc.yaml'
      - 'patches/thinc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: thinc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build thinc ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # 9.1.1 pins `cython>=0.25,<3.0`, and Cython 0.29 emits calls to the
        # pre-3.13 `_PyLong_AsByteArray` signature, so cp313+ cannot compile.
        # Upstream ships cp39-cp312 wheels for this release for the same reason;
        # 10.0.0 moved to Cython 3 and builds on every interpreter.
        python: ["cp312", "cp313", "cp314"]
        exclude:
          - version: 9.1.1
            python: cp313
          - version: 9.1.1
            python: cp314

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "thinc"
      version: "${{ matrix.version }}"
      repository: "explosion/thinc"
      ref: ''
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 300
      pre-build: |-
        export THINC_VERSION='${{ matrix.version }}'
        for ref in "release-v$THINC_VERSION" "v$THINC_VERSION" "$THINC_VERSION"; do
          git ls-remote --exit-code --tags https://github.com/explosion/thinc "refs/tags/$ref" >/dev/null && break
        done
        test -n "$ref"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/thinc/$THINC_VERSION"
        if [ -d "$patches" ]; then
          git apply "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > resolve-build-requires.py <<'REQ_EOF'
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as f:
            requires = tomllib.load(f)["build-system"]["requires"]
        old_cython = any(
            r.lower().startswith("cython") and "<3" in r.replace(" ", "")
            for r in requires
        )
        for r in requires:
            print("numpy>=2.0.0,<2.5.0" if old_cython and r.lower().startswith("numpy") else r)
        REQ_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # numpy has no riscv64 wheel on public PyPI; the build and the test
      # environment both resolve it from our registry.
      # build-system.requires of the checkout, with numpy capped below 2.5.0 for a
      # Cython<3 release (see "Stage the build-requirements script").
      cibw-before-build: "python {project}/resolve-build-requires.py {project}/pyproject.toml > /tmp/build-requirements.txt && pip install wheel -r /tmp/build-requirements.txt"
      cibw-build-frontend: "build; args: --no-isolation"
      cibw-test-requires: "pytest>=8.2.0 hypothesis>=3.27.0,<6.72.2 mock>=2.0.0,<3.0.0"
      # setup.cfg registers the `slow` marker; without it -Werror turns
      # PytestUnknownMarkWarning into a collection error.
      cibw-test-sources: "setup.cfg"
      cibw-test-command: "python -m pytest --pyargs thinc -Werror"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # 9.1.1 pins `cython>=0.25,<3.0`, and Cython 0.29 emits calls to the
        # pre-3.13 `_PyLong_AsByteArray` signature, so cp313+ cannot compile.
        # Upstream ships cp39-cp312 wheels for this release for the same reason;
        # 10.0.0 moved to Cython 3 and builds on every interpreter.
        python: ["cp312", "cp313", "cp314"]
        exclude:
          - version: 9.1.1
            python: cp313
          - version: 9.1.1
            python: cp314
    env:
      THINC_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: thinc-${{ env.THINC_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import os, sys, zipfile
          expected = {
              "thinc/backends/cblas",
              "thinc/backends/numpy_ops",
              "thinc/layers/premap_ids",
              "thinc/layers/sparselinear",
          }
          # 10.0.0 also compiles thinc.backends.linalg and thinc.extra.search.
          if not os.environ["THINC_VERSION"].startswith("9."):
              expected |= {"thinc/backends/linalg", "thinc/extra/search"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split(".", 1)[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish thinc ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: thinc-${{ matrix.version }}-*-manylinux_riscv64
