---
# Based on the `build_wheels` job of
# https://github.com/TkTech/mutf8/blob/v1.1.0/.github/workflows/release.yml
name: Build mutf8 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mutf8.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mutf8.yml'
      - 'docs/packages/mutf8.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mutf8.yml'
      - 'docs/packages/mutf8.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mutf8
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mutf8 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mutf8
      version: ${{ matrix.version }}
      repository: TkTech/mutf8
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # ext-modules is optional=true (falls back to the pure-Python mutf8/mutf8.py on
      # a failed compile); conftest.py's unconditional `import mutf8.cmutf8` already
      # hard-fails collection if that happens, but assert it explicitly too.
      cibw-test-command: >-
        python -c "import mutf8.cmutf8 as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest {project}/tests
      timeout-minutes: 60

  publish:
    name: Publish mutf8 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mutf8-${{ matrix.version }}-*riscv64
