---
# Based on the `build_wheels` job of
# https://github.com/TkTech/mutf8/blob/v1.1.0/.github/workflows/release.yml
name: Build mutf8 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'mutf8 version to build (git tag without leading v, e.g. 1.1.0)'
        required: true
        default: '1.1.0'
  pull_request:
    paths:
      - '.github/workflows/build-mutf8.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.1.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MUTF8_VERSION: ${{ inputs.version || '1.1.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build mutf8 ${{ inputs.version || '1.1.0' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout mutf8 v${{ env.MUTF8_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TkTech/mutf8
          ref: v${{ env.MUTF8_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # ext-modules is optional=true (falls back to the pure-Python mutf8/mutf8.py on
          # a failed compile); conftest.py's unconditional `import mutf8.cmutf8` already
          # hard-fails collection if that happens, but assert it explicitly too.
          CIBW_TEST_COMMAND: >-
            python -c "import mutf8.cmutf8 as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutf8-${{ env.MUTF8_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mutf8 ${{ inputs.version || '1.1.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: mutf8-${{ inputs.version || '1.1.0' }}-*riscv64
