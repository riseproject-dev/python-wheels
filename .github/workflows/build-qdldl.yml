---
# This workflow is based on: https://github.com/osqp/qdldl-python/blob/v0.1.9.post1/.github/workflows/build.yml
name: Build qdldl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/qdldl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-qdldl.yml'
      - 'docs/packages/qdldl.yaml'
      - 'patches/qdldl/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qdldl.yml'
      - 'docs/packages/qdldl.yaml'
      - 'patches/qdldl/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: qdldl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build qdldl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "qdldl"
      version: "${{ matrix.version }}"
      repository: "osqp/qdldl-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "true"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build-time requirement too, and has no riscv64 wheel on
      # public PyPI; scipy is only needed at test time. Both are on our registry.
      cibw-environment-linux: "CMAKE_GENERATOR=\"Unix Makefiles\""
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(str(p).split('licenses/', 1)[1] for p in m.files('qdldl') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.amd'], f\" && python -m pytest {project}/tests"

  publish:
    name: Publish qdldl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: qdldl-${{ matrix.version }}-*-manylinux_riscv64
