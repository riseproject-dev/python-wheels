---
name: Build spidev wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spidev.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spidev.yml'
      - 'docs/packages/spidev.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spidev.yml'
      - 'docs/packages/spidev.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spidev
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spidev ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: spidev
      version: ${{ matrix.version }}
      repository: doceme/py-spidev
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # spidev_module.c pulls in linux/spi/spidev.h; manylinux already has
      # it via glibc-devel, musllinux's Alpine base needs linux-headers.
      cibw-before-all-linux: (command -v apk && apk add linux-headers) || true
      # Upstream ships no CI and no test suite at all (it's a thin ioctl
      # wrapper around /dev/spidev*, which no CI runner has) - exercise the
      # compiled extension and the real open()/ioctl error path instead.
      cibw-test-command: |
        python3 - <<'PYEOF'
        import spidev
        assert spidev.__file__.endswith(".so"), spidev.__file__
        assert spidev.__version__ == "${{ matrix.version }}", spidev.__version__
        spi = spidev.SpiDev()
        try:
            spi.open_path("/dev/spidev-does-not-exist")
        except OSError:
            pass
        else:
            raise SystemExit("expected OSError for a non-existent spidev device")
        PYEOF
      timeout-minutes: 60

  publish:
    name: Publish spidev ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spidev-${{ matrix.version }}-*riscv64
