---
# This workflow is based on the `linux` job of
# https://github.com/alesanfra/toons/blob/0.7.0/.github/workflows/CI.yml
name: Build toons wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/toons.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-toons.yml'
      - 'docs/packages/toons.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-toons.yml'
      - 'docs/packages/toons.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: toons
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build toons ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature gives one wheel for every GIL-ful
          # interpreter; free-threaded builds disable abi3 and get their own
          # (matches the cp37-abi3 + cp314-cp314t split upstream publishes).
          - tag: cp37-abi3
            # Built on cp312 -- our floor -- and re-tested on the newer
            # GIL-ful interpreters via find_compatible_wheel.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "toons"
      version: "${{ matrix.version }}"
      repository: "alesanfra/toons"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 90
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # toons ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Test each wheel the way upstream does - run its pytest suite. All
      # test deps are stdlib; tests live inside the checkout cibuildwheel
      # builds, so reference them via {package}, not {project} (gotcha 5).
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest -v {package}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py37 feature gives one wheel for every GIL-ful
          # interpreter; free-threaded builds disable abi3 and get their own
          # (matches the cp37-abi3 + cp314-cp314t split upstream publishes).
          - tag: cp37-abi3
            # Built on cp312 -- our floor -- and re-tested on the newer
            # GIL-ful interpreters via find_compatible_wheel.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64
    env:
      TOONS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: toons-${{ env.TOONS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and license made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("toons/toons") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish toons ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: toons-${{ matrix.version }}-*-manylinux_riscv64
