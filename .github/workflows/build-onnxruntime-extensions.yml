---
# This workflow is based on
# https://github.com/microsoft/onnxruntime-extensions/blob/rel-0.15/.pipelines/wheels_linux.yml
# (cibuildwheel), with the Python tests of .pipelines/ci.yml.
name: Build onnxruntime-extensions wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/onnxruntime-extensions.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxruntime-extensions.yml'
      - 'docs/packages/onnxruntime-extensions.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onnxruntime-extensions.yml'
      - 'docs/packages/onnxruntime-extensions.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: onnxruntime-extensions
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build onnxruntime-extensions ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "onnxruntime-extensions"
      version: "${{ matrix.version }}"
      repository: "microsoft/onnxruntime-extensions"
      ref: ''
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        export ONNXRUNTIME_EXTENSIONS_VERSION='${{ matrix.version }}'
        case "${ONNXRUNTIME_EXTENSIONS_VERSION}" in
          0.15.2) ref=8599e104c73429bf9e267e215504e296607a2ae9 ;;
          *) echo "no release commit known for ${ONNXRUNTIME_EXTENSIONS_VERSION}" >&2; exit 1 ;;
        esac
        BUILD_SOURCEBRANCHNAME="rel-${ONNXRUNTIME_EXTENSIONS_VERSION%.*}"
        export BUILD_SOURCEBRANCHNAME
        printf '%s\n' "BUILD_SOURCEBRANCHNAME=$BUILD_SOURCEBRANCHNAME" >> "$GITHUB_ENV"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD

        cp ThirdPartyNotices.txt LICENSE.ThirdPartyNotices
        curl -fsSL https://raw.githubusercontent.com/protocolbuffers/protobuf/v21.12/LICENSE -o LICENSE.protobuf
        curl -fsSL https://raw.githubusercontent.com/pybind/pybind11/v2.12.0/LICENSE -o LICENSE.pybind11
        curl -fsSL https://raw.githubusercontent.com/davisking/dlib/v19.24.7/dlib/external/libpng/LICENSE -o LICENSE.libpng
        curl -fsSL https://raw.githubusercontent.com/davisking/dlib/v19.24.7/dlib/external/libjpeg/README -o LICENSE.libjpeg
        curl -fsSL https://raw.githubusercontent.com/davisking/dlib/v19.24.7/dlib/external/zlib/README -o LICENSE.zlib

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # BUILD_SOURCEBRANCHNAME is what upstream's release pipeline sets; without it setup.py
      # appends +<sha> to the version of a commit that is not a rel-* branch tip.
      cibw-environment-linux: |-
        ONNXRUNTIME_EXTENSIONS_VERSION=${{ matrix.version }}
        OCOS_ENABLE_AZURE=0 BUILD_SOURCEBRANCHNAME=rel-${ONNXRUNTIME_EXTENSIONS_VERSION%.*}
      cibw-test-requires: "pytest onnx onnxruntime"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,onnx,onnxruntime,ml_dtypes"
      # The test modules that need nothing beyond onnx/onnxruntime; the rest import
      # torch, transformers or tensorflow, which have no riscv64 wheels.
      cibw-test-command: "cd {project}/test && python -m pytest test_audio_codec.py test_audio_signal.py test_blingfire_sentencebreaker.py test_masked_fill.py test_pyops.py test_segment_extraction.py test_string_concat.py test_string_ecma_regex.py test_string_length.py test_string_mapping.py test_string_ops.py test_string_to_vector.py test_vector_to_string.py --verbose"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ONNXRUNTIME_EXTENSIONS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: onnxruntime-extensions-${{ env.ONNXRUNTIME_EXTENSIONS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-${{ env.ONNXRUNTIME_EXTENSIONS_VERSION }}-${{ matrix.python }}-${{ matrix.python }}-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {"_extensions_pydll"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.ThirdPartyNotices", "LICENSE.protobuf",
                              "LICENSE.pybind11", "LICENSE.libpng", "LICENSE.libjpeg",
                              "LICENSE.zlib"}, licences
          EOF

  publish:
    name: Publish onnxruntime-extensions ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: onnxruntime-extensions-${{ matrix.version }}-*-manylinux_riscv64
