---
# This workflow is based on the `build_wheels` job of
# https://github.com/SciTools/cartopy/blob/v0.25.0/.github/workflows/release.yml
name: Build cartopy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cartopy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cartopy.yml'
      - 'docs/packages/cartopy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cartopy.yml'
      - 'docs/packages/cartopy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cartopy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cartopy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cartopy"
      version: "${{ matrix.version }}"
      repository: "SciTools/cartopy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy is a build dependency; matplotlib/shapely/pyproj are runtime
      # dependencies and scipy a test-only one, all pulled in for the test install.
      # Only our registry has riscv64 wheels for them, and PIP_ONLY_BINARY keeps a
      # newer PyPI release from winning the resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,matplotlib,shapely,pyproj,scipy"
      # Building from a checkout (no PKG-INFO) makes setup.py cythonize trace.pyx
      # fresh, unlike a PyPI sdist build which ships a pre-cythonized trace.cpp and
      # skips this entirely. Cython 3.3.0 (unbounded in pyproject.toml's
      # build-system requires) regressed its own generated std::list-to-Python-list
      # conversion for trace.pyx's C++ iteration, so build isolation must not be
      # allowed to pick it.
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: "pip install \"cython<3.3\" numpy setuptools setuptools_scm wheel"
      cibw-test-requires: "pytest pytest-mpl pytest-xdist scipy"
      # Mirrors upstream's own hermetic job (ci-testing.yml's "No Network Tests"
      # step: `pytest ... -m "not natural_earth and not network"`), which also
      # runs without --mpl; image-comparison baselines are font-rendering
      # sensitive and not something upstream itself trusts cross-platform. Tests
      # are excluded from the wheel (packages.find excludes cartopy.tests), so
      # copy them out of the checkout first, as pyproj's workflow does.
      cibw-test-command: "python -c \"import cartopy; import cartopy.crs as ccrs; import shapely.geometry as sgeom; r = ccrs.Robinson().project_geometry(sgeom.LineString([(-10, 10), (10, 50)]), ccrs.PlateCarree()); assert not r.is_empty; print('cartopy.trace OK')\" && cp -r {package}/lib/cartopy/tests cartopy_tests && python -m pytest cartopy_tests -rfEsX -n 4 -m \"not natural_earth and not network\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CARTOPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cartopy-${{ env.CARTOPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the licence and the compiled extension
        run: |
          python3 - <<'EOF'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("wheelhouse/*.whl")[0]).namelist()
          assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
          assert any(n.startswith("cartopy/trace.") and n.endswith(".so") for n in names), names
          EOF

  publish:
    name: Publish cartopy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cartopy-${{ matrix.version }}-*-manylinux_riscv64
