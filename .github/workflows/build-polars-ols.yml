---
# This workflow is based on the `linux` and `linux_tests` jobs of
# https://github.com/azmyrajab/polars_ols/blob/v0.3.5/.github/workflows/CI.yml
name: Build polars-ols wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/polars-ols.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-polars-ols.yml'
      - 'docs/packages/polars-ols.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-polars-ols.yml'
      - 'docs/packages/polars-ols.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # rust-toolchain.toml floats on "nightly"; this is the nightly upstream's 0.3.5
  # wheels were built with (2024-08-25), which its pinned crates still compile on.
  RUST_TOOLCHAIN: nightly-2024-08-25

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: polars-ols
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build polars-ols ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      POLARS_OLS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout polars_ols v${{ env.POLARS_OLS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: azmyrajab/polars_ols
          ref: v${{ env.POLARS_OLS_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # abi3-py38 gives one wheel, built on cp312 and re-tested on cp313. cp314:
          # statsmodels has no riscv64 cp314 wheel; cp314t: pyo3 0.21 has no free-threading.
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain ${{ env.RUST_TOOLCHAIN }}
          # gotcha 76: pyproject.toml's build-system.requires pins an unused "polars"
          # (maturin builds the Rust polars crate from crates.io, never imports the
          # Python package), which resolves to polars-runtime-32 and falls back to a
          # from-source build needing a newer Rust than RUST_TOOLCHAIN. Skip resolving
          # build-system.requires entirely instead of patching the pin.
          CIBW_BEFORE_BUILD_LINUX: pip install "maturin>=1.0,<2.0"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            RUSTUP_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}
            RUSTFLAGS="-Dwarnings"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: polars numpy pytest statsmodels scikit-learn
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import polars_ols._polars_ols as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - name: Check the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp38-abi3-manylinux_" in whl and whl.endswith("_riscv64.whl"), whl
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: polars-ols-${{ env.POLARS_OLS_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish polars-ols ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: polars-ols-${{ matrix.version }}-*-manylinux_riscv64
