---
# This workflow is based on the `linux` and `linux_tests` jobs of
# https://github.com/azmyrajab/polars_ols/blob/v0.3.5/.github/workflows/CI.yml
name: Build polars-ols wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/polars-ols.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-polars-ols.yml'
      - 'docs/packages/polars-ols.yaml'
      - 'patches/polars-ols/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-polars-ols.yml'
      - 'docs/packages/polars-ols.yaml'
      - 'patches/polars-ols/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # rust-toolchain.toml floats on "nightly"; this is the nightly upstream's 0.3.5
  # wheels were built with (2024-08-25), which its pinned crates still compile on.
  RUST_TOOLCHAIN: nightly-2024-08-25

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: polars-ols
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build polars-ols ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "polars-ols"
      version: "${{ matrix.version }}"
      repository: "azmyrajab/polars_ols"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp38-abi3-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" sparse-checkout init --cone
        git -C "python-wheels" sparse-checkout set "patches/polars-ols"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/polars-ols/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # abi3-py38 gives one wheel, built on cp312 and re-tested on cp313. cp314:
      # statsmodels has no riscv64 cp314 wheel; cp314t: pyo3 0.21 has no free-threading.
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly-2024-08-25"
      # gotcha 76: pyproject.toml's build-system.requires pins an unused "polars"
      # (maturin builds the Rust polars crate from crates.io, never imports the
      # Python package), which resolves to polars-runtime-32 and falls back to a
      # from-source build needing a newer Rust than RUST_TOOLCHAIN. Skip resolving
      # build-system.requires entirely instead of patching the pin.
      cibw-before-build-linux: "pip install \"maturin>=1.0,<2.0\""
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" RUSTUP_TOOLCHAIN=nightly-2024-08-25 RUSTFLAGS=\"-Dwarnings\""
      # gotcha 67: PyPI's newer numpy/pandas sdists outrun the registry; pandas 3.1.0 fails to compile on riscv64.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas,pyarrow,scipy,statsmodels,scikit-learn,polars-runtime-32"
      # tests/requirements-test.txt, minus maturin/pyperf; the 0.3.5 suite calls
      # Expr.flatten, removed in polars 2.0.
      cibw-test-requires: "polars[pandas,pyarrow]<2 numpy pytest statsmodels scikit-learn"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import polars_ols._polars_ols as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      POLARS_OLS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: polars-ols-${{ env.POLARS_OLS_VERSION }}-cp38-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              assert "-cp38-abi3-manylinux_" in whl and whl.endswith("_riscv64.whl"), whl
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish polars-ols ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: polars-ols-${{ matrix.version }}-*-manylinux_riscv64
