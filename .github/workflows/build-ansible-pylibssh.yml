---
# This workflow is based on: https://github.com/ansible/pylibssh/blob/v1.4.0/.github/workflows/reusable-cibuildwheel.yml
name: Build ansible-pylibssh wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ansible-pylibssh.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ansible-pylibssh.yml'
      - 'docs/packages/ansible-pylibssh.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ansible-pylibssh.yml'
      - 'docs/packages/ansible-pylibssh.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ansible-pylibssh
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ansible-pylibssh ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ansible-pylibssh"
      version: "${{ matrix.version }}"
      repository: "ansible/pylibssh"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream links a statically-built libssh baked into its own
      # manylinux images; no riscv64 equivalent exists, so libssh-devel
      # (0.12.0, matching upstream's pin) is installed from Rocky 10's
      # AppStream repo instead - its headers/lib are on gcc's default
      # search path, so pyproject.toml's own `-lssh` needs no CFLAGS/
      # LDFLAGS help. `%license` (COPYING) survives the image's
      # `tsflags=nodocs`; the bundled third-party `%doc` notice doesn't,
      # hence the reinstall.
      cibw-before-all-linux: "dnf -y install libssh-devel && dnf -y reinstall --setopt=tsflags= libssh && cp /usr/share/licenses/libssh/COPYING /project/LICENSE.libssh && cp /usr/share/doc/libssh/BSD /project/LICENSE.libssh-bsd"
      # Replaces pyproject.toml's [tool.cibuildwheel.linux.environment]
      # (STATIC_DEPS_DIR paths from upstream's images, unusable here).
      # SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ANSIBLE_PYLIBSSH: the `git apply`
      # above dirties the tree, which setuptools_scm otherwise reports as
      # a `.devN+g<sha>` version (gotcha 31/53).
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ANSIBLE_PYLIBSSH=${{ matrix.version }}"
      cibw-test-requires: "pytest pytest-cov pytest-xdist"
      cibw-test-command: "python -c \"import importlib.metadata as m; n={p.name for p in m.files('ansible-pylibssh') if '.dist-info/licenses/' in str(p)}; assert n == {'LICENSE.rst', 'LICENSE.libssh', 'LICENSE.libssh-bsd'}, n\" && python -Im pytest -m smoke --no-cov {project}/tests"

  publish:
    name: Publish ansible-pylibssh ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ansible-pylibssh-${{ matrix.version }}-*-manylinux_riscv64
