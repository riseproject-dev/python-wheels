---
# Based on upstream's own wheels-rapidgzip.yml (plain cibuildwheel, building
# from the python/rapidgzip subdirectory), narrowed to riscv64.
name: Build rapidgzip wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rapidgzip.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rapidgzip.yml'
      - 'docs/packages/rapidgzip.yaml'
      - 'patches/rapidgzip/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rapidgzip.yml'
      - 'docs/packages/rapidgzip.yaml'
      - 'patches/rapidgzip/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rapidgzip
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rapidgzip ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      RAPIDGZIP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout rapidgzip v${{ env.RAPIDGZIP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mxmlnkn/rapidgzip
          ref: rapidgzip-v${{ env.RAPIDGZIP_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch rapidgzip source
        run: git apply python-wheels/patches/rapidgzip/${{ env.RAPIDGZIP_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
          package-dir: python/rapidgzip
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT_LINUX: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            rapidgzip --version &&
            python3 -X dev -u -m pytest {project}/src/tests/testGIL.py

      - name: Check the wheel carries the cxxopts and zlib-ng licenses
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          meta = z.read(next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))).decode()
          licenses = [n for n in z.namelist() if ".dist-info/" in n and "LICEN" in n.upper()]
          for entry, marker in [("src/external/cxxopts/LICENSE", b"Jarryd Beck"), ("src/external/zlib-ng/LICENSE.md", b"Jean-loup Gailly")]:
              if f"License-File: {entry}" not in meta or not any(marker in z.read(n) for n in licenses):
                  raise SystemExit(f"error: {entry} missing from {sys.argv[1]}: {licenses}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rapidgzip-${{ env.RAPIDGZIP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rapidgzip ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: rapidgzip-${{ matrix.version }}-*-manylinux_riscv64
