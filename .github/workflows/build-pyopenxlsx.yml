---
# Mirrors the Linux part of upstream's .github/workflows/build.yml (build_wheels job).
name: Build pyopenxlsx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopenxlsx.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopenxlsx.yml'
      - 'docs/packages/pyopenxlsx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopenxlsx.yml'
      - 'docs/packages/pyopenxlsx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopenxlsx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyopenxlsx ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      PYOPENXLSX_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout twn39/pyopenxlsx v${{ env.PYOPENXLSX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: twn39/pyopenxlsx
          ref: v${{ env.PYOPENXLSX_VERSION }}
          submodules: recursive
          persist-credentials: false

      # The extension statically links OpenXLSX and its vendored libraries, whose
      # notices upstream's default licence glob (root LICENSE only) leaves out.
      - name: Stage the vendored dependencies' licences
        run: |
          set -euo pipefail
          tp=third_party/OpenXLSX/third_party
          cp third_party/OpenXLSX/LICENSE.md LICENSE.OpenXLSX
          cp third_party/nanobind/LICENSE LICENSE.nanobind
          cp third_party/nanobind/ext/robin_map/LICENSE LICENSE.robin-map
          cp "$tp/GSL/LICENSE" LICENSE.GSL
          cp "$tp/fast_float/LICENSE-MIT" LICENSE.fast-float
          cp "$tp/fmt/LICENSE" LICENSE.fmt
          cp "$tp/libzip/LICENSE" LICENSE.libzip
          cp "$tp/mbedtls/LICENSE" LICENSE.mbedtls
          cp "$tp/pugixml/LICENSE.md" LICENSE.pugixml
          cp "$tp/unordered_dense/LICENSE" LICENSE.unordered-dense
          cp "$tp/zlib/LICENSE.md" LICENSE.zlib-ng

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # build[uv] needs a host uv for the audit step, which the riscv64 runner lacks (gotcha 13).
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            SKBUILD_WHEEL_LICENSE_FILES="LICENSE;LICENSE.*"

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert len(exts) == 1 and exts[0].startswith("pyopenxlsx/_openxlsx.cpython-"), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.OpenXLSX", "LICENSE.nanobind",
                              "LICENSE.robin-map", "LICENSE.GSL", "LICENSE.fast-float",
                              "LICENSE.fmt", "LICENSE.libzip", "LICENSE.mbedtls",
                              "LICENSE.pugixml", "LICENSE.unordered-dense",
                              "LICENSE.zlib-ng"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyopenxlsx-${{ env.PYOPENXLSX_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyopenxlsx ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyopenxlsx-${{ matrix.version }}-*-manylinux_riscv64
