---
# Mirrors the Linux part of upstream's .github/workflows/build.yml (build_wheels job).
name: Build pyopenxlsx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopenxlsx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopenxlsx.yml'
      - 'docs/packages/pyopenxlsx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopenxlsx.yml'
      - 'docs/packages/pyopenxlsx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopenxlsx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyopenxlsx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyopenxlsx"
      version: "${{ matrix.version }}"
      repository: "twn39/pyopenxlsx"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        set -euo pipefail
        tp=third_party/OpenXLSX/third_party
        cp third_party/OpenXLSX/LICENSE.md LICENSE.OpenXLSX
        cp third_party/nanobind/LICENSE LICENSE.nanobind
        cp third_party/nanobind/ext/robin_map/LICENSE LICENSE.robin-map
        cp "$tp/GSL/LICENSE" LICENSE.GSL
        cp "$tp/fast_float/LICENSE-MIT" LICENSE.fast-float
        cp "$tp/fmt/LICENSE" LICENSE.fmt
        cp "$tp/libzip/LICENSE" LICENSE.libzip
        cp "$tp/mbedtls/LICENSE" LICENSE.mbedtls
        cp "$tp/pugixml/LICENSE.md" LICENSE.pugixml
        cp "$tp/unordered_dense/LICENSE" LICENSE.unordered-dense
        cp "$tp/zlib/LICENSE.md" LICENSE.zlib-ng

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # build[uv] needs a host uv for the audit step, which the riscv64 runner lacks (gotcha 13).
      cibw-build-frontend: "build"
      # Upstream's test-extras pull numpy and pillow; without PIP_ONLY_BINARY pip takes
      # PyPI's newer sdists over our wheels and Pillow's fails on missing jpeg (gotchas 30/67).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pillow SKBUILD_WHEEL_LICENSE_FILES=\"LICENSE;LICENSE.*\""
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYOPENXLSX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyopenxlsx-${{ env.PYOPENXLSX_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert len(exts) == 1 and exts[0].startswith("pyopenxlsx/_openxlsx.cpython-"), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.OpenXLSX", "LICENSE.nanobind",
                              "LICENSE.robin-map", "LICENSE.GSL", "LICENSE.fast-float",
                              "LICENSE.fmt", "LICENSE.libzip", "LICENSE.mbedtls",
                              "LICENSE.pugixml", "LICENSE.unordered-dense",
                              "LICENSE.zlib-ng"}, licences
          EOF

  publish:
    name: Publish pyopenxlsx ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyopenxlsx-${{ matrix.version }}-*-manylinux_riscv64
