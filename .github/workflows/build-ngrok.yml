---
# This workflow is based on the Linux `maturin build` steps of
# https://github.com/ngrok/ngrok-python/blob/v1.7.0/.github/workflows/build.yml
# and the `test` job of
# https://github.com/ngrok/ngrok-python/blob/v1.7.0/.github/workflows/ci.yml
name: Build ngrok wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ngrok.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ngrok.yml'
      - 'docs/packages/ngrok.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ngrok.yml'
      - 'docs/packages/ngrok.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ngrok
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build ngrok ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ngrok"
      version: "${{ matrix.version }}"
      repository: "ngrok/ngrok-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 360
      # pyo3 carries abi3-py310 unconditionally, so cp313/cp314 re-test the
      # cp312 build. pyo3 0.22 cannot build for free-threaded CPython.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # aws-lc-sys is built with its `bindgen` feature, which needs libclang.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
        dnf -y install clang-devel
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-sources: "test examples pytest.ini"
      cibw-test-requires: "pytest pytest-timeout aiohttp requests mypy"
      # Upstream's suite needs an NGROK_AUTHTOKEN secret; these tests need
      # none, and test_ca_cert/test_invalid_authtoken still complete a TLS
      # handshake with the ngrok service.
      cibw-test-command: >
        python -c "import ngrok.ngrok as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m mypy
        examples/ngrok-forward-minimal.py examples/ngrok-forward-full.py
        examples/ngrok-http-minimal.py examples/ngrok-http-full.py
        examples/ngrok-labeled.py examples/ngrok-tcp.py examples/ngrok-tls.py &&
        python -m pytest -v test/test_main.py test/test.py
        -k "TestNgrokMain or test_import or test_pipe_name or test_ca_cert or test_invalid_authtoken"

  publish:
    name: Publish ngrok ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ngrok-${{ matrix.version }}-*-manylinux_riscv64
