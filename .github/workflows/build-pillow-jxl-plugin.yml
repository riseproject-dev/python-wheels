---
# This workflow is based on the `linux` job of
# https://github.com/Isotr0py/pillow-jpegxl-plugin/blob/v1.3.8/.github/workflows/release.yml
name: Build pillow-jxl-plugin wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pillow-jxl-plugin.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-jxl-plugin.yml'
      - 'docs/packages/pillow-jxl-plugin.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pillow-jxl-plugin.yml'
      - 'docs/packages/pillow-jxl-plugin.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pillow-jxl-plugin
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pillow-jxl-plugin ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pillow-jxl-plugin"
      version: "${{ matrix.version }}"
      repository: "Isotr0py/pillow-jpegxl-plugin"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pillow-jxl-plugin/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # [tool.maturin] already has `features = [..., "vendored"]`, which
      # builds libjxl/highway/brotli from source via jpegxl-src's CMake
      # invocation - no MATURIN_PEP517_ARGS needed. `cargo metadata
      # --features vendored` unpacks jpegxl-src (an optional dependency
      # gated by that feature) so its bundled licences can be staged here
      # for the widened `license-files` glob to pick up.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && export PATH=\"$PATH:$HOME/.cargo/bin\" && cargo metadata --manifest-path {package}/Cargo.toml --features vendored --format-version=1 >/dev/null && JXL_SRC=\"$(find \"$HOME/.cargo/registry/src\" -maxdepth 2 -type d -name 'jpegxl-src-*' | head -1)\" && cp \"$JXL_SRC/libjxl/LICENSE\" {package}/LICENSE.libjxl && cp \"$JXL_SRC/libjxl/PATENTS\" {package}/PATENTS.libjxl && cp \"$JXL_SRC/libjxl/third_party/highway/LICENSE\" {package}/LICENSE.highway && cp \"$JXL_SRC/libjxl/third_party/brotli/LICENSE\" {package}/LICENSE.brotli && cp \"$JXL_SRC/libjxl/third_party/skcms/LICENSE\" {package}/LICENSE.skcms"
      # PIP_ONLY_BINARY=pillow: cp310/cp311 only have an 11.3.0/12.2.0
      # riscv64 Pillow wheel on our registry (Pillow 12.0+ dropped
      # cp310, 12.3.0 dropped cp311); without this, pip's resolver
      # prefers the newest Pillow sdist visible on the combined
      # index over the older prebuilt wheel, and that sdist then
      # fails to build for lack of libjpeg headers in the test venv.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" PIP_ONLY_BINARY=pillow"
      cibw-test-requires: "pytest numpy"
      cibw-test-sources: "test"
      # test/test_plugin.py's OpenEXR/pyexiv2-gated tests are patched to
      # pytest.importorskip: pyexiv2 has no riscv64 wheel on our registry
      # at all, and OpenEXR has none for cp310/cp311.
      cibw-test-command: "python -c \"import pillow_jxl; from pillow_jxl import JpegXLImagePlugin\" && python -m pytest test/test_plugin.py -v"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PILLOW_JXL_PLUGIN_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pillow-jxl-plugin-${{ env.PILLOW_JXL_PLUGIN_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pillow_jxl/pillow_jxl") and n.endswith(".so") for n in names), whl
              licenses = sorted(n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n)
              print(whl, "licenses:", licenses)
              for expect in ("LICENSE.libjxl", "PATENTS.libjxl", "LICENSE.highway", "LICENSE.brotli", "LICENSE.skcms"):
                  assert expect in licenses, (whl, expect, licenses)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pillow-jxl-plugin ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pillow-jxl-plugin-${{ matrix.version }}-*-manylinux_riscv64
