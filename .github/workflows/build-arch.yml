---
# This workflow is based on: https://github.com/bashtage/arch/blob/v8.0.0/.github/workflows/cron-test.yml
name: Build arch wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/arch.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-arch.yml'
      - 'docs/packages/arch.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arch.yml'
      - 'docs/packages/arch.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: arch
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build arch ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "arch"
      version: "${{ matrix.version }}"
      repository: "bashtage/arch"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy/scipy/pandas/statsmodels are build- and/or run-time requirements;
      # only our registry has them for riscv64, and only-binary keeps a newer
      # PyPI release from winning resolution and compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,pandas,statsmodels"
      # arch v8.0.0 pins pytest<9 itself: its own addopts="--strict" trips
      # pytest 9's stricter default on a duplicate fixture ID arch never fixed.
      cibw-test-requires: "pytest<9 pytest-xdist pytest-cov matplotlib numpy scipy pandas seaborn"
      cibw-test-command: "python -c \"import arch; arch.test(['--skip-slow','-n','auto'])\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ARCH_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: arch-${{ env.ARCH_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_samplers", "recursions"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.md"}, licences
          EOF

  publish:
    name: Publish arch ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: arch-${{ matrix.version }}-*-manylinux_riscv64
