---
# Upstream ships no CI of its own (just appveyor.yml for Windows DLLs); the Linux/macOS/Windows
# wheels on PyPI are built and uploaded by hand from python/setup.py, a plain setuptools.Extension
# over a pre-generated SWIG wrapper (sxtwl_wrap.cxx). Upstream also pushes no git tag for 2.0.7;
# commit 98b731a ("fix long_description") is the one byte-identical to the released sdist
# (CLAUDE.md gotcha 103) -- update SXTWL_REF alongside SXTWL_VERSION.
name: Build sxtwl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sxtwl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sxtwl.yml'
      - 'docs/packages/sxtwl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sxtwl.yml'
      - 'docs/packages/sxtwl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SXTWL_REF: 98b731a66bfdb1b98de2209b01fc6609351e6a4d
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sxtwl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sxtwl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream's released wheel carries no LICENSE at all (python/ has none, and
    # MANIFEST.in never references the repo-root one); setuptools auto-discovers
    # it once copied in and stages it under dist-info/licenses/.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sxtwl"
      version: "${{ matrix.version }}"
      repository: "yuangu/sxtwl_cpp"
      ref: "98b731a66bfdb1b98de2209b01fc6609351e6a4d"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 45
      pre-build: "cp LICENSE python/LICENSE"
      cibw-package-dir: "python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No formal test suite ships (example/main.py is a demo script, not pytest).
      # Smoke-test against the Spring Festival of the Year of the Dragon, a fixed,
      # independently verifiable fact: 2024-02-10 is lunar 1-1 of a jiachen (甲辰)
      # year, and the solar<->lunar conversion round-trips.
      cibw-test-command: >
        python -c "import sxtwl;
        d = sxtwl.fromSolar(2024, 2, 10);
        assert (d.getLunarMonth(), d.getLunarDay(), d.isLunarLeap()) == (1, 1, False);
        gz = d.getYearGZ();
        assert (gz.tg, gz.dz) == (0, 4);
        d2 = sxtwl.fromLunar(2024, 1, 1);
        assert (d2.getSolarYear(), d2.getSolarMonth(), d2.getSolarDay()) == (2024, 2, 10)"

  publish:
    name: Publish sxtwl ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sxtwl-${{ matrix.version }}-*-manylinux_riscv64
