---
name: Build ct3 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ct3 version to build (e.g. 3.4.0.post5)'
        required: true
        default: '3.4.0.post5'
  pull_request:
    paths:
      - '.github/workflows/build-ct3.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.4.0.post5' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CT3_VERSION: ${{ inputs.version || '3.4.0.post5' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build ct3 ${{ inputs.version || '3.4.0.post5' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout ct3 ${{ env.CT3_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: CheetahTemplate3/cheetah3
          ref: ${{ env.CT3_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: Markdown pygments
          CIBW_TEST_COMMAND: >-
            python -m Cheetah.Tests.Test &&
            python -m Cheetah.Tests.Test --namemapper-pure &&
            python -m Cheetah.Tests.test_abs_import

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ct3-${{ env.CT3_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ct3 ${{ inputs.version || '3.4.0.post5' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: ct3-${{ inputs.version || '3.4.0.post5' }}-*riscv64
