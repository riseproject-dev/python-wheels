# SPDX-License-Identifier: MIT
---
# Based on the `wheels-x86_64`/`wheels-aarch64` jobs of
# https://github.com/mosquito/cysystemd/blob/2.0.5/.github/workflows/publish.yml
name: Build cysystemd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cysystemd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cysystemd.yml'
      - 'docs/packages/cysystemd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cysystemd.yml'
      - 'docs/packages/cysystemd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cysystemd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cysystemd ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "cysystemd"
      version: "${{ matrix.version }}"
      repository: "mosquito/cysystemd"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        python3 scripts/bump_version.py ${{ matrix.version }}
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-licenses.sh <<'COLLECT_EOF'
        #!/bin/bash
        # SPDX-FileCopyrightText: 2026 The RISE Project
        # SPDX-License-Identifier: MIT
        #
        # Stage, at the project root, the licence of every shared library
        # auditwheel vendors out of the build image alongside libsystemd.
        # setuptools' default LICENSE* glob copies them into the wheel.
        set -euo pipefail

        project="${1:?usage: collect-licenses.sh <project-dir>}"

        # ldd is transitive, so libsystemd alone covers its whole closure;
        # ldd does not list the root itself, so resolve that too.
        mapfile -t libs < <(
            {
                ldd /usr/lib64/libsystemd.so.0 | tr ' ' '\n' | grep '^/'
                readlink -f /usr/lib64/libsystemd.so.0
            } | sort -u
        )

        # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
        # glibc and the gcc runtime are on auditwheel's manylinux allowlist and
        # are never vendored into the wheel.
        mapfile -t pkgs < <(
            rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                grep -E '^[A-Za-z0-9._+-]+$' | sort -u |
                grep -vE '^(glibc|libgcc|libstdc\+\+|gcc)$'
        )

        for pkg in "${pkgs[@]}"; do
            mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

            # Some subpackages leave the licence to a sibling of the same source RPM.
            if [ -z "${files[0]:-}" ]; then
                srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                mapfile -t files < <(
                    rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                        awk -v s="$srpm" '$1 == s { print $2 }' |
                        xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                )
            fi

            # Others mark it %doc rather than %license, and the image installs no docs.
            if [ -z "${files[0]:-}" ]; then
                dnf -y --disablerepo=extras reinstall --setopt=tsflags= "$pkg" >/dev/null
                mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
            fi

            for f in "${files[@]}"; do
                [ -f "$f" ] || continue
                cp "$f" "$project/LICENSE.${pkg}.$(basename "$f")"
            done
            compgen -G "$project/LICENSE.$pkg.*" >/dev/null ||
                { echo "no licence file found for $pkg" >&2; exit 1; }
        done

        ls -1 "$project"/LICENSE.* | sed "s|$project/||"
        COLLECT_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "dnf install -y systemd-devel && bash {project}/collect-licenses.sh {project}"
      cibw-before-build: "pip install -U Cython setuptools"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # Upstream ships no test suite (no tests/ dir, and publish.yml has no
      # test step). The build container has no running systemd/journald, so
      # exercise the compiled extensions against what is actually there:
      # notify()/send() report failure through their return value rather than
      # raising, and the reader's real open-error path needs no live journal.
      cibw-test-command: |-
        python3 - <<'PYEOF'
        import cysystemd
        import cysystemd._daemon
        import cysystemd._journal
        import cysystemd.reader
        from cysystemd import journal, daemon
        from cysystemd.daemon import Notification
        from cysystemd.reader import JournalReader, JournalOpenMode

        assert cysystemd.__version__ == "${{ matrix.version }}", cysystemd.__version__
        for mod in (cysystemd._daemon, cysystemd._journal, cysystemd.reader):
        assert mod.__file__.endswith(".so"), mod.__file__

        assert list(journal.Priority)

        result = daemon.notify(Notification.STATUS, "riscv64 ci smoke test")
        print("notify:", result)

        journal.send(message="riscv64 ci smoke test", priority=journal.Priority.INFO)

        try:
        reader = JournalReader()
        reader.open(JournalOpenMode.SYSTEM)
        print("journal open: OK,", sum(1 for _ in reader), "entries")
        except OSError as e:
        print("journal open skipped: no live journal in this container:", e)
        PYEOF
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CYSYSTEMD_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cysystemd-${{ env.CYSYSTEMD_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extensions and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          print("\n".join(sos))
          for mod in ("_daemon", "_journal", "reader"):
              assert any(f"/{mod}." in "/" + n for n in sos), sos

          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          expected_pkgs = {"systemd-libs", "libcap"}
          have_pkgs = {f.split(".", 2)[1] for f in lic if f.startswith("LICENSE.")}
          assert expected_pkgs <= have_pkgs, expected_pkgs - have_pkgs
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources for cysystemd ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      CYSYSTEMD_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # libcap/systemd-libs are the copyleft (GPL/LGPL) libraries auditwheel
      # vendors out of the build image alongside libsystemd.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc libcap systemd-libs
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cysystemd-${{ env.CYSYSTEMD_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish cysystemd ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cysystemd-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: cysystemd-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc and the copyleft libraries bundled in the wheel
