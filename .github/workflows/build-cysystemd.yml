# SPDX-FileCopyrightText: 2026 The RISE Project
# SPDX-License-Identifier: MIT
---
# Based on the `wheels-x86_64`/`wheels-aarch64` jobs of
# https://github.com/mosquito/cysystemd/blob/2.0.5/.github/workflows/publish.yml
name: Build cysystemd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cysystemd version to build (git tag, e.g. 2.0.5)'
        required: true
        default: '2.0.5'
  pull_request:
    paths:
      - '.github/workflows/build-cysystemd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.0.5' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CYSYSTEMD_VERSION: ${{ inputs.version || '2.0.5' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cysystemd ${{ inputs.version || '2.0.5' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout cysystemd ${{ env.CYSYSTEMD_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mosquito/cysystemd
          ref: ${{ env.CYSYSTEMD_VERSION }}
          persist-credentials: false

      - name: Stage the licence-collection script
        run: |
          cat > collect-licenses.sh <<'COLLECT_EOF'
          #!/bin/bash
          # SPDX-FileCopyrightText: 2026 The RISE Project
          # SPDX-License-Identifier: MIT
          #
          # Stage, at the project root, the licence of every shared library
          # auditwheel vendors out of the build image alongside libsystemd.
          # setuptools' default LICENSE* glob copies them into the wheel.
          set -euo pipefail

          project="${1:?usage: collect-licenses.sh <project-dir>}"

          # ldd is transitive, so libsystemd alone covers its whole closure;
          # ldd does not list the root itself, so resolve that too.
          mapfile -t libs < <(
              {
                  ldd /usr/lib64/libsystemd.so.0 | tr ' ' '\n' | grep '^/'
                  readlink -f /usr/lib64/libsystemd.so.0
              } | sort -u
          )

          # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
          # glibc and the gcc runtime are on auditwheel's manylinux allowlist and
          # are never vendored into the wheel.
          mapfile -t pkgs < <(
              rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                  grep -E '^[A-Za-z0-9._+-]+$' | sort -u |
                  grep -vE '^(glibc|libgcc|libstdc\+\+|gcc)$'
          )

          for pkg in "${pkgs[@]}"; do
              mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

              # Some subpackages leave the licence to a sibling of the same source RPM.
              if [ -z "${files[0]:-}" ]; then
                  srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                  mapfile -t files < <(
                      rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                          awk -v s="$srpm" '$1 == s { print $2 }' |
                          xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                  )
              fi

              # Others mark it %doc rather than %license, and the image installs no docs.
              if [ -z "${files[0]:-}" ]; then
                  dnf -y --disablerepo=extras reinstall --setopt=tsflags= "$pkg" >/dev/null
                  mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
              fi

              for f in "${files[@]}"; do
                  [ -f "$f" ] || continue
                  cp "$f" "$project/LICENSE.${pkg}.$(basename "$f")"
              done
              compgen -G "$project/LICENSE.$pkg.*" >/dev/null ||
                  { echo "no licence file found for $pkg" >&2; exit 1; }
          done

          ls -1 "$project"/LICENSE.* | sed "s|$project/||"
          COLLECT_EOF

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y systemd-devel &&
            bash {project}/collect-licenses.sh {project}
          CIBW_BEFORE_BUILD: pip install -U Cython setuptools
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          # Upstream ships no test suite (no tests/ dir, and publish.yml has no
          # test step). The build container has no running systemd/journald, so
          # exercise the compiled extensions against what is actually there:
          # notify()/send() report failure through their return value rather than
          # raising, and the reader's real open-error path needs no live journal.
          CIBW_TEST_COMMAND: |
            python3 - <<'PYEOF'
            import cysystemd
            import cysystemd._daemon
            import cysystemd._journal
            import cysystemd.reader
            from cysystemd import journal, daemon
            from cysystemd.daemon import Notification
            from cysystemd.reader import JournalReader, JournalOpenMode

            assert cysystemd.__version__ == "${{ env.CYSYSTEMD_VERSION }}", cysystemd.__version__
            for mod in (cysystemd._daemon, cysystemd._journal, cysystemd.reader):
                assert mod.__file__.endswith(".so"), mod.__file__

            assert list(journal.Priority)

            result = daemon.notify(Notification.STATUS, "riscv64 ci smoke test")
            print("notify:", result)

            journal.send(message="riscv64 ci smoke test", priority=journal.Priority.INFO)

            try:
                reader = JournalReader()
                reader.open(JournalOpenMode.SYSTEM)
                print("journal open: OK,", sum(1 for _ in reader), "entries")
            except OSError as e:
                print("journal open skipped: no live journal in this container:", e)
            PYEOF

      - name: Verify the wheel ships the compiled extensions and licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if n.endswith(".so"))
          print("\n".join(sos))
          for mod in ("_daemon", "_journal", "reader"):
              assert any(f"/{mod}." in "/" + n for n in sos), sos

          lic = sorted(n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          print("\n".join(lic))
          expected_pkgs = {"systemd-libs", "libcap"}
          have_pkgs = {f.split(".", 2)[1] for f in lic if f.startswith("LICENSE.")}
          assert expected_pkgs <= have_pkgs, expected_pkgs - have_pkgs
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cysystemd-${{ env.CYSYSTEMD_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    name: Collect GPL sources for cysystemd ${{ inputs.version || '2.0.5' }}
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # libcap/systemd-libs are the copyleft (GPL/LGPL) libraries auditwheel
      # vendors out of the build image alongside libsystemd.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc libcap systemd-libs
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cysystemd-${{ env.CYSYSTEMD_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish cysystemd ${{ inputs.version || '2.0.5' }}
    needs: [setup, build_wheels, gpl_sources]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cysystemd-${{ inputs.version || '2.0.5' }}-*-manylinux_riscv64
      gpl-sources-artifact: cysystemd-${{ inputs.version || '2.0.5' }}-gpl-sources
      gpl-sources-description: gcc and the copyleft libraries bundled in the wheel
