#
# secp256k1 0.14.0 has no git tag on its upstream repo (CLAUDE.md gotcha 3: no-tag
# upstream); its setup.py was uploaded to PyPI from commit 0ce2ec5 (2021-11-06),
# confirmed byte-identical against the released sdist's setup.py/setup_support.py/
# _cffi_build/build.py, before the repo's later CI/CMake rework changed all three.
---
name: Build secp256k1 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/secp256k1.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-secp256k1.yml'
      - 'docs/packages/secp256k1.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-secp256k1.yml'
      - 'docs/packages/secp256k1.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64
  SECP256K1_PY_COMMIT: 0ce2ec5e423b9e1b5d135eba9061cbb81140751c

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: secp256k1
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build secp256k1 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      SECP256K1_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout secp256k1-py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rustyrussell/secp256k1-py
          ref: ${{ env.SECP256K1_PY_COMMIT }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            (command -v dnf > /dev/null && dnf install -y pkgconfig) ||
            (command -v apk > /dev/null && apk add --no-cache pkgconf)
          CIBW_BUILD_FRONTEND: pip
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: secp256k1-${{ env.SECP256K1_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish secp256k1 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: secp256k1-${{ matrix.version }}-*riscv64
