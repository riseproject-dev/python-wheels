#
# secp256k1 0.14.0 has no git tag on its upstream repo (CLAUDE.md gotcha 3: no-tag
# upstream); its setup.py was uploaded to PyPI from commit 0ce2ec5 (2021-11-06),
# confirmed byte-identical against the released sdist's setup.py/setup_support.py/
# _cffi_build/build.py, before the repo's later CI/CMake rework changed all three.
---
name: Build secp256k1 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/secp256k1.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-secp256k1.yml'
      - 'docs/packages/secp256k1.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-secp256k1.yml'
      - 'docs/packages/secp256k1.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: secp256k1
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build secp256k1 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: secp256k1
      version: ${{ matrix.version }}
      repository: rustyrussell/secp256k1-py
      ref: 0ce2ec5e423b9e1b5d135eba9061cbb81140751c
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-before-all-linux: >-
        (command -v dnf > /dev/null && dnf install -y pkgconfig) ||
        (command -v apk > /dev/null && apk add --no-cache pkgconf)
      cibw-build-frontend: pip
      cibw-test-sources: tests
      # tests/test_custom_nonce.py runs cffi's ffi.compile() at import time, which
      # needs setuptools on Python >= 3.12; cibuildwheel's test venv has none
      # (virtualenv --no-setuptools, see gotcha 361).
      cibw-test-requires: pytest setuptools
      cibw-test-command: python -m pytest {project}/tests
      timeout-minutes: 60

  publish:
    name: Publish secp256k1 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: secp256k1-${{ matrix.version }}-*riscv64
