---
# Based on the `build_wheels`, `test-pytest` and `test-freethreading` jobs of
# https://github.com/faust-streaming/faust/blob/v0.15.3/.github/workflows/python-package.yml
name: Build faust-streaming wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/faust-streaming.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-faust-streaming.yml'
      - 'docs/packages/faust-streaming.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-faust-streaming.yml'
      - 'docs/packages/faust-streaming.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: faust-streaming
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build faust-streaming ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "faust-streaming"
      version: "${{ matrix.version }}"
      repository: "faust-streaming/faust"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # The repo-root faust/ would otherwise shadow the installed wheel's extensions.
      cibw-test-sources: "tests pyproject.toml"
      # Upstream's test.txt minus its lint/publish tools, which is what freethreading.txt is.
      # That file only caps hypothesis (<6.130, before it grew a native extension) on 3.13t
      # and expects 3.14t to take the latest, but hypothesis publishes no free-threaded
      # riscv64 wheel (its riscv64 wheels are abi3, which a free-threaded build cannot use),
      # so pip builds the sdist, whose Rust bootstrap fails on riscv64. Take the same pure
      # Python release on cp314t first; the suite only uses hypothesis' pure-Python API.
      cibw-before-test: "${{ matrix.python == 'cp314t' && 'pip install \"hypothesis<6.130\" && ' || '' }}pip install -r {project}/requirements/freethreading.txt"
      cibw-test-environment: "FAUST_REQUIRE_CYTHON=1 ${{ matrix.python == 'cp314t' && 'PYTHON_GIL=0' || '' }}"
      cibw-test-command: "python -m pytest --no-cov tests/unit tests/functional ${{ matrix.python != 'cp314t' && 'tests/integration tests/meticulous tests/regression' || '' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      FAUST_STREAMING_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: faust-streaming-${{ env.FAUST_STREAMING_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled extensions and licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for mod in ("faust/_cython/windows", "faust/_cython/streams",
                          "faust/models/_cython/fields", "faust/transport/_cython/conductor"):
                  assert any(n.startswith(mod + ".") and n.endswith(".so") for n in names), (mod, names)
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish faust-streaming ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: faust-streaming-${{ matrix.version }}-*-manylinux_riscv64
