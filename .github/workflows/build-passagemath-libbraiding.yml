---
# passagemath-libbraiding is split out of the passagemath/passagemath monorepo
# (a SageMath fork) at pkgs/sagemath-libbraiding, tagged passagemath-<version>.
# The sdist is built the same way as build-passagemath-objects.yml does
# (./bootstrap, then `python -m build --sdist --no-isolation`).
name: Build passagemath-libbraiding wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-libbraiding.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-libbraiding.yml'
      - 'docs/packages/passagemath-libbraiding.yaml'
      - 'patches/passagemath-libbraiding/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-libbraiding.yml'
      - 'docs/packages/passagemath-libbraiding.yaml'
      - 'patches/passagemath-libbraiding/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-libbraiding
      version: ${{ inputs.version }}
      # cysignals (a build and runtime dependency) has no cp311 riscv64 wheel.
      python-exclude: 'cp39 cp311'

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_LIBBRAIDING_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          /VERSION.txt
          build
          m4
          pkgs/sagemath-libbraiding
          src/sage/libs/braiding.pyx
          src/sage/all__sagemath_libbraiding.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-libbraiding source
      run: git apply python-wheels/patches/passagemath-libbraiding/${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-libbraiding
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-libbraiding-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}-sdist
        path: pkgs/sagemath-libbraiding/dist/*.tar.gz
        if-no-files-found: error

  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-libbraiding ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_LIBBRAIDING_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout the libbraiding pin of passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
        path: passagemath
        filter: blob:none
        sparse-checkout: build/pkgs/libbraiding
        persist-credentials: false

    # Rocky 10 has no libbraiding package, so it is built from the release
    # tarball upstream's own build/pkgs/libbraiding pins; installed under /usr,
    # its libbraiding.pc satisfies the spkg-configure check that
    # sage_setup's `make libbraiding-ensure` runs, as gmp-devel does for
    # passagemath-objects.
    - name: Read the libbraiding pin
      working-directory: passagemath/build/pkgs/libbraiding
      run: |
        version=$(cat package-version.txt)
        echo "LIBBRAIDING_VERSION=$version" >> "$GITHUB_ENV"
        echo "LIBBRAIDING_SHA256=$(sed -n 's/^sha256=//p' checksums.ini)" >> "$GITHUB_ENV"
        echo "LIBBRAIDING_URL=$(sed -n 's/^upstream_url=//p' checksums.ini | sed "s/VERSION/$version/g")" >> "$GITHUB_ENV"

    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-libbraiding-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        CIBW_BEFORE_ALL_LINUX: >-
          cd /tmp &&
          curl -fsSL -o libbraiding.tar.gz "${{ env.LIBBRAIDING_URL }}" &&
          echo "${{ env.LIBBRAIDING_SHA256 }}  libbraiding.tar.gz" | sha256sum -c - &&
          tar xzf libbraiding.tar.gz &&
          cd libbraiding-${{ env.LIBBRAIDING_VERSION }} &&
          ./configure --prefix=/usr --libdir=/usr/${{ matrix.platform == 'manylinux' && 'lib64' || 'lib' }} &&
          make -j"$(nproc)" && make install
        CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        # Upstream's tests are Sage doctests that need passagemath-repl and the
        # BraidGroup of passagemath-groups; these replay the module's own
        # doctests with a minimal stand-in for a braid (strands + Tietze list).
        CIBW_TEST_COMMAND: |
          python3 - <<'PYEOF'
          import importlib.metadata
          from sage.libs.braiding import conjugatingbraid, leftnormalform

          class Parent:
              def strands(self):
                  return 3

          class Braid:
              def __init__(self, tietze):
                  self.tietze = tuple(tietze)
              def parent(self):
                  return Parent()
              def Tietze(self):
                  return self.tietze

          b, c = Braid([1, 2, 1, -2]), Braid([1, 2])
          assert leftnormalform(b) == [[0], [2, 1]], leftnormalform(b)
          assert conjugatingbraid(b, c) == [[0], [2]], conjugatingbraid(b, c)
          licences = {f.name for f in importlib.metadata.files("passagemath-libbraiding") if ".dist-info/licenses/" in str(f)}
          assert {"LICENSE", "LICENSE.libbraiding"} <= licences, licences
          PYEOF

    - name: Check libbraiding is vendored into the wheel
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/libs/braiding") and n.endswith(".so") for n in names), names
            libs = {n.split("/")[-1].split("-")[0] for n in names if ".libs/" in n and not n.endswith("/")}
            assert "libbraiding" in libs, libs
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-libbraiding-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  gpl_sources:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (passagemath-libbraiding, libbraiding) for passagemath-libbraiding ${{ matrix.version }}
    runs-on: ubuntu-latest

    env:
      PASSAGEMATH_LIBBRAIDING_VERSION: ${{ matrix.version }}

    steps:
      - name: checkout the libbraiding pin of passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: passagemath/passagemath
          ref: passagemath-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}
          path: passagemath
          filter: blob:none
          sparse-checkout: build/pkgs/libbraiding
          persist-credentials: false

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: passagemath-libbraiding-${{ env.PASSAGEMATH_LIBBRAIDING_VERSION }}-sdist
          path: gpl-sources/

      - name: Archive the GPL sources
        working-directory: passagemath/build/pkgs/libbraiding
        run: |
          version=$(cat package-version.txt)
          url=$(sed -n 's/^upstream_url=//p' checksums.ini | sed "s/VERSION/$version/g")
          curl -fsSL -o "$GITHUB_WORKSPACE/gpl-sources/libbraiding-$version.tar.gz" "$url"
          echo "$(sed -n 's/^sha256=//p' checksums.ini)  $GITHUB_WORKSPACE/gpl-sources/libbraiding-$version.tar.gz" | sha256sum -c -
          tar -cf "$GITHUB_WORKSPACE/gpl-sources.tar" -C "$GITHUB_WORKSPACE" gpl-sources

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: passagemath-libbraiding-${{ matrix.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish passagemath-libbraiding ${{ matrix.version }}
    needs: [setup, linux, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: passagemath-libbraiding-${{ matrix.version }}-*-riscv64
      gpl-sources-artifact: passagemath-libbraiding-${{ matrix.version }}-gpl-sources
      gpl-sources-description: passagemath-libbraiding and libbraiding (both compiled from source)
