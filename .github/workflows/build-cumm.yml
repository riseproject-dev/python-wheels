---
# This workflow is based on upstream's documented "build wheel from source"
# recipe (README.md, "Build in your environment"): CUMM_CUDA_VERSION="" picks
# the CPU-only build, CUMM_DISABLE_JIT="1" makes the pccm/ccimport C++
# extension build at wheel-build time instead of on first import.
name: Build cumm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cumm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cumm.yml'
      - 'docs/packages/cumm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cumm.yml'
      - 'docs/packages/cumm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cumm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cumm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cumm
      version: ${{ matrix.version }}
      repository: FindDefinition/cumm
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment: 'CUMM_CUDA_VERSION= CUMM_DISABLE_JIT=1'
      cibw-test-command: python -c "import cumm; from cumm import tensorview as tv; assert tv.is_cpu_only(); a = tv.zeros([2, 3], tv.float32, -1); print(list(a.shape), cumm.__version__)"
      timeout-minutes: 90

  publish:
    name: Publish cumm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cumm-${{ matrix.version }}-*-manylinux_riscv64
