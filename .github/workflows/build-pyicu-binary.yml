---
# pyicu-binary is PyICU's own gitlab.pyicu.org/main/pyicu tree (setup.py:
# name="PyICU-binary"), which carries no wheel-build CI of its own.
name: Build pyicu-binary wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyicu-binary.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyicu-binary.yml'
      - 'docs/packages/pyicu-binary.yaml'
      - 'patches/pyicu-binary/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyicu-binary.yml'
      - 'docs/packages/pyicu-binary.yaml'
      - 'patches/pyicu-binary/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyicu-binary
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyicu-binary ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyicu-binary"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        git clone --depth 1 --branch "v${{ matrix.version }}" \
          https://gitlab.pyicu.org/main/pyicu.git pyicu

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v ../python-wheels/patches/pyicu-binary/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "pyicu"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py links ICU dynamically via icu-config/pkg-config; auditwheel
      # then vendors libicudata/libicuuc/libicui18n into the wheel (the
      # "-binary" in the name), which is what makes it self-contained. Its
      # Unicode License requires the notice to travel with the binary.
      cibw-before-all-linux: "dnf -y install libicu-devel && cp /usr/share/licenses/libicu/LICENSE {package}/LICENSE.icu"
      cibw-test-requires: "pytest six"
      cibw-test-sources: "pyicu/test"
      # 2.7.4's own tests hardcode CLDR-formatted strings and a tzdata
      # transition pinned to ICU <=69 (test_DateTimeParserGenerator's
      # own ICU_VERSION check tops out at "68.0"); manylinux_2_39
      # links 74.2, whose newer CLDR/tzdata legitimately renders these
      # four differently (e.g. narrow-no-break-space in "5:30 PM",
      # Fiji's DST rule having no further transitions). Not a riscv64
      # or code defect - deselect rather than chase upstream's CLDR pin.
      cibw-test-command: "python -c \"import icu; print('linked ICU', icu.ICU_VERSION)\" && python -m pytest pyicu/test --deselect pyicu/test/test_DateTimeParserGenerator.py::TestDateTimePatternGenerator::testAddPattern --deselect pyicu/test/test_DateTimeParserGenerator.py::TestDateTimePatternGenerator::testGetBestPattern --deselect pyicu/test/test_DateTimeParserGenerator.py::TestDateTimePatternGenerator::testReplaceFieldType --deselect pyicu/test/test_TimeZone.py::TestTimeZone::testTransition"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYICU_BINARY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyicu-binary-${{ env.PYICU_BINARY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel bundles ICU and its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.split("/")[-1].startswith("_icu") and n.endswith(".so") for n in names), (whl, names)
              assert any(".libs/" in n and "icu" in n.lower() for n in names), (whl, names)
              assert any(n.endswith(".dist-info/licenses/LICENSE.icu") for n in names), (whl, names)
              print(whl, "OK")
          EOF

  publish:
    name: Publish pyicu-binary ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyicu-binary-${{ matrix.version }}-*-manylinux_riscv64
