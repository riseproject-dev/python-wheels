---
# This workflow is based on: https://github.com/colinxu2020/slhdsa/blob/master/.github/workflows/ci.yml
name: Build slh-dsa wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/slh-dsa.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-slh-dsa.yml'
      - 'docs/packages/slh-dsa.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slh-dsa.yml'
      - 'docs/packages/slh-dsa.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: slh-dsa
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build slh-dsa ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "slh-dsa"
      version: "${{ matrix.version }}"
      repository: "colinxu2020/slhdsa"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c \"import slhdsa.lowlevel.wots as m; assert m.__file__.endswith('.so'), m.__file__\" && pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SLH_DSA_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: slh-dsa-${{ env.SLH_DSA_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel is mypyc-compiled, not the pure-Python fallback
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any("__mypyc" in n and n.endswith(".so") for n in names), names
          assert any(n.startswith("slhdsa/lowlevel/wots.") and n.endswith(".so") for n in names), names
          licenses = sorted(n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/"))
          assert licenses == ["COPYING", "COPYING.LESSER"], licenses
          EOF

  publish:
    name: Publish slh-dsa ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: slh-dsa-${{ matrix.version }}-*riscv64
