name: Build wheels with cibuildwheel

on:
  workflow_call:
    inputs:
      package:
        description: Package name used for checkout and patches.
        required: true
        type: string
      version:
        description: Package version being built.
        required: true
        type: string
      repository:
        description: Upstream owner/repository to check out.
        required: true
        type: string
      ref:
        description: Upstream ref to check out.
        required: true
        type: string
      artifact-tag:
        description: Platform or ABI suffix used in the uploaded artifact name.
        required: true
        type: string
      timeout-minutes:
        description: Build job timeout in minutes.
        required: false
        default: 60
        type: number
      checkout-submodules:
        description: actions/checkout submodules value (false, true, or recursive).
        required: false
        default: 'false'
        type: string
      checkout-fetch-depth:
        description: actions/checkout fetch depth.
        required: false
        default: 1
        type: number
      patches:
        description: Apply patches/<package>/<version>/*.patch before building.
        required: false
        default: false
        type: boolean
      patches-required:
        description: Fail when a patch glob matches no files.
        required: false
        default: true
        type: boolean
      pre-build:
        description: Shell commands to run after checkout and before cibuildwheel.
        required: false
        default: ''
        type: string
      post-build:
        description: Shell commands to run after cibuildwheel and before artifact upload.
        required: false
        default: ''
        type: string
      cibw-package-dir:
        description: Package directory passed to the cibuildwheel action.
        required: false
        default: .
        type: string
      cibw-output-dir:
        description: Output directory passed to the cibuildwheel action.
        required: false
        default: wheelhouse
        type: string
      cibw-config-file:
        description: Configuration file passed to the cibuildwheel action.
        required: false
        default: ''
        type: string
      cibw-extras:
        description: Installation extras passed to the cibuildwheel action.
        required: false
        default: ''
        type: string
      cibw-archs:
        description: CIBW_ARCHS value.
        required: false
        default: riscv64
        type: string
      cibw-archs-linux:
        description: CIBW_ARCHS_LINUX value.
        required: false
        default: ''
        type: string
      cibw-audit-command:
        description: CIBW_AUDIT_COMMAND value.
        required: false
        default: ''
        type: string
      cibw-before-all:
        description: CIBW_BEFORE_ALL value.
        required: false
        default: ''
        type: string
      cibw-before-all-linux:
        description: CIBW_BEFORE_ALL_LINUX value.
        required: false
        default: ''
        type: string
      cibw-before-build:
        description: CIBW_BEFORE_BUILD value.
        required: false
        default: ''
        type: string
      cibw-before-build-linux:
        description: CIBW_BEFORE_BUILD_LINUX value.
        required: false
        default: ''
        type: string
      cibw-before-test:
        description: CIBW_BEFORE_TEST value.
        required: false
        default: ''
        type: string
      cibw-before-test-linux:
        description: CIBW_BEFORE_TEST_LINUX value.
        required: false
        default: ''
        type: string
      cibw-build:
        description: CIBW_BUILD value selecting the wheels to build.
        required: true
        type: string
      cibw-build-frontend:
        description: CIBW_BUILD_FRONTEND value.
        required: false
        default: ''
        type: string
      cibw-config-settings:
        description: CIBW_CONFIG_SETTINGS value.
        required: false
        default: ''
        type: string
      cibw-container-engine:
        description: CIBW_CONTAINER_ENGINE value.
        required: false
        default: ''
        type: string
      cibw-dependency-versions:
        description: CIBW_DEPENDENCY_VERSIONS value.
        required: false
        default: ''
        type: string
      cibw-environment-linux:
        description: CIBW_ENVIRONMENT_LINUX value.
        required: false
        default: ''
        type: string
      cibw-environment-pass-linux:
        description: CIBW_ENVIRONMENT_PASS_LINUX value.
        required: false
        default: ''
        type: string
      cibw-manylinux-riscv64-image:
        description: CIBW_MANYLINUX_RISCV64_IMAGE value.
        required: false
        default: quay.io/pypa/manylinux_2_39_riscv64
        type: string
      cibw-musllinux-aarch64-image:
        description: CIBW_MUSLLINUX_AARCH64_IMAGE value.
        required: false
        default: ''
        type: string
      cibw-musllinux-i686-image:
        description: CIBW_MUSLLINUX_I686_IMAGE value.
        required: false
        default: ''
        type: string
      cibw-musllinux-riscv64-image:
        description: CIBW_MUSLLINUX_RISCV64_IMAGE value.
        required: false
        default: ''
        type: string
      cibw-musllinux-x86-64-image:
        description: CIBW_MUSLLINUX_X86_64_IMAGE value.
        required: false
        default: ''
        type: string
      cibw-project-requires-python:
        description: CIBW_PROJECT_REQUIRES_PYTHON value.
        required: false
        default: ''
        type: string
      cibw-repair-wheel-command:
        description: CIBW_REPAIR_WHEEL_COMMAND value.
        required: false
        default: ''
        type: string
      cibw-repair-wheel-command-linux:
        description: CIBW_REPAIR_WHEEL_COMMAND_LINUX value.
        required: false
        default: ''
        type: string
      cibw-skip:
        description: CIBW_SKIP value.
        required: false
        default: ''
        type: string
      cibw-test-command:
        description: CIBW_TEST_COMMAND value.
        required: false
        default: ''
        type: string
      cibw-test-environment:
        description: CIBW_TEST_ENVIRONMENT value.
        required: false
        default: ''
        type: string
      cibw-test-environment-linux:
        description: CIBW_TEST_ENVIRONMENT_LINUX value.
        required: false
        default: ''
        type: string
      cibw-test-extras:
        description: CIBW_TEST_EXTRAS value.
        required: false
        default: ''
        type: string
      cibw-test-groups:
        description: CIBW_TEST_GROUPS value.
        required: false
        default: ''
        type: string
      cibw-test-requires:
        description: CIBW_TEST_REQUIRES value.
        required: false
        default: ''
        type: string
      cibw-test-skip:
        description: CIBW_TEST_SKIP value.
        required: false
        default: ''
        type: string
      cibw-test-sources:
        description: CIBW_TEST_SOURCES value.
        required: false
        default: ''
        type: string

jobs:
  build_wheels:
    name: Build ${{ inputs.package }} ${{ inputs.version }} ${{ inputs['artifact-tag'] }}
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: ${{ inputs['timeout-minutes'] }}
    steps:
      - name: Checkout ${{ inputs.repository }} ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: ${{ inputs.package }}
          submodules: ${{ inputs['checkout-submodules'] }}
          fetch-depth: ${{ inputs['checkout-fetch-depth'] }}
          persist-credentials: false

      - name: Checkout patches
        if: inputs.patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        if: inputs.patches
        env:
          PATCHES: patches/${{ inputs.package }}/${{ inputs.version }}/*.patch
          PATCHES_REQUIRED: ${{ inputs['patches-required'] }}
        working-directory: ${{ inputs.package }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import subprocess
          from pathlib import Path

          repository = Path(os.environ["GITHUB_WORKSPACE"], "python-wheels")
          pattern = os.environ["PATCHES"]
          matches = sorted(glob.glob(str(repository / pattern)))
          if not matches:
              if os.environ["PATCHES_REQUIRED"] == "true":
                  raise SystemExit(f"patch pattern matched no files: {pattern}")
          else:
              subprocess.run(["git", "apply", *matches], check=True)
          PY

      - name: Prepare for cibuildwheel
        if: inputs['pre-build'] != ''
        env:
          COMMAND: ${{ inputs['pre-build'] }}
        working-directory: ${{ inputs.package }}
        run: bash --noprofile --norc -euo pipefail -c "$COMMAND"

      - name: Configure cibuildwheel
        env:
          CIBW_ARCHS: ${{ inputs['cibw-archs'] }}
          CIBW_ARCHS_LINUX: ${{ inputs['cibw-archs-linux'] }}
          CIBW_AUDIT_COMMAND: ${{ inputs['cibw-audit-command'] }}
          CIBW_BEFORE_ALL: ${{ inputs['cibw-before-all'] }}
          CIBW_BEFORE_ALL_LINUX: ${{ inputs['cibw-before-all-linux'] }}
          CIBW_BEFORE_BUILD: ${{ inputs['cibw-before-build'] }}
          CIBW_BEFORE_BUILD_LINUX: ${{ inputs['cibw-before-build-linux'] }}
          CIBW_BEFORE_TEST: ${{ inputs['cibw-before-test'] }}
          CIBW_BEFORE_TEST_LINUX: ${{ inputs['cibw-before-test-linux'] }}
          CIBW_BUILD: ${{ inputs['cibw-build'] }}
          CIBW_BUILD_FRONTEND: ${{ inputs['cibw-build-frontend'] }}
          CIBW_CONFIG_SETTINGS: ${{ inputs['cibw-config-settings'] }}
          CIBW_CONTAINER_ENGINE: ${{ inputs['cibw-container-engine'] }}
          CIBW_DEPENDENCY_VERSIONS: ${{ inputs['cibw-dependency-versions'] }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple
          CIBW_ENVIRONMENT_LINUX: ${{ inputs['cibw-environment-linux'] }}
          CIBW_ENVIRONMENT_PASS_LINUX: ${{ inputs['cibw-environment-pass-linux'] }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ inputs['cibw-manylinux-riscv64-image'] }}
          CIBW_MUSLLINUX_AARCH64_IMAGE: ${{ inputs['cibw-musllinux-aarch64-image'] }}
          CIBW_MUSLLINUX_I686_IMAGE: ${{ inputs['cibw-musllinux-i686-image'] }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ inputs['cibw-musllinux-riscv64-image'] }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ inputs['cibw-musllinux-x86-64-image'] }}
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ inputs['cibw-project-requires-python'] }}
          CIBW_REPAIR_WHEEL_COMMAND: ${{ inputs['cibw-repair-wheel-command'] }}
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ${{ inputs['cibw-repair-wheel-command-linux'] }}
          CIBW_SKIP: ${{ inputs['cibw-skip'] }}
          CIBW_TEST_COMMAND: ${{ inputs['cibw-test-command'] }}
          CIBW_TEST_ENVIRONMENT: ${{ inputs['cibw-test-environment'] }}
          CIBW_TEST_ENVIRONMENT_LINUX: ${{ inputs['cibw-test-environment-linux'] }}
          CIBW_TEST_EXTRAS: ${{ inputs['cibw-test-extras'] }}
          CIBW_TEST_GROUPS: ${{ inputs['cibw-test-groups'] }}
          CIBW_TEST_REQUIRES: ${{ inputs['cibw-test-requires'] }}
          CIBW_TEST_SKIP: ${{ inputs['cibw-test-skip'] }}
          CIBW_TEST_SOURCES: ${{ inputs['cibw-test-sources'] }}
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import shlex
          import uuid

          names = (
              "CIBW_ARCHS",
              "CIBW_ARCHS_LINUX",
              "CIBW_AUDIT_COMMAND",
              "CIBW_BEFORE_ALL",
              "CIBW_BEFORE_ALL_LINUX",
              "CIBW_BEFORE_BUILD",
              "CIBW_BEFORE_BUILD_LINUX",
              "CIBW_BEFORE_TEST",
              "CIBW_BEFORE_TEST_LINUX",
              "CIBW_BUILD",
              "CIBW_BUILD_FRONTEND",
              "CIBW_CONFIG_SETTINGS",
              "CIBW_CONTAINER_ENGINE",
              "CIBW_DEPENDENCY_VERSIONS",
              "CIBW_ENVIRONMENT",
              "CIBW_ENVIRONMENT_LINUX",
              "CIBW_ENVIRONMENT_PASS_LINUX",
              "CIBW_MANYLINUX_RISCV64_IMAGE",
              "CIBW_MUSLLINUX_AARCH64_IMAGE",
              "CIBW_MUSLLINUX_I686_IMAGE",
              "CIBW_MUSLLINUX_RISCV64_IMAGE",
              "CIBW_MUSLLINUX_X86_64_IMAGE",
              "CIBW_PROJECT_REQUIRES_PYTHON",
              "CIBW_REPAIR_WHEEL_COMMAND",
              "CIBW_REPAIR_WHEEL_COMMAND_LINUX",
              "CIBW_SKIP",
              "CIBW_TEST_COMMAND",
              "CIBW_TEST_ENVIRONMENT",
              "CIBW_TEST_ENVIRONMENT_LINUX",
              "CIBW_TEST_EXTRAS",
              "CIBW_TEST_GROUPS",
              "CIBW_TEST_REQUIRES",
              "CIBW_TEST_SKIP",
              "CIBW_TEST_SOURCES",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name in names:
                  value = os.environ.get(name, "")
                  package = os.environ["PACKAGE"]
                  if name == "CIBW_TEST_SOURCES" and value:
                      sources = []
                      for source in shlex.split(value):
                          if source.startswith("{project}"):
                              source = source.replace("{project}", f"{{project}}/{package}", 1)
                          elif not os.path.isabs(source):
                              source = os.path.join(package, source)
                          sources.append(source)
                      value = " ".join(sources)
                  elif value:
                      value = value.replace("{project}", f"{{project}}/{package}")
                      value = re.sub(r"/project(?=/|[\s:'\"]|$)", f"/project/{package}", value)
                  if not value:
                      continue
                  delimiter = f"cibw_{uuid.uuid4().hex}"
                  stream.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ inputs['cibw-package-dir'] == '.' && inputs.package || format('{0}/{1}', inputs.package, inputs['cibw-package-dir']) }}
          output-dir: ${{ inputs['cibw-output-dir'] }}
          config-file: ${{ inputs['cibw-config-file'] != '' && format('{0}/{1}', inputs.package, inputs['cibw-config-file']) || '' }}
          extras: ${{ inputs['cibw-extras'] }}

      - name: Finish cibuildwheel build
        if: inputs['post-build'] != ''
        env:
          COMMAND: ${{ inputs['post-build'] }}
        working-directory: ${{ inputs.package }}
        run: bash --noprofile --norc -euo pipefail -c "$COMMAND"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs['artifact-tag'] }}
          path: ${{ inputs['cibw-output-dir'] }}/*.whl
          if-no-files-found: error
