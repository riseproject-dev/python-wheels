---
# passagemath-homfly is split out of the passagemath/passagemath monorepo
# (a SageMath fork) at pkgs/sagemath-homfly, tagged passagemath-<version>.
# This replays build/pkgs/sagemath_homfly/spkg-src (./bootstrap renders the
# package's pyproject.toml, then `python -m build --sdist --no-isolation`)
# rather than the full ./configure && make python_build chain upstream's own
# release tooling uses for the complete Sage distribution, same as
# build-passagemath-objects.yml.
name: Build passagemath-homfly wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-homfly.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-homfly.yml'
      - 'docs/packages/passagemath-homfly.yaml'
      - 'patches/passagemath-homfly/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-homfly.yml'
      - 'docs/packages/passagemath-homfly.yaml'
      - 'patches/passagemath-homfly/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64
  # build/pkgs/gc and build/pkgs/libhomfly's own pins (checksums.ini): neither
  # is in Rocky 10/EPEL riscv64 (no riscv64 EPEL repo exists at all), so both
  # are always built from source, same as upstream's own spkg-configure.m4
  # fallback for gc and the unconditional from-source build for libhomfly.
  GC_VERSION: 8.2.12
  GC_SHA256: 42e5194ad06ab6ffb806c83eb99c03462b495d979cda782f3c72c08af833cd4e
  LIBHOMFLY_VERSION: 1.04
  LIBHOMFLY_SHA256: 659a77b4f4b53340d24a7d6a69f4219e77ab9439a6ab8afa0156b7f6bd7af64f

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-homfly
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-24.04-riscv
    env:
      PASSAGEMATH_HOMFLY_VERSION: ${{ matrix.version }}

    steps:
    - name: checkout passagemath/passagemath passagemath-${{ env.PASSAGEMATH_HOMFLY_VERSION }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: passagemath/passagemath
        ref: passagemath-${{ env.PASSAGEMATH_HOMFLY_VERSION }}
        filter: blob:none
        sparse-checkout: |
          /bootstrap
          /pyproject.toml
          build
          m4
          pkgs/sagemath-homfly
          src/sage/libs/homfly.p*
          src/sage/libs/all__sagemath_homfly.py
          src/sage/all__sagemath_homfly.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Checkout python-wheels
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: python-wheels
        persist-credentials: false

    - name: Patch passagemath-homfly source
      run: git apply python-wheels/patches/passagemath-homfly/${{ env.PASSAGEMATH_HOMFLY_VERSION }}/00*.patch

    - name: Render pyproject.toml
      run: ./bootstrap

    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        python-version: '3.12'
        activate-environment: true
        enable-cache: false

    - name: build sdist
      working-directory: pkgs/sagemath-homfly
      run: |
        rm -rf dist/ *.egg-info
        uv pip install build setuptools "passagemath-setup==${{ env.PASSAGEMATH_HOMFLY_VERSION }}" "passagemath-environment==${{ env.PASSAGEMATH_HOMFLY_VERSION }}"
        python -m build --sdist --no-isolation --skip-dependency-check

    - name: upload sdist artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-homfly-${{ env.PASSAGEMATH_HOMFLY_VERSION }}-sdist
        path: pkgs/sagemath-homfly/dist/*.tar.gz
        if-no-files-found: error

  # gc is a permissive licence (see LICENSE.gc); libhomfly is public domain
  # (the Unlicense). Neither is GPL, so no gpl_sources job is needed here
  # (unlike build-passagemath-bliss.yml's LGPL/GPL bliss dependency).
  linux:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-homfly ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PASSAGEMATH_HOMFLY_VERSION: ${{ matrix.version }}

    steps:
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: passagemath-homfly-${{ env.PASSAGEMATH_HOMFLY_VERSION }}-sdist
        path: dist/

    - id: sdist_path
      run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
      with:
        package-dir: ${{ steps.sdist_path.outputs.path }}
        output-dir: wheelhouse/
        only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      env:
        CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
        CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
        # Replays build/pkgs/gc and build/pkgs/libhomfly/spkg-install.in's
        # ./configure && make && make install chain against a fixed
        # /usr/local prefix, skipping the Sage-specific sdh_* wrappers.
        # gmp/mpfr/mpc: gmpy2's PyPI sdist, pulled in as a build-system-requires
        # dependency of passagemath-objects, compiles against system headers
        # for all three (same as build-passagemath-objects.yml and
        # build-passagemath-cddlib.yml).
        CIBW_BEFORE_ALL_LINUX: |
          set -euo pipefail
          if command -v apk >/dev/null; then
            apk add --no-cache curl gmp-dev mpfr-dev mpc1-dev
          else
            dnf install -y --setopt=install_weak_deps=False libatomic_ops-devel gmp-devel mpfr-devel libmpc-devel
          fi
          curl -fsSLo /tmp/gc.tar.gz https://github.com/ivmai/bdwgc/releases/download/v${{ env.GC_VERSION }}/gc-${{ env.GC_VERSION }}.tar.gz
          echo "${{ env.GC_SHA256 }}  /tmp/gc.tar.gz" | sha256sum -c -
          tar xzf /tmp/gc.tar.gz -C /tmp
          cd /tmp/gc-${{ env.GC_VERSION }}
          ./configure --prefix=/usr/local --libdir=/usr/local/lib --enable-large-config --enable-cplusplus
          make -j"$(nproc)"
          make install
          ldconfig || true
          curl -fsSLo /tmp/libhomfly.tar.gz https://github.com/miguelmarco/libhomfly/releases/download/${{ env.LIBHOMFLY_VERSION }}/libhomfly-${{ env.LIBHOMFLY_VERSION }}.tar.gz
          echo "${{ env.LIBHOMFLY_SHA256 }}  /tmp/libhomfly.tar.gz" | sha256sum -c -
          tar xzf /tmp/libhomfly.tar.gz -C /tmp
          cd /tmp/libhomfly-${{ env.LIBHOMFLY_VERSION }}
          CFLAGS="-std=gnu17" ./configure --prefix=/usr/local --libdir=/usr/local/lib
          make -j"$(nproc)"
          make install
          ldconfig || true
        CIBW_ENVIRONMENT_LINUX: >-
          PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH
          LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
          CPATH=/usr/local/include:$CPATH
        # sagemath-graphs/-repl (the real test extras) are unported, so this
        # replays homfly.pyx's own doctest value for the trefoil knot.
        CIBW_TEST_COMMAND: >-
          python -c "from sage.libs.homfly import homfly_polynomial_dict;
          d=homfly_polynomial_dict('1 6 0 1  1 -1  2 1  0 -1  1 1  2 -1 0 1 1 1 2 1');
          assert d == {(-4, 0): -1, (-2, 0): -2, (-2, 2): 1}, d;
          print('homfly ok', d)"

    - name: Check the wheel ships the extension and the vendored licences
      run: |
        python3 - wheelhouse/*.whl <<'EOF'
        import sys, zipfile
        for whl in sys.argv[1:]:
            names = zipfile.ZipFile(whl).namelist()
            assert any(n.startswith("sage/libs/homfly") and n.endswith(".so") for n in names), whl
            libs = [n for n in names if n.startswith("passagemath_homfly.libs/")]
            assert any("homfly" in n for n in libs), (whl, libs)
            assert any("gc" in n for n in libs), (whl, libs)
            licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
            assert licences == {"LICENSE", "LICENSE.gc", "LICENSE.libhomfly"}, (whl, licences)
            print(whl, "ok")
        EOF

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: passagemath-homfly-${{ env.PASSAGEMATH_HOMFLY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish:
    name: Publish passagemath-homfly ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-homfly-${{ matrix.version }}-*_riscv64
