---
# This workflow is based on the `build_linux_macos_wheels` job of
# https://github.com/louisabraham/pydivsufsort/blob/v0.0.20/.github/workflows/build-and-upload.yml
name: Build pydivsufsort wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pydivsufsort.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pydivsufsort.yml'
      - 'docs/packages/pydivsufsort.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pydivsufsort.yml'
      - 'docs/packages/pydivsufsort.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pydivsufsort
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pydivsufsort ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pydivsufsort"
      version: "${{ matrix.version }}"
      repository: "louisabraham/pydivsufsort"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream builds libdivsufsort on the host runner, before cibuildwheel
      # starts, then skips the rebuild inside the container
      # (SKIP_LIBDIVSUFSORT_BUILD). Our riscv64 runner has no PyPI cmake wheel
      # to fall back on (gotcha 1 shape), so this builds libdivsufsort inside
      # the manylinux container instead, with the same CMake invocation as
      # upstream's build.sh.
      cibw-before-all: |-
        set -e
        dnf install -y -q cmake
        cmake -S {project}/libdivsufsort -B /tmp/libdivsufsort-build \
        -DBUILD_DIVSUFSORT64=ON -DBUILD_EXAMPLES=OFF -DUSE_OPENMP=ON \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build /tmp/libdivsufsort-build -j"$(nproc)"
        cp /tmp/libdivsufsort-build/lib/libdivsufsort.so* \
        /tmp/libdivsufsort-build/lib/libdivsufsort64.so* \
        {project}/pydivsufsort/
        # Upstream's own wheel omits this; the wheel ships libdivsufsort's
        # compiled .so as package_data, so its licence travels with it too.
        cp {project}/libdivsufsort/LICENSE {project}/LICENSE.libdivsufsort
      cibw-environment-linux: "SKIP_LIBDIVSUFSORT_BUILD=1"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYDIVSUFSORT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pydivsufsort-${{ env.PYDIVSUFSORT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the bundled licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE", "LICENSE.libdivsufsort"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n}
              assert expected <= found, f"{whl}: missing {expected - found}"
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for pydivsufsort ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: pydivsufsort
      version: ${{ matrix.version }}
      # libdivsufsort is built with -DUSE_OPENMP=ON, dynamically linking the
      # image's libgomp, which auditwheel then vendors into the wheel.
      packages: gcc

  publish:
    name: Publish pydivsufsort ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pydivsufsort-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pydivsufsort-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
