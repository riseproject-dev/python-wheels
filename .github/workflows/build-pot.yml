---
# Based on: https://github.com/PythonOT/POT/blob/0.9.7.post1/.github/workflows/build_wheels.yml
name: Build pot wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pot.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pot.yml'
      - 'docs/packages/pot.yaml'
      - 'patches/pot/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pot.yml'
      - 'docs/packages/pot.yaml'
      - 'patches/pot/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pot
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pot ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # test_BaseEstimator hits a real bug in ot.utils.BaseEstimator.get_params():
        # it saves/restores warnings.filters via a bare `.pop(0)` in a finally
        # block, mutating process-global state with no protection. Under cp314t
        # something about the surrounding tests' warnings-filter state leaves
        # that list already empty by the time this runs, so the pop() raises
        # IndexError instead of the test's own expected ValueError -- a fragile
        # global-state pattern in POT's own code, not a riscv64 issue (same
        # class of free-threading-exposed fragility as this session's asv port).
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pot"
      version: "${{ matrix.version }}"
      repository: "PythonOT/POT"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pot/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy/scipy are build- and run-time requirements; only our registry
      # has them for riscv64, and only-binary keeps a newer PyPI release
      # from winning the resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy"
      # ot/helpers/openmp_helpers.py (imported by test_helpers.py) itself
      # imports setuptools.errors, which the test venv doesn't ship by
      # default.
      cibw-test-requires: "pytest setuptools"
      # test/test_helpers.py does sys.path.append(os.path.join("ot", "helpers"))
      # and imports openmp_helpers from there directly (not through the
      # installed `ot` package) -- needs staging alongside test/ too.
      cibw-test-sources: "test ot/helpers"
      cibw-test-command: "python -m pytest --durations=20 -v test ${{ case(endsWith(matrix.python, 't'), '--deselect \"test/test_utils.py::test_BaseEstimator\"', '') }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    # 60m was too tight: cp314t's free-threaded build was still running tests
    # (no failures) when cancelled at exactly 60m, while cp312/313/314 finish
    # in 45-53m -- free-threading's per-object overhead slows the test suite
    # enough to blow the margin, not a hang.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # test_BaseEstimator hits a real bug in ot.utils.BaseEstimator.get_params():
        # it saves/restores warnings.filters via a bare `.pop(0)` in a finally
        # block, mutating process-global state with no protection. Under cp314t
        # something about the surrounding tests' warnings-filter state leaves
        # that list already empty by the time this runs, so the pop() raises
        # IndexError instead of the test's own expected ValueError -- a fragile
        # global-state pattern in POT's own code, not a riscv64 issue (same
        # class of free-threading-exposed fragility as this session's asv port).
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      POT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pot-${{ env.POT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"emd_wrap", "partial_cython", "bsp_wrap"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE", "LICENSE.eigen-mpl2", "LICENSE.eigen-bsd"}, licences
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      POT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # POT's emd_wrap/bsp_wrap extensions link -fopenmp on Linux (setup.py's
      # OMP probe), so auditwheel vendors the image's libgomp into pot.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pot-${{ env.POT_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pot ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pot-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pot-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
