---
# Based on upstream's own wheel build at this tag:
#   https://github.com/kevinzakka/mink/blob/v1.3.0/.github/workflows/publish.yml
name: Build mink wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mink.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mink.yml'
      - 'docs/packages/mink.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mink.yml'
      - 'docs/packages/mink.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mink
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mink ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mink
      version: ${{ matrix.version }}
      repository: kevinzakka/mink
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # build[uv] needs a host uv for the audit step, which the riscv runner lacks (gotcha 13).
      cibw-build-frontend: build
      # numpy (build + runtime) and the compiled runtime deps only have riscv64 wheels on our registry.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,mujoco,glfw"
      # daqp pinned to upstream's uv.lock version, built from sdist: daqp 0.9.x (our registry's
      # only riscv64 build) rejects mink's no-task QP (H = 1e-12*I) as nonconvex on every arch (gotcha 583).
      cibw-test-requires: pytest robot_descriptions absl-py daqp==0.8.5
      cibw-test-sources: tests examples/docs examples/franka_emika_panda
      # The build silently falls back to a pure wheel if CMake fails (scikit-build `if.failed` override).
      cibw-test-command: >-
        python -c "import mink.lie._lie_ops_c as m, importlib.metadata as md; assert m.__file__.endswith('.so'), m.__file__; assert md.version('daqp') == '0.8.5', md.version('daqp')"
        && python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish mink ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mink-${{ matrix.version }}-*-manylinux_riscv64
