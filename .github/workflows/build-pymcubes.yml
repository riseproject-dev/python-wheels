---
# Based on: https://github.com/pmneila/PyMCubes/blob/v0.1.6/.github/workflows/mcubes-deployment.yml
name: Build pymcubes wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymcubes.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymcubes.yml'
      - 'docs/packages/pymcubes.yaml'
      - 'patches/pymcubes/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymcubes.yml'
      - 'docs/packages/pymcubes.yaml'
      - 'patches/pymcubes/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymcubes
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymcubes ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymcubes"
      version: "${{ matrix.version }}"
      repository: "pmneila/PyMCubes"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pyproject.toml pins build-system.requires to "numpy~=2.0", which has
      # no cp313/cp314 wheels at all (numpy 2.0 predates Python 3.13). Pin the
      # same requires with the ceiling lifted and disable isolation so it holds.
      cibw-before-build: "pip install setuptools wheel Cython \"numpy>=2.0,<3.0\""
      cibw-build-frontend: "build; args: --no-isolation"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-requires: "pytest pycollada"
      # test_mcubes.py/test_smoothing.py sit at the repo root beside the mcubes/
      # source package; testing from {project} would import that source tree
      # instead of the built wheel (gotcha 25).
      cibw-test-sources: "test_mcubes.py test_smoothing.py"
      # Upstream's own CI creates this dir before pytest; test_export() writes into it.
      cibw-test-command: "mkdir -p output && python -m pytest -v test_mcubes.py test_smoothing.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYMCUBES_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pymcubes-${{ env.PYMCUBES_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"_mcubes"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish pymcubes ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymcubes-${{ matrix.version }}-*-manylinux_riscv64
