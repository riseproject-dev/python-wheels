---
# This workflow is based on the `build_wheels` job of
# https://github.com/SparseDifferentiation/SparseDiffPy/blob/v0.3.0/.github/workflows/build-and-publish.yml
name: Build sparsediffpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sparsediffpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sparsediffpy.yml'
      - 'docs/packages/sparsediffpy.yaml'
      - 'patches/sparsediffpy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sparsediffpy.yml'
      - 'docs/packages/sparsediffpy.yaml'
      - 'patches/sparsediffpy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sparsediffpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sparsediffpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "sparsediffpy"
      version: "${{ matrix.version }}"
      repository: "SparseDifferentiation/SparseDiffPy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/sparsediffpy/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # CMakeLists.txt find_package(BLAS)s unconditionally on Linux; stage its
      # licence beside ours since auditwheel will vendor libopenblas.so.0 in.
      cibw-before-all-linux: "dnf -y install openblas-devel && cp /usr/share/licenses/openblas/LICENSE {project}/LICENSE.openblas"
      # numpy has riscv64 wheels only on our registry.
      # Upstream ships no test suite for this package; build one C node,
      # the smallest real exercise of the extension.
      cibw-test-command: "python -c \"from sparsediffpy import _sparsediffengine as e; assert e.make_variable(2, 1, 0, 1)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPARSEDIFFPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sparsediffpy-${{ env.SPARSEDIFFPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("sparsediffpy/_sparsediffengine.") and n.endswith(".so")
                         for n in names), whl
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.openblas"}, (whl, licences)
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for sparsediffpy ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: sparsediffpy
      version: ${{ matrix.version }}
      # OpenBLAS is compiled with gfortran, so auditwheel vendors the image's
      # libgfortran into sparsediffpy.libs/.
      packages: gcc

  publish:
    name: Publish sparsediffpy ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sparsediffpy-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: sparsediffpy-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
