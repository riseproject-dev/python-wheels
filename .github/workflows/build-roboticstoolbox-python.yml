---
# This workflow is based on https://github.com/petercorke/robotics-toolbox-python/blob/v1.5.0/.github/workflows/release.yml
# and https://github.com/petercorke/robotics-toolbox-python/blob/v1.5.0/.github/workflows/ci.yml
name: Build roboticstoolbox-python wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/roboticstoolbox-python.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-roboticstoolbox-python.yml'
      - 'docs/packages/roboticstoolbox-python.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-roboticstoolbox-python.yml'
      - 'docs/packages/roboticstoolbox-python.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: roboticstoolbox-python
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build roboticstoolbox-python ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      RTB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout roboticstoolbox-python ${{ env.RTB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: petercorke/robotics-toolbox-python
          ref: v${{ env.RTB_VERSION }}
          persist-credentials: false

      # The vendored header-only Eigen has no LICENSE of its own in this tree.
      - name: Stage Eigen's licence
        run: curl -fsSL --retry 5 -o COPYING.eigen https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,pillow,matplotlib,contourpy,kiwisolver,quadprog,pyyaml
          # upstream's [dev] extra minus coal (no riscv64 wheel) and lint/coverage/notebook tooling
          CIBW_TEST_REQUIRES: pytest pytest-timeout pyyaml sympy qpsolvers quadprog bdsim trimesh
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "from roboticstoolbox.ets.fknm import _C_AVAILABLE as a; from roboticstoolbox.robot.frne import _C_AVAILABLE as b; assert a and b"
            && python -m pytest tests --ignore=tests/test_blocks.py -m "not slow" --timeout=50 --timeout_method=thread -q

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              for ext in ("_frne_c", "_fknm_c"):
                  assert any(n.startswith(f"roboticstoolbox/{ext}.") and n.endswith(".so") for n in names), (path, ext)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "COPYING.eigen"}, (path, licences)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roboticstoolbox-python-${{ env.RTB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish roboticstoolbox-python ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: roboticstoolbox-python-${{ matrix.version }}-*-manylinux_riscv64
