---
# Mirrors upstream's own [tool.cibuildwheel] in pyproject.toml: a nanobind/scikit-build-core
# CMake build (C++17) tagged cp312-abi3, compiling the extern/{Eigen,voro++,fsph} git
# submodules plus the vendored extern/{dset,bessel-library.hpp} headers straight into the
# extension. musllinux and free-threaded builds are skipped upstream too
# (`skip = ["*musllinux*","cp3??t-*","cp315*"]`).
name: Build freud-analysis wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/freud-analysis.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-freud-analysis.yml'
      - 'docs/packages/freud-analysis.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-freud-analysis.yml'
      - 'docs/packages/freud-analysis.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Pin from .github/workflows/cibuildwheel-before-build.sh, used to fetch oneTBB's own
  # licence at the exact revision that script compiles in.
  TBB_VERSION: 2022.1.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: freud-analysis
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build freud-analysis ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "freud-analysis"
      version: "${{ matrix.version }}"
      repository: "glotzerlab/freud"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 300
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/freud-analysis/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        git submodule update --init --depth=1 -- extern/Eigen extern/voro++ extern/fsph
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        set -euo pipefail
        cat extern/Eigen/COPYING.README extern/Eigen/COPYING.MPL2 extern/Eigen/COPYING.BSD extern/Eigen/COPYING.LGPL > LICENSE.eigen
        cp extern/voro++/LICENSE LICENSE.voropp
        cp extern/fsph/LICENSE LICENSE.fsph
        curl -fsSL --retry 5 https://raw.githubusercontent.com/jodesarro/bessel-library/main/LICENSE -o LICENSE.bessel-library
        curl -fsSL --retry 5 https://raw.githubusercontent.com/wjakob/nanobind/v3.1.0/LICENSE -o LICENSE.nanobind
        curl -fsSL --retry 5 https://raw.githubusercontent.com/Tessil/robin-map/master/LICENSE -o LICENSE.robin-map
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/uxlfoundation/oneTBB/v2022.1.0/LICENSE.txt" -o LICENSE.tbb

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp312-manylinux_riscv64"
      # Upstream's own before-build script (unmodified: it ships in the checked-out
      # tree) builds oneTBB from source and installs it to the default CMake prefix,
      # which freud/CMake/FindTBB.cmake's find_package_config_first() then picks up.
      cibw-before-build: "source .github/workflows/cibuildwheel-before-build.sh {package} linux"
      cibw-environment-linux: "CMAKE_PREFIX_PATH=/project/tbb LD_LIBRARY_PATH=/project/tbb/lib/intel64/gcc4.8:$LD_LIBRARY_PATH CMAKE_ARGS=-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=True PIP_ONLY_BINARY=numpy,scipy,matplotlib"
      # Upstream's own repair-wheel-command pipes auditwheel repair into a
      # pipx-installed abi3audit; the riscv64 image carries no pipx (CLAUDE.md gotcha
      # 217), and it is redundant besides, since cibuildwheel's own default
      # audit-command already abi3audits every abi3-tagged wheel natively.
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"
      # matplotlib (a CIBW_TEST_REQUIRES pin) transitively pulls in pillow/contourpy/
      # kiwisolver; none publish a riscv64 wheel on PyPI newer than ours, and pillow's
      # sdist build fails outright (no libjpeg headers in the manylinux image). Pin
      # these to our registry's wheels for the test install too.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy,matplotlib,contourpy,kiwisolver,pillow"
      cibw-test-requires: "pytest==9.1.1 numpy==2.5.2 scipy==1.18.1 gsd==5.0.1 matplotlib==3.11.1 sympy==1.14.0"
      cibw-test-command: "pytest {package}/tests -v --log-level=DEBUG"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      FREUD_ANALYSIS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: freud-analysis-${{ env.FREUD_ANALYSIS_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".abi3.so")]
          assert exts, names
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          expected = {"LICENSE", "LICENSE.eigen", "LICENSE.voropp", "LICENSE.fsph",
                      "LICENSE.bessel-library", "LICENSE.nanobind", "LICENSE.robin-map",
                      "LICENSE.tbb"}
          assert licences == expected, licences
          EOF

  publish:
    name: Publish freud-analysis ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: freud-analysis-${{ matrix.version }}-*-manylinux_riscv64
