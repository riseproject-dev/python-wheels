---
# Based on upstream's own wheel build:
#   https://github.com/ethereum/c-kzg-4844/blob/v2.1.8/.github/workflows/python-release.yml
name: Build ckzg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ckzg version/tag to build (git tag without leading v, e.g. 2.1.8)'
        required: true
        default: '2.1.8'
  pull_request:
    paths:
      - '.github/workflows/build-ckzg.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.1.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CKZG_VERSION: ${{ inputs.version || '2.1.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build ckzg ${{ inputs.version || '2.1.8' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout c-kzg-4844 v${{ env.CKZG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ethereum/c-kzg-4844
          ref: v${{ env.CKZG_VERSION }}
          submodules: recursive
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD_LINUX: |
            if command -v apk > /dev/null; then
              apk add --update clang && make -C src blst
            elif command -v yum > /dev/null; then
              yum install -y clang && make -C src blst
            fi
          CIBW_TEST_REQUIRES: PyYAML
          CIBW_TEST_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_COMMAND: >-
            python -c "import ckzg; assert ckzg.__file__.endswith('.so'), ckzg.__file__" &&
            cd {package}/bindings/python &&
            python tests.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ckzg-${{ env.CKZG_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ckzg ${{ inputs.version || '2.1.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: ckzg-${{ inputs.version || '2.1.8' }}-*riscv64
