---
# This workflow is based on: https://github.com/pygraphviz/pygraphviz/blob/pygraphviz-2.0.1/.github/workflows/release.yml
name: Build pygraphviz wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pygraphviz.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pygraphviz.yml'
      - 'docs/packages/pygraphviz.yaml'
      - 'patches/pygraphviz/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pygraphviz.yml'
      - 'docs/packages/pygraphviz.yaml'
      - 'patches/pygraphviz/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  GRAPHVIZ_VERSION: '14.1.5'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pygraphviz
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pygraphviz ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      # Upstream builds cp310-cp314 and publishes no free-threaded wheel.
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pygraphviz"
      version: "${{ matrix.version }}"
      repository: "pygraphviz/pygraphviz"
      ref: "pygraphviz-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pygraphviz/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cat > collect-licenses.sh <<'COLLECT_EOF'
        #!/bin/bash
        # SPDX-FileCopyrightText: 2026 The RISE Project
        # SPDX-License-Identifier: MIT
        #
        # Stage, at the project root, the licence of every shared library auditwheel
        # vendors into the wheel out of the build image. pyproject.toml's LICENSE.*
        # pattern then copies them into the wheel beside pygraphviz's own.
        set -euo pipefail

        project="${1:?usage: collect-licenses.sh <project-dir> <graphviz-prefix>}"
        prefix="${2:?usage: collect-licenses.sh <project-dir> <graphviz-prefix>}"

        # Everything the wheel holds: the libraries the extension links, the plugins it
        # loads, and the CLI tools copied into pygraphviz/bin. ldd is transitive, so this
        # is the whole closure. Graphviz's own libraries are not rpm-owned and are
        # covered by the checked-in LICENSE.graphviz.
        roots=(
            "$prefix"/lib/libcdt.so "$prefix"/lib/libcgraph.so "$prefix"/lib/libgvc.so
            "$prefix"/lib/graphviz/libgvplugin_core.so
            "$prefix"/lib/graphviz/libgvplugin_dot_layout.so
            "$prefix"/lib/graphviz/libgvplugin_neato_layout.so
            "$prefix"/lib/graphviz/libgvplugin_gd.so
            "$prefix"/lib/graphviz/libgvplugin_pango.so
            "$prefix"/bin/gc "$prefix"/bin/acyclic "$prefix"/bin/gvpr "$prefix"/bin/gvcolor
            "$prefix"/bin/ccomps "$prefix"/bin/sccmap "$prefix"/bin/tred "$prefix"/bin/unflatten
        )

        # Libraries on auditwheel's allowlist are assumed present on the host and are
        # never vendored, so they carry no obligation here.
        mapfile -t allow < <(
            "$(dirname "$(readlink -f "$(command -v auditwheel)")")/python" - <<'PY'
        import json, pathlib, auditwheel

        policy = pathlib.Path(auditwheel.__file__).parent / "policy" / "manylinux-policy.json"
        policies = json.loads(policy.read_text())
        print("\n".join(next(p["lib_whitelist"] for p in policies if p["name"] == "manylinux_2_39")))
        PY
        )

        mapfile -t libs < <(
            ldd "${roots[@]}" | tr ' ' '\n' | grep '^/' | sort -u |
                grep -vFf <(printf '%s\n' "${allow[@]}")
        )

        # `rpm -qf` reports unowned files on stdout, so keep only bare package names.
        mapfile -t pkgs < <(
            rpm -qf --qf '%{NAME}\n' "${libs[@]}" 2>/dev/null |
                grep -E '^[A-Za-z0-9._+-]+$' | sort -u
        )

        for pkg in "${pkgs[@]}"; do
            mapfile -t files < <(rpm -q --licensefiles "$pkg" 2>/dev/null || true)

            # Some subpackages leave the licence to a sibling of the same source RPM.
            if [ -z "${files[0]:-}" ]; then
                srpm=$(rpm -q --qf '%{SOURCERPM}\n' "$pkg")
                mapfile -t files < <(
                    rpm -qa --qf '%{SOURCERPM} %{NAME}\n' |
                        awk -v s="$srpm" '$1 == s { print $2 }' |
                        xargs -r rpm -q --licensefiles 2>/dev/null | sort -u
                )
            fi

            # Others mark it %doc rather than %license, and the image installs no docs.
            if [ -z "${files[0]:-}" ]; then
                dnf -y reinstall --setopt=tsflags= "$pkg" >/dev/null
                mapfile -t files < <(rpm -qd "$pkg" | grep -iE '/(LICEN[CS]E|COPYING|NOTICE)')
            fi

            # A few ship the text only in the source RPM (libxcb's %license COPYING is
            # not in the binary package).
            if [ -z "${files[0]:-}" ]; then
                dnf -y install dnf-plugins-core >/dev/null
                rm -rf /tmp/srpm && mkdir -p /tmp/srpm && pushd /tmp/srpm >/dev/null
                dnf -y download --source "$pkg" >/dev/null
                rpm2archive -n ./*.src.rpm | tar x
                for tarball in ./*.tar.*; do
                    tar xf "$tarball"
                done
                popd >/dev/null
                mapfile -t files < <(
                    find /tmp/srpm -maxdepth 3 -type f -regextype posix-extended \
                        -iregex '.*/(COPYING|LICEN[CS]E|NOTICE)[^/]*' | sort
                )
            fi

            for f in "${files[@]}"; do
                [ -f "$f" ] || continue
                cp "$f" "$project/LICENSE.${pkg}.$(basename "$f")"
            done
            compgen -G "$project/LICENSE.$pkg.*" >/dev/null ||
                { echo "no licence file found for $pkg" >&2; exit 1; }
        done

        ls -1 "$project"/LICENSE.* | sed "s|$project/||"
        COLLECT_EOF

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Graphviz from source, as upstream does; the release tarballs use
      # autotools. CFLAGS=-fPIC is needed to link it into the extension.
      # riscv64 links executables at 0x10000, which is also mmap_min_addr,
      # so the segment auditwheel's patchelf prepends to the bundled CLI
      # tools cannot be mapped and they segfault at startup; raise the base.
      cibw-before-all-linux: "dnf install -y gcc gcc-c++ bison flex expat-devel zlib-devel autoconf automake libtool gd-devel cairo-devel pango-devel && curl -L \"https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/14.1.5/graphviz-14.1.5.tar.gz\" -o /tmp/graphviz.tar.gz && tar xzf /tmp/graphviz.tar.gz -C /tmp && cd /tmp/graphviz-14.1.5 && ./configure --prefix=/opt/graphviz --with-pangocairo --disable-swig --disable-tcl --disable-sharp --disable-go --disable-guile --disable-java --disable-lua --disable-perl --disable-php --disable-python --disable-python3 --disable-r --disable-ruby --disable-man-pdfs --with-expat --with-zlib CFLAGS=\"-fPIC\" LDFLAGS=\"-Wl,-Ttext-segment=0x200000\" && make -j$(nproc) && make install && ldconfig && bash {project}/collect-licenses.sh {project} /opt/graphviz"
      cibw-environment-linux: "GRAPHVIZ_PREFIX=/opt/graphviz LD_LIBRARY_PATH=/opt/graphviz/lib:/opt/graphviz/lib/graphviz PATH=\"$PATH:/opt/graphviz/bin\""
      cibw-before-build-linux: "mkdir -p {package}/pygraphviz/bin && cp /opt/graphviz/bin/gc /opt/graphviz/bin/acyclic /opt/graphviz/bin/gvpr /opt/graphviz/bin/gvcolor /opt/graphviz/bin/ccomps /opt/graphviz/bin/sccmap /opt/graphviz/bin/tred /opt/graphviz/bin/unflatten {package}/pygraphviz/bin/"
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import os, tempfile, pygraphviz as p; print('pygraphviz', p.__version__); G = p.AGraph(); G.add_edge('a', 'b'); f = os.path.join(tempfile.mkdtemp(), 't.png'); G.draw(f, prog='dot'); assert os.path.getsize(f) > 0; print('PNG render OK:', f)\" && pytest --pyargs pygraphviz"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Upstream builds cp310-cp314 and publishes no free-threaded wheel.
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYGRAPHVIZ_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pygraphviz-${{ env.PYGRAPHVIZ_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and the bundled licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("pygraphviz/_graphviz.") and n.endswith(".so") for n in names), names
          vendored = {
              n.split("/")[-1].split("-")[0]
              for n in names
              if n.startswith("pygraphviz.libs/") and not n.endswith("/")
          }
          licences = {
              n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")
          }
          print("\n".join(sorted(vendored)))
          print("\n".join(sorted(licences)))
          assert {"LICENSE", "LICENSE.graphviz"} <= licences, licences
          for lib, pkg in [
              ("libcairo", "cairo"), ("libpango", "pango"),
              ("libfreetype", "freetype"), ("libgd", "gd"),
          ]:
              assert lib in vendored, (lib, vendored)
              assert any(n.startswith(f"LICENSE.{pkg}.") for n in licences), (pkg, licences)
          EOF

  gpl_sources:
    name: Collect GPL sources for pygraphviz ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: pygraphviz
      version: ${{ matrix.version }}
      # Every copyleft library auditwheel vendors out of the build image.
      packages: cairo freetype fribidi glib2 graphite2 jbigkit-libs libdatrie libmount libselinux libthai libtool-ltdl libzstd pango pcre2 xz-libs

  publish:
    name: Publish pygraphviz ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pygraphviz-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pygraphviz-${{ matrix.version }}-gpl-sources
      gpl-sources-description: the copyleft libraries bundled in the wheel
