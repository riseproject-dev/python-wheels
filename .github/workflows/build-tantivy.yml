---
# This workflow is based on the `linux` job of
# https://github.com/quickwit-oss/tantivy-py/blob/0.26.0/.github/workflows/publish.yaml
name: Build tantivy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tantivy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tantivy.yml'
      - 'docs/packages/tantivy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tantivy.yml'
      - 'docs/packages/tantivy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tantivy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tantivy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tantivy"
      version: "${{ matrix.version }}"
      repository: "quickwit-oss/tantivy-py"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # tantivy-py ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # The repo-root tantivy/ package (from .tantivy import *) shadows the
      # wheel's compiled submodule when tested in place (no .so there outside
      # a maturin-develop editable install), so stage only what the suite
      # needs (gotcha 25). docs/contributing.md is a symlink to
      # ../CONTRIBUTING.md, so that file needs staging too or test_docs.py
      # hits a dangling link.
      cibw-test-sources: "tests docs CONTRIBUTING.md"
      cibw-test-requires: "pytest mktestdocs==0.2.1"
      cibw-test-command: >
        python -c "import tantivy.tantivy as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests

  publish:
    name: Publish tantivy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tantivy-${{ matrix.version }}-*-manylinux_riscv64
