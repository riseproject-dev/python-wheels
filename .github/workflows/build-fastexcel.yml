---
# This workflow is based on the `check-wheel-build`/`check-wheel-build-musllinux` jobs of
# https://github.com/ToucanToco/fastexcel/blob/v0.21.0/.github/workflows/CI.yml
name: Build fastexcel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastexcel.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastexcel.yml'
      - 'docs/packages/fastexcel.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastexcel.yml'
      - 'docs/packages/fastexcel.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastexcel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build fastexcel ${{ matrix.version }} manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastexcel"
      version: "${{ matrix.version }}"
      repository: "ToucanToco/fastexcel"
      ref: "v${{ matrix.version }}"
      artifact-tag: "manylinux_riscv64"
      timeout-minutes: 360
      # abi3-py310 (Cargo.toml) collapses cp310-cp313 into one build+reuse
      # (gotcha 11/96); cp314t is a genuine separate build since pyo3 disables
      # abi3 under Py_GIL_DISABLED. musllinux is dropped: rustup.rs ships no
      # riscv64 musl toolchain.
      cibw-build: >
        cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64
        cp313-manylinux_riscv64 cp314t-manylinux_riscv64
      # fastexcel ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=pandas,pyarrow,numpy,polars-runtime-32"
      # pyarrow has no riscv64 wheel below cp312 and pandas has none for
      # cp314t on our registry yet, and both are needed transitively by
      # every test module's shared tests/utils.py; skip those identifiers.
      cibw-test-skip: "cp310-* cp311-* cp314t-*"
      cibw-test-requires: >
        pytest>=7.1.3 pandas>=1.4.4 pyarrow>=8.0.0 polars>=1
        openpyxl>=3.1.2,<4 xlrd>=2.0.1,<3
      cibw-test-sources: "python/tests tests/fixtures pyproject.toml"
      cibw-test-command: >
        python -c "import fastexcel._fastexcel as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v python/tests

  publish:
    name: Publish fastexcel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastexcel-${{ matrix.version }}-manylinux_riscv64
