---
# This workflow is based on: https://github.com/PostHog/posthog/blob/master/.github/workflows/build-hogql-parser.yml
name: Build hogql-parser wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hogql-parser.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hogql-parser.yml'
      - 'docs/packages/hogql-parser.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hogql-parser.yml'
      - 'docs/packages/hogql-parser.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # PostHog/posthog never tags this package, and master's
  # common/hogql_parser/setup.py stops at 1.3.85 - 1.3.86 and later went to
  # PyPI from commits that never landed there. So a version names either the
  # commit whose setup.py declares it, or, where no such commit exists, the
  # PyPI sdist that does, pinned by hash. One shared pin instead built 1.3.84
  # for every version and republished it as each of them, which left 1.3.85+
  # permanently unreleased and rebuilt on every docs push.
  HOGQL_PARSER_SOURCES: >-
    {"1.3.84": {"ref": "c30d2736928729ea424b08003c9cea2006b7606b"},
     "1.3.85": {"ref": "a7a004f960252b9f1b603e014b24c8f3bfa86d5d"},
     "1.3.86": {"sdist-sha256": "9e32e1e6e94f1712c76432a7a788e148e35c3c85d649f8bec2c7dff1ddd619c9"},
     "1.3.87": {"sdist-sha256": "21eeb93057445ef086acee2b2fbfb062e17668d930533b2326c123eaa8683b82"},
     "1.3.88": {"sdist-sha256": "b9cb58d9c52b47444d97e1b6029379f818db3e749a638d8e8aab3ebc70c81d95"}}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hogql-parser
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hogql-parser ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # setup.py builds a plain per-interpreter Extension (no abi3), matching
        # upstream's own coverage for this version (cp310-cp313; cp314 support
        # landed after 1.3.84).
        python: ["cp310", "cp311", "cp312", "cp313"]

    env:
      HOGQL_PARSER_VERSION: ${{ matrix.version }}

    steps:
      # A version with no entry fails here rather than silently building
      # whatever version some other entry's sources declare.
      - name: Resolve the sources for ${{ matrix.version }}
        id: upstream
        env:
          SOURCES: ${{ env.HOGQL_PARSER_SOURCES }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          if ! entry=$(jq -ce --arg v "$VERSION" '.[$v] // empty' <<<"$SOURCES"); then
            echo "::error::hogql-parser $VERSION has no entry in HOGQL_PARSER_SOURCES"
            exit 1
          fi
          {
            echo "ref=$(jq -r '.ref // ""' <<<"$entry")"
            echo "sdist-sha256=$(jq -r '."sdist-sha256" // ""' <<<"$entry")"
          } >> "$GITHUB_OUTPUT"

      # common/hogql_parser's checked-in generated ANTLR sources make this a
      # self-contained build directory; sparse-checkout skips the rest of the
      # multi-GB posthog monorepo (Django app, frontend, ...).
      - name: Checkout posthog common/hogql_parser
        if: steps.upstream.outputs.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: PostHog/posthog
          ref: ${{ steps.upstream.outputs.ref }}
          sparse-checkout: common/hogql_parser
          persist-credentials: false

      # The sdist carries the same generated sources as the monorepo directory
      # plus the setup.py declaring this version - what the bump commit that
      # never landed would have provided. Unpacked into the same path so the
      # build step does not care where the sources came from.
      - name: Unpack the hogql-parser ${{ matrix.version }} sdist
        if: steps.upstream.outputs.sdist-sha256 != ''
        env:
          VERSION: ${{ matrix.version }}
          SDIST_SHA256: ${{ steps.upstream.outputs.sdist-sha256 }}
        run: |
          set -euo pipefail
          url=$(curl --fail --silent --show-error \
            "https://pypi.org/pypi/hogql-parser/$VERSION/json" |
            jq -er '.urls[] | select(.packagetype == "sdist") | .url')
          curl --fail --silent --show-error --location --output sdist.tar.gz "$url"
          echo "$SDIST_SHA256  sdist.tar.gz" | sha256sum --check --strict
          mkdir -p common/hogql_parser
          tar --extract --gzip --file sdist.tar.gz \
            --strip-components=1 --directory common/hogql_parser

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build wheel
        env:
          CIBW_ARCHS: riscv64
          # Upstream's own [tool.cibuildwheel] `build` list only names macOS and
          # manylinux_x86_64/aarch64 identifiers, so it must be overridden here
          # rather than relying on cibuildwheel's `--only` to add riscv64 to it.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's own before-all (manylinux_2_28/AlmaLinux 8) installs
          # `epel-release` to get a newer `cmake3` - EPEL doesn't exist on
          # riscv64 (gotcha 51) and isn't needed anyway, since Rocky 10's
          # system `cmake` is already 3.31. Same antlr4-cpp-runtime source
          # build otherwise, unchanged from upstream.
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            dnf install -y unzip cmake curl uuid pkg-config
            curl --fail --location https://www.antlr.org/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip || curl --fail --location https://raw.githubusercontent.com/antlr/website-antlr4/gh-pages/download/antlr4-cpp-runtime-4.13.1-source.zip --output antlr4-source.zip
            antlr_known_md5sum="c875c148991aacd043f733827644a76f"
            antlr_found_md5sum="$(md5sum antlr4-source.zip | cut -d' ' -f1)"
            if [[ "$antlr_known_md5sum" != "$antlr_found_md5sum" ]]; then exit 64; fi
            unzip antlr4-source.zip -d antlr4-source && cd antlr4-source
            cmake . -DBUILD_TESTING=OFF -DANTLR4_BUILD_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            DESTDIR=out make install
            cp -r out/usr/local/include/antlr4-runtime /usr/include/
            cp out/usr/local/lib64/libantlr4-runtime.so* /usr/lib64/
            ldconfig
        # No CIBW_TEST_COMMAND: upstream's own workflow doesn't test the wheel
        # either. `import hogql_parser` eagerly imports `posthog.hogql.ast`
        # (the posthog Django app, not on PyPI) at module load, so it can't be
        # smoke-tested outside the monorepo it ships alongside - confirmed by
        # reproducing the same ModuleNotFoundError against the real PyPI wheel.
        run: |
          set -euo pipefail
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse common/hogql_parser

      # The version is baked into the sources, not passed in, so a wrong pin
      # yields wheels named after a different version - which the publish step
      # would then record against this one. Refuse them here instead.
      - name: Check the wheels carry ${{ matrix.version }}
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          for wheel in wheelhouse/*.whl; do
            case "${wheel##*/}" in
              "hogql_parser-$VERSION-"*) ;;
              *) echo "::error::$wheel is not hogql-parser $VERSION"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hogql-parser-${{ env.HOGQL_PARSER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish hogql-parser ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: hogql-parser-${{ matrix.version }}-*-manylinux_riscv64
