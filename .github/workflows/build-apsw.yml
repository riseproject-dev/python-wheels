---
# Based on the `binary` job of
# https://github.com/rogerbinns/apsw/blob/3.53.4.0/.github/workflows/build-pypi.yml
name: Build apsw wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'apsw version/tag to build, e.g. 3.53.4.0'
        required: true
        default: '3.53.4.0'
  pull_request:
    paths:
      - '.github/workflows/build-apsw.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '3.53.4.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  APSW_VERSION: ${{ inputs.version || '3.53.4.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build apsw ${{ inputs.version || '3.53.4.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout apsw ${{ env.APSW_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rogerbinns/apsw
          ref: ${{ env.APSW_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_BUILD: python -c "import shutil ; shutil.copyfile('tools/setup-pypi.cfg','setup.apsw')"
          CIBW_TEST_COMMAND: python -m apsw.tests -v
          APSW_HEAVY_DURATION: 2

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: apsw-${{ env.APSW_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish apsw ${{ inputs.version || '3.53.4.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: apsw-${{ inputs.version || '3.53.4.0' }}-*-manylinux_riscv64
