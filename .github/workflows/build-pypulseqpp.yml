---
# This workflow is based on: https://github.com/pulserver/pypulseqpp/blob/v0.0.55/.github/workflows/wheels.yml
name: Build pypulseqpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pypulseqpp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pypulseqpp.yml'
      - 'docs/packages/pypulseqpp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pypulseqpp.yml'
      - 'docs/packages/pypulseqpp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pypulseqpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pypulseqpp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pypulseqpp"
      version: "${{ matrix.version }}"
      repository: "pulserver/pypulseqpp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0
      pre-build: |-
        set -euo pipefail
        cp external/MRArbGrad/LICENSE LICENSES/MRArbGrad-MIT.txt
        pybind11=$(curl -fsSL --retry 5 https://pypi.org/pypi/pybind11/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/v${pybind11}/LICENSE" -o LICENSES/pybind11-BSD-3-Clause.txt

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy,h5py,matplotlib,contourpy,kiwisolver,pillow"
      cibw-test-command: "python -c \"import pypulseqpp; print(pypulseqpp.__version__)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYPULSEQPP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypulseqpp-${{ env.PYPULSEQPP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert len(exts) == 1 and exts[0].startswith("pypulseqpp/_ext.cpython-"), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSES/MRArbGrad-MIT.txt", "LICENSES/pybind11-BSD-3-Clause.txt",
                              "LICENSES/SigPy-BSD-3-Clause.txt", "LICENSES/pocketfft-BSD-3-Clause.txt",
                              "LICENSES/safe_pns_prediction-BSD-3-Clause.txt"}, licences
          EOF

  publish:
    name: Publish pypulseqpp ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pypulseqpp-${{ matrix.version }}-*-manylinux_riscv64
