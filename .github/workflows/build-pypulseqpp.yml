---
# This workflow is based on: https://github.com/pulserver/pypulseqpp/blob/v0.0.55/.github/workflows/wheels.yml
name: Build pypulseqpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pypulseqpp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pypulseqpp.yml'
      - 'docs/packages/pypulseqpp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pypulseqpp.yml'
      - 'docs/packages/pypulseqpp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pypulseqpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pypulseqpp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]
    env:
      PYPULSEQPP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pypulseqpp v${{ env.PYPULSEQPP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pulserver/pypulseqpp
          ref: v${{ env.PYPULSEQPP_VERSION }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # MRArbGrad and pybind11 are compiled into the extension; upstream's LICENSES/* glob ships neither notice.
      - name: Stage the vendored dependencies' licences
        run: |
          set -euo pipefail
          cp external/MRArbGrad/LICENSE LICENSES/MRArbGrad-MIT.txt
          pybind11=$(curl -fsSL --retry 5 https://pypi.org/pypi/pybind11/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')
          curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/v${pybind11}/LICENSE" -o LICENSES/pybind11-BSD-3-Clause.txt

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy,scipy,h5py,matplotlib,contourpy,kiwisolver,pillow
          CIBW_TEST_COMMAND: "python -c \"import pypulseqpp; print(pypulseqpp.__version__)\""

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert len(exts) == 1 and exts[0].startswith("pypulseqpp/_ext.cpython-"), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSES/MRArbGrad-MIT.txt", "LICENSES/pybind11-BSD-3-Clause.txt",
                              "LICENSES/SigPy-BSD-3-Clause.txt", "LICENSES/pocketfft-BSD-3-Clause.txt",
                              "LICENSES/safe_pns_prediction-BSD-3-Clause.txt"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypulseqpp-${{ env.PYPULSEQPP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pypulseqpp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pypulseqpp-${{ matrix.version }}-*-manylinux_riscv64
