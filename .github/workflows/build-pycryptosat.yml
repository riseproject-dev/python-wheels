---
# This workflow is based on: https://github.com/msoos/cryptominisat/blob/release/v5.17.0/.github/workflows/python-wheels.yml
name: Build pycryptosat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycryptosat.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycryptosat.yml'
      - 'docs/packages/pycryptosat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycryptosat.yml'
      - 'docs/packages/pycryptosat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycryptosat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pycryptosat ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYCRYPTOSAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cryptominisat release/v${{ env.PYCRYPTOSAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: msoos/cryptominisat
          ref: release/v${{ env.PYCRYPTOSAT_VERSION }}
          submodules: 'true'
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No EPEL (hence no ccache) on riscv64. CaDiCaL/CadiBack are cloned here, from the
          # branches upstream's FetchContent tracks, so the bundled licences match what is built.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf -y install gmp-devel &&
            git clone --depth 1 --branch master https://github.com/meelgroup/cadical /tmp/cadical &&
            git clone --depth 1 --branch main https://github.com/meelgroup/cadiback /tmp/cadiback &&
            cp /tmp/cadical/LICENSE /project/LICENSE.cadical &&
            cp /tmp/cadiback/LICENSE /project/LICENSE.cadiback &&
            cp /usr/share/licenses/gmp/COPYING.LESSERv3 /project/LICENSE.gmp &&
            cp /usr/share/licenses/gmp/COPYINGv3 /project/LICENSE.gmp.GPL
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=cmake,ninja
            CMAKE_ARGS="-DFETCHCONTENT_SOURCE_DIR_CADICAL=/tmp/cadical -DFETCHCONTENT_SOURCE_DIR_CADIBACK=/tmp/cadiback"

      - name: Check the extension, vendored libraries and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pycryptosat.cpython-") and n.endswith(".so") for n in names), names
              libs = {n.split("/")[-1].split("-")[0] for n in names if ".libs/" in n and not n.endswith("/")}
              assert {"libgmp", "libgmpxx"} <= libs, libs
              lic = {n.split("/")[-1] for n in names if "/licenses/" in n}
              assert {"LICENSE.txt", "LICENSE.cadical", "LICENSE.cadiback", "LICENSE.gmp", "LICENSE.gmp.GPL"} <= lic, lic
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pycryptosat-${{ env.PYCRYPTOSAT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      PYCRYPTOSAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc gmp
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pycryptosat-${{ env.PYCRYPTOSAT_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pycryptosat ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pycryptosat-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pycryptosat-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc, gmp
