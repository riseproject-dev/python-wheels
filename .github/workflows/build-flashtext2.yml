---
# This workflow is based on the `linux` job of
# https://github.com/shner-elmo/flashtext2/blob/v1.1.0/.github/workflows/build_and_upload_binaries.yml
name: Build flashtext2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/flashtext2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-flashtext2.yml'
      - 'docs/packages/flashtext2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-flashtext2.yml'
      - 'docs/packages/flashtext2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: flashtext2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build flashtext2 ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "flashtext2"
      version: "${{ matrix.version }}"
      repository: "shner-elmo/flashtext2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp38-abi3-manylinux_riscv64"
      timeout-minutes: 120
      # pyo3's abi3-py38 feature is on unconditionally, so one abi3 wheel
      # serves every GIL-ful interpreter; built once on the oldest listed
      # identifier and re-tested on the newer ones via find_compatible_wheel.
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: >
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      # flashtext2 ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import flashtext2, importlib.metadata as md;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('flashtext2'))" &&
        python -m pytest -v tests

  publish:
    name: Publish flashtext2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: flashtext2-${{ matrix.version }}-*-manylinux_riscv64
