---
# This workflow is based on the `linux` job of
# https://github.com/shner-elmo/flashtext2/blob/v1.1.0/.github/workflows/build_and_upload_binaries.yml
name: Build flashtext2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/flashtext2.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-flashtext2.yml'
      - 'docs/packages/flashtext2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-flashtext2.yml'
      - 'docs/packages/flashtext2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: flashtext2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build flashtext2 ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      FLASHTEXT2_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout flashtext2 v${{ env.FLASHTEXT2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: shner-elmo/flashtext2
          ref: v${{ env.FLASHTEXT2_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          # pyo3's abi3-py38 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; built once on the oldest listed
          # identifier and re-tested on the newer ones via find_compatible_wheel.
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # flashtext2 ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import flashtext2, importlib.metadata as md;
            assert any(str(p).endswith('licenses/LICENSE') for p in md.files('flashtext2'))" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flashtext2-${{ env.FLASHTEXT2_VERSION }}-cp38-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish flashtext2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: flashtext2-${{ matrix.version }}-*-manylinux_riscv64
