---
# This workflow is based on the `package_sdist`/`package_wheels` jobs of
# https://github.com/AcademySoftwareFoundation/OpenTimelineIO/blob/v0.18.1/.github/workflows/python-package.yml
name: Build opentimelineio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/opentimelineio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-opentimelineio.yml'
      - 'docs/packages/opentimelineio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-opentimelineio.yml'
      - 'docs/packages/opentimelineio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: opentimelineio
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # The sdist packages the source tree plus the vendored Imath/rapidjson/pybind11
    # sources (git submodules) and is architecture-independent, so build it once on
    # x86 instead of burning a scarce riscv runner (CLAUDE.md gotcha 4).
    name: Build opentimelineio ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENTIMELINEIO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout opentimelineio v${{ env.OPENTIMELINEIO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AcademySoftwareFoundation/OpenTimelineIO
          ref: v${{ env.OPENTIMELINEIO_VERSION }}
          submodules: recursive
          persist-credentials: false

      # Imath, rapidjson and pybind11 are statically compiled in via git submodules,
      # but the upstream wheel ships only LICENSE.txt/NOTICE.txt, so their licences
      # never reach dist-info. Stage them at the root where setuptools' default
      # `LICEN[CS]E*` discovery picks them up.
      - name: Stage vendored licences
        run: |
          cp src/deps/Imath/LICENSE.md LICENSE.imath
          cp src/deps/rapidjson/license.txt LICENSE.rapidjson
          cp src/deps/pybind11/LICENSE LICENSE.pybind11

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          uv pip install build twine
          python -m build --sdist
          twine check --strict dist/*.tar.gz

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: opentimelineio-${{ matrix.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build opentimelineio ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: opentimelineio
      version: ${{ matrix.version }}
      source: artifact-sdist
      source-artifact: opentimelineio-${{ matrix.version }}-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-sources: tests examples
      # docs/ is pruned from the sdist (MANIFEST.in), so the schema-vs-docs
      # diff test has nothing to compare against.
      cibw-test-environment: OTIO_DISABLE_SERIALIZED_SCHEMA_TEST=1
      cibw-test-command: >
        python -c "import opentimelineio._otio as o, opentimelineio._opentime as t; assert o.__file__.endswith('.so'), o.__file__; assert t.__file__.endswith('.so'), t.__file__" &&
        python -m unittest discover -s {project}/tests -t {project}

  publish:
    name: Publish opentimelineio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: opentimelineio-${{ matrix.version }}-*-manylinux_riscv64
