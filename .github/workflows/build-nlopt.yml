---
# This workflow is based on: https://github.com/DanielBok/nlopt-python/blob/2.11.0/.github/workflows/wc-build.yml
name: Build nlopt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nlopt.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nlopt.yml'
      - 'docs/packages/nlopt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nlopt.yml'
      - 'docs/packages/nlopt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nlopt
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nlopt ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: nlopt
      version: ${{ matrix.version }}
      repository: DanielBok/nlopt-python
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-build: pip install numpy swig
      # numpy has no riscv64 wheel on public PyPI; PIP_ONLY_BINARY keeps pip
      # from source-building it (both here and when the built wheel's own
      # numpy>=2,<3 requirement is installed for CIBW_TEST_COMMAND).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-command: python {project}/extern/nlopt/test/t_python.py
      timeout-minutes: 60

  publish:
    name: Publish nlopt ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nlopt-${{ matrix.version }}-*-manylinux_riscv64
