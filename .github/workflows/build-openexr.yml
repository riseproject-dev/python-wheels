---
# This workflow is based on the `build_wheels` job of
# https://github.com/AcademySoftwareFoundation/openexr/blob/v3.4.15/.github/workflows/python-wheels.yml
name: Build openexr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/openexr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-openexr.yml'
      - 'docs/packages/openexr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openexr.yml'
      - 'docs/packages/openexr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # CMakeLists.txt FetchContent-pulls Imath at this tag when OPENEXR_FORCE_INTERNAL_IMATH
  # is set; bump alongside it if upstream ever moves the pin.
  IMATH_TAG: v3.2.2

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: openexr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build openexr ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Imath, libdeflate and OpenJPH are statically linked in (OPENEXR_FORCE_INTERNAL_*),
    # but upstream's own wheel only ships LICENSE.md; libdeflate/OpenJPH are vendored
    # under external/ while Imath is git-fetched at configure time (gotcha 53), so none
    # of the three licences reach dist-info without staging them at the project root.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "openexr"
      version: "${{ matrix.version }}"
      repository: "AcademySoftwareFoundation/openexr"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        cp external/deflate/COPYING LICENSE.deflate
        cp external/OpenJPH/LICENSE LICENSE.openjph
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/AcademySoftwareFoundation/Imath/v3.2.2/LICENSE.md" -o LICENSE.imath
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # OpenEXR's compiled extension has no Py_mod_gil slot, so cp314t
      # re-enables the GIL at import and the test suite's warnings-as-errors
      # config turns that into a collection error (gotcha 127).
      cibw-test-environment: "PIP_ONLY_BINARY=numpy PYTHON_GIL=1"
      cibw-test-command: >
        python -c "import importlib.metadata as m; f = sorted(str(p).split('licenses/', 1)[1] for p in m.files('openexr') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE.deflate', 'LICENSE.imath', 'LICENSE.md', 'LICENSE.openjph'], f" &&
        pytest -s {project}/src/wrappers/python/tests

  publish:
    name: Publish openexr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: openexr-${{ matrix.version }}-*-manylinux_riscv64
