---
# Based on the `build-linux-arm64` job of
# https://github.com/luxonis/depthai-core/blob/v3.10.0/.github/workflows/python-main.yml
# and its `pytest` job for the test selection.
name: Build depthai wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/depthai.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-depthai.yml'
      - 'docs/packages/depthai.yaml'
      - 'patches/depthai/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-depthai.yml'
      - 'docs/packages/depthai.yaml'
      - 'patches/depthai/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  DNF_PACKAGES: ninja-build perl-core curl zip unzip tar pkgconf-pkg-config autoconf automake libtool
  VCPKG_FORCE_SYSTEM_BINARIES: '1'
  VCPKG_BINARY_SOURCES: 'clear;files,/vcpkg-cache,readwrite'
  # The prebuilt closed-source dynamic_calibration library is only published for x86_64/arm64.
  CMAKE_ARGS: -DDEPTHAI_DYNAMIC_CALIBRATION_SUPPORT=OFF

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: depthai
      version: ${{ inputs.version }}

  # Builds the vcpkg dependency tree once into a binary cache the per-interpreter builds restore.
  vcpkg_cache:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build depthai ${{ matrix.version }} vcpkg dependencies
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      DEPTHAI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout depthai-core v${{ env.DEPTHAI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: luxonis/depthai-core
          ref: v${{ env.DEPTHAI_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch depthai-core
        run: git apply python-wheels/patches/depthai/${{ env.DEPTHAI_VERSION }}/*.patch

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-depthai-${{ env.DEPTHAI_VERSION }}-manylinux_riscv64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-depthai-${{ env.DEPTHAI_VERSION }}-manylinux_riscv64-

      - name: Install the vcpkg dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          docker run --rm -i --network=host \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/vcpkg-cache:/vcpkg-cache" \
            -e DNF_PACKAGES -e VCPKG_FORCE_SYSTEM_BINARIES -e VCPKG_BINARY_SOURCES -e CMAKE_ARGS \
            "$MANYLINUX_RISCV64_IMAGE" \
            bash <<'SCRIPT'
          set -eux
          dnf install -y --setopt=install_weak_deps=False ${DNF_PACKAGES}
          git config --global --add safe.directory '*'
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          # bindings/python/pyproject.toml's cmake pin, which vcpkg hashes into every package ABI, and
          # its numpy build requirement, which xtensor-python's FindNumPy imports at configure time.
          pip install --extra-index-url https://pypi.riseproject.dev/simple/ --only-binary numpy cmake==3.30 numpy
          cmake -S /project -B /tmp/build \
            -DDEPTHAI_BUILD_PYTHON=ON \
            -DDEPTHAI_ENABLE_EVENTS_MANAGER=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DDEPTHAI_MERGED_TARGET=ON \
            -DPYTHON_EXECUTABLE="$(command -v python)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEPTHAI_VCPKG_INTERNAL_ONLY=OFF \
            -DVCPKG_OVERLAY_TRIPLETS=/project/cmake/triplets/release \
            "$CMAKE_ARGS" ||
            { cd /tmp/build && bash /project/bindings/python/ci/show_vcpkg_logs.sh; exit 1; }
          SCRIPT

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: always()
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-depthai-${{ env.DEPTHAI_VERSION }}-manylinux_riscv64-${{ github.run_id }}-${{ github.run_attempt }}

  build_wheels:
    needs: [setup, vcpkg_cache]
    if: needs.setup.outputs.versions != '[]'
    name: Build depthai ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      DEPTHAI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout depthai-core v${{ env.DEPTHAI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: luxonis/depthai-core
          ref: v${{ env.DEPTHAI_VERSION }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch depthai-core
        run: git apply python-wheels/patches/depthai/${{ env.DEPTHAI_VERSION }}/*.patch

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-depthai-${{ env.DEPTHAI_VERSION }}-manylinux_riscv64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-depthai-${{ env.DEPTHAI_VERSION }}-manylinux_riscv64-

      - run: mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ runner.temp }}/vcpkg-cache:/vcpkg-cache"
          CIBW_BEFORE_ALL_LINUX: dnf install -y --setopt=install_weak_deps=False ${{ env.DNF_PACKAGES }}
          # CI makes setup.py take upstream's release-version and shared-library path.
          CIBW_ENVIRONMENT: >-
            CI=1
            VCPKG_FORCE_SYSTEM_BINARIES=1
            VCPKG_BINARY_SOURCES='${{ env.VCPKG_BINARY_SOURCES }}'
            CMAKE_ARGS='${{ env.CMAKE_ARGS }}'
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,opencv-python-headless
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --plat manylinux_2_39_riscv64 --strip -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest numpy opencv-python-headless jinja2 websockets
          CIBW_TEST_SOURCES: bindings/python/tests
          # upstream's pytest target minus xlink_exceptions_test (imports a module built only in the
          # CMake tree) and dynamic_calibration_test (needs the library disabled above)
          CIBW_TEST_COMMAND: >-
            cd bindings/python/tests &&
            python -m pytest --noconftest -p no:cacheprovider
            test.py
            xlink_protocol_test.py
            utf8_support_test.py
            nndata_tensor_test.py
            pcldata_set_points_test.py
            remote_connection_service_test.py
            messsage_queue_test.py
            imgframe_test.py
            inherited_messages_test.py
            auto_calibration_config_test.py
            host_node_create_deprecation_test.py
            beta_img_detections_filter_test.py
            beta_parser_config_test.py
            beta_stitching_test.py

      - name: Verify wheel license files
        run: python3 scripts/verify_license_artifact.py wheel wheelhouse/*.whl

      - name: Verify the wheel ships the compiled extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = sorted(n for n in names if ".so" in n)
          print("\n".join(sos))
          assert any(n.startswith("depthai.cpython-") and n.endswith("-riscv64-linux-gnu.so") for n in sos), sos
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: depthai-${{ env.DEPTHAI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources for depthai ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      DEPTHAI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: depthai-${{ env.DEPTHAI_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish depthai ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: depthai-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: depthai-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
