---
# This workflow is based on: https://github.com/cds-astro/mocpy/blob/v0.20.0/.github/workflows/deploy.yml
# and https://github.com/cds-astro/mocpy/blob/v0.20.0/.github/workflows/test.yml
name: Build mocpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mocpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mocpy.yml'
      - 'docs/packages/mocpy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mocpy.yml'
      - 'docs/packages/mocpy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mocpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mocpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: mocpy
      version: ${{ matrix.version }}
      repository: cds-astro/mocpy
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # musllinux is dropped: numpy, a hard runtime dependency, has no musllinux riscv64 wheel.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # MPLBACKEND stands in for upstream's root conftest.py, which only selects Agg.
      cibw-test-environment: >-
        PIP_ONLY_BINARY=:all:
        MPLBACKEND=Agg
      cibw-test-requires: pytest pytest-mock requests regions cdshealpix matplotlib networkx
      cibw-test-sources: resources
      # test_read_fits_file finds resources/ through the source-checkout layout (__file__ parents), absent from a wheel.
      # from_vizier / from_ivorn (tests and MOC.* doctests) and test_stmoc_from_url fetch from VizieR/CDS over the
      # network, which the riscv64 runners cannot reach.
      cibw-test-command: >-
        python -m pytest -v --pyargs mocpy --doctest-modules
        -o doctest_optionflags=NORMALIZE_WHITESPACE
        -k 'not test_read_fits_file and not from_vizier and not from_ivorn and not test_stmoc_from_url'
      timeout-minutes: 90

  publish:
    name: Publish mocpy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mocpy-${{ matrix.version }}-*-manylinux_riscv64
