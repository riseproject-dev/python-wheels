---
# bitarray-hardbyte is a one-off PyPI redistribution of ilanschnell/bitarray
# under a different project name (see the docs entry / PR description); this
# workflow is based on the `build_wheels` job of
# https://github.com/ilanschnell/bitarray/blob/50b62ede70b9ef5f553e1463bb912d2bc45a174d/.github/workflows/build_wheels.yml
name: Build bitarray-hardbyte wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bitarray-hardbyte version to build (e.g. 2.3.8)'
        required: true
        default: '2.3.8'
  pull_request:
    paths:
      - '.github/workflows/build-bitarray-hardbyte.yml'
      - 'patches/bitarray-hardbyte/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.3.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 2.3.8 there.
  BITARRAY_HARDBYTE_VERSION: ${{ inputs.version || '2.3.8' }}
  # bitarray-hardbyte 2.3.8 has no matching git tag in ilanschnell/bitarray
  # (gotcha 103): this is "next release 2.3.8" (BITARRAY_VERSION bumped, never
  # tagged upstream), advanced to the last commit before "next release 2.4.0"
  # finalized. Every file is byte-identical to the PyPI sdist except setup.py's
  # `name`, which patches/bitarray-hardbyte/2.3.8 restores. Update it alongside
  # BITARRAY_HARDBYTE_VERSION.
  BITARRAY_HARDBYTE_REF: 50b62ede70b9ef5f553e1463bb912d2bc45a174d
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build bitarray-hardbyte ${{ inputs.version || '2.3.8' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout bitarray-hardbyte ${{ env.BITARRAY_HARDBYTE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ilanschnell/bitarray
          ref: ${{ env.BITARRAY_HARDBYTE_REF }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch bitarray-hardbyte source
        run: git apply python-wheels/patches/bitarray-hardbyte/${{ env.BITARRAY_HARDBYTE_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_COMMAND: python -c "import bitarray; assert bitarray.test().wasSuccessful()"

      - name: Check the C extensions and LICENSE made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for mod in ("_bitarray", "_util"):
                  assert any(mod in n and n.endswith(".so") for n in names), (whl, mod)
              assert any(n.endswith(".dist-info/licenses/LICENSE")
                         or n.endswith(".dist-info/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bitarray-hardbyte-${{ env.BITARRAY_HARDBYTE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bitarray-hardbyte ${{ inputs.version || '2.3.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: bitarray-hardbyte-${{ inputs.version || '2.3.8' }}-*-manylinux_riscv64
