---
# bitarray-hardbyte is a one-off PyPI redistribution of ilanschnell/bitarray
# under a different project name (see the docs entry / PR description); this
# workflow is based on the `build_wheels` job of
# https://github.com/ilanschnell/bitarray/blob/50b62ede70b9ef5f553e1463bb912d2bc45a174d/.github/workflows/build_wheels.yml
name: Build bitarray-hardbyte wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bitarray-hardbyte.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bitarray-hardbyte.yml'
      - 'docs/packages/bitarray-hardbyte.yaml'
      - 'patches/bitarray-hardbyte/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bitarray-hardbyte.yml'
      - 'docs/packages/bitarray-hardbyte.yaml'
      - 'patches/bitarray-hardbyte/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # bitarray-hardbyte 2.3.8 has no matching git tag in ilanschnell/bitarray
  # (gotcha 103): this is "next release 2.3.8" (BITARRAY_VERSION bumped, never
  # tagged upstream), advanced to the last commit before "next release 2.4.0"
  # finalized. Every file is byte-identical to the PyPI sdist except setup.py's
  # `name`, which patches/bitarray-hardbyte/2.3.8 restores. Update it alongside
  # BITARRAY_HARDBYTE_VERSION.
  BITARRAY_HARDBYTE_REF: 50b62ede70b9ef5f553e1463bb912d2bc45a174d
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bitarray-hardbyte
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bitarray-hardbyte ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "bitarray-hardbyte"
      version: "${{ matrix.version }}"
      repository: "ilanschnell/bitarray"
      ref: "50b62ede70b9ef5f553e1463bb912d2bc45a174d"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/bitarray-hardbyte/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-command: "python -c \"import bitarray; assert bitarray.test().wasSuccessful()\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BITARRAY_HARDBYTE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bitarray-hardbyte-${{ env.BITARRAY_HARDBYTE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the C extensions and LICENSE made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              for mod in ("_bitarray", "_util"):
                  assert any(mod in n and n.endswith(".so") for n in names), (whl, mod)
              assert any(n.endswith(".dist-info/licenses/LICENSE")
                         or n.endswith(".dist-info/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish bitarray-hardbyte ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bitarray-hardbyte-${{ matrix.version }}-*-manylinux_riscv64
