---
# Based on the `build_cpython_wheels` job of
# https://github.com/jnwatson/py-lmdb/blob/py-lmdb_2.3.0/.github/workflows/python-package.yml
name: Build lmdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lmdb version to build (git tag without the py-lmdb_ prefix, e.g. 2.3.0)'
        required: true
        default: '2.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-lmdb.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LMDB_VERSION: ${{ inputs.version || '2.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build lmdb ${{ inputs.version || '2.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout py-lmdb ${{ env.LMDB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jnwatson/py-lmdb
          ref: py-lmdb_${{ env.LMDB_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi is a build requirement and has no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # lmdb/__init__.py silently falls back to the pure-Python cffi binding
          # when the compiled extension is missing.
          CIBW_TEST_ENVIRONMENT: LMDB_FORCE_CPYTHON=1
          # pyproject.toml carries the mdb_layout marker and the addopts that
          # deselect it from the default run.
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import lmdb.cpython as c; assert c.__file__.endswith('.so'), c.__file__" &&
            python -m pytest tests &&
            python -m pytest -m mdb_layout tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lmdb-${{ env.LMDB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lmdb ${{ inputs.version || '2.3.0' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: lmdb-${{ env.LMDB_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
