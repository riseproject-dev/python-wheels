---
# Based on the `build_cpython_wheels` job of
# https://github.com/jnwatson/py-lmdb/blob/py-lmdb_2.3.0/.github/workflows/python-package.yml
name: Build lmdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lmdb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lmdb.yml'
      - 'docs/packages/lmdb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lmdb.yml'
      - 'docs/packages/lmdb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lmdb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lmdb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: lmdb
      version: ${{ matrix.version }}
      repository: jnwatson/py-lmdb
      ref: py-lmdb_${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # cffi is a build requirement and has no riscv64 wheel on public PyPI.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # lmdb/__init__.py silently falls back to the pure-Python cffi binding
      # when the compiled extension is missing.
      cibw-test-environment: LMDB_FORCE_CPYTHON=1
      # pyproject.toml carries the mdb_layout marker and the addopts that
      # deselect it from the default run, from tests/mdb_layout_test.py
      # onward (2.1.1 predates both and runs everything in one pass).
      cibw-test-sources: tests pyproject.toml
      cibw-test-requires: pytest
      cibw-test-command: >-
        python -c "import lmdb.cpython as c; assert c.__file__.endswith('.so'), c.__file__" &&
        python -m pytest tests &&
        (test ! -f tests/mdb_layout_test.py || python -m pytest -m mdb_layout tests)
      timeout-minutes: 90

  publish:
    name: Publish lmdb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lmdb-${{ matrix.version }}-*-manylinux_riscv64
