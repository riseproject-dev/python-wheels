---
# This workflow is based on the `build_wheels` job of
# https://github.com/scrapinghub/python-crfsuite/blob/0.9.12/.github/workflows/build_and_upload.yml
name: Build python-crfsuite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'python-crfsuite version to build (git tag, e.g. 0.9.12)'
        required: true
        default: '0.9.12'
  pull_request:
    paths:
      - '.github/workflows/build-python-crfsuite.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.9.12' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYTHON_CRFSUITE_VERSION: ${{ inputs.version || '0.9.12' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build python-crfsuite ${{ inputs.version || '0.9.12' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout python-crfsuite ${{ env.PYTHON_CRFSUITE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scrapinghub/python-crfsuite
          ref: ${{ env.PYTHON_CRFSUITE_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/tests --doctest-modules

      - name: Check the C extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pycrfsuite/_pycrfsuite") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-crfsuite-${{ env.PYTHON_CRFSUITE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-crfsuite ${{ inputs.version || '0.9.12' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: python-crfsuite-${{ inputs.version || '0.9.12' }}-*-manylinux_riscv64
