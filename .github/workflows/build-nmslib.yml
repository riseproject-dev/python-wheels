---
# This workflow is based on: https://github.com/nmslib/nmslib/blob/master/.github/workflows/build_only.yml (linux job)
name: Build nmslib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nmslib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nmslib.yml'
      - 'docs/packages/nmslib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nmslib.yml'
      - 'docs/packages/nmslib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # nmslib has no v2.1.2 tag (CLAUDE.md gotcha 103): __version__ was bumped to
  # 2.1.2 in this commit in 2022 and the PyPI sdist uploaded in 2025 doesn't
  # byte-match any commit's setup.py (its macOS arch-detection code is an
  # older, simpler shape than what git has carried since this commit) - but
  # that divergence is confined to the darwin-only branch of setup.py's
  # BuildExt, so it has no effect on this Linux build. This is also current
  # master: everything after it is one unrelated test-tolerance tweak.
  NMSLIB_REF: 799c8c0b5fd36fa40542ab0972038f19b2488641

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nmslib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nmslib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nmslib"
      version: "${{ matrix.version }}"
      repository: "nmslib/nmslib"
      ref: "799c8c0b5fd36fa40542ab0972038f19b2488641"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-package-dir: "python_bindings"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # setup.py appends -march=native unless CFLAGS already names an
      # arch flag (the same override upstream's own build_linux_wheels/
      # deploy.sh passes per target arch: -march=armv8-a for aarch64,
      # -msse2 for x86_64) - rv64gc is this repo's portable riscv64
      # baseline. numpy and scipy have no riscv64 wheels on public PyPI.
      cibw-environment-linux: "CFLAGS=-march=rv64gc PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-requires: "pytest psutil"
      cibw-test-sources: "python_bindings/tests"
      cibw-test-command: "python -m pytest -q -ra python_bindings/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      NMSLIB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nmslib-${{ env.NMSLIB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel is a compiled extension module
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("nmslib") and n.endswith(".so") for n in names), (whl, names)
              print(whl, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for nmslib ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: nmslib
      version: ${{ matrix.version }}
      # setup.py's BuildExt always adds -fopenmp/-pthread on non-darwin unix,
      # so auditwheel vendors the image's libgomp into the wheel.
      packages: gcc

  publish:
    name: Publish nmslib ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nmslib-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: nmslib-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
