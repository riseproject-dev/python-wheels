---
# This workflow is based on the `build_wheels` job of
# https://github.com/materialsproject/pymatgen-core/blob/v2026.8.13/.github/workflows/release.yml
name: Build pymatgen-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymatgen-core.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymatgen-core.yml'
      - 'docs/packages/pymatgen-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymatgen-core.yml'
      - 'docs/packages/pymatgen-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymatgen-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymatgen-core ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymatgen-core"
      version: "${{ matrix.version }}"
      repository: "materialsproject/pymatgen-core"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        git sparse-checkout init --no-cone
        printf '%s\n' '/*' '!/test-files' | git sparse-checkout set --stdin
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # cython and numpy have riscv64 wheels only on our registry; the pretend
      # version stands in for setuptools-scm, which gets no git in the container.
      cibw-environment-linux: "PIP_ONLY_BINARY=cython,numpy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYMATGEN_CORE=${{ matrix.version }}"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      # Everything left out reads the test-files tree dropped from the checkout.
      cibw-test-command: "pytest tests/optimization tests/util tests/core/test_lattice.py tests/core/test_sites.py tests/core/test_composition.py tests/core/test_periodic_table.py tests/core/test_operations.py --ignore=tests/util/test_io.py --ignore=tests/util/test_testing.py"
      # These have riscv64 wheels only on our registry; only-binary keeps a newer
      # PyPI release from winning the resolution and then compiling from sdist.
      # Named individually rather than :all:, which holds bibtexparser at 1.3.0
      # (1.4 onwards ships no wheel) and that release fails pymatgen's own BibTeX
      # validation on every architecture.
      cibw-test-environment: "MPLBACKEND=Agg PIP_ONLY_BINARY=charset-normalizer,contourpy,fonttools,kiwisolver,lxml,matplotlib,numpy,orjson,pandas,pillow,scipy,spglib"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYMATGEN_CORE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pymatgen-core-${{ env.PYMATGEN_CORE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {"coord_cython", "fast_parser", "neighbors"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish pymatgen-core ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymatgen-core-${{ matrix.version }}-*-manylinux_riscv64
