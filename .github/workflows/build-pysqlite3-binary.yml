---
# pysqlite3-binary is a separate PyPI distribution coleifer publishes from
# coleifer/pysqlite3: a self-contained, statically-linked build of pysqlite3.
# There is no dedicated upstream CI for it (build-scripts/_build_wheels.sh was
# removed from the repo after 0.6.0); this mirrors that script's approach
# (fetch the sqlite amalgamation, build via cibuildwheel) narrowed to riscv64.
name: Build pysqlite3-binary wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pysqlite3-binary version to build, e.g. 0.5.4.post2'
        required: true
        default: '0.5.4.post2'
  pull_request:
    paths:
      - '.github/workflows/build-pysqlite3-binary.yml'
      - 'patches/pysqlite3-binary/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.5.4.post2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYSQLITE3_BINARY_VERSION: ${{ inputs.version || '0.5.4.post2' }}
  # pysqlite3-binary 0.5.4.post2 has no matching git tag: it is the 0.5.4 tag's
  # source rebuilt under a different distribution name (see patches/).
  PYSQLITE3_BINARY_REF: '0.5.4'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pysqlite3-binary ${{ inputs.version || '0.5.4.post2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pysqlite3 ${{ env.PYSQLITE3_BINARY_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: coleifer/pysqlite3
          ref: ${{ env.PYSQLITE3_BINARY_REF }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pysqlite3 source
        run: git apply python-wheels/patches/pysqlite3-binary/${{ env.PYSQLITE3_BINARY_VERSION }}/*.patch

      # Same amalgamation fetch as coleifer/pysqlite3's build-scripts/fetch_source.py
      # (added upstream after this ref; inlined here since this checkout predates it).
      - name: Download sqlite amalgamation source
        run: |
          python3 - <<'EOF'
          from urllib.request import urlopen
          import re, shutil, tempfile, zipfile

          with urlopen('https://sqlite.org/download.html') as fh:
              html = fh.read().decode('utf8')
          link, _ = re.search(r'(\d{4}/sqlite-amalgamation-(\d+)\.zip)', html).groups()
          url = 'https://sqlite.org/%s' % link
          with tempfile.NamedTemporaryFile(suffix='.zip') as tmp:
              with urlopen(url) as fh:
                  shutil.copyfileobj(fh, tmp)
              tmp.seek(0)
              with zipfile.ZipFile(tmp) as zf:
                  for path in zf.namelist():
                      filename = path.split('/')[-1]
                      if filename in ('sqlite3.c', 'sqlite3.h'):
                          with zf.open(path) as src, open(filename, 'wb') as dest:
                              shutil.copyfileobj(src, dest)
          EOF

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysqlite3-binary-${{ env.PYSQLITE3_BINARY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pysqlite3-binary ${{ inputs.version || '0.5.4.post2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pysqlite3-binary-${{ inputs.version || '0.5.4.post2' }}-*-manylinux_riscv64
