---
# pysqlite3-binary is a separate PyPI distribution coleifer publishes from
# coleifer/pysqlite3: a self-contained, statically-linked build of pysqlite3.
# There is no dedicated upstream CI for it (build-scripts/_build_wheels.sh was
# removed from the repo after 0.6.0); this mirrors that script's approach
# (fetch the sqlite amalgamation, build via cibuildwheel) narrowed to riscv64.
name: Build pysqlite3-binary wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pysqlite3-binary.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pysqlite3-binary.yml'
      - 'docs/packages/pysqlite3-binary.yaml'
      - 'patches/pysqlite3-binary/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pysqlite3-binary.yml'
      - 'docs/packages/pysqlite3-binary.yaml'
      - 'patches/pysqlite3-binary/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # pysqlite3-binary 0.5.4.post2 has no matching git tag: it is the 0.5.4 tag's
  # source rebuilt under a different distribution name (see patches/).
  PYSQLITE3_BINARY_REF: '0.5.4'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pysqlite3-binary
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pysqlite3-binary ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pysqlite3-binary"
      version: "${{ matrix.version }}"
      repository: "coleifer/pysqlite3"
      ref: "0.5.4"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 30

      patches: true
      pre-build: |-
        # Same amalgamation fetch as coleifer/pysqlite3's build-scripts/fetch_source.py
        # (added upstream after this ref; inlined here since this checkout predates it).
        python3 - <<'EOF'
        from urllib.request import urlopen
        import re, shutil, tempfile, zipfile

        with urlopen('https://sqlite.org/download.html') as fh:
            html = fh.read().decode('utf8')
        link, _ = re.search(r'(\d{4}/sqlite-amalgamation-(\d+)\.zip)', html).groups()
        url = 'https://sqlite.org/%s' % link
        with tempfile.NamedTemporaryFile(suffix='.zip') as tmp:
            with urlopen(url) as fh:
                shutil.copyfileobj(fh, tmp)
            tmp.seek(0)
            with zipfile.ZipFile(tmp) as zf:
                for path in zf.namelist():
                    filename = path.split('/')[-1]
                    if filename in ('sqlite3.c', 'sqlite3.h'):
                        with zf.open(path) as src, open(filename, 'wb') as dest:
                            shutil.copyfileobj(src, dest)
        EOF

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m tests"

  publish:
    name: Publish pysqlite3-binary ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pysqlite3-binary-${{ matrix.version }}-*-manylinux_riscv64
