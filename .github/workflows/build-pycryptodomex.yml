---
# Based on upstream's wheel builder:
#   https://github.com/Legrandin/pycryptodome/blob/v3.23.0x/.github/workflows/wheels.yml
name: Build pycryptodomex wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycryptodomex.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycryptodomex.yml'
      - 'docs/packages/pycryptodomex.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycryptodomex.yml'
      - 'docs/packages/pycryptodomex.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # The Cryptodome namespace is built from the same tree, tagged with a trailing "x"
  # (that tag adds the .separate_namespace marker setup.py keys off).
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's requirements-test.txt; without it SelfTest skips its Wycheproof vectors.
  TEST_REQUIRES: pycryptodome-test-vectors==1.0.22
  TEST_COMMAND: python -m Cryptodome.SelfTest --skip-slow-tests

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycryptodomex
      version: ${{ inputs.version }}

  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pycryptodomex ${{ matrix.version }} cp37-abi3-manylinux_riscv64
    # Free-threaded builds get no abi3 wheel (setup.py skips py_limited_api under
    # Py_GIL_DISABLED); cp314t is the only free-threaded interpreter in the image.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycryptodomex"
      version: "${{ matrix.version }}"
      repository: "Legrandin/pycryptodome"
      ref: "v${{ matrix.version }}x"
      artifact-tag: "cp37-abi3-manylinux_riscv64"
      timeout-minutes: 180
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-test-requires: "pycryptodome-test-vectors==1.0.22"
      cibw-test-command: "python -m Cryptodome.SelfTest --skip-slow-tests"

  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pycryptodomex ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pycryptodomex"
      version: "${{ matrix.version }}"
      repository: "Legrandin/pycryptodome"
      ref: "v${{ matrix.version }}x"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 180
      cibw-build: "cp314t-manylinux_riscv64"
      cibw-test-requires: "pycryptodome-test-vectors==1.0.22"
      cibw-test-command: "python -m Cryptodome.SelfTest --skip-slow-tests"

  publish:
    name: Publish pycryptodomex ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycryptodomex-${{ matrix.version }}-*-manylinux_riscv64
