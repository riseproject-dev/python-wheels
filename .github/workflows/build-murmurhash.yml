---
# Based on upstream's wheel builder, which calls the shared
# https://github.com/explosion/gha-cibuildwheel workflow from
# https://github.com/explosion/murmurhash/blob/release-v1.0.15/.github/workflows/cibuildwheel.yml
# The test command mirrors the `Run tests` step of upstream's tests.yml.
name: Build murmurhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'murmurhash version to build (git tag without the release-v prefix, e.g. 1.0.15)'
        required: true
        default: '1.0.15'
  # pull_request:
  #   paths:
  #    - '.github/workflows/build-murmurhash.yml'
    #   - 'patches/murmurhash/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.15' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  MURMURHASH_VERSION: ${{ inputs.version || '1.0.15' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build murmurhash ${{ inputs.version || '1.0.15' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout murmurhash release-v${{ env.MURMURHASH_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: explosion/murmurhash
          ref: release-v${{ env.MURMURHASH_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch murmurhash source
        run: |
          git apply python-wheels/patches/murmurhash/${{ env.MURMURHASH_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream leaves cibuildwheel's test-command empty and tests the wheel in a
          # separate workflow; the suite ships inside the wheel, so run it here.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest --pyargs murmurhash -Werror

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: murmurhash-${{ env.MURMURHASH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish murmurhash ${{ inputs.version || '1.0.15' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: murmurhash-${{ env.MURMURHASH_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
