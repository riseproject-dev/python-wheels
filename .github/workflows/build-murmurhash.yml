---
# Based on upstream's wheel builder, which calls the shared
# https://github.com/explosion/gha-cibuildwheel workflow from
# https://github.com/explosion/murmurhash/blob/release-v1.0.15/.github/workflows/cibuildwheel.yml
# The test command mirrors the `Run tests` step of upstream's tests.yml.
name: Build murmurhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'murmurhash version to build (git tag without the release-v prefix, e.g. 1.0.15)'
        required: true
        default: '1.0.15'
  pull_request:
    paths:
      - '.github/workflows/build-murmurhash.yml'
      - 'patches/murmurhash/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.15' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MURMURHASH_VERSION: ${{ inputs.version || '1.0.15' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build murmurhash ${{ inputs.version || '1.0.15' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout murmurhash release-v${{ env.MURMURHASH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: explosion/murmurhash
          ref: release-v${{ env.MURMURHASH_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch murmurhash source
        run: |
          git apply python-wheels/patches/murmurhash/${{ env.MURMURHASH_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream leaves cibuildwheel's test-command empty and tests the wheel in a
          # separate workflow; the suite ships inside the wheel, so run it here.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest --pyargs murmurhash -Werror

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: murmurhash-${{ env.MURMURHASH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish murmurhash ${{ inputs.version || '1.0.15' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: murmurhash-${{ inputs.version || '1.0.15' }}-*-manylinux_riscv64
