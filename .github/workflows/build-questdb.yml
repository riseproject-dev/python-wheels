---
# This workflow is based on the `linux_*_manylinux_*` jobs of
# https://github.com/questdb/py-questdb-client/blob/v5.0.0/ci/cibuildwheel.yaml
name: Build questdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/questdb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-questdb.yml'
      - 'docs/packages/questdb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-questdb.yml'
      - 'docs/packages/questdb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: questdb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build questdb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "questdb"
      version: "${{ matrix.version }}"
      repository: "questdb/py-questdb-client"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" sparse-checkout init --cone
        git -C "python-wheels" sparse-checkout set "patches/questdb"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply -v python-wheels/patches/questdb/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Replaces upstream's [tool.cibuildwheel.linux.environment], so its two keys are repeated.
      cibw-environment-linux: "SETUP_DO_GIT_SUBMODULE_INIT=1 CARGO_TARGET_DIR=/tmp/qdb-cargo-target PIP_ONLY_BINARY=numpy"
      # The registry has no cp314t pandas, which ci/pip_install_deps.py asserts. test.py
      # self-skips without pandas and pyarrow, but not with pyarrow alone.
      cibw-before-test: "${{ matrix.python == 'cp314t' && 'python -m pip install --only-binary :all: psutil' || 'python {project}/ci/pip_install_deps.py' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      QUESTDB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: questdb-${{ env.QUESTDB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert exts == {"_client"}, (whl, exts)
              assert any(n.endswith("dist-info/licenses/LICENSE.txt") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish questdb ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: questdb-${{ matrix.version }}-*-manylinux_riscv64
