---
# Based on the `build-wheels` job of
# https://github.com/geventhttpclient/geventhttpclient/blob/2.3.9/.github/workflows/publish.yml
# and the tox `testenv` upstream runs in .github/workflows/test.yml.
name: Build geventhttpclient wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/geventhttpclient.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-geventhttpclient.yml'
      - 'docs/packages/geventhttpclient.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-geventhttpclient.yml'
      - 'docs/packages/geventhttpclient.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: geventhttpclient
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build geventhttpclient ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # gevent, a hard runtime dependency, publishes no free-threaded wheel on
          # any platform, so the cp314t wheel cannot be installed to be tested.
          - python: "cp314t"
            test_skip: "*"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "geventhttpclient"
      version: "${{ matrix.version }}"
      repository: "geventhttpclient/geventhttpclient"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      checkout-submodules: "recursive"
      pre-build: |-
        export GEVENTHTTPCLIENT_VERSION='${{ matrix.version }}'
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        patches="$PWD/python-wheels/patches/geventhttpclient/${GEVENTHTTPCLIENT_VERSION}"
        if [ -d "$patches" ]; then
          git apply -v "$patches"/*.patch
        fi

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # gevent and brotli have no riscv64 wheel on public PyPI.
      cibw-test-skip: "${{ matrix.test_skip }}"
      # pyproject.toml registers the `network` marker.
      cibw-test-sources: "tests pyproject.toml"
      # Up to 2.5.1 the test tools are the `dev` extra; from 2.6.0 they are the `dev`
      # dependency group (PEP 735) and the extra is gone (pip only warns about it).
      cibw-test-extras: "dev"
      cibw-test-groups: "dev"
      cibw-test-command: "python -c \"import importlib.metadata as m; l = {str(p).split('.dist-info/licenses/')[1] for p in m.files('geventhttpclient') if '.dist-info/licenses/' in str(p)}; assert l in ({'LICENSE-MIT', 'llhttp/LICENSE-MIT'}, {'LICENSE-MIT', 'llhttp/LICENSE'}), l\" && python -m pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # gevent, a hard runtime dependency, publishes no free-threaded wheel on
          # any platform, so the cp314t wheel cannot be installed to be tested.
          - python: "cp314t"
            test_skip: "*"
    env:
      GEVENTHTTPCLIENT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: geventhttpclient-${{ env.GEVENTHTTPCLIENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel ships the parser extension
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert len(sos) == 1 and sos[0].startswith("geventhttpclient/_parser."), sos
          EOF

  publish:
    name: Publish geventhttpclient ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: geventhttpclient-${{ matrix.version }}-*-manylinux_riscv64
