---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/microsoft/rego-cpp/blob/v1.5.2/.github/workflows/build_wheels.yml
#   https://github.com/microsoft/rego-cpp/blob/v1.5.2/.github/workflows/pr_gate.yml
name: Build regopy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/regopy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-regopy.yml'
      - 'docs/packages/regopy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-regopy.yml'
      - 'docs/packages/regopy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: regopy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build regopy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "regopy"
      version: "${{ matrix.version }}"
      repository: "microsoft/rego-cpp"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      cibw-package-dir: "wrappers/python"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # Upstream's wheels ship no licence: stage rego-cpp's own and the vendored OpenSSL's beside setup.py.
      cibw-before-all: "${{ case(matrix.platform == 'manylinux', 'dnf makecache && dnf install -y openssl-devel', matrix.platform == 'musllinux', 'apk add openssl-dev', '') }} && cp {project}/LICENSE {package}/LICENSE && curl -fsSL --retry 5 -o {package}/LICENSE.openssl https://raw.githubusercontent.com/openssl/openssl/openssl-$(pkg-config --modversion openssl)/LICENSE.txt"
      # librego_shared.so aborts in a static initialiser on dlopen with snmalloc on riscv64;
      # upstream already builds without it on macOS.
      cibw-environment-linux: "REGOCPP_REPO=LOCAL CMAKE_ARGS=-DREGOCPP_USE_SNMALLOC=OFF"
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest -vv -ra --doctest-modules --pyargs regopy {package}/test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      REGOPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: regopy-${{ env.REGOPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the library and both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "regopy/librego_shared.so" in names, whl
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.openssl"}, (whl, licences)
              print(whl, "ok")
          EOF

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # auditwheel vendors the GCC runtime (libstdc++, libgcc_s) into the musllinux wheels.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: regopy-${{ matrix.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish regopy ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: regopy-${{ matrix.version }}-*riscv64
      gpl-sources-artifact: regopy-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
