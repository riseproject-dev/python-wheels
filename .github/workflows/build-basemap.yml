---
# This workflow is based on the `build_wheels` job of
# https://github.com/matplotlib/basemap/blob/v2.0.0/.github/workflows/build.yml
name: Build basemap wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/basemap.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-basemap.yml'
      - 'docs/packages/basemap.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-basemap.yml'
      - 'docs/packages/basemap.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  GEOS_VERSION: '3.6.5'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: basemap
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build basemap ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "basemap"
      version: "${{ matrix.version }}"
      repository: "matplotlib/basemap"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all: "python {project}/.github/workflows/run_before_all.py"
      # build-backend is setuptools.build_meta (pyproject.toml); with
      # --no-build-isolation pip never creates an isolated env to pull it, so it
      # must be preinstalled here, same as cython/numpy (CLAUDE.md gotcha 23's
      # preinstall shape) -- otherwise: BackendUnavailable: Cannot import
      # 'setuptools.build_meta'.
      cibw-before-build: "pip install cython setuptools wheel \"numpy>=2.0,<2.4\""
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # GEOS 3.6.5's cmake_minimum_required is below the image's CMake 4 floor, and
      # run_before_all.py's cmake call takes no extra flags (gotcha 257).
      cibw-environment-linux: "CMAKE_POLICY_VERSION_MINIMUM=3.5 GEOS_VERSION=3.6.5 GEOS_DIR=/project/extern GEOS_NJOBS=4 LD_LIBRARY_PATH=/project/extern/lib PIP_PREFER_BINARY=1 PYTHONUNBUFFERED=1"
      cibw-test-extras: "test"
      # basemap_data_hires (~90MB) is only needed for the "h"/"f" resolutions, which
      # no test in test/ exercises; skip it to save download time on every job.
      cibw-before-test: "pip install basemap_data"
      cibw-test-environment: "PIP_ONLY_BINARY=matplotlib,pyproj"
      cibw-test-command: "python -m pytest {project}/test"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BASEMAP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: basemap-${{ env.BASEMAP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the GEOS licence and the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("licenses/LICENSE.geos") for n in names), whl
              assert any(n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish basemap ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: basemap-${{ matrix.version }}-*-manylinux_riscv64
