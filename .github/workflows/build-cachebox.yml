---
# This workflow is based on: https://github.com/awolverp/cachebox/blob/v6.2.5/.github/workflows/CI.yml
# and https://github.com/awolverp/cachebox/blob/v6.2.5/.github/workflows/python-test.yml
name: Build cachebox wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cachebox version to build (git tag without the leading v, e.g. 6.2.5)'
        required: true
        default: '6.2.5'
  pull_request:
    paths:
      - '.github/workflows/build-cachebox.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '6.2.5' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 6.2.5 there.
  CACHEBOX_VERSION: ${{ inputs.version || '6.2.5' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cachebox ${{ inputs.version || '6.2.5' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # PyO3 extension built per-interpreter (upstream ships cp3x-cp3x wheels,
        # no abi3).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout cachebox ${{ env.CACHEBOX_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: awolverp/cachebox
          ref: v${{ env.CACHEBOX_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cachebox ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Unpinned unlike upstream's `test` dependency-group: its
          # hypothesis == 6.165.0 predates the riscv64 wheels we publish.
          CIBW_TEST_REQUIRES: pytest hypothesis pytest-asyncio pytest-xdist
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v -n auto tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cachebox-${{ env.CACHEBOX_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cachebox ${{ inputs.version || '6.2.5' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: cachebox-${{ env.CACHEBOX_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
