---
# This workflow is based on
# https://github.com/bigcat88/pillow_heif/blob/v1.4.0/.github/workflows/wheels-pi_heif.yml
# (the `wheels_linux_amd64`/`wheels_linux_arm64` jobs). `pi-heif` is `pillow-heif` built from
# the same pillow_heif sources with PH_LIGHT_ACTION=1, which skips bundling libx265 (see
# libheif/build_libs.py) -- the Raspberry-Pi-oriented variant upstream ships for platforms
# where GPL-licensed x265 is undesirable.
name: Build pi-heif wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pi-heif.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pi-heif.yml'
      - 'docs/packages/pi-heif.yaml'
      - 'patches/pi-heif/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pi-heif.yml'
      - 'docs/packages/pi-heif.yaml'
      - 'patches/pi-heif/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pi-heif
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pi-heif ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pi_heif"
      version: "${{ matrix.version }}"
      repository: "bigcat88/pillow_heif"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pi-heif/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp -r -v ./pi-heif/* .
        python3 .github/transform_to-pi_heif.py

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream installs `cmake==3.31.6` from PyPI, which ships no riscv64 wheel; the
      # image already provides cmake 4.4.2.
      cibw-before-all-linux: |-
        set -e
        yum makecache && yum install -y libjpeg-turbo-devel lcms2-devel zlib-devel
        export BUILD_DIR=/tmp/ph_build_stuff
        python3 {package}/libheif/build_libs.py
      # PH_LIGHT_ACTION=1 (upstream's own wheels-pi_heif.yml flag) makes build_libs.py
      # skip x265 (see libheif/build_libs.py) and is also read at test time by
      # tests/basic_test.py::test_light_build. Pillow ships no riscv64 wheel on public
      # PyPI; ours is what the test env installs.
      cibw-environment-linux: "PH_LIGHT_ACTION=1"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PI_HEIF_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pi_heif-${{ env.PI_HEIF_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_pi_heif.") and n.endswith(".so") for n in names), whl
              libs = sorted(n.split("/")[1].split("-")[0] for n in names if n.startswith("pi_heif.libs/") and n != "pi_heif.libs/")
              assert libs == ["libde265", "libheif"], (whl, libs)
              licenses = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
              assert licenses == {"LICENSE.txt", "LICENSES_bundled.txt"}, (whl, licenses)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pi-heif ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pi_heif-${{ matrix.version }}-*-manylinux_riscv64
