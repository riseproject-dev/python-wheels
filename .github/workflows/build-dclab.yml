---
# This workflow is based on
# https://github.com/DC-Analysis/dclab/blob/0.73.1/.github/workflows/deploy_pypi.yml
# (wheels) and check.yml (the minimal-dependency "none" test leg).
name: Build dclab wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dclab.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dclab.yml'
      - 'docs/packages/dclab.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dclab.yml'
      - 'docs/packages/dclab.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dclab
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dclab ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      DCLAB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout dclab ${{ env.DCLAB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: DC-Analysis/dclab
          ref: ${{ env.DCLAB_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DCLAB=${{ env.DCLAB_VERSION }}
          # dclab pins hdf5plugin<5, but our registry only carries hdf5plugin 7.x (its
          # Zstd filter API, the only one dclab uses, is unchanged); install the wheel
          # bare and stage the runtime deps from the registry instead (gotcha 122).
          CIBW_TEST_ENVIRONMENT: PIP_NO_DEPS=1
          CIBW_BEFORE_TEST: >-
            PIP_NO_DEPS=0 PIP_ONLY_BINARY=numpy,scipy,h5py,hdf5plugin
            pip install numpy "scipy>=1.10.0,!=1.18.0" "h5py>=3.0.0,<4" hdf5plugin pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: pytest tests

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = {n.split(".cpython-", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {
              "dclab/downsampling",
              "dclab/external/skimage/_find_contours_cy",
              "dclab/external/skimage/_pnpoly",
              "dclab/external/skimage/_shared/geometry",
          }, exts
          licences = {n for n in names if "LICENSE" in n and not n.endswith("/")}
          assert licences == {
              f"dclab-${{ env.DCLAB_VERSION }}.dist-info/licenses/LICENSE",
              "dclab/external/packaging/LICENSE",
              "dclab/external/packaging/LICENSE.APACHE",
              "dclab/external/packaging/LICENSE.BSD",
              "dclab/external/skimage/LICENSE",
              "dclab/external/statsmodels/LICENSE",
          }, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dclab-${{ env.DCLAB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish dclab ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: dclab-${{ matrix.version }}-*-manylinux_riscv64
