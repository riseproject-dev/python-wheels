---
# This workflow is based on
# https://github.com/DC-Analysis/dclab/blob/0.73.1/.github/workflows/deploy_pypi.yml
# (wheels) and check.yml (the minimal-dependency "none" test leg).
name: Build dclab wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dclab.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dclab.yml'
      - 'docs/packages/dclab.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dclab.yml'
      - 'docs/packages/dclab.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dclab
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dclab ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dclab"
      version: "${{ matrix.version }}"
      repository: "DC-Analysis/dclab"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DCLAB=${{ matrix.version }}"
      # dclab pins hdf5plugin<5, but our registry only carries hdf5plugin 7.x (its
      # Zstd filter API, the only one dclab uses, is unchanged); install the wheel
      # bare and stage the runtime deps from the registry instead (gotcha 122).
      cibw-test-environment: "PIP_NO_DEPS=1"
      cibw-before-test: "PIP_NO_DEPS=0 PIP_ONLY_BINARY=numpy,scipy,h5py,hdf5plugin pip install numpy \"scipy>=1.10.0,!=1.18.0\" \"h5py>=3.0.0,<4\" hdf5plugin pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DCLAB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dclab-${{ env.DCLAB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = {n.split(".cpython-", 1)[0] for n in names if n.endswith(".so")}
          assert exts == {
              "dclab/downsampling",
              "dclab/external/skimage/_find_contours_cy",
              "dclab/external/skimage/_pnpoly",
              "dclab/external/skimage/_shared/geometry",
          }, exts
          licences = {n for n in names if "LICENSE" in n and not n.endswith("/")}
          assert licences == {
              f"dclab-${{ env.DCLAB_VERSION }}.dist-info/licenses/LICENSE",
              "dclab/external/packaging/LICENSE",
              "dclab/external/packaging/LICENSE.APACHE",
              "dclab/external/packaging/LICENSE.BSD",
              "dclab/external/skimage/LICENSE",
              "dclab/external/statsmodels/LICENSE",
          }, licences
          EOF

  publish:
    name: Publish dclab ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dclab-${{ matrix.version }}-*-manylinux_riscv64
