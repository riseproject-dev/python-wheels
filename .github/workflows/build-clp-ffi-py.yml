---
# Based on upstream's own wheel builder:
#   https://github.com/y-scope/clp-ffi-py/blob/v0.0.14/.github/workflows/build_wheels.yml
name: Build clp-ffi-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/clp-ffi-py.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-clp-ffi-py.yml'
      - 'docs/packages/clp-ffi-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clp-ffi-py.yml'
      - 'docs/packages/clp-ffi-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: clp-ffi-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build clp-ffi-py ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CLP_FFI_PY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout clp-ffi-py v${{ env.CLP_FFI_PY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: y-scope/clp-ffi-py
          ref: v${{ env.CLP_FFI_PY_VERSION }}
          submodules: recursive
          persist-credentials: false

      # CLP core (src/clp, Apache-2.0), GSL (src/GSL, MIT) and msgpack-c
      # (src/msgpack, BSL-1.0) are compiled/pulled in as submodules but the
      # real PyPI wheel ships only clp-ffi-py's own LICENSE; stage their
      # notices too for scikit-build-core's default license-files glob.
      - name: Stage the vendored dependencies' licences
        run: |
          cp src/clp/LICENSE LICENSE.clp-core
          cp src/GSL/LICENSE LICENSE.GSL
          cp src/msgpack/LICENSE_1_0.txt LICENSE.msgpack
          test -s LICENSE.clp-core
          test -s LICENSE.GSL
          test -s LICENSE.msgpack

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: smart_open==6.4.0
          CIBW_TEST_COMMAND: >-
            python -m unittest discover --failfast --verbose --start-directory={package}/tests

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith("clp_ffi_py/ir/native") and n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE", "LICENSE.clp-core", "LICENSE.GSL", "LICENSE.msgpack"}, (path, licences)
              print(path, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clp-ffi-py-${{ env.CLP_FFI_PY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish clp-ffi-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: clp-ffi-py-${{ matrix.version }}-*-manylinux_riscv64
