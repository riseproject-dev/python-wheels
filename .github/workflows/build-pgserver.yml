---
# This workflow is based on the `build_wheels` job of
# https://github.com/orm011/pgserver/blob/v0.1.4/.github/workflows/build-and-test.yml
name: Build pgserver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pgserver.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pgserver.yml'
      - 'docs/packages/pgserver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pgserver.yml'
      - 'docs/packages/pgserver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pgserver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pgserver ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # The test extra's psycopg2-binary publishes no free-threaded wheel for any platform (gotcha 149).
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pgserver"
      version: "${{ matrix.version }}"
      repository: "orm011/pgserver"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pgserver/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # initdb/postgres are non-PIE; keep their base above vm.mmap_min_addr once auditwheel's patchelf prepends a segment (gotcha 595).
      cibw-environment-linux: "LDFLAGS=\"-Wl,-Ttext-segment=0x200000\""
      cibw-test-skip: "${{ case(endsWith(matrix.python, 't'), '*', '') }}"
      # sqlalchemy-utils 0.42.1 (latest) still imports the removed
      # sqlalchemy.orm.attributes.ScalarAttributeImpl, so pgserver's unpinned
      # `sqlalchemy>=2` test extra resolves to a broken combo now that sqlalchemy 2.1
      # is out; cap it to the last 2.0.x release so the test extra and this pin resolve
      # together (gotcha 55/215 pattern for a test-only dependency drift).
      cibw-test-requires: "sqlalchemy<2.1"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The test extra's psycopg2-binary publishes no free-threaded wheel for any platform (gotcha 149).
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PGSERVER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pgserver-${{ env.PGSERVER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Verify the wheel ships the compiled postgres server, pgvector and their licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.endswith("pgserver/pginstall/bin/postgres") for n in names), names
          assert any(n.endswith("pgserver/pginstall/lib/postgresql/vector.so") for n in names), names

          lic = {n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert {"LICENSE", "LICENSE.postgresql", "LICENSE.pgvector"} <= lic, lic
          EOF
          mkdir wheel-check
          python3 -m zipfile -e wheelhouse/*.whl wheel-check
          for exe in initdb postgres pg_ctl; do
            chmod +x "wheel-check/pgserver/pginstall/bin/$exe"
            "wheel-check/pgserver/pginstall/bin/$exe" --version
          done

  publish:
    name: Publish pgserver ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pgserver-${{ matrix.version }}-*-manylinux_riscv64
