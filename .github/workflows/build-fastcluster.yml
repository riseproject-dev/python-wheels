---
# This workflow is based on: https://github.com/dmuellner/fastcluster/blob/v1.3.0/.github/workflows/pythonpackage.yml
name: Build fastcluster wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fastcluster version to build (git tag without leading v, e.g. 1.3.0)'
        required: true
        default: '1.3.0'
  pull_request:
    paths:
      - '.github/workflows/build-fastcluster.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.3.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.3.0 there.
  FASTCLUSTER_VERSION: ${{ inputs.version || '1.3.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fastcluster ${{ inputs.version || '1.3.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the extension links the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout fastcluster v${{ env.FASTCLUSTER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dmuellner/fastcluster
          ref: v${{ env.FASTCLUSTER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is both a build and a runtime requirement, and only our registry
          # has it for riscv64; only-binary keeps a newer PyPI release from winning
          # the resolution and then compiling from sdist. scipy is test-only, same
          # registry-only situation.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          # Upstream's own test job: pytest against the bundled tests/, with scipy
          # available for the reference distance computations.
          CIBW_TEST_REQUIRES: pytest scipy>=1.15
          CIBW_TEST_COMMAND: pytest -s {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastcluster-${{ env.FASTCLUSTER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastcluster ${{ inputs.version || '1.3.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fastcluster-${{ inputs.version || '1.3.0' }}-*-manylinux_riscv64
