---
# This workflow is based on: https://github.com/dmuellner/fastcluster/blob/v1.3.0/.github/workflows/pythonpackage.yml
name: Build fastcluster wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastcluster.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastcluster.yml'
      - 'docs/packages/fastcluster.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastcluster.yml'
      - 'docs/packages/fastcluster.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastcluster
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastcluster ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fastcluster
      version: ${{ matrix.version }}
      repository: dmuellner/fastcluster
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy is both a build and a runtime requirement, and only our registry
      # has it for riscv64; only-binary keeps a newer PyPI release from winning
      # the resolution and then compiling from sdist. scipy is test-only, same
      # registry-only situation.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy"
      # Upstream's own test job: pytest against the bundled tests/, with scipy
      # available for the reference distance computations.
      cibw-test-requires: pytest scipy>=1.15
      cibw-test-command: pytest -s {package}/tests
      timeout-minutes: 60

  publish:
    name: Publish fastcluster ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastcluster-${{ matrix.version }}-*-manylinux_riscv64
