---
# This workflow is based on the `build_wheels` job of
# https://github.com/Qiskit/rustworkx/blob/0.18.1/.github/workflows/wheels.yml
name: Build rustworkx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rustworkx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rustworkx.yml'
      - 'docs/packages/rustworkx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rustworkx.yml'
      - 'docs/packages/rustworkx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rustworkx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rustworkx ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3 carries abi3-py310 unconditionally in Cargo.toml, so every
          # CPython build is abi3 already and the free-threaded build needs no
          # extra flag either (pyo3 disables abi3 under Py_GIL_DISABLED).
          - tag: cp310-abi3
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rustworkx"
      version: "${{ matrix.version }}"
      repository: "Qiskit/rustworkx"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # Replaces (not merges into) upstream's own [tool.cibuildwheel.linux]
      # environment table, so its PATH/CARGO_NET_GIT_FETCH_WITH_CLI are
      # repeated here alongside our registry.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" CARGO_NET_GIT_FETCH_WITH_CLI=\"true\""
      # Upstream's own repair-wheel-command also runs abi3audit via pipx,
      # which the riscv64 image doesn't carry; cibuildwheel's own default
      # audit-command already abi3audits every abi3-tagged wheel natively
      # after this repair step runs, so drop the pipx layer here.
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"
      # numpy has no riscv64 wheel on public PyPI; without this, before-test's
      # `pip install numpy<2.5.0` would source-build it in the container.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3 carries abi3-py310 unconditionally in Cargo.toml, so every
          # CPython build is abi3 already and the free-threaded build needs no
          # extra flag either (pyo3 disables abi3 under Py_GIL_DISABLED).
          - tag: cp310-abi3
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64
    env:
      RUSTWORKX_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rustworkx-${{ env.RUSTWORKX_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contains the compiled extension
        run: |
          set -eu
          for whl in wheelhouse/*.whl; do
            echo "$whl"
            unzip -l "$whl" | grep '\.so$'
          done

  publish:
    name: Publish rustworkx ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rustworkx-${{ matrix.version }}-*-manylinux_riscv64
