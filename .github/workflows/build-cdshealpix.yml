---
# This workflow is based on: https://github.com/cds-astro/cds-healpix-python/blob/v0.8.1/.github/workflows/deploy_pypi.yml
# and https://github.com/cds-astro/cds-healpix-python/blob/v0.8.1/.github/workflows/test.yml
name: Build cdshealpix wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cdshealpix.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cdshealpix.yml'
      - 'docs/packages/cdshealpix.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cdshealpix.yml'
      - 'docs/packages/cdshealpix.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cdshealpix
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cdshealpix ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cdshealpix
      version: ${{ matrix.version }}
      repository: cds-astro/cds-healpix-python
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # musllinux is dropped: numpy, a hard runtime dependency, has no musllinux riscv64 wheel.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: >-
        PATH="$PATH:$HOME/.cargo/bin"
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # MPLBACKEND stands in for upstream's root conftest.py, which only selects Agg.
      cibw-test-environment: >-
        PIP_ONLY_BINARY=:all:
        MPLBACKEND=Agg
      cibw-test-requires: pytest astropy_healpix matplotlib
      # Upstream's pytest addopts; pytest anchors --ignore-glob at the cwd, hence the leading /*.
      cibw-test-command: >-
        python -m pytest -v --pyargs cdshealpix --doctest-modules
        -o doctest_optionflags=NORMALIZE_WHITESPACE
        --ignore-glob='/*/test_benchmark_healpix.py'
      timeout-minutes: 90

  publish:
    name: Publish cdshealpix ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cdshealpix-${{ matrix.version }}-*-manylinux_riscv64
