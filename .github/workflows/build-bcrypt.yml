---
# Based on upstream's wheel builder:
#   https://github.com/pyca/bcrypt/blob/5.0.0/.github/workflows/wheel-builder.yml
# bcrypt is a PyO3/Rust extension built with setuptools-rust (not maturin): abi3
# is opt-in via a bdist_wheel flag, not a pyproject/Cargo feature - see build_abi3.
name: Build bcrypt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'bcrypt version to build (git tag, e.g. 5.0.0)'
        required: true
        default: '5.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-bcrypt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '5.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 5.0.0 there.
  BCRYPT_VERSION: ${{ inputs.version || '5.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # abi3 floor: cp312 is RISE's min Python, so the one wheel loads on >=3.12.
  ABI3_FLOOR: cp312

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_sdist:
    needs: [setup]
    name: Build bcrypt ${{ inputs.version || '5.0.0' }} sdist
    runs-on: ubuntu-latest
    outputs:
      sdist_name: ${{ steps.sdist.outputs.sdist_name }}
      package_version: ${{ steps.sdist.outputs.package_version }}
    steps:
      - name: Checkout bcrypt ${{ env.BCRYPT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyca/bcrypt
          ref: ${{ env.BCRYPT_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          set -euo pipefail
          rm -rf dist
          uv pip install build twine
          python -m build --sdist --outdir dist
          twine check dist/*

          sdist_name="$(ls dist)"
          {
            echo "sdist_name=${sdist_name}"
            echo "package_version=$(echo "${sdist_name}" | sed -En 's/bcrypt-(.+)\.tar\.gz/\1/p')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.sdist.outputs.sdist_name }}
          path: dist/${{ steps.sdist.outputs.sdist_name }}
          if-no-files-found: error

  # One cp312-abi3 wheel: cibuildwheel builds it once and reuses+tests it on
  # cp313/cp314 (find_compatible_wheel), so all three tags share one wheel.
  build_abi3:
    needs: [setup, build_sdist]
    name: Build bcrypt ${{ inputs.version || '5.0.0' }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build_sdist.outputs.sdist_name }}
          path: dist/

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: dist/${{ needs.build_sdist.outputs.sdist_name }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux_*'  # rustup.rs has no riscv64 musl toolchain
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # setuptools-rust emits abi3 only when bdist_wheel gets --py-limited-api
          # (cibuildwheel won't); without this it's per-interpreter wheels, not abi3.
          CIBW_CONFIG_SETTINGS: --build-option=--py-limited-api=${{ env.ABI3_FLOOR }}
          # No Rust in the manylinux image; install it and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          # Upstream's suite; {package} is the extracted sdist dir (gotcha 5).
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bcrypt-${{ env.BCRYPT_VERSION }}-cp312-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded wheel: per-interpreter, no abi3 (pyo3 disables abi3 under
  # Py_GIL_DISABLED). Only cp314t - the riscv64 image has no cp313t interpreter.
  build_freethreaded:
    needs: [setup, build_sdist]
    name: Build bcrypt ${{ inputs.version || '5.0.0' }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.build_sdist.outputs.sdist_name }}
          path: dist/

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: dist/${{ needs.build_sdist.outputs.sdist_name }}
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp314t-*'  # no --py-limited-api: abi3 has no free-threaded ABI
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bcrypt-${{ env.BCRYPT_VERSION }}-cp314t-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish bcrypt ${{ inputs.version || '5.0.0' }} to GitLab
    needs: [setup, build_sdist, build_abi3, build_freethreaded]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: bcrypt-${{ needs.build_sdist.outputs.package_version }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
