---
# Based on upstream's wheel builder:
#   https://github.com/pyca/bcrypt/blob/5.0.0/.github/workflows/wheel-builder.yml
# bcrypt is a PyO3/Rust extension built with setuptools-rust (not maturin): abi3
# is opt-in via a bdist_wheel flag, not a pyproject/Cargo feature - see build_abi3.
name: Build bcrypt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bcrypt.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bcrypt.yml'
      - 'docs/packages/bcrypt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bcrypt.yml'
      - 'docs/packages/bcrypt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # abi3 floor: cp312 is RISE's min Python, so the one wheel loads on >=3.12.
  ABI3_FLOOR: cp312

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bcrypt
      version: ${{ inputs.version }}

  # One cp312-abi3 wheel: cibuildwheel builds it once and reuses+tests it on
  # cp313/cp314 (find_compatible_wheel), so all three tags share one wheel.
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build bcrypt ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: bcrypt
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp312-abi3-manylinux_riscv64
      timeout-minutes: 90
      cibw-build: cp312-* cp313-* cp314-*
      # setuptools-rust emits abi3 only when bdist_wheel gets --py-limited-api
      # (cibuildwheel won't); without this it's per-interpreter wheels, not abi3.
      cibw-config-settings: --build-option=--py-limited-api=cp312
      # No Rust in the manylinux image; install it and put cargo on PATH.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      # Upstream's suite; {package} is the extracted sdist dir (gotcha 5).
      cibw-test-requires: pytest
      cibw-test-command: pytest -q {package}/tests

  # Free-threaded wheel: per-interpreter, no abi3 (pyo3 disables abi3 under
  # Py_GIL_DISABLED). Only cp314t - the riscv64 image has no cp313t interpreter.
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build bcrypt ${{ matrix.version }} cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: bcrypt
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: cp314t-manylinux_riscv64
      timeout-minutes: 90
      cibw-build: cp314t-*
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: pytest
      cibw-test-command: pytest -q {package}/tests

  publish:
    name: Publish bcrypt ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bcrypt-${{ matrix.version }}-*-manylinux_riscv64
