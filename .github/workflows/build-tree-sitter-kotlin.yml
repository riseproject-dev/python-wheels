---
# Based on upstream's wheel builder:
#   https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
name: Build tree-sitter-kotlin wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tree-sitter-kotlin.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-kotlin.yml'
      - 'docs/packages/tree-sitter-kotlin.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-kotlin.yml'
      - 'docs/packages/tree-sitter-kotlin.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tree-sitter-kotlin
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tree-sitter-kotlin ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      TREE_SITTER_KOTLIN_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tree-sitter-kotlin v${{ env.TREE_SITTER_KOTLIN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tree-sitter-grammars/tree-sitter-kotlin
          ref: v${{ env.TREE_SITTER_KOTLIN_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: core
          CIBW_TEST_SOURCES: bindings/python/tests
          CIBW_TEST_COMMAND: python -m unittest discover -v -s bindings/python/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tree-sitter-kotlin-${{ env.TREE_SITTER_KOTLIN_VERSION }}-cp39-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tree-sitter-kotlin ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tree-sitter-kotlin-${{ matrix.version }}-*-manylinux_riscv64
