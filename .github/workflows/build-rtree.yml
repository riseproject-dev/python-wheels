---
# Based on upstream's wheel build:
#   https://github.com/Toblerity/rtree/blob/1.4.1/.github/workflows/test.yml (build_wheels)
name: Build rtree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'rtree version/tag to build'
        required: true
        default: '1.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-rtree.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  RTREE_VERSION: ${{ inputs.version || '1.4.1' }}

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build rtree ${{ inputs.version || '1.4.1' }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    steps:
      - name: Checkout rtree ${{ env.RTREE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Toblerity/rtree
          ref: ${{ env.RTREE_VERSION }}
          persist-credentials: false

      # The wheel bundles libspatialindex, but upstream ships only rtree's own licence.
      - name: Stage the libspatialindex licence
        run: |
          sidx="$(sed -n 's/^VERSION=//p' scripts/install_libspatialindex.sh)"
          base="https://raw.githubusercontent.com/libspatialindex/libspatialindex/${sidx}"
          curl -fsSL --retry 5 "${base}/COPYING" -o LICENSE.libspatialindex
          curl -fsSL --retry 5 "${base}/AUTHORS" -o AUTHORS.libspatialindex

      # musllinux is dropped: numpy, which the test suite imports, has no musl riscv64 wheel.
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # `scripts/repair_wheel.py` retags the wheel py3-none, so one build serves every interpreter.
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream builds cp39 only, so `before-all`'s `wheel` lands on the interpreter that
          # then runs `repair_wheel.py`; this builds cp312, so install it beside the build.
          CIBW_BEFORE_BUILD: >-
            yum install -y cmake libffi-devel &&
            pip install wheel &&
            sh {project}/scripts/install_libspatialindex.sh
          # Upstream drives pytest through a tox config that sets `ignore_outcome`, so a failing
          # suite cannot fail the job. This runs the same tests the project's own CI jobs run.
          # pytest 9 breaks the suite's class-scoped fixtures, on every architecture.
          CIBW_TEST_REQUIRES: 'pytest<9 numpy'
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_COMMAND: python -m pytest -Werror -v tests

      - name: Check the bundled library and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE.txt", "LICENSE.libspatialindex", "AUTHORS.libspatialindex"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("rtree.libs/") and ".so" in n for n in names), whl
              licenses = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licenses == expected, f"{whl}: {sorted(licenses)}"
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rtree-${{ env.RTREE_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish rtree ${{ inputs.version || '1.4.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: rtree-${{ inputs.version || '1.4.1' }}-*-manylinux_riscv64
