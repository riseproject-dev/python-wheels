---
# Based on upstream's wheel build:
#   https://github.com/Toblerity/rtree/blob/1.4.1/.github/workflows/test.yml (build_wheels)
name: Build rtree wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rtree.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rtree.yml'
      - 'docs/packages/rtree.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rtree.yml'
      - 'docs/packages/rtree.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rtree
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build rtree ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rtree"
      version: "${{ matrix.version }}"
      repository: "Toblerity/rtree"
      ref: "${{ matrix.version }}"
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: |-
        sidx="$(sed -n 's/^VERSION=//p' scripts/install_libspatialindex.sh)"
        base="https://raw.githubusercontent.com/libspatialindex/libspatialindex/${sidx}"
        curl -fsSL --retry 5 "${base}/COPYING" -o LICENSE.libspatialindex
        curl -fsSL --retry 5 "${base}/AUTHORS" -o AUTHORS.libspatialindex

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # `scripts/repair_wheel.py` retags the wheel py3-none, so one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # Upstream builds cp39 only, so `before-all`'s `wheel` lands on the interpreter that
      # then runs `repair_wheel.py`; this builds cp312, so install it beside the build.
      cibw-before-build: "yum install -y cmake libffi-devel && pip install wheel && sh {project}/scripts/install_libspatialindex.sh"
      # Upstream drives pytest through a tox config that sets `ignore_outcome`, so a failing
      # suite cannot fail the job. This runs the same tests the project's own CI jobs run.
      # pytest 9 breaks the suite's class-scoped fixtures, on every architecture.
      cibw-test-requires: "pytest<9 numpy"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest -Werror -v tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      RTREE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rtree-${{ env.RTREE_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the bundled library and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE.txt", "LICENSE.libspatialindex", "AUTHORS.libspatialindex"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("rtree.libs/") and ".so" in n for n in names), whl
              licenses = {n.split(".dist-info/licenses/", 1)[1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licenses == expected, f"{whl}: {sorted(licenses)}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish rtree ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rtree-${{ matrix.version }}-*-manylinux_riscv64
