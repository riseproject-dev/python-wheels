---
# This workflow is based on: https://github.com/healpy/healpy/blob/1.20.0/.github/workflows/cibuildwheel.yml
name: Build healpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/healpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-healpy.yml'
      - 'docs/packages/healpy.yaml'
      - 'patches/healpy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-healpy.yml'
      - 'docs/packages/healpy.yaml'
      - 'patches/healpy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: healpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build healpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "healpy"
      version: "${{ matrix.version }}"
      repository: "healpy/healpy"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "true"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/healpy/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy/astropy are hard runtime deps and scipy/matplotlib are test
      # extras; only our registry has riscv64 wheels for any of them, and
      # only-binary keeps a newer PyPI release from winning the resolution
      # and building from sdist instead.
      # SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HEALPY: the `git apply` above
      # dirties the tree, which setuptools_scm otherwise reports as a
      # `.devN+g<sha>` version (gotcha 31).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,astropy,scipy,matplotlib MPLLOCALFREETYPE=1 MPLCONFIGDIR=/tmp SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HEALPY=${{ matrix.version }}"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,astropy,scipy,matplotlib MPLLOCALFREETYPE=1 MPLCONFIGDIR=/tmp"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      HEALPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: healpy-${{ env.HEALPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-${{ matrix.python }}-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1].split(".", 1)[0] for n in names if n.endswith(".so") and ".libs/" not in n}
          assert exts == {
              "_healpy_pixel_lib", "_healpy_sph_transform_lib", "_hotspots",
              "_line_integral_convolution", "_masktools", "_pixelfunc",
              "_query_disc", "_sphtools",
          }, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n} - {""}
          assert licences == {
              "COPYING", "LICENSE.cfitsio", "LICENSE.healpix_cxx",
              "LICENSE.libsharp", "LICENSE.pocketfft",
          }, licences
          EOF

  gpl_sources:
    name: Collect GPL sources for healpy ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: healpy
      version: ${{ matrix.version }}
      # libsharp and HEALPix C++ (both cextern/ submodules) link OpenMP when
      # available, so auditwheel vendors the image's libgomp into healpy.libs/.
      packages: gcc

  publish:
    name: Publish healpy ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: healpy-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: healpy-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
