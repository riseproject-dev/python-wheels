---
# This workflow is based on the `linux` job of
# https://github.com/amaye15/JSON-Tools-rs/blob/v0.9.30/.github/workflows/maturin-ci.yml
name: Build json-tools-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/json-tools-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-json-tools-rs.yml'
      - 'docs/packages/json-tools-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-json-tools-rs.yml'
      - 'docs/packages/json-tools-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: json-tools-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build json-tools-rs ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "json-tools-rs"
      version: "${{ matrix.version }}"
      repository: "amaye15/JSON-Tools-rs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # json-tools-rs ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Without it pip prefers PyPI's orjson, which has no riscv64 wheel,
      # and source-builds it in the container.
      cibw-test-environment: "PIP_ONLY_BINARY=orjson"
      cibw-test-requires: "pytest orjson"
      # pyproject.toml carries the [tool.pytest.ini_options] that adds
      # tests.py to python_files; without it pytest collects nothing.
      cibw-test-sources: "pyproject.toml python/tests"
      cibw-test-command: >
        python -c "import json_tools_rs; assert json_tools_rs.json_tools_rs.__file__.endswith('.so'), json_tools_rs.json_tools_rs.__file__" &&
        python -m pytest -v

  publish:
    name: Publish json-tools-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: json-tools-rs-${{ matrix.version }}-*-manylinux_riscv64
