---
# This workflow is based on the `build-wheels` job of
# https://github.com/fastavro/fastavro/blob/1.12.2/.github/workflows/build_linux.yml
name: Build fastavro wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastavro.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastavro.yml'
      - 'docs/packages/fastavro.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastavro.yml'
      - 'docs/packages/fastavro.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastavro
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastavro ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3), matching upstream's own wheel matrix.
        # `test_requires` varies because 3.14 has zstd in the stdlib and the
        # registry ships no free-threaded pandas wheel.
        include:
          - python: "cp312"
            test_requires: "backports.zstd pandas<3.0.4"
            pytest_k: ""
          - python: "cp313"
            test_requires: "backports.zstd pandas<3.0.4"
            pytest_k: ""
          - python: "cp314"
            test_requires: "pandas<3.0.4"
            pytest_k: ""
          - python: "cp314t"
            test_requires: ""
            pytest_k: "and not test_pandas_datetime"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fastavro"
      version: "${{ matrix.version }}"
      repository: "fastavro/fastavro"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 180
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # cramjam (the snappy codec the suite needs) has no riscv64 wheel and
      # builds from its maturin sdist, so Rust has to be in the container.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Upstream tests the checkout, not the wheel; stage only the suite so the
      # repo-root `fastavro/` can't shadow the installed extension modules.
      cibw-test-sources: "tests pytest.ini"
      cibw-test-requires: "pytest numpy lz4 zlib_ng cramjam ${{ matrix.test_requires }}"
      # is_testing_cython_modules() is upstream's own check that the compiled
      # modules, not the pure-Python fallback, are in use.
      # test_regular_vs_ordered_dict_record_typeerror asserts on a traceback
      # source line, so it only passes next to the .pyx sources of an in-place
      # build; it fails against any installed wheel, on every architecture.
      cibw-test-command: "python -c \"from tests.conftest import is_testing_cython_modules as c; assert c()\" && python -m pytest tests -k \"not test_regular_vs_ordered_dict_record_typeerror ${{ matrix.pytest_k }}\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3), matching upstream's own wheel matrix.
        # `test_requires` varies because 3.14 has zstd in the stdlib and the
        # registry ships no free-threaded pandas wheel.
        include:
          - python: "cp312"
            test_requires: "backports.zstd pandas<3.0.4"
            pytest_k: ""
          - python: "cp313"
            test_requires: "backports.zstd pandas<3.0.4"
            pytest_k: ""
          - python: "cp314"
            test_requires: "pandas<3.0.4"
            pytest_k: ""
          - python: "cp314t"
            test_requires: ""
            pytest_k: "and not test_pandas_datetime"
    env:
      FASTAVRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: fastavro-${{ env.FASTAVRO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {
              "_logical_readers", "_logical_writers", "_read",
              "_schema", "_validation", "_write",
          }
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish fastavro ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastavro-${{ matrix.version }}-*-manylinux_riscv64
