---
# Based on the `wheels` job of
# https://github.com/marcelm/dnaio/blob/v1.2.4/.github/workflows/ci.yml
name: Build dnaio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'dnaio version to build (git tag without leading v, e.g. 1.2.4)'
        required: true
        default: '1.2.4'
  pull_request:
    paths:
      - '.github/workflows/build-dnaio.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.2.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  DNAIO_VERSION: ${{ inputs.version || '1.2.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build dnaio ${{ inputs.version || '1.2.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout dnaio v${{ env.DNAIO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: marcelm/dnaio
          ref: v${{ env.DNAIO_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Shallow checkout has no tag history for setuptools_scm to read.
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DNAIO=${{ env.DNAIO_VERSION }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dnaio-${{ env.DNAIO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish dnaio ${{ inputs.version || '1.2.4' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: dnaio-${{ inputs.version || '1.2.4' }}-*-manylinux_riscv64
