---
# Based on the `main-linux` job of
# https://github.com/asottile/ukkonen/blob/v1.1.0/.github/workflows/main.yml
# and its tox.ini test command.
name: Build ukkonen wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ukkonen.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ukkonen.yml'
      - 'docs/packages/ukkonen.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ukkonen.yml'
      - 'docs/packages/ukkonen.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ukkonen
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ukkonen ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp312-abi3, cp314t]
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version, so
          # cp312 (our floor) builds one cp312-abi3 wheel that cp313/cp314 retest.
          - tag: cp312-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # setup.py skips the bdist_wheel abi3 override under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ukkonen
      version: ${{ matrix.version }}
      repository: asottile/ukkonen
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.tag }}-manylinux_riscv64
      cibw-build: ${{ matrix.build }}
      # cffi, needed to build and to import the extension, has no riscv64 wheel on PyPI.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-requires: pytest
      cibw-test-sources: tests
      cibw-test-command: >-
        python -c "import _ukkonen; assert _ukkonen.__file__.endswith('.so'), _ukkonen.__file__" &&
        python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish ukkonen ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ukkonen-${{ matrix.version }}-*-manylinux_riscv64
