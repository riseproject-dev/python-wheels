---
# Based on the `main-linux` job of
# https://github.com/asottile/ukkonen/blob/v1.1.0/.github/workflows/main.yml
# and its tox.ini test command.
name: Build ukkonen wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ukkonen.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ukkonen.yml'
      - 'docs/packages/ukkonen.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ukkonen.yml'
      - 'docs/packages/ukkonen.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ukkonen
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ukkonen ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp312-abi3, cp314t]
        include:
          # setup.py tags the wheel abi3 at the building interpreter's version, so
          # cp312 (our floor) builds one cp312-abi3 wheel that cp313/cp314 retest.
          - tag: cp312-abi3
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # setup.py skips the bdist_wheel abi3 override under Py_GIL_DISABLED.
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      UKKONEN_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ukkonen v${{ env.UKKONEN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: asottile/ukkonen
          ref: v${{ env.UKKONEN_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi, needed to build and to import the extension, has no riscv64 wheel on PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import _ukkonen; assert _ukkonen.__file__.endswith('.so'), _ukkonen.__file__" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ukkonen-${{ env.UKKONEN_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ukkonen ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: ukkonen-${{ matrix.version }}-*-manylinux_riscv64
