---
# This workflow is based on: https://github.com/dulwich/dulwich/blob/dulwich-1.2.13/.github/workflows/python-distributions.yml
# Test invocation mirrors upstream's pythontest.yml / `make check`.
name: Build dulwich wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dulwich.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dulwich.yml'
      - 'docs/packages/dulwich.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dulwich.yml'
      - 'docs/packages/dulwich.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dulwich
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dulwich ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: dulwich
      version: ${{ matrix.version }}
      repository: dulwich/dulwich
      ref: dulwich-${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's extras minus paramiko/colordiff (unexercised by tests/) and
      # patiencediff (no riscv64 wheel; test_patch skips without it).
      cibw-test-extras: merge,fastimport,https,range_diff
      # test_signature expects the signing CLIs upstream's runners have.
      cibw-before-test-linux: dnf -y install openssh-clients gnupg2-smime
      cibw-test-sources: tests testdata docs
      # The suite resolves testdata/ and the source tree relative to the dulwich
      # package dir, so the installed wheel goes where the checkout's would be.
      # test_local_modifications_ioerror cannot fail as root: mode 0 still reads.
      cibw-test-command: >-
        cp -a "$(python -c 'import dulwich, os; print(os.path.dirname(dulwich.__file__))')" dulwich &&
        python -c "import dulwich._objects, dulwich._pack, dulwich._diff_tree" &&
        python -c "import sys, unittest, tests; flat = lambda s: [t for x in s for t in (flat(x) if isinstance(x, unittest.TestSuite) else [x])]; sys.exit(not unittest.TextTestRunner().run(unittest.TestSuite(t for t in flat(tests.test_suite()) if not t.id().endswith('.test_local_modifications_ioerror'))).wasSuccessful())"
      timeout-minutes: 180

  publish:
    name: Publish dulwich ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dulwich-${{ matrix.version }}-*-manylinux_riscv64
