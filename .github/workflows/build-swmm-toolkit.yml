---
# Based on the `build_wheels` job of
# https://github.com/pyswmm/swmm-python/blob/v0.17.0/.github/workflows/build_wheel.yml
name: Build swmm-toolkit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/swmm-toolkit.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-swmm-toolkit.yml'
      - 'docs/packages/swmm-toolkit.yaml'
      - 'patches/swmm-toolkit/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-swmm-toolkit.yml'
      - 'docs/packages/swmm-toolkit.yaml'
      - 'patches/swmm-toolkit/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: swmm-toolkit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build swmm-toolkit ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "swmm-toolkit"
      version: "${{ matrix.version }}"
      repository: "pyswmm/swmm-python"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"

      # swig>=4.4.0 has no riscv64 build anywhere; swmm-toolkit's own .i files
      # only need $action, which works on the 4.3.1 we do have (see the patch).
      # license-files never names the statically-linked swmm-solver submodule's
      # own MIT LICENSE.
      patches: true

      cibw-package-dir: "swmm-toolkit"
      cibw-build: "cp39-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-before-build-linux: "rm -f $(which swig) && rm -f $(which swig4.0)"
      cibw-before-test: "pip install -r {package}/test-requirements.txt"
      cibw-test-command: "python -c \"import importlib.metadata as m; l = sorted(str(p).split('licenses/', 1)[1] for p in m.files('swmm-toolkit') if 'licenses/' in str(p)); assert 'swmm-solver/LICENSE' in l, l\" && pytest {package}/tests"

  publish:
    name: Publish swmm-toolkit ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: swmm-toolkit-${{ matrix.version }}-*-manylinux_riscv64
