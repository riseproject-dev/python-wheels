---
# This workflow is based on upstream's own wheel build/publish setup:
#   https://github.com/apache/tvm-ffi/blob/v0.1.12/.github/workflows/publish_wheel.yml
#   https://github.com/apache/tvm-ffi/blob/v0.1.12/.github/actions/build-wheel-for-publish/action.yml
name: Build apache-tvm-ffi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/apache-tvm-ffi.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-tvm-ffi.yml'
      - 'docs/packages/apache-tvm-ffi.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apache-tvm-ffi.yml'
      - 'docs/packages/apache-tvm-ffi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
  UV_INDEX_STRATEGY: unsafe-best-match
  UV_ONLY_BINARY: ':all:'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: apache-tvm-ffi
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build apache-tvm-ffi ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The reusable workflow extracts the self-contained PyPI sdist, so this
    # build needs neither Git history nor submodules.
    # pyproject pins [tool.cibuildwheel.linux] archs to x86_64+aarch64;
    # override so this native riscv runner builds the riscv64 wheel.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: apache-tvm-ffi
      version: ${{ matrix.version }}
      # The PyPI sdist contains the generated version and vendored dlpack/libbacktrace sources.
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-skip: "*-musllinux_*"
      # Override upstream's build-frontend = "build[uv]". cibuildwheel's audit
      # step creates a venv on the *host* runner (not in the container) and,
      # when the frontend is build[uv], insists on a host `uv` binary
      # (venv.py: `assert uv_path is not None`). The self-hosted riscv runner
      # has no host uv, so the abi3 wheel builds fine but the run crashes in
      # "Auditing wheel...". Plain `build` uses pip/virtualenv on the host
      # instead - the way our local container build was validated.
      cibw-build-frontend: build
      # The test-command (pytest {package}/tests/python) and test-groups
      # (["test"] pulls in torch/numpy/ml_dtypes/pytest/ninja) are inherited
      # from the sdist's pyproject.toml, so we build and test exactly the way
      # upstream does.
      #
      # CIBW_ENVIRONMENT applies to BOTH the build and test phases. We only
      # point pip/uv at our registry here (needed so test deps resolve, and
      # harmless at build time). We deliberately do NOT set ONLY_BINARY here:
      # the build backend needs cython>=3.0, which has no riscv64 wheel on
      # any index and must be compiled from its sdist inside the container.
      cibw-environment-linux: >
        UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        UV_INDEX_STRATEGY=unsafe-best-match
      # Test phase only: force wheels-only so a missing riscv64 wheel for a
      # heavy test dep (torch/numpy/ml_dtypes) fails fast instead of silently
      # kicking off a multi-hour source build under the runner. GPU-only tests
      # self-skip via torch.cuda.is_available().
      cibw-test-environment: >
        PIP_ONLY_BINARY=:all:
        UV_ONLY_BINARY=:all:
      # Mirror upstream's test-command (pytest {package}/tests/python -vvs)
      # but drop two tests that fail only because of this riscv64 runner's
      # environment, not the wheel (2300+ others pass; cp314t, which pulls no
      # torch, is fully green):
      #   * test_libinfo.py - every test there shells out to `tvm-ffi-config`
      #     and asserts the subprocess's stderr is empty. Importing tvm_ffi
      #     pulls in torch, whose bundled libcpuinfo can't parse this runner's
      #     /sys CPU topology (core_id reads "-1") and prints
      #     "Error in cpuinfo: failed to parse ... core_id" to stderr. The
      #     noise is nondeterministic across the module's subprocess tests, so
      #     the whole file is dropped via --ignore (an absolute path, so it's
      #     unambiguous regardless of pytest's rootdir).
      #   * test_filelock.py::test_concurrent_access - spawns 16 concurrent
      #     torch-importing workers under a hard 60s wait; the slower riscv64
      #     runner blows the timeout. Dropped with -k by its (unique) name -
      #     rootdir-independent, unlike a path-based --deselect (which silently
      #     no-ops when the nodeid prefix doesn't match pytest's rootdir).
      cibw-test-command: >
        pytest {package}/tests/python -vvs
        --ignore {package}/tests/python/test_libinfo.py
        -k "not test_concurrent_access"

  publish:
    name: Publish apache-tvm-ffi ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: apache-tvm-ffi-${{ matrix.version }}-*-manylinux_riscv64
