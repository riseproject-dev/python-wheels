---
# This workflow is based on the `wheels` job of
# https://github.com/emmett-framework/granian/blob/v2.8.2/.github/workflows/release.yml
name: Build granian wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/granian.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-granian.yml'
      - 'docs/packages/granian.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-granian.yml'
      - 'docs/packages/granian.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: granian
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build granian ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          - python: cp312
            allocator: jemalloc
          - python: cp313
            allocator: jemalloc
          - python: cp314
            allocator: jemalloc
          # upstream builds the free-threaded wheels against mimalloc
          - python: cp314t
            allocator: mimalloc

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "granian"
      version: "${{ matrix.version }}"
      repository: "emmett-framework/granian"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 360

      patches: true

      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # granian ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # upstream passes the allocator to `maturin build`; maturin's PEP 517
      # backend takes the same arguments from MATURIN_PEP517_ARGS.
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" MATURIN_PEP517_ARGS=\"--features ${{ matrix.allocator }}\""
      cibw-test-requires: "httpx~=0.28 pytest~=9.0 pytest-asyncio~=1.3 sniffio~=1.3 websockets~=16.0"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -c \"import granian._granian as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v tests"

  publish:
    name: Publish granian ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: granian-${{ matrix.version }}-*-manylinux_riscv64
