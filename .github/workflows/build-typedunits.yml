---
# This workflow is based on the `build_wheels` job of
# https://github.com/quantumlib/TypedUnits/blob/v0.0.2/.github/workflows/stable-release-workflow.yml
name: Build typedunits wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/typedunits.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-typedunits.yml'
      - 'docs/packages/typedunits.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-typedunits.yml'
      - 'docs/packages/typedunits.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: typedunits
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build typedunits ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # setup.py reads version/version.txt, falling back to "<tag>.dev" otherwise;
    # upstream's own release workflow writes this file in a separate host-side job
    # before cibuildwheel so the built wheel's version matches the git tag exactly.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "typedunits"
      version: "${{ matrix.version }}"
      repository: "quantumlib/TypedUnits"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        mkdir -p version
        echo "${{ matrix.version }}" > version/version.txt
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy,protobuf
      cibw-test-requires: "pytest"
      cibw-test-command: >
        python -c "import tunits_core; assert tunits_core.__file__.endswith('.so')"
        && python -m pytest -v {package}/test

  publish:
    name: Publish typedunits ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: typedunits-${{ matrix.version }}-*-manylinux_riscv64
