---
# This workflow is based on: https://github.com/messense/fasttext-wheel/blob/master/.github/workflows/Linux.yml
name: Build fasttext-wheel wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fasttext-wheel.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fasttext-wheel.yml'
      - 'docs/packages/fasttext-wheel.yaml'
      - 'patches/fasttext-wheel/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fasttext-wheel.yml'
      - 'docs/packages/fasttext-wheel.yaml'
      - 'patches/fasttext-wheel/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fasttext-wheel
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fasttext-wheel ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fasttext-wheel"
      version: "${{ matrix.version }}"
      # facebookresearch/fastText is the actual source; fasttext-wheel (messense)
      # is only a build/publish wrapper around it that renames the distribution.
      repository: "facebookresearch/fastText"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No pyproject.toml, so `python -m build`'s isolated venv has no pip;
      # setup.py's get_pybind_include self-installs pybind11 via `pip install`
      # there and fails with "No module named pip". Pre-install its
      # install_requires (pybind11, setuptools, numpy) and skip isolation.
      cibw-before-build: "pip install pybind11 setuptools numpy"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # runtests.py (upstream's `python_test.sh` entry point) lives outside the
      # installed package, so run the same gen_unit_tests() suite it calls
      # directly against the installed fasttext.tests subpackage instead.
      cibw-test-command: "python -c \"import unittest, sys; from fasttext.tests.test_script import gen_unit_tests; r = unittest.TextTestRunner(verbosity=2).run(unittest.TestLoader().loadTestsFromTestCase(gen_unit_tests())); sys.exit(0 if r.wasSuccessful() else 1)\""

  publish:
    name: Publish fasttext-wheel ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fasttext-wheel-${{ matrix.version }}-*-manylinux_riscv64
