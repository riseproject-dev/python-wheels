---
# This workflow is based on the `linux` job of
# https://github.com/MeirKriheli/python-bidi/blob/v0.6.11/.github/workflows/CI.yml
name: Build python-bidi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'python-bidi version to build (git tag without leading v, e.g. 0.6.11)'
        required: true
        default: '0.6.11'
  pull_request:
    paths:
      - '.github/workflows/build-python-bidi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.6.11' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PYTHON_BIDI_VERSION: ${{ inputs.version || '0.6.11' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build python-bidi ${{ inputs.version || '0.6.11' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PyO3 extension built per interpreter; upstream ships cp3x-cp3x wheels, no abi3.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout python-bidi ${{ env.PYTHON_BIDI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: MeirKriheli/python-bidi
          ref: v${{ env.PYTHON_BIDI_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is out of reach: rustup publishes rust-std but no rustc/cargo
          # host toolchain for riscv64gc-unknown-linux-musl.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # python-bidi ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest tests

      - name: Check the extension module made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("bidi/bidi.") and n.endswith(".so")
                         for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-bidi-${{ env.PYTHON_BIDI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-bidi ${{ inputs.version || '0.6.11' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: python-bidi-${{ inputs.version || '0.6.11' }}-*-manylinux_riscv64
