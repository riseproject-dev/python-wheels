---
# This workflow is based on the `setup.py`/`pyproject.toml` cibuildwheel config of
# https://github.com/explosion/spacy-transformers/blob/release-v1.4.0/pyproject.toml
# and the test invocation of
# https://github.com/explosion/spacy-transformers/blob/release-v1.4.0/.github/workflows/tests.yml
name: Build spacy-transformers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spacy-transformers.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-transformers.yml'
      - 'docs/packages/spacy-transformers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spacy-transformers.yml'
      - 'docs/packages/spacy-transformers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spacy-transformers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spacy-transformers ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "spacy-transformers"
      version: "${{ matrix.version }}"
      repository: "explosion/spacy-transformers"
      ref: "release-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # test_multiprocessing's Language.pipe(n_process=2) pickles the transformer's
      # tensors through /dev/shm, overrunning Docker's 64MB default (gotcha 613).
      cibw-container-engine: "docker; create_args: --shm-size=2g"
      # numpy (build and runtime) and spacy/srsly/torch (runtime) have no
      # riscv64 wheels on public PyPI; both environments resolve them from
      # our registry. spacy-alignments (runtime) has no riscv64 wheel
      # anywhere yet, so its sdist is compiled instead - it needs a Rust
      # toolchain, installed below, but is never actually imported by this
      # package or its tests.
      cibw-environment-linux: "PATH=$PATH:$HOME/.cargo/bin"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      # Upstream leaves cibuildwheel's test-command empty and runs the
      # suite from tests.yml instead; this is that invocation, minus the
      # sdist build/mypy steps, which check packaging and typing, not the
      # wheel. tests.yml installs requirements.txt's
      # transformers[sentencepiece], an extra setup.cfg's install_requires
      # omits; one test needs that backend, so it's added explicitly here.
      cibw-test-requires: "pytest pytest-cov sentencepiece"
      cibw-test-command: "python -m pytest --pyargs spacy_transformers"
      # transformers<4.53.3 (spacy-transformers' own pin) requires
      # tokenizers>=0.21,<0.22; unconstrained, pip picks the highest
      # matching point release (0.21.2/0.21.4), which has no riscv64
      # wheel anywhere, and source-builds it, where rustc SIGABRTs on
      # these runners (gotcha 228). Forcing binary-only makes pip fall
      # back to our registry's 0.21.1 wheel instead.
      cibw-test-environment: "PIP_ONLY_BINARY=tokenizers"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPACY_TRANSFORMERS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spacy-transformers-${{ env.SPACY_TRANSFORMERS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"spacy_transformers/align"}
          for whl in sys.argv[1:]:
              found = {n.split(".", 1)[0] for n in zipfile.ZipFile(whl).namelist()
                       if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish spacy-transformers ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spacy-transformers-${{ matrix.version }}-*-manylinux_riscv64
