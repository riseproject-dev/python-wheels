---
# This workflow is based on: https://github.com/grantjenks/py-tree-sitter-languages/blob/v1.10.2/.github/workflows/release.yml
name: Build tree-sitter-languages wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tree-sitter-languages.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-languages.yml'
      - 'docs/packages/tree-sitter-languages.yaml'
      - 'patches/tree-sitter-languages/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-languages.yml'
      - 'docs/packages/tree-sitter-languages.yaml'
      - 'patches/tree-sitter-languages/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # build.py needs Language.build_library and core.pyx needs Language(path, name);
  # both were removed in tree-sitter 0.22.
  TREE_SITTER_SPEC: 'tree-sitter<0.22'
  # Upstream pins cython==3.0.8, which predates free threading and cannot compile
  # core.pyx under cp314t.
  CYTHON_SPEC: 'cython==3.3.0'
  # setuptools 79.0.0 dropped -shared from distutils' C++ link command, so
  # build.py links languages.so as an executable and fails on `main`.
  SETUPTOOLS_SPEC: 'setuptools<79'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tree-sitter-languages
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tree-sitter-languages ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tree-sitter-languages"
      version: "${{ matrix.version }}"
      repository: "grantjenks/py-tree-sitter-languages"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream runs `pip install -e . && python build.py`, which resolves
      # tree-sitter to whatever is newest; install the pinned one instead.
      cibw-before-build: "pip install \"cython==3.3.0\" \"tree-sitter<0.22\" \"setuptools<79\" wheel && python build.py"
      # setup.py imports Cython at module level and declares no build-system
      # table, so the build has to see the preinstalled one.
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-test-requires: "pytest tree-sitter<0.22"
      # Assert the patched license_files glob still ships the 46 vendored
      # grammar licences, then run upstream's suite over all 48 grammars.
      cibw-test-command: "python -c \"import importlib.metadata as md; f = [str(p) for p in md.files('tree_sitter_languages') if '.dist-info/licenses/vendor/' in str(p)]; assert len(f) == 46, f\" && pytest --showlocals {package}/tests"

  publish:
    name: Publish tree-sitter-languages ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tree-sitter-languages-${{ matrix.version }}-*-manylinux_riscv64
