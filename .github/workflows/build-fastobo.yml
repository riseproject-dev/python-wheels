---
# This workflow is based on the `wheel-linux-x86_64` job of
# https://github.com/fastobo/fastobo-py/blob/v0.14.1/.github/workflows/publish.yml
name: Build fastobo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastobo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastobo.yml'
      - 'docs/packages/fastobo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastobo.yml'
      - 'docs/packages/fastobo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastobo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastobo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fastobo
      version: ${{ matrix.version }}
      # pyproject.toml's own [tool.cibuildwheel.linux] already installs
      # rustup and puts ~/.cargo/bin on PATH; only riscv64 selection is added.
      repository: fastobo/fastobo-py
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 60

  publish:
    name: Publish fastobo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastobo-${{ matrix.version }}-*-manylinux_riscv64
