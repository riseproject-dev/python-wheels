---
# This workflow is based on the `wheel-linux-x86_64` job of
# https://github.com/fastobo/fastobo-py/blob/v0.14.1/.github/workflows/publish.yml
name: Build fastobo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fastobo version to build (git tag without leading v, e.g. 0.14.1)'
        required: true
        default: '0.14.1'
  pull_request:
    paths:
      - '.github/workflows/build-fastobo.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.14.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.14.1 there.
  FASTOBO_VERSION: ${{ inputs.version || '0.14.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fastobo ${{ inputs.version || '0.14.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout fastobo v${{ env.FASTOBO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fastobo/fastobo-py
          ref: v${{ env.FASTOBO_VERSION }}
          persist-credentials: false

      # pyproject.toml's own [tool.cibuildwheel.linux] already installs
      # rustup and puts ~/.cargo/bin on PATH; only riscv64 selection is added.
      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastobo-${{ env.FASTOBO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastobo ${{ inputs.version || '0.14.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fastobo-${{ inputs.version || '0.14.1' }}-*-manylinux_riscv64
