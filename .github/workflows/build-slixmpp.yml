---
# slixmpp's GitHub mirror (github.com/poezio/slixmpp) is stale (last commit
# 2022, no tags past slix-1.8.2); the project's real, actively-tagged repo is
# codeberg.org/poezio/slixmpp, which actions/checkout can't reach.
name: Build slixmpp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/slixmpp.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-slixmpp.yml'
      - 'docs/packages/slixmpp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-slixmpp.yml'
      - 'docs/packages/slixmpp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: slixmpp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build slixmpp ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "slixmpp"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        export SLIXMPP_VERSION='${{ matrix.version }}'
        git clone --depth 1 --branch "slix-${SLIXMPP_VERSION}" \
          https://codeberg.org/poezio/slixmpp.git slixmpp-src

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "slixmpp-src"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # No Rust in the image; the sole extension (slixmpp.jid, a pyo3
      # accelerator for the JID parser) is `optional = true`, so a
      # toolchain or crate failure here would still fall back to the
      # pure-Python slixmpp/jid.py rather than failing the build.
      cibw-before-all-linux: "curl -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # pluginsdict.py imports every XEP plugin unconditionally, so
      # xep_0363 (aiohttp) and xep_0454 (cryptography) must both be
      # importable just to collect tests, not only for the doctest walk;
      # aiodns/pyasn1/pyasn1-modules are the project's own runtime deps
      # and install with the wheel. cryptography has no riscv64 wheel on
      # public PyPI, hence the registry above - and none at all on
      # musllinux (registry included), which is why musllinux is dropped.
      cibw-test-requires: "aiohttp cryptography"
      # test_chores.py reads doap.xml and lists slixmpp/plugins/xep_* from
      # disk (not from the installed wheel) relative to tests/..; stage
      # just the plugins directory listing (no __init__.py in it) so it
      # doesn't shadow the installed package's `import slixmpp`. Sources
      # are relative to the job workspace (gotcha 5), not package-dir, so
      # they keep the slixmpp-src/ prefix; cd into it to match.
      cibw-test-sources: "slixmpp-src/tests slixmpp-src/run_tests.py slixmpp-src/doap.xml slixmpp-src/slixmpp/plugins"
      cibw-test-command: "cd slixmpp-src && python run_tests.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SLIXMPP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: slixmpp-${{ env.SLIXMPP_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the pyo3 JID accelerator built (not just the pure-Python fallback)
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              has_ext = any(n.startswith("slixmpp/jid") and n.endswith(".so") for n in names)
              print(whl, "accelerated" if has_ext else "pure-Python fallback (optional extension did not build)")
          EOF

  publish:
    name: Publish slixmpp ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: slixmpp-${{ matrix.version }}-*-manylinux_riscv64
