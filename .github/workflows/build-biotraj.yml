---
# Based on upstream's CI:
#   https://github.com/biotite-dev/biotraj/blob/v1.2.2/.github/workflows/test_and_deploy.yml
name: Build biotraj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/biotraj.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-biotraj.yml'
      - 'docs/packages/biotraj.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-biotraj.yml'
      - 'docs/packages/biotraj.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: biotraj
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build biotraj ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # pypi.riseproject.dev ships netcdf4 only for cp312+, so only these two
        # exercise the real netCDF4 backend; the others fall back to biotraj's
        # scipy implementation, which the suite covers unconditionally either way.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: biotraj
      version: ${{ matrix.version }}
      repository: biotite-dev/biotraj
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy/scipy: pypi.riseproject.dev trails PyPI's newest patch release for
      # some interpreters, which would otherwise resolve to a sdist build.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,scipy
      cibw-test-requires: ${{ case(matrix.python == 'cp310', 'pytest psutil', matrix.python == 'cp311', 'pytest psutil', matrix.python == 'cp312', 'pytest psutil netcdf4>=1.7.1', matrix.python == 'cp313', 'pytest psutil netcdf4>=1.7.1', '') }}
      cibw-test-command: pytest {project}
      timeout-minutes: 60

  publish:
    name: Publish biotraj ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: biotraj-${{ matrix.version }}-*-manylinux_riscv64
