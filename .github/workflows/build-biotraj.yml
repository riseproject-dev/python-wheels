---
# Based on upstream's CI:
#   https://github.com/biotite-dev/biotraj/blob/v1.2.2/.github/workflows/test_and_deploy.yml
name: Build biotraj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'biotraj version to build (git tag without leading v, e.g. 1.2.2)'
        required: true
        default: '1.2.2'
  pull_request:
    paths:
      - '.github/workflows/build-biotraj.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.2.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  BIOTRAJ_VERSION: ${{ inputs.version || '1.2.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build biotraj ${{ inputs.version || '1.2.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Matches upstream's own CIBW_BUILD: no cp314/free-threaded wheels published.
        include:
          - python: cp310
            test_requires: pytest psutil
          - python: cp311
            test_requires: pytest psutil
          # pypi.riseproject.dev ships netcdf4 only for cp312+, so only these two
          # exercise the real netCDF4 backend; the others fall back to biotraj's
          # scipy implementation, which the suite covers unconditionally either way.
          - python: cp312
            test_requires: pytest psutil netcdf4>=1.7.1
          - python: cp313
            test_requires: pytest psutil netcdf4>=1.7.1
    steps:
      - name: Checkout biotraj v${{ env.BIOTRAJ_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: biotite-dev/biotraj
          ref: v${{ env.BIOTRAJ_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy/scipy: pypi.riseproject.dev trails PyPI's newest patch release for
          # some interpreters, which would otherwise resolve to a sdist build.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: ${{ matrix.test_requires }}
          CIBW_TEST_COMMAND: pytest {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: biotraj-${{ env.BIOTRAJ_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish biotraj ${{ inputs.version || '1.2.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: biotraj-${{ inputs.version || '1.2.2' }}-*-manylinux_riscv64
