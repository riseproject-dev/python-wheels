---
# Based on upstream's own wheel build:
#   https://github.com/connor-makowski/type_enforced/blob/2.13.1/.github/workflows/build_wheels.yml
#   https://github.com/connor-makowski/type_enforced/blob/2.13.1/pyproject.toml
name: Build type_enforced wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/type-enforced.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-type-enforced.yml'
      - 'docs/packages/type-enforced.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-type-enforced.yml'
      - 'docs/packages/type-enforced.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: type-enforced
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build type_enforced ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): upstream ships cp3x-cp3x wheels despite
        # nanobind's STABLE_ABI flag (no wheel.py-api set in pyproject.toml).
        python: ["cp311", "cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    env:
      TYPE_ENFORCED_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout type_enforced ${{ env.TYPE_ENFORCED_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: connor-makowski/type_enforced
          ref: ${{ env.TYPE_ENFORCED_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # scikit-build-core bootstraps its own (recent) cmake from PyPI, which
          # also ships riscv64 wheels; matches the potpourri3d precedent.
          CIBW_BEFORE_ALL_LINUX: ${{ matrix.libc == 'manylinux' && 'yum remove -y cmake' || '' }}
          # Fail the build instead of silently shipping a pure-Python wheel if the
          # C++ extension fails to compile, same as upstream's own CI does.
          CIBW_ENVIRONMENT: TYPE_ENFORCED_REQUIRE_CPP="1"
          CIBW_TEST_ENVIRONMENT: TYPE_ENFORCED_REQUIRE_CPP="1"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: type-enforced-${{ env.TYPE_ENFORCED_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish type_enforced ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: type-enforced-${{ matrix.version }}-*riscv64
