---
# This workflow is based on: https://github.com/jax-ml/ml_dtypes/blob/v0.6.0/.github/workflows/wheels.yml
name: Build ml-dtypes wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ml-dtypes.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ml-dtypes.yml'
      - 'docs/packages/ml-dtypes.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ml-dtypes.yml'
      - 'docs/packages/ml-dtypes.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ml-dtypes
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ml-dtypes ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # third_party/eigen is a submodule and the extension compiles against it.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ml-dtypes"
      version: "${{ matrix.version }}"
      repository: "jax-ml/ml_dtypes"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "absl-py pytest pytest-xdist"
      # riscv64's FP-invalid status flag diverges on casts between ml_dtypes'
      # non-IEEE custom float types (same class of divergence the project's own
      # CMakeLists.txt documents for Mac ARM); ml_dtypes' filterwarnings=error
      # promotes it to a hard failure even though the underlying assertions pass.
      cibw-test-command: "pytest -n auto -W \"ignore:invalid value encountered in cast:RuntimeWarning\" {project}"

  eigen_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Collect eigen sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      ML_DTYPES_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout ml_dtypes ${{ env.ML_DTYPES_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: jax-ml/ml_dtypes
          ref: v${{ env.ML_DTYPES_VERSION }}
          submodules: recursive
          persist-credentials: false

      # The extension compiles MPL-2.0 eigen headers into the wheel, so the
      # matching sources are published next to it.
      - run: tar cf gpl-sources.tar third_party/eigen

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ml-dtypes-${{ env.ML_DTYPES_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish ml-dtypes ${{ matrix.version }}
    needs: [setup, build_wheels, eigen_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ml-dtypes-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: ml-dtypes-${{ matrix.version }}-gpl-sources
      gpl-sources-description: eigen (MPL-2.0)
