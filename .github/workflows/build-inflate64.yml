---
# Based on upstream's wheel builder:
#   https://github.com/miurahr/inflate64/blob/v1.0.4/.github/workflows/publish-to-pypi.yml
name: Build inflate64 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'inflate64 version to build (git tag without leading v, e.g. 1.0.4)'
        required: true
        default: '1.0.4'
  pull_request:
    paths:
      - '.github/workflows/build-inflate64.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  INFLATE64_VERSION: ${{ inputs.version || '1.0.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build inflate64 ${{ inputs.version || '1.0.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout inflate64 v${{ env.INFLATE64_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: miurahr/inflate64
          ref: v${{ env.INFLATE64_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import inflate64._inflate64 as m; assert m.__file__.endswith('.so'), m.__file__"
            && python -m pytest -vv -s tests

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: inflate64-${{ env.INFLATE64_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish inflate64 ${{ inputs.version || '1.0.4' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: inflate64-${{ env.INFLATE64_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
