---
# Based on upstream's wheel builder:
#   https://github.com/ruamel/yaml.clib/blob/0.2.15/.github/workflows/build_wheels.yaml
name: Build ruamel-yaml-clib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ruamel-yaml-clib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ruamel-yaml-clib.yml'
      - 'docs/packages/ruamel-yaml-clib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ruamel-yaml-clib.yml'
      - 'docs/packages/ruamel-yaml-clib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ruamel-yaml-clib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ruamel-yaml-clib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ruamel-yaml-clib"
      version: "${{ matrix.version }}"
      # Development happens in Mercurial on SourceForge; ruamel/yaml.clib is the
      # author's read-only git mirror and the repo upstream's own CI builds from.
      repository: "ruamel/yaml.clib"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      # The extension compiles in libyaml, whose MIT terms want the notice to
      # travel with the binary; upstream's wheel carries only its own LICENSE.
      patches: true
      pre-build: |-
        # Upstream ships no test suite; exercise the extension the way ruamel.yaml uses it.
        mkdir -p tests
        cat > tests/test_clib.py <<'EOF'
        import importlib.metadata
        import io

        import ruamel.yaml
        from ruamel.yaml.cyaml import __yaml_lib

        assert __yaml_lib == 'clib', __yaml_lib

        licenses = sorted(
            str(path).rsplit('/', 1)[-1]
            for path in importlib.metadata.files('ruamel-yaml-clib')
            if '.dist-info/licenses/' in str(path)
        )
        assert licenses == ['LICENSE', 'LICENSE.libyaml'], licenses

        yaml = ruamel.yaml.YAML(typ='safe', pure=False)
        assert yaml.Parser.__name__ == 'CParser', yaml.Parser
        assert yaml.Emitter.__name__ == 'CEmitter', yaml.Emitter

        data = yaml.load('a: 1\nb: [x, "é"]\nc: &r {d: null}\ne: *r\n')
        assert data == {'a': 1, 'b': ['x', 'é'], 'c': {'d': None}, 'e': {'d': None}}, data

        buf = io.StringIO()
        yaml.dump(data, buf)
        assert yaml.load(buf.getvalue()) == data, buf.getvalue()

        try:
            yaml.load('a: [1, 2\n')
        except ruamel.yaml.YAMLError:
            pass
        else:
            raise AssertionError('the C parser accepted invalid YAML')
        EOF

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "ruamel.yaml"
      cibw-test-command: "python {project}/tests/test_clib.py"

  publish:
    name: Publish ruamel-yaml-clib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ruamel-yaml-clib-${{ matrix.version }}-*-manylinux_riscv64
