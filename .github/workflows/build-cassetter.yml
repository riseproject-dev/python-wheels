---
# This workflow is based on the `build-wheels` job of
# https://github.com/Kludex/cassetter/blob/v0.10.0/.github/workflows/publish.yml
name: Build cassetter wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cassetter.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cassetter.yml'
      - 'docs/packages/cassetter.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cassetter.yml'
      - 'docs/packages/cassetter.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cassetter
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cassetter ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # cassetter's pyo3 dependency has a plain `features =
        # ["pyo3/extension-module"]` (no abi3-pyNN), so every interpreter
        # needs its own build.
        python: ['cp310', 'cp311', 'cp312', 'cp313', 'cp314', 'cp314t']

    env:
      CASSETTER_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout cassetter v${{ env.CASSETTER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Kludex/cassetter
          ref: v${{ env.CASSETTER_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --strip -i ${{ steps.interp.outputs.value }} --out dist --manifest-path rust/Cargo.toml
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      # Mirrors upstream's own `test` job (ci.yml): install from the
      # just-built wheel with the public index disabled, then run its own
      # test suite unmodified, minus the tests that need grpcio or
      # pyreqwest-impersonate - neither ships a riscv64 wheel.
      - name: Install test dependencies
        run: |
          uv pip install cassetter --no-index --find-links dist --force-reinstall
          uv pip install 'pytest>=8.0' 'pytest-cov>=7.0.0' 'pytest-xdist>=3.8.0' \
            'anyio[trio]>=4.0' 'httpx>=0.27' 'aiohttp>=3.9' 'requests>=2.28' \
            'websockets>=12.0' 'vcrpy>=8.1.1' 'pyyaml>=6.0.3' 'trustme>=1.0' \
            'httpx2>=2.0'

      - name: Run tests
        run: |
          pytest tests/ --strict-config --strict-markers -v \
            --ignore=tests/test_grpc_ws.py \
            --ignore=tests/test_intercept_pyreqwest.py \
            --ignore=tests/test_intercept_edges.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cassetter-${{ env.CASSETTER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish cassetter ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cassetter-${{ matrix.version }}-*-manylinux_riscv64
