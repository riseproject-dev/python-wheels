---
# This workflow is based on: https://github.com/mcfletch/pyopengl/blob/3.1.10/.github/workflows/accelerate-manylinux.yml
name: Build pyopengl-accelerate wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyopengl-accelerate.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopengl-accelerate.yml'
      - 'docs/packages/pyopengl-accelerate.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyopengl-accelerate.yml'
      - 'docs/packages/pyopengl-accelerate.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyopengl-accelerate
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyopengl-accelerate ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyopengl-accelerate"
      version: "${{ matrix.version }}"
      repository: "mcfletch/pyopengl"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyopengl-accelerate/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "accelerate"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy has no riscv64 musllinux wheel anywhere (registry or public PyPI),
      # and it's a build-time requirement (numpy_formathandler); musllinux is
      # dropped rather than compiling numpy from source in-container.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      # OpenGL.GL binds libGL at import time (not lazily at first call), so the
      # accelerate test suite needs it on disk even though it never creates a
      # real GL context - mesa-libGL provides it.
      cibw-before-test-linux: "dnf install -y mesa-libGL"
      cibw-test-requires: "pytest PyOpenGL numpy"
      cibw-test-sources: "accelerate/tests"
      cibw-test-command: "python -m pytest -ra {project}/accelerate/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYOPENGL_ACCELERATE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyopengl-accelerate-${{ env.PYOPENGL_ACCELERATE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extensions and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {
              "wrapper", "formathandler", "arraydatatype", "errorchecker", "vbo",
              "nones_formathandler", "latebind", "buffers_formathandler",
              "numpy_formathandler",
          }
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {
                  n.rsplit("/", 1)[1].split(".", 1)[0]
                  for n in names
                  if n.startswith("OpenGL_accelerate/") and n.endswith(".so")
              }
              assert found == expected, f"{whl}: {sorted(found)}"
              licenses = {n.rsplit("/", 1)[1] for n in names if "dist-info/licenses/" in n and not n.endswith("/")}
              assert licenses == {"license.txt"}, f"{whl}: {sorted(licenses)}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyopengl-accelerate ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyopengl-accelerate-${{ matrix.version }}-*riscv64
