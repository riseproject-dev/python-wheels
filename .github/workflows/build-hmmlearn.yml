---
# This workflow is based on: https://github.com/hmmlearn/hmmlearn/blob/0.3.3/.github/workflows/build.yml
name: Build hmmlearn wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hmmlearn.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hmmlearn.yml'
      - 'docs/packages/hmmlearn.yaml'
      - 'patches/hmmlearn/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hmmlearn.yml'
      - 'docs/packages/hmmlearn.yaml'
      - 'patches/hmmlearn/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hmmlearn
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hmmlearn ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "hmmlearn"
      version: "${{ matrix.version }}"
      repository: "hmmlearn/hmmlearn"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,scikit-learn SETUPTOOLS_SCM_PRETEND_VERSION_FOR_HMMLEARN=${{ matrix.version }}"
      cibw-test-requires: "pytest"
      # Mirrors upstream's own test invocation (build.yml's CIBW_TEST_COMMAND), plus
      # -X gil=1: _hmmc has no Py_mod_gil slot, so cp314t re-enables the GIL at
      # import and warns; hmmlearn's own filterwarnings=["error", ...] turns that
      # into a collection error. CIBW_TEST_ENVIRONMENT's PYTHON_GIL=1 would be the
      # usual fix, but -I (already used here) ignores all PYTHON* env vars, so it
      # has to be the -X flag instead; a no-op on the non-free-threaded builds.
      cibw-test-command: "python -I -X gil=1 -mpytest --pyargs hmmlearn.tests {project}/doc"

  publish:
    name: Publish hmmlearn ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hmmlearn-${{ matrix.version }}-*-manylinux_riscv64
