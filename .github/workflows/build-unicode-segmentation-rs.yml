---
# Based on upstream's own wheel builder (`linux` job):
#   https://github.com/WeblateOrg/unicode-segmentation-rs/blob/v0.3.3/.github/workflows/ci.yml
name: Build unicode-segmentation-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/unicode-segmentation-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-unicode-segmentation-rs.yml'
      - 'docs/packages/unicode-segmentation-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-unicode-segmentation-rs.yml'
      - 'docs/packages/unicode-segmentation-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: unicode-segmentation-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build unicode-segmentation-rs ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # Cargo.toml enables pyo3's abi3-py310 unconditionally, so one abi3
          # wheel serves every GIL-ful interpreter from cp310; pyo3 disables
          # abi3 under Py_GIL_DISABLED, so cp314t gets its own per-interpreter
          # wheel, and the opt-in `abi3t` feature (pyo3/abi3t-py315) gives
          # cp315t+ a forward-compatible cp315-abi3.abi3t wheel -- matching the
          # exact three-wheel split upstream publishes to PyPI.
          - python: cp310
            features: ''
          - python: cp314t
            features: ''
          - python: cp315t
            features: '--features abi3t'

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "unicode-segmentation-rs"
      version: "${{ matrix.version }}"
      repository: "WeblateOrg/unicode-segmentation-rs"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # unicode-segmentation-rs ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\" MATURIN_PEP517_ARGS=\"${{ matrix.features }}\""
      # The cp315-abi3.abi3t wheel exports its multi-phase init entry point as
      # PyModExport_unicode_segmentation_rs (defined in the extension itself, not
      # imported); cibuildwheel's bundled abi3audit doesn't recognize that name and
      # flags it as a non-abi3 symbol (gotcha 134), reproducing on upstream's own
      # published wheel.
      cibw-audit-command: ''
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import unicode_segmentation_rs as m, importlib.metadata as md;
        assert m.unicode_segmentation_rs.__file__.endswith('.so'), m.unicode_segmentation_rs.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('unicode-segmentation-rs'))" &&
        python -m pytest -v tests

  publish:
    name: Publish unicode-segmentation-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: unicode-segmentation-rs-${{ matrix.version }}-*-manylinux_riscv64
