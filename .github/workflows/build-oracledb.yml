---
# This workflow is based on the `build_linux_wheels` job of
# https://github.com/oracle/python-oracledb/blob/v4.0.2/.github/workflows/build.yaml
# Dropped: macos, windows, musllinux (the registry has no musl riscv64 cryptography,
# which oracledb requires at runtime).
name: Build oracledb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/oracledb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-oracledb.yml'
      - 'docs/packages/oracledb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oracledb.yml'
      - 'docs/packages/oracledb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: oracledb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build oracledb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "oracledb"
      version: "${{ matrix.version }}"
      repository: "oracle/python-oracledb"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PYO_COMPILE_ARGS=-g0"
      # Test phase only, so it can't starve the build backend (cython builds from sdist).
      cibw-test-environment: "PIP_ONLY_BINARY=:all: PYO_TEST_MAIN_PASSWORD=unused"
      cibw-test-requires: "pytest numpy pandas"
      cibw-test-sources: "tests"
      # Upstream's suite needs a live Oracle Database, which has no riscv64 build.
      # These five modules pass without one; test_misc_1009 is the only test in
      # them that opens a connection.
      cibw-test-command: "python -m pytest -k \"not test_misc_1009\" tests/misc/test_1000_module.py tests/data_types/test_1200_types.py tests/misc/test_1300_connect_params.py tests/misc/test_1400_pool_params.py tests/misc/test_1500_tnsnames.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ORACLEDB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: oracledb-${{ env.ORACLEDB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension modules made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"arrow_impl", "base_impl", "thick_impl", "thin_impl"}
          for whl in sys.argv[1:]:
              found = {
                  n.split("/")[-1].split(".")[0]
                  for n in zipfile.ZipFile(whl).namelist()
                  if n.endswith(".so")
              }
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish oracledb ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: oracledb-${{ matrix.version }}-*-manylinux_riscv64
