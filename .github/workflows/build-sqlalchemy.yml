---
# SQLAlchemy is pure-Python with *optional* Cython speedups; PyPI ships a compiled
# wheel per interpreter for every arch but riscv64. sdist -> bdist, inheriting
# upstream's [tool.cibuildwheel] test config from the sdist (as build-apache-tvm-ffi.yml).
#   https://github.com/sqlalchemy/sqlalchemy/blob/rel_2_0_52/.github/workflows/create-wheels.yaml
name: Build sqlalchemy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/sqlalchemy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlalchemy.yml'
      - 'docs/packages/sqlalchemy.yaml'
      - 'patches/sqlalchemy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sqlalchemy.yml'
      - 'docs/packages/sqlalchemy.yaml'
      - 'patches/sqlalchemy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: sqlalchemy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build sqlalchemy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: sqlalchemy
      version: ${{ matrix.version }}
      # The patches skip ConcurrentAutomapTest.test_concurrent_automaps_w_configure, a test-side thread race.
      source: pypi-sdist
      patches: true
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Extensions are optional=; force the build to fail rather than silently
      # ship a mislabeled pure-Python wheel (CLAUDE.md gotcha 20).
      cibw-environment-linux: REQUIRE_SQLALCHEMY_CEXT=1
      # Upstream's test-command relies on `python -s` to import the built wheel
      # over the source tree, but -s doesn't reach xdist -n workers; the env var
      # does, so workers test the compiled wheel (CLAUDE.md gotcha 21).
      cibw-test-environment: PYTHONNOUSERSITE=1

  publish:
    name: Publish sqlalchemy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: sqlalchemy-${{ matrix.version }}-*-manylinux_riscv64
