---
# This workflow is based on the `build` job of
# https://github.com/phenobarbital/asyncdb/blob/2.16.3/.github/workflows/release.yml
name: Build asyncdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/asyncdb.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncdb.yml'
      - 'docs/packages/asyncdb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-asyncdb.yml'
      - 'docs/packages/asyncdb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: asyncdb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build asyncdb ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "asyncdb"
      version: "${{ matrix.version }}"
      repository: "${{ github.repository }}"
      ref: "${{ github.sha }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        export ASYNCDB_VERSION='${{ matrix.version }}'
        set -euo pipefail
        shopt -s dotglob
        rm -rf ./*
        git init -q .
        git remote add origin https://github.com/phenobarbital/asyncdb
        git fetch -q --depth=1 origin "$ASYNCDB_VERSION"
        git checkout -q FETCH_HEAD

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-output-dir: "dist"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ASYNCDB_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: asyncdb-${{ env.ASYNCDB_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: dist

      - name: Verify wheel tags and compiled Cython extension
        env:
          EXPECTED_CPYTHON_TAG: ${{ matrix.python }}
        run: |
          python3 - <<'EOF'
          import glob, os, zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheels were produced in dist/"

          found_cpython_tags = set()
          for whl in wheels:
              filename = whl.rsplit("/", 1)[-1]
              python_tag, _abi_tag, platform_tag = filename[:-4].split("-")[-3:]
              found_cpython_tags.add(python_tag)
              assert platform_tag.endswith("_riscv64"), (
                  f"unexpected platform tag for {whl}: {platform_tag}"
              )
              names = zipfile.ZipFile(whl).namelist()
              ext = [n for n in names
                     if n.startswith("asyncdb/utils/types.") and n.endswith(".so")]
              assert ext, f"compiled Cython extension (.so) missing in {whl}"
              print(f"OK {whl}: {ext[0]} [{python_tag}-{platform_tag}]")

          assert found_cpython_tags == {os.environ["EXPECTED_CPYTHON_TAG"]}, found_cpython_tags
          EOF

  publish:
    name: Publish asyncdb ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: asyncdb-${{ matrix.version }}-*-manylinux_riscv64
