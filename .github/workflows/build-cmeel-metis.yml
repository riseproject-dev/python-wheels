---
# This workflow is based on: https://github.com/cmake-wheel/cmeel-metis/blob/v5.2.1.1.c0/.github/workflows/release.yml
name: Build cmeel-metis wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cmeel-metis.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-metis.yml'
      - 'docs/packages/cmeel-metis.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cmeel-metis.yml'
      - 'docs/packages/cmeel-metis.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cmeel-metis
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cmeel-metis ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      CMEEL_METIS_VERSION: ${{ matrix.version }}

    steps:
      # has-sitelib = false: the wheel holds no Python extension, so one
      # py3-none wheel covers every interpreter.
      - name: Checkout cmeel-metis v${{ env.CMEEL_METIS_VERSION }}.c0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cmake-wheel/cmeel-metis
          ref: v${{ env.CMEEL_METIS_VERSION }}.c0
          submodules: true
          persist-credentials: false

      - name: Patch METIS's -march=native for riscv64
        run: |
          # The wrapper's own CMakeLists.txt already PATCH_COMMANDs the
          # fetched KarypisLab/METIS v5.2.1 tarball to bump its bundled
          # cmake_minimum_required from 2.8 to 3.10 and wire in the real
          # cmeel-gklib dependency (target_link_libraries(metis PUBLIC
          # GKlib)). That patch never touches METIS's OWN bundled copy of
          # GKlib's old build config (conf/gkbuild.cmake), confirmed
          # against the real v5.2.1 source to unconditionally append
          # -march=native on GCC with zero architecture gating at all
          # (unlike GKlib's own current GKlibSystem.cmake, which at least
          # keys NO_X86 off CMAKE_SYSTEM_PROCESSOR, even though that flag
          # only gates one helper app there too) -- the exact failure mode
          # cmeel-gklib already hit and fixed: riscv64 GCC rejects
          # -march=native outright ("ISA string must begin with rv32 or
          # rv64"), on every C file in libmetis, not one optional tool.
          # Extend the existing PATCH_COMMAND with the same scoping
          # cmeel-gklib's own fix used for GKlibSystem.cmake's PPC branch,
          # instead of leaving it as the unconditional VALGRIND-vs-else
          # fallback upstream wrote assuming x86.
          cat > metis-riscv64-patches.sh <<'SCRIPT'
          #!/bin/sh
          set -e
          sed -i.bak 's/VERSION 2.8/VERSION 3.10/' CMakeLists.txt
          echo 'target_link_libraries(metis PUBLIC GKlib)' >> libmetis/CMakeLists.txt
          sed -i '/-march=x86-64 -mtune=generic/{n;s/^else()$/elseif(CMAKE_SYSTEM_PROCESSOR MATCHES "(x86)|(X86)|(amd64)|(AMD64)")/}' conf/gkbuild.cmake
          SCRIPT
          chmod +x metis-riscv64-patches.sh
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("CMakeLists.txt")
          text = p.read_text()
          old = (
              '  PATCH_COMMAND\n'
              '    "sh" "-c"\n'
              '    "sed -i.bak \'s/VERSION 2.8/VERSION 3.10/\' CMakeLists.txt '
              '&& echo \'target_link_libraries(metis PUBLIC GKlib)\' >> '
              'libmetis/CMakeLists.txt"\n'
          )
          assert old in text, "expected cmeel-metis PATCH_COMMAND block not found; wrapper CMakeLists.txt may have changed upstream"
          new = '  PATCH_COMMAND sh ${CMAKE_CURRENT_SOURCE_DIR}/metis-riscv64-patches.sh\n'
          p.write_text(text.replace(old, new, 1))
          PYEOF
          cat CMakeLists.txt

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: cp312-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: CMEEL_LOG_LEVEL=DEBUG
          # cmeel installs into a shared prefix with an $ORIGIN RPATH it sets
          # itself.
          CIBW_REPAIR_WHEEL_COMMAND: ""

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert "cmeel.prefix/lib/libmetis.so" in names, names
          assert "cmeel.prefix/include/metis.h" in names, names
          assert "cmeel.prefix/bin/gpmetis" in names, names
          EOF

      - name: Smoke-test the built library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          # gotcha 234: stock Ubuntu 24.04 apt pip (24.0) has zero manylinux_*_riscv64
          # tags, so it rejects the riscv64 wheel outright without upgrading first.
          pip install -q --upgrade pip
          pip install -q wheelhouse/*.whl
          python3 -c "
          import ctypes, pathlib, sysconfig
          lib = pathlib.Path(sysconfig.get_paths()['purelib']) / 'cmeel.prefix/lib/libmetis.so'
          handle = ctypes.CDLL(str(lib))
          handle.METIS_NodeND
          print(lib)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cmeel-metis-${{ env.CMEEL_METIS_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cmeel-metis ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cmeel-metis-${{ matrix.version }}-py3-none-manylinux_riscv64
