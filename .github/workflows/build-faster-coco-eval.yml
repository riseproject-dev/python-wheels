---
# This workflow is based on: https://github.com/MiXaiLL76/faster_coco_eval/blob/1.8.0/.github/workflows/build.yml
name: Build faster-coco-eval wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/faster-coco-eval.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-faster-coco-eval.yml'
      - 'docs/packages/faster-coco-eval.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-faster-coco-eval.yml'
      - 'docs/packages/faster-coco-eval.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: faster-coco-eval
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build faster-coco-eval ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: faster-coco-eval
      version: ${{ matrix.version }}
      repository: MiXaiLL76/faster_coco_eval
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy is both a build and a runtime requirement, and only our
      # registry has it for riscv64.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      # Mirrors upstream's own unittest.yml (`pip install
      # "<sdist>[tests]"` + `pytest`); the `tests` extra's
      # `pycocotools ; python_version < "3.13"` marker keeps it off
      # cp313+, matching upstream, and pycocotools is on our registry too.
      cibw-test-extras: tests
      cibw-test-command: pytest {package}/tests
      timeout-minutes: 90

  publish:
    name: Publish faster-coco-eval ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: faster-coco-eval-${{ matrix.version }}-*-manylinux_riscv64
