---
# Based on the `Build` job of
# https://github.com/predict-idlab/tsdownsample/blob/567f68f5f5b82ad936e6c88715d65e9bc090ff70/.github/workflows/ci-tsdownsample.yml
name: Build tsdownsample wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tsdownsample.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tsdownsample.yml'
      - 'docs/packages/tsdownsample.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tsdownsample.yml'
      - 'docs/packages/tsdownsample.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tsdownsample
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tsdownsample ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tsdownsample
      version: ${{ matrix.version }}
      repository: predict-idlab/tsdownsample
      ref: 567f68f5f5b82ad936e6c88715d65e9bc090ff70
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream cuts releases without git tags (`git ls-remote --tags` tops out at
      # v0.1.4.1); this commit's tree is byte-identical to the released 0.1.5.1
      # sdist. Update alongside the package version for a newer release.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # argminmax's default `nightly_simd` feature (pulled in unconditionally
      # by downsample_rs) declares `#![feature(cfg_version)]` etc. for every
      # target, not just x86/arm, so a nightly toolchain is required to
      # compile at all, even on riscv64 where the SIMD kernels themselves
      # compile out via `cfg(target_arch = ...)` to the scalar fallback.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly-2026-09-08
      # The checkout's own `rust-toolchain` file pins an undated (floating)
      # "nightly"; RUSTUP_TOOLCHAIN outranks that file so the build actually
      # uses the pinned date installed above instead of fetching whatever
      # nightly happens to be current at build time.
      cibw-environment-linux: >-
        PATH="$PATH:$HOME/.cargo/bin"
        RUSTUP_TOOLCHAIN=nightly-2026-09-08
      # Mirrors `make test` (coverage flags dropped - irrelevant to a wheel
      # test). --benchmark-skip needs pytest-benchmark installed just to
      # recognize the flag; tests/test_rust_mods.py and test_tsdownsample.py
      # import test_config.py as a bare top-level module, which needs tests/
      # itself as the invocation dir (CIBW_TEST_SOURCES stages it that way).
      cibw-test-requires: pytest pytest-benchmark
      cibw-test-sources: tests
      cibw-test-command: pytest {package}/tests --benchmark-skip
      timeout-minutes: 60

  publish:
    name: Publish tsdownsample ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tsdownsample-${{ matrix.version }}-*-manylinux_riscv64
