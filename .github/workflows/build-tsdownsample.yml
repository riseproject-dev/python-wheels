---
# Based on the `Build` job of
# https://github.com/predict-idlab/tsdownsample/blob/567f68f5f5b82ad936e6c88715d65e9bc090ff70/.github/workflows/ci-tsdownsample.yml
name: Build tsdownsample wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tsdownsample version to build (e.g. 0.1.5.1)'
        required: true
        default: '0.1.5.1'
  pull_request:
    paths:
      - '.github/workflows/build-tsdownsample.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.5.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TSDOWNSAMPLE_VERSION: ${{ inputs.version || '0.1.5.1' }}
  # Upstream cuts releases without git tags (`git ls-remote --tags` tops out at
  # v0.1.4.1); this commit's tree is byte-identical to the released 0.1.5.1
  # sdist. Update alongside TSDOWNSAMPLE_VERSION for a newer release.
  TSDOWNSAMPLE_REF: 567f68f5f5b82ad936e6c88715d65e9bc090ff70
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tsdownsample ${{ inputs.version || '0.1.5.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # pyo3 builds one wheel per interpreter here (no abi3 feature).
        # Upstream doesn't publish a cp314t wheel either (no Py_GIL_DISABLED
        # support declared), so it's dropped to match.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout tsdownsample ${{ env.TSDOWNSAMPLE_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: predict-idlab/tsdownsample
          ref: ${{ env.TSDOWNSAMPLE_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # argminmax's default `nightly_simd` feature (pulled in unconditionally
          # by downsample_rs) declares `#![feature(cfg_version)]` etc. for every
          # target, not just x86/arm, so a nightly toolchain is required to
          # compile at all, even on riscv64 where the SIMD kernels themselves
          # compile out via `cfg(target_arch = ...)` to the scalar fallback.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly-2026-09-08
          # The checkout's own `rust-toolchain` file pins an undated (floating)
          # "nightly"; RUSTUP_TOOLCHAIN outranks that file so the build actually
          # uses the pinned date installed above instead of fetching whatever
          # nightly happens to be current at build time.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            RUSTUP_TOOLCHAIN=nightly-2026-09-08
          # Mirrors `make test` (coverage flags dropped - irrelevant to a wheel
          # test). --benchmark-skip needs pytest-benchmark installed just to
          # recognize the flag; tests/test_rust_mods.py and test_tsdownsample.py
          # import test_config.py as a bare top-level module, which needs tests/
          # itself as the invocation dir (CIBW_TEST_SOURCES stages it that way).
          CIBW_TEST_REQUIRES: pytest pytest-benchmark
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: pytest {package}/tests --benchmark-skip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tsdownsample-${{ env.TSDOWNSAMPLE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tsdownsample ${{ inputs.version || '0.1.5.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tsdownsample-${{ inputs.version || '0.1.5.1' }}-*-manylinux_riscv64
