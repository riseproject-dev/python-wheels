---
# This workflow is based on: https://github.com/jeffdaily/parasail-python/blob/v1.3.4c1/.github/workflows/wheels.yml
name: Build parasail wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/parasail.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-parasail.yml'
      - 'docs/packages/parasail.yaml'
      - 'patches/parasail/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-parasail.yml'
      - 'docs/packages/parasail.yaml'
      - 'patches/parasail/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: parasail
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build parasail ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "parasail"
      version: "${{ matrix.version }}"
      # The 1.3.4 release was never retagged off its "c1" candidate tag.
      repository: "jeffdaily/parasail-python"
      ref: "v${{ matrix.version }}c1"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Without it pip takes PyPI's newer sdist-only numpy over our
      # registry's riscv64 wheels and source-builds it (gotcha 210).
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      # setup.py fetches jeffdaily/parasail's C library from GitHub at build
      # time (upstream has no version pin here either - it always builds
      # against the C library's master branch, even for tagged releases).
      cibw-test-command: "python -m unittest discover {project}/tests"

  publish:
    name: Publish parasail ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: parasail-${{ matrix.version }}-*-manylinux_riscv64
