---
# This workflow is based on the `build` job of
# https://github.com/pyansys/pymapdl-reader/blob/v0.56.0/.github/workflows/ci.yml
# and the [tool.cibuildwheel] table of its pyproject.toml.
name: Build ansys-mapdl-reader wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ansys-mapdl-reader.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ansys-mapdl-reader.yml'
      - 'docs/packages/ansys-mapdl-reader.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ansys-mapdl-reader.yml'
      - 'docs/packages/ansys-mapdl-reader.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ansys-mapdl-reader
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ansys-mapdl-reader ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ansys-mapdl-reader"
      version: "${{ matrix.version }}"
      repository: "pyansys/pymapdl-reader"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,vtk,scipy,matplotlib,pillow,contourpy,kiwisolver"
      # ansys-mapdl-core only feeds the suite's skip_no_ansys guard, which needs a local MAPDL install.
      cibw-test-requires: "matplotlib pytest scipy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ANSYS_MAPDL_READER_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ansys-mapdl-reader-${{ env.ANSYS_MAPDL_READER_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extensions and license made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          assert len(sys.argv) == 2, sys.argv[1:]
          whl = sys.argv[1]
          names = zipfile.ZipFile(whl).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names
                  if n.startswith("ansys/mapdl/reader/") and n.endswith(".so")}
          assert exts == {"_archive", "_reader", "_relaxmidside", "_cellqual", "_binary_reader"}, exts
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
          print(whl, "ok")
          EOF

  publish:
    name: Publish ansys-mapdl-reader ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ansys-mapdl-reader-${{ matrix.version }}-*-manylinux_riscv64
