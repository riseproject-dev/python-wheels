---
# capstone6pwndbg republishes capstone-engine/capstone's own bindings/python
# (as a git submodule) under a different PyPI name via python-rename.patch,
# so we build from pwndbg/capstone6pwndbg's own repo+patch, the way its own
# release workflow does:
#   https://github.com/pwndbg/capstone6pwndbg/blob/v8.0.0/.github/workflows/publish.yml
name: Build capstone6pwndbg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/capstone6pwndbg.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-capstone6pwndbg.yml'
      - 'docs/packages/capstone6pwndbg.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-capstone6pwndbg.yml'
      - 'docs/packages/capstone6pwndbg.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: capstone6pwndbg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build capstone6pwndbg ${{ matrix.version }} ${{ matrix.PYTHON.TAG }}-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
        # setup.py forces has_ext_modules + py_limited_api=cp38 unless built
        # under Py_GIL_DISABLED (no limited API there yet), matching upstream's
        # own two wheel shapes per platform: one cp38-abi3 wheel (built here
        # with RISE's own cp312 floor) plus one free-threaded cp314-cp314t
        # wheel.
        PYTHON:
          - { BUILD: cp312, TAG: cp38-abi3 }
          - { BUILD: cp314t, TAG: cp314-cp314t }

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "capstone6pwndbg"
      version: "${{ matrix.version }}"
      repository: "pwndbg/capstone6pwndbg"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.PYTHON.TAG }}-${{ matrix.libc }}_riscv64"
      checkout-submodules: "recursive"
      pre-build: |-
        cd capstone && git apply ../python-rename.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-package-dir: "capstone/bindings/python"
      cibw-build: "${{ matrix.PYTHON.BUILD }}-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # setup.py shells out to `cmake` directly; it's not a declared build dep.
      cibw-before-build: "pip install cmake"
      # Upstream's own bindings/python/tests does 'from capstone import *',
      # the pre-rename module name, and test_compatibility_layer.py imports
      # pre-v6 compat shims python-rename.patch deletes outright - neither
      # runs unmodified against the renamed capstone6pwndbg module, so this
      # smoke-tests the installed module directly, reusing upstream's own
      # known-good x86/riscv64 test vectors (tests/test_lite.py,
      # tests/test_riscv_reg_access.py).
      cibw-test-command: "python3 -c \"import capstone6pwndbg as cs, capstone6pwndbg.riscv as csr; m = cs.Cs(cs.CS_ARCH_X86, cs.CS_MODE_64); i = list(m.disasm(b'\\x55\\x48\\x8b\\x05\\xb8\\x13\\x00\\x00', 0x1000)); assert len(i) == 2 and i[0].mnemonic == 'push', i; m = cs.Cs(cs.CS_ARCH_RISCV, cs.CS_MODE_RISCV64); m.detail = True; i = list(m.disasm(b'\\x13\\x85\\xa5\\x00', 0)); assert len(i) == 1 and i[0].mnemonic == 'addi', i; r, w = i[0].regs_access(); assert csr.RISCV_REG_X11 in r and csr.RISCV_REG_X10 in w, (r, w); print('capstone6pwndbg smoke test ok')\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
        # setup.py forces has_ext_modules + py_limited_api=cp38 unless built
        # under Py_GIL_DISABLED (no limited API there yet), matching upstream's
        # own two wheel shapes per platform: one cp38-abi3 wheel (built here
        # with RISE's own cp312 floor) plus one free-threaded cp314-cp314t
        # wheel.
        PYTHON:
          - { BUILD: cp312, TAG: cp38-abi3 }
          - { BUILD: cp314t, TAG: cp314-cp314t }
    env:
      CAPSTONE6PWNDBG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: capstone6pwndbg-${{ env.CAPSTONE6PWNDBG_VERSION }}-${{ matrix.PYTHON.TAG }}-${{ matrix.libc }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries libcapstone
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("capstone6pwndbg/lib/libcapstone.so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish capstone6pwndbg ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: capstone6pwndbg-${{ matrix.version }}-*riscv64
