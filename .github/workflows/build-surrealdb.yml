---
# This workflow replaces the `linux`/`linux-aarch64` jobs of surrealdb.py's own
# .github/workflows/build.yml (PyO3/maturin-action, no riscv64 target there) with
# cibuildwheel driving the same maturin build backend, the shape this repo uses for
# every maturin/pyo3 port since maturin-action itself has no manylinux_riscv64 image.
name: Build surrealdb wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/surrealdb.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-surrealdb.yml'
      - 'docs/packages/surrealdb.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-surrealdb.yml'
      - 'docs/packages/surrealdb.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: surrealdb
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build surrealdb ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 480

    env:
      SURREALDB_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout surrealdb.py v${{ env.SURREALDB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: surrealdb/surrealdb.py
          ref: v${{ env.SURREALDB_VERSION }}
          persist-credentials: false

      - name: Write the wheel test
        run: |
          cat > test_surrealdb_embedded.py <<'EOF'
          import surrealdb._surrealdb_ext as ext
          assert ext.__file__.endswith('.so'), ext.__file__

          from surrealdb import Surreal

          with Surreal("memory") as db:
              db.use("test", "test")
              db.signin({"username": "root", "password": "root"})
              created = db.create("person", {"name": "Jane", "age": 30})
              assert created["name"] == "Jane", created
              people = db.select("person")
              assert len(people) == 1 and people[0]["age"] == 30, people
          EOF

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ARCHS: riscv64
          # pyo3 carries `abi3-py39` workspace-wide (Cargo.toml), so every interpreter
          # yields the same cp39-abi3 wheel: cibuildwheel compiles once on cp312 and
          # reuses it for cp313/cp314 while still running the test suite on each.
          # cp314t is skipped: the stable ABI a wheel like this ships has no
          # free-threaded build.
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          # rustup.rs ships no riscv64 musl toolchain.
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=aiohttp,pydantic-core,websockets
          CIBW_TEST_SOURCES: test_surrealdb_embedded.py
          CIBW_TEST_COMMAND: python test_surrealdb_embedded.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surrealdb-${{ env.SURREALDB_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish surrealdb ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: surrealdb-${{ matrix.version }}-*-manylinux_riscv64
