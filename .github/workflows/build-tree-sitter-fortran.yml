---
# Based on upstream's wheel builder:
#   https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
name: Build tree-sitter-fortran wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tree-sitter-fortran.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-fortran.yml'
      - 'docs/packages/tree-sitter-fortran.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tree-sitter-fortran.yml'
      - 'docs/packages/tree-sitter-fortran.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tree-sitter-fortran
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tree-sitter-fortran ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tree-sitter-fortran
      version: ${{ matrix.version }}
      repository: stadelmanma/tree-sitter-fortran
      ref: v${{ matrix.version }}
      artifact-tag: cp39-abi3-manylinux_riscv64
      cibw-build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
      cibw-test-requires: tree-sitter~=0.21
      cibw-test-command: >-
        python -c "import tree_sitter_fortran;
        from tree_sitter import Language, Parser;
        t = Parser(Language(tree_sitter_fortran.language())).parse(b'PROGRAM TEST\nEND PROGRAM');
        assert t.root_node.type == 'translation_unit' and not t.root_node.has_error"
      timeout-minutes: 120

  publish:
    name: Publish tree-sitter-fortran ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tree-sitter-fortran-${{ matrix.version }}-*-manylinux_riscv64
