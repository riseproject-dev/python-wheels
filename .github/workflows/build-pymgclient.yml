---
# This workflow is based on the Linux leg of upstream's own
# .github/workflows/reusable_buildtest.yml (build_and_test_linux).
name: Build pymgclient wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymgclient.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymgclient.yml'
      - 'docs/packages/pymgclient.yaml'
      - 'patches/pymgclient/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymgclient.yml'
      - 'docs/packages/pymgclient.yaml'
      - 'patches/pymgclient/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymgclient
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymgclient ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymgclient"
      version: "${{ matrix.version }}"
      repository: "memgraph/pymgclient"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pymgclient/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream always ships --static-ssl, linked against a hand-built OpenSSL
      # baked into their own manylinux_2_34 image (tools/build-openssl.sh). The
      # riscv64 image carries no such static archives, so link the image's own
      # OpenSSL dynamically instead (PYMGCLIENT_STATIC_OPENSSL=0, setup.py's own
      # escape for this) and let auditwheel vendor it, same as build-ssh2-python.yml.
      cibw-before-all-linux: "dnf -y install openssl-devel && cp /usr/share/licenses/openssl-libs/LICENSE.txt {project}/LICENSE.openssl"
      cibw-environment-linux: "PYMGCLIENT_STATIC_OPENSSL=0"
      cibw-test-requires: "pytest pyopenssl networkx tzdata"
      # The rest of test/ needs a live Memgraph server (upstream runs it as a
      # Docker sidecar); these three don't, and still exercise the real
      # extension: arg validation, a refused-connection TransientError, and the
      # exception hierarchy.
      cibw-test-sources: "test"
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(p.name for p in m.files('pymgclient') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.openssl'], f\" && python -m pytest test/test_connection.py::test_connect_args_validation test/test_connection.py::test_connection_refused_is_transient test/test_connection.py::test_transient_error_hierarchy"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYMGCLIENT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pymgclient-${{ env.PYMGCLIENT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension and OpenSSL made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("mgclient/_mgclient.") and n.endswith(".so") for n in names), whl
              assert any(n.startswith("pymgclient.libs/libssl") for n in names), whl
              assert any(n.startswith("pymgclient.libs/libcrypto") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pymgclient ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymgclient-${{ matrix.version }}-*-manylinux_riscv64
