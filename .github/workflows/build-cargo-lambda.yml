---
# This workflow is based on the `release-linux` job of
# https://github.com/cargo-lambda/cargo-lambda/blob/v1.9.2/.github/workflows/release.yml
name: Build cargo-lambda wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cargo-lambda.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cargo-lambda.yml'
      - 'docs/packages/cargo-lambda.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cargo-lambda.yml'
      - 'docs/packages/cargo-lambda.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cargo-lambda
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build cargo-lambda ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      CARGO_LAMBDA_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cargo-lambda v${{ env.CARGO_LAMBDA_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cargo-lambda/cargo-lambda
          ref: v${{ env.CARGO_LAMBDA_VERSION }}
          persist-credentials: false

      # Upstream cross-builds static musl in x86_64 rust-musl-cross images; build glibc
      # natively, overriding pyproject's maturin<1.9 pin, which has no riscv64 asset (gotcha 344).
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: '1.15.0'
          command: build
          target: riscv64gc-unknown-linux-gnu
          args: --release -o dist --strip -m crates/cargo-lambda-cli/Cargo.toml
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-lambda-${{ env.CARGO_LAMBDA_VERSION }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test cargo-lambda ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    env:
      CARGO_LAMBDA_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-lambda-${{ env.CARGO_LAMBDA_VERSION }}-manylinux_riscv64
          path: wheelhouse

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install wheel
        run: uv pip install --reinstall --find-links wheelhouse "cargo-lambda==${CARGO_LAMBDA_VERSION}"

      - name: Test wheel
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          cargo lambda --version | grep -F "${CARGO_LAMBDA_VERSION}"
          cargo lambda --help >/dev/null
          python -m ziglang version

          cargo lambda new hello-lambda -y
          cd hello-lambda
          cargo lambda build --release --arm64
          readelf -h target/lambda/hello-lambda/bootstrap | grep 'Machine:.*AArch64'
          cargo lambda build --release --x86-64
          readelf -h target/lambda/hello-lambda/bootstrap | grep 'Machine:.*X86-64'
          cargo lambda build --release --arm64 --output-format zip
          python -m zipfile -l target/lambda/hello-lambda/bootstrap.zip | grep -w bootstrap

  publish:
    name: Publish cargo-lambda ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cargo-lambda-${{ matrix.version }}-manylinux_riscv64
