---
# Based on the `linux-release` job of
# https://github.com/duckdb/duckdb/blob/v1.5.6/.github/workflows/Main.yml (`make release`
# builds build/release/duckdb; `tools/shell/tests` is upstream's own CLI test suite, run here
# the same way as Main.yml's "ARM64 tools tests" step). The duckdb-cli PyPI wheel is cut by
# DuckDB's own release tooling, not from anything in this repo, so the riscv64 binary here is
# repackaged straight into the real duckdb_cli/ wrapper downloaded unmodified from the
# matching PyPI release.
name: Build duckdb-cli wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/duckdb-cli.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-duckdb-cli.yml'
      - 'docs/packages/duckdb-cli.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-duckdb-cli.yml'
      - 'docs/packages/duckdb-cli.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: duckdb-cli
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build duckdb-cli ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440

    env:
      DUCKDB_CLI_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout duckdb v${{ env.DUCKDB_CLI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: duckdb/duckdb
          ref: v${{ env.DUCKDB_CLI_VERSION }}
          persist-credentials: false

      - name: Pull manylinux_riscv64 image
        run: docker pull "${MANYLINUX_RISCV64_IMAGE}"

      # No EXTENSION_CONFIGS/vcpkg: the default `make release` already statically links
      # core_functions/parquet/json/icu (extension/extension_config.cmake), the same set the
      # published duckdb wheel builds for riscv64, and nothing else needs an external package.
      - name: Build the duckdb binary and package the wheel
        run: |
          docker run --rm -v "$(pwd):/work" -w /work -e DUCKDB_CLI_VERSION "${MANYLINUX_RISCV64_IMAGE}" bash -c '
            set -euxo pipefail
            make release
            ./build/release/duckdb -c "PRAGMA platform; PRAGMA version;"

            pybin=/opt/python/cp312-cp312/bin
            "$pybin/pip" install -q wheel
            "$pybin/pip" download --no-deps --only-binary=:all: --dest refwheel \
              --platform manylinux2014_x86_64 --python-version 3.12 --implementation cp --abi none \
              "duckdb-cli==${DUCKDB_CLI_VERSION}"
            "$pybin/wheel" unpack -d refwheel refwheel/duckdb_cli-*.whl

            pkg="refwheel/duckdb_cli-${DUCKDB_CLI_VERSION}"
            distinfo="${pkg}/duckdb_cli-${DUCKDB_CLI_VERSION}.dist-info"
            cp build/release/duckdb "${pkg}/duckdb_cli/duckdb"
            chmod 755 "${pkg}/duckdb_cli/duckdb"
            sed -i "s/^Tag: .*/Tag: py3-none-manylinux_2_39_riscv64/" "${distinfo}/WHEEL"
            mkdir -p "${distinfo}/licenses"
            cp LICENSE "${distinfo}/licenses/LICENSE"
            rm -f "${distinfo}/RECORD"

            mkdir -p dist
            "$pybin/wheel" pack -d dist "$pkg"
          '

      - name: Check the wheel ships the riscv64 duckdb binary
        run: |
          python3 - dist/*.whl <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              assert sys.argv[1].endswith("-py3-none-manylinux_2_39_riscv64.whl"), sys.argv[1]
              bin_name = next(n for n in names if n == "duckdb_cli/duckdb")
              licenses = sorted(n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n)
              assert licenses == ["LICENSE"], licenses
              header = zf.read(bin_name)[:20]
              assert header[:4] == b"\x7fELF", header
              assert header[18] == 0xF3, header  # e_machine EM_RISCV
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: duckdb-cli-${{ env.DUCKDB_CLI_VERSION }}-py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test duckdb-cli ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      DUCKDB_CLI_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout duckdb v${{ env.DUCKDB_CLI_VERSION }} (tools/shell/tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: duckdb/duckdb
          ref: v${{ env.DUCKDB_CLI_VERSION }}
          persist-credentials: false

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: duckdb-cli-${{ env.DUCKDB_CLI_VERSION }}-py3-none-manylinux_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: |
          uv pip install --reinstall --no-index --find-links . duckdb-cli
          uv pip install pytest

      # Mirrors upstream's own "ARM64 tools tests" step in Main.yml
      # (`python -m pytest tools/shell/tests --shell-binary build/release/duckdb`).
      - name: Test wheel
        run: python -m pytest tools/shell/tests --shell-binary "$(command -v duckdb)"

  publish:
    name: Publish duckdb-cli ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: duckdb-cli-${{ matrix.version }}-py3-none-manylinux_riscv64
