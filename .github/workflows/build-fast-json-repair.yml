---
# This workflow is based on the `quality` and `linux` jobs of
# https://github.com/Rusty-Ports/fast_json_repair/blob/v0.2.3/.github/workflows/build.yml
name: Build fast-json-repair wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fast-json-repair.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-json-repair.yml'
      - 'docs/packages/fast-json-repair.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-json-repair.yml'
      - 'docs/packages/fast-json-repair.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fast-json-repair
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fast-json-repair ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    env:
      FAST_JSON_REPAIR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fast_json_repair v${{ env.FAST_JSON_REPAIR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Rusty-Ports/fast_json_repair
          ref: v${{ env.FAST_JSON_REPAIR_VERSION }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --out dist -i python3.11
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: false

      - name: Test wheel
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_ONLY_BINARY: orjson
        run: |
          uv pip install dist/*.whl pytest
          pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fast-json-repair-${{ env.FAST_JSON_REPAIR_VERSION }}-cp311-abi3-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish fast-json-repair ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: fast-json-repair-${{ matrix.version }}-*-manylinux_riscv64
