---
# This workflow is based on the `build_wheels` job of
# https://github.com/MikePopoloski/slang/blob/v12.0/.github/workflows/python-dist.yml
name: Build pyslang wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyslang.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyslang.yml'
      - 'docs/packages/pyslang.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyslang.yml'
      - 'docs/packages/pyslang.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # external/CMakeLists.txt FetchContent-pulls fmt and bindings/CMakeLists.txt
  # pybind11; bump these alongside those pins.
  FMT_TAG: '12.1.0'
  PYBIND11_TAG: v3.0.4
  BS_THREAD_POOL_TAG: v5.1.0

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyslang
      version: ${{ inputs.version }}

  # v12.0.0 moved bindings/CMakeLists.txt from pybind11 to nanobind's split mode
  # (nanobind_add_module(... BACKEND_MODULE nanobind_backend STABLE_ABI_VERSION
  # 3.11)): pyproject.toml now sets `wheel.py-api = "cp311"`, so cibuildwheel
  # produces a single cp311-abi3 wheel that covers every newer non-free-threaded
  # interpreter (CLAUDE.md gotcha 11), and upstream's own python-dist.yml builds
  # it once per OS with no interpreter matrix at all. Building it on cp312+
  # here (as the old per-interpreter pybind11 matrix did) would tag the wheel
  # cp311-abi3 while compiling it against newer headers than the tag claims
  # (gotcha 96), so build on cp311, the floor the tag actually promises.
  #
  # Free-threaded (cp314t) is dropped: nanobind-backend>=1.0 publishes no
  # cp313t/cp314t wheel on *any* platform (only cp315t), so pyslang ships no
  # free-threaded wheel upstream either (the litellm/gotcha-11 "abi3-only, no
  # cp314t variant" shape) -- this is an upstream gap, not riscv64-specific.
  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyslang ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyslang"
      version: "${{ matrix.version }}"
      repository: "MikePopoloski/slang"
      ref: ''
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 360
      checkout-fetch-depth: 0
      pre-build: |-
        export FMT_TAG=12.1.0
        export PYBIND11_TAG=v3.0.4
        export BS_THREAD_POOL_TAG=v5.1.0
        ref="v${PYSLANG_VERSION%.0}"

        git fetch -q --no-tags origin "$ref"
        git checkout -q --detach FETCH_HEAD

        set -euo pipefail
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/fmtlib/fmt/${FMT_TAG}/LICENSE" -o LICENSE.fmt
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/${PYBIND11_TAG}/LICENSE" -o LICENSE.pybind11
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/bshoshany/thread-pool/${BS_THREAD_POOL_TAG}/LICENSE.txt" -o LICENSE.bs-thread-pool
        cp LICENSES/BSL-1.0.txt LICENSE.boost-headers

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp311-manylinux_riscv64"
      cibw-environment-linux: "SKBUILD_WHEEL_LICENSE_FILES=\"LICENSE;LICENSE.boost-headers;LICENSE.bs-thread-pool;LICENSE.fmt;LICENSE.pybind11\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYSLANG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyslang-${{ env.PYSLANG_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          # nanobind's split mode (stable ABI) names the extension
          # "<module>.abi3.so" with no interpreter/platform tag baked in -- that
          # information already lives in the wheel's own filename instead.
          assert exts == ["pyslang/pyslang.abi3.so"], exts
          assert any(n.endswith(".pyi") for n in names), names
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.boost-headers", "LICENSE.bs-thread-pool",
                              "LICENSE.fmt", "LICENSE.pybind11"}, licences
          EOF

  publish:
    name: Publish pyslang ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyslang-${{ matrix.version }}-*-manylinux_riscv64
