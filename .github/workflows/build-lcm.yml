---
# This workflow is based on the unix job of
# https://github.com/lcm-proj/lcm/blob/v1.5.2/.github/workflows/build_wheels.yml
name: Build lcm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lcm.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lcm.yml'
      - 'docs/packages/lcm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lcm.yml'
      - 'docs/packages/lcm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lcm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lcm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: lcm
      version: ${{ matrix.version }}
      repository: lcm-proj/lcm
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Rocky 10 (the riscv64 manylinux image) has no java-1.8.0-openjdk-devel
      # (RHEL 10 dropped JDK 8 packaging); CMake's find_package(Java 1.8) only
      # needs a floor, so java-21-openjdk-devel satisfies it and keeps the Java
      # bindings (lcm-spy, lcm-logplayer-gui) that upstream's own before-all
      # enables on manylinux. musllinux keeps upstream's own empty before-all.
      cibw-before-all-linux: |
        if command -v dnf > /dev/null; then
          dnf install -y -q glib2-devel java-21-openjdk-devel
        fi
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # _lcm has no Py_mod_gil slot, so cp314t's GIL-re-enable warning trips
      # upstream's filterwarnings=["error"] at collection time (gotcha 127).
      cibw-test-environment: PYTHON_GIL=1
      cibw-test-requires: pytest
      cibw-test-command: pytest {project}
      timeout-minutes: 60

  publish:
    name: Publish lcm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lcm-${{ matrix.version }}-*riscv64
