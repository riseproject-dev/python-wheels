---
# This workflow is based on the unix job of
# https://github.com/lcm-proj/lcm/blob/v1.5.2/.github/workflows/build_wheels.yml
name: Build lcm wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lcm.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lcm.yml'
      - 'docs/packages/lcm.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lcm.yml'
      - 'docs/packages/lcm.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lcm
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lcm ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      LCM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lcm v${{ env.LCM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lcm-proj/lcm
          ref: v${{ env.LCM_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Rocky 10 (the riscv64 manylinux image) has no java-1.8.0-openjdk-devel
          # (RHEL 10 dropped JDK 8 packaging); CMake's find_package(Java 1.8) only
          # needs a floor, so java-21-openjdk-devel satisfies it and keeps the Java
          # bindings (lcm-spy, lcm-logplayer-gui) that upstream's own before-all
          # enables on manylinux. musllinux keeps upstream's own empty before-all.
          CIBW_BEFORE_ALL_LINUX: |
            if command -v dnf > /dev/null; then
              dnf install -y -q glib2-devel java-21-openjdk-devel
            fi
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # _lcm has no Py_mod_gil slot, so cp314t's GIL-re-enable warning trips
          # upstream's filterwarnings=["error"] at collection time (gotcha 127).
          CIBW_TEST_ENVIRONMENT: PYTHON_GIL=1
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lcm-${{ matrix.version }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lcm ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: lcm-${{ matrix.version }}-*riscv64
