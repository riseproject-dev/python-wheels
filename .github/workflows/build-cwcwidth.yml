---
# This workflow is based on upstream's own wheel builder:
#   https://github.com/sebastinas/cwcwidth/blob/v0.1.12/.github/workflows/publish-twine.yaml
name: Build cwcwidth wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cwcwidth.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cwcwidth.yml'
      - 'docs/packages/cwcwidth.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cwcwidth.yml'
      - 'docs/packages/cwcwidth.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cwcwidth
      version: ${{ inputs.version }}

  # setup.py hardcodes py_limited_api="cp311" whenever USE_LIMITED_API is set, so
  # the wheel is tagged cp311-abi3 regardless of which interpreter builds it.
  # Build on cp311 itself (CLAUDE.md gotcha 96) rather than our usual cp312 floor,
  # then reuse+test that wheel on cp312/cp313/cp314 (find_compatible_wheel).
  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build cwcwidth ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    env:
      CWCWIDTH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cwcwidth v${{ env.CWCWIDTH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sebastinas/cwcwidth
          ref: v${{ env.CWCWIDTH_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: USE_LIMITED_API=1
          # tests/ is a package (has __init__.py): pytest's prepend import mode
          # would otherwise put the checkout root on sys.path[0] and shadow the
          # installed wheel with the uncompiled cwcwidth/ source tree.
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest tests -v
          CIBW_TEST_ENVIRONMENT: LC_ALL=C.UTF-8 LANG=C.UTF-8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cwcwidth-${{ env.CWCWIDTH_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Free-threaded wheel: setup.py's py_limited_api flag has no free-threaded ABI
  # to target, so this is an ordinary per-interpreter build.
  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build cwcwidth ${{ matrix.version }} cp314t-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    env:
      CWCWIDTH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cwcwidth v${{ env.CWCWIDTH_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sebastinas/cwcwidth
          ref: v${{ env.CWCWIDTH_VERSION }}
          persist-credentials: false

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: 'cp314t-*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest tests -v
          CIBW_TEST_ENVIRONMENT: LC_ALL=C.UTF-8 LANG=C.UTF-8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cwcwidth-${{ env.CWCWIDTH_VERSION }}-cp314t-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cwcwidth ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cwcwidth-${{ matrix.version }}-*-manylinux_riscv64
