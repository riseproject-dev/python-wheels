---
# This workflow is based on the `build_wheels` job of
# https://github.com/Ezibenroc/PyRoaringBitMap/blob/1.1.0/.github/workflows/buildwheels.yml
name: Build pyroaring wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyroaring.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroaring.yml'
      - 'docs/packages/pyroaring.yaml'
      - 'patches/pyroaring/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyroaring.yml'
      - 'docs/packages/pyroaring.yaml'
      - 'patches/pyroaring/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyroaring
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyroaring ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYROARING_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyroaring ${{ env.PYROARING_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Ezibenroc/PyRoaringBitMap
          ref: ${{ env.PYROARING_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The wheel statically links the bundled CRoaring amalgamation but ships only
      # pyroaring's own LICENSE.
      - name: Patch pyroaring source
        run: |
          git apply python-wheels/patches/pyroaring/${{ env.PYROARING_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream ships no cp314t riscv64 hypothesis wheel; ours supplies it. only-binary is
          # test-only (gotcha 12) so a missing wheel fails loudly instead of building the sdist.
          CIBW_TEST_ENVIRONMENT: 'PIP_ONLY_BINARY=hypothesis'
          CIBW_TEST_REQUIRES: hypothesis pytest
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m; n=sorted(p.name for p in m.files('pyroaring') if 'licenses/' in str(p)); assert n == ['LICENSE', 'LICENSE.CRoaring'], n" &&
            pytest {project}/test.py -v &&
            python {project}/cydoctest.py -v

      - name: Check the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyroaring.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyroaring-${{ env.PYROARING_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyroaring ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyroaring-${{ matrix.version }}-*-manylinux_riscv64
