---
# Based on https://github.com/mistralai/mistral-vibe/blob/v3.0.4/.github/workflows/release.yml
# (build-sdist and check-sdist jobs).
name: Build mistral-vibe wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mistral-vibe.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mistral-vibe.yml'
      - 'docs/packages/mistral-vibe.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mistral-vibe.yml'
      - 'docs/packages/mistral-vibe.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mistral-vibe
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build mistral-vibe ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      MISTRAL_VIBE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mistral-vibe v${{ env.MISTRAL_VIBE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mistralai/mistral-vibe
          ref: v${{ env.MISTRAL_VIBE_VERSION }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mistral-vibe-${{ env.MISTRAL_VIBE_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build mistral-vibe ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 720
    env:
      MISTRAL_VIBE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mistral-vibe v${{ env.MISTRAL_VIBE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mistralai/mistral-vibe
          ref: v${{ env.MISTRAL_VIBE_VERSION }}
          persist-credentials: false

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mistral-vibe-${{ env.MISTRAL_VIBE_VERSION }}-sdist
          path: sdist/

      # Extracted inside the checkout so the test step can reach upstream's
      # scripts/ci/validate-combined-wheel.py, which the sdist does not ship.
      - name: Extract sdist
        id: sdist_path
        run: |
          set -euo pipefail
          tar -xzf sdist/*.tar.gz -C sdist/
          echo "path=$(echo sdist/mistral_vibe-*/)" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ARCHS: riscv64
          # pyo3 is built with `abi3-py312`: one cp312-abi3 wheel, tested on each interpreter.
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_BUILD_FLAGS=--no-default-features
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_COMMAND: >-
            python {project}/scripts/ci/validate-combined-wheel.py
            && vibe --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mistral-vibe-${{ env.MISTRAL_VIBE_VERSION }}-cp312-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mistral-vibe ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mistral-vibe-${{ matrix.version }}-*-manylinux_riscv64
