---
# This workflow is based on the `build_wheels` job of
# https://github.com/pixeltable/pixeltable-pgserver/blob/v0.6.0/.github/workflows/build-and-test.yml
name: Build pixeltable-pgserver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pixeltable-pgserver.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pixeltable-pgserver.yml'
      - 'docs/packages/pixeltable-pgserver.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pixeltable-pgserver.yml'
      - 'docs/packages/pixeltable-pgserver.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pixeltable-pgserver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pixeltable-pgserver ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream skips cp314t*.
        python: ["cp312", "cp313", "cp314"]

    env:
      PIXELTABLE_PGSERVER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pixeltable-pgserver v${{ env.PIXELTABLE_PGSERVER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pixeltable/pixeltable-pgserver
          ref: v${{ env.PIXELTABLE_PGSERVER_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pixeltable-pgserver source
        run: git apply python-wheels/patches/pixeltable-pgserver/${{ env.PIXELTABLE_PGSERVER_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # initdb/postgres are non-PIE; keep their base above vm.mmap_min_addr once auditwheel's patchelf prepends a segment (gotcha 595).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            LDFLAGS="-Wl,-Ttext-segment=0x200000"
          # auditwheel grafts the image's libreadline/libtinfo (psql links them); ship their licence texts.
          CIBW_BEFORE_BUILD: >-
            for p in readline ncurses-libs; do
            srpm=$(rpm -q --qf '%{SOURCERPM}' $p);
            f=$(rpm -qa --qf '%{SOURCERPM} %{NAME}\n' | awk -v s=$srpm '$1==s{print $2}' | xargs rpm -q --licensefiles | grep -m1 -E '/(COPYING|LICENSE)[^/]*$');
            cp -v "$f" {project}/LICENSE.${p%-libs};
            done

      - name: Verify the wheel ships both postgres servers, pgvector and their licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import re, sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for inst in ("pginstall", "pginstall18"):
              assert f"pixeltable_pgserver/{inst}/bin/postgres" in names, inst
              assert f"pixeltable_pgserver/{inst}/lib/postgresql/vector.so" in names, inst

          grafted = {n.split("/")[-1] for n in names if n.startswith("pixeltable_pgserver.libs/") and not n.endswith("/")}
          unexpected = {g for g in grafted if not re.match(r"lib(pq|ecpg|ecpg_compat|pgtypes|readline|tinfo|ncursesw?)-", g)}
          assert not unexpected, unexpected

          lic = {n.split("/")[-1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert {"LICENSE", "LICENSE.postgresql", "LICENSE.pgvector", "LICENSE.readline", "LICENSE.ncurses"} <= lic, lic
          EOF
          mkdir wheel-check
          python3 -m zipfile -e wheelhouse/*.whl wheel-check
          for inst in pginstall pginstall18; do
            for exe in initdb postgres pg_ctl psql; do
              chmod +x "wheel-check/pixeltable_pgserver/$inst/bin/$exe"
              "wheel-check/pixeltable_pgserver/$inst/bin/$exe" --version
            done
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pixeltable-pgserver-${{ env.PIXELTABLE_PGSERVER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources (readline) for pixeltable-pgserver ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    env:
      PIXELTABLE_PGSERVER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: readline
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pixeltable-pgserver-${{ env.PIXELTABLE_PGSERVER_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish pixeltable-pgserver ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pixeltable-pgserver-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: pixeltable-pgserver-${{ matrix.version }}-gpl-sources
      gpl-sources-description: readline
