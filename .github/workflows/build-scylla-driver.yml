---
# This workflow is based on: https://github.com/scylladb/python-driver/blob/master/.github/workflows/lib-build.yml
name: Build scylla-driver wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/scylla-driver.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-scylla-driver.yml'
      - 'docs/packages/scylla-driver.yaml'
      - 'patches/scylla-driver/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scylla-driver.yml'
      - 'docs/packages/scylla-driver.yaml'
      - 'patches/scylla-driver/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: scylla-driver
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build scylla-driver ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "scylla-driver"
      version: "${{ matrix.version }}"
      repository: "scylladb/python-driver"
      ref: "${{ matrix.version }}-scylla"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240

      # auditwheel bundles the image's libev (and, from 3.29.12, liblz4), whose notices the
      # wheel would otherwise drop.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build"
      # Upstream's before-build, minus the AlmaLinux key and the packages Rocky 10 preinstalls.
      # lz4-devel is for the cassandra.cython_lz4 extension 3.29.12 added.
      cibw-before-build: "rm -rf ~/.pyxbld && yum install -y libev libev-devel lz4-devel"
      # The three CASS_DRIVER/CFLAGS values are upstream's [tool.cibuildwheel] environment,
      # which this replaces; EXTENSIONS_ARE_MUST is what fails a degraded pure-Python build.
      cibw-environment-linux: "CASS_DRIVER_BUILD_CONCURRENCY=2 CASS_DRIVER_BUILD_EXTENSIONS_ARE_MUST=yes CFLAGS='-g0 -O3'"
      # Upstream's dev group, minus ccm (a git dependency only the integration tests use)
      # and minus gevent on cp314t, which it has no build for. setuptools is what gives
      # pyximport a distutils on 3.12+ (gotcha 211). jsonschema is imported at module
      # level by tests/unit/test_driver_config_schema.py from 3.29.12 on.
      cibw-test-groups: ''
      cibw-test-requires: "pytest~=8.0 PyYAML pure-sasl twisted[tls] eventlet>=0.33.3 cython>=3.2 packaging>=25.0 futurist numpy objgraph setuptools jsonschema>=4.18 ${{ matrix.python == 'cp314t' && '' || 'gevent' }}"
      # PIP_PREFER_BINARY keeps pip on our registry's gevent instead of compiling
      # PyPI's newer release.
      cibw-test-environment: "PIP_PREFER_BINARY=1"
      # cassandra/ would shadow the installed wheel, so only the two .pyx files
      # tests/unit/cython/types_testhelper.pyx includes by relative path are staged.
      cibw-test-sources: "tests cassandra/ioutils.pyx cassandra/cython_marshal.pyx"
      # 3.29.12 dropped the gevent reactor and its test file, so that run is skipped
      # when the file is absent.
      cibw-test-command: "python -c \"import importlib.metadata as m; f=[str(p) for p in m.files('scylla-driver')]; assert any(s.endswith('licenses/LICENSE.libev') for s in f), f; assert not any('/liblz4' in s for s in f) or any(s.endswith('licenses/LICENSE.lz4') for s in f), f\" && python -m pytest tests/unit ${{ matrix.python == 'cp314t' && '' || '&& { [ ! -f tests/unit/io/test_geventreactor.py ] || EVENT_LOOP_MANAGER=gevent python -m pytest tests/unit/io/test_geventreactor.py; }' }}"

  publish:
    name: Publish scylla-driver ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: scylla-driver-${{ matrix.version }}-*-manylinux_riscv64
