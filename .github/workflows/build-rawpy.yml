---
name: Build rawpy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rawpy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rawpy.yml'
      - 'docs/packages/rawpy.yaml'
      - 'patches/rawpy/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rawpy.yml'
      - 'docs/packages/rawpy.yaml'
      - 'patches/rawpy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rawpy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build rawpy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "rawpy"
      version: "${{ matrix.version }}"
      repository: "letmaik/rawpy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Rocky 10 riscv64 ships lcms2/jasper directly; its libjpeg-turbo lacks the
      # JPEG8 ABI (DNG lossy codec) upstream's own build-linux.sh gets by building
      # from source with -DWITH_JPEG8=ON, so only that one is built the same way
      # upstream does (riscv64 has no libjpeg-turbo SIMD kernels, hence -DWITH_SIMD=0).
      cibw-before-build: |
        dnf install -y zlib-ng-compat-devel lcms2-devel jasper-devel && curl -fsSL -o /tmp/libjpeg-turbo.tar.gz https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.3/libjpeg-turbo-3.1.3.tar.gz && echo "075920b826834ac4ddf97661cc73491047855859affd671d52079c6867c1c6c0  /tmp/libjpeg-turbo.tar.gz" | sha256sum -c - && tar xzf /tmp/libjpeg-turbo.tar.gz -C /tmp && cmake -S /tmp/libjpeg-turbo-3.1.3 -B /tmp/libjpeg-turbo-3.1.3/build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DENABLE_STATIC=OFF -DWITH_JPEG8=ON -DWITH_SIMD=0 && cmake --build /tmp/libjpeg-turbo-3.1.3/build -j"$(nproc)" --target install && rm -f /usr/include/jconfig-32.h /usr/include/jconfig-64.h && curl -fsSL -o {project}/LICENSE.lcms2 https://raw.githubusercontent.com/mm2/Little-CMS/lcms2.16/LICENSE && curl -fsSL -o {project}/LICENSE.libjpeg-turbo https://raw.githubusercontent.com/libjpeg-turbo/libjpeg-turbo/3.1.3/LICENSE.md && curl -fsSL -o {project}/LICENSE.jasper https://raw.githubusercontent.com/jasper-software/jasper/version-4.1.0/LICENSE.txt
      cibw-test-environment: "CI=true"
      cibw-test-extras: "test"
      cibw-test-sources: "test examples"
      cibw-test-command: "python -c \"import importlib.metadata as m; names={p.name for p in m.files('rawpy') if '.dist-info/licenses/' in str(p)}; assert names == {'LICENSE','LICENSE.LibRaw','LICENSE.lcms2','LICENSE.libjpeg-turbo','LICENSE.jasper'}, names\" && python -m pytest -v test"

  gpl_sources:
    name: Collect GPL sources for rawpy ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: rawpy
      version: ${{ matrix.version }}
      packages: gcc

  publish:
    name: Publish rawpy ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rawpy-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: rawpy-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
