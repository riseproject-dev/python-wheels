---
# This workflow is based on the `build_wheels` job of
# https://github.com/molpro/sjef/blob/1.45.31/.github/workflows/wheels.yml
# and the `unix-python` job of .../build-and-test.yml.
name: Build pysjef wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pysjef.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pysjef.yml'
      - 'docs/packages/pysjef.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pysjef.yml'
      - 'docs/packages/pysjef.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pysjef
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pysjef ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream ships no free-threaded wheel.
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]

    env:
      PYSJEF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout sjef ${{ env.PYSJEF_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: molpro/sjef
          ref: ${{ env.PYSJEF_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      # The extension statically links pugixml, libyaml and tclap (all MIT), fetched
      # by CMake at the refs pinned in src/sjef/CMakeLists.txt, and Boost (BSL-1.0)
      # headers; scikit-build-core's default LICEN[CS]E* glob ships these too.
      - name: Stage third-party licences
        run: |
          curl -sSfL -o LICENSE.pugixml https://raw.githubusercontent.com/zeux/pugixml/v1.15/LICENSE.md
          curl -sSfL -o LICENSE.libyaml https://raw.githubusercontent.com/pjknowles/libyaml/master/License
          curl -sSfL -o LICENSE.tclap https://raw.githubusercontent.com/molpro/tclap/61987f0d9de1680a2f971a7c40a1f578f65fa5de/COPYING
          curl -sSfL -o LICENSE.boost https://www.boost.org/LICENSE_1_0.txt

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: >
            set -eux &&
            if command -v yum >/dev/null 2>&1; then
              yum -y install libxml2-devel libxslt-devel;
            elif command -v apt-get >/dev/null 2>&1; then
                        apt-get update && apt-get install -y libxml2-dev libxslt1-dev;
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache libxml2-dev libxslt-dev;
            fi
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: src/pysjef/test
          # test_run_ssh needs the sshd upstream's CI container starts on localhost.
          CIBW_TEST_COMMAND: >-
            python -c "import pysjef; print(pysjef.__version__)" &&
            python -m pytest -v src/pysjef/test -k 'not test_run_ssh or test_run_ssh_bad'

      - name: Check the extension module and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.startswith('pysjef/') and n.endswith('.so')]
          assert len(sos) == 1 and sos[0].startswith('pysjef/project_wrapper.'), sos
          lic = sorted(n.rsplit('/', 1)[1] for n in names
                       if '.dist-info/licenses/' in n and not n.endswith('/'))
          assert lic == ['LICENSE', 'LICENSE.boost', 'LICENSE.libyaml',
                         'LICENSE.pugixml', 'LICENSE.tclap'], lic
          print('OK:', sys.argv[1], sos, lic)
          print('vendored:', [n for n in names if '.libs/' in n])
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysjef-${{ env.PYSJEF_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      PYSJEF_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # auditwheel vendors the GCC C++ runtime (libstdc++/libgcc_s) into the
      # musllinux wheels.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pysjef-${{ env.PYSJEF_VERSION }}-gpl-sources
          path: gpl-sources.tar

  publish:
    name: Publish pysjef ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pysjef-${{ matrix.version }}-*riscv64
      gpl-sources-artifact: pysjef-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
