---
# Based on the `build` job of
# https://github.com/anntzer/mplcairo/blob/v0.6.1/.github/workflows/build.yml
name: Build mplcairo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mplcairo.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mplcairo.yml'
      - 'docs/packages/mplcairo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mplcairo.yml'
      - 'docs/packages/mplcairo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mplcairo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mplcairo ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      MPLCAIRO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout mplcairo v${{ env.MPLCAIRO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anntzer/mplcairo
          ref: v${{ env.MPLCAIRO_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # MPLCAIRO_NO_PYCAIRO stays unset: upstream's manylinux script only sets it
          # after copying Arch's py3cairo.h into /usr/include by hand, and nothing here
          # ships that header. pycairo (no Linux wheel on any arch) is a posix build
          # requirement in pyproject.toml, so the isolated build env builds it from its
          # sdist against cairo-devel and setup.py takes the header from
          # cairo.get_include(). freetype-devel/fontconfig-devel ship in Rocky's own
          # repos (no EPEL/CRB needed); Raqm's header is auto-downloaded by setup.py when
          # no raqm.pc is found, matching upstream's non-manylinux-script fallback path.
          CIBW_BEFORE_BUILD_LINUX: >-
            dnf install -y cairo-devel freetype-devel fontconfig-devel
          # PyPI can be a release ahead of the riscv64 wheels on pypi.riseproject.dev
          # with an sdist only (matplotlib 3.11.2 vs 3.11.1), so the compiled test
          # dependencies are held to wheels; pycairo has no wheel and stays buildable.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=matplotlib,numpy,pillow,contourpy,kiwisolver,fonttools
          CIBW_TEST_REQUIRES: pillow
          CIBW_TEST_COMMAND: >-
            python -c "
            import matplotlib; matplotlib.use('module://mplcairo.base');
            import matplotlib.pyplot as plt;
            plt.plot([1, 2, 3]);
            plt.savefig('test.png');
            import os; assert os.path.getsize('test.png') > 0;
            import mplcairo; print(mplcairo.get_versions())"

      # _mplcairo links only libc/libm/libstdc++/libgcc_s: its cairo and FreeType
      # symbols are resolved at runtime from pycairo's extension and the libcairo it
      # links (mplcairo/__init__.py loads it RTLD_GLOBAL), so auditwheel grafts
      # nothing and there are no third-party licence texts to ship.
      - name: Check the wheel ships the extension and vendors no libraries
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("mplcairo/_mplcairo") and n.endswith(".so") for n in names), names
          assert not any(n.startswith("mplcairo.libs/") for n in names), names
          assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mplcairo-${{ env.MPLCAIRO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish mplcairo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: mplcairo-${{ matrix.version }}-*-manylinux_riscv64
