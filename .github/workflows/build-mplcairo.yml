---
# Based on the `build` job of
# https://github.com/anntzer/mplcairo/blob/v0.6.1/.github/workflows/build.yml
name: Build mplcairo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/mplcairo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-mplcairo.yml'
      - 'docs/packages/mplcairo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mplcairo.yml'
      - 'docs/packages/mplcairo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: mplcairo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build mplcairo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "mplcairo"
      version: "${{ matrix.version }}"
      repository: "anntzer/mplcairo"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # MPLCAIRO_NO_PYCAIRO stays unset: upstream's manylinux script only sets it
      # after copying Arch's py3cairo.h into /usr/include by hand, and nothing here
      # ships that header. pycairo (no Linux wheel on any arch) is a posix build
      # requirement in pyproject.toml, so the isolated build env builds it from its
      # sdist against cairo-devel and setup.py takes the header from
      # cairo.get_include(). freetype-devel/fontconfig-devel ship in Rocky's own
      # repos (no EPEL/CRB needed); Raqm's header is auto-downloaded by setup.py when
      # no raqm.pc is found, matching upstream's non-manylinux-script fallback path.
      cibw-before-build-linux: "dnf install -y cairo-devel freetype-devel fontconfig-devel"
      # PyPI can be a release ahead of the riscv64 wheels on pypi.riseproject.dev
      # with an sdist only (matplotlib 3.11.2 vs 3.11.1), so the compiled test
      # dependencies are held to wheels; pycairo has no wheel and stays buildable.
      cibw-environment-linux: "PIP_ONLY_BINARY=matplotlib,numpy,pillow,contourpy,kiwisolver,fonttools"
      cibw-test-requires: "pillow"
      # gotcha 247: the opening quote must share a line with the first statement -
      # on its own line, the folded ">-" scalar joins it with a leading space before
      # "import", which cp3.9-3.13 reject with IndentationError (cp3.14+ tolerates it).
      cibw-test-command: "python -c \"import matplotlib; matplotlib.use('module://mplcairo.base'); import matplotlib.pyplot as plt; plt.plot([1, 2, 3]); plt.savefig('test.png'); import os; assert os.path.getsize('test.png') > 0; import mplcairo; print(mplcairo.get_versions())\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MPLCAIRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mplcairo-${{ env.MPLCAIRO_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the extension and vendors no libraries
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(n.startswith("mplcairo/_mplcairo") and n.endswith(".so") for n in names), names
          assert not any(n.startswith("mplcairo.libs/") for n in names), names
          assert any(n.endswith(".dist-info/licenses/LICENSE.txt") for n in names), names
          EOF

  publish:
    name: Publish mplcairo ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: mplcairo-${{ matrix.version }}-*-manylinux_riscv64
