---
# This workflow is based on: https://github.com/equinor/pyaga8/blob/0.1.18/.github/workflows/release.yml
name: Build pyaga8 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyaga8.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyaga8.yml'
      - 'docs/packages/pyaga8.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyaga8.yml'
      - 'docs/packages/pyaga8.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyaga8
      version: ${{ inputs.version }}

  python_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    runs-on: ubuntu-latest
    env:
      PYAGA8_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyaga8 ${{ env.PYAGA8_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: equinor/pyaga8
          ref: ${{ env.PYAGA8_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: build_sdist
        run: |
          set -euo pipefail
          rm -rf dist

          # pyaga8 gitignores Cargo.lock, so this resolves it fresh.
          cargo generate-lockfile

          uv pip install 'maturin>=1.8,<2.0' build
          python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyaga8-${{ env.PYAGA8_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, python_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyaga8 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYAGA8_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch sdist artifact
        id: fetch_sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyaga8-${{ env.PYAGA8_VERSION }}-sdist

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build and test wheel
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: rustup.rs ships no riscv64 musl host toolchain, so
          # musllinux can't build (same reason build-fastuuid.yml skips it).
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyaga8 ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here and put on
          # PATH for the build.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # Test each wheel the way upstream's run-unit-tests.yml does (pytest
          # over tests/). Tests live inside the sdist dir we pass to
          # cibuildwheel, so reference them via {package} (= /project/pyaga8),
          # not {project} (= the invocation dir /project) - see gotcha 5.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -v {package}/tests
        run: |
          set -euo pipefail
          mkdir pyaga8
          tar zxf "${{ steps.fetch_sdist.outputs.download-path }}"/*.tar.gz \
            --strip-components=1 -C pyaga8
          uv pip install --upgrade cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse ./pyaga8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyaga8-${{ env.PYAGA8_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyaga8 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyaga8-${{ matrix.version }}-*-manylinux_riscv64
