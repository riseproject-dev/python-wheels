---
# This workflow is based on the `quick-tests` job of
# https://github.com/rohaquinlop/complexipy/blob/8.0.0/.github/workflows/CI.yml
name: Build complexipy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/complexipy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-complexipy.yml'
      - 'docs/packages/complexipy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-complexipy.yml'
      - 'docs/packages/complexipy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: complexipy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build complexipy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "complexipy"
      version: "${{ matrix.version }}"
      repository: "rohaquinlop/complexipy"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      # Only manylinux: rustup.rs ships no riscv64 musl host toolchain, so
      # musllinux can't build (same reason build-fastuuid.yml skips it).
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # complexipy ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here and put on
      # PATH for the build.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Tests live at the repo root; stage them (and pyproject.toml, for
      # [tool.pytest.ini_options]) into the test working directory so
      # `import complexipy` resolves to the installed wheel, not the
      # repo's own complexipy/ source directory (which is left unstaged).
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-requires: "pytest"
      # Mirrors upstream's quick-tests job: pytest suite, then the CLI
      # console script exercised with the same exclude/ignore flags
      # upstream's own CI runs against tests/src.
      cibw-test-command: >
        python -c "import complexipy._complexipy as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests &&
        complexipy tests/src --exclude "exclude_dir/**" --ignore-complexity &&
        complexipy tests/src --exclude "**/test_exclude*.py" --ignore-complexity

  publish:
    name: Publish complexipy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: complexipy-${{ matrix.version }}-*-manylinux_riscv64
