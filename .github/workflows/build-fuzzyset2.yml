---
# This workflow is based on the `build-wheels` job of
# https://github.com/alpae/fuzzyset/blob/v0.2.5/.github/workflows/deploy.yml
name: Build fuzzyset2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fuzzyset2.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzyset2.yml'
      - 'docs/packages/fuzzyset2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzyset2.yml'
      - 'docs/packages/fuzzyset2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fuzzyset2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fuzzyset2 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      FUZZYSET2_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fuzzyset2 v${{ env.FUZZYSET2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: alpae/fuzzyset
          ref: v${{ env.FUZZYSET2_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          # Only manylinux: upstream's own skip list already excludes musllinux.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Cython (pyproject.toml build-system.requires) has no riscv64 wheel on
          # PyPI; the registry already carries one for cp312-cp314.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # before-test/test-command come from upstream's own [tool.cibuildwheel];
          # this only adds a check that cfuzzyset actually compiled.
          CIBW_TEST_COMMAND: >-
            python -c "import cfuzzyset; assert cfuzzyset.__file__.endswith('.so'), cfuzzyset.__file__"
            && pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzzyset2-${{ env.FUZZYSET2_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fuzzyset2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fuzzyset2-${{ matrix.version }}-*-manylinux_riscv64
