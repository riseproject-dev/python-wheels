---
# This workflow is based on the `build-wheels` job of
# https://github.com/alpae/fuzzyset/blob/v0.2.5/.github/workflows/deploy.yml
name: Build fuzzyset2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fuzzyset2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzyset2.yml'
      - 'docs/packages/fuzzyset2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fuzzyset2.yml'
      - 'docs/packages/fuzzyset2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fuzzyset2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fuzzyset2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fuzzyset2
      version: ${{ matrix.version }}
      repository: alpae/fuzzyset
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Only manylinux: upstream's own skip list already excludes musllinux.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Cython (pyproject.toml build-system.requires) has no riscv64 wheel on
      # PyPI; the registry already carries one for cp312-cp314.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # before-test/test-command come from upstream's own [tool.cibuildwheel];
      # this only adds a check that cfuzzyset actually compiled.
      cibw-test-command: >-
        python -c "import cfuzzyset; assert cfuzzyset.__file__.endswith('.so'), cfuzzyset.__file__"
        && pytest {project}/tests

  publish:
    name: Publish fuzzyset2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fuzzyset2-${{ matrix.version }}-*-manylinux_riscv64
