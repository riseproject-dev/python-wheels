---
# Mirrors the Linux leg of upstream's [tool.cibuildwheel] in pyproject.toml: a
# setuptools/Cython build (gsd/fl.pyx + gsd/gsd.c) tagged cp311-abi3
# (Py_LIMITED_API 0x030B0000), so upstream itself publishes only a single
# cp311-abi3 wheel per platform. musllinux and free-threaded builds are
# skipped upstream too (`skip = "*musllinux*","cp3??t-*"`).
name: Build gsd wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gsd.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gsd.yml'
      - 'docs/packages/gsd.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gsd.yml'
      - 'docs/packages/gsd.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gsd
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gsd ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "gsd"
      version: "${{ matrix.version }}"
      repository: "glotzerlab/gsd"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 90
      cibw-build: "cp311-manylinux_riscv64"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest==8.4.2 numpy==2.3.3"
      cibw-test-command: "pytest --pyargs gsd -v --log-level=DEBUG"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      GSD_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: gsd-${{ env.GSD_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "gsd/fl.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish gsd ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gsd-${{ matrix.version }}-*-manylinux_riscv64
