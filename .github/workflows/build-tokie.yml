---
# This workflow is based on the `build-wheels` job of
# https://github.com/chonkie-inc/tokie/blob/v0.1.4/.github/workflows/release.yml
name: Build tokie wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tokie.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tokie.yml'
      - 'docs/packages/tokie.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tokie.yml'
      - 'docs/packages/tokie.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tokie
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tokie ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per interpreter (upstream's own release.yml
        # passes --interpreter 3.10 3.11 3.12 3.13 3.14 with no abi3 feature).
        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]

    env:
      TOKIE_VERSION: ${{ matrix.version }}

    steps:
      # Checked out at the workspace root: crates/tokie-python is a member of
      # the tokie Cargo workspace and builds against the sibling tokie/pretokie
      # crates.
      - name: Checkout tokie v${{ env.TOKIE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: chonkie-inc/tokie
          ref: v${{ env.TOKIE_VERSION }}
          persist-credentials: false

      - name: Copy repo-root licences into the pyproject directory
        # crates/tokie-python/pyproject.toml has a [project] table, so maturin's
        # licence auto-glob (LICEN[CS]E*) roots at that directory, not the repo
        # root where LICENSE-APACHE/LICENSE-MIT actually live (CLAUDE.md gotcha 146).
        run: cp LICENSE-APACHE LICENSE-MIT crates/tokie-python/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: crates/tokie-python
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # tokie ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_REQUIRES: pytest
          # test-sources resolves against the checkout root, not package-dir.
          CIBW_TEST_SOURCES: crates/tokie-python/tests
          # Upstream never wires this suite into its own CI (only the Rust
          # accuracy suite runs there); it downloads tokenizer.json files from
          # the Hugging Face Hub for every test, same shape as
          # build-fastokens.yml and build-hf-xet.yml already rely on.
          CIBW_TEST_COMMAND: >-
            python -c "import tokie; assert tokie.tokie.__file__.endswith('.so'), tokie.tokie.__file__" &&
            cd crates/tokie-python && python -m pytest tests -v

      - name: Check the licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".dist-info/licenses/LICENSE-APACHE") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE-MIT") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tokie-${{ env.TOKIE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tokie ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tokie-${{ matrix.version }}-*-manylinux_riscv64
