---
# This workflow is based on: https://github.com/fonttools/fonttools/blob/4.63.0/.github/workflows/wheels.yml
name: Build fonttools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fonttools.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fonttools.yml'
      - 'docs/packages/fonttools.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fonttools.yml'
      - 'docs/packages/fonttools.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Pin below Cython 3.3.0, which enforces PEP-484 arg annotations as strict type
  # checks and breaks qu2cu; fonttools pins Cython nowhere, so a build grabs latest.
  CYTHON_SPEC: 'cython<3.3.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fonttools
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fonttools ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the extensions link the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      FONTTOOLS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fonttools ${{ env.FONTTOOLS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: fonttools/fonttools
          ref: ${{ env.FONTTOOLS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Force the Cython extensions to compile (else setup.py ships a pure wheel).
          CIBW_ENVIRONMENT: FONTTOOLS_WITH_CYTHON=1
          # setup.py's setup_requires fetches Cython via easy_install (ignores pip
          # pins), so preinstall the pinned one and disable isolation to use it.
          CIBW_BEFORE_BUILD: pip install "${CYTHON_SPEC}" setuptools wheel
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_ENVIRONMENT_PASS_LINUX: CYTHON_SPEC
          # Upstream's wheels.yml test command: asserts extensions compiled, then
          # runs the full suite with no optional extras (several lack riscv64 wheels).
          CIBW_TEST_REQUIRES: tox
          CIBW_TEST_COMMAND: "tox -c {package}/tox.ini -e py-cy-noextra --installpkg {wheel}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fonttools-${{ env.FONTTOOLS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fonttools ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fonttools-${{ matrix.version }}-*-manylinux_riscv64
