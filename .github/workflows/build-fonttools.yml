---
# This workflow is based on: https://github.com/fonttools/fonttools/blob/4.63.0/.github/workflows/wheels.yml
name: Build fonttools wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fonttools.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fonttools.yml'
      - 'docs/packages/fonttools.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fonttools.yml'
      - 'docs/packages/fonttools.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Pin below Cython 3.3.0, which enforces PEP-484 arg annotations as strict type
  # checks and breaks qu2cu; fonttools pins Cython nowhere, so a build grabs latest.
  CYTHON_SPEC: 'cython<3.3.0'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fonttools
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fonttools ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "fonttools"
      version: "${{ matrix.version }}"
      repository: "fonttools/fonttools"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Force the Cython extensions to compile (else setup.py ships a pure wheel).
      cibw-environment-linux: "CYTHON_SPEC=cython<3.3.0 FONTTOOLS_WITH_CYTHON=1"
      # setup.py's setup_requires fetches Cython via easy_install (ignores pip
      # pins), so preinstall the pinned one and disable isolation to use it.
      cibw-before-build: "pip install \"${CYTHON_SPEC}\" setuptools wheel"
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # Upstream's wheels.yml test command: asserts extensions compiled, then
      # runs the full suite with no optional extras (several lack riscv64 wheels).
      cibw-test-requires: "tox"
      cibw-test-command: "tox -c {package}/tox.ini -e py-cy-noextra --installpkg {wheel}"

  publish:
    name: Publish fonttools ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fonttools-${{ matrix.version }}-*-manylinux_riscv64
