---
# This workflow is based on:
#   https://github.com/FlorianREGAZ/Python-Tls-Client/blob/2.0.0/.github/workflows/wheels.yml
#   https://github.com/FlorianREGAZ/Python-Tls-Client/blob/2.0.0/.github/workflows/ci.yml
name: Build tls-client wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tls-client.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tls-client.yml'
      - 'docs/packages/tls-client.yaml'
      - 'patches/tls-client/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tls-client.yml'
      - 'docs/packages/tls-client.yaml'
      - 'patches/tls-client/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tls-client
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build tls-client ${{ matrix.version }} py3-none-manylinux_riscv64
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TLS_CLIENT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout tls-client ${{ env.TLS_CLIENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: FlorianREGAZ/Python-Tls-Client
          ref: ${{ env.TLS_CLIENT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/tls-client/${{ env.TLS_CLIENT_VERSION }}/*.patch

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: Download the native library
        run: uv run --no-project scripts/fetch_library.py tls-client-linux-riscv64.so

      - run: uv build --wheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tls-client-${{ env.TLS_CLIENT_VERSION }}-py3-none-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test tls-client ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    env:
      TLS_CLIENT_VERSION: ${{ matrix.version }}
      UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_ONLY_BINARY: ':all:'

    steps:
      - name: Checkout tls-client ${{ env.TLS_CLIENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: FlorianREGAZ/Python-Tls-Client
          ref: ${{ env.TLS_CLIENT_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/tls-client/${{ env.TLS_CLIENT_VERSION }}/*.patch

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tls-client-${{ env.TLS_CLIENT_VERSION }}-py3-none-manylinux_riscv64
          path: dist

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Smoke test
        run: uv run --no-project --isolated --python ${{ matrix.python-version }} --with dist/*.whl python -I scripts/smoke_test.py tls-client-linux-riscv64.so

      # Upstream runs pytest from the checkout with the library fetched into it; test the wheel instead.
      - name: Install the wheel and test dependencies
        run: |
          rm -rf tls_client
          uv pip install dist/*.whl pytest pytest-cov pytest-httpbin

      - name: Test
        run: python -m pytest

  publish:
    name: Publish tls-client ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: tls-client-${{ matrix.version }}-py3-none-manylinux_riscv64
