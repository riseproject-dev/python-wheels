---
# This workflow is based on: https://github.com/dalf/fasttext-predict/blob/main/.github/workflows/wheels.yml
name: Build fasttext-predict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fasttext-predict.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fasttext-predict.yml'
      - 'docs/packages/fasttext-predict.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fasttext-predict.yml'
      - 'docs/packages/fasttext-predict.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fasttext-predict
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fasttext-predict ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fasttext-predict
      version: ${{ matrix.version }}
      repository: dalf/fasttext-predict
      ref: 93501d1069ecb00758137c19bb27a53ee097a0e4
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # dalf/fasttext-predict ships no git tags; this is the release commit for
      # 0.9.2.4 ("Prepapre version 0.9.2.4"), verified byte-identical against the
      # PyPI sdist. Move together with the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream ships no test suite at all; exercise the predict path with
      # the README's own language-identification example instead of an
      # import-only smoke test.
      cibw-before-test-linux: >-
        curl -sL -o /tmp/lid.176.ftz https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
      cibw-test-command: >-
        python -c "import fasttext;
        assert fasttext.FastText.fasttext.__file__.endswith('.so'), fasttext.FastText.fasttext.__file__;
        model = fasttext.load_model('/tmp/lid.176.ftz');
        labels, probs = model.predict('Fondant au chocolat et tarte aux myrtilles');
        assert labels == ('__label__fr',), labels;
        assert probs[0] > 0.9, probs;
        print('fasttext-predict OK')"

  publish:
    name: Publish fasttext-predict ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fasttext-predict-${{ matrix.version }}-*-manylinux_riscv64
