---
# This workflow is based on: https://github.com/dalf/fasttext-predict/blob/main/.github/workflows/wheels.yml
name: Build fasttext-predict wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fasttext-predict version to build (PyPI version, e.g. 0.9.2.4)'
        required: true
        default: '0.9.2.4'
  pull_request:
    paths:
      - '.github/workflows/build-fasttext-predict.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.9.2.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.9.2.4 there.
  FASTTEXT_PREDICT_VERSION: ${{ inputs.version || '0.9.2.4' }}
  # dalf/fasttext-predict ships no git tags; this is the release commit for
  # 0.9.2.4 ("Prepapre version 0.9.2.4"), verified byte-identical against the
  # PyPI sdist. Move together with FASTTEXT_PREDICT_VERSION.
  FASTTEXT_PREDICT_REF: '93501d1069ecb00758137c19bb27a53ee097a0e4'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fasttext-predict ${{ inputs.version || '0.9.2.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the pybind11 extension links the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout fasttext-predict ${{ env.FASTTEXT_PREDICT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dalf/fasttext-predict
          ref: ${{ env.FASTTEXT_PREDICT_REF }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream ships no test suite at all; exercise the predict path with
          # the README's own language-identification example instead of an
          # import-only smoke test.
          CIBW_BEFORE_TEST_LINUX: >-
            curl -sL -o /tmp/lid.176.ftz https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz
          CIBW_TEST_COMMAND: >-
            python -c "import fasttext;
            assert fasttext.FastText.fasttext.__file__.endswith('.so'), fasttext.FastText.fasttext.__file__;
            model = fasttext.load_model('/tmp/lid.176.ftz');
            labels, probs = model.predict('Fondant au chocolat et tarte aux myrtilles');
            assert labels == ('__label__fr',), labels;
            assert probs[0] > 0.9, probs;
            print('fasttext-predict OK')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fasttext-predict-${{ env.FASTTEXT_PREDICT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fasttext-predict ${{ inputs.version || '0.9.2.4' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fasttext-predict-${{ inputs.version || '0.9.2.4' }}-*-manylinux_riscv64
