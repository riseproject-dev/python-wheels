---
# This workflow is based on:
# https://github.com/ast-grep/ast-grep/blob/0.45.2/.github/workflows/pyo3.yml
name: Build ast-grep-py wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ast-grep-py.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ast-grep-py.yml'
      - 'docs/packages/ast-grep-py.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ast-grep-py.yml'
      - 'docs/packages/ast-grep-py.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ast-grep-py
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ast-grep-py ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Checked out at the workspace root: crates/pyo3 is a member of the
    # ast-grep Cargo workspace and builds against its sibling crates.
    # maturin globs LICEN[CS]E* relative to the pyproject directory,
    # which is crates/pyo3 -- so upstream's published wheel carries no
    # licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "ast-grep-py"
      version: "${{ matrix.version }}"
      repository: "ast-grep/ast-grep"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: "cp LICENSE crates/pyo3/LICENSE"
      cibw-package-dir: "crates/pyo3"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # ast-grep ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "pytest"
      # test-sources resolves against the checkout root, not package-dir.
      cibw-test-sources: "crates/pyo3/tests crates/pyo3/pyproject.toml"
      cibw-test-command: >
        cd crates/pyo3 &&
        python -c "import ast_grep_py.ast_grep_py as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert {p.name for p in md.files('ast-grep-py') if 'licenses' in str(p)} == {'LICENSE'}" &&
        python -m pytest -v tests

  publish:
    name: Publish ast-grep-py ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ast-grep-py-${{ matrix.version }}-*-manylinux_riscv64
