---
# This workflow is based on https://github.com/jhavl/spatialgeometry/blob/v1.4.2/.github/workflows/cibuildwheel.yml
name: Build spatialgeometry wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spatialgeometry.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spatialgeometry.yml'
      - 'docs/packages/spatialgeometry.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spatialgeometry.yml'
      - 'docs/packages/spatialgeometry.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spatialgeometry
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spatialgeometry ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "spatialgeometry"
      version: "${{ matrix.version }}"
      repository: "jhavl/spatialgeometry"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: |-
        curl -fsSL --retry 5 -o COPYING.eigen https://gitlab.com/libeigen/eigen/-/raw/3.4.0/COPYING.MPL2
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,pillow,matplotlib,contourpy,kiwisolver"
      # spatialmath-python (a CIBW_TEST_REQUIRES dep) pulls in matplotlib, whose own
      # runtime deps (pillow, contourpy, kiwisolver) lack a riscv64 wheel on PyPI's
      # newest release -- PIP_ONLY_BINARY above forces pip onto our registry's wheels
      # instead of a source build (CLAUDE.md gotcha 291; pillow's sdist build fails
      # with `RequiredDependencyException: jpeg`, no libjpeg headers in the image).
      cibw-test-requires: "pytest numpy spatialmath-python trimesh"
      cibw-test-sources: "tests pyproject.toml"
      cibw-test-command: "python -m pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      SPATIALGEOMETRY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: spatialgeometry-${{ env.SPATIALGEOMETRY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.startswith("spatialgeometry/scene.") and n.endswith(".so") for n in names), (path, names)
              # auditwheel's repaired zip also lists the bare dist-info/licenses/ directory.
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "COPYING.eigen"}, (path, licences)
              print(path, "ok")
          EOF

  publish:
    name: Publish spatialgeometry ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spatialgeometry-${{ matrix.version }}-*-manylinux_riscv64
