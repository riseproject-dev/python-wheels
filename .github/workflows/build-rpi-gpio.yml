---
# Upstream has no CI; its wheels are a plain setuptools build of the release tag
# in the SourceForge Mercurial repository
# (http://hg.code.sf.net/p/raspberry-gpio-python/code).
name: Build RPi.GPIO wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rpi-gpio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rpi-gpio.yml'
      - 'docs/packages/rpi-gpio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rpi-gpio.yml'
      - 'docs/packages/rpi-gpio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rpi-gpio
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build RPi.GPIO ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: rpi-gpio
      version: ${{ matrix.version }}
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's tests drive real Raspberry Pi pins; off a Pi the extension
      # loads and its module init rejects the board with exactly this error.
      cibw-test-command: >
        python -c "import RPi.GPIO" 2>&1 |
        grep -x 'RuntimeError: This module can only be run on a Raspberry Pi!'

  publish:
    name: Publish RPi.GPIO ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: rpi-gpio-${{ matrix.version }}-*-manylinux_riscv64
