---
# Upstream has no CI; its wheels are a plain setuptools build of the release tag
# in the SourceForge Mercurial repository
# (http://hg.code.sf.net/p/raspberry-gpio-python/code).
name: Build RPi.GPIO wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/rpi-gpio.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-rpi-gpio.yml'
      - 'docs/packages/rpi-gpio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rpi-gpio.yml'
      - 'docs/packages/rpi-gpio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: rpi-gpio
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build RPi.GPIO ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    env:
      RPI_GPIO_VERSION: ${{ matrix.version }}

    steps:
      - name: Install Mercurial
        run: sudo apt-get update -q && sudo apt-get install -y -q mercurial

      # SourceForge serves anonymous Mercurial clones over http only.
      - name: Checkout RPi.GPIO ${{ env.RPI_GPIO_VERSION }}
        run: hg clone -u "${RPI_GPIO_VERSION}" http://hg.code.sf.net/p/raspberry-gpio-python/code rpi-gpio

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        working-directory: rpi-gpio
        run: |
          set -euo pipefail
          uv pip install build twine
          python -m build --sdist --outdir ../dist
          twine check ../dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rpi-gpio-${{ env.RPI_GPIO_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build RPi.GPIO ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      RPI_GPIO_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rpi-gpio-${{ env.RPI_GPIO_VERSION }}-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build and test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's tests drive real Raspberry Pi pins; off a Pi the extension
          # loads and its module init rejects the board with exactly this error.
          CIBW_TEST_COMMAND: >-
            python -c "import RPi.GPIO" 2>&1 |
            grep -x 'RuntimeError: This module can only be run on a Raspberry Pi!'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rpi-gpio-${{ env.RPI_GPIO_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish RPi.GPIO ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: rpi-gpio-${{ matrix.version }}-*-manylinux_riscv64
