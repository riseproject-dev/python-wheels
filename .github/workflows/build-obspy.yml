---
# This workflow is based on: https://github.com/obspy/obspy/blob/1.5.1/.github/workflows/build_wheels.yml
name: Build obspy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/obspy.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-obspy.yml'
      - 'docs/packages/obspy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-obspy.yml'
      - 'docs/packages/obspy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: obspy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build obspy ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "obspy"
      version: "${{ matrix.version }}"
      repository: "obspy/obspy"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Only our registry has riscv64 wheels for these; keep a newer PyPI sdist from winning.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,matplotlib,contourpy,kiwisolver,pillow,lxml,sqlalchemy,pyproj,shapely,cartopy,rpds-py"
      # --no-report: do not upload results to upstream's tests.obspy.org report server.
      # Network tests stay deselected (obspy-runtests' default).
      cibw-test-command: "obspy-runtests --no-report"
      cibw-test-extras: "tests"
      # Optional deps outside the tests extra; without them 25 tests skip.
      cibw-test-requires: "cartopy geographiclib pyshp jsonschema"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      OBSPY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obspy-${{ env.OBSPY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the licences and the compiled libraries
        run: |
          python3 - <<'EOF'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("wheelhouse/*.whl")[0]).namelist()
          assert "obspy/io/mseed/src/libmseed/LICENSE.txt" in names, names
          assert any(n.endswith("dist-info/licenses/LICENSE.txt") for n in names), names
          libs = sorted(n for n in names if n.startswith("obspy/lib/") and n.endswith(".so"))
          assert len(libs) == 7, libs
          # Nothing grafted by auditwheel (e.g. GCC runtime), so no gpl_sources job is needed.
          assert not any(".libs/" in n for n in names), [n for n in names if ".libs/" in n]
          EOF

  publish:
    name: Publish obspy ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: obspy-${{ matrix.version }}-*-manylinux_riscv64
