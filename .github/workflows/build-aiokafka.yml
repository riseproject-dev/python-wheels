---
# This workflow is based on the `package-wheel` job of:
# https://github.com/aio-libs/aiokafka/blob/v0.14.0/.github/workflows/publish.yml
name: Build aiokafka wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/aiokafka.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-aiokafka.yml'
      - 'docs/packages/aiokafka.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aiokafka.yml'
      - 'docs/packages/aiokafka.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: aiokafka
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build aiokafka ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: aiokafka
      version: ${{ matrix.version }}
      repository: aio-libs/aiokafka
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # 0.15.0 dropped requirements-cython.txt (Cython is a [build-system] requirement in
      # pyproject.toml now, which the isolated build installs itself), so only install it
      # from the file for the versions that still ship it.
      cibw-before-build-linux: >-
        if [ -f requirements-cython.txt ]; then pip install -r requirements-cython.txt; fi
        && yum install -y zlib-devel
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # The repo-root aiokafka/ would otherwise shadow the installed wheel's
      # compiled extension; stage only the suite and its pytest config.
      cibw-test-sources: tests pyproject.toml
      # Pin to upstream's own requirements-ci.txt versions: newer pytest turns
      # test_requests.py's generator-based parametrize into a hard failure under
      # this project's `filterwarnings = ["error"]`. gssapi is skipped - it needs
      # krb5 headers and is only exercised by the docker-backed SASL tests below.
      cibw-test-requires: >-
        pytest==9.0.2 pytest-asyncio==1.3.0 pytest-cov==7.0.0 pytest-mock==3.15.1
        docker cramjam
      # cp314t: the Cython extensions use single-phase init, so 3.14t re-enables
      # the GIL on import and warns; fatal under filterwarnings=["error"] (gotcha 127).
      cibw-test-environment: PIP_ONLY_BINARY=cramjam PYTHON_GIL=1
      # No --docker-image: upstream's own wheel-test jobs run this same way, since
      # none of them have a Kafka broker either. Tests needing one skip themselves.
      cibw-test-command: python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish aiokafka ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: aiokafka-${{ matrix.version }}-*-manylinux_riscv64
