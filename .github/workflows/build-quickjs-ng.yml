---
# Based on the `build-wheels`/`publish` jobs of
# https://github.com/genotrance/quickjs-ng/blob/v0.16.2.1/.github/workflows/build.yml
name: Build quickjs-ng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/quickjs-ng.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-quickjs-ng.yml'
      - 'docs/packages/quickjs-ng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-quickjs-ng.yml'
      - 'docs/packages/quickjs-ng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: quickjs-ng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build quickjs-ng ${{ matrix.version }} cp310-abi3-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # abi3 (pyproject.toml: [tool.distutils.bdist_wheel] py_limited_api =
        # "cp310"), so the single cp310 build (the abi3 floor, gotcha 96) is
        # loadable on every newer CPython; pyproject.toml's [tool.cibuildwheel]
        # skips cp*t-* so there is no free-threaded build.
        libc: [manylinux, musllinux]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "quickjs-ng"
      version: "${{ matrix.version }}"
      repository: "genotrance/quickjs-ng"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-${{ matrix.libc }}_riscv64"
      checkout-submodules: "recursive"
      pre-build: |-
        export QUICKJS_NG_VERSION='${{ matrix.version }}'
        sed -i "s/^version = \".*\"/version = \"${QUICKJS_NG_VERSION}\"/" pyproject.toml
        grep -qx "version = \"${QUICKJS_NG_VERSION}\"" pyproject.toml

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        cp upstream-quickjs/LICENSE LICENSE.upstream-quickjs
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp310-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # abi3 (pyproject.toml: [tool.distutils.bdist_wheel] py_limited_api =
        # "cp310"), so the single cp310 build (the abi3 floor, gotcha 96) is
        # loadable on every newer CPython; pyproject.toml's [tool.cibuildwheel]
        # skips cp*t-* so there is no free-threaded build.
        libc: [manylinux, musllinux]
    env:
      QUICKJS_NG_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: quickjs-ng-${{ env.QUICKJS_NG_VERSION }}-cp310-abi3-${{ matrix.libc }}_riscv64
          path: wheelhouse

      - name: Check the extension and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("_quickjs") and n.endswith(".so") for n in names), names
              # The zip also lists the licenses/ directory itself as its own entry
              # (trailing slash, nothing after it once split) -- skip it, not a file.
              licences = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "LICENSE.upstream-quickjs"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish quickjs-ng ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: quickjs-ng-${{ matrix.version }}-*riscv64
