---
# Based on upstream's own wheel build:
#   https://github.com/pengzhendong/pyrnnoise/blob/a4edc69/.github/workflows/release.yml
name: Build pyrnnoise wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyrnnoise.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrnnoise.yml'
      - 'docs/packages/pyrnnoise.yaml'
      - 'patches/pyrnnoise/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyrnnoise.yml'
      - 'docs/packages/pyrnnoise.yaml'
      - 'patches/pyrnnoise/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases from a workflow_dispatch that stamps VERSION at
  # build time (never committed) and tags no commit at all. Each entry is the
  # commit whose pyrnnoise/*.py is byte-identical to the released wheel's.
  # A new version must be added here, or the checkout guard below fails.
  PYRNNOISE_REFS: >-
    {"0.4.3": "a4edc697a2f475dcdac14c453d7c06eebbd06b33",
     "0.4.4": "56c437f32cfa10136fdf766321d5570d9368d0a6",
     "0.4.5": "fe603b252ccc7d3bacadb77d6ab766c48acc6fce"}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyrnnoise
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyrnnoise ${{ matrix.version }} py3-none-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyrnnoise"
      version: "${{ matrix.version }}"
      repository: "pengzhendong/pyrnnoise"
      ref: |-
        ${{ fromJSON('{"0.4.3": "a4edc697a2f475dcdac14c453d7c06eebbd06b33",
         "0.4.4": "56c437f32cfa10136fdf766321d5570d9368d0a6",
         "0.4.5": "fe603b252ccc7d3bacadb77d6ab766c48acc6fce"}')[matrix.version] }}
      artifact-tag: "py3-none-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "true"
      pre-build: |-
        expected='${{ fromJSON('{"0.4.3": "a4edc697a2f475dcdac14c453d7c06eebbd06b33",
         "0.4.4": "56c437f32cfa10136fdf766321d5570d9368d0a6",
         "0.4.5": "fe603b252ccc7d3bacadb77d6ab766c48acc6fce"}')[matrix.version] }}'
        test -n "$expected"
        test "$(git rev-parse HEAD)" = "$expected"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyrnnoise/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        echo "${{ matrix.version }}" > VERSION
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      # setup.py ships no ext_modules and forces root_is_pure = False
      # (the C library is loaded via ctypes), so setuptools tags the
      # wheel py3-none and one build serves every interpreter.
      cibw-build: "cp312-manylinux_riscv64"
      # Mirrors release.yml's own `cmake --build ... --target install`
      # step, run here instead since setup.py does not invoke cmake
      # itself. The image ships no cmake or wget (gotcha 289); the
      # CMakeLists.txt wget call fetches the pretrained model weights
      # that rnnoise_data.c/.h are generated from.
      cibw-before-all-linux: "dnf install -y cmake wget && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target install --parallel"
      # matplotlib, an unconditional runtime dependency, has no
      # musllinux_riscv64 wheel on this registry, so musllinux is
      # dropped (same outcome as build-keystone-engine.yml).
      # pillow (a matplotlib dependency) has no riscv64 wheel on public
      # PyPI's newest release and its sdist needs libjpeg headers.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,matplotlib,av,soundfile,soxr,pillow"
      cibw-test-command: "python -c \"import numpy as np; from pyrnnoise.rnnoise import create, destroy, process_frame, FRAME_SIZE; state = create(); frame = np.zeros(FRAME_SIZE, dtype=np.int16); out, prob = process_frame(state, frame); assert out.shape == (FRAME_SIZE,), out.shape; destroy(state); print('pyrnnoise OK')\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      PYRNNOISE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyrnnoise-${{ env.PYRNNOISE_VERSION }}-py3-none-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel carries librnnoise and RNNoise's licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("pyrnnoise/librnnoise.so") for n in names), whl
              licences = {n.rsplit("/", 1)[-1] for n in names if "dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "LICENSE.rnnoise"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyrnnoise ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyrnnoise-${{ matrix.version }}-*riscv64
