---
# Based on upstream's own wheel builder:
#   https://github.com/rapidfuzz/Levenshtein/blob/v0.27.4/.github/workflows/pythonbuild.yml
name: Build levenshtein wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/levenshtein.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-levenshtein.yml'
      - 'docs/packages/levenshtein.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-levenshtein.yml'
      - 'docs/packages/levenshtein.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: levenshtein
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build levenshtein ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream feeds cibuildwheel the sdist tarball too: it bundles the
    # cythonised .cxx, so the wheel build needs no Cython, and it carries
    # the tests the inherited test-command runs.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: levenshtein
      version: ${{ matrix.version }}
      # The PyPI sdist contains the generated C++ and tests; the patches add the bundled rapidfuzz-cpp licence.
      source: pypi-sdist
      patches: true
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      timeout-minutes: 90
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream's test-requires/test-command come from the sdist's
      # pyproject.toml; only the licence assertion is ours.
      cibw-test-command: >
        python -c "import importlib.metadata as m; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('levenshtein') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.rapidfuzz-cpp'], l"
        && pytest {package}/tests

  publish:
    name: Publish levenshtein ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: levenshtein-${{ matrix.version }}-*-manylinux_riscv64
