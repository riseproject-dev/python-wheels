---
# This workflow is based on: https://github.com/dask/crick/blob/0.0.8/.github/workflows/wheels.yml
name: Build crick wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'crick version to build (git tag, e.g. 0.0.8)'
        required: true
        default: '0.0.8'
  pull_request:
    paths:
      - '.github/workflows/build-crick.yml'
      - 'patches/crick/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.0.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.0.8 there.
  CRICK_VERSION: ${{ inputs.version || '0.0.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build crick ${{ inputs.version || '0.0.8' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the Cython extensions link the version-specific ABI.
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout crick ${{ env.CRICK_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dask/crick
          ref: ${{ env.CRICK_VERSION }}
          fetch-depth: 0  # versioneer derives the version from `git describe`
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/crick/${{ env.CRICK_VERSION }}/*.patch

      # `git apply` dirties the tree, and versioneer (unlike setuptools_scm) has no
      # PRETEND_VERSION escape hatch -- `git describe --dirty` would otherwise turn
      # 0.0.8 into 0.0.8+0.g<sha>.dirty. skip-worktree hides the two patched files
      # from git's dirty check while keeping their patched content on disk.
      - name: Pin the version past the patch (CLAUDE.md gotcha 315)
        run: git update-index --skip-worktree crick/stats_stubs.c crick/space_saving_stubs.c.in

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy is a build-time requirement (headers + libnpymath) and, despite not
          # being declared as a runtime dependency, an implicit one too (the compiled
          # extensions call numpy's C API at import time). Only our registry has it
          # for riscv64; only-binary keeps a newer PyPI release from winning the
          # resolution and then compiling from sdist.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: python -m pytest --pyargs crick

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"numpy_version", "space_saving", "stats", "tdigest"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n}
          assert licences == {"LICENSE"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crick-${{ env.CRICK_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish crick ${{ inputs.version || '0.0.8' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: crick-${{ inputs.version || '0.0.8' }}-*-manylinux_riscv64
