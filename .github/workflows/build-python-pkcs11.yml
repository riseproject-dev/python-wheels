---
# This workflow is based on: https://github.com/pyauth/python-pkcs11/blob/v0.9.5/.github/workflows/release.yml
# and https://github.com/pyauth/python-pkcs11/blob/v0.9.5/.github/workflows/tests.yml
name: Build python-pkcs11 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-pkcs11.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-pkcs11.yml'
      - 'docs/packages/python-pkcs11.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-pkcs11.yml'
      - 'docs/packages/python-pkcs11.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-pkcs11
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-pkcs11 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: python-pkcs11
      version: ${{ matrix.version }}
      repository: pyauth/python-pkcs11
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream tests against SoftHSMv2 main for ML-DSA; pinned here for reproducibility.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: |
        set -euo pipefail
        dnf install -y --setopt=install_weak_deps=False autoconf automake libtool openssl openssl-devel crypto-policies-scripts
        # Rocky's DEFAULT crypto policy refuses the SHA-1 signatures the RSA tests use.
        update-crypto-policies --set LEGACY
        curl -sSfL https://github.com/softhsm/SoftHSMv2/archive/884cb38f3d2012a0447bd5f50dbd29c429987c41.tar.gz | tar xz -C /tmp
        cd /tmp/SoftHSMv2-884cb38f3d2012a0447bd5f50dbd29c429987c41
        ./autogen.sh
        ./configure --prefix=/usr --disable-gost --enable-mldsa
        make -j"$(nproc)"
        make install
        mkdir -p /opt/softhsm_tokens
        echo "directories.tokendir = /opt/softhsm_tokens" > /opt/softhsm2.conf
      cibw-environment: >-
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYTHON_PKCS11=${{ matrix.version }}
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        SOFTHSM2_CONF=/opt/softhsm2.conf
      cibw-before-test-linux: softhsm2-util --init-token --free --label TEST --pin 1234 --so-pin 5678
      cibw-test-environment: >-
        PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so
        PKCS11_TOKEN_LABEL=TEST
        PKCS11_TOKEN_PIN=1234
        PKCS11_TOKEN_SO_PIN=5678
        PIP_ONLY_BINARY=cryptography
      cibw-test-groups: testing
      cibw-test-sources: tests
      # Rocky's OpenSSL drops the P-192 curve this test uses.
      cibw-test-command: pytest -v tests --deselect tests/test_ecc.py::ECCTests::test_derive_key
      timeout-minutes: 90

  publish:
    name: Publish python-pkcs11 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-pkcs11-${{ matrix.version }}-*-manylinux_riscv64
