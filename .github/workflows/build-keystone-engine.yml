---
# Based on upstream's own wheel build at this tag:
#   https://github.com/keystone-engine/keystone/blob/0.9.2/.github/workflows/python-publish.yml
name: Build keystone-engine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'keystone-engine version/tag to build (e.g. 0.9.2)'
        required: true
        default: '0.9.2'
  pull_request:
    paths:
      - '.github/workflows/build-keystone-engine.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.9.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  KEYSTONE_ENGINE_VERSION: ${{ inputs.version || '0.9.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build keystone-engine ${{ inputs.version || '0.9.2' }} py2.py3-none-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout keystone ${{ env.KEYSTONE_ENGINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: keystone-engine/keystone
          ref: ${{ env.KEYSTONE_ENGINE_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse/
          # setup.py ships no ext_modules (the C library is loaded via ctypes) and
          # setup.cfg sets bdist_wheel universal=1, so setuptools tags the wheel
          # py2.py3-none and one build serves every interpreter.
          only: cp312-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # setup.py shells out to `cmake`/`make` directly (make-share.sh); neither is
          # a declared build dep. Installed from the image's own package manager rather
          # than pip: pypi.riseproject.dev carries no musllinux riscv64 cmake wheel at
          # all, and lags PyPI's own latest cmake for manylinux too (gotcha 84) - and
          # both give a cmake < 4, needed below. The vendored llvm/cmake/config.guess is
          # stamped 2011, predates riscv64, and fails "unable to guess system type"; the
          # automake package's copy already knows riscv64 (gotcha 138).
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            if command -v apk > /dev/null; then
              apk add --no-cache cmake automake
            else
              dnf install -y cmake automake
            fi
            cp /usr/share/automake-*/config.guess llvm/cmake/config.guess
          # Both images also carry a newer cmake (>= 4) ahead on PATH by default; that
          # version hard-rejects CMakeLists.txt's `cmake_policy(SET CMP0051 OLD)`
          # ("no longer supports it"), where the one just installed above still can.
          # CMAKE_POLICY_VERSION_MINIMUM=3.5 covers cmake_minimum_required(VERSION 2.8.7)
          # similarly, should PATH resolution ever pick the newer cmake up again.
          CIBW_ENVIRONMENT: CMAKE_POLICY_VERSION_MINIMUM=3.5 PATH=/usr/bin:$PATH
          CIBW_TEST_SOURCES: bindings/python/sample.py
          CIBW_TEST_COMMAND: python bindings/python/sample.py

      - name: Check the wheel carries libkeystone and its licence
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith("keystone/libkeystone.so") for n in names), whl
              licences = {n.rsplit("/", 1)[-1] for n in names if "dist-info/" in n and "LICENSE" in n}
              assert licences == {"LICENSE.TXT"}, (whl, licences)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: keystone-engine-${{ env.KEYSTONE_ENGINE_VERSION }}-py2.py3-none-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish keystone-engine ${{ inputs.version || '0.9.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: keystone-engine-${{ inputs.version || '0.9.2' }}-*riscv64
