---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/scikit-hep/boost-histogram/blob/v1.8.1/.github/workflows/wheels.yml
name: Build boost-histogram wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/boost-histogram.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-boost-histogram.yml'
      - 'docs/packages/boost-histogram.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boost-histogram.yml'
      - 'docs/packages/boost-histogram.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: boost-histogram
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build boost-histogram ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # hypothesis (a test dependency) ships no riscv64 wheel for PyPI's
          # newest release on the free-threaded ABI; our own registry's older
          # build does. Widening UV_ONLY_BINARY doesn't help - uv's resolver
          # still picks the newest version first and tries to build its sdist
          # (which needs a Rust toolchain riscv64 lacks) rather than falling
          # back to a version with a usable wheel, so pin the version instead.
          - python: "cp314t"
            test_requires: "hypothesis==6.165.10"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: boost-histogram
      version: ${{ matrix.version }}
      # The PyPI sdist contains the vendored Boost.Histogram/Core/Mp11 headers.
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-manylinux_riscv64
      cibw-build: ${{ matrix.python }}-*
      # numpy (a hard runtime dependency) ships no musllinux riscv64 wheel
      # anywhere, so musllinux is dropped (workflow-anatomy.md: an accepted
      # outcome).
      cibw-skip: "*-musllinux_*"
      # CIBW_ENVIRONMENT replaces, rather than merges into, upstream's own
      # [tool.cibuildwheel] environment table (CLAUDE.md gotcha 107), so its
      # four keys are repeated here alongside our registry. The test-install
      # step resolves with uv, which only reads UV_* names, not PIP_* (CLAUDE.md
      # gotcha 244), so both are set.
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy
        PIP_PREFER_BINARY=1
        UV_ONLY_BINARY=numpy
        UV_PREFER_BINARY=1
        UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        UV_INDEX_STRATEGY=unsafe-best-match
      cibw-test-requires: ${{ matrix.test_requires }}

  publish:
    name: Publish boost-histogram ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: boost-histogram-${{ matrix.version }}-*-manylinux_riscv64
