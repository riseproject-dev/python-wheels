---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/scikit-hep/boost-histogram/blob/v1.8.1/.github/workflows/wheels.yml
name: Build boost-histogram wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/boost-histogram.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-boost-histogram.yml'
      - 'docs/packages/boost-histogram.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-boost-histogram.yml'
      - 'docs/packages/boost-histogram.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: boost-histogram
      version: ${{ inputs.version }}

  build_sdist:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # The sdist packages the source tree plus the vendored Boost.Histogram/Core/Mp11/
    # Config/ThrowException/Assert/Variant2 headers (git submodules) and a
    # setuptools-scm-derived version. It's architecture-independent, so build it once
    # on x86 instead of burning a scarce riscv runner (CLAUDE.md gotcha 4).
    name: Build boost-histogram ${{ matrix.version }} sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOST_HISTOGRAM_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout boost-histogram v${{ env.BOOST_HISTOGRAM_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scikit-hep/boost-histogram
          ref: v${{ env.BOOST_HISTOGRAM_VERSION }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Build sdist
        id: sdist
        run: |
          uv pip install build twine
          python -m build --sdist
          twine check --strict dist/*.tar.gz

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: boost-histogram-${{ env.BOOST_HISTOGRAM_VERSION }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    needs: [setup, build_sdist]
    if: needs.setup.outputs.versions != '[]'
    name: Build boost-histogram ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]
        include:
          # hypothesis (a test dependency) ships no riscv64 wheel for PyPI's
          # newest release on the free-threaded ABI; our own registry's older
          # build does. Widening UV_ONLY_BINARY doesn't help - uv's resolver
          # still picks the newest version first and tries to build its sdist
          # (which needs a Rust toolchain riscv64 lacks) rather than falling
          # back to a version with a usable wheel, so pin the version instead.
          - python: "cp314t"
            test_requires: "hypothesis==6.165.10"

    env:
      BOOST_HISTOGRAM_VERSION: ${{ matrix.version }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: boost-histogram-${{ env.BOOST_HISTOGRAM_VERSION }}-sdist
          path: dist/

      - id: sdist_path
        run: echo "path=$(echo dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: ${{ steps.sdist_path.outputs.path }}
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS: riscv64
          # numpy (a hard runtime dependency) ships no musllinux riscv64 wheel
          # anywhere, so musllinux is dropped (workflow-anatomy.md: an accepted
          # outcome).
          CIBW_SKIP: '*-musllinux_*'
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # CIBW_ENVIRONMENT replaces, rather than merges into, upstream's own
          # [tool.cibuildwheel] environment table (CLAUDE.md gotcha 107), so its
          # four keys are repeated here alongside our registry. The test-install
          # step resolves with uv, which only reads UV_* names, not PIP_* (CLAUDE.md
          # gotcha 244), so both are set.
          CIBW_ENVIRONMENT: >-
            PIP_ONLY_BINARY=numpy
            PIP_PREFER_BINARY=1
            UV_ONLY_BINARY=numpy
            UV_PREFER_BINARY=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            UV_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            UV_INDEX_STRATEGY=unsafe-best-match
          CIBW_TEST_REQUIRES: ${{ matrix.test_requires }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: boost-histogram-${{ env.BOOST_HISTOGRAM_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish boost-histogram ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: boost-histogram-${{ matrix.version }}-*-manylinux_riscv64
