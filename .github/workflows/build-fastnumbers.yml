---
# This workflow is based on the `build` job of
# https://github.com/SethMMorton/fastnumbers/blob/5.2.0/.github/workflows/deploy.yml
name: Build fastnumbers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'fastnumbers version to build (git tag, e.g. 5.2.0)'
        required: true
        default: '5.2.0'
  pull_request:
    paths:
      - '.github/workflows/build-fastnumbers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '5.2.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  FASTNUMBERS_VERSION: ${{ inputs.version || '5.2.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build fastnumbers ${{ inputs.version || '5.2.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout fastnumbers ${{ env.FASTNUMBERS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SethMMorton/fastnumbers
          ref: ${{ env.FASTNUMBERS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest pytest-faulthandler hypothesis typing_extensions numpy
          CIBW_TEST_COMMAND: >-
            cd {project} &&
            pytest --hypothesis-profile=standard --doctest-glob=README.rst

      - name: Check the C++ extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "fastnumbers" in n for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastnumbers-${{ env.FASTNUMBERS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastnumbers ${{ inputs.version || '5.2.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fastnumbers-${{ inputs.version || '5.2.0' }}-*-manylinux_riscv64
