---
# This workflow is based on the `build` job of
# https://github.com/SethMMorton/fastnumbers/blob/5.2.0/.github/workflows/deploy.yml
name: Build fastnumbers wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastnumbers.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastnumbers.yml'
      - 'docs/packages/fastnumbers.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastnumbers.yml'
      - 'docs/packages/fastnumbers.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastnumbers
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastnumbers ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      FASTNUMBERS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout fastnumbers ${{ env.FASTNUMBERS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: SethMMorton/fastnumbers
          ref: ${{ env.FASTNUMBERS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # PyPI's newest hypothesis has no riscv64 wheel (maturin sdist, needs Rust);
          # pin to binary-only so pip resolves our registry's riscv64 wheel instead
          # of the newer sdist-only release (gotcha 210).
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=hypothesis
          CIBW_TEST_REQUIRES: pytest pytest-faulthandler hypothesis typing_extensions numpy
          CIBW_TEST_COMMAND: >-
            cd {project} &&
            pytest --hypothesis-profile=standard --doctest-glob=README.rst

      - name: Check the C++ extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.endswith(".so") and "fastnumbers" in n for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fastnumbers-${{ env.FASTNUMBERS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish fastnumbers ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: fastnumbers-${{ matrix.version }}-*-manylinux_riscv64
