---
# datafusion-query-builder has no public source repository and no public CI: Pydantic
# publishes only the PyPI sdist, which carries the whole crate (including Cargo.lock), so
# the sdist is the upstream tree and is fetched here. Everything else mirrors upstream's
# packaging: maturin over the root Cargo.toml with the `python`/`extension-module`
# features, pyo3 abi3-py39, one abi3 wheel plus a free-threaded one.
name: Build datafusion-query-builder wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/datafusion-query-builder.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-datafusion-query-builder.yml'
      - 'docs/packages/datafusion-query-builder.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-datafusion-query-builder.yml'
      - 'docs/packages/datafusion-query-builder.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: datafusion-query-builder
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build datafusion-query-builder ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # `tag` is a real matrix dimension, not an include-only key: two includes
        # that add the same new key collapse into one job (gotcha 402).
        tag: [cp39-abi3, cp314t]
        include:
          # pyo3's abi3-py39 feature is on unconditionally (Cargo.toml), so one
          # wheel serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          - tag: cp39-abi3
            build: >-
              cp39-manylinux_riscv64 cp310-manylinux_riscv64
              cp311-manylinux_riscv64 cp312-manylinux_riscv64
              cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      DQB_VERSION: ${{ matrix.version }}

    steps:
      - name: Fetch datafusion-query-builder ${{ env.DQB_VERSION }} sdist
        run: |
          set -euo pipefail
          url="$(curl -sSfL "https://pypi.org/pypi/datafusion-query-builder/${DQB_VERSION}/json" \
            | python3 -c 'import json,sys; print(next(u["url"] for u in json.load(sys.stdin)["urls"] if u["packagetype"] == "sdist"))')"
          curl -sSfL -o sdist.tar.gz "$url"
          tar xzf sdist.tar.gz
          mv "datafusion_query_builder-${DQB_VERSION}" pkg
          test -f pkg/pyproject.toml
          test -f pkg/Cargo.lock

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: pkg
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BUILD: ${{ matrix.build }}
          # No [tool.cibuildwheel] table upstream, so the Rust toolchain
          # maturin needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          # [patch.crates-io] redirects sqlparser to a git branch; the CLI fetcher
          # is more reliable for that than cargo's own libgit2, same as upstream.
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            CARGO_NET_GIT_FETCH_WITH_CLI=true
          CIBW_TEST_SOURCES: pkg/tests
          CIBW_TEST_COMMAND: python pkg/tests/test_python.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: datafusion-query-builder-${{ env.DQB_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish datafusion-query-builder ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: datafusion-query-builder-${{ matrix.version }}-*-manylinux_riscv64
