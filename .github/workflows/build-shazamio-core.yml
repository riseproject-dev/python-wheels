---
# This workflow is based on the `linux` job of
# https://github.com/shazamio/shazamio-core/blob/1.2.0/.github/workflows/ci.yaml
name: Build shazamio-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/shazamio-core.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-shazamio-core.yml'
      - 'docs/packages/shazamio-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-shazamio-core.yml'
      - 'docs/packages/shazamio-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: shazamio-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build shazamio-core ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; upstream builds no free-threaded
          # wheel (no gil_used declared), so there is no second tag.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "shazamio-core"
      version: "${{ matrix.version }}"
      repository: "shazamio/shazamio-core"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 120
      cibw-build: "${{ matrix.build }}"
      # shazamio-core ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Mirror upstream's own `test` job (pip install . pytest pytest-asyncio
      # && pytest). test_the_flac_signature_matches_the_golden_uri compares the
      # fingerprint of a decoded FLAC against a URI pinned on x86 Linux; on
      # riscv64 the decoder yields a different (but valid) signature, so it is
      # deselected. Every other test, including the mp3/ogg/opus decode and the
      # bytes-vs-path equivalence ones, runs.
      cibw-test-requires: "pytest pytest-asyncio"
      cibw-test-command: >
        pytest {package}/tests -v
        -k "not test_the_flac_signature_matches_the_golden_uri"

  publish:
    name: Publish shazamio-core ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: shazamio-core-${{ matrix.version }}-*-manylinux_riscv64
