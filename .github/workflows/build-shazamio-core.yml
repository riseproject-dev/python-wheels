---
# This workflow is based on the `linux` job of
# https://github.com/shazamio/shazamio-core/blob/1.2.0/.github/workflows/ci.yaml
name: Build shazamio-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/shazamio-core.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-shazamio-core.yml'
      - 'docs/packages/shazamio-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-shazamio-core.yml'
      - 'docs/packages/shazamio-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: shazamio-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build shazamio-core ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; upstream builds no free-threaded
          # wheel (no gil_used declared), so there is no second tag.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64

    env:
      SHAZAMIO_CORE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout shazamio-core ${{ env.SHAZAMIO_CORE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: shazamio/shazamio-core
          ref: ${{ env.SHAZAMIO_CORE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # shazamio-core ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          # Mirror upstream's own `test` job (pip install . pytest pytest-asyncio
          # && pytest).
          CIBW_TEST_REQUIRES: pytest pytest-asyncio
          CIBW_TEST_COMMAND: pytest {package}/tests -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shazamio-core-${{ env.SHAZAMIO_CORE_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish shazamio-core ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: shazamio-core-${{ matrix.version }}-*-manylinux_riscv64
