---
# Based on upstream's own wheel build:
#   https://github.com/aboSamoor/pycld2/blob/v0.3.0/.github/workflows/pythonpackage.yaml
name: Build pycld2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pycld2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pycld2.yml'
      - 'docs/packages/pycld2.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pycld2.yml'
      - 'docs/packages/pycld2.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pycld2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pycld2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pycld2
      version: ${{ matrix.version }}
      repository: aboSamoor/pycld2
      ref: bc9d269f603dc79d4a6e64887065839e62ef3dde
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # No git tag was ever pushed for the 0.42 PyPI release (upstream tagged this
      # commit v0.3.0 while PYCLD2_VERSION in bindings/pycldmodule.cc already read
      # "0.42"); pin the commit proven byte-identical to the released sdist and
      # move it together with the package version.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # test_pycld2.py lives next to the pycld2/ source package at the repo
      # root; without test-sources cibuildwheel would run it from a cwd
      # where that source package shadows the installed wheel (gotcha 25).
      cibw-test-sources: test_pycld2.py
      cibw-test-command: >-
        python -c "import pycld2; assert pycld2._pycld2.__file__.endswith(('.so', '.pyd')), pycld2._pycld2.__file__" &&
        python test_pycld2.py
      timeout-minutes: 60

  publish:
    name: Publish pycld2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pycld2-${{ matrix.version }}-*riscv64
