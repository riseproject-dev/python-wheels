---
# Based on the `build_wheels` job of upstream's own release workflow:
#   https://github.com/silx-kit/silx/blob/v3.1.1/.github/workflows/release.yml
name: Build silx wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/silx.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-silx.yml'
      - 'docs/packages/silx.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-silx.yml'
      - 'docs/packages/silx.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: silx
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build silx ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "silx"
      version: "${{ matrix.version }}"
      repository: "silx-kit/silx"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build-frontend: "build; args: -C setup-args=-Duse_openmp=disabled"
      cibw-environment-linux: "WITH_QT_TEST=False WITH_GL_TEST=False SILX_OPENCL=False"
      # The `full,test` extras pull PySide6, pyopencl and bitshuffle, none of
      # which has a riscv64 wheel; install the rest of both extras instead.
      # h5pyd 1.0 (released after silx 3.1.1) probes /about, which the mock
      # server in silx.io.test.test_utils::test_open_h5pyd does not serve.
      cibw-test-environment: "PIP_ONLY_BINARY=:all:"
      cibw-test-requires: >
        matplotlib python-dateutil scipy pooch Pillow pint hdf5plugin
        h5pyd<1 imageio[tifffile] pytest pytest-mock pytest-httpserver
      # Without a Qt binding, every test module under silx.gui, silx.app.view,
      # silx.app.compare and silx.test.test_sx fails to import at collection
      # time (WITH_QT_TEST=False only skips tests that did import), so leave
      # them out. Same on every architecture.
      cibw-test-command: >
        d="$(python -c 'import os, silx; print(os.path.dirname(silx.__file__))')" &&
        pytest --verbosity=3 --pyargs silx
        --ignore="$d/gui" --ignore="$d/app/view" --ignore="$d/app/compare"
        --ignore="$d/test/test_sx.py"

  publish:
    name: Publish silx ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: silx-${{ matrix.version }}-*-manylinux_riscv64
