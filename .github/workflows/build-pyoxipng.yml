---
# This workflow is based on the `linux` job of
# https://github.com/nfrasser/pyoxipng/blob/v9.1.1/.github/workflows/CI.yml
name: Build pyoxipng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyoxipng.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyoxipng.yml'
      - 'docs/packages/pyoxipng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyoxipng.yml'
      - 'docs/packages/pyoxipng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyoxipng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyoxipng ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYOXIPNG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyoxipng v${{ env.PYOXIPNG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nfrasser/pyoxipng
          ref: v${{ env.PYOXIPNG_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyoxipng ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test
          # pyoxipng's pyproject.toml has no python-source; maturin
          # auto-generates an oxipng/__init__.py shim ("from .oxipng import
          # *") around the compiled oxipng.oxipng submodule, so that's the
          # .so to check.
          CIBW_TEST_COMMAND: >-
            python -c "import oxipng.oxipng as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyoxipng-${{ env.PYOXIPNG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyoxipng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyoxipng-${{ matrix.version }}-*-manylinux_riscv64
