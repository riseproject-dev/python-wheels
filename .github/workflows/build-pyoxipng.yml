---
# This workflow is based on the `linux` job of
# https://github.com/nfrasser/pyoxipng/blob/v9.1.1/.github/workflows/CI.yml
name: Build pyoxipng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyoxipng version to build (git tag without the leading v, e.g. 9.1.1)'
        required: true
        default: '9.1.1'
  pull_request:
    paths:
      - '.github/workflows/build-pyoxipng.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '9.1.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 9.1.1 there.
  PYOXIPNG_VERSION: ${{ inputs.version || '9.1.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyoxipng ${{ inputs.version || '9.1.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pyoxipng v${{ env.PYOXIPNG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nfrasser/pyoxipng
          ref: v${{ env.PYOXIPNG_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pyoxipng ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: test
          # pyoxipng's pyproject.toml has no python-source; maturin
          # auto-generates an oxipng/__init__.py shim ("from .oxipng import
          # *") around the compiled oxipng.oxipng submodule, so that's the
          # .so to check.
          CIBW_TEST_COMMAND: >-
            python -c "import oxipng.oxipng as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyoxipng-${{ env.PYOXIPNG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyoxipng ${{ inputs.version || '9.1.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyoxipng-${{ inputs.version || '9.1.1' }}-*-manylinux_riscv64
