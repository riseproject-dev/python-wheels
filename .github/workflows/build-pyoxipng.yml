---
# This workflow is based on the `linux` job of
# https://github.com/nfrasser/pyoxipng/blob/v9.1.1/.github/workflows/CI.yml
name: Build pyoxipng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyoxipng.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyoxipng.yml'
      - 'docs/packages/pyoxipng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyoxipng.yml'
      - 'docs/packages/pyoxipng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyoxipng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyoxipng ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyoxipng"
      version: "${{ matrix.version }}"
      repository: "nfrasser/pyoxipng"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pyoxipng ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "test"
      # pyoxipng's pyproject.toml has no python-source; maturin
      # auto-generates an oxipng/__init__.py shim ("from .oxipng import
      # *") around the compiled oxipng.oxipng submodule, so that's the
      # .so to check.
      cibw-test-command: >
        python -c "import oxipng.oxipng as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v test

  publish:
    name: Publish pyoxipng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyoxipng-${{ matrix.version }}-*-manylinux_riscv64
