---
# Based on the `version-bump`/`build-wheels-linux` jobs of
# https://github.com/xa11y/xa11y/blob/v0.15.2/.github/workflows/publish.yml
# and the `python` job of https://github.com/xa11y/xa11y/blob/v0.15.2/.github/workflows/ci.yml
name: Build xa11y wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/xa11y.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xa11y.yml'
      - 'docs/packages/xa11y.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-xa11y.yml'
      - 'docs/packages/xa11y.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: xa11y
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build xa11y ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}

    # Upstream's release job stamps the workspace version into xa11y-python after tagging.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "xa11y"
      version: "${{ matrix.version }}"
      repository: "xa11y/xa11y"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 120
      pre-build: |-
        export XA11Y_VERSION='${{ matrix.version }}'
        VERSION=$(sed -n '/\[workspace\.package\]/,/\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
        test "$VERSION" = "$XA11Y_VERSION"
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" xa11y-python/Cargo.toml

        cp LICENSE xa11y-python/
      cibw-package-dir: "xa11y-python"
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
        dnf install -y dbus-devel libxkbcommon-devel &&
        cp /usr/share/licenses/libxkbcommon/LICENSE {project}/xa11y-python/LICENSE.libxkbcommon
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "pytest"
      cibw-test-sources: "xa11y-python/tests"
      cibw-test-command: >
        python -c "import importlib.metadata as md;
        lic = {p.name for p in md.files('xa11y') if '.dist-info/licenses/' in str(p)} - {''};
        assert lic == {'LICENSE', 'LICENSE.libxkbcommon'}, lic" &&
        python -m pytest -v xa11y-python/tests

  publish:
    name: Publish xa11y ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: xa11y-${{ matrix.version }}-*-manylinux_riscv64
