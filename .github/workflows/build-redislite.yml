---
# This workflow is based on upstream's Screwdriver pipeline (pkg_ml2014 and
# validate_test jobs) at
# https://github.com/yahoo/redislite/blob/802f8a09fa23470942f8358dee1aa32dc975ea7a/screwdriver.yaml
# with its tox.ini test command.
name: Build redislite wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/redislite.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-redislite.yml'
      - 'docs/packages/redislite.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-redislite.yml'
      - 'docs/packages/redislite.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream pushes no tag for its releases: 6.2.912183 is commit 802f8a0, whose tree is
  # byte-identical to the PyPI sdist apart from the version. Update it alongside REDISLITE_VERSION.
  REDISLITE_REF: 802f8a09fa23470942f8358dee1aa32dc975ea7a
  REDIS_VERSION: '6.2.14'
  REDIS_SHA256: 34e74856cbd66fdb3a684fb349d93961d8c7aa668b06f81fd93ff267d09bc277
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: redislite
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build redislite ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "redislite"
      version: "${{ matrix.version }}"
      repository: "yahoo/redislite"
      ref: "802f8a09fa23470942f8358dee1aa32dc975ea7a"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120
      pre-build: |-
        export REDIS_VERSION=6.2.14
        export REDIS_SHA256=34e74856cbd66fdb3a684fb349d93961d8c7aa668b06f81fd93ff267d09bc277
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply --verbose python-wheels/patches/redislite/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        set -eux
        curl -sSfL -o redis.tar.gz "https://download.redis.io/releases/redis-${REDIS_VERSION}.tar.gz"
        echo "${REDIS_SHA256}  redis.tar.gz" | sha256sum -c -
        mkdir redis.submodule
        tar xzf redis.tar.gz --strip-components=1 -C redis.submodule
        rm redis.tar.gz

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests pytest.ini"
      cibw-test-command: "pytest tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      REDISLITE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: redislite-${{ env.REDISLITE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the Redis binaries and licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import os, sys, zipfile
          whl = sys.argv[1]
          assert os.path.basename(whl).startswith(f"redislite-{os.environ['REDISLITE_VERSION']}-"), whl
          names = zipfile.ZipFile(whl).namelist()
          for want in ("redislite/bin/redis-server", "redislite/bin/redis-cli"):
              assert want in names, (whl, want)
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert {"LICENSE.txt", "redis.submodule/COPYING", "redis.submodule/deps/lua/COPYRIGHT"} <= licences, licences
          print(whl, "ok")
          EOF

  publish:
    name: Publish redislite ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: redislite-${{ matrix.version }}-*-manylinux_riscv64
