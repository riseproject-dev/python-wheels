---
name: Build tinyobjloader wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tinyobjloader.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tinyobjloader.yml'
      - 'docs/packages/tinyobjloader.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tinyobjloader.yml'
      - 'docs/packages/tinyobjloader.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tinyobjloader
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tinyobjloader ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tinyobjloader"
      version: "${{ matrix.version }}"
      repository: "tinyobjloader/tinyobjloader"
      ref: "v${{ matrix.version }}"
      checkout-fetch-tags: true
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-fetch-depth: 0
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
      # It's only a test dependency: the wheel itself declares none.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "numpy"
      # Upstream ships no automated test suite at this tag; python/sample.py is
      # its own smoke-test script exercising parsing, attributes, materials,
      # shapes, and the numpy_* accessors against models/cornell_box.obj.
      cibw-test-command: "cd {project}/python && python sample.py"

  publish:
    name: Publish tinyobjloader ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tinyobjloader-${{ matrix.version }}-*-manylinux_riscv64
