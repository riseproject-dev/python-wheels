---
name: Build tinyobjloader wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tinyobjloader version to build (git tag without the leading v, e.g. 2.0.0rc13)'
        required: true
        default: '2.0.0rc13'
  pull_request:
    paths:
      - '.github/workflows/build-tinyobjloader.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.0.0rc13' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  TINYOBJLOADER_VERSION: ${{ inputs.version || '2.0.0rc13' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build tinyobjloader ${{ inputs.version || '2.0.0rc13' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout tinyobjloader v${{ env.TINYOBJLOADER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tinyobjloader/tinyobjloader
          ref: v${{ env.TINYOBJLOADER_VERSION }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
          # It's only a test dependency: the wheel itself declares none.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: numpy
          # Upstream ships no automated test suite at this tag; python/sample.py is
          # its own smoke-test script exercising parsing, attributes, materials,
          # shapes, and the numpy_* accessors against models/cornell_box.obj.
          CIBW_TEST_COMMAND: cd {project}/python && python sample.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tinyobjloader-${{ env.TINYOBJLOADER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish tinyobjloader ${{ inputs.version || '2.0.0rc13' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: tinyobjloader-${{ inputs.version || '2.0.0rc13' }}-*-manylinux_riscv64
