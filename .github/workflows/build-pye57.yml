---
# This workflow is based on the `build_wheels` job of
# https://github.com/davidcaron/pye57/blob/v0.4.19/.github/workflows/build.yml
name: Build pye57 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pye57.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pye57.yml'
      - 'docs/packages/pye57.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pye57.yml'
      - 'docs/packages/pye57.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pye57
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pye57 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pye57"
      version: "${{ matrix.version }}"
      repository: "davidcaron/pye57"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 120
      checkout-submodules: "recursive"
      pre-build: |-
        cp libE57Format/LICENSE.md LICENSE.libE57Format.md
        cp libE57Format/extern/CRCpp/LICENSE LICENSE.CRCpp
        xerces_version=$(sed -n 's/^XERCES_\(MAJOR\|MINOR\|PATCH\)=//p' scripts/install_xerces_c.sh | paste -sd.)
        curl -fsSL --retry 5 -o LICENSE.xerces-c "https://raw.githubusercontent.com/apache/xerces-c/v${xerces_version}/LICENSE"
        curl -fsSL --retry 5 -o NOTICE.xerces-c "https://raw.githubusercontent.com/apache/xerces-c/v${xerces_version}/NOTICE"

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      cibw-before-all-linux: "bash scripts/install_xerces_c.sh"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYE57_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pye57-${{ env.PYE57_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the bundled licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE", "LICENSE.libE57Format.md", "LICENSE.CRCpp", "LICENSE.xerces-c", "NOTICE.xerces-c"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n}
              assert expected <= found, f"{whl}: missing {expected - found}"
              libs = [n for n in names if n.startswith("pye57.libs/") and not n.endswith("/")]
              assert libs and all("libxerces-c" in n for n in libs), f"{whl}: unexpected grafted libraries {libs}"
              print(whl, "ok")
          EOF

  publish:
    name: Publish pye57 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pye57-${{ matrix.version }}-*-manylinux_riscv64
