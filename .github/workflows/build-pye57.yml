---
# This workflow is based on the `build_wheels` job of
# https://github.com/davidcaron/pye57/blob/v0.4.19/.github/workflows/build.yml
name: Build pye57 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pye57.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pye57.yml'
      - 'docs/packages/pye57.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pye57.yml'
      - 'docs/packages/pye57.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pye57
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pye57 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's CIBW_SKIP excludes cp3??t-manylinux*.
        python: ["cp312", "cp313", "cp314"]

    env:
      PYE57_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pye57 ${{ env.PYE57_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: davidcaron/pye57
          ref: v${{ env.PYE57_VERSION }}
          submodules: recursive
          persist-credentials: false

      # Upstream's wheel bundles libE57Format, CRCpp and Xerces-C but ships none of their licences.
      - name: Stage the bundled dependencies' licences
        run: |
          cp libE57Format/LICENSE.md LICENSE.libE57Format.md
          cp libE57Format/extern/CRCpp/LICENSE LICENSE.CRCpp
          xerces_version=$(sed -n 's/^XERCES_\(MAJOR\|MINOR\|PATCH\)=//p' scripts/install_xerces_c.sh | paste -sd.)
          curl -fsSL --retry 5 -o LICENSE.xerces-c "https://raw.githubusercontent.com/apache/xerces-c/v${xerces_version}/LICENSE"
          curl -fsSL --retry 5 -o NOTICE.xerces-c "https://raw.githubusercontent.com/apache/xerces-c/v${xerces_version}/NOTICE"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_BEFORE_ALL_LINUX: "bash scripts/install_xerces_c.sh"
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy

      - name: Check the bundled licences made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"LICENSE", "LICENSE.libE57Format.md", "LICENSE.CRCpp", "LICENSE.xerces-c", "NOTICE.xerces-c"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.rsplit("/", 1)[1] for n in names if ".dist-info/licenses/" in n}
              assert expected <= found, f"{whl}: missing {expected - found}"
              libs = [n for n in names if n.startswith("pye57.libs/")]
              assert libs and all("libxerces-c" in n for n in libs), f"{whl}: unexpected grafted libraries {libs}"
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pye57-${{ env.PYE57_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pye57 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pye57-${{ matrix.version }}-*-manylinux_riscv64
