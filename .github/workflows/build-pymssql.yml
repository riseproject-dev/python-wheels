---
# This workflow is based on: https://github.com/pymssql/pymssql/blob/v2.3.13/.github/workflows/build_wheels.yml
name: Build pymssql wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymssql.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymssql.yml'
      - 'docs/packages/pymssql.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymssql.yml'
      - 'docs/packages/pymssql.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymssql
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymssql ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pymssql"
      version: "${{ matrix.version }}"
      repository: "pymssql/pymssql"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 120

      # The wheel statically links FreeTDS but ships only pymssql's own LICENSE.
      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Restates upstream's [tool.cibuildwheel.linux] environment, which CIBW_ENVIRONMENT
      # replaces wholesale; the patch above leaves the tree dirty, so pin the version.
      cibw-environment-linux: "PYMSSQL_FREETDS=./deps LD_LIBRARY_PATH=./deps/lib CFLAGS=-Wno-incompatible-pointer-types SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYMSSQL=${{ matrix.version }}"
      # Upstream's before-test installs dev/requirements-test.txt, whose gevent has no
      # riscv64 wheel anywhere; test_green.py importorskips it, so drop just that one.
      cibw-before-test: "pip install pytest-subtests pytest-timeout \"psutil<7.2.3\" sqlalchemy"
      # No SQL Server image exists for riscv64, so the mssql_server_required tests
      # self-skip (tests/conftest.py); assert the patched licence shipped first.
      cibw-test-command: "python -c \"import importlib.metadata as m; f = sorted(p.name for p in m.files('pymssql') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.freetds'], f\" && pytest {project}/tests"

  publish:
    name: Publish pymssql ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pymssql-${{ matrix.version }}-*-manylinux_riscv64
