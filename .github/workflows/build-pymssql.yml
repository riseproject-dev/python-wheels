---
# This workflow is based on: https://github.com/pymssql/pymssql/blob/v2.3.13/.github/workflows/build_wheels.yml
name: Build pymssql wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pymssql.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pymssql.yml'
      - 'docs/packages/pymssql.yaml'
      - 'patches/pymssql/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pymssql.yml'
      - 'docs/packages/pymssql.yaml'
      - 'patches/pymssql/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pymssql
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pymssql ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No cp314t: upstream skips free-threaded builds (pyproject `skip = "cp31?t-*"`),
        # the extensions don't declare Py_mod_gil, and PyPI ships no cp314t wheel.
        python:
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      PYMSSQL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pymssql v${{ env.PYMSSQL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pymssql/pymssql
          ref: v${{ env.PYMSSQL_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      # The wheel statically links FreeTDS but ships only pymssql's own LICENSE.
      - name: Patch pymssql source
        run: |
          git apply python-wheels/patches/pymssql/${{ env.PYMSSQL_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Restates upstream's [tool.cibuildwheel.linux] environment, which CIBW_ENVIRONMENT
          # replaces wholesale; the patch above leaves the tree dirty, so pin the version.
          CIBW_ENVIRONMENT: >-
            PYMSSQL_FREETDS=./deps
            LD_LIBRARY_PATH=./deps/lib
            CFLAGS=-Wno-incompatible-pointer-types
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYMSSQL=${{ env.PYMSSQL_VERSION }}
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Upstream's before-test installs dev/requirements-test.txt, whose gevent has no
          # riscv64 wheel anywhere; test_green.py importorskips it, so drop just that one.
          CIBW_BEFORE_TEST: pip install pytest-subtests pytest-timeout "psutil<7.2.3" sqlalchemy
          # No SQL Server image exists for riscv64, so the mssql_server_required tests
          # self-skip (tests/conftest.py); assert the patched licence shipped first.
          CIBW_TEST_COMMAND: python -c "import importlib.metadata as m; f = sorted(p.name for p in m.files('pymssql') if '.dist-info/licenses/' in str(p)); assert f == ['LICENSE', 'LICENSE.freetds'], f" && pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymssql-${{ env.PYMSSQL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pymssql ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pymssql-${{ matrix.version }}-*-manylinux_riscv64
