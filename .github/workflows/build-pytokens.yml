---
# This workflow is based on: https://github.com/tusharsadhwani/pytokens/blob/0.4.1/.github/workflows/wheels.yml
name: Build pytokens wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pytokens version to build (git tag, e.g. 0.4.1)'
        required: true
        default: '0.4.1'
  pull_request:
    paths:
      - '.github/workflows/build-pytokens.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.4.1 there.
  PYTOKENS_VERSION: ${{ inputs.version || '0.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pytokens ${{ inputs.version || '0.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        # mypyc emits per-interpreter (non-abi3) wheels, one build each.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pytokens ${{ env.PYTOKENS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tusharsadhwani/pytokens
          ref: ${{ env.PYTOKENS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # Upstream never tests its wheels in cibuildwheel; run the suite tox runs.
          # The import assert catches a silently-uncompiled (pure-Python) wheel.
          CIBW_TEST_COMMAND: >-
            python -c "import pytokens; assert pytokens.__file__.endswith('.so'), pytokens.__file__"
            && python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytokens-${{ env.PYTOKENS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pytokens ${{ inputs.version || '0.4.1' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pytokens-${{ inputs.version || '0.4.1' }}-*-manylinux_riscv64
