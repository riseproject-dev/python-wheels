---
# This workflow is based on: https://github.com/tusharsadhwani/pytokens/blob/0.4.1/.github/workflows/wheels.yml
name: Build pytokens wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pytokens.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pytokens.yml'
      - 'docs/packages/pytokens.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pytokens.yml'
      - 'docs/packages/pytokens.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pytokens
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pytokens ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pytokens
      version: ${{ matrix.version }}
      repository: tusharsadhwani/pytokens
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      cibw-test-sources: tests
      # Upstream never tests its wheels in cibuildwheel; run the suite tox runs.
      # The import assert catches a silently-uncompiled (pure-Python) wheel.
      cibw-test-command: >-
        python -c "import pytokens; assert pytokens.__file__.endswith('.so'), pytokens.__file__"
        && python -m pytest tests

  publish:
    name: Publish pytokens ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pytokens-${{ matrix.version }}-*-manylinux_riscv64
