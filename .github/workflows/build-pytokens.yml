---
# This workflow is based on: https://github.com/tusharsadhwani/pytokens/blob/0.4.1/.github/workflows/wheels.yml
name: Build pytokens wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pytokens version to build (git tag, e.g. 0.4.1)'
        required: true
        default: '0.4.1'
  # pull_request:
  #   paths:
  #    - '.github/workflows/build-pytokens.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  # `inputs.version` is empty on pull_request events; default to 0.4.1 there.
  PYTOKENS_VERSION: ${{ inputs.version || '0.4.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build pytokens ${{ inputs.version || '0.4.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        # mypyc emits per-interpreter (non-abi3) wheels, one build each.
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout pytokens ${{ env.PYTOKENS_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: tusharsadhwani/pytokens
          ref: ${{ env.PYTOKENS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          # Upstream never tests its wheels in cibuildwheel; run the suite tox runs.
          # The import assert catches a silently-uncompiled (pure-Python) wheel.
          CIBW_TEST_COMMAND: >-
            python -c "import pytokens; assert pytokens.__file__.endswith('.so'), pytokens.__file__"
            && python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytokens-${{ env.PYTOKENS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pytokens ${{ inputs.version || '0.4.1' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: pytokens-${{ env.PYTOKENS_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
