---
# This workflow is based on: https://github.com/pyamg/pyamg/blob/v5.3.0/.github/workflows/wheels.yml
name: Build pyamg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyamg.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyamg.yml'
      - 'docs/packages/pyamg.yaml'
      - 'patches/pyamg/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyamg.yml'
      - 'docs/packages/pyamg.yaml'
      - 'patches/pyamg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyamg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyamg ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyamg"
      version: "${{ matrix.version }}"
      repository: "pyamg/pyamg"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy and scipy are runtime requirements only our registry has for
      # riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist. Patching dirties the tree,
      # so setuptools_scm would otherwise poison the version (gotcha 31).
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYAMG=${{ matrix.version }}"
      cibw-test-requires: "pytest"
      # -I: pyamg/ at the checkout root would otherwise shadow the installed
      # wheel (gotcha 25) since amg_core's __init__.py imports its compiled
      # submodules directly, with no pure-Python fallback.
      cibw-test-command: "python -I -m pytest --pyargs pyamg"

  publish:
    name: Publish pyamg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyamg-${{ matrix.version }}-*-manylinux_riscv64
