---
# This workflow is based on: https://github.com/pyamg/pyamg/blob/v5.3.0/.github/workflows/wheels.yml
name: Build pyamg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyamg.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyamg.yml'
      - 'docs/packages/pyamg.yaml'
      - 'patches/pyamg/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyamg.yml'
      - 'docs/packages/pyamg.yaml'
      - 'patches/pyamg/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyamg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyamg ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): the pybind11 extensions link the version-specific ABI.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      PYAMG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyamg v${{ env.PYAMG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyamg/pyamg
          ref: v${{ env.PYAMG_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/pyamg/${{ env.PYAMG_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy and scipy are runtime requirements only our registry has for
          # riscv64; only-binary keeps a newer PyPI release from winning the
          # resolution and then compiling from sdist. Patching dirties the tree,
          # so setuptools_scm would otherwise poison the version (gotcha 31).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYAMG=${{ env.PYAMG_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          # -I: pyamg/ at the checkout root would otherwise shadow the installed
          # wheel (gotcha 25) since amg_core's __init__.py imports its compiled
          # submodules directly, with no pure-Python fallback.
          CIBW_TEST_COMMAND: python -I -m pytest --pyargs pyamg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyamg-${{ env.PYAMG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyamg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyamg-${{ matrix.version }}-*-manylinux_riscv64
