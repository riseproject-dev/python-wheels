---
# This workflow is based on: https://github.com/benfred/implicit/blob/0.7.3/.github/workflows/build.yml
name: Build implicit wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/implicit.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-implicit.yml'
      - 'docs/packages/implicit.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-implicit.yml'
      - 'docs/packages/implicit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: implicit
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build implicit ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "implicit"
      version: "${{ matrix.version }}"
      repository: "benfred/implicit"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/implicit/${{ matrix.version }}/00*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,cython"
      # Upstream's pyproject.toml sets repair-wheel-command="" globally, only
      # to avoid auditwheel vendoring CUDA libraries on manylinux_x86_64 (see
      # ci/install_cuda_13.sh, gated to that arch alone). No CUDA toolkit is
      # present on riscv64 - CMakeLists.txt's find_package(CUDAToolkit) simply
      # skips the GPU extension - so run the normal auditwheel repair here to
      # properly vendor libgomp (CMake links OpenMP automatically when found).
      cibw-repair-wheel-command: "auditwheel repair -w {dest_dir} {wheel}"
      cibw-test-requires: "pytest"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy"
      cibw-test-command: "python -c \"import implicit.gpu; assert not implicit.gpu.HAS_CUDA\" && python -m pytest {project}/tests"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      IMPLICIT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: implicit-${{ env.IMPLICIT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for path in sys.argv[1:]:
              names = zipfile.ZipFile(path).namelist()
              assert any(n.endswith(".so") for n in names), (path, names)
              licences = {n.rsplit("/", 1)[-1] for n in names
                          if ".dist-info/licenses/" in n} - {""}
              assert licences == {"LICENSE"}, (path, licences)
              print(path, "ok")
          EOF

  gpl_sources:
    name: Collect GPL sources for implicit ${{ matrix.version }}
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_collect-gpl-sources.yml
    with:
      package: implicit
      version: ${{ matrix.version }}
      # CMake links OpenMP whenever find_package(OpenMP) succeeds (implicit's own
      # CMakeLists.txt has no way to disable it), so auditwheel repair above
      # vendors the image's libgomp into implicit.libs/.
      packages: gcc

  publish:
    name: Publish implicit ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: implicit-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: implicit-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
