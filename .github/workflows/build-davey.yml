---
# This workflow is based on the `linux` job of
# https://github.com/Snazzah/davey/blob/py-0.1.6/.github/workflows/python-test.yml
name: Build davey wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'davey version to build (git tag without the py- prefix, e.g. 0.1.6)'
        required: true
        default: '0.1.6'
  pull_request:
    paths:
      - '.github/workflows/build-davey.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.1.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.1.6 there.
  DAVEY_VERSION: ${{ inputs.version || '0.1.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build davey ${{ inputs.version || '0.1.6' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # No abi3 feature on pyo3 in davey-python/Cargo.toml, so upstream ships
        # one wheel per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout davey py-${{ env.DAVEY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Snazzah/davey
          ref: py-${{ env.DAVEY_VERSION }}
          persist-credentials: false

      - name: Stage the licence beside davey-python's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory, which
        # is davey-python here -- upstream's own published wheels carry none.
        run: cp LICENSE davey-python/LICENSE

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: davey-python
          output-dir: wheelhouse/
        env:
          # musllinux is out of reach: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # davey-python ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: davey-python/test
          CIBW_TEST_COMMAND: cd davey-python && python -m pytest test -v

      - name: Check the extension and licence made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("davey.") and n.endswith(".so") for n in names), names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: davey-${{ env.DAVEY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish davey ${{ inputs.version || '0.1.6' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: davey-${{ inputs.version || '0.1.6' }}-*-manylinux_riscv64
