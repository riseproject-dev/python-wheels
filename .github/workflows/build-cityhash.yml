---
# Based on the `build_wheels` job of
# https://github.com/escherba/python-cityhash/blob/master/.github/workflows/publish.yml
name: Build cityhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cityhash.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cityhash.yml'
      - 'docs/packages/cityhash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cityhash.yml'
      - 'docs/packages/cityhash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts the 0.4.10 release without pushing a git tag; this commit's
  # setup.py already reads VERSION = "0.4.10" and its tree is byte-identical
  # to the released sdist. Update alongside CITYHASH_VERSION once a later
  # release either gets a tag or needs the same commit-pinning treatment.
  CITYHASH_REF: 28696ac34bd3c2c1c98d406216adddc5aee1eb66
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cityhash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cityhash ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      CITYHASH_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cityhash ${{ env.CITYHASH_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: escherba/python-cityhash
          ref: ${{ env.CITYHASH_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -s {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cityhash-${{ env.CITYHASH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cityhash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cityhash-${{ matrix.version }}-*-manylinux_riscv64
