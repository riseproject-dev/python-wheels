---
# Based on the `build_wheels` job of
# https://github.com/escherba/python-cityhash/blob/master/.github/workflows/publish.yml
name: Build cityhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cityhash version to build (e.g. 0.4.10)'
        required: true
        default: '0.4.10'
  pull_request:
    paths:
      - '.github/workflows/build-cityhash.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.4.10' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CITYHASH_VERSION: ${{ inputs.version || '0.4.10' }}
  # Upstream cuts the 0.4.10 release without pushing a git tag; this commit's
  # setup.py already reads VERSION = "0.4.10" and its tree is byte-identical
  # to the released sdist. Update alongside CITYHASH_VERSION once a later
  # release either gets a tag or needs the same commit-pinning treatment.
  CITYHASH_REF: 28696ac34bd3c2c1c98d406216adddc5aee1eb66
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cityhash ${{ inputs.version || '0.4.10' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout cityhash ${{ env.CITYHASH_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: escherba/python-cityhash
          ref: ${{ env.CITYHASH_REF }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -s {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cityhash-${{ env.CITYHASH_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cityhash ${{ inputs.version || '0.4.10' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cityhash-${{ inputs.version || '0.4.10' }}-*-manylinux_riscv64
