---
# Based on the `build_wheels` job of
# https://github.com/escherba/python-cityhash/blob/master/.github/workflows/publish.yml
name: Build cityhash wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cityhash.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cityhash.yml'
      - 'docs/packages/cityhash.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cityhash.yml'
      - 'docs/packages/cityhash.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cityhash
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cityhash ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cityhash
      version: ${{ matrix.version }}
      repository: escherba/python-cityhash
      ref: 28696ac34bd3c2c1c98d406216adddc5aee1eb66
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Upstream cuts the 0.4.10 release without pushing a git tag; this commit's
      # setup.py already reads VERSION = "0.4.10" and its tree is byte-identical
      # to the released sdist. Update alongside the package version once a later
      # release either gets a tag or needs the same commit-pinning treatment.
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-requires: pytest
      cibw-test-command: pytest -s {project}/tests
      timeout-minutes: 60

  publish:
    name: Publish cityhash ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cityhash-${{ matrix.version }}-*-manylinux_riscv64
