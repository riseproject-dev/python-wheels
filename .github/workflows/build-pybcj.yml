---
# Based on upstream's wheel builder:
#   https://github.com/miurahr/pybcj/blob/main/.github/workflows/publish-to-pypi.yml
name: Build pybcj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pybcj version to build (git tag without leading v, e.g. 1.0.8)'
        required: true
        default: '1.0.8'
  pull_request:
    paths:
      - '.github/workflows/build-pybcj.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.8' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  PYBCJ_VERSION: ${{ inputs.version || '1.0.8' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  build_wheels:
    name: Build pybcj ${{ inputs.version || '1.0.8' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout pybcj v${{ env.PYBCJ_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: miurahr/pybcj
          ref: v${{ env.PYBCJ_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests
          # bcj/__init__.py silently falls back to the pure-Python filter, so assert
          # the compiled extension is what got imported before running the suite.
          CIBW_TEST_COMMAND: >-
            python -c "import bcj._bcj as m; assert m.__file__.endswith('.so'), m.__file__"
            && python -m pytest -vv -s tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pybcj-${{ env.PYBCJ_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pybcj ${{ inputs.version || '1.0.8' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: pybcj-${{ env.PYBCJ_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
