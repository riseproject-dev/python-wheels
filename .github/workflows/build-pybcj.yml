---
# Based on upstream's wheel builder:
#   https://github.com/miurahr/pybcj/blob/main/.github/workflows/publish-to-pypi.yml
name: Build pybcj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pybcj.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pybcj.yml'
      - 'docs/packages/pybcj.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pybcj.yml'
      - 'docs/packages/pybcj.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pybcj
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pybcj ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pybcj
      version: ${{ matrix.version }}
      repository: miurahr/pybcj
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-extras: test
      cibw-test-sources: tests
      # bcj/__init__.py silently falls back to the pure-Python filter, so assert
      # the compiled extension is what got imported before running the suite.
      cibw-test-command: >-
        python -c "import bcj._bcj as m; assert m.__file__.endswith('.so'), m.__file__"
        && python -m pytest -vv -s tests
      timeout-minutes: 120

  publish:
    name: Publish pybcj ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pybcj-${{ matrix.version }}-*-manylinux_riscv64
