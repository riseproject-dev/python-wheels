---
# Based on the `build_wheels` job of
# https://github.com/JoshData/fast_diff_match_patch/blob/2.1.0/.github/workflows/wheels.yml
name: Build fast-diff-match-patch wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fast-diff-match-patch.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-diff-match-patch.yml'
      - 'docs/packages/fast-diff-match-patch.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fast-diff-match-patch.yml'
      - 'docs/packages/fast-diff-match-patch.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fast-diff-match-patch
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fast-diff-match-patch ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fast-diff-match-patch
      version: ${{ matrix.version }}
      repository: JoshData/fast_diff_match_patch
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-test-command: >-
        python -c "import fast_diff_match_patch as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m unittest discover {project}/tests
      timeout-minutes: 60

  publish:
    name: Publish fast-diff-match-patch ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fast-diff-match-patch-${{ matrix.version }}-*riscv64
