---
# This workflow is based on the `manylinux_build` job of
# https://github.com/Grid2op/lightsim2grid/blob/v1.2.0/.github/workflows/main.yml
name: Build lightsim2grid wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lightsim2grid.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lightsim2grid.yml'
      - 'docs/packages/lightsim2grid.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lightsim2grid.yml'
      - 'docs/packages/lightsim2grid.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lightsim2grid
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lightsim2grid ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: lightsim2grid
      version: ${{ matrix.version }}
      repository: Grid2op/lightsim2grid
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-submodules: true
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # No CIBW_BEFORE_ALL needed: KLU/AMD/BTF/COLAMD/CXSparse/SuiteSparse_config
      # build from the checked-out SuiteSparse submodule (CMakeLists.txt
      # Strategy 4, SUITESPARSE_REQUIRE_BLAS=OFF) and Eigen is header-only, both
      # already present in the checkout -- the same path upstream's own
      # manylinux_build job relies on (no system libsuitesparse-dev installed
      # there either).
      # lightsim2grid.newtonpf (imported below) pulls in pandapower_compat,
      # which imports packaging/scipy unconditionally even though neither is
      # declared in the wheel's own [project.dependencies] (only numpy is).
      # Upstream's equivalent CI step only works because earlier steps in the
      # same job (installing requirements_compile_ci.txt, which lists scipy,
      # and setuptools, which pulls in packaging) leave both already present
      # in that runner's environment; cibuildwheel tests in a clean venv, so
      # they must be requested explicitly here.
      cibw-test-requires: packaging scipy
      # Mirrors upstream's "bare install, default numpy" import check only
      # (the grid2op/pandapower-backed check further down the same job pulls
      # in a much heavier, non-compiled dependency tree not needed to prove
      # the C++ extension itself built and loads correctly on riscv64).
      cibw-test-command: >-
        python -c "import lightsim2grid" &&
        python -c "from lightsim2grid import *" &&
        python -c "from lightsim2grid.newtonpf import newtonpf" &&
        python -c "from lightsim2grid.timeSerie import TimeSeriesCPP" &&
        python -c "from lightsim2grid.network import LSGrid"
      timeout-minutes: 360

  publish:
    name: Publish lightsim2grid ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: lightsim2grid-${{ matrix.version }}-*-manylinux_riscv64
