---
# This workflow is based on the `manylinux_build` job of
# https://github.com/Grid2op/lightsim2grid/blob/v1.2.0/.github/workflows/main.yml
name: Build lightsim2grid wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lightsim2grid.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lightsim2grid.yml'
      - 'docs/packages/lightsim2grid.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lightsim2grid.yml'
      - 'docs/packages/lightsim2grid.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lightsim2grid
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lightsim2grid ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      LIGHTSIM2GRID_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout lightsim2grid v${{ env.LIGHTSIM2GRID_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Grid2op/lightsim2grid
          ref: v${{ env.LIGHTSIM2GRID_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No CIBW_BEFORE_ALL needed: KLU/AMD/BTF/COLAMD/CXSparse/SuiteSparse_config
          # build from the checked-out SuiteSparse submodule (CMakeLists.txt
          # Strategy 4, SUITESPARSE_REQUIRE_BLAS=OFF) and Eigen is header-only, both
          # already present in the checkout -- the same path upstream's own
          # manylinux_build job relies on (no system libsuitesparse-dev installed
          # there either).
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Mirrors upstream's "bare install, default numpy" import check only
          # (the grid2op/pandapower-backed check further down the same job pulls
          # in a much heavier, non-compiled dependency tree not needed to prove
          # the C++ extension itself built and loads correctly on riscv64).
          CIBW_TEST_COMMAND: >-
            python -c "import lightsim2grid" &&
            python -c "from lightsim2grid import *" &&
            python -c "from lightsim2grid.newtonpf import newtonpf" &&
            python -c "from lightsim2grid.timeSerie import TimeSeriesCPP" &&
            python -c "from lightsim2grid.network import LSGrid"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lightsim2grid-${{ env.LIGHTSIM2GRID_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lightsim2grid ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: lightsim2grid-${{ matrix.version }}-*-manylinux_riscv64
