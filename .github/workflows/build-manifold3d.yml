---
# This workflow is based on the `build_wheels` job of
# https://github.com/elalish/manifold/blob/v3.5.2/.github/workflows/build_wheels.yml
name: Build manifold3d wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/manifold3d.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-manifold3d.yml'
      - 'docs/packages/manifold3d.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-manifold3d.yml'
      - 'docs/packages/manifold3d.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # cmake/manifoldDeps.cmake FetchContent-pulls these two at build time and
  # statically links them in; bump alongside it if upstream ever moves the pins.
  ONETBB_TAG: v2022.3.0
  CLIPPER2_SHA: 46f639177fe418f9689e8ddb74f08a870c71f5b4

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: manifold3d
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build manifold3d ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      MANIFOLD3D_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout manifold v${{ env.MANIFOLD3D_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: elalish/manifold
          ref: v${{ env.MANIFOLD3D_VERSION }}
          persist-credentials: false

      # oneTBB (Apache-2.0) and Clipper2 (BSL-1.0) are fetched from source and
      # statically linked in (BUILD_SHARED_LIBS=OFF); upstream's own wheel ships
      # neither licence, so stage them at the root for scikit-build-core's
      # default LICEN[CS]E* glob to pick up (gotcha 32/44).
      - name: Stage the vendored oneTBB and Clipper2 licences
        run: |
          curl -fsSL --retry 5 "https://raw.githubusercontent.com/oneapi-src/oneTBB/${{ env.ONETBB_TAG }}/LICENSE.txt" -o LICENSE.onetbb
          curl -fsSL --retry 5 "https://raw.githubusercontent.com/AngusJohnson/Clipper2/${{ env.CLIPPER2_SHA }}/LICENSE" -o LICENSE.clipper2

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # numpy has no riscv64 wheel on public PyPI; keep pip on our registry's copy.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          names = zipfile.ZipFile(path).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert exts and all("manifold3d" in n for n in exts), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "AUTHORS", "LICENSE.onetbb", "LICENSE.clipper2"}, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: manifold3d-${{ env.MANIFOLD3D_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish manifold3d ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: manifold3d-${{ matrix.version }}-*-manylinux_riscv64
