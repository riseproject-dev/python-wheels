---
# This workflow is based on: https://github.com/Unidata/netcdf4-python/blob/v1.7.4rel/.github/workflows/cibuildwheel.yml
name: Build netCDF4 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'netCDF4 version to build (e.g. 1.7.4)'
        required: true
        default: '1.7.4'
  pull_request:
    paths:
      - '.github/workflows/build-netcdf4.yml'
      - 'patches/netcdf4/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.7.4' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.7.4 there.
  NETCDF4_VERSION: ${{ inputs.version || '1.7.4' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's Linux wheels are built in ghcr.io/ocefpaf/manylinux_2_28_<arch>-netcdf,
  # which has no riscv64 variant, so the same libraries are built into the
  # container instead. Versions are the ones Unidata/netcdf4-python-manylinux
  # bakes into that image.
  OPENSSL_VERSION: '3.5.1'
  CURL_VERSION: '8.14.1'
  LIBAEC_VERSION: '1.1.4'
  BLOSC_VERSION: '1.21.6'
  HDF5_VERSION: '2.2.0'
  NETCDF_VERSION: '4.10.1'

jobs:
  build_wheels:
    name: Build netCDF4 ${{ inputs.version || '1.7.4' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout netcdf4-python ${{ env.NETCDF4_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: Unidata/netcdf4-python
          ref: v${{ env.NETCDF4_VERSION }}rel
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch netcdf4-python source
        run: git apply python-wheels/patches/netcdf4/${{ env.NETCDF4_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Mirrors Unidata/netcdf4-python-manylinux's install_libs.sh. OpenSSL
          # and curl are built from source there and here so the wheel bundles
          # curl's small closure rather than Rocky's krb5/openldap/libssh one.
          # zstd, bzip2 and zlib come from the distro: they are only built from
          # source upstream because AlmaLinux 8 ships them too old.
          # NETCDF_PLUGIN_INSTALL is the current spelling of the option upstream
          # still passes as ENABLE_PLUGIN_INSTALL, which netcdf-c 4.10 ignores.
          CIBW_BEFORE_ALL_LINUX: |
            set -ex
            dnf -y install perl zlib-devel bzip2-devel libzstd-devel
            mkdir -p /tmp/openssl /tmp/curl /tmp/libaec /tmp/blosc /tmp/hdf5 /tmp/netcdf

            curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/openssl
            cd /tmp/openssl
            ./config shared -fPIC --prefix=/usr/local --libdir=lib
            make -j "$(nproc)"
            make install_sw install_ssldirs
            ldconfig

            curl -fsSL "https://curl.se/download/curl-$CURL_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/curl
            cd /tmp/curl
            ./configure --prefix=/usr/local --disable-ldap --with-openssl=/usr/local --without-zstd --without-libpsl
            make -j "$(nproc)"
            make install
            ldconfig

            curl -fsSL "https://github.com/Deutsches-Klimarechenzentrum/libaec/releases/download/v$LIBAEC_VERSION/libaec-$LIBAEC_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/libaec
            cmake -S /tmp/libaec -B /tmp/libaec/build \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D CMAKE_INSTALL_LIBDIR=lib \
              -D BUILD_STATIC_LIBS=OFF \
              -D BUILD_TESTING=OFF
            cmake --build /tmp/libaec/build -j "$(nproc)"
            cmake --install /tmp/libaec/build
            ldconfig

            curl -fsSL "https://github.com/Blosc/c-blosc/archive/refs/tags/v$BLOSC_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/blosc
            cmake -S /tmp/blosc -B /tmp/blosc/build \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D CMAKE_INSTALL_LIBDIR=lib \
              -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -D PREFER_EXTERNAL_ZSTD=ON \
              -D BUILD_TESTS=OFF \
              -D BUILD_BENCHMARKS=OFF \
              -D BUILD_FUZZERS=OFF
            cmake --build /tmp/blosc/build -j "$(nproc)"
            cmake --install /tmp/blosc/build
            ldconfig

            curl -fsSL "https://github.com/HDFGroup/hdf5/archive/refs/tags/$HDF5_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/hdf5
            cmake -S /tmp/hdf5 -B /tmp/hdf5/build \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D CMAKE_INSTALL_LIBDIR=lib \
              -D BUILD_TESTING=OFF \
              -D BUILD_STATIC_LIBS=OFF \
              -D HDF5_BUILD_EXAMPLES=OFF \
              -D HDF5_BUILD_TOOLS=OFF \
              -D HDF5_BUILD_UTILS=OFF \
              -D HDF5_ALLOW_EXTERNAL_SUPPORT:STRING=NO \
              -D HDF5_ENABLE_ZLIB_SUPPORT=ON \
              -D HDF5_ENABLE_SZIP_SUPPORT=ON
            cmake --build /tmp/hdf5/build -j "$(nproc)"
            cmake --install /tmp/hdf5/build
            ldconfig

            curl -fsSL "https://github.com/Unidata/netcdf-c/archive/refs/tags/v$NETCDF_VERSION.tar.gz" | tar xz --strip-components=1 -C /tmp/netcdf
            cmake -S /tmp/netcdf -B /tmp/netcdf/build \
              -D CMAKE_BUILD_TYPE=Release \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D CMAKE_INSTALL_LIBDIR=lib \
              -D NETCDF_ENABLE_NETCDF_4=on \
              -D NETCDF_ENABLE_HDF5=on \
              -D NETCDF_ENABLE_DAP=on \
              -D NETCDF_ENABLE_TESTS=off \
              -D NETCDF_PLUGIN_INSTALL=ON \
              -D BUILD_SHARED_LIBS=on
            cmake --build /tmp/netcdf/build -j "$(nproc)" --target install
            ldconfig

            cp /tmp/openssl/LICENSE.txt "{project}/LICENSE.openssl"
            cp /tmp/curl/COPYING "{project}/LICENSE.curl"
            cp /tmp/libaec/LICENSE.txt "{project}/LICENSE.libaec"
            cp /tmp/blosc/LICENSE.txt "{project}/LICENSE.c-blosc"
            cp /tmp/hdf5/LICENSE "{project}/LICENSE.hdf5"
            cp /tmp/netcdf/COPYRIGHT "{project}/LICENSE.netcdf-c"
            cp /usr/share/licenses/libzstd/LICENSE "{project}/LICENSE.zstd"
            cp /usr/share/licenses/bzip2-libs/LICENSE "{project}/LICENSE.bzip2"
          # NETCDF_PLUGIN_DIR is upstream's [[tool.cibuildwheel.overrides]] value
          # for Linux, which this variable replaces wholesale. The tag is fetched
          # shallow, so setuptools_scm cannot describe the version.
          CIBW_ENVIRONMENT: >-
            NETCDF_PLUGIN_DIR=/usr/local/hdf5/lib/plugin/
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NETCDF4=${{ env.NETCDF4_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
            CURL_VERSION=${{ env.CURL_VERSION }}
            LIBAEC_VERSION=${{ env.LIBAEC_VERSION }}
            BLOSC_VERSION=${{ env.BLOSC_VERSION }}
            HDF5_VERSION=${{ env.HDF5_VERSION }}
            NETCDF_VERSION=${{ env.NETCDF_VERSION }}
            PIP_ONLY_BINARY=numpy,cftime
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/

      - name: Check the wheel ships the extension, the plugins and the licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(
              n.startswith("netCDF4/_netCDF4.") and n.endswith(".so") for n in names
          ), names
          plugins = {n for n in names if n.startswith("netCDF4/plugins/lib__")}
          assert len(plugins) == 9, plugins
          licences = {
              n.rsplit("/", 1)[1]
              for n in names
              if ".dist-info/licenses/" in n
          } - {""}
          assert licences == {
              "LICENSE",
              "LICENSE.bzip2",
              "LICENSE.c-blosc",
              "LICENSE.curl",
              "LICENSE.hdf5",
              "LICENSE.libaec",
              "LICENSE.netcdf-c",
              "LICENSE.openssl",
              "LICENSE.zstd",
          }, licences
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: netcdf4-${{ env.NETCDF4_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish netCDF4 ${{ inputs.version || '1.7.4' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: netcdf4-${{ env.NETCDF4_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
