---
# Based on upstream's own wheel builder (poetry build -f wheel, run per-OS/version):
#   https://github.com/iscc/fastcdc-py/blob/v1.7.0/.github/workflows/test.yml
name: Build fastcdc wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/fastcdc.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-fastcdc.yml'
      - 'docs/packages/fastcdc.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fastcdc.yml'
      - 'docs/packages/fastcdc.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: fastcdc
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build fastcdc ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: fastcdc
      version: ${{ matrix.version }}
      repository: iscc/fastcdc-py
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Gotcha 102: upstream's repo-root build.py (the poetry build script) shadows the
      # `build` package when cibuildwheel runs `python -m build` from cwd=/project.
      cibw-build-frontend: pip
      # xxhash: upstream tests with `poetry install --extras hashes`; test_scan_custom_params
      # passes `-hf xxh64`, which is only a valid choice when xxhash is importable.
      cibw-test-requires: pytest pytest-benchmark xxhash
      # README.md: test_iter_files lists the regular files of the test cwd and needs one.
      cibw-test-sources: tests README.md
      cibw-test-command: >-
        python -c "import fastcdc.fastcdc_cy as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest tests -v
      timeout-minutes: 60

  publish:
    name: Publish fastcdc ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: fastcdc-${{ matrix.version }}-*riscv64
