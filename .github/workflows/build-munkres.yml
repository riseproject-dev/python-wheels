---
# Based on the `wheels` job of
# https://github.com/iameishit/Paldita-munkres/blob/v3.0.0/.github/workflows/release.yml
name: Build munkres wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/munkres.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-munkres.yml'
      - 'docs/packages/munkres.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-munkres.yml'
      - 'docs/packages/munkres.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: munkres
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build munkres ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream builds no free-threaded wheel and the extension declares no Py_mod_gil.
        python: ["cp312", "cp313", "cp314"]
        libc: [manylinux, musllinux]
        include:
          - libc: manylinux
            test_requires: pytest hypothesis numpy scipy
          # numpy/scipy have no musllinux riscv64 wheel anywhere; the suite importorskips them.
          - libc: musllinux
            test_requires: pytest hypothesis

    env:
      MUNKRES_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout munkres v${{ env.MUNKRES_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: iameishit/Paldita-munkres
          ref: v${{ env.MUNKRES_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
          CIBW_TEST_REQUIRES: ${{ matrix.test_requires }}
          # pyproject's pytest `pythonpath = ["src"]` puts the checkout's pure-Python
          # package ahead of the wheel, so stage only the suite and its ini.
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "from munkres import _native; assert _native.available(), 'native kernel missing from wheel'" &&
            python -m pytest tests/v3 -q -x

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: munkres-${{ env.MUNKRES_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish munkres ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: munkres-${{ matrix.version }}-*riscv64
