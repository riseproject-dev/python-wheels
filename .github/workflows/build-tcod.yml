---
# This workflow is based on the `linux-wheels` job of
# https://github.com/libtcod/python-tcod/blob/21.2.1/.github/workflows/python-package.yml
name: Build tcod wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tcod.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tcod.yml'
      - 'docs/packages/tcod.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tcod.yml'
      - 'docs/packages/tcod.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # py_limited_api=0x03100000 in build_libtcod.py: the one abi3 wheel built on
  # the floor interpreter also loads on every newer non-free-threaded CPython.
  ABI3_FLOOR: cp310

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tcod
      version: ${{ inputs.version }}

  build_abi3:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    # No env context in jobs.<id>.name: the floor is spelled out (see ABI3_FLOOR).
    name: Build tcod ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tcod"
      version: "${{ matrix.version }}"
      repository: "libtcod/python-tcod"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0
      cibw-build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      # Upstream's own before-all, minus epel-release (gotcha 51: EPEL is
      # empty on riscv64, a no-op) and minus vulkan-devel/libXScrnSaver-devel
      # (no riscv64 package; SDL's cmake auto-detects their absence and
      # disables the matching optional backend instead of failing).
      cibw-before-all-linux: >
        dnf install -y -q
        gcc git cmake make pkgconfig
        alsa-lib-devel pulseaudio-libs-devel
        libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXfixes-devel libXi-devel
        dbus-devel ibus-devel systemd-devel
        mesa-libGL-devel mesa-libEGL-devel mesa-libGLES-devel libxkbcommon-devel
        wayland-devel wayland-protocols-devel libdrm-devel mesa-libgbm-devel libusb1-devel &&
        git clone --depth 1 --branch release-3.2.16 https://github.com/libsdl-org/SDL.git /tmp/sdl &&
        cmake -S /tmp/sdl -B /tmp/sdl-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON &&
        cmake --build /tmp/sdl-build --config Release -j$(nproc) &&
        cmake --install /tmp/sdl-build --config Release --prefix /usr/local &&
        cp /usr/local/lib64/pkgconfig/sdl3.pc /lib64/pkgconfig/sdl3.pc
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-before-test: "pip install numpy"
      cibw-test-command: "python -c \"import tcod.context\""

  build_freethreaded:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tcod ${{ matrix.version }} cp314t-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "tcod"
      version: "${{ matrix.version }}"
      repository: "libtcod/python-tcod"
      ref: "${{ matrix.version }}"
      artifact-tag: "cp314t-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0
      cibw-build: "cp314t-*"
      cibw-before-all-linux: >
        dnf install -y -q
        gcc git cmake make pkgconfig
        alsa-lib-devel pulseaudio-libs-devel
        libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXfixes-devel libXi-devel
        dbus-devel ibus-devel systemd-devel
        mesa-libGL-devel mesa-libEGL-devel mesa-libGLES-devel libxkbcommon-devel
        wayland-devel wayland-protocols-devel libdrm-devel mesa-libgbm-devel libusb1-devel &&
        git clone --depth 1 --branch release-3.2.16 https://github.com/libsdl-org/SDL.git /tmp/sdl &&
        cmake -S /tmp/sdl -B /tmp/sdl-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON &&
        cmake --build /tmp/sdl-build --config Release -j$(nproc) &&
        cmake --install /tmp/sdl-build --config Release --prefix /usr/local &&
        cp /usr/local/lib64/pkgconfig/sdl3.pc /lib64/pkgconfig/sdl3.pc
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-before-test: "pip install numpy"
      cibw-test-command: "python -c \"import tcod.context\""

  publish:
    name: Publish tcod ${{ matrix.version }}
    needs: [setup, build_abi3, build_freethreaded]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tcod-${{ matrix.version }}-*-manylinux_riscv64
