name: Build argus-redact wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/argus-redact.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-argus-redact.yml'
      - 'docs/packages/argus-redact.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-argus-redact.yml'
      - 'docs/packages/argus-redact.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: argus-redact
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build argus-redact ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # No abi3 feature on pyo3 in Cargo.toml, so upstream ships one wheel
        # per interpreter (matches PyPI's cp3xx-cp3xx tags).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      ARGUS_REDACT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout argus-redact ${{ env.ARGUS_REDACT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: wan9yu/argus-redact
          ref: v${{ env.ARGUS_REDACT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # argus-redact's pyproject.toml ships no [tool.cibuildwheel], so the
          # Rust toolchain its maturin backend needs is installed in-container.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest pytest-asyncio hypothesis
          # tests/test_readme_examples.py (and its _meta sibling) exec the
          # <!-- pin --> code blocks in README.md/README.zh.md/docs/*.md to
          # keep the docs honest; they resolve those paths relative to the
          # test file via Path(__file__).parents[1], which is test_cwd once
          # cibuildwheel stages CIBW_TEST_SOURCES there. Without the README
          # and docs files alongside tests/, collection dies with
          # FileNotFoundError on every interpreter (gotcha 129's maxminddb
          # pattern, not riscv64- or free-threading-specific).
          CIBW_TEST_SOURCES: tests README.md README.zh.md docs
          CIBW_TEST_COMMAND: >-
            python -c "from argus_redact import redact; redacted, key = redact('张三的电话是13812345678', names=['张三'], lang='zh', salt=42); assert '张三' not in redacted; assert '13812345678' not in redacted" &&
            python -m pytest -v -m "not ner and not semantic and not slow" tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: argus-redact-${{ env.ARGUS_REDACT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish argus-redact ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: argus-redact-${{ matrix.version }}-*-manylinux_riscv64
