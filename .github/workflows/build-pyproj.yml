---
# This workflow is based on the `build_wheels` job of
# https://github.com/pyproj4/pyproj/blob/3.7.2/.github/workflows/release.yaml
name: Build pyproj wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyproj.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyproj.yml'
      - 'docs/packages/pyproj.yaml'
      - 'patches/pyproj/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyproj.yml'
      - 'docs/packages/pyproj.yaml'
      - 'patches/pyproj/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PROJ_VERSION: '9.5.1'
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyproj
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyproj ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyproj"
      version: "${{ matrix.version }}"
      repository: "pyproj4/pyproj"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 600
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/pyproj/${{ matrix.version }}/00*.patch

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all: "bash ./ci/proj-compile-wheels.sh"
      cibw-environment-linux: "PROJ_WHEEL=true PROJ_NETWORK=ON PROJ_VERSION=9.5.1 PROJ_DIR=/project/pyproj/proj_dir"
      cibw-test-requires: "cython pytest numpy"
      cibw-before-test: "python -m pip install shapely pandas xarray || echo \"Optional requirements install failed\""
      # PyPI has no riscv64 wheel for these and ours lag its latest release, so keep pip
      # off the sdists; test-only (gotcha 12) since Cython has to compile from source.
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,pandas,shapely"
      cibw-test-command: "python -c \"import importlib.metadata as m; n=sorted(p.name for p in m.files('pyproj') if 'licenses/' in str(p)); assert n == ['LICENSE', 'LICENSE_curl', 'LICENSE_libtiff', 'LICENSE_nghttp2', 'LICENSE_openssl', 'LICENSE_proj'], n\" && pyproj -v && python -c \"import pyproj; pyproj.Proj(init='epsg:4269')\" && cp -r {package}/test . && python -m pytest test -v -s"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYPROJ_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyproj-${{ env.PYPROJ_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extensions and PROJ made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("pyproj/_crs.") and n.endswith(".so") for n in names), whl
              assert any(n.startswith("pyproj.libs/libproj") for n in names), whl
              assert "pyproj/proj_dir/share/proj/proj.db" in names, whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyproj ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyproj-${{ matrix.version }}-*-manylinux_riscv64
