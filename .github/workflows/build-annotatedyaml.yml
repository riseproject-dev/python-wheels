---
# Based on the `build_wheels` and `test` jobs of
# https://github.com/home-assistant-libs/annotatedyaml/blob/v1.0.2/.github/workflows/ci.yml
name: Build annotatedyaml wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/annotatedyaml.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-annotatedyaml.yml'
      - 'docs/packages/annotatedyaml.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-annotatedyaml.yml'
      - 'docs/packages/annotatedyaml.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: annotatedyaml
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build annotatedyaml ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    env:
      ANNOTATEDYAML_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout annotatedyaml v${{ env.ANNOTATEDYAML_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: home-assistant-libs/annotatedyaml
          ref: v${{ env.ANNOTATEDYAML_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          # Upstream's job-level REQUIRE_CYTHON never reaches the Linux build container.
          CIBW_ENVIRONMENT: >-
            REQUIRE_CYTHON=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_REQUIRES: 'pytest>=8,<9 pytest-codspeed>=3.2.0 pytest-asyncio>=1.2.0,<2'
          CIBW_TEST_COMMAND: >-
            python -c "from annotatedyaml import constructors, reference;
            m = [constructors, reference];
            bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
            assert not bad, bad" &&
            python -m pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: annotatedyaml-${{ env.ANNOTATEDYAML_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish annotatedyaml ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: annotatedyaml-${{ matrix.version }}-*riscv64
