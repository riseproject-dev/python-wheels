---
# Based on the `build_wheels` and `test` jobs of
# https://github.com/home-assistant-libs/annotatedyaml/blob/v1.0.2/.github/workflows/ci.yml
name: Build annotatedyaml wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/annotatedyaml.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-annotatedyaml.yml'
      - 'docs/packages/annotatedyaml.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-annotatedyaml.yml'
      - 'docs/packages/annotatedyaml.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: annotatedyaml
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build annotatedyaml ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: annotatedyaml
      version: ${{ matrix.version }}
      repository: home-assistant-libs/annotatedyaml
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Upstream's job-level REQUIRE_CYTHON never reaches the Linux build container.
      cibw-environment: >-
        REQUIRE_CYTHON=1
        PYYAML_FORCE_LIBYAML=1
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # musllinux builds PyYAML from sdist; without libyaml it silently lacks CSafeLoader (gotcha 577).
      cibw-before-test: ${{ matrix.platform == 'musllinux' && 'apk add --no-cache yaml-dev' || '' }}
      cibw-test-sources: tests
      cibw-test-requires: 'pytest>=8,<9 pytest-codspeed>=3.2.0 pytest-asyncio>=1.2.0,<2'
      cibw-test-command: >-
        python -c "from annotatedyaml import constructors, reference;
        m = [constructors, reference];
        bad = [x.__name__ for x in m if not x.__file__.endswith('.so')];
        assert not bad, bad" &&
        python -m pytest tests
      timeout-minutes: 60

  publish:
    name: Publish annotatedyaml ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: annotatedyaml-${{ matrix.version }}-*riscv64
