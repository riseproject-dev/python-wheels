---
# This workflow is based on: https://github.com/terrierteam/pytrec_eval/blob/v0.5.10/.github/workflows/publish-to-pypi.yml
name: Build pytrec-eval-terrier wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pytrec-eval-terrier.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pytrec-eval-terrier.yml'
      - 'docs/packages/pytrec-eval-terrier.yaml'
      - 'patches/pytrec-eval-terrier/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pytrec-eval-terrier.yml'
      - 'docs/packages/pytrec-eval-terrier.yaml'
      - 'patches/pytrec-eval-terrier/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pytrec-eval-terrier
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pytrec-eval-terrier ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pytrec-eval-terrier"
      version: "${{ matrix.version }}"
      repository: "terrierteam/pytrec_eval"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      checkout-submodules: "true"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # numpy/scipy (install_requires) have no riscv64 wheels on public
      # PyPI but are published on our own registry, needed both to build
      # the test venv and to satisfy the wheel's own install_requires.
      # Same suite upstream's push.yml runs (pytest tests/*.py); named
      # explicitly since pytrec_eval_tests.py doesn't match pytest's
      # default collection glob for a bare directory.
      cibw-test-requires: "pytest"
      cibw-test-command: "pytest {package}/tests/pytrec_eval_tests.py"

  publish:
    name: Publish pytrec-eval-terrier ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pytrec-eval-terrier-${{ matrix.version }}-*-manylinux_riscv64
