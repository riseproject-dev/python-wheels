---
# This workflow is based on: https://github.com/terrierteam/pytrec_eval/blob/v0.5.10/.github/workflows/publish-to-pypi.yml
name: Build pytrec-eval-terrier wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pytrec-eval-terrier.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pytrec-eval-terrier.yml'
      - 'docs/packages/pytrec-eval-terrier.yaml'
      - 'patches/pytrec-eval-terrier/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pytrec-eval-terrier.yml'
      - 'docs/packages/pytrec-eval-terrier.yaml'
      - 'patches/pytrec-eval-terrier/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pytrec-eval-terrier
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pytrec-eval-terrier ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Extension is a plain setuptools Extension (no limited-API build), so
        # per-interpreter wheels like upstream's own (cp310..cp314, cp314t).
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYTREC_EVAL_TERRIER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pytrec_eval v${{ env.PYTREC_EVAL_TERRIER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: terrierteam/pytrec_eval
          ref: v${{ env.PYTREC_EVAL_TERRIER_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch pytrec_eval source
        run: git apply python-wheels/patches/pytrec-eval-terrier/${{ env.PYTREC_EVAL_TERRIER_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy/scipy (install_requires) have no riscv64 wheels on public
          # PyPI but are published on our own registry, needed both to build
          # the test venv and to satisfy the wheel's own install_requires.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Same suite upstream's push.yml runs (pytest tests/*.py); named
          # explicitly since pytrec_eval_tests.py doesn't match pytest's
          # default collection glob for a bare directory.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {package}/tests/pytrec_eval_tests.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytrec-eval-terrier-${{ env.PYTREC_EVAL_TERRIER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pytrec-eval-terrier ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pytrec-eval-terrier-${{ matrix.version }}-*-manylinux_riscv64
