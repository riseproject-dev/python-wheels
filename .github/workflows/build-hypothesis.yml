---
# This workflow is based on the `release-build-wheels` job in:
# https://github.com/HypothesisWorks/hypothesis/blob/v6.165.10/.github/workflows/release.yml
name: Build hypothesis wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hypothesis.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hypothesis.yml'
      - 'docs/packages/hypothesis.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hypothesis.yml'
      - 'docs/packages/hypothesis.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hypothesis
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hypothesis ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: hypothesis
      version: ${{ matrix.version }}
      repository: HypothesisWorks/hypothesis
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-package-dir: hypothesis
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build-frontend: build
      # Upstream marks riscv64 `abi3-only`, so it ships cp310-abi3 and a cp315
      # abi3t wheel; abi3t starts at 3.15, leaving cp314t with no wheel. These are
      # upstream's per-interpreter builds, which it runs only for x86_64/aarch64.
      cibw-before-all-linux: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=$PATH:$HOME/.cargo/bin"
      # Paths are relative to cibuildwheel's cwd (the checkout root), not package-dir.
      # Staging only tests/ keeps src/hypothesis out of the test cwd, so the wheel is imported.
      cibw-test-sources: hypothesis/tests
      cibw-test-requires: pytest pytest-xdist
      # Upstream's `brief` tox env, plus a check that the compiled module is the one imported.
      cibw-test-command: >-
        python -c "import hypothesis._native as n; assert n.__file__.endswith('.so'), n.__file__" &&
        python -bb -X dev -m pytest -n auto hypothesis/tests/cover/test_testdecorators.py
      timeout-minutes: 240

  publish:
    name: Publish hypothesis ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hypothesis-${{ matrix.version }}-*-manylinux_riscv64
