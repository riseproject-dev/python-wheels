---
# This workflow is based on: https://github.com/night-crawler/jsonpath-rust-bindings/blob/1.1.1/.github/workflows/CI.yml
name: Build jsonpath-rust-bindings wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jsonpath-rust-bindings.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonpath-rust-bindings.yml'
      - 'docs/packages/jsonpath-rust-bindings.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonpath-rust-bindings.yml'
      - 'docs/packages/jsonpath-rust-bindings.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jsonpath-rust-bindings
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jsonpath-rust-bindings ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jsonpath-rust-bindings"
      version: "${{ matrix.version }}"
      repository: "night-crawler/jsonpath-rust-bindings"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # jsonpath-rust-bindings ships no [tool.cibuildwheel], so the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import jsonpath_rust_bindings; assert jsonpath_rust_bindings.jsonpath_rust_bindings.__file__.endswith('.so'), jsonpath_rust_bindings.jsonpath_rust_bindings.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish jsonpath-rust-bindings ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jsonpath-rust-bindings-${{ matrix.version }}-*-manylinux_riscv64
