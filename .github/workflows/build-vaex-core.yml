---
# This workflow is based on the `build_wheels` job of
# https://github.com/vaexio/vaex/blob/core-v4.19.0/.github/workflows/wheel.yml
name: Build vaex-core wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/vaex-core.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-vaex-core.yml'
      - 'docs/packages/vaex-core.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-vaex-core.yml'
      - 'docs/packages/vaex-core.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Final PCRE1 release; superstrings needs libpcre + libpcrecpp (PCRE1, not PCRE2).
  PCRE_VERSION: '8.45'
  PCRE_SHA256: '4e6ce03e0336e8b4a3d6c2b70b1c5e18590a5673a98186da90d4f33c23defc09'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: vaex-core
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build vaex-core ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    # The four C++ extensions (-O3 -g, heavily templated) take ~2h40m to
    # compile on the riscv64 runner on their own; 180 left no headroom.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # vaex-core's setup.py allows >=3.9,<3.13 and upstream ships cp39-cp312
        # for manylinux and musllinux, but its hard runtime requirement pyarrow
        # has riscv64 wheels for cp312+ manylinux only (and numpy/pandas/blake3
        # none for musllinux riscv64), so every other entry would be a wheel
        # nobody can install on riscv64 (gotcha 84). Add them back as those
        # ports land.
        python: ["cp312"]

    env:
      VAEX_CORE_VERSION: ${{ matrix.version }}

    steps:
      # vaex-core lives in a subdirectory of the vaex monorepo and vendors
      # pybind11/string-view-lite/hopscotch-map/flat_hash_map as submodules.
      - name: Checkout vaex core-v${{ env.VAEX_CORE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: vaexio/vaex
          ref: core-v${{ env.VAEX_CORE_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: packages/vaex-core
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # superstrings links against pcre/pcrecpp. Upstream's
          # bin/install_pcre.sh tries a distro package, then falls back to a
          # source build. manylinux_2_39_riscv64 is Rocky Linux 10, and RHEL 10
          # dropped PCRE1 (only pcre2 is left), so `dnf install pcre-devel`
          # finds nothing. We take the source-build path with the final PCRE1
          # release, using the flags distro packages use (no JIT: PCRE1's sljit
          # has no riscv64 backend). --libdir=/usr/lib64 keeps the libraries on
          # the riscv64 linker path (gotcha 140). auditwheel vendors
          # libpcre/libpcrecpp into the wheel, so PCRE's BSD licence goes in
          # too: setuptools' default LICEN[CS]E* glob picks it up from the
          # package dir.
          CIBW_BEFORE_ALL_LINUX: >-
            cd /tmp &&
            curl -fsSL --retry 5 -o pcre-${{ env.PCRE_VERSION }}.tar.gz https://sourceforge.net/projects/pcre/files/pcre/${{ env.PCRE_VERSION }}/pcre-${{ env.PCRE_VERSION }}.tar.gz/download &&
            echo "${{ env.PCRE_SHA256 }}  pcre-${{ env.PCRE_VERSION }}.tar.gz" | sha256sum -c - &&
            tar xzf pcre-${{ env.PCRE_VERSION }}.tar.gz &&
            (cd pcre-${{ env.PCRE_VERSION }} && ./configure --prefix=/usr --libdir=/usr/lib64 --disable-static --enable-cpp --enable-utf --enable-unicode-properties && make -j"$(nproc)" && make install) &&
            cp pcre-${{ env.PCRE_VERSION }}/LICENCE /project/packages/vaex-core/LICENSE.pcre
          # Upstream's import smoke test, plus a regex search so pcrecpp is
          # really called, plus a check that the PCRE licence made it in.
          CIBW_TEST_COMMAND: >-
            python -c "import vaex, importlib.metadata as md;
            df = vaex.from_arrays(x=[1,2], s=['ab', 'cd']); print(df);
            assert df.s.str.contains('^a.').tolist() == [True, False];
            n = {p.name for p in md.files('vaex-core') if '.dist-info/licenses/' in str(p)};
            assert n == {'LICENSE.txt', 'LICENSE.pcre'}, n"
          # Only the compiled distributions are forced to wheels. `:all:` also
          # rejected aplus, a pure-Python requirement that only ships an sdist
          # ("No matching distribution found for aplus", gotcha 488).
          CIBW_TEST_ENVIRONMENT_LINUX: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pandas,pyarrow,blake3,pydantic-core,pyyaml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vaex_core-${{ env.VAEX_CORE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish vaex-core ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: vaex_core-${{ matrix.version }}-*-*_riscv64
