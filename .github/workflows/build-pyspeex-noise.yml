---
# Based on upstream's own (currently riscv64-disabled) wheel builder:
#   https://github.com/rhasspy/pyspeex-noise/blob/v2.0.1/.github/workflows/wheels.yml
name: Build pyspeex-noise wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyspeex-noise.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyspeex-noise.yml'
      - 'docs/packages/pyspeex-noise.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyspeex-noise.yml'
      - 'docs/packages/pyspeex-noise.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyspeex-noise
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyspeex-noise ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # setup.cfg hardcodes py_limited_api=cp39 (single abi3 wheel for all
        # 3.9+), and upstream's own wheels.yml only builds cp39-* (gotcha 96:
        # build on the floor interpreter its abi3 tag claims). No free-threaded
        # variant is published upstream either.
        python: ["cp39"]

    env:
      PYSPEEX_NOISE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyspeex-noise v${{ env.PYSPEEX_NOISE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: rhasspy/pyspeex-noise
          ref: v${{ env.PYSPEEX_NOISE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_TEST_REQUIRES: pytest syrupy
          CIBW_TEST_COMMAND: python -m pytest -vv {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyspeex-noise-${{ env.PYSPEEX_NOISE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyspeex-noise ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyspeex-noise-${{ matrix.version }}-*-manylinux_riscv64
