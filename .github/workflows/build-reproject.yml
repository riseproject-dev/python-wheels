---
# This workflow is based on the build job of
# https://github.com/astropy/reproject/blob/v0.21.0/.github/workflows/ci_workflows.yml,
# which calls OpenAstronomy/github-actions-workflows' publish.yml.
name: Build reproject wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/reproject.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-reproject.yml'
      - 'docs/packages/reproject.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-reproject.yml'
      - 'docs/packages/reproject.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  # Upstream's build job sets this; pyproject.toml's environment-pass forwards it
  # into the container, where extension-helpers turns it into an abi3 build.
  EXTENSION_HELPERS_PY_LIMITED_API: 'cp311'

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: reproject
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build reproject ${{ matrix.version }} cp311-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "reproject"
      version: "${{ matrix.version }}"
      repository: "astropy/reproject"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp311-abi3-manylinux_riscv64"
      timeout-minutes: 360
      # One abi3 wheel, built on cp311 -- the oldest interpreter its tag
      # claims -- and re-tested on the newer ones via find_compatible_wheel.
      cibw-build: "cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # astropy-healpix, numcodecs and google-crc32c (runtime dependencies) have
      # no cp311 riscv64 wheel on any index, so the floor is built but not tested.
      cibw-test-skip: "cp311-*"
      # numpy is a build and a runtime requirement, and only our registry has
      # it for riscv64; only-binary keeps a newer PyPI release from winning the
      # resolution and then compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_REPROJECT=${{ matrix.version }}"
      cibw-test-extras: "test"
      cibw-test-command: "pytest -p no:warnings --pyargs reproject --log-cli-level=INFO"
      cibw-test-environment: "PIP_ONLY_BINARY=numpy,scipy,astropy,astropy-healpix,pyerfa,pillow,pyyaml,numcodecs,google-crc32c"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      REPROJECT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: reproject-${{ env.REPROJECT_VERSION }}-cp311-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert "-cp311-abi3-" in path, path
          names = zipfile.ZipFile(path).namelist()
          exts = {n.rsplit("/", 1)[1] for n in names if n.endswith(".so")}
          assert exts == {"compiler_version.abi3.so", "deforest.abi3.so",
                          "_overlap.abi3.so"}, exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE"}, licences
          EOF

  publish:
    name: Publish reproject ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: reproject-${{ matrix.version }}-*-manylinux_riscv64
