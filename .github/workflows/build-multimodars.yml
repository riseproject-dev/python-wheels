---
# This workflow is based on the `linux` job of
# https://github.com/yungselm/multimoda-rs/blob/v0.8.0/.github/workflows/CI.yml
name: Build multimodars wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/multimodars.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-multimodars.yml'
      - 'docs/packages/multimodars.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-multimodars.yml'
      - 'docs/packages/multimodars.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: multimodars
      version: ${{ inputs.version }}

  test_rust:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Test multimodars ${{ matrix.version }} Rust crate
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      MULTIMODARS_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout multimodars v${{ env.MULTIMODARS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: yungselm/multimoda-rs
          ref: v${{ env.MULTIMODARS_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable

      - name: Run Rust tests
        run: cargo test --all --release --verbose

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build multimodars ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ['cp312', 'cp313', 'cp314', 'cp314t']
    env:
      MULTIMODARS_VERSION: ${{ matrix.version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout multimodars v${{ env.MULTIMODARS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: yungselm/multimoda-rs
          ref: v${{ env.MULTIMODARS_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --strip -i ${{ steps.interp.outputs.value }} --out dist
          sccache: 'false'
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      - name: Install Python deps
        env:
          UV_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_ONLY_BINARY: numpy,scipy
        run: |
          uv pip install dist/*.whl
          uv pip install --group test

      - name: Run Python tests
        run: pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: multimodars-${{ env.MULTIMODARS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish multimodars ${{ matrix.version }}
    needs: [setup, test_rust, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: multimodars-${{ matrix.version }}-*-manylinux_riscv64
