---
# Based on upstream's own wheel build:
#   https://github.com/codypiersall/pynng/blob/v0.9.0/.github/workflows/cibuildwheel.yml
name: Build pynng wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pynng.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pynng.yml'
      - 'docs/packages/pynng.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pynng.yml'
      - 'docs/packages/pynng.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # setup.cfg's own [build_nng]/[build_mbedtls] pins; keep in lockstep with it.
  NNG_VERSION: v1.11
  MBEDTLS_VERSION: v3.6.3.1
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pynng
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pynng ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pynng"
      version: "${{ matrix.version }}"
      repository: "codypiersall/pynng"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 90
      checkout-submodules: "recursive"
      checkout-fetch-depth: 0

      patches: true
      pre-build: |-
        # setup.py's build_nng/build_mbedtls commands `git clone` the nng and
        # mbedtls C libraries at build time (not submodules); their licences never
        # land in the checkout, so fetch them straight from the pinned tags above.
        curl -fsSL -o LICENSE.nng https://raw.githubusercontent.com/nanomsg/nng/v1.11/LICENSE.txt
        curl -fsSL -o LICENSE.mbedtls https://raw.githubusercontent.com/ARMmbed/mbedtls/v3.6.3.1/LICENSE

      # cffi has no manylinux musllinux_riscv64 wheel on our registry, so
      # musllinux is dropped here too (accepted per the porting playbook).
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # cffi, needed to build and to import the extension, has no riscv64 wheel on PyPI.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      cibw-test-requires: "pytest pytest-asyncio pytest-trio trio"
      cibw-test-command: "python -c \"import importlib.metadata as m; l = sorted(str(p).rsplit('/', 1)[-1] for p in m.files('pynng') if str(p).rsplit('/', 1)[-1].startswith('LICENSE')); assert l == ['LICENSE.mbedtls', 'LICENSE.nng', 'LICENSE.txt'], l\" && pytest {project}/test"

  publish:
    name: Publish pynng ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pynng-${{ matrix.version }}-*-manylinux_riscv64
