---
# This workflow is based on the `linux` job of
# https://github.com/thomasht86/httpr/blob/v0.6.0/.github/workflows/CI.yml
name: Build httpr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/httpr.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-httpr.yml'
      - 'docs/packages/httpr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-httpr.yml'
      - 'docs/packages/httpr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: httpr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build httpr ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3-py310 feature gives one wheel for every GIL-ful
          # interpreter; pyo3 disables abi3 under Py_GIL_DISABLED, so the
          # free-threaded build is a separate per-interpreter wheel. cp313t is
          # dropped: the riscv64 manylinux image ships no cp313t.
          - tag: cp310-abi3
            build: >-
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    env:
      HTTPR_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout httpr v${{ env.HTTPR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: thomasht86/httpr
          ref: v${{ env.HTTPR_VERSION }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false

      - name: Set version
        # The version in the checkout is the 0.0.0.dev0 placeholder upstream's
        # release job stamps from the tag.
        run: |
          uv run --no-project --with tomlkit python .github/workflows/set_version.py "${HTTPR_VERSION}"
          grep -q "version = \"${HTTPR_VERSION}\"" pyproject.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # httpr ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # Without it pip prefers PyPI's newer releases, which have no riscv64
          # wheel, and source-builds them in the container.
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=cryptography,cbor2
          CIBW_TEST_REQUIRES: pytest pytest-asyncio pytest-httpbin cbor2 trustme certifi
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -c "import httpr, pathlib; d = pathlib.Path(httpr.__file__).parent;
            assert list(d.glob('httpr*.so')), sorted(d.iterdir())"
            && python -m pytest -q tests/unit

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: httpr-${{ env.HTTPR_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish httpr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: httpr-${{ matrix.version }}-*-manylinux_riscv64
