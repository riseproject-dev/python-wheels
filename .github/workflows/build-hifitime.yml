---
# This workflow is based on the `linux` job of
# https://github.com/nyx-space/hifitime/blob/4.3.1/.github/workflows/python.yml
name: Build hifitime wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hifitime.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hifitime.yml'
      - 'docs/packages/hifitime.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hifitime.yml'
      - 'docs/packages/hifitime.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hifitime
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hifitime ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # hifitime's pyo3 dependency has a plain `features = ["python",
        # "pyo3/extension-module"]` (no abi3), so every interpreter needs its
        # own build, matching the cp3xx-cp3xx tags PyPI's own 4.3.1 release
        # carries. pp311 is dropped: PyPy has no riscv64 port.
        python: ['cp39', 'cp310', 'cp311', 'cp312', 'cp313', 'cp314', 'cp314t', 'cp315', 'cp315t']

    env:
      HIFITIME_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for one
      # interpreter and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - name: Checkout hifitime v${{ env.HIFITIME_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: nyx-space/hifitime
          ref: ${{ env.HIFITIME_VERSION }}
          persist-credentials: false

      - name: Determine target interpreter
        id: interp
        run: |
          v="${{ matrix.python }}"
          v="${v#cp}"
          echo "value=python${v:0:1}.${v:1}" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: riscv64gc-unknown-linux-gnu
          args: --release --strip -i ${{ steps.interp.outputs.value }} --out dist
          manylinux: '2_39'

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ steps.interp.outputs.value }}
          activate-environment: true
          enable-cache: false

      # Mirrors upstream's own "pytest" step (python.yml): install from the
      # just-built wheel, then run its own Python test suite unmodified. The
      # suite only touches the local `data/example_eop2.short` EOP fixture
      # (ut1 feature), never the network-backed `Ut1Provider::download_...`
      # path, so it needs no outbound access.
      - name: Unit tests
        run: |
          uv pip install hifitime --no-index --find-links dist --force-reinstall
          uv pip install pytest
          pytest tests/python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hifitime-${{ env.HIFITIME_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish hifitime ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: hifitime-${{ matrix.version }}-*-manylinux_riscv64
