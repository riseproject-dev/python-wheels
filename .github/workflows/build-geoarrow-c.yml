---
# This workflow is based on: https://github.com/geoarrow/geoarrow-c/blob/geoarrow-c-python-0.3.1/.github/workflows/python-wheels.yaml
name: Build geoarrow-c wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/geoarrow-c.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-geoarrow-c.yml'
      - 'docs/packages/geoarrow-c.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-geoarrow-c.yml'
      - 'docs/packages/geoarrow-c.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: geoarrow-c
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build geoarrow-c ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Upstream's wheel carries no licence text: the package builds from a
    # subdirectory, so setuptools' default license_files glob misses the root LICENSE.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "geoarrow-c"
      version: "${{ matrix.version }}"
      repository: "geoarrow/geoarrow-c"
      ref: "geoarrow-c-python-${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      pre-build: "cp LICENSE python/geoarrow-c/"
      cibw-package-dir: "python/geoarrow-c"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: >
        PIP_ONLY_BINARY=numpy,pyarrow
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GEOARROW_C=${{ matrix.version }}
      # Upstream's wheel test installs only pytest, which skips test_geoarrow_lib.py;
      # the test extra (as in upstream's python.yaml) runs it.
      cibw-test-extras: "test"
      cibw-test-command: "pytest {package}/tests -vv"

  publish:
    name: Publish geoarrow-c ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: geoarrow-c-${{ matrix.version }}-*-manylinux_riscv64
