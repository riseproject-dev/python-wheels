---
# This workflow is based on: https://github.com/geoarrow/geoarrow-c/blob/geoarrow-c-python-0.3.1/.github/workflows/python-wheels.yaml
name: Build geoarrow-c wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/geoarrow-c.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-geoarrow-c.yml'
      - 'docs/packages/geoarrow-c.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-geoarrow-c.yml'
      - 'docs/packages/geoarrow-c.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: geoarrow-c
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build geoarrow-c ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      GEOARROW_C_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout geoarrow-c ${{ env.GEOARROW_C_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: geoarrow/geoarrow-c
          ref: geoarrow-c-python-${{ env.GEOARROW_C_VERSION }}
          persist-credentials: false

      - name: Ship the project LICENSE in the wheel
        # Upstream's wheel carries no licence text: the package builds from a
        # subdirectory, so setuptools' default license_files glob misses the root LICENSE.
        run: cp LICENSE python/geoarrow-c/

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: python/geoarrow-c
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pyarrow
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_GEOARROW_C=${{ env.GEOARROW_C_VERSION }}
          # Upstream's wheel test installs only pytest, which skips test_geoarrow_lib.py;
          # the test extra (as in upstream's python.yaml) runs it.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: pytest {package}/tests -vv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: geoarrow-c-${{ env.GEOARROW_C_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish geoarrow-c ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: geoarrow-c-${{ matrix.version }}-*-manylinux_riscv64
