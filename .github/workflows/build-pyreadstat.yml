---
# Based on the `test` job of
# https://github.com/Roche/pyreadstat/blob/1.3.6/.github/workflows/ci.yml
name: Build pyreadstat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyreadstat.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadstat.yml'
      - 'docs/packages/pyreadstat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadstat.yml'
      - 'docs/packages/pyreadstat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyreadstat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyreadstat ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's own PyPI wheel matrix (cp310-cp314, no free-threaded build).
        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]

    env:
      PYREADSTAT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyreadstat v${{ env.PYREADSTAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Roche/pyreadstat
          ref: v${{ env.PYREADSTAT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # gcc 13+ miscompiles readstat_writer.c's strict-aliasing violations at -O2
          # (silently drops value-label writes); upstream's own CI carries the same flag.
          CIBW_ENVIRONMENT_LINUX: >-
            CFLAGS="-O2 -fno-strict-aliasing"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # polars has no riscv64 wheel, so test_narwhalified.py (which imports it
          # unconditionally) is dropped; test_runtime_types.py and test_typing.yml
          # keep running with their polars-only cases deselected. test_runtime_types.py
          # only imports pyreadstat inside its own `if __name__ == "__main__":` guard, so
          # it has to run as a script (its unittest -k, not pytest's) or that name is undefined.
          CIBW_TEST_SOURCES: tests test_data
          CIBW_TEST_REQUIRES: pytest mypy pytest-mypy-plugins pandas-stubs pandas
          CIBW_TEST_COMMAND: >-
            python tests/test_basic.py &&
            python tests/test_http_integration.py &&
            python tests/test_runtime_types.py
            -k test_read_default_returns_pandas -k test_read_output_pandas
            -k test_read_output_dict -k test_write_returns_none -k test_metadata_field_types
            -k test_set_value_labels_pandas -k test_set_catalog_to_sas_pandas
            &&
            python -m pytest tests/test_typing.yml --mypy-ini-file=tests/test_mypy_setup.ini
            -k "not polars and not worker_types"

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"_readstat_parser", "_readstat_writer"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyreadstat-${{ env.PYREADSTAT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyreadstat ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyreadstat-${{ matrix.version }}-*-manylinux_riscv64
