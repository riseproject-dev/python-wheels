---
# Based on the `test` job of
# https://github.com/Roche/pyreadstat/blob/1.3.6/.github/workflows/ci.yml
name: Build pyreadstat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyreadstat version to build (git tag, e.g. 1.3.6)'
        required: true
        default: '1.3.6'
  pull_request:
    paths:
      - '.github/workflows/build-pyreadstat.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.3.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.3.6 there.
  PYREADSTAT_VERSION: ${{ inputs.version || '1.3.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build pyreadstat ${{ inputs.version || '1.3.6' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Matches upstream's own PyPI wheel matrix (cp310-cp314, no free-threaded build).
        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]

    steps:
      - name: Checkout pyreadstat ${{ env.PYREADSTAT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Roche/pyreadstat
          ref: ${{ env.PYREADSTAT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # gcc 13+ miscompiles readstat_writer.c's strict-aliasing violations at -O2
          # (silently drops value-label writes); upstream's own CI carries the same flag.
          CIBW_ENVIRONMENT_LINUX: >-
            CFLAGS="-O2 -fno-strict-aliasing"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # polars has no riscv64 wheel, so test_narwhalified.py (which imports it
          # unconditionally) is dropped; test_runtime_types.py and test_typing.yml
          # keep running with their polars-only cases deselected.
          CIBW_TEST_SOURCES: tests test_data
          CIBW_TEST_REQUIRES: pytest mypy pytest-mypy-plugins pandas-stubs pandas
          CIBW_TEST_COMMAND: >-
            python tests/test_basic.py &&
            python tests/test_http_integration.py &&
            python -m pytest tests/test_runtime_types.py
            -k "not polars and not test_read_file_multiprocessing_types and not test_read_file_in_chunks_types"
            &&
            python -m pytest tests/test_typing.yml --mypy-ini-file=tests/test_mypy_setup.ini -k "not polars"

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"_readstat_parser", "_readstat_writer"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyreadstat-${{ env.PYREADSTAT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyreadstat ${{ inputs.version || '1.3.6' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyreadstat-${{ inputs.version || '1.3.6' }}-*-manylinux_riscv64
