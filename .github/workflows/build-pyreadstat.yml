---
# Based on the `test` job of
# https://github.com/Roche/pyreadstat/blob/1.3.6/.github/workflows/ci.yml
name: Build pyreadstat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyreadstat.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadstat.yml'
      - 'docs/packages/pyreadstat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyreadstat.yml'
      - 'docs/packages/pyreadstat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyreadstat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyreadstat ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pyreadstat"
      version: "${{ matrix.version }}"
      repository: "Roche/pyreadstat"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # gcc 13+ miscompiles readstat_writer.c's strict-aliasing violations at -O2
      # (silently drops value-label writes); upstream's own CI carries the same flag.
      cibw-environment-linux: "CFLAGS=\"-O2 -fno-strict-aliasing\""
      # The test requirements install pandas (and numpy), whose newest PyPI release has no
      # riscv64 wheel; only our registry does, and only-binary keeps pip from compiling it.
      cibw-test-environment: "PIP_ONLY_BINARY=pandas,numpy"
      # polars has no riscv64 wheel, so test_narwhalified.py (which imports it
      # unconditionally) is dropped; test_runtime_types.py and test_typing.yml
      # keep running with their polars-only cases deselected. test_runtime_types.py
      # only imports pyreadstat inside its own `if __name__ == "__main__":` guard, so
      # it has to run as a script (its unittest -k, not pytest's) or that name is undefined.
      cibw-test-sources: "tests test_data"
      cibw-test-requires: "pytest mypy pytest-mypy-plugins pandas-stubs pandas"
      cibw-test-command: "python tests/test_basic.py && python tests/test_http_integration.py && python tests/test_runtime_types.py -k test_read_default_returns_pandas -k test_read_output_pandas -k test_read_output_dict -k test_write_returns_none -k test_metadata_field_types -k test_set_value_labels_pandas -k test_set_catalog_to_sas_pandas && python -m pytest tests/test_typing.yml --mypy-ini-file=tests/test_mypy_setup.ini -k \"not polars and not worker_types\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PYREADSTAT_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pyreadstat-${{ env.PYREADSTAT_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the Cython extensions made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          expected = {"_readstat_parser", "_readstat_writer"}
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              found = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert found == expected, (whl, found)
              print(whl, "ok")
          EOF

  publish:
    name: Publish pyreadstat ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyreadstat-${{ matrix.version }}-*-manylinux_riscv64
