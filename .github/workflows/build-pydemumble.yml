---
# This workflow is based on upstream's own wheel build setup:
#   https://github.com/angr/pydemumble/blob/master/.github/workflows/wheels.yml
#   https://github.com/angr/pydemumble/blob/master/pyproject.toml
name: Build pydemumble wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pydemumble.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pydemumble.yml'
      - 'docs/packages/pydemumble.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pydemumble.yml'
      - 'docs/packages/pydemumble.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pydemumble
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pydemumble ${{ matrix.version }} cp312-abi3-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: [manylinux, musllinux]
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pydemumble
      version: ${{ matrix.version }}
      repository: angr/pydemumble
      ref: v${{ matrix.version }}
      artifact-tag: cp312-abi3-${{ matrix.libc }}_riscv64
      checkout-submodules: recursive
      cibw-build: cp312-${{ matrix.libc }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # Ship the licences of the statically linked nanobind/robin_map and the vendored LLVM/Swift demanglers.
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        SKBUILD_WHEEL_LICENSE_FILES="LICENSE;src/nanobind/LICENSE;src/nanobind/ext/robin_map/LICENSE;src/third_party/llvm/LICENSE.txt;src/third_party/swift/LICENSE.txt"
      timeout-minutes: 60

  publish:
    name: Publish pydemumble ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pydemumble-${{ matrix.version }}-*riscv64
