---
# Based on upstream's own wheel build:
#   https://github.com/ERGO-Code/HiGHS/blob/v1.15.1/.github/workflows/build-wheels-push.yml
name: Build highspy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'highspy version to build (git tag without leading v, e.g. 1.15.1)'
        required: true
        default: '1.15.1'
  pull_request:
    paths:
      - '.github/workflows/build-highspy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.15.1' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  HIGHSPY_VERSION: ${{ inputs.version || '1.15.1' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build highspy ${{ inputs.version || '1.15.1' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Upstream also builds musllinux, dropped here because we publish no
        # musllinux_riscv64 numpy to build or test against. Upstream publishes
        # no free-threaded wheel, and our numpy has no cp314t riscv64 wheel.
        python: ["cp312", "cp313", "cp314"]

    steps:
      - name: Checkout HiGHS v${{ env.HIGHSPY_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ERGO-Code/HiGHS
          ref: v${{ env.HIGHSPY_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: python-wheels
          persist-credentials: false

      - name: Add the vendored third-party licence texts to the wheel
        run: git apply python-wheels/patches/highspy/${{ env.HIGHSPY_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Restates upstream's own environment table, which this replaces.
          CIBW_ENVIRONMENT: >-
            VCPKG_ROOT=
            VCPKG_INSTALLATION_ROOT=
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m;
            got={str(p).split('.dist-info/licenses/', 1)[1] for p in m.files('highspy') if '.dist-info/licenses/' in str(p)};
            want={'LICENSE.txt', 'THIRD_PARTY_NOTICES.md', 'extern/pdqsort/license.txt', 'extern/zstr/LICENSE', 'highs/io/filereaderlp/LICENSE'};
            assert got == want, got" &&
            pytest {project}/highspy/tests
        with:
          only: ${{ matrix.python }}-manylinux_riscv64

      - name: Check the wheel ships the extension and the solver library
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = {n.rsplit("/", 1)[-1] for n in zipfile.ZipFile(sys.argv[1]).namelist()
                   if ".so" in n}
          assert any(n.startswith("_core.") for n in names), names
          assert "libhighs.so.1" in names, names
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: highspy-${{ env.HIGHSPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish highspy ${{ inputs.version || '1.15.1' }} to GitLab
    needs: [setup, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: highspy-${{ env.HIGHSPY_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
