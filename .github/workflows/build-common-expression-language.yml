---
# Based on upstream's own CI (the `test` and `linux` jobs):
#   https://github.com/hardbyte/python-common-expression-language/blob/v0.8.0/.github/workflows/ci.yml
name: Build common-expression-language wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/common-expression-language.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-common-expression-language.yml'
      - 'docs/packages/common-expression-language.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-common-expression-language.yml'
      - 'docs/packages/common-expression-language.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: common-expression-language
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build common-expression-language ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "common-expression-language"
      version: "${{ matrix.version }}"
      repository: "hardbyte/python-common-expression-language"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 90

      # <= 0.9.0 need the typing.Annotated backport; 0.10.0 ships it (upstream
      # 212cf00), so later versions may have no patches/ directory at all.
      patches: true
      patches-required: false

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest mktestdocs"
      cibw-test-sources: "tests docs pyproject.toml"
      # The two deselected tests assert fixed wall-clock budgets the riscv64 runner misses by ~2x.
      cibw-test-command: "python -c \"import cel.cel as ext; assert ext.__file__.endswith('.so'), ext.__file__\" && python -m pytest --verbose --tb=short --deselect tests/test_functions.py::TestFunctionPerformance::test_complex_function_call_performance --deselect tests/test_functions.py::TestFunctionPerformance::test_function_call_with_large_data"

  publish:
    name: Publish common-expression-language ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: common-expression-language-${{ matrix.version }}-*-manylinux_riscv64
