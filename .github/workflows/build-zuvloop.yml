---
# Based on upstream's own wheel-building job:
#   https://github.com/Kludex/zuvloop/blob/v0.0.13/.github/workflows/publish.yml
name: Build zuvloop wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/zuvloop.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-zuvloop.yml'
      - 'docs/packages/zuvloop.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zuvloop.yml'
      - 'docs/packages/zuvloop.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: zuvloop
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build zuvloop ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp314", "cp314t", "cp315", "cp315t"]
        include:
          # hypothesis ships no cp314t riscv64 wheel and its sdist needs a Rust
          # toolchain riscv64 lacks; pin its last pure-Python release there.
          - python: cp314t
            hypothesis: "hypothesis<6.156"

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "zuvloop"
      version: "${{ matrix.version }}"
      repository: "Kludex/zuvloop"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 90
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/zuvloop/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # The applied patch dirties the tree, so hatch-vcs would stamp the next .dev0.
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      cibw-test-requires: "aiohttp anyio httptools ${{ matrix.hypothesis || 'hypothesis' }} opentelemetry-sdk pytest pytest-timeout uvicorn"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp314", "cp314t", "cp315", "cp315t"]
        include:
          # hypothesis ships no cp314t riscv64 wheel and its sdist needs a Rust
          # toolchain riscv64 lacks; pin its last pure-Python release there.
          - python: cp314t
            hypothesis: "hypothesis<6.156"
    env:
      ZUVLOOP_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: zuvloop-${{ env.ZUVLOOP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel is compiled and carries the release version
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import os, sys, zipfile
          for whl in sys.argv[1:]:
              assert os.path.basename(whl).startswith(f"zuvloop-{os.environ['ZUVLOOP_VERSION']}-"), whl
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("zuvloop/_zuvloop.") and n.endswith(".so") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish zuvloop ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: zuvloop-${{ matrix.version }}-*-manylinux_riscv64
