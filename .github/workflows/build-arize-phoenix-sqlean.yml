---
# Based on the `build` job of
# https://github.com/Arize-ai/phoenix/blob/arize-phoenix-sqlean-v0.1.1/.github/workflows/phoenix-sqlean-build.yml
name: Build arize-phoenix-sqlean wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/arize-phoenix-sqlean.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-arize-phoenix-sqlean.yml'
      - 'docs/packages/arize-phoenix-sqlean.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arize-phoenix-sqlean.yml'
      - 'docs/packages/arize-phoenix-sqlean.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: arize-phoenix-sqlean
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build arize-phoenix-sqlean ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Matches upstream's cibuildwheel.toml build list, which has no
        # cp314t entry (free-threaded builds aren't produced for this
        # package at all, on any platform).
        python: ["cp310", "cp311", "cp312", "cp313", "cp314"]

    env:
      ARIZE_PHOENIX_SQLEAN_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout Arize-ai/phoenix arize-phoenix-sqlean-v${{ env.ARIZE_PHOENIX_SQLEAN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Arize-ai/phoenix
          ref: arize-phoenix-sqlean-v${{ env.ARIZE_PHOENIX_SQLEAN_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: packages/phoenix-sqlean
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Mirrors upstream's own download-sources step: the SQLite
          # amalgamation and sqlean extension sources aren't checked in,
          # they're fetched at build time (Makefile).
          CIBW_BEFORE_BUILD: >-
            dnf install -y unzip patch &&
            cd {package} && make prepare-src download-sqlite download-sqlean
          CIBW_TEST_SOURCES: >-
            packages/phoenix-sqlean/tests
            packages/phoenix-sqlean/setup.py
            packages/phoenix-sqlean/README.md
          # tests/extensions.py imports setup.py (for SQLEAN_VERSION), which
          # imports setuptools; the test venv doesn't have it otherwise.
          CIBW_TEST_REQUIRES: setuptools
          CIBW_TEST_COMMAND: cd packages/phoenix-sqlean && python -m tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: arize-phoenix-sqlean-${{ env.ARIZE_PHOENIX_SQLEAN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish arize-phoenix-sqlean ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: arize-phoenix-sqlean-${{ matrix.version }}-*-manylinux_riscv64
