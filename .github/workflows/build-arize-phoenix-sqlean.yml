---
# Based on the `build` job of
# https://github.com/Arize-ai/phoenix/blob/arize-phoenix-sqlean-v0.1.1/.github/workflows/phoenix-sqlean-build.yml
name: Build arize-phoenix-sqlean wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/arize-phoenix-sqlean.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-arize-phoenix-sqlean.yml'
      - 'docs/packages/arize-phoenix-sqlean.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arize-phoenix-sqlean.yml'
      - 'docs/packages/arize-phoenix-sqlean.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: arize-phoenix-sqlean
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build arize-phoenix-sqlean ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: arize-phoenix-sqlean
      version: ${{ matrix.version }}
      repository: Arize-ai/phoenix
      ref: arize-phoenix-sqlean-v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-package-dir: packages/phoenix-sqlean
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # Mirrors upstream's own download-sources step: the SQLite
      # amalgamation and sqlean extension sources aren't checked in,
      # they're fetched at build time (Makefile).
      cibw-before-build: >-
        dnf install -y unzip patch perl-Digest-SHA &&
        cd {package} && make prepare-src download-sqlite download-sqlean
      cibw-test-sources: >-
        packages/phoenix-sqlean/tests
        packages/phoenix-sqlean/setup.py
        packages/phoenix-sqlean/README.md
      # tests/extensions.py imports setup.py (for SQLEAN_VERSION), which
      # imports setuptools; the test venv doesn't have it otherwise.
      cibw-test-requires: setuptools
      cibw-test-command: cd packages/phoenix-sqlean && python -m tests
      timeout-minutes: 30

  publish:
    name: Publish arize-phoenix-sqlean ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: arize-phoenix-sqlean-${{ matrix.version }}-*-manylinux_riscv64
