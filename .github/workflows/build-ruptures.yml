---
# Based on the `build_wheels`/`build_aarch64_wheels` jobs of
# https://github.com/deepcharles/ruptures/blob/v1.1.10/.github/workflows/upload-to-pypi.yml
name: Build ruptures wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ruptures version to build (git tag without leading v, e.g. 1.1.10)'
        required: true
        default: '1.1.10'
  pull_request:
    paths:
      - '.github/workflows/build-ruptures.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.1.10' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  RUPTURES_VERSION: ${{ inputs.version || '1.1.10' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build ruptures ${{ inputs.version || '1.1.10' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # cp312/cp313 only: ruptures' own Requires-Python (>=3.9,<3.14) excludes
        # cp314/cp314t at the installer level, and upstream publishes no wheel past
        # cp313.
        python:
          - "cp312"
          - "cp313"

    steps:
      - name: Checkout ruptures v${{ env.RUPTURES_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: deepcharles/ruptures
          ref: v${{ env.RUPTURES_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # build-system.requires pins oldest-supported-numpy, which hard-pins
          # numpy==1.26.2 for cp312 with no riscv64 wheel; the extensions only use
          # Cython memoryviews (no `cimport numpy`), so --no-build-isolation plus a
          # floating numpy/scipy sidesteps the pin instead of patching pyproject.toml.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BEFORE_BUILD: >-
            pip install "setuptools>=42" wheel "Cython>=0.28.5"
            "setuptools_scm[toml]>=3.4" numpy scipy
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RUPTURES=${{ env.RUPTURES_VERSION }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ruptures-${{ env.RUPTURES_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish ruptures ${{ inputs.version || '1.1.10' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: ruptures-${{ inputs.version || '1.1.10' }}-*-manylinux_riscv64
