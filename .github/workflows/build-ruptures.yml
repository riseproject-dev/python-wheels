---
# Based on the `build_wheels`/`build_aarch64_wheels` jobs of
# https://github.com/deepcharles/ruptures/blob/v1.1.10/.github/workflows/upload-to-pypi.yml
name: Build ruptures wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/ruptures.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-ruptures.yml'
      - 'docs/packages/ruptures.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ruptures.yml'
      - 'docs/packages/ruptures.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: ruptures
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build ruptures ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: ruptures
      version: ${{ matrix.version }}
      repository: deepcharles/ruptures
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # build-system.requires pins oldest-supported-numpy, which hard-pins
      # numpy==1.26.2 for cp312 with no riscv64 wheel; the extensions only use
      # Cython memoryviews (no `cimport numpy`), so --no-build-isolation plus a
      # floating numpy/scipy sidesteps the pin instead of patching pyproject.toml.
      cibw-build-frontend: "pip; args: --no-build-isolation"
      cibw-before-build: >-
        pip install "setuptools>=42" wheel "Cython>=0.28.5"
        "setuptools_scm[toml]>=3.4" numpy scipy
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RUPTURES=${{ matrix.version }}"
      cibw-test-requires: pytest
      cibw-test-command: pytest {project}/tests
      timeout-minutes: 120

  publish:
    name: Publish ruptures ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: ruptures-${{ matrix.version }}-*-manylinux_riscv64
