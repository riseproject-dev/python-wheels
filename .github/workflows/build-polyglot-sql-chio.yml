---
# This workflow is based on the `wheels-linux` job of
# https://github.com/chio-labs/polyglot/blob/python-v0.13.10/.github/workflows/python-fork-release.yml
name: Build polyglot-sql-chio wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/polyglot-sql-chio.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-polyglot-sql-chio.yml'
      - 'docs/packages/polyglot-sql-chio.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-polyglot-sql-chio.yml'
      - 'docs/packages/polyglot-sql-chio.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: polyglot-sql-chio
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build polyglot-sql-chio ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    # Real CI (run 43900677814) hit the previous 180-minute cap exactly -
    # cibuildwheel builds cp312/cp313/cp314 sequentially in one job, each a
    # full from-scratch maturin/cargo build (plus a fresh rustup install),
    # with no cache shared across interpreters despite the abi3 target.
    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this monorepo is crates/polyglot-sql-python/ -- so upstream's
    # published wheels carry no licence text at all, only the MIT
    # classifier (confirmed against the real PyPI wheel's dist-info).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "polyglot-sql-chio"
      version: "${{ matrix.version }}"
      repository: "chio-labs/polyglot"
      ref: "python-v${{ matrix.version }}"
      artifact-tag: "cp312-abi3-manylinux_riscv64"
      timeout-minutes: 360
      pre-build: "cp LICENSE crates/polyglot-sql-python/LICENSE"
      cibw-package-dir: "crates/polyglot-sql-python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # polyglot-sql-python ships no [tool.cibuildwheel]; the Rust
      # toolchain its maturin backend needs is installed in-container.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      # Upstream's own CI builds this exact wheel with
      # `--features abi3 --manifest-path crates/polyglot-sql-python/Cargo.toml`;
      # abi3 selects pyo3's abi3-py312 feature (requires-python is >=3.12).
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
        MATURIN_PEP517_ARGS="--features abi3"
      cibw-test-requires: "pytest"
      cibw-test-sources: "crates/polyglot-sql-python/tests crates/polyglot-sql-python/pyproject.toml"
      # test_duckdb_datafusion_execution.py self-skips without the
      # optional duckdb/datafusion engines installed; test_compat.py
      # self-skips without POLYGLOT_API_CONTRACT set. Both are upstream's
      # own dev test suite (not run against the wheel in upstream's own
      # CI, which only smoke-tests one parse call), run here in full per
      # this repo's own testing convention.
      cibw-test-command: >
        python -c "import polyglot_sql._polyglot_sql as m; assert m.__file__.endswith('.so'), m.__file__"
        && python -c "import polyglot_sql; assert polyglot_sql.parse_one('SELECT 1', dialect='postgres')"
        && cd crates/polyglot-sql-python
        && python -m pytest -v tests

  publish:
    name: Publish polyglot-sql-chio ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: polyglot-sql-chio-${{ matrix.version }}-*-manylinux_riscv64
