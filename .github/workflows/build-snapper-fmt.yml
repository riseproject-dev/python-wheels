---
# This workflow is based on the `wheels` job of
# https://github.com/TurtleTech-ehf/snapper/blob/main/.github/workflows/pypi.yml
name: Build snapper-fmt wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/snapper-fmt.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-snapper-fmt.yml'
      - 'docs/packages/snapper-fmt.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-snapper-fmt.yml'
      - 'docs/packages/snapper-fmt.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: snapper-fmt
      version: ${{ inputs.version }}

  build_wheel:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build snapper-fmt ${{ matrix.version }} manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      SNAPPER_FMT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout snapper v${{ env.SNAPPER_FMT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: TurtleTech-ehf/snapper
          ref: v${{ env.SNAPPER_FMT_VERSION }}
          persist-credentials: false

      # `[tool.maturin] bindings = "bin"`: the wheel is one compiled executable
      # with no ABI tag, so a single native build covers every interpreter.
      # Default features (incl. `pandoc`) match upstream's own `pypi.yml` build;
      # `pandoc` only adds a runtime dlopen path (CLAUDE.md gotcha 541 nearby) --
      # `pandoc-colink`, the feature that needs a GHC-built static archive, is
      # off by default and not what upstream publishes either.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          target: riscv64gc-unknown-linux-gnu
          args: --release --locked --out dist
          manylinux: '2_39'
          before-script-linux: git config --global --add safe.directory "*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snapper-fmt-${{ env.SNAPPER_FMT_VERSION }}-manylinux_riscv64
          path: dist/*.whl
          if-no-files-found: error

  test_wheel:
    name: Test snapper-fmt ${{ matrix.version }} on Python ${{ matrix.python-version }}
    needs: [setup, build_wheel]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    env:
      SNAPPER_FMT_VERSION: ${{ matrix.version }}
      # Without this uv would reuse the runner image's system CPython for 3.12
      # and download a standalone build for the others.
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # This repo's default interpreter matrix (gotcha in workflow-anatomy.md);
        # the wheel is interpreter-agnostic (bindings = "bin"), so every
        # interpreter -- including free-threaded -- exercises the same binary.
        python-version: ['3.12', '3.13', '3.14', '3.14t']

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: snapper-fmt-${{ env.SNAPPER_FMT_VERSION }}-manylinux_riscv64

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false

      - name: Install wheel
        run: uv pip install --reinstall --no-index --find-links . snapper-fmt

      # No wheel-level test suite ships in the sdist: snapper's own Rust
      # `tests/*.rs` integration suite is run by upstream's own `cargo test`,
      # never packaged. Drive the real formatter against known semantic
      # line-break fixtures instead of settling for a bare --version check.
      # Cargo.toml defines three [[bin]] targets from the same source
      # (`snapper`, `snapper-fmt`, `snapper-gen-docs` -- the first two are
      # argv0 aliases for the same binary, the third is a docs generator);
      # exercise both user-facing names.
      - name: Test wheel
        run: |
          set -euo pipefail
          snapper-fmt --version
          snapper --version
          snapper-fmt --help >/dev/null

          work=$(mktemp -d)
          cd "$work"

          printf 'This is one sentence. This is another sentence, right here.\n' > doc.md
          snapper-fmt doc.md > out.md
          cat out.md
          [ "$(wc -l < out.md)" -eq 2 ]
          grep -qx 'This is one sentence.' out.md
          grep -qx 'This is another sentence, right here.' out.md

          # stdin/stdout path, --format explicit (auto-detection has no
          # extension to key off when reading stdin).
          out=$(printf 'Hello world. Goodbye now.\n' | snapper-fmt --format markdown)
          [ "$(printf '%s\n' "$out" | wc -l)" -eq 2 ]

          # --in-place
          cp doc.md inplace.md
          snapper-fmt --in-place inplace.md
          diff out.md inplace.md

  publish:
    name: Publish snapper-fmt ${{ matrix.version }}
    needs: [setup, build_wheel, test_wheel]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: snapper-fmt-${{ matrix.version }}-manylinux_riscv64
