---
# Upstream tests Linux in
# https://github.com/asottile/dockerfile/blob/v3.4.0/.github/workflows/main.yml
# (tox, `pytest tests`) and builds its Linux wheel by hand with setuptools-golang's
# manylinux helper. We reproduce that shape with cibuildwheel: setuptools-golang
# runs `go build -buildmode=c-shared` on pylib/main.go inside the container.
name: Build dockerfile wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dockerfile.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dockerfile.yml'
      - 'docs/packages/dockerfile.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dockerfile.yml'
      - 'docs/packages/dockerfile.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dockerfile
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build dockerfile ${{ matrix.version }} cp312-abi3-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: dockerfile
      version: ${{ matrix.version }}
      repository: asottile/dockerfile
      ref: v${{ matrix.version }}
      artifact-tag: cp312-abi3-manylinux_riscv64
      # setup.py tags the wheel abi3 at the building interpreter's version and does
      # not skip that under Py_GIL_DISABLED, so no cp314t; cibuildwheel reuses and
      # tests the cp312-abi3 wheel on cp313/cp314.
      cibw-build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
      cibw-before-all-linux: >-
        curl -sSfL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.8.linux-riscv64.tar.gz &&
        echo "75d368eef1dc44ff9de0c8cac4b37c519e541e6d46c4291c1ff959644a71af32  /tmp/go.tar.gz" | sha256sum -c &&
        tar -zxf /tmp/go.tar.gz -C /usr/local/ &&
        rm /tmp/go.tar.gz
      cibw-environment-linux: PATH="/usr/local/go/bin:$PATH"
      # cibuildwheel's default abi3audit run rejects any abi3 wheel exporting a
      # Py-prefixed symbol it doesn't know; pylib/main.go's cgo exports
      # (PyDockerfile_Heredoc, PyDockerfile_Command, etc.) are the Go package's own
      # c-shared symbols, not CPython C-API calls, so abi3audit's strict scan flags
      # all 8 of them as ABI violations even though upstream's own released wheel
      # has the exact same exports.
      cibw-audit-command: ''
      cibw-test-requires: pytest
      cibw-test-sources: tests testfiles
      cibw-test-command: >-
        python -c "import dockerfile; assert dockerfile.__file__.endswith('.abi3.so'), dockerfile.__file__" &&
        python -m pytest tests
      timeout-minutes: 90

  publish:
    name: Publish dockerfile ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dockerfile-${{ matrix.version }}-*-manylinux_riscv64
