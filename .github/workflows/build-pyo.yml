---
# This workflow is based on the cibuildwheel step of
# https://github.com/belangeo/pyo/blob/1.1.0/.github/workflows/build_manylinux_wheels.yml
name: Build pyo wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyo.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyo.yml'
      - 'docs/packages/pyo.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyo.yml'
      - 'docs/packages/pyo.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs['cancel-in-progress'] }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyo
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyo ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    env:
      PYO_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyo ${{ env.PYO_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: belangeo/pyo
          ref: ${{ env.PYO_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's manylinux-pre-build-script.sh dnf-installs portaudio-devel/
          # portmidi-devel directly and builds liblo/libsndfile/alsa-lib/JACK2 from
          # source, then ships --use-jack --use-double. EPEL is empty on riscv64
          # (gotcha 51), so portaudio-devel/portmidi-devel aren't available via dnf
          # either; alsa-lib-devel is (Rocky 10 AppStream, no EPEL needed, same
          # package build-pygame.yml already uses on this image). portaudio 19.7.0
          # and portmidi 2.0.3 are built from source the same way build-sherpa-onnx.yml
          # (portaudio tarball) and build-pygame.yml (portmidi via CMake) already do
          # on this riscv64 image; liblo and libsndfile have no in-repo precedent but
          # are plain autotools builds with no arch-specific code. JACK2's own
          # waf-based server build has no riscv64 precedent here and exists only to
          # match --use-jack bit-for-bit, so --use-jack is dropped (no jackd on this
          # headless CI runner either way) -- a documented divergence from upstream,
          # kept to --use-double otherwise. pyo's own setup.py has no arch-specific
          # (x86/SIMD) code path.
          CIBW_BEFORE_ALL: |
            dnf install -y -q alsa-lib-devel

            export MAKEFLAGS="-j$(nproc)"
            mkdir -p /tmp/pyo-deps && cd /tmp/pyo-deps

            curl -fsSL --retry 5 -o portaudio.tgz http://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
            tar xzf portaudio.tgz
            (cd portaudio && ./configure && make && make install)

            curl -fsSL --retry 5 -o portmidi.tar.gz https://github.com/PortMidi/portmidi/archive/refs/tags/v2.0.3.tar.gz
            tar xzf portmidi.tar.gz
            (cd portmidi-2.0.3 && cmake . -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR:PATH=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON && make && make install)

            curl -fsSL --retry 5 -o liblo.tar.gz https://downloads.sourceforge.net/liblo/liblo-0.31.tar.gz
            tar xzf liblo.tar.gz
            (cd liblo-0.31 && ./configure && make && make install)

            curl -fsSL --retry 5 -o libsndfile.tar.bz2 https://github.com/libsndfile/libsndfile/releases/download/1.0.31/libsndfile-1.0.31.tar.bz2
            tar xjf libsndfile.tar.bz2
            (cd libsndfile-1.0.31 && ./configure && make && make install)

            ldconfig
          CIBW_CONFIG_SETTINGS: --build-option=--use-double
          CIBW_ENVIRONMENT: CFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib
          CIBW_TEST_COMMAND: >-
            python -c "import pyo; print(pyo.getVersion())" &&
            python -c "import pyo64; print(pyo64.getVersion())"

      - name: Verify the wheel ships both the single- and double-precision extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          sos = [n for n in names if n.endswith(".so")]
          assert any(n.startswith("pyo/_pyo.") for n in sos), sos
          assert any(n.startswith("pyo/_pyo64.") for n in sos), sos
          print(sys.argv[1], "->", sos)
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyo-${{ env.PYO_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyo ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyo-${{ matrix.version }}-*-manylinux_riscv64
