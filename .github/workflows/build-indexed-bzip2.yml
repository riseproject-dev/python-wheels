---
# Based on upstream's own wheels.yml (plain cibuildwheel, Cython/C++ extension
# with no CMake involvement for the python package), narrowed to riscv64.
name: Build indexed-bzip2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/indexed-bzip2.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-bzip2.yml'
      - 'docs/packages/indexed-bzip2.yaml'
      - 'patches/indexed-bzip2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-bzip2.yml'
      - 'docs/packages/indexed-bzip2.yaml'
      - 'patches/indexed-bzip2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: indexed-bzip2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build indexed-bzip2 ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      INDEXED_BZIP2_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout indexed_bzip2 v${{ env.INDEXED_BZIP2_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mxmlnkn/indexed_bzip2
          ref: v${{ env.INDEXED_BZIP2_VERSION }}
          # src/external/cxxopts (statically compiled into the extension via
          # the ibzip2 CLI it bundles) is a submodule.
          submodules: recursive
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch indexed_bzip2 source
        run: git apply python-wheels/patches/indexed-bzip2/${{ env.INDEXED_BZIP2_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
          package-dir: python/indexed_bzip2
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT_LINUX: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,cython
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: >-
            python3 -X dev -u -m pytest {project}/src/tests/testGIL.py &&
            python3 -X dev -u {project}/src/tests/testPythonWrappers.py

      - name: Check the wheel carries the cxxopts license
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if not any("cxxopts" in n.lower() for n in names):
              raise SystemExit(f"error: cxxopts license missing from {sys.argv[1]}: {names}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: indexed-bzip2-${{ env.INDEXED_BZIP2_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish indexed-bzip2 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: indexed-bzip2-${{ matrix.version }}-*-manylinux_riscv64
