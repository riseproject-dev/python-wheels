---
# Based on upstream's own wheels.yml (plain cibuildwheel, Cython/C++ extension
# with no CMake involvement for the python package), narrowed to riscv64.
name: Build indexed-bzip2 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/indexed-bzip2.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-bzip2.yml'
      - 'docs/packages/indexed-bzip2.yaml'
      - 'patches/indexed-bzip2/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-indexed-bzip2.yml'
      - 'docs/packages/indexed-bzip2.yaml'
      - 'patches/indexed-bzip2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: indexed-bzip2
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build indexed-bzip2 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "indexed-bzip2"
      version: "${{ matrix.version }}"
      repository: "mxmlnkn/indexed_bzip2"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/indexed-bzip2/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-package-dir: "python/indexed_bzip2"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,cython"
      cibw-test-requires: "numpy"
      cibw-test-environment: "CI=true"
      # testGIL.py only tests rapidgzip, which has no riscv64 wheel.
      cibw-test-command: "python3 -X dev -u {project}/src/tests/testPythonWrappers.py"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      INDEXED_BZIP2_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: indexed-bzip2-${{ env.INDEXED_BZIP2_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel carries the cxxopts license
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
          licenses = [n for n in z.namelist() if ".dist-info/" in n and "LICEN" in n.upper()]
          if "License-File: external/cxxopts/LICENSE" not in z.read(meta).decode() or not any(b"Jarryd Beck" in z.read(n) for n in licenses):
              raise SystemExit(f"error: cxxopts license missing from {sys.argv[1]}: {licenses}")
          EOF

  publish:
    name: Publish indexed-bzip2 ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: indexed-bzip2-${{ matrix.version }}-*-manylinux_riscv64
