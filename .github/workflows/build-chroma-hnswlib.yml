---
# Based on https://github.com/chroma-core/hnswlib/blob/0.7.6/.github/workflows/release.yml
# and test.yml's test_python job.
name: Build chroma-hnswlib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'chroma-hnswlib version to build (git tag, e.g. 0.7.6)'
        required: true
        default: '0.7.6'
  pull_request:
    paths:
      - '.github/workflows/build-chroma-hnswlib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.7.6' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.7.6 there.
  CHROMA_HNSWLIB_VERSION: ${{ inputs.version || '0.7.6' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build chroma-hnswlib ${{ inputs.version || '0.7.6' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout chroma-hnswlib ${{ env.CHROMA_HNSWLIB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: chroma-core/hnswlib
          ref: ${{ env.CHROMA_HNSWLIB_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's own release workflow builds this way for every wheel it
          # publishes, to keep the binary portable across unknown host CPUs.
          # numpy is a build and a runtime requirement, and only our registry
          # has it for riscv64.
          CIBW_ENVIRONMENT: >-
            HNSWLIB_NO_NATIVE=true
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          # The compiled extension is a top-level `hnswlib` module, and the
          # checkout's own `hnswlib/` directory (the C++ headers) would shadow
          # it as a namespace package if staged (gotcha 25); stage only the
          # test and example sources upstream's own CI runs.
          CIBW_TEST_SOURCES: examples/python tests/python
          # examples/python has no unittest.TestCase (they're demo scripts, run
          # for their side effects); Python 3.12+ made `unittest discover` exit
          # 5 on zero collected tests (upstream's own 3.7-3.10 CI never hit
          # this), which would abort the `&&`-chained real suite below.
          CIBW_TEST_COMMAND: >-
            python -m unittest discover -v --start-directory examples/python --pattern "example*.py" ;
            python -m unittest discover -v --start-directory tests/python --pattern "bindings_test*.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chroma-hnswlib-${{ env.CHROMA_HNSWLIB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish chroma-hnswlib ${{ inputs.version || '0.7.6' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: chroma-hnswlib-${{ inputs.version || '0.7.6' }}-*-manylinux_riscv64
