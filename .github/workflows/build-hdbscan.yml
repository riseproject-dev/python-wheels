---
# This workflow is based on the `linux-deploy` job of
# https://github.com/scikit-learn-contrib/hdbscan/blob/release-0.8.44/.github/workflows/pythonpublish_wheel.yml
name: Build hdbscan wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/hdbscan.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-hdbscan.yml'
      - 'docs/packages/hdbscan.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hdbscan.yml'
      - 'docs/packages/hdbscan.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: hdbscan
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build hdbscan ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: hdbscan
      version: ${{ matrix.version }}
      repository: scikit-learn-contrib/hdbscan
      ref: release-${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-environment: >-
        PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
        PIP_ONLY_BINARY=numpy,scipy,scikit-learn
      cibw-test-requires: pytest
      # Mirrors upstream's own test invocation (azure-pipelines.yml's RunAllTests
      # stage: `pytest hdbscan/tests --show-capture=no -v --disable-warnings`),
      # against the installed wheel via --pyargs since hdbscan.tests ships in it.
      cibw-test-command: >-
        python -c "import hdbscan; from hdbscan import HDBSCAN; print('hdbscan OK')" &&
        python -m pytest -rfxEXs --durations=20 --disable-warnings --showlocals --pyargs hdbscan.tests
      timeout-minutes: 120

  publish:
    name: Publish hdbscan ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: hdbscan-${{ matrix.version }}-*-manylinux_riscv64
