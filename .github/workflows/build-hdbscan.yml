---
# This workflow is based on the `linux-deploy` job of
# https://github.com/scikit-learn-contrib/hdbscan/blob/release-0.8.44/.github/workflows/pythonpublish_wheel.yml
name: Build hdbscan wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'hdbscan version to build (e.g. 0.8.44)'
        required: true
        default: '0.8.44'
  pull_request:
    paths:
      - '.github/workflows/build-hdbscan.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.8.44' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.8.44 there.
  HDBSCAN_VERSION: ${{ inputs.version || '0.8.44' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build hdbscan ${{ inputs.version || '0.8.44' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): the Cython extensions link the version-specific ABI.
        # cp310/cp311 dropped from upstream's cp310-cp314 (gotcha 67/84): hdbscan's hard
        # runtime dependency scikit-learn>=1.6 only has riscv64 wheels on
        # pypi.riseproject.dev for cp312/cp313/cp314/cp314t, so older interpreters would
        # fall back to a from-source scikit-learn build during the test-install step.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout hdbscan ${{ env.HDBSCAN_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: scikit-learn-contrib/hdbscan
          ref: release-${{ env.HDBSCAN_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,scikit-learn
          CIBW_TEST_REQUIRES: pytest
          # Mirrors upstream's own test invocation (azure-pipelines.yml's RunAllTests
          # stage: `pytest hdbscan/tests --show-capture=no -v --disable-warnings`),
          # against the installed wheel via --pyargs since hdbscan.tests ships in it.
          CIBW_TEST_COMMAND: >-
            python -c "import hdbscan; from hdbscan import HDBSCAN; print('hdbscan OK')" &&
            python -m pytest -rfxEXs --durations=20 --disable-warnings --showlocals --pyargs hdbscan.tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: hdbscan-${{ env.HDBSCAN_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish hdbscan ${{ inputs.version || '0.8.44' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: hdbscan-${{ inputs.version || '0.8.44' }}-*-manylinux_riscv64
