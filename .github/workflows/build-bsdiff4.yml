---
# Based on the `build_wheels` job of
# https://github.com/ilanschnell/bsdiff4/blob/1.2.6/.github/workflows/build_wheels.yml
name: Build bsdiff4 wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/bsdiff4.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-bsdiff4.yml'
      - 'docs/packages/bsdiff4.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bsdiff4.yml'
      - 'docs/packages/bsdiff4.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: bsdiff4
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build bsdiff4 ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: bsdiff4
      version: ${{ matrix.version }}
      repository: ilanschnell/bsdiff4
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-test-command: >-
        python -c "import bsdiff4.core as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -c "import bsdiff4; assert bsdiff4.test().wasSuccessful()"
      timeout-minutes: 60

  publish:
    name: Publish bsdiff4 ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: bsdiff4-${{ matrix.version }}-*-manylinux_riscv64
