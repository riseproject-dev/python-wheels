---
# This workflow is based on the `linux` job of
# https://github.com/pcodec/pcodec/blob/Python_v1.0.3/.github/workflows/python_publish.yml
name: Build pcodec wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pcodec.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pcodec.yml'
      - 'docs/packages/pcodec.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pcodec.yml'
      - 'docs/packages/pcodec.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pcodec
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pcodec ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # Checked out at the workspace root: pco_python is a member of pcodec's
    # Cargo workspace and builds against its sibling pco/better_io crates.
    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this monorepo is pco_python/ -- so upstream's published wheels
    # carry no licence text at all, only the classifier.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pcodec"
      version: "${{ matrix.version }}"
      repository: "pcodec/pcodec"
      ref: "Python_v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      pre-build: "cp LICENSE pco_python/LICENSE"
      cibw-package-dir: "pco_python"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pco_python ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: >
        PATH="$PATH:$HOME/.cargo/bin"
      # numpy is a runtime dependency; public PyPI's newest release always
      # outranks our registry's version and has no riscv64 wheel, so pin
      # resolution to a binary to avoid a from-source numpy build.
      cibw-test-environment-linux: "PIP_ONLY_BINARY=numpy"
      cibw-test-requires: "pytest"
      # test-sources resolves against the checkout root, not package-dir.
      # pco/assets holds the .pco fixture files test_standalone.py reads
      # via a ../../pco/assets/*.pco relative path.
      cibw-test-sources: "pco_python/test pco_python/README.md pco/assets"
      cibw-test-command: >
        python -c "import pcodec.pcodec as m; assert m.__file__.endswith('.so'), m.__file__"
        && cd pco_python && python -m pytest -v --doctest-glob=*.md test README.md

  publish:
    name: Publish pcodec ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pcodec-${{ matrix.version }}-*-manylinux_riscv64
