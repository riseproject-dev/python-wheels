---
# This workflow is based on the `python-linux-release-build` job of
# https://github.com/pemistahl/lingua-rs/blob/v1.8.0/.github/workflows/release.yml
name: Build lingua-language-detector wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/lingua-language-detector.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-lingua-language-detector.yml'
      - 'docs/packages/lingua-language-detector.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lingua-language-detector.yml'
      - 'docs/packages/lingua-language-detector.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: lingua-language-detector
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build lingua-language-detector ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # PyO3 extension built per-interpreter, not abi3, matching upstream's
        # own cp312/cp313/cp314 release wheels; upstream doesn't build 3.14t.
        python: ["cp312", "cp313", "cp314"]

    env:
      LINGUA_RS_VERSION: ${{ matrix.version }}

    steps:
      # The lingua-language-detector PyPI project ships no sdist. Its PyPI
      # metadata and README point at pemistahl/lingua-py, but that repo holds
      # only docs/scripts/test data -- the actual PyO3/maturin source and its
      # own release workflow live in the pemistahl/lingua-rs Cargo workspace,
      # whose git tags track the Rust crate version, not the PyPI version
      # (v1.8.0 built lingua-language-detector 2.2.0).
      - name: Checkout lingua-rs v${{ env.LINGUA_RS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pemistahl/lingua-rs
          ref: v${{ env.LINGUA_RS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_ARCHS: riscv64
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # lingua-rs ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest==9.0.2
          CIBW_TEST_SOURCES: tests/python
          # module-name "lingua" with no python-source still gets maturin's
          # usual wrapper package: `lingua/__init__.py` does `from .lingua
          # import *`, so the compiled extension is the lingua.lingua submodule.
          CIBW_TEST_COMMAND: >-
            python -c "import lingua; assert lingua.lingua.__file__.endswith('.so'), lingua.lingua.__file__" &&
            python -m pytest -v tests/python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lingua_language_detector-${{ env.LINGUA_RS_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish lingua-language-detector ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: lingua_language_detector-${{ matrix.version }}-*-manylinux_riscv64
