---
# This workflow is based on the `build` job of
# https://github.com/libAtoms/matscipy/blob/v1.2.0/.github/workflows/wheels.yml
# and the `pytest` step of
# https://github.com/libAtoms/matscipy/blob/v1.2.0/.github/workflows/tests.yml
name: Build matscipy wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/matscipy.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-matscipy.yml'
      - 'docs/packages/matscipy.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matscipy.yml'
      - 'docs/packages/matscipy.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: matscipy
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build matscipy ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314"]

    env:
      MATSCIPY_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout matscipy v${{ env.MATSCIPY_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: libAtoms/matscipy
          ref: v${{ env.MATSCIPY_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_BUILD: pip install meson meson-python ninja
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,matplotlib,contourpy,kiwisolver,pillow
          # Upstream's wheel job only imports the extension; run its tests.yml suite instead.
          # ase<3.28: 3.28.0 removed the whole ase.constraints module (UnitCellFilter and
          # friends) that this v1.2.0 tag's own tests/ still imports from; matscipy's
          # pyproject.toml floor (ase>=3.26.0) doesn't cap the other end.
          CIBW_TEST_REQUIRES: pytest pytest-subtests pytest-timeout pytest-xdist sympy "ase<3.28"
          CIBW_TEST_COMMAND: cd {project}/tests && pytest -v --durations=20 --timeout=600 -n auto

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: matscipy-${{ env.MATSCIPY_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish matscipy ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: matscipy-${{ matrix.version }}-*-manylinux_riscv64
