---
# Based on: https://github.com/Chia-Network/chiapos/blob/2.0.12/.github/workflows/build-wheels.yml
name: Build chiapos wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/chiapos.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-chiapos.yml'
      - 'docs/packages/chiapos.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chiapos.yml'
      - 'docs/packages/chiapos.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: chiapos
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build chiapos ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "chiapos"
      version: "${{ matrix.version }}"
      repository: "Chia-Network/chiapos"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180
      pre-build: |-
        set -euo pipefail
        tag() { sed -n "/GIT_REPOSITORY .*\/$1\.git/{n;s/.*GIT_TAG *//p}" CMakeLists.txt; }
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/pybind/pybind11/$(tag pybind11)/LICENSE" -o LICENSE.pybind11
        curl -fsSL --retry 5 "https://raw.githubusercontent.com/BLAKE3-team/BLAKE3/$(tag BLAKE3)/LICENSE" -o LICENSE.blake3
        cp lib/FiniteStateEntropy/LICENSE LICENSE.finite-state-entropy
        sed -n '/The MIT License/,/THE SOFTWARE\./p' lib/include/picosha2.hpp > LICENSE.picosha2
        test -s LICENSE.picosha2

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Bladebit's prebuilt green_reaper harvester has no riscv64 build; upstream's own riscv64 job builds without it.
      cibw-before-all: ''
      cibw-environment-linux: "CP_USE_GREEN_REAPER=0"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CHIAPOS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: chiapos-${{ env.CHIAPOS_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.endswith(".so")]
          assert len(exts) == 1 and exts[0].startswith("chiapos.cpython-"), exts
          assert exts[0].endswith("-riscv64-linux-gnu.so"), exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          assert licences == {"LICENSE", "LICENSE.blake3", "LICENSE.finite-state-entropy",
                              "LICENSE.picosha2", "LICENSE.pybind11"}, licences
          EOF

  publish:
    name: Publish chiapos ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: chiapos-${{ matrix.version }}-*-manylinux_riscv64
