---
# This workflow is based on: https://github.com/spglib/spglib/blob/v2.7.0/.github/workflows/step_build-wheel.yaml
name: Build spglib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'spglib version to build (git tag without leading v, e.g. 2.7.0)'
        required: true
        default: '2.7.0'
  pull_request:
    paths:
      - '.github/workflows/build-spglib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '2.7.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  SPGLIB_VERSION: ${{ inputs.version || '2.7.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build spglib ${{ inputs.version || '2.7.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout spglib v${{ env.SPGLIB_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: spglib/spglib
          ref: v${{ env.SPGLIB_VERSION }}
          # setuptools_scm/DynamicVersion.cmake both derive the version from `git describe`.
          fetch-depth: 0
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy has no riscv64 wheel on public PyPI; pull it from our registry instead.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=numpy

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spglib-${{ env.SPGLIB_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish spglib ${{ inputs.version || '2.7.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: spglib-${{ inputs.version || '2.7.0' }}-*-manylinux_riscv64
