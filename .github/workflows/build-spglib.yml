---
# This workflow is based on: https://github.com/spglib/spglib/blob/v2.7.0/.github/workflows/step_build-wheel.yaml
name: Build spglib wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/spglib.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-spglib.yml'
      - 'docs/packages/spglib.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-spglib.yml'
      - 'docs/packages/spglib.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: spglib
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build spglib ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: spglib
      version: ${{ matrix.version }}
      # setuptools_scm/DynamicVersion.cmake both derive the version from `git describe`.
      repository: spglib/spglib
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy has no riscv64 wheel on public PyPI; pull it from our registry instead.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-environment: PIP_ONLY_BINARY=numpy
      timeout-minutes: 90

  publish:
    name: Publish spglib ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: spglib-${{ matrix.version }}-*-manylinux_riscv64
