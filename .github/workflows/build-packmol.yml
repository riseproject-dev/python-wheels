---
# This workflow is based on the `build_wheels` job of
# https://github.com/m3g/packmol/blob/v21.2.3/.github/workflows/build-wheels.yaml
name: Build packmol wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/packmol.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-packmol.yml'
      - 'docs/packages/packmol.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-packmol.yml'
      - 'docs/packages/packmol.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: packmol
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build packmol ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PACKMOL_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout packmol v${{ env.PACKMOL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: m3g/packmol
          ref: v${{ env.PACKMOL_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # The Makefile's FLAGS hardcode -march=native, which GCC rejects on riscv64 and
          # which would tie the binary to the build host anyway. The built binary also
          # segfaulted immediately (empty stdout/stderr, no diagnostics at all) on every
          # interpreter at -O3 -funroll-loops; dropping to the same -O2 gfortran uses
          # without any optimization/unroll flags gets a binary that runs.
          CIBW_ENVIRONMENT: >-
            MAKEFLAGS='FLAGS=-O2'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packmol-${{ env.PACKMOL_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    # packmol is a gfortran-built executable, so auditwheel vendors its libgfortran runtime.
    name: Collect GPL sources (gcc) for packmol ${{ matrix.version }}
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Collect gcc source RPM from manylinux_riscv64
        uses: riseproject-dev/python-wheels/actions/collect-gpl-sources@main
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packmol-${{ matrix.version }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish packmol ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: packmol-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: packmol-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
