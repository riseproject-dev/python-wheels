---
# Based on the `build_wheels` job of
# https://github.com/kodonnell/qoi/blob/v0.7.2/.github/workflows/wheels.yml
name: Build qoi wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'qoi version to build (git tag without leading v, e.g. 0.7.2)'
        required: true
        default: '0.7.2'
  pull_request:
    paths:
      - '.github/workflows/build-qoi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.7.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  QOI_VERSION: ${{ inputs.version || '0.7.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build qoi ${{ inputs.version || '0.7.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout qoi v${{ env.QOI_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: kodonnell/qoi
          ref: v${{ env.QOI_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # USE_CYTHON=1 matches upstream's own [tool.cibuildwheel] table
          # (re-cythonize rather than build from the checked-in qoi.c).
          # numpy is both a build-time header dependency (setup.py's
          # np.get_include()) and a runtime one (install_requires); only our
          # registry has it for riscv64, and only-binary keeps a newer PyPI
          # release from winning the resolution and compiling from sdist.
          CIBW_ENVIRONMENT: >-
            USE_CYTHON=1
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,pillow

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
              assert exts == {"qoi"}, exts
              assert any(n.endswith("dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qoi-${{ env.QOI_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish qoi ${{ inputs.version || '0.7.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: qoi-${{ inputs.version || '0.7.2' }}-*-manylinux_riscv64
