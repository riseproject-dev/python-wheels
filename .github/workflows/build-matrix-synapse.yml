---
# This workflow is based on the `build-wheels` job of
# https://github.com/element-hq/synapse/blob/v1.162.0/.github/workflows/release-artifacts.yml
name: Build matrix-synapse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/matrix-synapse.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-matrix-synapse.yml'
      - 'docs/packages/matrix-synapse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matrix-synapse.yml'
      - 'docs/packages/matrix-synapse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: matrix-synapse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: [manylinux, musllinux]
    name: Build matrix-synapse ${{ matrix.version }} cp310-abi3-${{ matrix.platform }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240

    env:
      MATRIX_SYNAPSE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout synapse v${{ env.MATRIX_SYNAPSE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: element-hq/synapse
          ref: v${{ env.MATRIX_SYNAPSE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # pyo3's abi3-py310 feature: built once on cp310, re-tested on the
          # newer interpreters. pp311 is dropped: PyPy has no riscv64 port.
          CIBW_BUILD: >-
            cp310-${{ matrix.platform }}_riscv64 cp312-${{ matrix.platform }}_riscv64
            cp313-${{ matrix.platform }}_riscv64 cp314-${{ matrix.platform }}_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # cryptography, bcrypt, ijson and zope.interface have riscv64 wheels
          # from cp312 only.
          CIBW_TEST_SKIP: cp310-* *musl*
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c 'from synapse.synapse_rust import sum_as_string; print(sum_as_string(1, 2))' &&
            python -m twisted.trial -j2
            tests.test_rust tests.synapse_rust tests.push tests.events tests.api
            tests.storage.test_event_federation tests.storage.test_redaction
            tests.handlers.test_deactivate_account
            tests.rest.client.test_rendezvous tests.rest.client.test_msc4388_rendezvous

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "synapse/synapse_rust.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE-AGPL-3.0") for n in names), names
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: matrix-synapse-${{ env.MATRIX_SYNAPSE_VERSION }}-cp310-abi3-${{ matrix.platform }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish matrix-synapse ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: matrix-synapse-${{ matrix.version }}-*_riscv64
