---
# This workflow is based on the `build-wheels` job of
# https://github.com/element-hq/synapse/blob/v1.162.0/.github/workflows/release-artifacts.yml
name: Build matrix-synapse wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/matrix-synapse.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-matrix-synapse.yml'
      - 'docs/packages/matrix-synapse.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matrix-synapse.yml'
      - 'docs/packages/matrix-synapse.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: matrix-synapse
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: [manylinux, musllinux]
    name: Build matrix-synapse ${{ matrix.version }} cp310-abi3-${{ matrix.platform }}_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "matrix-synapse"
      version: "${{ matrix.version }}"
      repository: "element-hq/synapse"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-${{ matrix.platform }}_riscv64"
      timeout-minutes: 240
      # pyo3's abi3-py310 feature: built once on cp310, re-tested on the
      # newer interpreters. pp311 is dropped: PyPy has no riscv64 port.
      cibw-build: "cp310-${{ matrix.platform }}_riscv64 cp312-${{ matrix.platform }}_riscv64 cp313-${{ matrix.platform }}_riscv64 cp314-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # cryptography, bcrypt, ijson and zope.interface have riscv64 wheels
      # from cp312 only.
      cibw-test-skip: "cp310-* *musl*"
      cibw-test-extras: "test"
      cibw-test-sources: "tests"
      cibw-test-command: "python -c 'from synapse.synapse_rust import sum_as_string; print(sum_as_string(1, 2))' && python -m twisted.trial -j2 tests.test_rust tests.synapse_rust tests.push tests.events tests.api tests.storage.test_event_federation tests.storage.test_redaction tests.handlers.test_deactivate_account tests.rest.client.test_rendezvous tests.rest.client.test_msc4388_rendezvous"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        platform: [manylinux, musllinux]
    env:
      MATRIX_SYNAPSE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: matrix-synapse-${{ env.MATRIX_SYNAPSE_VERSION }}-cp310-abi3-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "synapse/synapse_rust.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE-AGPL-3.0") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish matrix-synapse ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: matrix-synapse-${{ matrix.version }}-*_riscv64
