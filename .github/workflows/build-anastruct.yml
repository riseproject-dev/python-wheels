---
# This workflow is based on: https://github.com/ritchie46/anaStruct/blob/release-v1.7.0/.github/workflows/release.yaml
name: Build anastruct wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/anastruct.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-anastruct.yml'
      - 'docs/packages/anastruct.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-anastruct.yml'
      - 'docs/packages/anastruct.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: anastruct
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build anastruct ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp310"
          - "cp311"
          - "cp312"
          - "cp313"
          - "cp314"

    env:
      ANASTRUCT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout anaStruct release-v${{ env.ANASTRUCT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ritchie46/anaStruct
          ref: release-v${{ env.ANASTRUCT_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # numpy (build-time + runtime) and scipy (runtime; scipy>=1.10.0 is a hard
          # dependency) both need OpenBLAS/gfortran to build from sdist, which the
          # manylinux_riscv64 image doesn't carry, so both are pinned to binary --
          # only our registry has them for riscv64. matplotlib (test-only) is pinned
          # for the same reason: no public-PyPI riscv64 wheel, and it is slow to
          # build from source. Cython (the other build-time requirement) is left
          # unrestricted: our registry only carries riscv64 Cython wheels for cp312+,
          # and letting pip fall back to Cython's own (portable, non-arch-specific)
          # sdist for cp310/cp311 builds cleanly, as it already does for crick.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,scipy,matplotlib
            MPLBACKEND=Agg
          CIBW_TEST_SOURCES: tests examples
          CIBW_TEST_REQUIRES: pytest pytest-describe matplotlib numpy
          CIBW_TEST_COMMAND: python -m pytest tests

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.split("/")[-1].split(".")[0] for n in names if n.endswith(".so")}
          assert exts == {"cbasic", "celements"}, exts
          licences = {n.rsplit("/", 1)[-1] for n in names if ".dist-info/licenses/" in n} - {""}
          assert licences == {"LICENSE.txt"}, licences
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: anastruct-${{ env.ANASTRUCT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish anastruct ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: anastruct-${{ matrix.version }}-*-manylinux_riscv64
