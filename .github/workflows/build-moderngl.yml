---
# This workflow is based on: https://github.com/moderngl/moderngl/blob/5.12.0/.github/workflows/release.yml
name: Build moderngl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/moderngl.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-moderngl.yml'
      - 'docs/packages/moderngl.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-moderngl.yml'
      - 'docs/packages/moderngl.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: moderngl
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build moderngl ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "moderngl"
      version: "${{ matrix.version }}"
      repository: "moderngl/moderngl"
      ref: "${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-environment-linux: "LIBGL_ALWAYS_SOFTWARE=1"
      # Upstream's own pytest suite (tests/, via a standalone EGL context -
      # see tests/conftest.py) needs numpy/scipy/PyOpenGL, which have no
      # musllinux riscv64 wheel on either PyPI or our registry, so musllinux
      # gets the lighter EGL-context smoke test instead of the full suite.
      # test_local.py asserts the tests dir sits next to an editable install
      # (upstream's own Containerfile runs `setup.py build_ext --inplace`
      # first); it never holds for a wheel installed into its own venv.
      cibw-test-requires: "${{ matrix.platform == 'manylinux' && 'pytest numpy scipy PyOpenGL' || '' }}"
      cibw-test-command: "${{ matrix.platform == 'manylinux' && 'python -m pytest {project}/tests -v -k \"not test_local\"' || 'python3 -c ''from glcontext import egl; import moderngl; ctx = moderngl.create_context(standalone=True, context=egl.create_context(glversion=330, mode=\"standalone\")); print(ctx.info); ctx.release()''' }}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      MODERNGL_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: moderngl-${{ env.MODERNGL_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("moderngl/mgl.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

  publish:
    name: Publish moderngl ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: moderngl-${{ matrix.version }}-*riscv64
