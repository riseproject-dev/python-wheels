---
# This workflow is based on: https://github.com/moderngl/moderngl/blob/5.12.0/.github/workflows/release.yml
name: Build moderngl wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'moderngl version to build (git tag, e.g. 5.12.0)'
        required: true
        default: '5.12.0'
  pull_request:
    paths:
      - '.github/workflows/build-moderngl.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '5.12.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 5.12.0 there.
  MODERNGL_VERSION: ${{ inputs.version || '5.12.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build moderngl ${{ inputs.version || '5.12.0' }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]

    steps:
      - name: Checkout moderngl ${{ env.MODERNGL_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: moderngl/moderngl
          ref: ${{ env.MODERNGL_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ LIBGL_ALWAYS_SOFTWARE=1
          # Upstream's own pytest suite (tests/, via a standalone EGL context -
          # see tests/conftest.py) needs numpy/scipy/PyOpenGL, which have no
          # musllinux riscv64 wheel on either PyPI or our registry, so musllinux
          # gets the lighter EGL-context smoke test instead of the full suite.
          # test_local.py asserts the tests dir sits next to an editable install
          # (upstream's own Containerfile runs `setup.py build_ext --inplace`
          # first); it never holds for a wheel installed into its own venv.
          CIBW_TEST_REQUIRES: ${{ matrix.libc == 'manylinux' && 'pytest numpy scipy PyOpenGL' || '' }}
          CIBW_TEST_COMMAND: ${{ matrix.libc == 'manylinux' && 'python -m pytest {project}/tests -v -k "not test_local"' || 'python3 -c ''from glcontext import egl; import moderngl; ctx = moderngl.create_context(standalone=True, context=egl.create_context(glversion=330, mode="standalone")); print(ctx.info); ctx.release()''' }}

      - name: Check the compiled extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("moderngl/mgl.") and n.endswith(".so") for n in names), whl
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: moderngl-${{ env.MODERNGL_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish moderngl ${{ inputs.version || '5.12.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: moderngl-${{ inputs.version || '5.12.0' }}-*riscv64
