---
# This workflow is based on the `build_wheels` job of
# https://github.com/CodyRay/pycronexpr/blob/v0.30.0/.github/workflows/deploy.yaml
name: Build cronexpr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cronexpr.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cronexpr.yml'
      - 'docs/packages/cronexpr.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cronexpr.yml'
      - 'docs/packages/cronexpr.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cronexpr
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cronexpr ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: cronexpr
      version: ${{ matrix.version }}
      repository: CodyRay/pycronexpr
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH, and CMake
      # 4+ rejects supertinycron's CPM-fetched cmake_minimum_required(3.5) (gotcha 257).
      cibw-environment-linux: "CMAKE_POLICY_VERSION_MINIMUM=3.5"
      cibw-test-command: >-
        python -c "import _ccronexpr as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -c "import cronexpr, unittest;
        from datetime import datetime, timezone;
        d = datetime(2024, 9, 4, tzinfo=timezone.utc);
        assert cronexpr.next_fire('0 0 21 ? 1/2 TUE#1 *', d) == datetime(2024, 11, 5, 21, 0, tzinfo=timezone.utc);
        assert cronexpr.prev_fire('0 0 21 ? 1/2 TUE#1 *', d) == datetime(2024, 9, 3, 21, 0, tzinfo=timezone.utc);
        unittest.TestCase().assertRaises(ValueError, cronexpr.prev_fire, '* 35 * * *')"
      timeout-minutes: 60

  publish:
    name: Publish cronexpr ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: cronexpr-${{ matrix.version }}-*-manylinux_riscv64
