---
# This workflow is based on the `build_wheels` job of
# https://github.com/CodyRay/pycronexpr/blob/v0.30.0/.github/workflows/deploy.yaml
name: Build cronexpr wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cronexpr version to build (git tag without leading v, e.g. 0.30.0)'
        required: true
        default: '0.30.0'
  pull_request:
    paths:
      - '.github/workflows/build-cronexpr.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.30.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.30.0 there.
  CRONEXPR_VERSION: ${{ inputs.version || '0.30.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cronexpr ${{ inputs.version || '0.30.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout pycronexpr v${{ env.CRONEXPR_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: CodyRay/pycronexpr
          ref: v${{ env.CRONEXPR_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # scikit-build-core fetches cmake/ninja from PyPI when missing on PATH, and CMake
          # 4+ rejects supertinycron's CPM-fetched cmake_minimum_required(3.5) (gotcha 257).
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            CMAKE_POLICY_VERSION_MINIMUM=3.5
          CIBW_TEST_COMMAND: >-
            python -c "import _ccronexpr as m; assert m.__file__.endswith('.so'), m.__file__" &&
            python -c "import cronexpr, unittest;
            from datetime import datetime, timezone;
            d = datetime(2024, 9, 4, tzinfo=timezone.utc);
            assert cronexpr.next_fire('0 0 21 ? 1/2 TUE#1 *', d) == datetime(2024, 11, 5, 21, 0, tzinfo=timezone.utc);
            assert cronexpr.prev_fire('0 0 21 ? 1/2 TUE#1 *', d) == datetime(2024, 9, 3, 21, 0, tzinfo=timezone.utc);
            unittest.TestCase().assertRaises(ValueError, cronexpr.prev_fire, '* 35 * * *')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cronexpr-${{ env.CRONEXPR_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cronexpr ${{ inputs.version || '0.30.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cronexpr-${{ inputs.version || '0.30.0' }}-*-manylinux_riscv64
