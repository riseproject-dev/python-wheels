---
# Based on: https://github.com/RUrlus/diptest/blob/v0.11.0/.github/workflows/wheels.yml
name: Build diptest wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'diptest version to build (git tag without leading v, e.g. 0.11.0)'
        required: true
        default: '0.11.0'
  pull_request:
    paths:
      - '.github/workflows/build-diptest.yml'
      - 'patches/diptest/**'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.11.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  DIPTEST_VERSION: ${{ inputs.version || '0.11.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build diptest ${{ inputs.version || '0.11.0' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Checkout diptest v${{ env.DIPTEST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: RUrlus/diptest
          ref: v${{ env.DIPTEST_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/diptest/${{ env.DIPTEST_VERSION }}/*.patch

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy,psutil
            CMAKE_ARGS="-DDIPTEST_ENABLE_ARCH_FLAGS=OFF -DDIPTEST_ENABLE_OPENMP=ON"
          # _diptest_core has no Py_mod_gil slot, so cp314t re-enables the GIL at
          # import and warns; diptest's filterwarnings=error turns that into a
          # collection error (gotcha 127). PYTHON_GIL=1 is a no-op on the other legs.
          CIBW_TEST_ENVIRONMENT: PYTHON_GIL=1
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests &&
            python -c "from diptest import _has_openmp_support; assert _has_openmp_support"

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diptest-${{ env.DIPTEST_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  gpl_sources:
    needs: [setup]
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # DIPTEST_ENABLE_OPENMP=ON above links -fopenmp, so auditwheel vendors
      # the image's libgomp into diptest.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diptest-${{ env.DIPTEST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish diptest ${{ inputs.version || '0.11.0' }}
    needs: [setup, build_wheels, gpl_sources]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: diptest-${{ inputs.version || '0.11.0' }}-*-manylinux_riscv64
      gpl-sources-artifact: diptest-${{ inputs.version || '0.11.0' }}-gpl-sources
      gpl-sources-description: gcc
