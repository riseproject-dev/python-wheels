---
# Based on: https://github.com/RUrlus/diptest/blob/v0.11.0/.github/workflows/wheels.yml
name: Build diptest wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/diptest.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-diptest.yml'
      - 'docs/packages/diptest.yaml'
      - 'patches/diptest/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-diptest.yml'
      - 'docs/packages/diptest.yaml'
      - 'patches/diptest/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: diptest
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build diptest ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "diptest"
      version: "${{ matrix.version }}"
      repository: "RUrlus/diptest"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,psutil CMAKE_ARGS=\"-DDIPTEST_ENABLE_ARCH_FLAGS=OFF -DDIPTEST_ENABLE_OPENMP=ON\""
      # _diptest_core has no Py_mod_gil slot, so cp314t re-enables the GIL at
      # import and warns; diptest's filterwarnings=error turns that into a
      # collection error (gotcha 127). PYTHON_GIL=1 is a no-op on the other legs.
      cibw-test-environment: "PYTHON_GIL=1"
      cibw-test-command: "pytest {project}/tests && python -c \"from diptest import _has_openmp_support; assert _has_openmp_support\""

  gpl_sources:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Collect GPL sources
    runs-on: ubuntu-24.04-riscv

    env:
      DIPTEST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # DIPTEST_ENABLE_OPENMP=ON above links -fopenmp, so auditwheel vendors
      # the image's libgomp into diptest.libs/.
      - uses: ./actions/collect-gpl-sources
        with:
          image: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          packages: gcc
          output: gpl-sources.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diptest-${{ env.DIPTEST_VERSION }}-gpl-sources
          path: gpl-sources.tar
          if-no-files-found: error

  publish:
    name: Publish diptest ${{ matrix.version }}
    needs: [setup, build_wheels, gpl_sources]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: diptest-${{ matrix.version }}-*-manylinux_riscv64
      gpl-sources-artifact: diptest-${{ matrix.version }}-gpl-sources
      gpl-sources-description: gcc
