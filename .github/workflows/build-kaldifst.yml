# Based on the `build_wheels_linux` job of
# https://github.com/k2-fsa/kaldifst/blob/v1.8.0/.github/workflows/build-wheels-linux.yaml
# and the test step of
# https://github.com/k2-fsa/kaldifst/blob/v1.8.0/.github/workflows/test-pip-install.yaml
name: Build kaldifst wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kaldifst.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldifst.yml'
      - 'docs/packages/kaldifst.yaml'
      - 'patches/kaldifst/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldifst.yml'
      - 'docs/packages/kaldifst.yaml'
      - 'patches/kaldifst/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kaldifst
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build kaldifst ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "kaldifst"
      version: "${{ matrix.version }}"
      repository: "k2-fsa/kaldifst"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # pybind11 3.0 ignores setup.py's -DPYTHON_EXECUTABLE and picks the wrong python on cp314t.
      cibw-environment-linux: "KALDIFST_CMAKE_ARGS=\"-DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python)\""
      cibw-test-requires: "pytest"
      cibw-test-command: "python -c \"import kaldifst; print(kaldifst.__file__, kaldifst.__version__)\" && python -c \"import importlib.metadata as m; l = sorted(p.name for p in m.files('kaldifst') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.openfst', 'LICENSE.pybind11'], l\" && cd {project}/kaldifst/python/tests && python -m pytest --ignore-glob \"*k2*\" --ignore-glob \"*star*\""

  publish:
    name: Publish kaldifst ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: kaldifst-${{ matrix.version }}-*-manylinux_riscv64
