# Based on the `build_wheels_linux` job of
# https://github.com/k2-fsa/kaldifst/blob/v1.8.0/.github/workflows/build-wheels-linux.yaml
# and the test step of
# https://github.com/k2-fsa/kaldifst/blob/v1.8.0/.github/workflows/test-pip-install.yaml
name: Build kaldifst wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/kaldifst.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldifst.yml'
      - 'docs/packages/kaldifst.yaml'
      - 'patches/kaldifst/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kaldifst.yml'
      - 'docs/packages/kaldifst.yaml'
      - 'patches/kaldifst/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: kaldifst
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build kaldifst ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      KALDIFST_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout kaldifst v${{ env.KALDIFST_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: k2-fsa/kaldifst
          ref: v${{ env.KALDIFST_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Apply patches
        run: git apply python-wheels/patches/kaldifst/${{ env.KALDIFST_VERSION }}/*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # pybind11 3.0 ignores setup.py's -DPYTHON_EXECUTABLE and picks the wrong python on cp314t.
          CIBW_ENVIRONMENT: >-
            KALDIFST_CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(command -v python)"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import kaldifst; print(kaldifst.__file__, kaldifst.__version__)" &&
            python -c "import importlib.metadata as m; l = sorted(p.name for p in m.files('kaldifst') if '.dist-info/licenses/' in str(p)); assert l == ['LICENSE', 'LICENSE.openfst', 'LICENSE.pybind11'], l" &&
            cd {project}/kaldifst/python/tests &&
            python -m pytest --ignore-glob "*k2*" --ignore-glob "*star*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaldifst-${{ env.KALDIFST_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish kaldifst ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: kaldifst-${{ matrix.version }}-*-manylinux_riscv64
