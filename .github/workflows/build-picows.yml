---
# This workflow is based on: https://github.com/tarasko/picows/blob/v2.1.3/.github/workflows/release.yml
name: Build picows wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/picows.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-picows.yml'
      - 'docs/packages/picows.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-picows.yml'
      - 'docs/packages/picows.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: picows
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build picows ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        # uvloop has no musllinux riscv64 wheel on the registry (same situation as
        # build-aiofastnet.yml); skip tests on that leg rather than compile it from sdist.
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: picows
      version: ${{ matrix.version }}
      repository: tarasko/picows
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      cibw-environment-linux: CFLAGS="$CFLAGS -O2 -g0 -DNDEBUG" PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      cibw-test-requires: >-
        pytest pytest-asyncio async_timeout tiny-proxy websockets
        ${{ matrix.platform == 'manylinux' && 'uvloop' || '' }}
      cibw-test-sources: tests pyproject.toml
      cibw-test-skip: ${{ case(matrix.platform == 'musllinux', '*', '') }}
      # test_proxy_dns_resolution dials the real wss://echo.websocket.org; too flaky/
      # network-dependent for this runner (same reasoning as docs/packages/uvloop.yaml's warning).
      cibw-test-command: pytest -v tests -k "not test_proxy_dns_resolution"
      timeout-minutes: 60

  publish:
    name: Publish picows ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: picows-${{ matrix.version }}-*riscv64
