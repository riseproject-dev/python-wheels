---
# This workflow is based on: https://github.com/tarasko/picows/blob/v2.1.3/.github/workflows/release.yml
name: Build picows wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/picows.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-picows.yml'
      - 'docs/packages/picows.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-picows.yml'
      - 'docs/packages/picows.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: picows
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build picows ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.libc }}_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp314t"]
        libc: [manylinux, musllinux]
        include:
          # uvloop has no musllinux riscv64 wheel on the registry (same situation as
          # build-aiofastnet.yml); skip tests on that leg rather than compile it from sdist.
          - libc: musllinux
            test_skip: "*"

    env:
      PICOWS_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout picows v${{ env.PICOWS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tarasko/picows
          ref: v${{ env.PICOWS_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-${{ matrix.libc }}_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_MUSLLINUX_RISCV64_IMAGE: ${{ env.MUSLLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT_LINUX: CFLAGS="$CFLAGS -O2 -g0 -DNDEBUG" PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: >-
            pytest pytest-asyncio async_timeout tiny-proxy websockets
            ${{ matrix.libc == 'manylinux' && 'uvloop' || '' }}
          CIBW_TEST_SOURCES: tests pyproject.toml
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          # test_proxy_dns_resolution dials the real wss://echo.websocket.org; too flaky/
          # network-dependent for this runner (same reasoning as docs/packages/uvloop.yaml's warning).
          CIBW_TEST_COMMAND: pytest -v tests -k "not test_proxy_dns_resolution"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: picows-${{ env.PICOWS_VERSION }}-${{ matrix.python }}-${{ matrix.libc }}_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish picows ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: picows-${{ matrix.version }}-*riscv64
