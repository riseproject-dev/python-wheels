---
# This workflow is based on the `linux` job of
# https://github.com/conda/rattler/blob/py-rattler-v0.25.0/.github/workflows/release-python.yml
name: Build py-rattler wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/py-rattler.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-py-rattler.yml'
      - 'docs/packages/py-rattler.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-py-rattler.yml'
      - 'docs/packages/py-rattler.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  PACKAGE_NAME: py_rattler
  PYTHON_VERSION: '3.12'
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: py-rattler
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build py-rattler ${{ matrix.version }} cp38-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    env:
      PY_RATTLER_VERSION: ${{ matrix.version }}

    steps:
      # py-rattler's own Cargo.toml path-depends on ../crates/*, so the
      # checkout lands at the workspace root (no `path:`), same as
      # build-polars-runtime.yml/build-lancedb.yml for a comparably
      # structured monorepo.
      - name: Checkout rattler py-rattler-v${{ env.PY_RATTLER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: conda/rattler
          ref: py-rattler-v${{ env.PY_RATTLER_VERSION }}
          persist-credentials: false

      - name: Install Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true
          enable-cache: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1

      # Same OOM guard build-polars-runtime.yml/build-lancedb.yml need on
      # these runners for a comparably sized Rust workspace (aws-sdk-s3 pulls
      # in the bulk of this crate's ~650-crate graph).
      - name: Set swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761  # master
        with:
          swap-size-gb: 10

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          working-directory: py-rattler
          target: riscv64gc-unknown-linux-gnu
          manylinux: '2_39'
          args: --release --out dist --no-default-features --features rustls,pty
          before-script-linux: git config --global --add safe.directory "*"

      - name: Test wheel
        run: |
          uv pip install --force-reinstall --verbose py-rattler/dist/${{ env.PACKAGE_NAME }}-*.whl
          python -c "import rattler; print(rattler.__version__)"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: py-rattler-${{ env.PY_RATTLER_VERSION }}-cp38-abi3-manylinux_riscv64
          path: py-rattler/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish py-rattler ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: py-rattler-${{ matrix.version }}-*-manylinux_riscv64
