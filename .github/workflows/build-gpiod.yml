---
name: Build gpiod wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/gpiod.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
      libgpiod_version:
        description: 'libgpiod C library source version to vendor (LIBGPIOD_VERSION)'
        required: true
        default: '2.3'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-gpiod.yml'
      - 'docs/packages/gpiod.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gpiod.yml'
      - 'docs/packages/gpiod.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  LIBGPIOD_VERSION: ${{ inputs.libgpiod_version || '2.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: gpiod
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build gpiod ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # The reusable workflow downloads and extracts the self-contained PyPI sdist.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: gpiod
      version: ${{ matrix.version }}
      # The PyPI sdist contains libgpiod-version.txt, so setup.py retains the bundled headers and library.
      source: pypi-sdist
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-musllinux-riscv64-image: quay.io/pypa/musllinux_1_2_riscv64
      # lib/uapi/gpio.h pulls in the system linux/const.h,linux/ioctl.h,
      # linux/types.h; musllinux's Alpine base needs linux-headers for
      # those, manylinux already has them via glibc-devel.
      cibw-before-all-linux: (command -v apk && apk add linux-headers) || true
      # Upstream's own generate_pypi_artifacts.sh builds wheels with no test
      # step at all: the real test suite needs a gpio-sim kernel module and
      # the separately-built libgpiosim helper library (tests/gpiosim/,
      # tests/system/), neither available in the build container. Exercise
      # the compiled extension and the real chip-open/ioctl error path instead.
      cibw-test-command: |-
        python3 - <<'PYEOF'
        import gpiod
        from gpiod import _ext
        assert _ext.__file__.endswith(".so"), _ext.__file__
        assert gpiod.__version__ == "${{ matrix.version }}", gpiod.__version__
        assert gpiod.api_version == "${{ inputs.libgpiod_version || '2.3' }}", gpiod.api_version
        try:
        gpiod.Chip("/dev/null")
        except OSError:
        pass
        else:
        raise SystemExit("expected OSError for a non-gpiochip device")
        PYEOF
  publish:
    name: Publish gpiod ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: gpiod-${{ matrix.version }}-*riscv64
