---
# This workflow is based on the `linux` job of
# https://github.com/lmmx/comrak/blob/py-0.0.16/.github/workflows/CI.yml
name: Build comrak wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/comrak.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-comrak.yml'
      - 'docs/packages/comrak.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-comrak.yml'
      - 'docs/packages/comrak.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: comrak
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build comrak ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          # pyo3's abi3/abi3t features carry no fixed pyNN floor (Cargo.toml:
          # features = ["abi3", "abi3t", ...]), so pyo3-build-config floors the
          # ABI at whichever interpreter builds it -- cp312 here, this repo's
          # own floor -- rather than a version upstream pinned.
          - tag: cp312-abi3
            # Built on cp312 -- the floor this build chooses -- and re-tested
            # on the newer ones via find_compatible_wheel.
            build: cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "comrak"
      version: "${{ matrix.version }}"
      repository: "lmmx/comrak"
      ref: "py-${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 300
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # comrak ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests pyproject.toml"
      # __init__.py re-exports from the compiled comrak.comrak submodule
      # (gotcha 56); comrak.__file__ alone would point at the pure-Python shim.
      cibw-test-command: >
        python -c "import comrak.comrak as m; assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish comrak ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: comrak-${{ matrix.version }}-*-manylinux_riscv64
