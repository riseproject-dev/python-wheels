---
# This workflow is based on the `build_bdist` job of
# https://github.com/Unidata/cftime/blob/v1.6.5rel/.github/workflows/cibuildwheel.yml
name: Build cftime wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'cftime version to build (e.g. 1.6.5)'
        required: true
        default: '1.6.5'
  pull_request:
    paths:
      - '.github/workflows/build-cftime.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.6.5' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  CFTIME_VERSION: ${{ inputs.version || '1.6.5' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build cftime ${{ inputs.version || '1.6.5' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout cftime ${{ env.CFTIME_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Unidata/cftime
          ref: v${{ env.CFTIME_VERSION }}rel  # upstream tags releases as v<version>rel
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import cftime; print(f'cftime v{cftime.__version__}')" &&
            python -m pytest -vv {package}/test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cftime-${{ env.CFTIME_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cftime ${{ inputs.version || '1.6.5' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: cftime-${{ inputs.version || '1.6.5' }}-*-manylinux_riscv64
