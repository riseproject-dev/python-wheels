---
# This workflow is based on: https://github.com/MarshalX/python-libipld/blob/v3.4.1/.github/workflows/release.yml
name: Build libipld wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/libipld.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-libipld.yml'
      - 'docs/packages/libipld.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-libipld.yml'
      - 'docs/packages/libipld.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: libipld
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build libipld ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "libipld"
      version: "${{ matrix.version }}"
      repository: "MarshalX/python-libipld"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # libipld's own [tool.cibuildwheel] is unset, so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest pytest-benchmark"
      cibw-test-sources: "pytests data pyproject.toml"
      cibw-test-command: "python -m pytest pytests -q"

  publish:
    name: Publish libipld ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: libipld-${{ matrix.version }}-*-manylinux_riscv64
