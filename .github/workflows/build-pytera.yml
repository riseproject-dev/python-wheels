---
# This workflow is based on: https://github.com/PyO3Lab/pytera/blob/v0.1.2/.github/workflows/ci.yml
name: Build pytera wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pytera.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pytera.yml'
      - 'docs/packages/pytera.yaml'
      - 'patches/pytera/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pytera.yml'
      - 'docs/packages/pytera.yaml'
      - 'patches/pytera/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pytera
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pytera ${{ matrix.version }} cp38-abi3-${{ matrix.libc }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        libc: ["manylinux", "musllinux"]

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "pytera"
      version: "${{ matrix.version }}"
      repository: "PyO3Lab/pytera"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp38-abi3-${{ matrix.libc }}_riscv64"

      patches: true

      # cibuildwheel rather than PyO3/maturin-action: on a riscv64 host the
      # action only maps riscv64gc-unknown-linux-gnu (to manylinux_2_39), so
      # the musllinux leg fell back to a host build and died on PEP 668 pip
      # installs; and a musl wheel cannot be tested on the glibc runner
      # anyway. cibuildwheel builds and tests each leg in its own pypa image.
      # pyo3's abi3-py38 feature is on unconditionally (Cargo.toml), so one
      # cp38-abi3 wheel serves every interpreter; built on cp312 (our
      # floor) and re-tested on cp313/cp314 via find_compatible_wheel.
      cibw-build: "cp312-${{ matrix.libc }}_riscv64 cp313-${{ matrix.libc }}_riscv64 cp314-${{ matrix.libc }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      # Run the tests from a staged copy, not the checkout: the root
      # pytest.ini sets `pythonpath = . src`, which puts src/pytera (no
      # compiled _core) ahead of the installed wheel. conftest.py reads
      # templates/ from one level above tests/, so stage it alongside.
      cibw-test-sources: "tests templates"
      cibw-test-command: "python -c \"import pytera._core as m; assert m.__file__.endswith('.so'), m.__file__\" && python -m pytest -v tests"

  publish:
    name: Publish pytera ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pytera-${{ matrix.version }}-*riscv64
