---
# This workflow is based on: https://github.com/Quantco/tabmat/blob/4.2.1/.github/workflows/build-wheels.yml
name: Build tabmat wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/tabmat.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-tabmat.yml'
      - 'docs/packages/tabmat.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tabmat.yml'
      - 'docs/packages/tabmat.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: tabmat
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build tabmat ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: tabmat
      version: ${{ matrix.version }}
      repository: Quantco/tabmat
      ref: ${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      checkout-fetch-depth: 0
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # numpy/scipy are build- and run-time requirements; only our registry has
      # them for riscv64, and only-binary keeps a newer PyPI release from
      # winning resolution and compiling from sdist.
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy"
      timeout-minutes: 120

  publish:
    name: Publish tabmat ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: tabmat-${{ matrix.version }}-*-manylinux_riscv64
