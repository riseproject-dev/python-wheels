---
# This workflow is based on the `build_wheels`/`test_manylinux_3_13` jobs of
# https://github.com/NetHack-LE/nle/blob/v1.3.0/.github/workflows/test_and_deploy.yml
name: Build nle wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nle.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nle.yml'
      - 'docs/packages/nle.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nle.yml'
      - 'docs/packages/nle.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nle
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nle ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Upstream's own [tool.cibuildwheel] build list stops at cp313.
        python: ["cp310", "cp311", "cp312", "cp313"]

    env:
      NLE_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout nle v${{ env.NLE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NetHack-LE/nle
          ref: v${{ env.NLE_VERSION }}
          persist-credentials: false

      - name: Checkout python-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: python-wheels
          persist-credentials: false

      - name: Patch nle source
        run: git apply python-wheels/patches/nle/${{ env.NLE_VERSION }}/00*.patch

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # Upstream's CIBW_BEFORE_ALL uses yum (manylinux2014); our image is Rocky-10-based.
          CIBW_BEFORE_ALL: dnf install -y -q autoconf bison cmake flex git libtool
          CIBW_TEST_REQUIRES: pytest>=6.2.5 memory-profiler>=0.60.0
          CIBW_TEST_SOURCES: nle/tests pyproject.toml
          CIBW_TEST_COMMAND: python -m pytest --import-mode=append nle/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nle-${{ env.NLE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish nle ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: nle-${{ matrix.version }}-*-manylinux_riscv64
