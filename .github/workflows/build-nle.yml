---
# This workflow is based on the `build_wheels`/`test_manylinux_3_13` jobs of
# https://github.com/NetHack-LE/nle/blob/v1.3.0/.github/workflows/test_and_deploy.yml
name: Build nle wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/nle.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-nle.yml'
      - 'docs/packages/nle.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-nle.yml'
      - 'docs/packages/nle.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: nle
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build nle ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "nle"
      version: "${{ matrix.version }}"
      repository: "NetHack-LE/nle"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 180

      patches: true

      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      # Upstream's CIBW_BEFORE_ALL uses yum (manylinux2014); our image is Rocky-10-based.
      cibw-before-all: "dnf install -y -q autoconf bison cmake flex git libtool"
      # The patch leaves the tagged checkout dirty, so setuptools_scm would otherwise
      # name the wheel 1.3.1.dev0+g<sha>.d<date> (gotcha 31).
      cibw-environment-linux: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ matrix.version }}"
      # numpy (runtime dep) and psutil (via memory-profiler) only have riscv64 wheels
      # on our registry; only-binary keeps a newer sdist-only PyPI release from winning.
      # CI=true: upstream's test_profile.py skips its 100-round benchmarks on CI, but
      # still needs the pytest-benchmark fixture (upstream installs nle[all]).
      cibw-test-environment: "PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/ PIP_ONLY_BINARY=numpy,psutil CI=true"
      cibw-test-requires: "pytest>=6.2.5 pytest-benchmark>=3.4.1 memory-profiler>=0.60.0"
      cibw-test-sources: "nle/tests pyproject.toml"
      cibw-test-command: "python -m pytest --import-mode=append nle/tests"

  publish:
    name: Publish nle ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: nle-${{ matrix.version }}-*-manylinux_riscv64
