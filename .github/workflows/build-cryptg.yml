---
# Based on upstream's own wheel builder:
#   https://github.com/cher-nov/cryptg/blob/v0.6.0/.github/workflows/wheels.yml
# cryptg is a PyO3/Rust extension (grammers-crypto) built with setuptools-rust, not
# maturin; no abi3 (RustExtension has no --py-limited-api), so wheels are per-interpreter.
name: Build cryptg wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cryptg.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cryptg.yml'
      - 'docs/packages/cryptg.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cryptg.yml'
      - 'docs/packages/cryptg.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cryptg
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cryptg ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): setuptools-rust is not passed --py-limited-api.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      CRYPTG_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout cryptg v${{ env.CRYPTG_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cher-nov/cryptg
          ref: v${{ env.CRYPTG_VERSION }}
          persist-credentials: false

      # setuptools' default LICEN[CS]E* glob only looks at the project root, so the
      # vendored grammers-crypto/pyo3 licences under LICENSES/ never reach the wheel
      # unless they are named LICENSE.<dep> there too (gotcha 44).
      - name: Stage vendored dependency licences
        run: |
          cp LICENSES/LICENSE.grammers-crypto LICENSE.grammers-crypto
          cp LICENSES/LICENSE.pyo3 LICENSE.pyo3

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No Rust in the manylinux image; install it and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # No upstream test suite; exercise the IGE round trip, factorize_pq_pair, and
          # assert the vendored-licence staging step above actually landed in the wheel.
          CIBW_TEST_COMMAND: >-
            python -c "import cryptg, importlib.metadata, os; key = os.urandom(32); iv
            = os.urandom(32); data = os.urandom(64); assert
            cryptg.decrypt_ige(cryptg.encrypt_ige(data, key, iv), key, iv) == data;
            assert cryptg.factorize_pq_pair(3247) == (17, 191); lic = {p.name for p in
            importlib.metadata.files('cryptg') if '.dist-info/licenses/' in str(p)};
            assert lic == {'LICENSE.txt', 'LICENSE.grammers-crypto', 'LICENSE.pyo3'},
            lic; print('cryptg smoke test OK')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cryptg-${{ env.CRYPTG_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cryptg ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cryptg-${{ matrix.version }}-*-manylinux_riscv64
