---
# This workflow mirrors the `build_wheels` job of upstream's own
# .github/workflows/publish.yml, narrowed to Linux, and runs the tests of its
# .github/workflows/test_linux.yml against the built wheel.
name: Build polyscope wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/polyscope.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-polyscope.yml'
      - 'docs/packages/polyscope.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-polyscope.yml'
      - 'docs/packages/polyscope.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
  MUSLLINUX_RISCV64_IMAGE: quay.io/pypa/musllinux_1_2_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: polyscope
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build polyscope ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "polyscope"
      version: "${{ matrix.version }}"
      repository: "nmwsharp/polyscope-py"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      timeout-minutes: 360
      pre-build: |-
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
            git -c protocol.version=2 submodule update --init --force --depth=1 --recursive && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 30))
        done

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"

        set -euo pipefail
        cp deps/polyscope/LICENSE LICENSE.polyscope
        cp deps/nanobind/LICENSE LICENSE.nanobind
        cp deps/nanobind/ext/robin_map/LICENSE LICENSE.robin-map
        cp deps/eigen/COPYING.MPL2 LICENSE.eigen
        cp deps/polyscope/deps/glfw/LICENSE.md LICENSE.glfw
        cp deps/polyscope/deps/glad/LICENSE LICENSE.glad
        cp deps/polyscope/deps/glm/copying.txt LICENSE.glm
        cp deps/polyscope/deps/happly/LICENSE LICENSE.happly
        cp deps/polyscope/deps/imgui/imgui/LICENSE.txt LICENSE.imgui
        cp deps/polyscope/deps/imgui/implot/LICENSE LICENSE.implot
        cp deps/polyscope/deps/imgui/ImGuizmo/LICENSE LICENSE.imguizmo
        cp deps/polyscope/deps/json/LICENSE.MIT LICENSE.nlohmann-json
        cp deps/polyscope/deps/IconFontCppHeaders/licence.txt LICENSE.iconfontcppheaders

        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-config-file: ".github/workflows/cibuildwheel_config.toml"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-musllinux-riscv64-image: "quay.io/pypa/musllinux_1_2_riscv64"
      # Replaces the config file's environment table, whose CMAKE_ARGS lacks the leading '-'.
      cibw-environment-linux: "CMAKE_ARGS=-DPOLYSCOPE_BACKEND_OPENGL3_EGL=ON SKBUILD_WHEEL_LICENSE_FILES=\"LICENSE*\" PIP_ONLY_BINARY=numpy"
      cibw-test-sources: "test"
      cibw-test-command: "python test/polyscope_test.py -v --backend=openGL_mock && python test/polyscope_test.py -v --backend=openGL3_egl"
      # numpy has no riscv64 musllinux wheel in our registry.
      cibw-test-skip: "*-musllinux*"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      POLYSCOPE_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: polyscope-${{ env.POLYSCOPE_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = [n for n in names if n.startswith("polyscope_bindings.") and n.endswith(".so")]
          assert len(exts) == 1 and "-riscv64-linux-" in exts[0], exts
          licences = {n.split(".dist-info/licenses/", 1)[1] for n in names
                      if ".dist-info/licenses/" in n and not n.endswith("/")}
          expected = {"LICENSE"} | {f"LICENSE.{d}" for d in (
              "polyscope", "nanobind", "robin-map", "eigen", "glfw", "glad", "glm", "happly",
              "imgui", "implot", "imguizmo", "nlohmann-json", "iconfontcppheaders")}
          assert licences == expected, licences
          EOF

  publish:
    name: Publish polyscope ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: polyscope-${{ matrix.version }}-*riscv64
