---
# Upstream ships no wheel workflow; the Python job of
# https://github.com/google/brotli/blob/v1.2.0/.github/workflows/build_test.yml
# is the reference for how the bindings are built and tested.
name: Build brotli wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/brotli.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-brotli.yml'
      - 'docs/packages/brotli.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brotli.yml'
      - 'docs/packages/brotli.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: brotli
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build brotli ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: brotli
      version: ${{ matrix.version }}
      repository: google/brotli
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # tests/ resolves relative to the staged tree, so testdata and the bro.py
      # CLI wrapper the tests spawn have to be staged alongside python/tests.
      cibw-test-sources: python/tests python/bro.py tests/testdata
      # Upstream's `setup.py test`, which modern setuptools no longer provides.
      cibw-test-command: python -m unittest discover -s python -p '*_test.py'
      timeout-minutes: 90

  publish:
    name: Publish brotli ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: brotli-${{ matrix.version }}-*-manylinux_riscv64
