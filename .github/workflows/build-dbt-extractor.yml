---
# This workflow is based on the `linux`/`linux-cross` jobs of
# https://github.com/dbt-labs/dbt-extractor/blob/89d46724fc9c7dcd94a03f58342bc4f0d2b7a82e/.github/workflows/release.yml
name: Build dbt-extractor wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/dbt-extractor.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-dbt-extractor.yml'
      - 'docs/packages/dbt-extractor.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dbt-extractor.yml'
      - 'docs/packages/dbt-extractor.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # Upstream cuts releases without git tags, so pin the release commit: this is
  # "bump patch version, add changelog (#111)", whose tree is byte-identical to
  # the 0.6.0 PyPI sdist. Update it alongside DBT_EXTRACTOR_VERSION.
  DBT_EXTRACTOR_REF: 89d46724fc9c7dcd94a03f58342bc4f0d2b7a82e
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: dbt-extractor
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build dbt-extractor ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "dbt-extractor"
      version: "${{ matrix.version }}"
      repository: "dbt-labs/dbt-extractor"
      ref: "89d46724fc9c7dcd94a03f58342bc4f0d2b7a82e"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 90
      # pyo3 is built with the `abi3-py39` feature, so maturin emits a single
      # cp39-abi3 wheel whatever interpreter builds it - matching the one
      # Linux wheel upstream publishes per arch. cibuildwheel compiles once
      # for cp312 and then reuses that wheel for cp313/cp314 while still
      # running the test phase on each. musllinux is excluded because
      # rustup.rs ships no riscv64 musl toolchain (as in build-fastuuid.yml).
      cibw-build: "cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      # cibuildwheel's default frontend runs `python -m build /project` with
      # cwd=/project, and the repo root holds a dev helper named build.py
      # that shadows the `build` module (it imports tree_sitter at top level,
      # so the run dies before maturin is reached). pip is unaffected.
      cibw-build-frontend: "pip"
      # dbt-extractor ships no [tool.cibuildwheel], so install the Rust
      # toolchain its maturin backend needs in-container and put it on PATH.
      cibw-before-all-linux: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      # Upstream only checks `import dbt_extractor` after building a wheel;
      # extract from a model that exercises all three result kinds instead.
      cibw-test-command: "python -c \"import dbt_extractor; src = '''{{ config(materialized='table', tags=['a','b']) }} select * from {{ ref('other_model') }} join {{ source('my_src','my_tbl') }}'''; r = dbt_extractor.py_extract_from_source(src); assert r['refs'] == [{'name': 'other_model'}], r; assert r['sources'] == {('my_src','my_tbl')}, r; assert r['configs'] == [('materialized','table'), ('tags',['a','b'])], r; print('dbt_extractor OK:', r)\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      DBT_EXTRACTOR_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dbt-extractor-${{ env.DBT_EXTRACTOR_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the extension made it into the wheel
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert "dbt_extractor/dbt_extractor.abi3.so" in names, names
              assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), names
              print(whl, "ok")
          EOF

  publish:
    name: Publish dbt-extractor ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: dbt-extractor-${{ matrix.version }}-*-manylinux_riscv64
