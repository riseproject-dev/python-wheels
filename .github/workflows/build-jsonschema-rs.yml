---
# This workflow is based on the `linux` job of
# https://github.com/Stranger6667/jsonschema/blob/python-v0.52.0/.github/workflows/python-release.yml
name: Build jsonschema-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'jsonschema-rs version to build (git tag without the python-v prefix, e.g. 0.52.0)'
        required: true
        default: '0.52.0'
  pull_request:
    paths:
      - '.github/workflows/build-jsonschema-rs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.52.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.52.0 there.
  JSONSCHEMA_RS_VERSION: ${{ inputs.version || '0.52.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build jsonschema-rs ${{ inputs.version || '0.52.0' }} ${{ matrix.tag }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    steps:
      - name: Checkout jsonschema python-v${{ env.JSONSCHEMA_RS_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Stranger6667/jsonschema
          ref: python-v${{ env.JSONSCHEMA_RS_VERSION }}
          submodules: true
          persist-credentials: false

      - name: Stage the licence beside jsonschema-py's pyproject.toml
        # maturin globs LICEN[CS]E* relative to the pyproject directory, which
        # in this monorepo is crates/jsonschema-py/ -- so upstream's published
        # wheels carry no licence text at all.
        run: cp LICENSE crates/jsonschema-py/LICENSE

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          package-dir: crates/jsonschema-py
          output-dir: wheelhouse/
        env:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # jsonschema-py ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: PATH="$PATH:$HOME/.cargo/bin"
          CIBW_TEST_REQUIRES: pytest hypothesis flask
          CIBW_TEST_SOURCES: >-
            crates/jsonschema-py/tests-py crates/jsonschema-py/pyproject.toml
            crates/jsonschema-py/README.md crates/jsonschema/tests/suite
          # test_http_fetch_external_schema needs a live json-schema.org
          # endpoint; every other test is self-contained.
          CIBW_TEST_COMMAND: >-
            cd crates/jsonschema-py &&
            python -c "import jsonschema_rs.jsonschema_rs as m, importlib.metadata as md;
            assert m.__file__.endswith('.so'), m.__file__;
            assert any(str(p).endswith('licenses/LICENSE') for p in md.files('jsonschema_rs'))" &&
            python -m pytest -v tests-py --deselect tests-py/test_http_options.py::test_http_fetch_external_schema

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jsonschema_rs-${{ env.JSONSCHEMA_RS_VERSION }}-${{ matrix.tag }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish jsonschema-rs ${{ inputs.version || '0.52.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: jsonschema_rs-${{ inputs.version || '0.52.0' }}-*-manylinux_riscv64
