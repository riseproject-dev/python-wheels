---
# This workflow is based on the `linux` job of
# https://github.com/Stranger6667/jsonschema/blob/python-v0.52.0/.github/workflows/python-release.yml
name: Build jsonschema-rs wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/jsonschema-rs.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonschema-rs.yml'
      - 'docs/packages/jsonschema-rs.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jsonschema-rs.yml'
      - 'docs/packages/jsonschema-rs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: jsonschema-rs
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build jsonschema-rs ${{ matrix.version }} ${{ matrix.tag }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        tag: [cp310-abi3, cp314t]
        include:
          # pyo3's abi3-py310 feature is on unconditionally, so one abi3 wheel
          # serves every GIL-ful interpreter; pyo3 disables abi3 under
          # Py_GIL_DISABLED, giving the free-threaded build its own wheel.
          - tag: cp310-abi3
            # Built on cp310 -- the oldest interpreter the abi3 tag claims --
            # and re-tested on the newer ones via find_compatible_wheel.
            build: >-
              cp310-manylinux_riscv64 cp311-manylinux_riscv64
              cp312-manylinux_riscv64 cp313-manylinux_riscv64
              cp314-manylinux_riscv64
          - tag: cp314t
            build: cp314t-manylinux_riscv64

    # maturin globs LICEN[CS]E* relative to the pyproject directory, which
    # in this monorepo is crates/jsonschema-py/ -- so upstream's published
    # wheels carry no licence text at all.
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "jsonschema_rs"
      version: "${{ matrix.version }}"
      repository: "Stranger6667/jsonschema"
      ref: "python-v${{ matrix.version }}"
      artifact-tag: "${{ matrix.tag }}-manylinux_riscv64"
      timeout-minutes: 360
      checkout-submodules: "true"
      pre-build: "cp LICENSE crates/jsonschema-py/LICENSE"
      cibw-package-dir: "crates/jsonschema-py"
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.build }}"
      # jsonschema-py ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: PATH="$PATH:$HOME/.cargo/bin"
      cibw-test-requires: "pytest hypothesis flask"
      cibw-before-test: "pip install {project}/crates/jsonschema-testsuite-pyo3"
      cibw-test-sources: >
        crates/jsonschema-py/tests-py crates/jsonschema-py/pyproject.toml
        crates/jsonschema-py/README.md crates/jsonschema/tests/suite
      # test_http_fetch_external_schema needs a live json-schema.org
      # endpoint; every other test is self-contained.
      cibw-test-command: >
        cd crates/jsonschema-py &&
        python -c "import jsonschema_rs.jsonschema_rs as m, importlib.metadata as md;
        assert m.__file__.endswith('.so'), m.__file__;
        assert any(str(p).endswith('licenses/LICENSE') for p in md.files('jsonschema_rs'))" &&
        python -m pytest -v tests-py --deselect tests-py/test_http_options.py::test_http_fetch_external_schema

  publish:
    name: Publish jsonschema-rs ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: jsonschema_rs-${{ matrix.version }}-*-manylinux_riscv64
