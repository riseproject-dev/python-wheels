---
# This workflow is based on the Linux jobs of
# https://github.com/akoumjian/datefinder/blob/v1.0.0/.github/workflows/python-build-artifacts.yml
name: Build datefinder wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'datefinder version to build (git tag without leading v, e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  pull_request:
    paths:
      - '.github/workflows/build-datefinder.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '1.0.0' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 1.0.0 there.
  DATEFINDER_VERSION: ${{ inputs.version || '1.0.0' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build datefinder ${{ inputs.version || '1.0.0' }} cp39-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360

    steps:
      - name: Checkout datefinder v${{ env.DATEFINDER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: akoumjian/datefinder
          ref: v${{ env.DATEFINDER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          # The kernel crate enables pyo3's `abi3-py39`, so one wheel covers
          # every interpreter; it is built on cp312 and re-tested on the newer
          # ones via find_compatible_wheel. cp314t is dropped: pyo3 0.22 predates
          # free-threading support and upstream publishes no cp3XXt wheel.
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          CIBW_BUILD: >-
            cp312-manylinux_riscv64 cp313-manylinux_riscv64
            cp314-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # datefinder ships no [tool.cibuildwheel], so the Rust toolchain its
          # maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: datefinder-${{ env.DATEFINDER_VERSION }}-cp39-abi3-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish datefinder ${{ inputs.version || '1.0.0' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish_wheel.yml
    with:
      artifact-pattern: datefinder-${{ inputs.version || '1.0.0' }}-*-manylinux_riscv64
