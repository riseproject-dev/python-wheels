---
# This workflow is based on the Linux jobs of
# https://github.com/akoumjian/datefinder/blob/v1.0.0/.github/workflows/python-build-artifacts.yml
name: Build datefinder wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/datefinder.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-datefinder.yml'
      - 'docs/packages/datefinder.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-datefinder.yml'
      - 'docs/packages/datefinder.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: datefinder
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build datefinder ${{ matrix.version }} cp39-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "datefinder"
      version: "${{ matrix.version }}"
      repository: "akoumjian/datefinder"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp39-abi3-manylinux_riscv64"
      timeout-minutes: 360
      # The kernel crate enables pyo3's `abi3-py39`, so one wheel covers
      # every interpreter; it is built on cp312 and re-tested on the newer
      # ones via find_compatible_wheel. cp314t is dropped: pyo3 0.22 predates
      # free-threading support and upstream publishes no cp3XXt wheel.
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: >
        cp312-manylinux_riscv64 cp313-manylinux_riscv64
        cp314-manylinux_riscv64
      # datefinder ships no [tool.cibuildwheel], so the Rust toolchain its
      # maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-requires: "pytest"
      cibw-test-sources: "tests"
      cibw-test-command: "python -m pytest -v tests"

  publish:
    name: Publish datefinder ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: datefinder-${{ matrix.version }}-*-manylinux_riscv64
