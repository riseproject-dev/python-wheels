---
# This workflow is based on the `build` job of
# https://github.com/dimastbk/python-calamine/blob/v0.8.2/.github/workflows/CI.yml
name: Build python-calamine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'python-calamine version to build (git tag, e.g. 0.8.2)'
        required: true
        default: '0.8.2'
  pull_request:
    paths:
      - '.github/workflows/build-python-calamine.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.8.2' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.8.2 there.
  PYTHON_CALAMINE_VERSION: ${{ inputs.version || '0.8.2' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build python-calamine ${{ inputs.version || '0.8.2' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: cp312
            pandas: 'pandas[excel]>=2.2'
          - python: cp313
            pandas: 'pandas[excel]>=2.2'
          - python: cp314
            pandas: 'pandas[excel]>=2.2'
          # no riscv64 pandas wheel on cp314t yet; the rest of the suite still runs.
          - python: cp314t
            pandas: ''

    steps:
      - name: Checkout python-calamine v${{ env.PYTHON_CALAMINE_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dimastbk/python-calamine
          ref: v${{ env.PYTHON_CALAMINE_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
          only: ${{ matrix.python }}-manylinux_riscv64
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # python-calamine ships no [tool.cibuildwheel], so the Rust toolchain
          # its maturin backend needs is installed in-container here.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: >-
            PATH="$PATH:$HOME/.cargo/bin"
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          CIBW_TEST_ENVIRONMENT: PIP_ONLY_BINARY=pandas,numpy
          CIBW_TEST_REQUIRES: pytest~=9.0 ${{ matrix.pandas }}
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >-
            python -c "import python_calamine._python_calamine as m;
            assert m.__file__.endswith('.so'), m.__file__" &&
            python -m pytest -v tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-calamine-${{ env.PYTHON_CALAMINE_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish python-calamine ${{ inputs.version || '0.8.2' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: python-calamine-${{ inputs.version || '0.8.2' }}-*-manylinux_riscv64
