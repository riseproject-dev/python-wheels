---
# This workflow is based on the `build` job of
# https://github.com/dimastbk/python-calamine/blob/v0.8.2/.github/workflows/CI.yml
name: Build python-calamine wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/python-calamine.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-python-calamine.yml'
      - 'docs/packages/python-calamine.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-python-calamine.yml'
      - 'docs/packages/python-calamine.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: python-calamine
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build python-calamine ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        include:
          - python: cp312
            pandas: 'pandas[excel]>=2.2'
          - python: cp313
            pandas: 'pandas[excel]>=2.2'
          - python: cp314
            pandas: 'pandas[excel]>=2.2'
          # no riscv64 pandas wheel on cp314t yet; the rest of the suite still runs.
          - python: cp314t
            pandas: ''

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "python-calamine"
      version: "${{ matrix.version }}"
      repository: "dimastbk/python-calamine"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-manylinux_riscv64"
      timeout-minutes: 360
      # musllinux is dropped: rustup.rs ships no riscv64 musl toolchain.
      cibw-build: "${{ matrix.python }}-manylinux_riscv64"
      # python-calamine ships no [tool.cibuildwheel], so the Rust toolchain
      # its maturin backend needs is installed in-container here.
      cibw-before-all-linux: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: "PATH=\"$PATH:$HOME/.cargo/bin\""
      cibw-test-environment: "PIP_ONLY_BINARY=pandas,numpy"
      cibw-test-requires: "pytest~=9.0 ${{ matrix.pandas }}"
      cibw-test-sources: "tests"
      cibw-test-command: >
        python -c "import python_calamine._python_calamine as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        python -m pytest -v tests

  publish:
    name: Publish python-calamine ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: python-calamine-${{ matrix.version }}-*-manylinux_riscv64
