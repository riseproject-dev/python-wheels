---
# This workflow is based on the `build_aarch64_wheels` job of:
# https://github.com/fonttools/skia-pathops/blob/v0.9.2/.github/workflows/ci.yml
# and the `build-linux` job of the skia-builder submodule it pins (which produces the
# prebuilt libskia that job downloads):
# https://github.com/fonttools/skia-builder/blob/501d7a3e80dd57900d0ab42ddb0f6c08f3665d26/.github/workflows/ci.yml
name: Build skia-pathops wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/skia-pathops.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-skia-pathops.yml'
      - 'docs/packages/skia-pathops.yaml'
      - 'patches/skia-pathops/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skia-pathops.yml'
      - 'docs/packages/skia-pathops.yaml'
      - 'patches/skia-pathops/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  GN_REVISION: b2afae122eeb6ce09c52d63f67dc53fc517dbdc8
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: skia-pathops
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build skia-pathops ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "skia-pathops"
      version: "${{ matrix.version }}"
      repository: "fonttools/skia-pathops"
      ref: "v${{ matrix.version }}"
      artifact-tag: "cp310-abi3-manylinux_riscv64"
      timeout-minutes: 360
      checkout-submodules: "recursive"
      pre-build: |-
        rm -rf "python-wheels"
        git init -q "python-wheels"
        git -C "python-wheels" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
        git -C "python-wheels" fetch -q --no-tags --depth=1 origin "${{ github.sha }}"
        git -C "python-wheels" checkout -q --detach FETCH_HEAD

        git apply python-wheels/patches/skia-pathops/${{ matrix.version }}/*.patch
        while IFS='=' read -r pw_key pw_value; do
          [[ $pw_key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
          printf -v "$pw_key" '%s' "$pw_value"
          export "$pw_key"
        done < "$GITHUB_ENV"
      cibw-build: "cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64 cp313-manylinux_riscv64 cp314-manylinux_riscv64"
      cibw-environment-linux: "BUILD_SKIA_FROM_SOURCE=0 SKIA_LIBRARY_DIR=build/download SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SKIA_PATHOPS=${{ matrix.version }}"
      # skia-builder publishes no riscv64 libskia and Skia's bin/fetch-gn has no
      # riscv64 CIPD gn, so build gn from source at fetch-gn's pinned revision
      # and run skia-builder's build_skia.py in-container to fill build/download.
      cibw-before-all-linux: |-
        set -e
        dnf -y install libstdc++-static
        python3 -m pip install ninja
        git clone https://gn.googlesource.com/gn /tmp/gn
        git -C /tmp/gn checkout b2afae122eeb6ce09c52d63f67dc53fc517dbdc8
        (cd /tmp/gn && CXX=g++ python3 build/gen.py --allow-warnings && ninja -C out gn)
        install -m 0755 /tmp/gn/out/gn src/cpp/skia-builder/skia/bin/gn
        python3 src/cpp/skia-builder/build_skia.py --no-sync-deps --no-fetch-gn build/download
      cibw-test-extras: "testing"
      cibw-test-command: "pytest {project}/tests"
      cibw-repair-wheel-command-linux: "auditwheel repair -w {dest_dir} {wheel}"

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    env:
      SKIA_PATHOPS_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: skia-pathops-${{ env.SKIA_PATHOPS_VERSION }}-cp310-abi3-manylinux_riscv64
          path: wheelhouse

      - name: Check the wheel ships both licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              licences = {n.split(".dist-info/licenses/", 1)[1]
                          for n in names
                          if ".dist-info/licenses/" in n and not n.endswith("/")}
              assert licences == {"LICENSE", "src/cpp/skia-builder/skia/LICENSE"}, (whl, licences)
              print(whl, "ok")
          EOF

  publish:
    name: Publish skia-pathops ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: skia-pathops-${{ matrix.version }}-cp310-abi3-manylinux_riscv64
