---
# passagemath-objects is split from the passagemath/passagemath monorepo
# (a SageMath fork). Build from the split distribution's published sdist
# rather than the complete Sage distribution's configure and build chain.
name: Build passagemath-objects wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/passagemath-objects.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-objects.yml'
      - 'docs/packages/passagemath-objects.yaml'
      - 'patches/passagemath-objects/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-passagemath-objects.yml'
      - 'docs/packages/passagemath-objects.yaml'
      - 'patches/passagemath-objects/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: passagemath-objects
      version: ${{ inputs.version }}

  linux:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build passagemath-objects ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    # gmp/mpfr/mpc satisfy Sage's own spkg-configure.m4 minimum-version
    # checks, so the system -devel packages are enough; no from-source
    # build needed (unlike gmpy2, which vendors its own copies).
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: passagemath-objects
      version: ${{ matrix.version }}
      source: pypi-sdist
      patches: true
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-before-all-linux: dnf install -y gmp-devel mpfr-devel libmpc-devel
  publish:
    name: Publish passagemath-objects ${{ matrix.version }}
    needs: [setup, linux]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: passagemath-objects-${{ matrix.version }}-*-manylinux_riscv64
