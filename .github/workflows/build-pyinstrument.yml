---
# Based on the `build_wheels` job of
# https://github.com/joerick/pyinstrument/blob/v5.1.3/.github/workflows/wheels.yml
name: Build pyinstrument wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyinstrument.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument.yml'
      - 'docs/packages/pyinstrument.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument.yml'
      - 'docs/packages/pyinstrument.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyinstrument
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyinstrument ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: pyinstrument
      version: ${{ matrix.version }}
      repository: joerick/pyinstrument
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # cffi and psutil have no riscv64 wheel on public PyPI.
      cibw-environment: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
      # stat_profile declares no free-threading support, so 3.14t re-enables the
      # GIL on import and warns; test_cmdline compares subprocess stderr exactly.
      cibw-test-environment: PYTHON_GIL=1
      # setup.cfg carries the pytest testpaths.
      cibw-test-sources: test setup.cfg
      cibw-test-extras: test
      cibw-test-command: >-
        python -c "import pyinstrument.low_level.stat_profile as m;
        assert m.__file__.endswith('.so'), m.__file__" &&
        pytest
      timeout-minutes: 60

  publish:
    name: Publish pyinstrument ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: pyinstrument-${{ matrix.version }}-*-manylinux_riscv64
