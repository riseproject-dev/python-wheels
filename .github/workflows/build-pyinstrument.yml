---
# Based on the `build_wheels` job of
# https://github.com/joerick/pyinstrument/blob/v5.1.3/.github/workflows/wheels.yml
name: Build pyinstrument wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'pyinstrument version to build (git tag without leading v, e.g. 5.1.3)'
        required: true
        default: '5.1.3'
  # pull_request:
  #   paths:
  #    - '.github/workflows/build-pyinstrument.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '5.1.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write  # publish job pushes the docs branch
  pull-requests: write  # publish job opens the docs PR
  statuses: write  # set-commit-status posts build status to the PR
  actions: read  # set-commit-status reads this run's job conclusions

env:
  PYINSTRUMENT_VERSION: ${{ inputs.version || '5.1.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  # musllinux is dropped: the test extras need cffi and psutil, which our registry
  # ships for manylinux only.
  build_wheels:
    name: Build pyinstrument ${{ inputs.version || '5.1.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["cp312", "cp313", "cp314", "cp314t"]

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Checkout pyinstrument v${{ env.PYINSTRUMENT_VERSION }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: joerick/pyinstrument
          ref: v${{ env.PYINSTRUMENT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi and psutil have no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # stat_profile declares no free-threading support, so 3.14t re-enables the
          # GIL on import and warns; test_cmdline compares subprocess stderr exactly.
          CIBW_TEST_ENVIRONMENT: PYTHON_GIL=1
          # setup.cfg carries the pytest testpaths.
          CIBW_TEST_SOURCES: test setup.cfg
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: >-
            python -c "import pyinstrument.low_level.stat_profile as m;
            assert m.__file__.endswith('.so'), m.__file__" &&
            pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyinstrument-${{ env.PYINSTRUMENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyinstrument ${{ inputs.version || '5.1.3' }} to GitLab
    needs: [build_wheels]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to the PR
        uses: riseproject-dev/python-wheels/actions/set-commit-status@main
        with:
          context: "${{ github.workflow }} / ${{ github.job }}${{ strategy.job-index && format(' / {0}', strategy.job-index) || '' }}"
      - name: Publish wheels and open docs PR
        uses: riseproject-dev/python-wheels/actions/publish-wheels@main
        with:
          artifact-pattern: pyinstrument-${{ env.PYINSTRUMENT_VERSION }}-*-manylinux_riscv64
          gitlab-username: ${{ vars.GITLAB_DEPLOY_USER }}
          gitlab-token: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
