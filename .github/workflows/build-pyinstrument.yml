---
# Based on the `build_wheels` job of
# https://github.com/joerick/pyinstrument/blob/v5.1.3/.github/workflows/wheels.yml
name: Build pyinstrument wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyinstrument.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument.yml'
      - 'docs/packages/pyinstrument.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyinstrument.yml'
      - 'docs/packages/pyinstrument.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyinstrument
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build pyinstrument ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python: ["cp312", "cp313", "cp314", "cp314t"]

    env:
      PYINSTRUMENT_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyinstrument v${{ env.PYINSTRUMENT_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: joerick/pyinstrument
          ref: v${{ env.PYINSTRUMENT_VERSION }}
          persist-credentials: false

      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        env:
          CIBW_ARCHS: riscv64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_riscv64
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # cffi and psutil have no riscv64 wheel on public PyPI.
          CIBW_ENVIRONMENT: PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
          # stat_profile declares no free-threading support, so 3.14t re-enables the
          # GIL on import and warns; test_cmdline compares subprocess stderr exactly.
          CIBW_TEST_ENVIRONMENT: PYTHON_GIL=1
          # setup.cfg carries the pytest testpaths.
          CIBW_TEST_SOURCES: test setup.cfg
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: >-
            python -c "import pyinstrument.low_level.stat_profile as m;
            assert m.__file__.endswith('.so'), m.__file__" &&
            pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyinstrument-${{ env.PYINSTRUMENT_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyinstrument ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: pyinstrument-${{ matrix.version }}-*-manylinux_riscv64
