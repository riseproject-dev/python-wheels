---
# This workflow is based on the `build` job of
# https://github.com/prody/ProDy/blob/v2.6.1/.github/workflows/main.yml
name: Build prody wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/prody.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-prody.yml'
      - 'docs/packages/prody.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-prody.yml'
      - 'docs/packages/prody.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: prody
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build prody ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: "prody"
      version: "${{ matrix.version }}"
      repository: "prody/ProDy"
      ref: "v${{ matrix.version }}"
      artifact-tag: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-build: "${{ matrix.python }}-${{ matrix.platform }}_riscv64"
      cibw-environment-linux: "PIP_ONLY_BINARY=numpy,scipy,biopython"
      # pyproject.toml pins build-system.requires to setuptools<69/numpy<2.0,
      # neither published for riscv64; --no-build-isolation skips that check
      # and setup.py's own `import numpy` is satisfied by the preinstall.
      # --no-build-isolation also means pip never installs build-system.requires
      # itself (gotcha 23/76 shape), so setuptools/wheel must be preinstalled
      # too, or `setuptools.build_meta` isn't importable at all (BackendUnavailable).
      cibw-build-frontend: "pip; args: --no-build-isolation"
      # hpb_Python*/hpb.so are x86_64-only prebuilts MANIFEST.in vendors into
      # every wheel; dropping them leaves prody's own fallback (calcSASA() and
      # calcHydrophobicOverlapingAreas() raise ImportError) instead of shipping
      # binaries that can't load on this arch.
      cibw-before-build: "pip install setuptools wheel numpy && rm -f prody/proteins/hpbmodule/hpb_Python*/hpb.so"
      cibw-test-command: "python -c \"import importlib; [importlib.import_module(m) for m in ('prody.dynamics.rtbtools', 'prody.dynamics.smtools', 'prody.kdtree._CKDTree', 'prody.proteins.ccealign', 'prody.sequence.msaio', 'prody.sequence.msatools', 'prody.sequence.seqtools')]\""

  verify_wheels:
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      PRODY_VERSION: ${{ matrix.version }}
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: prody-${{ env.PRODY_VERSION }}-${{ matrix.python }}-${{ matrix.platform }}_riscv64
          path: wheelhouse

      - name: Check the wheel ships the licence and the compiled extensions
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          exts = {n.rsplit("/", 1)[-1].split(".")[0] for n in names if n.endswith(".so")}
          expected = {
              "rtbtools", "smtools", "_CKDTree", "ccealign", "msaio", "msatools", "seqtools",
          }
          assert exts == expected, exts
          # gotcha 349: cibuildwheel's Linux build adds a bare dist-info/licenses/
          # directory entry (name ending in "/") that a naive rsplit("/", 1)[-1]
          # scan turns into an extra "" alongside the real file; exclude it.
          licences = {
              n.rsplit("/", 1)[-1] for n in names
              if ".dist-info/licenses/" in n and not n.endswith("/")
          }
          assert licences == {"LICENSE.rst"}, licences
          EOF

  publish:
    name: Publish prody ${{ matrix.version }}
    needs: [setup, build_wheels, verify_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: prody-${{ matrix.version }}-*-manylinux_riscv64
