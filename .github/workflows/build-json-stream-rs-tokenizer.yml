---
# This workflow is based on: https://github.com/smheidrich/py-json-stream-rs-tokenizer/blob/v0.5.3/.github/workflows/build.yml
name: Build json-stream-rs-tokenizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/json-stream-rs-tokenizer.yaml not released yet'
        required: false
        default: ''
      cancel-in-progress:
        description: Cancel an in-progress run in the same concurrency group.
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-json-stream-rs-tokenizer.yml'
      - 'docs/packages/json-stream-rs-tokenizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-json-stream-rs-tokenizer.yml'
      - 'docs/packages/json-stream-rs-tokenizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ case(github.event_name == 'pull_request', true, github.event_name == 'workflow_dispatch', inputs['cancel-in-progress'], false) }}

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: json-stream-rs-tokenizer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build json-stream-rs-tokenizer ${{ matrix.version }} ${{ matrix.python }}-${{ matrix.platform }}_riscv64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: $/.github/workflows/_build-cibuildwheel.yml
    with:
      package: json-stream-rs-tokenizer
      version: ${{ matrix.version }}
      repository: smheidrich/py-json-stream-rs-tokenizer
      ref: v${{ matrix.version }}
      artifact-tag: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      cibw-build: ${{ matrix.python }}-${{ matrix.platform }}_riscv64
      # No Rust in the manylinux image; install it and put cargo on PATH.
      cibw-before-all-linux: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      cibw-environment-linux: 'PATH="$PATH:$HOME/.cargo/bin"'
      # Upstream's `test` extra (pytest + json-stream + the benchmark extra
      # it re-exercises); `stubtest` is a dev-only mypy check, not a wheel
      # test, so it's skipped. All of it is pure-Python wheels/sdists on
      # public PyPI, so no registry plumbing is needed.
      cibw-test-extras: test
      # tests/__init__.py makes the suite a package, so pytest's rootdir
      # walk-up would otherwise land on the checkout root and shadow the
      # installed wheel with the uncompiled source tree (gotcha 25);
      # test-sources stages only tests/ into an empty cwd to avoid that.
      cibw-test-sources: tests
      cibw-test-command: pytest tests
      timeout-minutes: 90

  publish:
    name: Publish json-stream-rs-tokenizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      matrix: ${{ needs.setup.outputs.matrix }}
      artifact-pattern: json-stream-rs-tokenizer-${{ matrix.version }}-*-manylinux_riscv64
