---
# This workflow is based on: https://github.com/smheidrich/py-json-stream-rs-tokenizer/blob/v0.5.3/.github/workflows/build.yml
name: Build json-stream-rs-tokenizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/json-stream-rs-tokenizer.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-json-stream-rs-tokenizer.yml'
      - 'docs/packages/json-stream-rs-tokenizer.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-json-stream-rs-tokenizer.yml'
      - 'docs/packages/json-stream-rs-tokenizer.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: json-stream-rs-tokenizer
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build json-stream-rs-tokenizer ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        # Per-interpreter (not abi3): setup.py sets py_limited_api=False.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      JSON_STREAM_RS_TOKENIZER_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout json-stream-rs-tokenizer v${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: smheidrich/py-json-stream-rs-tokenizer
          ref: v${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No Rust in the manylinux image; install it and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # Upstream's `test` extra (pytest + json-stream + the benchmark extra
          # it re-exercises); `stubtest` is a dev-only mypy check, not a wheel
          # test, so it's skipped. All of it is pure-Python wheels/sdists on
          # public PyPI, so no registry plumbing is needed.
          CIBW_TEST_EXTRAS: test
          # tests/__init__.py makes the suite a package, so pytest's rootdir
          # walk-up would otherwise land on the checkout root and shadow the
          # installed wheel with the uncompiled source tree (gotcha 25);
          # test-sources stages only tests/ into an empty cwd to avoid that.
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: json-stream-rs-tokenizer-${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish json-stream-rs-tokenizer ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: json-stream-rs-tokenizer-${{ matrix.version }}-*-manylinux_riscv64
