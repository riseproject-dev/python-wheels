---
# This workflow is based on: https://github.com/smheidrich/py-json-stream-rs-tokenizer/blob/v0.5.3/.github/workflows/build.yml
name: Build json-stream-rs-tokenizer wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'json-stream-rs-tokenizer version to build (git tag without leading v, e.g. 0.5.3)'
        required: true
        default: '0.5.3'
  pull_request:
    paths:
      - '.github/workflows/build-json-stream-rs-tokenizer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || '0.5.3' }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  # `inputs.version` is empty on pull_request events; default to 0.5.3 there.
  JSON_STREAM_RS_TOKENIZER_VERSION: ${{ inputs.version || '0.5.3' }}
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml

  build_wheels:
    needs: [setup]
    name: Build json-stream-rs-tokenizer ${{ inputs.version || '0.5.3' }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Per-interpreter (not abi3): setup.py sets py_limited_api=False.
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    steps:
      - name: Checkout json-stream-rs-tokenizer v${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: smheidrich/py-json-stream-rs-tokenizer
          ref: v${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # No Rust in the manylinux image; install it and put cargo on PATH.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          # Upstream's `test` extra (pytest + json-stream + the benchmark extra
          # it re-exercises); `stubtest` is a dev-only mypy check, not a wheel
          # test, so it's skipped. All of it is pure-Python wheels/sdists on
          # public PyPI, so no registry plumbing is needed.
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_COMMAND: pytest {package}/tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: json-stream-rs-tokenizer-${{ env.JSON_STREAM_RS_TOKENIZER_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish json-stream-rs-tokenizer ${{ inputs.version || '0.5.3' }}
    needs: [setup, build_wheels]
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    with:
      artifact-pattern: json-stream-rs-tokenizer-${{ inputs.version || '0.5.3' }}-*-manylinux_riscv64
