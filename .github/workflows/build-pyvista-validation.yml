---
# Based on upstream's own wheel-building job:
#   https://github.com/pyvista/pyvista-validation/blob/v0.5.4/.github/workflows/ci.yml
name: Build pyvista-validation wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/pyvista-validation.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-validation.yml'
      - 'docs/packages/pyvista-validation.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pyvista-validation.yml'
      - 'docs/packages/pyvista-validation.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read  # to fetch code (actions/checkout)

env:
  MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: pyvista-validation
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    name: Build pyvista-validation ${{ matrix.version }} cp310-abi3-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120

    env:
      PYVISTA_VALIDATION_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout pyvista-validation v${{ env.PYVISTA_VALIDATION_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: pyvista/pyvista-validation
          ref: v${{ env.PYVISTA_VALIDATION_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: ${{ env.MANYLINUX_RISCV64_IMAGE }}
          # One cp310-abi3 wheel built on its floor, then re-tested on the newer
          # interpreters via find_compatible_wheel (upstream re-runs the suite on 3.14).
          CIBW_BUILD: >-
            cp310-manylinux_riscv64 cp311-manylinux_riscv64 cp312-manylinux_riscv64
            cp313-manylinux_riscv64 cp314-manylinux_riscv64
          # numpy is a build and runtime requirement that only our registry ships for riscv64.
          CIBW_ENVIRONMENT: >-
            PIP_EXTRA_INDEX_URL=https://pypi.riseproject.dev/simple/
            PIP_ONLY_BINARY=numpy
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYVISTA_VALIDATION=${{ env.PYVISTA_VALIDATION_VERSION }}

      - name: Check wheel contents
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          path = sys.argv[1]
          assert len(sys.argv) == 2, sys.argv[1:]
          assert "-cp310-abi3-" in path, path
          names = zipfile.ZipFile(path).namelist()
          assert "pyvista_validation/_fast.abi3.so" in names, names
          EOF

      - name: Store wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pyvista-validation-${{ env.PYVISTA_VALIDATION_VERSION }}-cp310-abi3-manylinux_riscv64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish pyvista-validation ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: pyvista-validation-${{ matrix.version }}-*-manylinux_riscv64
