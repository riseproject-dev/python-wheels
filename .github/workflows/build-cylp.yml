---
# This workflow is based on: https://github.com/coin-or/CyLP/blob/v0.94.0/.github/workflows/cibuildwheel.yml
# and the [tool.cibuildwheel] table of its pyproject.toml, whose before-all builds Cbc with coinbrew.
name: Build cylp wheels (riscv64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version glob to (re)build; empty builds every version of docs/packages/cylp.yaml not released yet'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-cylp.yml'
      - 'docs/packages/cylp.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-cylp.yml'
      - 'docs/packages/cylp.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    uses: $/.github/workflows/_setup.yml
    with:
      package: cylp
      version: ${{ inputs.version }}

  build_wheels:
    needs: [setup]
    if: needs.setup.outputs.versions != '[]'
    name: Build cylp ${{ matrix.version }} ${{ matrix.python }}-manylinux_riscv64
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
        python:
          - "cp312"
          - "cp313"
          - "cp314"
          - "cp314t"

    env:
      CYLP_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout CyLP v${{ env.CYLP_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: coin-or/CyLP
          ref: v${{ env.CYLP_VERSION }}
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074  # v4.2.0
        with:
          output-dir: wheelhouse/
          only: ${{ matrix.python }}-manylinux_riscv64
        env:
          CIBW_MANYLINUX_RISCV64_IMAGE: quay.io/pypa/manylinux_2_39_riscv64
          # Passed rather than set through CIBW_ENVIRONMENT, which would replace pyproject.toml's.
          CIBW_ENVIRONMENT_PASS_LINUX: PIP_EXTRA_INDEX_URL PIP_ONLY_BINARY
          PIP_EXTRA_INDEX_URL: https://pypi.riseproject.dev/simple/
          PIP_ONLY_BINARY: numpy,scipy
          # auditwheel vendors the coinbrew-built CoinUtils/Osi/Clp/Cgl/Cbc; ship their licences.
          CIBW_BEFORE_BUILD_LINUX: |
            for p in CoinUtils Osi Clp Cgl Cbc; do
              cp "$p/LICENSE" "LICENSE.$(echo "$p" | tr '[:upper:]' '[:lower:]')"
            done
          # Upstream sets test-requires but no test-command, so its own suite never runs there.
          CIBW_TEST_SOURCES: cylp/tests cylp/input
          CIBW_TEST_REQUIRES: pytest
          # Deselected tests fail identically with upstream's own x86_64 wheel: the Python pivot
          # tests segfault, the rest use np.float and the removed CyCbcModel.branchAndBound.
          CIBW_TEST_COMMAND: >-
            pytest cylp/tests
            -k "not (TestCyClpSimplex and (Dantzig or LIFO or MostFrequent or test_PE))
            and not TestQP
            and not (TestMIP and (NodeCompare or SetInt_CopyIn or isInt or (multiDim and not Cbc_solve)))
            and not scale_scale and not scale_unscale"

      - name: Check the wheel ships the extensions, the COIN-OR libraries and their licences
        run: |
          python3 - wheelhouse/*.whl <<'EOF'
          import sys, zipfile
          for whl in sys.argv[1:]:
              names = zipfile.ZipFile(whl).namelist()
              assert any(n.startswith("cylp/cy/CyClpSimplex.") and n.endswith(".so") for n in names), whl
              grafted = sorted(n.split("/", 1)[1].split("-")[0] for n in names
                               if n.startswith("cylp.libs/") and n != "cylp.libs/")
              assert grafted == ["libCbc", "libCbcSolver", "libCgl", "libClp", "libClpSolver",
                                 "libCoinUtils", "libOsi", "libOsiClp"], (whl, grafted)
              licences = {n.rsplit("/", 1)[1]
                          for n in names if ".dist-info/licenses/" in n} - {""}
              expected = {"LICENSE", "AUTHORS"} | {f"LICENSE.{p}" for p in (
                  "coinutils", "osi", "clp", "cgl", "cbc")}
              assert licences == expected, (whl, licences ^ expected)
              print(whl, "ok")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cylp-${{ env.CYLP_VERSION }}-${{ matrix.python }}-manylinux_riscv64
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish cylp ${{ matrix.version }}
    needs: [setup, build_wheels]
    if: needs.setup.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    uses: $/.github/workflows/_publish-wheel.yml
    secrets:
      app-private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
    with:
      artifact-pattern: cylp-${{ matrix.version }}-*-manylinux_riscv64
