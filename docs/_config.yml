title: RISE Python Wheels
description: riscv64 binary wheels for popular Python projects
remote_theme: just-the-docs/just-the-docs

url: https://pypi.riseproject.dev

plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true

# Sort the navigation menu case-insensitively so it matches the ordering of
# the "List of Supported Packages" page (e.g. aiohttp before MarkupSafe).
nav_sort: case_insensitive

# Callout styling: `{: .note }` blocks (comments) get a blue left bar,
# `{: .warning }` blocks get a red left bar.
callouts:
  note:
    color: blue
  warning:
    color: red

aux_links:
  "GitHub":
    - "https://github.com/riseproject-dev/python-wheels"

# The dashboard is a static file (no front matter, so Liquid never touches its
# AngularJS bindings) and therefore cannot carry nav_order. The theme pipes this
# through absolute_url, so a plain path also resolves correctly under a PR
# preview's baseurl. hide_icon because the target is on this same site.
nav_external_links:
  - title: Dashboard
    url: /dashboard/
    hide_icon: true

exclude:
  - packages/generate_packages_doc.py
  - packages/*.yaml

footer_content: "RISE Project"

logo: "/assets/images/riseproject-logo.svg"
