<style>
.version-selector {
  margin: 0.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.version-selector .version-select {
  padding: 0.25rem 2rem 0.25rem 0.5rem;
  font-size: 0.85rem;
  border: 1px solid #d1d5da;
  border-radius: 4px;
  background-color: #fff;
  cursor: pointer;
}

.version-panel {
  margin-bottom: 1rem;
}

/* Only hide panels once JS has taken over, so no-JS users see everything. */
.js-version-picker .version-panel[hidden] {
  display: none;
}
</style>

<script>
(function () {
  function initVersionPicker() {
    var select = document.getElementById("version-select");
    var panels = document.querySelectorAll(".version-panel");
    if (!select || !panels.length) {
      return;
    }

    document.body.classList.add("js-version-picker");

    function show(version) {
      panels.forEach(function (panel) {
        panel.hidden = panel.getAttribute("data-version") !== version;
      });
    }

    select.addEventListener("change", function () {
      show(select.value);
    });

    show(select.value);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initVersionPicker);
  } else {
    initVersionPicker();
  }
})();
</script>
