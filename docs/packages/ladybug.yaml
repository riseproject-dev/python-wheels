versions:
- version: 0.19.1
  patched: true
  comment: >-
    When the default 8TB buffer-manager reservation does not fit in the process address space
    (riscv64 Sv39 gives 256GB), the database falls back to the largest power-of-two region that
    does, which caps its maximum size accordingly. `INSTALL` looks for linux_riscv64 extension
    builds, which upstream does not publish, instead of downloading the x86-64 ones.
  tag: ladybug-v0.19.1-20260928135054
