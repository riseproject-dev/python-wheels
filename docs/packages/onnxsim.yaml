package-name: onnxsim
source-code: https://github.com/onnxsim/onnxsim
license: MIT AND (Apache-2.0 OR BSD-2-Clause)
warning: |
  onnxsim vendors onnx-optimizer as a git submodule, which in turn vendors
  onnx (MIT) as its own submodule; onnxsim links both, plus protobuf
  (BSD-3-Clause), statically. protobuf pulls in abseil-cpp (Apache-2.0) the
  same way onnx's own standalone build does (see docs/packages/onnx.yaml).
  Abseil ships no NOTICE file to propagate, and onnx-optimizer is
  Apache-2.0, so the wheel's own LICENSE already covers it. The Python
  extension is built with nanobind rather than pybind11; nanobind ships a
  single py3-none-any wheel with no compiled code of its own (it only
  emits code into the extension it builds), so it needs no riscv64-specific
  handling.
