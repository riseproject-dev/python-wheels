versions:
- version: 0.11.3
  patched: true
  comment: >-
    When the default 8TB buffer-manager reservation does not fit in the process address space
    (riscv64 Sv39 gives 256GB), the database falls back to the largest power-of-two region that
    does, which caps its maximum size accordingly.
