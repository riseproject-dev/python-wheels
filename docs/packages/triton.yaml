package-name: triton
source-code: https://github.com/RuyiAI-Stack/triton-riscv
license: MIT AND Apache-2.0 WITH LLVM-exception AND Apache-2.0
comment: 'Upstream triton-lang/triton is GPU-only with no riscv64 target (gotcha 41).
  This builds the RuyiAI-Stack/triton-riscv fork instead, which replaces the NVIDIA/AMD
  codegen with a CPU/riscv64 backend (triton-shared''s TTIR->Linalg lowering, then
  Buddy Compiler''s Linalg->LLVM-MLIR lowering, then LLVM `llc`), built against prebuilt
  riscv64 LLVM and buddy-mlir toolchains (no from-source LLVM build). The wheel bundles
  those toolchains'' `opt`, `llc`, and `buddy-*` binaries alongside Triton itself,
  hence the compound license: MIT (triton, triton-shared), Apache-2.0 WITH LLVM-exception
  (LLVM), Apache-2.0 (buddy-mlir).'
