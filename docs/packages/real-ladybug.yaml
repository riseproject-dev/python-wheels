package-name: real-ladybug
source-code: https://github.com/LadybugDB/ladybug
license: MIT
versions:
- version: 0.15.3
  patched: true
  comment: >-
    real_ladybug is an old tag of LadybugDB/ladybug, published under the PyPI name it used
    before upstream freed up `ladybug` for the current releases (already published by this
    repo, PR #2336). When the default 8TB buffer-manager reservation does not fit in the
    process address space (riscv64 Sv39 gives 256GB), the database falls back to the largest
    power-of-two region that does, which caps its maximum size accordingly. `INSTALL` looks for
    linux_riscv64 extension builds, which upstream does not publish, instead of downloading the
    x86-64 ones. v0.15.3 predates upstream's own precompiled-liblbug build-system split used by
    `ladybug`, so it is backported here to avoid a full ~800-file recompile per interpreter.
