license: Apache-2.0
warning: |
  onnxoptimizer vendors onnx and protobuf as git submodules and links both
  statically; protobuf (BSD-3-Clause) pulls in abseil-cpp (Apache-2.0) the
  same way onnx's own standalone build does (see docs/packages/onnx.yaml).
  Abseil ships no NOTICE file to propagate, and both onnxoptimizer and
  abseil are Apache-2.0, so the wheel's own LICENSE already covers it.
