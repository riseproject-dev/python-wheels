package-name: dbmate-bin
source-code: https://github.com/amacneil/dbmate
license: MIT
comment: >-
  amacneil/dbmate publishes no linux-riscv64 release binary, so the binary is built from the
  tagged source with upstream's own Makefile (cgo sqlite driver included) and packed with
  justin-yan/pybin's WheelPacker, patched to know riscv64. The riscv64 binary links glibc
  dynamically instead of statically like upstream's, so the wheel is tagged
  manylinux_2_39_riscv64 only, and it also ships dbmate's LICENSE.
versions:
- version: 2.36.0
