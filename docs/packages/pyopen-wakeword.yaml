package-name: pyopen-wakeword
source-code: https://github.com/rhasspy/pyopen-wakeword
license: Apache-2.0
comment: |
  Ships a prebuilt libtensorflowlite_c.so per platform (ctypes-loaded, no Python
  extension module; see https://github.com/tphakala/tflite_c, which upstream sources
  its binaries from). No riscv64 binary exists there, so this build compiles
  libtensorflowlite_c.so itself via Bazel from tensorflow/tensorflow v2.17.1 (the
  version upstream's own vendored binaries are built from) and bundles it in place
  of the download.
versions:
- version: 1.1.0
  python-versions: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
