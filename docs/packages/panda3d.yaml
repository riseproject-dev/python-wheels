package-name: panda3d
source-code: https://github.com/panda3d/panda3d
license: BSD-3-Clause
versions:
- version: 1.10.16
  patched: true
  comment: >-
    makepanda's own --wheel platform-tag detection only recognizes
    manylinux1/2010/2014/2_24/2_28 by checking for a specific glibc file that
    quay.io/pypa/manylinux_2_39_riscv64 (Rocky 10) doesn't have; the patch adds a
    branch keyed on the target arch instead. ODE physics and Cg shader support
    are dropped (no riscv64 package for either), matching how upstream's own
    Linux wheels already drop Bullet for the same reason.
