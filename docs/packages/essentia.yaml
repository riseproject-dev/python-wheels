- version: 2.1b6.dev1438
  patched: true
  comment: >-
    Built without Gaia (no GaiaTransform), as upstream's macOS wheels are: upstream's Linux
    Gaia build compiles Qt 5 from source. The static third-party libraries (FFTW, FFmpeg,
    LAME, TagLib, Chromaprint, libsamplerate, libyaml, zlib, Eigen) are built with upstream's
    own packaging scripts; the patches drop FFTW's x86-only SSE2 configure flags, refresh
    the stale config.guess/config.sub of the older autotools tarballs, and drop TagLib 1.11.1's
    cmake_policy(SET CMP0022 OLD) call, which CMake 4 rejects (backported from TagLib 1.12).
  tag: essentia-v2.1b6.dev1438-20261028170241
