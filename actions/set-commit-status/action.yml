name: 'Set commit status'
description: 'On workflow_dispatch, set a pending commit status before the job and success/failure/error after it.'

# This action is meaningful only for workflow_dispatch runs (e.g. builds kicked
# off by a `Trigger:` directive via pr-trigger.yml). On push / pull_request it
# is a no-op — the pre/main/post hooks self-gate on GITHUB_EVENT_NAME.
inputs:
  context:
    description: >-
      Status context label shown in the PR checks list. Must be unique per
      matrix leg: statuses on the same commit sharing a context overwrite each
      other, so a shared label would let one leg clobber another's result.
    required: true
  token:
    description: >-
      Token used to set the status (needs `statuses: write`). The post step
      also needs `actions: read` to read this run's job conclusions.
    required: false
    default: ${{ github.token }}
  sha:
    description: 'Commit to annotate. Defaults to GITHUB_SHA (tip of the dispatched ref).'
    required: false
  target-url:
    description: 'URL the status links to. Defaults to this workflow run.'
    required: false
  description:
    description: 'Short status description shown next to the check.'
    required: false

runs:
  using: 'node24'
  pre: 'dist/pre/index.js'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
